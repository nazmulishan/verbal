 different situation.","fun":"You can, however, roll an odd number and get a six on <span class=\"hl\">TWO<\/span> rolls of a die, but the events are independent here.","check":{"q":"You roll one six-sided die once. Which pair of events is mutually exclusive?","choices":["Rolling an even number and rolling a 4","Rolling a number less than 3 and rolling a 5","Rolling a prime number and rolling a 2","Rolling an odd number and rolling a 3"],"a":"B · Rolling a number less than 3 and rolling a 5","why":"A 5 is not less than 3, so no single roll can do both. In every other pair one number (4, 2 or 3) satisfies both events."}},"da-52":{"title":"Probability & Venn Diagrams","subj":"da","page":52,"group":16,"body":"<p>It's useful to think of probability as Venn Diagrams.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Mutually Exclusive<\/h4><p>(two separate circles)<\/p><p>No overlap whatsoever. The two events cannot both occur.<\/p><\/div><div class=\"ps-col\"><h4>Independent<\/h4><p>(two circles that partly overlap)<\/p><p>Partial overlap. They can both occur but they don't necessarily both have to.<\/p><\/div><div class=\"ps-col\"><h4>Complete Overlap<\/h4><p>(one circle inside the other)<\/p><p>Complete overlap. The \"inside\" event cannot occur without the other event also occurring.<\/p><\/div><\/div>","plain":"Picture each event as a circle. If the circles do not touch, the events can never happen together (mutually exclusive). If they partly overlap, both can happen but do not have to (independent). If one circle sits inside the other, the inside event can only happen when the outside one happens too. The GRE mostly uses the partly-overlapping picture.","fun":"The two circles can of course overlap in infinite ways, but the GRE only focuses on the independent events case.","check":{"q":"Event A = \"the die shows a 2\" and event B = \"the die shows an even number\" (one roll). Which Venn picture fits A and B?","choices":["Two separate circles (no overlap)","Two partly overlapping circles","A circle inside another circle (complete overlap)","No circles at all"],"a":"C · A circle inside another circle (complete overlap)","why":"Every time you roll a 2 you have also rolled an even number, so A cannot happen without B. That is the \"inside\" circle."},"fig":"<svg viewBox=\"0 0 600 180\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"100\" y=\"24\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">Mutually Exclusive<\/text><circle cx=\"56\" cy=\"100\" r=\"38\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2.5\"/><circle cx=\"144\" cy=\"100\" r=\"38\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2.5\"/><line x1=\"200\" y1=\"14\" x2=\"200\" y2=\"168\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><text x=\"300\" y=\"24\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">Independent<\/text><circle cx=\"270\" cy=\"100\" r=\"44\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2.5\"/><circle cx=\"330\" cy=\"100\" r=\"44\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2.5\"/><line x1=\"400\" y1=\"14\" x2=\"400\" y2=\"168\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><text x=\"500\" y=\"24\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">Complete Overlap<\/text><circle cx=\"500\" cy=\"100\" r=\"48\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2.5\"/><circle cx=\"500\" cy=\"100\" r=\"32\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2.5\"/><\/svg>"},"da-53":{"title":"A and B (Independent)","subj":"da","page":53,"group":16,"body":"<p><span class=\"hl\">Question:<\/span> What is the probability of rolling a prime number on a six-sided die, flipping a coin on heads, and randomly selecting a multiple of 3 from the first 15 positive integers?<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Die<\/h4><p>Faces 1, 2, 3, 4, 5, 6 (primes: 2, 3, 5)<\/p><\/div><div class=\"ps-col\"><h4>Coin<\/h4><p>Heads or tails<\/p><\/div><div class=\"ps-col\"><h4>1 to 15<\/h4><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><td>01<\/td><td>02<\/td><td><span class=\"ok\">03<\/span><\/td><td>04<\/td><td>05<\/td><\/tr><tr><td><span class=\"ok\">06<\/span><\/td><td>07<\/td><td>08<\/td><td><span class=\"ok\">09<\/span><\/td><td>10<\/td><\/tr><tr><td>11<\/td><td><span class=\"ok\">12<\/span><\/td><td>13<\/td><td>14<\/td><td><span class=\"ok\">15<\/span><\/td><\/tr><\/table><\/div><\/div><\/div><div class=\"ps-f\"><span class=\"fr\"><span>3<\/span><span>6<\/span><\/span> × <span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> × <span class=\"fr\"><span>5<\/span><span>15<\/span><\/span> = <span class=\"hl\"><span class=\"fr\"><span>1<\/span><span>12<\/span><\/span><\/span><\/div>","plain":"When events are independent and you want ALL of them to happen (the word \"and\"), multiply their probabilities. Here: 3 of the 6 die faces are prime, 1 of the 2 coin sides is heads, and 5 of the 15 numbers are multiples of 3. Multiply 3/6 × 1/2 × 5/15 to get 1/12.","fun":"The probability of flipping Heads on a coin ten times in a row is 1/1024. The 1024 comes from <span class=\"m\">2<sup>10<\/sup><\/span>.","check":{"q":"A coin is flipped and a six-sided die is rolled. What is the probability of getting tails AND a number greater than 4?","choices":["<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>12<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>6<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>3<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>5<\/span><span>6<\/span><\/span><\/span>"],"a":"B · <span class=\"m\"><span class=\"fr\"><span>1<\/span><span>6<\/span><\/span><\/span>","why":"Tails is <span class=\"m\"><span class=\"fr\"><span>1<\/span><span>2<\/span><\/span><\/span>; greater than 4 means 5 or 6, so <span class=\"m\"><span class=\"fr\"><span>2<\/span><span>6<\/span><\/span> = <span class=\"fr\"><span>1<\/span><span>3<\/span><\/span><\/span>. Multiply: <span class=\"m\"><span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> × <span class=\"fr\"><span>1<\/span><span>3<\/span><\/span> = <span class=\"fr\"><span>1<\/span><span>6<\/span><\/span><\/span>."}},"da-54":{"title":"A and B (Mutually Exclusive)","subj":"da","page":54,"group":16,"body":"<p><span class=\"hl\">IMPOSSIBLE<\/span><\/p><p>(Two separate circles with a dart between them.)<\/p><p>It's impossible to throw a dart in such a way that it lands in BOTH circles. Thus, the probability is zero.<\/p>","plain":"If two events are mutually exclusive, they can never happen together. So the probability of \"A and B\" is simply 0. There is nothing to calculate: no overlap means no chance.","fun":"The probability of event A and <span class=\"hl\">NOT<\/span> event A will always add up to 1.","check":{"q":"One card is drawn from a standard deck. What is the probability that it is both a heart AND a spade?","a":"<span class=\"m\">0<\/span>","why":"A single card has only one suit, so it cannot be a heart and a spade at once. The events are mutually exclusive, so the probability of both is zero."},"fig":"<svg viewBox=\"0 0 400 190\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"120\" cy=\"100\" r=\"72\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2.5\"/><circle cx=\"280\" cy=\"100\" r=\"72\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2.5\"/><text x=\"120\" y=\"106\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"20\">A<\/text><text x=\"280\" y=\"106\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"20\">B<\/text><text x=\"200\" y=\"20\" text-anchor=\"middle\" style=\"fill:var(--red)\" font-size=\"14\">no overlap → P(A and B) = 0<\/text><\/svg>"},"da-55":{"title":"A or B (Independent)","subj":"da","page":55,"group":16,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Formula<\/h4><div class=\"ps-f\">P(A) + P(B) − P(A and B)<\/div><p><span class=\"note\">↓<\/span><\/p><div class=\"ps-f\">A + B − both<\/div><\/div><div class=\"ps-col\"><h4>Why?<\/h4><p>(Venn diagram: circles A and B with the overlap shaded yellow.)<\/p><p>Notice that the yellow overlap part is being counted twice, once from the A circle and once from the B circle. We need to subtract out ONE of those. That's why you see \"− both.\"<\/p><\/div><\/div>","plain":"\"A or B\" means at least one of them happens. Add the two probabilities, then subtract the overlap (\"both\") once. You subtract because the overlap was counted inside A and again inside B. For independent events, \"both\" is P(A) × P(B).","fun":"If you want to remove the middle part completely, you would do <span class=\"m\">A + B − 2 × both<\/span>.","check":{"q":"P(A) = 0.5, P(B) = 0.4, and P(A and B) = 0.2. What is P(A or B)?","choices":["0.9","0.7","0.5","1.1","0.2"],"a":"B · 0.7","why":"A + B − both = 0.5 + 0.4 − 0.2 = 0.7."},"fig":"<svg viewBox=\"0 0 400 200\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M 200 39.1 A 80 80 0 0 1 200 160.9 A 80 80 0 0 1 200 39.1 Z\" style=\"fill:var(--amber-wash);stroke:var(--amber)\" stroke-width=\"1.5\"/><circle cx=\"148\" cy=\"100\" r=\"80\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2.5\"/><circle cx=\"252\" cy=\"100\" r=\"80\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2.5\"/><text x=\"120\" y=\"108\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"24\">A<\/text><text x=\"280\" y=\"108\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"24\">B<\/text><text x=\"200\" y=\"105\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">both<\/text><\/svg>"},"da-56":{"title":"A or B (Mutually Exclusive)","subj":"da","page":56,"group":16,"body":"<div class=\"ps-f\"><span class=\"hl\">EASY<\/span> → P(A) + P(B)<\/div><p>(Two separate circles A and B, each with a dart in it.)<\/p><p>We're happy with a dart in either circle, so we simply just add the two probabilities together.<\/p>","plain":"When two events cannot happen together, the chance that one OR the other happens is just the sum of their chances. There is no overlap, so nothing gets counted twice and nothing needs subtracting.","fun":"Two mutually exclusive events can never sum up to a value greater than 1.","check":{"q":"One six-sided die is rolled. What is the probability of rolling a 1 or a 6?","choices":["<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>36<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>6<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>3<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>2<\/span><\/span><\/span>"],"a":"C · <span class=\"m\"><span class=\"fr\"><span>1<\/span><span>3<\/span><\/span><\/span>","why":"One roll cannot be both 1 and 6, so just add: <span class=\"m\"><span class=\"fr\"><span>1<\/span><span>6<\/span><\/span> + <span class=\"fr\"><span>1<\/span><span>6<\/span><\/span> = <span class=\"fr\"><span>2<\/span><span>6<\/span><\/span> = <span class=\"fr\"><span>1<\/span><span>3<\/span><\/span><\/span>."},"fig":"<svg viewBox=\"0 0 400 190\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"120\" cy=\"100\" r=\"72\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2.5\"/><circle cx=\"280\" cy=\"100\" r=\"72\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2.5\"/><text x=\"120\" y=\"106\" text-anchor=\"middle\" style=\"fill:var(--blue)\" font-size=\"24\">A<\/text><text x=\"280\" y=\"106\" text-anchor=\"middle\" style=\"fill:var(--blue)\" font-size=\"24\">B<\/text><text x=\"200\" y=\"20\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">P(A or B) = P(A) + P(B)<\/text><\/svg>"},"da-57":{"title":"The Extremes of Probability","subj":"da","page":57,"group":16,"body":"<p><span class=\"hl\">Question:<\/span> The probability of <span class=\"m\">A<\/span> is 0.5. The probability of <span class=\"m\">B<\/span> is 0.4. What is the probability that <span class=\"hl\"><b>both<\/b><\/span> occur? What about <span class=\"m\">A<\/span> <span class=\"hl\"><b>or<\/b><\/span> <span class=\"m\">B<\/span>?<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>A and B<\/h4><p><span class=\"note\">Extreme 1: Mutually Exclusive<\/span> (two separate circles)<\/p><div class=\"ps-f\">= 0<\/div><p><span class=\"note\">Extreme 2: Complete Overlap<\/span> (one circle inside the other, dart in the inner circle)<\/p><div class=\"ps-f\">= 0.4<\/div><\/div><div class=\"ps-col\"><h4>A or B<\/h4><p><span class=\"note\">Extreme 1: Mutually Exclusive<\/span> (two separate circles)<\/p><div class=\"ps-f\">= 0.9<\/div><p><span class=\"note\">Extreme 2: Complete Overlap<\/span> (one circle inside the other)<\/p><div class=\"ps-f\">= 0.5<\/div><\/div><\/div>","plain":"If you only know P(A) and P(B), \"A and B\" and \"A or B\" are not fixed numbers; they live in a range. \"A and B\" is smallest (0) when the events never overlap and largest (the smaller probability, 0.4) when one sits inside the other. \"A or B\" is largest (0.5 + 0.4 = 0.9) with no overlap and smallest (the bigger probability, 0.5) with complete overlap. This is useful for GRE quantitative comparison questions.","fun":"All values between the two extremes are also possible. These are the partial overlap cases.","check":{"q":"P(A) = 0.6 and P(B) = 0.3. What is the greatest possible value of P(A or B)?","choices":["0.3","0.6","0.18","0.9","1"],"a":"D · 0.9","why":"\"A or B\" is largest when the events do not overlap (mutually exclusive): 0.6 + 0.3 = 0.9."},"fig":"<svg viewBox=\"0 0 620 300\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"150\" y=\"22\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"16\">A and B<\/text><text x=\"460\" y=\"22\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"16\">A or B<\/text><line x1=\"310\" y1=\"12\" x2=\"310\" y2=\"290\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><text x=\"16\" y=\"56\" style=\"fill:var(--red)\" font-size=\"12\">Extreme 1<\/text><text x=\"16\" y=\"72\" style=\"fill:var(--ink)\" font-size=\"11\">Mutually Exclusive<\/text><circle cx=\"80\" cy=\"120\" r=\"34\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><circle cx=\"160\" cy=\"120\" r=\"34\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><text x=\"210\" y=\"126\" style=\"fill:var(--ink)\" font-size=\"18\">= 0<\/text><text x=\"16\" y=\"186\" style=\"fill:var(--red)\" font-size=\"12\">Extreme 2<\/text><text x=\"16\" y=\"202\" style=\"fill:var(--ink)\" font-size=\"11\">Complete Overlap<\/text><circle cx=\"120\" cy=\"245\" r=\"40\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><circle cx=\"120\" cy=\"245\" r=\"24\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><text x=\"210\" y=\"251\" style=\"fill:var(--ink)\" font-size=\"18\">= 0.4<\/text><text x=\"326\" y=\"56\" style=\"fill:var(--red)\" font-size=\"12\">Extreme 1<\/text><text x=\"326\" y=\"72\" style=\"fill:var(--ink)\" font-size=\"11\">Mutually Exclusive<\/text><circle cx=\"390\" cy=\"120\" r=\"34\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><circle cx=\"470\" cy=\"120\" r=\"34\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><text x=\"520\" y=\"126\" style=\"fill:var(--ink)\" font-size=\"18\">= 0.9<\/text><text x=\"326\" y=\"186\" style=\"fill:var(--red)\" font-size=\"12\">Extreme 2<\/text><text x=\"326\" y=\"202\" style=\"fill:var(--ink)\" font-size=\"11\">Complete Overlap<\/text><circle cx=\"430\" cy=\"245\" r=\"40\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><circle cx=\"430\" cy=\"245\" r=\"24\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><text x=\"520\" y=\"251\" style=\"fill:var(--ink)\" font-size=\"18\">= 0.5<\/text><\/svg>"},"da-58":{"title":"Probability + Combinatorics","subj":"da","page":58,"group":16,"body":"<p>Some problems <span class=\"hl\">combine<\/span> the concepts of probability and combinatorics.<\/p><div class=\"ps-box\"><div class=\"ps-box-h\">Question<\/div><p>For a class field trip, a professor will select 4 seniors from a total of 10. What is the probability that best friends Bob and Bill are both selected?<\/p><\/div><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Calculate the number of groups of 4<\/h4><div class=\"ps-f\"><span class=\"fr\"><span>10!<\/span><span>4! 6!<\/span><\/span> = 210<\/div><\/div><div class=\"ps-col\"><h4>Calculate the number of ways Bob and Bill can be paired with two other people<\/h4><div class=\"ps-f\"><span class=\"fr\"><span>8!<\/span><span>2! 6!<\/span><\/span> = 28<\/div><\/div><div class=\"ps-col\"><h4>Finally, calculate the probability<\/h4><div class=\"ps-f\"><span class=\"fr\"><span>28<\/span><span>210<\/span><\/span> ≈ .13<\/div><\/div><\/div>","plain":"Probability = (number of groups you want) ÷ (total number of possible groups). Use combinations to count both. All groups of 4 from 10: 210. Groups that contain Bob and Bill: put them in, then choose the other 2 from the remaining 8, which is 28. So the probability is 28/210 ≈ 0.13.","fun":"Problems that combine probability and combinatorics can be tricky. Best to attack these problems piece-by-piece.","check":{"q":"A coach picks 3 players at random from 6 players, including Ana and Ben. What is the probability that both Ana and Ben are picked?","choices":["<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>20<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>10<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>5<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>3<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>2<\/span><\/span><\/span>"],"a":"C · <span class=\"m\"><span class=\"fr\"><span>1<\/span><span>5<\/span><\/span><\/span>","why":"All groups: <span class=\"m\"><span class=\"fr\"><span>6!<\/span><span>3! 3!<\/span><\/span> = 20<\/span>. With Ana and Ben in, choose 1 more from the other 4: 4 ways. Probability <span class=\"m\"><span class=\"fr\"><span>4<\/span><span>20<\/span><\/span> = <span class=\"fr\"><span>1<\/span><span>5<\/span><\/span><\/span>."}},"da-59":{"title":"Given Probability","subj":"da","page":59,"group":16,"body":"<p>For some problems, you have to assume some cases are <span class=\"hl\">given<\/span>, which means other cases have to be <i>excluded<\/i> from the calculation.<\/p><div class=\"ps-box\"><div class=\"ps-box-h\">Question<\/div><p>A couple has four children. If the couple has <b>at least two boys<\/b>, what is the probability the couple's four children are all boys?<\/p><\/div><div class=\"ps-cols\"><div class=\"ps-col\"><h4>List All Possibilities and Exclude ones that don't apply<\/h4><ul class=\"ps-list\"><li><s>GGGG<\/s> → <span class=\"note\">excluded<\/span><\/li><li><s>GGGB<\/s> → <span class=\"note\">excluded<\/span><\/li><li>GGBB<\/li><li>GBBB<\/li><li>BBBB<\/li><\/ul><\/div><div class=\"ps-col\"><h4>Calculate the number of ways the applicable cases can happen<\/h4><div class=\"ps-f\">GGBB &nbsp; <span class=\"fr\"><span>4!<\/span><span>2! 2!<\/span><\/span> = 6<\/div><div class=\"ps-f\">GBBB &nbsp; <span class=\"fr\"><span>4!<\/span><span>1! 3!<\/span><\/span> = 4<\/div><div class=\"ps-f\">BBBB &nbsp; <span class=\"fr\"><span>4!<\/span><span>0! 4!<\/span><\/span> = 1<\/div><\/div><div class=\"ps-col\"><h4>Finally, calculate the probability<\/h4><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><td>GGBB<\/td><td>6<\/td><\/tr><tr><td>GBBB<\/td><td>4<\/td><\/tr><tr><td><span class=\"hl\">BBBB<\/span><\/td><td>1<\/td><\/tr><\/table><\/div><div class=\"ps-f\"><span class=\"fr\"><span>1<\/span><span>11<\/span><\/span><\/div><\/div><\/div>","plain":"\"Given\" (or \"if\") means some outcomes are already ruled out, so you only count the outcomes still allowed. With at least two boys, the allowed orderings are 6 (two boys) + 4 (three boys) + 1 (four boys) = 11. Only 1 of those 11 is all boys, so the answer is 1/11.","fun":"It seems the GRE is starting to experiment more with \"given\" probability problems to make the test a bit harder.","check":{"q":"Three fair coins are tossed. Given that at least two of them land Heads, what is the probability that all three land Heads?","choices":["<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>8<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>4<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>3<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>2<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>3<\/span><span>4<\/span><\/span><\/span>"],"a":"B · <span class=\"m\"><span class=\"fr\"><span>1<\/span><span>4<\/span><\/span><\/span>","why":"Allowed outcomes: exactly two Heads <span class=\"m\"><span class=\"fr\"><span>3!<\/span><span>2! 1!<\/span><\/span> = 3<\/span> ways, plus HHH 1 way, so 4 in total. Only 1 is all Heads: <span class=\"m\"><span class=\"fr\"><span>1<\/span><span>4<\/span><\/span><\/span>."}},"da-60":{"title":"Expected Value","subj":"da","page":60,"group":16,"body":"<div class=\"ps-box\"><div class=\"ps-box-h\">Question<\/div><p>A random number generator can output only five values: 1, 2, 3, 4, and 5. However, the probability of each output is not equal (see below). What is the <b>expected value<\/b> of the output from the random generator?<\/p><\/div><div class=\"ps-cols\"><div class=\"ps-col\"><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><th>Random Number<\/th><th>Probability<\/th><\/tr><tr><td>1<\/td><td>0.60<\/td><\/tr><tr><td>2<\/td><td>0.25<\/td><\/tr><tr><td>3<\/td><td>0.10<\/td><\/tr><tr><td>4<\/td><td>0.04<\/td><\/tr><tr><td>5<\/td><td>0.01<\/td><\/tr><\/table><\/div><\/div><div class=\"ps-col\"><div class=\"ps-f\">1(.6) + 2(.25) + 3(.1) + 4(.04) + 5(.01)<\/div><div class=\"ps-f\">↓<\/div><div class=\"ps-f\">.6 + .5 + .3 + .16 + .05<\/div><div class=\"ps-f\">↓<\/div><div class=\"ps-f\">1.61<\/div><\/div><\/div>","plain":"The expected value is a weighted average: multiply each possible value by its probability, then add the results. Values that are more likely pull the answer toward them. Here 1 is very likely (0.60), so the expected value 1.61 is close to 1.","fun":"If the probability of each random number were the same, the expected value would simply be the average: 3.","check":{"q":"A game pays $0 with probability 0.5, $10 with probability 0.3, and $20 with probability 0.2. What is the expected payout?","choices":["$6","$7","$10","$15","$30"],"a":"B · $7","why":"0(0.5) + 10(0.3) + 20(0.2) = 0 + 3 + 4 = 7."}},"da-61":{"title":"At Least/Most Questions","subj":"da","page":61,"group":16,"body":"<p>In many problems, it's easier to find what you <span class=\"hl\">don't want<\/span> and <u>subtract from 1<\/u>.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Example 1<\/h4><div class=\"ps-box\"><p>A couple has five children. What is the probability they have <u>at least 1 girl<\/u>?<\/p><\/div><p class=\"ps-step\"><b>Step 1:<\/b> Calculate the probability of ALL BOYS<\/p><div class=\"ps-f\"><span class=\"hl\">(1/2)⁵ = 1/32<\/span><\/div><p class=\"ps-step\"><b>Step 2:<\/b> Subtract that value from 1.<\/p><div class=\"ps-f\"><span class=\"hl\">1 − <span class=\"fr\"><span>1<\/span><span>32<\/span><\/span><\/span> = <span class=\"ok\"><span class=\"fr\"><span>31<\/span><span>32<\/span><\/span><\/span><\/div><\/div><div class=\"ps-col\"><h4>Example 2<\/h4><div class=\"ps-box\"><p>The chance of rain on any given day is 0.2. What is the chance it rains <u>at most 4 days<\/u> in a five-day period?<\/p><\/div><p class=\"ps-step\"><b>Step 1:<\/b> Calculate the probability of ALL RAIN<\/p><div class=\"ps-f\"><span class=\"hl\">(0.2)⁵ = 0.00032<\/span><\/div><p class=\"ps-step\"><b>Step 2:<\/b> Subtract that value from 1.<\/p><div class=\"ps-f\"><span class=\"hl\">1 − .00032 = 0.99968<\/span><\/div><\/div><\/div>","plain":"\"At least one\" and \"at most\" questions usually have many cases you want and only one case you don't want. So work out the one unwanted case and subtract it from 1. \"At least 1 girl\" is everything except \"all boys\"; \"at most 4 rainy days\" (out of 5) is everything except \"all 5 days rain\".","fun":"Even if the problem in example 1 said <u>at least 2 girls<\/u>, it would still be faster to subtract out the cases you don't want.","check":{"q":"Three fair coins are tossed. What is the probability of getting at least one Heads?","choices":["<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>8<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>3<\/span><span>8<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>2<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>7<\/span><span>8<\/span><\/span><\/span>"],"a":"D · <span class=\"m\"><span class=\"fr\"><span>7<\/span><span>8<\/span><\/span><\/span>","why":"The only case you don't want is all Tails: <span class=\"m\">(<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span>)³ = <span class=\"fr\"><span>1<\/span><span>8<\/span><\/span><\/span>. Then <span class=\"m\">1 − <span class=\"fr\"><span>1<\/span><span>8<\/span><\/span> = <span class=\"fr\"><span>7<\/span><span>8<\/span><\/span><\/span>."}},"da-62":{"title":"Random Variable","subj":"da","page":62,"group":17,"body":"<p class=\"ps-def\"><b>Random Variable:<\/b> a variable whose value is a numerical outcome of a random experiment (<i>ETS Math Review Guide<\/i>).<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Set of Data<\/h4><p>Example: Test Scores<\/p><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><td>30<\/td><td>36<\/td><td>41<\/td><td>46<\/td><td>46<\/td><\/tr><tr><td>66<\/td><td>73<\/td><td>74<\/td><td>80<\/td><td>80<\/td><\/tr><tr><td>84<\/td><td>87<\/td><td>90<\/td><td>92<\/td><td>95<\/td><\/tr><tr><td>96<\/td><td>96<\/td><td>99<\/td><td>99<\/td><td>99<\/td><\/tr><\/table><\/div><\/div><div class=\"ps-col\"><p><span class=\"hl\">Random variable <span class=\"m\">X<\/span><\/span> would simply be used to represent a randomly chosen value from the data on the left.<\/p><div class=\"ps-f\">X = random value from here<\/div><\/div><\/div>","plain":"A random variable is just a letter (usually X) that stands for a number picked at random. For a list of test scores, X means \"one score chosen at random from the list\". Then questions like \"what is the probability X equals 99?\" mean \"what fraction of the list is 99?\"","fun":"A random variable can easily represent a set of data that is <i>not<\/i> random.","check":{"q":"A random variable <span class=\"m\">X<\/span> represents a value chosen at random from the data 2, 4, 4, 7, 9. What is the probability that <span class=\"m\">X<\/span> = 4?","choices":["<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>5<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>2<\/span><span>5<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>2<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>4<\/span><span>5<\/span><\/span><\/span>"],"a":"B · <span class=\"m\"><span class=\"fr\"><span>2<\/span><span>5<\/span><\/span><\/span>","why":"Two of the five values are 4, so the probability is <span class=\"m\"><span class=\"fr\"><span>2<\/span><span>5<\/span><\/span><\/span>."}},"da-63":{"title":"Relative Frequency","subj":"da","page":63,"group":17,"body":"<p class=\"ps-def\"><b>Relative Frequency:<\/b> a concept that refers to how common (or uncommon) a value in a dataset is <span class=\"hl\"><i>relative to<\/i><\/span> other values in the dataset.<\/p><p>Imagine an <b>unfair<\/b> die<\/p><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><th>Face<\/th><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><td>6<\/td><\/tr><tr><th>occurs … of the time<\/th><td><span class=\"hl\">10%<\/span><\/td><td><span class=\"hl\">12%<\/span><\/td><td><span class=\"hl\">15%<\/span><\/td><td><span class=\"hl\">18%<\/span><\/td><td><span class=\"hl\">20%<\/span><\/td><td><span class=\"hl\">25%<\/span><\/td><\/tr><\/table><\/div>","plain":"Relative frequency tells you what share (percent or fraction) of the time a value shows up, compared with all the values. On this unfair die, 6 comes up 25% of the time while 1 comes up only 10% of the time. All the relative frequencies together always add up to 100%, which is 1.","fun":"Notice that the relative frequency values (the percentages above) sum to 1.","check":{"q":"A spinner lands on red 40% of the time and on blue 35% of the time. The only other color is green. What is the relative frequency of green?","choices":["15%","25%","35%","60%","75%"],"a":"B · 25%","why":"Relative frequencies add up to 100%: 100% − 40% − 35% = 25%."}},"da-64":{"title":"Histograms","subj":"da","page":64,"group":17,"body":"<p><span class=\"hl\">Histograms<\/span> can be used to exhibit relative frequencies.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><p>(Histogram: Relative Frequency Distribution — Relative Frequency, 0% to 30%, against Number of Children, 0 to 5.)<\/p><p><span class=\"note\">ETS Math Review Guide<\/span><\/p><\/div><div class=\"ps-col\"><ul class=\"ps-list\"><li>Families with <span class=\"hl\">0 children<\/span> comprise <span class=\"hl\">12%<\/span> of the data.<\/li><li>Families with <span class=\"hl\">1 child<\/span> comprise <span class=\"hl\">20%<\/span> of the data.<\/li><li>Families with <span class=\"hl\">2 children<\/span> comprise <span class=\"hl\">28%<\/span> of the data.<\/li><li>Families with <span class=\"hl\">3 children<\/span> comprise <span class=\"hl\">24%<\/span> of the data.<\/li><li>Families with <span class=\"hl\">4 children<\/span> comprise <span class=\"hl\">12%<\/span> of the data.<\/li><li>Families with <span class=\"hl\">5 children<\/span> comprise <span class=\"hl\">4%<\/span> of the data.<\/li><\/ul><\/div><\/div>","plain":"A relative frequency histogram is a bar chart where the height of each bar is the percent of the data with that value. Read the bar height off the left axis: the bar over 2 reaches 28%, so 28% of families have 2 children. To get a count, multiply the percent by the total number of data points.","fun":"The <span class=\"m\">y<\/span>-axis of the histogram (showing percentages) can also be written in the form of probabilities.","check":{"q":"In a survey of 50 families, a relative frequency histogram shows: 0 children 10%, 1 child 30%, 2 children 40%, 3 children 20%. How many of the families have 2 children?","choices":["4","10","15","20","40"],"a":"D · 20","why":"40% of 50 = 0.40 × 50 = 20 families."},"fig":"<svg viewBox=\"0 0 580 280\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"310\" y=\"24\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">Relative Frequency Distribution<\/text><line x1=\"66\" y1=\"220\" x2=\"550\" y2=\"220\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"0.75\"/><text x=\"62\" y=\"224\" text-anchor=\"end\" style=\"fill:var(--ink)\" font-size=\"12\">0%<\/text><line x1=\"66\" y1=\"190\" x2=\"550\" y2=\"190\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"0.75\"/><text x=\"62\" y=\"194\" text-anchor=\"end\" style=\"fill:var(--ink)\" font-size=\"12\">5%<\/text><line x1=\"66\" y1=\"160\" x2=\"550\" y2=\"160\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"0.75\"/><text x=\"62\" y=\"164\" text-anchor=\"end\" style=\"fill:var(--ink)\" font-size=\"12\">10%<\/text><line x1=\"66\" y1=\"130\" x2=\"550\" y2=\"130\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"0.75\"/><text x=\"62\" y=\"134\" text-anchor=\"end\" style=\"fill:var(--ink)\" font-size=\"12\">15%<\/text><line x1=\"66\" y1=\"100\" x2=\"550\" y2=\"100\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"0.75\"/><text x=\"62\" y=\"104\" text-anchor=\"end\" style=\"fill:var(--ink)\" font-size=\"12\">20%<\/text><line x1=\"66\" y1=\"70\" x2=\"550\" y2=\"70\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"0.75\"/><text x=\"62\" y=\"74\" text-anchor=\"end\" style=\"fill:var(--ink)\" font-size=\"12\">25%<\/text><line x1=\"66\" y1=\"40\" x2=\"550\" y2=\"40\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"0.75\"/><text x=\"62\" y=\"44\" text-anchor=\"end\" style=\"fill:var(--ink)\" font-size=\"12\">30%<\/text><rect x=\"70\" y=\"148\" width=\"80\" height=\"72\" style=\"fill:var(--blue-wash);stroke:var(--ink)\" stroke-width=\"1.5\"/><text x=\"110\" y=\"238\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">0<\/text><rect x=\"150\" y=\"100\" width=\"80\" height=\"120\" style=\"fill:var(--blue-wash);stroke:var(--ink)\" stroke-width=\"1.5\"/><text x=\"190\" y=\"238\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">1<\/text><rect x=\"230\" y=\"52\" width=\"80\" height=\"168\" style=\"fill:var(--blue-wash);stroke:var(--ink)\" stroke-width=\"1.5\"/><text x=\"270\" y=\"238\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">2<\/text><rect x=\"310\" y=\"76\" width=\"80\" height=\"144\" style=\"fill:var(--blue-wash);stroke:var(--ink)\" stroke-width=\"1.5\"/><text x=\"350\" y=\"238\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">3<\/text><rect x=\"390\" y=\"148\" width=\"80\" height=\"72\" style=\"fill:var(--blue-wash);stroke:var(--ink)\" stroke-width=\"1.5\"/><text x=\"430\" y=\"238\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">4<\/text><rect x=\"470\" y=\"196\" width=\"80\" height=\"24\" style=\"fill:var(--blue-wash);stroke:var(--ink)\" stroke-width=\"1.5\"/><text x=\"510\" y=\"238\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">5<\/text><line x1=\"70\" y1=\"220\" x2=\"550\" y2=\"220\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.5\"/><line x1=\"70\" y1=\"40\" x2=\"70\" y2=\"220\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.5\"/><text x=\"310\" y=\"262\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">Number of Children<\/text><text x=\"20\" y=\"130\" text-anchor=\"middle\" transform=\"rotate(-90 20 130)\" style=\"fill:var(--ink)\" font-size=\"13\">Relative Frequency<\/text><\/svg>"},"da-65":{"title":"Probability Distribution Table","subj":"da","page":65,"group":17,"body":"<p><span class=\"hl\">Tables<\/span> can also be used to exhibit relative frequencies.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><th><span class=\"m\">X<\/span><\/th><th><span class=\"m\">P(X)<\/span><\/th><\/tr><tr><td>0<\/td><td>0.12<\/td><\/tr><tr><td>1<\/td><td>0.20<\/td><\/tr><tr><td>2<\/td><td>0.28<\/td><\/tr><tr><td>3<\/td><td>0.24<\/td><\/tr><tr><td>4<\/td><td>0.12<\/td><\/tr><tr><td>5<\/td><td>0.04<\/td><\/tr><\/table><\/div><p><span class=\"note\">ETS Math Review Guide<\/span><\/p><\/div><div class=\"ps-col\"><ul class=\"ps-list\"><li>The value <span class=\"hl\">0<\/span> comprises <span class=\"hl\">12%<\/span> of the data.<\/li><li>The value <span class=\"hl\">1<\/span> comprises <span class=\"hl\">20%<\/span> of the data.<\/li><li>The value <span class=\"hl\">2<\/span> comprises <span class=\"hl\">28%<\/span> of the data.<\/li><li>The value <span class=\"hl\">3<\/span> comprises <span class=\"hl\">24%<\/span> of the data.<\/li><li>The value <span class=\"hl\">4<\/span> comprises <span class=\"hl\">12%<\/span> of the data.<\/li><li>The value <span class=\"hl\">5<\/span> comprises <span class=\"hl\">4%<\/span> of the data.<\/li><\/ul><\/div><\/div>","plain":"A probability distribution table lists each value X can take and its probability P(X). P(X) is the relative frequency written as a decimal: 0.28 means 28% of the data. The P(X) column always adds up to 1, which helps you find a missing entry.","fun":"As you can see, this is just another way to represent the data that was illustrated in the histogram in the previous slide.","check":{"q":"A probability distribution table shows <span class=\"m\">P(X = 1) = 0.3<\/span>, <span class=\"m\">P(X = 2) = 0.5<\/span>, and <span class=\"m\">X<\/span> can only be 1, 2 or 3. What is <span class=\"m\">P(X = 3)<\/span>?","choices":["0.1","0.2","0.3","0.8","1.3"],"a":"B · 0.2","why":"All the probabilities add to 1: 1 − 0.3 − 0.5 = 0.2."}},"da-66":{"title":"Random Variable Mean","subj":"da","page":66,"group":17,"body":"<p class=\"ps-def\"><b>Random Variable Mean:<\/b> also known as the <b>expected value<\/b> (see group 16)<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><th><span class=\"m\">Y<\/span><\/th><th><span class=\"m\">P(Y)<\/span><\/th><\/tr><tr><td>10<\/td><td>0.05<\/td><\/tr><tr><td>15<\/td><td>0.20<\/td><\/tr><tr><td>20<\/td><td>0.40<\/td><\/tr><tr><td>25<\/td><td>0.00<\/td><\/tr><tr><td>30<\/td><td>0.35<\/td><\/tr><\/table><\/div><\/div><div class=\"ps-col\"><h4>Calculating Random Variable Mean<\/h4><div class=\"ps-f\">10(.05) + 15(.20) + 20(.40) + 25(0) + 30(.35)<\/div><div class=\"ps-f\">↓<\/div><div class=\"ps-f\">.5 + 3 + 8 + 0 + 10.5<\/div><div class=\"ps-f\">↓<\/div><div class=\"ps-f\">22<\/div><\/div><\/div>","plain":"The mean of a random variable is the same thing as its expected value. Multiply each value by its probability and add everything up. A value with probability 0 (like 25 here) adds nothing.","fun":"Notice that <i>weighted average, expected value, and random variable mean<\/i> are all essentially the same thing.","check":{"q":"A random variable <span class=\"m\">Y<\/span> equals 0 with probability 0.2, 5 with probability 0.5, and 10 with probability 0.3. What is the mean of <span class=\"m\">Y<\/span>?","choices":["5","5.5","6","6.5","15"],"a":"B · 5.5","why":"0(0.2) + 5(0.5) + 10(0.3) = 0 + 2.5 + 3 = 5.5."}},"da-67":{"title":"Uniform Distribution","subj":"da","page":67,"group":17,"body":"<p>In a <span class=\"hl\">uniform distribution<\/span>, the probability is distributed <span class=\"hl\">evenly<\/span> over all possible outcomes.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Consider a <u>fair<\/u> die<\/h4><p>Each face 1, 2, 3, 4, 5, 6 has probability <span class=\"hl\">1/6<\/span>.<\/p><\/div><div class=\"ps-col\"><h4>Relative Frequency Table<\/h4><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><th><span class=\"m\">Y<\/span><\/th><th><span class=\"m\">P(Y)<\/span><\/th><\/tr><tr><td>1<\/td><td>1/6<\/td><\/tr><tr><td>2<\/td><td>1/6<\/td><\/tr><tr><td>3<\/td><td>1/6<\/td><\/tr><tr><td>4<\/td><td>1/6<\/td><\/tr><tr><td>5<\/td><td>1/6<\/td><\/tr><tr><td>6<\/td><td>1/6<\/td><\/tr><\/table><\/div><\/div><\/div>","plain":"A distribution is uniform when every possible outcome is equally likely. With n equally likely outcomes, each one has probability 1/n. A fair die has 6 outcomes, so each has probability 1/6.","fun":"In a uniform distribution, the histogram would be completely flat.","check":{"q":"A fair spinner has 8 equal sections numbered 1 to 8, so its outcomes follow a uniform distribution. What is the probability of landing on 3?","choices":["<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>3<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>3<\/span><span>8<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>8<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>6<\/span><\/span><\/span>"],"a":"C · <span class=\"m\"><span class=\"fr\"><span>1<\/span><span>8<\/span><\/span><\/span>","why":"In a uniform distribution all 8 outcomes share the probability evenly, so each has probability <span class=\"m\"><span class=\"fr\"><span>1<\/span><span>8<\/span><\/span><\/span>."}},"da-68":{"title":"Skewness","subj":"da","page":68,"group":17,"body":"<p>Distributions can be skewed \"<b>left<\/b>\" (negative skew) or \"<span class=\"hl\">right<\/span>\" (positive skew).<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Negative Skew<\/h4><p>(Hump on the right, long thin tail stretching to the left.)<\/p><p><span class=\"note\">Tail to the left<\/span><\/p><\/div><div class=\"ps-col\"><h4>Positive Skew<\/h4><p>(Hump on the left, long thin tail stretching to the right.)<\/p><p><span class=\"note\">Tail to the right<\/span><\/p><\/div><\/div>","plain":"Skew is named after the long, thin tail, not after the big hump. If the tail stretches out to the left, the distribution is skewed left (negative skew). If the tail stretches out to the right, it is skewed right (positive skew).","fun":"The words \"left\" and \"right\" come not from the big hump in the distribution but rather the tail.","check":{"q":"Most houses on a street sell for around $300,000, but a few mansions sell for over $2,000,000, making a long tail on the high side of the graph. How is this distribution skewed?","choices":["Skewed left (negative skew)","Skewed right (positive skew)","Not skewed (uniform)","Skewed toward the hump"],"a":"B · Skewed right (positive skew)","why":"The few very large prices make a long tail stretching to the right (toward bigger numbers), and skew is named after the tail."},"fig":"<svg viewBox=\"0 0 620 230\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"30\" y1=\"186\" x2=\"30\" y2=\"36\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"2\"/><polygon points=\"30,26 25,38 35,38\" style=\"fill:var(--ink)\"/><line x1=\"24\" y1=\"180\" x2=\"286\" y2=\"180\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"2\"/><polygon points=\"296,180 284,175 284,185\" style=\"fill:var(--ink)\"/><path d=\"M 40 176 C 110 172 160 120 200 80 C 225 55 245 50 255 70 C 265 95 270 150 280 176\" fill=\"none\" style=\"stroke:var(--red)\" stroke-width=\"2.5\"/><text x=\"46\" y=\"100\" style=\"fill:var(--red)\" font-size=\"14\">Tail to<\/text><text x=\"46\" y=\"118\" style=\"fill:var(--red)\" font-size=\"14\">the left<\/text><line x1=\"66\" y1=\"124\" x2=\"76\" y2=\"164\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1\"/><text x=\"155\" y=\"214\" text-anchor=\"middle\" style=\"fill:var(--blue)\" font-size=\"16\">Negative Skew<\/text><line x1=\"310\" y1=\"20\" x2=\"310\" y2=\"222\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><line x1=\"330\" y1=\"186\" x2=\"330\" y2=\"36\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"2\"/><polygon points=\"330,26 325,38 335,38\" style=\"fill:var(--ink)\"/><line x1=\"324\" y1=\"180\" x2=\"590\" y2=\"180\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"2\"/><polygon points=\"600,180 588,175 588,185\" style=\"fill:var(--ink)\"/><path d=\"M 340 176 C 350 150 355 95 365 70 C 375 50 395 55 420 80 C 460 120 510 172 580 176\" fill=\"none\" style=\"stroke:var(--red)\" stroke-width=\"2.5\"/><text x=\"596\" y=\"100\" text-anchor=\"end\" style=\"fill:var(--red)\" font-size=\"14\">Tail to<\/text><text x=\"596\" y=\"118\" text-anchor=\"end\" style=\"fill:var(--red)\" font-size=\"14\">the right<\/text><line x1=\"552\" y1=\"124\" x2=\"545\" y2=\"166\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1\"/><text x=\"460\" y=\"214\" text-anchor=\"middle\" style=\"fill:var(--blue)\" font-size=\"16\">Positive Skew<\/text><\/svg>"},"da-69":{"title":"Average Follows the Tail","subj":"da","page":69,"group":17,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Positive Skew<\/h4><p>(Hump on the left, tail to the right. From left to right: Mode, Median, Mean.)<\/p><p><span class=\"note\">mean &gt; median<\/span><\/p><\/div><div class=\"ps-col\"><h4>Symmetrical Distribution<\/h4><p>(Mean, Median and Mode all at the centre.)<\/p><p><span class=\"note\">mean = median<\/span><\/p><\/div><div class=\"ps-col\"><h4>Negative Skew<\/h4><p>(Hump on the right, tail to the left. From left to right: Mean, Median, Mode.)<\/p><p><span class=\"note\">median &gt; mean<\/span><\/p><\/div><\/div>","plain":"The mean (average) gets pulled toward the long tail, because the few extreme values in the tail drag it along. The median is less affected, and the mode sits at the top of the hump. So a tail to the right means mean &gt; median, a tail to the left means median &gt; mean, and a symmetrical shape means mean = median.","fun":"The relationship between mean and median in the distributions above can allow you to solve problems very quickly.","check":{"q":"A distribution is skewed left (its long tail points toward the smaller values). Which must be true?","choices":["The mean is greater than the median","The median is greater than the mean","The mean equals the median","The mean equals the mode"],"a":"B · The median is greater than the mean","why":"The average follows the tail. A left tail pulls the mean down toward the small values, so it ends up below the median."},"fig":"<svg viewBox=\"0 0 620 250\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"10\" y1=\"190\" x2=\"200\" y2=\"190\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.5\"/><path d=\"M 14 190 C 35 140 55 92 75 90 C 95 88 105 120 120 140 C 145 170 170 186 196 190\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"2.5\"/><line x1=\"76\" y1=\"190\" x2=\"76\" y2=\"90\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1\"/><line x1=\"88\" y1=\"190\" x2=\"88\" y2=\"62\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1\"/><line x1=\"100\" y1=\"190\" x2=\"100\" y2=\"84\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1\" stroke-dasharray=\"5 4\"/><text x=\"88\" y=\"54\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">Median<\/text><text x=\"70\" y=\"78\" text-anchor=\"end\" style=\"fill:var(--ink)\" font-size=\"13\">Mode<\/text><text x=\"105\" y=\"78\" text-anchor=\"start\" style=\"fill:var(--ink)\" font-size=\"13\">Mean<\/text><text x=\"105\" y=\"212\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">Positive Skew<\/text><text x=\"105\" y=\"236\" text-anchor=\"middle\" style= nts","why":"A line segment stops at both ends (two endpoints). Here one end goes on forever, so the figure is a ray (the “combination” of a segment and a line from the fun fact), not a segment."},"fig":"<svg viewBox=\"0 0 560 250\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"280\" y=\"30\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">Line Segment<\/text><line x1=\"80\" y1=\"50\" x2=\"480\" y2=\"50\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><circle cx=\"80\" cy=\"50\" r=\"3.5\" style=\"fill:var(--blue)\"/><circle cx=\"480\" cy=\"50\" r=\"3.5\" style=\"fill:var(--blue)\"/><line x1=\"72\" y1=\"58\" x2=\"54\" y2=\"76\" fill=\"none\" style=\"stroke:var(--red)\" stroke-width=\"1.5\"/><polyline points=\"56.5,68.6 54,76 61.4,73.5\" fill=\"none\" style=\"stroke:var(--red);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"46\" y=\"96\" text-anchor=\"middle\" style=\"fill:var(--red)\" font-size=\"14\">endpoint<\/text><line x1=\"488\" y1=\"58\" x2=\"506\" y2=\"76\" fill=\"none\" style=\"stroke:var(--red)\" stroke-width=\"1.5\"/><polyline points=\"498.6,73.5 506,76 503.5,68.6\" fill=\"none\" style=\"stroke:var(--red);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"514\" y=\"96\" text-anchor=\"middle\" style=\"fill:var(--red)\" font-size=\"14\">endpoint<\/text><text x=\"280\" y=\"128\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">Congruent Line Segments<\/text><line x1=\"80\" y1=\"152\" x2=\"480\" y2=\"152\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><circle cx=\"80\" cy=\"152\" r=\"3.5\" style=\"fill:var(--blue)\"/><circle cx=\"480\" cy=\"152\" r=\"3.5\" style=\"fill:var(--blue)\"/><line x1=\"180\" y1=\"142\" x2=\"180\" y2=\"162\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><line x1=\"280\" y1=\"142\" x2=\"280\" y2=\"162\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><line x1=\"380\" y1=\"142\" x2=\"380\" y2=\"162\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"280\" y=\"196\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">Line<\/text><line x1=\"82\" y1=\"222\" x2=\"478\" y2=\"222\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><polyline points=\"469,226.5 478,222 469,217.5\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"91,217.5 82,222 91,226.5\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><\/svg>"},"geo-2":{"title":"Angles","subj":"geo","page":2,"group":9,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Acute<\/h4><div class=\"ps-f\">&lt; 90°<\/div><\/div><div class=\"ps-col\"><h4>Right<\/h4><div class=\"ps-f\">= 90°<\/div><p><span class=\"note\">The small square denotes right angle<\/span><\/p><\/div><div class=\"ps-col\"><h4>Obtuse<\/h4><div class=\"ps-f\">&gt; 90° but &lt; 180°<\/div><\/div><\/div><p>A straight line (an angle that opens all the way flat):<\/p><div class=\"ps-f\">= 180°<\/div>","plain":"Angles are named by size. Less than 90° is <b>acute<\/b>; exactly 90° is a <b>right<\/b> angle (drawn with a little square in the corner); between 90° and 180° is <b>obtuse<\/b>. A straight line is 180°.","fun":"Both “acute” and “obtuse” have other meanings in English. Look them up! They’re quite interesting.","check":{"q":"An angle measures 135°. What kind of angle is it?","choices":["Acute","Right","Obtuse","Straight"],"a":"C · Obtuse","why":"135° is more than 90° but less than 180°, so it is obtuse."},"fig":"<svg viewBox=\"0 0 600 265\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"30\" y1=\"130\" x2=\"175\" y2=\"130\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><polyline points=\"166,134.5 175,130 166,125.5\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"30\" y1=\"130\" x2=\"153.6\" y2=
