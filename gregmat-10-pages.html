fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"460\" y1=\"130\" x2=\"408\" y2=\"30\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><polyline points=\"416.1,35.9 408,30 408.2,40.1\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"510\" y=\"162\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">Obtuse<\/text><text x=\"510\" y=\"184\" text-anchor=\"middle\" style=\"fill:var(--blue)\" font-size=\"15\">&gt; 90° but &lt; 180°<\/text><line x1=\"122\" y1=\"222\" x2=\"478\" y2=\"222\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><polyline points=\"469,226.5 478,222 469,217.5\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"131,217.5 122,222 131,226.5\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><path d=\"M285 222 A15 15 0 0 1 315 222\" fill=\"none\" style=\"stroke:var(--ink-3);fill:none\" stroke-width=\"1.5\"/><text x=\"300\" y=\"250\" text-anchor=\"middle\" style=\"fill:var(--blue)\" font-size=\"15\">= 180°<\/text><\/svg>"},"geo-3":{"title":"Parallel Lines and Angles","subj":"geo","page":3,"group":9,"body":"<div class=\"ps-f\">l || K<\/div><p><span class=\"note\">↓ This means line l and k are parallel<\/span><\/p><p>A third line crosses both parallel lines. At each crossing the four angles are 110°, 70°, 70°, 110° (top-left, top-right, bottom-left, bottom-right), and the pattern is the same at both crossings.<\/p><ul class=\"ps-list\"><li><span class=\"note\">Notice which angles are equal<\/span><\/li><li><span class=\"note\">Notice which angles sum to <span class=\"hl\">180°<\/span><\/span><\/li><\/ul>","plain":"When a line cuts across two parallel lines, only two angle sizes appear: a big one and a small one. Big angles are all equal, small angles are all equal, and one big + one small = 180°. So on the GRE, knowing one angle tells you all eight.","fun":"To fill in all eight of the angles above, you need ONLY one to begin with. You can then fill in the other seven.","check":{"q":"Two parallel lines are cut by a third line. One of the eight angles formed is 65°. What is the size of each of the other angles?","a":"Each is either 65° or 115°","why":"The small angles all equal 65°. Each big angle pairs with a small one to make 180°, so it is 180° − 65° = 115°."},"fig":"<svg viewBox=\"0 0 560 320\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"110\" y1=\"40\" x2=\"470\" y2=\"112\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><polyline points=\"460.3,114.6 470,112 462.1,105.8\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"119.7,37.4 110,40 117.9,46.2\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"100\" y1=\"190\" x2=\"460\" y2=\"262\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><polyline points=\"450.3,264.6 460,262 452.1,255.8\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"109.7,187.4 100,190 107.9,196.2\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"270\" y1=\"300\" x2=\"430\" y2=\"30\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><polyline points=\"429.3,40 430,30 421.5,35.4\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"270.7,290 270,300 278.5,294.6\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"92\" y=\"46\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"17\">l<\/text><text x=\"82\" y=\"196\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"17\">k<\/text><text x=\"379.4\" y=\"75.6\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">110°<\/text><text x=\"416.4\" y=\"89.8\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">70°<\/text><text x=\"365.2\" y=\"112.6\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">70°<\/text><text x=\"402.2\" y=\"126.7\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">110°<\/text><text x=\"298.9\" y=\"211.5\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">110°<\/text><text x=\"335.8\" y=\"225.7\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">70°<\/text><text x=\"284.7\" y=\"248.5\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">70°<\/text><text x=\"321.7\" y=\"262.6\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">110°<\/text><\/svg>"},"geo-4":{"title":"Polygons","subj":"geo","page":4,"group":9,"body":"<p class=\"ps-def\"><b>Polygon:<\/b> A closed figure formed by three or more line segments in the same plane<\/p><p><b>Examples:<\/b> Triangle, Quadrilateral, Pentagon, Octagon<\/p>","plain":"A polygon is a flat, closed shape made only of straight sides, at least three of them. The name tells you the number of sides: triangle 3, quadrilateral 4, pentagon 5, octagon 8.","fun":"A polygon with many sides, say 100 or more, starts to look increasingly like a circle.","check":{"q":"Which of these is NOT a polygon?","choices":["Triangle","Square","Circle","Hexagon"],"a":"C · Circle","why":"A polygon is made of straight line segments. A circle is curved, so it is not a polygon."},"fig":"<svg viewBox=\"0 0 600 175\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"20,130 120,130 72,30\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"70\" y=\"158\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">Triangle<\/text><polygon points=\"185,30 275,30 255,130 165,130\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"220\" y=\"158\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">Quadrilateral<\/text><polygon points=\"375,31 426.4,68.3 406.7,128.7 343.3,128.7 323.6,68.3\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"375\" y=\"158\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">Pentagon<\/text><polygon points=\"541.9,34 570,62.1 570,101.9 541.9,130 502.1,130 474,101.9 474,62.1 502.1,34\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"522\" y=\"158\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">Octagon<\/text><\/svg>"},"geo-5":{"title":"Degrees of a Triangle","subj":"geo","page":5,"group":9,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Rule 1<\/h4><p>Angles <span class=\"m\">a°<\/span>, <span class=\"m\">b°<\/span>, <span class=\"m\">c°<\/span> inside the triangle:<\/p><div class=\"ps-f\">a + b + c = 180<\/div><\/div><div class=\"ps-col\"><h4>Rule 2<\/h4><p>The base is extended past angle <span class=\"m\">a°<\/span>, making the outside angle <span class=\"m\">d°<\/span>:<\/p><div class=\"ps-f\">d = c + b<\/div><\/div><div class=\"ps-col\"><h4>Rule 3<\/h4><p>Same picture:<\/p><div class=\"ps-f\">d &gt; c, b<\/div><\/div><\/div>","plain":"The three angles inside any triangle always add to 180°. If you extend one side, the outside angle (<span class=\"m\">d<\/span>) equals the two inside angles that are far away from it added together, so it is bigger than each of them.","fun":"Rule #2 above is sometimes called the “Exterior Angle Theorem.”","check":{"q":"In a triangle, two angles are 40° and 75°. One side is extended at the third corner. What is the outside (exterior) angle there?","a":"115°","why":"The exterior angle equals the sum of the two far inside angles: 40° + 75° = 115°. (Check: third angle = 180 − 115 = 65°, and 65° + 115° = 180°.)"},"fig":"<svg viewBox=\"0 0 600 210\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"100\" y=\"22\" text-anchor=\"middle\" style=\"fill:var(--blue)\" font-size=\"15\">Rule 1<\/text><polygon points=\"45,150 185,150 100,42\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"101\" y=\"72\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">c°<\/text><text x=\"66\" y=\"142\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">a°<\/text><text x=\"158\" y=\"142\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">b°<\/text><text x=\"100\" y=\"188\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--blue)\" font-size=\"16\">a + b + c = 180<\/text><text x=\"300\" y=\"22\" text-anchor=\"middle\" style=\"fill:var(--blue)\" font-size=\"15\">Rule 2<\/text><polygon points=\"245,150 385,150 300,42\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"205\" y1=\"150\" x2=\"245\" y2=\"150\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><text x=\"232\" y=\"142\" text-anchor=\"end\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">d°<\/text><text x=\"301\" y=\"72\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">c°<\/text><text x=\"266\" y=\"142\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">a°<\/text><text x=\"358\" y=\"142\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">b°<\/text><text x=\"300\" y=\"188\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--blue)\" font-size=\"16\">d = c + b<\/text><text x=\"500\" y=\"22\" text-anchor=\"middle\" style=\"fill:var(--blue)\" font-size=\"15\">Rule 3<\/text><polygon points=\"445,150 585,150 500,42\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"405\" y1=\"150\" x2=\"445\" y2=\"150\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><text x=\"432\" y=\"142\" text-anchor=\"end\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">d°<\/text><text x=\"501\" y=\"72\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">c°<\/text><text x=\"466\" y=\"142\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">a°<\/text><text x=\"558\" y=\"142\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">b°<\/text><text x=\"500\" y=\"188\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--blue)\" font-size=\"16\">d &gt; c, b<\/text><line x1=\"200\" y1=\"30\" x2=\"200\" y2=\"200\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><line x1=\"400\" y1=\"30\" x2=\"400\" y2=\"200\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><\/svg>"},"geo-6":{"title":"Sum of Interior Angles","subj":"geo","page":6,"group":9,"body":"<p class=\"ps-def\"><b>ProTip:<\/b> To find the sum of a polygon’s interior angles, imagine how many triangles it has.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Pentagon Example<\/h4><p>Draw lines from one corner: <span class=\"hl\">Three Triangles<\/span>.<\/p><div class=\"ps-f\">3 × 180° = 540°<\/div><\/div><div class=\"ps-col\"><h4>General Formula<\/h4><div class=\"ps-f\">(n − 2)180°<\/div><p><span class=\"note\">In a polygon of n sides, you can draw (n−2) triangles<\/span><\/p><\/div><\/div>","plain":"Pick one corner of a polygon and draw lines to the other corners: you cut it into triangles. A shape with <span class=\"m\">n<\/span> sides gives <span class=\"m\">n − 2<\/span> triangles, and each triangle holds 180°. So all the inside angles add up to <span class=\"m\">(n − 2) × 180°<\/span>.","fun":"As the number of sides of a polygon increases, the sum of the interior angles approaches infinity.","check":{"q":"What is the sum of the interior angles of a hexagon (6 sides)?","choices":["540°","600°","720°","900°","1080°"],"a":"C · 720°","why":"(6 − 2) × 180° = 4 × 180° = 720°."},"fig":"<svg viewBox=\"0 0 320 225\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"160,26 247.5,89.6 214.1,192.4 105.9,192.4 72.5,89.6\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"72.5\" y1=\"89.6\" x2=\"247.5\" y2=\"89.6\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><line x1=\"72.5\" y1=\"89.6\" x2=\"214.1\" y2=\"192.4\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><text x=\"160\" y=\"74.4\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"17\">1<\/text><text x=\"186\" y=\"129.9\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"17\">2<\/text><text x=\"124.8\" y=\"168.1\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"17\">3<\/text><\/svg>"},"geo-7":{"title":"Sum of Exterior Angles","subj":"geo","page":7,"group":9,"body":"<div class=\"ps-f\"><span class=\"hl\">360°<\/span><\/div><p><b>every<\/b> polygon<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Triangle<\/h4><p>Each side is extended to make one outside angle at each corner: <span class=\"m\">a°<\/span>, <span class=\"m\">b°<\/span>, <span class=\"m\">c°<\/span>.<\/p><div class=\"ps-f\">a + b + c = 360<\/div><\/div><div class=\"ps-col\"><h4>Quadrilateral<\/h4><p>One outside angle at each corner: <span class=\"m\">a°<\/span>, <span class=\"m\">b°<\/span>, <span class=\"m\">c°<\/span>, <span class=\"m\">d°<\/span>.<\/p><div class=\"ps-f\">a + b + c + d = 360<\/div><\/div><\/div>","plain":"An exterior angle is the angle outside a corner, made by extending one side. If you take one exterior angle at each corner, they always add up to 360°, no matter how many sides the polygon has.","fun":"To envision why this happens, imagine each vertex meets at a single point and they are the spokes of a “wheel.”","check":{"q":"A pentagon has one exterior angle drawn at each corner. Four of them are 70°, 80°, 60° and 90°. What is the fifth?","a":"60°","why":"All exterior angles add to 360°. 70 + 80 + 60 + 90 = 300, so the fifth is 360 − 300 = 60°."},"fig":"<svg viewBox=\"0 0 620 270\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"150,42 70,200 270,200\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"150\" y1=\"42\" x2=\"161.7\" y2=\"18.8\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><line x1=\"70\" y1=\"200\" x2=\"32\" y2=\"200\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><line x1=\"270\" y1=\"200\" x2=\"288.1\" y2=\"223.9\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><text x=\"162\" y=\"50\" text-anchor=\"start\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">a°<\/text><text x=\"64\" y=\"192\" text-anchor=\"end\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">b°<\/text><text x=\"260\" y=\"220\" text-anchor=\"end\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">c°<\/text><polygon points=\"430,70 580,70 555,198 405,198\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"430\" y1=\"70\" x2=\"395\" y2=\"70\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><line x1=\"580\" y1=\"70\" x2=\"585\" y2=\"44.5\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><line x1=\"555\" y1=\"198\" x2=\"592\" y2=\"198\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><line x1=\"405\" y1=\"198\" x2=\"400\" y2=\"223.5\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><text x=\"421\" y=\"92\" text-anchor=\"end\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">a°<\/text><text x=\"576\" y=\"60\" text-anchor=\"end\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">d°<\/text><text x=\"562\" y=\"190\" text-anchor=\"start\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">c°<\/text><text x=\"410\" y=\"218\" text-anchor=\"start\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">b°<\/text><text x=\"170\" y=\"254\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--blue)\" font-size=\"16\">a + b + c = 360<\/text><text x=\"490\" y=\"254\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--blue)\" font-size=\"16\">a + b + c + d = 360<\/text><\/svg>"},"geo-8":{"title":"Angles of Regular Polygon","subj":"geo","page":8,"group":9,"body":"<p class=\"ps-def\"><b><span class=\"hl\">Regular<\/span> Polygon:<\/b> All sides are congruent (equal) and all angles are as well.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Each Interior Angle<\/h4><div class=\"ps-f\"><span class=\"fr\"><span>(n − 2)180<\/span><span>n<\/span><\/span><\/div><\/div><div class=\"ps-col\"><h4>Each Exterior Angle<\/h4><div class=\"ps-f\"><span class=\"fr\"><span>360<\/span><span>n<\/span><\/span><\/div><\/div><\/div>","plain":"In a <b>regular<\/b> polygon every side is the same length and every angle is the same size. So take the total and share it equally among the <span class=\"m\">n<\/span> corners: inside angles share <span class=\"m\">(n − 2)180<\/span>, outside angles share 360.","fun":"You can also find each interior angle with the formula <span class=\"m\">180 − 360/n<\/span>.","check":{"q":"What is the measure of each interior angle of a regular octagon (8 sides)?","choices":["108°","120°","135°","140°","144°"],"a":"C · 135°","why":"(8 − 2) × 180 ÷ 8 = 1080 ÷ 8 = 135°. (Check: each exterior angle is 360 ÷ 8 = 45°, and 180 − 45 = 135°.)"}},"geo-9":{"title":"Types of Triangles","subj":"geo","page":9,"group":9,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Right<\/h4><p>One angle is <span class=\"m\">90°<\/span> (marked with a small square).<\/p><\/div><div class=\"ps-col\"><h4>Equilateral<\/h4><p>All three sides are <span class=\"m\">x<\/span>; all three angles are <span class=\"m\">60°<\/span>.<\/p><\/div><div class=\"ps-col\"><h4>Isosceles<\/h4><p>Two sides are <span class=\"m\">x<\/span>; the two angles at the base are both <span class=\"m\">a°<\/span>.<\/p><\/div><\/div>","plain":"A <b>right<\/b> triangle has one 90° corner. An <b>equilateral<\/b> triangle has three equal sides, so each angle is 60°. An <b>isosceles<\/b> triangle has two equal sides, and the two angles across from those sides are equal too.","fun":"A “scalene” triangle is one in which all three side lengths are different (and thus all three angles are different).","check":{"q":"An isosceles triangle has a top angle of 40° between its two equal sides. What is each of the other two angles?","choices":["40°","50°","70°","80°","140°"],"a":"C · 70°","why":"The two base angles are equal and the three angles add to 180°: (180 − 40) ÷ 2 = 140 ÷ 2 = 70°."},"fig":"<svg viewBox=\"0 0 600 240\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"40,180 40,40 190,180\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"50,180 50,170 40,170\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"54\" y=\"166\" text-anchor=\"start\" style=\"fill:var(--ink)\" font-size=\"14\">90°<\/text><polygon points=\"225,180 375,180 300,50.1\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"300\" y=\"84.6\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">60°<\/text><text x=\"248.4\" y=\"171.1\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">60°<\/text><text x=\"351.6\" y=\"171.1\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">60°<\/text><text x=\"251.2\" y=\"114.1\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"16\">x<\/text><text x=\"348.8\" y=\"114.1\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"16\">x<\/text><text x=\"300\" y=\"199.6\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"16\">x<\/text><polygon points=\"455,180 545,180 500,40\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"465.1\" y=\"111.6\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"16\">x<\/text><text x=\"534.9\" y=\"111.6\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"16\">x<\/text><text x=\"474.4\" y=\"170.4\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"13\">a°<\/text><text x=\"525.6\" y=\"170.4\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"13\">a°<\/text><text x=\"115\" y=\"226\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">Right<\/text><text x=\"300\" y=\"226\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">Equilateral<\/text><text x=\"500\" y=\"226\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">Isosceles<\/text><\/svg>"},"geo-10":{"title":"Angle vs Side Length","subj":"geo","page":10,"group":9,"body":"<p class=\"ps-def\"><b>ProTip:<\/b> To determine the relationship between the sides, look to the angle <span class=\"hl\">opposite<\/span> the side.<\/p><p>Triangle with angles 60° (top), 70° (bottom left) and 50° (bottom right). Side <span class=\"m\">x<\/span> is opposite 50°, side <span class=\"m\">y<\/span> is opposite 70°, side <span class=\"m\">z<\/span> is opposite 60°.<\/p><div class=\"ps-f\">y &gt; z &gt; x<\/div><p><span class=\"note\">If an angle is twice as big as another angle, is its opposite side twice as long?<\/span><\/p><p><span class=\"hl\"><b>NO!<\/b><\/span><\/p>","plain":"In a triangle, the biggest angle sits across from the longest side, and the smallest angle sits across from the shortest side. To compare two sides, compare the angles facing them. But be careful: double the angle does NOT mean double the side.","fun":"A “scalene” triangle is one in which all three side lengths are different (and thus all three angles are different).","check":{"q":"In triangle PQR, angle P = 30°, angle Q = 65° and angle R = 85°. Which side is the longest?","choices":["QR (opposite P)","PR (opposite Q)","PQ (opposite R)","They are all equal"],"a":"C · PQ (opposite R)","why":"The longest side faces the largest angle. The largest angle is R = 85°, and the side across from R is PQ."},"fig":"<svg viewBox=\"0 0 560 290\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"40,250 280,250 112.6,50.5\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"119.6\" y=\"95.1\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">60°<\/text><text x=\"67.9\" y=\"235.7\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">70°<\/text><text x=\"247.4\" y=\"240\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">50°<\/text><text x=\"62.2\" y=\"151.1\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"17\">x<\/text><text x=\"207.8\" y=\"146.6\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"17\">y<\/text><text x=\"160\" y=\"271.9\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"17\">z<\/text><text x=\"440\" y=\"160\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--blue)\" font-size=\"22\">y &gt; z &gt; x<\/text><line x1=\"126.8\" y1=\"110.4\" x2=\"156.7\" y2=\"236\" fill=\"none\" style=\"stroke:var(--red)\" stroke-width=\"1.5\"/><polyline points=\"151.7,230 156.7,236 158.5,228.4\" fill=\"none\" style=\"stroke:var(--red);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><line x1=\"86.9\" y1=\"220.1\" x2=\"185.4\" y2=\"157.2\" fill=\"none\" style=\"stroke:var(--red)\" stroke-width=\"1.5\"/><polyline points=\"181.3,164 185.4,157.2 177.6,158\" fill=\"none\" style=\"stroke:var(--red);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><line x1=\"218.9\" y1=\"220.1\" x2=\"90.6\" y2=\"157.2\" fill=\"none\" style=\"stroke:var(--red)\" stroke-width=\"1.5\"/><polyline points=\"98.4,157.2 90.6,157.2 95.3,163.5\" fill=\"none\" style=\"stroke:var(--red);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><\/svg>"},"geo-11":{"title":"Sides of a Triangle","subj":"geo","page":11,"group":9,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Triangle Inequality Theorem<\/h4><p><span class=\"hl\">The sum of any two sides is greater than the third<\/span><\/p><div class=\"ps-f\">x + y &gt; z<\/div><div class=\"ps-f\">x + z &gt; y<\/div><div class=\"ps-f\">y + z &gt; x<\/div><\/div><div class=\"ps-col\"><h4>Visual Proof<\/h4><p>Clearly walking along the dotted path would be a longer route than the solid line path.<\/p><\/div><\/div>","plain":"Any two sides of a triangle, added together, must be longer than the third side. Think of it as a shortcut: going straight from one corner to another is always shorter than taking a detour through the third corner. On the GRE this tells you the possible range for a missing side.","fun":"This theorem was so obvious to ancient mathematicians that they commented even an ass (donkey) knew this.","check":{"q":"A triangle has two sides of length 4 and 9. Which of these could be the length of the third side?","choices":["4","5","9","13","14"],"a":"C · 9","why":"The third side must be more than 9 − 4 = 5 and less than 9 + 4 = 13. Only 9 fits (5 and 13 are not allowed because 4 + 5 = 9 and 4 + 9 = 13 are not greater than the other side)."},"fig":"<svg viewBox=\"0 0 560 260\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"40,220 240,220 140,48\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"77\" y=\"132.4\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"17\">x<\/text><text x=\"203\" y=\"132.4\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"17\">y<\/text><text x=\"140\" y=\"241.9\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"17\">z<\/text><line x1=\"330\" y1=\"20\" x2=\"330\" y2=\"245\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><line x1=\"390\" y1=\"40\" x2=\"480\" y2=\"236\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><line x1=\"390\" y1=\"40\" x2=\"402\" y2=\"140\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><line x1=\"402\" y1=\"140\" x2=\"480\" y2=\"236\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><circle cx=\"390\" cy=\"40\" r=\"3.5\" style=\"fill:var(--blue)\"/><circle cx=\"402\" cy=\"140\" r=\"3.5\" style=\"fill:var(--blue)\"/><circle cx=\"480\" cy=\"236\" r=\"3.5\" style=\"fill:var(--blue)\"/><\/svg>"},"geo-12":{"title":"Area of a Triangle","subj":"geo","page":12,"group":9,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>General Formula<\/h4><div class=\"ps-f\"><span class=\"fr\"><span>bh<\/span><span>2<\/span><\/span><\/div><p><span class=\"m\">b<\/span> = base, <span class=\"m\">h<\/span> = height (the dashed line from the top straight down to the base, at a right angle).<\/p><\/div><div class=\"ps-col\"><h4>Why?<\/h4><p>A triangle is half of a rectangle<\/p><p>A diagonal cuts the rectangle into Half 1 and Half 2.<\/p><\/div><\/div>","plain":"Area of a triangle = base × height ÷ 2. The height must be straight up and down from the base (it makes a right angle with the base), not a slanted side. It works because any triangle is exactly half of a rectangle.","fun":"With a given perimeter, the largest possible area of a triangle comes from an equilateral triangle.","check":{"q":"A triangle has a base of 10 and a height of 6. What is its area?","a":"30","why":"Area = bh/2 = (10 × 6) ÷ 2 = 60 ÷ 2 = 30."},"fig":"<svg viewBox=\"0 0 600 240\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"60,200 200,200 130,30\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"130\" y1=\"30\" x2=\"130\" y2=\"200\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><polyline points=\"140,200 140,190 130,190\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"140\" y=\"125\" text-anchor=\"start\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"18\">h<\/text><text x=\"130\" y=\"224\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"18\">b<\/text><line x1=\"300\" y1=\"20\" x2=\"300\" y2=\"230\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><rect x=\"340\" y=\"60\" width=\"230\" height=\"130\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\"/><line x1=\"340\" y1=\"60\" x2=\"570\" y2=\"190\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><text x=\"400\" y=\"168\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"18\">Half 1<\/text><text x=\"512\" y=\"102\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"18\">Half 2<\/text><\/svg>"},"geo-13":{"title":"Triangle Congruency I","subj":"geo","page":13,"group":9,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>SSS<\/h4><p>Both triangles have sides <span class=\"m\">x<\/span>, <span class=\"m\">y<\/span>, <span class=\"m\">z<\/span>.<\/p><p><span class=\"ok\">Congruent<\/span><\/p><\/div><div class=\"ps-col\"><h4>SAS<\/h4><p>Both have sides <span class=\"m\">x<\/span> and <span class=\"m\">y<\/span> with angle <span class=\"m\">a°<\/span> between them.<\/p><p><span class=\"ok\">Congruent<\/span><\/p><\/div><div class=\"ps-col\"><h4>AAA<\/h4><p>Both have angles <span class=\"m\">a°<\/span>, <span class=\"m\">b°<\/span>, <span class=\"m\">c°<\/span>.<\/p><p><span class=\"hl\">≠ Congruent<\/span><\/p><\/div><\/div>","plain":"“Congruent” means exactly the same size and shape. Two triangles are congruent if all three sides match (SSS), or if two sides and the angle between them match (SAS). Matching all three angles (AAA) is NOT enough: one triangle could be a bigger copy of the other.","fun":"Two triangles with the same three angles COULD be congruent, but they don’t have to be so.","check":{"q":"Two triangles both have angles of 50°, 60° and 70°. Must they be congruent?","choices":["Yes, always","No, one could be larger than the other","Only if both are isosceles","Only if both are right triangles"],"a":"B · No, one could be larger than the other","why":"Matching three angles is AAA, which does not prove congruence. The triangles have the same shape but can be different sizes."},"fig":"<svg viewBox=\"0 0 636 278\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"105\" y=\"24\" text-anchor=\"middle\" font-weight=\"bold\" style=\"fill:var(--blue)\" font-size=\"18\">SSS<\/text><polygon points=\"12,125 112,125 62,40\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"26.7\" y=\"81.7\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"15\">x<\/text><text x=\"97.3\" y=\"81.7\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"15\">y<\/text><text x=\"62\" y=\"144.2\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"15\">z<\/text><polygon points=\"100,221 200,221 150,136\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"114.7\" y=\"177.7\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"15\">x<\/text><text x=\"185.3\" y=\"177.7\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"15\">y<\/text><text x=\"150\" y=\"240.2\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"15\">z<\/text><text x=\"105\" y=\"262\" text-anchor=\"middle\" style=\"fill:var(--green)\" font-size=\"16\">Congruent<\/text><text x=\"317\" y=\"24\" text-anchor=\"middle\" font-weight=\"bold\" style=\"fill:var(--blue)\" font-size=\"18\">SAS<\/text><polygon points=\"224,125 324,125 274,40\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"238.7\" y=\"81.7\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"15\">x<\/text><text x=\"244.8\" y=\"117.6\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"13\">a°<\/text><text x=\"274\" y=\"144.2\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"15\">y<\/text><polygon points=\"312,221 412,221 362,136\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"326.7\" y=\"177.7\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"15\">x<\/text><text x=\"332.8\" y=\"213.6\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"13\">a°<\/text><text x=\"362\" y=\"240.2\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"15\">y<\/text><text x=\"317\" y=\"262\" text-anchor=\"middle\" style=\"fill:var(--green)\" font-size=\"16\">Congruent<\/text><text x=\"529\" y=\"24\" text-anchor=\"middle\" font-weight=\"bold\" style=\"fill:var(--blue)\" font-size=\"18\">AAA<\/text><polygon points=\"436,125 536,125 486,40\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"456.8\" y=\"117.6\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"13\">a°<\/text><text x=\"486\" y=\"70.5\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"13\">b°<\/text><text x=\"515.2\" y=\"117.6\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"13\">c°<\/text><polygon points=\"524,221 624,221 574,136\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"544.8\" y=\"213.6\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"13\">a°<\/text><text x=\"574\" y=\"166.6\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"13\">b°<\/text><text x=\"603.2\" y=\"213.6\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"13\">c°<\/text><text x=\"529\" y=\"262\" text-anchor=\"middle\" style=\"fill:var(--red)\" font-size=\"16\">≠ Congruent<\/text><line x1=\"212\" y1=\"12\" x2=\"212\" y2=\"270\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><line x1=\"424\" y1=\"12\" x2=\"424\" y2=\"270\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><\/svg>"},"geo-14":{"title":"Triangle Congruency II","subj":"geo","page":14,"group":9,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>ASA<\/h4><p>Both have angles <span class=\"m\">a°<\/span> and <span class=\"m\">b°<\/span> with side <span class=\"m\">x<\/span> between them.<\/p><p><span class=\"ok\">Congruent<\/span><\/p><\/div><div class=\"ps-col\"><h4>AAS<\/h4><p>Both have angles <span class=\"m\">a°<\/span> and <span class=\"m\">b°<\/span> and side <span class=\"m\">x<\/span> (not between them).<\/p><p><span class=\"ok\">Congruent<\/span><\/p><\/div><div class=\"ps-col\"><h4>SSA<\/h4><p>Both have sides <span class=\"m\">x<\/span> and <span class=\"m\">y<\/span> and angle <span class=\"m\">a°<\/span> (not between them).<\/p><p><span class=\"hl\">≠ Congruent<\/span><\/p><\/div><\/div>","plain":"Two angles plus one side always lock a triangle in place, whether the side is between the angles (ASA) or not (AAS). But two sides plus an angle that is NOT between them (SSA) can build two different triangles, so it does not prove congruence.","fun":"The last one (SSA) not being congruent is really challenging for people to realize. It’s a toughie.","check":{"q":"Which of these does NOT guarantee that two triangles are congruent?","choices":["SSS","SAS","ASA","AAS","SSA"],"a":"E · SSA","why":"With two sides and an angle that is not between them, the third side can swing to two different positions, so the triangles can differ."},"fig":"<svg viewBox=\"0 0 636 278\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"105\" y=\"24\" text-anchor=\"middle\" font-weight=\"bold\" style=\"fill:var(--blue)\" font-size=\"18\">ASA<\/text><polygon points=\"12,125 112,125 62,40\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"26.7\" y=\"81.7\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"15\">x<\/text><text x=\"62\" y=\"70.5\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"13\">b°<\/text><text x=\"32.8\" y=\"117.6\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"13\">a°<\/text><polygon points=\"100,221 200,221 150,136\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"114.7\" y=\"177.7\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"15\">x<\/text><text x=\"150\" y=\"166.6\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"13\">b°<\/text><text x=\"120.8\" y=\"213.6\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"13\">a°<\/text><text x=\"105\" y=\"262\" text-anchor=\"middle\" style=\"fill:var(--green)\" font-size=\"16\">Congruent<\/text><text x=\"317\" y=\"24\" text-anchor=\"middle\" font-weight=\"bold\" style=\"fill:var(--blue)\" font-size=\"18\">AAS<\/text><polygon points=\"224,125 324,125 274,40\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"274\" y=\"70.5\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"13\">b°<\/text><text x=\"244.8\" y=\"117.6\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"13\">a°<\/text><text x=\"274\" y=\"144.2\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"15\">x<\/text><polygon points=\"312,221 412,221 362,136\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"362\" y=\"166.6\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"13\">b°<\/text><text x=\"332.8\" y=\"213.6\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"13\">a°<\/text><text x=\"362\" y=\"240.2\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"15\">x<\/text><text x=\"317\" y=\"262\" text-anchor=\"middle\" style=\"fill:var(--green)\" font-size=\"16\">Congruent<\/text><text x=\"529\" y=\"24\" text-anchor=\"middle\" font-weight=\"bold\" style=\"fill:var(--blue)\" font-size=\"18\">SSA<\/text><polygon points=\"436,125 536,125 486,40\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"450.7\" y=\"81.7\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"15\">x<\/text><text x=\"515.2\" y=\"117.6\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"13\">a°<\/text><text x=\"486\" y=\"144.2\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"15\">y<\/text><polygon points=\"524,221 624,221 574,136\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"538.7\" y=\"177.7\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"15\">x<\/text><text x=\"603.2\" y=\"213.6\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"13\">a°<\/text><text x=\"574\" y=\"240.2\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"15\">y<\/text><text x=\"529\" y=\"262\" text-anchor=\"middle\" style=\"fill:var(--red)\" font-size=\"16\">≠ Congruent<\/text><line x1=\"212\" y1=\"12\" x2=\"212\" y2=\"270\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><line x1=\"424\" y1=\"12\" x2=\"424\" y2=\"270\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><\/svg>"},"geo-15":{"title":"Pythagorean Theorem","subj":"geo","page":15,"group":9,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>General Formula<\/h4><div class=\"ps-f\">x² + y² = z²<\/div><p>Right triangle: legs <span class=\"m\">x<\/span> and <span class=\"m\">y<\/span>, longest side (hypotenuse) <span class=\"m\">z<\/span>.<\/p><\/div><div class=\"ps-col\"><h4>What does it mean?<\/h4><p>Sum of square A and B equals Square C<\/p><\/div><\/div>","plain":"This works only for right triangles. Square the two shorter sides (the legs), add them, and you get the square of the longest side (the hypotenuse, across from the right angle). In pictures: the squares built on the two legs together have the same area as the square built on the hypotenuse.","fun":"The great mathematician Euclid proved this theorem over 2,000 years ago!","check":{"q":"A right triangle has legs of length 2 and 3. What is the length of the hypotenuse?","a":"√13","why":"2² + 3² = 4 + 9 = 13, so the hypotenuse is √13."},"fig":"<svg viewBox=\"0 0 600 285\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"40,230 240,230 40,100\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"50,230 50,220 40,220\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"26\" y=\"171.3\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"18\">y<\/text><text x=\"140\" y=\"252.3\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"18\">x<\/text><text x=\"148.2\" y=\"158.7\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"18\">z<\/text><line x1=\"300\" y1=\"15\" x2=\"300\" y2=\"270\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><polygon points=\"380,150 440,90 380,30 320,90\" fill=\"none\" style=\"stroke:var(--ink-3);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polygon points=\"440,90 500,150 560,90 500,30\" fill=\"none\" style=\"stroke:var(--ink-3);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polygon points=\"380,150 500,150 500,270 380,270\" fill=\"none\" style=\"stroke:var(--ink-3);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polygon points=\"380,150 500,150 440,90\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"433.6,96.4 440,102.7 446.4,96.4\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"380\" y=\"98\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"20\">A<\/text><text x=\"500\" y=\"98\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"20\">B<\/text><text x=\"440\" y=\"218\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"20\">C<\/text><\/svg>"},"geo-16":{"title":"Pythagorean Triplets","subj":"geo","page":16,"group":10,"body":"<p class=\"ps-def\"><b><span class=\"hl\">Definition<\/span>:<\/b> A right triangle where all three sides are integers.<\/p><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><th>Leg<\/th><th>Leg<\/th><th>Hypotenuse<\/th><\/tr><tr><td>3<\/td><td>4<\/td><td>5<\/td><\/tr><tr><td>6<\/td><td>8<\/td><td>10<\/td><\/tr><tr><td>9<\/td><td>12<\/td><td>15<\/td><\/tr><tr><td>12<\/td><td>16<\/td><td>20<\/td><\/tr><\/table><\/div><p>You can always find more Pythagorean triplets by multiplying each side by the same value<\/p><p><b>Some More Examples<\/b><\/p><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><th>Leg<\/th><th>Leg<\/th><th>Hypotenuse<\/th><\/tr><tr><td>5<\/td><td>12<\/td><td>13<\/td><\/tr><tr><td>8<\/td><td>15<\/td><td>17<\/td><\/tr><tr><td>7<\/td><td>24<\/td><td>25<\/td><\/tr><\/table><\/div>","plain":"Some right triangles have whole-number sides. Memorise the common ones (3-4-5, 5-12-13, 8-15-17, 7-24-25). Any multiple also works: 3-4-5 times 2 is 6-8-10. On the GRE, spotting a triplet saves you from doing the Pythagorean calculation.","fun":"Pythagorean triplets are infinite. In fact, there is a pretty straightforward formula that generates them.","check":{"q":"Which set of numbers can be the sides of a right triangle?","choices":["4, 5, 6","10, 24, 26","6, 9, 12","5, 10, 15"],"a":"B · 10, 24, 26","why":"10-24-26 is 5-12-13 multiplied by 2. Check: 10² + 24² = 100 + 576 = 676 = 26²."},"fig":"<svg viewBox=\"0 0 640 320\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"20\" y1=\"172\" x2=\"620\" y2=\"172\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><text x=\"40\" y=\"230\" text-anchor=\"start\" style=\"fill:var(--ink)\" font-size=\"14\">Some More<\/text><text x=\"40\" y=\"248\" text-anchor=\"start\" style=\"fill:var(--ink)\" font-size=\"14\">Examples<\/text><polygon points=\"40,120 130,120 40,52.5\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"48,120 48,112 40,112\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" st <text x=\"543\" y=\"82.2\" text-anchor=\"start\" style=\"fill:var(--ink)\" font-size=\"14\">20<\/text><polygon points=\"170,290 290,290 170,240\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"178,290 178,282 170,282\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"162\" y=\"270\" text-anchor=\"end\" style=\"fill:var(--ink)\" font-size=\"14\">5<\/text><text x=\"230\" y=\"308\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">12<\/text><text x=\"238\" y=\"261\" text-anchor=\"start\" style=\"fill:var(--ink)\" font-size=\"14\">13<\/text><polygon points=\"330,290 450,290 330,226\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"338,290 338,282 330,282\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"322\" y=\"263\" text-anchor=\"end\" style=\"fill:var(--ink)\" font-size=\"14\">8<\/text><text x=\"390\" y=\"308\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">15<\/text><text x=\"398\" y=\"254\" text-anchor=\"start\" style=\"fill:var(--ink)\" font-size=\"14\">17<\/text><polygon points=\"490,290 610,290 490,255\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"498,290 498,282 490,282\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"482\" y=\"277.5\" text-anchor=\"end\" style=\"fill:var(--ink)\" font-size=\"14\">7<\/text><text x=\"550\" y=\"308\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">24<\/text><text x=\"558\" y=\"268.5\" text-anchor=\"start\" style=\"fill:var(--ink)\" font-size=\"14\">25<\/text><\/svg>"},"geo-17":{"title":"30°-60°-90° Triangles","subj":"geo","page":17,"group":10,"body":"<p class=\"ps-def\"><b><span class=\"hl\">30-60-90<\/span>:<\/b> Right triangles with a set ratio between their sides.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>The triangle<\/h4><p>Side opposite 30°: <span class=\"m\">x<\/span>. Side opposite 60°: <span class=\"m\">√3x<\/span>. Hypotenuse: <span class=\"m\">2x<\/span>.<\/p><div class=\"ps-f\">x : √3x : 2x<\/div><p><span class=\"note\">Memorize these side ratios!!!<\/span><\/p><\/div><div class=\"ps-col\"><h4>Confirmation the Ratios are Correct<\/h4><div class=\"ps-f\">(x)² + (√3x)² = hypotenuse²<\/div><div class=\"ps-f\">x² + 3x² = 4x²<\/div><div class=\"ps-f\">hypotenuse = 2x<\/div><\/div><\/div><div class=\"ps-ex\"><div class=\"ps-ex-h\">An Example<\/div><p>A 30-60-90 triangle with sides 7, <span class=\"m\">7√3<\/span> and 14 (the 30° angle is opposite the side 7).<\/p><\/div>","plain":"Every right triangle with angles 30°, 60°, 90° has the same side pattern. Call the shortest side (across from 30°) <span class=\"m\">x<\/span>. Then the side across from 60° is <span class=\"m\">√3<\/span> times that, and the hypotenuse is double it. Know one side and you know them all.","fun":"You can use the branch of mathematics known as “trigonometry” to find the side lengths or angles of any triangle.","check":{"q":"In a 30°-60°-90° triangle the hypotenuse is 10. How long is the side opposite the 60° angle?","choices":["5","5√2","5√3","10√3","20"],"a":"C · 5√3","why":"Hypotenuse = 2x = 10, so x = 5 (opposite 30°). The side opposite 60° is √3x = 5√3."},"fig":"<svg viewBox=\"0 0 620 260\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"50,215 249.2,215 50,100\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"60,215 60,205 50,205\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"67\" y=\"134.7\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">60°<\/text><text x=\"200.9\" y=\"207.3\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">30°<\/text><text x=\"34\" y=\"163.1\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"16\">x<\/text><text x=\"149.6\" y=\"237.6\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"16\">√3x<\/text><text x=\"157.6\" y=\"149.2\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"16\">2x<\/text><line x1=\"330\" y1=\"20\" x2=\"330\" y2=\"250\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><text x=\"380\" y=\"70\" text-anchor=\"start\" style=\"fill:var(--ink)\" font-size=\"16\">An Example<\/text><polygon points=\"395,215 502.4,215 395,153\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"403,215 403,207 395,207\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"463.8\" y=\"208.8\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">30°<\/text><text x=\"382\" y=\"188.9\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">7<\/text><text x=\"448.7\" y=\"234.9\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">7√3<\/text><text x=\"457.2\" y=\"174.2\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">14<\/text><\/svg>"},"geo-18":{"title":"45°-45°-90° Triangles","subj":"geo","page":18,"group":10,"body":"<p class=\"ps-def\"><b><span class=\"hl\">45-45-90<\/span>:<\/b> Right triangles with a set ratio between their sides.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>The triangle<\/h4><p>Both legs: <span class=\"m\">x<\/span>. Hypotenuse: <span class=\"m\">√2x<\/span>.<\/p><div class=\"ps-f\">x : x : √2x<\/div><p><span class=\"note\">Memorize these side ratios!!!<\/span><\/p><\/div><div class=\"ps-col\"><h4>Confirmation the Ratios are Correct<\/h4><div class=\"ps-f\">(x)² + (x)² = hypotenuse²<\/div><div class=\"ps-f\">x² + x² = 2x²<\/div><div class=\"ps-f\">hypotenuse = √2x<\/div><\/div><\/div><div class=\"ps-ex\"><div class=\"ps-ex-h\">An Example<\/div><p>A 45-45-90 triangle with legs 5 and 5 and hypotenuse <span class=\"m\">5√2<\/span>.<\/p><\/div>","plain":"A 45°-45°-90° triangle has two equal legs. If each leg is <span class=\"m\">x<\/span>, the hypotenuse is <span class=\"m\">x<\/span> times <span class=\"m\">√2<\/span>. Going backwards, divide the hypotenuse by <span class=\"m\">√2<\/span> to get a leg.","fun":"If you divide a square with a diagonal, you will create two 45-45-90 triangles.","check":{"q":"A 45°-45°-90° triangle has a hypotenuse of 7√2. How long is each leg?","a":"7","why":"The hypotenuse is √2x. If √2x = 7√2, then x = 7."},"fig":"<svg viewBox=\"0 0 620 260\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"50,215 165,215 50,100\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"60,215 60,205 50,205\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"69.9\" y=\"153.3\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">45°<\/text><text x=\"118.8\" y=\"201.1\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">45°<\/text><text x=\"34\" y=\"163.1\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"16\">x<\/text><text x=\"107.5\" y=\"237.6\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"16\">x<\/text><text x=\"118.8\" y=\"151.8\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"16\">√2x<\/text><line x1=\"330\" y1=\"20\" x2=\"330\" y2=\"250\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><text x=\"380\" y=\"70\" text-anchor=\"start\" style=\"fill:var(--ink)\" font-size=\"16\">An Example<\/text><polygon points=\"395,215 457,215 395,153\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"403,215 403,207 395,207\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"429.3\" y=\"207.7\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">45°<\/text><text x=\"382\" y=\"188.9\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">5<\/text><text x=\"426\" y=\"234.9\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">5<\/text><text x=\"438\" y=\"176.9\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">5√2<\/text><\/svg>"},"geo-19":{"title":"Equilateral Triangle Area","subj":"geo","page":19,"group":10,"body":"<p>An equilateral triangle with every side 6.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Standard Formula<\/h4><div class=\"ps-f\"><span class=\"fr\"><span>√3<\/span><span>4<\/span><\/span> a²<\/div><p><span class=\"m\">a<\/span> = side length<\/p><\/div><div class=\"ps-col\"><h4>Easier Way<\/h4><div class=\"ps-f\">half × half × √3<\/div><div class=\"ps-f\">3 × 3 × √3 = 9√3<\/div><\/div><\/div>","plain":"For a triangle with all sides equal to <span class=\"m\">a<\/span>, the area is <span class=\"m\">√3/4 × a²<\/span>. The quick way: take half the side, square it, then multiply by <span class=\"m\">√3<\/span>. For side 6, half is 3, so the area is <span class=\"m\">3 × 3 × √3 = 9√3<\/span>.","fun":"The formula for the area of an equilateral triangle comes from dividing it into two 30-60-90 triangles.","check":{"q":"What is the area of an equilateral triangle with side length 4?","choices":["2√3","4","4√3","8√3","16√3"],"a":"C · 4√3","why":"Half of 4 is 2, so the area is 2 × 2 × √3 = 4√3. (Same as √3/4 × 4² = √3/4 × 16 = 4√3.)"},"fig":"<svg viewBox=\"0 0 320 270\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"40,230 280,230 160,22.2\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"86.1\" y=\"124.4\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"18\">6<\/text><text x=\"233.9\" y=\"124.4\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"18\">6<\/text><text x=\"160\" y=\"254.3\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"18\">6<\/text><\/svg>"},"geo-20":{"title":"Similar Triangles","subj":"geo","page":20,"group":10,"body":"<p class=\"ps-def\"><b><span class=\"hl\">Similar Triangles<\/span>:<\/b> Two triangles with the same three angles and thus same ratios between their sides.<\/p><p>Small triangle: sides 4, 6, 8. Large triangle: sides 10, 15, 20. Both have angles <span class=\"m\">x°<\/span>, <span class=\"m\">y°<\/span>, <span class=\"m\">z°<\/span>.<\/p><div class=\"ps-f\">4 : 6 : 8 = 10 : 15 : 20<\/div><p>In each triangle the bottom side is <span class=\"hl\">× 2<\/span> the left side: 4 × 2 = 8 and 10 × 2 = 20.<\/p>","plain":"Similar triangles have the same angles, so they are the same shape but can be different sizes. Their sides keep the same proportions: if one side is twice another in the small triangle, the matching sides in the big triangle are also in a 2-to-1 ratio. Use this to find missing sides.","fun":"If you draw a perpendicular line from a vertex to one side in a right triangle, you will create three similar triangles.","check":{"q":"A triangle has sides 3, 5 and 7. A similar triangle has its shortest side equal to 12. What is its longest side?","choices":["16","20","21","28","35"],"a":"D · 28","why":"The shortest side went from 3 to 12, so every side is multiplied by 4. The longest side is 7 × 4 = 28."},"fig":"<svg viewBox=\"0 0 620 280\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"60,190 204,190 109.5,137.7\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"82\" y=\"184.7\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"12\">x°<\/text><text x=\"171.1\" y=\"185.7\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"12\">y°<\/text><text x=\"112.3\" y=\"159.7\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"12\">z°<\/text><text x=\"76\" y=\"160.9\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">4<\/text><text x=\"162.6\" y=\"158.6\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">6<\/text><text x=\"132\" y=\"210.2\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">8<\/text><path d=\"M60 140 Q8 182 75 218\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2.5\"/><polyline points=\"63.8,217.7 75,218 68.6,208.9\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><text x=\"30\" y=\"128\" text-anchor=\"middle\" style=\"fill:var(--red)\" font-size=\"15\">× 2<\/text><text x=\"250\" y=\"45\" text-anchor=\"middle\" style=\"fill:var(--blue)\" font-size=\"20\">4 : 6 : 8 =<\/text><text x=\"250\" y=\"72\" text-anchor=\"middle\" style=\"fill:var(--blue)\" font-size=\"20\">10 : 15 : 20<\/text><polygon points=\"280,235 600,235 390,118.8\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"311.2\" y=\"226.8\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"15\">x°<\/text><text x=\"561.3\" y=\"230.2\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"15\">y°<\/text><text x=\"394\" y=\"149.8\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"15\">z°<\/text><text x=\"323.4\" y=\"171.5\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"16\">10<\/text><text x=\"502.7\" y=\"168.5\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"16\">15<\/text><text x=\"440\" y=\"257.6\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"16\">20<\/text><path d=\"M300 150 Q232 210 300 262\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2.5\"/><polyline points=\"289,259.9 300,262 295.1,252\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><text x=\"238\" y=\"160\" text-anchor=\"middle\" style=\"fill:var(--red)\" font-size=\"15\">× 2<\/text><\/svg>"},"geo-21":{"title":"Quadrilaterals","subj":"geo","page":21,"group":10,"body":"<p>Quadrilaterals are 4-sided polygons.<\/p><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><th>Shape<\/th><th>What it is<\/th><\/tr><tr><td>Rectangle<\/td><td>90° degree angles, opposite sides parallel<\/td><\/tr><tr><td>Square<\/td><td>Rectangle with four equal sides<\/td><\/tr><tr><td>Parallelogram<\/td><td>Opposite sides parallel<\/td><\/tr><tr><td>Rhombus<\/td><td>Parallelogram with four equal sides<\/td><\/tr><tr><td>Trapezoid<\/td><td>Quadrilateral with one pair of parallel sides<\/td><\/tr><\/table><\/div>","plain":"A quadrilateral is any shape with 4 straight sides. The names stack up: a parallelogram has both pairs of opposite sides parallel; a rectangle is a parallelogram with 90° corners; a rhombus is a parallelogram with 4 equal sides; a square is both. A trapezoid has only one pair of parallel sides.","fun":"A square is just a “special” version of a rectangle and a rhombus a “special” version of a parallelogram.","check":{"q":"A quadrilateral has exactly one pair of parallel sides. What is it called?","choices":["Rectangle","Rhombus","Parallelogram","Trapezoid"],"a":"D · Trapezoid","why":"A trapezoid is a quadrilateral with one pair of parallel sides. The other three shapes all have two pairs of parallel sides."},"fig":"<svg viewBox=\"0 0 620 290\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"20\" y=\"20\" width=\"140\" height=\"90\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\"/><polyline points=\"29,20 29,29 20,29\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polyline points=\"151,20 151,29 160,29\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polyline points=\"151,110 151,101 160,101\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polyline points=\"29,110 29,101 20,101\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"90\" y=\"134\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">Rectangle<\/text><rect x=\"250\" y=\"20\" width=\"90\" height=\"90\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\"/><polyline points=\"259,20 259,29 250,29\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polyline points=\"331,20 331,29 340,29\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polyline points=\"331,110 331,101 340,101\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polyline points=\"259,110 259,101 250,101\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"295\" y=\"134\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">Square<\/text><polygon points=\"470,20 600,20 572,110 442,110\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"521\" y=\"134\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">Parallelogram<\/text><polygon points=\"160,165 250,165 220.4,250 130.4,250\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"190\" y=\"274\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">Rhombus<\/text><polygon points=\"380,165 500,165 530,250 350,250\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"440\" y=\"274\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">Trapezoid<\/text><\/svg>"},"geo-22":{"title":"More Quadrilateral Stuff","subj":"geo","page":22,"group":10,"body":"<p><b>Various Properties<\/b><\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4><span class=\"note\">Standard parallelogram<\/span><\/h4><p>Opposite sides are equal (<span class=\"m\">x<\/span> and <span class=\"m\">x<\/span>, <span class=\"m\">y<\/span> and <span class=\"m\">y<\/span>). Opposite angles are equal (<span class=\"m\">a°<\/span> and <span class=\"m\">a°<\/span>, <span class=\"m\">b°<\/span> and <span class=\"m\">b°<\/span>).<\/p><div class=\"ps-f\"><span class=\"hl\">a + b = 180<\/span><\/div><\/div><div class=\"ps-col\"><h4><span class=\"note\">Isosceles Trapezoid (2 sides equal)<\/span><\/h4><p>The two slanted sides are equal (<span class=\"m\">y<\/span> and <span class=\"m\">y<\/span>). The two top angles are <span class=\"m\">a°<\/span>; the two bottom angles are <span class=\"m\">b°<\/span>.<\/p><div class=\"ps-f\"><span class=\"hl\">a + b = 180<\/span><\/div><\/div><\/div>","plain":"In a parallelogram, opposite sides match and opposite angles match, and any two angles next to each other add to 180°. In an isosceles trapezoid, the two slanted sides match, the two top angles match, the two bottom angles match, and a top angle plus a bottom angle = 180°.","fun":"Although you will almost exclusively see isosceles trapezoids on the GRE, other trapezoids do exist.","check":{"q":"One angle of a parallelogram is 65°. What are the other three angles?","a":"115°, 65° and 115°","why":"The angle opposite the 65° angle is also 65°. Each neighbouring angle is 180° − 65° = 115°."},"fig":"<svg viewBox=\"0 0 620 240\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"40,200 220,200 280,40 100,40\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"190\" y=\"31.9\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"17\">x<\/text><text x=\"130\" y=\"221.9\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"17\">x<\/text><text x=\"55\" y=\"120.3\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"17\">y<\/text><text x=\"265\" y=\"131.6\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"17\">y<\/text><text x=\"64.7\" y=\"187.8\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">a°<\/text><text x=\"255.3\" y=\"62\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">a°<\/text><text x=\"112.5\" y=\"63\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">b°<\/text><text x=\"207.5\" y=\"186.8\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">b°<\/text><line x1=\"320\" y1=\"20\" x2=\"320\" y2=\"225\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><polygon points=\"360,200 570,200 520,40 410,40\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"369.7\" y=\"121.2\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"17\">y<\/text><text x=\"560.3\" y=\"121.2\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"17\">y<\/text><text x=\"424.2\" y=\"64.2\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">a°<\/text><text x=\"505.8\" y=\"64.2\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">a°<\/text><text x=\"384.2\" y=\"187.1\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">b°<\/text><text x=\"545.8\" y=\"187.1\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">b°<\/text><\/svg>"},"geo-23":{"title":"Dividing Quadrilaterals","subj":"geo","page":23,"group":10,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Square<\/h4><p>A diagonal of a square will create four 45° angles.<\/p><\/div><div class=\"ps-col\"><h4>Rhombus<\/h4><p>A diagonal of a rhombus will create four equal angles.<\/p><p>(the four <span class=\"m\">a°<\/span> angles; the other two corners are <span class=\"m\">b°<\/span>)<\/p><\/div><\/div><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Rectangle<\/h4><p>A diagonal of a rectangle will result in equal opposite angles.<\/p><div class=\"ps-f\"><span class=\"hl\">x + y = 90°<\/span><\/div><\/div><div class=\"ps-col\"><h4>Parallelogram<\/h4><p>A diagonal of a parallelogram will result in equal opposite angles.<\/p><\/div><\/div>","plain":"Draw a diagonal and look at the corner angles it splits. In a square, every piece is 45°. In a rhombus, the diagonal cuts its two corners into four equal pieces. In a rectangle or parallelogram, the pieces are not equal to each other, but each piece matches the piece diagonally across from it; in a rectangle the two pieces at a corner add to 90°.","fun":"If a quadrilateral is divided in half with a diagonal, don’t assume the two angles are equal unless it’s a square.","check":{"q":"In a rectangle, a diagonal makes a 35° angle with the top side at one corner. What angle does it make with the other side at that same corner?","choices":["35°","45°","55°","90°","145°"],"a":"C · 55°","why":"Each corner of a rectangle is 90°, so the two pieces add to 90°: 90° − 35° = 55°."},"fig":"<svg viewBox=\"0 0 600 410\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"40,22 180,22 180,162 40,162\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"40\" y1=\"22\" x2=\"180\" y2=\"162\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><text x=\"71.4\" y=\"39.2\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">45°<\/text><text x=\"53\" y=\"57.6\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">45°<\/text><text x=\"167\" y=\"134.8\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">45°<\/text><text x=\"148.6\" y=\"153.2\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">45°<\/text><text x=\"110\" y=\"190\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">Square<\/text><polygon points=\"380,22 520,22 468,152 328,152\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"380\" y1=\"22\" x2=\"468\" y2=\"152\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><text x=\"410\" y=\"42.1\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"12\">a°<\/text><text x=\"383.2\" y=\"56\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"12\">a°<\/text><text x=\"464.8\" y=\"126.4\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"12\">a°<\/text><text x=\"438\" y=\"140.3\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"12\">a°<\/text><text x=\"424\" y=\"190\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">Rhombus<\/text><text x=\"498.5\" y=\"40.8\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"12\">b°<\/text><text x=\"349.5\" y=\"141.6\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"12\">b°<\/text><polygon points=\"30,232 210,232 210,372 30,372\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"30\" y1=\"232\" x2=\"210\" y2=\"372\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><text x=\"67.8\" y=\"249.2\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"12\">y°<\/text><text x=\"43.2\" y=\"263.1\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"12\">x°<\/text><text x=\"196.8\" y=\"349.3\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"12\">x°<\/text><text x=\"172.2\" y=\"363.2\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"12\">y°<\/text><text x=\"120\" y=\"400\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">Rectangle<\/text><polygon points=\"370,232 540,232 510,372 340,372\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"370\" y1=\"232\" x2=\"510\" y2=\"372\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><text x=\"407\" y=\"251.5\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"12\">y°<\/text><text x=\"378.5\" y=\"265\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"12\">x°<\/text><text x=\"501.5\" y=\"347.4\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"12\">x°<\/text><text x=\"473\" y=\"360.9\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"12\">y°<\/text><text x=\"440\" y=\"400\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">Parallelogram<\/text><line x1=\"300\" y1=\"12\" x2=\"300\" y2=\"400\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><line x1=\"12\" y1=\"206\" x2=\"588\" y2=\"206\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><\/svg>"},"geo-24":{"title":"Square/Rectangle Area","subj":"geo","page":24,"group":10,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><div class=\"ps-f\">bh<\/div><p>b = base<\/p><p>h = height<\/p><\/div><div class=\"ps-col\"><div class=\"ps-f\">or<\/div><\/div><div class=\"ps-col\"><div class=\"ps-f\">lw<\/div><p>l = length<\/p><p>w = width<\/p><\/div><\/div><div class=\"ps-ex\"><div class=\"ps-ex-h\">Example<\/div><p>A rectangle with sides 4 and 8:<\/p><div class=\"ps-f\">4 × 8 = 32<\/div><\/div>","plain":"To find the area of a rectangle (or square), multiply the two side lengths that meet at a corner: base × height, also called length × width. The answer is in square units.","fun":"The rectangular area formula makes a lot more sense if you divide a rectangle into small little squares of side length 1.","check":{"q":"A rectangle has length 12 and width 5. What is its area?","a":"60","why":"Area = lw = 12 × 5 = 60."},"fig":"<svg viewBox=\"0 0 340 200\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"60\" y=\"30\" width=\"240\" height=\"120\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\"/><polyline points=\"69,30 69,39 60,39\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polyline points=\"291,30 291,39 300,39\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polyline points=\"291,150 291,141 300,141\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><polyline points=\"69,150 69,141 60,141\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"44\" y=\"96\" text-anchor=\"middle\" style=\"fill:var(--blue)\" font-size=\"18\">4<\/text><text x=\"180\" y=\"176\" text-anchor=\"middle\" style=\"fill:var(--blue)\" font-size=\"18\">8<\/text><\/svg>"},"geo-25":{"title":"Parallelogram Area","subj":"geo","page":25,"group":10,"body":"<p>The area is the same formula as a rectangle, but you <span class=\"hl\">have to determine the height<\/span><\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Obvious<\/h4><p>Base 6, height 3 (dashed line, drawn at a right angle to the base).<\/p><div class=\"ps-f\">3 × 6<\/div><div class=\"ps-f\">18<\/div><\/div><div class=\"ps-col\"><h4>Not so Obvious<\/h4><p>Base 6, slanted side 5, 60° angle at the bottom corner (the dashed height makes a 30° angle with the slanted side).<\/p><p>To find the height here, create a 30-60-90 triangle and use the rule to find the height.<\/p><\/div><\/div>","plain":"Parallelogram area = base × height, just like a rectangle. The catch: the height is the straight up-and-down distance, not the slanted side. If you are only given the slanted side and an angle, drop a height line to make a special right triangle (like 30-60-90) and use its side ratios.","fun":"Because a parallelogram’s area depends on its height, the biggest version is naturally a rectangle or square.","check":{"q":"A parallelogram has base 10 and a slanted side of 4 that makes a 60° angle with the base. What is its area?","choices":["20","20√3","40","40√3","20√2"],"a":"B · 20√3","why":"The height and the slanted side form a 30-60-90 triangle with hypotenuse 4, so the short leg is 2 and the height (opposite 60°) is 2√3. Area = 10 × 2√3 = 20√3."},"fig":"<svg viewBox=\"0 0 620 250\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"40,215 232,215 257.6,119 65.6,119\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"65.6\" y1=\"119\" x2=\"65.6\" y2=\"215\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><polyline points=\"74.6,215 74.6,206 65.6,206\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"75.6\" y=\"172\" text-anchor=\"start\" style=\"fill:var(--blue)\" font-size=\"17\">3<\/text><text x=\"136\" y=\"239\" text-anchor=\"middle\" style=\"fill:var(--blue)\" font-size=\"17\">6<\/text><line x1=\"300\" y1=\"20\" x2=\"300\" y2=\"240\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><polygon points=\"330,215 522,215 602,76.4 410,76.4\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"410\" y1=\"76.4\" x2=\"410\" y2=\"215\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><polyline points=\"419,215 419,206 410,206\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"357.9\" y=\"144.7\" text-anchor=\"middle\" style=\"fill:var(--blue)\" font-size=\"17\">5<\/text><text x=\"426\" y=\"239\" text-anchor=\"middle\" style=\"fill:var(--blue)\" font-size=\"17\">6<\/text><text x=\"356\" y=\"204.6\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">60°<\/text><text x=\"398.6\" y=\"122.8\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"11\">30°<\/text><\/svg>"},"geo-26":{"title":"Trapezoid Area","subj":"geo","page":26,"group":10,"body":"<p>If you think about it intuitively, the steps make sense.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Example<\/h4><p>Top 4, bottom 6, height 3.<\/p><div class=\"ps-f\"><span class=\"fr\"><span>4 + 6<\/span><span>2<\/span><\/span>(3)<\/div><div class=\"ps-f\"><span class=\"ok\">15<\/span><\/div><p class=\"ps-step\"><b><span class=\"hl\">Step 1:<\/span><\/b> Average the top and bottom<\/p><p class=\"ps-step\"><b><span class=\"hl\">Step 2:<\/span><\/b> Multiply that by the height<\/p><\/div><div class=\"ps-col\"><h4>General Formula<\/h4><div class=\"ps-f\"><span class=\"fr\"><span>a + b<\/span><span>2<\/span><\/span>h<\/div><p><span class=\"m\">a<\/span> = base 1<\/p><p><span class=\"m\">b<\/span> = base 2<\/p><\/div><\/div>","plain":"A trapezoid has two parallel sides (the bases) of different lengths. Find their average (add them and divide by 2), then multiply by the height. It is like turning the trapezoid into a rectangle whose width is the average of the two bases.","fun":"Trapezoid area can also be found by dividing a trapezoid into two triangles and one rectangle.","check":{"q":"A trapezoid has parallel sides of 5 and 9 and a height of 4. What is its area?","a":"28","why":"Average of the bases: (5 + 9) ÷ 2 = 7. Multiply by the height: 7 × 4 = 28."},"fig":"<svg viewBox=\"0 0 320 240\" xmlns=\"ht
