ll:var(--blue)\"/><text x=\"76\" y=\"274\" style=\"fill:var(--ink)\" font-size=\"13\">(1, 1)<\/text><circle cx=\"92\" cy=\"191\" r=\"4.5\" style=\"fill:var(--blue)\"/><text x=\"102\" y=\"196\" style=\"fill:var(--ink)\" font-size=\"13\">(2, 4)<\/text><circle cx=\"118\" cy=\"61\" r=\"4.5\" style=\"fill:var(--blue)\"/><text x=\"128\" y=\"66\" style=\"fill:var(--ink)\" font-size=\"13\">(3, 9)<\/text><text x=\"230\" y=\"120\" style=\"fill:var(--red)\" font-size=\"20\">nice!<\/text><\/svg>"},"cg-18":{"title":"Finding the Minimum","subj":"cg","page":18,"group":8,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Factoring<\/h4><div class=\"ps-f\">y = x² − 4x − 21<\/div><div class=\"ps-f\">↓<\/div><div class=\"ps-f\">y = (x − 7)(x + 3)<\/div><p><span class=\"m\">x<\/span>-intercepts: <span class=\"hl\">7<\/span> and <span class=\"hl\">−3<\/span><\/p><div class=\"ps-f\">↓<\/div><p>Find the <span class=\"m\">x<\/span> value between these two intercepts (<span class=\"m\">x = 2<\/span>) and plug in<\/p><div class=\"ps-f\">y = <span class=\"hl\">2<\/span>² − 4(<span class=\"hl\">2<\/span>) − 21<\/div><div class=\"ps-f\"><span class=\"ok\">y = −25<\/span><\/div><\/div><div class=\"ps-col\"><h4>Completing the Square<\/h4><div class=\"ps-f\">y = x² + 10x − 4<\/div><div class=\"ps-f\">↓<\/div><div class=\"ps-f\">y = [x² + 10x <span class=\"hl\">+ 25<\/span>] <span class=\"hl\">− 25<\/span> − 4<\/div><div class=\"ps-f\">↓<\/div><div class=\"ps-f\">y = (x + 5)² − 29<\/div><p><span class=\"note\">minimum!<\/span><\/p><div class=\"ps-f\"><span class=\"ok\">y = −29<\/span><\/div><\/div><div class=\"ps-col\"><h4>Plotting<\/h4><div class=\"ps-f\">y = x² + 7x − 2<\/div><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><th><span class=\"m\">x<\/span><\/th><th><span class=\"m\">y<\/span><\/th><\/tr><tr><td>−1<\/td><td>−8<\/td><\/tr><tr><td>−2<\/td><td>−12<\/td><\/tr><tr><td>−3<\/td><td>−14<\/td><\/tr><tr><td>−3.5<\/td><td><span class=\"hl\">−14.25<\/span><\/td><\/tr><tr><td>−4<\/td><td>−14<\/td><\/tr><tr><td>−5<\/td><td>−12<\/td><\/tr><tr><td>−6<\/td><td>−8<\/td><\/tr><\/table><\/div><p><span class=\"note\">notice the pattern<\/span><\/p><div class=\"ps-f\"><span class=\"ok\">y = −14.25<\/span><\/div><\/div><\/div>","plain":"<p>The minimum of an upward parabola is the y-value of its lowest point. Three ways to find it: factor and plug in the x halfway between the intercepts; complete the square and read off the constant; or plot points and watch where the y-values stop falling and start rising.<\/p>","fun":"For those of you who know calculus, you can also calculate the derivative and set it equal to zero to find the <span class=\"m\">x<\/span>-coordinate of the minimum value.","check":{"q":"What is the minimum value of <span class=\"m\">y = x² − 8x + 7<\/span>?","a":"−9","why":"Factor: <span class=\"m\">(x − 1)(x − 7)<\/span>, halfway is <span class=\"m\">x = 4<\/span>, and <span class=\"m\">16 − 32 + 7 = −9<\/span>. (Completing the square gives the same: <span class=\"m\">(x − 4)² − 9<\/span>.)"}},"cg-19":{"title":"Discriminant & the Plane","subj":"cg","page":19,"group":8,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><div class=\"ps-f\">b² − 4ac &gt; 0<\/div><p><span class=\"hl\"><b>two<\/b> x intercepts!<\/span><\/p><\/div><div class=\"ps-col\"><div class=\"ps-f\">b² − 4ac = 0<\/div><p><span class=\"hl\"><b>one<\/b> x intercept!<\/span><\/p><\/div><div class=\"ps-col\"><div class=\"ps-f\">b² − 4ac &lt; 0<\/div><p><span class=\"hl\"><b>zero<\/b> x intercepts!<\/span><\/p><\/div><\/div>","plain":"<p>For <span class=\"m\">y = ax² + bx + c<\/span>, the discriminant <span class=\"m\">b² − 4ac<\/span> tells you how many times the parabola hits the <span class=\"m\">x<\/span>-axis without solving: positive means twice, zero means once (it just touches), negative means never.<\/p>","fun":"As you can see from the charts above, when we say a quadratic has “no solutions,” we really mean it has no <span class=\"m\">x<\/span>-intercepts.","check":{"q":"How many <span class=\"m\">x<\/span>-intercepts does <span class=\"m\">y = x² + 2x + 5<\/span> have?","choices":["0","1","2","cannot be determined"],"a":"A · 0","why":"<span class=\"m\">b² − 4ac = 2² − 4(1)(5) = 4 − 20 = −16<\/span>, which is negative, so there are zero <span class=\"m\">x<\/span>-intercepts."},"fig":"<svg viewBox=\"0 0 600 210\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"24.4\" y1=\"105.6\" x2=\"175.6\" y2=\"105.6\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"169.4,102.3 175.6,105.6 169.4,108.9\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><line x1=\"100\" y1=\"188.4\" x2=\"100\" y2=\"30\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"96.7,36.2 100,30 103.3,36.2\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><text x=\"100\" y=\"18\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">b² − 4ac &gt; 0<\/text><line x1=\"224.4\" y1=\"105.6\" x2=\"375.6\" y2=\"105.6\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"369.4,102.3 375.6,105.6 369.4,108.9\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><line x1=\"300\" y1=\"188.4\" x2=\"300\" y2=\"30\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"296.7,36.2 300,30 303.3,36.2\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><text x=\"300\" y=\"18\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">b² − 4ac = 0<\/text><line x1=\"424.4\" y1=\"105.6\" x2=\"575.6\" y2=\"105.6\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"569.4,102.3 575.6,105.6 569.4,108.9\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><line x1=\"500\" y1=\"188.4\" x2=\"500\" y2=\"30\" fill=\"none\" style=\ 9.3,99.2 291.1,101.2 293.2,103 295.4,104.4 297.8,105.3 300.4,105.6 303,105.1 305.4,104 307.6,102.4 309.4,100.7 311.1,98.8 312.7,96.6 314.2,94.4 315.7,91.9 317,89.6 318.3,87.1 319.4,84.8 320.5,82.3 321.6,79.7 322.7,77 323.6,74.6 324.5,72.1 325.5,69.6 326.4,66.9 327.3,64.2 328.2,61.3 329.2,58.4 329.9,56 330.6,53.5 331.4,50.9 332.1,48.3 332.8,45.7 333.6,43 334.3,40.2 335.1,37.3 335.8,34.4 336.5,31.5 336.9,30\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"471.2,32.5 472.1,35.2 472.9,37.9 473.8,40.4 474.7,42.9 475.5,45.3 476.5,48 477.5,50.6 478.5,53 479.6,55.4 480.7,57.9 481.9,60.3 483,62.6 484.3,64.9 485.6,67.1 487,69.3 488.6,71.4 490.4,73.4 492.2,75.2 494.2,76.8 496.5,77.9 499,78.5 501.6,78.5 504,77.7 506.3,76.4 508.4,74.7 510.2,72.8 511.8,70.9 513.4,68.6 514.8,66.4 516.1,64.1 517.4,61.7 518.6,59.4 519.7,57 520.9,54.4 521.9,52 522.9,49.5 523.9,46.9 524.9,44.1 525.8,41.7 526.6,39.2 527.5,36.6 528.4,33.9 528.8,32.5\" fill=\"none\" style=\"stroke:var(--amber)\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"34.8\" y1=\"135.6\" x2=\"63.8\" y2=\"110.6\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.4\"/><polyline points=\"58,111.9 63.8,110.6 61.6,116.2\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><line x1=\"165.2\" y1=\"135.6\" x2=\"136.2\" y2=\"110.6\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.4\"/><polyline points=\"138.4,116.2 136.2,110.6 142,111.9\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><line x1=\"334\" y1=\"135.6\" x2=\"305\" y2=\"110.6\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.4\"/><polyline points=\"307.2,116.2 305,110.6 310.9,111.9\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><\/svg>"},"cg-20":{"title":"Graphing Circles","subj":"cg","page":20,"group":8,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><div class=\"ps-box\"><div class=\"ps-box-h\">Standard Circle Formula<\/div><div class=\"ps-f\">(x − h)² + (y − k)² = r²<\/div><\/div><div class=\"ps-f\">r = radius<\/div><div class=\"ps-f\">(h, k) = center<\/div><\/div><div class=\"ps-col\"><ul class=\"ps-list\"><li><span class=\"m\">(x + 2)² + (y − 2)² = 4<\/span>: center <span class=\"m\">(−2, 2)<\/span>, radius <span class=\"m\">= 2<\/span> (green circle)<\/li><li><span class=\"m\">(x − 1)² + (y + 2)² = 9<\/span>: center <span class=\"m\">(1, −2)<\/span>, radius <span class=\"m\">= 3<\/span> (blue circle)<\/li><\/ul><\/div><\/div>","plain":"<p>A circle’s equation shows its center and radius. In <span class=\"m\">(x − h)² + (y − k)² = r²<\/span>, the center is <span class=\"m\">(h, k)<\/span>: flip the signs you see inside the brackets. The radius is the square root of the number on the right.<\/p>","fun":"You’ll often see “concentric” circles plotted in the <span class=\"m\">xy<\/span>-coordinate plane. Those are circles with the same center but usually different radii.","check":{"q":"What are the center and radius of <span class=\"m\">(x − 3)² + (y + 1)² = 16<\/span>?","choices":["center (3, −1), radius 4","center (−3, 1), radius 4","center (3, −1), radius 16","center (−3, 1), radius 16"],"a":"A · center (3, −1), radius 4","why":"<span class=\"m\">x − 3<\/span> gives <span class=\"m\">h = 3<\/span>; <span class=\"m\">y + 1<\/span> gives <span class=\"m\">k = −1<\/span>. <span class=\"m\">r² = 16<\/span>, so <span class=\"m\">r = 4<\/span>."},"fig":"<svg viewBox=\"0 0 340 340\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"12\" y1=\"152\" x2=\"312\" y2=\"152\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"305.8,148.7 312,152 305.8,155.3\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"156\" y1=\"326\" x2=\"156\" y2=\"14\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"152.7,20.2 156,14 159.3,20.2\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><text x=\"308\" y=\"143\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">x<\/text><text x=\"164\" y=\"24\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">y<\/text><circle cx=\"96\" cy=\"92\" r=\"60\" style=\"fill:none;stroke:var(--green)\" stroke-width=\"2\"/><circle cx=\"186\" cy=\"212\" r=\"90\" style=\"fill:none;stroke:var(--blue)\" stroke-width=\"2\"/><line x1=\"96\" y1=\"92\" x2=\"156\" y2=\"92\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/><line x1=\"186\" y1=\"212\" x2=\"276\" y2=\"212\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/><circle cx=\"96\" cy=\"92\" r=\"4\" style=\"fill:var(--ink)\"/><circle cx=\"186\" cy=\"212\" r=\"4\" style=\"fill:var(--blue)\"/><text x=\"126.9\" y=\"85\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"10\">radius = 2<\/text><text x=\"96\" y=\"110\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">(−2, 2)<\/text><text x=\"231\" y=\"205\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"12\">radius = 3<\/text><text x=\"186\" y=\"232\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">(1, −2)<\/text><\/svg>"},"cg-21":{"title":"Circles and CTS","subj":"cg","page":21,"group":8,"body":"<p class=\"ps-def\"><b>Pro tip:<\/b> If you’re given a circle equation in a NON-standard format, complete the square <span class=\"hl\">twice<\/span>.<\/p><div class=\"ps-box\"><div class=\"ps-box-h\">NON-standard format<\/div><div class=\"ps-f\">x² − 4x + y² + 6y = 12<\/div><\/div><div class=\"ps-f\">x² − 4x <span class=\"hl\">+ 4<\/span> + y² + 6y <span class=\"hl\">+ 9<\/span> = 12 <span class=\"hl\">+ 4 + 9<\/span><\/div><div class=\"ps-f\">(x² − 4x + 4) + (y² + 6y + 9) = 25<\/div><div class=\"ps-f\">(x − 2)² + (y + 3)² = 5²<\/div><p>Center <span class=\"m\">(2, −3)<\/span>, radius <span class=\"m\">= 5<\/span>.<\/p>","plain":"<p>If the circle equation is “messy”, complete the square once for the <span class=\"m\">x<\/span> terms and once for the <span class=\"m\">y<\/span> terms. Add the same numbers to the right side. Then read the center and radius from the standard form.<\/p>","fun":"Recall from an earlier slide you can also use the technique of “completing the square” to find the minimum value of the quadratic.","check":{"q":"What are the center and radius of <span class=\"m\">x² + 2x + y² − 8y = 8<\/span>?","choices":["center (1, −4), radius 5","center (−1, 4), radius 5","center (−1, 4), radius √8","center (1, −4), radius 25"],"a":"B · center (−1, 4), radius 5","why":"Add 1 and 16 to both sides: <span class=\"m\">(x + 1)² + (y − 4)² = 8 + 1 + 16 = 25<\/span>. Center <span class=\"m\">(−1, 4)<\/span>, radius <span class=\"m\">√25 = 5<\/span>."},"fig":"<svg viewBox=\"0 0 320 306\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"11.8\" y1=\"81\" x2=\"299.8\" y2=\"81\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"293.6,77.7 299.8,81 293.6,84.3\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"103\" y1=\"292.2\" x2=\"103\" y2=\"13.8\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"99.7,20 103,13.8 106.3,20\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><text x=\"295.8\" y=\"72\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">x<\/text><text x=\"111\" y=\"23.8\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">y<\/text><circle cx=\"151\" cy=\"153\" r=\"120\" style=\"fill:none;stroke:var(--green)\" stroke-width=\"2\"/><line x1=\"151\" y1=\"153\" x2=\"271\" y2=\"153\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\"/><circle cx=\"151\" div><div class=\"ps-f\">y = −(x + 2)(x − 1)<\/div><\/div><\/div><p><span class=\"hl\">Graph both of these parabolas<\/span><\/p><p><span class=\"hl\">But <b>don’t allow<\/b> any <b>negative<\/b> <span class=\"m\">y<\/span> values<\/span><\/p>","plain":"<p>Same idea as the linear case: the part of the parabola that dips below the x-axis gets flipped up above it. That turns a U into a W shape, with a bump between the two x-intercepts.<\/p>","fun":"The absolute value of a quadratic with a negative discriminant will see no change to its graph.","check":{"q":"On the graph of <span class=\"m\">y = |x² − 4|<\/span>, what is <span class=\"m\">y<\/span> when <span class=\"m\">x = 0<\/span>?","choices":["<span class=\"m\">−4<\/span>","<span class=\"m\">0<\/span>","<span class=\"m\">2<\/span>","<span class=\"m\">4<\/span>"],"a":"D · 4","why":"<span class=\"m\">0² − 4 = −4<\/span>, and the absolute value makes it <span class=\"m\">|−4| = 4<\/span>. The dip below the axis is flipped up."},"fig":"<svg viewBox=\"0 0 330 334\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"17.8\" y1=\"171\" x2=\"312.2\" y2=\"171\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"306,167.7 312.2,171 306,174.3\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"165\" y1=\"318.2\" x2=\"165\" y2=\"14.2\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"161.7,20.4 165,14.2 168.3,20.4\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"197\" y1=\"167\" x2=\"197\" y2=\"175\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"229\" y1=\"167\" x2=\"229\" y2=\"175\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"261\" y1=\"167\" x2=\"261\" y2=\"175\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"293\" y1=\"167\" x2=\"293\" y2=\"175\" fill=\"none\" style=\"strok es negative <span class=\"note\">Depends on the start and end quadrants<\/span><\/li><\/ol><p>On the graph: <span class=\"m\">(4, 3)<\/span> rotated 90° one way gives <span class=\"m\">(−3, 4)<\/span>; rotated 90° the other way gives <span class=\"m\">(3, −4)<\/span>.<\/p>","plain":"<p>To turn a point 90° around the origin, swap its two numbers, then make one of them negative. Which one becomes negative depends on which quadrant the point lands in, so picture the turn.<\/p>","fun":"Many people assume a <span class=\"m\">90°<\/span> rotation results in merely changing the sign on one of the coordinates. Don’t forget to flip them too!","check":{"q":"The point <span class=\"m\">(2, 5)<\/span> is rotated 90° counter-clockwise about the origin. Where does it land?","choices":["<span class=\"m\">(−2, 5)<\/span>","<span class=\"m\">(5, −2)<\/span>","<span class=\"m\">(−5, 2)<\/span>","<span class=\"m\">(2, −5)<\/span>"],"a":"C · (−5, 2)","why":"Swap to get <span class=\"m\">(5, 2)<\/span>. Turning counter-clockwise moves it from Quadrant I into Quadrant II, where <span class=\"m\">x<\/span> is negative: <span class=\"m\">(−5, 2)<\/span>."},"fig":"<svg viewBox=\"0 0 350 318\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"26\" y1=\"158\" x2=\"314\" y2=\"158\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"307.8,154.7 314,158 307.8,161.3\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"170\" y1=\"302\" x2=\"170\" y2=\"14\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"166.7,20.2 170,14 173.3,20.2\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"200\" y1=\"154\" x2=\"200\" y2=\"162\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"230\" y1=\"154\" x2=\"230\" y2=\"162\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"260\" y1=\"154\" x2=\"260\" "m\">|x|<\/span> make this happen.<\/p>","fun":"Recall that <span class=\"ok\">even<\/span> functions can also be identified if every <span class=\"m\">x<\/span> variable is raised to an <span class=\"ok\">even<\/span> exponent.","check":{"q":"Which function is even?","choices":["<span class=\"m\">f(x) = x⁴ + 1<\/span>","<span class=\"m\">f(x) = x³<\/span>","<span class=\"m\">f(x) = x + 1<\/span>","<span class=\"m\">f(x) = x² + x<\/span>"],"a":"A · f(x) = x⁴ + 1","why":"<span class=\"m\">(−x)⁴ + 1 = x⁴ + 1<\/span>, the same as <span class=\"m\">f(x)<\/span>. The others change when you swap <span class=\"m\">x<\/span> for <span class=\"m\">−x<\/span>."},"fig":"<svg viewBox=\"0 0 600 210\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"24.4\" y1=\"105.6\" x2=\"175.6\" y2=\"105.6\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"169.4,102.3 175.6,105.6 169.4,108.9\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><line x1=\"100\" y1=\"188.4\" x2=\"100\" y2=\"30\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"96.7,36.2 100,30 103.3,36.2\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><text x=\"100\" y=\"18\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">y = x² − 4<\/text><line x1=\"224.4\" y1=\"105.6\" x2=\"375.6\" y2=\"105.6\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"369.4,102.3 375.6,105.6 369.4,108.9\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><line x1=\"300\" y1=\"188.4\" x2=\"300\" y2=\"30\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"296.7,36.2 300,30 303.3,36.2\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><text x=\"300\" y=\"18\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">y = −x² + 3<\/text>< var(--blue)\" stroke-width=\"2\" stroke-linejoin=\"round\"/><\/svg>"},"cg-27":{"title":"Intersections","subj":"cg","page":27,"group":8,"body":"<h4>Where do two graphs intersect?<\/h4><div class=\"ps-cols\"><div class=\"ps-col\"><div class=\"ps-f\">y = x + 2<\/div><\/div><div class=\"ps-col\"><div class=\"ps-f\">y = x² + 5x − 3<\/div><\/div><\/div><p><span class=\"note\">Set the two equations equal to each other and solve<\/span><\/p><div class=\"ps-f\">x + 2 = x² + 5x − 3<\/div><div class=\"ps-f\">0 = x² + 4x − 5<\/div><div class=\"ps-f\">0 = (x + 5)(x − 1)<\/div><div class=\"ps-f\">x = −5, 1  y = −3, 3<\/div><p>The graphs meet at <span class=\"m\">(−5, −3)<\/span> and <span class=\"m\">(1, 3)<\/span>.<\/p>","plain":"<p>Two graphs meet where they have the same x and the same y. So set the two y-expressions equal, solve for x, then plug each x back in to get its y.<\/p>","fun":"It’s possible for two equations to have no intersections at all. In such cases, you’ll find no valid solutions.","check":{"q":"Where do <span class=\"m\">y = x<\/span> and <span class=\"m\">y = x² − 2<\/span> intersect?","choices":["<span class=\"m\">(2, 2)<\/span> and <span class=\"m\">(−1, −1)<\/span>","<span class=\"m\">(−2, −2)<\/span> and <span class=\"m\">(1, 1)<\/span>","<span class=\"m\">(2, 2)<\/span> only","<span class=\"m\">(1, −1)<\/span> and <span class=\"m\">(2, 2)<\/span>"],"a":"A · (2, 2) and (−1, −1)","why":"<span class=\"m\">x = x² − 2<\/span> → <span class=\"m\">x² − x − 2 = 0<\/span> → <span class=\"m\">(x − 2)(x + 1) = 0<\/span>, so <span class=\"m\">x = 2<\/span> or <span class=\"m\">x = −1<\/span>; on <span class=\"m\">y = x<\/span> the points are <span class=\"m\">(2, 2)<\/span> and <span class=\"m\">(−1, −1)<\/span>."},"fig":"<svg viewBox=\"0 0 370 330\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"17\" y1=\"158\" x2=\"353\" y2=\"158\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"346.8,154.7 353,158 346.8,161.3\" fill=\"none\" s ny parentheses, the graph shifts <span class=\"ok\">right<\/span>.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><div class=\"ps-f\">y = x²<\/div><div class=\"ps-f\">y = (x + 2)²<\/div><p><span class=\"note\">−2 ←<\/span><\/p><\/div><div class=\"ps-col\"><div class=\"ps-f\">y = x² − 2<\/div><div class=\"ps-f\">y = (x − 2)² − 2<\/div><p><span class=\"note\">+2 →<\/span><\/p><\/div><div class=\"ps-col\"><div class=\"ps-f\">y = x³<\/div><div class=\"ps-f\">y = (x + 3)³<\/div><p><span class=\"note\">−3 ←<\/span><\/p><\/div><\/div>","plain":"<p>A number added or subtracted inside the brackets with <span class=\"m\">x<\/span> slides the graph sideways, and it goes the “wrong” way: <span class=\"m\">+<\/span> inside moves it left, <span class=\"m\">−<\/span> inside moves it right.<\/p>","fun":"It’s counterintuitive that adding something in parentheses shifts the graph to the LEFT, but alas, that’s how it goes.","check":{"q":"How is the graph of <span class=\"m\">y = (x − 4)²<\/span> related to the graph of <span class=\"m\">y = x²<\/span>?","choices":["shifted left 4","shifted right 4","shifted up 4","shifted down 4"],"a":"B · shifted right 4","why":"Subtracting 4 inside the parentheses shifts the graph right by 4. Its lowest point moves from <span class=\"m\">(0, 0)<\/span> to <span class=\"m\">(4, 0)<\/span>."},"fig":"<svg viewBox=\"0 0 600 232\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"20\" y1=\"136\" x2=\"180\" y2=\"136\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"173.8,132.7 180,136 173.8,139.3\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><line x1=\"100\" y1=\"200\" x2=\"100\" y2=\"48\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"96.7,54.2 100,48 103.3,54.2\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><text x=\"100\" y=\"18\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13 = 5x²","why":"Multiplying <span class=\"m\">x²<\/span> by 5 makes <span class=\"m\">y<\/span> grow 5 times as fast, so the graph is steeper and skinnier. Dividing (like <span class=\"m\">x²/4<\/span>) makes it wider; adding a number only moves it."},"fig":"<svg viewBox=\"0 0 600 232\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"20\" y1=\"136\" x2=\"180\" y2=\"136\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"173.8,132.7 180,136 173.8,139.3\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><line x1=\"100\" y1=\"200\" x2=\"100\" y2=\"48\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"96.7,54.2 100,48 103.3,54.2\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><text x=\"100\" y=\"18\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">y = x<\/text><text x=\"100\" y=\"36\" text-anchor=\"middle\" style=\"fill:var(--blue)\" font-size=\"13\">y = 3x<\/text><line x1=\"220\" y1=\"136\" x2=\"380\" y2=\"136\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"373.8,132.7 380,136 373.8,139.3\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><line x1=\"300\" y1=\"200\" x2=\"300\" y2=\"48\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"296.7,54.2 300,48 303.3,54.2\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><text x=\"300\" y=\"18\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">y = x² − 1<\/text><text x=\"300\" y=\"36\" text-anchor=\"middle\" style=\"fill:var(--blue)\" font-size=\"13\">y = 2x² − 1<\/text><line x1=\"420\" y1=\"136\" x2=\"580\" y2=\"136\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"573.8,132.7 580,136 573.8,139.3\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\" "ps-tw\"><table class=\"ps-tbl\"><tr><th>Number of Children<\/th><th>Relative Frequency<\/th><\/tr><tr><td>0<\/td><td>12%<\/td><\/tr><tr><td>1<\/td><td>20%<\/td><\/tr><tr><td>2<\/td><td>28%<\/td><\/tr><tr><td>3<\/td><td>24%<\/td><\/tr><tr><td>4<\/td><td>12%<\/td><\/tr><tr><td>5<\/td><td>4%<\/td><\/tr><tr><td><b>Total<\/b><\/td><td><b>100%<\/b><\/td><\/tr><\/table><\/div><\/div><\/div><p><span class=\"hl\">Images from the ETS Math Review Guide<\/span><\/p>","plain":"GRE data questions often start with a table. A <b>standard table<\/b> just lists values. A <b>frequency distribution<\/b> counts how many times each value occurs (the counts add up to the total, here 25). A <b>relative frequency distribution<\/b> shows each count as a percent of the total, so the percents add up to 100%.","fun":"The earliest examples of writing were essentially tables that kept track of crops and livestock.","check":{"q":"In a frequency distribution, 4 of the 20 families surveyed have 2 children. What value goes in the <b>relative frequency<\/b> table for 2 children?","choices":["4%","5%","16%","20%","25%"],"a":"D · 20%","why":"Relative frequency = count ÷ total = 4 ÷ 20 = 0.20 = 20%."}},"da-2":{"title":"Presenting Data II","subj":"da","page":2,"group":13,"body":"<p><b>Types of Bar Charts<\/b><\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Standard Bar Chart<\/h4><p>FALL 2009 ENROLLMENT AT FIVE COLLEGES<\/p><p>One bar per college (College A to College E); the height of each bar is the Enrollment (axis 0 to 8,000).<\/p><p><span class=\"note\">Bars read about 4,000, 4,500, 4,900, 6,400 and 7,500.<\/span><\/p><\/div><div class=\"ps-col\"><h4>Segmented Bar Chart<\/h4><p>FALL 2009 ENROLLMENT AT FIVE COLLEGES<\/p><p>Each bar is split into two pieces: Part-time (shaded, bottom) and Full-time (white, top). The whole bar is the total enrollment.<\/p><p><span class=\"note\">Part-time pieces read about 1,000, 1,500, 2,500, 2,200 and 3,500.<\/span><\/p><\/div><div class=\"ps-col\"><h4>Histogram<\/h4><p>Relative Frequency Distribution<\/p><p>Relative Frequency (0% to 30%) for Number of Children 0 to 5; the bars touch each other.<\/p><p><span class=\"note\">Bars: 12%, 20%, 28%, 24%, 12%, 4%.<\/span><\/p><\/div><\/div><p><span class=\"hl\">Images from the ETS Math Review Guide<\/span><\/p>","plain":"A <b>standard bar chart<\/b> uses one bar per category; the taller the bar, the bigger the number. A <b>segmented bar chart<\/b> stacks parts inside each bar, so you can read the total (top of the bar) and each part (subtract to find the top piece). A <b>histogram<\/b> is a bar chart of a frequency table, with the bars side by side.","fun":"A relative frequency table can be easily represented by a histogram, making its trends more conspicuous.","check":{"q":"In a segmented bar chart, one college's whole bar reaches 6,000 and its shaded Part-time piece reaches 2,000. How many Full-time students does it have?","choices":["2,000","3,000","4,000","6,000","8,000"],"a":"C · 4,000","why":"The Full-time piece sits on top of the Part-time piece, so Full-time = total − Part-time = 6,000 − 2,000 = 4,000."},"fig":"<svg viewBox=\"0 0 640 566\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"182.0\" y=\"16.0\" text-anchor=\"middle\" font-size=\"13\" style=\"fill:var(--blue)\">Standard Bar Chart<\/text><text x=\"182.0\" y=\"34.0\" text-anchor=\"middle\" font-size=\"9\" style=\"fill:var(--ink)\">FALL 2009 ENROLLMENT AT FIVE COLLEGES<\/text><line x1=\"62.0\" y1=\"52.0\" x2=\"62.0\" y2=\"232.0\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1\"/><line x1=\"62.0\" y1=\"232.0\" x2=\"302.0\" y2=\"232.0\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1\"/><line x1=\"59.0\" y1=\"232.0\" x2=\"62.0\" y2=\"232.0\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1\"/><text x=\"57.0\" y=\"235.0\" text-anchor=\"end\" font-size=\"9\" style=\"fill:var(--ink)\">0<\/text><line x1=\"59.0\" y1=\"209.5\" x2=\"62.0\" y2=\"209.5\" fill=\"none\" style=\"stroke:var(--ink)\ the “center” of the data. There are <span class=\"hl\">three<\/span> main ways to do this.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Mean<\/h4><div class=\"ps-f\">2, 9, 6, 3, 7, 3<\/div><div class=\"ps-f\"><span class=\"hl\">5<\/span><\/div><\/div><div class=\"ps-col\"><h4>Median<\/h4><div class=\"ps-f\">2, 9, 6, 3, 7, 3<\/div><div class=\"ps-f\"><span class=\"hl\">4.5<\/span><\/div><\/div><div class=\"ps-col\"><h4>Mode<\/h4><div class=\"ps-f\">2, 9, 6, 3, 7, 3<\/div><div class=\"ps-f\"><span class=\"hl\">3<\/span><\/div><\/div><\/div>","plain":"The “center” of a list can be measured three ways: the <b>mean<\/b> (the average), the <b>median<\/b> (the middle number once the list is in order) and the <b>mode<\/b> (the most common number). The same list can give three different answers, so always check which one the question asks for.","fun":"As illustrated above, there is no rule that says the mean, median, and mode have to equal each other.","check":{"q":"For the list 4, 8, 8, 10, 15, which is the greatest?","choices":["the mean","the median","the mode","they are all equal"],"a":"A · the mean","why":"Mean = 45 ÷ 5 = 9; median = 8 (middle of 4, 8, 8, 10, 15); mode = 8 (appears twice). So the mean, 9, is greatest."}},"da-5":{"title":"Mean/Average","subj":"da","page":5,"group":13,"body":"<p>To calculate the “mean” or “average” of a set of numbers, complete the following steps.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><div class=\"ps-f\"><span class=\"hl\">x, y, z<\/span><\/div><p class=\"ps-step\"><b>Step 1:<\/b> Find the sum of all data<\/p><div class=\"ps-f\"><span class=\"hl\">x + y + z<\/span><\/div><p class=\"ps-step\"><b>Step 2:<\/b> Divide the sum by the quantity of numbers<\/p><div class=\"ps-f\"><span class=\"hl\"><span class=\"fr\"><span>x + y + z<\/span><span>3<\/span><\/span><\/span><\/div><\/div><div class=\"ps-col\"><div class=\"ps-box\"><div class=\"ps-f\">5, 2, 9, 6, 3, 7, 3<\/div><\/div><div class=\"ps-f\">5 + 2 + 9 + 6 + 3 + 7 + 3 = 35<\/div><div class=\"ps-f\"><span class=\"fr\"><span>35<\/span><span>7<\/span><\/span> = 5<\/div><\/div><\/div>","plain":"To find the mean (average), add up all the numbers, then divide by how many numbers there are. On the GRE you will often go the other way too: average × how many numbers = the total sum.","fun":"In many problems, you use the average and number of numbers to calculate the total sum to solve.","check":{"q":"What is the mean of 4, 7, 10, 11, 13?","choices":["7","9","10","11","45"],"a":"B · 9","why":"Sum = 4 + 7 + 10 + 11 + 13 = 45. There are 5 numbers, so the mean is 45 ÷ 5 = 9."}},"da-6":{"title":"Median","subj":"da","page":6,"group":13,"body":"<p>To calculate the “median” of a set of numbers, complete the following steps.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><p class=\"ps-step\"><b>Step 1:<\/b> Arrange the numbers from low to high<\/p><p class=\"ps-step\"><b>Step 2a:<\/b> If the quantity of numbers is odd, simply identify the middle number<\/p><p class=\"ps-step\"><b>Step 2b:<\/b> If the quantity of numbers is even, find the mean of the two middle numbers<\/p><\/div><div class=\"ps-col\"><div class=\"ps-ex\"><div class=\"ps-ex-h\">example 1<\/div><div class=\"ps-f\">3, 5, <span class=\"hl\">6<\/span>, 9, 9<\/div><p><span class=\"note\">↑ median<\/span><\/p><\/div><div class=\"ps-ex\"><div class=\"ps-ex-h\">example 2<\/div><div class=\"ps-f\">3, 5, <span class=\"hl\">6, 9<\/span>, 9, 10<\/div><div class=\"ps-f\"><span class=\"fr\"><span>6 + 9<\/span><span>2<\/span><\/span> → 7.5<\/div><\/div><\/div><\/div>","plain":"The median is the middle number after you put the list in order from low to high. If the list has an odd count, it is the single middle number. If the count is even, there are two middle numbers, so take their average.","fun":"The median annual income of the population of the United States in 2021 was $46,625.","check":{"q":"What is the median of 12, 3, 8, 5, 10, 7?","choices":["7","7.5","8","8.5","9"],"a":"B · 7.5","why":"In order: 3, 5, 7, 8, 10, 12. Six numbers (even), so average the two middle ones: (7 + 8) ÷ 2 = 7.5."}},"da-7":{"title":"Mode","subj":"da","page":7,"group":13,"body":"<p>To calculate the “mode” of a set of numbers, complete the following steps.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><div class=\"ps-f\"><span class=\"hl\">x, y, z, x<\/span><\/div><p class=\"ps-step\"><b>Step 1a:<\/b> Find the most common number → <span class=\"m\">x<\/span><\/p><div class=\"ps-f\"><span class=\"hl\">x, y, z, x, y<\/span><\/div><p class=\"ps-step\"><b>Step 1b:<\/b> It’s possible to have more than one mode<\/p><div class=\"ps-f\">↓<\/div><div class=\"ps-f\">x and y<\/div><\/div><div class=\"ps-col\"><div class=\"ps-ex\"><div class=\"ps-ex-h\">example 1<\/div><div class=\"ps-f\">3, 5, 6, 9, 9<\/div><p>mode = 9<\/p><\/div><div class=\"ps-ex\"><div class=\"ps-ex-h\">example 2<\/div><div class=\"ps-f\">3, 3, 6, 9, 9, 10<\/div><p>modes = 3 and 9<\/p><\/div><\/div><\/div>","plain":"The mode is the number that shows up most often in the list. If two (or more) numbers tie for most often, the list has more than one mode. You do not need to put the list in order, but it makes counting easier.","fun":"The mode is the least tested measure of central tendency on the GRE; median and mean are far more common.","check":{"q":"What is the mode of 4, 7, 7, 2, 4, 9, 7?","choices":["2","4","7","4 and 7","9"],"a":"C · 7","why":"7 appears three times, 4 appears twice, and every other number once, so 7 is the single mode."}},"da-8":{"title":"Mean/Median Relationship","subj":"da","page":8,"group":13,"body":"<p>In two cases, the mean equals the median. This is very powerful.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Case 1<\/h4><p><span class=\"hl\">evenly spaced set<\/span><\/p><div class=\"ps-f\">1, 4, 7, 10, 13, 16, 19, 22<\/div><p><span class=\"note\">+3 +3 +3 +3 +3 +3 +3<\/span><\/p><div class=\"ps-f\">Mean, Median → 11.5<\/div><\/div><div class=\"ps-col\"><h4>Case 2<\/h4><p><span class=\"hl\">symmetrical set<\/span><\/p><div class=\"ps-f\">1, 1, 2, 5, 9, 12, 13, 13<\/div><p><span class=\"note\">+0 +1 +3 +4 +3 +1 +0<\/span><\/p><div class=\"ps-f\">Mean, Median → 7<\/div><\/div><\/div>","plain":"If the numbers are evenly spaced (same gap each time), or the gaps are a mirror image around the middle (symmetrical), then the mean equals the median. That is a shortcut: for an evenly spaced list, the mean is just (first + last) ÷ 2, no big adding needed.","fun":"These are NOT the only two cases in which the mean equals the median. These are just two special cases.","check":{"q":"What is the mean of 5, 9, 13, 17, 21, 25?","choices":["13","15","17","19","25"],"a":"B · 15","why":"The numbers go up by 4 each time (evenly spaced), so mean = median = (5 + 25) ÷ 2 = 15. Check: sum 90 ÷ 6 = 15."}},"da-9":{"title":"Weighted Mean","subj":"da","page":9,"group":13,"body":"<p>Sometimes when calculating mean, certain values carry more “weight.”<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Example 1<\/h4><div class=\"ps-box\"><div class=\"ps-f\">1, 2, 2, 2, 3, 3, 3, 3, 3, 3<\/div><\/div><p><span class=\"note\">Notice that the <span class=\"hl\">2<\/span> appears three times and the <span class=\"hl\">3<\/span> six times<\/span><\/p><div class=\"ps-f\"><span class=\"fr\"><span>1 + 2 × (3) + 3 × (6)<\/span><span>10<\/span><\/span><\/div><div class=\"ps-f\">↓<\/div><div class=\"ps-f\">2.5<\/div><\/div><div class=\"ps-col\"><h4>Example 2<\/h4><p>In a class homework accounts for 10% of the final grade, the midterm exam 30%, and the final exam 60%.<\/p><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><th>Category<\/th><th>Grade<\/th><\/tr><tr><td>Homework<\/td><td>30/40<\/td><\/tr><tr><td>Midterm Exam<\/td><td>40/50<\/td><\/tr><tr><td>Final Exam<\/td><td>70/100<\/td><\/tr><\/table><\/div><div class=\"ps-f\">(<span class=\"fr\"><span>30<\/span><span>40<\/span><\/span>)(.1) + (<span class=\"fr\"><span>40<\/span><span>50<\/span><\/span>)(.3) + (<span class=\"fr\"><span>70<\/span><span>100<\/span><\/span>)(.6) = 73.5<\/div><\/div><\/div>","plain":"In a weighted mean, some values count more than others. Multiply each value by its weight (how many times it appears, or its percent), add those up, and divide by the total weight. When the weights are percents that add to 100%, you just add the products.","fun":"If a list has 100 values equal to 2, and the number 50 is added to the list, the average changes by only ≈ .48.","check":{"q":"Quizzes count for 40% of a grade and the final exam for 60%. A student scores 80 on quizzes and 90 on the final. What is the final grade?","choices":["84","85","86","87","88"],"a":"C · 86","why":"(80)(.4) + (90)(.6) = 32 + 54 = 86."}},"da-10":{"title":"Measures of Position","subj":"da","page":10,"group":13,"body":"<p class=\"ps-def\"><b>Measures of position<\/b> give an indication of the location of data when it is ordered from least to greatest.<\/p><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><td>10<\/td><td>13<\/td><td>15<\/td><td>28<\/td><td>36<\/td><td>57<\/td><td>80<\/td><\/tr><tr><td>↓<\/td><td><\/td><td><\/td><td>↓<\/td><td><\/td><td><\/td><td>↓<\/td><\/tr><tr><td><span class=\"note\">beginning ‘least’<\/span><\/td><td><\/td><td><\/td><td><span class=\"note\">middle ‘median’<\/span><\/td><td><\/td><td><\/td><td><span class=\"note\">end ‘greatest’<\/span><\/td><\/tr><\/table><\/div>","plain":"Measures of position tell you <b>where<\/b> a value sits once the list is in order from least to greatest. The beginning is the least value, the middle is the median, and the end is the greatest value.","fun":"The “median” is both a measure of central tendency AND a measure of position.","check":{"q":"In the ordered list 4, 9, 12, 20, 31, which number is in the middle position (the median)?","choices":["4","9","12","20","31"],"a":"C · 12","why":"There are 5 numbers, so the 3rd one is the middle: 4, 9, <b>12<\/b>, 20, 31."}},"da-11":{"title":"Quartiles","subj":"da","page":11,"group":13,"body":"<p class=\"ps-def\"><b>Quartiles<\/b> divide a list of ordered numbers into fourths, or four groups.<\/p><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><td>41 &nbsp; 49<\/td><td>71 &nbsp; 74<\/td><td>81 &nbsp; 83<\/td><td>90 &nbsp; 93<\/td><\/tr><tr><td>↓<\/td><td>↓<\/td><td>↓<\/td><td>↓<\/td><\/tr><tr><td><span class=\"note\">1<sup>st<\/sup> Quartile<\/span><\/td><td><span class=\"note\">2<sup>nd<\/sup> Quartile<\/span><\/td><td><span class=\"note\">3<sup>rd<\/sup> Quartile<\/span><\/td><td><span class=\"note\">4<sup>th<\/sup> Quartile<\/span><\/td><\/tr><\/table><\/div>","plain":"Quartiles cut an ordered list into four equal groups. Here 8 numbers become 4 groups of 2: the lowest quarter is the 1st quartile and the highest quarter is the 4th quartile.","fun":"Data can also be divided into thirds (three groups), quintiles (five groups), or any other number of groups.","check":{"q":"An ordered list of 12 numbers is split into quartiles. How many numbers are in each quartile group?","choices":["2","3","4","6"],"a":"B · 3","why":"Quartiles make four equal groups, so 12 ÷ 4 = 3 numbers in each group."}},"da-12":{"title":"Calculating \"Q\" Values","subj":"da","page":12,"group":13,"body":"<p>When dividing data into quartiles, three “Q” values demarcate the data:<\/p><p>Q<sub>1<\/sub> = first quartile &nbsp;&nbsp; Q<sub>2<\/sub> = median &nbsp;&nbsp; Q<sub>3<\/sub> = third quartile<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><p class=\"ps-step\"><b>Step 1:<\/b> Find the median of the data. This is the <span class=\"hl\">Q<sub>2<\/sub><\/span> value.<\/p><p class=\"ps-step\"><b>Step 2:<\/b> To the left of the median is the “first half” of the data. Find the median of this. This is the <span class=\"hl\">Q<sub>1<\/sub><\/span> value.<\/p><p class=\"ps-step\"><b>Step 3:<\/b> To the right of the median is the “second half” of the data. Find the median of this. This is the <span class=\"hl\">Q<sub>3<\/sub><\/span> value.<\/p><\/div><div class=\"ps-col\"><div class=\"ps-ex\"><div class=\"ps-ex-h\">example<\/div><div class=\"ps-f\">0 1 3 &nbsp; 4 &nbsp; 8 8 9<\/div><p><span class=\"note\">first half<\/span> 0 1 3 → Q<sub>1<\/sub> value = 1<\/p><p>4 → Q<sub>2<\/sub> median<\/p><p><span class=\"note\">second half<\/span> 8 8 9 → Q<sub>3<\/sub> value = 8<\/p><\/div><\/div><\/div>","plain":"Q<sub>2<\/sub> is just the median. Then split the list at the median: the median of the lower half is Q<sub>1<\/sub>, and the median of the upper half is Q<sub>3<\/sub>. When the list has an odd count, the median itself is left out of both halves.","fun":"Data that contains a multiple of 4 members will have Q<sub>1<\/sub>, Q<sub>2<\/sub>, and Q<sub>3<\/sub> values that are NOT part of the list.","check":{"q":"For the list 2, 4, 5, 7, 9, 11, 12, what is Q<sub>3<\/sub>?","choices":["7","9","10","11","12"],"a":"D · 11","why":"The median (Q<sub>2<\/sub>) is 7. The second half is 9, 11, 12, and its median is 11, so Q<sub>3<\/sub> = 11."},"fig":"<svg viewBox=\"0 0 440 165\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"52.0\" y=\"42.0\" width=\"138.0\" height=\"40.0\" rx=\"6\" fill=\"none\" style=\"fill:none;stroke:var(--ink)\" stroke-width=\"1\"/><text x=\"121.0\" y=\"32.0\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:var(--red)\">first half<\/text><text x=\"75.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"22\" style=\"fill:var(--ink)\">0<\/text><text x=\"121.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"22\" style=\"fill:var(--ink)\">1<\/text><text x=\"167.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"22\" style=\"fill:var(--ink)\">3<\/text><text x=\"220.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"22\" style=\"fill:var(--ink)\">4<\/text><rect x=\"250.0\" y=\"42.0\" width=\"138.0\" height=\"40.0\" rx=\"6\" fill=\"none\" style=\"fill:none;stroke:var(--ink)\" stroke-width=\"1\"/><text x=\"319.0\" y=\"32.0\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:var(--red)\">second half<\/text><text x=\"273.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"22\" style=\"fill:var(--ink)\">8<\/text><text x=\"319.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"22\" style=\"fill:var(--ink)\">8<\/text><text x=\"365.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"22\" style=\"fill:var(--ink)\">9<\/text><line x1=\"121.0\" y1=\"86.0\" x2=\"121.0\" y2=\"116.0\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><polygon points=\"117.0,115.0 125.0,115.0 121.0,122.0\" fill=\"none\" style=\"fill:var(--blue)\"/><text x=\"121.0\" y=\"138.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--red)\">Q₁<\/text><text x=\"121.0\" y=\"153.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--red)\">value<\/text><line x1=\"220.0\" y1=\"78.0\" x2=\"220.0\" y2=\"116.0\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><polygon points=\"216.0,115.0 224.0,115.0 220.0,122.0\" fill=\"none\" style=\"fill:var(--blue)\"/><text x=\"220.0\" y=\"138.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--red)\">Q₂<\/text><text x=\"220.0\" y=\"153.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--red)\">median<\/text><line x1=\"319.0\" y1=\"86.0\" x2=\"319.0\" y2=\"116.0\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><polygon points=\"315.0,115.0 323.0,115.0 319.0,122.0\" fill=\"none\" style=\"fill:var(--blue)\"/><text x=\"319.0\" y=\"138.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--red)\">Q₃<\/text><text x=\"319.0\" y=\"153.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--red)\">value<\/text><\/svg>"},"da-13":{"title":"Percentiles","subj":"da","page":13,"group":13,"body":"<p class=\"ps-def\"><b>Percentiles<\/b> divide a list of ordered numbers into 100 groups.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Multiples of 100<\/h4><p>Percentiles are <b>much cleaner<\/b> in these cases<\/p><p><span class=\"note\">Picture: 100 people in order (5 rows of 20). Boxed: 0<sup>th<\/sup> percentile (the first person), 39<sup>th<\/sup> percentile, 81<sup>st<\/sup> percentile, 99<sup>th<\/sup> percentile (the last person).<\/span><\/p><\/div><div class=\"ps-col\"><h4>Other Cases<\/h4><p>It gets a bit messier…<\/p><p>In fact, there is <b>no agreed upon way<\/b> to calculate percentiles in data in NON multiples of 100.<\/p><p>The best we can say on the GRE is that if a number is at a certain percentile, then it is higher than that percentage of the data.<\/p><p>For example, if <span class=\"m\">x<\/span> is at the 73<sup>rd<\/sup> percentile, then <span class=\"m\">x<\/span> is <b>greater<\/b> than 73% of the data.<\/p><\/div><\/div>","plain":"Percentiles split ordered data into 100 groups. With exactly 100 values it is clean: the value in position <span class=\"m\">k<\/span> (counting from 0) is greater than <span class=\"m\">k<\/span> of the other values, so it is at the <span class=\"m\">k<\/span><sup>th<\/sup> percentile. For other data sizes, on the GRE just remember: being at the <span class=\"m\">p<\/span><sup>th<\/sup> percentile means being greater than <span class=\"m\">p<\/span>% of the data.","fun":"The last number in the data above is at the 99<sup>th<\/sup> percentile because it is GREATER than 99% of the data.","check":{"q":"A test score is at the 85<sup>th<\/sup> percentile. Which statement must be true?","choices":["The score is 85 out of 100.","It is greater than 85% of the scores.","It is less than 85% of the scores.","It is in the bottom 15% of the scores."],"a":"B · It is greater than 85% of the scores.","why":"Being at a certain percentile means the value is higher than that percentage of the data — it says nothing about the score being 85 points."},"fig":"<svg viewBox=\"0 0 640 196\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"136.0\" cy=\"24.0\" r=\"3.6\" fill=\"none\" style=\"fill:var(--ink)\"/><line x1=\"136.0\" y1=\"28.0\" x2=\"136.0\" y2=\"38.0\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1\"/><line x1=\"131.0\" y1=\"31.0\" x2=\"141.0\" y2=
