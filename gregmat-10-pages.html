<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GregMat in 10 Pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Source+Sans+3:wght@500;600;700&display=swap">
<style>
/* A printed study book: one page on a desk, page turns, running heads, folios. Ink-blue for rules, red pencil for traps. */
:root{
  --desk:#E9E7E1; --page:#FCFBF8; --panel:#FCFBF8; --panel-2:#F3F1EB;
  --ink:#1D2024; --ink-2:#464A50; --ink-3:#74787E;
  --line:#E3E0D8; --line-2:#CCC8BE;
  --blue:#23507D; --blue-2:#1A3F63; --blue-wash:rgba(35,80,125,.08);
  --red:#A63A2A; --red-wash:rgba(166,58,42,.09);
  --green:#2E7A57; --green-wash:rgba(46,122,87,.11);
  --amber:#946010;
  --shadow:0 1px 2px rgba(29,32,36,.06),0 18px 40px -28px rgba(29,32,36,.45);
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --fs:17px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#111315; --page:#1A1D20; --panel:#1A1D20; --panel-2:#22262A;
  --ink:#E8E6E1; --ink-2:#BAB7B0; --ink-3:#8D8A85;
  --line:#2C3035; --line-2:#3C4147;
  --blue:#8FB8E0; --blue-2:#B5D0EB; --blue-wash:rgba(143,184,224,.12);
  --red:#E58A77; --red-wash:rgba(229,138,119,.13);
  --green:#6FC59A; --green-wash:rgba(111,197,154,.13);
  --amber:#D8A84E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -26px rgba(0,0,0,.9);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#111315; --page:#1A1D20; --panel:#1A1D20; --panel-2:#22262A;
  --ink:#E8E6E1; --ink-2:#BAB7B0; --ink-3:#8D8A85;
  --line:#2C3035; --line-2:#3C4147;
  --blue:#8FB8E0; --blue-2:#B5D0EB; --blue-wash:rgba(143,184,224,.12);
  --red:#E58A77; --red-wash:rgba(229,138,119,.13);
  --green:#6FC59A; --green-wash:rgba(111,197,154,.13);
  --amber:#D8A84E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -26px rgba(0,0,0,.9);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--desk);color:var(--ink)}
body{margin:0;font-family:var(--serif);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---- the bar above the page ---- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--desk) 92%,transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  padding-block:8px;padding-inline:16px}
.bar-in{max-width:52rem;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.btn{font-family:var(--sans);font-size:14px;font-weight:600;line-height:1;padding:8px 12px;border-radius:7px;border:1px solid var(--line-2);
  background:var(--page);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--page)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.seg .btn{border:0;border-radius:0}
.seg .btn+.btn{border-left:1px solid var(--line-2)}
.pager{display:flex;gap:3px;overflow-x:auto;max-width:100%;scrollbar-width:none;flex:1 1 auto;min-width:0}
.pager::-webkit-scrollbar{display:none}
.pg{font-family:var(--sans);font-size:13.5px;font-weight:700;min-width:30px;height:30px;padding:0 6px;border-radius:50%;border:1px solid transparent;
  background:transparent;color:var(--ink-2);cursor:pointer;font-variant-numeric:tabular-nums}
.pg:hover{border-color:var(--line-2)}
.pg[aria-current="page"]{background:var(--blue);color:var(--page)}
.pg.done{box-shadow:inset 0 -3px 0 var(--green)}
.tools{display:flex;gap:8px;align-items:center;margin-left:auto}

/* ---- the page ---- */
.wrap{padding-inline:clamp(0px,3vw,32px);padding-block:clamp(0px,3vw,28px) 40px}
.sheet{max-width:48rem;margin:0 auto;background:var(--page);border:1px solid var(--line);box-shadow:var(--shadow);
  padding-block:clamp(22px,5vw,52px) clamp(22px,4vw,40px);padding-inline:clamp(18px,6vw,68px);font-size:var(--fs);line-height:1.55;min-height:70vh}
@media (max-width:560px){.sheet{border-left:0;border-right:0}}
@media (max-width:640px){.bar{position:static}}
.turn{animation:turn .22s ease-out}
@keyframes turn{from{opacity:0;transform:translateX(var(--dx,10px))}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.turn{animation:none}}
.rhead{display:flex;justify-content:space-between;gap:12px;font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line);padding-bottom:8px;margin:0 0 26px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(1.55rem,4.2vw,2.15rem);line-height:1.15;letter-spacing:-.01em;margin:0 0 8px;text-wrap:balance}
.deck{font-style:italic;color:var(--ink-2);margin:0 0 6px;max-width:38em}
.meta{font-family:var(--sans);font-size:13.5px;color:var(--ink-3);margin:0 0 4px;font-variant-numeric:tabular-nums}
h2{font-family:var(--sans);font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);
  margin:30px 0 4px;padding-bottom:6px;border-bottom:1.5px solid var(--blue)}

/* ---- one card = one line ---- */
.it{display:grid;grid-template-columns:26px minmax(0,11.5em) minmax(0,1fr);column-gap:14px;align-items:start;padding:10px 0;border-bottom:1px dotted var(--line-2)}
.kn{width:22px;height:22px;margin-top:2px;border-radius:50%;border:1.5px solid var(--line-2);background:transparent;cursor:pointer;padding:0;
  display:grid;place-items:center;color:transparent;font-family:var(--sans);font-size:13px;font-weight:700;line-height:1}
.kn:hover{border-color:var(--green);color:var(--green)}
.it.known .kn{background:var(--green);border-color:var(--green);color:var(--page)}
.tt{all:unset;cursor:pointer;font-weight:600;line-height:1.35;color:var(--ink);overflow-wrap:anywhere}
.tt:hover,.tt[aria-expanded="true"]{color:var(--blue)}
.tt:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:2px}
.tt .more{display:block;font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink-3);margin-top:2px}
.tt[aria-expanded="true"] .more{color:var(--blue)}
.it.known .tt{color:var(--ink-2)}
.rl{min-width:0;overflow-wrap:break-word}
.rl sup,.rl sub{font-size:.72em;line-height:0}
.trap{display:block;margin-top:3px;color:var(--red);font-size:.94em}
.trap b.lb{font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-right:6px}
.cover .it:not(.shown) .rl{filter:blur(6px);opacity:.55;cursor:pointer;user-select:none;-webkit-user-select:none}
.cover .it:not(.shown) .rl *{pointer-events:none}
.hideknown .it.known:not(.open){display:none}
.full{grid-column:1/-1;margin:12px 0 4px}
@media (max-width:640px){
  .it{grid-template-columns:26px minmax(0,1fr);row-gap:3px}
  .rl{grid-column:2}
}

/* ---- the full card (same look as the GregMat chapter) ---- */
.pscard{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:16px 20px 14px}
.pshd{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
.pscard h3{font-family:var(--sans);font-size:19px;font-weight:700;line-height:1.25;margin:0 0 10px}
.psbody{font-size:15.5px;line-height:1.6;color:var(--ink)}
.psbody p{margin:0 0 10px}
.psbody h4{font-family:var(--sans);font-size:13.5px;font-weight:700;color:var(--blue);margin:0 0 8px}
.ps-def{color:var(--ink-2)}
.ps-def b{color:var(--ink)}
.ps-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 20px;margin:8px 0 10px}
.ps-col{min-width:0;border-left:2px solid var(--line-2);padding-left:12px}
.ps-f{font-family:var(--serif);font-style:italic;font-size:17px;text-align:center;margin:6px 0;color:var(--blue-2);overflow-x:auto;overflow-y:hidden;padding:2px 0}
.m{font-family:var(--serif);font-style:italic;white-space:nowrap}
.ps-f .hl,.ps-f .ok,.ps-f .note,.m .note{font-style:normal}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;line-height:1.15;font-size:.92em}
.fr>span:first-child{border-bottom:1.3px solid currentColor;padding:0 3px}
.fr>span:last-child{padding:0 3px}
.ov{border-top:1.3px solid currentColor;padding-top:1px}
.ps-list{margin:4px 0 10px;padding-left:22px}
.ps-list li{margin:3px 0}
.ps-tw{overflow-x:auto;margin:8px 0 10px}
.ps-tbl{border-collapse:collapse;font-size:14.5px;margin:0 auto}
.ps-tbl th,.ps-tbl td{border:1px solid var(--line-2);padding:5px 12px;text-align:center}
.ps-tbl th{font-family:var(--sans);font-size:12.5px;background:var(--page);color:var(--ink-2)}
.ps-boxes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0 10px}
.ps-box{background:var(--blue-wash);border:1px solid var(--blue);border-radius:6px;padding:8px 14px;min-width:140px;text-align:center}
.ps-box-h{font-family:var(--sans);font-size:12.5px;font-weight:700;color:var(--blue)}
.ps-box .ps-f{margin:4px 0 0}
.ps-ex{background:var(--page);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:8px 0 10px}
.ps-ex-h{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
.ps-step{margin:4px 0}
.hl{color:var(--red);font-weight:600}
.ok{color:var(--green);font-weight:600}
.note{font-family:var(--serif);font-style:italic;font-size:.86em;color:var(--red)}
.psfig{margin:10px 0 12px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--page);overflow-x:auto}
.psfig svg{display:block;width:100%;max-width:620px;max-height:360px;height:auto;margin:0 auto;font-family:var(--serif)}
.psplain{margin:12px 0 0;padding:10px 14px;border-left:3px solid var(--blue);background:var(--blue-wash);border-radius:0 6px 6px 0;font-size:15px;line-height:1.6}
.psplain b.l,.pschk .l{display:block;font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin:0 0 3px}
.pschk{margin:12px 0 0;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:var(--page)}
.pschk .l{color:var(--ink-3)}
.pschk .q,.qz .q{font-size:15.5px;line-height:1.55;margin:0 0 8px}
.ch{display:flex;flex-direction:column;gap:6px;margin:0 0 8px}
.ch button{display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:15px;padding:8px 10px;border:1px solid var(--line-2);border-radius:6px;
  background:var(--page);color:var(--ink);cursor:pointer}
.ch button .lt{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--ink-3);padding-top:2px}
.ch button:hover{border-color:var(--blue)}
.ch button.right{border-color:var(--green);background:var(--green-wash)}
.ch button.wrong{border-color:var(--red);background:var(--red-wash)}
.ch button[disabled]{cursor:default}
.rv{font-family:var(--sans);font-size:13px;font-weight:600;padding:6px 12px;border:1px solid var(--blue);border-radius:999px;background:var(--page);color:var(--blue);cursor:pointer}
.ans{margin:8px 0 0;font-size:14.5px;line-height:1.55}
.ans b{color:var(--green)}
.psfun{margin:12px 0 0;font-size:13.5px;line-height:1.55;color:var(--ink-3)}
.psfun b.lbl{color:var(--amber);font-family:var(--sans);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-right:6px}

/* ---- end of page ---- */
.endmatter{margin-top:30px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.endmatter p{margin:0;font-family:var(--sans);font-size:14.5px;color:var(--ink-2)}
.endmatter .acts{display:flex;gap:8px;flex-wrap:wrap}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--page)}
.btn.pri:hover{color:var(--page);filter:brightness(1.08)}
.foot{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:28px;padding-top:14px;border-top:1px solid var(--line)}
.nav{all:unset;cursor:pointer;font-family:var(--sans);font-size:14px;color:var(--ink-2);line-height:1.3;min-width:0}
.nav b{display:block;color:var(--blue);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.nav:hover{color:var(--ink)}
.nav.next{text-align:right}
.nav:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:3px}
.folio{font-family:var(--serif);font-style:italic;color:var(--ink-3);font-variant-numeric:oldstyle-nums}

/* ---- contents page ---- */
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:10px 22px;margin:22px 0 6px;padding:0;list-style:none;
  font-family:var(--sans);font-size:15px;color:var(--ink-2)}
.howto li{min-width:0}
.howto b{color:var(--ink)}
.toc{list-style:none;margin:26px 0 0;padding:0}
.toc li{border-bottom:1px dotted var(--line-2)}
.toc button{all:unset;cursor:pointer;display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:4px 12px;width:100%;padding:12px 0;align-items:baseline}
.toc button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.toc .no{font-family:var(--serif);font-weight:700;font-size:1.35rem;color:var(--blue);font-variant-numeric:lining-nums tabular-nums}
.toc .k{display:block;font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.toc .t{font-weight:600;line-height:1.3}
.toc button:hover .t{color:var(--blue)}
.toc .c{font-family:var(--sans);font-size:13.5px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.toc .c i{font-style:normal;color:var(--green);font-weight:700}
.prog{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden;grid-column:2/-1}
.prog i{display:block;height:100%;background:var(--green);border-radius:2px}
.cont{margin:22px 0 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.small{font-family:var(--sans);font-size:13.5px;color:var(--ink-3)}

/* ---- the check (one question at a time) ---- */
.qz{position:fixed;inset:0;z-index:20;background:rgba(17,19,21,.45);display:grid;place-items:center;padding:16px}
.qz[hidden]{display:none}
.qzp{width:min(36rem,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--page);border:1px solid var(--line-2);border-radius:10px;
  box-shadow:var(--shadow);padding:20px 22px}
.qzh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink-3);margin:0 0 10px}
.qz .tag{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin:0 0 6px}
.qz .why{font-size:15px;line-height:1.55;margin:4px 0 12px;padding:10px 12px;border-radius:6px;background:var(--panel-2)}
.qz .why b{color:var(--green)}
.qz .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.score{font-family:var(--serif);font-size:2.2rem;font-weight:700;margin:4px 0}
.missed{margin:8px 0 14px;padding-left:20px}
.missed li{margin:3px 0}
</style>
</head>
<body>
<div class="bar" role="navigation" aria-label="Book">
  <div class="bar-in">
    <button type="button" class="btn" id="tocBtn">Contents</button>
    <div class="pager" id="pager" aria-label="Pages"></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Reading mode">
        <button type="button" class="btn" data-mode="read" id="modeRead">Read</button>
        <button type="button" class="btn" data-mode="cover" id="modeCover" title="Hide every rule so you can recall it, then tap to check">Cover</button>
      </div>
      <button type="button" class="btn" id="hideBtn" aria-pressed="false" title="Hide the cards you have ticked">Hide ✓</button>
      <button type="button" class="btn" id="sizeBtn" title="Text size" aria-label="Text size">Aa</button>
    </div>
  </div>
</div>
<div class="wrap"><main class="sheet" id="sheet" aria-live="polite"></main></div>

"alg-20","alg-21"]},{"h":"Word problems","ids":["alg-22","alg-23","alg-24","alg-25","alg-26","alg-27","alg-28","alg-29","alg-30"]}]},{"n":5,"kicker":"Geometry · I","title":"Lines, Angles, Triangles & Quadrilaterals","deck":"Angle sums, the special right triangles, and the area of every flat shape the test uses.","secs":[{"h":"Lines & angles","ids":["geo-1","geo-2","geo-3"]},{"h":"Polygons & their angles","ids":["geo-4","geo-5","geo-6","geo-7","geo-8"]},{"h":"Triangles","ids":["geo-9","geo-10","geo-11","geo-12","geo-13","geo-14","geo-15","geo-16","geo-17","geo-18","geo-19","geo-20"]},{"h":"Quadrilaterals & area","ids":["geo-21","geo-22","geo-23","geo-24","geo-25","geo-26","geo-27","geo-28","geo-29","geo-30"]}]},{"n":6,"kicker":"Geometry · II","title":"Circles & Solids","deck":"A slice of a circle is a fraction of 360°, and only three solids are ever tested.","secs":[{"h":"Circles","ids":["geo-31","geo-32","geo-33","geo-34","geo-35","geo-36","geo-37","geo-38","geo-39","geo-40","geo-41","geo-42","geo-43","geo-44"]},{"h":"Solids","ids":["geo-45","geo-46","geo-47","geo-48","geo-49","geo-50","geo-51","geo-52","geo-53","geo-54","geo-55","geo-56"]}]},{"n":7,"kicker":"Coordinate Geometry","title":"The Plane, Lines, Parabolas & Moving Graphs","deck":"Points, slopes, intercepts, the vertex of a parabola, the centre of a circle, and how graphs shift.","secs":[{"h":"The plane","ids":["cg-1","cg-2","cg-3","cg-4","cg-5","cg-6"]},{"h":"Lines & slope","ids":["cg-7","cg-8","cg-9","cg-10","cg-11","cg-12","cg-13"]},{"h":"Parabolas & circles","ids":["cg-14","cg-15","cg-16","cg-17","cg-18","cg-19","cg-20","cg-21"]},{"h":"Moving and bending graphs","ids":["cg-22","cg-23","cg-24","cg-25","cg-26","cg-27","cg-28","cg-29","cg-30"]}]},{"n":8,"kicker":"Data Analysis · I","title":"Reading Data, Centre & Spread","deck":"Tables and charts, mean, median and mode, quartiles, and what standard deviation does.","secs":[{"h":"Reading data","ids":["da-1","da-2","da-3"]},{"h":"Centre","ids":["da-4","da-5","da-6","da-7","da-8","da-9"]},{"h":"Position","ids":["da-10","da-11","da-12","da-13"]},{"h":"Spread","ids":["da-14","da-15","da-16","da-17","da-18","da-19","da-20","da-21","da-22","da-23","da-24"]}]},{"n":9,"kicker":"Data Analysis · II","title":"Sets & Counting","deck":"Overlaps without double counting, then every way to count arrangements and groups.","secs":[{"h":"Sets & overlaps","ids":["da-25","da-26","da-27","da-28","da-29","da-30","da-31"]},{"h":"Counting","ids":["da-32","da-33","da-34","da-35","da-36","da-37","da-38","da-39","da-40","da-41","da-42","da-43","da-44","da-45","da-46"]}]},{"n":10,"kicker":"Data Analysis · III","title":"Probability & Distributions","deck":"Wanted over total, and or or, at least one, and the shape of a distribution.","secs":[{"h":"Probability basics","ids":["da-47","da-48","da-49","da-50","da-51","da-52"]},{"h":"And, or, at least","ids":["da-53","da-54","da-55","da-56","da-57","da-58","da-59","da-60","da-61"]},{"h":"Distributions","ids":["da-62","da-63","da-64","da-65","da-66","da-67","da-68","da-69","da-70","da-71"]}]}],"cards":{"alg-1":{"title":"Algebraic Expressions","subj":"alg","page":1,"group":5,"body":"<p class=\"ps-def\"><b>Definition:<\/b> a mathematical expression that has one or more variables and can be written as a single term or sum of terms<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Vocabulary<\/h4><div class=\"ps-f\">3x + 5<\/div><ul class=\"ps-list\"><li><span class=\"m\">3<\/span> <span class=\"note\">coefficient<\/span><\/li><li><span class=\"m\">x<\/span> <span class=\"note\">variable<\/span><\/li><li><span class=\"m\">5<\/span> <span class=\"note\">constant<\/span><\/li><\/ul><\/div><div class=\"ps-col\"><p><span class=\"hl\">One Term:<\/span> <span class=\"m\">4y<\/span><\/p><p><span class=\"hl\">Two Terms:<\/span> <span class=\"m\">23r + 7x<\/span><\/p><p><span class=\"hl\">Three Terms:<\/span> <span class=\"m\">15t³ + d² + 75<\/span><\/p><\/div><\/div>","plain":"An algebraic expression is a math phrase built from terms added together, like <span class=\"m\">3x + 5<\/span>. The number stuck to a letter is the <b>coefficient<\/b> (3), the letter is the <b>variable<\/b> (x), and a number standing alone is the <b>constant<\/b> (5). Count terms by counting the pieces separated by + or − signs.","fun":"A constant by itself is considered an algebraic expression – a variable need not be present.","check":{"q":"In the expression <span class=\"m\">8m² − 2m + 11<\/span>, how many terms are there, and what is the coefficient of <span class=\"m\">m<\/span>?","choices":["2 terms; coefficient 2","3 terms; coefficient −2","3 terms; coefficient 11","3 terms; coefficient 8","2 terms; coefficient −2"],"a":"B · 3 terms; coefficient −2","why":"The pieces are <span class=\"m\">8m²<\/span>, <span class=\"m\">−2m<\/span> and <span class=\"m\">11<\/span>, so three terms. The number multiplying <span class=\"m\">m<\/span> is <span class=\"m\">−2<\/span>."}},"alg-2":{"title":"Polynomial and Degree","subj":"alg","page":2,"group":5,"body":"<p class=\"ps-def\"><b>Definition:<\/b> the sum of a finite number of terms in which each term is either a constant or a product of a coefficient and one or more variables with <span class=\"hl\">positive integer exponents<\/span><\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Examples<\/h4><div class=\"ps-f\">4x⁶ + 7x⁵ − 3x + 2<\/div><p><span class=\"note\">polynomial in one variable, x, with four terms<\/span><\/p><div class=\"ps-f\">3xy² + 2x²y + xy<\/div><p><span class=\"note\">polynomial in two variables, x and y, with three terms<\/span><\/p><\/div><div class=\"ps-col\"><h4>Polynomial Degree<\/h4><p>The degree is indicated by the exponents of the variable<\/p><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><th>Degree<\/th><th>Examples<\/th><th><\/th><\/tr><tr><td><span class=\"hl\">0<\/span> degree<\/td><td><span class=\"m\">7x⁰<\/span><\/td><td><span class=\"note\">i.e. a constant term by itself<\/span><\/td><\/tr><tr><td><span class=\"hl\">1<\/span> degree<\/td><td><span class=\"m\">5x<\/span>, <span class=\"m\">x + 3y<\/span><\/td><td><span class=\"note\">2 examples<\/span><\/td><\/tr><tr><td><span class=\"hl\">2<\/span> degree<\/td><td><span class=\"m\">2r²<\/span>, <span class=\"m\">5rt<\/span><\/td><td><span class=\"note\">2 examples<\/span><\/td><\/tr><tr><td><span class=\"hl\">3<\/span> degree<\/td><td><span class=\"m\">x³<\/span>, <span class=\"m\">yz²<\/span>, <span class=\"m\">xyz<\/span><\/td><td><span class=\"note\">3 examples<\/span><\/td><\/tr><\/table><\/div><\/div><\/div>","plain":"A polynomial is a sum of terms where every exponent on a variable is a positive whole number (no square roots of x, no x in the denominator). The degree of a term is the total of the exponents on its variables, so <span class=\"m\">5rt<\/span> has degree 1 + 1 = 2. The degree of the whole polynomial is its biggest term degree.","fun":"Polynomials in the first degree are referred to as “linear,” while polynomials in the second degree are referred to as “quadratics.”","check":{"q":"What is the degree of the term <span class=\"m\">4a²b³<\/span>?","choices":["2","3","4","5","6"],"a":"D · 5","why":"Add the exponents of the variables: <span class=\"m\">2 + 3 = 5<\/span>. The coefficient 4 does not count."}},"alg-3":{"title":"Simplifying Expressions","subj":"alg","page":3,"group":5,"body":"<p><b>Combining like terms:<\/b><\/p><div class=\"ps-f\">5x³ + 4xy² − 2x³ + 3xy² = <span class=\"ok\">3x³ + 7xy²<\/span><\/div><p><span class=\"note\">like terms: 5x³ and −2x³; like terms: 4xy² and 3xy²<\/span><\/p><p><b>The ‘FOIL’ method:<\/b> <span class=\"note\">Foil: Front, Outside, Inside, Last<\/span><\/p><div class=\"ps-f\">(x + 4)(2x − 5) = <span class=\"ok\">2x² − 5x + 8x − 20<\/span><\/div><p><span class=\"note\">like terms: −5x and 8x<\/span><\/p><p><b>Factoring out:<\/b><\/p><div class=\"ps-f\">6y³ + 9y = (3y)(2y²) + (3y)(3) = <span class=\"ok\">3y(2y² + 3)<\/span><\/div><p><b>Factoring and canceling:<\/b><\/p><div class=\"ps-f\"><span class=\"fr\"><span>7x² + 14x<\/span><span>2x + 4<\/span><\/span> = <span class=\"fr\"><span>7x(x + 2)<\/span><span>2(x + 2)<\/span><\/span> = <span class=\"ok\"><span class=\"fr\"><span>7x<\/span><span>2<\/span><\/span><\/span> <span class=\"note\">where x ≠ −2<\/span><\/div>","plain":"Four tools to make an expression shorter. Like terms have exactly the same letters with the same powers, so you just add their coefficients. FOIL multiplies two brackets: Front, Outside, Inside, Last. Factoring pulls out what every term shares, and if the same bracket sits on top and bottom of a fraction you can cancel it (as long as it is not zero).","fun":"Terms might appear at first to be unlike each other even though they are, one example being <span class=\"m\">x²<\/span> and <span class=\"m\"><span class=\"fr\"><span>1<\/span><span>x⁻²<\/span><\/span><\/span>.","check":{"q":"Expand and simplify <span class=\"m\">(x − 3)(x + 7)<\/span>.","choices":["<span class=\"m\">x² − 21<\/span>","<span class=\"m\">x² + 4x − 21<\/span>","<span class=\"m\">x² − 4x − 21<\/span>","<span class=\"m\">x² + 10x − 21<\/span>","<span class=\"m\">x² + 4x + 21<\/span>"],"a":"B · <span class=\"m\">x² + 4x − 21<\/span>","why":"F: <span class=\"m\">x·x = x²<\/span>; O: <span class=\"m\">7x<\/span>; I: <span class=\"m\">−3x<\/span>; L: <span class=\"m\">−21<\/span>. Combine <span class=\"m\">7x − 3x = 4x<\/span>."}},"alg-4":{"title":"Algebraic Identities","subj":"alg","page":4,"group":5,"body":"<div class=\"ps-boxes\"><div class=\"ps-box\"><div class=\"ps-box-h\">Identity 1<\/div><div class=\"ps-f\">ca + cb = c(a + b)<\/div><\/div><div class=\"ps-box\"><div class=\"ps-box-h\">Identity 2<\/div><div class=\"ps-f\">ca − cb = c(a − b)<\/div><\/div><div class=\"ps-box\"><div class=\"ps-box-h\">Identity 3<\/div><div class=\"ps-f\">(a + b)² = a² + 2ab + b²<\/div><\/div><div class=\"ps-box\"><div class=\"ps-box-h\">Identity 4<\/div><div class=\"ps-f\">(a − b)² = a² − 2ab + b²<\/div><\/div><div class=\"ps-box\"><div class=\"ps-box-h\">Identity 5<\/div><div class=\"ps-f\">a² − b² = (a + b)(a − b)<\/div><\/div><\/div>","plain":"These five patterns are always true, for any numbers a, b and c. Memorise them: the GRE loves hiding them inside questions. Watch out for the middle term <span class=\"m\">2ab<\/span> in identities 3 and 4 (people forget it), and spot the \"difference of squares\" <span class=\"m\">a² − b²<\/span> whenever you see one square minus another.","fun":"There are actually two more identities for <span class=\"m\">(a − b)³<\/span> and <span class=\"m\">(a + b)³<\/span>, but these aren’t particularly helpful.","check":{"q":"If <span class=\"m\">x + y = 9<\/span> and <span class=\"m\">x − y = 4<\/span>, what is <span class=\"m\">x² − y²<\/span>?","a":"36","why":"By Identity 5, <span class=\"m\">x² − y² = (x + y)(x − y) = 9 × 4 = 36<\/span>. You never need to find x and y."}},"alg-5":{"title":"Linear Equations","subj":"alg","page":5,"group":5,"body":"<p class=\"ps-def\"><b>Definition:<\/b> an equation involving <span class=\"hl\">one or more<\/span> variables in which each term in the equation is either a constant term or a variable multiplied by a coefficient.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Examples<\/h4><div class=\"ps-f\">x = 9<\/div><div class=\"ps-f\">3y + 4x = 15<\/div><div class=\"ps-f\">5x + y − 3z = 34<\/div><\/div><div class=\"ps-col\"><h4>Solving Linear Equations<\/h4><p>“Solving” means to find the value of variables that make the equation true.<\/p><div class=\"ps-f\"><span class=\"note\">−5x<\/span> 5x − 28 = 9x <span class=\"note\">−5x<\/span><\/div><div class=\"ps-f\">−28 = 4x<\/div><div class=\"ps-f\"><span class=\"note\">÷4<\/span> &#160; <span class=\"note\">÷4<\/span><\/div><div class=\"ps-f\">−7 = x<\/div><\/div><\/div>","plain":"A linear equation has variables only to the first power: no x², no xy. To solve one, do the same thing to both sides until the variable is alone: subtract to move terms, then divide by the coefficient.","fun":"A linear equation can have as many variables as your heart desires, as long as they are all to the first degree.","check":{"q":"Solve <span class=\"m\">7x + 4 = 3x − 12<\/span>.","choices":["<span class=\"m\">x = −4<\/span>","<span class=\"m\">x = −2<\/span>","<span class=\"m\">x = 2<\/span>","<span class=\"m\">x = 4<\/span>","<span class=\"m\">x = −1.6<\/span>"],"a":"A · <span class=\"m\">x = −4<\/span>","why":"Subtract <span class=\"m\">3x<\/span> and 4 from both sides: <span class=\"m\">4x = −16<\/span>, so <span class=\"m\">x = −4<\/span>."}},"alg-6":{"title":"Absolute Value Equations","subj":"alg","page":6,"group":5,"body":"<p><b>How do you solve an absolute value equation?<\/b><\/p><div class=\"ps-f\">|3x + 6| = 21<\/div><p><span class=\"note\">Set up two equations: one positive, one negative.<\/span><\/p><div class=\"ps-cols\"><div class=\"ps-col\"><div class=\"ps-f\">3x + 6 = 21<\/div><div class=\"ps-f\"><span class=\"ok\">x = 5<\/span><\/div><\/div><div class=\"ps-col\"><div class=\"ps-f\">3x + 6 = −21<\/div><div class=\"ps-f\"><span class=\"ok\">x = −9<\/span><\/div><\/div><\/div>","plain":"Absolute value means \"distance from zero\", so the stuff inside the bars can be either the positive number or its negative. Split the equation into two: inside = +21 and inside = −21, and solve each. You usually get two answers.","fun":"Recall the technical definition of absolute value is the “distance” from a certain point on the number line.","check":{"q":"Find all solutions of <span class=\"m\">|2x − 3| = 11<\/span>.","choices":["<span class=\"m\">x = 7<\/span> only","<span class=\"m\">x = 7<\/span> or <span class=\"m\">x = −4<\/span>","<span class=\"m\">x = −7<\/span> or <span class=\"m\">x = 4<\/span>","<span class=\"m\">x = 4<\/span> only","<span class=\"m\">x = 7<\/span> or <span class=\"m\">x = 4<\/span>"],"a":"B · <span class=\"m\">x = 7<\/span> or <span class=\"m\">x = −4<\/span>","why":"<span class=\"m\">2x − 3 = 11<\/span> gives <span class=\"m\">x = 7<\/span>; <span class=\"m\">2x − 3 = −11<\/span> gives <span class=\"m\">2x = −8<\/span>, <span class=\"m\">x = −4<\/span>."}},"alg-7":{"title":"System of Equations","subj":"alg","page":7,"group":5,"body":"<p class=\"ps-def\"><b>Definition:<\/b> a set of equations (two or more) with two or more variables<\/p><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><td><span class=\"hl\">NOT<\/span> a system of equations<\/td><td><span class=\"m\">x + y = 10<\/span><\/td><td><span class=\"note\">infinite solutions<\/span><\/td><\/tr><tr><td><span class=\"ok\">YES<\/span> a system of equations<\/td><td><div class=\"ps-f\">3x + y = 5<\/div><div class=\"ps-f\">x − 2y = 3<\/div><\/td><td><span class=\"note\">one solution<\/span><\/td><\/tr><\/table><\/div><p><span class=\"note\">Don’t forget! Make sure you check that you actually have <u>different<\/u> equations in a system.<\/span><\/p>","plain":"A system is two or more different equations that share the same variables. One equation with two unknowns (like <span class=\"m\">x + y = 10<\/span>) has endless answers. Two different equations with two unknowns usually pin down one exact answer. Before solving, check the equations are truly different, not one equation multiplied by a number.","fun":"To get exact values of the variables of a 3-variable linear equation, three equations are needed. With four variables, four are needed, etc.","check":{"q":"Which pair can be solved for exact values of <span class=\"m\">x<\/span> and <span class=\"m\">y<\/span>?","choices":["<span class=\"m\">x + y = 6<\/span> and <span class=\"m\">2x + 2y = 12<\/span>","<span class=\"m\">x + y = 6<\/span> and <span class=\"m\">x − y = 2<\/span>","<span class=\"m\">x + y = 6<\/span> only","<span class=\"m\">3x + 3y = 18<\/span> and <span class=\"m\">x + y = 6<\/span>"],"a":"B · <span class=\"m\">x + y = 6<\/span> and <span class=\"m\">x − y = 2<\/span>","why":"In A and D the second equation is just the first multiplied by a number, so they are the same equation. Only B gives two different equations (solution <span class=\"m\">x = 4, y = 2<\/span>)."}},"alg-8":{"title":"Elimination Method","subj":"alg","page":8,"group":5,"body":"<p class=\"ps-def\"><b>The Goal:<\/b> Manipulate one or both of the equations to ‘eliminate’ one of the variables<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Original System of Equations<\/h4><div class=\"ps-f\">3x − 5y = 14<\/div><div class=\"ps-f\">2x + 2y = 4<\/div><h4>Manipulate System of Equations<\/h4><div class=\"ps-f\">(3x − 5y = 14) <span class=\"note\">× 2<\/span><\/div><div class=\"ps-f\">(2x + 2y = 4) <span class=\"note\">× 3<\/span><\/div><\/div><div class=\"ps-col\"><h4>Bring it Home<\/h4><div class=\"ps-f\">(6x − 10y = 28)<\/div><div class=\"ps-f\">− (6x + 6y = 12)<\/div><div class=\"ps-f\">−16y = 16<\/div><div class=\"ps-f\"><span class=\"ok\">y = −1<\/span><\/div><div class=\"ps-f\"><span class=\"note\">thus<\/span> <span class=\"ok\">x = 3<\/span><\/div><\/div><\/div>","plain":"Multiply the equations so that one variable has the same coefficient in both. Then subtract (or add) the equations: that variable disappears and you can solve for the other one. Plug that answer back into either original equation to get the second variable.","fun":"If the two equations are actually equivalent, then both variables will be eliminated and it’s impossible to solve.","check":{"q":"Solve: <span class=\"m\">2x + 3y = 12<\/span> and <span class=\"m\">2x − y = 4<\/span>. What is <span class=\"m\">y<\/span>?","choices":["1","2","3","4","8"],"a":"B · 2","why":"Subtract the second equation from the first: <span class=\"m\">(2x + 3y) − (2x − y) = 12 − 4<\/span>, so <span class=\"m\">4y = 8<\/span> and <span class=\"m\">y = 2<\/span> (then <span class=\"m\">x = 3<\/span>)."}},"alg-9":{"title":"Substitution Method","subj":"alg","page":9,"group":5,"body":"<p class=\"ps-def\"><b>The Goal:<\/b> Isolate one variable in one equation and “plug it” in the other equation to solve.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Original System of Equations<\/h4><div class=\"ps-f\">3x − y = 9<\/div><div class=\"ps-f\">5x + 3y = 29<\/div><h4>Isolate One Variable<\/h4><div class=\"ps-f\">3x − 9 = y<\/div><div class=\"ps-f\">5x + 3y = 29<\/div><\/div><div class=\"ps-col\"><h4>Plug it in and Bring it Home<\/h4><div class=\"ps-f\">5x + 3(3x − 9) = 29<\/div><div class=\"ps-f\">5x + 9x − 27 = 29<\/div><div class=\"ps-f\">14x = 56<\/div><div class=\"ps-f\"><span class=\"ok\">x = 4<\/span><\/div><div class=\"ps-f\"><span class=\"note\">thus<\/span> <span class=\"ok\">y = 3<\/span><\/div><\/div><\/div>","plain":"Get one variable by itself in one equation (here <span class=\"m\">y = 3x − 9<\/span>). Then replace that variable in the other equation with what it equals. Now you have one equation with one unknown, which you can solve; then go back and find the other variable.","fun":"If one of the linear equations already has a variable isolated, then it’s probably easier to implement the substitution method.","check":{"q":"If <span class=\"m\">y = 2x + 1<\/span> and <span class=\"m\">x + y = 13<\/span>, what is <span class=\"m\">x<\/span>?","choices":["3","4","5","6","9"],"a":"B · 4","why":"Substitute: <span class=\"m\">x + (2x + 1) = 13<\/span>, so <span class=\"m\">3x = 12<\/span> and <span class=\"m\">x = 4<\/span> (then <span class=\"m\">y = 9<\/span>)."}},"alg-10":{"title":"Three Possibilities","subj":"alg","page":10,"group":5,"body":"<p><b>System of Equations<\/b><\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>One Solution<\/h4><p><span class=\"note\">Most fall into this category<\/span><\/p><div class=\"ps-f\">3x + 3y = 21<\/div><div class=\"ps-f\">2x + 4y = 18<\/div><div class=\"ps-f\"><span class=\"ok\">(x, y) = (5, 2)<\/span><\/div><p><span class=\"note\">The ONLY solution<\/span><\/p><\/div><div class=\"ps-col\"><h4>Infinite Solutions<\/h4><p><span class=\"note\">If the two equations are equivalent<\/span><\/p><div class=\"ps-f\">x + y = 5<\/div><div class=\"ps-f\">2x + 2y = 10<\/div><p><span class=\"ok\">infinite solutions<\/span><\/p><\/div><div class=\"ps-col\"><h4>Zero Solutions<\/h4><p><span class=\"note\">If the coefficients are equal but the constants are not<\/span><\/p><div class=\"ps-f\">2x + y = 7<\/div><div class=\"ps-f\">2x + y = 3<\/div><p><span class=\"ok\">zero solutions<\/span><\/p><\/div><\/div>","plain":"Two linear equations can have one answer, infinitely many, or none. If one equation is just the other multiplied by a number, they are the same line: infinite solutions. If the left sides match but the right sides differ (<span class=\"m\">2x + y<\/span> can’t be 7 and 3 at once), there is no solution. Otherwise there is exactly one.","fun":"In the <span class=\"m\">xy<\/span>-coordinate plane, two linear equations with zero solutions appear as parallel lines.","check":{"q":"How many solutions does the system <span class=\"m\">3x − y = 4<\/span> and <span class=\"m\">6x − 2y = 9<\/span> have?","choices":["Zero","Exactly one","Exactly two","Infinitely many"],"a":"A · Zero","why":"Double the first equation: <span class=\"m\">6x − 2y = 8<\/span>. The same left side cannot equal both 8 and 9, so there is no solution."}},"alg-11":{"title":"The Quadratic Formula","subj":"alg","page":11,"group":5,"body":"<p><b>General Quadratic Equation:<\/b><\/p><div class=\"ps-f\">ax² + bx + c = 0<\/div><div class=\"ps-cols\"><div class=\"ps-col\"><div class=\"ps-box\"><div class=\"ps-box-h\">The Formula<\/div><div class=\"ps-f\">x = <span class=\"fr\"><span>−b ± √<span class=\"ov\">b² − 4ac<\/span><\/span><span>2a<\/span><\/span><\/div><\/div><\/div><div class=\"ps-col\"><div class=\"ps-ex\"><div class=\"ps-ex-h\">Example<\/div><div class=\"ps-f\">x² − 3x − 7 = 0<\/div><div class=\"ps-f\">x = <span class=\"fr\"><span>3 ± √<span class=\"ov\">(−3)² − 4(1)(−7)<\/span><\/span><span>2(1)<\/span><\/span><\/div><div class=\"ps-f\">x = <span class=\"fr\"><span>3 ± √37<\/span><span>2<\/span><\/span> <span class=\"note\">two solutions!<\/span><\/div><\/div><\/div><\/div>","plain":"Any equation of the form <span class=\"m\">ax² + bx + c = 0<\/span> can be solved with this formula. Read off a, b and c (watch the signs!), plug them in, and simplify. The ± means you usually get two answers: one with + and one with −.","fun":"The quadratic formula that applies to ALL cases was derived by Simon Stevin in 1594.","check":{"q":"Solve <span class=\"m\">x² − 4x + 1 = 0<\/span>.","choices":["<span class=\"m\">x = 2 ± √3<\/span>","<span class=\"m\">x = 4 ± √3<\/span>","<span class=\"m\">x = 2 ± √5<\/span>","<span class=\"m\">x = −2 ± √3<\/span>","<span class=\"m\">x = 1 ± √3<\/span>"],"a":"A · <span class=\"m\">x = 2 ± √3<\/span>","why":"a = 1, b = −4, c = 1: <span class=\"m\">x = (4 ± √(16 − 4))/2 = (4 ± √12)/2 = (4 ± 2√3)/2 = 2 ± √3<\/span>."}},"alg-12":{"title":"The Discriminant","subj":"alg","page":12,"group":5,"body":"<p class=\"ps-def\"><b>Cool tip:<\/b> you can calculate the discriminant of a quadratic to determine how many solutions it has.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><div class=\"ps-f\"><span class=\"fr\"><span>−b ± √<span class=\"ov\"><span class=\"hl\">b² − 4ac<\/span><\/span><\/span><span>2a<\/span><\/span><\/div><p><span class=\"note\">↑ discriminant<\/span><\/p><\/div><div class=\"ps-col\"><div class=\"ps-f\">b² − 4ac &gt; 0 &#160; <span class=\"note\">2 solutions<\/span><\/div><div class=\"ps-f\">b² − 4ac = 0 &#160; <span class=\"note\">1 solution<\/span><\/div><div class=\"ps-f\">b² − 4ac &lt; 0 &#160; <span class=\"note\">0 solutions<\/span><\/div><\/div><\/div>","plain":"The discriminant is the piece under the square root in the quadratic formula: <span class=\"m\">b² − 4ac<\/span>. Positive means two answers, zero means exactly one, negative means none (you can’t take the square root of a negative). This lets you count solutions without solving.","fun":"The quadratic formula, of which the discriminant is part, is derived through “completing the square”, also introduced in this group.","check":{"q":"For what value of <span class=\"m\">k<\/span> does <span class=\"m\">x² + 6x + k = 0<\/span> have exactly one solution?","choices":["3","6","9","12","36"],"a":"C · 9","why":"One solution means <span class=\"m\">b² − 4ac = 0<\/span>: <span class=\"m\">36 − 4k = 0<\/span>, so <span class=\"m\">k = 9<\/span>."}},"alg-13":{"title":"Factoring Quadratics","subj":"alg","page":13,"group":5,"body":"<p>Hate the quadratic formula? Try <span class=\"hl\">factoring<\/span>!<\/p><div class=\"ps-f\">x² + 10x + 16 = 0 &#160;→&#160; (x + 8)(x + 2) = 0<\/div><p><span class=\"note\">Turn this… Into this!<\/span><\/p><div class=\"ps-ex\"><div class=\"ps-ex-h\">How do I do this?<\/div><div class=\"ps-f\">x² + 7x − 30 = 0<\/div><p class=\"ps-step\"><b>step 1:<\/b> Find two integers, <span class=\"m\">m<\/span> and <span class=\"m\">n<\/span>, whose sum is 7 and product is −30 &#160; <span class=\"m\">m = 10, n = −3<\/span><\/p><p class=\"ps-step\"><b>step 2:<\/b> write in this form: <span class=\"m\">(x + m)(x + n) = 0<\/span><\/p><div class=\"ps-f\">(x + 10)(x − 3) = 0<\/div><\/div><p><span class=\"note\">Don’t forget! Not every quadratic can be factored!<\/span><\/p>","plain":"When the <span class=\"m\">x²<\/span> has no number in front, look for two whole numbers that <b>add<\/b> to the middle number and <b>multiply<\/b> to the last number. Put them into <span class=\"m\">(x + m)(x + n)<\/span>. Then each bracket can be zero, which gives the solutions (here <span class=\"m\">x = −10<\/span> or <span class=\"m\">x = 3<\/span>).","fun":"It’s possible to factor quadratics that have a coefficient greater than 1 on the <span class=\"m\">x²<\/span> term, but it can get messy.","check":{"q":"Which is the factored form of <span class=\"m\">x² − 2x − 24<\/span>?","choices":["<span class=\"m\">(x − 6)(x + 4)<\/span>","<span class=\"m\">(x + 6)(x − 4)<\/span>","<span class=\"m\">(x − 8)(x + 3)<\/span>","<span class=\"m\">(x − 12)(x + 2)<\/span>","<span class=\"m\">(x + 8)(x − 3)<\/span>"],"a":"A · <span class=\"m\">(x − 6)(x + 4)<\/span>","why":"We need numbers that add to −2 and multiply to −24: −6 and 4 work (−6 + 4 = −2, −6 × 4 = −24)."}},"alg-14":{"title":"Completing the Square","subj":"alg","page":14,"group":5,"body":"<p>Hate the quadratic formula AND can’t factor? Try <span class=\"hl\">completing the square<\/span>!<\/p><div class=\"ps-f\">x² + 6x + 4 = 0 &#160;→&#160; (x + 3)² − 5 = 0<\/div><p><span class=\"note\">Turn this… Into this!<\/span><\/p><div class=\"ps-ex\"><div class=\"ps-ex-h\">How?<\/div><p class=\"ps-step\"><b>step 1:<\/b> Move the constant term to the right side.<\/p><div class=\"ps-f\">x² + 6x = −4<\/div><p class=\"ps-step\"><b>step 2:<\/b> Square half of the <span class=\"m\">b<\/span> term (6) and add to both sides<\/p><div class=\"ps-f\">x² + 6x <span class=\"hl\">+ 9<\/span> = −4 <span class=\"hl\">+ 9<\/span><\/div><p class=\"ps-step\"><b>step 3:<\/b> Factor the left side and bring the constant back<\/p><div class=\"ps-f\">(x + 3)² − 5 = 0<\/div><\/div>","plain":"Completing the square rewrites <span class=\"m\">x² + bx + c<\/span> as (something)² plus a number. Take half of b, square it, and add it to both sides; the left side then becomes a perfect square like <span class=\"m\">(x + 3)²<\/span>. This form is handy for solving and for finding the smallest value of a quadratic.","fun":"The completing the square form is useful because it immediately illustrates the minimum value of the quadratic (−5 in the case above).","check":{"q":"Complete the square for <span class=\"m\">x² + 10x + 7 = 0<\/span>.","choices":["<span class=\"m\">(x + 5)² − 18 = 0<\/span>","<span class=\"m\">(x + 5)² + 18 = 0<\/span>","<span class=\"m\">(x + 10)² − 93 = 0<\/span>","<span class=\"m\">(x + 5)² − 32 = 0<\/span>","<span class=\"m\">(x + 5)² − 7 = 0<\/span>"],"a":"A · <span class=\"m\">(x + 5)² − 18 = 0<\/span>","why":"Half of 10 is 5, and 5² = 25: <span class=\"m\">x² + 10x + 25 = −7 + 25<\/span>, so <span class=\"m\">(x + 5)² = 18<\/span>, i.e. <span class=\"m\">(x + 5)² − 18 = 0<\/span>."}},"alg-15":{"title":"Absolute Value Quadratics","subj":"alg","page":15,"group":5,"body":"<p><b>How do you solve an absolute value quadratic?<\/b><\/p><div class=\"ps-f\">|x² + 5x| = 4<\/div><div class=\"ps-boxes\"><div class=\"ps-box\"><div class=\"ps-f\">x² + 5x = 4 &#160;→&#160; x² + 5x − 4 = 0<\/div><p><span class=\"note\">discriminant:<\/span> <span class=\"m\">5² − 4(1)(−4) = 41<\/span><\/p><\/div><div class=\"ps-box\"><div class=\"ps-f\">x² + 5x = −4 &#160;→&#160; x² + 5x + 4 = 0<\/div><p><span class=\"note\">discriminant:<\/span> <span class=\"m\">5² − 4(1)(4) = 9<\/span><\/p><\/div><\/div><p><span class=\"note\">Four total solutions!<\/span><\/p>","plain":"Treat it like any absolute value equation: split into \"inside = +4\" and \"inside = −4\". Each half is a quadratic, so use the discriminant on each to count its solutions. Here both discriminants are positive, so each gives 2 solutions: 4 in total.","fun":"Absolute value quadratics do not always have four solutions. Sometimes just zero, one, two, or three.","check":{"q":"How many real solutions does <span class=\"m\">|x² + 2x| = 3<\/span> have?","choices":["0","1","2","3","4"],"a":"C · 2","why":"<span class=\"m\">x² + 2x − 3 = 0<\/span> has discriminant <span class=\"m\">4 + 12 = 16 &gt; 0<\/span> (2 solutions: 1 and −3). <span class=\"m\">x² + 2x + 3 = 0<\/span> has discriminant <span class=\"m\">4 − 12 = −8 &lt; 0<\/span> (none). Total 2."}},"alg-16":{"title":"Inequalities","subj":"alg","page":16,"group":6,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Symbols<\/h4><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><td><span class=\"m\">&lt;<\/span><\/td><td><span class=\"hl\">less than<\/span><\/td><\/tr><tr><td><span class=\"m\">&gt;<\/span><\/td><td><span class=\"hl\">more than<\/span><\/td><\/tr><tr><td><span class=\"m\">≤<\/span><\/td><td><span class=\"hl\">less than or equal to<\/span><\/td><\/tr><tr><td><span class=\"m\">≥<\/span><\/td><td><span class=\"hl\">more than or equal to<\/span><\/td><\/tr><\/table><\/div><\/div><div class=\"ps-col\"><h4>On the number line<\/h4><p><span class=\"m\">x &gt; 3<\/span>: open circle at 3, shaded to the right.<\/p><p><span class=\"m\">−2 &lt; x ≤ 2<\/span>: open circle at −2, filled circle at 2, shaded between.<\/p><p><span class=\"m\">x &lt; −1; x &gt; 3<\/span>: open circles at −1 and 3, shaded to the left of −1 and to the right of 3.<\/p><\/div><\/div>","plain":"An inequality says one side is bigger or smaller, not equal. On a number line, an open circle means that number is NOT included (&lt; or &gt;), and a filled circle means it IS included (≤ or ≥). The shaded part shows every number that works.","fun":"On the number line a filled in circle (see above) means “equal to.”","check":{"q":"A number line has an open circle at −3, a filled circle at 1, and the part between them shaded. Which inequality does it show?","choices":["<span class=\"m\">−3 ≤ x &lt; 1<\/span>","<span class=\"m\">−3 &lt; x ≤ 1<\/span>","<span class=\"m\">−3 &lt; x &lt; 1<\/span>","<span class=\"m\">−3 ≤ x ≤ 1<\/span>","<span class=\"m\">x &lt; −3; x &gt; 1<\/span>"],"a":"B · <span class=\"m\">−3 &lt; x ≤ 1<\/span>","why":"Open circle at −3 means −3 is not included (&lt;); filled circle at 1 means 1 is included (≤)."},"fig":"<svg viewBox=\"0 0 600 330\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"300\" y=\"34\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\" font-style=\"italic\">x &gt; 3<\/text><line x1=\"36\" y1=\"60\" x2=\"564\" y2=\"60\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><polygon points=\"28,60 38,55 38,65\" style=\"fill:var(--blue)\"/><polygon points=\"572,60 562,55 562,65\" style=\"fill:var(--red)\"/><line x1=\"60\" y1=\"53\" x2=\"60\" y2=\"67\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"60\" y=\"86\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−5<\/text><line x1=\"108\" y1=\"53\" x2=\"108\" y2=\"67\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"108\" y=\"86\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−4<\/text><line x1=\"156\" y1=\"53\" x2=\"156\" y2=\"67\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"156\" y=\"86\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−3<\/text><line x1=\"204\" y1=\"53\" x2=\"204\" y2=\"67\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"204\" y=\"86\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−2<\/text><line x1=\"252\" y1=\"53\" x2=\"252\" y2=\"67\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"252\" y=\"86\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−1<\/text><line x1=\"300\" y1=\"53\" x2=\"300\" y2=\"67\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"300\" y=\"86\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">0<\/text><line x1=\"348\" y1=\"53\" x2=\"348\" y2=\"67\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"348\" y=\"86\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">1<\/text><line x1=\"396\" y1=\"53\" x2=\"396\" y2=\"67\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"396\" y=\"86\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">2<\/text><line x1=\"444\" y1=\"53\" x2=\"444\" y2=\"67\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"444\" y=\"86\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">3<\/text><line x1=\"492\" y1=\"53\" x2=\"492\" y2=\"67\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"492\" y=\"86\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">4<\/text><line x1=\"540\" y1=\"53\" x2=\"540\" y2=\"67\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"540\" y=\"86\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">5<\/text><line x1=\"444\" y1=\"60\" x2=\"564\" y2=\"60\" fill=\"none\" style=\"stroke:var(--red)\" stroke-width=\"3\"/><circle cx=\"444\" cy=\"60\" r=\"6\" fill=\"none\" style=\"fill:var(--red-wash);stroke:var(--red)\" stroke-width=\"2\"/><text x=\"300\" y=\"144\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\" font-style=\"italic\">−2 &lt; x ≤ 2<\/text><line x1=\"36\" y1=\"170\" x2=\"564\" y2=\"170\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><polygon points=\"28,170 38,165 38,175\" style=\"fill:var(--blue)\"/><polygon points=\"572,170 562,165 562,175\" style=\"fill:var(--blue)\"/><line x1=\"60\" y1=\"163\" x2=\"60\" y2=\"177\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"60\" y=\"196\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−5<\/text><line x1=\"108\" y1=\"163\" x2=\"108\" y2=\"177\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"108\" y=\"196\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−4<\/text><line x1=\"156\" y1=\"163\" x2=\"156\" y2=\"177\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"156\" y=\"196\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−3<\/text><line x1=\"204\" y1=\"163\" x2=\"204\" y2=\"177\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"204\" y=\"196\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−2<\/text><line x1=\"252\" y1=\"163\" x2=\"252\" y2=\"177\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"252\" y=\"196\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−1<\/text><line x1=\"300\" y1=\"163\" x2=\"300\" y2=\"177\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"300\" y=\"196\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">0<\/text><line x1=\"348\" y1=\"163\" x2=\"348\" y2=\"177\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"348\" y=\"196\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">1<\/text><line x1=\"396\" y1=\"163\" x2=\"396\" y2=\"177\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"396\" y=\"196\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">2<\/text><line x1=\"444\" y1=\"163\" x2=\"444\" y2=\"177\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"444\" y=\"196\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">3<\/text><line x1=\"492\" y1=\"163\" x2=\"492\" y2=\"177\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"492\" y=\"196\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">4<\/text><line x1=\"540\" y1=\"163\" x2=\"540\" y2=\"177\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"540\" y=\"196\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">5<\/text><line x1=\"204\" y1=\"170\" x2=\"396\" y2=\"170\" fill=\"none\" style=\"stroke:var(--red)\" stroke-width=\"3\"/><circle cx=\"204\" cy=\"170\" r=\"6\" fill=\"none\" style=\"fill:var(--red-wash);stroke:var(--red)\" stroke-width=\"2\"/><circle cx=\"396\" cy=\"170\" r=\"6\" style=\"fill:var(--red);stroke:var(--red)\" stroke-width=\"2\"/><text x=\"300\" y=\"254\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\" font-style=\"italic\">x &lt; −1; x &gt; 3<\/text><line x1=\"36\" y1=\"280\" x2=\"564\" y2=\"280\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><polygon points=\"28,280 38,275 38,285\" style=\"fill:var(--red)\"/><polygon points=\"572,280 562,275 562,285\" style=\"fill:var(--red)\"/><line x1=\"60\" y1=\"273\" x2=\"60\" y2=\"287\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"60\" y=\"306\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−5<\/text><line x1=\"108\" y1=\"273\" x2=\"108\" y2=\"287\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"108\" y=\"306\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−4<\/text><line x1=\"156\" y1=\"273\" x2=\"156\" y2=\"287\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"156\" y=\"306\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−3<\/text><line x1=\"204\" y1=\"273\" x2=\"204\" y2=\"287\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"204\" y=\"306\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−2<\/text><line x1=\"252\" y1=\"273\" x2=\"252\" y2=\"287\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"252\" y=\"306\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−1<\/text><line x1=\"300\" y1=\"273\" x2=\"300\" y2=\"287\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"300\" y=\"306\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">0<\/text><line x1=\"348\" y1=\"273\" x2=\"348\" y2=\"287\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"348\" y=\"306\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">1<\/text><line x1=\"396\" y1=\"273\" x2=\"396\" y2=\"287\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"396\" y=\"306\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">2<\/text><line x1=\"444\" y1=\"273\" x2=\"444\" y2=\"287\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"444\" y=\"306\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">3<\/text><line x1=\"492\" y1=\"273\" x2=\"492\" y2=\"287\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"492\" y=\"306\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">4<\/text><line x1=\"540\" y1=\"273\" x2=\"540\" y2=\"287\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"540\" y=\"306\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">5<\/text><line x1=\"36\" y1=\"280\" x2=\"252\" y2=\"280\" fill=\"none\" style=\"stroke:var(--red)\" stroke-width=\"3\"/><line x1=\"444\" y1=\"280\" x2=\"564\" y2=\"280\" fill=\"none\" style=\"stroke:var(--red)\" stroke-width=\"3\"/><circle cx=\"252\" cy=\"280\" r=\"6\" fill=\"none\" style=\"fill:var(--red-wash);stroke:var(--red)\" stroke-width=\"2\"/><circle cx=\"444\" cy=\"280\" r=\"6\" fill=\"none\" style=\"fill:var(--red-wash);stroke:var(--red)\" stroke-width=\"2\"/><\/svg>"},"alg-17":{"title":"Solving Inequalities","subj":"alg","page":17,"group":6,"body":"<p class=\"ps-def\"><b>Pro tip:<\/b> Inequalities are solved just like regular algebraic equations, except for one wrinkle (see next slide)<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Example 1<\/h4><div class=\"ps-f\"><span class=\"note\">7 +<\/span> 3x − 7 &gt; 8 <span class=\"note\">+ 7<\/span><\/div><div class=\"ps-f\">3x &gt; 15<\/div><div class=\"ps-f\"><span class=\"note\">÷ 3<\/span> &#160; <span class=\"note\">÷ 3<\/span><\/div><div class=\"ps-f\">x &gt; 5<\/div><\/div><div class=\"ps-col\"><h4>Example 2<\/h4><div class=\"ps-f\"><span class=\"note\">7 ×<\/span> <span class=\"fr\"><span>x + 5<\/span><span>7<\/span><\/span> ≤ −2 <span class=\"note\">× 7<\/span><\/div><div class=\"ps-f\"><span class=\"note\">−5<\/span> x + 5 ≤ −14 <span class=\"note\">−5<\/span><\/div><div class=\"ps-f\">x ≤ −19<\/div><\/div><div class=\"ps-col\"><h4>Example 3<\/h4><div class=\"ps-f\"><span class=\"note\">20 ×<\/span> <span class=\"fr\"><span>x<\/span><span>5<\/span><\/span> &gt; <span class=\"fr\"><span>y<\/span><span>20<\/span><\/span> <span class=\"note\">× 5<\/span><\/div><div class=\"ps-f\">20x &gt; 5y<\/div><div class=\"ps-f\"><span class=\"note\">÷ 5<\/span> &#160; <span class=\"note\">÷ 5<\/span><\/div><div class=\"ps-f\">4x &gt; y<\/div><\/div><\/div>","plain":"Solve an inequality exactly like an equation: add, subtract, multiply or divide both sides by the same thing to get the variable alone. The inequality sign just stays where it is (the one exception is on the next slide).","fun":"Be careful when dividing by a variable. You don’t know whether that variable is negative or equal to zero!","check":{"q":"Solve <span class=\"m\"><span class=\"fr\"><span>x − 2<\/span><span>3<\/span><\/span> ≥ 4<\/span>.","choices":["<span class=\"m\">x ≥ 6<\/span>","<span class=\"m\">x ≥ 10<\/span>","<span class=\"m\">x ≥ 14<\/span>","<span class=\"m\">x ≤ 14<\/span>","<span class=\"m\">x ≥ 18<\/span>"],"a":"C · <span class=\"m\">x ≥ 14<\/span>","why":"Multiply both sides by 3: <span class=\"m\">x − 2 ≥ 12<\/span>. Add 2: <span class=\"m\">x ≥ 14<\/span>."}},"alg-18":{"title":"Inequalities Flipping","subj":"alg","page":18,"group":6,"body":"<p><b>Sometimes the sign flips!<\/b><\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Multiplying/Dividing by a negative<\/h4><div class=\"ps-f\">−3x &lt; 12<\/div><div class=\"ps-f\"><span class=\"note\">÷ −3<\/span> &#160; <span class=\"note\">÷ −3<\/span><\/div><div class=\"ps-f\">x <span class=\"hl\">&gt;<\/span> −4<\/div><p><span class=\"note\">FLIP!<\/span><\/p><\/div><div class=\"ps-col\"><h4>Absolute Value<\/h4><p><span class=\"note\"><u>Two<\/u> inequalities created<\/span><\/p><div class=\"ps-f\">|x| &gt; 10<\/div><div class=\"ps-f\">x &gt; 10<\/div><div class=\"ps-f\">x <span class=\"hl\">&lt;<\/span> −10<\/div><p><span class=\"note\">FLIP!<\/span><\/p><\/div><div class=\"ps-col\"><h4>Square roots<\/h4><p><span class=\"note\"><u>Two<\/u> inequalities created<\/span><\/p><div class=\"ps-f\">x² &gt; 9<\/div><div class=\"ps-f\">x &gt; 3<\/div><div class=\"ps-f\">x <span class=\"hl\">&lt;<\/span> −3<\/div><p><span class=\"note\">FLIP!<\/span><\/p><\/div><\/div>","plain":"Three times the sign turns around. (1) When you multiply or divide both sides by a negative number. (2) With absolute value: <span class=\"m\">|x| &gt; 10<\/span> splits into <span class=\"m\">x &gt; 10<\/span> or <span class=\"m\">x &lt; −10<\/span>. (3) With squares: <span class=\"m\">x² &gt; 9<\/span> splits into <span class=\"m\">x &gt; 3<\/span> or <span class=\"m\">x &lt; −3<\/span>. Forgetting the flip is a classic GRE trap.","fun":"If you had an odd power inequality, say <span class=\"m\">x³ &gt; 8<\/span>, the sign would NOT flip when you take the cube root of each side.","check":{"q":"Solve <span class=\"m\">−4x ≤ 20<\/span>.","choices":["<span class=\"m\">x ≤ −5<\/span>","<span class=\"m\">x ≥ −5<\/span>","<span class=\"m\">x ≤ 5<\/span>","<span class=\"m\">x ≥ 5<\/span>","<span class=\"m\">x ≥ −80<\/span>"],"a":"B · <span class=\"m\">x ≥ −5<\/span>","why":"Divide both sides by −4, which is negative, so the sign flips: <span class=\"m\">x ≥ −5<\/span>."}},"alg-19":{"title":"Functions","subj":"alg","page":19,"group":6,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><div class=\"ps-f\">f(x) = 2x + 3<\/div><p><span class=\"m\">x<\/span> = input<\/p><p><span class=\"m\">f(x)<\/span> = output<\/p><p>A machine: put in <span class=\"hl\"><span class=\"m\">x = 4<\/span><\/span>, out comes <span class=\"hl\"><span class=\"m\">f(x) = 11<\/span><\/span>.<\/p><p><span class=\"note\">Think of it like a machine<\/span><\/p><\/div><div class=\"ps-col\"><div class=\"ps-f\">f(3x) = f(x)²<\/div><p><span class=\"note\">f(3x): triple the input<\/span> &#160; <span class=\"note\">f(x)²: square the output<\/span><\/p><div class=\"ps-f\">f(2) = 5<\/div><p><span class=\"note\">triple ↓ &#160; square ↓<\/span><\/p><div class=\"ps-f\">f(6) = 25<\/div><p><span class=\"note\">triple ↓ &#160; square ↓<\/span><\/p><div class=\"ps-f\">f(18) = 625<\/div><\/div><\/div>","plain":"A function is a rule that turns an input into an output. <span class=\"m\">f(4)<\/span> means \"put 4 in place of x\": <span class=\"m\">2(4) + 3 = 11<\/span>. Some GRE questions just describe a rule, like <span class=\"m\">f(3x) = f(x)²<\/span>: tripling the input squares the output, so you can hop from one known value to the next.","fun":"It’s not uncommon to see an ‘embedded’ function, where the output of one function is the input of another: <span class=\"m\">f(g(x))<\/span>","check":{"q":"A function satisfies <span class=\"m\">f(2x) = 3·f(x)<\/span>, and <span class=\"m\">f(1) = 4<\/span>. What is <span class=\"m\">f(4)<\/span>?","choices":["12","16","24","36","48"],"a":"D · 36","why":"Doubling the input triples the output: <span class=\"m\">f(2) = 3 × 4 = 12<\/span>, then <span class=\"m\">f(4) = 3 × 12 = 36<\/span>."}},"alg-20":{"title":"Domain and Range","subj":"alg","page":20,"group":6,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><p><span class=\"hl\">domain:<\/span> possible input values<\/p><div class=\"ps-f\">f(x) = <span class=\"fr\"><span>x + 9<\/span><span>(x − 3)(x + 4)<\/span><\/span><\/div><h4>domain<\/h4><p><span class=\"m\">x<\/span> = all real values except 3 or −4<\/p><\/div><div class=\"ps-col\"><p><span class=\"hl\">range:<\/span> possible output values<\/p><div class=\"ps-f\">f(x) = √<span class=\"ov\">x + 7<\/span><\/div><h4>range<\/h4><p><span class=\"m\">f(x)<\/span> = zero and all positive real values<\/p><\/div><\/div>","plain":"The domain is every x you are allowed to put in; the range is every answer that can come out. You can’t divide by zero, so x-values that make a denominator zero are left out of the domain. A square root never gives a negative answer, so its range is 0 and up.","fun":"The concept of “domain” is why a quadratic equation with a negative discriminant has zero real solutions.","check":{"q":"Which value is NOT in the domain of <span class=\"m\">f(x) = <span class=\"fr\"><span>x + 1<\/span><span>x − 6<\/span><\/span><\/span>?","choices":["−6","−1","0","1","6"],"a":"E · 6","why":"At <span class=\"m\">x = 6<\/span> the denominator is <span class=\"m\">6 − 6 = 0<\/span>, and you can’t divide by zero. (At <span class=\"m\">x = −1<\/span> the top is 0, which is fine.)"}},"alg-21":{"title":"Even and Odd Functions","subj":"alg","page":21,"group":6,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>even functions<\/h4><div class=\"ps-f\">f(−x) = f(x)<\/div><p><span class=\"note\">f(−x): make input negative<\/span> &#160; <span class=\"note\">f(x): output stays the same<\/span><\/p><div class=\"ps-ex\"><div class=\"ps-ex-h\">example<\/div><div class=\"ps-f\">f(x) = x²<\/div><div class=\"ps-f\">f(2) = 4<\/div><div class=\"ps-f\">f(−2) = 4<\/div><\/div><\/div><div class=\"ps-col\"><h4>odd functions<\/h4><div class=\"ps-f\">f(−x) = −f(x)<\/div><p><span class=\"note\">f(−x): make input negative<\/span> &#160; <span class=\"note\">−f(x): output number is the same but negative<\/span><\/p><div class=\"ps-ex\"><div class=\"ps-ex-h\">example<\/div><div class=\"ps-f\">f(x) = x³<\/div><div class=\"ps-f\">f(2) = 8<\/div><div class=\"ps-f\">f(−2) = −8<\/div><\/div><\/div><\/div>","plain":"Test a function by putting in −x instead of x. If you get back exactly the same output, it is <b>even<\/b> (like <span class=\"m\">x²<\/span>: 2 and −2 both give 4). If you get the same number but with the opposite sign, it is <b>odd<\/b> (like <span class=\"m\">x³<\/span>: 8 and −8).","fun":"If all terms of a function have even exponents, the function is even; if all terms have odd exponents, the function is odd. A mix is neither.","check":{"q":"Which function is odd?","choices":["<span class=\"m\">f(x) = x²<\/span>","<span class=\"m\">f(x) = x³ + x<\/span>","<span class=\"m\">f(x) = x⁴ + 1<\/span>","<span class=\"m\">f(x) = x³ + 1<\/span>","<span class=\"m\">f(x) = |x|<\/span>"],"a":"B · <span class=\"m\">f(x) = x³ + x<\/span>","why":"<span class=\"m\">f(−x) = (−x)³ + (−x) = −x³ − x = −(x³ + x) = −f(x)<\/span>. Choice D fails because the +1 does not change sign."}},"alg-22":{"title":"Words to Algebra I","subj":"alg","page":22,"group":6,"body":"<div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><th>+<\/th><th>−<\/th><th>×<\/th><th>÷<\/th><\/tr><tr><td>addition<\/td><td>minus<\/td><td>times<\/td><td>divided by<\/td><\/tr><tr><td>plus<\/td><td>difference<\/td><td>product<\/td><td>over<\/td><\/tr><tr><td>sum<\/td><td>less than<\/td><td>of<\/td><td>half of/third of<\/td><\/tr><tr><td>more<\/td><td>decrease/fall<\/td><td>increase by a factor<\/td><td>decrease by a factor<\/td><\/tr><tr><td>larger/bigger<\/td><td>smaller<\/td><td>twice/triple<\/td><td>ratio<\/td><\/tr><tr><td>added to<\/td><td>under<\/td><td>into<\/td><td>slices/cut into<\/td><\/tr><tr><td>in excess of<\/td><td>remaining<\/td><td>quadruple<\/td><td>halve/quarter<\/td><\/tr><\/table><\/div>","plain":"Word problems hide the math operations inside everyday words. \"Sum\", \"more\" and \"in excess of\" mean add; \"difference\", \"less than\" and \"remaining\" mean subtract; \"product\", \"of\" and \"twice\" mean multiply; \"over\", \"ratio\" and \"half of\" mean divide. Careful with \"less than\": \"7 less than n\" is <span class=\"m\">n − 7<\/span>, not <span class=\"m\">7 − n<\/span>.","fun":"The list above is of course not exhaustive. There are many different ways to indicate operations via words.","check":{"q":"Translate: \"7 less than twice a number <span class=\"m\">n<\/span>\".","choices":["<span class=\"m\">7 − 2n<\/span>","<span class=\"m\">2n − 7<\/span>","<span class=\"m\">2(n − 7)<\/span>","<span class=\"m\">2n + 7<\/span>","<span class=\"m\"><span class=\"fr\"><span>2n<\/span><span>7<\/span><\/span><\/span>"],"a":"B · <span class=\"m\">2n − 7<\/span>","why":"\"Twice a number\" is <span class=\"m\">2n<\/span>; \"7 less than\" that means take 7 away from it: <span class=\"m\">2n − 7<\/span>."}},"alg-23":{"title":"Words to Algebra II","subj":"alg","page":23,"group":6,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>=<\/h4><ul class=\"ps-list\"><li>equal to<\/li><li>equivalent<\/li><li>is<\/li><li>equates to<\/li><li>corresponds to<\/li><li>the same as<\/li><\/ul><\/div><div class=\"ps-col\"><h4>powers<\/h4><ul class=\"ps-list\"><li>squared<\/li><li>cubed<\/li><li>raised to<\/li><li>to the n<sup>th<\/sup> power<\/li><li>to the n<sup>th<\/sup> degree<\/li><li>times itself <span class=\"m\">n<\/span> times<\/li><\/ul><\/div><div class=\"ps-col\"><h4>decimal movement<\/h4><p>move a decimal <span class=\"m\">n<\/span> places to the right<\/p><div class=\"ps-f\">× 10ⁿ<\/div><p>move a decimal <span class=\"m\">n<\/span> places to the left<\/p><div class=\"ps-f\">÷ 10ⁿ<\/div><\/div><\/div>","plain":"More translation words: \"is\", \"equivalent\" and \"the same as\" mean =. \"Squared\", \"cubed\" and \"raised to\" mean a power. Moving the decimal point n places right is the same as multiplying by <span class=\"m\">10ⁿ<\/span>; moving it left is dividing by <span class=\"m\">10ⁿ<\/span>.","fun":"You should also not forget words like “reciprocal” when it comes to translating words into algebraic expressions or equations.","check":{"q":"Moving the decimal point in 0.0372 three places to the right gives the same result as which operation?","choices":["<span class=\"m\">0.0372 ÷ 10³<\/span> = 0.0000372","<span class=\"m\">0.0372 × 10³<\/span> = 37.2","<span class=\"m\">0.0372 × 10²<\/span> = 3.72","<span class=\"m\">0.0372 × 3<\/span> = 0.1116"],"a":"B · <span class=\"m\">0.0372 × 10³<\/span> = 37.2","why":"Moving right n places means multiplying by <span class=\"m\">10ⁿ<\/span>: <span class=\"m\">0.0372 × 1000 = 37.2<\/span>."}},"alg-24":{"title":"Simple Interest","subj":"alg","page":24,"group":6,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><p>graph representation: a straight line going up <span class=\"note\">linear growth<\/span><\/p><div class=\"ps-ex\"><div class=\"ps-ex-h\"><span class=\"note\">$100 at 5% a year<\/span><\/div><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><td>year 1:<\/td><td>$105<\/td><td><span class=\"note\">+5<\/span><\/td><\/tr><tr><td>year 2:<\/td><td>$110<\/td><td><span class=\"note\">+5<\/span><\/td><\/tr><tr><td>year 3:<\/td><td>$115<\/td><td><span class=\"note\">+5<\/span><\/td><\/tr><tr><td>year 4:<\/td><td>$120<\/td><td><span class=\"note\">+5<\/span><\/td><\/tr><\/table><\/div><\/div><p><span class=\"note\">With simple interest, you get the same amount of interest every year.<\/span><\/p><\/div><div class=\"ps-col\"><h4>Formulas<\/h4><p><span class=\"hl\"><span class=\"m\">p<\/span> = principal &#160; <span class=\"m\">r<\/span> = rate &#160; <span class=\"m\">t<\/span> = years<\/span><\/p><div class=\"ps-f\">interest = <span class=\"fr\"><span>prt<\/span><span>100<\/span><\/span><\/div><div class=\"ps-f\">interest + principal = p + <span class=\"fr\"><span>prt<\/span><span>100<\/span><\/span><\/div><\/div><\/div>","plain":"With simple interest you earn the same amount every year, always calculated on the original money (the principal). So the total grows in a straight line. Interest = principal × rate (as a percent) × years ÷ 100.","fun":"Only when compound interest compounds twice (or more) does it start to exceed simple interest.","check":{"q":"$200 is invested at 4% simple interest per year. What is the total (interest + principal) after 3 years?","choices":["$208","$224","$224.97","$232","$248"],"a":"B · $224","why":"Interest = <span class=\"m\"><span class=\"fr\"><span>200 × 4 × 3<\/span><span>100<\/span><\/span> = 24<\/span>, so the total is <span class=\"m\">200 + 24 = 224<\/span>."},"fig":"<svg viewBox=\"0 0 480 160\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"60\" y1=\"135\" x2=\"300\" y2=\"35\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"3\"/><polygon points=\"312,30 296,30 302,44\" style=\"fill:var(--blue)\"/><text x=\"300\" y=\"100\" style=\"fill:var(--ink)\" font-size=\"14\">linear growth<\/text><\/svg>"},"alg-25":{"title":"Compound Interest","subj":"alg","page":25,"group":6,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><p>graph representation: a curve that gets steeper and steeper <span class=\"note\">exponential growth<\/span><\/p><div class=\"ps-ex\"><div class=\"ps-ex-h\"><span class=\"note\">$100 at 5% a year<\/span><\/div><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><td>year 1:<\/td><td>$105<\/td><td><span class=\"note\">+5.00<\/span><\/td><\/tr><tr><td>year 2:<\/td><td>$110.25<\/td><td><span class=\"note\">+5.25<\/span><\/td><\/tr><tr><td>year 3:<\/td><td>$115.76<\/td><td><span class=\"note\">+5.51<\/span><\/td><\/tr><tr><td>year 4:<\/td><td>$121.55<\/td><td><span class=\"note\">+5.79<\/span><\/td><\/tr><\/table><\/div><\/div><p><span class=\"note\">With compound interest, you get more interest every year.<\/span><\/p><\/div><div class=\"ps-col\"><h4>Formula<\/h4><p><span class=\"hl\"><span class=\"m\">p<\/span> = principal &#160; <span class=\"m\">r<\/span> = rate &#160; <span class=\"m\">t<\/span> = years<\/span><\/p><p><span class=\"hl\"><span class=\"m\">n<\/span> = number of compounds per year<\/span><\/p><div class=\"ps-f\">interest + principal = p(1 + <span class=\"fr\"><span>r<\/span><span>n<\/span><\/span>)<sup>nt<\/sup><\/div><\/div><\/div>","plain":"With compound interest, each period’s interest is added to the balance, and the next interest is calculated on that bigger balance. So you earn a little more every time and the total curves upward. In the formula, write the rate r as a decimal (5% = 0.05), and n is how many times a year it compounds.","fun":"If the interest compounds quarterly, for example, you divide the rate by four in the formula; every month, you divide by 12.","check":{"q":"$400 is invested at 10% annual interest, compounded twice a year (semiannually). What is the total after 1 year?","choices":["$420","$440","$441","$484","$800"],"a":"C · $441","why":"<span class=\"m\">400(1 + <span class=\"fr\"><span>0.10<\/span><span>2<\/span><\/span>)<sup>2×1<\/sup> = 400(1.05)² = 400 × 1.1025 = 441<\/span>."},"fig":"<svg viewBox=\"0 0 480 160\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M60,135 C190,128 270,110 320,22\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"3\"/><text x=\"300\" y=\"110\" style=\"fill:var(--ink)\" font-size=\"14\">exponential growth<\/text><\/svg>"},"alg-26":{"title":"Mixture Problems","subj":"alg","page":26,"group":6,"body":"<p>If three solutions containing alcohol are mixed together, the combined solution is what percentage alcohol?<\/p><p>50 mL (12% alcohol) <span class=\"hl\">+<\/span> 70 mL (8% alcohol) <span class=\"hl\">+<\/span> 40 mL (22% alcohol)<\/p><div class=\"ps-box\"><div class=\"ps-f\"><span class=\"fr\"><span>alcohol<\/span><span>total<\/span><\/span> → <span class=\"fr\"><span>(.12)(50) + (.08)(70) + (.22)(40)<\/span><span>50 + 70 + 40<\/span><\/span> → <span class=\"fr\"><span>6 + 5.6 + 8.8<\/span><span>160<\/span><\/span> → <span class=\"fr\"><span>20.4<\/span><span>160<\/span><\/span><\/div><\/div><div class=\"ps-f\"><span class=\"ok\">12.75%<\/span><\/div>","plain":"To find the strength of a mixture, work out how much pure alcohol each part brings (percent × volume), add those up, and divide by the total volume. You cannot simply average the percents, because the parts are different sizes.","fun":"Bronze was the first manmade alloy, a mixture of copper and tin.","check":{"q":"100 mL of a 10% salt solution is mixed with 300 mL of a 30% salt solution. What percent salt is the mixture?","choices":["15%","20%","22.5%","25%","27.5%"],"a":"D · 25%","why":"Salt: <span class=\"m\">(0.10)(100) + (0.30)(300) = 10 + 90 = 100<\/span> mL. Total: 400 mL. <span class=\"m\">100 ÷ 400 = 25%<\/span>."}},"alg-27":{"title":"The Mixture Trick","subj":"alg","page":27,"group":6,"body":"<p>Solution A contains 12% alcohol and solution B contains 25%. When they are mixed together, the combined solution contains 17% alcohol. In the combined solution, what is the ratio of solution A to solution B?<\/p><p><span class=\"note\">Solution A 12%<\/span> — <span class=\"m\">17 − 12 = 5<\/span> — <span class=\"note\">Combined 17%<\/span> — <span class=\"m\">25 − 17 = 8<\/span> — <span class=\"note\">Solution B 25%<\/span><\/p><div class=\"ps-f\"><span class=\"fr\"><span>Solution A<\/span><span>Solution B<\/span><\/span> = <span class=\"fr\"><span>8<\/span><span>5<\/span><\/span><\/div>","plain":"Put the three percents on a line: A, the mix, and B. Find the gap from A to the mix (5) and from the mix to B (8). The amounts are in the <b>opposite<\/b> ratio of the gaps: the mix is closer to A, so there is more of A. Here A : B = 8 : 5.","fun":"Fertilizers contain three primary ingredients: nitrogen, potassium, and phosphorus. One typical ratio of the three is 3:2:1.","check":{"q":"Solution A is 10% acid and solution B is 30% acid. They are mixed to make a 15% acid solution. What is the ratio of A to B?","choices":["1 : 3","1 : 2","2 : 1","3 : 1","3 : 2"],"a":"D · 3 : 1","why":"Gaps: <span class=\"m\">15 − 10 = 5<\/span> and <span class=\"m\">30 − 15 = 15<\/span>. Flip them: A : B = 15 : 5 = 3 : 1. (Check: 3 parts at 10% + 1 part at 30% = 60 ÷ 4 = 15%.)"},"fig":"<svg viewBox=\"0 0 600 170\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"60.0\" y1=\"80\" x2=\"540.0\" y2=\"80\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"3\"/><circle cx=\"60.0\" cy=\"80\" r=\"7\" style=\"fill:var(--blue)\"/><circle cx=\"244.6\" cy=\"80\" r=\"7\" style=\"fill:var(--red)\"/><circle cx=\"540.0\" cy=\"80\" r=\"7\" style=\"fill:var(--blue)\"/><text x=\"152.3\" y=\"45\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">17 − 12<\/text><text x=\"152.3\" y=\"66\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">5<\/text><text x=\"392.3\" y=\"45\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">25 − 17<\/text><text x=\"392.3\" y=\"66\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">8<\/text><text x=\"60.0\" y=\"112\" text-anchor=\"middle\" style=\"fill:var(--red)\" font-size=\"14\">Solution A<\/text><text x=\"60.0\" y=\"132\
