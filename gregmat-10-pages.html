 2 = 16.",null],"ari-6":["How many integers from a to b: b − a + 1. From 13 to 92: 80.","Forgetting the +1."],"ari-7":["Sum of a run = count × middle value = n(first + last)/2. 50 to 300: 251 × 175 = 43,925.",null],"ari-8":["Integers that multiply to give the number: (3)(6)(10) = 180, so 3, 6 and 10 are factors of 180. Every factor has a negative twin.",null],"ari-9":["List factor pairs from the outside in: 1×30, 2×15, 3×10, 5×6. Stop when the pairs meet.",null],"ari-10":["Greatest common factor: the biggest number that divides both. GCF(60, 90) = 30.",null],"ari-11":["E ± E = E, O ± O = E, E ± O = O. One even factor makes a product even. 0 is even.",null],"ari-12":["A multiple is the number × an integer: 70 is a multiple of 2, 5, 7, 10, 14, 35 and 70 itself. 0 is a multiple of every integer.",null],"ari-13":["Least common multiple: the smallest positive number both divide into. LCM(15, 24) = 120.",null],"ari-14":["(last multiple − first multiple) ÷ k + 1. Multiples of 3 from 29 to 112: (111 − 30)/3 + 1 = 28.","Use the first and last <b>multiples<\/b>, not the ends of the range."],"ari-15":["Multiples are evenly spaced, so sum = count × middle. Multiples of 6 from 75 to 286: 35 × 180 = 6,300.",null],"ari-16":["3 or 9: digit sum divisible by 3 or 9. 4: last two digits. 5: ends in 0 or 5. 6: by 2 and by 3. 7 and 8: use the calculator.",null],"ari-17":["Exactly two factors, 1 and itself. 1 is not prime; 2 is the only even prime; there are 25 primes below 100.",null],"ari-18":["Every integer above 1 breaks into primes in exactly one way: 56 = 2<sup>3<\/sup>·7, 3,465 = 3<sup>2<\/sup>·5·7·11.",null],"ari-19":["Test only the primes below √n. 347: √347 ≈ 18.6, so test 2 to 17. None divide, so it is prime.",null],"ari-20":["Any product of the pieces of n! divides n!: 8 × 6 = 48 and 5 × 4 × 3 = 60 both divide 8!. 8! has 96 factors.",null],"ari-21":["A prime bigger than n never divides n!, and nor do its multiples: 11, 22 and 33 do not divide 8!.",null],"ari-22":["How many p's in n!: n/p + n/p<sup>2<\/sup> + n/p<sup>3<\/sup> … (whole parts only). 3s in 30!: 10 + 3 + 1 = 14.","Works for primes only."],"ari-23":["Trailing zeros of n! = number of 5s. 100!: 20 + 4 = 24 zeros.",null],"ari-24":["Zero is even, neither positive nor negative, a multiple of every integer. Never divide by 0. a<sup>0<\/sup> = 1 and 0! = 1.",null],"ari-25":["Primes never run out: multiply any list of primes and add 1, and a new prime appears (2·3·5 + 1 = 31).",null],"ari-26":["Number of factors: prime-factorise, add 1 to each exponent, multiply. 3,000 = 2<sup>3<\/sup>·3·5<sup>3<\/sup> → 4·2·4 = 32.",null],"ari-27":["Odd factors: drop the 2s, then add 1 and multiply. Even factors: keep the 2's exponent as it is. 2,600 = 2<sup>3<\/sup>·5<sup>2<\/sup>·13 → 6 odd, 18 even.",null],"ari-28":["GCF: the primes both share, each at its <b>smaller<\/b> power. 720 = 2<sup>4<\/sup>3<sup>2<\/sup>5, 1764 = 2<sup>2<\/sup>3<sup>2<\/sup>7<sup>2<\/sup> → 2<sup>2<\/sup>3<sup>2<\/sup> = 36.",null],"ari-29":["LCM: every prime from either, each at its <b>bigger<\/b> power. LCM(126, 132) = 2<sup>2<\/sup>·3<sup>2<\/sup>·7·11 = 2,772. “When do they line up again?” is an LCM.",null],"ari-30":["Units digits cycle. Every 4: 2 (2,4,8,6), 3 (3,9,7,1), 7 (7,9,3,1), 8 (8,4,2,6). Every 2: 4 (4,6), 9 (9,1). Never change: 0, 1, 5, 6.",null],"ari-31":["23 ÷ 7 = 3 remainder 2, because 23 = 7·3 + 2. The remainder is always smaller than the divisor.",null],"ari-32":["Small ÷ big: 7 ÷ 13 is 0 remainder 7. Remainders are never negative: −19 = 6(−4) + 5, so the remainder is 5.",null],"ari-33":["Huge power? Find the cycle of remainders. 7<sup>n<\/sup> ÷ 5 cycles 2, 4, 3, 1; 31 = 4·7 + 3, so 7<sup>31<\/sup> leaves 3.",null],"ari-34":["Remainder of a sum: add the separate remainders, then take the remainder again. (7<sup>34<\/sup> + 9<sup>29<\/sup>) ÷ 5: 4 + 4 = 8 → 3.",null],"ari-35":["a/b with integer top and bottom. Proper (top smaller), improper (top bigger), mixed (3⅔), equivalent (7/8 = 14/16).",null],"ari-36":["Add or subtract only over a common bottom: 2/5 + 3/8 = 16/40 + 15/40 = 31/40.",null],"ari-37":["Multiply: top × top over bottom × bottom. Divide: flip the <b>second<\/b> fraction, then multiply.",null],"ari-38":["Irrational: cannot be a fraction of integers (√2, √3, π). Writing √2/1 does not count, since the top must be an integer.",null],"ari-39":["Each place is a power of 10: hundreds 10<sup>2<\/sup>, tens 10<sup>1<\/sup>, units 10<sup>0<\/sup>, tenths 10<sup>−1<\/sup>, hundredths 10<sup>−2<\/sup>.",null],"ari-40":["A simplified fraction ends as a decimal only if its bottom has nothing but 2s and 5s. Any other prime (3, 7, 11…) makes it repeat.",null],"ari-41":["Never ending and never repeating means irrational: π ≈ 3.14, √2 ≈ 1.41.",null],"ari-42":["Ending decimal: over 10, 100, 1000 (0.35 = 35/100 = 7/20). Repeating block: over the same number of 9s (0.5757… = 57/99).",null],"ari-43":["Look at the ONE digit to the right: 0–4 keep, 5–9 round up. 1.325861 → 1.3 (tenth), 1.33 (hundredth), 1.326 (thousandth).",null],"ari-44":["a<sup>m<\/sup>·a<sup>n<\/sup> = a<sup>m+n<\/sup>; a<sup>m<\/sup>/a<sup>n<\/sup> = a<sup>m−n<\/sup>; a<sup>−n<\/sup> = 1/a<sup>n<\/sup>; a<sup>0<\/sup> = 1 (a ≠ 0). Same base, equal powers → equal exponents.",null],"ari-45":["a<sup>n<\/sup>b<sup>n<\/sup> = (ab)<sup>n<\/sup>; (a/b)<sup>n<\/sup> = a<sup>n<\/sup>/b<sup>n<\/sup>; (a<sup>m<\/sup>)<sup>n<\/sup> = a<sup>mn<\/sup>.","A tower works top-down: a<sup>3<sup>3<sup>2<\/sup><\/sup><\/sup> = a<sup>3<sup>9<\/sup><\/sup> = a<sup>19,683<\/sup>, not a<sup>18<\/sup>."],"ari-46":["√ is the radical, the number under it the radicand. A root undoes a power: ∛8 = 2. Odd roots of negatives exist: ∛−8 = −2.",null],"ari-47":["<sup>n<\/sup>√(a<sup>m<\/sup>) = a<sup>m/n<\/sup>: the power goes on top, the root on the bottom. √a · ∛a<sup>2<\/sup> = a<sup>1/2 + 2/3<\/sup> = a<sup>7/6<\/sup>.",null],"ari-48":["(√a)<sup>2<\/sup> = a; √(a<sup>2<\/sup>) = |a|; √a·√b = √(ab); √a/√b = √(a/b). Even roots are never negative; odd roots keep the sign.",null],"ari-49":["Pull out pairs: √360 = √(2<sup>2<\/sup>·3<sup>2<\/sup>·10) = 6√10. Clear a root from the bottom: 6/√3 = 6√3/3 = 2√3.",null],"ari-50":["Every rational and irrational number has a place on the line. Place a root by its neighbours: 5<sup>3<\/sup> = 125, so ∛130 is just above 5.",null],"ari-51":["Order and grouping don't matter for + and ×. a(b + c) = ab + ac. a + 0 = a, a·1 = a, a·0 = 0.",null],"ari-52":["ab = 0 → a = 0 or b = 0 (or both). Never divide by 0. Two positives: sum and product positive. Two negatives: sum negative, product positive.",null],"ari-53":["(+)(−) is negative. |a + b| ≤ |a| + |b|; |a|·|b| = |ab|. If a &gt; 1, a<sup>2<\/sup> &gt; a.","If 0 &lt; a &lt; 1, squaring makes it <b>smaller<\/b>: a<sup>2<\/sup> &lt; a."],"ari-54":["|a| is distance from 0, so |a| = 3 → a = ±3. Read |a − c| = d as “a is d away from c”: |a − 2| = 2 → a = 0 or 4.",null],"ari-55":["a:b = a to b = a/b. A ratio is relative only: 2:3 could be 2 and 3, 4 and 6, 6 and 9…","Never take the ratio numbers as the real counts."],"ari-56":["Two equal ratios a/b = c/d: cross-multiply, ad = bc.",null],"ari-57":["Per cent = out of 100: 37% = 37/100 = 0.37.",null],"ari-58":["Percent change = change ÷ original. 12 → 17: 5/12 ≈ 41.7% up. $85 → $60: 25/85 ≈ 29.4% down.","Divide by where you started, not where you ended."],"ari-59":["30% more than a = 1.3a; 30% less = 0.7a. An increase can exceed 100%.","200% <b>of<\/b> a = 2a, but 200% <b>more than<\/b> a = 3a."],"ari-60":["One value, four ways: 1/2 = 0.50 = 1:2 = 50%; 3/4 = 0.75 = 3:4 = 75%; 7/5 = 1.4 = 7:5 = 140%.",null],"alg-1":["Terms joined by + or −. In 3x + 5: 3 is the coefficient, x the variable, 5 the constant. A constant alone is an expression too.",null],"alg-2":["Polynomial: whole-number powers only. A term's degree is the sum of its powers (5rt has degree 2); the polynomial's degree is its highest term.",null],"alg-3":["Combine like terms (same letters, same powers). FOIL: (x + 4)(2x − 5) = 2x<sup>2<\/sup> + 3x − 20. Factor out what's shared; cancel a bracket only if it isn't 0.",null],"alg-4":["(a + b)<sup>2<\/sup> = a<sup>2<\/sup> + 2ab + b<sup>2<\/sup>; (a − b)<sup>2<\/sup> = a<sup>2<\/sup> − 2ab + b<sup>2<\/sup>; a<sup>2<\/sup> − b<sup>2<\/sup> = (a + b)(a − b); ca ± cb = c(a ± b).","Forgetting the middle 2ab."],"alg-5":["Variables to the first power only. Do the same thing to both sides: 5x − 28 = 9x → −28 = 4x → x = −7.",null],"alg-6":["Split into inside = +k and inside = −k. |3x + 6| = 21 → x = 5 or x = −9.",null],"alg-7":["Two different equations in two unknowns usually fix one answer; one equation (x + y = 10) has endless answers.","Check the second equation isn't just the first times a number."],"alg-8":["Elimination: scale so one variable matches, then subtract. 3x − 5y = 14 and 2x + 2y = 4 → y = −1, x = 3.",null],"alg-9":["Substitution: isolate one (y = 3x − 9), plug it into the other. 5x + 3(3x − 9) = 29 → x = 4, y = 3.",null],"alg-10":["One solution (most systems). Infinite if one equation is a multiple of the other. None if the left sides match but the right sides differ.",null],"alg-11":["ax<sup>2<\/sup> + bx + c = 0 → x = (−b ± √(b<sup>2<\/sup> − 4ac)) / 2a. Usually two answers.","Read the signs of a, b and c carefully."],"alg-12":["Discriminant b<sup>2<\/sup> − 4ac: positive → 2 solutions, zero → 1, negative → none.",null],"alg-13":["x<sup>2<\/sup> + bx + c: find m, n with m + n = b and mn = c. x<sup>2<\/sup> + 7x − 30 = (x + 10)(x − 3) → x = −10 or 3.",null],"alg-14":["Complete the square: move c, add (b/2)<sup>2<\/sup> to both sides. x<sup>2<\/sup> + 6x + 4 = 0 → (x + 3)<sup>2<\/sup> − 5 = 0.",null],"alg-15":["|quadratic| = k: split into two quadratics (= k and = −k) and count each with the discriminant. |x<sup>2<\/sup> + 5x| = 4 has 4 solutions.",null],"alg-16":["Open circle for &lt; or &gt; (end not included); filled for ≤ or ≥. The shaded part is every value that works.",null],"alg-17":["Solve like an equation and the sign stays put: 3x − 7 &gt; 8 → 3x &gt; 15 → x &gt; 5.",null],"alg-18":["Flip the sign when you × or ÷ by a negative: −3x &lt; 12 → x &gt; −4. |x| &gt; 10 → x &gt; 10 or x &lt; −10. x<sup>2<\/sup> &gt; 9 → x &gt; 3 or x &lt; −3.","Forgetting the flip."],"alg-19":["A rule from input to output: f(x) = 2x + 3, f(4) = 11. Rule-only: f(3x) = f(x)<sup>2<\/sup> and f(2) = 5 → f(6) = 25 → f(18) = 625.",null],"alg-20":["Domain: inputs allowed (no zero denominators, no √ of negatives). Range: outputs possible (√ gives 0 and up).",null],"alg-21":["Even: f(−x) = f(x), like x<sup>2<\/sup>. Odd: f(−x) = −f(x), like x<sup>3<\/sup>.",null],"alg-22":["+: sum, more, in excess of. −: difference, less than, remaining. ×: product, of, twice. ÷: over, ratio, half of.","“7 less than n” is n − 7, not 7 − n."],"alg-23":["“is”, “equivalent”, “the same as” → =. Squared, cubed, raised to → a power. Decimal n places right = ×10<sup>n<\/sup>; left = ÷10<sup>n<\/sup>.",null],"alg-24":["Simple interest: the same amount every year. I = p·r·t/100; total = p + prt/100. A straight line.",null],"alg-25":["Compound: interest earns interest. Total = p(1 + r/n)<sup>nt<\/sup>, r as a decimal, n compounds a year. A curve.",null],"alg-26":["Pure amount = % × volume; add them; divide by the total volume. 12% of 50 + 8% of 70 + 22% of 40 = 20.4 of 160 = 12.75%.","You can't just average the percents."],"alg-27":["Put A, the mix and B on a line. The amounts are in the <b>reverse<\/b> ratio of the gaps: 12%, 17%, 25% → gaps 5 and 8 → A:B = 8:5.",null],"alg-28":["d = rt. Keep units matching: 12 miles at 40 mph = 0.3 h = 18 min.",null],"alg-29":["Toward each other or apart: add the speeds. Same direction, catching up: subtract them.",null],"alg-30":["Rate = 1/time. Helpers add, saboteurs subtract: 1/3 + 1/4 − 1/5 = 23/60 of a job an hour → about 2 h 36 min.",null],"geo-1":["A segment has two endpoints (equal segments are congruent). A line has arrows both ways and never ends.",null],"geo-2":["Acute &lt; 90°, right = 90° (little square), obtuse between 90° and 180°, straight = 180°.",null],"geo-3":["A line across two parallels makes only two sizes: all big angles equal, all small angles equal, big + small = 180°.",null],"geo-4":["A closed shape of 3 or more straight sides: triangle 3, quadrilateral 4, pentagon 5, octagon 8.",null],"geo-5":["a + b + c = 180°. An exterior angle equals the two far interior angles added, so it beats each of them.",null],"geo-6":["Interior angles add to (n − 2) × 180°: n − 2 triangles from one corner. Pentagon: 540°.",null],"geo-7":["One exterior angle at each corner always adds to 360°, whatever the number of sides.",null],"geo-8":["Regular polygon: each interior angle = (n − 2)180°/n; each exterior angle = 360°/n.",null],"geo-9":["Right: one 90°. Equilateral: three equal sides, 60° each. Isosceles: two equal sides and two equal base angles.",null],"geo-10":["The biggest angle faces the longest side; the smallest faces the shortest.","Double the angle does <b>not<\/b> mean double the side."],"geo-11":["Any two sides add to more than the third, so a missing side lies between their difference and their sum.",null],"geo-12":["Area = ½ × base × height. The height meets the base at 90°; it is not a slanted side.",null],"geo-13":["Congruent (same size and shape) by SSS or SAS.","AAA is not enough: it could be a bigger copy."],"geo-14":["ASA and AAS also prove congruence.","SSA does not: two different triangles can fit."],"geo-15":["Right triangles only: leg<sup>2<\/sup> + leg<sup>2<\/sup> = hypotenuse<sup>2<\/sup>.",null],"geo-16":["Whole-number right triangles: 3-4-5, 5-12-13, 8-15-17, 7-24-25, and any multiple (6-8-10, 9-12-15).",null],"geo-17":["30-60-90: x : x√3 : 2x, with x facing the 30°. Example 7, 7√3, 14.",null],"geo-18":["45-45-90: x : x : x√2. A leg = hypotenuse ÷ √2.",null],"geo-19":["Equilateral area = (√3/4)a<sup>2<\/sup>, or (half the side)<sup>2<\/sup> × √3. Side 6 → 9√3.",null],"geo-20":["Same three angles → same shape, sides in one ratio: 4:6:8 = 10:15:20.",null],"geo-21":["Parallelogram: both pairs of sides parallel. Rectangle: + 90° corners. Rhombus: + four equal sides. Square: both. Trapezoid: one parallel pair only.",null],"geo-22":["Parallelogram: opposite sides and angles equal, neighbours add to 180°. Isosceles trapezoid: equal legs, equal top angles, equal bottom angles.",null],"geo-23":["A diagonal of a square makes 45° pieces; of a rhombus, it halves the corners; of a rectangle or parallelogram, it makes equal alternate angles (rectangle pieces add to 90°).",null],"geo-24":["Rectangle or square: area = base × height = length × width.",null],"geo-25":["Parallelogram area = base × <b>perpendicular<\/b> height. Given only a slant side and an angle, drop a height and use 30-60-90 or 45-45-90.",null],"geo-26":["Trapezoid = average of the two parallel sides × height = (a + b)/2 × h. Top 4, bottom 6, height 3 → 15.",null],"geo-27":["A regular hexagon is 6 equilateral triangles: 6 × (half side)<sup>2<\/sup>√3. Side 4 → 24√3.",null],"geo-28":["A regular n-gon is n identical triangles: n × ½·s·h, with h from the centre to the middle of a side.",null],"geo-29":["Same perimeter, same number of sides: the regular shape has the most area. A square beats every other rectangle.",null],"geo-30":["Fixed perimeter: more sides, more area; the circle is the maximum. 60 ft of rope: square 225, hexagon ≈ 260, circle ≈ 287.",null],"geo-31":["Radius: centre to edge. Diameter = 2r, straight through the centre. Circumference: the distance around.",null],"geo-32":["A central angle cuts a sector (an area) and an arc (a length). A chord joins two points on the circle; the diameter is the longest chord.",null],"geo-33":["Circumference ÷ diameter = π for every circle.",null],"geo-34":["π ≈ 3.14 ≈ 22/7. Answers usually leave π in.",null],"geo-35":["On the same two endpoints, the central angle is twice the inscribed angle.",null],"geo-36":["C = 2πr = πd. Radius 5 → 10π.",null],"geo-37":["Arc = (angle/360) × 2πr. Radius 4, 80° → 16π/9.",null],"geo-38":["Area = πr<sup>2<\/sup>. Radius 3 → 9π.","Given the diameter? Halve it before squaring."],"geo-39":["Sector = (angle/360) × πr<sup>2<\/sup>. Radius 6, 60° → 6π.",null],"geo-40":["A tangent touches at one point, and the radius to that point is at 90° to it: a hidden right angle for Pythagoras.",null],"geo-41":["Central angle 60° → chord = radius (the triangle is equilateral). Other angles need trigonometry, which is not tested.",null],"geo-42":["Inscribed: inside, corners on the circle. Circumscribed about: around, every side touching.",null],"geo-43":["The biggest polygon that fits in a circle is the regular one: for four corners, a square whose diagonals are diameters.",null],"geo-44":["Concentric: one centre. Area grows with r<sup>2<\/sup>: double the radius → 4× the area; triple → 9×.",null],"geo-45":["Only three solids are tested: cube, rectangular solid, right cylinder.",null],"geo-46":["Not tested: sphere, cone, pyramid, prism.",null],"geo-47":["Cube volume = x<sup>3<\/sup>.",null],"geo-48":["Cube surface area = 6x<sup>2<\/sup> (six square faces).",null],"geo-49":["Rectangular solid volume = xyz.",null],"geo-50":["Rectangular solid surface = 2(xy + xz + yz): three pairs of faces.",null],"geo-51":["Cylinder volume = πr<sup>2<\/sup>h: the circle stacked h high.",null],"geo-52":["Cylinder surface = 2πr<sup>2<\/sup> + 2πrh: two lids plus the label (width 2πr, height h).",null],"geo-53":["Cube: for x &lt; 6 the surface 6x<sup>2<\/sup> is bigger; at x = 6 they are equal (216); for x &gt; 6 the volume x<sup>3<\/sup> wins.","In comparisons the answer can depend on the size."],"geo-54":["Cube diagonal (corner to far corner) = x√3.",null],"geo-55":["Box diagonal = √(x<sup>2<\/sup> + y<sup>2<\/sup> + z<sup>2<\/sup>).",null],"geo-56":["Treat a stack as one big box. 6 × 2 × 3 cubes: volume 36x<sup>3<\/sup>; surface 2(12 + 6 + 18)x<sup>2<\/sup> = 72x<sup>2<\/sup>.",null],"cg-1":["A point is (x, y): across, then up. Origin (0, 0). Quadrants I–IV run counter-clockwise from the upper right.",null],"cg-2":["Line (no ends), segment (two ends), parabola (U), circle, hyperbola (two separate pieces).",null],"cg-3":["Mirror in the y-axis: (−x, y). In the x-axis: (x, −y). Through the origin: (−x, −y).",null],"cg-4":["Symmetric about the y-axis: (a, b) and (−a, b). About the x-axis: (a, −b). About the origin: (−a, −b).",null],"cg-5":["Distance = √((x<sub>2<\/sub> − x<sub>1<\/sub>)<sup>2<\/sup> + (y<sub>2<\/sub> − y<sub>1<\/sub>)<sup>2<\/sup>): Pythagoras on the two gaps. (−5, 2) to (2, 5) = √58.",null],"cg-6":["y-intercept: set x = 0. x-intercept: set y = 0. Horizontal lines have no x-intercept; vertical lines no y-intercept. Intercepts of opposite sign → positive slope.",null],"cg-7":["Slope = (y<sub>2<\/sub> − y<sub>1<\/sub>)/(x<sub>2<\/sub> − x<sub>1<\/sub>) = rise/run. Flat 0; vertical undefined; up to the right +; down to the right −.","Keep the same order on top and bottom."],"cg-8":["The line y = x: points above it have y &gt; x, points below have x &gt; y.",null],"cg-9":["y = mx + b: m is the slope, b the y-intercept. −5x + 3y = 6 → y = (5/3)x + 2.",null],"cg-10":["Parallel: same slope. Perpendicular: negative reciprocals (2 and −1/2), product −1.",null],"cg-11":["A system's solution is where the lines cross. Algebra (elimination or substitution) is faster than drawing.",null],"cg-12":["≤ or ≥: solid line; &lt; or &gt;: dashed. “y &gt;” shade above; “y &lt;” shade below.",null],"cg-13":["Two inequalities: the answer is only where both shadings overlap.",null],"cg-14":["Every quadratic is a parabola. It meets the x-axis twice, once or never (x<sup>2<\/sup> − 4, x<sup>2<\/sup>, x<sup>2<\/sup> + 2).",null],"cg-15":["Factor → x-intercepts; the vertex is halfway between. x<sup>2<\/sup> − 2x − 3 = (x − 3)(x + 1) → vertex (1, −4).",null],"cg-16":["Won't factor? Complete the square: y = (x − h)<sup>2<\/sup> + k has vertex (h, k). (x + 3)<sup>2<\/sup> − 5 → (−3, −5).","(x + 3)<sup>2<\/sup> means h = −3."],"cg-17":["Don't recognise it? Make a table of easy x values and plot. Use only allowed inputs (no √ of a negative).",null],"cg-18":["Minimum of an upward parabola: plug in the x halfway between the intercepts, complete the square, or plot until y turns.",null],"cg-19":["b<sup>2<\/sup> − 4ac &gt; 0: crosses the x-axis twice; = 0: touches once; &lt; 0: misses it.",null],"cg-20":["(x − h)<sup>2<\/sup> + (y − k)<sup>2<\/sup> = r<sup>2<\/sup>: centre (h, k), flipping the signs you see; radius = √(right side).",null],"cg-21":["Messy circle: complete the square for x and for y. x<sup>2<\/sup> − 4x + y<sup>2<\/sup> + 6y = 12 → centre (2, −3), radius 5.",null],"cg-22":["y = |2x − 1|: a V that never goes below the x-axis, tip on the axis.",null],"cg-23":["y = |quadratic|: the part below the axis flips up, turning the U into a W.",null],"cg-24":["Turn 90° about the origin: swap the coordinates and make one negative. (4, 3) → (−3, 4) or (3, −4).",null],"cg-25":["Even function: mirror image across the y-axis (x<sup>2<\/sup>, |x|).",null],"cg-26":["Odd function: the same after a half-turn about the origin (x<sup>3<\/sup>, x).",null],"cg-27":["Where graphs meet: set the y's equal, solve for x, plug back. x + 2 = x<sup>2<\/sup> + 5x − 3 → (−5, −3) and (1, 3).",null],"cg-28":["A number added outside the brackets lifts the graph up; subtracted, it drops it down.",null],"cg-29":["Inside the brackets it moves the “wrong” way: (x + 2)<sup>2<\/sup> sits 2 to the LEFT, (x − 2)<sup>2<\/sup> 2 to the right.",null],"cg-30":["Multiply the x term by more than 1 → steeper, skinnier. By a fraction → flatter, wider.",null],"da-1":["Standard table lists values. Frequency table counts them (counts add to the total). Relative frequency gives percents (add to 100%).",null],"da-2":["Bar chart: one bar per category. Segmented bar: parts stacked, top piece = total − bottom. Histogram: touching bars of a frequency table.",null],"da-3":["Pie: part = % × total. Scatterplot: dots with a trend line. Line graph: change over time.",null],"da-4":["Mean (average), median (middle), mode (most common): one list can give three different answers.",null],"da-5":["Mean = sum ÷ count. Turn it round: sum = mean × count.",null],"da-6":["Order the list. Odd count: the middle one. Even count: average the two middles (3, 5, 6, 9, 9, 10 → 7.5).",null],"da-7":["The most frequent value; a tie gives more than one mode (3, 3, 6, 9, 9, 10 → 3 and 9).",null],"da-8":["Evenly spaced or symmetric list: mean = median = (first + last)/2.",null],"da-9":["Weighted mean = Σ(value × weight) ÷ total weight. With percent weights adding to 100%, just add the products: 73.5.",null],"da-10":["In an ordered list: least at the start, median in the middle, greatest at the end.",null],"da-11":["Quartiles cut an ordered list into four equal groups.",null],"da-12":["Q2 = the median; Q1 = median of the lower half; Q3 = median of the upper half. With an odd count, leave the median out of both halves.",null],"da-13":["At the p-th percentile = greater than p% of the data.",null],"da-14":["Spread is measured by the range, the interquartile range and the standard deviation; they give different numbers for one list.",null],"da-15":["Range = greatest − least. Only the two ends matter.",null],"da-16":["IQR = Q3 − Q1: the spread of the middle half.",null],"da-17":["Boxplot = five numbers: least, Q1, median, Q3, greatest. Box from Q1 to Q3, a line at the median, whiskers to the ends.",null],"da-18":["SD measures spread using every value. Often you can eyeball it: numbers farther apart → bigger SD.",null],"da-19":["If every value is the same distance d from the mean, SD = d. 6 and 10: mean 8, SD 2.",null],"da-20":["Mean → each distance → square and add → ÷ n → √. 3, 3, 7, 8, 9 → √(32/5) ≈ 2.53.",null],"da-21":["Whole population: divide by n. A sample: divide by n − 1, giving a slightly bigger SD.",null],"da-22":["Add or subtract the same number to every value: SD does not change.",null],"da-23":["Multiply or divide every value by k: SD is multiplied or divided by k.",null],"da-24":["Standardise: (value − mean) ÷ SD = how many SDs above (+) or below (−) the mean.",null],"da-25":["Set: order doesn't matter, no repeats, curly brackets. List: order matters, repeats allowed, always finite.",null],"da-26":["∅ is the empty set. |S| = number of elements. n elements → 2<sup>n<\/sup> subsets (counting ∅ and S): {2, 3, 4} has 8.",null],"da-27":["A ∩ B: in both (∩ for aNd). A ∪ B: everything from either, once (U for Union).",null],"da-28":["Overlap can be zero (separate) or total (one inside the other). If it isn't given, test both extremes.",null],"da-29":["Total = A + B − both (+ neither). 90 = 75 + 52 − both → both = 37.",null],"da-30":["Venn or a 2 × 2 table: fill rows and columns to their totals until “neither” falls out (pool/garage → 1 house).",null],"da-31":["Three groups, nobody in none: total = A + B + C − (exactly two) − 2(all three). 110 = 170 − x − 30 → x = 30.",null],"da-32":["Choice method: one blank per decision, options in each, multiply. Outfits 3·2·3; four seats 4! = 24; a deck 52!.",null],"da-33":["Order matters → permutation; order doesn't → combination. 3 people from 5: 60 permutations, 10 combinations.",null],"da-34":["Arrange, rank, first/second, in a row, route → permutation. Group, team, committee, pair, subset → combination.",null],"da-35":["P(n, r) = nPr = n!/(n − r)!. C(n, r) = nCr = (n over r) = n!/(r!(n − r)!).",null],"da-36":["P(10, 3) = 10!/7! = 10·9·8 = 720 ways to fill 1st, 2nd and 3rd.",null],"da-37":["Fill the restricted spot first. 3-digit numbers ending in two evens: 9·5·5. John at one of the ends: 2·3·2·1.","A 3-digit number can't start with 0."],"da-38":["Must sit together: glue them into one block, arrange the blocks, then × the arrangements inside: 4!·3! = 144.",null],"da-39":["Can't sit together = total − together: 6! − 2·5! = 720 − 240 = 480.",null],"da-40":["Repeated letters: n!/(a!·b!·c!…). MISSISSIPPI: 11!/(4!·4!·2!) = 34,650.",null],"da-41":["Round table: (n − 1)!, because turning everyone one seat gives the same seating. 4 people → 6.",null],"da-42":["C(10, 3) = 10!/(3!·7!) = 720 ÷ 3! = 120 groups of three.",null],"da-43":["C(n, r) = C(n, n − r): choosing who's in = choosing who's out. Biggest in the middle: 1, 6, 15, 20, 15, 6, 1.",null],"da-44":["Two separate groups: count each, then multiply. C(6, 3)·C(7, 2) = 20·21 = 420.",null],"da-45":["Write routes as words: 3 N and 4 E → 7!/(3!·4!) = 35 shortest routes.",null],"da-46":["Yes or no for each item → 2<sup>n<\/sup>. Eight toppings → 2<sup>8<\/sup> = 256, including none.",null],"da-47":["Probability = wanted outcomes ÷ all outcomes. A prime from 1–20: 8/20 = 2/5.",null],"da-48":["All outcomes fill an area of 1, so a missing piece = 1 − the others.",null],"da-49":["P(not A) = 1 − P(A). Not rolling a 6: 1 − 1/6 = 5/6.",null],"da-50":["Independent: one doesn't change the other's chances (a die and a coin). Rain and an umbrella are not independent.",null],"da-51":["Mutually exclusive: can't happen at the same time (win and lose one game; odd and 6 on one roll).",null],"da-52":["As circles: apart = exclusive; partly overlapping = independent (the usual GRE case); one inside the other = complete overlap.",null],"da-53":["Independent A <b>and<\/b> B: multiply. Prime on a die, heads, multiple of 3 from 1–15: 3/6 · 1/2 · 5/15 = 1/12.",null],"da-54":["Exclusive A and B: probability 0.",null],"da-55":["A <b>or<\/b> B = P(A) + P(B) − P(both). For independent events, both = P(A)·P(B).",null],"da-56":["Exclusive A or B: just add.",null],"da-57":["P(A) = 0.5, P(B) = 0.4 with overlap unknown: “and” runs 0 to 0.4; “or” runs 0.5 to 0.9.",null],"da-58":["Wanted groups ÷ all groups. Bob and Bill both among 4 picked from 10: C(8, 2)/C(10, 4) = 28/210 ≈ 0.13.",null],"da-59":["“Given” shrinks the total. Four children, at least two boys: 6 + 4 + 1 = 11 cases; all boys is 1 → 1/11.",null],"da-60":["Expected value = Σ value × probability. 1(.6) + 2(.25) + 3(.1) + 4(.04) + 5(.01) = 1.61.",null],"da-61":["“At least one” or “at most”: 1 − the single case you don't want. At least one girl of 5: 1 − 1/32 = 31/32.",null],"da-62":["A random variable X is a value picked at random. P(X = 99) = the share of the list that is 99.",null],"da-63":["Relative frequency = the share of the time a value shows up; all of them add to 100%.",null],"da-64":["Relative-frequency histogram: bar height is a percent; count = percent × total.",null],"da-65":["Table of X and P(X): the P(X) column adds to 1, which finds a missing entry.",null],"da-66":["Mean of a random variable = its expected value = Σ Y·P(Y). The example gives 22.",null],"da-67":["Uniform: n equally likely outcomes, 1/n each. A fair die: 1/6.",null],"da-68":["Skew is named by the tail: tail to the left = negative skew; tail to the right = positive skew.","Name it by the tail, not the hump."],"da-69":["The mean follows the tail: right tail → mean &gt; median; left tail → median &gt; mean; symmetric → equal.",null],"da-70":["Normal: a symmetric bell, mean = median = mode. About 2/3 within 1 SD; almost all within 2 SD.",null],"da-71":["Memorise 2 · 14 · 34 | 34 · 14 · 2. Within 1σ: 68%. Within 2σ: 96%. Above +1σ: 16%.",null]}}</script>
<script>
(function(){
  "use strict";
  var D=JSON.parse(document.getElementById("gm-data").textContent);
  var PAGES=D.pages, C=D.cards, LET="ABCDE";
  var SUBJ={ari:"Arithmetic",alg:"Algebra",geo:"Geometry",cg:"Coordinate Geometry",da:"Data Analysis"};
  var sheet=document.getElementById("sheet"), pager=document.getElementById("pager"), qz=document.getElementById("qz"), qzp=document.getElementById("qzp");
  var SIZES=["15px","17px","19.5px"];

  /* ---- what this reader keeps: ticks shared with the GregMat chapter's flashcards, and the place in the book ---- */
  function load(k,d){try{var v=JSON.parse(localStorage.getItem(k)||"null");return v==null?d:v;}catch(e){return d;}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
  var KNOW=load("kmf.ps.known",{}); if(typeof KNOW!=="object"||!KNOW)KNOW={};
  var V=load("gm10.view",{}); var st={page:+V.page||0,mode:V.mode==="cover"?"cover":"read",hide:!!V.hide,size:V.size==null?1:+V.size};
  if(!(st.size>=0&&st.size<3))st.size=1;
  var h0=(location.hash||"").match(/^#p(\d+)$/); if(h0&&+h0[1]>=1&&+h0[1]<=10)st.page=+h0[1];
  if(!(st.page>=0&&st.page<=10))st.page=0;
  function keep(){save("gm10.view",{page:st.page,mode:st.mode,hide:st.hide,size:st.size});}

  function ids(P){var out=[];P.secs.forEach(function(s){out=out.concat(s.ids);});return out;}
  function knownIn(P){return ids(P).filter(function(id){return KNOW[id];}).length;}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  /* ---- the bar ---- */
  pager.innerHTML=PAGES.map(function(P){return '<button type="button" class="pg" data-p="'+P.n+'" title="Page '+P.n+' · '+esc(P.title)+'">'+P.n+'</button>';}).join("");
  function bar(){
    [].forEach.call(pager.children,function(b){var n=+b.getAttribute("data-p"),P=PAGES[n-1];
      if(n===st.page)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
      b.classList.toggle("done",knownIn(P)===ids(P).length);});
    document.getElementById("tocBtn").setAttribute("aria-pressed",String(st.page===0));
    document.getElementById("modeRead").setAttribute("aria-pressed",String(st.mode==="read"));
    document.getElementById("modeCover").setAttribute("aria-pressed",String(st.mode==="cover"));
    document.getElementById("hideBtn").setAttribute("aria-pressed",String(st.hide));
    sheet.classList.toggle("cover",st.mode==="cover"); sheet.classList.toggle("hideknown",st.hide);
    sheet.style.setProperty("--fs",SIZES[st.size]);
    var cur=pager.querySelector('[aria-current="page"]'); if(cur&&cur.scrollIntoView&&pager.scrollWidth>pager.clientWidth){try{cur.scrollIntoView({block:"nearest",inline:"center"});}catch(e){}}
  }

  /* ---- contents ---- */
  function toc(){
    var total=0,known=0; PAGES.forEach(function(P){total+=ids(P).length;known+=knownIn(P);});
    var last=+(V.page||0);
    var h='<div class="rhead"><span>GregMat in 10 Pages</span><span>Contents</span></div>'
      +'<h1>GregMat in 10 Pages</h1>'
      +'<p class="deck">All 247 concept slides from your five GregMat decks, one line each, in ten pages you can read in a sitting.</p>'
      +'<p class="meta">'+known+' of '+total+' cards ticked as known</p>'
      +'<ul class="howto">'
      +'<li><b>Read one page a day.</b> Each line is the whole slide in one or two sentences, with the trap in red.</li>'
      +'<li><b>Tap a title</b> to open the full slide: the diagram, the plain-words version, a fun fact and a check question.</li>'
      +'<li><b>Cover</b> blurs every line. Say the rule out loud, then tap the line to see if you had it.</li>'
      +'<li><b>Tick ✓</b> the cards you know. <b>Hide ✓</b> leaves only the ones still to learn, so the pages get shorter.</li>'
      +'</ul>'
      +'<div class="cont"><button type="button" class="btn pri" data-go="'+(last>=1&&last<=10?last:1)+'">'+(last>=1&&last<=10?'Continue at page '+last:'Start at page 1')+' →</button>'
      +'<span class="small">← and → turn the page. On a phone, swipe.</span></div>'
      +'<ol class="toc">'+PAGES.map(function(P){var n=ids(P).length,k=knownIn(P);
        return '<li><button type="button" data-go="'+P.n+'"><span class="no">'+P.n+'</span><span><span class="k">'+esc(P.kicker)+'</span><span class="t">'+esc(P.title)+'</span></span>'
          +'<span class="c">'+n+' cards'+(k?' · <i>'+k+' ✓</i>':'')+'</span><span class="prog" aria-hidden="true"><i style="width:'+Math.round(100*k/n)+'%"></i></span></button></li>';}).join("")+'</ol>';
    return h;
  }

  /* ---- one page ---- */
  function item(id){
    var c=C[id],s=D.sum[id];
    return '<div class="it'+(KNOW[id]?' known':'')+'" data-id="'+id+'">'
      +'<button type="button" class="kn" aria-pressed="'+(KNOW[id]?'true':'false')+'" aria-label="I know '+esc(c.title)+'" title="I know this">✓</button>'
      +'<button type="button" class="tt" aria-expanded="false">'+c.title+'<span class="more">Full slide</span></button>'
      +'<div class="rl">'+s[0]+(s[1]?'<span class="trap"><b class="lb">Trap</b>'+s[1]+'</span>':'')+'</div>'
      +'</div>';
  }
  function page(n){
    var P=PAGES[n-1], all=ids(P), k=knownIn(P);
    var nq=all.filter(function(id){return C[id].check&&C[id].check.q;}).length;
    var h='<div class="rhead"><span>GregMat in 10 Pages</span><span>'+esc(P.kicker)+'</span></div>'
      +'<h1>'+esc(P.title)+'</h1><p class="deck">'+esc(P.deck)+'</p>'
      +'<p class="meta">'+all.length+' cards · '+k+' ticked'+(st.hide&&k?' and hidden':'')+'</p>';
    P.secs.forEach(function(s){h+='<h2>'+esc(s.h)+'</h2>'+s.ids.map(item).join("");});
    h+='<div class="endmatter"><p>End of page '+n+'. Check yourself on its '+nq+' questions.</p><div class="acts">'
      +'<button type="button" class="btn pri" data-quiz="5">5 questions</button><button type="button" class="btn" data-quiz="all">All '+nq+'</button></div></div>';
    var prev=n>1?PAGES[n-2]:null, next=n<10?PAGES[n]:null;
    h+='<nav class="foot" aria-label="Turn the page">'
      +'<button type="button" class="nav" data-go="'+(n-1)+'"><b>← '+(prev?'Page '+prev.n:'Contents')+'</b>'+(prev?esc(prev.title):'All ten pages')+'</button>'
      +'<span class="folio">'+n+'</span>'
      +(next?'<button type="button" class="nav next" data-go="'+next.n+'"><b>Page '+next.n+' →</b>'+esc(next.title)+'</button>':'<button type="button" class="nav next" data-go="0"><b>Contents →</b>Back to the start</button>')
      +'</nav>';
    return h;
  }
  function render(dir){
    sheet.innerHTML=st.page===0?toc():page(st.page);
    sheet.classList.remove("turn"); void sheet.offsetWidth; sheet.style.setProperty("--dx",(dir||0)<0?"-10px":"10px"); sheet.classList.add("turn");
    bar();
  }
  function go(n){
    n=Math.max(0,Math.min(10,n)); if(n===st.page)return;
    var dir=n>st.page?1:-1; st.page=n; if(n>0)V.page=n; keep(); render(dir);
    try{window.scrollTo(0,0);}catch(e){}
  }

  /* ---- the full slide, opened in place ---- */
  function chk(c){
    var k=c.check||{}; if(!k.q)return "";
    var h='<div class="pschk"><span class="l">Check yourself</span><div class="q">'+k.q+'</div>';
    if(k.choices&&k.choices.length)h+='<div class="ch">'+k.choices.map(function(t,i){return '<button type="button" data-i="'+i+'"><span class="lt">'+LET[i]+'</span><span>'+t+'</span></button>';}).join("")+'</div>';
    return h+'<button type="button" class="rv">Show the answer</button><div class="ans" hidden><b>Answer: '+k.a+'</b><br>'+(k.why||"")+'</div></div>';
  }
  function full(c){
    return '<article class="pscard"><div class="pshd">'+SUBJ[c.subj]+' · group '+c.group+' · slide '+c.page+'</div>'
      +'<h3>'+c.title+'</h3><div class="psbody">'+c.body+'</div>'
      +(c.fig?'<div class="psfig">'+c.fig+'</div>':'')
      +(c.plain?'<div class="psplain"><b class="l">In plain words</b>'+c.plain+'</div>':'')
      +chk(c)
      +(c.fun?'<p class="psfun"><b class="lbl">Fun fact</b>'+c.fun+'</p>':'')+'</article>';
  }
  function rightIdx(c){var m=String((c.check||{}).a||"").replace(/<[^>]+>/g,"").trim().match(/^\(?([A-E])\b/);return m?LET.indexOf(m[1]):-1;}

  function setKnown(id,on){
    if(on)KNOW[id]=1;else delete KNOW[id]; save("kmf.ps.known",KNOW);
    var el=sheet.querySelector('.it[data-id="'+id+'"]');
    if(el){el.classList.toggle("known",on);el.querySelector(".kn").setAttribute("aria-pressed",String(on));}
    var meta=sheet.querySelector(".meta"); if(meta&&st.page>0){var P=PAGES[st.page-1],k=knownIn(P);meta.textContent=ids(P).length+' cards · '+k+' ticked'+(st.hide&&k?' and hidden':'');}
    bar();
  }

  sheet.addEventListener("click",function(e){
    var t=e.target;
    var g=t.closest("[data-go]"); if(g){go(+g.getAttribute("data-go"));return;}
    var q=t.closest("[data-quiz]"); if(q){quiz(q.getAttribute("data-quiz"));return;}
    var it=t.closest(".it"); if(!it)return; var id=it.getAttribute("data-id");
    if(t.closest(".kn")){setKnown(id,!KNOW[id]);return;}
    if(t.closest(".rl")&&st.mode==="cover"&&!it.classList.contains("shown")){it.classList.add("shown");return;}
    if(t.closest(".tt")){
      var f=it.querySelector(".full"), b=it.querySelector(".tt");
      if(f){f.remove();it.classList.remove("open");b.setAttribute("aria-expanded","false");b.querySelector(".more").textContent="Full slide";return;}
      f=document.createElement("div"); f.className="full"; f.innerHTML=full(C[id]); it.appendChild(f); it.classList.add("open","shown");
      b.setAttribute("aria-expanded","true"); b.querySelector(".more").textContent="Close the slide"; wireChk(f,C[id]); return;
    }
  });
  function wireChk(root,c){
    var box=root.querySelector(".pschk"); if(!box)return; var ri=rightIdx(c),ans=box.querySelector(".ans"),rv=box.querySelector(".rv");
    rv.addEventListener("click",function(){ans.hidden=!ans.hidden;rv.textContent=ans.hidden?"Show the answer":"Hide the answer";});
    box.querySelectorAll(".ch button").forEach(function(b){b.addEventListener("click",function(){
      var i=+b.getAttribute("data-i");
      box.querySelectorAll(".ch button").forEach(function(o,j){o.classList.toggle("right",j===ri);o.classList.toggle("wrong",j===i&&i!==ri);});
      ans.hidden=false; rv.textContent="Hide the answer";
    });});
  }

  /* ---- the end-of-page check ---- */
  var Q=null;
  function quiz(how){
    var P=PAGES[st.page-1]; var pool=ids(P).filter(function(id){var k=C[id].check;return k&&k.q&&k.choices&&k.choices.length&&rightIdx(C[id])>=0;});
    for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=pool[i];pool[i]=pool[j];pool[j]=x;}
    if(how!=="all")pool=pool.slice(0,5);
    if(!pool.length)return;
    Q={list:pool,i:0,picked:null,right:0,missed:[],back:document.activeElement};
    qz.hidden=false; drawQ();
  }
  function drawQ(){
    if(Q.i>=Q.list.length){
      var n=Q.list.length;
      qzp.innerHTML='<div class="qzh"><span id="qzTitle">Page '+st.page+' check · done</span><button type="button" class="btn" data-q="close">Close</button></div>'
        +'<p class="score">'+Q.right+' of '+n+'</p>'
        +(Q.missed.length?'<p class="small">Go back over these. Any you had ticked are un-ticked again:</p><ul class="missed">'+Q.missed.map(function(id){return '<li>'+C[id].title+'</li>';}).join("")+'</ul>'
          :'<p class="small">Every one right. Tick the cards you are sure of so they can be hidden.</p>')
        +'<div class="row"><button type="button" class="btn" data-q="again">Another 5</button><button type="button" class="btn pri" data-q="close">Back to the page</button></div>';
      qzp.querySelector('[data-q="close"]').focus(); return;
    }
    var id=Q.list[Q.i],c=C[id],k=c.check;
    qzp.innerHTML='<div class="qzh"><span id="qzTitle">Page '+st.page+' check · question '+(Q.i+1)+' of '+Q.list.length+'</span><button type="button" class="btn" data-q="close">Close</button></div>'
      +'<p class="tag">'+c.title+'</p><div class="q">'+k.q+'</div>'
      +'<div class="ch">'+k.choices.map(function(t,i){return '<button type="button" data-i="'+i+'"><span class="lt">'+LET[i]+'</span><span>'+t+'</span></button>';}).join("")+'</div>'
      +'<div id="qzWhy"></div>';
    var first=qzp.querySelector(".ch button"); if(first)first.focus();
  }
  qzp.addEventListener("click",function(e){
    var a=e.target.closest("[data-q]");
    if(a){var act=a.getAttribute("data-q");
      if(act==="close"){closeQ();return;}
      if(act==="next"){Q.i++;Q.picked=null;drawQ();return;}
      if(act==="again"){closeQ();quiz("5");return;}
    }
    var b=e.target.closest(".ch button"); if(!b||Q.picked!=null)return;
    var id=Q.list[Q.i],c=C[id],ri=rightIdx(c),i=+b.getAttribute("data-i"); Q.picked=i;
    qzp.querySelectorAll(".ch button").forEach(function(o,j){o.disabled=true;o.classList.toggle("right",j===ri);o.classList.toggle("wrong",j===i&&i!==ri);});
    if(i===ri)Q.right++; else {Q.missed.push(id); if(KNOW[id])setKnown(id,false);}
    document.getElementById("qzWhy").innerHTML='<div class="why"><b>'+(i===ri?'Right. ':'Answer: '+c.check.a+'. ')+'</b>'+(c.check.why||"")+'</div>'
      +'<div class="row"><button type="button" class="btn pri" data-q="next">'+(Q.i+1<Q.list.length?'Next question →':'See the result')+'</button></div>';
    qzp.querySelector('[data-q="next"]').focus();
  });
  function closeQ(){qz.hidden=true; var b=Q&&Q.back; Q=null; if(b&&b.focus)b.focus();}
  qz.addEventListener("click",function(e){if(e.target===qz)closeQ();});

  /* ---- bar buttons, keys and swipes ---- */
  pager.addEventListener("click",function(e){var b=e.target.closest("[data-p]");if(b)go(+b.getAttribute("data-p"));});
  document.getElementById("tocBtn").addEventListener("click",function(){go(0);});
  document.getElementById("modeRead").addEventListener("click",function(){st.mode="read";keep();sheet.querySelectorAll(".it.shown").forEach(function(x){x.classList.remove("shown");});bar();});
  document.getElementById("modeCover").addEventListener("click",function(){st.mode="cover";keep();sheet.querySelectorAll(".it.shown:not(.open)").forEach(function(x){x.classList.remove("shown");});bar();});
  document.getElementById("hideBtn").addEventListener("click",function(){st.hide=!st.hide;keep();bar();var m=sheet.querySelector(".meta");if(m&&st.page>0){var P=PAGES[st.page-1],k=knownIn(P);m.textContent=ids(P).length+' cards · '+k+' ticked'+(st.hide&&k?' and hidden':'');}});
  document.getElementById("sizeBtn").addEventListener("click",function(){st.size=(st.size+1)%3;keep();bar();});
  document.addEventListener("keydown",function(e){
    if(!qz.hidden){if(e.key==="Escape")closeQ();return;}
    var tg=e.target&&e.target.tagName; if(tg==="INPUT"||tg==="TEXTAREA"||e.altKey||e.ctrlKey||e.metaKey)return;
    if(e.key==="ArrowRight"){go(st.page+1);e.preventDefault();}
    else if(e.key==="ArrowLeft"){go(st.page-1);e.preventDefault();}
  });
  var tx=null,ty=0;
  sheet.addEventListener("touchstart",function(e){if(e.touches.length!==1||e.target.closest(".full,.ps-tw,.psfig,.ps-f")){tx=null;return;}tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  sheet.addEventListener("touchend",function(e){if(tx==null)return;var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;tx=null;
    if(Math.abs(dx)>70&&Math.abs(dy)<45)go(st.page+(dx<0?1:-1));},{passive:true});

  render(0);
})();
</script>

</body>
