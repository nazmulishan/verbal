these three measurements of dispersion can significantly vary.","check":{"q":"Which of these is NOT a measure of dispersion (spread)?","choices":["range","interquartile range","standard deviation","median"],"a":"D · median","why":"Range, interquartile range and standard deviation measure spread; the median measures the center."}},"da-15":{"title":"Range","subj":"da","page":15,"group":13,"body":"<p>Calculating range is <b>super easy<\/b>. Simply find the difference between the largest and smallest number.<\/p><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><td>10<\/td><td>13<\/td><td>15<\/td><td>28<\/td><td>36<\/td><td>57<\/td><td>80<\/td><\/tr><tr><td>↓<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td>↓<\/td><\/tr><tr><td><span class=\"note\">beginning ‘least’<\/span><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><span class=\"note\">end ‘greatest’<\/span><\/td><\/tr><\/table><\/div><div class=\"ps-box\"><div class=\"ps-f\">80 − 10 = <span class=\"ok\">70<\/span><\/div><\/div>","plain":"Range = greatest value − least value. Find the biggest and the smallest number in the list and subtract. Only those two numbers matter.","fun":"The range of the youngest (Kennedy) and oldest (Biden) U.S. president to take office is 78 − 43 = 35.","check":{"q":"What is the range of 27, 4, 19, 52, 33?","choices":["19","25","33","48","52"],"a":"D · 48","why":"Greatest = 52, least = 4, so range = 52 − 4 = 48."}},"da-16":{"title":"Interquartile Range","subj":"da","page":16,"group":13,"body":"<p class=\"ps-def\"><b>Interquartile Range:<\/b> <span class=\"m\">Q<sub>3<\/sub> − Q<sub>1<\/sub><\/span><\/p><div class=\"ps-f\">10 11 17 28 31 &nbsp;|&nbsp; 42 51 69 70 91<\/div><p><span class=\"note\">first half<\/span>: 10 11 17 28 31 → Q<sub>1<\/sub> = 17<\/p><p>Q<sub>2<\/sub> (median) = 36.5<\/p><p><span class=\"note\">second half<\/span>: 42 51 69 70 91 → Q<sub>3<\/sub> = 69<\/p><div class=\"ps-box\"><div class=\"ps-f\">Q<sub>3<\/sub> − Q<sub>1<\/sub> = 69 − 17 = <span class=\"ok\">52<\/span><\/div><\/div>","plain":"The interquartile range (IQR) is Q<sub>3<\/sub> − Q<sub>1<\/sub>: the spread of the middle half of the data. Split the ordered list into two halves at the median, find the median of each half, and subtract.","fun":"Interquartile range is a more accurate measure of the spread of data because it eliminates outliers (extreme values).","check":{"q":"What is the interquartile range of 2, 4, 5, 8, 9, 12, 14, 15, 18, 20?","choices":["8","10","13","15","18"],"a":"B · 10","why":"10 numbers, so the halves are 2, 4, 5, 8, 9 and 12, 14, 15, 18, 20. Q<sub>1<\/sub> = 5 and Q<sub>3<\/sub> = 15, so IQR = 15 − 5 = 10."},"fig":"<svg viewBox=\"0 0 600 180\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"35.0\" y=\"42.0\" width=\"250.0\" height=\"40.0\" rx=\"6\" fill=\"none\" style=\"fill:none;stroke:var(--ink)\" stroke-width=\"1\"/><text x=\"160.0\" y=\"32.0\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:var(--red)\">first half<\/text><text x=\"60.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"20\" style=\"fill:var(--ink)\">10<\/text><text x=\"110.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"20\" style=\"fill:var(--ink)\">11<\/text><text x=\"160.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"20\" style=\"fill:var(--ink)\">17<\/text><text x=\"210.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"20\" style=\"fill:var(--ink)\">28<\/text><text x=\"260.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"20\" style=\"fill:var(--ink)\">31<\/text><rect x=\"315.0\" y=\"42.0\" width=\"250.0\" height=\"40.0\" rx=\"6\" fill=\"none\" style=\"fill:none;stroke:var(--ink)\" stroke-width=\"1\"/><text x=\"440.0\" y=\"32.0\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:var(--red)\">second half<\/text><text x=\"340.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"20\" style=\"fill:var(--ink)\">42<\/text><text x=\"390.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"20\" style=\"fill:var(--ink)\">51<\/text><text x=\"440.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"20\" style=\"fill:var(--ink)\">69<\/text><text x=\"490.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"20\" style=\"fill:var(--ink)\">70<\/text><text x=\"540.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"20\" style=\"fill:var(--ink)\">91<\/text><line x1=\"160.0\" y1=\"86.0\" x2=\"160.0\" y2=\"116.0\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><polygon points=\"156.0,115.0 164.0,115.0 160.0,122.0\" fill=\"none\" style=\"fill:var(--blue)\"/><text x=\"160.0\" y=\"138.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--red)\">Q₁<\/text><text x=\"160.0\" y=\"153.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--red)\">17<\/text><line x1=\"300.0\" y1=\"86.0\" x2=\"300.0\" y2=\"116.0\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><polygon points=\"296.0,115.0 304.0,115.0 300.0,122.0\" fill=\"none\" style=\"fill:var(--blue)\"/><text x=\"300.0\" y=\"138.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--red)\">Q₂<\/text><text x=\"300.0\" y=\"153.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--red)\">median<\/text><text x=\"300.0\" y=\"168.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--red)\">36.5<\/text><line x1=\"440.0\" y1=\"86.0\" x2=\"440.0\" y2=\"116.0\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><polygon points=\"436.0,115.0 444.0,115.0 440.0,122.0\" fill=\"none\" style=\"fill:var(--blue)\"/><text x=\"440.0\" y=\"138.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--red)\">Q₃<\/text><text x=\"440.0\" y=\"153.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--red)\">69<\/text><\/svg>"},"da-17":{"title":"Boxplots","subj":"da","page":17,"group":14,"body":"<p><b>Boxplots<\/b> are a visual representation of data. They provide <span class=\"hl\">five<\/span> data points:<\/p><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><th>Least #<\/th><th>Q<sub>1<\/sub><\/th><th>Q<sub>2<\/sub><\/th><th>Q<sub>3<\/sub><\/th><th>Greatest #<\/th><\/tr><\/table><\/div><div class=\"ps-f\"><b>Data:<\/b> 10 25 32 38 90 92 120<\/div><p>Boxplot: whisker from <span class=\"note\">Least<\/span> 10 to the box; box from Q<sub>1<\/sub> = 25 to Q<sub>3<\/sub> = 92 with a line at Q<sub>2<\/sub> = 38; whisker from the box to <span class=\"note\">Greatest<\/span> 120.<\/p>","plain":"A boxplot (box-and-whisker plot) shows five numbers: the least value, Q<sub>1<\/sub>, the median Q<sub>2<\/sub>, Q<sub>3<\/sub> and the greatest value. The box covers Q<sub>1<\/sub> to Q<sub>3<\/sub>, the line inside is the median, and the whiskers reach out to the least and greatest values.","fun":"The line in the middle can move left or right depending on the median’s value. The lines on the end can be adjusted as well.","check":{"q":"A boxplot is drawn for the data 4, 6, 9, 13, 15, 20, 30. Which value is shown by the line inside the box?","choices":["6","9","13","15","20"],"a":"C · 13","why":"The line inside the box is the median (Q<sub>2<\/sub>). The middle of these 7 ordered numbers is the 4th one, 13."},"fig":"<svg viewBox=\"0 0 620 140\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"60.0\" y1=\"80.0\" x2=\"129.0\" y2=\"80.0\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><line x1=\"60.0\" y1=\"72.0\" x2=\"60.0\" y2=\"88.0\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><line x1=\"437.2\" y1=\"80.0\" x2=\"566.0\" y2=\"80.0\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><line x1=\"566.0\" y1=\"72.0\" x2=\"566.0\" y2=\"88.0\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><rect x=\"129.0\" y=\"50.0\" width=\"308.2\" height=\"60.0\" rx=\"0\" fill=\"none\" style=\"fill:var(--blue-wash);stroke:var(--blue)\" stroke-width=\"1.5\"/><line x1=\"188.8\" y1=\"50.0\" x2=\"188.8\" y2=\"110.0\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\"/><text x=\"129.0\" y=\"42.0\" text-anchor=\"middle\" font-size=\"13\" style=\"fill:var(--red)\">Q₁<\/text><text x=\"188.8\" y=\"42.0\" text-anchor=\"middle\" font-size=\"13\" style=\"fill:var(--red)\">Q₂<\/text><text x=\"437.2\" y=\"42.0\" text-anchor=\"middle\" font-size=\"13\" style=\"fill:var(--red)\">Q₃<\/text><text x=\"60.0\" y=\"66.0\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:var(--red)\">Least<\/text><text x=\"566.0\" y=\"66.0\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:var(--red)\">Greatest<\/text><text x=\"60.0\" y=\"130.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">10<\/text><text x=\"129.0\" y=\"130.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">25<\/text><text x=\"188.8\" y=\"130.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">38<\/text><text x=\"437.2\" y=\"130.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">92<\/text><text x=\"566.0\" y=\"130.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">120<\/text><\/svg>"},"da-18":{"title":"Standard Deviation (SD)","subj":"da","page":18,"group":14,"body":"<p class=\"ps-def\"><b>Standard deviation<\/b> is a measure of how <span class=\"hl\">spread out<\/span> data is. Unlike range, it takes into account <span class=\"hl\">every<\/span> number in the list.<\/p><p>In many cases, standard deviation can be “eyeballed.” In other words, it’s obvious which list is more “spread out.”<\/p><div class=\"ps-boxes\"><div class=\"ps-box\"><div class=\"ps-box-h\">List 1<\/div><div class=\"ps-f\">10, 15, 23, 26<\/div><\/div><div class=\"ps-box\"><div class=\"ps-box-h\">List 2<\/div><div class=\"ps-f\">22, 38, 51, 82<\/div><\/div><\/div><p>Clearly list 2 is more “spread out” than list 1, and thus has a bigger standard deviation.<\/p>","plain":"Standard deviation (SD) measures how spread out a list is, using every number. On the GRE you can often just look: the list whose numbers are farther apart (farther from their average) has the bigger SD. No calculation needed.","fun":"Even a list with a large range will not have a large standard deviation if the numbers are bunched in the middle.","check":{"q":"Which list has the largest standard deviation?","choices":["10, 11, 12, 13","50, 51, 52, 53","1, 20, 40, 60","7, 7, 7, 7"],"a":"C · 1, 20, 40, 60","why":"Its numbers are much farther apart than the others. Lists A and B are tightly packed (gaps of 1), and D has no spread at all (SD = 0)."}},"da-19":{"title":"Calculating SD (simple)","subj":"da","page":19,"group":14,"body":"<p class=\"ps-def\"><b>Standard deviation<\/b> depends on how far each value is from the mean. Thus, the SIMPLEST case is data in which every number is the same distance from the mean.<\/p><div class=\"ps-f\">6 &nbsp;&nbsp; 8 &nbsp;&nbsp; 10<\/div><p><span class=\"note\">6 is 2 below 8; 10 is 2 above 8<\/span><\/p><div class=\"ps-box\"><p>In this example on the left, the average is 8 and both 6 and 10 are two away from the average. Thus, the standard deviation is 2.<\/p><\/div>","plain":"SD is about distance from the mean. If every number is the same distance from the mean, that distance is the SD. For the list 6 and 10, the mean is 8 and both are 2 away, so SD = 2.","fun":"The standard deviation of a list with one number is zero. This is also true for a list containing the same number repeated.","check":{"q":"What is the standard deviation of the list 12, 20?","choices":["2","4","8","16"],"a":"B · 4","why":"The mean is 16. Both 12 and 20 are exactly 4 away from 16, so the SD is 4."},"fig":"<svg viewBox=\"0 0 360 170\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"80.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"44\" style=\"fill:var(--blue)\">6<\/text><text x=\"280.0\" y=\"70.0\" text-anchor=\"middle\" font-size=\"44\" style=\"fill:var(--blue)\">10<\/text><text x=\"180.0\" y=\"150.0\" text-anchor=\"middle\" font-size=\"44\" style=\"fill:var(--ink)\">8<\/text><line x1=\"96.0\" y1=\"86.0\" x2=\"158.0\" y2=\"122.0\" fill=\"none\" style=\"stroke:var(--red)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><line x1=\"264.0\" y1=\"86.0\" x2=\"202.0\" y2=\"122.0\" fill=\"none\" style=\"stroke:var(--red)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><text x=\"112.0\" y=\"132.0\" text-anchor=\"middle\" font-size=\"22\" style=\"fill:var(--red)\">2<\/text><text x=\"248.0\" y=\"132.0\" text-anchor=\"middle\" font-size=\"22\" style=\"fill:var(--red)\">2<\/text><\/svg>"},"da-20":{"title":"Calculating SD (complex)","subj":"da","page":20,"group":14,"body":"<p>It can get a bit complicated in data in which the numbers are different values away from the mean. In that case, you have to follow a series of steps.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><p class=\"ps-step\"><b>Step 1:<\/b> Calculate the average<\/p><p class=\"ps-step\"><b>Step 2:<\/b> Calculate each value’s distance from the mean.<\/p><p class=\"ps-step\"><b>Step 3:<\/b> Square those values and sum them.<\/p><p class=\"ps-step\"><b>Step 4:<\/b> Divide the sum by the number of values and then square root.<\/p><\/div><div class=\"ps-col\"><div class=\"ps-ex\"><div class=\"ps-ex-h\">example<\/div><div class=\"ps-f\">3, 3, 7, 8, 9<\/div><p class=\"ps-step\"><b>Step 1:<\/b> 6<\/p><p class=\"ps-step\"><b>Step 2:<\/b> <span class=\"hl\">3, 3, 1, 2, 3<\/span><\/p><p class=\"ps-step\"><b>Step 3:<\/b> 9 + 9 + 1 + 4 + 9 = 32<\/p><p class=\"ps-step\"><b>Step 4:<\/b> √<span class=\"ov\"><span class=\"fr\"><span>32<\/span><span>5<\/span><\/span><\/span> ≈ 2.53<\/p><\/div><\/div><\/div>","plain":"When the numbers are different distances from the mean, follow four steps: find the mean, find each number’s distance from it, square those distances and add them, then divide by how many numbers there are and take the square root. You will rarely need to do this on the GRE, but it shows what SD really measures.","fun":"Thankfully we probably won’t be asked to use this formula or process on the real GRE, but it is nice to learn it.","check":{"q":"Find the standard deviation of 2, 4, 4, 6.","choices":["√2","2","√8","4"],"a":"A · √2","why":"Mean = 16 ÷ 4 = 4. Distances: 2, 0, 0, 2. Squares: 4 + 0 + 0 + 4 = 8. 8 ÷ 4 = 2, so SD = √2 (≈ 1.41)."}},"da-21":{"title":"Population vs Sample SD","subj":"da","page":21,"group":14,"body":"<p>Population and sample standard deviation give <span class=\"hl\">slightly<\/span> different values, with the sample standard deviation being <span class=\"hl\">slightly<\/span> higher.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><p><span class=\"note\">Picture: 5 people.<\/span><\/p><p>In this case, our population is only five people and we’re using ALL five people to calculate our standard deviation.<\/p><p><span class=\"note\">See step 4 of previous slide.<\/span><\/p><div class=\"ps-box\"><p>Divide by the population number (<span class=\"m\">n<\/span>). In this case, that’s 5.<\/p><\/div><\/div><div class=\"ps-col\"><p><span class=\"note\">Picture: 30 people, 5 of them shown in red.<\/span><\/p><p>But in this case we’re “sampling” the five people from a population of 30. This changes the formula slightly.<\/p><p><span class=\"note\">See step 4 of previous slide.<\/span><\/p><div class=\"ps-box\"><p>Divide by the sample number minus 1 (<span class=\"m\">n − 1<\/span>). In this case, that’s 4.<\/p><\/div><\/div><\/div>","plain":"If your data is the whole group (the population), divide by <span class=\"m\">n<\/span> in step 4 of the SD process. If your data is only a sample picked from a bigger group, divide by <span class=\"m\">n − 1<\/span> instead. Dividing by a smaller number makes the sample SD slightly bigger.","fun":"Apparently dividing by <span class=\"m\">n − 1<\/span> in the sample SD calculation gives a more accurate measure of the SD for the entire population.","check":{"q":"You pick 10 people from a city as a sample and calculate their SD. In step 4, what do you divide the sum of squares by?","choices":["1","9","10","11"],"a":"B · 9","why":"For a sample you divide by the sample number minus 1: n − 1 = 10 − 1 = 9."}},"da-22":{"title":"Changes to SD (+/-)","subj":"da","page":22,"group":14,"body":"<p>If you add or subtract the same number to every value in a list, the standard deviation <span class=\"hl\">does NOT change<\/span>.<\/p><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><td>3<\/td><td>5<\/td><td>9<\/td><td>17<\/td><td>→ ≈ 5.4<\/td><\/tr><tr><td><span class=\"note\">+5<\/span><\/td><td><span class=\"note\">+5<\/span><\/td><td><span class=\"note\">+5<\/span><\/td><td><span class=\"note\">+5<\/span><\/td><td><span class=\"note\">no change<\/span><\/td><\/tr><tr><td>8<\/td><td>10<\/td><td>14<\/td><td>22<\/td><td>→ ≈ 5.4<\/td><\/tr><\/table><\/div>","plain":"Adding (or subtracting) the same number to every value just slides the whole list along the number line. The numbers stay the same distance apart, so the SD stays exactly the same.","fun":"This fact can be easily verified by the “simple” SD calculations. The SD of 3 and 10 is the same as 23 and 30.","check":{"q":"A list has a standard deviation of 3. If 10 is subtracted from every value, what is the new standard deviation?","choices":["−7","0","3","13","30"],"a":"C · 3","why":"Subtracting the same number from every value moves the list but does not change its spread, so the SD is still 3."}},"da-23":{"title":"Changes to SD (×/÷)","subj":"da","page":23,"group":14,"body":"<p>If you multiply or divide by the same number to every value in a list, the standard deviation <span class=\"hl\">changes by that factor<\/span>.<\/p><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><td>3<\/td><td>5<\/td><td>9<\/td><td>17<\/td><td>→ ≈ 5.4<\/td><\/tr><tr><td><span class=\"note\">× 2<\/span><\/td><td><span class=\"note\">× 2<\/span><\/td><td><span class=\"note\">× 2<\/span><\/td><td><span class=\"note\">× 2<\/span><\/td><td><span class=\"note\">× 2<\/span><\/td><\/tr><tr><td>6<\/td><td>10<\/td><td>18<\/td><td>34<\/td><td>→ ≈ 10.8<\/td><\/tr><\/table><\/div>","plain":"Multiplying every value by a number stretches the list, so the SD is multiplied by that same number. Dividing every value shrinks the list, so the SD is divided by that number too.","fun":"If a list contains a repeated number, then multiplying each number by something would still result in an SD of 0.","check":{"q":"A list has a standard deviation of 6. If every value is divided by 3, what is the new standard deviation?","choices":["2","3","6","9","18"],"a":"A · 2","why":"Dividing every value by 3 divides the SD by 3: 6 ÷ 3 = 2."}},"da-24":{"title":"Standardization","subj":"da","page":24,"group":14,"body":"<p class=\"ps-def\"><span class=\"hl\"><b>Standardization<\/b><\/span> essentially means, for each value in a list, calculating “how many standard deviations” that value is from the mean.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><p class=\"ps-step\"><b>Step 1:<\/b> Calculate the average and standard deviation.<\/p><p class=\"ps-step\"><b>Step 2:<\/b> Subtract the average from each value.<\/p><p class=\"ps-step\"><b>Step 3:<\/b> Divide each result by the standard deviation.<\/p><\/div><div class=\"ps-col\"><div class=\"ps-ex\"><div class=\"ps-ex-h\">example<\/div><div class=\"ps-f\">1, 3, 4, 7, 15<\/div><p class=\"ps-step\"><b>Step 1:<\/b> avg = 6 &nbsp;&nbsp; SD ≈ 4.9<\/p><p class=\"ps-step\"><b>Step 2:<\/b> <span class=\"hl\">−5, −3, −2, 1, 9<\/span><\/p><p class=\"ps-step\"><b>Step 3:<\/b> −1, −0.6, −0.4, 0.2, 1.8<\/p><p><span class=\"note\">approximate values<\/span><\/p><\/div><\/div><\/div>","plain":"Standardizing a value tells you how many SDs it is above or below the mean: (value − mean) ÷ SD. A positive answer means above the mean, a negative answer means below it.","fun":"This process of standardization is sometimes called “norming.”","check":{"q":"A list has mean 50 and standard deviation 10. What is the standardized value of 65?","choices":["−1.5","0.65","1.5","6.5","15"],"a":"C · 1.5","why":"(65 − 50) ÷ 10 = 15 ÷ 10 = 1.5, so 65 is 1.5 standard deviations above the mean."}},"da-25":{"title":"Sets versus Lists","subj":"da","page":25,"group":14,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Sets<\/h4><ul class=\"ps-list\"><li>Can be finite or infinite<\/li><li>Order is not important<\/li><li>No repeats allowed<\/li><li>Finite sets use curly brackets<\/li><\/ul><\/div><div class=\"ps-col\"><h4>Lists<\/h4><ul class=\"ps-list\"><li>Always finite<\/li><li>Order matters<\/li><li>Repeats allowed<\/li><li>Often have no brackets<\/li><\/ul><\/div><\/div>","plain":"<p>A set is a collection where order does not matter and nothing is counted twice, so {1, 2, 3} and {3, 2, 1} are the same set. A list keeps its order and can repeat values, like 2, 5, 5, 8. Sets get curly brackets; lists usually do not.<\/p>","fun":"Technically sets do allow repeats but any repeated element is not counted. It is simply ignored.","check":{"q":"Which statement is true about <b>sets<\/b>?","choices":["Order matters","Repeated elements are counted again","A set can be infinite","A set is always finite"],"a":"C · A set can be infinite","why":"Sets can be finite or infinite (for example, all even numbers). Order does not matter and repeats are not counted; it is lists that are always finite."}},"da-26":{"title":"More Sets Stuff","subj":"da","page":26,"group":14,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Empty Set<\/h4><p>A set containing no elements is possible. It’s called the “<span class=\"hl\">empty set<\/span>.”<\/p><div class=\"ps-f\">{ } = ∅<\/div><\/div><div class=\"ps-col\"><h4># of elements<\/h4><p>The number of elements in a set is denoted by <span class=\"hl\"><span class=\"m\">|S|<\/span><\/span>.<\/p><div class=\"ps-f\">{2, 3, 4}<\/div><div class=\"ps-f\"><span class=\"hl\">|S| = 3<\/span><\/div><div class=\"ps-f\">{e, π, ∜2, 7, 0}<\/div><div class=\"ps-f\"><span class=\"hl\">|S| = 5<\/span><\/div><\/div><div class=\"ps-col\"><h4>Subsets<\/h4><p>Set <span class=\"m\">S<\/span> has <span class=\"hl\"><span class=\"m\">2<sup>|S|<\/sup><\/span><\/span> subsets. See the example below.<\/p><div class=\"ps-f\">{2, 3, 4}<\/div><div class=\"ps-f\">{∅} {2} {3} {4}<\/div><div class=\"ps-f\">{2, 3} {2, 4} {3, 4}<\/div><div class=\"ps-f\">{2, 3, 4}<\/div><p><span class=\"note\">eight subsets<\/span><\/p><\/div><\/div>","plain":"<p>The empty set ∅ is a set with nothing in it. |S| just means “how many elements are in S.” A set with n elements has 2ⁿ subsets — this count includes the empty set (written {∅} on the slide) and the whole set itself. So {2, 3, 4} has 2³ = 8 subsets.<\/p>","fun":"As you can see in the Subsets column above, every set is a subset of itself.","check":{"q":"How many subsets does the set {a, b, c, d, e} have?","a":"32","why":"The set has |S| = 5 elements, so it has 2⁵ = 32 subsets (including the empty set and the whole set)."}},"da-27":{"title":"Intersections and Unions","subj":"da","page":27,"group":14,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Intersections<\/h4><p>What two sets share in common<\/p><div class=\"ps-f\">A = {2, 4, 6, 8, 10, 12, 14}<\/div><div class=\"ps-f\">B = {3, 6, 9, 12, 15}<\/div><div class=\"ps-f\"><span class=\"ok\">A ∩ B = {6, 12}<\/span><\/div><\/div><div class=\"ps-col\"><h4>Unions<\/h4><p>Combination of two sets (no repeats)<\/p><div class=\"ps-f\">A = {1, 3, 5}<\/div><div class=\"ps-f\">B = {2, 4, 6}<\/div><div class=\"ps-f\"><span class=\"ok\">A ∪ B = {1, 2, 3, 4, 5, 6}<\/span><\/div><\/div><\/div>","plain":"<p>The intersection A ∩ B keeps only the elements that are in <b>both<\/b> sets. The union A ∪ B puts everything from both sets together, writing each element only once. Tip: ∩ looks like an “n” for “aNd”; ∪ looks like a “U” for “Union.”<\/p>","fun":"Even numbers are infinite. Prime numbers are infinite. But their intersection contains only one value: 2.","check":{"q":"Let A = {1, 2, 3, 4, 5} and B = {4, 5, 6, 7}. Find A ∩ B and A ∪ B.","a":"A ∩ B = {4, 5}; A ∪ B = {1, 2, 3, 4, 5, 6, 7}","why":"Only 4 and 5 are in both sets. The union lists every element from either set once: 1 through 7."}},"da-28":{"title":"The Two Extremes","subj":"da","page":28,"group":14,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Zero Overlap<\/h4><div class=\"ps-f\">A = {1, 2, 3}<\/div><div class=\"ps-f\">B = {7, 8, 9}<\/div><p>The two circles are separate: one holds 1, 2, 3 and the other holds 7, 8, 9.<\/p><\/div><div class=\"ps-col\"><h4>Total Overlap<\/h4><div class=\"ps-f\">A = {2, 4, 6}<\/div><div class=\"ps-f\">B = {4, 6}<\/div><p>The small circle (4, 6) sits completely inside the big circle, which also holds 2.<\/p><\/div><\/div>","plain":"<p>Two sets can share nothing at all (zero overlap) or one set can sit entirely inside the other (total overlap). These are the smallest and largest possible overlaps. When a GRE question does not tell you the overlap, work out both extremes — the true answer can be anything in between.<\/p>","fun":"Many GRE questions will ask that you calculate these two extremes and select any values between the two.","check":{"q":"Set A has 10 elements and set B has 6 elements. What are the smallest and largest possible numbers of elements in A ∩ B?","a":"Smallest 0, largest 6","why":"Zero overlap gives |A ∩ B| = 0. Total overlap puts all 6 elements of B inside A, giving |A ∩ B| = 6."},"fig":"<svg viewBox=\"0 0 580 220\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"150\" y=\"26\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">Zero Overlap<\/text><text x=\"440\" y=\"26\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">Total Overlap<\/text><line x1=\"300\" y1=\"40\" x2=\"300\" y2=\"205\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><circle cx=\"85\" cy=\"130\" r=\"62\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\"/><circle cx=\"215\" cy=\"130\" r=\"62\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\"/><text x=\"70\" y=\"112\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"17\">1<\/text><text x=\"100\" y=\"136\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"17\">2<\/text><text x=\"76\" y=\"165\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"17\">3<\/text><text x=\"200\" y=\"112\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"17\">7<\/text><text x=\"232\" y=\"136\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"17\">8<\/text><text x=\"206\" y=\"165\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"17\">9<\/text><circle cx=\"440\" cy=\"128\" r=\"78\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\"/><circle cx=\"415\" cy=\"135\" r=\"42\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\"/><text x=\"402\" y=\"128\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"17\">4<\/text><text x=\"425\" y=\"160\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"17\">6<\/text><text x=\"478\" y=\"98\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"17\">2<\/text><\/svg>"},"da-29":{"title":"Inclusion-Exclusion Formula","subj":"da","page":29,"group":14,"body":"<p><span class=\"hl\"><b>The inclusion-exclusion formula<\/b><\/span> is useful for determining the number of elements in the union and intersection of two sets.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><div class=\"ps-f\">|A ∪ B| = |A| + |B| − |A ∩ B|<\/div><div class=\"ps-f\">↓<\/div><div class=\"ps-f\">total = A + B − both<\/div><p><span class=\"note\">easier version<\/span><\/p><\/div><div class=\"ps-col\"><h4>Example<\/h4><p>In a school of 90 students, 75 take biology and 52 take chemistry. None take neither. How many take both?<\/p><div class=\"ps-f\">90 = 75 + 52 − both<\/div><div class=\"ps-f\">−37 = −both<\/div><div class=\"ps-box\"><div class=\"ps-f\"><span class=\"ok\">37 = both<\/span><\/div><\/div><\/div><\/div>","plain":"<p>If you add the two groups, the people in both groups get counted twice. So subtract “both” once: total = A + B − both. Plug in the numbers you know and solve for the one you don’t.<\/p>","fun":"The formula often contains a <span class=\"m\">+ neither<\/span> at the end to account for elements not included in either finite set.","check":{"q":"In a club of 60 students, 35 play soccer and 30 play basketball. Every student plays at least one of the two. How many play both?","choices":["5","10","25","30","65"],"a":"A · 5","why":"60 = 35 + 30 − both, so 60 = 65 − both, and both = 5."}},"da-30":{"title":"Venn versus Table","subj":"da","page":30,"group":14,"body":"<p><b>Sometimes it’s helpful to use a <span class=\"hl\">Venn Diagram<\/span> or <span class=\"hl\">Table<\/span> to solve sets problems.<\/b><\/p><div class=\"ps-box\"><p>In a certain neighborhood with 87 houses, 46 have a pool and 71 have a garage. If 15 houses have a pool but no garage, how many houses have neither?<\/p><\/div><div class=\"ps-cols\"><div class=\"ps-col\"><p>Venn diagram: Pool only = 15, Pool and Garage = <span class=\"m\">x<\/span>, Garage only = <span class=\"m\">y<\/span>, outside both circles = <span class=\"m\">z<\/span>.<\/p><p>You would use the Venn Diagram to solve for some variables before ultimately solving for <span class=\"m\">z<\/span> (the neither case).<\/p><\/div><div class=\"ps-col\"><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><th><\/th><th>Garage<\/th><th>No Garage<\/th><th><\/th><\/tr><tr><td><b>Pool<\/b><\/td><td><span class=\"m\">a<\/span><\/td><td>15<\/td><td>46<\/td><\/tr><tr><td><b>No Pool<\/b><\/td><td><span class=\"m\">b<\/span><\/td><td><span class=\"m\">c<\/span><\/td><td><span class=\"m\">d<\/span><\/td><\/tr><tr><td><\/td><td>71<\/td><td><span class=\"m\">e<\/span><\/td><td>87<\/td><\/tr><\/table><\/div><p>You would use table to solve for the variables before ultimately solving for <span class=\"m\">c<\/span> (the neither case).<\/p><\/div><\/div>","plain":"<p>Both tools keep the groups straight. In the table, each row and each column must add up to its total, so you fill in the blanks one at a time until you reach the “neither” box. Here: a = 46 − 15 = 31, b = 71 − 31 = 40, d = 87 − 46 = 41, so c = 41 − 40 = 1 house has neither.<\/p>","fun":"Once people get used to the table method, many people prefer it over the Venn Diagram.","check":{"q":"Of 50 students, 30 take French and 20 take Spanish. If 12 take French but not Spanish, how many take neither language?","a":"18","why":"Both = 30 − 12 = 18. Spanish only = 20 − 18 = 2. Neither = 50 − 12 − 18 − 2 = 18."},"fig":"<svg viewBox=\"0 0 380 232\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"150\" cy=\"135\" r=\"80\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\"/><circle cx=\"240\" cy=\"135\" r=\"80\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\"/><text x=\"125\" y=\"38\" text-anchor=\"middle\" style=\"fill:var(--red)\" font-size=\"15\">Pool<\/text><text x=\"268\" y=\"38\" text-anchor=\"middle\" style=\"fill:var(--red)\" font-size=\"15\">Garage<\/text><text x=\"345\" y=\"62\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"17\" font-style=\"italic\">z<\/text><text x=\"112\" y=\"141\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"18\">15<\/text><text x=\"195\" y=\"141\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"18\" font-style=\"italic\">x<\/text><text x=\"280\" y=\"141\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"18\" font-style=\"italic\">y<\/text><\/svg>"},"da-31":{"title":"Three Overlapping Sets","subj":"da","page":31,"group":14,"body":"<div class=\"ps-box\"><p>In a certain neighborhood with 110 houses, 30 have a pool, 90 have a garage, and 50 have a garden. If every house has at least one of the three options and 15 houses have all three, how many of the houses have exactly two?<\/p><\/div><div class=\"ps-cols\"><div class=\"ps-col\"><p>Venn diagram with three circles: Pool, Garage, Garden. The <span class=\"ok\">green<\/span> areas are where exactly two circles overlap; the <span class=\"hl\">red<\/span> area in the middle is where all three overlap.<\/p><\/div><div class=\"ps-col\"><p><b>NOTICE:<\/b> The <span class=\"ok\">green<\/span> area is being double counted once. The <span class=\"hl\">red<\/span> area is being double counted twice. We need to remove the double countings in the formula.<\/p><div class=\"ps-f\">total = A + B + C − <span class=\"ok\">exactly two<\/span> − 2(<span class=\"hl\">all three<\/span>)<\/div><div class=\"ps-f\">110 = 30 + 90 + 50 − <span class=\"ok\">exactly two<\/span> − 2(<span class=\"hl\">15<\/span>)<\/div><div class=\"ps-box\"><div class=\"ps-f\"><span class=\"ok\">exactly two<\/span> = 30<\/div><\/div><\/div><\/div>","plain":"<p>When you add the three groups, a house in exactly two groups is counted one extra time, and a house in all three is counted two extra times. Subtract those extras: total = A + B + C − (exactly two) − 2(all three). This formula works when every item is in at least one group (no “neither”).<\/p>","fun":"This is just one version of a triple overlapping set formula. There are others. Unfortunately. ☹","check":{"q":"A club has 100 members, and each belongs to at least one of three teams. The teams have 40, 50, and 60 members, and 10 members are on all three teams. How many members are on exactly two teams?","choices":["10","20","30","40","50"],"a":"C · 30","why":"100 = 40 + 50 + 60 − exactly two − 2(10) = 130 − exactly two, so exactly two = 30."},"fig":"<svg viewBox=\"0 0 400 326\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"160.0\" cy=\"118.0\" r=\"85\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\"/><circle cx=\"240.0\" cy=\"118.0\" r=\"85\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\"/><circle cx=\"200.0\" cy=\"187.3\" r=\"85\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\"/><polygon points=\"200.0,43.0 196.8,44.8 193.6,46.8 190.6,48.9 187.6,51.1 184.7,53.4 182.0,55.9 179.3,58.5 176.8,61.2 17 54.0 123.3,150.6 125.0,147.3 126.8,144.0 128.8,140.9 130.9,137.8 133.1,134.9 135.4,132.0 137.9,129.2 140.5,126.6 143.2,124.0 146.0,121.6 148.9,119.3 151.9,117.2 155.0,115.1 155.0,115.1 155.0,119.1 155.1,123.0 155.5,127.0 156.0,130.9 156.7,134.8 157.5,138.6 158.6,142.4 159.8,146.2 161.2,149.9 162.8,153.5 164.5,157.0 166.4,160.5 168.4,163.9 170.6,167.1 173.0,170.3 175.5,173.4 178.1,176.3 180.9,179.1 183.8,181.8 186.8,184.3 190.0,186.7 193.2,189.0 196.6,191.1 200.0,193.0 200.0,193.0 196.7,194.7 193.3,196.2 189.9,197.6 186.4,198.8 182.8,199.9 179.2,200.8 175.6,201.6 171.9,202.2 168.3,202.6 164.6,202.9 160.8,203.0 157.1,203.0 153.4,202.7 149.7,202.4 146.1,201.9 142.4,201.2 138.8,200.3 135.3,199.3 131.7,198.2 128.3,196.9 124.8,195.4 121.5,193.8 118.2,192.0 115.0,190.1\" fill=\"none\" style=\"fill:var(--amber-wash);stroke:var(--green)\" stroke-width=\"3\"/><polygon points=\"200.0,193.0 203.4,191.1 206.8,189.0 210.0,186.7 213.2,184.3 216.2,181.8 219.1,179.1 221.9,176.3 224.5,173.4 227.0,170.3 229.4,167.1 231.6,163.9 233.6,160.5 235.5,157.0 237.2,153.5 238.8,149.9 240.2,146.2 241.4,142.4 242.5,138.6 243.3,134.8 244.0,130.9 244.5,127.0 244.9,123.0 245.0,119.1 245.0,115.1 245.0,115.1 241.6,113.1 238.1,111.3 234.5,109.6 230.9,108.1 227.1,106.7 223.4,105.6 219.6,104.6 215.7,103.7 211.8,103.1 207.9,102.6 203.9,102.4 200.0,102.3 196.1,102.4 192.1,102.6 188.2,103.1 184.3,103.7 180.4,104.6 176.6,105.6 172.9,106.7 169.1,108.1 165.5,109.6 161.9,111.3 158.4,113.1 155.0,115.1 155.0,115.1 155.0,119.1 155.1,123.0 155.5,127.0 156.0,130.9 156.7,134.8 157.5,138.6 158.6,142.4 159.8,146.2 161.2,149.9 162.8,153.5 164.5,157.0 166.4,160.5 168.4,163.9 170.6,167.1 173.0,170.3 175.5,173.4 178.1,176.3 180.9,179.1 183.8,181.8 186.8,184.3 190.0,186.7 193.2,189.0 196.6,191.1 200.0,193.0\" fill=\"none\" style=\"fill:var(--red);stroke:var(--red)\" stroke-width=\"1.5\"/><text x=\"22\" y=\"44\" text-anchor=\"start\" style=\"fill:var(--ink)\" font-size=\"15\">Pool<\/text><text x=\"378\" y=\"44\" text-anchor=\"end\" style=\"fill:var(--ink)\" font-size=\"15\">Garage<\/text><text x=\"22\" y=\"262\" text-anchor=\"start\" style=\"fill:var(--ink)\" font-size=\"15\">Garden<\/text><text x=\"200\" y=\"314\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">green outline = exactly two   ·   red = all three<\/text><\/svg>"},"da-32":{"title":"The \"Choice\" Method","subj":"da","page":32,"group":15,"body":"<p>The <b>“choice” method<\/b> is also known as the <b>multiplication principle<\/b>.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Example 1<\/h4><p>(Picture: 3 shirts, 2 pairs of pants, 3 hats.)<\/p><p>How many outfits?<\/p><div class=\"ps-f\">3 × 2 × 3<\/div><\/div><div class=\"ps-col\"><h4>Example 2<\/h4><p>(Picture: 4 seats in a row.)<\/p><p>How many seating arrangements?<\/p><div class=\"ps-f\">4 × 3 × 2 × 1<\/div><\/div><div class=\"ps-col\"><h4>Example 3<\/h4><p>(Picture: a deck of cards.)<\/p><p>How many deck arrangements?<\/p><div class=\"ps-f\">52 × 51 × 50 … × 2 × 1<\/div><div class=\"ps-f\">52!<\/div><\/div><\/div>","plain":"<p>Draw one blank for each choice you must make, write how many options you have in each blank, then multiply. When you place people or cards one at a time, each blank has one fewer option than the one before: 4 × 3 × 2 × 1. That shrinking product is written with “!” (4! = 24).<\/p>","fun":"Because 52! is so large, a properly shuffled deck of cards has an arrangement that has never been seen before.","check":{"q":"You have 4 shirts, 3 pairs of pants, and 2 pairs of shoes. How many different outfits (one of each) can you make?","choices":["9","12","24","36"],"a":"C · 24","why":"Multiply the choices: 4 × 3 × 2 = 24."}},"da-33":{"title":"Intro to Combinatorics","subj":"da","page":33,"group":15,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Permutations<\/h4><p>order <span class=\"hl\">IS<\/span> important<\/p><h4>Combinations<\/h4><p>order is <span class=\"hl\">NOT<\/span> important<\/p><\/div><div class=\"ps-col\"><p>(Picture: 5 people.)<\/p><p><span class=\"note\">Choosing 3 people from 5<\/span><\/p><ul class=\"ps-list\"><li><span class=\"note\">60 permutations<\/span><\/li><li><span class=\"note\">10 combinations<\/span><\/li><\/ul><p><span class=\"note\">permutations &gt; combinations<\/span><\/p><\/div><\/div>","plain":"<p>A permutation counts arrangements where order matters (who is 1st, 2nd, 3rd). A combination counts groups where order does not matter (just who is in). The same choice of 3 people from 5 gives 60 ordered results but only 10 groups, so permutations are always at least as many as combinations.<\/p>","fun":"It’s not always clear if order is important. See the flashcard about “Permutations or Combinations” for help.","check":{"q":"A club picks a president and a vice-president from its members. Is this a permutation or a combination?","choices":["Permutation","Combination"],"a":"A · Permutation","why":"The two jobs are different, so swapping the two people gives a different result — order matters."}},"da-34":{"title":"Permutations or Combinations?","subj":"da","page":34,"group":15,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Permutations<\/h4><p><span class=\"note\">common vocabulary<\/span><\/p><ul class=\"ps-list\"><li>“order matters” → <span class=\"ok\">lists<\/span><\/li><li>arranged/arrangements<\/li><li>ranking<\/li><li>routes<\/li><li>“first,” “second,” “third…”<\/li><li>position/placement<\/li><li>“in a row”/ “in a line”<\/li><\/ul><\/div><div class=\"ps-col\"><h4>Combinations<\/h4><p><span class=\"note\">common vocabulary<\/span><\/p><ul class=\"ps-list\"><li>“order does not matter”<\/li><li>group/groupings<\/li><li>sets/subsets<\/li><li>“unordered”<\/li><li>teams/committees<\/li><li>pair/pairings<\/li><\/ul><\/div><\/div>","plain":"<p>Look for these signal words in the question. Words about order, ranking, positions or lines point to permutations. Words about groups, teams, committees or pairs point to combinations, because a team is the same team no matter what order you name its members.<\/p>","fun":"A problem might have two parts, one in which permutations are calculated and the other in which combinations are.","check":{"q":"Which word in a question most likely signals a <b>combination<\/b>?","choices":["ranking","routes","committee","in a line"],"a":"C · committee","why":"A committee is a group: the order in which members are picked does not matter. The other three words signal order, so they point to permutations."}},"da-35":{"title":"Combinatorics Notation","subj":"da","page":35,"group":15,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Permutations<\/h4><div class=\"ps-box\"><div class=\"ps-f\"><span class=\"fr\"><span>n!<\/span><span>(n − r)!<\/span><\/span><\/div><\/div><div class=\"ps-f\"><sub>n<\/sub>P<sub>r<\/sub> P<sup>n<\/sup><sub>r<\/sub><\/div><div class=\"ps-f\">P(n, r)<\/div><\/div><div class=\"ps-col\"><h4>Combinations<\/h4><div class=\"ps-box\"><div class=\"ps-f\"><span class=\"fr\"><span>n!<\/span><span>r! (n − r)!<\/span><\/span><\/div><\/div><div class=\"ps-f\"><sub>n<\/sub>C<sub>r<\/sub> C<sup>n<\/sup><sub>r<\/sub><\/div><div class=\"ps-f\">C(n, r) (<sup>n<\/sup><sub>r<\/sub>)<\/div><p><span class=\"note\">the last one is n written above r inside parentheses<\/span><\/p><\/div><\/div>","plain":"<p>Different books write the same thing in different ways. Every symbol in the left column means “permutations of r things chosen from n.” Every symbol in the right column means “combinations of r things chosen from n.” Learn to recognise all of them so the notation never confuses you.<\/p>","fun":"A problem in the GRE Official Guide uses the parentheses combination notation, so keep an eye out.","check":{"q":"Which of these means the same thing as <sub>8<\/sub>C<sub>3<\/sub>?","choices":["P(8, 3)","C(8, 3)","C(3, 8)","<span class=\"fr\"><span>8!<\/span><span>(8 − 3)!<\/span><\/span>"],"a":"B · C(8, 3)","why":"<sub>n<\/sub>C<sub>r<\/sub> and C(n, r) are two ways to write the same combination, with n = 8 and r = 3. The fraction 8!/(8 − 3)! is the permutation formula."}},"da-36":{"title":"Permutations","subj":"da","page":36,"group":15,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Formula<\/h4><div class=\"ps-box\"><div class=\"ps-f\"><span class=\"fr\"><span>n!<\/span><span>(n − r)!<\/span><\/span><\/div><\/div><div class=\"ps-f\">n = total r = # chosen<\/div><\/div><div class=\"ps-col\"><h4>Example<\/h4><p>Ten people enter a contest. In how many ways can 1<sup>st<\/sup>, 2<sup>nd<\/sup>, and 3<sup>rd<\/sup> place be determined?<\/p><div class=\"ps-f\">n = 10 r = 3<\/div><div class=\"ps-f\"><span class=\"fr\"><span>10!<\/span><span>(10 − 3)!<\/span><\/span> = <span class=\"ok\">720<\/span><\/div><\/div><\/div>","plain":"<p>Use this formula when you choose r things out of n and the order matters. n is how many you have in total; r is how many you pick. 10!/7! is just 10 × 9 × 8 = 720 — the same as the choice method with three blanks.<\/p>","fun":"You’ll notice in many cases the “choice method” is an easier implementation of the permutation formula.","check":{"q":"Eight runners are in a race. In how many ways can gold, silver, and bronze medals be awarded?","choices":["24","56","336","512","40,320"],"a":"C · 336","why":"n = 8, r = 3: 8!/(8 − 3)! = 8!/5! = 8 × 7 × 6 = 336."}},"da-37":{"title":"Permutations w/ Restrictions","subj":"da","page":37,"group":15,"body":"<div class=\"ps-box\"><p>Sometimes permutation problems have certain <b>“restrictions”<\/b> or <b>“rules.”<\/b><\/p><\/div><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Example 1<\/h4><p>How many 3-digit integers end in two even numbers?<\/p><div class=\"ps-f\">9 × 5 × 5<\/div><ul class=\"ps-list\"><li>1st digit: 1, 2, 3, 4, 5, 6, 7, 8, 9<\/li><li>2nd digit: 0, 2, 4, 6, 8<\/li><li>3rd digit: 0, 2, 4, 6, 8<\/li><\/ul><p><span class=\"note\">restrictions<\/span> (arrows point to the 2nd and 3rd digits)<\/p><\/div><div class=\"ps-col\"><h4>Example 2<\/h4><p>How many seating arrangements if John must sit at the left end?<\/p><p>(Picture: 4 seats in a row; an arrow into the left-end seat is labelled <span class=\"note\">restriction<\/span>.)<\/p><div class=\"ps-f\">1 × 3 × 2 × 1<\/div><\/div><div class=\"ps-col\"><h4>Example 3<\/h4><p>How many seating arrangements if John must sit at <b>ONE<\/b> of the ends?<\/p><p>(Picture: 4 seats in a row; arrows into both end seats, each labelled <span class=\"note\">restriction<\/span>.)<\/p><div class=\"ps-f\">2 × 3 × 2 × 1<\/div><\/div><\/div>","plain":"<p>A restriction is a rule that limits what can go in a certain spot. Fill the restricted spot first (count only the options allowed there), then fill the other spots with whatever is left, and multiply. A 3-digit number can’t start with 0, which is why the first blank has 9 choices.<\/p>","fun":"Restriction problems are often easier to solve if you start the calculation with the restricted area.","check":{"q":"Five people sit in a row of 5 chairs. If Mary must sit in the middle chair, how many seating arrangements are possible?","choices":["5","20","24","120"],"a":"C · 24","why":"The middle chair has 1 choice (Mary). The other 4 people fill 4 chairs: 1 × 4 × 3 × 2 × 1 = 24."}},"da-38":{"title":"Sitting Together","subj":"da","page":38,"group":15,"body":"<p><span class=\"hl\">Question:<\/span> Six friends (A, B, C, D, E, and F) go to a movie together. If B, C, and D must sit together, how many different seating arrangements are possible?<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><div class=\"ps-f\">A [ B C D ] E F<\/div><p><span class=\"note\">↑ consider as one “block” or one element of the set<\/span><\/p><\/div><div class=\"ps-col\"><p>We have four elements:<\/p><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><th><span class=\"note\">1<\/span><\/th><th><span class=\"note\">2<\/span><\/th><th><span class=\"note\">3<\/span><\/th><th><span class=\"note\">4<\/span><\/th><\/tr><tr><td>A<\/td><td>BCD<\/td><td>E<\/td><td>F<\/td><\/tr><\/table><\/div><div class=\"ps-box\"><div class=\"ps-f\">4 × 3 × 2 × 1 = 24<\/div><\/div><p>But don’t forget…the BCD element can be arranged six different ways!<\/p><div class=\"ps-box\"><div class=\"ps-f\">24 × 6 = <span class=\"ok\">144<\/span><\/div><\/div><\/div><\/div>","plain":"<p>When some people must sit together, glue them into one block and count the block as one person. Arrange the blocks, then multiply by the number of ways to arrange the people inside the block (here 3! = 6).<\/p>","fun":"The BCD element from above can be arranged six different ways because of 3 × 2 × 1.","check":{"q":"Five friends sit in a row. If A and B must sit next to each other, how many seating arrangements are possible?","choices":["24","48","60","120"],"a":"B · 48","why":"Treat AB as one block: 4 elements give 4! = 24 arrangements. The block itself can be AB or BA (2 ways): 24 × 2 = 48."}},"da-39":{"title":"Subtracting Out","subj":"da","page":39,"group":15,"body":"<p><span class=\"hl\">Question:<\/span> Six friends (A, B, C, D, E, and F) go to a movie together. If B and C <b>cannot<\/b> sit next to each other, how many different seating arrangements are possible.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><p>Sometimes it makes more sense to calculate the total without restrictions and subtract out what you don’t want.<\/p><div class=\"ps-f\">total − undesired<\/div><p><span class=\"note\">↑ no restrictions<\/span><\/p><\/div><div class=\"ps-col\"><div class=\"ps-f\"><b>Total:<\/b> 6! = 720<\/div><div class=\"ps-f\"><b>Undesired:<\/b> 2 × 5! = 240<\/div><p><span class=\"note\">see “sitting together” card<\/span><\/p><div class=\"ps-box\"><div class=\"ps-f\">720 − 240 = <span class=\"ok\">480<\/span><\/div><\/div><\/div><\/div>","plain":"<p>“Cannot sit together” is hard to count directly. So count every arrangement, then count the ones you don’t want (B and C together, using the block trick: 5! × 2), and subtract.<\/p>","fun":"For example, you wouldn’t want to seat Chris Rock and Will Smith together at the Oscars.","check":{"q":"Five friends sit in a row. If A and B cannot sit next to each other, how many seating arrangements are possible?","choices":["48","72","96","120"],"a":"B · 72","why":"Total = 5! = 120. Undesired (A and B together) = 2 × 4! = 48. 120 − 48 = 72."}},"da-40":{"title":"Permutations w/ Repeats","subj":"da","page":40,"group":15,"body":"<p>How many different ways can the letters in the word <span class=\"hl\">MISSISSIPPI<\/span> be arranged?<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><div class=\"ps-f\">MISSISSIPPI<\/div><ul class=\"ps-list\"><li>I: <span class=\"note\">Four<\/span><\/li><li>S: <span class=\"note\">Four<\/span><\/li><li>P: <span class=\"note\">two<\/span><\/li><\/ul><p>Notice there are 11 letters total but the S and I each occur four times and the P occurs twice.<\/p><\/div><div class=\"ps-col\"><div class=\"ps-f\"><span class=\"fr\"><span>total!<\/span><span>a! b! c!<\/span><\/span><\/div><p><span class=\"note\"># of repeats<\/span> (a, b, c)<\/p><div class=\"ps-f\"><span class=\"fr\"><span>11!<\/span><span>4! 4! 2!<\/span><\/span> = 34,650<\/div><\/div><\/div>","plain":"<p>If some letters are the same, swapping two identical letters does not make a new word, so you must divide those repeats out. Take the total letters factorial, then divide by the factorial of each letter’s count. Letters that appear only once (like M) just divide by 1! = 1.<\/p>","fun":"The longest word in English with no repeated letters is “uncopyrightable.”","check":{"q":"How many different ways can the letters in the word LEVEL be arranged?","choices":["15","30","60","120"],"a":"B · 30","why":"5 letters with L twice and E twice: 5!/(2! 2!) = 120/4 = 30."}},"da-41":{"title":"Permutations in a Circle","subj":"da","page":41,"group":15,"body":"<p>How many different ways can 4 people around a <span class=\"hl\">circular table<\/span> arrange themselves?<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><p>(Picture: a round table with A at the top, B on the right, C at the bottom and D on the left.)<\/p><\/div><div class=\"ps-col\"><div class=\"ps-f\"><span class=\"hl\"><b>Wrong:<\/b><\/span> 4! = 24<\/div><p>This approach is wrong because some of the circular arrangements are repeats (see below).<\/p><p>(Four circles: A top/B right/C bottom/D left = D top/A right/B bottom/C left = C top/D right/A bottom/B left = B top/C right/D bottom/A left.)<\/p><div class=\"ps-f\"><span class=\"ok\"><b>Correct:<\/b><\/span> (4 − 1)! = 6<\/div><\/div><\/div>","plain":"<p>Around a round table, turning everyone one seat over gives the same arrangement — each person still has the same neighbours. To remove these repeats, fix one person’s seat and arrange the rest: (n − 1)! for n people.<\/p>","fun":"The 12 Knights of the Round Table could arrange themselves in 11!, or 39,916,800, ways.","check":{"q":"In how many different ways can 6 people sit around a circular table?","choices":["24","120","360","720"],"a":"B · 120","why":"Use (n − 1)! with n = 6: 5! = 120."},"fig":"<svg viewBox=\"0 0 600 210\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"85\" cy=\"112\" r=\"52\" fill=\"none\" style=\"stroke:var(--ink);fill:var(--amber-wash)\" stroke-width=\"2\"/><text x=\"85\" y=\"46\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"16\">A<\/text><text x=\"155\" y=\"117\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"16\">B<\/text><text x=\"85\" y=\"190\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"16\">C<\/text><text x=\"16\" y=\"117\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"16\">D<\/text><text x=\"85\" y=\"117\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">table<\/text><circle cx=\"235\" cy=\"112\" r=\"42\" fill=\"none\" style=\"stroke:var(--blue);fill:var(--blue-wash)\" stroke-width=\"2\"/><text x=\"235\" y=\"92\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">A<\/text><text x=\"259\" y=\"117\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">B<\/text><text x=\"235\" y=\"145\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">C<\/text><text x=\"211\" y=\"117\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">D<\/text><text x=\"287\" y=\"118\" text-anchor=\"middle\" style=\"fill:var(--red)\" font-size=\"17\">=<\/text><circle cx=\"340\" cy=\"112\" r=\"42\" fill=\"none\" style=\"stroke:var(--blue);fill:var(--blue-wash)\" stroke-width=\"2\"/><text x=\"340\" y=\"92\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">D<\/text><text x=\"364\" y=\"117\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">A<\/text><text x=\"340\" y=\"145\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">B<\/text><text x=\"316\" y=\"117\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">C<\/text><text x=\"392\" y=\"118\" text-anchor=\"middle\" style=\"fill:var(--red)\" font-size=\"17\">=<\/text><circle cx=\"445\" cy=\"112\" r=\"42\" fill=\"none\" style=\"stroke:var(--blue);fill:var(--blue-wash)\" stroke-width=\"2\"/><text x=\"445\" y=\"92\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">C<\/text><text x=\"469\" y=\"117\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">D<\/text><text x=\"445\" y=\"145\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">A<\/text><text x=\"421\" y=\"117\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">B<\/text><text x=\"497\" y=\"118\" text-anchor=\"middle\" style=\"fill:var(--red)\" font-size=\"17\">=<\/text><circle cx=\"550\" cy=\"112\" r=\"42\" fill=\"none\" style=\"stroke:var(--blue);fill:var(--blue-wash)\" stroke-width=\"2\"/><text x=\"550\" y=\"92\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">B<\/text><text x=\"574\" y=\"117\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">C<\/text><text x=\"550\" y=\"145\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">D<\/text><text x=\"526\" y=\"117\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">A<\/text><text x=\"392\" y=\"185\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">the same seating, turned around the table<\/text><\/svg>"},"da-42":{"title":"Combinations","subj":"da","page":42,"group":15,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Formula<\/h4><div class=\"ps-box\"><div class=\"ps-f\"><span class=\"fr\"><span>n!<\/span><span>r! (n − r)!<\/span><\/span><\/div><\/div><div class=\"ps-f\">n = total r = # chosen<\/div><\/div><div class=\"ps-col\"><h4>Example<\/h4><p>Ten people enter a contest. In how many ways can a group of three different people be selected?<\/p><div class=\"ps-f\">n = 10 r = 3<\/div><div class=\"ps-f\"><span class=\"fr\"><span>10!<\/span><span>3! (10 − 3)!<\/span><\/span> = <span class=\"ok\">120<\/span><\/div><\/div><\/div>","plain":"<p>Use this when you choose r things out of n and order does not matter. It is the permutation formula with an extra r! on the bottom, which removes the different orders of the same group. Compare: 720 ways to award 1st/2nd/3rd, but only 720 ÷ 3! = 120 groups of three.<\/p>","fun":"In the PowerBall lottery, one must correctly select a group of 5 numbers from 1 − 69: 11,238,513 possibilities.","check":{"q":"In how many ways can a 2-person team be chosen from 6 people?","choices":["12","15","30","36"],"a":"B · 15","why":"6!/(2! 4!) = (6 × 5)/(2 × 1) = 30/2 = 15."}},"da-43":{"title":"The Combinations Pattern","subj":"da","page":43,"group":15,"body":"<p><span class=\"hl\">Question:<\/span> In how many ways can you choose 0 people from 6? 1 person? 2 people? 3 people? 4 people? 5 people? 6 people? This follows a symmetrical pattern (see below).<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Even Total<\/h4><p><span class=\"note\">6 elements<\/span><\/p><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><td>chosen<\/td><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><td>6<\/td><\/tr><tr><td>ways<\/td><td>1<\/td><td>6<\/td><td>15<\/td><td>20<\/td><td>15<\/td><td>6<\/td><td>1<\/td><\/tr><\/table><\/div><\/div><div class=\"ps-col\"><h4>Odd Total<\/h4><p><span class=\"note\">7 elements<\/span><\/p><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><td>chosen<\/td><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><td>6<\/td><td>7<\/td><\/tr><tr><td>ways<\/td><td>1<\/td><td>7<\/td><td>21<\/td><td>35<\/td><td>35<\/td><td>21<\/td><td>7<\/td><td>1<\/td><\/tr><\/table><\/div><\/div><\/div>","plain":"<p>Choosing r people is the same as choosing the n − r people you leave out, so the counts are symmetrical: C(6, 2) = C(6, 4) = 15. The biggest count is in the middle. With an even total there is one middle peak; with an odd total there are two equal peaks.<\/p>","fun":"The more astute learner will recognize these patterns in Pascal’s Triangle (Google it to check it out).","check":{"q":"C(10, 2) = 45. What is C(10, 8)?","choices":["20","45","80","90"],"a":"B · 45","why":"Choosing 8 of 10 is the same as choosing the 2 to leave out, so C(10, 8) = C(10, 2) = 45."},"fig":"<svg viewBox=\"0 0 640 254\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"160\" y=\"22\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">Even Total (6 elements)<\/text><text x=\"475\" y=\"22\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">Odd Total (7 elements)<\/text><line x1=\"318\" y1=\"34\" x2=\"318\" y2=\"226\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><rect x=\"25\" y=\"201\" width=\"30\" height=\"4\" fill=\"none\" style=\"fill:var(--blue);stroke:var(--blue)\" stroke-width=\"1\"/><text x=\"40\" y=\"195\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">1<\/text><text x=\"40\" y=\"225\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">0<\/text><rect x=\"65\" y=\"181\" width=\"30\" height=\"24\" fill=\"none\" style=\"fill:var(--blue);stroke:var(--blue)\" stroke-width=\"1\"/><text x=\"80\" y=\"175\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">6<\/text><text x=\"80\" y=\"225\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">1<\/text><rect x=\"105\" y=\"145\" width=\"30\" height=\"60\" fill=\"none\" style=\"fill:var(--blue);stroke:var(--blue)\" stroke-width=\"1\"/><text x=\"120\" y=\"139\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">15<\/text><text x=\"120\" y=\"225\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">2<\/text><rect x=\"145\" y=\"125\" width=\"30\" height=\"80\" fill=\"none\" style=\"fill:var(--blue);stroke:var(--blue)\" stroke-width=\"1\"/><text x=\"160\" y=\"119\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">20<\/text><text x=\"160\" y=\"225\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">3<\/text><rect x=\"185\" y=\"145\" width=\"30\" height=\"60\" fill=\"none\" style=\"fill:var(--blue);stroke:var(--blue)\" stroke-width=\"1\"/><text x=\"200\" y=\"139\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">15<\/text><text x=\"200\" y=\"225\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">4<\/text><rect x=\"225\" y=\"181\" width=\"30\" height=\"24\" fill=\"none\" style=\"fill:var(--blue);stroke:var(--blue)\" stroke-width=\"1\"/><text x=\"240\" y=\"175\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">6<\/text><text x=\"240\" y=\"225\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">5<\/text><rect x=\"265\" y=\"201\" width=\"30\" height=\"4\" fill=\"none\" style=\"fill:var(--blue);stroke:var(--blue)\" stroke-width=\"1\"/><text x=\"280\" y=\"195\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">1<\/text><text x=\"280\" y=\"225\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">6<\/text><rect x=\"334\" y=\"201\" width=\"28\" height=\"4\" fill=\"none\" style=\"fill:var(--blue);stroke:var(--blue)\" stroke-width=\"1\"/><text x=\"348\" y=\"195\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">1<\/text><text x=\"348\" y=\"225\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">0<\/text><rect x=\"370\" y=\"177\" width=\"28\" height=\"28\" fill=\"none\" style=\"fill:var(--blue);stroke:var(--blue)\" stroke-width=\"1\"/><text x=\"384\" y=\"171\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">7<\/text><text x=\"384\" y=\"225\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">1<\/text><rect x=\"406\" y=\"121\" width=\"28\" height=\"84\" fill=\"none\" style=\"fill:var(--blue);stroke:var(--blue)\" stroke-width=\"1\"/><text x=\"420\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">21<\/text><text x=\"420\" y=\"225\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">2<\/text><rect x=\"442\" y=\"65\" width=\"28\" height=\"140\" fill=\"none\" style=\"fill:var(--blue);stroke:var(--blue)\" stroke-width=\"1\"/><text x=\"456\" y=\"59\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">35<\/text><text x=\"456\" y=\"225\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">3<\/text><rect x=\"478\" y=\"65\" width=\"28\" height=\"140\" fill=\"none\" style=\"fill:var(--blue);stroke:var(--blue)\" stroke-width=\"1\"/><text x=\"492\" y=\"59\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">35<\/text><text x=\"492\" y=\"225\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">4<\/text><rect x=\"514\" y=\"121\" width=\"28\" height=\"84\" fill=\"none\" style=\"fill:var(--blue);stroke:var(--blue)\" stroke-width=\"1\"/><text x=\"528\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">21<\/text><text x=\"528\" y=\"225\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">5<\/text><rect x=\"550\" y=\"177\" width=\"28\" height=\"28\" fill=\"none\" style=\"fill:var(--blue);stroke:var(--blue)\" stroke-width=\"1\"/><text x=\"564\" y=\"171\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">7<\/text><text x=\"564\" y=\"225\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">6<\/text><rect x=\"586\" y=\"201\" width=\"28\" height=\"4\" fill=\"none\" style=\"fill:var(--blue);stroke:var(--blue)\" stroke-width=\"1\"/><text x=\"600\" y=\"195\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">1<\/text><text x=\"600\" y=\"225\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">7<\/text><line x1=\"18\" y1=\"205\" x2=\"302\" y2=\"205\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1\"/><line x1=\"330\" y1=\"205\" x2=\"622\" y2=\"205\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1\"/><text x=\"320\" y=\"246\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">number of people chosen (bar height = number of ways)<\/text><\/svg>"},"da-44":{"title":"More than One Group","subj":"da","page":44,"group":15,"body":"<p><span class=\"hl\">Question:<\/span> For a research project, a professor will select 3 juniors from 6 and 2 seniors from 7. How many different group combinations are possible?<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><p>Find the number of combinations for each group separately and then multiply together.<\/p><div class=\"ps-f\">group 1 × group 2<\/div><\/div><div class=\"ps-col\"><div class=\"ps-f\"><b>Group 1:<\/b> <span class=\"fr\"><span>6!<\/span><span>3! (6 − 3)!<\/span><\/span> = 20<\/div><div class=\"ps-f\"><b>Group 2:<\/b> <span class=\"fr\"><span>7!<\/span><span>2! (7 − 2)!<\/span><\/span> = 21<\/div><div class=\"ps-box\"><div class=\"ps-f\">20 × 21 = <span class=\"ok\">420<\/span><\/div><\/div><\/div><\/div>","plain":"<p>When you pick from two separate groups, count each group on its own with the combination formula. Then multiply, because every choice from the first group can be paired with every choice from the second (the choice method again).<\/p>","fun":"There are 2,598,960 distinct 5-card poker hands that can be dealt from a 52-card deck.","check":{"q":"A committee needs 2 boys chosen from 5 and 2 girls chosen from 4. How many different committees are possible?","choices":["16","40","60","126"],"a":"C · 60","why":"Boys: C(5, 2) = 10. Girls: C(4, 2) = 6. Multiply: 10 × 6 = 60."}},"da-45":{"title":"Convert to Letters/Words","subj":"da","page":45,"group":15,"body":"<p>Converting difficult problems to <span class=\"ok\">letters<\/span> or <span class=\"ok\">words<\/span> can make life A LOT easier.<\/p><p><span class=\"hl\">Example:<\/span> If the car below can only travel North or East, what is the number of distinct routes (shortest possible) the car can take?<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><p>(A grid 4 blocks wide and 3 blocks tall. The car is at the bottom-left corner, <span class=\"note\">start<\/span>; the <span class=\"note\">end<\/span> is the top-right corner.)<\/p><\/div><div class=\"ps-col\"><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><td>Route 1:<\/td><td>NNNEEEE (green)<\/td><\/tr><tr><td>Route 2:<\/td><td>EEEENNN (blue)<\/td><\/tr><tr><td>Route 3:<\/td><td>NEENEEN (red)<\/td><\/tr><\/table><\/div><p>Notice every route has 7 letters: 3 Ns and 4 Es.<\/p><div class=\"ps-f\">Total = <span class=\"fr\"><span>7!<\/span><span>3! 4!<\/span><\/span> = <span class=\"ok\">35<\/span><\/div><\/div><\/div>","plain":"<p>Write each route as a “word” of moves: N for one block north, E for one block east. Every shortest route uses the same letters, just in a different order, so counting routes = counting arrangements of a word with repeated letters (MISSISSIPPI method).<\/p>","fun":"Don’t feel bad if you’re flying economy and not first class – the people in the front have to travel just as far as you.","check":{"q":"On a grid, a car must travel 2 blocks North and 3 blocks East, moving only North or East. How many shortest routes are there?","choices":["5","6","10","20"],"a":"C · 10","why":"Each route is a 5-letter word with 2 Ns and 3 Es: 5!/(2! 3!) = 120/12 = 10."},"fig":"<svg viewBox=\"0 0 460 312\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"60\" y1=\"270\" x2=\"60\" y2=\"30\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><line x1=\"140\" y1=\"270\" x2=\"140\" y2=\"30\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><line x1=\"220\" y1=\"270\" x2=\"220\" y2=\"30\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><line x1=\"300\" y1=\"270\" x2=\"300\" y2=\"30\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><line x1=\"380\" y1=\"270\" x2=\"380\" y2=\"30\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><line x1=\"60\" y1=\"270\" x2=\"380\" y2=\"270\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><line x1=\"60\" y1=\"190\" x2=\"380\" y2=\"190\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><line x1=\"60\" y1=\"110\" x2=\"380\" y2=\"110\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><line x1=\"60\" y1=\"30\" x2=\"380\" y2=\"30\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><polyline points=\"57,270 57,27 380,27\" fill=\"none\" style=\"stroke:var(--green)\" stroke-width=\"3\"/><polyline points=\"60,273 383,273 383,30\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"3\"/><polyline points=\"63,270 63,190 223,190 223,110 380,110 380,30\" fill=\"none\" style=\"stroke:var(--red)\" stroke-width=\"3\"/><circle cx=\"60\" cy=\"270\" r=\"6\" fill=\"none\" style=\"fill:var(--ink);stroke:var(--ink)\" stroke-width=\"1\"/><text x=\"60\" y=\"296\" text-anchor=\"middle\" style=\"fill:var(--red)\" font-size=\"13\">start<\/text><text x=\"380\" y=\"16\" text-anchor=\"middle\" style=\"fill:var(--red)\" font-size=\"13\">end<\/text><text x=\"415\" y=\"70\" text-anchor=\"start\" style=\"fill:var(--ink)\" font-size=\"12\">N ↑<\/text><text x=\"415\" y=\"90\" text-anchor=\"start\" style=\"fill:var(--ink)\" font-size=\"12\">E →<\/text><\/svg>"},"da-46":{"title":"Yes or No?","subj":"da","page":46,"group":15,"body":"<p>Some problems are most easily solved by thinking <span class=\"ok\">YES<\/span> or <span class=\"hl\">NO<\/span> (2 choices).<\/p><p><span class=\"hl\">Example:<\/span> A certain ice cream store has 8 toppings. If customers can have as few or as many toppings as they want, how many different combinations are possible?<\/p><div class=\"ps-f\">2 × 2 × 2 × 2 × 2 × 2 × 2 × 2<\/div><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><th><span class=\"note\">topping 1<\/span><\/th><th><span class=\"note\">topping 2<\/span><\/th><th><span class=\"note\">topping 3<\/span><\/th><th><span class=\"note\">topping 4<\/span><\/th><th><span class=\"note\">topping 5<\/span><\/th><th><span class=\"note\">topping 6<\/span><\/th><th><span class=\"note\">topping 7<\/span><\/th><th><span class=\"note\">topping 8<\/span><\/th><\/tr><tr><td>2<\/td><td>2<\/td><td>2<\/td><td>2<\/td><td>2<\/td><td>2<\/td><td>2<\/td><td>2<\/td><\/tr><tr><td><span class=\"note\">yes/no<\/span><\/td><td><span class=\"note\">yes/no<\/span><\/td><td><span class=\"note\">yes/no<\/span><\/td><td><span class=\"note\">yes/no<\/span><\/td><td><span class=\"note\">yes/no<\/span><\/td><td><span class=\"note\">yes/no<\/span><\/td><td><span class=\"note\">yes/no<\/span><\/td><td><span class=\"note\">yes/no<\/span><\/td><\/tr><\/table><\/div><div class=\"ps-box\"><div class=\"ps-f\">2⁸ = 256<\/div><\/div>","plain":"<p>For each topping you make one yes-or-no decision: on the cone or not. That is 2 choices per topping, and the choice method says multiply: 2 × 2 × … = 2⁸. This count includes the plain cone with no toppings at all.<\/p>","fun":"If you must choose AT LEAST one topping, you would have to remove the “all no” possibility: 2⁸ − 1.","check":{"q":"A pizza shop offers 5 toppings. A customer may choose any number of them, including none. How many different pizzas are possible?","choices":["10","25","31","32"],"a":"D · 32","why":"Each topping is yes or no: 2⁵ = 32. (It would be 31 only if at least one topping were required.)"}},"da-47":{"title":"Intro to Probability","subj":"da","page":47,"group":16,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Simple Formula<\/h4><div class=\"ps-f\"><span class=\"fr\"><span>desired outcomes<\/span><span>total outcomes<\/span><\/span><\/div><div class=\"ps-f\"><span class=\"fr\"><span>☺<\/span><span>total<\/span><\/span><\/div><\/div><div class=\"ps-col\"><h4>Example<\/h4><p>If someone were to select a random integer from the first twenty positive integers, what is the probability the number selected is prime?<\/p><div class=\"ps-box\"><div class=\"ps-f\">2 3 5 7 11 13 17 19<\/div><\/div><p><span class=\"note\">eight primes<\/span><\/p><div class=\"ps-f\"><span class=\"fr\"><span>8<\/span><span>20<\/span><\/span><\/div><\/div><\/div>","plain":"<p>Probability = (number of outcomes you want) ÷ (number of all possible outcomes). Count the “happy” outcomes on top and everything that could happen on the bottom. Here 8/20 simplifies to 2/5.<\/p>","fun":"Probability is always a number from 0 to 1, with zero representing no chance and 1 representing something guaranteed.","check":{"q":"A number is picked at random from the integers 1 to 10. What is the probability it is a multiple of 3?","choices":["<span class=\"fr\"><span>1<\/span><span>10<\/span><\/span>","<span class=\"fr\"><span>1<\/span><span>5<\/span><\/span>","<span class=\"fr\"><span>3<\/span><span>10<\/span><\/span>","<span class=\"fr\"><span>1<\/span><span>3<\/span><\/span>"],"a":"C · 3/10","why":"The multiples of 3 are 3, 6 and 9: 3 desired outcomes out of 10 total, so 3/10."}},"da-48":{"title":"Probability as Area","subj":"da","page":48,"group":16,"body":"<p>It’s very helpful to think of probability as “area.” Each outcome has a certain probability and all possible outcomes add up to an area of 1.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Heads or tails?<\/h4><p>(A box split into two equal halves: a coin showing heads in one, tails in the other; each half is <span class=\"hl\">1/2<\/span>.)<\/p><div class=\"ps-f\">Two total outcomes: <span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> + <span class=\"fr\"><span>1<\/span><span>2<\/span><\/span> = 1<\/div><\/div><div class=\"ps-col\"><h4>Red or yellow shirt? Or neither?<\/h4><p>(A light-blue box: the red shirt covers <span class=\"hl\">3/8<\/span>, the yellow shirt covers 1/8.)<\/p><p><span class=\"note\">neither (light blue) = 4/8<\/span><\/p><div class=\"ps-f\">THREE total outcomes: <span class=\"fr\"><span>3<\/span><span>8<\/span><\/span> + <span class=\"fr\"><span>1<\/span><span>8<\/span><\/span> + <span class=\"fr\"><span>4<\/span><span>8<\/span><\/span> = 1<\/div><\/div><\/div>","plain":"<p>Picture all possible outcomes as one box with area 1. Each outcome takes up a piece of the box equal to its probability, and the pieces fill the whole box. So if you know every piece but one, the missing piece is 1 minus the others.<\/p>","fun":"The probabilities of two events don’t necessarily have to add up to 1. There could be other probabilities not mentioned.","check":{"q":"A spinner lands on red with probability 1/4 and on blue with probability 1/3. Otherwise it lands on green. What is the probability it lands on green?","choices":["<span class=\"fr\"><span>1<\/span><span>12<\/span><\/span>","<span class=\"fr\"><span>5<\/span><span>12<\/span><\/span>","<span class=\"fr\"><span>7<\/span><span>12<\/span><\/span>","<span class=\"fr\"><span>2<\/span><span>7<\/span><\/span>"],"a":"B · 5/12","why":"All outcomes add to 1: 1 − 1/4 − 1/3 = 12/12 − 3/12 − 4/12 = 5/12."},"fig":"<svg viewBox=\"0 0 640 214\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"150\" y=\"24\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">Heads or tails?<\/text><text x=\"480\" y=\"24\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">Red or yellow shirt? Or neither?<\/text><rect x=\"20\" y=\"40\" width=\"260\" height=\"160\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\"/><line x1=\"150\" y1=\"40\" x2=\"150\" y2=\"200\" fill=\"none\" style=\"stroke:var(--ink-3)\" stroke-width=\"1\"/><text x=\"85\" y=\"100\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">heads<\/text><text x=\"215\" y=\"100\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">tails<\/text><text x=\"85\" y=\"140\" text-anchor=\"middle\" style=\"fill:var(--red)\" font-size=\"20\">1/2<\/text><text x=\"215\" y=\"140\" text-anchor=\"middle\" style=\"fill:var(--red)\" font-size=\"20\">1/2<\/text><rect x=\"340\" y=\"40\" width=\"280\" height=\"160\" fill=\"none\" style=\"stroke:var(--blue);fill:var(--blue-wash)\" stroke-width=\"2\"/><rect x=\"352\" y=\"52\" width=\"140\" height=\"120\" fill=\"none\" style=\"stroke:var(--red);fill:var(--red-wash)\" stroke-width=\"2\"/><rect x=\"526\" y=\"62\" width=\"70\" height=\"80\" fill=\"none\" style=\"stroke:var(--amber);fill:var(--amber-wash)\" stroke-width=\"2\"/><text x=\"422\" y=\"110\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">red<\/text><text x=\"422\" y=\"132\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"18\">3/8<\/text><text x=\"561\" y=\"94\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"12\">yellow<\/text><text x=\"561\" y=\"116\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"16\">1/8<\/text><text x=\"612\" y=\"191\" text-anchor=\"end\" style=\"fill:var(--ink)\" font-size=\"12\">neither (light blue) = 4/8<\/text><\/svg>"},"da-49":{"title":"The Probability of NOT","subj":"da","page":49,"group":16,"body":"<p>Calculating the probability of something <span class=\"hl\">NOT<\/span> happening is easy. You simply subtract the probability of it happening from 1.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Example Event<\/h4><p>The probability of rolling a 6<\/p><div class=\"ps-f\"><span class=\"fr\"><span>1<\/span><span>6<\/span><\/span><\/div><\/div><div class=\"ps-col\"><h4><span class=\"hl\">NOT<\/span> Happening<\/h4><p>The probability of <span class=\"hl\">NOT<\/span> rolling a 6<\/p><div class=\"ps-f\">1 − <span class=\"fr\"><span>1<\/span><span>6<\/span><\/span> = <span class=\"hl\"><span class=\"fr\"><span>5<\/span><span>6<\/span><\/span><\/span><\/div><\/div><\/div>","plain":"If you know the chance that something happens, the chance that it does NOT happen is just 1 minus that number. A die shows a 6 one time out of six, so it does not show a 6 the other five times out of six. On the GRE this is a big shortcut: sometimes it is easier to work out the NOT case and subtract from 1.","fun":"In some cases, the probability of something happening and not happening are equal, like flipping Heads with a coin.","check":{"q":"The probability that it rains tomorrow is <span class=\"m\"><span class=\"fr\"><span>3<\/span><span>10<\/span><\/span><\/span>. What is the probability that it does NOT rain tomorrow?","choices":["<span class=\"m\"><span class=\"fr\"><span>3<\/span><span>10<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>7<\/span><span>10<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>10<\/span><span>3<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>1<\/span><span>3<\/span><\/span><\/span>"],"a":"B · <span class=\"m\"><span class=\"fr\"><span>7<\/span><span>10<\/span><\/span><\/span>","why":"Subtract from 1: <span class=\"m\">1 − <span class=\"fr\"><span>3<\/span><span>10<\/span><\/span> = <span class=\"fr\"><span>10<\/span><span>10<\/span><\/span> − <span class=\"fr\"><span>3<\/span><span>10<\/span><\/span> = <span class=\"fr\"><span>7<\/span><span>10<\/span><\/span><\/span>."}},"da-50":{"title":"Independent Events","subj":"da","page":50,"group":16,"body":"<p>Two events are <span class=\"hl\">INDEPENDENT<\/span> if the occurrence of one has no effect on the occurrence of the other.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Independent<\/h4><p>Rolling a die + flipping a coin<\/p><\/div><div class=\"ps-col\"><h4><span class=\"hl\">NOT<\/span> Independent<\/h4><p>Rain + an umbrella<\/p><\/div><\/div>","plain":"Two events are independent when one happening does not change the chances of the other. What you roll on a die has nothing to do with how a coin lands, so those are independent. Rain and carrying an umbrella are linked (rain makes you more likely to take an umbrella), so they are NOT independent.","fun":"Because of their complexity, the GRE rarely has problems involving events that are dependent on each other.","check":{"q":"Which pair of events is independent?","choices":["Studying hard and getting a high score","Flipping Heads on a coin and drawing a red card from a deck","Cloudy skies and rain","Eating a lot and feeling full"],"a":"B · Flipping Heads on a coin and drawing a red card from a deck","why":"The coin has no effect on which card you draw, so one result cannot change the other. In each of the other pairs, one event makes the other more likely."}},"da-51":{"title":"Mutually Exclusive Events","subj":"da","page":51,"group":16,"body":"<p>Two events are <span class=\"hl\">MUTUALLY EXCLUSIVE<\/span> if both events cannot occur at the same time.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Example 1<\/h4><p>Winning + losing<\/p><p><span class=\"note\">You cannot simultaneously win and lose.<\/span><\/p><\/div><div class=\"ps-col\"><h4>Example 2<\/h4><p>Rolling an odd number (1, 3 or 5) + rolling a six<\/p><p><span class=\"note\">You cannot simultaneously roll an odd number and get a six.<\/span><\/p><\/div><\/div>","plain":"Mutually exclusive means the two events can never happen together. One game cannot be both a win and a loss, and one roll of a die cannot be both odd and a 6. Watch the words \"at the same time\": on two separate rolls you could get both, but that is a
