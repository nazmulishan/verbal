tp://www.w3.org/2000/svg\"><polygon points=\"40,200 280,200 240,80 80,80\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"80\" y1=\"80\" x2=\"80\" y2=\"200\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><polyline points=\"71,200 71,191 80,191\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"92\" y=\"147\" text-anchor=\"start\" style=\"fill:var(--ink)\" font-size=\"17\">3<\/text><text x=\"160\" y=\"68\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"17\">4<\/text><text x=\"160\" y=\"225\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"17\">6<\/text><\/svg>"},"geo-27":{"title":"Regular Hexagon Area","subj":"geo","page":27,"group":10,"body":"<p>A regular hexagon can be divided into <span class=\"ok\">six equilateral triangles<\/span>, so just find the area of one equilateral triangle and multiply it by 6.<\/p><p>Example: side length 4.<\/p><div class=\"ps-f\">half × half × √3 × 6<\/div><div class=\"ps-f\">2 × 2 × √3 × 6<\/div><div class=\"ps-f\">24√3<\/div>","plain":"Lines from the centre to each corner cut a regular hexagon into 6 equilateral triangles, each with the same side as the hexagon. Find one triangle’s area with “half × half × √3” and multiply by 6.","fun":"A standard soccer ball has 12 pentagons and 20 hexagons on its surface.","check":{"q":"What is the area of a regular hexagon with side length 2?","choices":["3√3","4√3","6√3","12√3","24√3"],"a":"C · 6√3","why":"Half of 2 is 1, so one equilateral triangle has area 1 × 1 × √3 = √3. Six of them: 6√3."},"fig":"<svg viewBox=\"0 0 340 265\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"282,132 226,229 114,229 58,132 114,35 226,35\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"282\" y1=\"132\" x2=\"58\" y2=\"132\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1\" stroke-dasharray=\"5 4\"/><line x1=\"226\" y1=\"229\" x2=\"114\" y2=\"35\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1\" stroke-dasharray=\"5 4\"/><line x1=\"114\" y1=\"229\" x2=\"226\" y2=\"35\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1\" stroke-dasharray=\"5 4\"/><text x=\"269.6\" y=\"81.5\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"20\">4<\/text><\/svg>"},"geo-28":{"title":"Regular Polygon Area","subj":"geo","page":28,"group":10,"body":"<p>A regular polygon of <span class=\"m\">n<\/span> sides can be divided into <span class=\"m\">n<\/span> congruent triangles, each with base <span class=\"hl\"><span class=\"m\">s<\/span><\/span> and height <span class=\"hl\"><span class=\"m\">h<\/span><\/span>. Simply find the area of one triangle and multiply it by the number of triangles.<\/p><p>Pentagon example (5 triangles):<\/p><div class=\"ps-f\"><span class=\"fr\"><span>sh<\/span><span>2<\/span><\/span> × 5 = 2.5sh<\/div>","plain":"Draw lines from the centre to every corner of a regular polygon: you get one triangle per side, all identical. Each has base <span class=\"m\">s<\/span> (a side) and height <span class=\"m\">h<\/span> (the straight distance from the centre to the middle of a side). Area = one triangle (<span class=\"m\">sh/2<\/span>) × number of sides.","fun":"Another way to find the area is simply take the polygon’s perimeter, multiply it by a triangle’s height, and divide by two.","check":{"q":"A regular octagon (8 sides) has side length <span class=\"m\">s<\/span>, and the height from its centre to each side is <span class=\"m\">h<\/span>. What is its area?","choices":["2sh","2.5sh","4sh","8sh","16sh"],"a":"C · 4sh","why":"It splits into 8 triangles, each with area sh/2. Total: 8 × sh/2 = 4sh."},"fig":"<svg viewBox=\"0 0 340 295\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"170,30 284.1,112.9 240.5,247.1 99.5,247.1 55.9,112.9\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"2\" stroke-linejoin=\"round\"/><line x1=\"170\" y1=\"150\" x2=\"170\" y2=\"30\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1\" stroke-dasharray=\"5 4\"/><line x1=\"170\" y1=\"150\" x2=\"284.1\" y2=\"112.9\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1\" stroke-dasharray=\"5 4\"/><line x1=\"170\" y1=\"150\" x2=\"240.5\" y2=\"247.1\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1\" stroke-dasharray=\"5 4\"/><line x1=\"170\" y1=\"150\" x2=\"99.5\" y2=\"247.1\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1\" stroke-dasharray=\"5 4\"/><line x1=\"170\" y1=\"150\" x2=\"55.9\" y2=\"112.9\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"1\" stroke-dasharray=\"5 4\"/><line x1=\"170\" y1=\"150\" x2=\"170\" y2=\"247.1\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><polyline points=\"179,247.1 179,238.1 170,238.1\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><line x1=\"170\" y1=\"150\" x2=\"227.1\" y2=\"71.5\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><polyline points=\"234.3,76.7 229.1,84 221.8,78.7\" fill=\"none\" style=\"stroke:var(--blue);fill:none\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/><text x=\"178\" y=\"214\" text-anchor=\"start\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"17\">h<\/text><text x=\"170\" y=\"274\" text-anchor=\"middle\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"17\">s<\/text><\/svg>"},"geo-29":{"title":"Maximizing Polygon Area","subj":"geo","page":29,"group":10,"body":"<p>The <span class=\"hl\">regular<\/span> form of a polygon of <span class=\"m\">n<\/span> sides will always have <span class=\"hl\">the largest area<\/span> if you keep the perimeter constant.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Example 1<\/h4><p><span class=\"note\">same perimeter<\/span><\/p><p>Right triangle with sides 3, 4, 5: <span class=\"hl\">Area = 6<\/span><\/p><p>Equilateral triangle with sides 4, 4, 4: <span class=\"hl\">Area ≈ 6.93<\/span><\/p><\/div><div class=\"ps-col\"><h4>Example 2<\/h4><p><span class=\"note\">same perimeter<\/span><\/p><p>Rectangle 4 by 2: <span class=\"hl\">Area = 8<\/span><\/p><p>Square with sides 3, 3, 3, 3: <span class=\"hl\">Area = 9<\/span><\/p><\/div><\/div>","plain":"<p>A \"regular\" polygon has all sides equal and all angles equal. If two shapes with the same number of sides have the same perimeter, the regular one always holds the most area. On the GRE this tells you which shape gives the maximum area, e.g. a square beats any other rectangle with the same perimeter.<\/p>","fun":"If you distort a regular shape in any way (while holding its perimeter constant) its area will decrease.","check":{"q":"<p>A rectangle has perimeter 20. What is the largest area it can have?<\/p>","choices":["16","21","24","25","100"],"a":"D · 25","why":"<p>The regular four-sided shape is the square, so make all sides 20 ÷ 4 = 5. Area = 5 × 5 = 25 (compare 4 × 6 = 24 or 3 × 7 = 21).<\/p>"},"fig":"<svg viewBox=\"0 0 640 230\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"160\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">Example 1<\/text><text x=\"480\" y=\"24\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">Example 2<\/text><line x1=\"320\" y1=\"12\" x2=\"320\" y2=\"228\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--ink-3)\"/><text x=\"150\" y=\"54\" text-anchor=\"middle\" font-size=\"12\" font-style=\"italic\" style=\"fill:var(--red)\">same perimeter<\/text><text x=\"445\" y=\"66\" text-anchor=\"middle\" font-size=\"12\" font-style=\"italic\" style=\"fill:var(--red)\">same perimeter<\/text><polygon points=\"40,104 40,170 128,170\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polyline points=\"49,170 49,161 40,161\" fill=\"none\" stroke-width=\"1.5\" style=\"stroke:var(--ink)\"/><text x=\"28\" y=\"142\" text-anchor=\"end\" font-size=\"13\" style=\"fill:var(--ink)\">3<\/text><text x=\"93\" y=\"130\" text-anchor=\"start\" font-size=\"13\" style=\"fill:var(--ink)\">5<\/text><text x=\"84\" y=\"189\" text-anchor=\"middle\" font-size=\"13\" style=\"fill:var(--ink)\">4<\/text><text x=\"84\" y=\"214\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--red)\">Area = 6<\/text><polygon points=\"170,170 258,170 214,93.8\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><text x=\"186\" y=\"130\" text-anchor=\"end\" font-size=\"13\" style=\"fill:var(--ink)\">4<\/text><text x=\"242\" y=\"130\" text-anchor=\"start\" font-size=\"13\" style=\"fill:var(--ink)\">4<\/text><text x=\"214\" y=\"189\" text-anchor=\"middle\" font-size=\"13\" style=\"fill:var(--ink)\">4<\/text><text x=\"214\" y=\"214\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--red)\">Area ≈ 6.93<\/text><polygon points=\"350,126 438,126 438,170 350,170\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><text x=\"340\" y=\"153\" text-anchor=\"end\" font-size=\"13\" style=\"fill:var(--ink)\">2<\/text><text x=\"394\" y=\"189\" text-anchor=\"middle\" font-size=\"13\" style=\"fill:var(--ink)\">4<\/text><text x=\"394\" y=\"214\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--red)\">Area = 8<\/text><polygon points=\"500,104 566,104 566,170 500,170\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><text x=\"533\" y=\"96\" text-anchor=\"middle\" font-size=\"13\" style=\"fill:var(--ink)\">3<\/text><text x=\"490\" y=\"142\" text-anchor=\"end\" font-size=\"13\" style=\"fill:var(--ink)\">3<\/text><text x=\"576\" y=\"142\" text-anchor=\"start\" font-size=\"13\" style=\"fill:var(--ink)\">3<\/text><text x=\"533\" y=\"189\" text-anchor=\"middle\" font-size=\"13\" style=\"fill:var(--ink)\">3<\/text><text x=\"533\" y=\"214\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--red)\">Area = 9<\/text><\/svg>"},"geo-30":{"title":"Max Area given a Perimeter","subj":"geo","page":30,"group":10,"body":"<p>Imagine you have 60 feet of rope. What’s the largest area you can enclose? <span class=\"hl\">A circle!<\/span><\/p><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><th>Shape (perimeter 60)<\/th><th>Sides<\/th><th>Area<\/th><\/tr><tr><td>Equilateral triangle<\/td><td>20, 20, 20<\/td><td><span class=\"hl\">Area ≈ 173<\/span><\/td><\/tr><tr><td>Square<\/td><td>15, 15, 15, 15<\/td><td><span class=\"hl\">Area = 225<\/span><\/td><\/tr><tr><td>Regular hexagon<\/td><td>10 each<\/td><td><span class=\"hl\">Area ≈ 260<\/span><\/td><\/tr><tr><td>Circle<\/td><td>circumference 60<\/td><td><span class=\"hl\">Area ≈ 287<\/span><\/td><\/tr><\/table><\/div>","plain":"<p>Keep the perimeter the same and add more and more equal sides: the area keeps growing. A circle is like a regular polygon with endless sides, so it encloses the most area of all. If a GRE question asks for the maximum area with a fixed perimeter, think circle.<\/p>","fun":"If there’s ever a mad scramble for free land somewhere, make sure you mark your claim off as a circle.","check":{"q":"<p>Each shape below has a perimeter of 24. Which one has the largest area?<\/p>","choices":["A 2 by 10 rectangle","A 6 by 6 square","An equilateral triangle with side 8","A circle with circumference 24"],"a":"D · A circle with circumference 24","why":"<p>With a fixed perimeter, the circle always encloses the most area. (Its area is 144/π ≈ 45.8, more than the square’s 36.)<\/p>"},"fig":"<svg viewBox=\"0 0 640 240\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"20,170 140,170 80,66.1\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><text x=\"42\" y=\"118\" text-anchor=\"end\" font-size=\"13\" style=\"fill:var(--ink)\">20<\/text><text x=\"118\" y=\"118\" text-anchor=\"start\" font-size=\"13\" style=\"fill:var(--ink)\">20<\/text><text x=\"80\" y=\"190\" text-anchor=\"middle\" font-size=\"13\" style=\"fill:var(--ink)\">20<\/text><text x=\"80\" y=\"222\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--red)\">Area ≈ 173<\/text><polygon points=\"175,80 265,80 265,170 175,170\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><text x=\"220\" y=\"72\" text-anchor=\"middle\" font-size=\"13\" style=\"fill:var(--ink)\">15<\/text><text x=\"167\" y=\"130\" text-anchor=\"end\" font-size=\"13\" style=\"fill:var(--ink)\">15<\/text><text x=\"273\" y=\"130\" text-anchor=\"start\" font-size=\"13\" style=\"fill:var(--ink)\">15<\/text><text x=\"220\" y=\"190\" text-anchor=\"middle\" font-size=\"13\" style=\"fill:var(--ink)\">15<\/text><text x=\"220\" y=\"222\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--red)\">Area = 225<\/text><polygon points=\"310,118 340,66 400,66 430,118 400,170 340,170\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><text x=\"370\" y=\"58\" text-anchor=\"middle\" font-size=\"13\" style=\"fill:var(--ink)\">10<\/text><text x=\"423\" y=\"88\" text-anchor=\"start\" font-size=\"13\" style=\"fill:var(--ink)\">10<\/text><text x=\"370\" y=\"222\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--red)\">Area ≈ 260<\/text><circle cx=\"550\" cy=\"116\" r=\"57.3\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><text x=\"538\" y=\"46\" text-anchor=\"middle\" font-size=\"13\" style=\"fill:var(--ink)\">60<\/text><path d=\"M556 40 Q588 26 602 54\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"604,61 597.7,54.7 605.3,52.1\" fill=\"none\" style=\"fill:var(--blue);stroke:var(--blue)\"/><text x=\"550\" y=\"222\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--red)\">Area ≈ 287<\/text><\/svg>"},"geo-31":{"title":"Circles and Vocabulary","subj":"geo","page":31,"group":11,"body":"<ul class=\"ps-list\"><li>Center<\/li><li>Radius<\/li><li>Diameter (double the radius)<\/li><li>Circumference (dashed line)<\/li><\/ul>","plain":"<p>These four words come up in almost every GRE circle question. The radius goes from the center to the edge; the diameter goes all the way across through the center, so it is always 2 × radius. The circumference is the length of the circle’s outline.<\/p>","fun":"The diameter is the longest line inside a circle. If a line is NOT the diameter, then it must be shorter.","check":{"q":"<p>A circle has a radius of 7. What is its diameter?<\/p>","a":"14","why":"<p>The diameter is double the radius: 2 × 7 = 14.<\/p>"},"fig":"<svg viewBox=\"0 0 640 196\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"80\" cy=\"80\" r=\"60\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"80\" cy=\"80\" r=\"3.5\" fill=\"none\" style=\"fill:var(--blue)\"/><circle cx=\"240\" cy=\"80\" r=\"60\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"240\" cy=\"80\" r=\"3.5\" fill=\"none\" style=\"fill:var(--blue)\"/><line x1=\"240\" y1=\"80\" x2=\"282.4\" y2=\"37.6\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><circle cx=\"400\" cy=\"80\" r=\"60\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"400\" cy=\"80\" r=\"3.5\" fill=\"none\" style=\"fill:var(--blue)\"/><line x1=\"357.6\" y1=\"122.4\" x2=\"442.4\" y2=\"37.6\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><circle cx=\"560\" cy=\"80\" r=\"60\" fill=\"none\" stroke-width=\"2\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"560\" cy=\"80\" r=\"3.5\" fill=\"none\" style=\"fill:var(--blue)\"/><text x=\"80\" y=\"166\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--blue)\">Center<\/text><text x=\"240\" y=\"166\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--blue)\">Radius<\/text><text x=\"400\" y=\"166\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--blue)\">Diameter<\/text><text x=\"400\" y=\"184\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--blue)\">(double the radius)<\/text><text x=\"560\" y=\"166\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--blue)\">Circumference<\/text><text x=\"560\" y=\"184\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--blue)\">(dashed line)<\/text><\/svg>"},"geo-32":{"title":"Circles and Vocabulary II","subj":"geo","page":32,"group":11,"body":"<ul class=\"ps-list\"><li>Central angle (<span class=\"m\">x°<\/span>)<\/li><li>Sector<\/li><li>Chord<\/li><li>Arc (in red)<\/li><\/ul>","plain":"<p>A central angle has its corner at the center. The slice it cuts out is a sector (an area), and the curved piece of the edge it cuts out is an arc (a length). A chord is any straight line from one point on the circle to another; the diameter is the longest chord.<\/p>","fun":"An angle that is formed on the outside of the circle (its circumference) is called an <b>inscribed angle<\/b>.","check":{"q":"<p>A straight segment joins two points on a circle but does not pass through the center. What is it called?<\/p>","choices":["Radius","Diameter","Chord","Arc","Sector"],"a":"C · Chord","why":"<p>Any straight line joining two points on the circle is a chord. (If it passed through the center it would be the diameter.)<\/p>"},"fig":"<svg viewBox=\"0 0 640 196\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"80\" cy=\"80\" r=\"60\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"80\" cy=\"80\" r=\"3.5\" fill=\"none\" style=\"fill:var(--blue)\"/><line x1=\"80\" y1=\"80\" x2=\"122.4\" y2=\"37.6\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><line x1=\"80\" y1=\"80\" x2=\"122.4\" y2=\"122.4\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><text x=\"90\" y=\"85\" text-anchor=\"start\" font-size=\"13\" font-style=\"italic\" style=\"fill:var(--ink)\">x°<\/text><path d=\"M240 80 L240 20 A60 60 0 0 0 180.1 84.2 Z\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:var(--blue)\"/><circle cx=\"240\" cy=\"80\" r=\"60\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"240\" cy=\"80\" r=\"3.5\" fill=\"none\" style=\"fill:var(--blue)\"/><circle cx=\"400\" cy=\"80\" r=\"60\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"400\" cy=\"80\" r=\"3.5\" fill=\"none\" style=\"fill:var(--blue)\"/><line x1=\"402.1\" y1=\"20\" x2=\"442.4\" y2=\"122.4\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><circle cx=\"560\" cy=\"80\" r=\"60\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"560\" cy=\"80\" r=\"3.5\" fill=\"none\" style=\"fill:var(--blue)\"/><path d=\"M574.5 21.8 A60 60 0 0 1 619.7 86.3\" fill=\"none\" stroke-width=\"4\" style=\"stroke:var(--red);fill:none\"/><text x=\"80\" y=\"166\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--blue)\">Central<\/text><text x=\"80\" y=\"184\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--blue)\">angle<\/text><text x=\"240\" y=\"166\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--blue)\">Sector<\/text><text x=\"400\" y=\"166\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--blue)\">Chord<\/text><text x=\"560\" y=\"166\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--blue)\">Arc<\/text><text x=\"560\" y=\"184\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--blue)\">(in red)<\/text><\/svg>"},"geo-33":{"title":"π (pi): The Magic Ratio","subj":"geo","page":33,"group":11,"body":"<p class=\"ps-def\"><b>Amazing:<\/b> For <b>EVERY<\/b> circle, the ratio of its circumference to its diameter is the same. Again for <b>EVERY<\/b> circle.<\/p><div class=\"ps-f\"><span class=\"fr\"><span>circumference<\/span><span>diameter<\/span><\/span> = π<\/div><p>Because <span class=\"m\">π<\/span> is an irrational number, so it can only be approximated (see the next slide)<\/p>","plain":"<p>Take any circle, big or small. Divide the distance around it by the distance across it, and you always get the same number: π (about 3.14). That is why circle formulas on the GRE all contain π.<\/p>","fun":"The great Archimedes estimated π to an extremely accurate number over 2000 years ago.","check":{"q":"<p>A circle has a circumference of 18π. What is its diameter?<\/p>","a":"18","why":"<p>Circumference ÷ diameter = π, so diameter = 18π ÷ π = 18.<\/p>"},"fig":"<svg viewBox=\"0 0 340 262\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"150\" cy=\"140\" r=\"105\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"150\" cy=\"140\" r=\"3.5\" fill=\"none\" style=\"fill:var(--blue)\"/><line x1=\"69.6\" y1=\"207.5\" x2=\"230.4\" y2=\"72.5\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><text x=\"0\" y=\"0\" text-anchor=\"middle\" font-size=\"13\" font-style=\"italic\" transform=\"translate(116 186) rotate(-40)\" style=\"fill:var(--red)\">diameter<\/text><path d=\"M181.1 24.1 A120 120 0 0 1 267.4 164.9\" fill=\"none\" stroke-width=\"4\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"264.9,176.7 260.9,161.5 274.6,164.4\" fill=\"none\" style=\"fill:var(--blue);stroke:var(--blue)\"/><text x=\"0\" y=\"0\" text-anchor=\"middle\" font-size=\"13\" font-style=\"italic\" transform=\"translate(261.4 62) rotate(55)\" style=\"fill:var(--red)\">circumference<\/text><\/svg>"},"geo-34":{"title":"π (pi) Approximations","subj":"geo","page":34,"group":11,"body":"<p>There are <b>TWO<\/b> very popular <span class=\"m\">π<\/span> approximations.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Decimal<\/h4><div class=\"ps-f\">3.14<\/div><\/div><div class=\"ps-col\"><h4>Fractional<\/h4><div class=\"ps-f\"><span class=\"fr\"><span>22<\/span><span>7<\/span><\/span><\/div><\/div><\/div>","plain":"<p>π never ends as a decimal, so we use a close value when we need a number. Use 3.14 or 22/7. On the GRE, most answers keep π as π, but these help when you must estimate or compare sizes.<\/p>","fun":"Of the two most common approximations, 22/7 is slightly more accurate.","check":{"q":"<p>Using <span class=\"m\">π ≈ <span class=\"fr\"><span>22<\/span><span>7<\/span><\/span><\/span>, estimate the circumference (π × diameter) of a circle with diameter 14.<\/p>","a":"44","why":"<p><span class=\"m\"><span class=\"fr\"><span>22<\/span><span>7<\/span><\/span> × 14 = 22 × 2 = 44<\/span>. The 7 cancels neatly with 14.<\/p>"}},"geo-35":{"title":"Central Angle Theorem","subj":"geo","page":35,"group":11,"body":"<p>For any two points on a circle, the central angle is always <b>DOUBLE<\/b> the inscribed angle.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><p>Points <span class=\"m\">A<\/span> and <span class=\"m\">B<\/span>: <span class=\"note\">Inscribed angle<\/span> <span class=\"m\">x°<\/span>, central angle <span class=\"m\">2x°<\/span>.<\/p><\/div><div class=\"ps-col\"><p>Points <span class=\"m\">A<\/span> and <span class=\"m\">B<\/span>: inscribed angle <span class=\"m\">x°<\/span>, central angle <span class=\"m\">2x°<\/span>.<\/p><p>Still holds true even in funky cases like this<\/p><\/div><\/div>","plain":"<p>Pick two points A and B on a circle. Draw lines from A and B to the center: that angle is the central angle. Draw lines from A and B to another point on the circle: that is the inscribed angle. The central angle is always twice the inscribed angle, as long as both use the same two endpoints A and B.<\/p>","fun":"In the funky cases like above, this property is really hard to see. Make sure you’re checking the line’s endpoints.","check":{"q":"<p>Points <span class=\"m\">A<\/span> and <span class=\"m\">B<\/span> lie on a circle. An inscribed angle that opens onto <span class=\"m\">A<\/span> and <span class=\"m\">B<\/span> measures 35°. What is the central angle <span class=\"m\">AOB<\/span>?<\/p>","a":"70°","why":"<p>The central angle is double the inscribed angle: 2 × 35° = 70°.<\/p>"},"fig":"<svg viewBox=\"0 0 640 282\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"150\" cy=\"140\" r=\"100\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"150\" cy=\"140\" r=\"3.5\" fill=\"none\" style=\"fill:var(--blue)\"/><line x1=\"53\" y1=\"164.2\" x2=\"200\" y2=\"53.4\" fill=\"none\" stroke-width=\"1.5\" style=\"stroke:var(--blue)\"/><line x1=\"53\" y1=\"164.2\" x2=\"245.1\" y2=\"170.9\" fill=\"none\" stroke-width=\"1.5\" style=\"stroke:var(--blue)\"/><line x1=\"150\" y1=\"140\" x2=\"200\" y2=\"53.4\" fill=\"none\" stroke-width=\"1.5\" style=\"stroke:var(--blue)\"/><line x1=\"150\" y1=\"140\" x2=\"245.1\" y2=\"170.9\" fill=\"none\" stroke-width=\"1.5\" style=\"stroke:var(--blue)\"/><text x=\"208\" y=\"43.4\" text-anchor=\"middle\" font-size=\"15\" font-style=\"italic\" style=\"fill:var(--ink)\">A<\/text><text x=\"259.1\" y=\"178.9\" text-anchor=\"middle\" font-size=\"15\" font-style=\"italic\" style=\"fill:var(--ink)\">B<\/text><text x=\"86\" y=\"157\" text-anchor=\"middle\" font-size=\"13\" font-style=\"italic\" style=\"fill:var(--ink)\">x°<\/text><text x=\"181\" y=\"133\" text-anchor=\"middle\" font-size=\"13\" font-style=\"italic\" style=\"fill:var(--ink)\">2x°<\/text><line x1=\"51\" y1=\"169.2\" x2=\"34\" y2=\"226\" fill=\"none\" stroke-width=\"1.5\" style=\"stroke:var(--red)\"/><polygon points=\"34,226 32.5,217.2 40.1,219.5\" fill=\"none\" style=\"fill:var(--red);stroke:var(--red)\"/><text x=\"42\" y=\"246\" text-anchor=\"middle\" font-size=\"13\" font-style=\"italic\" style=\"fill:var(--red)\">Inscribed<\/text><text x=\"42\" y=\"263\" text-anchor=\"middle\" font-size=\"13\" font-style=\"italic\" style=\"fill:var(--red)\">angle<\/text><circle cx=\"470\" cy=\"140\" r=\"100\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"470\" cy=\"140\" r=\"3.5\" fill=\"none\" style=\"fill:var(--blue)\"/><line x1=\"470\" y1=\"40\" x2=\"520\" y2=\"53.4\" fill=\"none\" stroke-width=\"1.5\" style=\"stroke:var(--blue)\"/><line x1=\"470\" y1=\"40\" x2=\"565.1\" y2=\"170.9\" fill=\"none\" stroke-width=\"1.5\" style=\"stroke:var(--blue)\"/><line x1=\"470\" y1=\"140\" x2=\"520\" y2=\"53.4\" fill=\"none\" stroke-width=\"1.5\" style=\"stroke:var(--blue)\"/><line x1=\"470\" y1=\"140\" x2=\"565.1\" y2=\"170.9\" fill=\"none\" stroke-width=\"1.5\" style=\"stroke:var(--blue)\"/><text x=\"528\" y=\"43.4\" text-anchor=\"middle\" font-size=\"15\" font-style=\"italic\" style=\"fill:var(--ink)\">A<\/text><text x=\"579.1\" y=\"178.9\" text-anchor=\"middle\" font-size=\"15\" font-style=\"italic\" style=\"fill:var(--ink)\">B<\/text><text x=\"494\" y=\"59\" text-anchor=\"middle\" font-size=\"11\" font-style=\"italic\" style=\"fill:var(--ink)\">x°<\/text><text x=\"497\" y=\"133\" text-anchor=\"middle\" font-size=\"13\" font-style=\"italic\" style=\"fill:var(--ink)\">2x°<\/text><text x=\"470\" y=\"268\" text-anchor=\"middle\" font-size=\"12\" font-style=\"italic\" style=\"fill:var(--ink)\">Still holds true even in funky cases like this<\/text><\/svg>"},"geo-36":{"title":"Circle Circumference","subj":"geo","page":36,"group":11,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Two Formulas<\/h4><p><span class=\"note\">They’re really the same thing<\/span><\/p><div class=\"ps-f\">2πr<\/div><div class=\"ps-f\">πd<\/div><\/div><div class=\"ps-col\"><h4>Example<\/h4><p>A circle with radius 5.<\/p><div class=\"ps-f\">2πr<\/div><div class=\"ps-f\">2π5<\/div><div class=\"ps-f\"><span class=\"ok\">10π<\/span><\/div><\/div><\/div>","plain":"<p>Circumference is the distance around a circle. If you know the radius r, use 2πr; if you know the diameter d, use πd. Both give the same answer because d = 2r. GRE answers usually leave π in the answer, like 10π.<\/p>","fun":"Because <span class=\"m\">2r = d<\/span>, of course, the two formulas above are actually the same formula.","check":{"q":"<p>A circle has a diameter of 9. What is its circumference?<\/p>","a":"9π","why":"<p>Use πd: π × 9 = 9π. (Or r = 4.5, so 2π × 4.5 = 9π.)<\/p>"},"fig":"<svg viewBox=\"0 0 320 200\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"160\" cy=\"100\" r=\"80\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"160\" cy=\"100\" r=\"3.5\" fill=\"none\" style=\"fill:var(--blue)\"/><line x1=\"160\" y1=\"100\" x2=\"216.6\" y2=\"43.4\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><text x=\"178\" y=\"66\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">5<\/text><\/svg>"},"geo-37":{"title":"Length of an Arc","subj":"geo","page":37,"group":11,"body":"<p>The ratio of an arc’s central angle to 360° <span class=\"ok\">equals the ratio<\/span> of the arc’s length to the circumference of the circle.<\/p><p>Example: radius 4, central angle 80°, so the circumference is <span class=\"m\">2π(4) = 8π<\/span>.<\/p><div class=\"ps-f\"><span class=\"fr\"><span>80<\/span><span>360<\/span><\/span> = <span class=\"fr\"><span>arc ABC<\/span><span>8π<\/span><\/span><\/div><div class=\"ps-f\">640π = 360 × arc ABC<\/div><div class=\"ps-f\"><span class=\"ok\">arc ABC = <span class=\"fr\"><span>16<\/span><span>9<\/span><\/span>π<\/span><\/div>","plain":"<p>An arc is a fraction of the whole circle’s outline. Its central angle tells you which fraction: angle ÷ 360. Multiply that fraction by the full circumference to get the arc length.<\/p>","fun":"The reason why there is a <span class=\"m\">B<\/span> between <span class=\"m\">A<\/span> and <span class=\"m\">C<\/span> is to distinguish the shorter arc from the longer arc.","check":{"q":"<p>A circle has radius 9. An arc has a central angle of 40°. How long is the arc?<\/p>","choices":["π","2π","4π","9π","18π"],"a":"B · 2π","why":"<p>Circumference = 2π(9) = 18π. The fraction is 40/360 = 1/9, and 1/9 × 18π = 2π.<\/p>"},"fig":"<svg viewBox=\"0 0 340 270\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"150\" cy=\"140\" r=\"110\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"150\" cy=\"140\" r=\"4.5\" fill=\"none\" style=\"fill:var(--blue)\"/><line x1=\"150\" y1=\"140\" x2=\"234.3\" y2=\"69.3\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><line x1=\"150\" y1=\"140\" x2=\"234.3\" y2=\"210.7\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><text x=\"250.5\" y=\"59\" text-anchor=\"middle\" font-size=\"16\" font-style=\"italic\" style=\"fill:var(--ink)\">A<\/text><text x=\"252.1\" y=\"232.3\" text-anchor=\"middle\" font-size=\"16\" font-style=\"italic\" style=\"fill:var(--ink)\">C<\/text><text x=\"278\" y=\"146\" text-anchor=\"middle\" font-size=\"16\" font-style=\"italic\" style=\"fill:var(--ink)\">B<\/text><text x=\"164\" y=\"146\" text-anchor=\"start\" font-size=\"15\" style=\"fill:var(--ink)\">80°<\/text><text x=\"183.1\" y=\"93.9\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">4<\/text><\/svg>"},"geo-38":{"title":"Area of a Circle","subj":"geo","page":38,"group":11,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Formula<\/h4><div class=\"ps-f\">πr²<\/div><\/div><div class=\"ps-col\"><h4>Example<\/h4><p>A circle with radius 3.<\/p><div class=\"ps-f\">πr²<\/div><div class=\"ps-f\">π(3)²<\/div><div class=\"ps-f\"><span class=\"ok\">9π<\/span><\/div><\/div><\/div>","plain":"<p>The area is the space inside the circle. Square the radius first, then multiply by π. If the GRE gives you the diameter, halve it to get the radius before you square.<\/p>","fun":"Archimedes ALSO figured out the formula for the area of a circle over 2000 years ago. Dude was amazing.","check":{"q":"<p>A circle has a diameter of 10. What is its area?<\/p>","choices":["10π","20π","25π","100π"],"a":"C · 25π","why":"<p>The radius is 10 ÷ 2 = 5, so the area is π(5)² = 25π.<\/p>"},"fig":"<svg viewBox=\"0 0 320 200\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"160\" cy=\"100\" r=\"80\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"160\" cy=\"100\" r=\"3.5\" fill=\"none\" style=\"fill:var(--blue)\"/><line x1=\"160\" y1=\"100\" x2=\"216.6\" y2=\"43.4\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><text x=\"178\" y=\"66\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">3<\/text><\/svg>"},"geo-39":{"title":"Area of a Sector","subj":"geo","page":39,"group":11,"body":"<p>The ratio of a sector’s central angle to 360° <span class=\"ok\">equals the ratio<\/span> of the sector’s area to the area of the circle.<\/p><p>Example: radius 6, central angle 60°, so the circle’s area is <span class=\"m\">π(6)² = 36π<\/span>.<\/p><div class=\"ps-f\"><span class=\"fr\"><span>60<\/span><span>360<\/span><\/span> = <span class=\"fr\"><span>sector ABC<\/span><span>36π<\/span><\/span><\/div><div class=\"ps-f\">2160π = 360 × sector ABC<\/div><div class=\"ps-f\"><span class=\"ok\">sector ABC = 6π<\/span><\/div>","plain":"<p>A sector is a slice of the circle. Its central angle tells you what fraction of the circle it is: angle ÷ 360. Multiply that fraction by the full area πr² to get the sector’s area.<\/p>","fun":"A sector that comprises exactly half the area of a circle is called a “semicircle.”","check":{"q":"<p>A circle has radius 4. What is the area of a sector with a central angle of 90°?<\/p>","choices":["π","2π","4π","8π","16π"],"a":"C · 4π","why":"<p>The full area is π(4)² = 16π. The fraction is 90/360 = 1/4, and 1/4 × 16π = 4π.<\/p>"},"fig":"<svg viewBox=\"0 0 340 270\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"150\" cy=\"140\" r=\"110\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"150\" cy=\"140\" r=\"4.5\" fill=\"none\" style=\"fill:var(--blue)\"/><line x1=\"150\" y1=\"140\" x2=\"245.3\" y2=\"85\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><line x1=\"150\" y1=\"140\" x2=\"245.3\" y2=\"195\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><text x=\"263.1\" y=\"77\" text-anchor=\"middle\" font-size=\"16\" font-style=\"italic\" style=\"fill:var(--ink)\">A<\/text><text x=\"264.9\" y=\"214\" text-anchor=\"middle\" font-size=\"16\" font-style=\"italic\" style=\"fill:var(--ink)\">C<\/text><text x=\"278\" y=\"146\" text-anchor=\"middle\" font-size=\"16\" font-style=\"italic\" style=\"fill:var(--ink)\">B<\/text><text x=\"164\" y=\"146\" text-anchor=\"start\" font-size=\"15\" style=\"fill:var(--ink)\">60°<\/text><text x=\"190.6\" y=\"100.4\" text-anchor=\"middle\" font-size=\"16\" style=\"fill:var(--ink)\">6<\/text><\/svg>"},"geo-40":{"title":"Tangent Lines","subj":"geo","page":40,"group":11,"body":"<p>If a line intersects <span class=\"hl\">only one point of a circle<\/span>, another line drawn from that point to the center will <span class=\"hl\">form a right angle<\/span>.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><p><span class=\"note\">NOT a Tangent line<\/span><\/p><p>Because the line intersects two points of the circle<\/p><\/div><div class=\"ps-col\"><p><span class=\"note\">Tangent line<\/span><\/p><\/div><\/div>","plain":"<p>A tangent line just touches the circle at one single point. The radius drawn to that point is always perpendicular (90°) to the tangent line. On the GRE, this hidden right angle often lets you use the Pythagorean theorem.<\/p>","fun":"A circle has infinite points on its circumference. Thus, it has infinite tangent lines.","check":{"q":"<p>A line touches a circle at exactly one point <span class=\"m\">P<\/span>. What angle does the radius drawn to <span class=\"m\">P<\/span> make with the line?<\/p>","a":"90°","why":"<p>A line that touches the circle at only one point is a tangent, and the radius to that point always forms a right angle with it.<\/p>"},"fig":"<svg viewBox=\"0 0 640 290\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"320\" cy=\"145\" r=\"115\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"320\" cy=\"145\" r=\"4.5\" fill=\"none\" style=\"fill:var(--blue)\"/><line x1=\"213\" y1=\"22\" x2=\"213\" y2=\"270\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue)\"/><line x1=\"435\" y1=\"22\" x2=\"435\" y2=\"270\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue)\"/><line x1=\"320\" y1=\"145\" x2=\"435\" y2=\"145\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><polyline points=\"425,145 425,135 435,135\" fill=\"none\" stroke-width=\"1.5\" style=\"stroke:var(--ink)\"/><line x1=\"204\" y1=\"108\" x2=\"150\" y2=\"100\" fill=\"none\" stroke-width=\"1.5\" style=\"stroke:var(--blue)\"/><polygon points=\"150,100 158.5,97.2 157.3,105.1\" fill=\"none\" style=\"fill:var(--blue);stroke:var(--blue)\"/><text x=\"92\" y=\"82\" text-anchor=\"middle\" font-size=\"16\" font-style=\"italic\" style=\"fill:var(--red)\">NOT a<\/text><text x=\"92\" y=\"104\" text-anchor=\"middle\" font-size=\"16\" font-style=\"italic\" style=\"fill:var(--red)\">Tangent<\/text><text x=\"92\" y=\"126\" text-anchor=\"middle\" font-size=\"16\" font-style=\"italic\" style=\"fill:var(--red)\">line<\/text><text x=\"98\" y=\"172\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">Because the line intersects<\/text><text x=\"98\" y=\"189\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">two points of the circle<\/text><line x1=\"444\" y1=\"112\" x2=\"498\" y2=\"105\" fill=\"none\" stroke-width=\"1.5\" style=\"stroke:var(--blue)\"/><polygon points=\"498,105 490.6,110 489.6,102.1\" fill=\"none\" style=\"fill:var(--blue);stroke:var(--blue)\"/><text x=\"506\" y=\"110\" text-anchor=\"start\" font-size=\"16\" font-style=\"italic\" style=\"fill:var(--red)\">Tangent line<\/text><\/svg>"},"geo-41":{"title":"Chord Stuff","subj":"geo","page":41,"group":11,"body":"<p>It’s usually difficult to find the length of a chord, but there is a special case.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Difficult<\/h4><p>Radius 4, central angle 50°: the chord is <span class=\"hl\">???<\/span><\/p><\/div><div class=\"ps-col\"><h4>Special Case<\/h4><p>Radius 4, central angle 60°: the chord <span class=\"hl\">= 4<\/span><\/p><p>Because an equilateral triangle is formed<\/p><\/div><\/div>","plain":"<p>The two radii and the chord make a triangle. The two radii are equal, so if the angle between them is 60°, the other two angles are also 60° and the triangle is equilateral: the chord equals the radius. For other angles you would need trigonometry, which the GRE does not test.<\/p>","fun":"You can of course find the length of chords using Trigonometry, but that’s not tested on the GRE.","check":{"q":"<p>A circle has radius 7. Two radii form a central angle of 60°. How long is the chord joining their endpoints?<\/p>","a":"7","why":"<p>The two radii (7 and 7) with a 60° angle between them form an equilateral triangle, so the chord is also 7.<\/p>"},"fig":"<svg viewBox=\"0 0 640 256\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"105\" y=\"20\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">Difficult<\/text><text x=\"385\" y=\"20\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--ink)\">Special Case<\/text><line x1=\"282\" y1=\"10\" x2=\"282\" y2=\"250\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--ink-3)\"/><circle cx=\"105\" cy=\"140\" r=\"90\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"105\" cy=\"140\" r=\"3.5\" fill=\"none\" style=\"fill:var(--blue)\"/><line x1=\"105\" y1=\"140\" x2=\"178.7\" y2=\"88.4\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><line x1=\"105\" y1=\"140\" x2=\"191.9\" y2=\"163.3\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><line x1=\"178.7\" y1=\"88.4\" x2=\"191.9\" y2=\"163.3\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--red)\"/><text x=\"134.4\" y=\"107.5\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--ink)\">4<\/text><text x=\"124\" y=\"138\" text-anchor=\"start\" font-size=\"14\" style=\"fill:var(--ink)\">50°<\/text><line x1=\"189.3\" y1=\"124.8\" x2=\"230\" y2=\"110\" fill=\"none\" stroke-width=\"1.5\" style=\"stroke:var(--blue)\"/><polygon points=\"230,110 223.9,116.5 221.1,109\" fill=\"none\" style=\"fill:var(--blue);stroke:var(--blue)\"/><text x=\"236\" y=\"116\" text-anchor=\"start\" font-size=\"18\" style=\"fill:var(--red)\">???<\/text><circle cx=\"385\" cy=\"140\" r=\"90\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"385\" cy=\"140\" r=\"3.5\" fill=\"none\" style=\"fill:var(--blue)\"/><line x1=\"385\" y1=\"140\" x2=\"448.6\" y2=\"76.4\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><line x1=\"385\" y1=\"140\" x2=\"471.9\" y2=\"163.3\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><line x1=\"448.6\" y1=\"76.4\" x2=\"471.9\" y2=\"163.3\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--green)\"/><text x=\"407.6\" y=\"103\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--ink)\">4<\/text><text x=\"404\" y=\"138\" text-anchor=\"start\" font-size=\"14\" style=\"fill:var(--ink)\">60°<\/text><line x1=\"464.3\" y1=\"118.8\" x2=\"506\" y2=\"108\" fill=\"none\" stroke-width=\"1.5\" style=\"stroke:var(--blue)\"/><polygon points=\"506,108 499.3,113.9 497.3,106.1\" fill=\"none\" style=\"fill:var(--blue);stroke:var(--blue)\"/><text x=\"514\" y=\"114\" text-anchor=\"start\" font-size=\"18\" style=\"fill:var(--red)\">= 4<\/text><text x=\"564\" y=\"150\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">Because an<\/text><text x=\"564\" y=\"166\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">equilateral triangle<\/text><text x=\"564\" y=\"182\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">is formed<\/text><\/svg>"},"geo-42":{"title":"Inscribed/Circumscribed","subj":"geo","page":42,"group":11,"body":"<p>You’ll often see polygons inside circles (all vertices touching the circle). You’ll sometimes see a circle inside a polygon.<\/p><ul class=\"ps-list\"><li>Square inscribed inside circle<\/li><li>Pentagon inscribed inside circle<\/li><li>Triangle circumscribed about a circle<\/li><\/ul>","plain":"<p>“Inscribed” means drawn inside, touching: a polygon inscribed in a circle has every corner on the circle. “Circumscribed about” means drawn around, touching: a triangle circumscribed about a circle has every side touching the circle. The GRE usually gives a picture, so look at which shape is on the inside.<\/p>","fun":"The language of inscribed versus circumscribed can be quite confusing, so ETS usually provides a diagram.","check":{"q":"<p>A circle is drawn inside a square so that it touches all four sides of the square. Which description is correct?<\/p>","choices":["The square is inscribed in the circle","The square is circumscribed about the circle","The circle is circumscribed about the square","The circle and square are concentric circles"],"a":"B · The square is circumscribed about the circle","why":"<p>The square is on the outside, drawn around the circle and touching it, so the square is circumscribed about the circle (equivalently, the circle is inscribed in the square).<\/p>"},"fig":"<svg viewBox=\"0 0 640 246\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"110\" cy=\"110\" r=\"85\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"110,25 195,110 110,195 25,110\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"320\" cy=\"110\" r=\"85\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"320,25 239.2,83.7 270,178.8 370,178.8 400.8,83.7\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"443.4,175 616.6,175 530,25\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"530\" cy=\"125\" r=\"50\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><text x=\"110\" y=\"218\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">Square inscribed<\/text><text x=\"110\" y=\"234\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">inside circle<\/text><text x=\"320\" y=\"218\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">Pentagon inscribed<\/text><text x=\"320\" y=\"234\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">inside circle<\/text><text x=\"530\" y=\"218\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">Triangle circumscribed<\/text><text x=\"530\" y=\"234\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">about a circle<\/text><\/svg>"},"geo-43":{"title":"Max Area Inside Circle","subj":"geo","page":43,"group":11,"body":"<p>To maximize the area of an inscribed polygon, <span class=\"ok\">make it regular.<\/span><\/p><ul class=\"ps-list\"><li>Pretty small area for a quadrilateral<\/li><li>Definitely bigger, but not maximum<\/li><li>Ahh, perfect. A square! Max area!<\/li><\/ul>","plain":"<p>If you must fit a polygon with a set number of corners inside a circle, the one with the biggest area is the regular one (all sides equal). For four corners that means a square, whose diagonals are both diameters of the circle.<\/p>","fun":"Of course this property carries over from our “maximizing the area of a polygon” slide from the previous group.","check":{"q":"<p>A quadrilateral is inscribed in a circle of radius 5. What is the largest area it can have?<\/p>","choices":["25","50","25π","100"],"a":"B · 50","why":"<p>The maximum comes from the square. Its diagonals are diameters, 10 each, so its side is <span class=\"m\">10/√2 = 5√2<\/span> and its area is <span class=\"m\">(5√2)² = 50<\/span>.<\/p>"},"fig":"<svg viewBox=\"0 0 640 240\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"110\" cy=\"105\" r=\"85\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"53.1,41.8 107,20.1 158.8,35.4 113,189.9\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"320\" cy=\"105\" r=\"85\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"317,20.1 402.1,83 323,189.9 235.3,97.6\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"530\" cy=\"105\" r=\"85\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"530,20 615,105 530,190 445,105\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><text x=\"110\" y=\"212\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">Pretty small area for a<\/text><text x=\"110\" y=\"228\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">quadrilateral<\/text><text x=\"320\" y=\"212\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">Definitely bigger, but not<\/text><text x=\"320\" y=\"228\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">maximum<\/text><text x=\"530\" y=\"212\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">Ahh, perfect. A square!<\/text><text x=\"530\" y=\"228\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--ink)\">Max area!<\/text><\/svg>"},"geo-44":{"title":"Concentric Circles","subj":"geo","page":44,"group":11,"body":"<p class=\"ps-def\"><b>Definition:<\/b> Concentric circles are circles that share the same center but not necessarily the same radius.<\/p><p><b>Three Concentric Circles<\/b><\/p><p><span class=\"hl\">NOTE<\/span><\/p><p>A circle with twice the radius of another will have an area that is four times larger.<\/p>","plain":"<p>Concentric circles are like a target: one center, different sizes. Area depends on the radius squared, so doubling the radius makes the area 2² = 4 times as big, and tripling it makes the area 9 times as big.<\/p>","fun":"This is why hitting the Bullseye in darts is so hard – it has an <b>exponentially<\/b> smaller area than the other circles around it.","check":{"q":"<p>Two concentric circles have radii 3 and 9. The area of the larger circle is how many times the area of the smaller circle?<\/p>","a":"9","why":"<p>The radius is 3 times as big, so the area is 3² = 9 times as big: 81π ÷ 9π = 9.<\/p>"},"fig":"<svg viewBox=\"0 0 320 240\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"160\" cy=\"120\" r=\"40\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"160\" cy=\"120\" r=\"74\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><circle cx=\"160\" cy=\"120\" r=\"108\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><\/svg>"},"geo-45":{"title":"3D Figures","subj":"geo","page":45,"group":12,"body":"<ul class=\"ps-list\"><li>CUBE<\/li><li>RECTANGULAR SOLID<\/li><li>RIGHT CYLINDER<\/li><\/ul>","plain":"<p>The GRE only tests three solid shapes. A cube is a box with every edge the same length. A rectangular solid is any box (length, width and height can differ). A right cylinder is a can shape: two equal circles stacked straight on top of each other.<\/p>","fun":"Other names for a rectangular solid are “rectangular prism” and “cuboid.”","check":{"q":"<p>A shoebox whose length, width and height are all different is an example of which 3D figure?<\/p>","choices":["Cube","Rectangular solid","Right cylinder","Sphere"],"a":"B · Rectangular solid","why":"<p>It is a box, but its edges are not all equal, so it is a rectangular solid rather than a cube.<\/p>"},"fig":"<svg viewBox=\"0 0 640 232\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"40,70 140,70 140,170 40,170\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:var(--blue-wash)\"/><polygon points=\"40,70 72,38 172,38 140,70\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:var(--blue-wash)\"/><polygon points=\"140,70 172,38 172,138 140,170\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:var(--blue-wash)\"/><polygon points=\"220,70 380,70 380,170 220,170\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:var(--blue-wash)\"/><polygon points=\"220,70 252,38 412,38 380,70\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:var(--blue-wash)\"/><polygon points=\"380,70 412,38 412,138 380,170\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:var(--blue-wash)\"/><path d=\"M465 52 L465 160 A55 15 0 0 0 575 160 L575 52\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:var(--amber-wash)\"/><ellipse cx=\"520\" cy=\"52\" rx=\"55\" ry=\"15\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:var(--amber-wash)\"/><text x=\"106\" y=\"200\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--blue)\">CUBE<\/text><text x=\"316\" y=\"200\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--blue)\">RECTANGULAR<\/text><text x=\"316\" y=\"218\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--blue)\">SOLID<\/text><text x=\"520\" y=\"200\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--blue)\">RIGHT<\/text><text x=\"520\" y=\"218\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--blue)\">CYLINDER<\/text><\/svg>"},"geo-46":{"title":"3D Figures NOT Tested","subj":"geo","page":46,"group":12,"body":"<ul class=\"ps-list\"><li>SPHERE<\/li><li>CONE<\/li><li>PYRAMID<\/li><li>PRISM<\/li><\/ul>","plain":"<p>Good news: you do not need volume or surface-area formulas for spheres (balls), cones, pyramids or prisms. Spend your study time on cubes, rectangular solids and right cylinders instead.<\/p>","fun":"It is often assumed that the largest pyramid in the world is in Giza, Egypt. The largest is actually the Great Pyramid of Cholula.","check":{"q":"<p>Which of these 3D figures is NOT tested on the GRE?<\/p>","choices":["Cube","Rectangular solid","Right cylinder","Cone"],"a":"D · Cone","why":"<p>The tested solids are the cube, the rectangular solid and the right cylinder; the cone is on the “not tested” list.<\/p>"},"fig":"<svg viewBox=\"0 0 640 206\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"80\" cy=\"95\" r=\"55\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:var(--amber-wash)\"/><path d=\"M25 95 A55 14 0 0 0 135 95\" fill=\"none\" stroke-width=\"1.5\" style=\"stroke:var(--blue);fill:none\"/><path d=\"M25 95 A55 14 0 0 1 135 95\" fill=\"none\" stroke-width=\"1\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"240,28 185,140 295,140\" fill=\"none\" stroke-width=\"0\" style=\"stroke:var(--blue);fill:var(--amber-wash)\"/><line x1=\"240\" y1=\"28\" x2=\"185\" y2=\"140\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue)\"/><line x1=\"240\" y1=\"28\" x2=\"295\" y2=\"140\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue)\"/><ellipse cx=\"240\" cy=\"140\" rx=\"55\" ry=\"14\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:var(--amber-wash)\"/><polygon points=\"400,28 340,135 395,160\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:var(--blue-wash)\"/><polygon points=\"400,28 395,160 465,140\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:var(--blue-wash)\"/><polygon points=\"535,70 577,48 612,133 570,155\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:var(--blue-wash)\"/><polygon points=\"500,150 535,70 570,155\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:var(--blue-wash)\"/><line x1=\"500\" y1=\"150\" x2=\"542\" y2=\"128\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><line x1=\"542\" y1=\"128\" x2=\"577\" y2=\"48\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><line x1=\"542\" y1=\"128\" x2=\"612\" y2=\"133\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><text x=\"80\" y=\"192\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--blue)\">SPHERE<\/text><text x=\"240\" y=\"192\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--blue)\">CONE<\/text><text x=\"402\" y=\"192\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--blue)\">PYRAMID<\/text><text x=\"560\" y=\"192\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--blue)\">PRISM<\/text><\/svg>"},"geo-47":{"title":"Volume of a Cube","subj":"geo","page":47,"group":12,"body":"<p>A cube has the same measurement for its length, width, and height. To find the volume, simply “cube” the distance of one of the edges.<\/p><div class=\"ps-f\">x³<\/div>","plain":"<p>Volume is how much space is inside a solid. For a cube every edge is the same length x, so the volume is x × x × x = x³.<\/p>","fun":"A cube is one of the five Platonic solids, the five “perfect” shapes studied extensively by the Greeks.","check":{"q":"<p>A cube has an edge length of 4. What is its volume?<\/p>","a":"64","why":"<p>Volume = 4³ = 4 × 4 × 4 = 64.<\/p>"},"fig":"<svg viewBox=\"0 0 320 250\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"40,76 180,76 180,216 40,216\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"40,76 86,30 226,30 180,76\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"180,76 226,30 226,170 180,216\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><text x=\"164\" y=\"150\" text-anchor=\"middle\" font-size=\"18\" font-style=\"italic\" style=\"fill:var(--ink)\">x<\/text><text x=\"214\" y=\"202\" text-anchor=\"middle\" font-size=\"18\" font-style=\"italic\" style=\"fill:var(--ink)\">x<\/text><text x=\"110\" y=\"238\" text-anchor=\"middle\" font-size=\"18\" font-style=\"italic\" style=\"fill:var(--ink)\">x<\/text><\/svg>"},"geo-48":{"title":"Surface Area of a Cube","subj":"geo","page":48,"group":12,"body":"<p>The area of one side of a cube is simply the “square” of its side length. And because every side of a cube is equal and there are <span class=\"hl\">six<\/span> sides, surface area is…<\/p><div class=\"ps-f\">6x²<\/div>","plain":"<p>Surface area is the total area of all the outside faces, like the amount of wrapping paper you need. A cube has 6 identical square faces, each with area x², so the total is 6x².<\/p>","fun":"If the side length of a cube is 6, the surface area and volume are equal to one another.","check":{"q":"<p>A cube has an edge length of 3. What is its surface area?<\/p>","a":"54","why":"<p>One face is 3² = 9, and there are 6 faces: 6 × 9 = 54.<\/p>"},"fig":"<svg viewBox=\"0 0 320 250\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"40,76 180,76 180,216 40,216\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"40,76 86,30 226,30 180,76\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"180,76 226,30 226,170 180,216\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><text x=\"110\" y=\"152\" text-anchor=\"middle\" font-size=\"20\" font-style=\"italic\" style=\"fill:var(--red)\">x²<\/text><text x=\"204\" y=\"150\" text-anchor=\"middle\" font-size=\"18\" font-style=\"italic\" style=\"fill:var(--ink)\">x<\/text><text x=\"110\" y=\"238\" text-anchor=\"middle\" font-size=\"18\" font-style=\"italic\" style=\"fill:var(--ink)\">x<\/text><\/svg>"},"geo-49":{"title":"Volume of Rectangular Solid","subj":"geo","page":49,"group":12,"body":"<p>A rectangular solid has, in most cases, different measurements for each of its sides (<span class=\"m\">x<\/span>, <span class=\"m\">y<\/span>, and <span class=\"m\">z<\/span>). To find the volume, simply multiply these three numbers together. Easy peasy.<\/p><div class=\"ps-f\">xyz<\/div>","plain":"<p>For any box, volume = length × width × height. Just multiply the three edge lengths together; the order does not matter.<\/p>","fun":"The diameter is the longest line inside a circle. If a line is NOT the diameter, then it must be shorter.","check":{"q":"<p>A rectangular solid measures 2 by 3 by 5. What is its volume?<\/p>","a":"30","why":"<p>Multiply the three edges: 2 × 3 × 5 = 30.<\/p>"},"fig":"<svg viewBox=\"0 0 320 254\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"30,90 230,90 230,220 30,220\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"30,90 75,45 275,45 230,90\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"230,90 275,45 275,175 230,220\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><text x=\"216\" y=\"160\" text-anchor=\"end\" font-size=\"18\" font-style=\"italic\" style=\"fill:var(--ink)\">y<\/text><text x=\"262\" y=\"212\" text-anchor=\"middle\" font-size=\"18\" font-style=\"italic\" style=\"fill:var(--ink)\">z<\/text><text x=\"130\" y=\"244\" text-anchor=\"middle\" font-size=\"18\" font-style=\"italic\" style=\"fill:var(--ink)\">x<\/text><\/svg>"},"geo-50":{"title":"Surface Area of Rectangular Solid","subj":"geo","page":50,"group":12,"body":"<p>Finding the Surface Area of a rectangular solid is a little annoying. You have to find the area of each of the three different sides and double each (because there are two of each side).<\/p><p>Front face: <span class=\"hl\"><span class=\"m\">xy<\/span><\/span>. Top face: <span class=\"hl\"><span class=\"m\">xz<\/span><\/span>. Side face: <span class=\"hl\"><span class=\"m\">yz<\/span><\/span>.<\/p><div class=\"ps-f\">2(xy + xz + yz)<\/div>","plain":"<p>A box has 6 faces that come in 3 matching pairs: front/back, top/bottom, left/right. Find the area of one face from each pair, add the three areas, then double the total.<\/p>","fun":"There are infinite versions of a rectangular solid where the volume and surface area are equal.","check":{"q":"<p>A rectangular solid measures 2 by 3 by 4. What is its surface area?<\/p>","a":"52","why":"<p>The three different faces are 2 × 3 = 6, 2 × 4 = 8 and 3 × 4 = 12. Add: 26. Double: 2 × 26 = 52.<\/p>"},"fig":"<svg viewBox=\"0 0 320 254\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"30,90 230,90 230,220 30,220\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"30,90 80,40 280,40 230,90\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"230,90 280,40 280,170 230,220\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><text x=\"155\" y=\"71\" text-anchor=\"middle\" font-size=\"18\" font-style=\"italic\" style=\"fill:var(--red)\">xz<\/text><text x=\"110\" y=\"162\" text-anchor=\"middle\" font-size=\"22\" font-style=\"italic\" style=\"fill:var(--red)\">xy<\/text><text x=\"214\" y=\"162\" text-anchor=\"end\" font-size=\"18\" font-style=\"italic\" style=\"fill:var(--ink)\">y<\/text><text x=\"255\" y=\"142\" text-anchor=\"middle\" font-size=\"17\" font-style=\"italic\" style=\"fill:var(--red)\">yz<\/text><text x=\"270\" y=\"212\" text-anchor=\"middle\" font-size=\"18\" font-style=\"italic\" style=\"fill:var(--ink)\">z<\/text><text x=\"130\" y=\"244\" text-anchor=\"middle\" font-size=\"18\" font-style=\"italic\" style=\"fill:var(--ink)\">x<\/text><\/svg>"},"geo-51":{"title":"Volume of Right Cylinder","subj":"geo","page":51,"group":12,"body":"<p>You can think of the volume of a right cylinder as the area of one circle “stacked” many times (the height of the cylinder). So the formula is just…<\/p><div class=\"ps-f\">πr²h<\/div>","plain":"<p>The top of the cylinder is a circle with area πr². Stack that circle up through the whole height h and you fill the cylinder, so volume = πr² × h.<\/p>","fun":"There are cylinders other than “right” but you won’t see them on the GRE.","check":{"q":"<p>A right cylinder has radius 3 and height 5. What is its volume?<\/p>","a":"45π","why":"<p>πr²h = π(3)²(5) = π × 9 × 5 = 45π.<\/p>"},"fig":"<svg viewBox=\"0 0 320 252\" xmlns=\"http://www.w3.org/2000/svg\"><ellipse cx=\"150\" cy=\"50\" rx=\"90\" ry=\"22\" fill=\"none\" stroke-width=\"2.5\" style=\"stroke:var(--blue)\"/><line x1=\"60\" y1=\"50\" x2=\"60\" y2=\"215\" fill=\"none\" stroke-width=\"2.5\" style=\"stroke:var(--blue)\"/><line x1=\"240\" y1=\"50\" x2=\"240\" y2=\"215\" fill=\"none\" stroke-width=\"2.5\" style=\"stroke:var(--blue)\"/><path d=\"M60 215 A90 22 0 0 0 240 215\" fill=\"none\" stroke-width=\"2.5\" style=\"stroke:var(--blue);fill:none\"/><line x1=\"60\" y1=\"50\" x2=\"150\" y2=\"50\" fill=\"none\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\" style=\"stroke:var(--ink-3)\"/><line x1=\"150\" y1=\"72\" x2=\"150\" y2=\"237\" fill=\"none\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\" style=\"stroke:var(--ink-3)\"/><text x=\"105\" y=\"68\" text-anchor=\"middle\" font-size=\"16\" font-style=\"italic\" style=\"fill:var(--ink)\">r<\/text><text x=\"170\" y=\"145\" text-anchor=\"middle\" font-size=\"20\" font-style=\"italic\" style=\"fill:var(--ink)\">h<\/text><\/svg>"},"geo-52":{"title":"Surface Area of Right Cylinder","subj":"geo","page":52,"group":12,"body":"<ul class=\"ps-list\"><li>Top circle: <span class=\"m\">πr²<\/span><\/li><li>Bottom circle: <span class=\"m\">πr²<\/span><\/li><li>The side unrolls into a rectangle with width <span class=\"hl\"><span class=\"m\">2πr<\/span><\/span> and height <span class=\"hl\"><span class=\"m\">h<\/span><\/span>: area <span class=\"m\">2πrh<\/span><\/li><\/ul><div class=\"ps-box\"><div class=\"ps-f\">2πr² + 2πrh<\/div><\/div>","plain":"<p>Think of a soup can. The lid and the bottom are two circles, each πr². The label peels off into a rectangle: its width is the distance around the circle (2πr) and its height is h, so its area is 2πrh. Add all three pieces.<\/p>","fun":"Sometimes the cylinder is “open” at one end or both ends, which of course changes the surface area.","check":{"q":"<p>A right cylinder has radius 2 and height 5. What is its total surface area?<\/p>","choices":["20π","24π","28π","40π"],"a":"C · 28π","why":"<p>Two circles: 2π(2)² = 8π. Side: 2π(2)(5) = 20π. Total: 8π + 20π = 28π.<\/p>"},"fig":"<svg viewBox=\"0 0 640 300\" xmlns=\"http://www.w3.org/2000/svg\"><ellipse cx=\"110\" cy=\"60\" rx=\"75\" ry=\"22\" fill=\"none\" stroke-width=\"2.5\" style=\"stroke:var(--blue)\"/><line x1=\"35\" y1=\"60\" x2=\"35\" y2=\"230\" fill=\"none\" stroke-width=\"2.5\" style=\"stroke:var(--blue)\"/><line x1=\"185\" y1=\"60\" x2=\"185\" y2=\"230\" fill=\"none\" stroke-width=\"2.5\" style=\"stroke:var(--blue)\"/><path d=\"M35 230 A75 22 0 0 0 185 230\" fill=\"none\" stroke-width=\"2.5\" style=\"stroke:var(--blue);fill:none\"/><line x1=\"35\" y1=\"60\" x2=\"110\" y2=\"60\" fill=\"none\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\" style=\"stroke:var(--ink-3)\"/><line x1=\"110\" y1=\"82\" x2=\"110\" y2=\"252\" fill=\"none\" stroke-width=\"1.2\" stroke-dasharray=\"5 4\" style=\"stroke:var(--ink-3)\"/><text x=\"72.5\" y=\"76\" text-anchor=\"middle\" font-size=\"16\" font-style=\"italic\" style=\"fill:var(--ink)\">r<\/text><text x=\"126\" y=\"176\" text-anchor=\"middle\" font-size=\"20\" font-style=\"italic\" style=\"fill:var(--ink)\">h<\/text><circle cx=\"330\" cy=\"62\" r=\"50\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><text x=\"330\" y=\"68\" text-anchor=\"middle\" font-size=\"17\" font-style=\"italic\" style=\"fill:var(--ink)\">πr²<\/text><line x1=\"150\" y1=\"58\" x2=\"274\" y2=\"58\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--red)\"/><polygon points=\"274,58 266,62 266,54\" fill=\"none\" style=\"fill:var(--red);stroke:var(--red)\"/><circle cx=\"330\" cy=\"232\" r=\"50\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><text x=\"330\" y=\"238\" text-anchor=\"middle\" font-size=\"17\" font-style=\"italic\" style=\"fill:var(--ink)\">πr²<\/text><path d=\"M120 264 Q210 300 284 268\" fill=\"none\" stroke-width=\"3\" style=\"stroke:var(--red);fill:none\"/><polygon points=\"290,264 284.5,273.7 278.9,265.4\" fill=\"none\" style=\"fill:var(--red);stroke:var(--red)\"/><polygon points=\"430,110 600,110 600,200 430,200\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><text x=\"515\" y=\"100\" text-anchor=\"middle\" font-size=\"16\" font-style=\"italic\" style=\"fill:var(--red)\">2πr<\/text><text x=\"613\" y=\"160\" text-anchor=\"start\" font-size=\"17\" font-style=\"italic\" style=\"fill:var(--red)\">h<\/text><text x=\"515\" y=\"161\" text-anchor=\"middle\" font-size=\"18\" font-style=\"italic\" style=\"fill:var(--ink)\">2πrh<\/text><line x1=\"144\" y1=\"152\" x2=\"424\" y2=\"150\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--red)\"/><polygon points=\"424,150 416,154.1 416,146.1\" fill=\"none\" style=\"fill:var(--red);stroke:var(--red)\"/><rect x=\"430\" y=\"222\" width=\"182\" height=\"52\" rx=\"8\" fill=\"none\" stroke-width=\"2\" style=\"fill:var(--blue-wash);stroke:var(--blue)\"/><text x=\"521\" y=\"254\" text-anchor=\"middle\" font-size=\"18\" font-style=\"italic\" style=\"fill:var(--ink)\">2πr² + 2πrh<\/text><\/svg>"},"geo-53":{"title":"How are they related?","subj":"geo","page":53,"group":12,"body":"<p>Whenever 3D shapes are small, the surface area is greater than the volume. At a certain size, they equal each other. Then the volume takes over.<\/p><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><th>Cube<\/th><th>surface area<\/th><th>volume<\/th><\/tr><tr><td><span class=\"note\">side length = 1<\/span><\/td><td>6<\/td><td>1<\/td><\/tr><tr><td><span class=\"note\">side length = 6<\/span><\/td><td>216<\/td><td>216<\/td><\/tr><tr><td><span class=\"note\">side length = 10<\/span><\/td><td>600<\/td><td>1,000<\/td><\/tr><\/table><\/div>","plain":"<p>For a cube, surface area is 6x² and volume is x³. When x is small, 6x² is bigger; at x = 6 they are equal (216); for x bigger than 6, x³ wins. GRE quantitative-comparison questions love this: the answer can depend on the size.<\/p>","fun":"This relationship is why an ant doesn’t die from a high fall whereas an elephant does.","check":{"q":"<p>A cube has a side length of 3. Which is greater: its surface area or its volume?<\/p>","choices":["The surface area","The volume","They are equal","It cannot be determined"],"a":"A · The surface area","why":"<p>Surface area = 6 × 3² = 54 and volume = 3³ = 27. Since 3 is less than 6, the surface area is bigger.<\/p>"},"fig":"<svg viewBox=\"0 0 640 218\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"84.8,130 114.8,130 114.8,160 84.8,160\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"84.8,130 95.2,119.5 125.2,119.5 114.8,130\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"114.8,130 125.2,119.5 125.2,149.5 114.8,160\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><text x=\"105\" y=\"109.5\" text-anchor=\"middle\" font-size=\"13\" font-style=\"italic\" style=\"fill:var(--red)\">side length = 1<\/text><text x=\"105\" y=\"186\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--ink)\">surface area = 6<\/text><text x=\"105\" y=\"206\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--ink)\">volume = 1<\/text><polygon points=\"278.1,98 340.1,98 340.1,160 278.1,160\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"278.1,98 299.8,76.3 361.8,76.3 340.1,98\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"340.1,98 361.8,76.3 361.8,138.3 340.1,160\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><text x=\"320\" y=\"66.3\" text-anchor=\"middle\" font-size=\"13\" font-style=\"italic\" style=\"fill:var(--red)\">side length = 6<\/text><text x=\"320\" y=\"186\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--ink)\">surface area = 216<\/text><text x=\"320\" y=\"206\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--ink)\">volume = 216<\/text><polygon points=\"470.2,64 566.2,64 566.2,160 470.2,160\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"470.2,64 503.8,30.4 599.8,30.4 566.2,64\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"566.2,64 599.8,30.4 599.8,126.4 566.2,160\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><text x=\"535\" y=\"20.4\" text-anchor=\"middle\" font-size=\"13\" font-style=\"italic\" style=\"fill:var(--red)\">side length = 10<\/text><text x=\"535\" y=\"186\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--ink)\">surface area = 600<\/text><text x=\"535\" y=\"206\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--ink)\">volume = 1,000<\/text><\/svg>"},"geo-54":{"title":"Diagonal of a Cube","subj":"geo","page":54,"group":12,"body":"<p>Cube with edge <span class=\"m\">x<\/span>:<\/p><div class=\"ps-f\">√3x<\/div><p>This formula is derived by doing Pythagorean theorem twice.<\/p>","plain":"<p>The longest straight line inside a cube goes from one corner to the opposite corner through the middle. Its length is just the edge times √3. Use it whenever the GRE asks for the longest stick that fits in a cube-shaped box.<\/p>","fun":"The diagonal of a right triangle comes from <span class=\"m\">x² + y² = z²<\/span>. The diagonal of a cube comes from <span class=\"m\">x² + x² + x² = z²<\/span>.","check":{"q":"<p>A cube has an edge length of 5. What is the length of its diagonal (corner to opposite corner)?<\/p>","choices":["5√2","5√3","15","25"],"a":"B · 5√3","why":"<p>The diagonal of a cube is √3 × edge = √3 × 5 = 5√3.<\/p>"},"fig":"<svg viewBox=\"0 0 420 266\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"40,80 190,80 190,230 40,230\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"40,80 90,30 240,30 190,80\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"190,80 240,30 240,180 190,230\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><line x1=\"90\" y1=\"30\" x2=\"190\" y2=\"230\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><line x1=\"120\" y1=\"130\" x2=\"296\" y2=\"130\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--red)\"/><polygon points=\"296,130 288,134 288,126\" fill=\"none\" style=\"fill:var(--red);stroke:var(--red)\"/><text x=\"350\" y=\"140\" text-anchor=\"middle\" font-size=\"26\" font-style=\"italic\" style=\"fill:var(--blue)\">√3x<\/text><text x=\"115\" y=\"254\" text-anchor=\"middle\" font-size=\"18\" font-style=\"italic\" style=\"fill:var(--ink)\">x<\/text><\/svg>"},"geo-55":{"title":"Diagonal of Rectangular Solid","subj":"geo","page":55,"group":12,"body":"<p>Rectangular solid with edges <span class=\"m\">x<\/span>, <span class=\"m\">y<\/span>, and <span class=\"m\">z<\/span>:<\/p><div class=\"ps-f\">√<span class=\"ov\">x² + y² + z²<\/span><\/div><p>This formula is also derived by doing Pythagorean theorem twice.<\/p>","plain":"<p>To find the longest line inside a box, square each of the three edge lengths, add them, and take the square root. It is the Pythagorean theorem with one extra term.<\/p>","fun":"The diameter is the longest line inside a circle. If a line is NOT the diameter, then it must be shorter.","check":{"q":"<p>A rectangular solid measures 2 by 3 by 6. How long is its diagonal?<\/p>","a":"7","why":"<p><span class=\"m\">√<span class=\"ov\">2² + 3² + 6²<\/span> = √<span class=\"ov\">4 + 9 + 36<\/span> = √49 = 7<\/span>.<\/p>"},"fig":"<svg viewBox=\"0 0 480 264\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"30,88 240,88 240,228 30,228\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"30,88 80,38 290,38 240,88\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><polygon points=\"240,88 290,38 290,178 240,228\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:none\"/><line x1=\"80\" y1=\"38\" x2=\"240\" y2=\"228\" fill=\"none\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\" style=\"stroke:var(--blue)\"/><line x1=\"140\" y1=\"126\" x2=\"316\" y2=\"126\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--red)\"/><polygon points=\"316,126 308,130 308,122\" fill=\"none\" style=\"fill:var(--red);stroke:var(--red)\"/><text x=\"326\" y=\"133\" text-anchor=\"start\" font-size=\"19\" font-style=\"italic\" style=\"fill:var(--blue)\">√(x² + y² + z²)<\/text><text x=\"226\" y=\"176\" text-anchor=\"end\" font-size=\"18\" font-style=\"italic\" style=\"fill:var(--ink)\">y<\/text><text x=\"278\" y=\"216\" text-anchor=\"middle\" font-size=\"18\" font-style=\"italic\" style=\"fill:var(--ink)\">z<\/text><text x=\"135\" y=\"252\" text-anchor=\"middle\" font-size=\"18\" font-style=\"italic\" style=\"fill:var(--ink)\">x<\/text><\/svg>"},"geo-56":{"title":"Stacking Cubes","subj":"geo","page":56,"group":12,"body":"<p>Sometimes you’ll see identical cubes stacked like this. <span class=\"note\">(The picture shows cubes of edge <span class=\"m\">x<\/span> stacked 6 long, 2 high and 3 deep: 36 cubes.)<\/span><\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Volume is easy<\/h4><div class=\"ps-f\">volume of 1 cube × # of cubes<\/div><div class=\"ps-f\"><span class=\"hl\">36x³<\/span><\/div><\/div><div class=\"ps-col\"><h4>Surface Area is Harder<\/h4><div class=\"ps-f\">Just the area of the outside portion<\/div><div class=\"ps-f\"><span class=\"hl\">see below<\/span><\/div><\/div><\/div><p><b>Surface Area<\/b><\/p><div class=\"ps-box\"><div class=\"ps-f\">2(12x² + 6x² + 18x²)<\/div><div class=\"ps-f\">72x²<\/div><\/div>","plain":"<p>Treat the whole stack as one big box. Volume: count the cubes and multiply by one cube’s volume. Surface area: only the outside faces count, so find the big box’s three different faces (front 6 × 2 = 12 squares, side 2 × 3 = 6, top 6 × 3 = 18), each square being x², add them and double.<\/p>","fun":"These problems are much easier if you consider the stacked cubes as a solid rectangular solid.","check":{"q":"<p>Three identical cubes, each with edge <span class=\"m\">x<\/span>, are glued together in a straight row. What is the total surface area of the shape?<\/p>","choices":["18x²","14x²","12x²","9x²"],"a":"B · 14x²","why":"<p>Treat it as a 3x by x by x solid: 2(3x·x + 3x·x + x·x) = 2(3x² + 3x² + x²) = 2(7x²) = 14x².<\/p>"},"fig":"<svg viewBox=\"0 0 400 196\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"60,100 300,100 300,180 60,180\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:var(--amber-wash)\"/><polygon points=\"60,100 102,58 342,58 300,100\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:var(--amber-wash)\"/><polygon points=\"300,100 342,58 342,138 300,180\" fill=\"none\" stroke-width=\"2\" style=\"stroke:var(--blue);fill:var(--amber-wash)\"/><line x1=\"100\" y1=\"100\" x2=\"100\" y2=\"180\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--blue)\"/><line x1=\"100\" y1=\"100\" x2=\"142\" y2=\"58\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--blue)\"/><line x1=\"140\" y1=\"100\" x2=\"140\" y2=\"180\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--blue)\"/><line x1=\"140\" y1=\"100\" x2=\"182\" y2=\"58\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--blue)\"/><line x1=\"180\" y1=\"100\" x2=\"180\" y2=\"180\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--blue)\"/><line x1=\"180\" y1=\"100\" x2=\"222\" y2=\"58\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--blue)\"/><line x1=\"220\" y1=\"100\" x2=\"220\" y2=\"180\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--blue)\"/><line x1=\"220\" y1=\"100\" x2=\"262\" y2=\"58\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--blue)\"/><line x1=\"260\" y1=\"100\" x2=\"260\" y2=\"180\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--blue)\"/><line x1=\"260\" y1=\"100\" x2=\"302\" y2=\"58\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--blue)\"/><line x1=\"60\" y1=\"140\" x2=\"300\" y2=\"140\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--blue)\"/><line x1=\"300\" y1=\"140\" x2=\"342\" y2=\"98\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--blue)\"/><line x1=\"74\" y1=\"86\" x2=\"314\" y2=\"86\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--blue)\"/><line x1=\"314\" y1=\"86\" x2=\"314\" y2=\"166\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--blue)\"/><line x1=\"88\" y1=\"72\" x2=\"328\" y2=\"72\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--blue)\"/><line x1=\"328\" y1=\"72\" x2=\"328\" y2=\"152\" fill=\"none\" stroke-width=\"1\" style=\"stroke:var(--blue)\"/><text x=\"288\" y=\"170\" text-anchor=\"middle\" font-size=\"13\" font-style=\"italic\" style=\"fill:var(--ink)\">x<\/text><\/svg>"}},"sum":{"ari-1":["Natural numbers 1, 2, 3…; whole numbers add 0; integers add the negatives. None of them include fractions or decimals.",null],"ari-2":["Further left is smaller: −7 &lt; −3. Zero is neither positive nor negative.",null],"ari-3":["× can be written (3)(2), 3 × 2 or 3 · 2; ÷ can be a fraction, ÷ or a colon. Also: exponents, roots, factorials (3! = 3·2·1, 6! = 720).",null],"ari-4":["a − (−b) = a + b. (−)(−) = +, (−)(+) = −. (−a)<sup>2<\/sup> = a<sup>2<\/sup> but −a<sup>2<\/sup> stays negative. √(negative) is impossible; ∛(negative) is fine.","Brackets decide: −3<sup>2<\/sup> = −9, (−3)<sup>2<\/sup> = 9."],"ari-5":["Parentheses → Exponents → × and ÷ left to right → + and − left to right. 3<sup>3<\/sup> + (15 − 17)<sup>2<\/sup> − 5 × 6 ÷
