/span><\/div><p><span class=\"note\">2 decimal places → 2 zeros<\/span><\/p><div class=\"ps-f\">0.582 → <span class=\"fr\"><span>582<\/span><span>1000<\/span><\/span> → <span class=\"fr\"><span>291<\/span><span>500<\/span><\/span><\/div><p><span class=\"note\">3 decimal places → 3 zeros<\/span><\/p><\/div><div class=\"ps-col\"><h4>Non-terminating, repeating<\/h4><p>Just put the repeating part over the correct number of 9s<\/p><div class=\"ps-f\">0.<span class=\"ov\">4<\/span> = <span class=\"fr\"><span>4<\/span><span>9<\/span><\/span><\/div><p><span class=\"note\">1 decimal place → 1 nine<\/span><\/p><div class=\"ps-f\">0.<span class=\"ov\">57<\/span> = <span class=\"fr\"><span>57<\/span><span>99<\/span><\/span><\/div><p><span class=\"note\">2 decimal places → 2 nines<\/span><\/p><div class=\"ps-f\">0.<span class=\"ov\">894<\/span> = <span class=\"fr\"><span>894<\/span><span>999<\/span><\/span><\/div><p><span class=\"note\">3 decimal places → 3 nines<\/span><\/p><\/div><\/div>","plain":"A decimal that stops: write the digits over 1 followed by as many zeros as there are decimal places, then simplify (0.35 = 35/100 = 7/20). A decimal that repeats right after the dot: write the repeating block over the same number of 9s (0.5757… = 57/99). Count the digits carefully: that count sets the number of zeros or nines.","fun":"There is NO WAY to write a non-terminating, non-repeating decimal as a fraction, for that is the very definition of an irrational number.","check":{"q":"Write <span class=\"m\">0.<span class=\"ov\">36<\/span><\/span> (that is, 0.363636…) as a fraction in lowest terms.","choices":["<span class=\"fr\"><span>36<\/span><span>100<\/span><\/span>","<span class=\"fr\"><span>9<\/span><span>25<\/span><\/span>","<span class=\"fr\"><span>4<\/span><span>11<\/span><\/span>","<span class=\"fr\"><span>36<\/span><span>999<\/span><\/span>","<span class=\"fr\"><span>3<\/span><span>8<\/span><\/span>"],"a":"C · <span class=\"fr\"><span>4<\/span><span>11<\/span><\/span>","why":"Two repeating digits go over two 9s: 36/99. Divide top and bottom by 9: 4/11."}},"ari-43":{"title":"Rounding Decimals","subj":"ari","page":43,"group":3,"body":"<p>What is 1.325861 rounded to the nearest…<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><p class=\"ps-step\"><b>Step 1:<\/b> Find the digit in question. Then look immediately <span class=\"hl\">to its right.<\/span><\/p><p class=\"ps-step\"><b>Step 2a:<\/b> If it is <span class=\"ok\">0 to 4<\/span>, keep the digit as is and throw away all subsequent digits<\/p><p class=\"ps-step\"><b>Step 2b:<\/b> If it is 5 to 9, add 1 to the digit and throw away all subsequent digits<\/p><\/div><div class=\"ps-col\"><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><th>nearest…<\/th><th>number<\/th><th>digit to the right<\/th><th>result<\/th><\/tr><tr><td>tenth?<\/td><td>1.<span class=\"hl\">3<\/span>25861<\/td><td><span class=\"ok\">0 to 4<\/span><\/td><td>1.3<\/td><\/tr><tr><td>hundredth?<\/td><td>1.3<span class=\"hl\">2<\/span>5861<\/td><td>5 to 9<\/td><td>1.33<\/td><\/tr><tr><td>thousandth?<\/td><td>1.32<span class=\"hl\">5<\/span>861<\/td><td>5 to 9<\/td><td>1.326<\/td><\/tr><\/table><\/div><p><span class=\"note\">red digit = digit in question; look at digit to the right<\/span><\/p><\/div><\/div>","plain":"To round, find the place you are rounding to, then look at just ONE digit to its right. If that digit is 0–4, leave your digit alone; if it is 5–9, raise your digit by 1. Then drop everything after it. Only the single next digit matters, not the digits after it.","fun":"1.444999999999999999 rounded to the nearest hundredth is still just 1.44.","check":{"q":"What is <span class=\"m\">4.6372<\/span> rounded to the nearest hundredth?","choices":["4.6","4.63","4.64","4.637","4.7"],"a":"C · 4.64","why":"The hundredths digit is 3; the digit to its right is 7 (5 to 9), so 3 becomes 4: 4.64."}},"ari-44":{"title":"Exponent Rules I","subj":"ari","page":44,"group":3,"body":"<div class=\"ps-boxes\"><div class=\"ps-box\"><div class=\"ps-box-h\">Rule 1<\/div><p><span class=\"note\">if<\/span><\/p><div class=\"ps-f\">3<sup>a+b<\/sup> = 3¹⁰<\/div><p><span class=\"note\">then<\/span><\/p><div class=\"ps-f\">a + b = 10<\/div><\/div><div class=\"ps-box\"><div class=\"ps-box-h\">Rule 2<\/div><div class=\"ps-f\">a<sup>−3<\/sup> = <span class=\"fr\"><span>1<\/span><span>a³<\/span><\/span><\/div><\/div><div class=\"ps-box\"><div class=\"ps-box-h\">Rule 3<\/div><div class=\"ps-f\">(3<sup>a<\/sup>)(3<sup>b<\/sup>) =<\/div><p><span class=\"note\">same base<\/span><\/p><div class=\"ps-f\">3<sup>a+b<\/sup><\/div><\/div><div class=\"ps-box\"><div class=\"ps-box-h\">Rule 4<\/div><div class=\"ps-f\"><span class=\"fr\"><span>3<sup>a<\/sup><\/span><span>3<sup>b<\/sup><\/span><\/span> = 3<sup>a−b<\/sup><\/div><p><span class=\"note\">same base<\/span><\/p><\/div><div class=\"ps-box\"><div class=\"ps-box-h\">Rule 5<\/div><div class=\"ps-f\">a⁰ = 1<\/div><p><span class=\"note\">true for <b>all<\/b> a values except 0<\/span><\/p><\/div><\/div>","plain":"Rule 1: if two powers with the same base are equal, their exponents are equal. Rule 2: a negative exponent means “one over” the positive power. Rules 3 and 4: with the same base, multiplying adds the exponents and dividing subtracts them. Rule 5: any nonzero number to the power 0 is 1.","fun":"The GRE considers zero raised to the zero power “undefined.”","check":{"q":"Simplify <span class=\"m\"><span class=\"fr\"><span>5⁷ × 5<sup>−2<\/sup><\/span><span>5³<\/span><\/span><\/span>.","choices":["5²","5⁶","5¹²","<span class=\"fr\"><span>1<\/span><span>5²<\/span><\/span>","1"],"a":"A · 5²","why":"Same base: multiplying adds exponents, 7 + (−2) = 5; dividing subtracts, 5 − 3 = 2. So the result is 5²."}},"ari-45":{"title":"Exponent Rules II","subj":"ari","page":45,"group":3,"body":"<div class=\"ps-boxes\"><div class=\"ps-box\"><div class=\"ps-box-h\">Rule 6<\/div><div class=\"ps-f\">(2<sup>a<\/sup>)(3<sup>a<\/sup>) =<\/div><p><span class=\"note\">same exponent<\/span><\/p><div class=\"ps-f\">(2 × 3)<sup>a<\/sup><\/div><\/div><div class=\"ps-box\"><div class=\"ps-box-h\">Rule 7<\/div><div class=\"ps-f\">(<span class=\"fr\"><span>2<\/span><span>3<\/span><\/span>)<sup>a<\/sup> = <span class=\"fr\"><span>2<sup>a<\/sup><\/span><span>3<sup>a<\/sup><\/span><\/span><\/div><\/div><div class=\"ps-box\"><div class=\"ps-box-h\">Rule 8<\/div><div class=\"ps-f\">(2<sup>a<\/sup>)<sup>b<\/sup> =<\/div><div class=\"ps-f\">2<sup>ab<\/sup><\/div><\/div><div class=\"ps-box\"><div class=\"ps-box-h\">Rule 9<\/div><div class=\"ps-f\">a<sup>3<sup>3<sup>2<\/sup><\/sup><\/sup> ≠ a¹⁸<\/div><div class=\"ps-f\">a<sup>3<sup>9<\/sup><\/sup> = a<sup>19,683<\/sup><\/div><\/div><\/div>","plain":"Rule 6: different bases with the same exponent can be multiplied inside one bracket: 2ᵃ × 3ᵃ = 6ᵃ. Rule 7: a power of a fraction applies to the top and the bottom. Rule 8: a power of a power multiplies the exponents. Rule 9: a stacked exponent (a tower) is worked from the top down, so it is NOT the same as multiplying the exponents.","fun":"<span class=\"m\">((a³)³)²<\/span> does indeed equal <span class=\"m\">a¹⁸<\/span>. So what’s the lesson here? Parentheses matter!","check":{"q":"Which is equal to <span class=\"m\">(5<sup>4<\/sup>)<sup>3<\/sup><\/span>?","choices":["5⁷","5¹²","5<sup>64<\/sup>","5<sup>81<\/sup>","15⁴"],"a":"B · 5¹²","why":"A power of a power multiplies the exponents: 4 × 3 = 12, so (5⁴)³ = 5¹²."}},"ari-46":{"title":"Roots","subj":"ari","page":46,"group":4,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Important Vocabulary<\/h4><div class=\"ps-f\">√a<\/div><p><span class=\"note\">radical → the √ sign; radicand → a (the number under it)<\/span><\/p><ul class=\"ps-list\"><li><span class=\"m\">√6<\/span> — The <span class=\"hl\">square<\/span> root of 6<\/li><li><span class=\"m\">∛8<\/span> — The <span class=\"hl\">cube<\/span> root of 8<\/li><li><span class=\"m\">∜5<\/span> — The <span class=\"hl\">fourth<\/span> root of 5<\/li><\/ul><\/div><div class=\"ps-col\"><h4>The intimate connection between roots and exponents<\/h4><p>Think of roots as the “reverse” of exponents<\/p><div class=\"ps-f\">4² = 16 → √16 = 4<\/div><div class=\"ps-f\">2³ = 8 → ∛8 = 2<\/div><div class=\"ps-f\">(−2)³ = −8 → ∛−8 = −2<\/div><p><span class=\"note\">negatives <b>are allowed<\/b> for odd roots<\/span><\/p><div class=\"ps-f\">3⁴ = 81 → ∜81 = 3<\/div><\/div><\/div>","plain":"In √a, the √ sign is the radical and the number under it is the radicand. A root undoes a power: since 2³ = 8, the cube root of 8 is 2. Odd roots (cube root, 5th root…) can be taken of negative numbers, because a negative number cubed stays negative.","fun":"Every root that does NOT simplify to an integer, such as √5, ∛7, and <sup>5<\/sup>√9 is an irrational number and cannot be written as a fraction.","check":{"q":"What is <span class=\"m\">∛−27<\/span>?","choices":["−9","−3","3","9","not a real number"],"a":"B · −3","why":"(−3)³ = −27, and odd roots of negatives are allowed, so ∛−27 = −3."}},"ari-47":{"title":"Roots as Exponents","subj":"ari","page":47,"group":4,"body":"<p>Roots can also be written as <span class=\"hl\">fractional<\/span> exponents<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Easy Examples<\/h4><div class=\"ps-f\">√2 = 2<sup>1/2<\/sup> &nbsp;&nbsp; ∜6 = 6<sup>1/4<\/sup><\/div><div class=\"ps-f\">∛5 = 5<sup>1/3<\/sup> &nbsp;&nbsp; <sup>11<\/sup>√7 = 7<sup>1/11<\/sup><\/div><h4>More Complex Examples<\/h4><div class=\"ps-f\">√<span class=\"ov\">2³<\/span> = 2<sup>3/2<\/sup> &nbsp;&nbsp; <sup>4<\/sup>√<span class=\"ov\">6⁵<\/span> = 6<sup>5/4<\/sup><\/div><div class=\"ps-f\"><sup>3<\/sup>√<span class=\"ov\">5²<\/span> = 5<sup>2/3<\/sup> &nbsp;&nbsp; <sup>11<\/sup>√<span class=\"ov\">7⁴<\/span> = 7<sup>4/11<\/sup><\/div><p><span class=\"note\">the power inside goes on top of the fraction; the root goes on the bottom<\/span><\/p><\/div><div class=\"ps-col\"><h4>The same exponent rules apply<\/h4><div class=\"ps-f\">√a × <sup>3<\/sup>√<span class=\"ov\">a²<\/span><\/div><p><span class=\"note\">original expression<\/span><\/p><div class=\"ps-f\">a<sup>1/2<\/sup> × a<sup>2/3<\/sup><\/div><p><span class=\"note\">exponent form<\/span><\/p><div class=\"ps-f\">a<sup>1/2 + 2/3<\/sup> = a<sup>7/6<\/sup><\/div><p><span class=\"note\">apply exponent rules<\/span><\/p><\/div><\/div>","plain":"Any root can be written as a fraction in the exponent: the root number goes on the bottom and the power inside goes on top. So the cube root of 5² is 5<sup>2/3<\/sup>. Once roots are written as exponents, the usual exponent rules work, for example adding exponents when you multiply the same base.","check":{"q":"Write <span class=\"m\">√x × ∛x<\/span> as a single power of <span class=\"m\">x<\/span> (x &gt; 0).","choices":["x<sup>1/6<\/sup>","x<sup>2/5<\/sup>","x<sup>5/6<\/sup>","x<sup>1/5<\/sup>","x<sup>6<\/sup>"],"a":"C · x<sup>5/6<\/sup>","why":"√x = x<sup>1/2<\/sup> and ∛x = x<sup>1/3<\/sup>; multiplying adds exponents: 1/2 + 1/3 = 3/6 + 2/6 = 5/6."}},"ari-48":{"title":"Roots Operations","subj":"ari","page":48,"group":4,"body":"<div class=\"ps-boxes\"><div class=\"ps-box\"><div class=\"ps-box-h\">Rule 1<\/div><p><span class=\"m\">a &gt; 0<\/span><\/p><div class=\"ps-f\">(√a)² = a<\/div><\/div><div class=\"ps-box\"><div class=\"ps-box-h\">Rule 2<\/div><div class=\"ps-f\">√<span class=\"ov\">a²<\/span> = |a|<\/div><\/div><div class=\"ps-box\"><div class=\"ps-box-h\">Rule 3<\/div><p><span class=\"m\">a, b &gt; 0<\/span><\/p><div class=\"ps-f\">√a√b = √<span class=\"ov\">ab<\/span><\/div><\/div><div class=\"ps-box\"><div class=\"ps-box-h\">Rule 4<\/div><p><span class=\"m\">a, b &gt; 0<\/span><\/p><div class=\"ps-f\"><span class=\"fr\"><span>√a<\/span><span>√b<\/span><\/span> = √<span class=\"ov\"><span class=\"fr\"><span>a<\/span><span>b<\/span><\/span><\/span><\/div><\/div><div class=\"ps-box\"><div class=\"ps-box-h\">Rule 5<\/div><p><span class=\"note\">if n = positive <b>even<\/b> integer<\/span><\/p><div class=\"ps-f\"><sup>n<\/sup>√<span class=\"ov\">aⁿ<\/span> = |a|<\/div><p><span class=\"note\">never negative<\/span><\/p><\/div><div class=\"ps-box\"><div class=\"ps-box-h\">Rule 6<\/div><p><span class=\"note\">if n = positive <b>odd<\/b> integer<\/span><\/p><div class=\"ps-f\"><sup>n<\/sup>√<span class=\"ov\">aⁿ<\/span> = a<\/div><\/div><\/div>","plain":"Squaring a square root gives back the number. But the square root of a square gives the absolute value, because a square root is never negative: √((−3)²) = 3. Roots can be multiplied or divided by putting everything under one root sign. For odd roots (like cube roots) the sign comes back unchanged.","fun":"When graphed in the <span class=\"m\">xy<\/span>-coordinate plane, you’ll see that the graph of <span class=\"m\">y = √<span class=\"ov\">x²<\/span><\/span> is identical to the graph of <span class=\"m\">y = |x|<\/span>.","check":{"q":"What is <span class=\"m\">√12 × √3<\/span>?","choices":["√15","3","6","9","36"],"a":"C · 6","why":"Rule 3: √12 × √3 = √36 = 6."}},"ari-49":{"title":"Simplifying Roots","subj":"ari","page":49,"group":4,"body":"<p>Roots are generally simplified in two ways<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>“Pulling Out” Perfect Squares<\/h4><div class=\"ps-f\">√<span class=\"ov\">360<\/span><\/div><p><span class=\"note\">not simplified<\/span><\/p><div class=\"ps-f\">√<span class=\"ov\">2³3²5¹<\/span><\/div><p><span class=\"note\">prime factorize under radical<\/span><\/p><div class=\"ps-f\">√<span class=\"ov\"><span class=\"ok\">2²<\/span>2¹<span class=\"ok\">3²<\/span>5¹<\/span><\/div><p><span class=\"note\">write any perfect squares that you can<\/span><\/p><div class=\"ps-f\">2 · 3√<span class=\"ov\">2¹5¹<\/span> = <span class=\"hl\">6√10<\/span><\/div><\/div><div class=\"ps-col\"><h4>Rationalizing Denominators<\/h4><div class=\"ps-f\"><span class=\"fr\"><span>6<\/span><span>√3<\/span><\/span><\/div><p><span class=\"note\">not simplified<\/span><\/p><div class=\"ps-f\"><span class=\"fr\"><span>6<\/span><span>√3<\/span><\/span> × <span class=\"fr\"><span>√3<\/span><span>√3<\/span><\/span><\/div><p><span class=\"note\">multiply top and bottom by √3<\/span><\/p><div class=\"ps-f\"><span class=\"fr\"><span>6√3<\/span><span>3<\/span><\/span> → 2√3<\/div><p><span class=\"note\">Simplify more if possible<\/span><\/p><\/div><\/div>","plain":"To simplify a square root, break the number into primes, find pairs (perfect squares), and move each pair outside the root as one copy: √360 = 6√10. If a root sits in the bottom of a fraction, multiply the top and bottom by that root to clear it; then reduce. GRE answer choices are usually written in this simplified form.","fun":"When simplifying cube roots, you would look for “perfect cubes” instead of “perfect squares.”","check":{"q":"Simplify <span class=\"m\">√72<\/span>.","choices":["4√2","6√3","6√2","8√3","36√2"],"a":"C · 6√2","why":"72 = 2³ × 3² = 2² × 2 × 3². Pull out 2 and 3: 2 × 3 × √2 = 6√2. (4√2 = √32 and 6√3 = √108, so neither equals √72.)"}},"ari-50":{"title":"Real Numbers","subj":"ari","page":50,"group":4,"body":"<p>The number line is NOT just integers. ALL real numbers are included, rational and <span class=\"hl\">irrational<\/span> alike.<\/p><p>Number line from <span class=\"hl\">−∞<\/span> <span class=\"note\">(Negative infinity)<\/span> to <span class=\"hl\">+∞<\/span> <span class=\"note\">(Positive infinity)<\/span>, with integers −9 to 9 marked and these points shown: <span class=\"m\">∛−500<\/span> (just left of −8), <span class=\"m\">−2.5<\/span>, <span class=\"m\">√2<\/span> (between 1 and 2), <span class=\"m\">π<\/span> (just past 3), <span class=\"m\">∛130<\/span> (just past 5).<\/p><p><span class=\"note\">0 is neither positive nor negative<\/span><\/p>","plain":"The number line holds every real number, not only whole numbers: fractions, decimals, and irrational numbers like √2 and π all have a spot. Estimate where a root sits by comparing with nearby perfect powers: 5³ = 125, so ∛130 is a little more than 5. Zero is neither positive nor negative.","fun":"Take any two numbers on the number line, no matter how close, and you will find an INFINITE number of numbers between the two.","check":{"q":"Which number lies between 1 and 2 on the number line?","choices":["π","∛−8","√3","√5","∛10"],"a":"C · √3","why":"1² = 1 and 2² = 4, and 3 is between them, so √3 (≈ 1.73) is between 1 and 2. √5 ≈ 2.24, ∛10 ≈ 2.15, π ≈ 3.14, and ∛−8 = −2."},"fig":"<svg viewBox=\"0 0 640 170\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"34\" y1=\"90\" x2=\"606\" y2=\"90\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2.5\"/><polygon points=\"24,90 38,83 38,97\" style=\"fill:var(--blue)\"/><polygon points=\"616,90 602,83 602,97\" style=\"fill:var(--blue)\"/><text x=\"14\" y=\"76\" style=\"fill:var(--red)\" font-size=\"16\">−∞<\/text><text x=\"626\" y=\"76\" text-anchor=\"end\" style=\"fill:var(--red)\" font-size=\"16\">+∞<\/text><line x1=\"50\" y1=\"84\" x2=\"50\" y2=\"96\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"50\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−9<\/text><line x1=\"80\" y1=\"84\" x2=\"80\" y2=\"96\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"80\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−8<\/text><line x1=\"110\" y1=\"84\" x2=\"110\" y2=\"96\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"110\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−7<\/text><line x1=\"140\" y1=\"84\" x2=\"140\" y2=\"96\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"140\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−6<\/text><line x1=\"170\" y1=\"84\" x2=\"170\" y2=\"96\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"170\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−5<\/text><line x1=\"200\" y1=\"84\" x2=\"200\" y2=\"96\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"200\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−4<\/text><line x1=\"230\" y1=\"84\" x2=\"230\" y2=\"96\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"230\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−3<\/text><line x1=\"260\" y1=\"84\" x2=\"260\" y2=\"96\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"260\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−2<\/text><line x1=\"290\" y1=\"84\" x2=\"290\" y2=\"96\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"290\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−1<\/text><line x1=\"320\" y1=\"84\" x2=\"320\" y2=\"96\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"320\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">0<\/text><line x1=\"350\" y1=\"84\" x2=\"350\" y2=\"96\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"350\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">1<\/text><line x1=\"380\" y1=\"84\" x2=\"380\" y2=\"96\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"380\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">2<\/text><line x1=\"410\" y1=\"84\" x2=\"410\" y2=\"96\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"410\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">3<\/text><line x1=\"440\" y1=\"84\" x2=\"440\" y2=\"96\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"440\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">4<\/text><line x1=\"470\" y1=\"84\" x2=\"470\" y2=\"96\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"470\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">5<\/text><line x1=\"500\" y1=\"84\" x2=\"500\" y2=\"96\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"500\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">6<\/text><line x1=\"530\" y1=\"84\" x2=\"530\" y2=\"96\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"530\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">7<\/text><line x1=\"560\" y1=\"84\" x2=\"560\" y2=\"96\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"560\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">8<\/text><line x1=\"590\" y1=\"84\" x2=\"590\" y2=\"96\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"590\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">9<\/text><line x1=\"82\" y1=\"64\" x2=\"82\" y2=\"90\" fill=\"none\" style=\"stroke:var(--red)\"/><text x=\"82\" y=\"57\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">∛−500<\/text><line x1=\"245\" y1=\"64\" x2=\"245\" y2=\"90\" fill=\"none\" style=\"stroke:var(--red)\"/><text x=\"245\" y=\"57\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−2.5<\/text><line x1=\"362\" y1=\"64\" x2=\"362\" y2=\"90\" fill=\"none\" style=\"stroke:var(--red)\"/><text x=\"362\" y=\"57\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">√2<\/text><line x1=\"414\" y1=\"64\" x2=\"414\" y2=\"90\" fill=\"none\" style=\"stroke:var(--red)\"/><text x=\"414\" y=\"57\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">π<\/text><line x1=\"472\" y1=\"64\" x2=\"472\" y2=\"90\" fill=\"none\" style=\"stroke:var(--red)\"/><text x=\"472\" y=\"57\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">∛130<\/text><line x1=\"320\" y1=\"121\" x2=\"320\" y2=\"137\" fill=\"none\" style=\"stroke:var(--red)\"/><text x=\"320\" y=\"152\" text-anchor=\"middle\" style=\"fill:var(--red)\" font-size=\"12\">0 is neither positive nor negative<\/text><text x=\"14\" y=\"152\" style=\"fill:var(--red)\" font-size=\"12\">Negative infinity<\/text><text x=\"626\" y=\"152\" text-anchor=\"end\" style=\"fill:var(--red)\" font-size=\"12\">Positive infinity<\/text><\/svg>"},"ari-51":{"title":"Real Number Properties I","subj":"ari","page":51,"group":4,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Property 1<\/h4><div class=\"ps-f\">a + b = b + a<\/div><div class=\"ps-f\">ab = ba<\/div><p><span class=\"note\">Examples<\/span><\/p><div class=\"ps-f\">3 + 7 = 7 + 3<\/div><div class=\"ps-f\">(4)(3) = (3)(4)<\/div><\/div><div class=\"ps-col\"><h4>Property 2<\/h4><div class=\"ps-f\">(a + b) + c = a + (b + c)<\/div><div class=\"ps-f\">(ab)c = a(bc)<\/div><p><span class=\"note\">Examples<\/span><\/p><div class=\"ps-f\">(1 + 2) + 3 = 1 + (2 + 3)<\/div><div class=\"ps-f\">(3 · 2)4 = 3(2 · 4)<\/div><\/div><div class=\"ps-col\"><h4>Property 3<\/h4><div class=\"ps-f\">a(b + c)<\/div><div class=\"ps-f\">↓<\/div><div class=\"ps-f\">ab + ac<\/div><p><span class=\"note\">Examples<\/span><\/p><div class=\"ps-f\">3(4 + 11)<\/div><div class=\"ps-f\">↓<\/div><div class=\"ps-f\">(3)(4) + (3)(11)<\/div><\/div><div class=\"ps-col\"><h4>Property 4<\/h4><div class=\"ps-f\">a + 0 = a<\/div><div class=\"ps-f\">(a)(0) = 0<\/div><div class=\"ps-f\">(a)(1) = a<\/div><p><span class=\"note\">Examples<\/span><\/p><div class=\"ps-f\">3 + 0 = 3<\/div><div class=\"ps-f\">(5)(0) = 0<\/div><div class=\"ps-f\">(7)(1) = 7<\/div><\/div><\/div>","plain":"Property 1: you can swap the order when adding or multiplying. Property 2: you can regroup with brackets when adding or multiplying. Property 3: a number outside a bracket multiplies each term inside (distributing). Property 4: adding 0 or multiplying by 1 changes nothing, and multiplying by 0 always gives 0.","fun":"While the properties above seem simple, their expression via algebra didn’t happen until approximately the 16<sup>th<\/sup> century.","check":{"q":"Which expression is equal to <span class=\"m\">6(5 + 9)<\/span> by Property 3?","choices":["(6)(5) + 9","6 + (5)(9)","(6)(5) + (6)(9)","(6 + 5)(6 + 9)","(6)(5)(9)"],"a":"C · (6)(5) + (6)(9)","why":"The 6 multiplies each term inside the bracket: 6(5 + 9) = (6)(5) + (6)(9) = 30 + 54 = 84 = 6 × 14."}},"ari-52":{"title":"Real Number Properties II","subj":"ari","page":52,"group":4,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Property 5<\/h4><p><span class=\"note\">if<\/span><\/p><div class=\"ps-f\">ab = 0<\/div><p><span class=\"note\">three possibilities<\/span><\/p><ol class=\"ps-list\"><li><span class=\"m\">a = 0<\/span><\/li><li><span class=\"m\">b = 0<\/span><\/li><li><span class=\"m\">a, b = 0<\/span><\/li><\/ol><\/div><div class=\"ps-col\"><h4>Property 6<\/h4><div class=\"ps-f\"><span class=\"fr\"><span>a<\/span><span>0<\/span><\/span><\/div><p><span class=\"note\">never divide by zero<\/span><\/p><p><span class=\"note\">The world will explode<\/span><\/p><\/div><div class=\"ps-col\"><h4>Property 7<\/h4><p><span class=\"note\">if<\/span><\/p><div class=\"ps-f\">a &gt; 0<\/div><div class=\"ps-f\">b &gt; 0<\/div><p><span class=\"note\">then<\/span><\/p><div class=\"ps-f\">a + b &gt; 0<\/div><div class=\"ps-f\">ab &gt; 0<\/div><\/div><div class=\"ps-col\"><h4>Property 8<\/h4><p><span class=\"note\">if<\/span><\/p><div class=\"ps-f\">a &lt; 0<\/div><div class=\"ps-f\">b &lt; 0<\/div><p><span class=\"note\">then<\/span><\/p><div class=\"ps-f\">a + b &lt; 0<\/div><div class=\"ps-f\">ab &gt; 0<\/div><\/div><\/div>","plain":"Property 5: if a product is 0, at least one of the factors is 0 (maybe both). Property 6: dividing by zero is never allowed. Property 7: two positives add to a positive and multiply to a positive. Property 8: two negatives add to a negative, but multiply to a positive.","fun":"The world will not actually explode if you try to divide by zero.","check":{"q":"If <span class=\"m\">x &lt; 0<\/span> and <span class=\"m\">y &lt; 0<\/span>, which must be true?","choices":["x + y &gt; 0","xy &lt; 0","xy &gt; 0","x + y = 0","xy = 0"],"a":"C · xy &gt; 0","why":"Property 8: a negative times a negative is positive, so xy &gt; 0 (and x + y is negative)."}},"ari-53":{"title":"Real Number Properties III","subj":"ari","page":53,"group":4,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Property 9<\/h4><p><span class=\"note\">if<\/span><\/p><div class=\"ps-f\">a &gt; 0<\/div><div class=\"ps-f\">b &lt; 0<\/div><p><span class=\"note\">then<\/span><\/p><div class=\"ps-f\">ab &lt; 0<\/div><\/div><div class=\"ps-col\"><h4>Property 10<\/h4><div class=\"ps-f\">|a + b| ≤ |a| + |b|<\/div><p><span class=\"note\">Examples<\/span><\/p><div class=\"ps-f\">|3 + 7| = |3| + |7|<\/div><div class=\"ps-f\">|−2 + 4| &lt; |−2| + |4|<\/div><\/div><div class=\"ps-col\"><h4>Property 11<\/h4><div class=\"ps-f\">|a||b| = |ab|<\/div><p><span class=\"note\">Examples<\/span><\/p><div class=\"ps-f\">|2||3| = |2 · 3|<\/div><div class=\"ps-f\">|4||−2| = |4 · −2|<\/div><\/div><div class=\"ps-col\"><h4>Property 12<\/h4><p><span class=\"note\">if<\/span><\/p><div class=\"ps-f\">a &gt; 1<\/div><p><span class=\"note\">then<\/span><\/p><div class=\"ps-f\">a² &gt; a<\/div><p><span class=\"note\">if<\/span><\/p><div class=\"ps-f\">1 &gt; a &gt; 0<\/div><p><span class=\"note\">then<\/span><\/p><div class=\"ps-f\">a² &lt; a<\/div><\/div><\/div>","plain":"Property 9: a positive times a negative is negative. Property 10: the absolute value of a sum is at most the sum of the absolute values; it is smaller when the signs differ. Property 11: you can multiply first and then take the absolute value, or the other way round. Property 12: squaring a number bigger than 1 makes it bigger, but squaring a number between 0 and 1 makes it smaller — a favourite GRE trap.","fun":"While squaring a positive fraction less than one makes the number smaller, taking the square root makes the number bigger.","check":{"q":"If <span class=\"m\">0 &lt; x &lt; 1<\/span>, which is the greatest?","choices":["x³","x²","x","x⁴","they are all equal"],"a":"C · x","why":"For a number between 0 and 1, each extra power makes it smaller (try x = ½: ½ &gt; ¼ &gt; ⅛ &gt; 1/16), so x is the greatest."}},"ari-54":{"title":"Absolute Value","subj":"ari","page":54,"group":4,"body":"<div class=\"ps-f\">|a| = 3<\/div><p><span class=\"m\">a<\/span> values that are a <span class=\"hl\">distance of 3<\/span> away from 0 → <span class=\"m\">a = −3<\/span> or <span class=\"m\">a = 3<\/span><\/p><p>On the number line (−9 to 9), points are marked at −3, 0, 3 and 4.<\/p><p><span class=\"m\">a<\/span> values that are a <span class=\"hl\">distance of 2<\/span> away from 2 → <span class=\"m\">a = 0<\/span> or <span class=\"m\">a = 4<\/span><\/p><div class=\"ps-f\">|a − 2| = 2<\/div>","plain":"Absolute value means distance on the number line, and distance is never negative. |a| = 3 asks: which numbers are 3 steps from 0? Answer: −3 and 3. |a − 2| = 2 asks: which numbers are 2 steps from 2? Answer: 0 and 4. So read |a − c| = d as “a is d away from c”, which usually gives two answers.","fun":"The ever familiar “bars” of absolute value (|a|) were not introduced until the mid-19<sup>th<\/sup> century.","check":{"q":"Which values of <span class=\"m\">x<\/span> satisfy <span class=\"m\">|x − 5| = 3<\/span>?","choices":["−2 and 8","2 and 8","3 and 5","−8 and 2","8 only"],"a":"B · 2 and 8","why":"x must be 3 away from 5: 5 − 3 = 2 and 5 + 3 = 8."},"fig":"<svg viewBox=\"0 0 640 210\" xmlns=\"http://www.w3.org/2000/svg\"><text x=\"320\" y=\"24\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">a values a distance of 3 away from 0 (|a| = 3)<\/text><line x1=\"34\" y1=\"100\" x2=\"606\" y2=\"100\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2.5\"/><polygon points=\"24,100 38,93 38,107\" style=\"fill:var(--blue)\"/><polygon points=\"616,100 602,93 602,107\" style=\"fill:var(--blue)\"/><line x1=\"50\" y1=\"94\" x2=\"50\" y2=\"106\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"50\" y=\"125\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">−9<\/text><line x1=\"80\" y1=\"94\" x2=\"80\" y2=\"106\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text style=\"fill:var(--ink)\" font-size=\"13\">2<\/text><line x1=\"410\" y1=\"94\" x2=\"410\" y2=\"106\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"410\" y=\"125\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">3<\/text><line x1=\"440\" y1=\"94\" x2=\"440\" y2=\"106\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"440\" y=\"125\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">4<\/text><line x1=\"470\" y1=\"94\" x2=\"470\" y2=\"106\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"470\" y=\"125\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">5<\/text><line x1=\"500\" y1=\"94\" x2=\"500\" y2=\"106\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"500\" y=\"125\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">6<\/text><line x1=\"530\" y1=\"94\" x2=\"530\" y2=\"106\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"530\" y=\"125\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">7<\/text><line x1=\"560\" y1=\"94\" x2=\"560\" y2=\"106\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"560\" y=\"125\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">8<\/text><line x1=\"590\" y1=\"94\" x2=\"590\" y2=\"106\" fill=\"none\" style=\"stroke:var(--ink-3)\"/><text x=\"590\" y=\"125\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">9<\/text><circle cx=\"230\" cy=\"100\" r=\"5\" style=\"fill:var(--red)\"/><circle cx=\"320\" cy=\"100\" r=\"5\" style=\"fill:var(--red)\"/><circle cx=\"410\" cy=\"100\" r=\"5\" style=\"fill:var(--red)\"/><circle cx=\"440\" cy=\"100\" r=\"5\" style=\"fill:var(--red)\"/><line x1=\"230\" y1=\"36\" x2=\"230\" y2=\"86\" fill=\"none\" style=\"stroke:var(--green)\" stroke-width=\"1.5\"/><polygon points=\"230,92 225,82 235,82\" style=\"fill:var(--blue)\"/><line x1=\"410\" y1=\"36\" x2=\"410\" y2=\"86\" fill=\"none\" style=\"stroke:var(--green)\" stroke-width=\"1.5\"/><polygon points=\"410,92 405,82 415,82\" style=\"fill:var(--blue)\"/><line x1=\"320\" y1=\"140\" x2=\"320\" y2=\"182\" fill=\"none\" style=\"stroke:var(--green)\" stroke-width=\"1.5\"/><polygon points=\"320,134 315,144 325,144\" style=\"fill:var(--blue)\"/><line x1=\"440\" y1=\"140\" x2=\"440\" y2=\"182\" fill=\"none\" style=\"stroke:var(--green)\" stroke-width=\"1.5\"/><polygon points=\"440,134 435,144 445,144\" style=\"fill:var(--blue)\"/><text x=\"320\" y=\"198\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">a values a distance of 2 away from 2 (|a − 2| = 2)<\/text><\/svg>"},"ari-55":{"title":"Ratios","subj":"ari","page":55,"group":4,"body":"<p>Three Different Ways to Talk about Ratios<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><div class=\"ps-f\">a:b<\/div><p><span class=\"note\">Way 1<\/span><\/p><\/div><div class=\"ps-col\"><div class=\"ps-f\">a to b<\/div><p><span class=\"note\">Way 2<\/span><\/p><\/div><div class=\"ps-col\"><div class=\"ps-f\"><span class=\"fr\"><span>a<\/span><span>b<\/span><\/span><\/div><p><span class=\"note\">Way 3<\/span><\/p><\/div><\/div><div class=\"ps-cols\"><div class=\"ps-col\"><p><span class=\"note\">Don’t forget! Ratios give only relative quantities, not absolute ones.<\/span><\/p><\/div><div class=\"ps-col\"><p>Picture: 4 oranges and 3 apples<\/p><div class=\"ps-f\">4:3<\/div><p><span class=\"note\">oranges to apples<\/span><\/p><\/div><div class=\"ps-col\"><div class=\"ps-f\">oranges to apples = 2:3<\/div><p><span class=\"note\"><b>infinite<\/b> cases<\/span><\/p><ul class=\"ps-list\"><li>2 oranges, 3 apples<\/li><li>4 oranges, 6 apples<\/li><li>6 oranges, 9 apples<\/li><\/ul><p><span class=\"note\">etc.<\/span><\/p><\/div><\/div>","plain":"A ratio compares two amounts and can be written a:b, “a to b”, or a/b. It tells you the relationship, not the actual counts: a 2:3 ratio of oranges to apples could be 2 and 3, 4 and 6, 6 and 9, and so on. On the GRE, never assume the ratio numbers are the real totals.","fun":"The ratio of men to women on planet Earth is 101.68 to 100.","check":{"q":"The ratio of red marbles to blue marbles in a bag is 2:5. Which could be the actual numbers of red and blue marbles?","choices":["5 red, 2 blue","4 red, 7 blue","6 red, 15 blue","10 red, 20 blue","3 red, 5 blue"],"a":"C · 6 red, 15 blue","why":"6:15 divides down (by 3) to 2:5. The others reduce to different ratios."}},"ari-56":{"title":"Proportions","subj":"ari","page":56,"group":4,"body":"<p class=\"ps-def\"><b>Definition:<\/b> An equation involving two ratios.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><div class=\"ps-f\"><span class=\"fr\"><span>a<\/span><span>b<\/span><\/span> = <span class=\"fr\"><span>c<\/span><span>d<\/span><\/span><\/div><\/div><div class=\"ps-col\"><h4>Cross Multiplication<\/h4><div class=\"ps-f\"><span class=\"fr\"><span>a<\/span><span>b<\/span><\/span> = <span class=\"fr\"><span>c<\/span><span>d<\/span><\/span><\/div><p><span class=\"note\">red X: multiply a × d and c × b (across the equals sign)<\/span><\/p><div class=\"ps-f\"><span class=\"ok\">ad = bc<\/span><\/div><\/div><\/div>","plain":"A proportion says two ratios are equal, like a/b = c/d. To solve one, cross multiply: top-left times bottom-right equals bottom-left times top-right, so ad = bc. This turns a fraction equation into a simple one you can solve for the missing number.","fun":"While cross multiplication seems like a “cool trick,” it is merely basic <span class=\"note\">(sentence cut off on slide)<\/span>","check":{"q":"If <span class=\"m\"><span class=\"fr\"><span>x<\/span><span>6<\/span><\/span> = <span class=\"fr\"><span>10<\/span><span>15<\/span><\/span><\/span>, what is <span class=\"m\">x<\/span>?","choices":["2.5","4","5","9","25"],"a":"B · 4","why":"Cross multiply: 15x = 6 × 10 = 60, so x = 60 ÷ 15 = 4."}},"ari-57":{"title":"Percents","subj":"ari","page":57,"group":4,"body":"<p class=\"ps-def\"><b>Definition:<\/b> a ratio that means “parts per 100”<\/p><p>Picture: 100 people in 5 rows of 20; 37 of them are coloured red (the whole first row and 17 of the second row), the other 63 are black.<\/p><div class=\"ps-f\">37% of people are depressed<\/div>","plain":"“Percent” means “out of 100”. 37% means 37 out of every 100. So a percent is just a ratio with 100 on the bottom: 37% = 37/100 = 0.37.","fun":"If you’re referring to <span class=\"m\">n<\/span>% of people, and <span class=\"m\">n<\/span> is a prime number greater than 5, then the total number of people MUST be a multiple of 100.","check":{"q":"In a class of 50 students, 18 wear glasses. What percent wear glasses?","choices":["18%","32%","36%","50%","64%"],"a":"C · 36%","why":"18 out of 50 is the same as 36 out of 100 (multiply top and bottom by 2), which is 36%."}},"ari-58":{"title":"Percent Increase/Decrease","subj":"ari","page":58,"group":4,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Percent Increase Formula<\/h4><div class=\"ps-f\"><span class=\"fr\"><span>|difference|<\/span><span>smaller number<\/span><\/span><\/div><p>There used to be 12 students. Now there are 17.<\/p><div class=\"ps-f\"><span class=\"fr\"><span>5<\/span><span>12<\/span><\/span> ≈ 41.7%<\/div><\/div><div class=\"ps-col\"><h4>Percent Decrease Formula<\/h4><div class=\"ps-f\"><span class=\"fr\"><span>|difference|<\/span><span>larger number<\/span><\/span><\/div><p>The lamp used to be $85. Now it’s $60.<\/p><div class=\"ps-f\"><span class=\"fr\"><span>25<\/span><span>85<\/span><\/span> ≈ 29.4%<\/div><\/div><\/div>","plain":"Percent change = how much it changed ÷ the starting amount. For an increase the starting amount is the smaller number; for a decrease it is the larger number. Then turn the fraction into a percent (multiply by 100).","fun":"Since 1990, cigarette smoking has declined 27% for men and 38% for women.","check":{"q":"A jacket’s price drops from $80 to $60. What is the percent decrease?","choices":["20%","25%","33⅓%","40%","75%"],"a":"B · 25%","why":"Difference = 20. For a decrease divide by the larger (original) number: 20/80 = 0.25 = 25%."}},"ari-59":{"title":"More Percent Stuff","subj":"ari","page":59,"group":4,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Quick Calculations<\/h4><p><span class=\"note\">30% more than a<\/span><\/p><div class=\"ps-f\">1.3a<\/div><p><span class=\"note\">30% less than a<\/span><\/p><div class=\"ps-f\">0.7a<\/div><\/div><div class=\"ps-col\"><h4>% greater than 100<\/h4><p><span class=\"note\">There used to be 15 students. Now there are 100.<\/span><\/p><div class=\"ps-f\"><span class=\"fr\"><span>|difference|<\/span><span>smaller number<\/span><\/span><\/div><div class=\"ps-f\"><span class=\"fr\"><span>85<\/span><span>15<\/span><\/span> ≈ 567%<\/div><\/div><div class=\"ps-col\"><h4>% <span class=\"hl\">of<\/span> vs % <span class=\"hl\">more<\/span><\/h4><p><span class=\"note\">b is 200% of a<\/span><\/p><div class=\"ps-f\">b = 2a<\/div><p><span class=\"note\">b is 200% more than a<\/span><\/p><div class=\"ps-f\">b = 3a<\/div><\/div><\/div>","plain":"Shortcut: “30% more than a” is 1.3a and “30% less than a” is 0.7a — one multiplication does the whole job. A percent increase can be more than 100% when the amount more than doubles. Careful with wording: “200% <b>of<\/b> a” means 2a, but “200% <b>more than<\/b> a” means a + 2a = 3a.","fun":"In 1900, the price of a dozen eggs was approximately $0.23. The price today—let’s say $3—is about 1300% of the old price.","check":{"q":"If <span class=\"m\">x<\/span> is 300% <b>more than<\/b> <span class=\"m\">y<\/span>, then <span class=\"m\">x<\/span> equals","choices":["0.3y","1.3y","3y","4y","300y"],"a":"D · 4y","why":"“300% more than y” means y plus 3y, so x = 4y. (300% <i>of<\/i> y would be 3y.)"}},"ari-60":{"title":"Fraction/Decimal/Ratio/Percent","subj":"ari","page":60,"group":4,"body":"<div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><th>Fraction<\/th><th>Decimal<\/th><th>Ratio<\/th><th>Percent<\/th><\/tr><tr><td><span class=\"fr\"><span>1<\/span><span>2<\/span><\/span><\/td><td>0.50<\/td><td>1:2<\/td><td>50%<\/td><\/tr><tr><td><span class=\"fr\"><span>3<\/span><span>4<\/span><\/span><\/td><td>0.75<\/td><td>3:4<\/td><td>75%<\/td><\/tr><tr><td><span class=\"fr\"><span>7<\/span><span>5<\/span><\/span><\/td><td>1.4<\/td><td>7:5<\/td><td>140%<\/td><\/tr><\/table><\/div><p>Each row: Fraction → Decimal → Ratio → Percent (same value, four ways).<\/p>","plain":"A fraction, a decimal, a ratio and a percent can all describe the same amount. Fraction → decimal: divide top by bottom. Decimal → percent: multiply by 100. Fraction → ratio: top:bottom. Being able to switch between them quickly saves time on the GRE.","fun":"Each type of number has its advantages; fractions are better than repeating decimals; decimals are good for calculators and irrational numbers; percents are intuitive; ratios are good at showing relationships. You get the idea.","check":{"q":"Which shows <span class=\"m\"><span class=\"fr\"><span>3<\/span><span>8<\/span><\/span><\/span> correctly as a decimal and a percent?","choices":["0.38 and 38%","0.375 and 37.5%","0.83 and 83%","2.67 and 267%","0.3 and 3%"],"a":"B · 0.375 and 37.5%","why":"3 ÷ 8 = 0.375, and 0.375 × 100 = 37.5%."}},"cg-1":{"title":"The xy-coordinate Plane","subj":"cg","page":1,"group":7,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>What is it?<\/h4><p>The <span class=\"m\">xy<\/span>-coordinate plane was invented by mathematician René Descartes in 1637. The genius of the plane is it combines two previously separate fields: algebra and geometry. It is essentially a bridge between these two domains.<\/p><\/div><div class=\"ps-col\"><ul class=\"ps-list\"><li><span class=\"m\">y<\/span>-axis (vertical) and <span class=\"m\">x<\/span>-axis (horizontal)<\/li><li>origin <span class=\"m\">(0, 0)<\/span><\/li><li>a point, named by its coordinates, e.g. <span class=\"m\">(−5, −2)<\/span><\/li><li>Quadrant I (upper right), Quadrant II (upper left), Quadrant III (lower left), Quadrant IV (lower right)<\/li><\/ul><\/div><\/div>","plain":"<p>The plane is two number lines that cross at the origin, <span class=\"m\">(0, 0)<\/span>. Every point has an address written as <span class=\"m\">(x, y)<\/span>: first how far left or right, then how far up or down. The two axes cut the plane into four quadrants, numbered I to IV going counter-clockwise from the upper right.<\/p>","fun":"The <span class=\"m\">xy<\/span>-coordinate plane is also called the Cartesian coordinate system in honor of René Descartes.","check":{"q":"In which quadrant is the point <span class=\"m\">(4, −7)<\/span>?","choices":["Quadrant I","Quadrant II","Quadrant III","Quadrant IV","It lies on an axis"],"a":"D · Quadrant IV","why":"<span class=\"m\">x = 4<\/span> is positive (go right) and <span class=\"m\">y = −7<\/span> is negative (go down). Right and down is the lower-right quadrant, Quadrant IV."},"fig":"<svg viewBox=\"0 0 440 340\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"54.8\" y1=\"170\" x2=\"345.2\" y2=\"170\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"339,166.7 345.2,170 339,173.3\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"200\" y1=\"319.6\" x2=\"200\" y2=\"20.4\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"196.7,26.6 200,20.4 203.3,26.6\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"222\" y1=\"166\" x2=\"222\" y2=\"174\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"244\" y1=\"166\" x2=\"244\" y2=\"174\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"266\" y1=\"166\" x2=\"266\" y2=\"174\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"288\" y1=\"166\" x2=\"288\" y2=\"174\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"310\" y1=\"166\" x2=\"310\" y2=\"174\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"332\" y1=\"166\" x2=\"332\" y2=\"174\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"178\" y1=\"166\" x2=\"178\" y2=\"174\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"156\" y1=\"166\" x2=\"156\" y2=\"174\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"134\" y1=\"166\" x2=\"134\" y2=\"174\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"112\" y1=\"166\" x2=\"112\" y2=\"174\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"90\" y1=\"166\" x2=\"90\" y2=\"174\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"68\" y1=\"166\" x2=\"68\" y2=\"174\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"196\" y1=\"148\" x2=\"204\" y2=\"148\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"196\" y1=\"126\" x2=\"204\" y2=\"126\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"196\" y1=\"104\" x2=\"204\" y2=\"104\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"196\" y1=\"82\" x2=\"204\" y2=\"82\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"196\" y1=\"60\" x2=\"204\" y2=\"60\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"196\" y1=\"38\" x2=\"204\" y2=\"38\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"196\" y1=\"192\" x2=\"204\" y2=\"192\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"196\" y1=\"214\" x2=\"204\" y2=\"214\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"196\" y1=\"236\" x2=\"204\" y2=\"236\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"196\" y1=\"258\" x2=\"204\" y2=\"258\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"196\" y1=\"280\" x2=\"204\" y2=\"280\" fi  the origin: <span class=\"m\">(−a, −b)<\/span> is also on it.<\/p>","fun":"Equations that result in a sideways parabola (like the red one above) have a <span class=\"m\">y²<\/span> rather than an <span class=\"m\">x²<\/span> term.","check":{"q":"A graph is symmetric about the <span class=\"m\">y<\/span>-axis and contains the point <span class=\"m\">(2, 3)<\/span>. Which point must also be on the graph?","choices":["<span class=\"m\">(2, −3)<\/span>","<span class=\"m\">(−2, 3)<\/span>","<span class=\"m\">(−2, −3)<\/span>","<span class=\"m\">(3, 2)<\/span>"],"a":"B · (−2, 3)","why":"Symmetry about the <span class=\"m\">y<\/span>-axis mirrors left and right, so <span class=\"m\">x<\/span> changes sign and <span class=\"m\">y<\/span> stays: <span class=\"m\">(2, 3)<\/span> → <span class=\"m\">(−2, 3)<\/span>."},"fig":"<svg viewBox=\"0 0 600 200\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"16\" y1=\"106.8\" x2=\"184\" y2=\"106.8\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"177.8,103.5 184,106.8 177.8,110.1\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><line x1=\"100\" y1=\"183.6\" x2=\"100\" y2=\"30\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"96.7,36.2 100,30 103.3,36.2\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><text x=\"100\" y=\"18\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">about the y-axis<\/text><line x1=\"216\" y1=\"106.8\" x2=\"384\" y2=\"106.8\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"377.8,103.5 384,106.8 377.8,110.1\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><line x1=\"300\" y1=\"183.6\" x2=\"300\" y2=\"30\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"296.7,36.2 300,30 303.3,36.2\" fill=\"none\" style=\"stroke:var(--ink)\" stroke (--ink)\" stroke-width=\"1.2\"/><line x1=\"206\" y1=\"90\" x2=\"214\" y2=\"90\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"206\" y1=\"62\" x2=\"214\" y2=\"62\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"206\" y1=\"34\" x2=\"214\" y2=\"34\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"206\" y1=\"230\" x2=\"214\" y2=\"230\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><text x=\"390.8\" y=\"193\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">x<\/text><text x=\"218\" y=\"30\" font-style=\"italic\" style=\"fill:var(--ink)\" font-size=\"14\">y<\/text><line x1=\"70\" y1=\"146\" x2=\"266\" y2=\"146\" fill=\"none\" style=\"stroke:var(--green)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><line x1=\"266\" y1=\"146\" x2=\"266\" y2=\"62\" fill=\"none\" style=\"stroke:var(--green)\" stroke-width=\"1.3\" stroke-dasharray=\"5 4\"/><polyline points=\"257,146 257,137 266,137\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.1\" stroke-linejoin=\"round\"/><line x1=\"70\" y1=\"146\" x2=\"266\" y2=\"62\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\"/><circle cx=\"70\" cy=\"146\" r=\"4.5\" style=\"fill:var(--blue)\"/><circle cx=\"266\" cy=\"62\" r=\"4.5\" style=\"fill:var(--blue)\"/><text x=\"70\" y=\"134\" text-anchor=\"middle\" style=\"fill:var(--red)\" font-size=\"13\">(−5, 2)<\/text><text x=\"276\" y=\"66\" style=\"fill:var(--red)\" font-size=\"13\">(2, 5)<\/text><text x=\"162\" y=\"96\" font-style=\"italic\" style=\"fill:var(--blue)\" font-size=\"15\">c<\/text><text x=\"168\" y=\"164\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"15\">7<\/text><text x=\"274\" y=\"109\" style=\"fill:var(--ink)\" font-size=\"15\">3<\/text><\/svg>"},"cg-6":{"title":"Lines and Intercepts","subj":"cg","page":6,"group":7,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><ul class=\"ps-list\"><li><span class=\"hl\">y-intercept<\/span> <span class=\"m\">(0, 5)<\/span><\/li><li><span class=\"hl\">x-intercept<\/span> <span class=\"m\">(−5, 0)<\/span><\/li><li><span class=\"note\">two x-intercepts!<\/span> (the parabola crosses the <span class=\"m\">x<\/span>-axis twice)<\/li><\/ul><\/div><div class=\"ps-col\"><h4>Cool Stuff<\/h4><ul class=\"ps-list\"><li>An intercept can be referred to as coordinates, such as <span class=\"m\">(0, 5)<\/span>, or simply as a number, such as <span class=\"m\">5<\/span>.<\/li><li>The <span class=\"m\">x<\/span> and <span class=\"m\">y<\/span> intercepts of a line through the origin are simply <span class=\"m\">0<\/span> and <span class=\"m\">0<\/span>.<\/li><li>A horizontal line (like <span class=\"m\">y = 3<\/span>) has a <span class=\"m\">y<\/span>-intercept but not an <span class=\"m\">x<\/span>-intercept.<\/li><li>A vertical line (like <span class=\"m\">x = 1<\/span>) has an <span class=\"m\">x<\/span>-intercept but not a <span class=\"m\">y<\/span>-intercept.<\/li><li>If the product of a line’s <span class=\"m\">x<\/span> and <span class=\"m\">y<\/span> intercepts is negative, the slope is positive; if the product is positive, the slope is negative.<\/li><li>The <span class=\"m\">x<\/span>-intercept(s) of an equation is/are the <span class=\"m\">x<\/span> value(s) that make the equation equal to zero. For example, the <span class=\"m\">x<\/span>-intercepts of <span class=\"m\">y = (x − 3)(x + 4)<\/span> are <span class=\"m\">3<\/span> and <span class=\"m\">−4<\/span>.<\/li><li>To find the <span class=\"m\">y<\/span>-intercept of an equation, simply set <span class=\"m\">x<\/span> equal to <span class=\"m\">0<\/span>.<\/li><\/ul><\/div><\/div>","plain":"<p>An intercept is where a graph crosses an axis. The <span class=\"m\">y<\/span>-intercept is where <span class=\"m\">x = 0<\/span>; the <span class=\"m\">x<\/span>-intercept is where <span class=\"m\">y = 0<\/span>. So to find one, set the other letter to zero and solve.<\/p>","fun":"It’s possible to create as many <span class=\"m\">x<\/span> intercepts as you like. For example, <span class=\"m\">y = (x − 2)(x − 1)x(x + 1)(x + 2)<\/span> has <span class=\"hl\">five<\/span>!","check":{"q":"What is the <span class=\"m\">x<\/span>-intercept of the line <span class=\"m\">y = 2x − 8<\/span>?","choices":["<span class=\"m\">−8<\/span>","<span class=\"m\">−4<\/span>","<span class=\"m\">4<\/span>","<span class=\"m\">8<\/span>"],"a":"C · 4","why":"Set <span class=\"m\">y = 0<\/span>: <span class=\"m\">0 = 2x − 8<\/span>, so <span class=\"m\">2x = 8<\/span> and <span class=\"m\">x = 4<\/span>. The line crosses the <span class=\"m\">x<\/span>-axis at <span class=\"m\">(4, 0)<\/span>."},"fig":"<svg viewBox=\"0 0 440 340\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"84.8\" y1=\"170\" x2=\"375.2\" y2=\"170\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"369,166.7 375.2,170 369,173.3\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"230\" y1=\"319.6\" x2=\"230\" y2=\"20.4\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"226.7,26.6 230,20.4 233.3,26.6\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"252\" y1=\"166\" x2=\"252\" y2=\"174\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"274\" y1=\"166\" x2=\"274\" y2=\"174\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"296\" y1=\"166\" x2=\"296\" y2=\"174\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"318\" y1=\"166\" x2=\"318\" y2=\"174\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"340\" y1=\"166\" x2=\"340\" y2=\"174\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"362\" y1=\"166\" x2=\"362\" y2=\"174\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"208\" y1=\"166\" x2=\"208\" y2=\" in <span class=\"m\">x<\/span><\/li><li>steepness<\/li><li>gradient<\/li><\/ul><\/div><div class=\"ps-col\"><h4>On the graph<\/h4><ul class=\"ps-list\"><li>a horizontal line: <b>slope = 0<\/b><\/li><li>a vertical line: <b>undefined slope<\/b><\/li><li>a line going up to the right: <b>positive slope<\/b><\/li><li>a line going down to the right: <b>negative slope<\/b><\/li><\/ul><div class=\"ps-ex\"><div class=\"ps-ex-h\">Example<\/div><p>The line through <span class=\"m\">(−6, −4)<\/span> and <span class=\"m\">(1, −2)<\/span>:<\/p><div class=\"ps-f\"><span class=\"fr\"><span>−2 − (−4)<\/span><span>1 − (−6)<\/span><\/span> = <span class=\"fr\"><span>2<\/span><span>7<\/span><\/span><\/div><\/div><\/div><\/div>","plain":"<p>Slope tells you how steep a line is. Pick two points, then divide the change in <span class=\"m\">y<\/span> (rise) by the change in <span class=\"m\">x<\/span> (run). Keep the same order on top and bottom. Flat lines have slope 0; vertical lines have no slope (undefined).<\/p>","fun":"You will sometimes see the slope of a vertical line referred to as an “infinite” slope.","check":{"q":"What is the slope of the line through <span class=\"m\">(2, 1)<\/span> and <span class=\"m\">(5, 10)<\/span>?","a":"3","why":"Slope <span class=\"m\">= (10 − 1) ÷ (5 − 2) = 9 ÷ 3 = 3<\/span>."},"fig":"<svg viewBox=\"0 0 440 340\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"74.8\" y1=\"170\" x2=\"365.2\" y2=\"170\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"359,166.7 365.2,170 359,173.3\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"220\" y1=\"319.6\" x2=\"220\" y2=\"20.4\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"216.7,26.6 220,20.4 223.3,26.6\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"242\" y1=\"166\" x2=\"242\" y2=\"174\" fill=\"none\" style=\"stroke:var(--ink)\" strok :var(--blue)\" stroke-width=\"2\"/><polyline points=\"149.9,146.1 143,144.7 148,139.8\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"290.1,97.1 297,98.5 292,103.4\" fill=\"none\" style=\"stroke:var(--blue)\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"303.2\" y=\"96.5\" style=\"fill:var(--blue)\" font-size=\"13\">positive slope<\/text><line x1=\"132\" y1=\"99.6\" x2=\"319\" y2=\"155.7\" fill=\"none\" style=\"stroke:var(--red)\" stroke-width=\"2\"/><polyline points=\"137,104.5 132,99.6 138.9,98.2\" fill=\"none\" style=\"stroke:var(--red)\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"314,150.8 319,155.7 312.1,157.1\" fill=\"none\" style=\"stroke:var(--red)\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"303.2\" y=\"136.8\" style=\"fill:var(--red)\" font-size=\"13\">negative slope<\/text><line x1=\"81.4\" y1=\"259.9\" x2=\"299.2\" y2=\"197.7\" fill=\"none\" style=\"stroke:var(--amber)\" stroke-width=\"2\"/><polyline points=\"88.2,261.3 81.4,259.9 86.4,255\" fill=\"none\" style=\"stroke:var(--amber)\" stroke-width=\"2\" stroke-linejoin=\"round\"/><polyline points=\"292.4,196.2 299.2,197.7 294.2,202.5\" fill=\"none\" style=\"stroke:var(--amber)\" stroke-width=\"2\" stroke-linejoin=\"round\"/><circle cx=\"242\" cy=\"214\" r=\"4.5\" style=\"fill:var(--blue)\"/><circle cx=\"88\" cy=\"258\" r=\"4.5\" style=\"fill:var(--blue)\"/><text x=\"246\" y=\"234\" style=\"fill:var(--ink)\" font-size=\"13\">(1, −2)<\/text><text x=\"88\" y=\"280\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"13\">(−6, −4)<\/text><\/svg>"},"cg-8":{"title":"A Very Special Slope","subj":"cg","page":8,"group":7,"body":"<h4>What is special?<\/h4><p>A line that passes through the origin with a slope of 1<\/p><h4>Why is it special?<\/h4><p>The line is a “boundary” of sorts. In quadrant I, for any point above the line, <span class=\"m\">y > x<\/span>. For any point below the line, <span class=\"m\">x > y<\/span>. Many GRE problems hinge on this property.<\/p><p>On the graph: <span class=\"hl\">slope = 1<\/span>, the line is <span class=\"m\">y = x<\/span>; the points above it are labelled <span class=\"m\">y > x<\/span> and the points below it <span class=\"m\">x > y<\/span>.<\/p>","plain":"<p>The line <span class=\"m\">y = x<\/span> goes through every point whose two coordinates are equal, like <span class=\"m\">(2, 2)<\/span> or <span class=\"m\">(5, 5)<\/span>. Any point above that line has <span class=\"m\">y<\/span> bigger than <span class=\"m\">x<\/span>; any point below it has <span class=\"m\">x<\/span> bigger than <span class=\"m\">y<\/span>. GRE comparison questions often test this.<\/p>","fun":"ETS loves “boundary” cases such as these. If you go above the boundary, things change. If you go below the boundary, things change again.","check":{"q":"Where is the point <span class=\"m\">(3, 7)<\/span> compared with the line <span class=\"m\">y = x<\/span>?","choices":["above the line","below the line","on the line","cannot be determined"],"a":"A · above the line","why":"Here <span class=\"m\">y = 7<\/span> and <span class=\"m\">x = 3<\/span>, so <span class=\"m\">y > x<\/span>. Points with <span class=\"m\">y > x<\/span> sit above the line <span class=\"m\">y = x<\/span>."},"fig":"<svg viewBox=\"0 0 440 340\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"74.8\" y1=\"170\" x2=\"365.2\" y2=\"170\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"359,166.7 365.2,170 359,173.3\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"220\" y1=\"319.6\" x2=\"220\" y2=\"20.4\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"216.7,26.6 220,20.4 223.3,26.6\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"242\" y1=\"166\" x2=\"242\" y2=\"174\" fill=\"none\" style=\"stroke:var(--ink)\" strok " cy=\"134.8\" r=\"4.5\" style=\"fill:var(--blue)\"/><circle cx=\"264\" cy=\"139.2\" r=\"4.5\" style=\"fill:var(--blue)\"/><circle cx=\"277.2\" cy=\"156.8\" r=\"4.5\" style=\"fill:var(--blue)\"/><text x=\"255.2\" y=\"64.4\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-size=\"14\">y &gt; x<\/text><text x=\"330\" y=\"130.4\" style=\"fill:var(--blue)\" font-size=\"14\">x &gt; y<\/text><text x=\"123.2\" y=\"209.6\" text-anchor=\"middle\" style=\"fill:var(--red)\" font-size=\"14\">slope = 1<\/text><text x=\"176\" y=\"251.4\" style=\"fill:var(--blue)\" font-size=\"14\">y = x<\/text><\/svg>"},"cg-9":{"title":"y = mx+b","subj":"cg","page":9,"group":7,"body":"<p class=\"ps-def\"><b>Pro tip:<\/b> If you can, put a linear equation in the form of <span class=\"m\">y = mx + b<\/span>. It gives you a TON of information.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><div class=\"ps-f\">y = mx + b<\/div><ul class=\"ps-list\"><li><span class=\"m\">y<\/span> → <span class=\"note\">y coordinate<\/span><\/li><li><span class=\"m\">m<\/span> → <span class=\"note\">slope<\/span><\/li><li><span class=\"m\">x<\/span> → <span class=\"note\">x coordinate<\/span><\/li><li><span class=\"m\">b<\/span> → <span class=\"note\">y-intercept<\/span><\/li><\/ul><h4>What about the <span class=\"m\">x<\/span>-intercept?<\/h4><p>Simply set <span class=\"m\">y<\/span> to zero and solve for <span class=\"m\">x<\/span><\/p><\/div><div class=\"ps-col\"><div class=\"ps-ex\"><div class=\"ps-ex-h\">Example<\/div><p>original equation<\/p><div class=\"ps-f\">−5x + 3y = 6<\/div><p><span class=\"m\">y = mx + b<\/span> form<\/p><div class=\"ps-f\">y = <span class=\"fr\"><span>5<\/span><span>3<\/span><\/span>x + 2<\/div><p><span class=\"hl\">Slope = <span class=\"fr\"><span>5<\/span><span>3<\/span><\/span><\/span><\/p><p><span class=\"hl\"><span class=\"m\">y<\/span>-intercept = 2<\/span><\/p><\/div><\/div><\/div>","plain":"<p>Get <span class=\"m\">y<\/span> alone on one side. Then the number in front of <span class=\"m\">x<\/span> is the slope (<span class=\"m\">m<\/span>) and the number added at the end is the <span class=\"m\">y<\/span>-intercept (<span class=\"m\">b<\/span>). This is the fastest way to read a line’s information on the GRE.<\/p>","fun":"The <span class=\"m\">y = mx + b<\/span> formula is sometimes referred to as “slope-intercept form.”","check":{"q":"What is the slope of the line <span class=\"m\">4x + 2y = 10<\/span>?","choices":["<span class=\"m\">−4<\/span>","<span class=\"m\">−2<\/span>","<span class=\"m\">2<\/span>","<span class=\"m\">5<\/span>"],"a":"B · −2","why":"Solve for <span class=\"m\">y<\/span>: <span class=\"m\">2y = −4x + 10<\/span>, so <span class=\"m\">y = −2x + 5<\/span>. The number in front of <span class=\"m\">x<\/span> is <span class=\"m\">−2<\/span>."}},"cg-10":{"title":"Parallel / Perpendicular","subj":"cg","page":10,"group":7,"body":"<div class=\"ps-cols\"><div class=\"ps-col\"><h4>Parallel<\/h4><ul class=\"ps-list\"><li><span class=\"hl\">same slope<\/span><\/li><li><span class=\"hl\">different intercepts<\/span><\/li><\/ul><\/div><div class=\"ps-col\"><h4>Perpendicular<\/h4><ul class=\"ps-list\"><li><span class=\"note\">slopes are negative reciprocals<\/span><\/li><li>slope 1 <span class=\"m\">= x<\/span><\/li><li>slope 2 <span class=\"m\">= −<span class=\"fr\"><span>1<\/span><span>x<\/span><\/span><\/span><\/li><li>the lines meet at 90°<\/li><\/ul><\/div><\/div>","plain":"<p>Parallel lines never meet, so they rise at the same rate: same slope, different intercepts. Perpendicular lines meet at a right angle (90°). Their slopes are negative reciprocals: flip the fraction and change the sign. For example, <span class=\"m\">2<\/span> and <span class=\"m\">−<span class=\"fr\"><span>1<\/span><span>2<\/span><\/span><\/span>.<\/p>","fun":"Perpendicular lines <b>always<\/b> intersect and it’s possible for that intersection to occur at either the <span class=\"m\">x<\/span> or <span class=\"m\">y<\/span> intercept, but not both.","check":{"q":"A line has slope <span class=\"m\"><span class=\"fr\"><span>3<\/span><span>4<\/span><\/span><\/span>. What is the slope of a line perpendicular to it?","choices":["<span class=\"m\"><span class=\"fr\"><span>3<\/span><span>4<\/span><\/span><\/span>","<span class=\"m\">−<span class=\"fr\"><span>3<\/span><span>4<\/span><\/span><\/span>","<span class=\"m\"><span class=\"fr\"><span>4<\/span><span>3<\/span><\/span><\/span>","<span class=\"m\">−<span class=\"fr\"><span>4<\/span><span>3<\/span><\/span><\/span>"],"a":"D · <span class=\"m\">−<span class=\"fr\"><span>4<\/span><span>3<\/span><\/span><\/span>","why":"Flip <span class=\"m\"><span class=\"fr\"><span>3<\/span><span>4<\/span><\/span><\/span> to get <span class=\"m\"><span class=\"fr\"><span>4<\/span><span>3<\/span><\/span><\/span>, then change the sign: <span class=\"m\">−<span class=\"fr\"><span>4<\/span><span>3<\/span><\/span><\/span>."},"fig":"<svg viewBox=\"0 0 600 290\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"33\" y1=\"145\" x2=\"267\" y2=\"145\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"260.8,141.7 267,145 260.8,148.3\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"150\" y1=\"264.6\" x2=\"150\" y2=\"25.4\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"146.7,31.6 150,25.4 153.3,31.6\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"176\" y1=\"141\" x2=\"176\" y2=\"149\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"202\" y1=\"141\" x2=\"202\" y2=\"149\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"228\" y1=\"141\" x2=\"228\" y2=\"149\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"254\" y1=\"141\" x2=\"254\" y2=\"149\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"124\" y1=\"141\" x2=\"124\" arabolas on the <span class=\"m\">xy<\/span>-coordinate plane<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><h4>Two <span class=\"m\">x<\/span> intercepts<\/h4><p><span class=\"hl\">Example:<\/span> <span class=\"m\">y = x² − 4<\/span><\/p><\/div><div class=\"ps-col\"><h4>One <span class=\"m\">x<\/span> intercept<\/h4><p><span class=\"hl\">Example:<\/span> <span class=\"m\">y = x²<\/span><\/p><\/div><div class=\"ps-col\"><h4>Zero <span class=\"m\">x<\/span> intercepts<\/h4><p><span class=\"hl\">Example:<\/span> <span class=\"m\">y = x² + 2<\/span><\/p><\/div><\/div>","plain":"<p>Every quadratic (<span class=\"m\">x²<\/span> equation) graphs as a U-shaped parabola. It can cross the <span class=\"m\">x<\/span>-axis twice, touch it once, or miss it completely. Each crossing is a solution of the equation when <span class=\"m\">y = 0<\/span>.<\/p>","fun":"A quadratic equation with zero <span class=\"m\">x<\/span> intercepts has a negative discriminant and thus no valid solutions.","check":{"q":"How many <span class=\"m\">x<\/span>-intercepts does <span class=\"m\">y = x² + 5<\/span> have?","choices":["0","1","2","3"],"a":"A · 0","why":"Set <span class=\"m\">y = 0<\/span>: <span class=\"m\">x² = −5<\/span>. No number squared is negative, so the parabola never touches the <span class=\"m\">x<\/span>-axis."},"fig":"<svg viewBox=\"0 0 600 210\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"24.4\" y1=\"105.6\" x2=\"175.6\" y2=\"105.6\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"169.4,102.3 175.6,105.6 169.4,108.9\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><line x1=\"100\" y1=\"188.4\" x2=\"100\" y2=\"30\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\"/><polyline points=\"96.7,36.2 100,30 103.3,36.2\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><text x=\"100\" y=\"18\" text-anchor=\"middle\" style=\"fill:var(--ink)\" font-s ne\" style=\"stroke:var(--blue)\" stroke-width=\"2\" stroke-linejoin=\"round\"/><circle cx=\"64\" cy=\"105.6\" r=\"6\" style=\"fill:none;stroke:var(--red)\" stroke-width=\"1.4\"/><circle cx=\"136\" cy=\"105.6\" r=\"6\" style=\"fill:none;stroke:var(--red)\" stroke-width=\"1.4\"/><circle cx=\"300\" cy=\"105.6\" r=\"6\" style=\"fill:none;stroke:var(--red)\" stroke-width=\"1.4\"/><\/svg>"},"cg-15":{"title":"Graphing by Factoring","subj":"cg","page":15,"group":7,"body":"<p class=\"ps-def\"><b>Pro tip:<\/b> Quadratic equations that can be factored can be easily graphed.<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><p class=\"ps-step\"><b>Step 1:<\/b> If possible, factor the quadratic.<\/p><p class=\"ps-step\"><b>Step 2:<\/b> Find the two <span class=\"m\">x<\/span> values that make the equation equal to zero.<\/p><p class=\"ps-step\"><b>Step 3:<\/b> Graph those two <span class=\"m\">x<\/span> values as the <span class=\"m\">x<\/span> intercepts.<\/p><p class=\"ps-step\"><b>Step 4:<\/b> The <span class=\"m\">x<\/span> value halfway between the intercepts is where the minimum <span class=\"m\">y<\/span> value is. Calculate it.<\/p><p class=\"ps-step\"><b>Step 5:<\/b> Draw the parabola.<\/p><\/div><div class=\"ps-col\"><div class=\"ps-f\">y = x² − 2x − 3 → y = (x − 3)(x + 1)<\/div><p><span class=\"note\">x-intercepts: 3 and −1<\/span><\/p><p><span class=\"note\">halfway between intercepts<\/span>: <span class=\"m\">x = 1<\/span>, giving the lowest point <span class=\"m\">(1, −4)<\/span>.<\/p><\/div><\/div>","plain":"<p>Factor the quadratic to find where it crosses the x-axis. The lowest point of the parabola sits exactly halfway between those two crossings. Plug that middle x-value back in to get the lowest y-value.<\/p>","fun":"Recall from an earlier slide you can also use the technique of “completing the square” to find the minimum value of the quadratic.","check":{"q":"What is the lowest point of <span class=\"m\">y = x² − 6x + 5<\/span>?","choices":["<span class=\"m\">(3, −4)<\/span>","<span class=\"m\">(1, 0)<\/span>","<span class=\"m\">(5, 0)<\/span>","<span class=\"m\">(3, 4)<\/span>"],"a":"A · (3, −4)","why":"<span class=\"m\">x² − 6x + 5 = (x − 1)(x − 5)<\/span>, so the intercepts are <span class=\"m\">1<\/span> and <span class=\"m\">5<\/span>. Halfway is <span class=\"m\">x = 3<\/span>: <span class=\"m\">y = 9 − 18 + 5 = −4<\/span>."},"fig":"<svg viewBox=\"0 0 340 292\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"17\" y1=\"140\" x2=\"269\" y2=\"140\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"262.8,136.7 269,140 262.8,143.3\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"115\" y1=\"274.4\" x2=\"115\" y2=\"14\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"111.7,20.2 115,14 118.3,20.2\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"143\" y1=\"136\" x2=\"143\" y2=\"144\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"171\" y1=\"136\" x2=\"171\" y2=\"144\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"199\" y1=\"136\" x2=\"199\" y2=\"144\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"227\" y1=\"136\" x2=\"227\" y2=\"144\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"255\" y1=\"136\" x2=\"255\" y2=\"144\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"87\" y1=\"136\" x2=\"87\" y2=\"144\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"59\" y1=\"136\" x2=\"59\" y2=\"144\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"31\" y1=\"136\" x2=\"31\" y2=\"144\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"111\" y1=\"112\" x2=\"119\" y2=\"112\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.2\"/><line x1=\"111 <span class=\"note\">not factorable<\/span><\/p><div class=\"ps-f\">y = x² + 6x + 4<\/div><div class=\"ps-f\">↓<\/div><div class=\"ps-f\">y − 4 = x² + 6x<\/div><div class=\"ps-f\">↓<\/div><div class=\"ps-f\">y − 4 <span class=\"hl\">+ 9<\/span> = x² + 6x <span class=\"hl\">+ 9<\/span><\/div><div class=\"ps-f\">↓<\/div><div class=\"ps-f\">y + 5 = (x + 3)²<\/div><div class=\"ps-f\">↓<\/div><div class=\"ps-f\">y = (x + 3)² − 5<\/div><\/div><div class=\"ps-col\"><div class=\"ps-f\">y = (x + 3)² − 5<\/div><p><span class=\"hl\">vertex = (−3, −5)<\/span><\/p><\/div><\/div>","plain":"<p>When a quadratic will not factor, complete the square to write it as <span class=\"m\">y = (x − h)² + k<\/span>. Then the vertex (the lowest point) is <span class=\"m\">(h, k)<\/span>. Watch the sign: <span class=\"m\">(x + 3)²<\/span> means <span class=\"m\">h = −3<\/span>.<\/p>","fun":"If the quadratic has a negative sign in front of the <span class=\"m\">x²<\/span> term, then the parabola will be flipped upside down.","check":{"q":"Complete the square: what is the vertex of <span class=\"m\">y = x² + 4x + 1<\/span>?","choices":["<span class=\"m\">(2, −3)<\/span>","<span class=\"m\">(−2, −3)<\/span>","<span class=\"m\">(−2, 3)<\/span>","<span class=\"m\">(−4, 1)<\/span>"],"a":"B · (−2, −3)","why":"<span class=\"m\">x² + 4x + 4 = (x + 2)²<\/span>, so <span class=\"m\">y = (x + 2)² − 4 + 1 = (x + 2)² − 3<\/span>. The vertex is <span class=\"m\">(−2, −3)<\/span>."},"fig":"<svg viewBox=\"0 0 300 300\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"12\" y1=\"134\" x2=\"242.4\" y2=\"134\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"236.2,130.7 242.4,134 236.2,137.3\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"180\" y1=\"278\" x2=\"180\" y2=\"14\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"176.7,20.2 180,14 183.3,20.2\" fill=\"none\" style=\"stroke:var(--ink)\" ize=\"13\">(−3, −5)<\/text><\/svg>"},"cg-17":{"title":"Graphing by Plotting","subj":"cg","page":17,"group":8,"body":"<h4>How do you graph an equation that you’re unsure about?<\/h4><p>Just plot points<\/p><div class=\"ps-cols\"><div class=\"ps-col\"><div class=\"ps-f\">x = √y<\/div><p><span class=\"note\">wut?<\/span><\/p><div class=\"ps-tw\"><table class=\"ps-tbl\"><tr><th><span class=\"m\">x<\/span><\/th><th><span class=\"m\">y<\/span><\/th><\/tr><tr><td>0<\/td><td>0<\/td><\/tr><tr><td>1<\/td><td>1<\/td><\/tr><tr><td>2<\/td><td>4<\/td><\/tr><tr><td>3<\/td><td>9<\/td><\/tr><\/table><\/div><\/div><div class=\"ps-col\"><p><span class=\"note\">Remember! The points you plot have to be valid. No negatives under a square root.<\/span><\/p><p><span class=\"note\">nice!<\/span><\/p><\/div><\/div>","plain":"<p>If you do not recognise an equation, make a small table: pick easy <span class=\"m\">x<\/span> values, work out <span class=\"m\">y<\/span>, and plot the points. Only use values that are allowed, for example no negative numbers under a square root.<\/p>","fun":"Plotting points is a “low tech” solution that works for EVERY equation, so don’t underestimate its power.","check":{"q":"Which point is on the graph of <span class=\"m\">y = √x<\/span>?","choices":["<span class=\"m\">(2, 4)<\/span>","<span class=\"m\">(4, 2)<\/span>","<span class=\"m\">(−4, 2)<\/span>","<span class=\"m\">(9, −3)<\/span>"],"a":"B · (4, 2)","why":"<span class=\"m\">√4 = 2<\/span>, so <span class=\"m\">(4, 2)<\/span> works. <span class=\"m\">√2<\/span> is not 4, <span class=\"m\">√−4<\/span> is not allowed, and <span class=\"m\">√9<\/span> is 3, not −3."},"fig":"<svg viewBox=\"0 0 330 330\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"24.4\" y1=\"295\" x2=\"289.6\" y2=\"295\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\"/><polyline points=\"283.4,291.7 289.6,295 283.4,298.3\" fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" stroke-linejoin=\"round\"/><line x1=\"40
