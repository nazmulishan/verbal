een)\"><\/circle><circle cx=\"316.57\" cy=\"261.43\" r=\"7\" style=\"fill:none;stroke:var(--amber);stroke-width:2.6\"><\/circle><circle cx=\"427.43\" cy=\"150.57\" r=\"7\" style=\"fill:none;stroke:var(--amber);stroke-width:2.6\"><\/circle><circle cx=\"356\" cy=\"310\" r=\"5\" style=\"fill:var(--green)\"><\/circle><text class=\"slabel g numtxt\" x=\"356\" y=\"338\" text-anchor=\"middle\">lowest (1/2, −9/4)<\/text><circle class=\"handle\" cx=\"212\" cy=\"366\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"468\" cy=\"110\" r=\"8\"><\/circle><text class=\"slabel b numtxt\" x=\"22\" y=\"24\" text-anchor=\"start\">y = x² − x − 2<\/text><text class=\"slabel \" x=\"658\" y=\"24\" text-anchor=\"end\">amber rings: where they meet<\/text><\/svg>"},"cb_cut":{"title":"Cutting a piece out, and the perimeter","tag":"Geometry","say":"Cutting a piece out of a shape always takes area away. The perimeter is a different story. The same bite can leave the perimeter alone, make it longer, or make it shorter. The four bite buttons show all three answers from one rectangle. The last two buttons swap to a strip of land, where the area is collected from the left. Drag the dots. One unit on this board is one unit of length.","note":"One line is worth carrying away. Area and perimeter do not answer to the same rule. A cut that takes area away may leave the perimeter longer, shorter or untouched. Sort the cut by where its middle sits before you count anything. The bite slider only bites on the first four views. On the last two it is the line you drag that matters.","tries":["Set the bite to 2 and press each of the four bite buttons in turn. The area lost barely moves. The change in the perimeter goes 0, then +4, then π − 4, then +π.","Press <b>edge notch<\/b> and drag the top dot sideways. The bite slides along the edge and not one number moves. Where along the edge you cut does not matter.","Press <b>corner notch<\/b> and make the bite as big as it goes. The area falls a long way and the perimeter still reads the same as the plain rectangle.","Press <b>round bite at a corner<\/b>. It is the only one of the four that makes the perimeter shorter. An arc is shorter than the two straight pieces it replaces.","Press <b>adding it up<\/b> and drag the line right. Watch the running total jump past 5 at the first corner and past 14 at the second.","Press <b>the strip of land<\/b> and drag the line. The true area always sits between the short dashed box and the tall dashed box, never outside them."],"ideas":[{"lead":"<b>Cutting a piece out always takes area away.<\/b>","rest":"What is left is the whole shape minus the piece you cut out. That half never surprises anybody.","f":"area left = whole − piece"},{"lead":"<b>The perimeter can go up, down, or stay exactly where it was.<\/b>","rest":"It depends on where you cut, not on how much area you took away.","f":"less area does not mean a shorter perimeter"},{"lead":"<b>A square notch cut out of a corner leaves the perimeter alone.<\/b>","rest":"You lose r of edge twice over. You get r of new edge back twice over.","f":"−2r straight, +2r straight, change = 0"},{"lead":"<b>A square notch cut into an edge makes the perimeter longer.<\/b>","rest":"The travel across is the same as before. Two new walls go in and come back out at a right angle.","f":"change = +2 × the depth"},{"lead":"<b>A quarter circle bitten out of a corner makes the perimeter shorter.<\/b>","rest":"A whole circle is 2πr round, so a quarter of it is πr/2. That arc is shorter than the 2r of edge it replaces.","f":"change = πr/2 − 2r ≈ −0.43r"},{"lead":"<b>A quarter circle bitten out of an edge makes the perimeter longer.<\/b>","rest":"One radius eats r of that edge. The other radius hands r straight back. The arc πr/2 is pure extra.","f":"change = +πr/2 ≈ +1.57r"},{"lead":"<b>Start from the rectangle before you touch the cut.<\/b>","rest":"Its perimeter is two widths plus two heights. Its area is width times height.","f":"P = 2(w + h) · A = wh"},{"lead":"<b>A piece with a sloping top is a trapezoid.<\/b>","rest":"Average its two end heights, then times the width. A rectangle is the easy case where both ends match.","f":"area = ½(a + b) × w"},{"lead":"<b>Cut the shape at every corner of its top, then add the pieces on from the left.<\/b>","rest":"The number you carry is the area collected so far.","f":"total so far = piece 1 + piece 2 + ..."},{"lead":"<b>Width times one end height is never the area.<\/b>","rest":"It is a bound. The short end gives you too little and the tall end gives you too much.","f":"w × short &lt; area &lt; w × tall"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 440\"><polygon points=\"205,168 475,168 475,378 205,378\" style=\"fill:none;stroke:var(--ink-3);stroke-width:1.1;stroke-dasharray:4 4\"><\/polygon><polygon points=\"415,168 475,168 475,228 415,228\" style=\"fill:var(--red-wash);stroke:var(--red);stroke-width:2;stroke-linejoin:round\"><\/polygon><path style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2;stroke-linejoin:round\" d=\"M 205 168 L 415 168 L 415 228 L 475 228 L 475 378 L 205 378 Z\"><\/path><line x1=\"415\" y1=\"168\" x2=\"475\" y2=\"168\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><line x1=\"475\" y1=\"168\" x2=\"475\" y2=\"228\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><line x1=\"415\" y1=\"168\" x2=\"415\" y2=\"228\" style=\"stroke:var(--green);stroke-width:4;fill:none\"><\/line><line x1=\"415\" y1=\"228\" x2=\"475\" y2=\"228\" style=\"stroke:var(--green);stroke-width:4;fill:none\"><\/line><text class=\"slabel r numtxt\" x=\"445\" y=\"156\" text-anchor=\"middle\">r = 2<\/text><text class=\"slabel  numtxt\" x=\"340\" y=\"404\" text-anchor=\"middle\">width 9<\/text><text class=\"slabel  numtxt\" x=\"191\" y=\"277\" text-anchor=\"end\">height 7<\/text><text class=\"slabel  numtxt\" x=\"340\" y=\"26\" text-anchor=\"middle\">area 63 − 4 = 59 &nbsp;·&nbsp; perimeter 32 → 32<\/text><text class=\"slabel g numtxt\" x=\"340\" y=\"48\" text-anchor=\"middle\">2r of straight edge gone in red, 2r of straight edge back in green<\/text><circle class=\"handle\" cx=\"415\" cy=\"228\" r=\"8\"><\/circle><\/svg>"},"cb_sets":{"title":"Two groups that overlap, all at once","tag":"Data Analysis","say":"The box is everyone. Each circle is one set, which is just a named group. The part where the circles cross is the overlap, the people in both. Everyone in at least one set makes the union. Move the sliders and every count answers at once. The last button puts a third set in. Each region prints its own count, so you can add them up with your eyes.","note":"","tries":["Push group A and group B up until they add to more than the total. The overlap slider stops going down. Some people have to be in both.","Set the overlap to zero. The count in at least one becomes group A plus group B, with nothing taken off.","Push the overlap up to the size of the smaller group. That group now sits completely inside the bigger one, and its own region empties.","Drop the total until it matches the number in at least one. The people in neither run out, and the box is full.","Press the third circle button. The adding and taking off happens three times over, and the middle piece has to come back once."],"ideas":[{"lead":"<b>Add the two sets, then take the overlap off once.<\/b>","rest":"Adding counts the people in the overlap twice. Taking the overlap off once puts that right, and what is left is the union.","f":"the union = A + B − both"},{"lead":"<b>Everyone sits in one of four regions.<\/b>","rest":"In set A only, in the overlap, in set B only, or in neither. Those four counts always add up to the total.","f":"A only + both + B only + neither = total"},{"lead":"<b>The ones in neither set are what is left over.<\/b>","rest":"Take the union away from the total and that is what you get.","f":"neither = total − the union"},{"lead":"<b>The overlap can never beat the smaller set.<\/b>","rest":"Every person in both sets is also in each set on its own.","f":"both ≤ the smaller of A and B"},{"lead":"<b>When the two sets overrun the total, an overlap is forced.<\/b>","rest":"The amount they overrun by is the least the overlap can be.","f":"both ≥ A + B − total"},{"lead":"<b>With three sets you add, take each pair overlap off, then put the middle back.<\/b>","rest":"The middle piece is taken off three times, so it has to come back once.","f":"A + B + C − (the three pairs) + all three"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 560\"><rect x=\"28\" y=\"58\" width=\"624\" height=\"412\" rx=\"8\" style=\"fill:none;stroke:var(--ink-3);stroke-width:1.5\"><\/rect><text class=\"slabel b numtxt\" x=\"340\" y=\"40\" text-anchor=\"middle\">the box is everyone: 48 people<\/text><text class=\"slabel  numtxt\" x=\"44\" y=\"82\" text-anchor=\"start\">everyone (48)<\/text><text class=\"slabel \" x=\"44\" y=\"440\" text-anchor=\"start\">in neither<\/text><text class=\"slabel g numtxt\" x=\"44\" y=\"458\" text-anchor=\"start\">12<\/text><circle cx=\"255\" cy=\"264\" r=\"125\" style=\"fill:var(--blue);fill-opacity:.13;stroke:var(--blue);stroke-width:2\"><\/circle><circle cx=\"385\" cy=\"264\" r=\"125\" style=\"fill:var(--blue);fill-opacity:.13;stroke:var(--blue);stroke-width:2\"><\/circle><text class=\"slabel b\" x=\"195\" y=\"187\" text-anchor=\"middle\">group A<\/text><text class=\"slabel b\" x=\"445\" y=\"187\" text-anchor=\"middle\">group B<\/text><text class=\"slabel \" x=\"195\" y=\"259\" text-anchor=\"middle\">A only<\/text><text class=\"slabel b numtxt\" x=\"195\" y=\"279\" text-anchor=\"middle\">18<\/text><text class=\"slabel \" x=\"320\" y=\"259\" text-anchor=\"middle\">in both<\/text><text class=\"slabel r numtxt\" x=\"320\" y=\"279\" text-anchor=\"middle\">6<\/text><text class=\"slabel \" x=\"445\" y=\"259\" text-anchor=\"middle\">B only<\/text><text class=\"slabel b numtxt\" x=\"445\" y=\"279\" text-anchor=\"middle\">12<\/text><line x1=\"160\" y1=\"504\" x2=\"560\" y2=\"504\" style=\"stroke:var(--line-2);stroke-width:7;stroke-linecap:round\"><\/line><line x1=\"160\" y1=\"504\" x2=\"560\" y2=\"504\" style=\"stroke:var(--green);stroke-width:7;stroke-linecap:round\"><\/line><circle cx=\"293.33\" cy=\"504\" r=\"7\" style=\"fill:var(--panel);stroke:var(--red);stroke-width:3\"><\/circle><text class=\"slabel g numtxt\" x=\"144\" y=\"508\" text-anchor=\"end\">at least 0<\/text><text class=\"slabel g numtxt\" x=\"576\" y=\"508\" text-anchor=\"start\">at most 18<\/text><text class=\"slabel r numtxt\" x=\"293.33\" y=\"486\" text-anchor=\"middle\">the overlap is 6<\/text><text class=\"slabel \" x=\"340\" y=\"534\" text-anchor=\"middle\">the overlap is squeezed between these two<\/text><\/svg>"},"cb_count":{"title":"Choosing and arranging, all at once","tag":"Data Analysis","say":"Set how many things you have and how many you pick. The four counting answers sit in one square. A permutation is a line-up where the order counts. A combination is a pick where the order does not count. Each of the two comes with things put back or not. The other buttons draw every choice one by one. They show how fast the factorial ladder climbs. They show what happens when some things look the same. They show why choosing is the same as leaving behind.","note":"","tries":["Set n to 5 and k to 2, then press the button that draws every choice. Count the rows by hand and check them against the number.","Hold n still and walk k from 0 up to n. Watch the choice count rise to a peak in the middle and fall back to 1.","Make k bigger than n. The two counts without putting back drop to zero, because you cannot pick more different things than you own.","Press the factorial ladder and slide n from 1 to 12. Each step multiplies by the next number, so the bars run away from you.","Press the last button. Whatever you set, choosing k and leaving n minus k give the same number every time."],"ideas":[{"lead":"<b>A permutation is a line-up where the order counts.<\/b>","rest":"You get n ways for the first pick, then n minus one for the second, and so on. The same count is n! divided by (n minus k)!","f":"P(n, k) = n! / (n − k)!"},{"lead":"<b>A combination is a pick where the order does not count.<\/b>","rest":"Each set of k things can be lined up in k factorial ways. Those line-ups all count as one pick, so divide by k factorial.","f":"C(n, k) = n! / (k! × (n − k)!)"},{"lead":"<b>Putting things back means every pick still has n choices.<\/b>","rest":"Nothing is used up, so the count is n multiplied by itself k times.","f":"with putting back, order counts: n to the power k"},{"lead":"<b>Choosing k is the same as leaving n minus k behind.<\/b>","rest":"Every combination names its own leftovers, so the two counts have to match.","f":"C(n, k) = C(n, n − k)"},{"lead":"<b>Things that look the same wipe out the extra orders.<\/b>","rest":"Divide n factorial by the factorial of each block of matching items.","f":"n! / (a! × b! × …)"},{"lead":"<b>A factorial grows faster than anything else on this board.<\/b>","rest":"A factorial multiplies every whole number from n down to 1, so the ladder runs away.","f":"n! = n × (n − 1) × … × 2 × 1"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 460\"><text class=\"slabel b numtxt\" x=\"340\" y=\"34\" text-anchor=\"middle\">8 things on the table, and you take 3 of them<\/text><rect x=\"178\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--green);fill-opacity:.2;stroke:var(--green);stroke-width:2\"><\/rect><rect x=\"220\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--green);fill-opacity:.2;stroke:var(--green);stroke-width:2\"><\/rect><rect x=\"262\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--green);fill-opacity:.2;stroke:var(--green);stroke-width:2\"><\/rect><rect x=\"304\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.6\"><\/rect><rect x=\"346\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.6\"><\/rect><rect x=\"388\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.6\"><\/rect><rect x=\"430\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.6\"><\/rect><rect x=\"472\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.6\"><\/rect><text class=\"slabel \" x=\"193\" y=\"82\" text-anchor=\"middle\">A<\/text><text class=\"slabel \" x=\"235\" y=\"82\" text-anchor=\"middle\">B<\/text><text class=\"slabel \" x=\"277\" y=\"82\" text-anchor=\"middle\">C<\/text><text class=\"slabel \" x=\"319\" y=\"82\" text-anchor=\"middle\">D<\/text><text class=\"slabel \" x=\"361\" y=\"82\" text-anchor=\"middle\">E<\/text><text class=\"slabel \" x=\"403\" y=\"82\" text-anchor=\"middle\">F<\/text><text class=\"slabel \" x=\"445\" y=\"82\" text-anchor=\"middle\">G<\/text><text class=\"slabel \" x=\"487\" y=\"82\" text-anchor=\"middle\">H<\/text><text class=\"slabel g numtxt\" x=\"340\" y=\"120\" text-anchor=\"middle\">the green ones are one possible pick of 3<\/text><rect x=\"56\" y=\"140\" width=\"568\" height=\"260\" rx=\"6\" style=\"fill:none;stroke:var(--line-2);stroke-width:1.2\"><\/rect><line x1=\"56\" y1=\"180\" x2=\"624\" y2=\"180\" style=\"stroke:var(--line-2);stroke-width:1.2;fill:none\"><\/line><line x1=\"56\" y1=\"290\" x2=\"624\" y2=\"290\" style=\"stroke:var(--line-2);stroke-width:1.2;fill:none\"><\/line><line x1=\"216\" y1=\"140\" x2=\"216\" y2=\"400\" style=\"stroke:var(--line-2);stroke-width:1.2;fill:none\"><\/line><line x1=\"420\" y1=\"140\" x2=\"420\" y2=\"400\" style=\"stroke:var(--line-2);stroke-width:1.2;fill:none\"><\/line><text class=\"slabel \" x=\"318\" y=\"164\" text-anchor=\"middle\">without putting back<\/text><text class=\"slabel \" x=\"522\" y=\"164\" text-anchor=\"middle\">with putting back<\/text><text class=\"slabel b\" x=\"136\" y=\"228\" text-anchor=\"middle\">order<\/text><text class=\"slabel b\" x=\"136\" y=\"246\" text-anchor=\"middle\">matters<\/text><text class=\"slabel b\" x=\"136\" y=\"338\" text-anchor=\"middle\">order does<\/text><text class=\"slabel b\" x=\"136\" y=\"356\" text-anchor=\"middle\">not matter<\/text><text class=\"slabel  numtxt\" x=\"318\" y=\"208\" text-anchor=\"middle\">8 × 7 × 6<\/text><text class=\"slabel g numtxt\" x=\"318\" y=\"236\" text-anchor=\"middle\">= 336<\/text><text class=\"slabel \" x=\"318\" y=\"264\" text-anchor=\"middle\">n! / (n − k)!<\/text><text class=\"slabel  numtxt\" x=\"522\" y=\"208\" text-anchor=\"middle\">8 × 8 × 8<\/text><text class=\"slabel g numtxt\" x=\"522\" y=\"236\" text-anchor=\"middle\">= 512<\/text><text class=\"slabel \" x=\"522\" y=\"264\" text-anchor=\"middle\">n to the power k<\/text><text class=\"slabel  numtxt\" x=\"318\" y=\"318\" text-anchor=\"middle\">336 ÷ 6<\/text><text class=\"slabel g numtxt\" x=\"318\" y=\"346\" text-anchor=\"middle\">= 56<\/text><text class=\"slabel \" x=\"318\" y=\"374\" text-anchor=\"middle\">n! / (k! × (n − k)!)<\/text><text class=\"slabel  numtxt\" x=\"522\" y=\"318\" text-anchor=\"middle\">choose 3 from 10<\/text><text class=\"slabel g numtxt\" x=\"522\" y=\"346\" text-anchor=\"middle\">= 120<\/text><text class=\"slabel  numtxt\" x=\"522\" y=\"374\" text-anchor=\"middle\">(n + k − 1) choose k<\/text><text class=\"slabel \" x=\"340\" y=\"430\" text-anchor=\"middle\">the left column uses things up, the right column hands them back<\/text><\/svg>"},"cb_prob":{"title":"A two-stage chance tree, all at once","tag":"Data Analysis","say":"Two things happen one after the other, and each can go yes or no. Drag the dot on a branch, or move the sliders, to set its probability. A probability is just the chance of a thing, written as a fraction. Along a path you multiply. Across paths you add. Every rule of the section reads off the same four paths. That includes the expected value, the average per go, once each path pays out.","note":"","tries":["Drag the dot on the top branch all the way to the far end. The first thing is then certain, and the two bottom paths fall to zero.","Set the two second-stage chances to the same number. The second result now ignores the first, and the conditional chance stops moving.","Press the at least one button and watch the three green paths add up to one minus the red path.","Make both second-stage chances small. The chance of no yes at all climbs, and the chance of at least one falls with it.","Press the payout button and push the losing amount down. The expected value crosses zero, and the game turns from worth playing to not."],"ideas":[{"lead":"<b>Along a path you multiply.<\/b>","rest":"The chance of the first branch times the chance of the second branch gives the chance of that whole path.","f":"P(first and second) = P(first) × P(second, given the first)"},{"lead":"<b>Across paths you add.<\/b>","rest":"Two different paths cannot both happen, so their chances add up.","f":"P(A or B) = P(A) + P(B) when they cannot both happen"},{"lead":"<b>The four paths always add up to 1.<\/b>","rest":"One of them has to happen, so the whole tree is worth exactly one.","f":"P(1) + P(2) + P(3) + P(4) = 1"},{"lead":"<b>At least one is easier through its opposite.<\/b>","rest":"Work out the chance that it never happens, then take that away from 1.","f":"P(at least one) = 1 − P(none)"},{"lead":"<b>A conditional chance is one branch of this tree.<\/b>","rest":"A conditional chance is the chance of something once you already know what happened before it.","f":"P(B given A) = P(A and B) / P(A)"},{"lead":"<b>When two things do not affect each other, the two second-stage branches match.<\/b>","rest":"The first result then tells you nothing about the second.","f":"P(B given A) = P(B) when they are independent"},{"lead":"<b>Expected value is each payout times its probability, all added up.<\/b>","rest":"Over a long run each path turns up as often as its chance says, so that chance is its weight. Expected value is the average you would get.","f":"expected value = sum of (probability × payout)"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 700 470\"><text class=\"slabel \" x=\"155\" y=\"26\" text-anchor=\"middle\">first thing<\/text><text class=\"slabel \" x=\"350\" y=\"26\" text-anchor=\"middle\">second thing<\/text><text class=\"slabel \" x=\"560\" y=\"26\" text-anchor=\"middle\">the four paths<\/text><line x1=\"60\" y1=\"235\" x2=\"250\" y2=\"120\" style=\"stroke:var(--blue);stroke-width:4.52;fill:none;stroke-linecap:round\"><\/line><line x1=\"60\" y1=\"235\" x2=\"250\" y2=\"350\" style=\"stroke:var(--blue);stroke-width:3.48;fill:none;stroke-linecap:round\"><\/line><line x1=\"250\" y1=\"120\" x2=\"450\" y2=\"65\" style=\"stroke:var(--blue);stroke-width:5.04;fill:none;stroke-linecap:round\"><\/line><line x1=\"250\" y1=\"120\" x2=\"450\" y2=\"175\" style=\"stroke:var(--blue);stroke-width:2.96;fill:none;stroke-linecap:round\"><\/line><line x1=\"250\" y1=\"350\" x2=\"450\" y2=\"295\" style=\"stroke:var(--blue);stroke-width:3.48;fill:none;stroke-linecap:round\"><\/line><line x1=\"250\" y1=\"350\" x2=\"450\" y2=\"405\" style=\"stroke:var(--blue);stroke-width:4.52;fill:none;stroke-linecap:round\"><\/line><text class=\"slabel b numtxt\" x=\"141.5\" y=\"155\" text-anchor=\"middle\">yes 3/5<\/text><text class=\"slabel b numtxt\" x=\"141.5\" y=\"315\" text-anchor=\"middle\">no 2/5<\/text><text class=\"slabel b numtxt\" x=\"343\" y=\"67\" text-anchor=\"middle\">yes 7/10<\/text><text class=\"slabel b numtxt\" x=\"343\" y=\"173\" text-anchor=\"middle\">no 3/10<\/text><text class=\"slabel b numtxt\" x=\"343\" y=\"297\" text-anchor=\"middle\">yes 2/5<\/text><text class=\"slabel b numtxt\" x=\"343\" y=\"403\" text-anchor=\"middle\">no 3/5<\/text><circle cx=\"60\" cy=\"235\" r=\"7\" style=\"fill:var(--panel);stroke:var(--ink-2);stroke-width:2\"><\/circle><circle cx=\"250\" cy=\"120\" r=\"7\" style=\"fill:var(--panel);stroke:var(--blue);stroke-width:2\"><\/circle><circle cx=\"250\" cy=\"350\" r=\"7\" style=\"fill:var(--panel);stroke:var(--blue);stroke-width:2\"><\/circle><text class=\"slabel \" x=\"60\" y=\"262\" text-anchor=\"middle\">start<\/text><text class=\"slabel b\" x=\"236\" y=\"104\" text-anchor=\"end\">first: yes<\/text><text class=\"slabel b\" x=\"236\" y=\"372\" text-anchor=\"end\">first: no<\/text><circle cx=\"450\" cy=\"65\" r=\"5\" style=\"fill:var(--blue);stroke:none\"><\/circle><text class=\"slabel b\" x=\"468\" y=\"56\" text-anchor=\"start\">yes then yes<\/text><text class=\"slabel b numtxt\" x=\"468\" y=\"74\" text-anchor=\"start\">3/5 × 7/10 = 21/50<\/text><circle cx=\"450\" cy=\"175\" r=\"5\" style=\"fill:var(--blue);stroke:none\"><\/circle><text class=\"slabel b\" x=\"468\" y=\"166\" text-anchor=\"start\">yes then no<\/text><text class=\"slabel b numtxt\" x=\"468\" y=\"184\" text-anchor=\"start\">3/5 × 3/10 = 9/50<\/text><circle cx=\"450\" cy=\"295\" r=\"5\" style=\"fill:var(--blue);stroke:none\"><\/circle><text class=\"slabel b\" x=\"468\" y=\"286\" text-anchor=\"start\">no then yes<\/text><text class=\"slabel b numtxt\" x=\"468\" y=\"304\" text-anchor=\"start\">2/5 × 2/5 = 4/25<\/text><circle cx=\"450\" cy=\"405\" r=\"5\" style=\"fill:var(--blue);stroke:none\"><\/circle><text class=\"slabel b\" x=\"468\" y=\"396\" text-anchor=\"start\">no then no<\/text><text class=\"slabel b numtxt\" x=\"468\" y=\"414\" text-anchor=\"start\">2/5 × 3/5 = 6/25<\/text><circle class=\"handle\" cx=\"174\" cy=\"166\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"390\" cy=\"81.5\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"330\" cy=\"328\" r=\"8\"><\/circle><text class=\"slabel b numtxt\" x=\"350\" y=\"456\" text-anchor=\"middle\">21/50 + 9/50 + 4/25 + 6/25 = 1<\/text><\/svg>"},"cb_tri":{"title":"The triangle, all at once","tag":"Geometry","say":"Drag any corner of the triangle. Every measurement below answers at once, and each one shows the rule that made it with your own numbers put in. The three sides, the three angles, the perimeter, the area, and both of the triangle tests. Every corner lands on a whole unit. So each side squared is a whole number, and each side is left as an exact square root.","note":"Two of these rules are worth more than the rest. Area is half the base times the height. That half comes from the parallelogram two copies of the triangle make. The height must be measured square on to the base. So sliding a corner along a line parallel to the base leaves the area alone. The other rule: the largest angle always sits opposite the longest side. In a right triangle that longest side is the hypotenuse. Every corner sits on a whole unit here. So a side is always the square root of a whole number. The board leaves it as a root, and names its size beside it.","tries":["Drag the top corner <b>straight sideways<\/b>. The base and the height never change, so the area never changes — but every side length and every angle does.","Make the largest angle pass through 90° and watch the verdict flip from acute to right to obtuse. The moment it reads <b>right<\/b>, the two squares in the readout match.","Drag one corner towards the line joining the other two. The area heads for zero, and the longest side heads for the sum of the other two — the triangle inequality closing.","Switch to <b>medians<\/b> and drag a corner. The centroid, the balance point, stays two thirds of the way down every median."],"ideas":[{"lead":"<b>The three angles always add to 180°.<\/b>","rest":"Drag any corner and watch the three readings move against each other while the total stays put.","f":"A + B + C = 180°"},{"lead":"<b>Area is half the base times the height.<\/b>","rest":"Two copies of the triangle fit together into a parallelogram, a pushed-over rectangle. That parallelogram is base × height. So one triangle is half of it. The height is measured square on to the base.","f":"Area = ½ × base × height"},{"lead":"<b>Two sides fix a window for the third.<\/b>","rest":"The longest side must stay shorter than the other two added together, or the shape cannot close.","f":"|a − b| &lt; c &lt; a + b"},{"lead":"<b>The longest side faces the largest angle<\/b>, always.","rest":"It is how a question about angles can be settled by looking only at lengths.","f":"a &lt; b → A &lt; B"},{"lead":"<b>Squaring the sides says which kind of triangle it is.<\/b>","rest":"Compare the longest side squared with the other two squared added together. When the two match, the triangle has a right angle. Its longest side is then the hypotenuse.","f":"c² &lt; a² + b² acute · = right · &gt; obtuse"},{"lead":"<b>A side on a grid comes from a right triangle.<\/b>","rest":"Go across, then up, and the side you want is the square root of the two squares added.","f":"side = √(across² + up²)"},{"lead":"<b>The three medians all meet at one point.<\/b>","rest":"That point is the centroid, the balance point of the triangle. Each median is cut there into two pieces, and the piece touching the corner is twice the other.","f":"corner to centroid : centroid to midpoint = 2 : 1"},{"lead":"<b>Join two midpoints and you get a midsegment.<\/b>","rest":"It is half the side it faces, and parallel to that side. The middle triangle is a quarter of the area.","f":"midsegment = ½ × the side it faces"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><polygon points=\"120,340 420,340 260,100\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2;stroke-linejoin:round\"><\/polygon><path class=\"arcline\" d=\"M 146 340 A 26 26 0 0 0 133.1 317.54\"><\/path><text class=\"slabel b numtxt\" x=\"158.15\" y=\"322.09\" text-anchor=\"middle\">59.7°<\/text><path class=\"arcline\" d=\"M 405.58 318.37 A 26 26 0 0 0 394 340\"><\/path><text class=\"slabel b numtxt\" x=\"381.21\" y=\"323.24\" text-anchor=\"middle\">56.3°<\/text><path class=\"arcline\" d=\"M 246.9 122.46 A 26 26 0 0 0 274.42 121.63\"><\/path><text class=\"slabel b numtxt\" x=\"261.32\" y=\"147.98\" text-anchor=\"middle\">64°<\/text><text class=\"slabel  numtxt\" x=\"359.97\" y=\"210.69\" text-anchor=\"middle\">a = 4√13 ≈ 14.42<\/text><text class=\"slabel  numtxt\" x=\"169.27\" y=\"211.91\" text-anchor=\"middle\">b = √193 ≈ 13.89<\/text><text class=\"slabel r numtxt\" x=\"270\" y=\"368\" text-anchor=\"middle\">c = 15<\/text><text class=\"slabel b\" x=\"104\" y=\"356\" text-anchor=\"middle\">A<\/text><text class=\"slabel b\" x=\"436\" y=\"356\" text-anchor=\"middle\">B<\/text><text class=\"slabel b\" x=\"260\" y=\"82\" text-anchor=\"middle\">C<\/text><circle class=\"handle\" cx=\"120\" cy=\"340\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"420\" cy=\"340\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"260\" cy=\"100\" r=\"8\"><\/circle><\/svg>"},"cb_shapes":{"title":"Flat shapes and the solids they grow into","tag":"Geometry","say":"Move the sliders. The first sets how many sides the polygon has, from 3 up to 12. The second sets the radius, which runs from the middle out to a corner. The third sets the height when you stand the polygon up. Every angle rule, the diagonals, the area, the volume and the surface area answer at once.","note":"","tries":["Slide the number of sides from 3 up to 12. The angles inside add to more each time, but each turn on the outside gets smaller.","Set the sides to <b>4<\/b>. The flat polygon is a square, and standing it up gives you a box. Set the height to match the side and you get a cube.","Press <b>the lines across<\/b> and count the diagonals yourself at 5 sides and then at 6 sides. The count jumps from 5 to 9, not from 5 to 6.","Press <b>double the size<\/b>. The polygon on the right is twice as wide, four times the area, and eight times the volume.","Set the sides to <b>6<\/b> and look at the picture. It is six equal triangles, and every side is as long as the radius slider.","Watch the readout for the circle through the corners. It stays at the same multiple of π, and the polygon fills more of it every time you add a side."],"ideas":[{"lead":"<b>Cut a polygon into triangles and the angles inside add up.<\/b>","rest":"From one corner you always get two fewer triangles than the polygon has sides. Each triangle gives 180°.","f":"angles inside = (n − 2) × 180°"},{"lead":"<b>A regular polygon has equal sides and equal angles.<\/b>","rest":"So share the total out between the corners and every angle is the same.","f":"each angle = (n − 2) × 180° / n"},{"lead":"<b>The turns on the outside always add to 360°.<\/b>","rest":"Walk right round the edge of any polygon and you have turned one full circle.","f":"each outside turn = 360° / n"},{"lead":"<b>A diagonal joins two corners that are not next to each other.<\/b>","rest":"From each corner you can reach three fewer than the number of corners. Every diagonal gets counted from both ends, so halve it.","f":"diagonals = n(n − 3) / 2"},{"lead":"<b>The distance from the middle straight out to a flat side has a name.<\/b>","rest":"It is called the apothem, and it meets that side at a right angle.","f":"apothem = R × cos(180°/n)"},{"lead":"<b>Half a side, the apothem and the radius make a right triangle.<\/b>","rest":"So the apothem is the square root of R times R take away half a side times half a side.","f":"a = √(R² − (s/2)²)"},{"lead":"<b>Area is half the apothem times the perimeter.<\/b>","rest":"This one rule works for a regular polygon with any number of sides.","f":"area = ½ × apothem × perimeter"},{"lead":"<b>Every corner sits on one circle, and R is that circle's radius.<\/b>","rest":"Its area is π times R times R, and the flat polygon always holds a little less.","f":"circle area = πR² &nbsp; circumference = 2πR"},{"lead":"<b>Stand the flat polygon up and the volume is the area times the height.<\/b>","rest":"That holds for any solid with the same flat face all the way up.","f":"volume = area of the base × height"},{"lead":"<b>The surface area is the two ends plus the wall that goes round.<\/b>","rest":"Unroll the wall and it is a rectangle: the perimeter, by the height.","f":"surface area = 2 × area + perimeter × height"},{"lead":"<b>Double every length and the area goes up four times, the volume eight.<\/b>","rest":"Lengths go by k, areas by k times k, volumes by k times k times k.","f":"k · k² · k³"},{"lead":"<b>Four equal sides make a square, and standing it up makes a box.<\/b>","rest":"If the height matches the side you get a cube.","f":"box = side × side × height"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 440\"><circle cx=\"330\" cy=\"235\" r=\"96\" style=\"fill:none;stroke:var(--ink-3);stroke-width:1.1;stroke-dasharray:5 5\"><\/circle><polygon points=\"378,318.14 282,318.14 234,235 282,151.86 378,151.86 426,235\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2;stroke-linejoin:round\"><\/polygon><line x1=\"330\" y1=\"235\" x2=\"330\" y2=\"318.14\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><path style=\"stroke:var(--green);stroke-width:1.6;fill:none\" d=\"M 330 309.14 L 339 309.14 L 339 318.14\"><\/path><text class=\"slabel r numtxt\" x=\"360\" y=\"280.57\" text-anchor=\"middle\">a = 4√3 ≈ 6.93<\/text><line x1=\"378\" y1=\"318.14\" x2=\"282\" y2=\"318.14\" style=\"stroke:var(--green);stroke-width:3.6;fill:none\"><\/line><text class=\"slabel g numtxt\" x=\"330\" y=\"340.14\" text-anchor=\"middle\">s = 8<\/text><line x1=\"330\" y1=\"235\" x2=\"378\" y2=\"318.14\" style=\"stroke:var(--blue);stroke-width:1.6;fill:none\"><\/line><path class=\"arcline\" d=\"M 388 169.18 A 20 20 0 0 1 358 151.86\"><\/path><text class=\"slabel b numtxt\" x=\"359\" y=\"188.77\" text-anchor=\"middle\">120°<\/text><circle cx=\"330\" cy=\"235\" r=\"3.5\" style=\"fill:var(--ink-3)\"><\/circle><text class=\"slabel  numtxt\" x=\"340\" y=\"22\" text-anchor=\"middle\">the angles inside add to (6 − 2) × 180 = 720°<\/text><text class=\"slabel  numtxt\" x=\"340\" y=\"40\" text-anchor=\"middle\">each angle = 720 / 6 = 120°, and each turn outside = 360 / 6 = 60°<\/text><\/svg>"},"cb_inscribed":{"title":"Shapes inside shapes","tag":"Geometry","say":"One shape sits inside another, touching. Only one question matters here. Which length of the inner shape is the same as which length of the outer one? The red line on the picture is that pairing. Get it right and every number follows.","note":"","tries":["Press <b>both, nested<\/b>. That is the photograph: a square holding a circle holding a square. The small square always comes out at exactly half the big one.","Change the size and watch the share stay still. The leftover area changes, but the fraction never does.","Compare <b>circle in a square<\/b> with <b>square in a circle<\/b>. One fills 0.79 of its container, the other 0.64. Both numbers sit on the answer list, so check which shape is doing the holding.","Press <b>ball in a box<\/b>. A round thing in a square thing loses more room in three dimensions than in two. The share drops from 0.79 to 0.52.","Press <b>six sides in a circle<\/b>. A hexagon fills 0.83 of the circle, and a triangle only 0.41. More sides means less waste."],"ideas":[{"lead":"<b>Touching is the whole clue.<\/b>","rest":"When a circle touches all four sides of a square, the diameter of the circle is the side of the square.","f":"d = s"},{"lead":"<b>Corners touching means something different.<\/b>","rest":"When a square has its four corners on a circle, the square’s diagonal is the diameter of the circle.","f":"diagonal = d = 2r"},{"lead":"<b>A square’s diagonal is longer than its side.<\/b>","rest":"It is the side multiplied by √2. So the side is the diameter divided by √2.","f":"s = d ÷ √2"},{"lead":"<b>The √2 on a diagonal comes from Pythagoras.<\/b>","rest":"The diagonal cuts a square into two right-angled triangles. So s² + s² = 2s², and the diagonal is s√2.","f":"diagonal = s √2"},{"lead":"<b>The share never depends on the size.<\/b>","rest":"Give the outer shape a letter, read the inner one off the words, and the letter cancels.","f":"circle in a square = π/4 ≈ 0.79"},{"lead":"<b>π ÷ 4 is a circle over the square it sits in.<\/b>","rest":"The circle is πr². The square side is 2r, so the square is 4r². The r² cancels.","f":"πr² ÷ 4r² = π ÷ 4"},{"lead":"<b>The other way round wastes more.<\/b>","rest":"A square inside a circle fills less of it than a circle inside a square.","f":"square in a circle = 2/π ≈ 0.64"},{"lead":"<b>Nesting both gives an exact half.<\/b>","rest":"A square holding a circle holding a square: the inner square is half the outer one, every time.","f":"inner = ½ × outer"},{"lead":"<b>Squaring the divide by √2 is what makes the half.<\/b>","rest":"The small side is the big side over √2, and squaring that puts a plain 2 underneath.","f":"(s ÷ √2)² = s² ÷ 2"},{"lead":"<b>3√3 ÷ 4 comes from three triangles.<\/b>","rest":"Three equal triangles meet at the centre. Each one has two radius sides and a 120° angle between them.","f":"each = ½ × r × r × sin 120°"},{"lead":"<b>Three dimensions waste more than two.<\/b>","rest":"A ball in a box fills about half of it, while a circle in a square fills nearly four fifths.","f":"ball in a box = π/6 ≈ 0.52"},{"lead":"<b>The piece left over is the shaded-region question.<\/b>","rest":"Name the whole, name what is cut out, and take one from the other.","f":"left over = outer − inner"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><polygon points=\"192,68 448,68 448,324 192,324\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2\"><\/polygon><circle cx=\"320\" cy=\"196\" r=\"128\" style=\"fill:var(--green);fill-opacity:.15;stroke:var(--green);stroke-width:2.2\"><\/circle><line x1=\"192\" y1=\"196\" x2=\"448\" y2=\"196\" style=\"stroke:var(--red);stroke-width:3;fill:none\"><\/line><text class=\"slabel r numtxt\" x=\"320\" y=\"184\" text-anchor=\"middle\">diameter = 10<\/text><text class=\"slabel b numtxt\" x=\"320\" y=\"350\" text-anchor=\"middle\">side = 10<\/text><text class=\"slabel g\" x=\"320\" y=\"52\" text-anchor=\"middle\">the circle touches all four sides<\/text><text class=\"slabel \" x=\"320\" y=\"22\" text-anchor=\"middle\">a circle in a square<\/text><text class=\"slabel  numtxt\" x=\"320\" y=\"390\" text-anchor=\"middle\">the share is π/4 ≈ 0.79 whatever the size<\/text><\/svg>"},"cb_lines":{"title":"Lines, crossings and angles, all at once","tag":"Geometry","say":"Five pictures, one idea. Angles are made where lines meet, and a few totals settle every one of them. Pick a picture with the buttons, then drag a line, an arm or a corner. Every number below moves with it. One angle is nearly always enough to give you all the others.","note":"","tries":["Drag either line in <b>two lines crossing<\/b>. The vertically opposite pair stays equal. Each neighbouring pair still makes a straight angle of 180°.","Swing the transversal in <b>two parallel lines<\/b>. Eight angles move, but only two different sizes ever show up among them.","In <b>the triangle<\/b>, drag the top corner. The three interior angles keep adding to 180°, and the exterior angle keeps matching the two far ones.","Open the arm in <b>cutting an angle in half<\/b>. The two green bisectors stay at a right angle, however uneven you make the two angles.","In <b>round one point<\/b>, drag any arm. All four angles change at once, and the full turn stays at 360° the whole time."],"ideas":[{"lead":"<b>Two crossing lines make four angles, and one of them fixes the rest.<\/b>","rest":"The two facing each other are vertically opposite angles, and they are equal. Any two sitting side by side make a straight angle of 180°.","f":"a = c · a + b = 180°"},{"lead":"<b>Nothing is solved at a crossing, you only take away.<\/b>","rest":"Given 50°, the angle next to it is 180 − 50 = 130°. The vertically opposite one is 50° again.","f":"b = 180° − a"},{"lead":"<b>Lay a transversal across two parallel lines and only two sizes appear.<\/b>","rest":"A transversal is one line cutting across both. Parallel means the two lines run the same way and never meet. Corresponding angles are equal, and so are alternate angles.","f":"corresponding angles are equal"},{"lead":"<b>The pair between the two parallel lines, on the same side, is the odd one out.<\/b>","rest":"That pair adds to 180° instead of being equal. It is the one readers turn the wrong way round.","f":"a + b = 180°"},{"lead":"<b>The three interior angles of a triangle add to 180°.<\/b>","rest":"So any two of them hand you the third, with no other working.","f":"A + B + C = 180°"},{"lead":"<b>Stretch one side past a corner and the exterior angle that opens up is the two far interior angles added.<\/b>","rest":"It saves the trip through the third angle.","f":"exterior angle = A + B"},{"lead":"<b>A bisector cuts an angle in half, so it halves what that angle brings to a total.<\/b>","rest":"Bisect the two angles on a straight line, and the two bisectors sit at a right angle.","f":"half of 180° = 90°"},{"lead":"<b>All the angles round one point share a full turn of 360°.<\/b>","rest":"Find the ones you were given, take them off 360, and what is left is the one you want.","f":"a + b + c + d = 360°"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><line x1=\"469.72\" y1=\"159.88\" x2=\"170.28\" y2=\"240.12\" style=\"stroke:var(--ink-2);stroke-width:2.4;fill:none\"><\/line><line x1=\"266.99\" y1=\"54.35\" x2=\"373.01\" y2=\"345.65\" style=\"stroke:var(--ink-2);stroke-width:2.4;fill:none\"><\/line><path style=\"stroke:var(--blue);stroke-width:1.8;fill:none\" d=\"M 343.18 193.79 A 24 24 0 0 0 311.79 177.45\"><\/path><text class=\"slabel b numtxt\" x=\"341.24\" y=\"163.2\" text-anchor=\"middle\">95°<\/text><path style=\"stroke:var(--green);stroke-width:1.8;fill:none\" d=\"M 311.79 177.45 A 24 24 0 0 0 296.82 206.21\"><\/path><text class=\"slabel g numtxt\" x=\"279.2\" y=\"182.76\" text-anchor=\"middle\">85°<\/text><path style=\"stroke:var(--blue);stroke-width:1.8;fill:none\" d=\"M 296.82 206.21 A 24 24 0 0 0 328.21 222.55\"><\/path><text class=\"slabel b numtxt\" x=\"298.76\" y=\"244.8\" text-anchor=\"middle\">95°<\/text><path style=\"stroke:var(--green);stroke-width:1.8;fill:none\" d=\"M 328.21 222.55 A 24 24 0 0 0 343.18 193.79\"><\/path><text class=\"slabel g numtxt\" x=\"360.8\" y=\"225.24\" text-anchor=\"middle\">85°<\/text><circle cx=\"320\" cy=\"200\" r=\"3.5\" style=\"fill:var(--ink)\"><\/circle><circle class=\"handle\" cx=\"469.72\" cy=\"159.88\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"266.99\" cy=\"54.35\" r=\"8\"><\/circle><text class=\"slabel  numtxt\" x=\"320\" y=\"26\" text-anchor=\"middle\">vertically opposite angles are equal · two side by side make 180°<\/text><text class=\"slabel \" x=\"320\" y=\"384\" text-anchor=\"middle\">drag either dot to swing a line, and all four angles answer<\/text><\/svg>"},"cb_poly":{"title":"The many-sided shape, all at once","tag":"Geometry","say":"A polygon is a flat shape made of straight sides. This one is regular, which means every side is the same length and every corner the same size. Set how many sides it has. Set the radius, which runs from the centre out to a corner. Every polygon rule answers at the same time. The buttons swap what is drawn, so no single picture gets crowded. Drag the marked corner round and watch the readings stay put.","note":"Two things here are worth more than the rest. The first is this. The interior angles grow with n. The exterior angles never leave 360°. So a question that names one exterior angle of a regular polygon has already handed you n. The second is the area. The polygon is n thin triangles. Each stands on one side. Its height is the apothem, the distance from the centre straight to a side. Each triangle is ½ × side × apothem. The n bases add up to the perimeter. So the whole area is ½ × apothem × perimeter.","tries":["Push the sides slider from 3 up to 12. The interior angles add to more at every step. The exterior angles still add to 360° in all.","Open <b>the two circles<\/b> and raise the number of sides. The polygon swells out to fill its circle, from 41% at 3 sides to 96% at 12.","Open <b>the diagonals<\/b> and drag the marked corner round. Every corner reaches the same number of far corners, so the count never moves.","Set the sides to 6. The side and the radius come out equal. Only six sides does that, so check it at 5 and at 7.","Open <b>n triangles<\/b> and count them. The area is n copies of one thin triangle. That is where ½ × apothem × perimeter comes from.","Open <b>apothem and radius<\/b>. The radius goes to a corner. The apothem goes straight to a side. The gap between them shuts as n grows."],"ideas":[{"lead":"<b>The interior angles of a polygon add to (n − 2) × 180°.<\/b>","rest":"Join one corner to every corner that is not next to it. The polygon falls into n − 2 triangles. Each one holds 180°.","f":"S = (n − 2) × 180°"},{"lead":"<b>Regular means every interior angle is the same size.<\/b>","rest":"So divide that total by n and you have one angle. Only divide when the polygon really is regular.","f":"each angle = (n − 2) × 180° ÷ n"},{"lead":"<b>The exterior angles always add to 360°.<\/b>","rest":"Walk once round the outside and you finish facing the way you started. That is one full turn, whatever n is.","f":"sum of the exterior angles = 360°"},{"lead":"<b>At one corner the interior and exterior angles add to 180°.<\/b>","rest":"They sit along the same straight line. So each one hands you the other at once.","f":"interior + exterior = 180°"},{"lead":"<b>A diagonal joins two corners that are not next to each other.<\/b>","rest":"Each corner misses itself and its two neighbours, so it reaches n − 3 others. Every diagonal gets counted twice, once from each end.","f":"D = n(n − 3) ÷ 2"},{"lead":"<b>Two different distances run out from the centre.<\/b>","rest":"The radius R reaches a corner. The apothem a is the distance from the centre straight to a side. R is always the longer of the two.","f":"a² + (s ÷ 2)² = R²"},{"lead":"<b>The area is n equal triangles.<\/b>","rest":"Each one stands on a side and is as tall as the apothem. Add them up and the bases make the perimeter.","f":"A = ½ × a × P"},{"lead":"<b>More sides means closer to a circle.<\/b>","rest":"The polygon fills more of the circle through its corners at every step. By 12 sides it already fills 95.5% of it.","f":"A → πR² as n grows"},{"lead":"<b>Six sides is the one to know by heart.<\/b>","rest":"The side equals the radius. So a regular hexagon splits into six triangles with all three sides equal.","f":"s = R · A = (3√3 ÷ 2)s²"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><polygon points=\"349.8,298.26 250.2,298.26 200.4,212 250.2,125.74 349.8,125.74 399.6,212\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2;stroke-linejoin:round\"><\/polygon><line x1=\"250.2\" y1=\"125.74\" x2=\"399.6\" y2=\"212\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"250.2\" y1=\"125.74\" x2=\"349.8\" y2=\"298.26\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"250.2\" y1=\"125.74\" x2=\"250.2\" y2=\"298.26\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><path class=\"arcline\" d=\"M 357.8 284.4 A 16 16 0 0 0 333.8 298.26\"><\/path><path class=\"arcline\" d=\"M 266.2 298.26 A 16 16 0 0 0 242.2 284.4\"><\/path><path class=\"arcline\" d=\"M 208.4 225.86 A 16 16 0 0 0 208.4 198.14\"><\/path><path class=\"arcline\" d=\"M 242.2 139.6 A 16 16 0 0 0 266.2 125.74\"><\/path><path class=\"arcline\" d=\"M 333.8 125.74 A 16 16 0 0 0 357.8 139.6\"><\/path><path class=\"arcline\" d=\"M 391.6 198.14 A 16 16 0 0 0 391.6 225.86\"><\/path><text class=\"slabel b numtxt\" x=\"237.2\" y=\"107.23\" text-anchor=\"end\">120°<\/text><text class=\"slabel  numtxt\" x=\"320\" y=\"22\" text-anchor=\"middle\">the interior angles: (6 − 2) × 180° = 720°<\/text><text class=\"slabel g numtxt\" x=\"320\" y=\"44\" text-anchor=\"middle\">4 triangles from one corner, each holding 180°<\/text><text class=\"slabel b numtxt\" x=\"320\" y=\"388\" text-anchor=\"middle\">every corner is the same, so each is 720 ÷ 6 = 120°<\/text><circle class=\"handle\" cx=\"250.2\" cy=\"125.74\" r=\"8\"><\/circle><\/svg>"},"cb_quads":{"title":"Quadrilaterals, all at once","tag":"Geometry","say":"One picture, five quadrilaterals. Parallel means two lines that run the same way and never meet. Press a button to swap the shape. You get a rectangle and a parallelogram. A rhombus and a trapezoid are there too. The fifth one is a square. Drag the corners or move the sliders. The area and the perimeter answer at once. The height and the two diagonals answer too. So do the four angles.","note":"","tries":["Press <b>parallelogram<\/b> and move the lean slider. The area never moves. The height never changed, so nothing else could.","Press <b>rhombus<\/b> and move the lean slider. All four sides keep their length. The area still falls. Equal sides never promise equal area.","Press <b>trapezoid<\/b> and make the top side very short. The middle bar drops towards the small rectangle. Now make the top side match the bottom. All three bars then line up.","Press <b>rectangle<\/b>. The two diagonals are the same length. Lean it over and they stop matching. They still cut each other in half.","Press <b>rhombus<\/b> and watch the two diagonals. They cross at a right angle every time. Half their product is the area."],"ideas":[{"lead":"<b>A rectangle is its length times its width.<\/b>","rest":"The perimeter is the two lengths and the two widths added up. The two answers pull apart fast.","f":"A = l × w &nbsp;·&nbsp; P = 2(l + w)"},{"lead":"<b>A parallelogram keeps base times height.<\/b>","rest":"Both pairs of opposite sides are parallel. Push it over and no area is lost.","f":"A = base × height"},{"lead":"<b>The height is measured at a right angle to the base.<\/b>","rest":"The slanted side is longer. It is the wrong number to use.","f":"height, not the slanted side"},{"lead":"<b>Lean it further and the area falls.<\/b>","rest":"Every side keeps its length. The shape only gets flatter. The angle between two sides settles how much they hold.","f":"A = a × b × sin θ"},{"lead":"<b>A trapezoid uses the average of its two parallel sides.<\/b>","rest":"Add the two parallel sides and halve that. Then multiply by the height.","f":"A = ½(a + b) × h"},{"lead":"<b>That answer always sits between two rectangles.<\/b>","rest":"One rectangle stands on the short parallel side. The other stands on the long one. Both use the same height.","f":"short × h ≤ area ≤ long × h"},{"lead":"<b>A square is settled by one number.<\/b>","rest":"Its side hands you the area and the perimeter. It hands you the diagonal as well.","f":"A = s² &nbsp; P = 4s &nbsp; d = s√2"},{"lead":"<b>A rhombus has four equal sides.<\/b>","rest":"Its two diagonals cross at a right angle. So half their product is the area.","f":"A = ½ × d<sub>1<\/sub> × d<sub>2<\/sub>"},{"lead":"<b>The diagonal of a rectangle is the hypotenuse of a right triangle.<\/b>","rest":"The two sides of the rectangle are the short sides of it.","f":"d = √(l² + w²)"},{"lead":"<b>The two diagonals tell you which quadrilateral you have.<\/b>","rest":"They cut each other in half in any parallelogram. They match in length only when the corners are right angles.","f":"cut in half · equal · at 90°"},{"lead":"<b>The four angles always add to 360°.<\/b>","rest":"A quadrilateral splits into two triangles. Each triangle holds 180°.","f":"(4 − 2) × 180° = 360°"},{"lead":"<b>Opposite sides equal means opposite angles equal too.<\/b>","rest":"Any two angles next to each other then add to 180°. The two parallel sides run the same way.","f":"P = 2(a + b)"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 500\"><polygon points=\"165,340 385,340 385,208 165,208\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2;stroke-linejoin:round\"><\/polygon><line x1=\"165\" y1=\"340\" x2=\"385\" y2=\"340\" style=\"stroke:var(--green);stroke-width:3.5;fill:none\"><\/line><line x1=\"165\" y1=\"208\" x2=\"165\" y2=\"340\" style=\"stroke:var(--red);stroke-width:2.6;fill:none\"><\/line><text class=\"slabel r\" x=\"154\" y=\"278\" text-anchor=\"end\">h<\/text><line x1=\"165\" y1=\"340\" x2=\"385\" y2=\"208\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><line x1=\"385\" y1=\"340\" x2=\"165\" y2=\"208\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><circle cx=\"275\" cy=\"274\" r=\"4\" style=\"fill:var(--panel);stroke:var(--green);stroke-width:2.2\"><\/circle><text class=\"slabel b numtxt\" x=\"325.69\" y=\"262.75\" text-anchor=\"middle\">d1<\/text><text class=\"slabel b numtxt\" x=\"237.69\" y=\"240.45\" text-anchor=\"middle\">d2<\/text><path style=\"stroke:var(--green);stroke-width:1.6;fill:none\" d=\"M 175 340 L 175 330 L 165 330\"><\/path><text class=\"slabel g numtxt\" x=\"145.91\" y=\"358\" text-anchor=\"middle\">90°<\/text><path style=\"stroke:var(--green);stroke-width:1.6;fill:none\" d=\"M 385 330 L 375 330 L 375 340\"><\/path><text class=\"slabel g numtxt\" x=\"404.09\" y=\"358\" text-anchor=\"middle\">90°<\/text><path style=\"stroke:var(--green);stroke-width:1.6;fill:none\" d=\"M 375 208 L 375 218 L 385 218\"><\/path><text class=\"slabel g numtxt\" x=\"404.09\" y=\"192.91\" text-anchor=\"middle\">90°<\/text><path style=\"stroke:var(--green);stroke-width:1.6;fill:none\" d=\"M 165 218 L 175 218 L 175 208\"><\/path><text class=\"slabel g numtxt\" x=\"145.91\" y=\"192.91\" text-anchor=\"middle\">90°<\/text><text class=\"slabel g numtxt\" x=\"275\" y=\"374\" text-anchor=\"middle\">bottom side = 10<\/text><text class=\"slabel b numtxt\" x=\"275\" y=\"174\" text-anchor=\"middle\">top side = 10<\/text><text class=\"slabel  numtxt\" x=\"415\" y=\"278\" text-anchor=\"middle\">6<\/text><circle class=\"handle\" cx=\"385\" cy=\"340\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"385\" cy=\"208\" r=\"8\"><\/circle><text class=\"slabel g numtxt\" x=\"340\" y=\"24\" text-anchor=\"middle\">base 10 · height 6 · area = ½(10 + 10) × 6 = 60<\/text><text class=\"slabel b numtxt\" x=\"340\" y=\"42\" text-anchor=\"middle\">d1 = 11.66 · d2 = 11.66 · they cross at 61.9° · each cuts the other in half<\/text><text class=\"slabel  numtxt\" x=\"340\" y=\"60\" text-anchor=\"middle\">four right angles · both diagonals measure 11.66<\/text><line x1=\"40\" y1=\"388\" x2=\"640\" y2=\"388\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel \" x=\"340\" y=\"406\" text-anchor=\"middle\">both parallel sides are the same, so all three hold the same<\/text><rect x=\"212\" y=\"423\" width=\"340\" height=\"14\" style=\"fill:var(--ink-3);fill-opacity:.35\"><\/rect><text class=\"slabel  numtxt\" x=\"202\" y=\"434\" text-anchor=\"end\">10 × 6<\/text><text class=\"slabel  numtxt\" x=\"561\" y=\"434\" text-anchor=\"start\">60<\/text><rect x=\"212\" y=\"449\" width=\"340\" height=\"14\" style=\"fill:var(--green);fill-opacity:.5\"><\/rect><text class=\"slabel g\" x=\"202\" y=\"460\" text-anchor=\"end\">this shape<\/text><text class=\"slabel g numtxt\" x=\"561\" y=\"460\" text-anchor=\"start\">60<\/text><rect x=\"212\" y=\"475\" width=\"340\" height=\"14\" style=\"fill:var(--ink-3);fill-opacity:.35\"><\/rect><text class=\"slabel  numtxt\" x=\"202\" y=\"486\" text-anchor=\"end\">10 × 6<\/text><text class=\"slabel  numtxt\" x=\"561\" y=\"486\" text-anchor=\"start\">60<\/text><\/svg>"},"cb_right":{"title":"The right angle, and everything that comes out of it","tag":"Geometry","say":"Set the two short sides. The hypotenuse answers, and so does every rule that leans on it. The buttons show the same triangle six ways. The squares view is the rule itself, drawn as three real squares whose areas add up.","note":"Two habits are worth more than the rest of this board. Name the hypotenuse before you write anything down, because the wrong choice is always on the answer list. And learn the whole-number sets. A question built on 5-12-13 is a five-second question once you see it, and a page of working once you do not.","tries":["Set the sides to 3 and 4. The two small squares hold 9 and 16 cells. The big one holds 25, and 25 is 5 squared.","Press <b>the sets worth knowing<\/b> and try 6 and 8, then 9 and 12. Both light up, because both are 3-4-5 grown bigger.","Press <b>backwards<\/b>. Now the hypotenuse and one short side are given. The missing one comes from taking squares away instead of adding them.","Press <b>half a square<\/b>. The two short sides are equal, so the hypotenuse is a side times √2. The other two angles are 45° each.","Press <b>the box<\/b>. The diagonal through a box uses the rule twice: flat across the floor first, then standing up."],"ideas":[{"lead":"<b>Name the hypotenuse first.<\/b>","rest":"It is the side facing the right angle, and it is always the longest of the three. Everything else on this board depends on getting that right.","f":"a² + b² = c²"},{"lead":"<b>The rule runs backwards too.<\/b>","rest":"If you know the hypotenuse and one short side, take the squares away instead of adding them.","f":"b = √(c² − a²)"},{"lead":"<b>Some whole-number sets fit the rule exactly.<\/b>","rest":"Knowing them skips the sums. Every multiple of a set works as well.","f":"3-4-5 · 5-12-13 · 8-15-17 · 7-24-25"},{"lead":"<b>Half a square gives one fixed shape.<\/b>","rest":"Cut a square along its diagonal. The two short sides are equal. The hypotenuse is a side times √2, because s² + s² = 2s².","f":"1 : 1 : √2"},{"lead":"<b>Half an equal-sided triangle gives the other fixed shape.<\/b>","rest":"The shortest side is half the hypotenuse. The middle side is the shortest times √3.","f":"1 : √3 : 2"},{"lead":"<b>A triangle with two equal sides has two equal angles.<\/b>","rest":"They are the angles facing those two sides. When all three sides are equal, all three angles are 60°.","f":"equal sides → equal angles"},{"lead":"<b>When all three sides are equal there is a shortcut for the area.<\/b>","rest":"Cut the triangle down the middle. The height comes out as the side times √3 divided by 2. Half of base times height then gives the shortcut.","f":"A = (√3/4)s²"},{"lead":"<b>The rule in disguise.<\/b>","rest":"The diagonal of a rectangle uses it once. The diagonal through a box uses it twice.","f":"d = √(l² + w² + h²)"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 660 420\"><polygon points=\"264.55,265.09 264.55,166.91 166.36,166.91 166.36,265.09\" style=\"fill:var(--green);fill-opacity:.14;stroke:var(--green);stroke-width:1.8\"><\/polygon><polygon points=\"264.55,265.09 395.45,265.09 395.45,396 264.55,396\" style=\"fill:var(--blue);fill-opacity:.14;stroke:var(--blue);stroke-width:1.8\"><\/polygon><polygon points=\"264.55,166.91 395.45,265.09 493.64,134.18 362.73,36\" style=\"fill:var(--amber);fill-opacity:.16;stroke:var(--amber);stroke-width:1.8\"><\/polygon><polygon points=\"264.55,265.09 264.55,166.91 395.45,265.09\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2;stroke-linejoin:round\"><\/polygon><path style=\"stroke:var(--green);stroke-width:1.6;fill:none\" d=\"M 264.55 253.09 L 276.55 253.09 L 276.55 265.09\"><\/path><text class=\"slabel g numtxt\" x=\"215.45\" y=\"221\" text-anchor=\"middle\">a² = 9<\/text><text class=\"slabel b numtxt\" x=\"330\" y=\"335.55\" text-anchor=\"middle\">b² = 16<\/text><text class=\"slabel a numtxt\" x=\"379.09\" y=\"155.55\" text-anchor=\"middle\">c² = 25<\/text><text class=\"slabel  numtxt\" x=\"330\" y=\"22\" text-anchor=\"middle\">9 + 16 = 25, so the hypotenuse is 5<\/text><\/svg>"},"cb_scale":{"title":"Similar figures and the scale factor","tag":"Geometry","say":"Move the slider and the figure is copied at a new size. The copy is drawn beside the original. Two figures with the same shape but a different size are called similar figures. One number runs the whole change, and that number is the scale factor k. The slider counts k in quarters, so k lands on exact fractions like 3/4. Every length is multiplied by k. Every area is multiplied by k twice over, because an area is a length times a length. Every volume is multiplied by k three times over, because a volume is three lengths multiplied together. Drag a corner to change the figure itself, and the four buttons change what is drawn.","note":"Two things are worth carrying out of this board. The first is picking the right power of the scale factor k. Lengths use k. Areas use k squared, because an area is a length times a length. Volumes use k cubed, because a volume is three lengths multiplied together. The second is going the other way. An area ratio is not a length ratio. If the areas are 9 : 16, the lengths are 3 : 4. You get there by taking a square root of each side. The perimeter is 3 : 4 as well, because a perimeter is a length. The answer list will always offer you 9 : 16 too.","tries":["Set k to 2. The copy has sides twice as long, and four copies of the small figure fit inside it. The perimeter doubles while the area goes up four times.","Set k to 3/4. The lengths come out 3 : 4 and the areas come out 9 : 16. Read that backwards. Areas of 9 : 16 always mean lengths of 3 : 4.","Press <b>count the squares<\/b> and slide k. The two blocks of squares are the area ratio, drawn so you can count it instead of trusting it.","Drag a corner in the first view. The angles move, but the two figures still match angle for angle, and the sides still share one ratio.","Press <b>what it holds<\/b> and set k to 3. Lengths go up 3 times, areas 9 times, and the volume 27 times."],"ideas":[{"lead":"<b>One number runs the whole change of size.<\/b>","rest":"That number is the scale factor k. Two figures with the same shape but a different size are called similar figures.","f":"every length × k"},{"lead":"<b>Area does not grow at the same rate as length.<\/b>","rest":"An area is a length times a length. Both of those lengths are multiplied by k, so k is used twice. The area is multiplied by k times k.","f":"area × k²"},{"lead":"<b>Volume grows faster still.<\/b>","rest":"A volume is a length times a length times a length. All three of those lengths are multiplied by k, so k is used three times.","f":"volume × k³"},{"lead":"<b>The perimeter is a length, so it grows with k.<\/b>","rest":"The perimeter is only the sides added up. It never grows with k squared.","f":"perimeter × k"},{"lead":"<b>Going backwards from an area ratio needs a square root.<\/b>","rest":"A length was multiplied by a length to make the area. A square root undoes that. Areas of 9 : 16 mean lengths of 3 : 4.","f":"areas p : q → lengths √p : √q"},{"lead":"<b>Matching angles stay equal and matching sides share one ratio.<\/b>","rest":"That pair of facts is what similar figures means. Size never touches an angle.","f":"a′/a = b′/b = c′/c"},{"lead":"<b>A line across a triangle parallel to one side cuts off a similar figure.<\/b>","rest":"Two lines are parallel when they run the same way for ever and never meet. The small triangle and the whole one share one scale factor.","f":"lengths r : 1 · areas r² : 1"},{"lead":"<b>Two triangles are similar figures as soon as their angles match.<\/b>","rest":"The third angle is forced by the 180° total. So two matching angles are enough, and no length has to be worked out.","f":"angles match → sides in one ratio"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><polygon points=\"56,352 166,352 100,264\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2;stroke-linejoin:round\"><\/polygon><polygon points=\"313,352 533,352 401,176\" style=\"fill:var(--green);fill-opacity:.18;stroke:var(--green);stroke-width:2.2;stroke-linejoin:round\"><\/polygon><line x1=\"423\" y1=\"352\" x2=\"357\" y2=\"264\" style=\"stroke:var(--ink-3);stroke-width:1;fill:none\"><\/line><line x1=\"423\" y1=\"352\" x2=\"467\" y2=\"264\" style=\"stroke:var(--ink-3);stroke-width:1;fill:none\"><\/line><line x1=\"357\" y1=\"264\" x2=\"467\" y2=\"264\" style=\"stroke:var(--ink-3);stroke-width:1;fill:none\"><\/line><path class=\"arcline\" d=\"M 70 352 A 14 14 0 0 0 62.26 339.48\"><\/path><path class=\"arcline\" d=\"M 157.6 340.8 A 14 14 0 0 0 152 352\"><\/path><path class=\"arcline\" d=\"M 93.74 276.52 A 14 14 0 0 0 108.4 275.2\"><\/path><path class=\"arcline\" d=\"M 327 352 A 14 14 0 0 0 319.26 339.48\"><\/path><path class=\"arcline\" d=\"M 524.6 340.8 A 14 14 0 0 0 519 352\"><\/path><path class=\"arcline\" d=\"M 394.74 188.52 A 14 14 0 0 0 409.4 187.2\"><\/path><circle class=\"handle\" cx=\"166\" cy=\"352\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"100\" cy=\"264\" r=\"8\"><\/circle><text class=\"slabel  numtxt\" x=\"320\" y=\"24\" text-anchor=\"middle\">lengths × 2 &nbsp; areas × 4 &nbsp; volume × 8<\/text><text class=\"slabel b numtxt\" x=\"320\" y=\"44\" text-anchor=\"middle\">similar figures: matching angles are equal · matching sides are 2 : 1<\/text><text class=\"slabel r numtxt\" x=\"320\" y=\"62\" text-anchor=\"middle\">the big one holds 2 × 2 = 4 copies of the small one<\/text><text class=\"slabel b numtxt\" x=\"111\" y=\"372\" text-anchor=\"middle\">perimeter = 14.47<\/text><text class=\"slabel r numtxt\" x=\"111\" y=\"392\" text-anchor=\"middle\">area = 10<\/text><text class=\"slabel g numtxt\" x=\"423\" y=\"372\" text-anchor=\"middle\">perimeter 14.47 × 2 = 28.94<\/text><text class=\"slabel g numtxt\" x=\"423\" y=\"392\" text-anchor=\"middle\">area 10 × 4 = 40<\/text><\/svg>"},"cb_solid":{"title":"Solids at once: the box, the cylinder, the sphere and the pyramid","tag":"Geometry","say":"Pick a solid with the buttons. Then set its size with the sliders. The volume and the surface area both answer at once. The box uses length, width and height. The cylinder uses radius and height. The sphere uses radius alone. The pyramid uses the length slider as its base side. Pouring uses the first cylinder and the wider one.","note":"","tries":["Push the <b>width<\/b> slider from end to end with the box showing. The volume and the surface area both climb fast. The space diagonal climbs far more slowly.","Switch to <b>the cylinder<\/b> and double the radius. The volume jumps to four times. Put the radius back and double the height instead. That only doubles it.","Switch to <b>the sphere<\/b> and slide the radius. Nothing else can move. One number fixes everything about a sphere.","Switch to <b>the pyramid<\/b> and watch the three lines. The slant edge stays longer than the slant height. Both stay longer than the upright height. That check is free.","Switch to <b>pouring<\/b> and set the wider cylinder to twice the first radius. The new depth is a quarter of the old one."],"ideas":[{"lead":"<b>Volume is the base area times the height.<\/b>","rest":"A box works this way and so does a cylinder. The base is a rectangle in one. It is a circle in the other.","f":"V = base area × height"},{"lead":"<b>A box has six faces in three matching pairs.<\/b>","rest":"Work out three of them. Add them up, then double. Dropping that doubling is the common slip.","f":"SA = 2(lw + lh + wh)"},{"lead":"<b>The space diagonal is Pythagoras used twice.<\/b>","rest":"Cross the base first. Then climb the height. Each step is its own right triangle.","f":"d = √(l² + w² + h²)"},{"lead":"<b>In a cylinder the radius is squared and the height is not.<\/b>","rest":"So they never grow alike. Double the radius and the volume goes up four times. Double the height and it only doubles.","f":"V = πr²h"},{"lead":"<b>A cylinder is two circular ends and one curved wall.<\/b>","rest":"Unroll the wall and it is a rectangle. Its width is the circumference of one end. Its height is the height of the cylinder.","f":"SA = 2πr² + 2πrh"},{"lead":"<b>A sphere's surface area is four of its own flat circles.<\/b>","rest":"Its volume needs the radius cubed. So the volume grows faster than anything else here.","f":"V = (4/3)πr³ · SA = 4πr²"},{"lead":"<b>A pyramid holds one third of the box around it.<\/b>","rest":"Same base, same height. One third of the room inside.","f":"V = ⅓ × base area × height"},{"lead":"<b>A pyramid holds two right triangles, and they give different answers.<\/b>","rest":"Run flat to the middle of a side and you get the slant height. Run flat to a corner and you get the slant edge.","f":"slant height = √(h² + (s÷2)²)"},{"lead":"<b>A cone is the same idea with a round base.<\/b>","rest":"It holds one third of the cylinder that shares its base and height. Its slant height runs from the tip down to the rim.","f":"V = ⅓πr²h · SA = πr² + πr × slant height"},{"lead":"<b>Pouring keeps the volume of liquid the same.<\/b>","rest":"The new depth is that volume shared over the new base area. The π cancels every time.","f":"depth = volume ÷ base area"},{"lead":"<b>Scale every length by k and the volume goes up by k cubed.<\/b>","rest":"The surface area only goes up by k squared. A length itself just goes up by k.","f":"length ×k · area ×k² · volume ×k³"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 430\"><polygon points=\"180.85,136.21 236.28,136.21 236.28,302.5 180.85,302.5\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2;stroke-linejoin:round\"><\/polygon><line x1=\"180.85\" y1=\"302.5\" x2=\"203.72\" y2=\"283.79\" style=\"stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:5 4;fill:none\"><\/line><line x1=\"203.72\" y1=\"283.79\" x2=\"203.72\" y2=\"117.5\" style=\"stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:5 4;fill:none\"><\/line><line x1=\"203.72\" y1=\"283.79\" x2=\"259.15\" y2=\"283.79\" style=\"stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:5 4;fill:none\"><\/line><line x1=\"180.85\" y1=\"136.21\" x2=\"203.72\" y2=\"117.5\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><line x1=\"236.28\" y1=\"136.21\" x2=\"259.15\" y2=\"117.5\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><line x1=\"236.28\" y1=\"302.5\" x2=\"259.15\" y2=\"283.79\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><line x1=\"203.72\" y1=\"117.5\" x2=\"259.15\" y2=\"117.5\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><line x1=\"259.15\" y1=\"117.5\" x2=\"259.15\" y2=\"283.79\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><line x1=\"180.85\" y1=\"302.5\" x2=\"259.15\" y2=\"283.79\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><line x1=\"259.15\" y1=\"283.79\" x2=\"259.15\" y2=\"117.5\" style=\"stroke:var(--red);stroke-width:3;fill:none\"><\/line><line x1=\"180.85\" y1=\"302.5\" x2=\"259.15\" y2=\"117.5\" style=\"stroke:var(--red);stroke-width:3;fill:none\"><\/line><path style=\"stroke:var(--green);stroke-width:1.6;fill:none\" d=\"M 249.42 286.12 L 249.42 276.12 L 259.15 273.79\"><\/path><text class=\"slabel b numtxt\" x=\"208.57\" y=\"324.5\" text-anchor=\"middle\">l = 4<\/text><text class=\"slabel b numtxt\" x=\"171.85\" y=\"223.35\" text-anchor=\"end\">h = 12<\/text><text class=\"slabel b numtxt\" x=\"259.72\" y=\"120.85\" text-anchor=\"start\">w = 3<\/text><text class=\"slabel g numtxt\" x=\"340\" y=\"22\" text-anchor=\"middle\">volume = 4 × 3 × 12 = 144<\/text><text class=\"slabel r numtxt\" x=\"340\" y=\"40\" text-anchor=\"middle\">space diagonal, step 1 — the base diagonal: √(16 + 9) = 5<\/text><text class=\"slabel r numtxt\" x=\"340\" y=\"58\" text-anchor=\"middle\">step 2 — then up the height: √(25 + 144) = 13<\/text><polygon points=\"460,290 518.33,290 518.33,150\" style=\"fill:var(--red);fill-opacity:.07;stroke:none\"><\/polygon><line x1=\"460\" y1=\"290\" x2=\"518.33\" y2=\"290\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><line x1=\"518.33\" y1=\"290\" x2=\"518.33\" y2=\"150\" style=\"stroke:var(--red);stroke-width:3;fill:none\"><\/line><line x1=\"460\" y1=\"290\" x2=\"518.33\" y2=\"150\" style=\"stroke:var(--red);stroke-width:3;fill:none\"><\/line><path style=\"stroke:var(--green);stroke-width:1.6;fill:none\" d=\"M 508.33 290 L 508.33 280 L 518.33 280\"><\/path><text class=\"slabel \" x=\"535\" y=\"130\" text-anchor=\"middle\">the same two steps, drawn flat<\/text><text class=\"slabel r numtxt\" x=\"489.17\" y=\"312\" text-anchor=\"middle\">base diagonal = 5<\/text><text class=\"slabel b numtxt\" x=\"528.33\" y=\"224\" text-anchor=\"start\">h = 12<\/text><text class=\"slabel r numtxt\" x=\"535\" y=\"335\" text-anchor=\"middle\">space diagonal = 13<\/text><\/svg>"},"cb_spread":{"title":"Nine values you can drag","tag":"Statistics","say":"Nine dots sit on a number line. Drag any dot left or right and it lands on a whole number. The mean, the median, the mode, the range, the quartiles and the standard deviation all answer at the same time. Two markers sit under the line. The green one is the mean and the blue one is the median. Grey ghosts show where those two started, so you can see which one your dragging has moved.","note":"","tries":["Drag the dot on the far right out to 20. The green mean marker walks right with it. The blue median marker does not move at all. That one difference is most of this section.","Now drag a middle dot past its neighbour. This time the median jumps and the range stays still. The two markers have swapped jobs.","Pile four dots on one number. The mode jumps to that number. The standard deviation shrinks, because most of the values now sit close to the mean.","Press <b>the range and the quartiles<\/b>, then pull the far right dot out again. The range stretches and the interquartile range does not move at all.","Spread the nine dots out evenly. The mean and the median land on the same spot, and the line under the readings says so."],"ideas":[{"lead":"<b>The mean shares the total out evenly.<\/b>","rest":"Add the nine values, then divide by nine. Every dot has a say in it. Move one dot by one step and the mean moves one ninth of a step.","f":"mean = total ÷ how many"},{"lead":"<b>The median is the middle value after sorting.<\/b>","rest":"Positions run from 1 to n. The middle position is halfway between those two ends, at (n + 1) ÷ 2. With nine values that is the fifth one. A dot can move a long way and leave the median alone, as long as it stays on its own side.","f":"position of the median = (n + 1) ÷ 2"},{"lead":"<b>The mode is the value that turns up most often.<\/b>","rest":"If no value repeats there is no mode. Two values can tie for the top count, and then the list has two modes.","f":"mode = the value with the highest count"},{"lead":"<b>The range is the biggest take away the smallest.<\/b>","rest":"Only the two end dots matter to it. The seven dots in the middle can sit wherever they like.","f":"range = biggest − smallest"},{"lead":"<b>The quartiles cut the sorted list into four equal parts.<\/b>","rest":"Q1 is the first quartile and Q3 is the third. The median already sits halfway along the run of positions. Cut again and you land a quarter of the way along, at position (n + 1) ÷ 4.","f":"Q1 at (n + 1) ÷ 4 &nbsp;·&nbsp; Q3 at 3(n + 1) ÷ 4"},{"lead":"<b>The interquartile range is the gap from Q1 to Q3.<\/b>","rest":"Half of the nine values sit inside that middle half. One far-out dot cannot move it, and that is why it beats the range for saying how tight a list is.","f":"interquartile range = Q3 − Q1"},{"lead":"<b>The standard deviation is the typical distance from the mean.<\/b>","rest":"Square each gap from the mean, because squaring makes every gap positive. Raw gaps would cancel to nothing. Take the mean of those squares. Then take the square root, which brings you back to the first units.","f":"SD = √( Σ(x − M)² ÷ n )"},{"lead":"<b>The mean is the balance point of the dots.<\/b>","rest":"Add up the gaps of the dots on its left. Add up the gaps of the dots on its right. The two totals always match.","f":"Σ(x − M) = 0"},{"lead":"<b>One far-out value pulls the mean and leaves the median.<\/b>","rest":"So in a lopsided list the median is the fairer middle. A great many test questions turn on this one point.","f":"mean &gt; median means a long right tail"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 860 500\"><text class=\"slabel \" x=\"430\" y=\"26\" text-anchor=\"middle\">the mean walks with a far-out dot · the median does not<\/text><line x1=\"42\" y1=\"300\" x2=\"830\" y2=\"300\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"56\" y1=\"300\" x2=\"56\" y2=\"307\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"56\" y=\"322\" text-anchor=\"middle\">0<\/text><line x1=\"94\" y1=\"300\" x2=\"94\" y2=\"304\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"132\" y1=\"300\" x2=\"132\" y2=\"307\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"132\" y=\"322\" text-anchor=\"middle\">2<\/text><line x1=\"170\" y1=\"300\" x2=\"170\" y2=\"304\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"208\" y1=\"300\" x2=\"208\" y2=\"307\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"208\" y=\"322\" text-anchor=\"middle\">4<\/text><line x1=\"246\" y1=\"300\" x2=\"246\" y2=\"304\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"284\" y1=\"300\" x2=\"284\" y2=\"307\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"284\" y=\"322\" text-anchor=\"middle\">6<\/text><line x1=\"322\" y1=\"300\" x2=\"322\" y2=\"304\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"360\" y1=\"300\" x2=\"360\" y2=\"307\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"360\" y=\"322\" text-anchor=\"middle\">8<\/text><line x1=\"398\" y1=\"300
