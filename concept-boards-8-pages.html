<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Concept Boards in 8 Pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Source+Sans+3:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* The companion to GregMat in 10 Pages: the same printed-book page on a desk, here holding the twenty Concept Boards,
   one line per idea with its formula in ink-blue, the board's own picture at the head of each section. */
:root{
  --desk:#E9E7E1; --page:#FCFBF8; --panel:#FCFBF8; --panel-2:#F3F1EB;
  --ink:#1D2024; --ink-2:#464A50; --ink-3:#74787E;
  --line:#E3E0D8; --line-2:#CCC8BE;
  --blue:#23507D; --blue-2:#1A3F63; --blue-wash:rgba(35,80,125,.08);
  --red:#A63A2A; --red-wash:rgba(166,58,42,.09);
  --green:#2E7A57; --green-wash:rgba(46,122,87,.11);
  --amber:#946010;
  --shadow:0 1px 2px rgba(29,32,36,.06),0 18px 40px -28px rgba(29,32,36,.45);
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --fs:17px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#111315; --page:#1A1D20; --panel:#1A1D20; --panel-2:#22262A;
  --ink:#E8E6E1; --ink-2:#BAB7B0; --ink-3:#8D8A85;
  --line:#2C3035; --line-2:#3C4147;
  --blue:#8FB8E0; --blue-2:#B5D0EB; --blue-wash:rgba(143,184,224,.12);
  --red:#E58A77; --red-wash:rgba(229,138,119,.13);
  --green:#6FC59A; --green-wash:rgba(111,197,154,.13);
  --amber:#D8A84E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -26px rgba(0,0,0,.9);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#111315; --page:#1A1D20; --panel:#1A1D20; --panel-2:#22262A;
  --ink:#E8E6E1; --ink-2:#BAB7B0; --ink-3:#8D8A85;
  --line:#2C3035; --line-2:#3C4147;
  --blue:#8FB8E0; --blue-2:#B5D0EB; --blue-wash:rgba(143,184,224,.12);
  --red:#E58A77; --red-wash:rgba(229,138,119,.13);
  --green:#6FC59A; --green-wash:rgba(111,197,154,.13);
  --amber:#D8A84E;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -26px rgba(0,0,0,.9);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--desk);color:var(--ink)}
body{margin:0;font-family:var(--serif);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---- the bar above the page ---- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--desk) 92%,transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding-block:8px;padding-inline:16px}
@media (max-width:640px){.bar{position:static}}
.bar-in{max-width:52rem;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.btn{font-family:var(--sans);font-size:14px;font-weight:600;line-height:1;padding:8px 12px;border-radius:7px;border:1px solid var(--line-2);
  background:var(--page);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--page)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--page)}
.btn.pri:hover{color:var(--page);filter:brightness(1.08)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.seg .btn{border:0;border-radius:0}
.seg .btn+.btn{border-left:1px solid var(--line-2)}
.pager{display:flex;gap:3px;overflow-x:auto;max-width:100%;scrollbar-width:none;flex:1 1 auto;min-width:0}
.pager::-webkit-scrollbar{display:none}
.pg{font-family:var(--sans);font-size:13.5px;font-weight:700;min-width:30px;height:30px;padding:0 6px;border-radius:50%;border:1px solid transparent;
  background:transparent;color:var(--ink-2);cursor:pointer;font-variant-numeric:tabular-nums}
.pg:hover{border-color:var(--line-2)}
.pg[aria-current="page"]{background:var(--blue);color:var(--page)}
.pg.done{box-shadow:inset 0 -3px 0 var(--green)}
.tools{display:flex;gap:8px;align-items:center;margin-left:auto}

/* ---- the page ---- */
.wrap{padding-inline:clamp(0px,3vw,32px);padding-block:clamp(0px,3vw,28px) 40px}
.sheet{max-width:50rem;margin:0 auto;background:var(--page);border:1px solid var(--line);box-shadow:var(--shadow);
  padding-block:clamp(22px,5vw,52px) clamp(22px,4vw,40px);padding-inline:clamp(18px,6vw,64px);font-size:var(--fs);line-height:1.55;min-height:70vh}
@media (max-width:560px){.sheet{border-left:0;border-right:0}}
.turn{animation:turn .22s ease-out}
@keyframes turn{from{opacity:0;transform:translateX(var(--dx,10px))}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.turn{animation:none}}
.rhead{display:flex;justify-content:space-between;gap:12px;font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line);padding-bottom:8px;margin:0 0 26px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(1.55rem,4.2vw,2.15rem);line-height:1.15;letter-spacing:-.01em;margin:0 0 8px;text-wrap:balance}
.deck{font-style:italic;color:var(--ink-2);margin:0 0 6px;max-width:38em}
.meta{font-family:var(--sans);font-size:13.5px;color:var(--ink-3);margin:0 0 4px;font-variant-numeric:tabular-nums}

/* ---- one board = one section ---- */
.board{margin-top:34px}
.bhd{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;border-bottom:1.5px solid var(--blue);padding-bottom:6px}
.bhd h2{font-family:var(--serif);font-size:1.25rem;font-weight:700;line-height:1.25;margin:0;flex:1 1 16rem;min-width:0;text-wrap:balance}
.tag{font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.live{display:none;font-family:var(--sans);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--blue);
  background:var(--page);color:var(--blue);cursor:pointer;white-space:nowrap}
.live:hover{background:var(--blue-wash)}
.inkmf .live{display:inline-block}
.fig{margin:14px auto 4px;max-width:30rem;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);padding:8px}
.fig svg{display:block;width:100%;height:auto}
.fig .slabel{font-family:var(--mono);font-size:11px;fill:var(--ink-2)}
.fig .slabel.b{fill:var(--blue)} .fig .slabel.r{fill:var(--red)} .fig .slabel.g{fill:var(--green)} .fig .slabel.a{fill:var(--amber)}
.fig .arcline{fill:none;stroke:var(--amber);stroke-width:1.6}
.fig .handle{fill:var(--panel);stroke:var(--blue);stroke-width:2.5}
.fig figcaption{font-family:var(--sans);font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:6px}
.inkmf .fig figcaption .off{display:none}
.fig figcaption .on{display:none}
.inkmf .fig figcaption .on{display:inline}
.carry{margin:14px 0 4px;padding:10px 14px;border-left:3px solid var(--amber);background:var(--panel-2);border-radius:0 6px 6px 0;font-size:.94em;color:var(--ink-2)}
.carry b.lb{display:block;font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:2px}

/* ---- one idea = one line ---- */
.it{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,auto);column-gap:14px;align-items:start;padding:9px 0;border-bottom:1px dotted var(--line-2)}
.kn{width:22px;height:22px;margin-top:2px;border-radius:50%;border:1.5px solid var(--line-2);background:transparent;cursor:pointer;padding:0;
  display:grid;place-items:center;color:transparent;font-family:var(--sans);font-size:13px;font-weight:700;line-height:1}
.kn:hover{border-color:var(--green);color:var(--green)}
.it.known .kn{background:var(--green);border-color:var(--green);color:var(--page)}
.tt{all:unset;cursor:pointer;line-height:1.45;color:var(--ink);overflow-wrap:break-word;min-width:0}
.tt b{font-weight:600}
.tt:hover b,.tt[aria-expanded="true"] b{color:var(--blue)}
.tt:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:2px}
.it.known .tt{color:var(--ink-2)}
.fx{font-family:var(--serif);font-style:italic;color:var(--blue-2);text-align:right;max-width:20rem;overflow-wrap:break-word;line-height:1.45}
.cover .it:not(.shown) .fx,.cover .it:not(.shown) .more{filter:blur(6px);opacity:.55;cursor:pointer;user-select:none;-webkit-user-select:none}
.hideknown .it.known:not(.open){display:none}
.more{grid-column:2/-1;margin:6px 0 2px;color:var(--ink-2);font-size:.95em}
@media (max-width:640px){
  .it{grid-template-columns:26px minmax(0,1fr);row-gap:4px}
  .fx{grid-column:2;text-align:left;max-width:none}
}
details.try{margin:12px 0 0;font-size:.95em}
details.try summary{cursor:pointer;font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--ink-2)}
details.try ul{margin:8px 0 0;padding-left:20px;color:var(--ink-2)}
details.try li{margin:4px 0}

/* ---- end of page ---- */
.endmatter{margin-top:30px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.endmatter p{margin:0;font-family:var(--sans);font-size:14.5px;color:var(--ink-2)}
.endmatter .acts{display:flex;gap:8px;flex-wrap:wrap}
.foot{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:28px;padding-top:14px;border-top:1px solid var(--line)}
.nav{all:unset;cursor:pointer;font-family:var(--sans);font-size:14px;color:var(--ink-2);line-height:1.3;min-width:0}
.nav b{display:block;color:var(--blue);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.nav:hover{color:var(--ink)}
.nav.next{text-align:right}
.nav:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:3px}
.folio{font-family:var(--serif);font-style:italic;color:var(--ink-3);font-variant-numeric:oldstyle-nums}

/* ---- contents ---- */
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:10px 22px;margin:22px 0 6px;padding:0;list-style:none;
  font-family:var(--sans);font-size:15px;color:var(--ink-2)}
.howto li{min-width:0}
.howto b{color:var(--ink)}
.toc{list-style:none;margin:26px 0 0;padding:0}
.toc li{border-bottom:1px dotted var(--line-2)}
.toc button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:4px 12px;width:100%;padding:12px 0;align-items:baseline}
.toc button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.toc .no{font-family:var(--serif);font-weight:700;font-size:1.35rem;color:var(--blue);font-variant-numeric:lining-nums tabular-nums}
.toc .k{display:block;font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.toc .t{font-weight:600;line-height:1.3}
.toc .bs{display:block;font-size:.88em;color:var(--ink-3);margin-top:2px}
.toc button:hover .t{color:var(--blue)}
.toc .c{font-family:var(--sans);font-size:13.5px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.toc .c i{font-style:normal;color:var(--green);font-weight:700}
.prog{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden;grid-column:2/-1}
.prog i{display:block;height:100%;background:var(--green);border-radius:2px}
.cont{margin:22px 0 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.small{font-family:var(--sans);font-size:13.5px;color:var(--ink-3)}

/* ---- the formula check ---- */
.qz{position:fixed;inset:0;z-index:20;background:rgba(17,19,21,.45);display:grid;place-items:center;padding:16px}
.qz[hidden]{display:none}
.qzp{width:min(36rem,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--page);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:20px 22px}
.qzh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink-3);margin:0 0 10px}
.qz .tag{display:block;margin:0 0 6px}
.qz .q{font-size:16px;line-height:1.55;margin:0 0 4px}
.qz .ask{font-family:var(--sans);font-size:13.5px;color:var(--ink-3);margin:0 0 10px}
.ch{display:flex;flex-direction:column;gap:6px;margin:0 0 8px}
.ch button{display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:15px;padding:8px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--page);color:var(--ink);cursor:pointer}
.ch button .lt{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--ink-3);padding-top:2px}
.ch button .ft{font-style:italic}
.ch button:hover{border-color:var(--blue)}
.ch button.right{border-color:var(--green);background:var(--green-wash)}
.ch button.wrong{border-color:var(--red);background:var(--red-wash)}
.ch button[disabled]{cursor:default}
.qz .why{font-size:15px;line-height:1.55;margin:4px 0 12px;padding:10px 12px;border-radius:6px;background:var(--panel-2)}
.qz .why b{color:var(--green)}
.qz .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.score{font-family:var(--serif);font-size:2.2rem;font-weight:700;margin:4px 0}
.missed{margin:8px 0 14px;padding-left:20px}
.missed li{margin:3px 0}
</style>
</head>

<div class="bar" role="navigation" aria-label="Book">

    <button type="button" class="btn" id="tocBtn">Contents</button>
    <div class="pager" id="pager" aria-label="Pages"></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Reading mode">
        <button type="button" class="btn" id="modeRead">Read</button>
        <button type="button" class="btn" id="modeCover" title="Hide every formula so you can say it first, then tap to check">Cover</button>
      </div>
      <button type="button" class="btn" id="hideBtn" aria-pressed="false" title="Hide the ideas you have ticked">Hide ✓</button>
      <button type="button" class="btn" id="sizeBtn" title="Text size" aria-label="Text size">Aa</button>
    </div>
  </div>
</div>
<div class="wrap"><main class="sheet" id="sheet" aria-live="polite"></main></div>

<script type="application/json" id="cb-data">{"pages":[{"n":1,"kicker":"Geometry · I","title":"Lines and Triangles","boards":["cb_lines","cb_tri"],"deck":"Angles where lines cross, then the triangle: its angle sum, its area, and the window for its third side."},{"n":2,"kicker":"Geometry · II","title":"Right Angles and Similar Figures","boards":["cb_right","cb_scale"],"deck":"Pythagoras and the special right triangles, then what one scale factor does to every length, area and volume."},{"n":3,"kicker":"Geometry · III","title":"Quadrilaterals and Polygons","boards":["cb_quads","cb_poly"],"deck":"The four-sided family and the area of each, then shapes with any number of sides."},{"n":4,"kicker":"Geometry · IV","title":"Circles","boards":["cb_circle","cb_inscribed"],"deck":"One circle and every rule it carries, then shapes drawn inside and around each other."},{"n":5,"kicker":"Geometry · V","title":"Area, Perimeter and Solids","boards":["cb_cut","cb_shapes","cb_solid"],"deck":"Cutting a piece out of a shape, flat shapes and the solids they grow into, and the volume and surface of each solid."},{"n":6,"kicker":"Coordinate Geometry","title":"Points, Lines and Curves on the Grid","boards":["cb_line","cb_grid","cb_curve"],"deck":"Slope, intercepts, distance and midpoint, shapes placed on the grid, and where a curve meets a line."},{"n":7,"kicker":"Statistics","title":"Spread, the Normal Curve and Weighted Averages","boards":["cb_spread","cb_normal","cb_groups"],"deck":"Mean, median and spread on values you can move, the bell curve, and two groups joined into one average."},{"n":8,"kicker":"Data Analysis","title":"Overlaps, Counting and Chance","boards":["cb_sets","cb_count","cb_prob"],"deck":"Two groups that overlap, choosing and arranging, and a two-stage chance tree."}],"boards":{"cb_circle":{"title":"The circle, all at once","tag":"Geometry","say":"Set the size of the circle, set the angle of the slice, and drag the point on the edge. Every circle rule answers at the same time. The four buttons swap what is drawn, so no single picture gets crowded. Every answer with a curve in it is left as a multiple of pi, the way the exam writes it.","note":"One thing is worth carrying out of this board above the rest. A slice is a fraction. A full turn is 360°, so the angle over 360 is that fraction. It is then the same fraction of the circumference and of the area. The second thing: leave pi standing. A circle answer is written as a multiple of pi, so 12π is the answer and 37.7 is not. The third: the angle at the middle is twice the angle at the edge. A question that hands you one of them has already handed you the other.","tries":["Change the radius and watch the circumference grow in step with it. The area grows much faster. Double the radius and the area goes up four times.","Open the slice to 90°. The arc is a quarter of the circumference. The slice is a quarter of the area. One fraction, used twice.","Switch to <b>two angles<\/b> and drag the point on the edge. The angle at the edge never changes, and it is always half the angle at the middle.","Open the slice to 180° in that same view. The angle at the edge becomes a right angle, every time, wherever the point sits.","Switch to <b>the touching line<\/b>. It meets the radius at a right angle at the point of contact, and nowhere else."],"ideas":[{"lead":"<b>Everything starts from the radius.<\/b>","rest":"The radius runs from the middle O to the edge. The diameter goes through the middle. It is two radiuses long.","f":"d = 2r"},{"lead":"<b>The circumference and the area are not the same kind of thing.<\/b>","rest":"One grows in step with the radius. The other grows with the radius squared.","f":"C = 2πr · A = πr²"},{"lead":"<b>Leave pi standing.<\/b>","rest":"A circle answer is written as a multiple of pi, so 2π(6) is 12π and it stops there. Turning it into 37.7 only loses marks.","f":"C = 12π, not 37.7"},{"lead":"<b>A slice is a fraction of the whole circle.<\/b>","rest":"A full turn is 360°. Your angle sits over that. Use the same fraction on the circumference and on the area.","f":"arc = (θ/360) × 2πr · slice = (θ/360) × πr²"},{"lead":"<b>The angle at the middle is twice the angle at the edge.<\/b>","rest":"Both must stand on the same piece of the edge. Moving the point on the edge does not change its angle.","f":"middle = 2 × edge"},{"lead":"<b>Half a circle always gives a right angle.<\/b>","rest":"If the two ends of the arc are opposite each other, the angle at the edge is 90°.","f":"180° ÷ 2 = 90°"},{"lead":"<b>A line that touches the circle once meets the radius square on.<\/b>","rest":"That is what makes the right triangle you need for tangent questions.","f":"tangent ⊥ radius"},{"lead":"<b>A chord is any straight line joining two points on the edge.<\/b>","rest":"Cut it in half and you get a right triangle. The longest chord of all is the diameter.","f":"chord = 2r × sin(θ/2)"},{"lead":"<b>Three chords at 120° make an equilateral triangle inside the circle.<\/b>","rest":"Each of the three triangles at the middle has two radius sides. The angle between them is 120°. So each area is ½ × r × r × sin 120°, and sin 120° is √3 ÷ 2. That makes each one (√3 ÷ 4) × r². Three of them give (3√3 ÷ 4) × r².","f":"area = (3√3 ÷ 4) × r²"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><circle cx=\"320\" cy=\"205\" r=\"135\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2\"><\/circle><circle cx=\"320\" cy=\"205\" r=\"3\" style=\"fill:var(--ink)\"><\/circle><text class=\"slabel b\" x=\"308\" y=\"221\" text-anchor=\"end\">O<\/text><path style=\"fill:var(--amber);fill-opacity:.2;stroke:var(--amber);stroke-width:2\" d=\"M 320 205 L 455 205 A 135 135 0 0 0 320 70 Z\"><\/path><path style=\"fill:none;stroke:var(--green);stroke-width:4\" d=\"M 455 205 A 135 135 0 0 0 320 70\"><\/path><path class=\"arcline\" d=\"M 354 205 A 34 34 0 0 0 320 171\"><\/path><text class=\"slabel a numtxt\" x=\"356.77\" y=\"172.23\" text-anchor=\"middle\">90°<\/text><text class=\"slabel g numtxt\" x=\"449.82\" y=\"79.18\" text-anchor=\"middle\">arc = (7/2)π<\/text><text class=\"slabel b numtxt\" x=\"394.25\" y=\"193\" text-anchor=\"middle\">r = 7<\/text><line x1=\"320\" y1=\"205\" x2=\"455\" y2=\"205\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><line x1=\"320\" y1=\"205\" x2=\"320\" y2=\"70\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><circle class=\"handle\" cx=\"320\" cy=\"70\" r=\"8\"><\/circle><text class=\"slabel a numtxt\" x=\"320\" y=\"26\" text-anchor=\"middle\">(90/360) = ¼ of the circle, used twice over<\/text><text class=\"slabel \" x=\"320\" y=\"386\" text-anchor=\"middle\">drag the dot on the edge to open and close the slice<\/text><\/svg>"},"cb_line":{"title":"Two points and the line through them","tag":"Coordinate Geometry","say":"Drag either point. The gap across, the gap up, the distance, the midpoint and the slope all answer at once. So do the y-intercept and the x-intercept, and the line written three ways. One square of the grid is one unit. The two buttons add a second line, so you can see what parallel and square-on really mean.","note":"Two lines of this board are worth more than the rest. Slope is the climb for one step right, and it never changes along a line. And b in y = mx + b is the y-intercept, the height at which the line crosses the up-axis. Every other form on the board is the same line dressed differently. Pick whichever one the question makes easy.","tries":["Drag one point so it sits <b>straight above<\/b> the other. The gap across goes to zero. The slope has nowhere to go, so the line is written <b>x = a number<\/b> instead.","Drag one point so both sit at the <b>same height<\/b>. The slope goes to 0, the equation becomes y = a number, and the line never cuts the x-axis.","Watch the midpoint while you drag. It is always the average of the two x values and the average of the two y values.","Press <b>add a parallel line<\/b>. The second line has the same slope and a different y-cut. The two never meet, however far you drag.","Press <b>add a line that crosses square on<\/b>. Multiply the two slopes together. You get −1 every time, unless one line is flat and the other upright."],"ideas":[{"lead":"<b>Slope is the climb for one step right.<\/b>","rest":"Take the gap up and divide it by the gap across. You get the same answer wherever on the line you measure it.","f":"m = (y2 − y1) / (x2 − x1)"},{"lead":"<b>Distance is Pythagoras on the grid.<\/b>","rest":"The gap across and the gap up make a right-angled triangle. The line joining your two points is its longest side.","f":"d = √((x2 − x1)² + (y2 − y1)²)"},{"lead":"<b>The midpoint is the average of each coordinate.<\/b>","rest":"Average the two x values, then average the two y values. That pair is the midpoint of the segment.","f":"M = ( (x1 + x2)/2 , (y1 + y2)/2 )"},{"lead":"<b>In y = mx + b, the b is the y-intercept.<\/b>","rest":"Put x = 0 into the equation and every other part drops away.","f":"y = mx + b"},{"lead":"<b>Point-slope form needs one point and the slope.<\/b>","rest":"That is the quickest way to write a line when a question hands you those two things.","f":"y − y1 = m(x − x1)"},{"lead":"<b>The two intercepts give the tidiest form of all.<\/b>","rest":"The x-intercept is a and the y-intercept is b, and the line obeys this rule.","f":"x/a + y/b = 1"},{"lead":"<b>Parallel lines have the same slope.<\/b>","rest":"They climb at the same rate, so the gap between them never closes and they never meet.","f":"m1 = m2"},{"lead":"<b>Lines that cross square on have slopes that multiply to −1.<\/b>","rest":"Turn the slope upside down and change its sign to get the other one.","f":"m1 × m2 = −1"},{"lead":"<b>A flat line and an upright line are the one exception.<\/b>","rest":"A flat line has slope 0. An upright line has no slope at all, so nothing can be multiplied.","f":"y = k is flat · x = h is upright"},{"lead":"<b>The line that crosses the middle square on is the perpendicular bisector.<\/b>","rest":"Every point on it is the same distance from your two points.","f":"distance to A = distance to B"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 460\"><line x1=\"20\" y1=\"430\" x2=\"20\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"52\" y1=\"430\" x2=\"52\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"84\" y1=\"430\" x2=\"84\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"116\" y1=\"430\" x2=\"116\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"148\" y1=\"430\" x2=\"148\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"180\" y1=\"430\" x2=\"180\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"212\" y1=\"430\" x2=\"212\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"244\" y1=\"430\" x2=\"244\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"276\" y1=\"430\" x2=\"276\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"308\" y1=\"430\" x2=\"308\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"372\" y1=\"430\" x2=\"372\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"404\" y1=\"430\" x2=\"404\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"436\" y1=\"430\" x2=\"436\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"468\" y1=\"430\" x2=\"468\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"500\" y1=\"430\" x2=\"500\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"532\" y1=\"430\" x2=\"532\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"564\" y1=\"430\" x2=\"564\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"596\" y1=\"430\" x2=\"596\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"628\" y1=\"430\" x2=\"628\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"660\" y1=\"430\" x2=\"660\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"430\" x2=\"660\" y2=\"430\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"398\" x2=\"660\" y2=\"398\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"366\" x2=\"660\" y2=\"366\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"334\" x2=\"660\" y2=\"334\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"302\" x2=\"660\" y2=\"302\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"270\" x2=\"660\" y2=\"270\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"206\" x2=\"660\" y2=\"206\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"174\" x2=\"660\" y2=\"174\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"142\" x2=\"660\" y2=\"142\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"110\" x2=\"660\" y2=\"110\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"78\" x2=\"660\" y2=\"78\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"46\" x2=\"660\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"238\" x2=\"660\" y2=\"238\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"340\" y1=\"430\" x2=\"340\" y2=\"46\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"84\" y=\"252\" text-anchor=\"middle\">-8<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"148\" y=\"252\" text-anchor=\"middle\">-6<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"212\" y=\"252\" text-anchor=\"middle\">-4<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"276\" y=\"252\" text-anchor=\"middle\">-2<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"404\" y=\"252\" text-anchor=\"middle\">2<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"468\" y=\"252\" text-anchor=\"middle\">4<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"532\" y=\"252\" text-anchor=\"middle\">6<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"596\" y=\"252\" text-anchor=\"middle\">8<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"332\" y=\"370\" text-anchor=\"end\">-4<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"332\" y=\"306\" text-anchor=\"end\">-2<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"332\" y=\"178\" text-anchor=\"end\">2<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"332\" y=\"114\" text-anchor=\"end\">4<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"332\" y=\"252\" text-anchor=\"end\">0<\/text><text class=\"slabel\" style=\"fill:var(--ink-3);font-size:10px\" x=\"673\" y=\"242\" text-anchor=\"middle\">x<\/text><text class=\"slabel\" style=\"fill:var(--ink-3);font-size:10px\" x=\"328\" y=\"42\" text-anchor=\"end\">y<\/text><line x1=\"20\" y1=\"408.67\" x2=\"660\" y2=\"53.11\" style=\"stroke:var(--blue);stroke-width:2.2;fill:none\"><\/line><line x1=\"212\" y1=\"302\" x2=\"500\" y2=\"302\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><line x1=\"500\" y1=\"302\" x2=\"500\" y2=\"142\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><circle cx=\"340\" cy=\"230.89\" r=\"4.2\" style=\"fill:var(--green)\"><\/circle><circle cx=\"327.2\" cy=\"238\" r=\"4.2\" style=\"fill:var(--green)\"><\/circle><circle cx=\"356\" cy=\"222\" r=\"4.6\" style=\"fill:var(--green)\"><\/circle><text class=\"slabel b numtxt\" x=\"182.8\" y=\"290.4\" text-anchor=\"middle\">A(−4, −2)<\/text><text class=\"slabel b numtxt\" x=\"474.61\" y=\"130.4\" text-anchor=\"middle\">B(5, 3)<\/text><text class=\"slabel g\" x=\"356\" y=\"202\" text-anchor=\"middle\">M<\/text><text class=\"slabel r numtxt\" x=\"356\" y=\"330\" text-anchor=\"middle\">across 9<\/text><text class=\"slabel r numtxt\" x=\"532.1\" y=\"226\" text-anchor=\"middle\">up 5<\/text><text class=\"slabel g numtxt\" x=\"322.22\" y=\"219.29\" text-anchor=\"middle\">2/9<\/text><text class=\"slabel g numtxt\" x=\"327.2\" y=\"274\" text-anchor=\"middle\">−2/5<\/text><circle class=\"handle\" cx=\"212\" cy=\"302\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"500\" cy=\"142\" r=\"8\"><\/circle><text class=\"slabel b numtxt\" x=\"22\" y=\"24\" text-anchor=\"start\">y = 5/9x + 2/9<\/text><text class=\"slabel \" x=\"658\" y=\"24\" text-anchor=\"end\">red dashes: across and up<\/text><\/svg>"},"cb_grid":{"title":"A shape on the grid, all at once","tag":"Coordinate Geometry","say":"Drag any corner. Every side length, the perimeter, the area, the midpoint of each side and the right-angle test answer at once. Use the corners slider to swap between a triangle and a four-sided shape. The three buttons flip the shape in an axis or slide it. Watch which numbers change and which refuse to.","note":"","tries":["Drag a corner and watch the area. The shoelace rule is the only way to get the area of a slanted shape without measuring a height.","Try to make a right angle at a corner. The readout says which corners are square, and a small box is drawn at each one.","Press <b>flip it in the across-axis<\/b>. Every y value changes sign. Not one length and not the area moves at all.","Press <b>slide it<\/b>. Every corner gains 2 across and 1 up. Again nothing about the shape's size changes.","With four corners, drag one across the far side. The shape crosses itself and the board warns you, because the shoelace rule needs a shape that does not cross."],"ideas":[{"lead":"<b>The distance along any side is Pythagoras on the grid.<\/b>","rest":"Take the gap across and the gap up between the two ends, square both, add, and take the square root.","f":"d = √((x2 − x1)² + (y2 − y1)²)"},{"lead":"<b>The midpoint of a side is the average of each coordinate.<\/b>","rest":"Average the x values, then average the y values. It works for any slant.","f":"M = ( (x1 + x2)/2 , (y1 + y2)/2 )"},{"lead":"<b>The shoelace rule gives the area from the corners alone.<\/b>","rest":"Go round the shape one way. Cross-multiply each pair of neighbours, add them up with signs, and halve.","f":"Area = ½ |x1y2 − x2y1 + x2y3 − x3y2 + …|"},{"lead":"<b>A corner is square when the two sides meeting there have slopes that multiply to −1.<\/b>","rest":"The board tests this with the gaps across and up.","f":"m1 × m2 = −1"},{"lead":"<b>Flipping in the across-axis changes the sign of every y.<\/b>","rest":"The shape lands below where it was, the same size and the same shape.","f":"(x, y) → (x, −y)"},{"lead":"<b>Flipping in the up-axis changes the sign of every x.<\/b>","rest":"Left becomes right. Again nothing about the size changes.","f":"(x, y) → (−x, y)"},{"lead":"<b>Sliding adds the same pair to every corner.<\/b>","rest":"The shape keeps its size, its shape and its slant. Only the position moves.","f":"(x, y) → (x + h, y + k)"},{"lead":"<b>Lengths and area survive a flip or a slide. Coordinates do not.<\/b>","rest":"That is the whole point of these three butt 8\" r=\"4\" style=\"fill:var(--green)\"><\/circle><circle cx=\"388\" cy=\"126\" r=\"4\" style=\"fill:var(--green)\"><\/circle><circle cx=\"196\" cy=\"222\" r=\"4\" style=\"fill:var(--green)\"><\/circle><text class=\"slabel b numtxt\" x=\"106.17\" y=\"347.33\" text-anchor=\"middle\">A(−6, −3)<\/text><text class=\"slabel b numtxt\" x=\"498.09\" y=\"352.14\" text-anchor=\"middle\">B(4, −3)<\/text><text class=\"slabel b numtxt\" x=\"568.84\" y=\"137.36\" text-anchor=\"middle\">C(6, 3)<\/text><text class=\"slabel b numtxt\" x=\"219.91\" y=\"97.16\" text-anchor=\"middle\">D(−3, 4)<\/text><text class=\"slabel  numtxt\" x=\"308\" y=\"362\" text-anchor=\"middle\">10<\/text><text class=\"slabel  numtxt\" x=\"480.32\" y=\"226.4\" text-anchor=\"middle\">6.32<\/text><text class=\"slabel  numtxt\" x=\"390.06\" y=\"106.19\" text-anchor=\"middle\">9.06<\/text><text class=\"slabel  numtxt\" x=\"167.62\" y=\"218.22\" text-anchor=\"middle\">7.62<\/text><circle class=\"handle\" cx=\"148\" cy=\"334\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"468\" cy=\"334\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"532\" cy=\"142\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"244\" cy=\"110\" r=\"8\"><\/circle><text class=\"slabel b numtxt\" x=\"22\" y=\"24\" text-anchor=\"start\">area = 63  ·  perimeter = 33<\/text><text class=\"slabel \" x=\"658\" y=\"24\" text-anchor=\"end\">green dots: the middle of each side<\/text><\/svg>"},"cb_curve":{"title":"A curve and a line on the same grid","tag":"Coordinate Geometry","say":"The sliders a, b and c set the parabola y = ax² + bx + c. Drag the two blue dots to move the red line. The vertex, the axis of symmetry and the two intercepts all answer at once. So does the b² − 4ac test, and the list of meeting points. The second button swaps in the fraction curve y = (x − p) / (x − q). The p and q sliders take over there.","note":"","tries":["Set a to 1 and slide c up slowly. Watch b² − 4ac fall through zero. The two x-cuts slide together, touch, and then vanish.","Slide a through zero. The x² term disappears, the bend goes with it, and what is left is the straight line y = bx + c.","Make a negative. The curve turns over, the lowest point becomes the highest point, and the arms point down.","Drag the red line down until it just kisses the curve. At that moment they meet at exactly one point, and its own test is zero.","Press the fraction curve. Slide q and watch the upright line it chases move with it. The curve never crosses that line, however close it gets."],"ideas":[{"lead":"<b>The vertex sits half-way between the two x-intercepts.<\/b>","rest":"Its x is found from a and b alone, and its y comes from putting that x back in.","f":"x = −b / (2a)"},{"lead":"<b>The sign of a says which way the parabola opens.<\/b>","rest":"A positive a opens upwards and the vertex is the lowest point. A negative a opens downwards.","f":"a &gt; 0 lowest · a &lt; 0 highest"},{"lead":"<b>b² − 4ac counts the x-intercepts before you solve anything.<\/b>","rest":"Above zero gives two cuts, exactly zero gives one touch, below zero gives none.","f":"b² − 4ac"},{"lead":"<b>The quadratic formula gives the x-intercepts themselves.<\/b>","rest":"The same b² − 4ac sits under the square-root sign, which is why its sign decides how many there are.","f":"x = (−b ± √(b² − 4ac)) / (2a)"},{"lead":"<b>The y-intercept of the parabola is c.<\/b>","rest":"Put x = 0 in and the first two terms vanish, leaving c on its own.","f":"x = 0 → y = c"},{"lead":"<b>To find where a line meets a curve, set them equal.<\/b>","rest":"You get one quadratic. Its own b² − 4ac counts the meeting points: two, one or none.","f":"ax² + bx + c = mx + k"},{"lead":"<b>A fraction is zero only when its top is zero.<\/b>","rest":"So y = (x − p)/(x − q) is zero at x = p. That holds as long as the bottom is not zero there too.","f":"y = 0 at x = p"},{"lead":"<b>A fraction has no value when its bottom is zero.<\/b>","rest":"At x = q there is nothing to plot, so the curve is cut in two there.","f":"no value at x = q"},{"lead":"<b>The curve chases two lines it never touches.<\/b>","rest":"These lines are called asymptotes: lines the curve creeps closer and closer to without ever reaching them.","f":"x = q and y = 1"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 460\"><line x1=\"20\" y1=\"430\" x2=\"20\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"52\" y1=\"430\" x2=\"52\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"84\" y1=\"430\" x2=\"84\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"116\" y1=\"430\" x2=\"116\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"148\" y1=\"430\" x2=\"148\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"180\" y1=\"430\" x2=\"180\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"212\" y1=\"430\" x2=\"212\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"244\" y1=\"430\" x2=\"244\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"276\" y1=\"430\" x2=\"276\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"308\" y1=\"430\" x2=\"308\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"372\" y1=\"430\" x2=\"372\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"404\" y1=\"430\" x2=\"404\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"436\" y1=\"430\" x2=\"436\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"468\" y1=\"430\" x2=\"468\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"500\" y1=\"430\" x2=\"500\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"532\" y1=\"43
