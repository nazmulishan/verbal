"284\" y=\"283\" text-anchor=\"middle\">mode<\/text><line x1=\"322\" y1=\"300\" x2=\"322\" y2=\"332\" style=\"stroke:var(--blue);stroke-width:4.5;fill:none\"><\/line><line x1=\"360\" y1=\"300\" x2=\"360\" y2=\"340\" style=\"stroke:var(--green);stroke-width:2.2;fill:none\"><\/line><text class=\"slabel b numtxt\" x=\"322\" y=\"356\" text-anchor=\"middle\">median = 7<\/text><line x1=\"360\" y1=\"341\" x2=\"429.8\" y2=\"341\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"360\" y1=\"338\" x2=\"360\" y2=\"344\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel g numtxt\" x=\"429.8\" y=\"356\" text-anchor=\"middle\">mean = 72 ÷ 9 = 8<\/text><line x1=\"360\" y1=\"300\" x2=\"360\" y2=\"392\" style=\"stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:4 4;fill:none\"><\/line><line x1=\"322\" y1=\"300\" x2=\"322\" y2=\"422\" style=\"stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:4 4;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"360\" y=\"378\" text-anchor=\"middle\">started at 8<\/text><circle cx=\"360\" cy=\"392\" r=\"4.5\" style=\"fill:none;stroke:var(--green);stroke-width:2\"><\/circle><text class=\"slabel g\" x=\"360\" y=\"408\" text-anchor=\"middle\">the mean has not moved<\/text><circle cx=\"322\" cy=\"422\" r=\"4.5\" style=\"fill:none;stroke:var(--blue);stroke-width:2\"><\/circle><text class=\"slabel b\" x=\"322\" y=\"438\" text-anchor=\"middle\">the median has not moved<\/text><line x1=\"170\" y1=\"462\" x2=\"588\" y2=\"462\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><polygon points=\"360,462 351,478 369,478\" style=\"fill:var(--green)\"><\/polygon><text class=\"slabel  numtxt\" x=\"265\" y=\"458\" text-anchor=\"middle\">pull 13<\/text><text class=\"slabel  numtxt\" x=\"474\" y=\"458\" text-anchor=\"middle\">pull 13<\/text><circle class=\"handle\" cx=\"170\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"170\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"246\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"246\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"284\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"284\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"284\" cy=\"229\" r=\"8\"><\/circle><circle cx=\"284\" cy=\"229\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"322\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"322\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"398\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"398\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"436\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"436\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"512\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"512\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"588\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"588\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><text class=\"slabel  numtxt\" x=\"170\" y=\"236\" text-anchor=\"middle\">3<\/text><text class=\"slabel  numtxt\" x=\"246\" y=\"236\" text-anchor=\"middle\">5<\/text><text class=\"slabel  numtxt\" x=\"284\" y=\"215\" text-anchor=\"middle\">6<\/text><text class=\"slabel  numtxt\" x=\"322\" y=\"236\" text-anchor=\"middle\">7<\/text><text class=\"slabel  numtxt\" x=\"398\" y=\"236\" text-anchor=\"middle\">9<\/text><text class=\"slabel  numtxt\" x=\"436\" y=\"236\" text-anchor=\"middle\">10<\/text><text class=\"slabel  numtxt\" x=\"512\" y=\"236\" text-anchor=\"middle\">12<\/text><text class=\"slabel  numtxt\" x=\"588\" y=\"236\" text-anchor=\"middle\">14<\/text><\/svg>"},"cb_normal":{"title":"The normal distribution, all at once","tag":"Statistics","say":"Slide the mean and the normal distribution slides with it. Slide the standard deviation and the bell stretches or squeezes. The area under it never changes. The shaded bands are the 68, 95 and 99.7 per cent bands. Drag the marker along the curve. It reads the z-score, the number of standard deviations from the mean. It also reads the percentile, the share of values below it.","note":"","tries":["Move the <b>mean<\/b> slider from end to end. The whole picture slides sideways. The bands keep their widths and the shape never changes.","Move the <b>standard deviation<\/b> slider from end to end. The bell gets wider and flatter, or narrower and taller, but the middle stays put.","Drag the marker to sit exactly on a band edge. The z-score comes out a whole number, and the percentile matches the rounded ladder.","Park the marker on one value, then slide the standard deviation. The value has not moved, yet its z-score changes, because the yardstick changed.","Press <b>the six slices<\/b> and read the six numbers left to right. They are 2, 14, 34, 34, 14 and 2 per cent, and they always are."],"ideas":[{"lead":"<b>The normal distribution is set by two numbers only.<\/b>","rest":"The mean says where the middle is. The standard deviation says how wide the middle lump is. Nothing else about the shape can change.","f":"the curve is fixed by the mean and the standard deviation"},{"lead":"<b>Moving the mean slides the curve, it does not reshape it.<\/b>","rest":"Add 10 to every value and the mean goes up by 10. The standard deviation does not move at all.","f":"new mean = M + 10 · SD stays SD"},{"lead":"<b>The standard deviation is the stretch.<\/b>","rest":"Double it and the curve is twice as wide and half as tall. The area under it is still one whole, because it still holds every value.","f":"area under the whole curve = 1"},{"lead":"<b>A z-score says how far out a value is.<\/b>","rest":"Take the gap from the mean. One standard deviation is the width of one step. Dividing the gap by it turns the gap into steps. The answer is negative below the mean and positive above.","f":"z = (value − mean) ÷ standard deviation"},{"lead":"<b>Going back the other way needs the same two numbers.<\/b>","rest":"If you know the z-score, multiply by the standard deviation and add the mean.","f":"value = mean + z × standard deviation"},{"lead":"<b>The six slices come from the three bands.<\/b>","rest":"The middle 68 per cent splits into 34 and 34. The next band adds 95 − 68 = 27, about 14 on each side. The last adds 99.7 − 95 = 4.7, about 2 each side.","f":"2 · 14 · 34 | 34 · 14 · 2 per cent"},{"lead":"<b>Add the slices from the left and you get a percentile.<\/b>","rest":"A percentile is the share of values below a point. The running totals are about 2, 16, 50, 84 and 98 per cent.","f":"percentile = the share of values below"},{"lead":"<b>68, 95 and 99.7 are areas, not guesses.<\/b>","rest":"The area under the curve between one standard deviation either side is 68 per cent. Two either side holds 95 per cent. Three either side holds 99.7 per cent. Every normal distribution gives the same three numbers.","f":"M ± SD · M ± 2SD · M ± 3SD"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 840 470\"><path d=\"M 312 300 L 312 298.52 L 313.8 298.28 L 315.6 298.01 L 317.4 297.7 L 319.2 297.35 L 321 296.96 L 322.8 296.52 L 324.6 296.02 L 326.4 295.46 L 328.2 294.84 L 330 294.14 L 331.8 293.37 L 333.6 292.52 L 335.4 291.57 L 337.2 290.53 L 339 289.39 L 340.8 288.14 L 342.6 286.78 L 344.4 285.3 L 346.2 283.69 L 348 281.96 L 349.8 280.08 L 351.6 278.07 L 353.4 275.91 L 355.2 273.61 L 357 271.16 L 358.8 268.57 L 360.6 265.82 L 362.4 262.93 L 364.2 259.89 L 366 256.71 L 367.8 253.4 L 369.6 249.96 L 371.4 246.4 L 373.2 242.73 L 375 238.96 L 376.8 235.1 L 378.6 231.17 L 380.4 227.19 L 382.2 223.17 L 384 219.13 L 385.8 215.09 L 387.6 211.07 L 389.4 207.09 L 391.2 203.18 L 393 199.35 L 394.8 195.64 L 396.6 192.06 L 398.4 188.63 L 400.2 185.38 L 402 182.33 L 403.8 179.51 L 405.6 176.92 L 407.4 174.59 L 409.2 172.53 L 411 170.77 L 412.8 169.31 L 414.6 168.16 L 416.4 167.33 L 418. "stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"540\" y=\"318\" text-anchor=\"middle\">80<\/text><line x1=\"600\" y1=\"300\" x2=\"600\" y2=\"306\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"600\" y=\"318\" text-anchor=\"middle\">90<\/text><line x1=\"660\" y1=\"300\" x2=\"660\" y2=\"306\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"660\" y=\"318\" text-anchor=\"middle\">100<\/text><line x1=\"720\" y1=\"300\" x2=\"720\" y2=\"306\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"720\" y=\"318\" text-anchor=\"middle\">110<\/text><line x1=\"780\" y1=\"300\" x2=\"780\" y2=\"306\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"780\" y=\"318\" text-anchor=\"middle\">120<\/text><line x1=\"492\" y1=\"300\" x2=\"492\" y2=\"281.96\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><circle class=\"handle\" cx=\"492\" cy=\"281.96\" r=\"8\"><\/circle><circle cx=\"492\" cy=\"281.96\" r=\"4\" style=\"fill:var(--red)\"><\/circle><text class=\"slabel r numtxt\" x=\"492\" y=\"26\" text-anchor=\"middle\">the marker stands at 72<\/text><text class=\"slabel r numtxt\" x=\"492\" y=\"44\" text-anchor=\"middle\">z-score = (72 − 60) ÷ 6 = 12 ÷ 6 = 2 standard deviations out<\/text><text class=\"slabel g numtxt\" x=\"420\" y=\"338\" text-anchor=\"middle\">mean = 60<\/text><line x1=\"384\" y1=\"362\" x2=\"456\" y2=\"362\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"384\" y1=\"358\" x2=\"384\" y2=\"366\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"456\" y1=\"358\" x2=\"456\" y2=\"366\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel b numtxt\" x=\"420\" y=\"380\" text-anchor=\"middle\">68% sit between 54 and 66, that is 60 ± 1 × 6<\/text><line x1=\"348\" y1=\"394\" x2=\"492\" y2=\"394\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"348\" y1=\"390\" x2=\"348\" y2=\"398\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"492\" y1=\"390\" x2=\"492\" y2=\"398\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel b numtxt\" x=\"420\" y=\"412\" text-anchor=\"middle\">95% sit between 48 and 72, that is 60 ± 2 × 6 = 60 ± 12<\/text><line x1=\"312\" y1=\"426\" x2=\"528\" y2=\"426\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"312\" y1=\"422\" x2=\"312\" y2=\"430\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"528\" y1=\"422\" x2=\"528\" y2=\"430\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel b numtxt\" x=\"420\" y=\"444\" text-anchor=\"middle\">99.7% sit between 42 and 78, that is 60 ± 3 × 6 = 60 ± 18<\/text><\/svg>"},"cb_groups":{"title":"Two groups joined: the weighted average","tag":"Statistics","say":"Two groups, each with a size and a mean. Slide any of them. The weighted average lands on the beam as a balance point. It is never halfway unless the two groups are the same size. The plain mean of the two means is drawn in red, because that is the trap. The second button shows what joining the groups does to the standard deviation.","note":"","tries":["Make group A much bigger than group B. The balance point slides right up against the mean of A, because A is carrying most of the weight.","Set the two sizes equal. Now the green mark and the red mark land on top of each other, and the plain mean is right for once.","Read the two gaps, then read the two sizes. The gaps come out in the reverse order of the sizes, every time. That is the whole alligation trick.","Press <b>the standard deviation<\/b> and pull the two means apart. The joined band gets wider than either group band, even though neither group changed inside.","Set both means to the same number and press <b>the standard deviation<\/b>. The joined band matches the group bands, because there is no gap left to add."],"ideas":[{"lead":"<b>The weighted average comes from totals, never from means.<\/b>","rest":"Turn each mean back into a total, add the two totals, then divide by the two sizes added. That is all a weighted average is.","f":"M = (n₁M₁ + n₂M₂) ÷ (n₁ + n₂)"},{"lead":"<b>A mean is a total waiting to be undone.<\/b>","rest":"Size times mean gives the total back. This one step turns almost every mixing question into adding.","f":"total = n × M"},{"lead":"<b>The plain mean of two means is the trap.<\/b>","rest":"It is only right when the two groups are the same size. Any other time it sits on the wrong side.","f":"(M₁ + M₂) ÷ 2 is wrong unless n₁ = n₂"},{"lead":"<b>The weighted average always lands nearer the bigger group.<\/b>","rest":"The total counts every value once. The bigger group hands in more values, so it drags the total further its own way. That is why the balance point slides towards it.","f":"n₁ &gt; n₂ → M is nearer M₁"},{"lead":"<b>Alligation is the same answer read as a ratio.<\/b>","rest":"Alligation means working a mix out from the gaps. The gap from each mean to the weighted average is in the reverse ratio of the sizes.","f":"(M − M₁) : (M₂ − M) = n₂ : n₁"},{"lead":"<b>The reverse ratio gives you the sizes from the gaps.<\/b>","rest":"If you know the three means you know the ratio of the two sizes, without knowing either size.","f":"n₁ : n₂ = (M₂ − M) : (M − M₁)"},{"lead":"<b>Joining two groups with different means widens the standard deviation.<\/b>","rest":"The joined standard deviation carries the spread inside each group plus the gap between the two means.","f":"SD² = s² + n₁n₂(M₁ − M₂)² ÷ (n₁ + n₂)²"},{"lead":"<b>Same means, same standard deviation.<\/b>","rest":"Two groups with the same mean leave no gap to add. So joining them leaves the standard deviation exactly where it already was.","f":"M₁ = M₂ → SD = s"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 840 440\"><text class=\"slabel \" x=\"420\" y=\"28\" text-anchor=\"middle\">the weighted average is the balance point of the two groups<\/text><rect x=\"337.9\" y=\"197\" width=\"144.2\" height=\"6\" style=\"fill:var(--ink-3);stroke:none\"><\/rect><rect x=\"298\" y=\"158\" width=\"84\" height=\"42\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2\"><\/rect><rect x=\"438\" y=\"166\" width=\"84\" height=\"34\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2\"><\/rect><line x1=\"340\" y1=\"158\" x2=\"340\" y2=\"200\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><line x1=\"480\" y1=\"166\" x2=\"480\" y2=\"200\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><text class=\"slabel b numtxt\" x=\"340\" y=\"128\" text-anchor=\"middle\">A: 12 values, mean 40, total 12 × 40 = 480<\/text><text class=\"slabel b numtxt\" x=\"480\" y=\"146\" text-anchor=\"middle\">B: 8 values, mean 60, total 8 × 60 = 480<\/text><polygon points=\"396,200 384,222 408,222\" style=\"fill:var(--green);fill-opacity:.25;stroke:var(--green);stroke-width:2\"><\/polygon><text class=\"slabel  numtxt\" x=\"368\" y=\"234\" text-anchor=\"middle\">gap = 8<\/text><line x1=\"340\" y1=\"244\" x2=\"396\" y2=\"244\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"340\" y1=\"239\" x2=\"340\" y2=\"249\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"396\" y1=\"239\" x2=\"396\" y2=\"249\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"438\" y=\"262\" text-anchor=\"middle\">gap = 12<\/text><line x1=\"396\" y1=\"272\" x2=\"480\" y2=\"272\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"396\" y1=\"267\" x2=\"396\" y2=\"277\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"480\" y1=\"267\" x2=\"480\" y2=\"277\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><polygon points=\"396,298 388,284 404,284\" style=\"fill:var(--green);stroke:none\"><\/polygon><polygon points=\"410,298 402,284 418,284\" style=\"fill:none;stroke:var(--red);stroke-width:2\"><\/polygon><line x1=\"50\" y1=\"300\" x2=\"770\" y2=\"300\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"60\" y1=\"300\" x2=\"60\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"60\" y=\"320\" text-anchor=\"middle\">0<\/text><line x1=\"130\" y1=\"300\" x2=\"130\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"130\" y=\"320\" text-anchor=\"middle\">10<\/text><line x1=\"200\" y1=\"300\" x2=\"200\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"200\" y=\"320\" text-anchor=\"middle\">20<\/text><line x1=\"270\" y1=\"300\" x2=\"270\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"270\" y=\"320\" text-anchor=\"middle\">30<\/text><line x1=\"340\" y1=\"300\" x2=\"340\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"340\" y=\"320\" text-anchor=\"middle\">40<\/text><line x1=\"410\" y1=\"300\" x2=\"410\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"410\" y=\"320\" text-anchor=\"middle\">50<\/text><line x1=\"480\" y1=\"300\" x2=\"480\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"480\" y=\"320\" text-anchor=\"middle\">60<\/text><line x1=\"550\" y1=\"300\" x2=\"550\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"550\" y=\"320\" text-anchor=\"middle\">70<\/text><line x1=\"620\" y1=\"300\" x2=\"620\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"620\" y=\"320\" text-anchor=\"middle\">80<\/text><line x1=\"690\" y1=\"300\" x2=\"690\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"690\" y=\"320\" text-anchor=\"middle\">90<\/text><line x1=\"760\" y1=\"300\" x2=\"760\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"760\" y=\"320\" text-anchor=\"middle\">100<\/text><line x1=\"396\" y1=\"300\" x2=\"396\" y2=\"308\" style=\"stroke:var(--green);stroke-width:3;fill:none\"><\/line><line x1=\"410\" y1=\"300\" x2=\"410\" y2=\"308\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><text class=\"slabel g numtxt\" x=\"396\" y=\"344\" text-anchor=\"middle\">the weighted average = (480 + 480) ÷ 20 = 960 ÷ 20 = 48<\/text><text class=\"slabel r numtxt\" x=\"410\" y=\"368\" text-anchor=\"middle\">plain mean of the two means = (40 + 60) ÷ 2 = 50 — the trap<\/text><text class=\"slabel  numtxt\" x=\"420\" y=\"398\" text-anchor=\"middle\">gaps 2 : 3 &nbsp; sizes 3 : 2 &nbsp; the reverse of each other<\/text><text class=\"slabel  numtxt\" x=\"420\" y=\"424\" text-anchor=\"middle\">standard deviation inside each group 6 &nbsp; standard deviation of the joined group 11.5<\/text><\/svg>"}}}</script>
<script>
(function(){
  "use strict";
  var D=JSON.parse(document.getElementById("cb-data").textContent);
  var PAGES=D.pages, B=D.boards, LET="ABCD", N=PAGES.length;
  var sheet=document.getElementById("sheet"), pager=document.getElementById("pager"), qz=document.getElementById("qz"), qzp=document.getElementById("qzp");
  var SIZES=["15px","17px","19.5px"], HOST=false;

  function load(k,d){try{var v=JSON.parse(localStorage.getItem(k)||"null");return v==null?d:v;}catch(e){return d;}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
  var KNOW=load("kmf.cb.known",{}); if(typeof KNOW!=="object"||!KNOW)KNOW={};
  var V=load("cb8.view",{}); var st={page:+V.page||0,mode:V.mode==="cover"?"cover":"read",hide:!!V.hide,size:V.size==null?1:+V.size};
  if(!(st.size>=0&&st.size<3))st.size=1;
  var h0=(location.hash||"").match(/^#p(\d+)$/); if(h0&&+h0[1]>=1&&+h0[1]<=N)st.page=+h0[1];
  if(!(st.page>=0&&st.page<=N))st.page=0;
  function keep(){save("cb8.view",{page:st.page,mode:st.mode,hide:st.hide,size:st.size});}

  function ideasOf(P){var out=[];P.boards.forEach(function(bid){B[bid].ideas.forEach(function(x,i){out.push(bid+":"+i);});});return out;}
  function knownIn(P){return ideasOf(P).filter(function(k){return KNOW[k];}).length;}
  function idea(k){var p=k.split(":");return B[p[0]].ideas[+p[1]];}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  pager.innerHTML=PAGES.map(function(P){return '<button type="button" class="pg" data-p="'+P.n+'" title="Page '+P.n+' · '+esc(P.title)+'">'+P.n+'</button>';}).join("");
  function bar(){
    [].forEach.call(pager.children,function(b){var n=+b.getAttribute("data-p"),P=PAGES[n-1];
      if(n===st.page)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
      b.classList.toggle("done",knownIn(P)===ideasOf(P).length);});
    document.getElementById("tocBtn").setAttribute("aria-pressed",String(st.page===0));
    document.getElementById("modeRead").setAttribute("aria-pressed",String(st.mode==="read"));
    document.getElementById("modeCover").setAttribute("aria-pressed",String(st.mode==="cover"));
    document.getElementById("hideBtn").setAttribute("aria-pressed",String(st.hide));
    sheet.classList.toggle("cover",st.mode==="cover"); sheet.classList.toggle("hideknown",st.hide);
    sheet.style.setProperty("--fs",SIZES[st.size]);
  }

  function toc(){
    var total=0,known=0; PAGES.forEach(function(P){total+=ideasOf(P).length;known+=knownIn(P);});
    var last=+(V.page||0);
    return '<div class="rhead"><span>Concept Boards in 8 Pages</span><span>Contents</span></div>'
      +'<h1>Concept Boards in 8 Pages</h1>'
      +'<p class="deck">All twenty Concept Boards from KMF Quant, chapter 24: every idea in one line with its formula, and each board\'s picture at the head of its section.</p>'
      +'<p class="meta">'+known+' of '+total+' ideas ticked as known</p>'
      +'<ul class="howto">'
      +'<li><b>Read one page a day.</b> Each line is one idea from a board, with its formula beside it.</li>'
      +'<li><b>Tap an idea</b> to read the rest of what the board says about it.</li>'
      +'<li><b>Cover</b> blurs every formula. Say it out loud, then tap the line to check.</li>'
      +'<li><b>Tick ✓</b> what you know, and <b>Hide ✓</b> leaves only what is left to learn.</li>'
      +'</ul>'
      +(HOST?'<p class="small">Inside KMF Quant, <b>Move the board</b> opens the live board itself, full width, so you can drag it.</p>':'')
      +'<div class="cont"><button type="button" class="btn pri" data-go="'+(last>=1&&last<=N?last:1)+'">'+(last>=1&&last<=N?'Continue at page '+last:'Start at page 1')+' →</button>'
      +'<span class="small">← and → turn the page. On a phone, swipe.</span></div>'
      +'<ol class="toc">'+PAGES.map(function(P){var n=ideasOf(P).length,k=knownIn(P);
        return '<li><button type="button" data-go="'+P.n+'"><span class="no">'+P.n+'</span><span><span class="k">'+esc(P.kicker)+'</span><span class="t">'+esc(P.title)+'</span>'
          +'<span class="bs">'+P.boards.map(function(b){return esc(B[b].title);}).join(" · ")+'</span></span>'
          +'<span class="c">'+n+' ideas'+(k?' · <i>'+k+' ✓</i>':'')+'</span><span class="prog" aria-hidden="true"><i style="width:'+Math.round(100*k/n)+'%"></i></span></button></li>';}).join("")+'</ol>';
  }
  function item(bid,i){
    var x=B[bid].ideas[i], k=bid+":"+i;
    return '<div class="it'+(KNOW[k]?' known':'')+'" data-k="'+k+'">'
      +'<button type="button" class="kn" aria-pressed="'+(KNOW[k]?'true':'false')+'" aria-label="I know this idea" title="I know this">✓</button>'
      +'<button type="button" class="tt" aria-expanded="false">'+x.lead+'</button>'
      +'<div class="fx">'+x.f+'</div>'
      +'</div>';
  }
  function board(bid){
    var b=B[bid];
    return '<section class="board" id="'+bid+'"><div class="bhd"><h2>'+b.title+'</h2><span class="tag">'+esc(b.tag)+'</span>'
      +'<button type="button" class="live" data-live="'+bid+'">Move the board ⤢</button></div>'
      +(b.svg?'<figure class="fig">'+b.svg+'<figcaption><span class="off">The board as it opens. In KMF Quant, chapter 24, you can drag it.</span><span class="on">The board as it opens. Press <b>Move the board</b> to drag it.</span></figcaption></figure>':'')
      +(b.note?'<div class="carry"><b class="lb">Carry this away</b>'+b.note+'</div>':'')
      +b.ideas.map(function(x,i){return item(bid,i);}).join("")
      +(b.tries&&b.tries.length?'<details class="try"><summary>Things to try on the live board ('+b.tries.length+')</summary><ul>'+b.tries.map(function(t){return '<li>'+t+'</li>';}).join("")+'</ul></details>':'')
      +'</section>';
  }
  function page(n){
    var P=PAGES[n-1], all=ideasOf(P), k=knownIn(P);
    var h='<div class="rhead"><span>Concept Boards in 8 Pages</span><span>'+esc(P.kicker)+'</span></div>'
      +'<h1>'+esc(P.title)+'</h1><p class="deck">'+esc(P.deck)+'</p>'
      +'<p class="meta">'+P.boards.length+' board'+(P.boards.length>1?'s':'')+' · '+all.length+' ideas · '+k+' ticked'+(st.hide&&k?' and hidden':'')+'</p>';
    h+=P.boards.map(board).join("");
    h+='<div class="endmatter"><p>End of page '+n+'. Match each idea to its formula.</p><div class="acts">'
      +'<button type="button" class="btn pri" data-quiz="5">5 questions</button><button type="button" class="btn" data-quiz="all">All '+all.length+'</button></div></div>';
    var prev=n>1?PAGES[n-2]:null, next=n<N?PAGES[n]:null;
    h+='<nav class="foot" aria-label="Turn the page">'
      +'<button type="button" class="nav" data-go="'+(n-1)+'"><b>← '+(prev?'Page '+prev.n:'Contents')+'</b>'+(prev?esc(prev.title):'All '+N+' pages')+'</button>'
      +'<span class="folio">'+n+'</span>'
      +(next?'<button type="button" class="nav next" data-go="'+next.n+'"><b>Page '+next.n+' →</b>'+esc(next.title)+'</button>':'<button type="button" class="nav next" data-go="0"><b>Contents →</b>Back to the start</button>')
      +'</nav>';
    return h;
  }
  function meta(){var m=sheet.querySelector(".meta");if(m&&st.page>0){var P=PAGES[st.page-1],k=knownIn(P);
    m.textContent=P.boards.length+' board'+(P.boards.length>1?'s':'')+' · '+ideasOf(P).length+' ideas · '+k+' ticked'+(st.hide&&k?' and hidden':'');}}
  function render(dir){
    sheet.innerHTML=st.page===0?toc():page(st.page);
    sheet.classList.remove("turn"); void sheet.offsetWidth; sheet.style.setProperty("--dx",(dir||0)<0?"-10px":"10px"); sheet.classList.add("turn");
    bar();
  }
  function go(n){
    n=Math.max(0,Math.min(N,n)); if(n===st.page)return;
    var dir=n>st.page?1:-1; st.page=n; if(n>0)V.page=n; keep(); render(dir);
    try{window.scrollTo(0,0);}catch(e){}
  }
  function setKnown(k,on){
    if(on)KNOW[k]=1;else delete KNOW[k]; save("kmf.cb.known",KNOW);
    var el=sheet.querySelector('.it[data-k="'+k+'"]');
    if(el){el.classList.toggle("known",on);el.querySelector(".kn").setAttribute("aria-pressed",String(on));}
    meta(); bar();
  }

  sheet.addEventListener("click",function(e){
    var t=e.target;
    var g=t.closest("[data-go]"); if(g){go(+g.getAttribute("data-go"));return;}
    var q=t.closest("[data-quiz]"); if(q){quiz(q.getAttribute("data-quiz"));return;}
    var lv=t.closest("[data-live]"); if(lv){try{parent.postMessage({kmfcb:lv.getAttribute("data-live")},"*");}catch(err){}return;}
    var it=t.closest(".it"); if(!it)return; var k=it.getAttribute("data-k");
    if(t.closest(".kn")){setKnown(k,!KNOW[k]);return;}
    if(st.mode==="cover"&&!it.classList.contains("shown")&&(t.closest(".fx")||t.closest(".more"))){it.classList.add("shown");return;}
    if(t.closest(".tt")||t.closest(".fx")){
      var m=it.querySelector(".more"), b=it.querySelector(".tt");
      if(m){m.remove();it.classList.remove("open");b.setAttribute("aria-expanded","false");return;}
      var x=idea(k); if(!x.rest)return;
      m=document.createElement("div"); m.className="more"; m.innerHTML=x.rest; it.appendChild(m); it.classList.add("open");
      b.setAttribute("aria-expanded","true");
    }
  });

  /* ---- the formula check: the idea is the question, its formula is the answer ---- */
  var Q=null;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x;}return a;}
  function plain(h){var d=document.createElement("div");d.innerHTML=h;return d.textContent.replace(/\s+/g," ").trim();}
  function quiz(how){
    var P=PAGES[st.page-1], pool=shuffle(ideasOf(P).slice());
    if(how!=="all")pool=pool.slice(0,5);
    var forms=ideasOf(P).map(function(k){return {k:k,f:idea(k).f,p:plain(idea(k).f)};});
    Q={list:pool.map(function(k){
      var right=idea(k), seen={}; seen[plain(right.f)]=1;
      var other=shuffle(forms.filter(function(x){return x.k.split(":")[0]===k.split(":")[0]&&x.k!==k;}))
        .concat(shuffle(forms.filter(function(x){return x.k.split(":")[0]!==k.split(":")[0];})));
      var picks=[];
      other.forEach(function(x){if(picks.length<3&&!seen[x.p]){seen[x.p]=1;picks.push(x.f);}});
      var ch=shuffle([right.f].concat(picks));
      return {k:k,ch:ch,ri:ch.indexOf(right.f)};
    }),i:0,picked:null,right:0,missed:[],back:document.activeElement};
    qz.hidden=false; drawQ();
  }
  function drawQ(){
    if(Q.i>=Q.list.length){
      var n=Q.list.length;
      qzp.innerHTML='<div class="qzh"><span id="qzTitle">Page '+st.page+' check · done</span><button type="button" class="btn" data-q="close">Close</button></div>'
        +'<p class="score">'+Q.right+' of '+n+'</p>'
        +(Q.missed.length?'<p class="small">Go back over these. Any you had ticked are un-ticked again:</p><ul class="missed">'+Q.missed.map(function(k){return '<li>'+idea(k).lead+'</li>';}).join("")+'</ul>'
          :'<p class="small">Every one right. Tick the ideas you are sure of so they can be hidden.</p>')
        +'<div class="row"><button type="button" class="btn" data-q="again">Another 5</button><button type="button" class="btn pri" data-q="close">Back to the page</button></div>';
      qzp.querySelector('[data-q="close"]').focus(); return;
    }
    var it=Q.list[Q.i], x=idea(it.k), b=B[it.k.split(":")[0]];
    qzp.innerHTML='<div class="qzh"><span id="qzTitle">Page '+st.page+' check · question '+(Q.i+1)+' of '+Q.list.length+'</span><button type="button" class="btn" data-q="close">Close</button></div>'
      +'<span class="tag">'+b.title+'</span><div class="q">'+x.lead+'</div><p class="ask">Which formula goes with it?</p>'
      +'<div class="ch">'+it.ch.map(function(f,i){return '<button type="button" data-i="'+i+'"><span class="lt">'+LET[i]+'</span><span class="ft">'+f+'</span></button>';}).join("")+'</div>'
      +'<div id="qzWhy"></div>';
    var first=qzp.querySelector(".ch button"); if(first)first.focus();
  }
  qzp.addEventListener("click",function(e){
    var a=e.target.closest("[data-q]");
    if(a){var act=a.getAttribute("data-q");
      if(act==="close"){closeQ();return;}
      if(act==="next"){Q.i++;Q.picked=null;drawQ();return;}
      if(act==="again"){closeQ();quiz("5");return;}
    }
    var b=e.target.closest(".ch button"); if(!b||Q.picked!=null)return;
    var it=Q.list[Q.i],i=+b.getAttribute("data-i"); Q.picked=i;
    qzp.querySelectorAll(".ch button").forEach(function(o,j){o.disabled=true;o.classList.toggle("right",j===it.ri);o.classList.toggle("wrong",j===i&&i!==it.ri);});
    if(i===it.ri)Q.right++; else {Q.missed.push(it.k); if(KNOW[it.k])setKnown(it.k,false);}
    var x=idea(it.k);
    document.getElementById("qzWhy").innerHTML='<div class="why"><b>'+(i===it.ri?'Right. ':'It is '+x.f+'. ')+'</b>'+(x.rest||"")+'</div>'
      +'<div class="row"><button type="button" class="btn pri" data-q="next">'+(Q.i+1<Q.list.length?'Next question →':'See the result')+'</button></div>';
    qzp.querySelector('[data-q="next"]').focus();
  });
  function closeQ(){qz.hidden=true; var b=Q&&Q.back; Q=null; if(b&&b.focus)b.focus();}
  qz.addEventListener("click",function(e){if(e.target===qz)closeQ();});

  pager.addEventListener("click",function(e){var b=e.target.closest("[data-p]");if(b)go(+b.getAttribute("data-p"));});
  document.getElementById("tocBtn").addEventListener("click",function(){go(0);});
  document.getElementById("modeRead").addEventListener("click",function(){st.mode="read";keep();sheet.querySelectorAll(".it.shown").forEach(function(x){x.classList.remove("shown");});bar();});
  document.getElementById("modeCover").addEventListener("click",function(){st.mode="cover";keep();sheet.querySelectorAll(".it.shown").forEach(function(x){x.classList.remove("shown");});bar();});
  document.getElementById("hideBtn").addEventListener("click",function(){st.hide=!st.hide;keep();bar();meta();});
  document.getElementById("sizeBtn").addEventListener("click",function(){st.size=(st.size+1)%3;keep();bar();});
  document.addEventListener("keydown",function(e){
    if(!qz.hidden){if(e.key==="Escape")closeQ();return;}
    var tg=e.target&&e.target.tagName; if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT"||e.altKey||e.ctrlKey||e.metaKey)return;
    if(e.key==="ArrowRight"){go(st.page+1);e.preventDefault();}
    else if(e.key==="ArrowLeft"){go(st.page-1);e.preventDefault();}
  });
  var tx=null,ty=0;
  sheet.addEventListener("touchstart",function(e){if(e.touches.length!==1||e.target.closest(".fig,.more,details")){tx=null;return;}tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  sheet.addEventListener("touchend",function(e){if(tx==null)return;var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;tx=null;
    if(Math.abs(dx)>70&&Math.abs(dy)<45)go(st.page+(dx<0?1:-1));},{passive:true});

  /* inside KMF Quant the page around this one answers, and the live boards can be opened from here */
  window.addEventListener("message",function(e){
    if(e.source!==window.parent||window.parent===window)return; var d=e.data; if(!d||!d.kmfHost||HOST)return;
    HOST=true; document.documentElement.classList.add("inkmf"); if(st.page===0)render(0);
  });

  render(0);
})();
</script>

</body>
</html>
