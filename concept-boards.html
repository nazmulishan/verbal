ass=\"slabel b numtxt\" x=\"528.33\" y=\"224\" text-anchor=\"start\">h = 12<\/text><text class=\"slabel r numtxt\" x=\"535\" y=\"335\" text-anchor=\"middle\">space diagonal = 13<\/text><\/svg>","sec":"geo","fm":["The rectangular solid: volume and surface area","The cube: volume and surface area","The cylinder: volume and surface area","The sphere: volume and surface area","The cone: volume and surface area","Space diagonal of a box","Scaling: k² for area, k³ for volume","Area of a circle","The Pythagorean rule","Diagonal of a rectangle"]},"cb_line":{"title":"Two points and the line through them","tag":"Coordinate Geometry","say":"Drag either point. The gap across, the gap up, the distance, the midpoint and the slope all answer at once. So do the y-intercept and the x-intercept, and the line written three ways. One square of the grid is one unit. The two buttons add a second line, so you can see what parallel and square-on really mean.","note":"Two lines of this board are worth more than the rest. Slope is the climb for one step right, and it never changes along a line. And b in y = mx + b is the y-intercept, the height at which the line crosses the up-axis. Every other form on the board is the same line dressed differently. Pick whichever one the question makes easy.","tries":["Drag one point so it sits <b>straight above<\/b> the other. The gap across goes to zero. The slope has nowhere to go, so the line is written <b>x = a number<\/b> instead.","Drag one point so both sit at the <b>same height<\/b>. The slope goes to 0, the equation becomes y = a number, and the line never cuts the x-axis.","Watch the midpoint while you drag. It is always the average of the two x values and the average of the two y values.","Press <b>add a parallel line<\/b>. The second line has the same slope and a different y-cut. The two never meet, however far you drag.","Press <b>add a line that crosses square on<\/b>. Multiply the two slopes together. You get −1 every time, unless one line is flat and the other upright."],"ideas":[{"lead":"<b>Slope is the climb for one step right.<\/b>","rest":"Take the gap up and divide it by the gap across. You get the same answer wherever on the line you measure it.","f":"m = (y2 − y1) / (x2 − x1)","eg":"(1, 2) to (4, 8): 6 ÷ 3 = 2"},{"lead":"<b>Distance is Pythagoras on the grid.<\/b>","rest":"The gap across and the gap up make a right-angled triangle. The line joining your two points is its longest side.","f":"d = √((x2 − x1)² + (y2 − y1)²)","eg":"(1, 2) to (4, 6): √(9 + 16) = 5"},{"lead":"<b>The midpoint is the average of each coordinate.<\/b>","rest":"Average the two x values, then average the two y values. That pair is the midpoint of the segment.","f":"M = ( (x1 + x2)/2 , (y1 + y2)/2 )","eg":"(2, 4) and (6, 10) → (4, 7)"},{"lead":"<b>In y = mx + b, the b is the y-intercept.<\/b>","rest":"Put x = 0 into the equation and every other part drops away.","f":"y = mx + b","eg":"y = 2x + 3 crosses the y-axis at (0, 3)"},{"lead":"<b>Point-slope form needs one point and the slope.<\/b>","rest":"That is the quickest way to write a line when a question hands you those two things.","f":"y − y1 = m(x − x1)","eg":"through (1, 5) with slope 2: y − 5 = 2(x − 1) → y = 2x + 3"},{"lead":"<b>The two intercepts give the tidiest form of all.<\/b>","rest":"The x-intercept is a and the y-intercept is b, and the line obeys this rule.","f":"x/a + y/b = 1","eg":"x/4 + y/2 = 1 crosses at (4, 0) and (0, 2)"},{"lead":"<b>Parallel lines have the same slope.<\/b>","rest":"They climb at the same rate, so the gap between them never closes and they never meet.","f":"m1 = m2","eg":"y = 2x + 1 and y = 2x − 5 never meet"},{"lead":"<b>Lines that cross square on have slopes that multiply to −1.<\/b>","rest":"Turn the slope upside down and change its sign to get the other one.","f":"m1 × m2 = −1","eg":"slopes 2 and −½: 2 × (−½) = −1"},{"lead":"<b>A flat line and an upright line are the one exception.<\/b>","rest":"A flat line has slope 0. An upright line has no slope at all, so nothing can be multiplied.","f":"y = k is flat · x = h is upright","eg":"y = 3 and x = 2 cross square on with no slopes to multiply"},{"lead":"<b>The line that crosses the middle square on is the perpendicular bisector.<\/b>","rest":"Every point on it is the same distance from your two points.","f":"distance to A = distance to B","eg":"A(0, 0), B(4, 0): x = 2 is the perpendicular bisector"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 460\"><line x1=\"20\" y1=\"430\" x2=\"20\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"52\" y1=\"430\" x2=\"52\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"84\" y1=\"430\" x2=\"84\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"116\" y1=\"430\" x2=\"116\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"148\" y1=\"430\" x2=\"148\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"180\" y1=\"430\" x2=\"180\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"212\" y1=\"430\" x2=\"212\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"244\" y1=\"430\" x2=\"244\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"276\" y1=\"430\" x2=\"276\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"308\" y1=\"430\" x2=\"308\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"372\" y1=\"430\" x2=\"372\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"404\" y1=\"430\" x2=\"404\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"436\" y1=\"430\" x2=\"436\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"468\" y1=\"430\" x2=\"468\" y2=\"46\" style=\"stroke xt><text class=\"slabel\" style=\"fill:var(--ink-3);font-size:10px\" x=\"328\" y=\"42\" text-anchor=\"end\">y<\/text><line x1=\"20\" y1=\"408.67\" x2=\"660\" y2=\"53.11\" style=\"stroke:var(--blue);stroke-width:2.2;fill:none\"><\/line><line x1=\"212\" y1=\"302\" x2=\"500\" y2=\"302\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><line x1=\"500\" y1=\"302\" x2=\"500\" y2=\"142\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><circle cx=\"340\" cy=\"230.89\" r=\"4.2\" style=\"fill:var(--green)\"><\/circle><circle cx=\"327.2\" cy=\"238\" r=\"4.2\" style=\"fill:var(--green)\"><\/circle><circle cx=\"356\" cy=\"222\" r=\"4.6\" style=\"fill:var(--green)\"><\/circle><text class=\"slabel b numtxt\" x=\"182.8\" y=\"290.4\" text-anchor=\"middle\">A(−4, −2)<\/text><text class=\"slabel b numtxt\" x=\"474.61\" y=\"130.4\" text-anchor=\"middle\">B(5, 3)<\/text><text class=\"slabel g\" x=\"356\" y=\"202\" text-anchor=\"middle\">M<\/text><text class=\"slabel r numtxt\" x=\"356\" y=\"330\" text-anchor=\"middle\">across 9<\/text><text class=\"slabel r numtxt\" x=\"532.1\" y=\"226\" text-anchor=\"middle\">up 5<\/text><text class=\"slabel g numtxt\" x=\"322.22\" y=\"219.29\" text-anchor=\"middle\">2/9<\/text><text class=\"slabel g numtxt\" x=\"327.2\" y=\"274\" text-anchor=\"middle\">−2/5<\/text><circle class=\"handle\" cx=\"212\" cy=\"302\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"500\" cy=\"142\" r=\"8\"><\/circle><text class=\"slabel b numtxt\" x=\"22\" y=\"24\" text-anchor=\"start\">y = 5/9x + 2/9<\/text><text class=\"slabel \" x=\"658\" y=\"24\" text-anchor=\"end\">red dashes: across and up<\/text><\/svg>","sec":"coord","fm":["Slope from two points","Slope-intercept form","Point-slope form","Standard form of a line","The two intercepts of a line","Distance between two points","Midpoint of a segment","Parallel lines have equal slopes","Perpendicular slopes multiply to −1","Perpendicular bisector of a segment","Collinearity of three points"]},"cb_grid":{"title":"A shape on the grid, all at once","tag":"Coordinate Geometry","say":"Drag any corner. Every side length, the perimeter, the area, the midpoint of each side and the right-angle test answer at once. Use the corners slider to swap between a triangle and a four-sided shape. The three buttons flip the shape in an axis or slide it. Watch which numbers change and which refuse to.","note":"","tries":["Drag a corner and watch the area. The shoelace rule is the only way to get the area of a slanted shape without measuring a height.","Try to make a right angle at a corner. The readout says which corners are square, and a small box is drawn at each one.","Press <b>flip it in the across-axis<\/b>. Every y value changes sign. Not one length and not the area moves at all.","Press <b>slide it<\/b>. Every corner gains 2 across and 1 up. Again nothing about the shape's size changes.","With four corners, drag one across the far side. The shape crosses itself and the board warns you, because the shoelace rule needs a shape that does not cross."],"ideas":[{"lead":"<b>The distance along any side is Pythagoras on the grid.<\/b>","rest":"Take the gap across and the gap up between the two ends, square both, add, and take the square root.","f":"d = √((x2 − x1)² + (y2 − y1)²)","eg":"(0, 0) to (3, 4): 5"},{"lead":"<b>The midpoint of a side is the average of each coordinate.<\/b>","rest":"Average the x values, then average the y values. It works for any slant.","f":"M = ( (x1 + x2)/2 , (y1 + y2)/2 )","eg":"(0, 0) and (6, 2) → (3, 1)"},{"lead":"<b>The shoelace rule gives the area from the corners alone.<\/b>","rest":"Go round the shape one way. Cross-multiply each pair of neighbours, add them up with signs, and halve.","f":"Area = ½ |x1y2 − x2y1 + x2y3 − x3y2 + …|","eg":"(0, 0), (4, 0), (0, 3): ½ × |0 + 12 − 0| = 6"},{"lead":"<b>A corner is square when the two sides meeting there have slopes that multiply to −1.<\/b>","rest":"The board tests this with the gaps across and up.","f":"m1 × m2 = −1","eg":"slopes 2 and −½ → the corner is square"},{"lead":"<b>Flipping in the across-axis changes the sign of every y.<\/b>","rest":"The shape lands below where it was, the same size and the same shape.","f":"(x, y) → (x, −y)","eg":"(3, 2) → (3, −2)"},{"lead":"<b>Flipping in the up-axis changes the sign of every x.<\/b>","rest":"Left becomes right. Again nothing about the size changes.","f":"(x, y) → (−x, y)","eg":"(3, 2) → (−3, 2)"},{"lead":"<b>Sliding adds the same pair to every corner.<\/b>","rest":"The shape keeps its size, its shape and its slant. Only the position moves.","f":"(x, y) → (x + h, y + k)","eg":"(3, 2) slid by (1, −4) → (4, −2)"},{"lead":"<b>Lengths and area survive a flip or a slide. Coordinates do not.<\/b>","rest":"That is the whole point of these three buttons.","f":"length, area: same · each point: moved"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 460\"><line x1=\"20\" y1=\"430\" x2=\"20\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"52\" y1=\"430\" x2=\"52\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"84\" y1=\"430\" x2=\"84\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"116\" y1=\"430\" x2=\"116\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"148\" y1=\"430\" x2=\"148\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"180\" y1=\"430\" x2=\"180\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"212\" y1=\"430\" x2=\"212\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"244\" y1=\"430\" x2=\"244\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"276\" y1=\"430\" x2=\"276\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"308\" y1=\"430\" x2 t class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"332\" y=\"178\" text-anchor=\"end\">2<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"332\" y=\"114\" text-anchor=\"end\">4<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"332\" y=\"252\" text-anchor=\"end\">0<\/text><text class=\"slabel\" style=\"fill:var(--ink-3);font-size:10px\" x=\"673\" y=\"242\" text-anchor=\"middle\">x<\/text><text class=\"slabel\" style=\"fill:var(--ink-3);font-size:10px\" x=\"328\" y=\"42\" text-anchor=\"end\">y<\/text><polygon points=\"148,334 468,334 532,142 244,110\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2;stroke-linejoin:round\"><\/polygon><circle cx=\"308\" cy=\"334\" r=\"4\" style=\"fill:var(--green)\"><\/circle><circle cx=\"500\" cy=\"238\" r=\"4\" style=\"fill:var(--green)\"><\/circle><circle cx=\"388\" cy=\"126\" r=\"4\" style=\"fill:var(--green)\"><\/circle><circle cx=\"196\" cy=\"222\" r=\"4\" style=\"fill:var(--green)\"><\/circle><text class=\"slabel b numtxt\" x=\"106.17\" y=\"347.33\" text-anchor=\"middle\">A(−6, −3)<\/text><text class=\"slabel b numtxt\" x=\"498.09\" y=\"352.14\" text-anchor=\"middle\">B(4, −3)<\/text><text class=\"slabel b numtxt\" x=\"568.84\" y=\"137.36\" text-anchor=\"middle\">C(6, 3)<\/text><text class=\"slabel b numtxt\" x=\"219.91\" y=\"97.16\" text-anchor=\"middle\">D(−3, 4)<\/text><text class=\"slabel  numtxt\" x=\"308\" y=\"362\" text-anchor=\"middle\">10<\/text><text class=\"slabel  numtxt\" x=\"480.32\" y=\"226.4\" text-anchor=\"middle\">6.32<\/text><text class=\"slabel  numtxt\" x=\"390.06\" y=\"106.19\" text-anchor=\"middle\">9.06<\/text><text class=\"slabel  numtxt\" x=\"167.62\" y=\"218.22\" text-anchor=\"middle\">7.62<\/text><circle class=\"handle\" cx=\"148\" cy=\"334\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"468\" cy=\"334\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"532\" cy=\"142\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"244\" cy=\"110\" r=\"8\"><\/circle><text class=\"slabel b numtxt\" x=\"22\" y=\"24\" text-anchor=\"start\">area = 63  ·  perimeter = 33<\/text><text class=\"slabel \" x=\"658\" y=\"24\" text-anchor=\"end\">green dots: the middle of each side<\/text><\/svg>","sec":"coord","fm":["Distance between two points","Midpoint of a segment","Area of a triangle from its vertices","Slope from two points","Perpendicular slopes multiply to −1","Reflection across the axes","Reflection through the origin and across y = x","Translating a graph","Collinearity of three points","Rectangle: area and perimeter"]},"cb_curve":{"title":"A curve and a line on the same grid","tag":"Coordinate Geometry","say":"The sliders a, b and c set the parabola y = ax² + bx + c. Drag the two blue dots to move the red line. The vertex, the axis of symmetry and the two intercepts all answer at once. So does the b² − 4ac test, and the list of meeting points. The second button swaps in the fraction curve y = (x − p) / (x − q). The p and q sliders take over there.","note":"","tries":["Set a to 1 and slide c up slowly. Watch b² − 4ac fall through zero. The two x-cuts slide together, touch, and then vanish.","Slide a through zero. The x² term disappears, the bend goes with it, and what is left is the straight line y = bx + c.","Make a negative. The curve turns over, the lowest point becomes the highest point, and the arms point down.","Drag the red line down until it just kisses the curve. At that moment they meet at exactly one point, and its own test is zero.","Press the fraction curve. Slide q and watch the upright line it chases move with it. The curve never crosses that line, however close it gets."],"ideas":[{"lead":"<b>The vertex sits half-way between the two x-intercepts.<\/b>","rest":"Its x is found from a and b alone, and its y comes from putting that x back in.","f":"x = −b / (2a)","eg":"y = x² − 6x + 5: x = 6 ÷ 2 = 3, half-way between 1 and 5"},{"lead":"<b>The sign of a says which way the parabola opens.<\/b>","rest":"A positive a opens upwards and the vertex is the lowest point. A negative a opens downwards.","f":"a &gt; 0 lowest · a &lt; 0 highest","eg":"y = x² opens up · y = −x² opens down"},{"lead":"<b>b² − 4ac counts the x-intercepts before you solve anything.<\/b>","rest":"Above zero gives two cuts, exactly zero gives one touch, below zero gives none.","f":"b² − 4ac","eg":"x² − 6x + 5: 36 − 20 = 16 > 0 → two x-intercepts"},{"lead":"<b>The quadratic formula gives the x-intercepts themselves.<\/b>","rest":"The same b² − 4ac sits under the square-root sign, which is why its sign decides how many there are.","f":"x = (−b ± √(b² − 4ac)) / (2a)","eg":"x² − 6x + 5: x = (6 ± 4) ÷ 2 = 5 or 1"},{"lead":"<b>The y-intercept of the parabola is c.<\/b>","rest":"Put x = 0 in and the first two terms vanish, leaving c on its own.","f":"x = 0 → y = c","eg":"y = x² − 6x + 5 crosses the y-axis at (0, 5)"},{"lead":"<b>To find where a line meets a curve, set them equal.<\/b>","rest":"You get one quadratic. Its own b² − 4ac counts the meeting points: two, one or none.","f":"ax² + bx + c = mx + k","eg":"x² = x + 2 → x² − x − 2 = 0 → x = 2 or −1"},{"lead":"<b>A fraction is zero only when its top is zero.<\/b>","rest":"So y = (x − p)/(x − q) is zero at x = p. That holds as long as the bottom is not zero there too.","f":"y = 0 at x = p","eg":"y = (x − 2)/(x + 1) is 0 at x = 2"},{"lead":"<b>A fraction has no value when its bottom is zero.<\/b>","rest":"At x = q there is nothing to plot, so the curve is cut in two there.","f":"no value at x = q","eg":"y = (x − 2)/(x + 1) has no value at x = −1"},{"lead":"<b>The curve chases two lines it never touches.<\/b>","rest":"These lines are called asymptotes: lines the curve creeps closer and closer to without ever reaching them.","f":"x = q and y = 1","eg":"y = (x − 2)/(x + 1) chases x = −1 and y = 1"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 460\"><line x1=\"20\" y1=\"430\" x2=\"20\" y2=\"46\ 38\" text-anchor=\"middle\">lowest (1/2, −9/4)<\/text><circle class=\"handle\" cx=\"212\" cy=\"366\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"468\" cy=\"110\" r=\"8\"><\/circle><text class=\"slabel b numtxt\" x=\"22\" y=\"24\" text-anchor=\"start\">y = x² − x − 2<\/text><text class=\"slabel \" x=\"658\" y=\"24\" text-anchor=\"end\">amber rings: where they meet<\/text><\/svg>","sec":"coord","fm":["Vertex of a parabola","Vertex form and the maximum or minimum","The discriminant","The quadratic formula","Factoring a quadratic","Sum and product of the roots","Axis of symmetry from two equal heights","Completing the square","Translating a graph","Function notation"]},"cb_spread":{"title":"Nine values you can drag","tag":"Statistics","say":"Nine dots sit on a number line. Drag any dot left or right and it lands on a whole number. The mean, the median, the mode, the range, the quartiles and the standard deviation all answer at the same time. Two markers sit under the line. The green one is the mean and the blue one is the median. Grey ghosts show where those two started, so you can see which one your dragging has moved.","note":"","tries":["Drag the dot on the far right out to 20. The green mean marker walks right with it. The blue median marker does not move at all. That one difference is most of this section.","Now drag a middle dot past its neighbour. This time the median jumps and the range stays still. The two markers have swapped jobs.","Pile four dots on one number. The mode jumps to that number. The standard deviation shrinks, because most of the values now sit close to the mean.","Press <b>the range and the quartiles<\/b>, then pull the far right dot out again. The range stretches and the interquartile range does not move at all.","Spread the nine dots out evenly. The mean and the median land on the same spot, and the line under the readings says so."],"ideas":[{"lead":"<b>The mean shares the total out evenly.<\/b>","rest":"Add the nine values, then divide by nine. Every dot has a say in it. Move one dot by one step and the mean moves one ninth of a step.","f":"mean = total ÷ how many","eg":"2, 4, 9: total 15 ÷ 3 = 5"},{"lead":"<b>The median is the middle value after sorting.<\/b>","rest":"Positions run from 1 to n. The middle position is halfway between those two ends, at (n + 1) ÷ 2. With nine values that is the fifth one. A dot can move a long way and leave the median alone, as long as it stays on its own side.","f":"position of the median = (n + 1) ÷ 2","eg":"3, 1, 9, 4, 7 → 1, 3, 4, 7, 9 → median 4"},{"lead":"<b>The mode is the value that turns up most often.<\/b>","rest":"If no value repeats there is no mode. Two values can tie for the top count, and then the list has two modes.","f":"mode = the value with the highest count","eg":"2, 3, 3, 5 → mode 3"},{"lead":"<b>The range is the biggest take away the smallest.<\/b>","rest":"Only the two end dots matter to it. The seven dots in the middle can sit wherever they like.","f":"range = biggest − smallest","eg":"smallest 2, biggest 9 → range 7"},{"lead":"<b>The quartiles cut the sorted list into four equal parts.<\/b>","rest":"Q1 is the first quartile and Q3 is the third. The median already sits halfway along the run of positions. Cut again and you land a quarter of the way along, at position (n + 1) ÷ 4.","f":"Q1 at (n + 1) ÷ 4 &nbsp;·&nbsp; Q3 at 3(n + 1) ÷ 4","eg":"1 to 7 (seven values): Q1 is the 2nd = 2, Q3 is the 6th = 6"},{"lead":"<b>The interquartile range is the gap from Q1 to Q3.<\/b>","rest":"Half of the nine values sit inside that middle half. One far-out dot cannot move it, and that is why it beats the range for saying how tight a list is.","f":"interquartile range = Q3 − Q1","eg":"Q1 = 2, Q3 = 6 → IQR = 4"},{"lead":"<b>The standard deviation is the typical distance from the mean.<\/b>","rest":"Square each gap from the mean, because squaring makes every gap positive. Raw gaps would cancel to nothing. Take the mean of those squares. Then take the square root, which brings you back to the first units.","f":"SD = √( Σ(x − M)² ÷ n )","eg":"2, 4, 4, 4, 5, 5, 7, 9 (mean 5): squares add to 32, 32 ÷ 8 = 4, SD = 2"},{"lead":"<b>The mean is the balance point of the dots.<\/b>","rest":"Add up the gaps of the dots on its left. Add up the gaps of the dots on its right. The two totals always match.","f":"Σ(x − M) = 0","eg":"2, 5, 8 (mean 5): (−3) + 0 + 3 = 0"},{"lead":"<b>One far-out value pulls the mean and leaves the median.<\/b>","rest":"So in a lopsided list the median is the fairer middle. A great many test questions turn on this one point.","f":"mean &gt; median means a long right tail","eg":"1, 2, 3, 4, 100: median 3, mean 22"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 860 500\"><text class=\"slabel \" x=\"430\" y=\"26\" text-anchor=\"middle\">the mean walks with a far-out dot · the median does not<\/text><line x1=\"42\" y1=\"300\" x2=\"830\" y2=\"300\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"56\" y1=\"300\" x2=\"56\" y2=\"307\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"56\" y=\"322\" text-anchor=\"middle\">0<\/text><line x1=\"94\" y1=\"300\" x2=\"94\" y2=\"304\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"132\" y1=\"300\" x2=\"132\" y2=\"307\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"132\" y=\"322\" text-anchor=\"middle\">2<\/text><line x1=\"170\" y1=\"300\" x2=\"170\" y2=\"304\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"208\" y1=\"300\" x2=\"208\" y2=\"307\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"208\" y=\"322\" text-anchor=\"middle\">4<\/text><line x1=\"246\" y1=\"300\" x2=\"246\" y2=\"304\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"284\" y1=\"300\" x2=\"284\" y2=\"307\" style=\"stroke: dle\">18<\/text><line x1=\"778\" y1=\"300\" x2=\"778\" y2=\"304\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"816\" y1=\"300\" x2=\"816\" y2=\"307\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"816\" y=\"322\" text-anchor=\"middle\">20<\/text><line x1=\"271\" y1=\"266\" x2=\"297\" y2=\"266\" style=\"stroke:var(--amber);stroke-width:3;fill:none\"><\/line><text class=\"slabel a\" x=\"284\" y=\"283\" text-anchor=\"middle\">mode<\/text><line x1=\"322\" y1=\"300\" x2=\"322\" y2=\"332\" style=\"stroke:var(--blue);stroke-width:4.5;fill:none\"><\/line><line x1=\"360\" y1=\"300\" x2=\"360\" y2=\"340\" style=\"stroke:var(--green);stroke-width:2.2;fill:none\"><\/line><text class=\"slabel b numtxt\" x=\"322\" y=\"356\" text-anchor=\"middle\">median = 7<\/text><line x1=\"360\" y1=\"341\" x2=\"429.8\" y2=\"341\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"360\" y1=\"338\" x2=\"360\" y2=\"344\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel g numtxt\" x=\"429.8\" y=\"356\" text-anchor=\"middle\">mean = 72 ÷ 9 = 8<\/text><line x1=\"360\" y1=\"300\" x2=\"360\" y2=\"392\" style=\"stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:4 4;fill:none\"><\/line><line x1=\"322\" y1=\"300\" x2=\"322\" y2=\"422\" style=\"stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:4 4;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"360\" y=\"378\" text-anchor=\"middle\">started at 8<\/text><circle cx=\"360\" cy=\"392\" r=\"4.5\" style=\"fill:none;stroke:var(--green);stroke-width:2\"><\/circle><text class=\"slabel g\" x=\"360\" y=\"408\" text-anchor=\"middle\">the mean has not moved<\/text><circle cx=\"322\" cy=\"422\" r=\"4.5\" style=\"fill:none;stroke:var(--blue);stroke-width:2\"><\/circle><text class=\"slabel b\" x=\"322\" y=\"438\" text-anchor=\"middle\">the median has not moved<\/text><line x1=\"170\" y1=\"462\" x2=\"588\" y2=\"462\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><polygon points=\"360,462 351,478 369,478\" style=\"fill:var(--green)\"><\/polygon><text class=\"slabel  numtxt\" x=\"265\" y=\"458\" text-anchor=\"middle\">pull 13<\/text><text class=\"slabel  numtxt\" x=\"474\" y=\"458\" text-anchor=\"middle\">pull 13<\/text><circle class=\"handle\" cx=\"170\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"170\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"246\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"246\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"284\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"284\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"284\" cy=\"229\" r=\"8\"><\/circle><circle cx=\"284\" cy=\"229\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"322\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"322\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"398\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"398\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"436\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"436\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"512\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"512\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"588\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"588\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><text class=\"slabel  numtxt\" x=\"170\" y=\"236\" text-anchor=\"middle\">3<\/text><text class=\"slabel  numtxt\" x=\"246\" y=\"236\" text-anchor=\"middle\">5<\/text><text class=\"slabel  numtxt\" x=\"284\" y=\"215\" text-anchor=\"middle\">6<\/text><text class=\"slabel  numtxt\" x=\"322\" y=\"236\" text-anchor=\"middle\">7<\/text><text class=\"slabel  numtxt\" x=\"398\" y=\"236\" text-anchor=\"middle\">9<\/text><text class=\"slabel  numtxt\" x=\"436\" y=\"236\" text-anchor=\"middle\">10<\/text><text class=\"slabel  numtxt\" x=\"512\" y=\"236\" text-anchor=\"middle\">12<\/text><text class=\"slabel  numtxt\" x=\"588\" y=\"236\" text-anchor=\"middle\">14<\/text><\/svg>","sec":"stat","fm":["The arithmetic mean","The mean as a total","The total behind a mean","The median by position","The mode","The range","The quartile positions","The interquartile range","Standard deviation, written out"]},"cb_normal":{"title":"The normal distribution, all at once","tag":"Statistics","say":"Slide the mean and the normal distribution slides with it. Slide the standard deviation and the bell stretches or squeezes. The area under it never changes. The shaded bands are the 68, 95 and 99.7 per cent bands. Drag the marker along the curve. It reads the z-score, the number of standard deviations from the mean. It also reads the percentile, the share of values below it.","note":"","tries":["Move the <b>mean<\/b> slider from end to end. The whole picture slides sideways. The bands keep their widths and the shape never changes.","Move the <b>standard deviation<\/b> slider from end to end. The bell gets wider and flatter, or narrower and taller, but the middle stays put.","Drag the marker to sit exactly on a band edge. The z-score comes out a whole number, and the percentile matches the rounded ladder.","Park the marker on one value, then slide the standard deviation. The value has not moved, yet its z-score changes, because the yardstick changed.","Press <b>the six slices<\/b> and read the six numbers left to right. They are 2, 14, 34, 34, 14 and 2 per cent, and they always are."],"ideas":[{"lead":"<b>The normal distribution is set by two numbers only.<\/b>","rest":"The mean says where the middle is. The standard deviation says how wide the middle lump is. Nothing else about the shape can change.","f":"the curve is fixed by the mean and the standard deviation","eg":"mean 100 and SD 15 fix the whole curve"},{"lead":"<b>Moving the mean slides the curve, it does not reshape it.<\/b>","rest":"Add 10 to every value and the mean goes up by 10. The standard deviation does not move at all.","f":"new mean = M + 10 · SD stays SD","eg":"mean 100 → 110: the curve slides right, SD stays 15"},{"lead":"<b>The standard deviation is the stretch.<\/b>","rest":"Double it and the curve is twice as wide and half as tall. The area under it is still one whole, because it still holds every value.","f":"area under the whole curve = 1","eg":"SD 15 → 30: the same area, spread flatter and wider"},{"lead":"<b>A z-score says how far out a value is.<\/b>","rest":"Take the gap from the mean. One standard deviation is the width of one step. Dividing the gap by it turns the gap into steps. The answer is negative below the mean and positive above.","f":"z = (value − mean) ÷ standard deviation","eg":"mean 100, SD 15, value 130: z = 30 ÷ 15 = 2"},{"lead":"<b>Going back the other way needs the same two numbers.<\/b>","rest":"If you know the z-score, multiply by the standard deviation and add the mean.","f":"value = mean + z × standard deviation","eg":"mean 100, SD 15, z = −1: 100 − 15 = 85"},{"lead":"<b>The six slices come from the three bands.<\/b>","rest":"The middle 68 per cent splits into 34 and 34. The next band adds 95 − 68 = 27, about 14 on each side. The last adds 99.7 − 95 = 4.7, about 2 each side.","f":"2 · 14 · 34 | 34 · 14 · 2 per cent"},{"lead":"<b>Add the slices from the left and you get a percentile.<\/b>","rest":"A percentile is the share of values below a point. The running totals are about 2, 16, 50, 84 and 98 per cent.","f":"percentile = the share of values below","eg":"one SD above the mean: 2 + 14 + 34 + 34 = 84th percentile"},{"lead":"<b>68, 95 and 99.7 are areas, not guesses.<\/b>","rest":"The area under the curve between one standard deviation either side is 68 per cent. Two either side holds 95 per cent. Three either side holds 99.7 per cent. Every normal distribution gives the same three numbers.","f":"M ± SD · M ± 2SD · M ± 3SD","eg":"mean 100, SD 15: 68% lie from 85 to 115, 95% from 70 to 130"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 840 470\"><path d=\"M 312 300 L 312 298.52 L 313.8 298.28 L 315.6 298.01 L 317.4 297.7 L 319.2 297.35 L 321 296.96 L 322.8 296.52 L 324.6 296.02 L 326.4 295.46 L 328.2 294.84 L 330 294.14 L 331.8 293.37 L 333.6 292.52 L 335.4 291.57 L 337.2 290.53 L 339 289.39 L 340.8 288.14 L 342.6 286.78 L 344.4 285.3 L 346.2 283.69 L 348 281.96 L 349.8 280.08 L 351.6 278.07 L 353.4 275.91 L 355.2 273.61 L 357 271.16 L 358.8 268.57 L 360.6 265.82 L 362.4 262.93 L 364.2 259.89 L 366 256.71 L 367.8 253.4 L 369.6 249.96 L 371.4 246.4 L 373.2 242.73 L 375 238.96 L 376.8 235.1 L 378.6 231.17 L 380.4 227.19 L 382.2 223.17 L 384 219.13 L 385.8 215.09 L 387.6 211.07 L 389.4 207.09 L 391.2 203.18 L 393 199.35 L 394.8 195.64 L 396.6 192.06 L 398.4 188.63 L 400.2 185.38 L 402 182.33 L 403.8 179.51 L 405.6 176.92 L 407.4 174.59 L 409.2 172.53 L 411 170.77 L 412.8 169.31 L 414.6 168.16 L 416.4 167.33 L 418.2 166.83 L 420 166.67 L 421.8 166.83 L 423.6 167.33 L 425.4 168.16 L 427.2 169.31 L 429 170.77 L 430.8 172.53 L 432.6 174.59 L 434.4 176.92 L 436.2 179.51 L 438 182.33 L 439.8 185.38 L 441.6 188.63 L 443.4 192.06 L 445.2 195.64 L 447 199.35 L 448.8 203.18 L 450.6 207.09 L 452.4 211.07 L 454.2 215.09 L 456 219.13 L 457.8 223.17 L 459.6 227.19 L 461.4 231.17 L 463.2 235.1 L 465 238.96 L 466.8 242.73 L 468.6 246.4 L 470.4 249.96 L 472.2 253.4 L 474 256.71 L 475.8 259.89 L 477.6 262.93 L 479.4 265.82 L 481.2 268.57 L 483 271.16 L 484.8 273.61 L 486.6 275.91 L 488.4 278.07 L 490.2 280.08 L 492 281.96 L 493.8 283.69 L 495.6 285.3 L 497.4 286.78 L 499.2 288.14 L 501 289.39 L 502.8 290.53 L 504.6 291.57 L 506.4 292.52 L 508.2 293.37 L 510 294.14 L 511.8 294.84 L 513.6 295.46 L 515.4 296.02 L 517.2 296.52 L 519 296.96 L 520.8 297.35 L 522.6 297.7 L 524.4 298.01 L 526.2 298.28 L 528 298.52 L 528 300 Z\" style= nchor=\"middle\">120<\/text><line x1=\"492\" y1=\"300\" x2=\"492\" y2=\"281.96\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><circle class=\"handle\" cx=\"492\" cy=\"281.96\" r=\"8\"><\/circle><circle cx=\"492\" cy=\"281.96\" r=\"4\" style=\"fill:var(--red)\"><\/circle><text class=\"slabel r numtxt\" x=\"492\" y=\"26\" text-anchor=\"middle\">the marker stands at 72<\/text><text class=\"slabel r numtxt\" x=\"492\" y=\"44\" text-anchor=\"middle\">z-score = (72 − 60) ÷ 6 = 12 ÷ 6 = 2 standard deviations out<\/text><text class=\"slabel g numtxt\" x=\"420\" y=\"338\" text-anchor=\"middle\">mean = 60<\/text><line x1=\"384\" y1=\"362\" x2=\"456\" y2=\"362\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"384\" y1=\"358\" x2=\"384\" y2=\"366\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"456\" y1=\"358\" x2=\"456\" y2=\"366\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel b numtxt\" x=\"420\" y=\"380\" text-anchor=\"middle\">68% sit between 54 and 66, that is 60 ± 1 × 6<\/text><line x1=\"348\" y1=\"394\" x2=\"492\" y2=\"394\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"348\" y1=\"390\" x2=\"348\" y2=\"398\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"492\" y1=\"390\" x2=\"492\" y2=\"398\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel b numtxt\" x=\"420\" y=\"412\" text-anchor=\"middle\">95% sit between 48 and 72, that is 60 ± 2 × 6 = 60 ± 12<\/text><line x1=\"312\" y1=\"426\" x2=\"528\" y2=\"426\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"312\" y1=\"422\" x2=\"312\" y2=\"430\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"528\" y1=\"422\" x2=\"528\" y2=\"430\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel b numtxt\" x=\"420\" y=\"444\" text-anchor=\"middle\">99.7% sit between 42 and 78, that is 60 ± 3 × 6 = 60 ± 18<\/text><\/svg>","sec":"stat","fm":["The six normal regions","Standard units","Back from standard units","Percentile from a count","The arithmetic mean","Standard deviation, written out"]},"cb_groups":{"title":"Two groups joined: the weighted average","tag":"Statistics","say":"Two groups, each with a size and a mean. Slide any of them. The weighted average lands on the beam as a balance point. It is never halfway unless the two groups are the same size. The plain mean of the two means is drawn in red, because that is the trap. The second button shows what joining the groups does to the standard deviation.","note":"","tries":["Make group A much bigger than group B. The balance point slides right up against the mean of A, because A is carrying most of the weight.","Set the two sizes equal. Now the green mark and the red mark land on top of each other, and the plain mean is right for once.","Read the two gaps, then read the two sizes. The gaps come out in the reverse order of the sizes, every time. That is the whole alligation trick.","Press <b>the standard deviation<\/b> and pull the two means apart. The joined band gets wider than either group band, even though neither group changed inside.","Set both means to the same number and press <b>the standard deviation<\/b>. The joined band matches the group bands, because there is no gap left to add."],"ideas":[{"lead":"<b>The weighted average comes from totals, never from means.<\/b>","rest":"Turn each mean back into a total, add the two totals, then divide by the two sizes added. That is all a weighted average is.","f":"M = (n₁M₁ + n₂M₂) ÷ (n₁ + n₂)","eg":"10 people at 80 and 30 at 60: (800 + 1,800) ÷ 40 = 65"},{"lead":"<b>A mean is a total waiting to be undone.<\/b>","rest":"Size times mean gives the total back. This one step turns almost every mixing question into adding.","f":"total = n × M","eg":"5 people with mean 12 → total 60"},{"lead":"<b>The plain mean of two means is the trap.<\/b>","rest":"It is only right when the two groups are the same size. Any other time it sits on the wrong side.","f":"(M₁ + M₂) ÷ 2 is wrong unless n₁ = n₂","eg":"(80 + 60) ÷ 2 = 70, but the real answer is 65"},{"lead":"<b>The weighted average always lands nearer the bigger group.<\/b>","rest":"The total counts every value once. The bigger group hands in more values, so it drags the total further its own way. That is why the balance point slides towards it.","f":"n₁ &gt; n₂ → M is nearer M₁","eg":"65 is nearer 60, where the 30 people are"},{"lead":"<b>Alligation is the same answer read as a ratio.<\/b>","rest":"Alligation means working a mix out from the gaps. The gap from each mean to the weighted average is in the reverse ratio of the sizes.","f":"(M − M₁) : (M₂ − M) = n₂ : n₁","eg":"M₁ = 60 (30 people), M₂ = 80 (10 people), M = 65: 5 : 15 = 10 : 30"},{"lead":"<b>The reverse ratio gives you the sizes from the gaps.<\/b>","rest":"If you know the three means you know the ratio of the two sizes, without knowing either size.","f":"n₁ : n₂ = (M₂ − M) : (M − M₁)","eg":"n₁ : n₂ = (80 − 65) : (65 − 60) = 15 : 5 = 30 : 10"},{"lead":"<b>Joining two groups with different means widens the standard deviation.<\/b>","rest":"The joined standard deviation carries the spread inside each group plus the gap between the two means.","f":"SD² = s² + n₁n₂(M₁ − M₂)² ÷ (n₁ + n₂)²"},{"lead":"<b>Same means, same standard deviation.<\/b>","rest":"Two groups with the same mean leave no gap to add. So joining them leaves the standard deviation exactly where it already was.","f":"M₁ = M₂ → SD = s"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 840 440\"><text class=\"slabel \" x=\"420\" y=\"28\" text-anchor=\"middle\">the weighted average is the balance point of the two groups<\/text><rect x=\"337.9\" y=\"197\" width=\"144.2\" height=\"6\" style=\"fill:var(--ink-3);stroke:none\"><\/rect><rect x=\"298\" y=\"158\" width=\"84\" height=\"42\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2\"><\/rect><rect x=\"438\" y=\"166\" width=\"84\" height=\"34\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2\"><\/rect><line x1=\"340\" y1=\"158\" x2=\"340\" y2=\"200\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><line x1=\"480\" y1=\"166\" x2=\"480\" y2=\"200\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><text class=\"slabel b numtxt\" x=\"340\" y=\"128\" text-anchor=\"middle\">A: 12 values, mean 40, total 12 × 40 = 480<\/text><text class=\"slabel b numtxt\" x=\"480\" y=\"146\" text-anchor=\"middle\">B: 8 values, mean 60, total 8 × 60 = 480<\/text><polygon points=\"396,200 384,222 408,222\" style=\"fill:var(--green);fill-opacity:.25;stroke:var(--green);stroke-width:2\"><\/polygon><text class=\"slabel  numtxt\" x=\"368\" y=\"234\" text-anchor=\"middle\">gap = 8<\/text><line x1=\"340\" y1=\"244\" x2=\"396\" y2=\"244\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"340\" y1=\"239\" x2=\"340\" y2=\"249\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"396\" y1=\"239\" x2=\"396\" y2=\"249\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"438\" y=\"262\" text-anchor=\"middle\">gap = 12<\/text><line x1=\"396\" y1=\"272\" x2=\"480\" y2=\"272\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"396\" y1=\"267\" x2=\"396\" y2=\"277\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"480\" y1=\"267\" x2=\"480\" y2=\"277\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><polygon points=\"396,298 388,284 404,284\" style=\"fill:var(--green);stroke:none\"><\/polygon><polygon points=\"410,298 402,284 418,284\" style=\"fill:none;stroke:var(--red);stroke-width:2\"><\/polygon><line x1=\"50\" y1=\"300\" x2=\"770\" y2=\"300\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"60\" y1=\"300\" x2=\"60\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"60\" y=\"320\" text-anchor=\"middle\">0<\/text><line x1=\"130\" y1=\"300\" x2=\"130\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"130\" y=\"320\" text-anchor=\"middle\">10<\/text><line x1=\"200\" y1=\"300\" x2=\"200\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"200\" y=\"320\" text-anchor=\"middle\">20<\/text><line x1=\"270\" y1=\"300\" x2=\"270\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"270\" y=\"320\" text-anchor=\"middle\">30<\/text><line x1=\"340\" y1=\"300\" x2=\"340\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"340\" y=\"320\" text-anchor=\"middle\">40<\/text><line x1=\"410\" y1=\"300\" x2=\"410\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"410\" y=\"320\" text-anchor=\"middle\">50<\/text><line x1=\"480\" y1=\"300\" x2=\"480\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"480\" y=\"320\" text-anchor=\"middle\">60<\/text><line x1=\"550\" y1=\"300\" x2=\"550\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"550\" y=\"320\" text-anchor=\"middle\">70<\/text><line x1=\"620\" y1=\"300\" x2=\"620\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"620\" y=\"320\" text-anchor=\"middle\">80<\/text><line x1=\"690\" y1=\"300\" x2=\"690\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"690\" y=\"320\" text-anchor=\"middle\">90<\/text><line x1=\"760\" y1=\"300\" x2=\"760\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"760\" y=\"320\" text-anchor=\"middle\">100<\/text><line x1=\"396\" y1=\"300\" x2=\"396\" y2=\"308\" style=\"stroke:var(--green);stroke-width:3;fill:none\"><\/line><line x1=\"410\" y1=\"300\" x2=\"410\" y2=\"308\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><text class=\"slabel g numtxt\" x=\"396\" y=\"344\" text-anchor=\"middle\">the weighted average = (480 + 480) ÷ 20 = 960 ÷ 20 = 48<\/text><text class=\"slabel r numtxt\" x=\"410\" y=\"368\" text-anchor=\"middle\">plain mean of the two means = (40 + 60) ÷ 2 = 50 — the trap<\/text><text class=\"slabel  numtxt\" x=\"420\" y=\"398\" text-anchor=\"middle\">gaps 2 : 3 &nbsp; sizes 3 : 2 &nbsp; the reverse of each other<\/text><text class=\"slabel  numtxt\" x=\"420\" y=\"424\" text-anchor=\"middle\">standard deviation inside each group 6 &nbsp; standard deviation of the joined group 11.5<\/text><\/svg>","sec":"stat","fm":["The combined mean of two groups","Weighted average of two groups","The weighted mean","Alligation: the mixing ratio","The mean as a total","The arithmetic mean"]},"cb_sets":{"title":"Two groups that overlap, all at once","tag":"Data Analysis","say":"The box is everyone. Each circle is one set, which is just a named group. The part where the circles cross is the overlap, the people in both. Everyone in at least one set makes the union. Move the sliders and every count answers at once. The last button puts a third set in. Each region prints its own count, so you can add them up with your eyes.","note":"","tries":["Push group A and group B up until they add to more than the total. The overlap slider stops going down. Some people have to be in both.","Set the overlap to zero. The count in at least one becomes group A plus group B, with nothing taken off.","Push the overlap up to the size of the smaller group. That group now sits completely inside the bigger one, and its own region empties.","Drop the total until it matches the number in at least one. The people in neither run out, and the box is full.","Press the third circle button. The adding and taking off happens three times over, and the middle piece has to come back once."],"ideas":[{"lead":"<b>Add the two sets, then take the overlap off once.<\/b>","rest":"Adding counts the people in the overlap twice. Taking the overlap off once puts that right, and what is left is the union.","f":"the union = A + B − both","eg":"20 like tea, 15 like coffee, 5 like both: 20 + 15 − 5 = 30"},{"lead":"<b>Everyone sits in one of four regions.<\/b>","rest":"In set A only, in the overlap, in set B only, or in neither. Those four counts always add up to the total.","f":"A only + both + B only + neither = total","eg":"tea only 15 + both 5 + coffee only 10 + neither 10 = 40"},{"lead":"<b>The ones in neither set are what is left over.<\/b>","rest":"Take the union away from the total and that is what you get.","f":"neither = total − the union","eg":"40 people, 30 in the union → 10 in neither"},{"lead":"<b>The overlap can never beat the smaller set.<\/b>","rest":"Every person in both sets is also in each set on its own.","f":"both ≤ the smaller of A and B","eg":"A = 20, B = 15 → both is at most 15"},{"lead":"<b>When the two sets overrun the total, an overlap is forced.<\/b>","rest":"The amount they overrun by is the least the overlap can be.","f":"both ≥ A + B − total","eg":"A = 30, B = 25, total 40 → both is at least 15"},{"lead":"<b>With three sets you add, take each pair overlap off, then put the middle back.<\/b>","rest":"The middle piece is taken off three times, so it has to come back once.","f":"A + B + C − (the three pairs) + all three","eg":"10 + 12 + 8 − (4 + 3 + 2) + 1 = 22"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 560\"><rect x=\"28\" y=\"58\" width=\"624\" height=\"412\" rx=\"8\" style=\"fill:none;stroke:var(--ink-3);stroke-width:1.5\"><\/rect><text class=\"slabel b numtxt\" x=\"340\" y=\"40\" text-anchor=\"middle\">the box is everyone: 48 people<\/text><text class=\"slabel  numtxt\" x=\"44\" y=\"82\" text-anchor=\"start\">everyone (48)<\/text><text class=\"slabel \" x=\"44\" y=\"440\" text-anchor=\"start\">in neither<\/text><text class=\"slabel g numtxt\" x=\"44\" y=\"458\" text-anchor=\"start\">12<\/text><circle cx=\"255\" cy=\"264\" r=\"125\" style=\"fill:var(--blue);fill-opacity:.13;stroke:var(--blue);stroke-width:2\"><\/circle><circle cx=\"385\" cy=\"264\" r=\"125\" style=\"fill:var(--blue);fill-opacity:.13;stroke:var(--blue);stroke-width:2\"><\/circle><text class=\"slabel b\" x=\"195\" y=\"187\" text-anchor=\"middle\">group A<\/text><text class=\"slabel b\" x=\"445\" y=\"187\" text-anchor=\"middle\">group B<\/text><text class=\"slabel \" x=\"195\" y=\"259\" text-anchor=\"middle\">A only<\/text><text class=\"slabel b numtxt\" x=\"195\" y=\"279\" text-anchor=\"middle\">18<\/text><text class=\"slabel \" x=\"320\" y=\"259\" text-anchor=\"middle\">in both<\/text><text class=\"slabel r numtxt\" x=\"320\" y=\"279\" text-anchor=\"middle\">6<\/text><text class=\"slabel \" x=\"445\" y=\"259\" text-anchor=\"middle\">B only<\/text><text class=\"slabel b numtxt\" x=\"445\" y=\"279\" text-anchor=\"middle\">12<\/text><line x1=\"160\" y1=\"504\" x2=\"560\" y2=\"504\" style=\"stroke:var(--line-2);stroke-width:7;stroke-linecap:round\"><\/line><line x1=\"160\" y1=\"504\" x2=\"560\" y2=\"504\" style=\"stroke:var(--green);stroke-width:7;stroke-linecap:round\"><\/line><circle cx=\"293.33\" cy=\"504\" r=\"7\" style=\"fill:var(--panel);stroke:var(--red);stroke-width:3\"><\/circle><text class=\"slabel g numtxt\" x=\"144\" y=\"508\" text-anchor=\"end\">at least 0<\/text><text class=\"slabel g numtxt\" x=\"576\" y=\"508\" text-anchor=\"start\">at most 18<\/text><text class=\"slabel r numtxt\" x=\"293.33\" y=\"486\" text-anchor=\"middle\">the overlap is 6<\/text><text class=\"slabel \" x=\"340\" y=\"534\" text-anchor=\"middle\">the overlap is squeezed between these two<\/text><\/svg>","sec":"da","fm":["The union of two categories","The least possible overlap","A total from a table of categories","The union of two events"]},"cb_count":{"title":"Choosing and arranging, all at once","tag":"Data Analysis","say":"Set how many things you have and how many you pick. The four counting answers sit in one square. A permutation is a line-up where the order counts. A combination is a pick where the order does not count. Each of the two comes with things put back or not. The other buttons draw every choice one by one. They show how fast the factorial ladder climbs. They show what happens when some things look the same. They show why choosing is the same as leaving behind.","note":"","tries":["Set n to 5 and k to 2, then press the button that draws every choice. Count the rows by hand and check them against the number.","Hold n still and walk k from 0 up to n. Watch the choice count rise to a peak in the middle and fall back to 1.","Make k bigger than n. The two counts without putting back drop to zero, because you cannot pick more different things than you own.","Press the factorial ladder and slide n from 1 to 12. Each step multiplies by the next number, so the bars run away from you.","Press the last button. Whatever you set, choosing k and leaving n minus k give the same number every time."],"ideas":[{"lead":"<b>A permutation is a line-up where the order counts.<\/b>","rest":"You get n ways for the first pick, then n minus one for the second, and so on. The same count is n! divided by (n minus k)!","f":"P(n, k) = n! / (n − k)!","eg":"P(5, 2) = 5 × 4 = 20"},{"lead":"<b>A combination is a pick where the order does not count.<\/b>","rest":"Each set of k things can be lined up in k factorial ways. Those line-ups all count as one pick, so divide by k factorial.","f":"C(n, k) = n! / (k! × (n − k)!)","eg":"C(5, 2) = 20 ÷ 2 = 10"},{"lead":"<b>Putting things back means every pick still has n choices.<\/b>","rest":"Nothing is used up, so the count is n multiplied by itself k times.","f":"with putting back, order counts: n to the power k","eg":"3 picks from 4, putting back: 4³ = 64"},{"lead":"<b>Choosing k is the same as leaving n minus k behind.<\/b>","rest":"Every combination names its own leftovers, so the two counts have to match.","f":"C(n, k) = C(n, n − k)","eg":"C(10, 8) = C(10, 2) = 45"},{"lead":"<b>Things that look the same wipe out the extra orders.<\/b>","rest":"Divide n factorial by the factorial of each block of matching items.","f":"n! / (a! × b! × …)","eg":"LEVEL: 5! ÷ (2! × 2!) = 30"},{"lead":"<b>A factorial grows faster than anything else on this board.<\/b>","rest":"A factorial multiplies every whole number from n down to 1, so the ladder runs away.","f":"n! = n × (n − 1) × … × 2 × 1","eg":"5! = 120 · 10! = 3,628,800"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 460\"><text class=\"slabel b numtxt\" x=\"340\" y=\"34\" text-anchor=\"middle\">8 things on the table, and you take 3 of them<\/text><rect x=\"178\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--green);fill-opacity:.2;stroke:var(--green);stroke-width:2\"><\/rect><rect x=\"220\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--green);fill-opacity:.2;stroke:var(--green);stroke-width:2\"><\/rect><rect x=\"262\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--green);fill-opacity:.2;stroke:var(--green);stroke-width:2\"><\/rect><rect x=\"304\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.6\"><\/rect><rect x=\"346\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.6\"><\/rect><rect x=\"388\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.6\"><\/rect><rect x=\"430\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.6\"><\/rect><rect x=\"472\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.6\"><\/rect><text class=\"slabel \" x=\"193\" y=\"82\" text-anchor=\"middle\">A<\/text><text class=\"slabel \" x=\"235\" y=\"82\" text-anchor=\"middle\">B<\/text><text class=\"slabel \" x=\"277\" y=\"82\" text-anchor=\"middle\">C<\/text><text class=\"slabel \" x=\"319\" y=\"82\" text-anchor=\"middle\">D<\/text><text class=\"slabel \" x=\"361\" y=\"82\" text-anchor=\"middle\">E<\/text><text class=\"slabel \" x=\"403\" y=\"82\" text-anchor=\"middle\">F<\/text><text class=\"slabel \" x=\"445\" y=\"82\" text-anchor=\"middle\">G<\/text><text class=\"slabel \" x=\"487\" y=\"82\" text-anchor=\"middle\">H<\/text><text class=\"slabel g numtxt\" x=\"340\" y=\"120\" text-anchor=\"middle\">the green ones are one possible pick of 3<\/text><rect x=\"56\" y=\"140\" width=\"568\" height=\"260\" rx=\"6\" style=\"fill:none;stroke:var(--line-2);stroke-width:1.2\"><\/rect><line x1=\"56\" y1=\"180\" x2=\"624\" y2=\"180\" style=\"stroke:var(--line-2);stroke-width:1.2;fill:none\"><\/line><line x1=\"56\" y1=\"290\" x2=\"624\" y2=\"290\" style=\"stroke:var(--line-2);stroke-width:1.2;fill:none\"><\/line><line x1=\"216\" y1=\"140\" x2=\"216\" y2=\"400\" style=\"stroke:var(--line-2);stroke-width:1.2;fill:none\"><\/line><line x1=\"420\" y1=\"140\" x2=\"420\" y2=\"400\" style=\"stroke:var(--line-2);stroke-width:1.2;fill:none\"><\/line><text class=\"slabel \" x=\"318\" y=\"164\" text-anchor=\"middle\">without putting back<\/text><text class=\"slabel \" x=\"522\" y=\"164\" text-anchor=\"middle\">with putting back<\/text><text class=\"slabel b\" x=\"136\" y=\"228\" text-anchor=\"middle\">order<\/text><text class=\"slabel b\" x=\"136\" y=\"246\" text-anchor=\"middle\">matters<\/text><text class=\"slabel b\" x=\"136\" y=\"338\" text-anchor=\"middle\">order does<\/text><text class=\"slabel b\" x=\"136\" y=\"356\" text-anchor=\"middle\">not matter<\/text><text class=\"slabel  numtxt\" x=\"318\" y=\"208\" text-anchor=\"middle\">8 × 7 × 6<\/text><text class=\"slabel g numtxt\" x=\"318\" y=\"236\" text-anchor=\"middle\">= 336<\/text><text class=\"slabel \" x=\"318\" y=\"264\" text-anchor=\"middle\">n! / (n − k)!<\/text><text class=\"slabel  numtxt\" x=\"522\" y=\"208\" text-anchor=\"middle\">8 × 8 × 8<\/text><text class=\"slabel g numtxt\" x=\"522\" y=\"236\" text-anchor=\"middle\">= 512<\/text><text class=\"slabel \" x=\"522\" y=\"264\" text-anchor=\"middle\">n to the power k<\/text><text class=\"slabel  numtxt\" x=\"318\" y=\"318\" text-anchor=\"middle\">336 ÷ 6<\/text><text class=\"slabel g numtxt\" x=\"318\" y=\"346\" text-anchor=\"middle\">= 56<\/text><text class=\"slabel \" x=\"318\" y=\"374\" text-anchor=\"middle\">n! / (k! × (n − k)!)<\/text><text class=\"slabel  numtxt\" x=\"522\" y=\"318\" text-anchor=\"middle\">choose 3 from 10<\/text><text class=\"slabel g numtxt\" x=\"522\" y=\"346\" text-anchor=\"middle\">= 120<\/text><text class=\"slabel  numtxt\" x=\"522\" y=\"374\" text-anchor=\"middle\">(n + k − 1) choose k<\/text><text class=\"slabel \" x=\"340\" y=\"430\" text-anchor=\"middle\">the left column uses things up, the right column hands them back<\/text><\/svg>","sec":"da","fm":["The counting principle","Permutations","Combinations","The symmetry of combinations","Arrangements with repeated items","Handshakes and pairs","Identical items into groups"]},"cb_prob":{"title":"A two-stage chance tree, all at once","tag":"Data Analysis","say":"Two things happen one after the other, and each can go yes or no. Drag the dot on a branch, or move the sliders, to set its probability. A probability is just the chance of a thing, written as a fraction. Along a path you multiply. Across paths you add. Every rule of the section reads off the same four paths. That includes the expected value, the average per go, once each path pays out.","note":"","tries":["Drag the dot on the top branch all the way to the far end. The first thing is then certain, and the two bottom paths fall to zero.","Set the two second-stage chances to the same number. The second result now ignores the first, and the conditional chance stops moving.","Press the at least one button and watch the three green paths add up to one minus the red path.","Make both second-stage chances small. The chance of no yes at all climbs, and the chance of at least one falls with it.","Press the payout button and push the losing amount down. The expected value crosses zero, and the game turns from worth playing to not."],"ideas":[{"lead":"<b>Along a path you multiply.<\/b>","rest":"The chance of the first branch times the chance of the second branch gives the chance of that whole path.","f":"P(first and second) = P(first) × P(second, given the first)","eg":"2 red in a row from 3 red and 2 blue: 3/5 × 2/4 = 3/10"},{"lead":"<b>Across paths you add.<\/b>","rest":"Two different paths cannot both happen, so their chances add up.","f":"P(A or B) = P(A) + P(B) when they cannot both happen","eg":"roll a 1 or a 2: 1/6 + 1/6 = 1/3"},{"lead":"<b>The four paths always add up to 1.<\/b>","rest":"One of them has to happen, so the whole tree is worth exactly one.","f":"P(1) + P(2) + P(3) + P(4) = 1","eg":"0.3 + 0.2 + 0.4 + 0.1 = 1"},{"lead":"<b>At least one is easier through its opposite.<\/b>","rest":"Work out the chance that it never happens, then take that away from 1.","f":"P(at least one) = 1 − P(none)","eg":"3 coins, at least one head: 1 − 1/8 = 7/8"},{"lead":"<b>A conditional chance is one branch of this tree.<\/b>","rest":"A conditional chance is the chance of something once you already know what happened before it.","f":"P(B given A) = P(A and B) / P(A)","eg":"P(A and B) = 0.12, P(A) = 0.4 → 0.12 ÷ 0.4 = 0.3"},{"lead":"<b>When two things do not affect each other, the two second-stage branches match.<\/b>","rest":"The first result then tells you nothing about the second.","f":"P(B given A) = P(B) when they are independent","eg":"coin then die: P(6) = 1/6 after heads and after tails"},{"lead":"<b>Expected value is each payout times its probability, all added up.<\/b>","rest":"Over a long run each path turns up as often as its chance says, so that chance is its weight. Expected value is the average you would get.","f":"expected value = sum of (probability × payout)","eg":"½ × $10 + ½ × $0 = $5"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 700 470\"><text class=\"slabel \" x=\"155\" y=\"26\" text-anchor=\"middle\">first thing<\/text><text class=\"slabel \" x=\"350\" y=\"26\" text-anchor=\"middle\">second thing<\/text><text class=\"slabel \" x=\"560\" y=\"26\" text-anchor=\"middle\">the four paths<\/text><line x1=\"60\" y1=\"235\" x2=\"250\" y2=\"120\" style=\"stroke:var(--blue);stroke-width:4.52;fill:none;stroke-linecap:round\"><\/line><line x1=\"60\" y1=\"235\" x2=\"250\" y2=\"350\" style=\"stroke:var(--blue);stroke-width:3.48;fill:none;stroke-linecap:round\"><\/line><line x1=\"250\" y1=\"120\" x2=\"450\" y2=\"65\" style=\"stroke:var(--blue);stroke-width:5.04;fill:none;stroke-linecap:round\"><\/line><line x1=\"250\" y1=\"120\" x2=\"450\" y2=\"175\" style=\"stroke:var(--blue);stroke-width:2.96;fill:none;stroke-linecap:round\"><\/line><line x1=\"250\" y1=\"350\" x2=\"450\" y2=\"295\" style=\"stroke:var(--blue);stroke-width:3.48;fill:none;stroke-linecap:round\"><\/line><line x1=\"250\" y1=\"350\" x2=\"450\" y2=\"405\" style=\"stroke:var(--blue);stroke-width:4.52;fill:none;stroke-linecap:round\"><\/line><text class=\"slabel b numtxt\" x=\"141.5\" y=\"155\" text-anchor=\"middle\">yes 3/5<\/text><text class=\"slabel b numtxt\" x=\"141.5\" y=\"315\" text-anchor=\"middle\">no 2/5<\/text><text class=\"slabel b numtxt\" x=\"343\" y=\"67\" text-anchor=\"middle\">yes 7/10<\/text><text class=\"slabel b numtxt\" x=\"343\" y=\"173\" text-anchor=\"middle\">no 3/10<\/text><text class=\"slabel b numtxt\" x=\"343\" y=\"297\" text-anchor=\"middle\">yes 2/5<\/text><text class=\"slabel b numtxt\" x=\"343\" y=\"403\" text-anchor=\"middle\">no 3/5<\/text><circle cx=\"60\" cy=\"235\" r=\"7\" style=\"fill:var(--panel);stroke:var(--ink-2);stroke-width:2\"><\/circle><circle cx=\"250\" cy=\"120\" r=\"7\" style=\"fill:var(--panel);stroke:var(--blue);stroke-width:2\"><\/circle><circle cx=\"250\" cy=\"350\" r=\"7\" style=\"fill:var(--panel);stroke:var(--blue);stroke-width:2\"><\/circle><text class=\"slabel \" x=\"60\" y=\"262\" text-anchor=\"middle\">start<\/text><text class=\"slabel b\" x=\"236\" y=\"104\" text-anchor=\"end\">first: yes<\/text><text class=\"slabel b\" x=\"236\" y=\"372\" text-anchor=\"end\">first: no<\/text><circle cx=\"450\" cy=\"65\" r=\"5\" style=\"fill:var(--blue);stroke:none\"><\/circle><text class=\"slabel b\" x=\"468\" y=\"56\" text-anchor=\"start\">yes then yes<\/text><text class=\"slabel b numtxt\" x=\"468\" y=\"74\" text-anchor=\"start\">3/5 × 7/10 = 21/50<\/text><circle cx=\"450\" cy=\"175\" r=\"5\" style=\"fill:var(--blue);stroke:none\"><\/circle><text class=\"slabel b\" x=\"468\" y=\"166\" text-anchor=\"start\">yes then no<\/text><text class=\"slabel b numtxt\" x=\"468\" y=\"184\" text-anchor=\"start\">3/5 × 3/10 = 9/50<\/text><circle cx=\"450\" cy=\"295\" r=\"5\" style=\"fill:var(--blue);stroke:none\"><\/circle><text class=\"slabel b\" x=\"468\" y=\"286\" text-anchor=\"start\">no then yes<\/text><text class=\"slabel b numtxt\" x=\"468\" y=\"304\" text-anchor=\"start\">2/5 × 2/5 = 4/25<\/text><circle cx=\"450\" cy=\"405\" r=\"5\" style=\"fill:var(--blue);stroke:none\"><\/circle><text class=\"slabel b\" x=\"468\" y=\"396\" text-anchor=\"start\">no then no<\/text><text class=\"slabel b numtxt\" x=\"468\" y=\"414\" text-anchor=\"start\">2/5 × 3/5 = 6/25<\/text><circle class=\"handle\" cx=\"174\" cy=\"166\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"390\" cy=\"81.5\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"330\" cy=\"328\" r=\"8\"><\/circle><text class=\"slabel b numtxt\" x=\"350\" y=\"456\" text-anchor=\"middle\">21/50 + 9/50 + 4/25 + 6/25 = 1<\/text><\/svg>","sec":"da","fm":["Probability","Independent events together","Mutually exclusive events","The union of two events","Conditional probability","At least one","The complement","Expected value"]},"tk_pct":{"title":"A percent and its base","tag":"Applied Arithmetic","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Percent of a number.<\/b>","rest":"A percent is a fraction with 100 underneath, so &ldquo;p per cent of N&rdquo; is nothing but a multiplication &mdash; and the word <em>of<\/em> is where the multiplication sign goes.","f":"part = <sup>p<\/sup>&frasl;<sub>100<\/sub> &middot; N","eg":"25 per cent of 240 is 0.25 &times; 240 = 60.","trap":"Past 100 the answer grows past the number itself, and below 100 it shrinks &mdash; readers who expect a percent to always shrink misread 140 per cent of 240 as smaller than 240.","fmn":"Percent of a number"},{"lead":"<b>Fraction, decimal, per cent.<\/b>","rest":"The three notations are one number wearing three coats; a percent is only the decimal shifted two places, so convert once and carry the cleanest of the three through the arithmetic.","f":"<sup>a<\/sup>&frasl;<sub>b<\/sub> = a &divide; b = (a &divide; b) &times; 100 per cent","eg":"3/8 is 3 &divide; 8 = 0.375, and 0.375 &times; 100 = 37.5 per cent.","trap":"Shifting the point the wrong way. 0.375 is 37.5 per cent, not 3.75 per cent, and 4 per cent is 0.04, not 0.4 &mdash; a tenfold error that survives every later step untouched.","fmn":"Fraction, decimal, per cent"},{"lead":"<b>What per cent one number is of another.<\/b>","rest":"The quantity that follows the word <em>of<\/em> is the base and it goes underneath; everything in percent work turns on getting that one choice right.","f":"p = 100 &middot; <sup>A<\/sup>&frasl;<sub>B<\/sub>","eg":"40 is 100 &times; 40 &divide; 50 = 80 per cent of 50, but 50 is 125 per cent of 40.","trap":"Swapping A and B. &ldquo;A is what per cent of B&rdquo; and &ldquo;B is what per cent of A&rdquo; give different answers, and only one of them is 100 &times; A &divide; B.","fmn":"What per cent one number is of another"},{"lead":"<b>Percent greater than versus percent of.<\/b>","rest":"Two sentences that sound alike and differ by exactly 100 &mdash; <em>of<\/em> counts the whole of A, <em>greater than<\/em> counts only the excess.","f":"A is 100 &middot; <sup>A<\/sup>&frasl;<sub>B<\/sub> per cent <em>of<\/em> B, and 100 &middot; <sup>(A &minus; B)<\/sup>&frasl;<sub>B<\/sub> per cent <em>greater than<\/em> B","eg":"150 is 150 per cent of 100 and 50 per cent greater than 100. The same number, two sentences, two answers.","trap":"Reading &ldquo;200 per cent greater&rdquo; as &ldquo;twice as large&rdquo;. Twice as large is 200 per cent <em>of<\/em>, which is only 100 per cent <em>greater<\/em>; 200 per cent greater is three times as large.","fmn":"Percent greater than versus percent of"},{"lead":"<b>Percentages inside percentages.<\/b>","rest":"A percent of a percent is a share of a share, so the two fractions multiply &mdash; and the answer is always smaller than either of them.","f":"share of the whole = <sup>p<\/sup>&frasl;<sub>100<\/sub> &middot; <sup>q<\/sup>&frasl;<sub>100<\/sub> &middot; N","eg":"40 per cent of a 500-person group are women, and 30 per cent of those women drive: 500 &times; 0.40 &times; 0.30 = 60 people, or 12 per cent of the group.","trap":"Adding the two percentages, or reading the second one against the whole. The 30 per cent is 30 per cent of the 40 per cent slice only, so it contributes 12 per cent of the whole, not 30.","fmn":"Percentages inside percentages"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 340 200\"><rect class=\"shape\" x=\"20\" y=\"60\" width=\"90.4\" height=\"40\"/><rect x=\"20\" y=\"60\" width=\"22.6\" height=\"40\" style=\"fill:var(--blue);stroke:var(--blue)\"/><path class=\"gline\" d=\"M 110.4 46 L 110.4 114\"/><path class=\"aux\" d=\"M 42.6 50 L 42.6 110\"/><text class=\"slabel b\" x=\"65.2\" y=\"40\" text-anchor=\"middle\">N = 240<\/text><text class=\"slabel r\" x=\"40\" y=\"126\" text-anchor=\"middle\">part = 60<\/text><text class=\"slabel\" x=\"170\" y=\"172\" text-anchor=\"middle\">25 per cent of 240<\/text><text class=\"slabel\" x=\"170\" y=\"188\" text-anchor=\"middle\">the fill is a share of the whole<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Percent of a number&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"arith","fm":[]},"tk_pctchg":{"title":"Percent change, forwards and backwards","tag":"Applied Arithmetic","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Percent change.<\/b>","rest":"The change is always measured against where you started, never against where you ended &mdash; the old value is the base and it is the only thing allowed underneath.","f":"per cent change = 100 &middot; <sup>(new &minus; old)<\/sup>&frasl;<sub>old<\/sub>","eg":"From 80 to 100 is 100 &times; 20 &divide; 80 = a 25 per cent rise; from 100 back to 80 is a 20 per cent fall.","trap":"Dividing by the new value. The same 20-unit gap is 25 per cent of 80 and 20 per cent of 100, so a rise and the fall that undoes it are never the same percent.","fmn":"Percent change"},{"lead":"<b>Running a percent change backwards.<\/b>","rest":"Every percent change is a multiplication, so undoing one is a division by the very same factor &mdash; adding the percentage back on returns a different number.","f":"original = <sup>final<\/sup>&frasl;<sub>(1 + p/100)<\/sub>","eg":"A price 20 per cent off sits at $80, so it was 80 &divide; 0.8 = $100. Adding 20 per cent to 80 gives $96, which is wrong by four dollars.","trap":"Undoing a p per cent fall by adding p per cent back. The two percentages are taken on different bases, so &times;0.8 then &times;1.2 lands at 0.96 of the original, not at 1.","fmn":"Running a percent change backwards"},{"lead":"<b>Successive percent changes.<\/b>","rest":"Percent changes stack by multiplying their factors, because the second change is taken on the result of the first, not on the original.","f":"net factor = (1 + <sup>a<\/sup>&frasl;<sub>100<\/sub>)(1 + <sup>b<\/sup>&frasl;<sub>100<\/sub>)","eg":"Up 20 then down 20 is 1.2 &times; 0.8 = 0.96, a 4 per cent net fall &mdash; not the zero that adding the percents suggests.","trap":"Adding the two percentages. They agree only when one of them is zero; the gap is the cross term ab/100, which is why up 20 and down 20 loses 4 per cent every time.","fmn":"Successive percent changes"},{"lead":"<b>Percentage points versus per cent.<\/b>","rest":"When the quantity that moves is itself a percentage, there are two honest answers, and the smaller one is almost always the one meant by &ldquo;points&rdquo;.","f":"point change = r&#8322; &minus; r&#8321; &nbsp;&middot;&nbsp; relative change = 100 &middot; <sup>(r&#8322; &minus; r&#8321;)<\/sup>&frasl;<sub>r&#8321;<\/sub>","eg":"An unemployment rate going from 4 per cent to 5 per cent rose by 1 point, which is a 25 per cent rise.","trap":"Calling a one-point move a one per cent move. From a small base the relative figure is enormous &mdash; 4 to 5 is 25 per cent &mdash; and headline writers pick whichever of the two sounds larger.","fmn":"Percentage points versus per cent"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 340 200\"><path class=\"gline\" d=\"M 24 140 L 316 140\"/><rect class=\"shape\" x=\"66\" y=\"56.8\" width=\"54\" height=\"83.2\"/><rect class=\"shape\" x=\"186\" y=\"36\" width=\"54\" height=\"104\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><path class=\"aux\" d=\"M 66 56.8 L 240 56.8\"/><path class=\"aux\" d=\"M 213 36 L 213 56.8\"/><text class=\"slabel r\" x=\"221\" y=\"50.4\">+20<\/text><text class=\"slabel b\" x=\"93\" y=\"156\" text-anchor=\"middle\">old 80<\/text><text class=\"slabel a\" x=\"213\" y=\"156\" text-anchor=\"middle\">new 100<\/text><text class=\"slabel\" x=\"170\" y=\"176\" text-anchor=\"middle\">the gap 20 measured against the old 80<\/text><text class=\"slabel b\" x=\"170\" y=\"192\" text-anchor=\"middle\">25 per cent<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Percent change&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"arith","fm":[]},"tk_money":{"title":"Cost, price and profit","tag":"Applied Arithmetic","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Markup on cost.<\/b>","rest":"A markup is a percentage of what the seller paid, so the cost is the base and the price is the larger number built on top of it.","f":"price = cost &middot; (1 + <sup>m<\/sup>&frasl;<sub>100<\/sub>)","eg":"Cost $60 marked up 40 per cent sells for 60 &times; 1.4 = $84, and the $24 profit is only 28.6 per cent of that price.","trap":"Treating a 40 per cent markup as a 40 per cent margin. Markup is measured on cost, margin on price, so the same dollars give two different percentages and markup is always the bigger one.","fmn":"Markup on cost"},{"lead":"<b>Discount and sale price.<\/b>","rest":"A discount is a percentage of the list price, so what you pay is the list price times what is left over after the discount is taken out.","f":"sale = list &middot; (1 &minus; <sup>d<\/sup>&frasl;<sub>100<\/sub>)","eg":"A $120 coat at 25 per cent off costs 120 &times; 0.75 = $90.","trap":"Stopping at the discount instead of the price. &ldquo;25 per cent off $120&rdquo; is $30 of saving and $90 of payment, and the question usually wants the second number.","fmn":"Discount and sale price"},{"lead":"<b>Profit and margin.<\/b>","rest":"Profit is a number of dollars; margin is that profit as a share of the price, and the two answer different questions.","f":"profit = price &minus; cost &nbsp;&middot;&nbsp; margin = 100 &middot; <sup>profit<\/sup>&frasl;<sub>price<\/sub>","eg":"Cost $80, price $100: profit $20, margin 100 &times; 20 &divide; 100 = 20 per cent. As a markup on cost the same $20 is 25 per cent.","trap":"Dividing the profit by the cost and calling it margin. Margin takes the price underneath; put the cost there and you have computed the markup instead, and the two never agree except at zero.","fmn":"Profit and margin"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 340 200\"><rect class=\"shape\" x=\"34\" y=\"58\" width=\"30\" height=\"40\"/><rect class=\"shape\" x=\"64\" y=\"58\" width=\"12\" height=\"40\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><path class=\"gline\" d=\"M 34 112 L 34 106 L 64 106 L 64 112\"/><text class=\"slabel b\" x=\"49\" y=\"124\" text-anchor=\"middle\">cost 60<\/text><path class=\"gline\" d=\"M 64 44 L 64 50 L 76 50 L 76 44\"/><text class=\"slabel a\" x=\"70\" y=\"40\" text-anchor=\"middle\">markup 24<\/text><path class=\"aux\" d=\"M 76 54 L 76 102\"/><text class=\"slabel\" x=\"170\" y=\"172\" text-anchor=\"middle\">60 &times; 1.4 = price 84<\/text><text class=\"slabel r\" x=\"170\" y=\"190\" text-anchor=\"middle\">40% of cost is 28.57% of price<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Markup on cost&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"arith","fm":[]},"tk_interest":{"title":"Interest and growth","tag":"Applied Arithmetic","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Simple interest.<\/b>","rest":"Simple interest is paid on the original principal for every period, so the interest earned each year is the same amount and the total grows in a straight line.","f":"I = <sup>P &middot; r &middot; t<\/sup>&frasl;<sub>100<\/sub>","eg":"$1,000 at 6 per cent simple for 5 years earns 1000 &times; 6 &times; 5 &divide; 100 = $300, ending at $1,300.","trap":"Handing back the interest when the question asked for the balance, or the balance when it asked for the interest. Simple interest gives I; the amount owed is P + I.","fmn":"Simple interest"},{"lead":"<b>Compound interest.<\/b>","rest":"Compound interest is paid on the balance rather than the principal, so each year's interest is itself earning interest the year after.","f":"A = P(1 + <sup>r<\/sup>&frasl;<sub>100<\/sub>)<sup>t<\/sup>","eg":"$1,000 at 6 per cent compounded yearly for 10 years reaches 1000 &times; 1.06<sup>10<\/sup> = $1,790.85, against $1,600 under simple interest.","trap":"Multiplying the rate by the years and calling it compound. Compounding puts t in the exponent, never in the rate; 6 per cent for 10 years is 1.06<sup>10<\/sup>, which is 79 per cent, not 60.","fmn":"Compound interest"},{"lead":"<b>Compound interest, n times a year.<\/b>","rest":"Compounding more often chops the annual rate into n smaller pieces and applies them n times as often; the extra earnings are real but they flatten out fast.","f":"A = P(1 + <sup>r<\/sup>&frasl;<sub>100n<\/sub>)<sup>nt<\/sup>","eg":"$1,000 at 8 per cent compounded quarterly for 10 years reaches 1000 &times; 1.02<sup>40<\/sup> = $2,208.04, against $2,158.92 compounded yearly.","trap":"Dividing the rate by n but forgetting to multiply the exponent by n, which turns a ten-year investment into a ten-period one and loses most of the growth.","fmn":"Compound interest, n times a year"},{"lead":"<b>Doubling time, the rule of 72.<\/b>","rest":"At a compound rate of r per cent a year, money doubles in roughly 72 divided by r years &mdash; a shortcut good to within a few per cent across every rate you will meet.","f":"years to double &asymp; <sup>72<\/sup>&frasl;<sub>r<\/sub>","eg":"At 8 per cent a year money doubles in about 72 &divide; 8 = 9 years; the exact figure is 9.01 years.","trap":"Using 72 with a rate written as a decimal. The r in the rule is the percent number, so 8 goes in, not 0.08 &mdash; and the rule is for compound growth, not simple interest.","fmn":"Doubling time, the rule of 72"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 360 210\"><path class=\"gline\" d=\"M 42 30 L 42 150 L 334 150\"/><path class=\"gline\" d=\"M 42 30 L 334 30\"/><text class=\"slabel\" x=\"44\" y=\"24\">2,000<\/text><text class=\"slabel\" x=\"37\" y=\"154\" text-anchor=\"end\">0<\/text><rect class=\"shape\" x=\"46\" y=\"90\" width=\"18\" height=\"60\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><rect class=\"shape\" x=\"46\" y=\"90\" width=\"18\" height=\"60\"/><rect class=\"shape\" x=\"68\" y=\"86.4\" width=\"18\" height=\"63.6\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><rect class=\"shape\" x=\"68\" y=\"90\" width=\"18\" height=\"60\"/><rect class=\"shape\" x=\"90\" y=\"82.8\" width=\"18\" height=\"67.2\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><rect class=\"shape\" x=\"90\" y=\"90\" width=\"18\" height=\"60\"/><rect class=\"shape\" x=\"112\" y=\"79.2\" width=\"18\" height=\"70.8\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><rect class=\"shape\" x=\"112\" y=\"90\" width=\"18\" height=\"60\"/><rect class=\"shape\" x=\"134\" y=\"75.6\" width=\"18\" height=\"74.4\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><rect class=\"shape\" x=\"134\" y=\"90\" width=\"18\" height=\"60\"/><rect class=\"shape\" x=\"156\" y=\"72\" width=\"18\" height=\"78\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><rect class=\"shape\" x=\"156\" y=\"90\" width=\"18\" height=\"60\"/><path class=\"aux\" d=\"M 55 90 L 77 86.4 L 99 82.8 L 121 79.2 L 143 75.6 L 165 72\"/><text class=\"slabel b\" x=\"180\" y=\"178\" text-anchor=\"middle\">1,000 at 6% for 5 years<\/text><text class=\"slabel a\" x=\"180\" y=\"196\" text-anchor=\"middle\">interest 300, balance 1,300<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Simple interest&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"arith","fm":[]},"tk_ratio":{"title":"Ratios and shares","tag":"Applied Arithmetic","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Ratio to actual value: the scale factor.<\/b>","rest":"A ratio fixes only the shape; one real measurement fixes the size, and the single number k carries that size to every other
