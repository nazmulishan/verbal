<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Concept Boards in 19 Pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Source+Sans+3:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* The companion to GregMat in 10 Pages: the same printed-book page on a desk, here holding every Concept Board,
   one line per idea with its formula in ink-blue, the board's own picture at the head of each section. */
:root{
  --desk:#E9E7E1; --page:#FCFBF8; --panel:#FCFBF8; --panel-2:#F3F1EB;
  --ink:#1D2024; --ink-2:#464A50; --ink-3:#74787E;
  --line:#E3E0D8; --line-2:#CCC8BE;
  --blue:#23507D; --blue-2:#1A3F63; --blue-wash:rgba(35,80,125,.08);
  --red:#A63A2A; --red-wash:rgba(166,58,42,.09);
  --green:#2E7A57; --green-wash:rgba(46,122,87,.11);
  --amber:#946010;--amber-wash:rgba(156,101,16,.12);
  --shadow:0 1px 2px rgba(29,32,36,.06),0 18px 40px -28px rgba(29,32,36,.45);
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --fs:17px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#111315; --page:#1A1D20; --panel:#1A1D20; --panel-2:#22262A;
  --ink:#E8E6E1; --ink-2:#BAB7B0; --ink-3:#8D8A85;
  --line:#2C3035; --line-2:#3C4147;
  --blue:#8FB8E0; --blue-2:#B5D0EB; --blue-wash:rgba(143,184,224,.12);
  --red:#E58A77; --red-wash:rgba(229,138,119,.13);
  --green:#6FC59A; --green-wash:rgba(111,197,154,.13);
  --amber:#D8A84E;--amber-wash:rgba(214,166,75,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -26px rgba(0,0,0,.9);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#111315; --page:#1A1D20; --panel:#1A1D20; --panel-2:#22262A;
  --ink:#E8E6E1; --ink-2:#BAB7B0; --ink-3:#8D8A85;
  --line:#2C3035; --line-2:#3C4147;
  --blue:#8FB8E0; --blue-2:#B5D0EB; --blue-wash:rgba(143,184,224,.12);
  --red:#E58A77; --red-wash:rgba(229,138,119,.13);
  --green:#6FC59A; --green-wash:rgba(111,197,154,.13);
  --amber:#D8A84E;--amber-wash:rgba(214,166,75,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -26px rgba(0,0,0,.9);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--desk);color:var(--ink)}
body{margin:0;font-family:var(--serif);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---- the bar above the page ---- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--desk) 92%,transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding-block:8px;padding-inline:16px}
@media (max-width:640px){.bar{position:static}}
.bar-in{max-width:52rem;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.btn{font-family:var(--sans);font-size:14px;font-weight:600;line-height:1;padding:8px 12px;border-radius:7px;border:1px solid var(--line-2);
  background:var(--page);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--page)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--page)}
.btn.pri:hover{color:var(--page);filter:brightness(1.08)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.seg .btn{border:0;border-radius:0}
.seg .btn+.btn{border-left:1px solid var(--line-2)}
.pager{display:flex;gap:3px;overflow-x:auto;max-width:100%;scrollbar-width:none;flex:1 1 auto;min-width:0}
.pager::-webkit-scrollbar{display:none}
.pg{font-family:var(--sans);font-size:13.5px;font-weight:700;min-width:30px;height:30px;padding:0 6px;border-radius:50%;border:1px solid transparent;
  background:transparent;color:var(--ink-2);cursor:pointer;font-variant-numeric:tabular-nums}
.pg:hover{border-color:var(--line-2)}
.pg[aria-current="page"]{background:var(--blue);color:var(--page)}
.pg.done{box-shadow:inset 0 -3px 0 var(--green)}
.tools{display:flex;gap:8px;align-items:center;margin-left:auto}

/* ---- the page ---- */
.wrap{padding-inline:clamp(0px,3vw,32px);padding-block:clamp(0px,3vw,28px) 40px}
.sheet{max-width:50rem;margin:0 auto;background:var(--page);border:1px solid var(--line);box-shadow:var(--shadow);
  padding-block:clamp(22px,5vw,52px) clamp(22px,4vw,40px);padding-inline:clamp(18px,6vw,64px);font-size:var(--fs);line-height:1.55;min-height:70vh}
@media (max-width:560px){.sheet{border-left:0;border-right:0}}
.turn{animation:turn .22s ease-out}
@keyframes turn{from{opacity:0;transform:translateX(var(--dx,10px))}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.turn{animation:none}}
.rhead{display:flex;justify-content:space-between;gap:12px;font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line);padding-bottom:8px;margin:0 0 26px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(1.55rem,4.2vw,2.15rem);line-height:1.15;letter-spacing:-.01em;margin:0 0 8px;text-wrap:balance}
.deck{font-style:italic;color:var(--ink-2);margin:0 0 6px;max-width:38em}
.meta{font-family:var(--sans);font-size:13.5px;color:var(--ink-3);margin:0 0 4px;font-variant-numeric:tabular-nums}

/* ---- one board = one section ---- */
.board{margin-top:34px}
.bhd{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;border-bottom:1.5px solid var(--blue);padding-bottom:6px}
.bhd h2{font-family:var(--serif);font-size:1.25rem;font-weight:700;line-height:1.25;margin:0;flex:1 1 16rem;min-width:0;text-wrap:balance}
.tag{font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.live{display:none;font-family:var(--sans);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--blue);
  background:var(--page);color:var(--blue);cursor:pointer;white-space:nowrap}
.live:hover{background:var(--blue-wash)}
.inkmf .live{display:inline-block}
.fig{margin:14px auto 4px;max-width:30rem;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);padding:8px}
.fig svg{display:block;width:100%;height:auto}
.fig .slabel{font-family:var(--mono);font-size:11px;fill:var(--ink-2)}
.fig .slabel.b{fill:var(--blue)} .fig .slabel.r{fill:var(--red)} .fig .slabel.g{fill:var(--green)} .fig .slabel.a{fill:var(--amber)}
.fig .arcline{fill:none;stroke:var(--amber);stroke-width:1.6}
.fig .handle{fill:var(--panel);stroke:var(--blue);stroke-width:2.5}
.fig .shape{fill:var(--blue-wash);stroke:var(--blue);stroke-width:2;stroke-linejoin:round} .fig .gline{stroke:var(--line-2);stroke-width:1;fill:none}
.fig .aux{stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.fig figcaption{font-family:var(--sans);font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:6px}
.inkmf .fig figcaption .off{display:none}
.fig figcaption .on{display:none}
.inkmf .fig figcaption .on{display:inline}
.carry{margin:14px 0 4px;padding:10px 14px;border-left:3px solid var(--amber);background:var(--panel-2);border-radius:0 6px 6px 0;font-size:.94em;color:var(--ink-2)}
.carry b.lb{display:block;font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:2px}

/* ---- one idea = one line ---- */
.it{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,auto);column-gap:14px;align-items:start;padding:9px 0;border-bottom:1px dotted var(--line-2)}
.kn{width:22px;height:22px;margin-top:2px;border-radius:50%;border:1.5px solid var(--line-2);background:transparent;cursor:pointer;padding:0;
  display:grid;place-items:center;color:transparent;font-family:var(--sans);font-size:13px;font-weight:700;line-height:1}
.kn:hover{border-color:var(--green);color:var(--green)}
.it.known .kn{background:var(--green);border-color:var(--green);color:var(--page)}
.tt{all:unset;cursor:pointer;line-height:1.45;color:var(--ink);overflow-wrap:break-word;min-width:0}
.tt b{font-weight:600}
.tt:hover b,.tt[aria-expanded="true"] b{color:var(--blue)}
.tt:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:2px}
.it.known .tt{color:var(--ink-2)}
.fx{font-family:var(--serif);font-style:italic;color:var(--blue-2);text-align:right;max-width:20rem;overflow-wrap:break-word;line-height:1.45}
.eg{grid-column:2/-1;margin-top:4px;font-family:var(--sans);font-size:.86em;color:var(--ink-2);background:var(--panel-2);border-radius:4px;padding:3px 8px;justify-self:start}
.eg b{color:var(--green);font-weight:700;margin-right:3px}
.cover .it:not(.shown) .fx,.cover .it:not(.shown) .eg,.cover .it:not(.shown) .more{filter:blur(6px);opacity:.55;cursor:pointer;user-select:none;-webkit-user-select:none}
.hideknown .it.known:not(.open){display:none}
.more{grid-column:2/-1;margin:8px 0 4px;color:var(--ink-2);font-size:.95em;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:0 6px 6px 0;background:var(--panel-2);padding:10px 14px}
.xp{grid-column:2/-1;justify-self:start;margin-top:6px;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--blue);background:transparent;border:1px solid var(--line-2);border-radius:999px;padding:3px 11px;cursor:pointer}
.xp:hover{border-color:var(--blue);background:var(--blue-wash)} .xp[aria-expanded="true"] span{display:inline-block;transform:rotate(180deg)}
.pp{margin:0 0 10px} .pp:last-child{margin-bottom:0} .pp .lb,.fmrow .lb{display:block;font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:3px}
.pp.warn .lb{color:var(--red)} .steps{margin:2px 0 0;padding-left:22px} .steps li{margin:2px 0}
.chip{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--blue);background:var(--page);border:1px solid var(--blue);border-radius:999px;padding:4px 11px;margin:3px 6px 3px 0;cursor:pointer;text-align:left}
.chip:hover{background:var(--blue-wash)}
.fmrow{margin:12px 0 4px;font-size:.92em} .fmrow .offk{color:var(--ink-3);font-size:12.5px}
.onk{display:none} .inkmf .onk{display:inline} .inkmf .offk{display:none} .go .offk{color:var(--ink-2)}
.fmrow .chip{display:none} .inkmf .fmrow .chip{display:inline-block}
@media (max-width:640px){
  .it{grid-template-columns:26px minmax(0,1fr);row-gap:4px}
  .fx{grid-column:2;text-align:left;max-width:none}
}
details.try{margin:12px 0 0;font-size:.95em}
details.try summary{cursor:pointer;font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--ink-2)}
details.try ul{margin:8px 0 0;padding-left:20px;color:var(--ink-2)}
details.try li{margin:4px 0}

/* ---- end of page ---- */
.endmatter{margin-top:30px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.endmatter p{margin:0;font-family:var(--sans);font-size:14.5px;color:var(--ink-2)}
.endmatter .acts{display:flex;gap:8px;flex-wrap:wrap}
.foot{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:28px;padding-top:14px;border-top:1px solid var(--line)}
.nav{all:unset;cursor:pointer;font-family:var(--sans);font-size:14px;color:var(--ink-2);line-height:1.3;min-width:0}
.nav b{display:block;color:var(--blue);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.nav:hover{color:var(--ink)}
.nav.next{text-align:right}
.nav:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:3px}
.folio{font-family:var(--serif);font-style:italic;color:var(--ink-3);font-variant-numeric:oldstyle-nums}

/* ---- contents ---- */
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:10px 22px;margin:22px 0 6px;padding:0;list-style:none;
  font-family:var(--sans);font-size:15px;color:var(--ink-2)}
.howto li{min-width:0}
.howto b{color:var(--ink)}
.toc{list-style:none;margin:26px 0 0;padding:0}
.toc li{border-bottom:1px dotted var(--line-2)}
.toc button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:4px 12px;width:100%;padding:12px 0;align-items:baseline}
.toc button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.toc .no{font-family:var(--serif);font-weight:700;font-size:1.35rem;color:var(--blue);font-variant-numeric:lining-nums tabular-nums}
.toc .k{display:block;font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.toc .t{font-weight:600;line-height:1.3}
.toc .bs{display:block;font-size:.88em;color:var(--ink-3);margin-top:2px}
.toc button:hover .t{color:var(--blue)}
.toc .c{font-family:var(--sans);font-size:13.5px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.toc .c i{font-style:normal;color:var(--green);font-weight:700}
.prog{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden;grid-column:2/-1}
.prog i{display:block;height:100%;background:var(--green);border-radius:2px}
.cont{margin:22px 0 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.small{font-family:var(--sans);font-size:13.5px;color:var(--ink-3)}

/* ---- the formula check ---- */
.qz{position:fixed;inset:0;z-index:20;background:rgba(17,19,21,.45);display:grid;place-items:center;padding:16px}
.qz[hidden]{display:none}
.qzp{width:min(36rem,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--page);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:20px 22px}
.qzh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink-3);margin:0 0 10px}
.qz .tag{display:block;margin:0 0 6px}
.qz .q{font-size:16px;line-height:1.55;margin:0 0 4px}
.qz .ask{font-family:var(--sans);font-size:13.5px;color:var(--ink-3);margin:0 0 10px}
.ch{display:flex;flex-direction:column;gap:6px;margin:0 0 8px}
.ch button{display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:15px;padding:8px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--page);color:var(--ink);cursor:pointer}
.ch button .lt{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--ink-3);padding-top:2px}
.ch button .ft{font-style:italic}
.ch button:hover{border-color:var(--blue)}
.ch button.right{border-color:var(--green);background:var(--green-wash)}
.ch button.wrong{border-color:var(--red);background:var(--red-wash)}
.ch button[disabled]{cursor:default}
.qz .why{font-size:15px;line-height:1.55;margin:4px 0 12px;padding:10px 12px;border-radius:6px;background:var(--panel-2)}
.qz .why b{color:var(--green)}
.qz .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.score{font-family:var(--serif);font-size:2.2rem;font-weight:700;margin:4px 0}
.missed{margin:8px 0 14px;padding-left:20px}
.missed li{margin:3px 0}
</style>
</head>

<div class="bar" role="navigation" aria-label="Book">
  <div class="bar-in">
    <button type="button" class="btn" id="tocBtn">Contents</button>

    <div class="tools">
      <div class="seg" role="group" aria-label="Reading mode">
        <button type="button" class="btn" id="modeRead">Read</button>
        <button type="button" class="btn" id="modeCover" title="Hide every formula so you can say it first, then tap to check">Cover</button>
      </div>

    </div>

</div>

","boards":["tk_bars"],"deck":"Changes and multiples between bars, points against per cent, tables, and two categories that overlap."},{"n":18,"kicker":"Statistics","title":"Spread, the Normal Curve and Weighted Averages","boards":["cb_spread","cb_normal","cb_groups"],"deck":"Mean, median and spread on values you can move, the bell curve, and two groups joined into one average."},{"n":19,"kicker":"Data Analysis","title":"Overlaps, Counting and Chance","boards":["cb_sets","cb_count","cb_prob"],"deck":"Two groups that overlap, choosing and arranging, and a two-stage chance tree."}],"boards":{"cb_evenodd":{"title":"Odd and even, and numbers in a row","tag":"Number","say":"A strip of whole numbers runs across the top, and a bracket picks out k of them in a row. Drag the bracket or move the sliders, and the evens, the odds, the multiples and the primes inside it are counted at once. The last button swaps the strip for a sequence where each term is the sum of the two before it, so you can watch the letters E and O repeat.","note":"","tries":["Set <b>how many in a row<\/b> to 6 and drag the bracket one step at a time. Three evens and three odds every time. Set it to 5 and the extra one goes to whichever kind starts the row.","Press <b>the multiples inside<\/b>, set <b>how many in a row<\/b> to 3 and drag the bracket anywhere, even across 0 into the negatives. The product is always a multiple of 6. Across 0 it is 0, which is a multiple of every number.","In the same view, set the row to 4 and watch the sum. It is always 2 times an odd number, so 4 never divides it. Set it to 5 and the sum is always 5 times the middle number.","Press <b>the primes inside<\/b>, set the row to 6 and start it at 2. Four primes: 2, 3, 5, 7. Start it anywhere above 3 and you never get more than two. Then set the row to 7 and start it at 90: none at all.","Press <b>a two-term rule<\/b> and make both starting terms even. Every term turns even and the odd count is 0. Make one of them odd and the letters fall into E O O, so 700 terms hold 466 or 467 odd ones."],"ideas":[{"lead":"<b>Two numbers of the same kind add to an even number.<\/b>","rest":"Even plus even is even, and odd plus odd is even too. Mixing one of each gives odd. Taking away follows the same table.","f":"E ± E = E · O ± O = E · E ± O = O","eg":"3 + 5 = 8 (odd + odd) · 4 + 6 = 10 · 4 + 5 = 9 (even + odd is odd)","plain":"Even numbers split into pairs (2, 4, 6, …). Odd numbers have one left over (1, 3, 5, …). Add two odd numbers and the two leftovers make a new pair, so the answer is even. Add an even and an odd and one leftover stays, so the answer is odd.","steps":["3 + 5: each has one left over, 1 + 1 makes a pair → 8 is even","4 + 5: only 5 has a leftover → 9 is odd","Rule: same kind → even · mixed → odd"]},{"lead":"<b>A product is even the moment one factor is even.<\/b>","rest":"You never need to look at the other factors. A product is odd only when every factor is odd, so a power keeps the parity of its base.","f":"E × any whole number = E · O × O = O · n<sup>k<\/sup> (k ≥ 1) has the parity of n","eg":"4 × 7 = 28 is even · 3 × 5 = 15 is odd · 3⁴ = 81 is odd, like 3","plain":"Even means “has a 2 inside it”. Multiply by an even number and that 2 is still inside the answer, whatever the other numbers are. The only way to get an odd product is odd × odd × odd …","steps":["6 × 7: 6 = 2 × 3 has a 2 → 42 is even","3 × 5 × 7 = 105: no 2 anywhere → odd","3⁴ = 3 × 3 × 3 × 3, all odd → 81 is odd"]},{"lead":"<b>Parity is the remainder on division by 2.<\/b>","rest":"Even leaves 0 and odd leaves 1. Zero is even, and negatives have a parity too: −3 is odd. A power of −1 only asks whether the power is even or odd, so (−1)<sup>n<\/sup> × n added along a row that starts odd pairs off neighbours into +1s.","f":"(−1)<sup>n<\/sup> = +1 for even n, −1 for odd n · −1 + 2 − 3 + 4 − … + 100 = 50","eg":"7 ÷ 2 = 3 remainder 1 → odd · 8 ÷ 2 = 4 remainder 0 → even","plain":"“Even or odd” just asks: divide by 2, what is left? Even leaves 0, odd leaves 1. This works for 0 (it is even) and for negative numbers too. And (−1) times itself an even number of times is +1, an odd number of times is −1.","steps":["7 ÷ 2 = 3 remainder 1 → odd","0 ÷ 2 = 0 remainder 0 → 0 is even","−4 = 2 × (−2) → even","(−1) × (−1) = +1 (2 times) · (−1) × (−1) × (−1) = −1 (3 times)"]},{"lead":"<b>In k numbers in a row, the evens and odds split as evenly as they can.<\/b>","rest":"When k is even they split half and half. When k is odd, the kind the row starts with gets the extra one. If a question leaves the ends free, the count can tip either way.","f":"k even: k/2 each · k odd: (k + 1)/2 of the first number’s kind","eg":"the 5 numbers 3 to 7: odd 3, 5, 7 (three) and even 4, 6 (two)","plain":"In a row of numbers the kinds take turns: odd, even, odd, even. So a row with an even length is half and half, and a row with an odd length has one extra of the kind it starts with.","steps":["3, 4, 5, 6 (4 numbers): odd 3, 5 and even 4, 6 → 2 and 2","3, 4, 5, 6, 7 (5 numbers): starts odd → odd 3, 5, 7 (three) and even 4, 6 (two)"]},{"lead":"<b>Any two numbers in a row include an even one.<\/b>","rest":"So n(n + 1) is always even. Factoring is what shows the pair: k² − k is k(k − 1), and x² + 3x + 2 is (x + 1)(x + 2), so neither is ever odd.","f":"n(n + 1) is even · k² − k = k(k − 1) · (−1)<sup>p(p + 1)<\/sup> = 1","eg":"7 × 8 = 56 is even · 6² − 6 = 30 = 6 × 5","plain":"Two numbers side by side always include an even one, because the kinds take turns. So multiplying two neighbours always gives an even answer.","steps":["7 × 8: 8 is even → 56 is even","n(n + 1) with n = 10: 10 × 11 = 110, even","k² − k = k(k − 1): with k = 5, 5 × 4 = 20, even"]},{"lead":"<b>Any k numbers in a row include exactly one multiple of k.<\/b>","rest":"Their product is always a multiple of k!, so three in a row always multiply to a multiple of 6.","f":"7 × 8 × 9 = 504 = 3! × 84","plain":"Any 3 numbers in a row contain one that divides by 3. Any 4 in a row contain one that divides by 4. That is why 3 numbers in a row always multiply to a multiple of 1 × 2 × 3 = 6.","steps":["7, 8, 9: 9 divides by 3, and 8 divides by 2","7 × 8 × 9 = 504 = 6 × 84 → a multiple of 6"]},{"lead":"<b>An odd count of numbers in a row adds to the count times the middle one.<\/b>","rest":"The numbers above the middle make up exactly what the ones below it are short. It works for any evenly spaced list, such as consecutive even numbers. So 99 numbers in a row that add to 99 have 1 in the middle, and the first is 1 − 49 = −48.","f":"sum = k × middle (k odd)","eg":"5 + 6 + 7 = 3 × 6 = 18","plain":"If you add an odd count of numbers in a row, you can skip the adding: the middle number is the average, so the sum is how many × the middle.","steps":["5 + 6 + 7: the middle is 6 and there are 3 numbers","sum = 3 × 6 = 18 (check: 5 + 6 + 7 = 18)","11 to 19 is 9 numbers, middle 15 → 9 × 15 = 135"]},{"lead":"<b>An even count adds to half the count times the first plus the last.<\/b>","rest":"Here the first plus the last is odd, so the sum is never a multiple of k. Four in a row always add to 2 times an odd number.","f":"sum = (k/2) × (first + last) (k even)","eg":"3 + 4 + 5 + 6 = (4/2) × (3 + 6) = 18","plain":"With an even count there is no single middle. Pair the first with the last, the second with the second-last, and so on. Every pair has the same total.","steps":["3 + 4 + 5 + 6: pairs (3 + 6) and (4 + 5), each 9","2 pairs × 9 = 18","the formula: (4 ÷ 2) × (3 + 6) = 18"]},{"lead":"<b>Strike out the evens and the multiples of 3, and few numbers are left to be prime.<\/b>","rest":"1 is not a prime, and 2 is the only even prime. In six numbers in a row above 3, three are even and one of the three odd ones is a multiple of 3, so at most two can be prime.","f":"2 to 7 is the only six in a row with four primes: 2, 3, 5, 7","eg":"24 to 29: only 29 is prime","plain":"Most numbers are not prime because they are even or divide by 3. After 3, any 6 numbers in a row have at most 2 that could be prime.","steps":["24, 25, 26, 27, 28, 29","the evens 24, 26, 28 are out · 27 = 3 × 9 is out · 25 = 5 × 5 is out","only 29 is prime"]},{"lead":"<b>A row of numbers can hold no prime at all.<\/b>","rest":"So the count of primes in a row has a ceiling, but it can always fall to 0. It happens early: 90 to 96 is seven numbers with no prime among them.","f":"91 = 7 × 13 · 93 = 3 × 31 · 95 = 5 × 19","eg":"24, 25, 26, 27, 28: not one prime","plain":"You can find a stretch of numbers with no prime at all, so “how many primes” can be 0.","steps":["90, 91, 92, 93, 94, 95, 96","91 = 7 × 13 · 93 = 3 × 31 · 95 = 5 × 19 · the rest are even","seven numbers, no primes"]},{"lead":"<b>When each term adds the two before it, the letters E and O follow the same rule.<\/b>","rest":"Write the terms as letters and they fall into E O O, repeating every three. The one exception is two even starting terms, which make every term even. For N terms, write N = 3q + r and read the leftover off the block.","f":"700 = 3 × 233 + 1 → 466 or 467 odd terms, or 0 · on 3, every 4th term is a multiple of 3","eg":"1, 1, 2, 3, 5, 8, 13: O, O, E, O, O, E, O, so the pattern repeats every 3","plain":"In a list where each number is the two before it added (1, 1, 2, 3, 5, 8, …), you don't need the numbers to know even or odd. Use the adding rule on the letters: O + O = E and O + E = O. The pattern O, O, E repeats every 3.","steps":["1, 1 → O, O","O + O = E (2) · O + E = O (3) · E + O = O (5) · O + O = E (8)","so every 3rd term is even: 2, 8, 34, …"]}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><text class=\"slabel  numtxt\" x=\"320\" y=\"28\" text-anchor=\"middle\" style=\"font-size:12px\">the row 7 to 12: 3 even, 3 odd<\/text><g style=\"opacity:.35\"><rect x=\"40\" y=\"60\" width=\"28\" height=\"28\" rx=\"0\" style=\"fill:var(--amber-wash);stroke:var(--line-2);stroke-width:1\"><\/rect><text class=\"slabel a numtxt\" x=\"54\" y=\"78\" t bel \" x=\"474\" y=\"180\" text-anchor=\"start\" style=\"font-size:9px;fill:var(--ink-3)\">← last<\/text><text class=\"slabel g numtxt\" x=\"410\" y=\"276\" text-anchor=\"middle\" style=\"font-size:11px\">O × E = E: 7 × 12 = 84<\/text><text class=\"slabel  numtxt\" x=\"570\" y=\"150\" text-anchor=\"middle\" style=\"font-weight:600\">powers of s = 7<\/text><rect x=\"510\" y=\"158\" width=\"120\" height=\"40\" rx=\"3\" style=\"fill:var(--amber-wash);stroke:var(--amber);stroke-width:1.2\"><\/rect><text class=\"slabel \" x=\"518\" y=\"173\" text-anchor=\"start\" style=\"font-size:10px;fill:var(--ink-3)\">s<\/text><text class=\"slabel  numtxt\" x=\"518\" y=\"190\" text-anchor=\"start\" style=\"font-size:11px;font-weight:600;fill:var(--ink)\">7<\/text><text class=\"slabel a\" x=\"622\" y=\"185\" text-anchor=\"end\" style=\"font-size:16px;font-weight:700\">O<\/text><rect x=\"510\" y=\"204\" width=\"120\" height=\"40\" rx=\"3\" style=\"fill:var(--amber-wash);stroke:var(--amber);stroke-width:1.2\"><\/rect><text class=\"slabel \" x=\"518\" y=\"219\" text-anchor=\"start\" style=\"font-size:10px;fill:var(--ink-3)\">s squared<\/text><text class=\"slabel  numtxt\" x=\"518\" y=\"236\" text-anchor=\"start\" style=\"font-size:11px;font-weight:600;fill:var(--ink)\">49<\/text><text class=\"slabel a\" x=\"622\" y=\"231\" text-anchor=\"end\" style=\"font-size:16px;font-weight:700\">O<\/text><rect x=\"510\" y=\"250\" width=\"120\" height=\"40\" rx=\"3\" style=\"fill:var(--amber-wash);stroke:var(--amber);stroke-width:1.2\"><\/rect><text class=\"slabel \" x=\"518\" y=\"265\" text-anchor=\"start\" style=\"font-size:10px;fill:var(--ink-3)\">s cubed<\/text><text class=\"slabel  numtxt\" x=\"518\" y=\"282\" text-anchor=\"start\" style=\"font-size:11px;font-weight:600;fill:var(--ink)\">343<\/text><text class=\"slabel a\" x=\"622\" y=\"277\" text-anchor=\"end\" style=\"font-size:16px;font-weight:700\">O<\/text><rect x=\"160\" y=\"322\" width=\"53.33\" height=\"28\" rx=\"0\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\"><\/rect><text class=\"slabel b numtxt\" x=\"186.67\" y=\"340\" text-anchor=\"middle\" style=\"font-size:10px\">8<\/text><rect x=\"213.33\" y=\"322\" width=\"53.33\" height=\"28\" rx=\"0\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\"><\/rect><text class=\"slabel b numtxt\" x=\"240\" y=\"340\" text-anchor=\"middle\" style=\"font-size:10px\">10<\/text><rect x=\"266.67\" y=\"322\" width=\"53.33\" height=\"28\" rx=\"0\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\"><\/rect><text class=\"slabel b numtxt\" x=\"293.33\" y=\"340\" text-anchor=\"middle\" style=\"font-size:10px\">12<\/text><rect x=\"320\" y=\"322\" width=\"53.33\" height=\"28\" rx=\"0\" style=\"fill:var(--amber-wash);stroke:var(--amber);stroke-width:1.2\"><\/rect><text class=\"slabel a numtxt\" x=\"346.67\" y=\"340\" text-anchor=\"middle\" style=\"font-size:10px\">7<\/text><rect x=\"373.33\" y=\"322\" width=\"53.33\" height=\"28\" rx=\"0\" style=\"fill:var(--amber-wash);stroke:var(--amber);stroke-width:1.2\"><\/rect><text class=\"slabel a numtxt\" x=\"400\" y=\"340\" text-anchor=\"middle\" style=\"font-size:10px\">9<\/text><rect x=\"426.67\" y=\"322\" width=\"53.33\" height=\"28\" rx=\"0\" style=\"fill:var(--amber-wash);stroke:var(--amber);stroke-width:1.2\"><\/rect><text class=\"slabel a numtxt\" x=\"453.33\" y=\"340\" text-anchor=\"middle\" style=\"font-size:10px\">11<\/text><line x1=\"320\" y1=\"316\" x2=\"320\" y2=\"356\" style=\"stroke:var(--ink);stroke-width:2;fill:none\"><\/line><text class=\"slabel b numtxt\" x=\"240\" y=\"314\" text-anchor=\"middle\" style=\"font-weight:600\">3 even<\/text><text class=\"slabel a numtxt\" x=\"400\" y=\"314\" text-anchor=\"middle\" style=\"font-weight:600\">3 odd<\/text><text class=\"slabel  numtxt\" x=\"320\" y=\"376\" text-anchor=\"middle\" style=\"font-size:12px\">k = 6 is even: 3 and 3<\/text><\/svg>","sec":"num","fm":["Sum of a run of consecutive integers","Counting integers in an inclusive range","Multiples of k in a range","The division algorithm","Remainders of a sum and a product","Sum of an arithmetic sequence"]},"cb_divisors":{"title":"A number broken into primes","tag":"Number","say":"Set a number N and every divisor it has fills a grid. There is one row for each power of 2 and one column for each odd divisor. Drag the red ring onto any divisor to see its partner and the divisors that are its multiples. The other two buttons bring in a second number M, for the GCF, the LCM and the fraction N/M.","note":"","tries":["Set N to 90. The grid has 2 rows and 6 columns, so 12 divisors, which is (1 + 1)(2 + 1)(1 + 1). Now set N to 180, one more 2. A whole new row appears and the count jumps to 18.","Set N to 36 and drag the red ring onto 6. It is its own partner, so the count is 9, an odd number. Every perfect square does this, and no other number does.","Compare N = 30 with N = 20. 30 ties with 4 odd and 4 even divisors. 20 has 2 odd and 4 even. Only the number of 2s decides it.","Press <b>two numbers<\/b> and set N = 36 and M = 60. The GCF is 12, the LCM is 180, and 12 × 180 = 36 × 60. Then try 35 and 37: they share no prime, so the LCM is the full product, 1295.","Press <b>the fraction N/M<\/b> with N = 35 and M = 100. The GCF is 5, so it cuts to 7/20 and stops at 0.35. Then set N = 36 and M = 99: it cuts to 4/11, an 11 sits underneath, and 36 repeats for ever.","In the same view set N = 17 and M = 10. Read the stack from the bottom: 2 + 1/3 = 7/3, flip it to 3/7 and add 1, flip again and add 1. You land on 17/10."],"ideas":[{"lead":"<b>Break the number into primes first.<\/b>","rest":"Every question about divisors, the GCF or the LCM is read off the exponents. A count of different prime factors ignores the exponents, so a big number can have very few.","f":"360 = 2³ × 3² × 5 has 3 different primes · 500 = 2² × 5³ has 2","plain":"Write the number as primes multiplied together (a factor tree). Almost every divisor question is easy once you have this.","steps":["360 = 36 × 10 = (2² × 3²) × (2 × 5)","= 2³ × 3² × 5","different primes: 2, 3 and 5 → three"]},{"lead":"<b>The number of divisors is the product of each exponent plus one.<\/b>","rest":"A divisor chooses how many of each prime to take, from none up to all of them. So the choices multiply. Exactly 2 divisors means a prime, and exactly 3 means a prime squared.","f":"90 = 2 × 3² × 5 → (1 + 1)(2 + 1)(1 + 1) = 12","eg":"12 = 2² × 3 → (2 + 1)(1 + 1) = 6 divisors: 1, 2, 3, 4, 6, 12","plain":"To count how many numbers divide N: write N in primes, add 1 to each power, and multiply. The +1 is there because you can use each prime 0 times, 1 time, … up to all of them.","steps":["12 = 2² × 3¹","powers + 1: (2 + 1) and (1 + 1)","3 × 2 = 6 divisors: 1, 2, 3, 4, 6, 12"]},{"lead":"<b>Divisors come in pairs that multiply to N.<\/b>","rest":"So the count is even, unless one divisor is its own partner. That only happens at √N, so an odd count means N is a perfect square. In primes, a square has every exponent even and a cube has every exponent a multiple of 3.","f":"d × (N/d) = N · 36 = 2² × 3², 9 divisors · a square and a cube: 64 = 2⁶","eg":"36: 1 × 36, 2 × 18, 3 × 12, 4 × 9, 6 × 6. That is 9 divisors, odd because 6 pairs with itself","plain":"Divisors come in partners that multiply to the number, so the count is usually even. A perfect square has one divisor that partners with itself, so its count is odd.","steps":["12: 1 × 12, 2 × 6, 3 × 4 → 6 divisors (even)","36: 1 × 36, 2 × 18, 3 × 12, 4 × 9, 6 × 6 → 9 divisors (odd, because 36 = 6 × 6)"]},{"lead":"<b>The odd divisors fill the top row, and every power of 2 adds a row the same size.<\/b>","rest":"Write N = 2ᵃ × m with m odd. The odd divisors are the divisors of m, and there are a times as many even ones. Even divisors beat odd ones exactly when 4 divides N.","f":"20 = 2² × 5: odd 1, 5 · even 2, 4, 10, 20","plain":"Split N into its 2s and its odd part. The odd divisors are the divisors of the odd part. Multiply each of them by 2, by 4, … to get the even divisors.","steps":["20 = 2² × 5, so the odd part is 5","odd divisors: 1, 5","× 2: 2, 10 · × 4: 4, 20 → 4 even divisors"]},{"lead":"<b>To count the divisors that are multiples of k, put k in first.<\/b>","rest":"Then count the divisors of what is left, N ÷ k. Every such divisor is k times a divisor of N/k.","f":"divisors of 90 that are multiples of 5 = divisors of 18 = 6","plain":"How many divisors of N are multiples of k? Divide N by k, then count the divisors of what is left.","steps":["divisors of 90 that are multiples of 5","90 ÷ 5 = 18, and 18 has 6 divisors: 1, 2, 3, 6, 9, 18","times 5: 5, 10, 15, 30, 45, 90 → 6"]},{"lead":"<b>The GCF takes the smaller exponent of each prime, and the LCM takes the larger.<\/b>","rest":"GCF means greatest common factor and LCM means least common multiple. A prime missing from one number has exponent 0 there. Every common multiple is a multiple of the LCM.","f":"36 = 2² × 3², 60 = 2² × 3 × 5 → GCF = 12, LCM = 180 · divisible by 8 and by 12 → a multiple of 24","plain":"GCF is the biggest number that divides both. LCM is the smallest number that both divide into. In prime form the GCF takes the smaller power of each prime and the LCM takes the bigger.","steps":["12 = 2² × 3 and 18 = 2 × 3²","GCF: 2¹ × 3¹ = 6","LCM: 2² × 3² = 36"]},{"lead":"<b>The GCF times the LCM is the two numbers multiplied.<\/b>","rest":"Each prime gives its smaller exponent to one and its larger to the other. So the LCM is the full product exactly when the two share no prime. Two consecutive odd numbers never share one.","f":"GCF × LCM = N × M · 12 × 180 = 36 × 60","eg":"GCF(4, 6) × LCM(4, 6) = 2 × 12 = 24 = 4 × 6","plain":"For two numbers, GCF × LCM always equals the two numbers multiplied together. Use it to find one when you know the other.","steps":["12 and 18: GCF 6, LCM 36","6 × 36 = 216","12 × 18 = 216 ✓"]},{"lead":"<b>A factor of both numbers divides their difference and every total built from them.<\/b>","rest":"That is how the GCF is found by division. Divide the larger by the smaller, then the smaller by the remainder, and repeat. The divisor in the line that leaves 0 is the GCF.","f":"g divides N and M → g divides N − M and xN + yM","eg":"3 divides 12 and 21, so 3 divides 21 − 12 = 9 and 2 × 12 + 21 = 45","plain":"If a number divides both A and B, it also divides A − B and A + B. That gives a fast way to find the GCF: divide, keep the remainder, and repeat.","steps":["GCF of 84 and 36","84 ÷ 36 = 2 remainder 12","36 ÷ 12 = 3 remainder 0 → GCF = 12"]},{"lead":"<b>Cutting N/M to lowest terms leaves M ÷ GCF underneath.<\/b>","rest":"So a reduced bottom is a fact about a GCF. r percent is r/100, and it cuts down to something over 20 exactly when the GCF of r and 100 is 5.","f":"35/100 = 7/20 · 15% = 3/20, so the class is a multiple of 20","plain":"Simplifying a fraction divides the top and the bottom by their GCF. So the new bottom is the old bottom ÷ GCF.","steps":["35/100: GCF(35, 100) = 5","35 ÷ 5 = 7 and 100 ÷ 5 = 20 → 7/20","so if 35% of a class are boys, the class size is a multiple of 20"]},{"lead":"<b>A fraction in lowest terms stops as a decimal exactly when its bottom has no prime but 2 and 5.<\/b>","rest":"Any other prime makes it repeat. A block that repeats from the decimal point is that block over the same number of nines.","f":"7/40 = 0.175 · 0.3636… = 36/99 = 4/11","eg":"1/8 = 0.125 stops · 1/6 = 0.1666… never stops (6 has a 3)","plain":"Simplify the fraction first. If the bottom is made only of 2s and 5s, the decimal stops. Any other prime (3, 7, 11, …) makes it repeat forever.","steps":["7/40: 40 = 2³ × 5 → it stops: 0.175","1/6: 6 = 2 × 3 has a 3 → 0.1666… repeats","1/12: 12 = 2² × 3 → repeats"]},{"lead":"<b>Each zero at the end of a number is a 2 paired with a 5.<\/b>","rest":"Count the 2s and the 5s in the primes, and the smaller count is the number of zeros. Rewrite hidden 2s first: 4ᵏ is 2²ᵏ.","f":"zeros = the smaller of (2s, 5s) · 4¹⁰⁰ × 5⁹⁹ ends in 99 zeros","eg":"1,000 = 2³ × 5³: three 2-and-5 pairs, three zeros","plain":"A zero at the end of a number comes from a 10, and 10 = 2 × 5. Count the 2s and the 5s: the smaller count is the number of zeros.","steps":["2⁴ × 5³ = 2 × (2³ × 5³) = 2 × 1,000","2s: 4, 5s: 3 → 3 zeros","check: 16 × 125 = 2,000 ✓"]},{"lead":"<b>A stacked fraction is worked from the bottom storey up.<\/b>","rest":"Finish each storey into a single fraction, then flip it. Never flip the pieces of a sum one at a time. The quotients from the GCF division build such a stack for N/M.","f":"1 + 1/(1 + 1/(2 + 1/3)) = 17/10 · 1 ÷ (1 + ½) = 2/3","plain":"A fraction inside a fraction: start at the very bottom, make it one fraction, flip it, and move up one level.","steps":["1 ÷ (1 + ½)","bottom first: 1 + ½ = 3/2","1 ÷ 3/2 = 2/3"]}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><text class=\"slabel  numtxt\" x=\"20\" y=\"30\" text-anchor=\"start\" style=\"font-size:13px;fill:var(--ink)\">N = 90 =<\/text><rect x=\"90.4\" y=\"13\" width=\"21.8\" height=\"23\" rx=\"5\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.4\"><\/rect><text class=\"slabel b numtxt\" x=\"101.3\" y=\"30\" text-anchor=\"middle\" style=\"font-size:13px\">2<\/text><text class=\"slabel \" x=\"120.2\" y=\"30\" text-anchor=\"middle\" style=\"font-size:13px\">×<\/text><rect x=\"128.2\" y=\"13\" width=\"29.6\" height=\"23\" rx=\"5\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.2\"><\/rect><text class=\"slabel  numtxt\" x=\"143\" y=\"30\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--ink)\">3²<\/text><text class=\"slabel \" x=\"165.8\" y=\"30\" text-anchor=\"middle\" style=\"font-size:13px\">×<\/text><rect x=\"173.8\" y=\"13\" width=\"21.8\" height=\"23\" rx=\"5\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.2\"><\/rect><text class=\"slabel  numtxt\" x=\"184.7\" y=\"30\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--ink)\">5<\/tex 6\"><\/path><text class=\"slabel b numtxt\" x=\"524\" y=\"125\" text-anchor=\"start\" style=\"font-size:11.5px;font-weight:600\">even: 1 × 6 = 6<\/text><path style=\"fill:none;stroke:var(--red);stroke-width:1.3;stroke-opacity:.8\" d=\"M 262.69 99.49 Q 274.92 120.27 291.84 120.57\"><\/path><ellipse cx=\"315.83\" cy=\"121\" rx=\"24\" ry=\"15.5\" style=\"fill:none;stroke:var(--red);stroke-width:2;stroke-dasharray:4 3\"><\/ellipse><ellipse cx=\"254.17\" cy=\"85\" rx=\"24\" ry=\"15.5\" style=\"fill:none;stroke:var(--red);stroke-width:2.6\"><\/ellipse><circle class=\"handle\" cx=\"254.17\" cy=\"85\" r=\"15.5\" style=\"fill:var(--red);fill-opacity:0;stroke:none\"><\/circle><text class=\"slabel r numtxt\" x=\"285\" y=\"153\" text-anchor=\"middle\" style=\"font-size:11px\">ring 5 × partner 18 = 90 · green dots: the 6 multiples of 5<\/text><text class=\"slabel b numtxt\" x=\"285\" y=\"183\" text-anchor=\"middle\" style=\"font-size:12.5px;font-weight:600\">2 rows × 6 columns = 12 divisors = (1 + 1)(2 + 1)(1 + 1)<\/text><text class=\"slabel b numtxt\" x=\"20\" y=\"339\" text-anchor=\"start\" style=\"font-size:11.5px\">2s<\/text><text class=\"slabel  numtxt\" x=\"20\" y=\"365\" text-anchor=\"start\" style=\"font-size:11.5px;fill:var(--ink)\">5s<\/text><rect x=\"41\" y=\"322\" width=\"26\" height=\"52\" rx=\"5\" style=\"fill:var(--green);fill-opacity:.1;stroke:var(--green);stroke-width:1.5\"><\/rect><line x1=\"54\" y1=\"344\" x2=\"54\" y2=\"352\" style=\"stroke:var(--green);stroke-width:2.5;fill:none\"><\/line><text class=\"slabel g numtxt\" x=\"54\" y=\"387\" text-anchor=\"middle\" style=\"font-size:11px;font-weight:600\">10<\/text><rect x=\"44\" y=\"326\" width=\"20\" height=\"18\" rx=\"4\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.3\"><\/rect><text class=\"slabel b numtxt\" x=\"54\" y=\"339\" text-anchor=\"middle\" style=\"font-size:12px\">2<\/text><rect x=\"44\" y=\"352\" width=\"20\" height=\"18\" rx=\"4\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.2\"><\/rect><text class=\"slabel  numtxt\" x=\"54\" y=\"365\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--ink)\">5<\/text><text class=\"slabel \" x=\"108\" y=\"336\" text-anchor=\"start\" style=\"font-size:11px\">zeros at the end of N:<\/text><text class=\"slabel \" x=\"108\" y=\"352\" text-anchor=\"start\" style=\"font-size:11px\">the smaller of the two counts<\/text><text class=\"slabel g numtxt\" x=\"108\" y=\"370\" text-anchor=\"start\" style=\"font-size:11px;font-weight:600\">smaller of 1 and 1 = 1, so 90 ends in one zero<\/text><text class=\"slabel  numtxt\" x=\"626\" y=\"336\" text-anchor=\"end\" style=\"font-size:12px\">√90 = 3√10, not whole<\/text><\/svg>","sec":"num","fm":["Counting divisors from the prime factorisation","Even divisors and odd divisors","LCM × GCF equals the product","When a fraction terminates","Repeating decimal to a fraction","Trailing zeros in a factorial","The division algorithm","Percent as a fraction over 100"]},"cb_remainder":{"title":"Remainders, round the wheel","tag":"Number","say":"A number n is shared out in groups of d, and what is left over is the remainder. The wheel has d seats, and the pointer lands on that remainder. The other buttons add and multiply two numbers on the same wheel, ask for two remainders at once, and send powers round the wheel, which is how every units-digit question works.","note":"","tries":["Set the divisor to 5 and walk n up from 0. The pointer climbs 0, 1, 2, 3, 4 and drops back to 0 at every multiple of 5. A remainder is always smaller than the divisor.","Set n to 17 and d to 5, so the remainder is 2. The board lists the divisors of 15 that are bigger than 2: 3, 5 and 15. Each of them leaves 2 when it divides 17.","Press <b>add and multiply<\/b>, set d = 6, n = 10 and m = 11. They leave 4 and 5, so the product leaves 4 × 5 = 20, which leaves 2 on 6. Check it: 110 = 18 × 6 + 2.","Press <b>two conditions<\/b>, set d = 5, e = 6 and n = 8. The green cells are 8, 38, 68 and so on, 30 apart, and 30 is the LCM of 5 and 6.","Press <b>powers go round<\/b>, set the base to 3 and d to 10. The cycle is 3, 9, 7, 1. Slide the power to 48: 48 leaves 0 on 4, so it lands on the last seat and 3⁴⁸ ends in 1.","Keep d = 10 and set the base to 13. The wheel looks exactly as it did for 3, because only the units digit of the base matters. Then set the base to 10 and d to 11: the powers just swap between 10 and 1."],"ideas":[{"lead":"<b>The remainder is what is left after the biggest multiple of d that fits.<\/b>","rest":"It is always smaller than d, and it can be 0. If n is smaller than d, the quotient is 0 and the remainder is n itself.","f":"n = q × d + r, with 0 ≤ r &lt; d","eg":"17 ÷ 5: 17 = 3 × 5 + 2, so the remainder is 2","plain":"Divide, keep the whole-number answer, and what is left over is the remainder. It is always smaller than the number you divide by.","steps":["17 ÷ 5: 5 fits 3 times (15)","17 − 15 = 2 → remainder 2","so 17 = 3 × 5 + 2"]},{"lead":"<b>Take the remainder off first.<\/b>","rest":"If n leaves r, then d divides n − r exactly. And d must be bigger than r, or r would not be a remainder.","f":"17 ÷ z leaves 2 → z divides 15 and z &gt; 2 → z = 3, 5 or 15","plain":"If n leaves remainder r, then n − r divides exactly. So take the remainder away and look at the divisors.","steps":["17 ÷ z leaves 2","17 − 2 = 15, so z divides 15: 1, 3, 5, 15","z must be bigger than 2 → z = 3, 5 or 15"]},{"lead":"<b>Numbers with the same remainder are spaced d apart.<\/b>","rest":"They are r, r + d, r + 2d and so on. “Divisible by 4 but not by 8” is exact: it means 8k + 4, a remainder of 4 on 8.","f":"n = d × k + r","eg":"remainder 2 on 5: 2, 7, 12, 17, 22, …","plain":"All numbers with the same remainder form a list that goes up by the divisor each time.","steps":["remainder 2 when divided by 5","start at 2 and keep adding 5","2, 7, 12, 17, 22, …"]},{"lead":"<b>Remainders add.<\/b>","rest":"Add the two remainders, then take d off if the total reaches d. With d = 10 this is the units digit, and the carry is thrown away: 9 + 9 leaves 8.","f":"remainder of m + n = remainder of (rₘ + rₙ)","eg":"7 leaves 1 on 3 and 8 leaves 2 → 7 + 8 = 15 leaves 1 + 2 = 3 → 0","plain":"For the remainder of a sum, add the remainders. If that reaches the divisor, take the divisor off again.","steps":["7 ÷ 3 leaves 1 and 8 ÷ 3 leaves 2","1 + 2 = 3, and 3 on 3 leaves 0","check: 15 ÷ 3 = 5 remainder 0 ✓"]},{"lead":"<b>Remainders multiply too, so swap a number for its remainder before you multiply.<\/b>","rest":"That works for squares and for any multiplier. On 6, 15a behaves like 3a, because 15 leaves 3.","f":"345,606² on 20: 345,606 leaves 6, and 6² = 36 → 16","plain":"For a product, multiply the remainders instead of the big numbers. Much easier.","steps":["remainder of 23 × 17 when divided by 5","23 leaves 3 and 17 leaves 2 → 3 × 2 = 6, and 6 leaves 1","check: 391 ÷ 5 = 78 remainder 1 ✓"]},{"lead":"<b>A remainder on d hands you the remainder on any factor of d.<\/b>","rest":"Divide the remainder again by the factor. A number that leaves 13 on 42 leaves 1 on 6, because 42 is a multiple of 6.","f":"e divides d → remainder on e = (remainder on d) on e","eg":"n leaves 7 on 10, so n leaves 2 on 5 (try 17: 17 ÷ 5 leaves 2)","plain":"If you know the remainder on 10, you also know it on 5 and on 2, because 5 and 2 divide 10. Just divide the remainder again.","steps":["n leaves 7 when divided by 10","7 ÷ 5 leaves 2 → n leaves 2 on 5","try n = 17: 17 ÷ 5 = 3 remainder 2 ✓"]},{"lead":"<b>Two remainders at once give a family spaced by the LCM.<\/b>","rest":"Find the first number that fits both. Every other one is a multiple of the LCM away.","f":"3 on 5 and 2 on 6 → 8, 38, 68, …","plain":"When a number must fit two remainder rules at once, find the first number that works, then keep adding the LCM of the two divisors.","steps":["leaves 3 on 5 and 2 on 6","try 3, 8, 13, …: 8 ÷ 6 leaves 2 ✓","LCM(5, 6) = 30 → 8, 38, 68, …"]},{"lead":"<b>An integer average is a fact about remainders.<\/b>","rest":"The total is the average times the count. So the average is a whole number exactly when the count divides the total, and a free value has to make up what is missing.","f":"average is whole ⇔ the total leaves 0 on the count","eg":"4, 5, 9: total 18, and 18 ÷ 3 = 6 is whole · 4, 5, 8: total 17 leaves 2 on 3, not whole","plain":"An average is a whole number only when the total divides evenly by how many numbers there are.","steps":["4, 5, 9: total 18, three numbers","18 ÷ 3 = 6 → whole","4, 5, 8: total 17 → 17 ÷ 3 is not whole"]},{"lead":"<b>Some divisors only look at a few digits.<\/b>","rest":"For 2, 5 and 10 the last digit decides, for 4, 20 and 25 the last two digits, and for 8 the last three. For 3 and 9 the digit sum decides, and for 11 the digits added and taken away in turn, starting from the units.","f":"12,345,678,910 on 3: the digits add to 46 → 1","plain":"Quick tests: for 3 and 9 add the digits · for 2, 5 and 10 look at the last digit · for 4 the last two digits · for 8 the last three.","steps":["1,236 on 3: 1 + 2 + 3 + 6 = 12 → divides by 3","1,236 on 4: the last two digits are 36 → divides by 4","1,235 on 5: ends in 5 → divides by 5"]},{"lead":"<b>The remainders of a power go round a cycle.<\/b>","rest":"List b, b², b³ and so on until a remainder repeats. Then only the power’s place in the cycle matters, so divide the power by the cycle length.","f":"3²⁸³ on 5: 3, 4, 2, 1 → 283 = 4 × 70 + 3 → 2 · 10ⁿ on 11: 10, 1, 10, 1, …","plain":"For a big power, list the remainders of the first few powers. They repeat in a cycle, so you only need to know where in the cycle the power lands.","steps":["3ⁿ on 5: 3, 9 → 4, 27 → 2, 81 → 1, then it repeats (a cycle of 4)","3²⁸³: 283 ÷ 4 = 70 remainder 3 → 3rd place in the cycle","answer: remainder 2"]},{"lead":"<b>A units digit cycles every 1, 2 or 4 powers, and only the base’s units digit matters.<\/b>","rest":"Bases ending in 0, 1, 5 or 6 never move, bases ending in 4 or 9 swap between two digits, and bases ending in 2, 3, 7 or 8 run all four seats. When the power leaves 0 on the cycle length, it lands on the last seat.","f":"13ⁿ ends like 3ⁿ · 3⁴⁸ ends in 1","eg":"2ⁿ ends in 2, 4, 8, 6, 2, … → 10 = 4 × 2 + 2, so 2¹⁰ = 1024 ends in 4","plain":"The last digit of a power repeats in a short cycle, and only the last digit of the base matters.","steps":["2¹ = 2, 2² = 4, 2³ = 8, 2⁴ = 16 → 6, then 2 again","the cycle is 2, 4, 8, 6 (length 4)","2¹⁰: 10 ÷ 4 = 2 remainder 2 → 2nd place → ends in 4 (1,024 ✓)"]},{"lead":"<b>A square can only end in 0, 1, 4, 5, 6 or 9.<\/b>","rest":"The units digit of a square comes from the units digit of its root, so ten cases cover every number.","f":"no square ends in 2, 3, 7 or 8","eg":"13² = 169 ends in 9 · 2,023 can never be a square (it ends in 3)","plain":"Square the digits 0 to 9 and the last digits you get are only 0, 1, 4, 5, 6 and 9. A number ending in 2, 3, 7 or 8 can never be a perfect square.","steps":["1² = 1, 2² = 4, 3² = 9, 4² = 16, 5² = 25","6² = 36, 7² = 49, 8² = 64, 9² = 81","so 2,023 (it ends in 3) is not a square"]}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><text class=\"slabel b numtxt\" x=\"170\" y=\"92\" text-anchor=\"middle\" style=\"font-size:14px;font-weight:600\">q = 3 groups of 5<\/text><text class=\"slabel  numtxt\" x=\"170\" y=\"110\" text-anchor=\"middle\" style=\"font-size:10px;fill:var(--ink-3)\">(group 1 is off to the left)<\/text><path style=\"fill:none;stroke:var(--blue);stroke-width:1.6\" d=\"M 38 194 Q 80.67 150 123.33 194\"><\/path><text class=\"slabel b numtxt\" x=\"80.67\" y=\"166\" text-anchor=\"middle\" style=\"font-size:10px\">group 2<\/text><path style=\"fill:none;stroke:var(--blue);stroke-width:1.6\" d=\"M 127.33 194 Q 170 150 212.67 194\"><\/path><text class=\"slabel b numtxt\" x=\"170\" y=\"166\" text-anchor=\"middle\" style=\"font-size:10px\">group 3<\/text><rect x=\"214.67\" y=\"193\" width=\"35.73\" height=\"14\" rx=\"2\" sty " x=\"170\" y=\"312\" text-anchor=\"middle\" style=\"fill:var(--ink-2)\">17 shared among 5: 3 each, 2 left over<\/text><circle cx=\"470\" cy=\"200\" r=\"110\" style=\"fill:none;stroke:var(--line-2);stroke-width:2\"><\/circle><circle cx=\"470\" cy=\"90\" r=\"13\" style=\"fill:var(--panel);stroke:var(--ink-2);stroke-width:2.2\"><\/circle><text class=\"slabel  numtxt\" x=\"470\" y=\"94\" text-anchor=\"middle\" style=\"fill:var(--ink)\">0<\/text><circle cx=\"574.62\" cy=\"166.01\" r=\"13\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.3\"><\/circle><text class=\"slabel  numtxt\" x=\"574.62\" y=\"170.01\" text-anchor=\"middle\" style=\"fill:var(--ink)\">1<\/text><circle cx=\"534.66\" cy=\"288.99\" r=\"13\" style=\"fill:var(--blue);stroke:var(--blue);stroke-width:2\"><\/circle><text class=\"slabel  numtxt\" x=\"534.66\" y=\"292.99\" text-anchor=\"middle\" style=\"fill:var(--panel);font-weight:700\">2<\/text><circle cx=\"405.34\" cy=\"288.99\" r=\"13\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.3\"><\/circle><text class=\"slabel  numtxt\" x=\"405.34\" y=\"292.99\" text-anchor=\"middle\" style=\"fill:var(--ink)\">3<\/text><circle cx=\"365.38\" cy=\"166.01\" r=\"13\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.3\"><\/circle><text class=\"slabel  numtxt\" x=\"365.38\" y=\"170.01\" text-anchor=\"middle\" style=\"fill:var(--ink)\">4<\/text><circle cx=\"470\" cy=\"200\" r=\"3.5\" style=\"fill:var(--ink)\"><\/circle><line x1=\"470\" y1=\"200\" x2=\"518.2\" y2=\"266.34\" style=\"stroke:var(--blue);stroke-width:3.5;fill:none;stroke-linecap:round\"><\/line><polygon points=\"524.66,275.24 513.3,269.9 523.09,262.78\" style=\"fill:var(--blue);stroke:none\"><\/polygon><text class=\"slabel b numtxt\" x=\"470\" y=\"174\" text-anchor=\"middle\" style=\"font-size:11px\">round 3 times<\/text><path style=\"fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:6 4\" d=\"M 548.18 307.6 A 133 133 0 1 1 470 67\"><\/path><polygon points=\"470,67 461,71.95 461,62.05\" style=\"fill:var(--amber);stroke:none\"><\/polygon><text class=\"slabel a numtxt\" x=\"470\" y=\"46\" text-anchor=\"middle\" style=\"font-size:12px\">d − r = 3 more to the next multiple, 20<\/text><line x1=\"20\" y1=\"338\" x2=\"620\" y2=\"338\" style=\"stroke:var(--line);stroke-width:1\"><\/line><text class=\"slabel  numtxt\" x=\"320\" y=\"372\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--ink)\">n = q × d + r  →  <tspan style=\"fill:var(--red)\">17<\/tspan> = <tspan style=\"fill:var(--blue)\">3 × 5<\/tspan> + <tspan style=\"fill:var(--green)\">2<\/tspan><\/text><\/svg>","sec":"num","fm":["The division algorithm","Remainders of a sum and a product","The units-digit cycle of a power","Divisibility by 3 and by 9","Multiples of k in a range","LCM × GCF equals the product","The mean as a total","The total behind a mean"]},"cb_signsize":{"title":"The number line in four regions","tag":"Number","say":"Drag x along the number line. Ten lanes underneath show 2x, x², x³, √x, 1/x and the rest, each as a dot on its own copy of the line, so you can see which side of x every one lands on. The line breaks at −1, 0 and 1 into four regions, and the order changes each time you cross one. The other buttons draw the same powers as curves, pick the greatest and least products from a pool of signed numbers, and sort roots into rational and irrational.","note":"","tries":["Drag x to ½. x² and x³ land left of x, √x and ∛x land right of it, and 1/x jumps out to 2.","Drag x past 1, to 2. The whole order turns round: x³ is now furthest right and 1/x has dropped to ½.","Drag x to −½. x³ is −⅛, which is greater than x. 2x is −1, which is less. On this side of 0 a bigger multiple means a smaller number.","Stop x on 1, then on 0, then on −1. At 1 seven lanes put their dot in the same place. At 0, 1/x and x⁻² have no value at all.","Press <b>a pool of signed numbers<\/b>, pool −5 to 4, pick 4. The least product is (−5)(−4)(−3)(4) = −240, with three negatives. Drag the left end to −2 and the least product now uses one negative: (−2)(2)(3)(4) = −48.","Press <b>rational or not<\/b> and drag x to 2.25. √x is 3/2, rational. Now try 2 or 0.8. The root is irrational, yet √x × √x lands back on x, a rational."],"ideas":[{"lead":"<b>“A number” means any real number.<\/b>","rest":"Negatives, zero and fractions are all allowed until the question rules them out, and an integer can be negative or zero. Try a value from each region before you decide.","f":"0.22x vs (2/9)x: x &gt; 0 → (2/9)x bigger · x &lt; 0 → 0.22x bigger · x = 0 → equal","eg":"x = 9: 0.22 × 9 = 1.98 < (2/9) × 9 = 2 · x = −9: −1.98 > −2","plain":"When a question says “a number”, it can be negative, zero or a fraction. Always test a positive, a negative and zero before you decide.","steps":["Which is bigger, 2x or x?","x = 3: 6 > 3 → 2x is bigger","x = −3: −6 < −3 → x is bigger · x = 0: equal → it cannot be decided"]},{"lead":"<b>The line splits at −1, 0 and 1, and each region behaves its own way.<\/b>","rest":"Powers and roots cross each other only at those three points. One test value from each region settles most comparisons.","f":"x &lt; −1 · −1 &lt; x &lt; 0 · 0 &lt; x &lt; 1 · x &gt; 1","eg":"x = −2, x = −½, x = ½ and x = 2 sit in the four regions","plain":"Mark −1, 0 and 1 on the number line. Numbers in each of the four parts behave differently when you square, cube or flip them, so test one number from each part.","steps":["test −2, −½, ½ and 2","their squares: 4, ¼, ¼, 4","squaring makes 2 bigger but makes ½ smaller"]},{"lead":"<b>Between 0 and 1, powers shrink and roots grow.<\/b>","rest":"The reciprocal shoots past 1. So squaring a number between 0 and 1 makes it smaller, and the cube root of 0.8 sits between 0.8 and 1.","f":"0 &lt; x &lt; 1: x³ &lt; x² &lt; x &lt; √x &lt; ∛x &lt; 1 &lt; 1/x","eg":"x = ¼: x² = 1/16 < x = ¼ < √x = ½ < 1 < 1/x = 4","plain":"For a fraction between 0 and 1, multiplying it by itself makes it smaller, and taking a root makes it bigger.","steps":["x = ¼","x² = 1/16 (smaller) · √x = ½ (bigger)","1/x = 4 (much bigger)"]},{"lead":"<b>Above 1 the same list runs the other way.<\/b>","rest":"Powers grow, roots shrink towards 1, and the reciprocal drops below 1.","f":"x &gt; 1: 1/x &lt; 1 &lt; ∛x &lt; √x &lt; x &lt; x² &lt; x³","eg":"x = 4: 1/x = ¼ < 1 < √4 = 2 < 4 < 16 < 64","plain":"Above 1 everything goes the usual way: squares get bigger, roots get smaller.","steps":["x = 4","x² = 16 and x³ = 64 (bigger)","√4 = 2 and 1/4 = ¼ (smaller)"]},{"lead":"<b>Squaring wipes out the sign, and an odd power keeps it.<\/b>","rest":"Below −1 a cube runs further left. Between −1 and 0 a cube sits closer to 0, so it is greater than x.","f":"x &lt; −1: x³ &lt; x &lt; 0 &lt; x² · −1 &lt; x &lt; 0: x &lt; x³ &lt; 0 &lt; x²","eg":"(−2)² = 4 is positive · (−2)³ = −8 stays negative","plain":"Squaring a negative number makes it positive. Cubing keeps it negative.","steps":["(−2)² = (−2) × (−2) = 4","(−2)³ = 4 × (−2) = −8","even power → positive · odd power → keeps the sign"]},{"lead":"<b>A square root sign always gives the root that is 0 or more.<\/b>","rest":"So the square root of a square is an absolute value. An odd root keeps the sign: the cube root of −8 is −2.","f":"√(x²) = |x| · √(r⁶) = |r|³","eg":"√((−3)²) = √9 = 3 = |−3|","plain":"The √ sign always means the root that is 0 or positive. So √(x²) is x without its minus sign, written |x|.","steps":["√((−3)²) = √9","= 3, not −3","= |−3|"]},{"lead":"<b>A negative power is a reciprocal, so it throws a positive number across 1.<\/b>","rest":"For x between 0 and 1, x² is less than 1 and x⁻² is more than 1.","f":"x⁻² = 1/x² · x = ½: x² = ¼, x⁻² = 4","plain":"A negative power means “one over”. It flips a number across 1: small numbers become big and big ones become small.","steps":["2⁻² = 1/2² = ¼","(½)⁻² = 1 ÷ ¼ = 4"]},{"lead":"<b>Doubling a negative number makes it smaller.<\/b>","rest":"It moves away from 0, which is to the left. Halving a negative moves it towards 0, so it gets bigger. “Twice as much” means “greater” only above 0.","f":"x &lt; 0: 2x &lt; x &lt; x/2","eg":"x = −3: 2x = −6 < −3 < x/2 = −1.5","plain":"For negative numbers, the one that looks bigger is smaller. Doubling −3 gives −6, which is further left, so it is smaller.","steps":["x = −3","2x = −6 and x/2 = −1.5","order: −6 < −3 < −1.5"]},{"lead":"<b>A product is negative exactly when it has an odd number of negative factors.<\/b>","rest":"Count the minus signs. You never need to multiply to find the sign. A zero anywhere makes the whole product 0.","f":"no zero factor: sign = (−1)^(number of negatives)","eg":"(−2)(−3)(4) = 24 positive (two negatives) · (−2)(3)(4) = −24 negative (one)","plain":"Count the minus signs. An even count gives a positive answer, an odd count a negative one. If any factor is 0, the answer is 0.","steps":["(−2)(−3)(4): two negatives → +24","(−2)(3)(4): one negative → −24","(−1)(−1)(−1): three → −1"]},{"lead":"<b>The least product is the one furthest left on the line.<\/b>","rest":"Size alone does not decide it. Take the factors with the biggest sizes first, then count their negatives, and swap one factor if the count is wrong for what you want.","f":"pick 4 from −5 to 4: least = (−5)(−4)(−3)(4) = −240","plain":"To get the smallest product, you want a negative answer that is as large in size as possible.","steps":["pick 4 numbers from −5 to 4","largest sizes, with an odd count of negatives: −5, −4, −3 and 4","(−5)(−4)(−3)(4) = −240"]},{"lead":"<b>A rational number plus an irrational one is always irrational.<\/b>","rest":"So is a non-zero rational times an irrational. Two irrationals can cancel, though: √2 + (−√2) is 0, and √2 × √2 is 2. Zero times an irrational is 0.","f":"rational + irrational = irrational · √2 × √2 = 2","eg":"2 + √3 is irrational","plain":"Rational means it can be written as a fraction (3, ½, 0.25). Irrational means it cannot (√2, π). Rational + irrational is always irrational, but two irrationals can give a rational.","steps":["2 + √3 → irrational","√2 × √2 = 2 → rational","π − π = 0 → rational"]},{"lead":"<b>The square root of a fraction in lowest terms is rational only when the top and the bottom are both perfect squares.<\/b>","rest":"Every decimal that stops or repeats is rational. Having a decimal form proves nothing, because every number has one.","f":"√(9/4) = 3/2 · √(4/5) is irrational","plain":"The root of a fraction is a clean fraction only if, after simplifying, the top and the bottom are both perfect squares.","steps":["√(9/4) = 3/2 → rational","√(4/5): 5 is not a square → irrational","√(8/18) = √(4/9) = 2/3 → simplify first"]}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><rect x=\"90\" y=\"21\" width=\"173.33\" height=\"22\" rx=\"0\" style=\"fill:none;stroke:var(--line-2);stroke-width:1\"><\/rect><text class=\"slabel  numtxt\" x=\"176.67\" y=\"36\" text-anchor=\"middle\">below −1<\/text><rect x=\"263.33\" y=\"21\" width=\"86.67\" height=\"22\" rx=\"0\" style=\"fill:var(--blue-wash);stroke:var(--line-2);stroke-width:1\"><\/rect><text class=\"slabel  numtxt\" x=\"306.67\" y=\"36\" text-anchor=\"middle\">−1 to 0<\/text><rect x=\"350\" y=\"21\" width=\"86.67\" height=\"22\" rx=\"0\" style=\"fill:var(--red-wash);stroke:var(--line-2);stroke-width:1\"><\/rect><text class=\"slabel r numtxt\" x=\"393.33\" y=\"36\" text-anchor=\"middle\" style=\"font-weight:600\">0 to 1<\/text><rect x=\"436.67\" y=\"21\" width=\"173.33\" height=\"22\" rx=\"0\" style=\"fill:var(--blue-wash);stroke:var(--line-2);stroke-width:1\"><\/rect><text class=\"slabel  numtxt\" x=\"523.33\" y=\"36\" text-anchor=\"middle\">above 1<\/text><line x1=\"90\" y1=\"58\" x2=\"610\" y2=\"58\" style=\"stroke:var(--line-2);stroke-width:1.3;fill:none\"><\/line><line x1=\"90\" y1=\"55\" x2=\"90\" y2=\"61\" style=\"stroke:var(--line-2);stroke-width:1;fill:none\"><\/line><line x1=\"176.67\" y1=\"55\" x2=\"176.67\" y2=\"61\" style=\"stroke:var(--line-2);stroke-width:1;fill:none\"><\/l y=\"354\" text-anchor=\"middle\">0<\/text><text class=\"slabel  numtxt\" x=\"436.67\" y=\"354\" text-anchor=\"middle\">1<\/text><text class=\"slabel  numtxt\" x=\"523.33\" y=\"354\" text-anchor=\"middle\">2<\/text><text class=\"slabel  numtxt\" x=\"610\" y=\"354\" text-anchor=\"middle\">3<\/text><text class=\"slabel  numtxt\" x=\"320\" y=\"384\" text-anchor=\"middle\" style=\"font-size:12px;font-weight:600\"><tspan style=\"fill:var(--ink)\">−x<\/tspan> &lt; <tspan style=\"fill:var(--blue)\">x³<\/tspan> &lt; <tspan style=\"fill:var(--ink)\">x/2<\/tspan> = <tspan style=\"fill:var(--blue)\">x²<\/tspan> &lt; <tspan style=\"fill:var(--ink)\">x<\/tspan> &lt; <tspan style=\"fill:var(--green)\">√x<\/tspan> &lt; <tspan style=\"fill:var(--green)\">∛x<\/tspan> &lt; <tspan style=\"fill:var(--ink)\">2x<\/tspan> &lt; <tspan style=\"fill:var(--amber)\">1/x<\/tspan> &lt; <tspan style=\"fill:var(--amber)\">x⁻²<\/tspan><\/text><circle class=\"handle\" cx=\"393.33\" cy=\"58\" r=\"8\"><\/circle><\/svg>","sec":"num","fm":["Repeating decimal to a fraction","When a fraction terminates","Negative and zero exponents","Fractional exponents","Multiplying and dividing radicals","Rationalising a denominator","Absolute value as two cases","Multiplying an inequality"]},"cb_posts":{"title":"Posts and gaps, and the +1 that decides a count","tag":"Number","say":"A ruler runs from A to B, and a post stands on every multiple of k inside it. Count the posts and the gaps between them, and drag the red marker to read a post’s place from either end. The other buttons add a second kind of post, fill digit slots, share out identical things with bars, and line up 1 to n to see what n! is made of.","note":"","tries":["Set the range from 11 to 100 and the step to 4. The first post is 12 and the last is 100: (100 − 12)/4 = 22 gaps, so 23 posts. Change the step to 5 and you get 18.","Slide <b>from A<\/b> down to 0. 0 becomes a post, because 0 is a multiple of every step. The positive-only line takes it off again.","Drag the red marker to any post. Its place from the front plus its place from the back is always one more than the number of posts.","Press <b>two kinds of posts<\/b> with steps 4 and 6. The green posts come every 12, not every 24, and they are taken off once.","Press <b>filling slots<\/b> with 3 slots: 900 numbers in all, 648 with no digit repeated, and 60 made from 1 to 5 with no repeats.","Press <b>n! and its zeros<\/b> and slide n from 24 to 25. The zeros jump from 4 to 6, because 25 brings two 5s at once."],"ideas":[{"lead":"<b>A count of evenly spaced things is the gaps plus one.<\/b>","rest":"Between the first and the last there are (last − first) ÷ k gaps, and there is one more post than gaps. The range of the posts, last − first, gets no +1.","f":"count = (last − first)/k + 1 · range = last − first","eg":"posts at 5, 10, …, 50: (50 − 5)/5 + 1 = 10 posts and 9 gaps","plain":"Fence posts: when posts are evenly spaced, the number of posts is the number of gaps + 1.","steps":["posts at 5, 10, 15, …, 50","gaps: (50 − 5) ÷ 5 = 9","posts: 9 + 1 = 10"]},{"lead":"<b>Find the first and last post inside the range before anything else.<\/b>","rest":"The ends of the range need not be posts. Read the words exactly: inclusive keeps the ends, between usually drops them, and positive throws out 0. 0 is a multiple of every number.","f":"odd numbers from 10 to 30: 11 to 29 → (29 − 11)/2 + 1 = 10","plain":"Before counting, find the first and the last number that really fit, then use the gaps + 1 rule.","steps":["odd numbers from 10 to 30","first odd: 11 · last odd: 29","(29 − 11) ÷ 2 + 1 = 10"]},{"lead":"<b>Up to B there are ⌊B/k⌋ multiples of k.<\/b>","rest":"⌊ ⌋ means round down to a whole number. For a range from A to B, take away the ones below A.","f":"⌊B/k⌋ − ⌊(A − 1)/k⌋ · 11 to 100, step 4: 25 − 2 = 23","eg":"multiples of 7 up to 50: ⌊50/7⌋ = 7 (7, 14, …, 49)","plain":"How many multiples of k are there up to B? Divide B by k and drop the decimal.","steps":["multiples of 7 up to 50","50 ÷ 7 = 7.1 → 7","7, 14, 21, 28, 35, 42, 49 ✓"]},{"lead":"<b>n marks on a scale make n − 1 gaps.<\/b>","rest":"So the step is the distance divided by the gaps, never by the marks. Nine ticks from 0.2 to 0.56 make 8 gaps of 0.045.","f":"step = (last − first) ÷ (marks − 1)","eg":"5 marks from 0 to 20: step = 20 ÷ 4 = 5 (0, 5, 10, 15, 20)","plain":"On a ruler, 5 marks make 4 spaces. The step is the total length ÷ the number of spaces.","steps":["5 marks from 0 to 20","spaces: 5 − 1 = 4","step = 20 ÷ 4 = 5"]},{"lead":"<b>Places count from 1, so the item in place r has r − 1 in front of it.<\/b>","rest":"Counted from both ends, it is counted twice, so its place from the front plus its place from the back is the length plus 1. The r-th post is the first one plus r − 1 steps.","f":"front + back = n + 1 · r-th post = first + (r − 1) × k · the 360th of 100 to 999 is 459","plain":"The 10th item in a list has 9 items in front of it. So the r-th term is the first + (r − 1) × the step.","steps":["the list 100, 101, 102, …","the 5th number = 100 + 4 = 104","in a queue of 10, 3rd from the front is 8th from the back (3 + 8 = 10 + 1)"]},{"lead":"<b>To count squares in a range, count their roots.<\/b>","rest":"The squares from 37 to 621 are 7² up to 24², so there are 24 − 7 + 1 = 18 of them. Squares of even numbers have even roots, so only 8, 10, …, 24 count: 9 of them.","f":"squares from A to B: roots from √A rounded up to √B rounded down","eg":"squares from 10 to 50: roots 4 to 7 → 16, 25, 36, 49, so 4 squares","plain":"To count perfect squares between two numbers, count the whole numbers whose squares land there.","steps":["squares from 10 to 50","√10 ≈ 3.2 → start at 4 · √50 ≈ 7.1 → end at 7","4, 5, 6, 7 → 4 squares (16, 25, 36, 49)"]},{"lead":"<b>Multiples of k and multiples of j overlap at the multiples of their LCM.<\/b>","rest":"Add the two counts and take that overlap off once. The LCM is not always k × j: steps 4 and 6 overlap every 12.","f":"up to 603, multiples of 2 or 3: 301 + 201 − 100 = 402","eg":"up to 20, multiples of 2 or 3: 10 + 6 − 3 = 13","plain":"Counting “multiples of 2 or 3”: add the two counts, then take off the ones counted twice (the multiples of 6).","steps":["up to 20: multiples of 2 → 10, of 3 → 6","both (multiples of 6): 6, 12, 18 → 3","10 + 6 − 3 = 13"]},{"lead":"<b>To fill slots, multiply the number of choices for each slot.<\/b>","rest":"A first digit cannot be 0. With no repeats, each later slot has one choice fewer. Fill the fussiest slot first.","f":"3 digits: 9 × 10 × 10 = 900 · all different: 9 × 9 × 8 = 648","plain":"Filling slots one by one: multiply the number of choices for each slot.","steps":["3-digit numbers","first digit 1 to 9: 9 choices · second and third: 10 each","9 × 10 × 10 = 900"]},{"lead":"<b>Sharing identical things into labelled groups is placing bars among stars.<\/b>","rest":"n things and g groups use g − 1 bars, in n + g − 1 places. Choose the places for the bars. Groups may be empty.","f":"C(n + g − 1, g − 1) · 9 into 3 groups: C(11, 2) = 55","plain":"Sharing identical things, like 9 sweets among 3 children: line up the sweets and add 2 dividers. Count the ways to place the dividers.","steps":["9 sweets + 2 dividers = 11 spots","choose 2 spots for the dividers: C(11, 2)","= 11 × 10 ÷ 2 = 55"]},{"lead":"<b>Factorials thin out fast.<\/b>","rest":"1, 2, 6, 24, 120, 720 and 5040 cover almost every question. Between 120 and 720 there is no factorial at all, and a number times a factorial usually lands in such a gap, so isolate n! before you test it. n! holds every prime up to n and none above it.","f":"x/2 = n! → x = 2 × n! = 2, 4, 12, 48, 240, … · 240 is not a factorial","plain":"n! means n × (n − 1) × … × 1. Factorials grow very fast: 1, 2, 6, 24, 120, 720.","steps":["4! = 4 × 3 × 2 × 1 = 24","5! = 5 × 24 = 120","so 50 is not a factorial (it falls between 24 and 120)"]},{"lead":"<b>Cancel factorials instead of working them out.<\/b>","rest":"Write each one as a multiple of the smallest, then take that one out as a common factor.","f":"n!/(n − 1)! = n · 20! + 19! + 18! = 18! × 20²","eg":"6!/5! = 6 · 10!/8! = 10 × 9 = 90","plain":"Do not multiply factorials out. Cancel them: 10!/8! leaves only 10 × 9.","steps":["10!/8! = (10 × 9 × 8!) ÷ 8!","= 10 × 9","= 90"]},{"lead":"<b>n! ends in as many zeros as it has 5s.<\/b>","rest":"It always has at least as many 2s. Count the multiples of 5 up to n, then add the multiples of 25, which carry a second 5. From 5! on, every factorial ends in 0, so only the small ones decide a units digit.","f":"zeros of n! = ⌊n/5⌋ + ⌊n/25⌋ · 25! ends in 6 zeros · 2! + 4! + 6! + 8! + 10! ends in 6","plain":"The zeros at the end of n! come from 2 × 5 pairs. There are plenty of 2s, so just count the 5s.","steps":["25!: multiples of 5 → 25 ÷ 5 = 5","25 = 5 × 5 gives one extra 5 → 25 ÷ 25 = 1","5 + 1 = 6 zeros"]}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><text class=\"slabel b numtxt\" x=\"320\" y=\"24\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:600\">a post on every multiple of 4 from 11 to 100<\/text><text class=\"slabel \" x=\"320\" y=\"44\" text-anchor=\"middle\" style=\"font-size:10px;fill:var(--ink-3)\">[ and ] mean inclusive: an end counts when it is a post<\/text><rect x=\"56.07\" y=\"138\" width=\"533.93\" height=\"30\" rx=\"0\" style=\"fill:var(--blue-wash);stroke:none\"><\/rect><line x1=\"56.07\" y1=\"138\" x2=\"590\" y2=\"138\" style=\"stroke:var(--blue);stroke-width:1.2;opacity:.7\"><\/line><line x1=\"56.07\" y1=\"168\" x2=\"590\" y2=\"168\" style=\"stroke:var(--blue);stroke-width:1.2;opacity:.7\"><\/line><text class=\"slabel  numtxt\" x=\"68.2\" y=\"157\" text-anchor=\"middle\" style=\"font-size:9px;fill:var(--ink-3)\">1<\/text><text class=\"slabel  numtxt\" x=\"92.47\" y=\"157\" text-anchor=\"middle\" style=\"font-size:9px;fill:var(--ink-3)\">2<\/text><text class=\"slabel  numtxt\" x=\"116.74\" y=\"157\" text-anchor=\"middle\" style=\"font-size:9px; /line><line x1=\"577.87\" y1=\"200\" x2=\"577.87\" y2=\"204\" style=\"stroke:var(--ink-3);stroke-width:1\"><\/line><line x1=\"583.93\" y1=\"200\" x2=\"583.93\" y2=\"204\" style=\"stroke:var(--ink-3);stroke-width:1\"><\/line><line x1=\"590\" y1=\"200\" x2=\"590\" y2=\"208\" style=\"stroke:var(--ink-3);stroke-width:1\"><\/line><path d=\"M 56 186 L 50 186 L 50 214 L 56 214\" style=\"fill:none;stroke:var(--ink);stroke-width:2\"><\/path><path d=\"M 584 186 L 590 186 L 590 214 L 584 214\" style=\"fill:none;stroke:var(--ink);stroke-width:2\"><\/path><text class=\"slabel  numtxt\" x=\"44\" y=\"205\" text-anchor=\"end\" style=\"font-weight:700;fill:var(--ink)\">11<\/text><text class=\"slabel  numtxt\" x=\"596\" y=\"205\" text-anchor=\"start\" style=\"font-weight:700;fill:var(--ink)\">100<\/text><text class=\"slabel b numtxt\" x=\"56.07\" y=\"110\" text-anchor=\"middle\" style=\"font-weight:700\">12<\/text><text class=\"slabel b numtxt\" x=\"590\" y=\"110\" text-anchor=\"middle\" style=\"font-weight:700\">100<\/text><circle cx=\"80.34\" cy=\"210\" r=\"2.6\" style=\"fill:var(--green);stroke:none\"><\/circle><circle cx=\"134.94\" cy=\"210\" r=\"2.6\" style=\"fill:var(--green);stroke:none\"><\/circle><circle cx=\"201.69\" cy=\"210\" r=\"2.6\" style=\"fill:var(--green);stroke:none\"><\/circle><circle cx=\"280.56\" cy=\"210\" r=\"2.6\" style=\"fill:var(--green);stroke:none\"><\/circle><circle cx=\"371.57\" cy=\"210\" r=\"2.6\" style=\"fill:var(--green);stroke:none\"><\/circle><circle cx=\"474.72\" cy=\"210\" r=\"2.6\" style=\"fill:var(--green);stroke:none\"><\/circle><circle cx=\"590\" cy=\"210\" r=\"2.6\" style=\"fill:var(--green);stroke:none\"><\/circle><line x1=\"153.15\" y1=\"203\" x2=\"153.15\" y2=\"216\" style=\"stroke:var(--red);stroke-width:1.5\"><\/line><circle class=\"handle\" cx=\"153.15\" cy=\"226\" r=\"8\" style=\"stroke:var(--red)\"><\/circle><polygon points=\"153.15,220 148.15,230 158.15,230\" style=\"fill:var(--red);stroke:none;pointer-events:none\"><\/polygon><text class=\"slabel r numtxt\" x=\"153.15\" y=\"254\" text-anchor=\"middle\" style=\"font-size:11px;font-weight:600\">#5 from the front · #19 from the back<\/text><text class=\"slabel r numtxt\" x=\"153.15\" y=\"110\" text-anchor=\"middle\" style=\"font-weight:700\">28<\/text><text class=\"slabel g numtxt\" x=\"320\" y=\"279\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:700\">gaps: 22 · posts: 23<\/text><text class=\"slabel g\" x=\"590\" y=\"279\" text-anchor=\"end\" style=\"font-size:10px\">green dots: squares<\/text><text class=\"slabel \" x=\"50\" y=\"279\" text-anchor=\"start\" style=\"font-size:10px;fill:var(--ink-3)\">faded: just outside<\/text><text class=\"slabel g numtxt\" x=\"320\" y=\"308\" text-anchor=\"middle\" style=\"font-size:14px;font-weight:700\">(100 − 12) ÷ 4 + 1 = 22 + 1 = 23<\/text><text class=\"slabel \" x=\"320\" y=\"326\" text-anchor=\"middle\" style=\"font-size:10px;fill:var(--ink-3)\">(last − first) ÷ step counts the gaps, and there is one more post than gaps<\/text><text class=\"slabel  numtxt\" x=\"320\" y=\"352\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:600;fill:var(--ink)\">floor(100/4) − floor(10/4) = 25 − 2 = 23<\/text><text class=\"slabel  numtxt\" x=\"320\" y=\"370\" text-anchor=\"middle\" style=\"font-size:10px;fill:var(--ink-3)\">multiples of 4 up to 100, minus the multiples of 4 up to 10<\/text><text class=\"slabel  numtxt\" x=\"320\" y=\"392\" text-anchor=\"middle\" style=\"font-size:10px;fill:var(--ink-3)\">the range of the posts, 100 − 12 = 88, gets no +1<\/text><\/svg>","sec":"num","fm":["Counting integers in an inclusive range","Multiples of k in a range","Trailing zeros in a factorial","Arithmetic sequence, nth term","The counting principle","Identical items into groups","Identical items with at least one each","The union of two categories"]},"cb_places":{"title":"How a number is written, all at once","tag":"Number","say":"Build a number digit by digit in the columns and choose a unit. The board tells the digit in that place apart from how many of that unit the number holds. The other buttons write a number in another base, add two numbers column by column with their carries, round to a band, and line numbers up in powers of ten.","note":"","tries":["Build 1.4 and set the unit to tenths. The tenths digit is 4, but 1.4 holds 14 tenths. Set the unit to hundredths and the count jumps to 140.","Press <b>another base<\/b>, set b = 5 and N = 264. The digits are 2, 0, 2, 4. The 25s place is empty, and it still gets its 0.","Set b = 9 and N = 104. The digits are 1, 2, 5, because 104 = 1 × 81 + 2 × 9 + 5. One reading settles an equation like 81x + 9y + z = 104 at once.","Press <b>a column sum<\/b> with b = 10, N = 307 and P = 63. The units column makes 10, writes 0 and carries 1, and the 3 passes straight down with a carry of 0. Push N and P to 999 and still no column carries more than 1.","Press <b>rounding<\/b>, build 534 and set the unit to tens. The band runs from 525 up to 535, and 534 is the greatest whole number in it. Then build 25: rounding first gives 30 + 30 = 60, adding first gives 50.","Press <b>powers of ten<\/b> with N = 389, P = 45 and the power on P at 2. P becomes 4.5 × 10³, so 389 is rewritten as 0.389 × 10³ before the two are added."],"ideas":[{"lead":"<b>A digit names a place. A count says how many of that unit fit.<\/b>","rest":"In 1.4 the tenths digit is 4, but 1.4 holds 14 tenths. “How many units are in this number” is the number divided by the unit.","f":"count = number ÷ unit · 1.4 ÷ 0.1 = 14","plain":"Each digit has a place (tens, ones, tenths, …). “How many tenths are in 1.4?” is just 1.4 ÷ 0.1 = 14.","steps":["1.4 = 1 one + 4 tenths","1 one = 10 tenths","10 + 4 = 14 tenths"]},{"lead":"<b>Make the unit ten times smaller and the count gets ten times bigger.<\/b>","rest":"So the unit matters more than the amount: 1.3 is 130 hundredths, far more than 14 tenths. For a unit smaller than 1, multiplying by it instead of dividing gives a smaller
