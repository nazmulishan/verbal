/line><text class=\"slabel a\" x=\"284\" y=\"283\" text-anchor=\"middle\">mode<\/text><line x1=\"322\" y1=\"300\" x2=\"322\" y2=\"332\" style=\"stroke:var(--blue);stroke-width:4.5;fill:none\"><\/line><line x1=\"360\" y1=\"300\" x2=\"360\" y2=\"340\" style=\"stroke:var(--green);stroke-width:2.2;fill:none\"><\/line><text class=\"slabel b numtxt\" x=\"322\" y=\"356\" text-anchor=\"middle\">median = 7<\/text><line x1=\"360\" y1=\"341\" x2=\"429.8\" y2=\"341\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"360\" y1=\"338\" x2=\"360\" y2=\"344\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel g numtxt\" x=\"429.8\" y=\"356\" text-anchor=\"middle\">mean = 72 ÷ 9 = 8<\/text><line x1=\"360\" y1=\"300\" x2=\"360\" y2=\"392\" style=\"stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:4 4;fill:none\"><\/line><line x1=\"322\" y1=\"300\" x2=\"322\" y2=\"422\" style=\"stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:4 4;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"360\" y=\"378\" text-anchor=\"middle\">started at 8<\/text><circle cx=\"360\" cy=\"392\" r=\"4.5\" style=\"fill:none;stroke:var(--green);stroke-width:2\"><\/circle><text class=\"slabel g\" x=\"360\" y=\"408\" text-anchor=\"middle\">the mean has not moved<\/text><circle cx=\"322\" cy=\"422\" r=\"4.5\" style=\"fill:none;stroke:var(--blue);stroke-width:2\"><\/circle><text class=\"slabel b\" x=\"322\" y=\"438\" text-anchor=\"middle\">the median has not moved<\/text><line x1=\"170\" y1=\"462\" x2=\"588\" y2=\"462\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><polygon points=\"360,462 351,478 369,478\" style=\"fill:var(--green)\"><\/polygon><text class=\"slabel  numtxt\" x=\"265\" y=\"458\" text-anchor=\"middle\">pull 13<\/text><text class=\"slabel  numtxt\" x=\"474\" y=\"458\" text-anchor=\"middle\">pull 13<\/text><circle class=\"handle\" cx=\"170\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"170\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"246\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"246\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"284\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"284\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"284\" cy=\"229\" r=\"8\"><\/circle><circle cx=\"284\" cy=\"229\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"322\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"322\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"398\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"398\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"436\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"436\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"512\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"512\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><circle class=\"handle\" cx=\"588\" cy=\"250\" r=\"8\"><\/circle><circle cx=\"588\" cy=\"250\" r=\"4\" style=\"fill:var(--blue)\"><\/circle><text class=\"slabel  numtxt\" x=\"170\" y=\"236\" text-anchor=\"middle\">3<\/text><text class=\"slabel  numtxt\" x=\"246\" y=\"236\" text-anchor=\"middle\">5<\/text><text class=\"slabel  numtxt\" x=\"284\" y=\"215\" text-anchor=\"middle\">6<\/text><text class=\"slabel  numtxt\" x=\"322\" y=\"236\" text-anchor=\"middle\">7<\/text><text class=\"slabel  numtxt\" x=\"398\" y=\"236\" text-anchor=\"middle\">9<\/text><text class=\"slabel  numtxt\" x=\"436\" y=\"236\" text-anchor=\"middle\">10<\/text><text class=\"slabel  numtxt\" x=\"512\" y=\"236\" text-anchor=\"middle\">12<\/text><text class=\"slabel  numtxt\" x=\"588\" y=\"236\" text-anchor=\"middle\">14<\/text><\/svg>","sec":"stat","fm":["The arithmetic mean","The mean as a total","The total behind a mean","The median by position","The mode","The range","The quartile positions","The interquartile range","Standard deviation, written out"]},"cb_normal":{"title":"The normal distribution, all at once","tag":"Statistics","say":"Slide the mean and the normal distribution slides with it. Slide the standard deviation and the bell stretches or squeezes. The area under it never changes. The shaded bands are the 68, 95 and 99.7 per cent bands. Drag the marker along the curve. It reads the z-score, the number of standard deviations from the mean. It also reads the percentile, the share of values below it.","note":"","tries":["Move the <b>mean<\/b> slider from end to end. The whole picture slides sideways. The bands keep their widths and the shape never changes.","Move the <b>standard deviation<\/b> slider from end to end. The bell gets wider and flatter, or narrower and taller, but the middle stays put.","Drag the marker to sit exactly on a band edge. The z-score comes out a whole number, and the percentile matches the rounded ladder.","Park the marker on one value, then slide the standard deviation. The value has not moved, yet its z-score changes, because the yardstick changed.","Press <b>the six slices<\/b> and read the six numbers left to right. They are 2, 14, 34, 34, 14 and 2 per cent, and they always are."],"ideas":[{"lead":"<b>The normal distribution is set by two numbers only.<\/b>","rest":"The mean says where the middle is. The standard deviation says how wide the middle lump is. Nothing else about the shape can change.","f":"the curve is fixed by the mean and the standard deviation","eg":"mean 100 and SD 15 fix the whole curve","big":"A normal curve is set by just two numbers: the mean and the SD.","html":"<p>A <b>normal distribution<\/b> is the bell-shaped curve. Most values sit near the middle, and fewer sit far out.<\/p><ul><li>The <b>mean<\/b> (the average) tells where the middle of the bell is.<\/li><li>The <b>SD<\/b> (standard deviation, the usual distance from the mean) tells how wide the bell is.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> mean 100 and SD 15<ol><li>The middle of the bell is at 100.<\/li><li>Each SD step is 15 wide.<\/li><li>These two numbers fix the <b>whole curve<\/b>.<\/li><\/ol><\/div><p class=\"tip\">💡 Nothing else about the shape can change. It is always the same bell, just moved or stretched.<\/p>"},{"lead":"<b>Moving the mean slides the curve, it does not reshape it.<\/b>","rest":"Add 10 to every value and the mean goes up by 10. The standard deviation does not move at all.","f":"new mean = M + 10 · SD stays SD","eg":"mean 100 → 110: the curve slides right, SD stays 15","big":"Change the mean and the curve just slides. The SD stays the same.","html":"<p>Adding the same number to every value moves the whole bell. Its shape does not change.<\/p><div class=\"ex\"><b>Example:<\/b> mean 100, SD 15. Add 10 to every value.<ol><li>New mean: 100 + 10 = <b>110<\/b><\/li><li>The curve slides 10 to the right.<\/li><li>New SD: still <b>15<\/b><\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> every value and the mean move together. So each gap from the mean stays the same, and the SD (standard deviation) only measures those gaps.<\/p><p class=\"warn\">⚠️ Adding 10 to every value changes the mean, not the SD.<\/p>"},{"lead":"<b>The standard deviation is the stretch.<\/b>","rest":"Double it and the curve is twice as wide and half as tall. The area under it is still one whole, because it still holds every value.","f":"area under the whole curve = 1","eg":"SD 15 → 30: the same area, spread flatter and wider","big":"The SD stretches the curve. The area under it always stays 1.","html":"<ul><li>Bigger SD (standard deviation) → the bell is wider and flatter.<\/li><li>Double the SD → the bell is twice as wide and half as tall.<\/li><li>The <b>area<\/b> (the space under the curve) is always 1 whole, meaning 100% of the values.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> the SD changes from 15 to 30.<ol><li>The bell gets twice as wide.<\/li><li>It gets half as tall.<\/li><li>Area: still <b>1<\/b> (twice as wide × half as tall = the same)<\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> the curve still holds every value, so its area cannot change.<\/p>"},{"lead":"<b>A z-score says how far out a value is.<\/b>","rest":"Take the gap from the mean. One standard deviation is the width of one step. Dividing the gap by it turns the gap into steps. The answer is negative below the mean and positive above.","f":"z = (value − mean) ÷ standard deviation","eg":"mean 100, SD 15, value 130: z = 30 ÷ 15 = 2","big":"A z-score says how many SD steps a value is from the mean.","html":"<p><b>Rule:<\/b> z = (value − mean) ÷ SD<\/p><ul><li>Find the gap from the mean.<\/li><li>One SD (standard deviation) is the size of one step. Divide the gap by it to count the steps.<\/li><li>Below the mean → z is negative. Above the mean → z is positive.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> mean 100, SD 15, value 130<ol><li>Gap: 130 − 100 = 30<\/li><li>Steps: 30 ÷ 15 = 2<\/li><li>z = <b>2<\/b>, so 130 is 2 SDs above the mean ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Value 85 → gap 85 − 100 = −15 → z = −15 ÷ 15 = −1 (1 SD below).<\/p>"},{"lead":"<b>Going back the other way needs the same two numbers.<\/b>","rest":"If you know the z-score, multiply by the standard deviation and add the mean.","f":"value = mean + z × standard deviation","eg":"mean 100, SD 15, z = −1: 100 − 15 = 85","big":"From a z-score back to the value: mean + z × SD.","html":"<p>If you know the z-score (how many SD steps from the mean), you can find the value. You need the mean and the SD again.<\/p><p><b>Rule:<\/b> value = mean + z × SD<\/p><div class=\"ex\"><b>Example:<\/b> mean 100, SD 15, z = −1<ol><li>z × SD = −1 × 15 = −15<\/li><li>Value = 100 + (−15) = <b>85<\/b><\/li><\/ol>Check: (85 − 100) ÷ 15 = −1 ✅<\/div><p class=\"warn\">⚠️ Multiply z by the SD first, then add the mean.<\/p>"},{"lead":"<b>The six slices come from the three bands.<\/b>","rest":"The middle 68 per cent splits into 34 and 34. The next band adds 95 − 68 = 27, about 14 on each side. The last adds 99.7 − 95 = 4.7, about 2 each side.","f":"2 · 14 · 34 | 34 · 14 · 2 per cent","big":"The bell splits into 6 slices: 2, 14, 34 | 34, 14, 2 percent.","html":"<p>The SD (standard deviation) steps cut the bell into slices. They come from the 68, 95 and 99.7 bands.<\/p><ul><li><b>Middle band<\/b> (within 1 SD of the mean): 68%. Split in two → 34% and 34%.<\/li><li><b>Next band<\/b> (1 to 2 SDs out): 95 − 68 = 27% → about 14% on each side.<\/li><li><b>Last band<\/b> (2 to 3 SDs out): 99.7 − 95 = 4.7% → about 2% on each side.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> mean 100, SD 15. About what percent is from 100 to 130?<ol><li>100 to 115 is the first SD step: 34%<\/li><li>115 to 130 is the second SD step: 14%<\/li><li>34 + 14 = about <b>48%<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 All six slices add to about 100%: 2 + 14 + 34 + 34 + 14 + 2 = 100.<\/p>"},{"lead":"<b>Add the slices from the left and you get a percentile.<\/b>","rest":"A percentile is the share of values below a point. The running totals are about 2, 16, 50, 84 and 98 per cent.","f":"percentile = the share of values below","eg":"one SD above the mean: 2 + 14 + 34 + 34 = 84th percentile","big":"Add the slices from the left to get a percentile.","html":"<p>A <b>percentile<\/b> is the percent of values below a point. Start at the far left and add the slices (2, 14, 34, 34, 14, 2).<\/p><table><tr><th>Point<\/th><th>% below<\/th><\/tr><tr><td>2 SD below the mean<\/td><td>2%<\/td><\/tr><tr><td>1 SD below<\/td><td>2 + 14 = 16%<\/td><\/tr><tr><td>the mean<\/td><td>16 + 34 = 50%<\/td><\/tr><tr><td>1 SD above<\/td><td>50 + 34 = 84%<\/td><\/tr><tr><td>2 SD above<\/td><td>84 + 14 = 98%<\/td><\/tr><\/table><div class=\"ex\"><b>Example:<\/b> mean 100, SD 15. What percentile is 115?<ol><li>115 = 100 + 15, so it is 1 SD above the mean.<\/li><li>Add the slices below it: 2 + 14 + 34 + 34 = <b>84th percentile<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 The mean is always the 50th percentile, since half the values are below it.<\/p>"},{"lead":"<b>68, 95 and 99.7 are areas, not guesses.<\/b>","rest":"The area under the curve between one standard deviation either side is 68 per cent. Two either side holds 95 per cent. Three either side holds 99.7 per cent. Every normal distribution gives the same three numbers.","f":"M ± SD · M ± 2SD · M ± 3SD","eg":"mean 100, SD 15: 68% lie from 85 to 115, 95% from 70 to 130","big":"68, 95, 99.7: the percent of values within 1, 2 and 3 SDs of the mean.","html":"<ul><li>Within 1 SD (standard deviation) of the mean: <b>68%<\/b> of the values.<\/li><li>Within 2 SDs: <b>95%<\/b>.<\/li><li>Within 3 SDs: <b>99.7%<\/b>.<\/li><\/ul><p>These are areas under the curve, not guesses. Every normal curve gives the same three numbers.<\/p><div class=\"ex\"><b>Example:<\/b> mean 100, SD 15<ol><li>1 SD: from 100 − 15 = 85 to 100 + 15 = 115 → <b>68%<\/b><\/li><li>2 SDs: from 100 − 30 = 70 to 100 + 30 = 130 → <b>95%<\/b><\/li><li>3 SDs: from 100 − 45 = 55 to 100 + 45 = 145 → <b>99.7%<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ \"Within 1 SD\" means on <b>both<\/b> sides of the mean. One side alone is only half: 34%.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 840 470\"><path d=\"M 312 300 L 312 298.52 L 313.8 298.28 L 315.6 298.01 L 317.4 297.7 L 319.2 297.35 L 321 296.96 L 322.8 296.52 L 324.6 296.02 L 326.4 295.46 L 328.2 294.84 L 330 294.14 L 331.8 293.37 L 333.6 292.52 L 335.4 291.57 L 337.2 290.53 L 339 289.39 L 340.8 288.14 L 342.6 286.78 L 344.4 285.3 L 346.2 283.69 L 348 281.96 L 349.8 280.08 L 351.6 278.07 L 353.4 275.91 L 355.2 273.61 L 357 271.16 L 358.8 268.57 L 360.6 265.82 L 362.4 262.93 L 364.2 259.89 L 366 256.71 L 367.8 253.4 L 369.6 249.96 L 371.4 246.4 L 373.2 242.73 L 375 238.96 L 376.8 235.1 L 378.6 231.17 L 380.4 227.19 L 382.2 223.17 L 384 219.13 L 385.8 215.09 L 387.6 211.07 L 389.4 207.09 L 391.2 203.18 L 393 199.35 L 394.8 195.64 L 396.6 192.06 L 398 ;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"480\" y=\"318\" text-anchor=\"middle\">70<\/text><line x1=\"540\" y1=\"300\" x2=\"540\" y2=\"306\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"540\" y=\"318\" text-anchor=\"middle\">80<\/text><line x1=\"600\" y1=\"300\" x2=\"600\" y2=\"306\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"600\" y=\"318\" text-anchor=\"middle\">90<\/text><line x1=\"660\" y1=\"300\" x2=\"660\" y2=\"306\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"660\" y=\"318\" text-anchor=\"middle\">100<\/text><line x1=\"720\" y1=\"300\" x2=\"720\" y2=\"306\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"720\" y=\"318\" text-anchor=\"middle\">110<\/text><line x1=\"780\" y1=\"300\" x2=\"780\" y2=\"306\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"780\" y=\"318\" text-anchor=\"middle\">120<\/text><line x1=\"492\" y1=\"300\" x2=\"492\" y2=\"281.96\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><circle class=\"handle\" cx=\"492\" cy=\"281.96\" r=\"8\"><\/circle><circle cx=\"492\" cy=\"281.96\" r=\"4\" style=\"fill:var(--red)\"><\/circle><text class=\"slabel r numtxt\" x=\"492\" y=\"26\" text-anchor=\"middle\">the marker stands at 72<\/text><text class=\"slabel r numtxt\" x=\"492\" y=\"44\" text-anchor=\"middle\">z-score = (72 − 60) ÷ 6 = 12 ÷ 6 = 2 standard deviations out<\/text><text class=\"slabel g numtxt\" x=\"420\" y=\"338\" text-anchor=\"middle\">mean = 60<\/text><line x1=\"384\" y1=\"362\" x2=\"456\" y2=\"362\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"384\" y1=\"358\" x2=\"384\" y2=\"366\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"456\" y1=\"358\" x2=\"456\" y2=\"366\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel b numtxt\" x=\"420\" y=\"380\" text-anchor=\"middle\">68% sit between 54 and 66, that is 60 ± 1 × 6<\/text><line x1=\"348\" y1=\"394\" x2=\"492\" y2=\"394\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"348\" y1=\"390\" x2=\"348\" y2=\"398\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"492\" y1=\"390\" x2=\"492\" y2=\"398\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel b numtxt\" x=\"420\" y=\"412\" text-anchor=\"middle\">95% sit between 48 and 72, that is 60 ± 2 × 6 = 60 ± 12<\/text><line x1=\"312\" y1=\"426\" x2=\"528\" y2=\"426\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"312\" y1=\"422\" x2=\"312\" y2=\"430\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"528\" y1=\"422\" x2=\"528\" y2=\"430\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel b numtxt\" x=\"420\" y=\"444\" text-anchor=\"middle\">99.7% sit between 42 and 78, that is 60 ± 3 × 6 = 60 ± 18<\/text><\/svg>","sec":"stat","fm":["The six normal regions","Standard units","Back from standard units","Percentile from a count","The arithmetic mean","Standard deviation, written out"]},"cb_groups":{"title":"Two groups joined: the weighted average","tag":"Statistics","say":"Two groups, each with a size and a mean. Slide any of them. The weighted average lands on the beam as a balance point. It is never halfway unless the two groups are the same size. The plain mean of the two means is drawn in red, because that is the trap. The second button shows what joining the groups does to the standard deviation.","note":"","tries":["Make group A much bigger than group B. The balance point slides right up against the mean of A, because A is carrying most of the weight.","Set the two sizes equal. Now the green mark and the red mark land on top of each other, and the plain mean is right for once.","Read the two gaps, then read the two sizes. The gaps come out in the reverse order of the sizes, every time. That is the whole alligation trick.","Press <b>the standard deviation<\/b> and pull the two means apart. The joined band gets wider than either group band, even though neither group changed inside.","Set both means to the same number and press <b>the standard deviation<\/b>. The joined band matches the group bands, because there is no gap left to add."],"ideas":[{"lead":"<b>The weighted average comes from totals, never from means.<\/b>","rest":"Turn each mean back into a total, add the two totals, then divide by the two sizes added. That is all a weighted average is.","f":"M = (n₁M₁ + n₂M₂) ÷ (n₁ + n₂)","eg":"10 people at 80 and 30 at 60: (800 + 1,800) ÷ 40 = 65","big":"To join two groups, add their totals, then divide by everyone.","html":"<p>A <b>weighted average<\/b> is the mean (average) of two groups joined together. Work with totals, never with the two means alone.<\/p><p><b>Rule:<\/b> joined mean = (total 1 + total 2) ÷ (size 1 + size 2), where each total = size × mean.<\/p><div class=\"ex\"><b>Example:<\/b> 10 people have a mean of 80. 30 people have a mean of 60.<ol><li>Total 1: 10 × 80 = 800<\/li><li>Total 2: 30 × 60 = 1,800<\/li><li>Everyone: 10 + 30 = 40 people<\/li><li>Joined mean: (800 + 1,800) ÷ 40 = 2,600 ÷ 40 = <b>65<\/b> ✅<\/li><\/ol><\/div>"},{"lead":"<b>A mean is a total waiting to be undone.<\/b>","rest":"Size times mean gives the total back. This one step turns almost every mixing question into adding.","f":"total = n × M","eg":"5 people with mean 12 → total 60","big":"Size × mean gives you the total back.","html":"<p>A mean (average) is a total that was divided. Multiply to undo it.<\/p><p><b>Rule:<\/b> total = how many × mean<\/p><div class=\"ex\"><b>Example:<\/b> 5 people have a mean of 12.<ol><li>Total = 5 × 12 = <b>60<\/b><\/li><\/ol>Check: 60 ÷ 5 = 12 ✅<\/div><p class=\"tip\">💡 This one step turns almost every mixing question into adding. 4 numbers have mean 10. A 5th number makes the mean 12. What is it? New total 5 × 12 = 60, old total 4 × 10 = 40, so the 5th number is 60 − 40 = <b>20<\/b>.<\/p>"},{"lead":"<b>The plain mean of two means is the trap.<\/b>","rest":"It is only right when the two groups are the same size. Any other time it sits on the wrong side.","f":"(M₁ + M₂) ÷ 2 is wrong unless n₁ = n₂","eg":"(80 + 60) ÷ 2 = 70, but the real answer is 65","big":"Trap: do not just average the two means.","html":"<p>(mean 1 + mean 2) ÷ 2 is right <b>only<\/b> when the two groups are the same size. Any other time it gives the wrong answer.<\/p><div class=\"ex\"><b>Example:<\/b> 10 people at 80 and 30 people at 60<ol><li>Trap answer: (80 + 60) ÷ 2 = 70 ❌<\/li><li>Real answer: (10 × 80 + 30 × 60) ÷ 40 = 2,600 ÷ 40 = <b>65<\/b> ✅<\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> the plain average treats 10 people and 30 people as equal. The group of 30 should count more.<\/p><p class=\"warn\">⚠️ The trap answer sits on the wrong side, too close to the smaller group.<\/p>"},{"lead":"<b>The weighted average always lands nearer the bigger group.<\/b>","rest":"The total counts every value once. The bigger group hands in more values, so it drags the total further its own way. That is why the balance point slides towards it.","f":"n₁ &gt; n₂ → M is nearer M₁","eg":"65 is nearer 60, where the 30 people are","big":"The joined mean is always closer to the bigger group's mean.","html":"<ul><li>The bigger group has more people, so it adds more to the total.<\/li><li>That pulls the joined mean toward its own mean.<\/li><li><b>Rule:<\/b> if group 1 is bigger, the joined mean is nearer mean 1.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> 10 people at 80, 30 people at 60, joined mean 65<ol><li>Gap from 65 down to 60: 5<\/li><li>Gap from 65 up to 80: 15<\/li><li>65 is nearer <b>60<\/b>, the mean of the 30 people ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Use it to check answers fast. If the joined mean is not nearer the bigger group, something is wrong.<\/p>"},{"lead":"<b>Alligation is the same answer read as a ratio.<\/b>","rest":"Alligation means working a mix out from the gaps. The gap from each mean to the weighted average is in the reverse ratio of the sizes.","f":"(M − M₁) : (M₂ − M) = n₂ : n₁","eg":"M₁ = 60 (30 people), M₂ = 80 (10 people), M = 65: 5 : 15 = 10 : 30","big":"The gaps to the joined mean are in the flipped ratio of the group sizes.","html":"<p><b>Alligation<\/b> means solving a mix by using the gaps. A <b>ratio<\/b> compares two amounts, like 1 : 3.<\/p><p><b>Rule:<\/b> (joined mean − mean 1) : (mean 2 − joined mean) = size 2 : size 1. The bigger group gets the smaller gap.<\/p><div class=\"ex\"><b>Example:<\/b> 30 people at 60, 10 people at 80, joined mean 65<ol><li>Gap from 60 to 65: 5<\/li><li>Gap from 65 to 80: 15<\/li><li>Gaps: 5 : 15 = 1 : 3<\/li><li>Sizes, flipped (80 group first): 10 : 30 = 1 : 3. The same ratio ✅<\/li><\/ol><\/div><p class=\"tip\">💡 The group with 3 times as many people sits 3 times closer to the joined mean.<\/p>"},{"lead":"<b>The reverse ratio gives you the sizes from the gaps.<\/b>","rest":"If you know the three means you know the ratio of the two sizes, without knowing either size.","f":"n₁ : n₂ = (M₂ − M) : (M − M₁)","eg":"n₁ : n₂ = (80 − 65) : (65 − 60) = 15 : 5 = 30 : 10","big":"Know the three means? The gaps give you the ratio of the group sizes.","html":"<p>You do not need to know how many are in each group. The gaps tell you how the sizes compare.<\/p><p><b>Rule:<\/b> size 1 : size 2 = (mean 2 − joined mean) : (joined mean − mean 1)<\/p><div class=\"ex\"><b>Example:<\/b> group 1 has mean 60, group 2 has mean 80, and the joined mean is 65.<ol><li>Gap on group 2's side: 80 − 65 = 15<\/li><li>Gap on group 1's side: 65 − 60 = 5<\/li><li>Size 1 : size 2 = 15 : 5 = <b>3 : 1<\/b><\/li><\/ol>Check: 30 people at 60 and 10 at 80 → 2,600 ÷ 40 = 65 ✅<\/div><p class=\"warn\">⚠️ Each size goes with the <b>other<\/b> group's gap. Do not match them the wrong way.<\/p>"},{"lead":"<b>Joining two groups with different means widens the standard deviation.<\/b>","rest":"The joined standard deviation carries the spread inside each group plus the gap between the two means.","f":"SD² = s² + n₁n₂(M₁ − M₂)² ÷ (n₁ + n₂)²","big":"Joining two groups with different means makes the spread bigger.","html":"<p>The joined SD (standard deviation, the usual distance from the mean) has two parts: the spread <b>inside<\/b> each group, plus the gap <b>between<\/b> the two means.<\/p><p><b>Rule:<\/b> SD² = s² + n₁ × n₂ × (M₁ − M₂)² ÷ (n₁ + n₂)². n₁, n₂ are the sizes, M₁, M₂ are the means, and s² is the size-weighted average of the two squared SDs.<\/p><div class=\"ex\"><b>Example:<\/b> group A is 1, 3 (mean 2, SD 1). Group B is 5, 7 (mean 6, SD 1).<ol><li>Inside part: s² = 1<\/li><li>Gap part: 2 × 2 × (2 − 6)² ÷ (2 + 2)² = 64 ÷ 16 = 4<\/li><li>SD² = 1 + 4 = 5, so SD = √5 ≈ <b>2.24<\/b>, wider than 1<\/li><\/ol>Check: 1, 3, 5, 7 has mean 4. Squared gaps 9, 1, 1, 9 → 20 ÷ 4 = 5 ✅<\/div>"},{"lead":"<b>Same means, same standard deviation.<\/b>","rest":"Two groups with the same mean leave no gap to add. So joining them leaves the standard deviation exactly where it already was.","f":"M₁ = M₂ → SD = s","big":"Same means → joining adds no extra spread.","html":"<p>When two groups have the <b>same mean<\/b>, there is no gap between the means. So the gap part of the rule is 0.<\/p><p><b>Rule:<\/b> M₁ = M₂ → joined SD = s (only the spread inside the groups). SD means standard deviation, the usual distance from the mean.<\/p><div class=\"ex\"><b>Example:<\/b> group A is 4, 6. Group B is 4, 4, 6, 6. Both have mean 5 and SD 1.<ol><li>Joined: 4, 4, 4, 6, 6, 6. Mean = 30 ÷ 6 = 5<\/li><li>Every number is 1 away from 5.<\/li><li>Joined SD = <b>1<\/b>, the same as before ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Same mean and same SD in both groups → the joined group keeps that same SD.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 840 440\"><text class=\"slabel \" x=\"420\" y=\"28\" text-anchor=\"middle\">the weighted average is the balance point of the two groups<\/text><rect x=\"337.9\" y=\"197\" width=\"144.2\" height=\"6\" style=\"fill:var(--ink-3);stroke:none\"><\/rect><rect x=\"298\" y=\"158\" width=\"84\" height=\"42\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2\"><\/rect><rect x=\"438\" y=\"166\" width=\"84\" height=\"34\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2\"><\/rect><line x1=\"340\" y1=\"158\" x2=\"340\" y2=\"200\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><line x1=\"480\" y1=\"166\" x2=\"480\" y2=\"200\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><text class=\"slabel b numtxt\" x=\"340\" y=\"128\" text-anchor=\"middle\">A: 12 values, mean 40, total 12 × 40 = 480<\/text><text class=\"slabel b numtxt\" x=\"480\" y=\"146\" text-anchor=\"middle\">B: 8 values, mean 60, total 8 × 60 = 480<\/text><polygon points=\"396,200 384,222 408,222\" style=\"fill:var(--green);fill-opacity:.25;stroke:var(--green);stroke-width:2\"><\/polygon><text class=\"slabel  numtxt\" x=\"368\" y=\"234\" text-anchor=\"middle\">gap = 8<\/text><line x1=\"340\" y1=\"244\" x2=\"396\" y2=\"244\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"340\" y1=\"239\" x2=\"340\" y2=\"249\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"396\" y1=\"239\" x2=\"396\" y2=\"249\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"438\" y=\"262\" text-anchor=\"middle\">gap = 12<\/text><line x1=\"396\" y1=\"272\" x2=\"480\" y2=\"272\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"396\" y1=\"267\" x2=\"396\" y2=\"277\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"480\" y1=\"267\" x2=\"480\" y2=\"277\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><polygon points=\"396,298 388,284 404,284\" style=\"fill:var(--green);stroke:none\"><\/polygon><polygon points=\"410,298 402,284 418,284\" style=\"fill:none;stroke:var(--red);stroke-width:2\"><\/polygon><line x1=\"50\" y1=\"300\" x2=\"770\" y2=\"300\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"60\" y1=\"300\" x2=\"60\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"60\" y=\"320\" text-anchor=\"middle\">0<\/text><line x1=\"130\" y1=\"300\" x2=\"130\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"130\" y=\"320\" text-anchor=\"middle\">10<\/text><line x1=\"200\" y1=\"300\" x2=\"200\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"200\" y=\"320\" text-anchor=\"middle\">20<\/text><line x1=\"270\" y1=\"300\" x2=\"270\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"270\" y=\"320\" text-anchor=\"middle\">30<\/text><line x1=\"340\" y1=\"300\" x2=\"340\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"340\" y=\"320\" text-anchor=\"middle\">40<\/text><line x1=\"410\" y1=\"300\" x2=\"410\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"410\" y=\"320\" text-anchor=\"middle\">50<\/text><line x1=\"480\" y1=\"300\" x2=\"480\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"480\" y=\"320\" text-anchor=\"middle\">60<\/text><line x1=\"550\" y1=\"300\" x2=\"550\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"550\" y=\"320\" text-anchor=\"middle\">70<\/text><line x1=\"620\" y1=\"300\" x2=\"620\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"620\" y=\"320\" text-anchor=\"middle\">80<\/text><line x1=\"690\" y1=\"300\" x2=\"690\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"690\" y=\"320\" text-anchor=\"middle\">90<\/text><line x1=\"760\" y1=\"300\" x2=\"760\" y2=\"305\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"760\" y=\"320\" text-anchor=\"middle\">100<\/text><line x1=\"396\" y1=\"300\" x2=\"396\" y2=\"308\" style=\"stroke:var(--green);stroke-width:3;fill:none\"><\/line><line x1=\"410\" y1=\"300\" x2=\"410\" y2=\"308\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><text class=\"slabel g numtxt\" x=\"396\" y=\"344\" text-anchor=\"middle\">the weighted average = (480 + 480) ÷ 20 = 960 ÷ 20 = 48<\/text><text class=\"slabel r numtxt\" x=\"410\" y=\"368\" text-anchor=\"middle\">plain mean of the two means = (40 + 60) ÷ 2 = 50 — the trap<\/text><text class=\"slabel  numtxt\" x=\"420\" y=\"398\" text-anchor=\"middle\">gaps 2 : 3 &nbsp; sizes 3 : 2 &nbsp; the reverse of each other<\/text><text class=\"slabel  numtxt\" x=\"420\" y=\"424\" text-anchor=\"middle\">standard deviation inside each group 6 &nbsp; standard deviation of the joined group 11.5<\/text><\/svg>","sec":"stat","fm":["The combined mean of two groups","Weighted average of two groups","The weighted mean","Alligation: the mixing ratio","The mean as a total","The arithmetic mean"]},"cb_sets":{"title":"Two groups that overlap, all at once","tag":"Data Analysis","say":"The box is everyone. Each circle is one set, which is just a named group. The part where the circles cross is the overlap, the people in both. Everyone in at least one set makes the union. Move the sliders and every count answers at once. The last button puts a third set in. Each region prints its own count, so you can add them up with your eyes.","note":"","tries":["Push group A and group B up until they add to more than the total. The overlap slider stops going down. Some people have to be in both.","Set the overlap to zero. The count in at least one becomes group A plus group B, with nothing taken off.","Push the overlap up to the size of the smaller group. That group now sits completely inside the bigger one, and its own region empties.","Drop the total until it matches the number in at least one. The people in neither run out, and the box is full.","Press the third circle button. The adding and taking off happens three times over, and the middle piece has to come back once."],"ideas":[{"lead":"<b>Add the two sets, then take the overlap off once.<\/b>","rest":"Adding counts the people in the overlap twice. Taking the overlap off once puts that right, and what is left is the union.","f":"the union = A + B − both","eg":"20 like tea, 15 like coffee, 5 like both: 20 + 15 − 5 = 30","big":"Both groups together = A + B − both.","html":"<p>A <b>set<\/b> is just a named group. The <b>overlap<\/b> is the people in both groups. The <b>union<\/b> is everyone in at least one group.<\/p><p><b>Rule:<\/b> union = A + B − both<\/p><div class=\"ex\"><b>Example:<\/b> 20 like tea, 15 like coffee, 5 like both. How many like tea or coffee?<ol><li>Add: 20 + 15 = 35<\/li><li>The 5 who like both were counted twice. Take them off once.<\/li><li>35 − 5 = <b>30<\/b> ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ Take off the overlap only once, not twice.<\/p>"},{"lead":"<b>Everyone sits in one of four regions.<\/b>","rest":"In set A only, in the overlap, in set B only, or in neither. Those four counts always add up to the total.","f":"A only + both + B only + neither = total","eg":"tea only 15 + both 5 + coffee only 10 + neither 10 = 40","big":"Everyone falls into exactly one of 4 boxes.","html":"<ul><li><b>A only<\/b> (in A, not in B)<\/li><li><b>Both<\/b> (in A and in B)<\/li><li><b>B only<\/b> (in B, not in A)<\/li><li><b>Neither<\/b> (in no group)<\/li><\/ul><p><b>Rule:<\/b> A only + both + B only + neither = total<\/p><div class=\"ex\"><b>Example:<\/b> 40 people. 20 like tea, 15 like coffee, 5 like both.<ol><li>Tea only: 20 − 5 = 15<\/li><li>Coffee only: 15 − 5 = 10<\/li><li>Neither: 40 − 15 − 5 − 10 = 10<\/li><li>Check: 15 + 5 + 10 + 10 = <b>40<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 A small table or circle picture with these 4 boxes solves most of these questions.<\/p>"},{"lead":"<b>The ones in neither set are what is left over.<\/b>","rest":"Take the union away from the total and that is what you get.","f":"neither = total − the union","eg":"40 people, 30 in the union → 10 in neither","big":"Neither = total − union.","html":"<p>The people in <b>neither<\/b> group are the ones left over. The <b>union<\/b> is everyone in at least one group.<\/p><div class=\"ex\"><b>Example:<\/b> 40 people. 20 like tea, 15 like coffee, 5 like both.<ol><li>Union: 20 + 15 − 5 = 30<\/li><li>Neither: 40 − 30 = <b>10<\/b> ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ Find the union first. If you take 20 and 15 straight off 40, you get 5, which is wrong. The 5 people in both were taken off twice.<\/p>"},{"lead":"<b>The overlap can never beat the smaller set.<\/b>","rest":"Every person in both sets is also in each set on its own.","f":"both ≤ the smaller of A and B","eg":"A = 20, B = 15 → both is at most 15","big":"The overlap can never be bigger than the smaller group.","html":"<p>Everyone in <b>both<\/b> groups is also inside each group by itself. So the overlap must fit inside the smaller group.<\/p><p><b>Rule:<\/b> both ≤ the smaller of A and B<\/p><div class=\"ex\"><b>Example:<\/b> A = 20, B = 15<ol><li>The smaller group is B, with 15.<\/li><li>So both is <b>at most 15<\/b>.<\/li><\/ol>This biggest case happens when all 15 people in B are also in A ✅<\/div><p class=\"tip\">💡 Use this for \"greatest possible overlap\" questions.<\/p>"},{"lead":"<b>When the two sets overrun the total, an overlap is forced.<\/b>","rest":"The amount they overrun by is the least the overlap can be.","f":"both ≥ A + B − total","eg":"A = 30, B = 25, total 40 → both is at least 15","big":"If A + B is more than the total, some people must be in both.","html":"<p>When the two groups add up to more than everyone, some people were counted twice. The extra is the <b>smallest<\/b> the overlap can be.<\/p><p><b>Rule:<\/b> both ≥ A + B − total<\/p><div class=\"ex\"><b>Example:<\/b> 40 people. A = 30, B = 25.<ol><li>A + B = 30 + 25 = 55<\/li><li>55 − 40 = 15 extra<\/li><li>So both is <b>at least 15<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Use this for \"least possible overlap\" questions. If A + B is not more than the total, the overlap can be 0.<\/p>"},{"lead":"<b>With three sets you add, take each pair overlap off, then put the middle back.<\/b>","rest":"The middle piece is taken off three times, so it has to come back once.","f":"A + B + C − (the three pairs) + all three","eg":"10 + 12 + 8 − (4 + 3 + 2) + 1 = 22","big":"Three groups: add all three, take off the pair overlaps, add back the middle.","html":"<p><b>Rule:<\/b> in at least one group = A + B + C − (the 3 pair overlaps) + all three<\/p><div class=\"ex\"><b>Example:<\/b> A = 10, B = 12, C = 8. In A and B: 4. In A and C: 3. In B and C: 2. In all three: 1.<ol><li>Add the groups: 10 + 12 + 8 = 30<\/li><li>Take off the pairs: 4 + 3 + 2 = 9 → 30 − 9 = 21<\/li><li>Add back the middle: 21 + 1 = <b>22<\/b> ✅<\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> people in all three groups are added 3 times, then taken off 3 times (once in each pair). So they must be added back once.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 560\"><rect x=\"28\" y=\"58\" width=\"624\" height=\"412\" rx=\"8\" style=\"fill:none;stroke:var(--ink-3);stroke-width:1.5\"><\/rect><text class=\"slabel b numtxt\" x=\"340\" y=\"40\" text-anchor=\"middle\">the box is everyone: 48 people<\/text><text class=\"slabel  numtxt\" x=\"44\" y=\"82\" text-anchor=\"start\">everyone (48)<\/text><text class=\"slabel \" x=\"44\" y=\"440\" text-anchor=\"start\">in neither<\/text><text class=\"slabel g numtxt\" x=\"44\" y=\"458\" text-anchor=\"start\">12<\/text><circle cx=\"255\" cy=\"264\" r=\"125\" style=\"fill:var(--blue);fill-opacity:.13;stroke:var(--blue);stroke-width:2\"><\/circle><circle cx=\"385\" cy=\"264\" r=\"125\" style=\"fill:var(--blue);fill-opacity:.13;stroke:var(--blue);stroke-width:2\"><\/circle><text class=\"slabel b\" x=\"195\" y=\"187\" text-anchor=\"middle\">group A<\/text><text class=\"slabel b\" x=\"445\" y=\"187\" text-anchor=\"middle\">group B<\/text><text class=\"slabel \" x=\"195\" y=\"259\" text-anchor=\"middle\">A only<\/text><text class=\"slabel b numtxt\" x=\"195\" y=\"279\" text-anchor=\"middle\">18<\/text><text class=\"slabel \" x=\"320\" y=\"259\" text-anchor=\"middle\">in both<\/text><text class=\"slabel r numtxt\" x=\"320\" y=\"279\" text-anchor=\"middle\">6<\/text><text class=\"slabel \" x=\"445\" y=\"259\" text-anchor=\"middle\">B only<\/text><text class=\"slabel b numtxt\" x=\"445\" y=\"279\" text-anchor=\"middle\">12<\/text><line x1=\"160\" y1=\"504\" x2=\"560\" y2=\"504\" style=\"stroke:var(--line-2);stroke-width:7;stroke-linecap:round\"><\/line><line x1=\"160\" y1=\"504\" x2=\"560\" y2=\"504\" style=\"stroke:var(--green);stroke-width:7;stroke-linecap:round\"><\/line><circle cx=\"293.33\" cy=\"504\" r=\"7\" style=\"fill:var(--panel);stroke:var(--red);stroke-width:3\"><\/circle><text class=\"slabel g numtxt\" x=\"144\" y=\"508\" text-anchor=\"end\">at least 0<\/text><text class=\"slabel g numtxt\" x=\"576\" y=\"508\" text-anchor=\"start\">at most 18<\/text><text class=\"slabel r numtxt\" x=\"293.33\" y=\"486\" text-anchor=\"middle\">the overlap is 6<\/text><text class=\"slabel \" x=\"340\" y=\"534\" text-anchor=\"middle\">the overlap is squeezed between these two<\/text><\/svg>","sec":"da","fm":["The union of two categories","The least possible overlap","A total from a table of categories","The union of two events"]},"cb_count":{"title":"Choosing and arranging, all at once","tag":"Data Analysis","say":"Set how many things you have and how many you pick. The four counting answers sit in one square. A permutation is a line-up where the order counts. A combination is a pick where the order does not count. Each of the two comes with things put back or not. The other buttons draw every choice one by one. They show how fast the factorial ladder climbs. They show what happens when some things look the same. They show why choosing is the same as leaving behind.","note":"","tries":["Set n to 5 and k to 2, then press the button that draws every choice. Count the rows by hand and check them against the number.","Hold n still and walk k from 0 up to n. Watch the choice count rise to a peak in the middle and fall back to 1.","Make k bigger than n. The two counts without putting back drop to zero, because you cannot pick more different things than you own.","Press the factorial ladder and slide n from 1 to 12. Each step multiplies by the next number, so the bars run away from you.","Press the last button. Whatever you set, choosing k and leaving n minus k give the same number every time."],"ideas":[{"lead":"<b>A permutation is a line-up where the order counts.<\/b>","rest":"You get n ways for the first pick, then n minus one for the second, and so on. The same count is n! divided by (n minus k)!","f":"P(n, k) = n! / (n − k)!","eg":"P(5, 2) = 5 × 4 = 20","big":"Permutation: order matters, so multiply down.","html":"<p>A <b>permutation<\/b> is a line-up where order matters. AB and BA count as 2 different line-ups.<\/p><ul><li>First spot: n choices (n = how many things you have).<\/li><li>Second spot: n − 1 choices, and so on, for k spots.<\/li><\/ul><p><b>Rule:<\/b> P(n, k) = n! ÷ (n − k)!. Here n! (n factorial) means n × (n − 1) × … × 1.<\/p><div class=\"ex\"><b>Example:<\/b> 5 runners. How many ways to give out 1st and 2nd place?<ol><li>1st place: 5 choices<\/li><li>2nd place: 4 choices<\/li><li>5 × 4 = <b>20<\/b><\/li><\/ol>Check: 5! ÷ 3! = 120 ÷ 6 = 20 ✅<\/div>"},{"lead":"<b>A combination is a pick where the order does not count.<\/b>","rest":"Each set of k things can be lined up in k factorial ways. Those line-ups all count as one pick, so divide by k factorial.","f":"C(n, k) = n! / (k! × (n − k)!)","eg":"C(5, 2) = 20 ÷ 2 = 10","big":"Combination: order does not matter, so divide out the repeats.","html":"<p>A <b>combination<\/b> is a pick where order does not matter. Picking A then B is the same as B then A.<\/p><ul><li>Each group of k things can be lined up in k! ways (k! = k × (k − 1) × … × 1).<\/li><li>All those line-ups are really one pick, so divide by k!.<\/li><\/ul><p><b>Rule:<\/b> C(n, k) = n! ÷ (k! × (n − k)!)<\/p><div class=\"ex\"><b>Example:<\/b> pick 2 people from 5 for a team.<ol><li>Line-ups (order matters): 5 × 4 = 20<\/li><li>Each pair was counted 2! = 2 times (AB and BA).<\/li><li>20 ÷ 2 = <b>10<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Ask: does order matter? A race (1st, 2nd) → permutation. A team → combination.<\/p>"},{"lead":"<b>Putting things back means every pick still has n choices.<\/b>","rest":"Nothing is used up, so the count is n multiplied by itself k times.","f":"with putting back, order counts: n to the power k","eg":"3 picks from 4, putting back: 4³ = 64","big":"Putting things back means every pick has all n choices again.","html":"<p>When you put each thing back, nothing gets used up. So every pick has the same number of choices.<\/p><p><b>Rule:<\/b> n<sup>k<\/sup> (n multiplied by itself k times). Here n = how many things, k = how many picks. Order counts here.<\/p><div class=\"ex\"><b>Example:<\/b> 4 things, pick 3 times, putting back each time.<ol><li>Pick 1: 4 choices. Pick 2: 4 choices. Pick 3: 4 choices.<\/li><li>4 × 4 × 4 = 4³ = <b>64<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 A 3-digit lock using digits 0 to 9 has 10³ = 1,000 codes, because digits can repeat.<\/p>"},{"lead":"<b>Choosing k is the same as leaving n minus k behind.<\/b>","rest":"Every combination names its own leftovers, so the two counts have to match.","f":"C(n, k) = C(n, n − k)","eg":"C(10, 8) = C(10, 2) = 45","big":"Choosing k is the same as choosing which n − k to leave behind.","html":"<p>Every pick of k things also names the ones left over. So the two counts are equal.<\/p><p><b>Rule:<\/b> C(n, k) = C(n, n − k)<\/p><div class=\"ex\"><b>Example:<\/b> C(10, 8), which means pick 8 from 10.<ol><li>Picking 8 is the same as leaving 2 behind.<\/li><li>So C(10, 8) = C(10, 2)<\/li><li>C(10, 2) = (10 × 9) ÷ (2 × 1) = 90 ÷ 2 = <b>45<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Always use the smaller number. C(10, 2) is much faster to work out than C(10, 8).<\/p>"},{"lead":"<b>Things that look the same wipe out the extra orders.<\/b>","rest":"Divide n factorial by the factorial of each block of matching items.","f":"n! / (a! × b! × …)","eg":"LEVEL: 5! ÷ (2! × 2!) = 30","big":"Repeated letters: divide by the factorial of each repeat.","html":"<p>When some things look the same, swapping them does not make a new order. So divide out those extra orders.<\/p><p><b>Rule:<\/b> n! ÷ (a! × b! × …). Here n! (n factorial) = n × (n − 1) × … × 1, and a, b are how many times each repeated thing appears.<\/p><div class=\"ex\"><b>Example:<\/b> how many ways to arrange the letters of LEVEL?<ol><li>5 letters: 5! = 5 × 4 × 3 × 2 × 1 = 120<\/li><li>L appears 2 times, and E appears 2 times.<\/li><li>120 ÷ (2! × 2!) = 120 ÷ 4 = <b>30<\/b> ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ A letter that appears once (like V) needs no dividing, since 1! = 1.<\/p>"},{"lead":"<b>A factorial grows faster than anything else on this board.<\/b>","rest":"A factorial multiplies every whole number from n down to 1, so the ladder runs away.","f":"n! = n × (n − 1) × … × 2 × 1","eg":"5! = 120 · 10! = 3,628,800","big":"n! means multiply every whole number from n down to 1.","html":"<p><b>Factorial<\/b> (written n!) grows faster than anything else here.<\/p><p><b>Rule:<\/b> n! = n × (n − 1) × … × 2 × 1<\/p><div class=\"ex\"><b>Example:<\/b><ol><li>3! = 3 × 2 × 1 = 6<\/li><li>5! = 5 × 4 × 3 × 2 × 1 = <b>120<\/b><\/li><li>10! = <b>3,628,800<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 Cancel before you multiply: 10! ÷ 8! = 10 × 9 = 90. Also remember 0! = 1.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 460\"><text class=\"slabel b numtxt\" x=\"340\" y=\"34\" text-anchor=\"middle\">8 things on the table, and you take 3 of them<\/text><rect x=\"178\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--green);fill-opacity:.2;stroke:var(--green);stroke-width:2\"><\/rect><rect x=\"220\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--green);fill-opacity:.2;stroke:var(--green);stroke-width:2\"><\/rect><rect x=\"262\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--green);fill-opacity:.2;stroke:var(--green);stroke-width:2\"><\/rect><rect x=\"304\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.6\"><\/rect><rect x=\"346\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.6\"><\/rect><rect x=\"388\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.6\"><\/rect><rect x=\"430\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.6\"><\/rect><rect x=\"472\" y=\"63\" width=\"30\" height=\"30\" rx=\"6\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.6\"><\/rect><text class=\"slabel \" x=\"193\" y=\"82\" text-anchor=\"middle\">A<\/text><text class=\"slabel \" x=\"235\" y=\"82\" text-anchor=\"middle\">B<\/text><text class=\"slabel \" x=\"277\" y=\"82\" text-anchor=\"middle\">C<\/text><text class=\"slabel \" x=\"319\" y=\"82\" text-anchor=\"middle\">D<\/text><text class=\"slabel \" x=\"361\" y=\"82\" text-anchor=\"middle\">E<\/text><text class=\"slabel \" x=\"403\" y=\"82\" text-anchor=\"middle\">F<\/text><text class=\"slabel \" x=\"445\" y=\"82\" text-anchor=\"middle\">G<\/text><text class=\"slabel \" x=\"487\" y=\"82\" text-anchor=\"middle\">H<\/text><text class=\"slabel g numtxt\" x=\"340\" y=\"120\" text-anchor=\"middle\">the green ones are one possible pick of 3<\/text><rect x=\"56\" y=\"140\" width=\"568\" height=\"260\" rx=\"6\" style=\"fill:none;stroke:var(--line-2);stroke-width:1.2\"><\/rect><line x1=\"56\" y1=\"180\" x2=\"624\" y2=\"180\" style=\"stroke:var(--line-2);stroke-width:1.2;fill:none\"><\/line><line x1=\"56\" y1=\"290\" x2=\"624\" y2=\"290\" style=\"stroke:var(--line-2);stroke-width:1.2;fill:none\"><\/line><line x1=\"216\" y1=\"140\" x2=\"216\" y2=\"400\" style=\"stroke:var(--line-2);stroke-width:1.2;fill:none\"><\/line><line x1=\"420\" y1=\"140\" x2=\"420\" y2=\"400\" style=\"stroke:var(--line-2);stroke-width:1.2;fill:none\"><\/line><text class=\"slabel \" x=\"318\" y=\"164\" text-anchor=\"middle\">without putting back<\/text><text class=\"slabel \" x=\"522\" y=\"164\" text-anchor=\"middle\">with putting back<\/text><text class=\"slabel b\" x=\"136\" y=\"228\" text-anchor=\"middle\">order<\/text><text class=\"slabel b\" x=\"136\" y=\"246\" text-anchor=\"middle\">matters<\/text><text class=\"slabel b\" x=\"136\" y=\"338\" text-anchor=\"middle\">order does<\/text><text class=\"slabel b\" x=\"136\" y=\"356\" text-anchor=\"middle\">not matter<\/text><text class=\"slabel  numtxt\" x=\"318\" y=\"208\" text-anchor=\"middle\">8 × 7 × 6<\/text><text class=\"slabel g numtxt\" x=\"318\" y=\"236\" text-anchor=\"middle\">= 336<\/text><text class=\"slabel \" x=\"318\" y=\"264\" text-anchor=\"middle\">n! / (n − k)!<\/text><text class=\"slabel  numtxt\" x=\"522\" y=\"208\" text-anchor=\"middle\">8 × 8 × 8<\/text><text class=\"slabel g numtxt\" x=\"522\" y=\"236\" text-anchor=\"middle\">= 512<\/text><text class=\"slabel \" x=\"522\" y=\"264\" text-anchor=\"middle\">n to the power k<\/text><text class=\"slabel  numtxt\" x=\"318\" y=\"318\" text-anchor=\"middle\">336 ÷ 6<\/text><text class=\"slabel g numtxt\" x=\"318\" y=\"346\" text-anchor=\"middle\">= 56<\/text><text class=\"slabel \" x=\"318\" y=\"374\" text-anchor=\"middle\">n! / (k! × (n − k)!)<\/text><text class=\"slabel  numtxt\" x=\"522\" y=\"318\" text-anchor=\"middle\">choose 3 from 10<\/text><text class=\"slabel g numtxt\" x=\"522\" y=\"346\" text-anchor=\"middle\">= 120<\/text><text class=\"slabel  numtxt\" x=\"522\" y=\"374\" text-anchor=\"middle\">(n + k − 1) choose k<\/text><text class=\"slabel \" x=\"340\" y=\"430\" text-anchor=\"middle\">the left column uses things up, the right column hands them back<\/text><\/svg>","sec":"da","fm":["The counting principle","Permutations","Combinations","The symmetry of combinations","Arrangements with repeated items","Handshakes and pairs","Identical items into groups"]},"cb_prob":{"title":"A two-stage chance tree, all at once","tag":"Data Analysis","say":"Two things happen one after the other, and each can go yes or no. Drag the dot on a branch, or move the sliders, to set its probability. A probability is just the chance of a thing, written as a fraction. Along a path you multiply. Across paths you add. Every rule of the section reads off the same four paths. That includes the expected value, the average per go, once each path pays out.","note":"","tries":["Drag the dot on the top branch all the way to the far end. The first thing is then certain, and the two bottom paths fall to zero.","Set the two second-stage chances to the same number. The second result now ignores the first, and the conditional chance stops moving.","Press the at least one button and watch the three green paths add up to one minus the red path.","Make both second-stage chances small. The chance of no yes at all climbs, and the chance of at least one falls with it.","Press the payout button and push the losing amount down. The expected value crosses zero, and the game turns from worth playing to not."],"ideas":[{"lead":"<b>Along a path you multiply.<\/b>","rest":"The chance of the first branch times the chance of the second branch gives the chance of that whole path.","f":"P(first and second) = P(first) × P(second, given the first)","eg":"2 red in a row from 3 red and 2 blue: 3/5 × 2/4 = 3/10","big":"Along a path, multiply the chances.","html":"<p>A <b>probability<\/b> is the chance of something, written as a fraction from 0 to 1.<\/p><p><b>Rule:<\/b> chance of first <b>and<\/b> second = chance of first × chance of second (once the first has happened).<\/p><div class=\"ex\"><b>Example:<\/b> a bag has 3 red and 2 blue balls. Take 2 without putting back. Chance both are red?<ol><li>First red: 3 out of 5 → 3/5<\/li><li>Now 2 red are left out of 4 balls → 2/4<\/li><li>Multiply: 3/5 × 2/4 = 6/20 = <b>3/10<\/b> ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ Without putting back, the second fraction changes. Here both the top and the bottom went down by 1.<\/p>"},{"lead":"<b>Across paths you add.<\/b>","rest":"Two different paths cannot both happen, so their chances add up.","f":"P(A or B) = P(A) + P(B) when they cannot both happen","eg":"roll a 1 or a 2: 1/6 + 1/6 = 1/3","big":"Across paths (one OR the other), add the chances.","html":"<p>When two things <b>cannot both happen<\/b>, the chance of one or the other is the two chances added.<\/p><p><b>Rule:<\/b> P(A or B) = P(A) + P(B). P means \"the chance of\".<\/p><div class=\"ex\"><b>Example:<\/b> roll one die. Chance of a 1 or a 2?<ol><li>Chance of 1: 1/6<\/li><li>Chance of 2: 1/6<\/li><li>Add: 1/6 + 1/6 = 2/6 = <b>1/3<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Easy memory: <b>and<\/b> → multiply, <b>or<\/b> → add.<\/p><p class=\"warn\">⚠️ Only add like this when the two things cannot happen together.<\/p>"},{"lead":"<b>The four paths always add up to 1.<\/b>","rest":"One of them has to happen, so the whole tree is worth exactly one.","f":"P(1) + P(2) + P(3) + P(4) = 1","eg":"0.3 + 0.2 + 0.4 + 0.1 = 1","big":"All the paths together always add up to 1.","html":"<p>Two steps, each with yes or no, make 4 paths. One of the paths must happen, so all their chances together make 1 whole (100%).<\/p><p><b>Rule:<\/b> path 1 + path 2 + path 3 + path 4 = 1<\/p><div class=\"ex\"><b>Example:<\/b> the four paths have chances 0.3, 0.2, 0.4 and 0.1.<ol><li>0.3 + 0.2 + 0.4 + 0.1 = <b>1<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Use it to find a missing chance. If three paths are 0.3, 0.2 and 0.4, the last one is 1 − 0.9 = 0.1.<\/p>"},{"lead":"<b>At least one is easier through its opposite.<\/b>","rest":"Work out the chance that it never happens, then take that away from 1.","f":"P(at least one) = 1 − P(none)","eg":"3 coins, at least one head: 1 − 1/8 = 7/8","big":"For \"at least one\", work out 1 − the chance of none.","html":"<p>\"At least one\" has many cases. Its opposite, \"none\", has just one case. So find \"none\" and take it away from 1.<\/p><p><b>Rule:<\/b> P(at least one) = 1 − P(none)<\/p><div class=\"ex\"><b>Example:<\/b> toss 3 coins. Chance of at least one head?<ol><li>No heads means tails, tails, tails: 1/2 × 1/2 × 1/2 = 1/8<\/li><li>1 − 1/8 = <b>7/8<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 When you see \"at least one\", think of the opposite first.<\/p>"},{"lead":"<b>A conditional chance is one branch of this tree.<\/b>","rest":"A conditional chance is the chance of something once you already know what happened before it.","f":"P(B given A) = P(A and B) / P(A)","eg":"P(A and B) = 0.12, P(A) = 0.4 → 0.12 ÷ 0.4 = 0.3","big":"Conditional chance = the chance of B once you know A happened.","html":"<p>A <b>conditional<\/b> chance means you already know what happened first. On the tree, it is one branch.<\/p><p><b>Rule:<\/b> P(B given A) = P(A and B) ÷ P(A). P means \"the chance of\".<\/p><div class=\"ex\"><b>Example:<\/b> P(A and B) = 0.12 and P(A) = 0.4<ol><li>P(B given A) = 0.12 ÷ 0.4<\/li><li>= 12 ÷ 40 = <b>0.3<\/b><\/li><\/ol>Check: 0.4 × 0.3 = 0.12 ✅<\/div><p class=\"why\"><b>Why it works:<\/b> it is the multiply rule turned around. P(A) × P(B given A) = P(A and B).<\/p>"},{"lead":"<b>When two things do not affect each other, the two second-stage branches match.<\/b>","rest":"The first result then tells you nothing about the second.","f":"P(B given A) = P(B) when they are independent","eg":"coin then die: P(6) = 1/6 after heads and after tails","big":"Independent means the first result does not change the second chance.","html":"<p>Two things are <b>independent<\/b> when one does not affect the other. Then the first result tells you nothing about the second.<\/p><p><b>Rule:<\/b> P(B given A) = P(B). P means \"the chance of\".<\/p><div class=\"ex\"><b>Example:<\/b> toss a coin, then roll a die. Chance of a 6?<ol><li>After heads: 1/6<\/li><li>After tails: 1/6<\/li><li>The same both times, so they are independent ✅<\/li><\/ol><\/div><p class=\"tip\">💡 For independent things, just multiply the plain chances: P(heads and 6) = 1/2 × 1/6 = 1/12.<\/p>"},{"lead":"<b>Expected value is each payout times its probability, all added up.<\/b>","rest":"Over a long run each path turns up as often as its chance says, so that chance is its weight. Expected value is the average you would get.","f":"expected value = sum of (probability × payout)","eg":"½ × $10 + ½ × $0 = $5","big":"Expected value = add up (chance × payout) for every result.","html":"<p><b>Expected value<\/b> is the average you would get per try, over many tries.<\/p><p><b>Rule:<\/b> expected value = sum of (chance × payout)<\/p><div class=\"ex\"><b>Example:<\/b> flip a coin. Heads pays $10, tails pays $0.<ol><li>Heads: ½ × $10 = $5<\/li><li>Tails: ½ × $0 = $0<\/li><li>Add: $5 + $0 = <b>$5<\/b> ✅<\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> over many tries, each result turns up as often as its chance says. So the chance works like a weight, just like in a weighted average.<\/p><p class=\"warn\">⚠️ The expected value may not be a payout you can really get. Here you get $10 or $0, never $5.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 700 470\"><text class=\"slabel \" x=\"155\" y=\"26\" text-anchor=\"middle\">first thing<\/text><text class=\"slabel \" x=\"350\" y=\"26\" text-anchor=\"middle\">second thing<\/text><text class=\"slabel \" x=\"560\" y=\"26\" text-anchor=\"middle\">the four paths<\/text><line x1=\"60\" y1=\"235\" x2=\"250\" y2=\"120\" style=\"stroke:var(--blue);stroke-width:4.52;fill:none;stroke-linecap:round\"><\/line><line x1=\"60\" y1=\"235\" x2=\"250\" y2=\"350\" style=\"stroke:var(--blue);stroke-width:3.48;fill:none;stroke-linecap:round\"><\/line><line x1=\"250\" y1=\"120\" x2=\"450\" y2=\"65\" style=\"stroke:var(--blue);stroke-width:5.04;fill:none;stroke-linecap:round\"><\/line><line x1=\"250\" y1=\"120\" x2=\"450\" y2=\"175\" style=\"stroke:var(--blue);stroke-width:2.96;fill:none;stroke-linecap:round\"><\/line><line x1=\"250\" y1=\"350\" x2=\"450\" y2=\"295\" style=\"stroke:var(--blue);stroke-width:3.48;fill:none;stroke-linecap:round\"><\/line><line x1=\"250\" y1=\"350\" x2=\"450\" y2=\"405\" style=\"stroke:var(--blue);stroke-width:4.52;fill:none;stroke-linecap:round\"><\/line><text class=\"slabel b numtxt\" x=\"141.5\" y=\"155\" text-anchor=\"middle\">yes 3/5<\/text><text class=\"slabel b numtxt\" x=\"141.5\" y=\"315\" text-anchor=\"middle\">no 2/5<\/text><text class=\"slabel b numtxt\" x=\"343\" y=\"67\" text-anchor=\"middle\">yes 7/10<\/text><text class=\"slabel b numtxt\" x=\"343\" y=\"173\" text-anchor=\"middle\">no 3/10<\/text><text class=\"slabel b numtxt\" x=\"343\" y=\"297\" text-anchor=\"middle\">yes 2/5<\/text><text class=\"slabel b numtxt\" x=\"343\" y=\"403\" text-anchor=\"middle\">no 3/5<\/text><circle cx=\"60\" cy=\"235\" r=\"7\" style=\"fill:var(--panel);stroke:var(--ink-2);stroke-width:2\"><\/circle><circle cx=\"250\" cy=\"120\" r=\"7\" style=\"fill:var(--panel);stroke:var(--blue);stroke-width:2\"><\/circle><circle cx=\"250\" cy=\"350\" r=\"7\" style=\"fill:var(--panel);stroke:var(--blue);stroke-width:2\"><\/circle><text class=\"slabel \" x=\"60\" y=\"262\" text-anchor=\"middle\">start<\/text><text class=\"slabel b\" x=\"236\" y=\"104\" text-anchor=\"end\">first: yes<\/text><text class=\"slabel b\" x=\"236\" y=\"372\" text-anchor=\"end\">first: no<\/text><circle cx=\"450\" cy=\"65\" r=\"5\" style=\"fill:var(--blue);stroke:none\"><\/circle><text class=\"slabel b\" x=\"468\" y=\"56\" text-anchor=\"start\">yes then yes<\/text><text class=\"slabel b numtxt\" x=\"468\" y=\"74\" text-anchor=\"start\">3/5 × 7/10 = 21/50<\/text><circle cx=\"450\" cy=\"175\" r=\"5\" style=\"fill:var(--blue);stroke:none\"><\/circle><text class=\"slabel b\" x=\"468\" y=\"166\" text-anchor=\"start\">yes then no<\/text><text class=\"slabel b numtxt\" x=\"468\" y=\"184\" text-anchor=\"start\">3/5 × 3/10 = 9/50<\/text><circle cx=\"450\" cy=\"295\" r=\"5\" style=\"fill:var(--blue);stroke:none\"><\/circle><text class=\"slabel b\" x=\"468\" y=\"286\" text-anchor=\"start\">no then yes<\/text><text class=\"slabel b numtxt\" x=\"468\" y=\"304\" text-anchor=\"start\">2/5 × 2/5 = 4/25<\/text><circle cx=\"450\" cy=\"405\" r=\"5\" style=\"fill:var(--blue);stroke:none\"><\/circle><text class=\"slabel b\" x=\"468\" y=\"396\" text-anchor=\"start\">no then no<\/text><text class=\"slabel b numtxt\" x=\"468\" y=\"414\" text-anchor=\"start\">2/5 × 3/5 = 6/25<\/text><circle class=\"handle\" cx=\"174\" cy=\"166\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"390\" cy=\"81.5\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"330\" cy=\"328\" r=\"8\"><\/circle><text class=\"slabel b numtxt\" x=\"350\" y=\"456\" text-anchor=\"middle\">21/50 + 9/50 + 4/25 + 6/25 = 1<\/text><\/svg>","sec":"da","fm":["Probability","Independent events together","Mutually exclusive events","The union of two events","Conditional probability","At least one","The complement","Expected value"]},"tk_pct":{"title":"A percent and its base","tag":"Applied Arithmetic","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Percent of a number.<\/b>","rest":"A percent is a fraction with 100 underneath, so &ldquo;p per cent of N&rdquo; is nothing but a multiplication &mdash; and the word <em>of<\/em> is where the multiplication sign goes.","f":"part = <sup>p<\/sup>&frasl;<sub>100<\/sub> &middot; N","eg":"25 per cent of 240 is 0.25 &times; 240 = 60.","trap":"Past 100 the answer grows past the number itself, and below 100 it shrinks &mdash; readers who expect a percent to always shrink misread 140 per cent of 240 as smaller than 240.","fmn":"Percent of a number","big":"\"Percent of a number\" means multiply. The word \"of\" means ×.","html":"<p>Percent means \"out of 100\". So 25% is 25/100 = 0.25.<\/p><p><b>Rule:<\/b> part = (p ÷ 100) × the number. Here p is the percent.<\/p><div class=\"ex\"><b>Example:<\/b> what is 25% of 240?<ol><li>Change 25% to a decimal: 25 ÷ 100 = 0.25<\/li><li>\"Of\" means times: 0.25 × 240 = <b>60<\/b> ✅ (check: 25% is one quarter, and 240 ÷ 4 = 60)<\/li><\/ol><\/div><ul><li>Under 100% → the answer is <b>smaller<\/b> than the number.<\/li><li>Over 100% → the answer is <b>bigger<\/b>. 140% of 240 = 1.4 × 240 = 336.<\/li><\/ul><p class=\"warn\">⚠️ A percent does not always make things smaller. Anything over 100% makes the number grow.<\/p>"},{"lead":"<b>Fraction, decimal, per cent.<\/b>","rest":"The three notations are one number wearing three coats; a percent is only the decimal shifted two places, so convert once and carry the cleanest of the three through the arithmetic.","f":"<sup>a<\/sup>&frasl;<sub>b<\/sub> = a &divide; b = (a &divide; b) &times; 100 per cent","eg":"3/8 is 3 &divide; 8 = 0.375, and 0.375 &times; 100 = 37.5 per cent.","trap":"Shifting the point the wrong way. 0.375 is 37.5 per cent, not 3.75 per cent, and 4 per cent is 0.04, not 0.4 &mdash; a tenfold error that survives every later step untouched.","fmn":"Fraction, decimal, per cent","big":"Fraction, decimal and percent are the same number written 3 ways.","html":"<ul><li><b>Fraction → decimal:<\/b> divide the top by the bottom.<\/li><li><b>Decimal → percent:<\/b> multiply by 100 (move the point 2 places right).<\/li><li><b>Percent → decimal:<\/b> divide by 100 (move the point 2 places left).<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> write 3/8 as a percent.<ol><li>3 ÷ 8 = 0.375<\/li><li>0.375 × 100 = <b>37.5%<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Change the form once. Then use whichever form makes the math easiest.<\/p><p class=\"warn\">⚠️ Moving the point the wrong way makes you 10 times off. 0.375 is 37.5%, not 3.75%. And 4% is 0.04, not 0.4.<\/p>"},{"lead":"<b>What per cent one number is of another.<\/b>","rest":"The quantity that follows the word <em>of<\/em> is the base and it goes underneath; everything in percent work turns on getting that one choice right.","f":"p = 100 &middot; <sup>A<\/sup>&frasl;<sub>B<\/sub>","eg":"40 is 100 &times; 40 &divide; 50 = 80 per cent of 50, but 50 is 125 per cent of 40.","trap":"Swapping A and B. &ldquo;A is what per cent of B&rdquo; and &ldquo;B is what per cent of A&rdquo; give different answers, and only one of them is 100 &times; A &divide; B.","fmn":"What per cent one number is of another","big":"\"A is what percent of B?\" The number after \"of\" goes on the bottom.","html":"<p>The number after the word \"of\" is the <b>base<\/b> (the number you compare to). It always goes underneath.<\/p><p><b>Rule:<\/b> percent = 100 × A ÷ B<\/p><div class=\"ex\"><b>Example:<\/b> 40 is what percent of 50?<ol><li>The number after \"of\" is 50, so it goes on the bottom: 40 ÷ 50 = 0.8<\/li><li>0.8 × 100 = <b>80%<\/b> ✅ (check: 80% of 50 = 40)<\/li><\/ol>Now flip the question: 50 is what percent of 40? 50 ÷ 40 = 1.25 → <b>125%<\/b>.<\/div><p class=\"warn\">⚠️ Swapping the two numbers gives a different answer. Always ask: which number comes after \"of\"?<\/p>"},{"lead":"<b>Percent greater than versus percent of.<\/b>","rest":"Two sentences that sound alike and differ by exactly 100 &mdash; <em>of<\/em> counts the whole of A, <em>greater than<\/em> counts only the excess.","f":"A is 100 &middot; <sup>A<\/sup>&frasl;<sub>B<\/sub> per cent <em>of<\/em> B, and 100 &middot; <sup>(A &minus; B)<\/sup>&frasl;<sub>B<\/sub> per cent <em>greater than<\/em> B","eg":"150 is 150 per cent of 100 and 50 per cent greater than 100. The same number, two sentences, two answers.","trap":"Reading &ldquo;200 per cent greater&rdquo; as &ldquo;twice as large&rdquo;. Twice as large is 200 per cent <em>of<\/em>, which is only 100 per cent <em>greater<\/em>; 200 per cent greater is three times as large.","fmn":"Percent greater than versus percent of","big":"\"Percent of\" and \"percent greater than\" are always 100 apart.","html":"<ul><li><b>\"A is what percent of B\"<\/b> compares all of A to B: 100 × A ÷ B.<\/li><li><b>\"A is what percent greater than B\"<\/b> compares only the extra part: 100 × (A − B) ÷ B.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> compare 150 and 100.<ol><li>150 ÷ 100 × 100 = 150, so 150 is <b>150% of<\/b> 100.<\/li><li>The extra part is 150 − 100 = 50. So 150 is 50 ÷ 100 × 100 = <b>50% greater than<\/b> 100.<\/li><li>150 − 50 = 100 ✅ The two answers are 100 apart.<\/li><\/ol><\/div><p class=\"warn\">⚠️ \"Twice as big\" is 200% <b>of<\/b>, which is only 100% <b>greater<\/b>. \"200% greater\" means 3 times as big.<\/p>"},{"lead":"<b>Percentages inside percentages.<\/b>","rest":"A percent of a percent is a share of a share, so the two fractions multiply &mdash; and the answer is always smaller than either of them.","f":"share of the whole = <sup>p<\/sup>&frasl;<sub>100<\/sub> &middot; <sup>q<\/sup>&frasl;<sub>100<\/sub> &middot; N","eg":"40 per cent of a 500-person group are women, and 30 per cent of those women drive: 500 &times; 0.40 &times; 0.30 = 60 people, or 12 per cent of the group.","trap":"Adding the two percentages, or reading the second one against the whole. The 30 per cent is 30 per cent of the 40 per cent slice only, so it contributes 12 per cent of the whole, not 30.","fmn":"Percentages inside percentages","big":"A percent of a percent? Multiply the two percents.","html":"<p>The second percent is a piece of the first piece, not of the whole group.<\/p><p><b>Rule:<\/b> part = (p ÷ 100) × (q ÷ 100) × the whole. Here p and q are the two percents.<\/p><div class=\"ex\"><b>Example:<\/b> a group has 500 people. 40% are women. 30% of those women drive. How many women drive?<ol><li>Women: 0.40 × 500 = 200<\/li><li>Women who drive: 0.30 × 200 = <b>60 people<\/b><\/li><li>As a share of the group: 60 ÷ 500 = 0.12 = <b>12%<\/b> ✅ (check: 0.40 × 0.30 = 0.12)<\/li><\/ol><\/div><p class=\"warn\">⚠️ Do not add 40% and 30%. And the 30% is not 30% of the whole group. It is 30% of the women only.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 340 200\"><rect class=\"shape\" x=\"20\" y=\"60\" width=\"90.4\" height=\"40\"/><rect x=\"20\" y=\"60\" width=\"22.6\" height=\"40\" style=\"fill:var(--blue);stroke:var(--blue)\"/><path class=\"gline\" d=\"M 110.4 46 L 110.4 114\"/><path class=\"aux\" d=\"M 42.6 50 L 42.6 110\"/><text class=\"slabel b\" x=\"65.2\" y=\"40\" text-anchor=\"middle\">N = 240<\/text><text class=\"slabel r\" x=\"40\" y=\"126\" text-anchor=\"middle\">part = 60<\/text><text class=\"slabel\" x=\"170\" y=\"172\" text-anchor=\"middle\">25 per cent of 240<\/text><text class=\"slabel\" x=\"170\" y=\"188\" text-anchor=\"middle\">the fill is a share of the whole<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Percent of a number&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"arith","fm":[]},"tk_pctchg":{"title":"Percent change, forwards and backwards","tag":"Applied Arithmetic","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Percent change.<\/b>","rest":"The change is always measured against where you started, never against where you ended &mdash; the old value is the base and it is the only thing allowed underneath.","f":"per cent change = 100 &middot; <sup>(new &minus; old)<\/sup>&frasl;<sub>old<\/sub>","eg":"From 80 to 100 is 100 &times; 20 &divide; 80 = a 25 per cent rise; from 100 back to 80 is a 20 per cent fall.","trap":"Dividing by the new value. The same 20-unit gap is 25 per cent of 80 and 20 per cent of 100, so a rise and the fall that undoes it are never the same percent.","fmn":"Percent change","big":"Percent change: always divide by the starting number.","html":"<p><b>Rule:<\/b> percent change = 100 × (new − old) ÷ old<\/p><div class=\"ex\"><b>Example:<\/b> a price goes from 80 to 100.<ol><li>The change is 100 − 80 = 20.<\/li><li>Divide by the starting number, 80: 20 ÷ 80 = 0.25<\/li><li>So it is a <b>25% rise<\/b>.<\/li><\/ol>Now go back from 100 to 80. The change is still 20, but now you start at 100: 20 ÷ 100 = a <b>20% fall<\/b>.<\/div><p class=\"warn\">⚠️ Never divide by the new number. A rise and the fall that undoes it are never the same percent.<\/p>"},{"lead":"<b>Running a percent change backwards.<\/b>","rest":"Every percent change is a multiplication, so undoing one is a division by the very same factor &mdash; adding the percentage back on returns a different number.","f":"original = <sup>final<\/sup>&frasl;<sub>(1 + p/100)<\/sub>","eg":"A price 20 per cent off sits at $80, so it was 80 &divide; 0.8 = $100. Adding 20 per cent to 80 gives $96, which is wrong by four dollars.","trap":"Undoing a p per cent fall by adding p per cent back. The two percentages are taken on different bases, so &times;0.8 then &times;1.2 lands at 0.96 of the original, not at 1.","fmn":"Running a percent change backwards","big":"To undo a percent change, divide. Do not add the percent back.","html":"<p>A percent change is a multiplication. So to go back, divide by the same number.<\/p><ul><li>20% off means × 0.8 (100% − 20% = 80% is left).<\/li><li>20% up means × 1.2.<\/li><\/ul><p><b>Rule:<\/b> first price = new price ÷ the multiplier.<\/p><div class=\"ex\"><b>Example:<\/b> after 20% off, a shirt costs $80. What was the first price?<ol><li>Sale price = first price × 0.8<\/li><li>So first price = 80 ÷ 0.8 = <b>$100<\/b> ✅ (check: 20% of 100 is 20, and 100 − 20 = 80)<\/li><\/ol><\/div><p class=\"warn\">⚠️ Adding 20% to $80 gives 80 × 1.2 = $96. That is wrong. The 20% was taken from $100, not from $80.<\/p>"},{"lead":"<b>Successive percent changes.<\/b>","rest":"Percent changes stack by multiplying their factors, because the second change is taken on the result of the first, not on the original.","f":"net factor = (1 + <sup>a<\/sup>&frasl;<sub>100<\/sub>)(1 + <sup>b<\/sup>&frasl;<sub>100<\/sub>)","eg":"Up 20 then down 20 is 1.2 &times; 0.8 = 0.96, a 4 per cent net fall &mdash; not the zero that adding the percents suggests.","trap":"Adding the two percentages. They agree only when one of them is zero; the gap is the cross term ab/100, which is why up 20 and down 20 loses 4 per cent every time.","fmn":"Successive percent changes","big":"Two percent changes in a row? Multiply them. Do not add them.","html":"<p>The second change works on the new number, not on the number you started with.<\/p><p><b>Rule:<\/b> total multiplier = (1 + a/100) × (1 + b/100). Here a and b are the two percents. Use a minus for a fall.<\/p><div class=\"ex\"><b>Example:<\/b> a price goes up 20%, then down 20%.<ol><li>Up 20% → × 1.2. Down 20% → × 0.8.<\/li><li>1.2 × 0.8 = 0.96<\/li><li>0.96 means 96% is left, so it is a <b>4% fall<\/b> overall.<\/li><\/ol>Check with $100: up 20% → $120. Then 20% of 120 is 24, so 120 − 24 = $96 ✅<\/div><p class=\"warn\">⚠️ Adding +20 and −20 gives 0. That is wrong. Up 20% then down 20% always loses 4%.<\/p>"},{"lead":"<b>Percentage points versus per cent.<\/b>","rest":"When the quantity that moves is itself a percentage, there are two honest answers, and the smaller one is almost always the one meant by &ldquo;points&rdquo;.","f":"point change = r&#8322; &minus; r&#8321; &nbsp;&middot;&nbsp; relative change = 100 &middot; <sup>(r&#8322; &minus; r&#8321;)<\/sup>&frasl;<sub>r&#8321;<\/sub>","eg":"An unemployment rate going from 4 per cent to 5 per cent rose by 1 point, which is a 25 per cent rise.","trap":"Calling a one-point move a one per cent move. From a small base the relative figure is enormous &mdash; 4 to 5 is 25 per cent &mdash; and headline writers pick whichever of the two sounds larger.","fmn":"Percentage points versus per cent","big":"\"Percentage points\" and \"percent\" are not the same thing.","html":"<p>This matters when the number that changes is already a percent, like a tax rate.<\/p><ul><li><b>Point change:<\/b> just subtract. New rate − old rate.<\/li><li><b>Percent change:<\/b> 100 × (new − old) ÷ old.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> a jobless rate goes from 4% to 5%.<ol><li>Points: 5 − 4 = <b>1 percentage point<\/b><\/li><li>Percent: 100 × 1 ÷ 4 = a <b>25% rise<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ A 1-point rise is not a 1% rise. When the starting rate is small, the percent change can be very big.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 340 200\"><path class=\"gline\" d=\"M 24 140 L 316 140\"/><rect class=\"shape\" x=\"66\" y=\"56.8\" width=\"54\" height=\"83.2\"/><rect class=\"shape\" x=\"186\" y=\"36\" width=\"54\" height=\"104\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><path class=\"aux\" d=\"M 66 56.8 L 240 56.8\"/><path class=\"aux\" d=\"M 213 36 L 213 56.8\"/><text class=\"slabel r\" x=\"221\" y=\"50.4\">+20<\/text><text class=\"slabel b\" x=\"93\" y=\"156\" text-anchor=\"middle\">old 80<\/text><text class=\"slabel a\" x=\"213\" y=\"156\" text-anchor=\"middle\">new 100<\/text><text class=\"slabel\" x=\"170\" y=\"176\" text-anchor=\"middle\">the gap 20 measured against the old 80<\/text><text class=\"slabel b\" x=\"170\" y=\"192\" text-anchor=\"middle\">25 per cent<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Percent change&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"arith","fm":[]},"tk_money":{"title":"Cost, price and profit","tag":"Applied Arithmetic","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Markup on cost.<\/b>","rest":"A markup is a percentage of what the seller paid, so the cost is the base and the price is the larger number built on top of it.","f":"price = cost &middot; (1 + <sup>m<\/sup>&frasl;<sub>100<\/sub>)","eg":"Cost $60 marked up 40 per cent sells for 60 &times; 1.4 = $84, and the $24 profit is only 28.6 per cent of that price.","trap":"Treating a 40 per cent markup as a 40 per cent margin. Markup is measured on cost, margin on price, so the same dollars give two different percentages and markup is always the bigger one.","fmn":"Markup on cost","big":"Markup is a percent of what the seller paid (the cost).","html":"<ul><li><b>Cost<\/b> is what the seller paid.<\/li><li><b>Markup<\/b> is the extra added on top of the cost.<\/li><li><b>Price<\/b> = cost + markup.<\/li><\/ul><p><b>Rule:<\/b> price = cost × (1 + m/100). Here m is the markup percent.<\/p><div class=\"ex\"><b>Example:<\/b> cost $60, markup 40%.<ol><li>Price: 60 × 1.4 = <b>$84<\/b><\/li><li>Profit: 84 − 60 = <b>$24<\/b> ✅ (check: 40% of 60 = 24)<\/li><\/ol><\/div><p class=\"warn\">⚠️ The same $24 is only 24 ÷ 84 ≈ 28.6% of the price. Markup puts the cost on the bottom. Margin puts the price on the bottom. So markup is always the bigger percent.<\/p>"},{"lead":"<b>Discount and sale price.<\/b>","rest":"A discount is a percentage of the list price, so what you pay is the list price times what is left over after the discount is taken out.","f":"sale = list &middot; (1 &minus; <sup>d<\/sup>&frasl;<sub>100<\/sub>)","eg":"A $120 coat at 25 per cent off costs 120 &times; 0.75 = $90.","trap":"Stopping at the discount instead of the price. &ldquo;25 per cent off $120&rdquo; is $30 of saving and $90 of payment, and the question usually wants the second number.","fmn":"Discount and sale price","big":"Sale price = list price × what is left after the discount.","html":"<ul><li>The <b>list price<\/b> is the normal price.<\/li><li>A <b>discount<\/b> is a percent taken off the list price.<\/li><\/ul><p><b>Rule:<\/b> sale price = list price × (1 − d/100). Here d is the discount percent.<\/p><div class=\"ex\"><b>Example:<\/b> a $120 coat is 25% off.<ol><li>What is left: 100% − 25% = 75% = 0.75<\/li><li>120 × 0.75 = <b>$90<\/b> ✅ (check: 25% of 120 = 30, and 120 − 30 = 90)<\/li><\/ol><\/div><p class=\"warn\">⚠️ $30 is the saving. $90 is what you pay. Read which one the question wants. Usually it wants the price you pay.<\/p>"},{"lead":"<b>Profit and margin.<\/b>","rest":"Profit is a number of dollars; margin is that profit as a share of the price, and the two answer different questions.","f":"profit = price &minus; cost &nbsp;&middot;&nbsp; margin = 100 &middot; <sup>profit<\/sup>&frasl;<sub>price<\/sub>","eg":"Cost $80, price $100: profit $20, margin 100 &times; 20 &divide; 100 = 20 per cent. As a markup on cost the same $20 is 25 per cent.","trap":"Dividing the profit by the cost and calling it margin. Margin takes the price underneath; put the cost there and you have computed the markup instead, and the two never agree except at zero.","fmn":"Profit and margin","big":"Profit is dollars. Margin is profit as a percent of the price.","html":"<ul><li><b>Profit<\/b> = price − cost (in dollars).<\/li><li><b>Margin<\/b> = 100 × profit ÷ <b>price<\/b>.<\/li><li><b>Markup<\/b> = 100 × profit ÷ <b>cost<\/b>.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> cost $80, price $100.<ol><li>Profit = 100 − 80 = <b>$20<\/b><\/li><li>Margin = 100 × 20 ÷ 100 = <b>20%<\/b><\/li><li>Markup = 100 × 20 ÷ 80 = <b>25%<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ If you divide the profit by the cost, you get the markup, not the margin. Margin always has the price on the bottom.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 340 200\"><rect class
