<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Concept Boards in 19 Pages</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Source+Sans+3:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* The companion to GregMat in 10 Pages: the same printed-book page on a desk, here holding every Concept Board,
   one line per idea with its formula in ink-blue, the board's own picture at the head of each section. */
:root{
  --desk:#E9E7E1; --page:#FCFBF8; --panel:#FCFBF8; --panel-2:#F3F1EB;
  --ink:#1D2024; --ink-2:#464A50; --ink-3:#74787E;
  --line:#E3E0D8; --line-2:#CCC8BE;
  --blue:#23507D; --blue-2:#1A3F63; --blue-wash:rgba(35,80,125,.08);
  --red:#A63A2A; --red-wash:rgba(166,58,42,.09);
  --green:#2E7A57; --green-wash:rgba(46,122,87,.11);
  --amber:#946010;--amber-wash:rgba(156,101,16,.12);
  --shadow:0 1px 2px rgba(29,32,36,.06),0 18px 40px -28px rgba(29,32,36,.45);
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --fs:17px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#111315; --page:#1A1D20; --panel:#1A1D20; --panel-2:#22262A;
  --ink:#E8E6E1; --ink-2:#BAB7B0; --ink-3:#8D8A85;
  --line:#2C3035; --line-2:#3C4147;
  --blue:#8FB8E0; --blue-2:#B5D0EB; --blue-wash:rgba(143,184,224,.12);
  --red:#E58A77; --red-wash:rgba(229,138,119,.13);
  --green:#6FC59A; --green-wash:rgba(111,197,154,.13);
  --amber:#D8A84E;--amber-wash:rgba(214,166,75,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -26px rgba(0,0,0,.9);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#111315; --page:#1A1D20; --panel:#1A1D20; --panel-2:#22262A;
  --ink:#E8E6E1; --ink-2:#BAB7B0; --ink-3:#8D8A85;
  --line:#2C3035; --line-2:#3C4147;
  --blue:#8FB8E0; --blue-2:#B5D0EB; --blue-wash:rgba(143,184,224,.12);
  --red:#E58A77; --red-wash:rgba(229,138,119,.13);
  --green:#6FC59A; --green-wash:rgba(111,197,154,.13);
  --amber:#D8A84E;--amber-wash:rgba(214,166,75,.14);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 18px 40px -26px rgba(0,0,0,.9);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--desk);color:var(--ink)}
body{margin:0;font-family:var(--serif);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---- the bar above the page ---- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--desk) 92%,transparent);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding-block:8px;padding-inline:16px}
@media (max-width:640px){.bar{position:static}}
.bar-in{max-width:52rem;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.btn{font-family:var(--sans);font-size:14px;font-weight:600;line-height:1;padding:8px 12px;border-radius:7px;border:1px solid var(--line-2);
  background:var(--page);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--page)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--page)}
.btn.pri:hover{color:var(--page);filter:brightness(1.08)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.seg .btn{border:0;border-radius:0}
.seg .btn+.btn{border-left:1px solid var(--line-2)}
.pager{display:flex;gap:3px;overflow-x:auto;max-width:100%;scrollbar-width:none;flex:1 1 auto;min-width:0}
.pager::-webkit-scrollbar{display:none}
.pg{font-family:var(--sans);font-size:13.5px;font-weight:700;min-width:30px;height:30px;padding:0 6px;border-radius:50%;border:1px solid transparent;
  background:transparent;color:var(--ink-2);cursor:pointer;font-variant-numeric:tabular-nums}
.pg:hover{border-color:var(--line-2)}
.pg[aria-current="page"]{background:var(--blue);color:var(--page)}
.pg.done{box-shadow:inset 0 -3px 0 var(--green)}
.tools{display:flex;gap:8px;align-items:center;margin-left:auto}

/* ---- the page ---- */
.wrap{padding-inline:clamp(0px,3vw,32px);padding-block:clamp(0px,3vw,28px) 40px}
.sheet{max-width:50rem;margin:0 auto;background:var(--page);border:1px solid var(--line);box-shadow:var(--shadow);
  padding-block:clamp(22px,5vw,52px) clamp(22px,4vw,40px);padding-inline:clamp(18px,6vw,64px);font-size:var(--fs);line-height:1.55;min-height:70vh}
@media (max-width:560px){.sheet{border-left:0;border-right:0}}
.turn{animation:turn .22s ease-out}
@keyframes turn{from{opacity:0;transform:translateX(var(--dx,10px))}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.turn{animation:none}}
.rhead{display:flex;justify-content:space-between;gap:12px;font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line);padding-bottom:8px;margin:0 0 26px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(1.55rem,4.2vw,2.15rem);line-height:1.15;letter-spacing:-.01em;margin:0 0 8px;text-wrap:balance}
.deck{font-style:italic;color:var(--ink-2);margin:0 0 6px;max-width:38em}
.meta{font-family:var(--sans);font-size:13.5px;color:var(--ink-3);margin:0 0 4px;font-variant-numeric:tabular-nums}

/* ---- one board = one section ---- */
.board{margin-top:34px}
.bhd{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;border-bottom:1.5px solid var(--blue);padding-bottom:6px}
.bhd h2{font-family:var(--serif);font-size:1.25rem;font-weight:700;line-height:1.25;margin:0;flex:1 1 16rem;min-width:0;text-wrap:balance}
.tag{font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
.live{display:none;font-family:var(--sans);font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--blue);
  background:var(--page);color:var(--blue);cursor:pointer;white-space:nowrap}
.live:hover{background:var(--blue-wash)}
.inkmf .live{display:inline-block}
.fig{margin:14px auto 4px;max-width:30rem;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);padding:8px}
.fig svg{display:block;width:100%;height:auto}
.fig .slabel{font-family:var(--mono);font-size:11px;fill:var(--ink-2)}
.fig .slabel.b{fill:var(--blue)} .fig .slabel.r{fill:var(--red)} .fig .slabel.g{fill:var(--green)} .fig .slabel.a{fill:var(--amber)}
.fig .arcline{fill:none;stroke:var(--amber);stroke-width:1.6}
.fig .handle{fill:var(--panel);stroke:var(--blue);stroke-width:2.5}
.fig .shape{fill:var(--blue-wash);stroke:var(--blue);stroke-width:2;stroke-linejoin:round} .fig .gline{stroke:var(--line-2);stroke-width:1;fill:none}
.fig .aux{stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.fig figcaption{font-family:var(--sans);font-size:12.5px;color:var(--ink-3);text-align:center;margin-top:6px}
.inkmf .fig figcaption .off{display:none}
.fig figcaption .on{display:none}
.inkmf .fig figcaption .on{display:inline}
.carry{margin:14px 0 4px;padding:10px 14px;border-left:3px solid var(--amber);background:var(--panel-2);border-radius:0 6px 6px 0;font-size:.94em;color:var(--ink-2)}
.carry b.lb{display:block;font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin-bottom:2px}

/* ---- one idea = one line ---- */
.it{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,auto);column-gap:14px;align-items:start;padding:9px 0;border-bottom:1px dotted var(--line-2)}
.kn{width:22px;height:22px;margin-top:2px;border-radius:50%;border:1.5px solid var(--line-2);background:transparent;cursor:pointer;padding:0;
  display:grid;place-items:center;color:transparent;font-family:var(--sans);font-size:13px;font-weight:700;line-height:1}
.kn:hover{border-color:var(--green);color:var(--green)}
.it.known .kn{background:var(--green);border-color:var(--green);color:var(--page)}
.tt{all:unset;cursor:pointer;line-height:1.45;color:var(--ink);overflow-wrap:break-word;min-width:0}
.tt b{font-weight:600}
.tt:hover b,.tt[aria-expanded="true"] b{color:var(--blue)}
.tt:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:2px}
.it.known .tt{color:var(--ink-2)}
.fx{font-family:var(--serif);font-style:italic;color:var(--blue-2);text-align:right;max-width:20rem;overflow-wrap:break-word;line-height:1.45}
.eg{grid-column:2/-1;margin-top:4px;font-family:var(--sans);font-size:.86em;color:var(--ink-2);background:var(--panel-2);border-radius:4px;padding:3px 8px;justify-self:start}
.eg b{color:var(--green);font-weight:700;margin-right:3px}
.cover .it:not(.shown) .fx,.cover .it:not(.shown) .eg,.cover .it:not(.shown) .more{filter:blur(6px);opacity:.55;cursor:pointer;user-select:none;-webkit-user-select:none}
.hideknown .it.known:not(.open){display:none}
/* ---- the easy version: the big idea in one bold line, then plain words, an example and a tip ---- */
.ezb{grid-column:2/-1;min-width:0}
.ez .tt{display:block;font-size:1.06em}
.ez .tt b{font-weight:700}
.ezx{margin-top:6px;color:var(--ink);line-height:1.6}
.ezx p{margin:6px 0}
.ezx ul,.ezx ol{margin:4px 0 6px;padding-left:22px}
.ezx li{margin:3px 0}
.ezx .ex{margin:8px 0;padding:8px 12px;background:var(--panel-2);border-left:3px solid var(--green);border-radius:0 6px 6px 0}
.ezx .ex>b:first-child{color:var(--green)}
.ezx .ex ol{margin-bottom:2px}
.ezx .why{color:var(--ink-2)}
.ezx .tip{padding:6px 10px;background:var(--blue-wash);border-radius:6px}
.ezx .warn{padding:6px 10px;background:rgba(201,64,48,.10);border-radius:6px}
.ezx table{border-collapse:collapse;margin:6px 0;font-size:.95em}
.ezx th,.ezx td{border:1px solid var(--line-2);padding:3px 9px;text-align:center}
.ezx th{background:var(--panel-2);font-family:var(--sans);font-size:.88em}
.cover .it.ez:not(.shown) .ezx{filter:blur(6px);opacity:.55;cursor:pointer;user-select:none;-webkit-user-select:none}
.it.known .ezx{color:var(--ink-2)}
.more{grid-column:2/-1;margin:8px 0 4px;color:var(--ink-2);font-size:.95em;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:0 6px 6px 0;background:var(--panel-2);padding:10px 14px}
.xp{grid-column:2/-1;justify-self:start;margin-top:6px;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--blue);background:transparent;border:1px solid var(--line-2);border-radius:999px;padding:3px 11px;cursor:pointer}
.xp:hover{border-color:var(--blue);background:var(--blue-wash)} .xp[aria-expanded="true"] span{display:inline-block;transform:rotate(180deg)}
.pp{margin:0 0 10px} .pp:last-child{margin-bottom:0} .pp .lb,.fmrow .lb{display:block;font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:3px}
.pp.warn .lb{color:var(--red)} .steps{margin:2px 0 0;padding-left:22px} .steps li{margin:2px 0}
.chip{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--blue);background:var(--page);border:1px solid var(--blue);border-radius:999px;padding:4px 11px;margin:3px 6px 3px 0;cursor:pointer;text-align:left}
.chip:hover{background:var(--blue-wash)}
.fmrow{margin:12px 0 4px;font-size:.92em} .fmrow .offk{color:var(--ink-3);font-size:12.5px}
.onk{display:none} .inkmf .onk{display:inline} .inkmf .offk{display:none} .go .offk{color:var(--ink-2)}
.fmrow .chip{display:none} .inkmf .fmrow .chip{display:inline-block}
@media (max-width:640px){
  .it{grid-template-columns:26px minmax(0,1fr);row-gap:4px}
  .fx{grid-column:2;text-align:left;max-width:none}
}
details.try{margin:12px 0 0;font-size:.95em}
details.try summary{cursor:pointer;font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--ink-2)}
details.try ul{margin:8px 0 0;padding-left:20px;color:var(--ink-2)}
details.try li{margin:4px 0}

/* ---- end of page ---- */
.endmatter{margin-top:30px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2)}
.endmatter p{margin:0;font-family:var(--sans);font-size:14.5px;color:var(--ink-2)}
.endmatter .acts{display:flex;gap:8px;flex-wrap:wrap}
.foot{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:28px;padding-top:14px;border-top:1px solid var(--line)}
.nav{all:unset;cursor:pointer;font-family:var(--sans);font-size:14px;color:var(--ink-2);line-height:1.3;min-width:0}
.nav b{display:block;color:var(--blue);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.nav:hover{color:var(--ink)}
.nav.next{text-align:right}
.nav:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:3px}
.folio{font-family:var(--serif);font-style:italic;color:var(--ink-3);font-variant-numeric:oldstyle-nums}

/* ---- contents ---- */
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:10px 22px;margin:22px 0 6px;padding:0;list-style:none;
  font-family:var(--sans);font-size:15px;color:var(--ink-2)}
.howto li{min-width:0}
.howto b{color:var(--ink)}
.toc{list-style:none;margin:26px 0 0;padding:0}
.toc li{border-bottom:1px dotted var(--line-2)}
.toc button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:4px 12px;width:100%;padding:12px 0;align-items:baseline}
.toc button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.toc .no{font-family:var(--serif);font-weight:700;font-size:1.35rem;color:var(--blue);font-variant-numeric:lining-nums tabular-nums}
.toc .k{display:block;font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.toc .t{font-weight:600;line-height:1.3}
.toc .bs{display:block;font-size:.88em;color:var(--ink-3);margin-top:2px}
.toc button:hover .t{color:var(--blue)}
.toc .c{font-family:var(--sans);font-size:13.5px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.toc .c i{font-style:normal;color:var(--green);font-weight:700}
.prog{height:4px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden;grid-column:2/-1}
.prog i{display:block;height:100%;background:var(--green);border-radius:2px}
.cont{margin:22px 0 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.small{font-family:var(--sans);font-size:13.5px;color:var(--ink-3)}

/* ---- the formula check ---- */
.qz{position:fixed;inset:0;z-index:20;background:rgba(17,19,21,.45);display:grid;place-items:center;padding:16px}
.qz[hidden]{display:none}
.qzp{width:min(36rem,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--page);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:20px 22px}
.qzh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink-3);margin:0 0 10px}
.qz .tag{display:block;margin:0 0 6px}
.qz .q{font-size:16px;line-height:1.55;margin:0 0 4px}
.qz .ask{font-family:var(--sans);font-size:13.5px;color:var(--ink-3);margin:0 0 10px}
.ch{display:flex;flex-direction:column;gap:6px;margin:0 0 8px}
.ch button{display:flex;gap:10px;align-items:flex-start;text-align:left;font-size:15px;padding:8px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--page);color:var(--ink);cursor:pointer}
.ch button .lt{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--ink-3);padding-top:2px}
.ch button .ft{font-style:italic}
.ch button:hover{border-color:var(--blue)}
.ch button.right{border-color:var(--green);background:var(--green-wash)}
.ch button.wrong{border-color:var(--red);background:var(--red-wash)}
.ch button[disabled]{cursor:default}
.qz .why{font-size:15px;line-height:1.55;margin:4px 0 12px;padding:10px 12px;border-radius:6px;background:var(--panel-2)}
.qz .why b{color:var(--green)}
.qz .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.score{font-family:var(--serif);font-size:2.2rem;font-weight:700;margin:4px 0}
.missed{margin:8px 0 14px;padding-left:20px}
.missed li{margin:3px 0}
</style>
</head>
<body>
<div class="bar" role="navigation" aria-label="Book">
  <div class="bar-in">
    <button type="button" class="btn" id="tocBtn">Contents</button>
    <div class="pager" id="pager" aria-label="Pages"></div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Reading mode">
        <button type="button" class="btn" id="modeRead">Read</button>
        <button type="button" class="btn" id="modeCover" title="Hide every formula so you can say it first, then tap to check">Cover</button>
      </div>
      <button type="button" class="btn" id="hideBtn" aria-pressed="false" title="Hide the ideas you have ticked">Hide ✓</button>
      <button type="button" class="btn" id="sizeBtn" title="Text size" aria-label="Text size">Aa</button>
    </div>
  </div>
</div>
<div class="wrap"><main class="sheet" id="sheet" aria-live="polite"></main></div>

uations and systems, squares and factoring, then the roots of a quadratic."},{"n":8,"kicker":"Algebra · II","title":"Powers, Roots and Inequalities","boards":["tk_pow","tk_abs"],"deck":"Every exponent rule and radical rule, then absolute value and the sign flip in an inequality."},{"n":9,"kicker":"Algebra · III","title":"Sequences and Functions","boards":["tk_seq","tk_fn"],"deck":"Arithmetic and geometric sequences and their sums, then functions and variation."},{"n":10,"kicker":"Geometry · I","title":"Lines and Triangles","boards":["cb_lines","cb_tri"],"deck":"Angles where lines cross, then the triangle: its angle sum, its area, and the window for its third side."},{"n":11,"kicker":"Geometry · II","title":"Right Angles and Similar Figures","boards":["cb_right","cb_scale"],"deck":"Pythagoras and the special right triangles, then what one scale factor does to every length, area and volume."},{"n":12,"kicker":"Geometry · III","title":"Quadrilaterals and Polygons","boards":["cb_quads","cb_poly"],"deck":"The four-sided family and the area of each, then shapes with any number of sides."},{"n":13,"kicker":"Geometry · IV","title":"Circles","boards":["cb_circle","cb_inscribed"],"deck":"One circle and every rule it carries, then shapes drawn inside and around each other."},{"n":14,"kicker":"Geometry · V","title":"Area, Perimeter and Solids","boards":["cb_cut","cb_shapes","cb_solid"],"deck":"Cutting a piece out of a shape, flat shapes and the solids they grow into, and the volume and surface of each solid."},{"n":15,"kicker":"Coordinate Geometry","title":"Points, Lines and Curves on the Grid","boards":["cb_line","cb_grid","cb_curve"],"deck":"Slope, intercepts, distance and midpoint, shapes placed on the grid, and where a curve meets a line."},{"n":16,"kicker":"Data Interpretation · I","title":"Pie Charts and Shares","boards":["tk_pie"],"deck":"A slice as an angle, a share and a count, and the total hiding behind a part."},{"n":17,"kicker":"Data Interpretation · II","title":"Bars, Tables and Overlaps","boards":["tk_bars"],"deck":"Changes and multiples between bars, points against per cent, tables, and two categories that overlap."},{"n":18,"kicker":"Statistics","title":"Spread, the Normal Curve and Weighted Averages","boards":["cb_spread","cb_normal","cb_groups"],"deck":"Mean, median and spread on values you can move, the bell curve, and two groups joined into one average."},{"n":19,"kicker":"Data Analysis","title":"Overlaps, Counting and Chance","boards":["cb_sets","cb_count","cb_prob"],"deck":"Two groups that overlap, choosing and arranging, and a two-stage chance tree."}],"boards":{"cb_evenodd":{"title":"Odd and even, and numbers in a row","tag":"Number","say":"A strip of whole numbers runs across the top, and a bracket picks out k of them in a row. Drag the bracket or move the sliders, and the evens, the odds, the multiples and the primes inside it are counted at once. The last button swaps the strip for a sequence where each term is the sum of the two before it, so you can watch the letters E and O repeat.","note":"","tries":["Set <b>how many in a row<\/b> to 6 and drag the bracket one step at a time. Three evens and three odds every time. Set it to 5 and the extra one goes to whichever kind starts the row.","Press <b>the multiples inside<\/b>, set <b>how many in a row<\/b> to 3 and drag the bracket anywhere, even across 0 into the negatives. The product is always a multiple of 6. Across 0 it is 0, which is a multiple of every number.","In the same view, set the row to 4 and watch the sum. It is always 2 times an odd number, so 4 never divides it. Set it to 5 and the sum is always 5 times the middle number.","Press <b>the primes inside<\/b>, set the row to 6 and start it at 2. Four primes: 2, 3, 5, 7. Start it anywhere above 3 and you never get more than two. Then set the row to 7 and start it at 90: none at all.","Press <b>a two-term rule<\/b> and make both starting terms even. Every term turns even and the odd count is 0. Make one of them odd and the letters fall into E O O, so 700 terms hold 466 or 467 odd ones."],"ideas":[{"lead":"<b>Two numbers of the same kind add to an even number.<\/b>","rest":"Even plus even is even, and odd plus odd is even too. Mixing one of each gives odd. Taking away follows the same table.","f":"E ± E = E · O ± O = E · E ± O = O","eg":"3 + 5 = 8 (odd + odd) · 4 + 6 = 10 · 4 + 5 = 9 (even + odd is odd)","plain":"Even numbers split into pairs (2, 4, 6, …). Odd numbers have one left over (1, 3, 5, …). Add two odd numbers and the two leftovers make a new pair, so the answer is even. Add an even and an odd and one leftover stays, so the answer is odd.","steps":["3 + 5: each has one left over, 1 + 1 makes a pair → 8 is even","4 + 5: only 5 has a leftover → 9 is odd","Rule: same kind → even · mixed → odd"],"big":"Same kind added gives even. Mixed kinds give odd.","html":"<p>An <b>even<\/b> number splits into pairs (2, 4, 6). An <b>odd<\/b> number has one left over (1, 3, 5).<\/p><ul><li>even + even = <b>even<\/b><\/li><li>odd + odd = <b>even<\/b><\/li><li>even + odd = <b>odd<\/b><\/li><\/ul><p>Taking away follows the same rules.<\/p><div class=\"ex\"><b>Example:<\/b><ol><li>3 + 5: each has 1 left over. The two leftovers make a pair → 8 is <b>even<\/b> ✅<\/li><li>4 + 5: only 5 has a leftover → 9 is <b>odd<\/b> ✅<\/li><li>9 − 3 = 6: odd − odd → <b>even<\/b> ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ Odd + odd is <b>not<\/b> odd. The two leftovers join into a pair.<\/p>"},{"lead":"<b>A product is even the moment one factor is even.<\/b>","rest":"You never need to look at the other factors. A product is odd only when every factor is odd, so a power keeps the parity of its base.","f":"E × any whole number = E · O × O = O · n<sup>k<\/sup> (k ≥ 1) has the parity of n","eg":"4 × 7 = 28 is even · 3 × 5 = 15 is odd · 3⁴ = 81 is odd, like 3","plain":"Even means “has a 2 inside it”. Multiply by an even number and that 2 is still inside the answer, whatever the other numbers are. The only way to get an odd product is odd × odd × odd …","steps":["6 × 7: 6 = 2 × 3 has a 2 → 42 is even","3 × 5 × 7 = 105: no 2 anywhere → odd","3⁴ = 3 × 3 × 3 × 3, all odd → 81 is odd"],"big":"One even number in a multiplication makes the whole answer even.","html":"<p>A <b>product<\/b> is the answer when you multiply.<\/p><ul><li>Even means “has a 2 inside it.” That 2 stays inside the answer.<\/li><li>The answer is odd <b>only<\/b> when every number you multiply is odd.<\/li><li>A <b>power<\/b> like 3⁴ means 3 × 3 × 3 × 3. It is even or odd just like its <b>base<\/b> (the number being multiplied, here 3). This holds for a power of 1 or more.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b><ol><li>6 × 7: 6 = 2 × 3 has a 2 → 42 is <b>even<\/b><\/li><li>3 × 5 × 7 = 105: no 2 anywhere → <b>odd<\/b><\/li><li>3⁴ = 81: all odd → <b>odd<\/b>, like 3 ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Once you see one even number, stop. You never need to check the others.<\/p>"},{"lead":"<b>Parity is the remainder on division by 2.<\/b>","rest":"Even leaves 0 and odd leaves 1. Zero is even, and negatives have a parity too: −3 is odd. A power of −1 only asks whether the power is even or odd, so (−1)<sup>n<\/sup> × n added along a row that starts odd pairs off neighbours into +1s.","f":"(−1)<sup>n<\/sup> = +1 for even n, −1 for odd n · −1 + 2 − 3 + 4 − … + 100 = 50","eg":"7 ÷ 2 = 3 remainder 1 → odd · 8 ÷ 2 = 4 remainder 0 → even","plain":"“Even or odd” just asks: divide by 2, what is left? Even leaves 0, odd leaves 1. This works for 0 (it is even) and for negative numbers too. And (−1) times itself an even number of times is +1, an odd number of times is −1.","steps":["7 ÷ 2 = 3 remainder 1 → odd","0 ÷ 2 = 0 remainder 0 → 0 is even","−4 = 2 × (−2) → even","(−1) × (−1) = +1 (2 times) · (−1) × (−1) × (−1) = −1 (3 times)"],"big":"Even or odd? Divide by 2 and look at what's left over.","html":"<ul><li>Nothing left → <b>even<\/b> (8 ÷ 2 = 4, left over 0)<\/li><li>1 left → <b>odd<\/b> (7 ÷ 2 = 3, left over 1)<\/li><\/ul><p><b>Two facts people forget:<\/b><\/p><ul><li><b>0 is even<\/b>, because 0 ÷ 2 = 0 with nothing left.<\/li><li><b>Negative numbers count too.<\/b> −4 is even and −3 is odd.<\/li><\/ul><p><b>The (−1) trick:<\/b> multiply −1 by itself.<\/p><ul><li>An even number of times gives <b>+1<\/b>: (−1) × (−1) = +1<\/li><li>An odd number of times gives <b>−1<\/b>: (−1) × (−1) × (−1) = −1<\/li><\/ul><p class=\"tip\">💡 −1 + 2 − 3 + 4 − … + 100: pair them up. (−1 + 2) = 1, (−3 + 4) = 1, and so on. 50 pairs → <b>50<\/b>.<\/p>"},{"lead":"<b>In k numbers in a row, the evens and odds split as evenly as they can.<\/b>","rest":"When k is even they split half and half. When k is odd, the kind the row starts with gets the extra one. If a question leaves the ends free, the count can tip either way.","f":"k even: k/2 each · k odd: (k + 1)/2 of the first number’s kind","eg":"the 5 numbers 3 to 7: odd 3, 5, 7 (three) and even 4, 6 (two)","plain":"In a row of numbers the kinds take turns: odd, even, odd, even. So a row with an even length is half and half, and a row with an odd length has one extra of the kind it starts with.","steps":["3, 4, 5, 6 (4 numbers): odd 3, 5 and even 4, 6 → 2 and 2","3, 4, 5, 6, 7 (5 numbers): starts odd → odd 3, 5, 7 (three) and even 4, 6 (two)"],"big":"In numbers in a row, evens and odds take turns, so they split almost half and half.","html":"<p>“Numbers in a row” means whole numbers with no gaps, like 3, 4, 5, 6. They go odd, even, odd, even.<\/p><ul><li><b>Even count<\/b> (like 4 numbers): exactly half are even and half are odd.<\/li><li><b>Odd count<\/b> (like 5 numbers): the kind the row <b>starts<\/b> with gets 1 extra. That is (5 + 1) ÷ 2 = 3 of that kind.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b><ol><li>3, 4, 5, 6 (4 numbers): odd 3, 5 and even 4, 6 → <b>2 and 2<\/b><\/li><li>3, 4, 5, 6, 7 (5 numbers): starts odd → <b>3 odd<\/b> (3, 5, 7) and <b>2 even<\/b> (4, 6) ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ If the question does not say where the row starts, an odd count can tip either way. 5 numbers in a row can have 3 odd or only 2 odd.<\/p>"},{"lead":"<b>Any two numbers in a row include an even one.<\/b>","rest":"So n(n + 1) is always even. Factoring is what shows the pair: k² − k is k(k − 1), and x² + 3x + 2 is (x + 1)(x + 2), so neither is ever odd.","f":"n(n + 1) is even · k² − k = k(k − 1) · (−1)<sup>p(p + 1)<\/sup> = 1","eg":"7 × 8 = 56 is even · 6² − 6 = 30 = 6 × 5","plain":"Two numbers side by side always include an even one, because the kinds take turns. So multiplying two neighbours always gives an even answer.","steps":["7 × 8: 8 is even → 56 is even","n(n + 1) with n = 10: 10 × 11 = 110, even","k² − k = k(k − 1): with k = 5, 5 × 4 = 20, even"],"big":"Two numbers side by side always multiply to an even number.","html":"<p>Next-door numbers (like 7 and 8) take turns odd and even. So one of them is always even.<\/p><ul><li><b>Rule:<\/b> n × (n + 1) is always even. Here n is any whole number and n + 1 is the next one.<\/li><li><b>Factoring<\/b> (rewriting as a multiplication) shows the pair: k² − k = k × (k − 1).<\/li><li>x² + 3x + 2 = (x + 1)(x + 2) is two neighbours too, so it is never odd.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b><ol><li>7 × 8 = 56: 8 is even → <b>even<\/b><\/li><li>k² − k with k = 6: 36 − 6 = 30 = 6 × 5 → <b>even<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 So (−1) raised to the power p(p + 1) is always +1, because that power is even.<\/p>"},{"lead":"<b>Any k numbers in a row include exactly one multiple of k.<\/b>","rest":"Their product is always a multiple of k!, so three in a row always multiply to a multiple of 6.","f":"7 × 8 × 9 = 504 = 3! × 84","plain":"Any 3 numbers in a row contain one that divides by 3. Any 4 in a row contain one that divides by 4. That is why 3 numbers in a row always multiply to a multiple of 1 × 2 × 3 = 6.","steps":["7, 8, 9: 9 divides by 3, and 8 divides by 2","7 × 8 × 9 = 504 = 6 × 84 → a multiple of 6"],"big":"Any 3 numbers in a row multiply to a multiple of 6.","html":"<p>A <b>multiple<\/b> of 6 is 6 × a whole number (6, 12, 18, …).<\/p><ul><li>Any 2 numbers in a row include one that divides by 2.<\/li><li>Any 3 numbers in a row include exactly one that divides by 3.<\/li><li>In general, any k numbers in a row include exactly one that divides by k.<\/li><\/ul><p>So k numbers in a row multiply to a multiple of 1 × 2 × … × k. This is written k! (“k factorial”).<\/p><div class=\"ex\"><b>Example:<\/b> 7 × 8 × 9<ol><li>9 divides by 3, and 8 divides by 2.<\/li><li>7 × 8 × 9 = 504 = 6 × 84 → a <b>multiple of 6<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 4 numbers in a row multiply to a multiple of 1 × 2 × 3 × 4 = 24. Example: 2 × 3 × 4 × 5 = 120 = 24 × 5.<\/p>"},{"lead":"<b>An odd count of numbers in a row adds to the count times the middle one.<\/b>","rest":"The numbers above the middle make up exactly what the ones below it are short. It works for any evenly spaced list, such as consecutive even numbers. So 99 numbers in a row that add to 99 have 1 in the middle, and the first is 1 − 49 = −48.","f":"sum = k × middle (k odd)","eg":"5 + 6 + 7 = 3 × 6 = 18","plain":"If you add an odd count of numbers in a row, you can skip the adding: the middle number is the average, so the sum is how many × the middle.","steps":["5 + 6 + 7: the middle is 6 and there are 3 numbers","sum = 3 × 6 = 18 (check: 5 + 6 + 7 = 18)","11 to 19 is 9 numbers, middle 15 → 9 × 15 = 135"],"big":"Shortcut: sum = how many numbers × the middle number.","html":"<p>This works when there is an odd count of numbers, like 3, 5 or 7.<\/p><div class=\"ex\"><b>Example:<\/b> 5 + 6 + 7 + 8 + 9 = ?<ol><li>There are 5 numbers, and the middle one is 7.<\/li><li>5 × 7 = <b>35<\/b> ✅ (check: 5 + 6 + 7 + 8 + 9 = 35)<\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> the number above the middle gives 1 to the number below it, so every number turns into 7. 5, 6, 7, 8, 9 → 7, 7, 7, 7, 7<\/p><p class=\"tip\">💡 It also works for any evenly spaced list: 4 + 6 + 8 = 3 × 6 = 18.<\/p><p class=\"tip\">💡 Backwards: 99 numbers in a row add to 99. The middle is 99 ÷ 99 = 1. There are 49 numbers below the middle, so the first is 1 − 49 = <b>−48<\/b>.<\/p>"},{"lead":"<b>An even count adds to half the count times the first plus the last.<\/b>","rest":"Here the first plus the last is odd, so the sum is never a multiple of k. Four in a row always add to 2 times an odd number.","f":"sum = (k/2) × (first + last) (k even)","eg":"3 + 4 + 5 + 6 = (4/2) × (3 + 6) = 18","plain":"With an even count there is no single middle. Pair the first with the last, the second with the second-last, and so on. Every pair has the same total.","steps":["3 + 4 + 5 + 6: pairs (3 + 6) and (4 + 5), each 9","2 pairs × 9 = 18","the formula: (4 ÷ 2) × (3 + 6) = 18"],"big":"Even count of numbers in a row? Sum = half the count × (first + last).","html":"<p>With an even count there is no single middle number. So pair them up.<\/p><ul><li>Pair the first with the last, the second with the second-last, and so on.<\/li><li>Every pair has the same total.<\/li><li><b>Rule:<\/b> sum = (k ÷ 2) × (first + last), where k is how many numbers.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> 3 + 4 + 5 + 6 = ?<ol><li>Pairs: 3 + 6 = 9 and 4 + 5 = 9<\/li><li>2 pairs × 9 = <b>18<\/b> ✅ (check: 3 + 4 + 5 + 6 = 18)<\/li><\/ol><\/div><p class=\"tip\">💡 With an even count, first + last is always odd. So the sum is <b>never<\/b> a multiple of the count. 4 numbers in a row always add to 2 × an odd number (18 = 2 × 9).<\/p>"},{"lead":"<b>Strike out the evens and the multiples of 3, and few numbers are left to be prime.<\/b>","rest":"1 is not a prime, and 2 is the only even prime. In six numbers in a row above 3, three are even and one of the three odd ones is a multiple of 3, so at most two can be prime.","f":"2 to 7 is the only six in a row with four primes: 2, 3, 5, 7","eg":"24 to 29: only 29 is prime","plain":"Most numbers are not prime because they are even or divide by 3. After 3, any 6 numbers in a row have at most 2 that could be prime.","steps":["24, 25, 26, 27, 28, 29","the evens 24, 26, 28 are out · 27 = 3 × 9 is out · 25 = 5 × 5 is out","only 29 is prime"],"big":"After 3, any 6 numbers in a row have at most 2 primes.","html":"<p>A <b>prime<\/b> is a number that only 1 and itself divide (2, 3, 5, 7, 11, …).<\/p><ul><li><b>1 is not a prime.<\/b><\/li><li><b>2 is the only even prime.<\/b><\/li><li>In 6 numbers in a row, 3 are even, so they are out. One of the 3 odd ones divides by 3, so it is out too. At most 2 are left.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> 24, 25, 26, 27, 28, 29<ol><li>The evens 24, 26, 28 are out.<\/li><li>27 = 3 × 9 is out. 25 = 5 × 5 is out.<\/li><li>Only <b>29<\/b> is prime ✅<\/li><\/ol><\/div><p class=\"tip\">💡 The only 6 in a row with 4 primes is 2 to 7: 2, 3, 5, 7.<\/p>"},{"lead":"<b>A row of numbers can hold no prime at all.<\/b>","rest":"So the count of primes in a row has a ceiling, but it can always fall to 0. It happens early: 90 to 96 is seven numbers with no prime among them.","f":"91 = 7 × 13 · 93 = 3 × 31 · 95 = 5 × 19","eg":"24, 25, 26, 27, 28: not one prime","plain":"You can find a stretch of numbers with no prime at all, so “how many primes” can be 0.","steps":["90, 91, 92, 93, 94, 95, 96","91 = 7 × 13 · 93 = 3 × 31 · 95 = 5 × 19 · the rest are even","seven numbers, no primes"],"big":"A row of numbers can have no primes at all.","html":"<p>A <b>prime<\/b> is a number that only 1 and itself divide (2, 3, 5, 7, …). The number of primes in a row has a top limit, but it can always be as low as <b>0<\/b>.<\/p><div class=\"ex\"><b>Example:<\/b> 90, 91, 92, 93, 94, 95, 96<ol><li>90, 92, 94, 96 are even, so they are not prime.<\/li><li>91 = 7 × 13, 93 = 3 × 31, 95 = 5 × 19<\/li><li>Seven numbers, <b>no primes<\/b> ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ 91 looks prime but is not: 91 = 7 × 13. Test small primes like 3 and 7 before you decide.<\/p><p class=\"tip\">💡 A shorter one: 24, 25, 26, 27, 28 has no prime either.<\/p>"},{"lead":"<b>When each term adds the two before it, the letters E and O follow the same rule.<\/b>","rest":"Write the terms as letters and they fall into E O O, repeating every three. The one exception is two even starting terms, which make every term even. For N terms, write N = 3q + r and read the leftover off the block.","f":"700 = 3 × 233 + 1 → 466 or 467 odd terms, or 0 · on 3, every 4th term is a multiple of 3","eg":"1, 1, 2, 3, 5, 8, 13: O, O, E, O, O, E, O, so the pattern repeats every 3","plain":"In a list where each number is the two before it added (1, 1, 2, 3, 5, 8, …), you don't need the numbers to know even or odd. Use the adding rule on the letters: O + O = E and O + E = O. The pattern O, O, E repeats every 3.","steps":["1, 1 → O, O","O + O = E (2) · O + E = O (3) · E + O = O (5) · O + O = E (8)","so every 3rd term is even: 2, 8, 34, …"],"big":"When each number is the sum of the two before it, odd and even repeat every 3.","html":"<p>Example list: 1, 1, 2, 3, 5, 8, 13, … (each number = the two before it added). Write O for odd and E for even, and add the letters: O + O = E, O + E = O.<\/p><div class=\"ex\"><b>Example:<\/b><ol><li>1, 1 → O, O. Then O + O = E (2), O + E = O (3), E + O = O (5), O + O = E (8)<\/li><li>The letters repeat O, O, E → each block of 3 has <b>2 odd and 1 even<\/b>.<\/li><\/ol><\/div><p><b>Long lists:<\/b> 700 = 3 × 233 + 1. The 233 blocks give 466 odd numbers. The 1 extra may be odd or even → <b>466 or 467<\/b>.<\/p><p class=\"warn\">⚠️ If the first two numbers are both even, every number is even (0 odd).<\/p><p class=\"tip\">💡 In 1, 1, 2, 3, 5, 8, … every 4th number divides by 3: 3, 21, 144.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><text class=\"slabel  numtxt\" x=\"320\" y=\"28\" text-anchor=\"middle\" style=\"font-size:12px\">the row 7 to 12: 3 even, 3 odd<\/text><g style=\"opacity:.35\"><rect x=\"40\" y=\"60\" width=\"28\" height=\"28\" rx=\"0\"
