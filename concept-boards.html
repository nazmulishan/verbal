y=\"109\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"114\" y=\"97\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"122\" y=\"109\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"132\" y=\"97\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"140\" y=\"109\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"150\" y=\"97\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"158\" y=\"109\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"168\" y=\"97\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"176\" y=\"109\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"186\" y=\"97\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"194\" y=\"109\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"204\" y=\"97\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"212\" y=\"109\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"222\" y=\"97\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"230\" y=\"109\" text-anchor=\"middle\">2<\/text><path class=\"gline\" d=\"M 92 154 L 312 154\"/><text class=\"slabel\" x=\"86\" y=\"158\" text-anchor=\"end\">m&minus;n = 2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"96\" y=\"137\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"104\" y=\"149\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"114\" y=\"137\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"122\" y=\"149\" text-anchor=\"middle\">2<\/text><text class=\"slabel\" x=\"20\" y=\"14\">base a = 2<\/text><text class=\"slabel\" x=\"160\" y=\"190\" text-anchor=\"middle\">above the line multiplies, below divides<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Multiplying and dividing powers&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"alg","fm":[]},"tk_abs":{"title":"Absolute value and inequalities","tag":"Algebra","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Absolute value as two cases.<\/b>","rest":"The bars record a distance, so anything the same distance on the far side of zero also qualifies &mdash; every absolute value equation is two equations.","f":"|ax + b| = c &nbsp;&rarr;&nbsp; ax + b = c &nbsp;or&nbsp; ax + b = &minus;c","eg":"|2x &minus; 3| = 7 splits into 2x &minus; 3 = 7 and 2x &minus; 3 = &minus;7, giving x = 5 and x = &minus;2.","trap":"The second case negates the whole right side, not the x. And drag c below zero: the equation now has no solution at all, because a distance cannot be negative &mdash; solving it anyway is the commonest way to invent a root.","fmn":"Absolute value as two cases","big":"Absolute value is a distance, so every equation splits into 2.","html":"<p><b>Absolute value<\/b> |x| is how far x is from 0. Both 7 and −7 are 7 away, so |7| = |−7| = 7.<\/p><p><b>Rule:<\/b> |something| = c → something = c, or something = −c<\/p><div class=\"ex\"><b>Example:<\/b> |2x − 3| = 7<ol><li>Case 1: 2x − 3 = 7 → 2x = 10 → <b>x = 5<\/b><\/li><li>Case 2: 2x − 3 = −7 → 2x = −4 → <b>x = −2<\/b><\/li><li>Check: |10 − 3| = 7 and |−4 − 3| = |−7| = 7 ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ If c is negative, like |x| = −3, there is <b>no answer<\/b>. A distance cannot be below 0.<\/p>"},{"lead":"<b>Multiplying an inequality.<\/b>","rest":"Adding to both sides of an inequality is always safe; multiplying is safe only while the multiplier stays positive.","f":"x &gt; d &nbsp;&rarr;&nbsp; kx &gt; kd if k &gt; 0, &nbsp; kx &lt; kd if k &lt; 0","eg":"From x &gt; 4, multiplying by 3 gives 3x &gt; 12; multiplying by &minus;3 gives &minus;3x &lt; &minus;12.","trap":"The flip is triggered by the sign of the multiplier, not by the sign of x. Drag k down through zero and watch the direction turn over &mdash; and note that at k = 0 the inequality is not flipped but destroyed, which is why you may never divide an inequality by a variable of unknown sign.","fmn":"Multiplying an inequality","big":"Multiply an inequality by a negative number? Flip the sign.","html":"<p>An <b>inequality<\/b> uses &gt; (greater than) or &lt; (less than) instead of =.<\/p><ul><li>Adding or subtracting: always safe.<\/li><li>Multiplying or dividing by a <b>positive<\/b> number: the sign stays.<\/li><li>Multiplying or dividing by a <b>negative<\/b> number: the sign <b>flips<\/b>.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> start with x &gt; 4.<ol><li>× 3: 3x &gt; 12 (stays)<\/li><li>× (−3): −3x &lt; −12 (flips) ✅ Try x = 5: −15 is less than −12.<\/li><\/ol><\/div><p class=\"warn\">⚠️ The flip depends on the sign of the number you multiply by, not the sign of x. So never divide by a letter when you do not know if it is positive or negative.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 340 200\"><path class=\"gline\" d=\"M 24 60 L 316 60\"/><path class=\"gline\" d=\"M 35 56 L 35 64\"/><text class=\"slabel\" x=\"35\" y=\"78\" text-anchor=\"middle\">&minus;18<\/text><path class=\"gline\" d=\"M 57.5 56 L 57.5 64\"/><path class=\"gline\" d=\"M 80 56 L 80 64\"/><text class=\"slabel\" x=\"80\" y=\"78\" text-anchor=\"middle\">&minus;12<\/text><path class=\"gline\" d=\"M 102.5 56 L 102.5 64\"/><path class=\"gline\" d=\"M 125 56 L 125 64\"/><text class=\"slabel\" x=\"125\" y=\"78\" text-anchor=\"middle\">&minus;6<\/text><path class=\"gline\" d=\"M 147.5 56 L 147.5 64\"/><path class=\"gline\" d=\"M 170 56 L 170 64\"/><text class=\"slabel\" x=\"170\" y=\"78\" text-anchor=\"middle\">0<\/text><path class=\"gline\" d=\"M 192.5 56 L 192.5 64\"/><path class=\"gline\" d=\"M 215 56 L 215 64\"/><text class=\"slabel\" x=\"215\" y=\"78\" text-anchor=\"middle\">6<\/text><path class=\"gline\" d=\"M 237.5 56 L 237.5 64\"/><path class=\"gline\" d=\"M 260 56 L 260 64\"/><text class=\"slabel\" x=\"260\" y=\"78\" text-anchor=\"middle\">12<\/text><path class=\"gline\" d=\"M 282.5 56 L 282.5 64\"/><path class=\"gline\" d=\"M 305 56 L 305 64\"/><text class=\"slabel\" x=\"305\" y=\"78\" text-anchor=\"middle\">18<\/text><text class=\"slabel\" x=\"24\" y=\"26\">the ax + b line<\/text><path class=\"aux\" d=\"M 117.5 44 L 222.5 44\"/><circle class=\"handle\" cx=\"222.5\" cy=\"60\" r=\"5\"/><circle class=\"handle\" cx=\"117.5\" cy=\"60\" r=\"5\"/><text class=\"slabel r\" x=\"170\" y=\"40\" text-anchor=\"middle\">both are 7 from 0<\/text><path class=\"gline\" d=\"M 24 140 L 316 140\"/><path class=\"gline\" d=\"M 35 136 L 35 144\"/><path class=\"gline\" d=\"M 62 136 L 62 144\"/><text class=\"slabel\" x=\"62\" y=\"158\" text-anchor=\"middle\">&minus;20<\/text><path class=\"gline\" d=\"M 89 136 L 89 144\"/><path class=\"gline\" d=\"M 116 136 L 116 144\"/><text class=\"slabel\" x=\"116\" y=\"158\" text-anchor=\"middle\">&minus;10<\/text><path class=\"gline\" d=\"M 143 136 L 143 144\"/><path class=\"gline\" d=\"M 170 136 L 170 144\"/><text class=\"slabel\" x=\"170\" y=\"158\" text-anchor=\"middle\">0<\/text><path class=\"gline\" d=\"M 197 136 L 197 144\"/><path class=\"gline\" d=\"M 224 136 L 224 144\"/><text class=\"slabel\" x=\"224\" y=\"158\" text-anchor=\"middle\">10<\/text><path class=\"gline\" d=\"M 251 136 L 251 144\"/><path class=\"gline\" d=\"M 278 136 L 278 144\"/><text class=\"slabel\" x=\"278\" y=\"158\" text-anchor=\"middle\">20<\/text><path class=\"gline\" d=\"M 305 136 L 305 144\"/><text class=\"slabel\" x=\"24\" y=\"106\">the x line<\/text><path class=\"aux\" d=\"M 178.1 124 L 178.1 156\"/><circle class=\"handle\" cx=\"197\" cy=\"140\" r=\"5\"/><circle class=\"handle\" cx=\"159.2\" cy=\"140\" r=\"5\"/><text class=\"slabel b\" x=\"170\" y=\"192\" text-anchor=\"middle\">x = 5 or x = &minus;2<\/text><text class=\"slabel\" x=\"316\" y=\"26\" text-anchor=\"end\">a = 2, b = &minus;3<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Absolute value as two cases&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"alg","fm":[]},"tk_seq":{"title":"Sequences","tag":"Algebra","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Arithmetic sequence, nth term.<\/b>","rest":"You take d steps to get from one term to the next, and there are n &minus; 1 steps between the first term and the nth &mdash; one fewer than the count of terms.","f":"a<sub>n<\/sub> = a<sub>1<\/sub> + (n &minus; 1)d","eg":"Starting at 4 and adding 3 each time, the 10th term is 4 + 9(3) = 31.","trap":"It is (n &minus; 1)d, not nd. The first term has taken no steps yet. Using nd shifts every answer by exactly one d, which is the single most common sequence error and is invisible unless you test it on n = 1.","fmn":"Arithmetic sequence, nth term","big":"The nth term = first term + (n − 1) steps.","html":"<p>An <b>arithmetic sequence<\/b> is a list where you add the same number each time. That number is the <b>step<\/b>, called d.<\/p><p><b>Rule:<\/b> term number n = first term + (n − 1) × d<\/p><div class=\"ex\"><b>Example:<\/b> start at 4 and add 3 each time. Find the 10th term.<ol><li>From term 1 to term 10 there are 10 − 1 = 9 steps.<\/li><li>4 + 9 × 3 = 4 + 27 = <b>31<\/b> ✅ (list: 4, 7, 10, 13, 16, 19, 22, 25, 28, 31)<\/li><\/ol><\/div><p class=\"warn\">⚠️ Use n − 1, not n. The first term has taken no steps yet. Test your rule with n = 1.<\/p>"},{"lead":"<b>Sum of an arithmetic sequence.<\/b>","rest":"The average of the first and last term, multiplied by how many terms there are &mdash; the terms pair off around the middle.","f":"S<sub>n<\/sub> = (n &divide; 2)(2a<sub>1<\/sub> + (n &minus; 1)d)","eg":"3, 7, 11, &hellip; for 8 terms ends at 31, so the sum is 4 &times; 34 = 136.","trap":"n is the count of terms, not the last term. For 3, 7, 11, &hellip;, 31 the count is 8, not 31. Count with (last &minus; first) &divide; d + 1 before you use this formula, and note that a negative d can drive the sum below zero even though it starts positive.","fmn":"Sum of an arithmetic sequence","big":"Sum of an adding list = how many terms × the average of the first and last.","html":"<p><b>Rule:<\/b> sum = (n ÷ 2) × (first + last). Here n is how many terms.<\/p><div class=\"ex\"><b>Example:<\/b> 3 + 7 + 11 + … for 8 terms (add 4 each time).<ol><li>Last term: 3 + 7 × 4 = 31<\/li><li>First + last: 3 + 31 = 34<\/li><li>Sum: (8 ÷ 2) × 34 = 4 × 34 = <b>136<\/b> ✅ (check: 3 + 7 + 11 + 15 + 19 + 23 + 27 + 31 = 136)<\/li><\/ol><\/div><p class=\"tip\">💡 To count the terms: (last − first) ÷ step + 1. For 3 to 31: 28 ÷ 4 + 1 = 8.<\/p><p class=\"warn\">⚠️ n is how many terms (8), not the last term (31).<\/p>"},{"lead":"<b>Geometric sequence, nth term.<\/b>","rest":"Each term is the one before it multiplied by a fixed ratio, so the exponent counts the multiplications, one fewer than the term number.","f":"a<sub>n<\/sub> = a<sub>1<\/sub> &middot; r<sup>n&minus;1<\/sup>","eg":"3, 6, 12, &hellip; has r = 2, so the 6th term is 3 &times; 2&#8309; = 96.","trap":"The exponent is n &minus; 1, not n. Also watch the ratio cross 1: above it the terms run away, below it they die out, and at a negative r they alternate sign, so the 6th term and the 7th term of the same sequence can sit on opposite sides of zero.","fmn":"Geometric sequence, nth term","big":"Geometric list: multiply by the same number each time.","html":"<p>A <b>geometric sequence<\/b> multiplies by a fixed number each time. That number is the <b>ratio<\/b>, called r.<\/p><p><b>Rule:<\/b> term number n = first term × r<sup>n−1<\/sup><\/p><div class=\"ex\"><b>Example:<\/b> 3, 6, 12, … Find the 6th term.<ol><li>r = 6 ÷ 3 = 2<\/li><li>6th term = 3 × 2⁵ = 3 × 32 = <b>96<\/b> ✅ (list: 3, 6, 12, 24, 48, 96)<\/li><\/ol><\/div><ul><li>r bigger than 1 → the terms grow fast.<\/li><li>r between 0 and 1 → the terms shrink toward 0.<\/li><li>r negative → the signs switch: +, −, +, −.<\/li><\/ul><p class=\"warn\">⚠️ The power is n − 1, not n.<\/p>"},{"lead":"<b>Sum of a geometric sequence.<\/b>","rest":"One formula for the whole run; when the ratio is between &minus;1 and 1 the tail dies away and an endless sum settles on a<sub>1<\/sub> &divide; (1 &minus; r).","f":"S<sub>n<\/sub> = a<sub>1<\/sub>(1 &minus; r<sup>n<\/sup>) &divide; (1 &minus; r)","eg":"4, 2, 1, 0.5, 0.25 sums to 4(1 &minus; 0.03125) &divide; 0.5 = 7.75, and the endless version would reach 8.","trap":"The infinite version only exists while the size of r is under 1. Slide r up to 1 and the formula itself divides by zero &mdash; the sum is n &times; a<sub>1<\/sub> there. Above 1 the terms grow, and quoting a<sub>1<\/sub> &divide; (1 &minus; r) then returns a negative total for a sum of positive numbers.","fmn":"Sum of a geometric sequence","big":"Sum of a geometric list has a formula, and some endless lists have a total.","html":"<p><b>Rule:<\/b> sum of n terms = first × (1 − r<sup>n<\/sup>) ÷ (1 − r). Here r is the number you multiply by.<\/p><div class=\"ex\"><b>Example:<\/b> 4 + 2 + 1 + 0.5 + 0.25<ol><li>First = 4, r = ½, n = 5<\/li><li>r⁵ = 1/32 = 0.03125<\/li><li>4 × (1 − 0.03125) ÷ 0.5 = <b>7.75<\/b> ✅ (check: 4 + 2 + 1 + 0.5 + 0.25 = 7.75)<\/li><\/ol><\/div><p><b>Endless sum:<\/b> if r is between −1 and 1, the terms die away and the total gets closer and closer to first ÷ (1 − r). Here: 4 ÷ 0.5 = <b>8<\/b>.<\/p><p class=\"warn\">⚠️ The endless rule only works when r is between −1 and 1. If r = 1, every term is the same, so the sum of n terms is n × first.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 340 200\"><path class=\"gline\" d=\"M 24 158 L 278 158\"/><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"33.9\" y=\"143.5\" width=\"16.3\" height=\"14.5\"/><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"57.9\" y=\"132.7\" width=\"16.3\" height=\"25.3\"/><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"81.9\" y=\"121.9\" width=\"16.3\" height=\"36.1\"/><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"105.9\" y=\"111\" width=\"16.3\" height=\"47\"/><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"129.9\" y=\"100.2\" width=\"16.3\" height=\"57.8\"/><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"153.9\" y=\"89.4\" width=\"16.3\" height=\"68.6\"/><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"177.9\" y=\"78.5\" width=\"16.3\" height=\"79.5\"/><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"201.9\" y=\"67.7\" width=\"16.3\" height=\"90.3\"/><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"225.9\" y=\"56.8\" width=\"16.3\" height=\"101.2\"/><rect style=\"fill:var(--amber-wash);stroke:var(--amber);stroke-width:1.2\" x=\"249.9\" y=\"46\" width=\"16.3\" height=\"112\"/><path class=\"aux\" d=\"M 42 143.5 L 66 143.5 L 66 132.7\"/><text class=\"slabel r\" x=\"66\" y=\"32\" text-anchor=\"middle\">d = 3<\/text><text class=\"slabel a\" x=\"258\" y=\"40\" text-anchor=\"middle\">31<\/text><text class=\"slabel\" x=\"20\" y=\"16\">a1 = 4,  d = 3,  n = 10<\/text><text class=\"slabel b\" x=\"170\" y=\"192\" text-anchor=\"middle\">9 steps of d land on 31<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Arithmetic sequence, nth term&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"alg","fm":[]},"tk_fn":{"title":"Functions and variation","tag":"Algebra","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Function notation.<\/b>","rest":"f(x) is not f times x &mdash; it is an instruction to put whatever sits in the bracket everywhere an x appears in the rule.","f":"f(x) = ax<sup>2<\/sup> + b","eg":"For f(x) = 2x&sup2; &minus; 3, f(3) = 2(9) &minus; 3 = 15.","trap":"f(&minus;x) is not &minus;f(x). Here f(3) and f(&minus;3) are the same number, because the square destroys the sign, while &minus;f(3) is its negative. Substitute into the whole rule, do not distribute a minus sign across the answer.","fmn":"Function notation","big":"f(3) means: put 3 in place of every x.","html":"<p>f(x) is not f times x. It is a rule. Whatever is in the brackets goes wherever x is.<\/p><div class=\"ex\"><b>Example:<\/b> f(x) = 2x² − 3. Find f(3).<ol><li>Put 3 in for x: 2 × 3² − 3<\/li><li>2 × 9 − 3 = 18 − 3 = <b>15<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ f(−x) is not the same as −f(x). Here f(−3) = 2 × 9 − 3 = 15, because squaring removes the minus. But −f(3) = −15.<\/p>"},{"lead":"<b>Composition of functions.<\/b>","rest":"Work from the inside out: g acts first, and its output becomes the input to f.","f":"f(g(x)) with f(x) = ax + b and g(x) = x<sup>2<\/sup>","eg":"With f(x) = 2x + 3 and g(x) = x&sup2;: f(g(2)) = f(4) = 11, while g(f(2)) = g(7) = 49.","trap":"Composition is not commutative. f(g(x)) and g(f(x)) are different functions and agree only by accident at particular x values &mdash; drag x and watch the two outputs separate.","fmn":"Composition of functions","big":"f(g(x)): do the inside one first.","html":"<p>g works first. Its answer goes into f.<\/p><div class=\"ex\"><b>Example:<\/b> f(x) = 2x + 3 and g(x) = x². Find f(g(2)).<ol><li>Inside first: g(2) = 2² = 4<\/li><li>Then f(4) = 2 × 4 + 3 = <b>11<\/b><\/li><\/ol>Now swap the order: g(f(2)). First f(2) = 2 × 2 + 3 = 7, then g(7) = 7² = <b>49<\/b>.<\/div><p class=\"warn\">⚠️ Order matters. f(g(x)) and g(f(x)) are usually different. Here they give 11 and 49.<\/p>"},{"lead":"<b>Direct variation.<\/b>","rest":"Two quantities that vary directly hold a fixed ratio: find k once from a known pair, then it prices every other pair.","f":"y = kx, &nbsp; so y<sub>1<\/sub> &divide; x<sub>1<\/sub> = y<sub>2<\/sub> &divide; x<sub>2<\/sub>","eg":"If y = 12 when x = 4 then k = 3, so at x = 10 the value of y is 30.","trap":"Direct variation means the <em>ratio<\/em> is fixed, not the difference. Tripling x triples y; it does not add 3 to y. And a line through (0, 0) is the only kind that varies directly &mdash; y = 3x + 2 does not, however linear it looks.","fmn":"Direct variation","big":"Direct variation: y ÷ x always stays the same.","html":"<p>\"y varies directly with x\" means y = kx, where k is a fixed number. When x doubles, y doubles.<\/p><p><b>Rule:<\/b> y₁ ÷ x₁ = y₂ ÷ x₂<\/p><div class=\"ex\"><b>Example:<\/b> y = 12 when x = 4. Find y when x = 10.<ol><li>Find k: 12 ÷ 4 = 3, so y = 3x<\/li><li>y = 3 × 10 = <b>30<\/b> ✅ (check: 30 ÷ 10 = 3)<\/li><\/ol><\/div><p class=\"warn\">⚠️ The ratio stays fixed, not the difference. Tripling x triples y. Also, y = 3x + 2 is not direct variation. The line must go through (0, 0).<\/p>"},{"lead":"<b>Inverse variation.<\/b>","rest":"Two quantities that vary inversely hold a fixed product, so whatever one is multiplied by, the other is divided by.","f":"xy = k, &nbsp; so x<sub>1<\/sub>y<sub>1<\/sub> = x<sub>2<\/sub>y<sub>2<\/sub>","eg":"If y = 10 when x = 6 then k = 60, so at x = 4 the value of y is 15.","trap":"Inverse variation is a fixed product, not a fixed sum. Halving x doubles y; it does not subtract from y. Drag the new x toward 0 and y climbs without limit &mdash; the curve never reaches the axis.","fmn":"Inverse variation","big":"Inverse variation: x × y always stays the same.","html":"<p>\"y varies inversely with x\" means x × y = k, a fixed number. When x doubles, y is cut in half.<\/p><p><b>Rule:<\/b> x₁ × y₁ = x₂ × y₂<\/p><div class=\"ex\"><b>Example:<\/b> y = 10 when x = 6. Find y when x = 4.<ol><li>Find k: 6 × 10 = 60<\/li><li>4 × y = 60 → y = 60 ÷ 4 = <b>15<\/b> ✅ (check: 4 × 15 = 60)<\/li><\/ol><\/div><p class=\"warn\">⚠️ The product stays fixed, not the sum. Halving x doubles y. As x gets close to 0, y gets huge.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 320 200\"><path class=\"gline\" d=\"M 24 95 L 300 95\"/><path class=\"gline\" d=\"M 162 22 L 162 168\"/><path class=\"gline\" d=\"M 43.7 92 L 43.7 98\"/><path class=\"gline\" d=\"M 83.1 92 L 83.1 98\"/><path class=\"gline\" d=\"M 122.6 92 L 122.6 98\"/><path class=\"gline\" d=\"M 201.4 92 L 201.4 98\"/><path class=\"gline\" d=\"M 240.9 92 L 240.9 98\"/><path class=\"gline\" d=\"M 280.3 92 L 280.3 98\"/><path class=\"gline\" d=\"M 159 168 L 165 168\"/><path class=\"gline\" d=\"M 159 138.8 L 165 138.8\"/><path class=\"gline\" d=\"M 159 109.6 L 165 109.6\"/><path class=\"gline\" d=\"M 159 80.4 L 165 80.4\"/><path class=\"gline\" d=\"M 159 51.2 L 165 51.2\"/><path class=\"gline\" d=\"M 159 22 L 165 22\"/><path style=\"fill:none;stroke:var(--blue);stroke-width:2\" d=\" M 89.1 23.8 L 91 28.1 L 93 32.2 L 95 36.2 L 96.9 40.2 L 98.9 44 L 100.9 47.6 L 102.9 51.2 L 104.8 54.6 L 106.8 58 L 108.8 61.2 L 110.7 64.3 L 112.7 67.3 L 114.7 70.1 L 116.7 72.9 L 118.6 75.5 L 120.6 78 L 122.6 80.4 L 124.5 82.7 L 126.5 84.8 L 128.5 86.9 L 130.5 88.8 L 132.4 90.6 L 134.4 92.3 L 136.4 93.9 L 138.3 95.4 L 140.3 96.7 L 142.3 97.9 L 144.3 99 L 146.2 100 L 148.2 100.9 L 150.2 101.7 L 152.1 102.3 L 154.1 102.8 L 156.1 103.2 L 158.1 103.5 L 160 103.7 L 162 103.8 L 164 103.7 L 165.9 103.5 L 167.9 103.2 L 169.9 102.8 L 171.9 102.3 L 173.8 101.7 L 175.8 100.9 L 177.8 100 L 179.7 99 L 181.7 97.9 L 183.7 96.7 L 185.7 95.4 L 187.6 93.9 L 189.6 92.3 L 191.6 90.6 L 193.5 88.8 L 195.5 86.9 L 197.5 84.8 L 199.5 82.7 L 201.4 80.4 L 203.4 78 L 205.4 75.5 L 207.3 72.9 L 209.3 70.1 L 211.3 67.3 L 213.3 64.3 L 215.2 61.2 L 217.2 58 L 219.2 54.6 L 221.1 51.2 L 223.1 47.6 L 225.1 44 L 227.1 40.2 L 229 36.2 L 231 32.2 L 233 28.1 L 234.9 23.8\"/><path class=\"aux\" d=\"M 221.1 95 L 221.1 51.2 L 162 51.2\"/><circle class=\"handle\" cx=\"221.1\" cy=\"95\" r=\"4\"/><circle class=\"handle\" cx=\"221.1\" cy=\"51.2\" r=\"5\"/><circle class=\"handle\" cx=\"162\" cy=\"51.2\" r=\"4\"/><text class=\"slabel r\" x=\"221.1\" y=\"110\" text-anchor=\"middle\">x = 3<\/text><text class=\"slabel b\" x=\"24\" y=\"13\">y = 2x&sup2; &minus; 3<\/text><text class=\"slabel\" x=\"300\" y=\"13\" text-anchor=\"end\">y runs to 25<\/text><text class=\"slabel\" x=\"162\" y=\"191\" text-anchor=\"middle\">f(3) = 15<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Function notation&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"alg","fm":[]},"tk_pie":{"title":"Pies, shares and counts","tag":"Data Interpretation","say":"","note":"","tries":[],"ideas":[{"lead":"<b>The angle of a pie slice.<\/b>","rest":"A pie turns shares into angles: the whole circle is the total, so every slice takes its own share of 360 degrees.","f":"angle = (part &divide; total) &times; 360&deg;","eg":"A category of 150 out of a total of 600 is a quarter of the pie, so its angle is 90 degrees.","trap":"Slices are compared by angle, never by how far the arc runs round the rim or how much room the label takes. A quarter is 90 degrees whether it is drawn at the top or the bottom.","fmn":"The angle of a pie slice","big":"Slice angle = the slice's share of the total × 360°.","html":"<p>A <b>pie chart<\/b> is a circle cut into slices. The whole circle is 360° and stands for the total. Each slice gets its share of the 360°.<\/p><p><b>Rule:<\/b> angle = (part ÷ total) × 360°<\/p><div class=\"ex\"><b>Example:<\/b> a group of 150 out of a total of 600<ol><li>Share: 150 ÷ 600 = ¼<\/li><li>Angle: ¼ × 360° = <b>90°<\/b><\/li><\/ol>Check: 90° is a quarter turn, so a quarter of the pie ✅<\/div><p class=\"warn\">⚠️ Compare slices by their angle only. Not by the edge length, the label size or where the slice sits. A 90° slice is a quarter wherever it is drawn.<\/p>"},{"lead":"<b>A part as a share of the total.<\/b>","rest":"Divide the piece by the whole it came from, then multiply by a hundred; the word <em>of<\/em> always names the denominator.","f":"share = (part &divide; total) &times; 100%","eg":"A bar of 120 against a printed total of 800 is 120 &divide; 800 = 15 per cent.","trap":"The denominator is the total the question names, which is often one column rather than the grand total. A share of its own bar and a share of the whole chart are different numbers.","fmn":"A part as a share of the total","big":"Percent of a total = part ÷ total × 100.","html":"<p>A <b>percent<\/b> means \"out of 100\". The word <b>\"of\"<\/b> tells you what to divide by. \"120 is what percent <b>of<\/b> 800?\" means divide by 800.<\/p><p><b>Rule:<\/b> percent = (part ÷ total) × 100%<\/p><div class=\"ex\"><b>Example:<\/b> a bar of 120, with a total of 800<ol><li>Divide: 120 ÷ 800 = 0.15<\/li><li>Times 100: 0.15 × 100 = <b>15%<\/b><\/li><\/ol>Check: 15% of 800 = 0.15 × 800 = 120 ✅<\/div><p class=\"warn\">⚠️ Divide by the total the question names. This is often one column, not the whole chart. \"Percent of its column\" and \"percent of the whole chart\" are different answers.<\/p>"},{"lead":"<b>A percent of a percent.<\/b>","rest":"Two nested shares multiply: a slice of a slice is smaller than either of them, and the second percent is taken of the first, never of the grand total.","f":"combined share = (a% &times; b%) &divide; 100","eg":"Thirty per cent of a category that is 40 per cent of the whole is 12 per cent of the whole &mdash; 108 out of a total of 900.","trap":"The two percents multiply. They never add and they never average, and the second one is a share of the category, so it can never be applied to the grand total directly.","fmn":"A percent of a percent","big":"A percent of a percent: multiply them.","html":"<p>A share of a share is smaller than either one. The second percent is taken of the first part, not of the whole.<\/p><p><b>Rule:<\/b> combined percent = (a × b) ÷ 100<\/p><div class=\"ex\"><b>Example:<\/b> 30% of a group that is 40% of 900 people<ol><li>Combined: (30 × 40) ÷ 100 = 12% of the whole<\/li><li>People: 12% of 900 = 0.12 × 900 = <b>108<\/b><\/li><\/ol>Check step by step: 40% of 900 = 360, then 30% of 360 = 108 ✅<\/div><p class=\"warn\">⚠️ Never add them (30 + 40 = 70% is wrong). Never average them. Never use the 30% on the whole 900.<\/p>"},{"lead":"<b>A count from a printed percent.<\/b>","rest":"When the chart prints shares and the question wants people, the total is the bridge between the two.","f":"count = (percent &divide; 100) &times; total","eg":"Thirty-five per cent of a total of 800 is 0.35 &times; 800 = 280.","trap":"The percent belongs to one particular total. Applying a share printed for one year to a different year's total is the single most common error in a two-chart question.","fmn":"A count from a printed percent","big":"To turn a percent into a count, multiply by the total.","html":"<p>The chart shows percents, but the question asks \"how many?\" The total links the two.<\/p><p><b>Rule:<\/b> count = (percent ÷ 100) × total<\/p><div class=\"ex\"><b>Example:<\/b> 35% of a total of 800<ol><li>35 ÷ 100 = 0.35<\/li><li>0.35 × 800 = <b>280<\/b><\/li><\/ol>Check: 10% of 800 = 80, so 35% = 80 × 3.5 = 280 ✅<\/div><p class=\"warn\">⚠️ Each percent belongs to its own total. With two charts (like two years), never use one year's percent with the other year's total. This is the most common mistake.<\/p>"},{"lead":"<b>A count from a slice angle.<\/b>","rest":"Reading a pie backwards: measure the angle, turn it into a share of the circle, and apply that share to the printed total.","f":"count = (angle &divide; 360) &times; total","eg":"A slice of 90 degrees on a pie representing 800 people covers 800 &divide; 4 = 200 people.","trap":"The total applied must be the total this pie represents. Two pies of the same size on one page almost never stand for the same number of people.","fmn":"A count from a slice angle","big":"From a slice angle to a count: angle ÷ 360 × total.","html":"<p>This is the pie rule done backwards. Turn the angle into a share of the full circle (360°). Then take that share of the total.<\/p><p><b>Rule:<\/b> count = (angle ÷ 360) × total<\/p><div class=\"ex\"><b>Example:<\/b> a 90° slice on a pie of 800 people<ol><li>Share: 90 ÷ 360 = ¼<\/li><li>Count: ¼ × 800 = <b>200 people<\/b><\/li><\/ol>Check: 200 ÷ 800 × 360° = 90° ✅<\/div><p class=\"warn\">⚠️ Use the total of <b>this<\/b> pie. Two pies drawn the same size often stand for very different totals.<\/p>"},{"lead":"<b>The total behind a part and its percent.<\/b>","rest":"When only one bar and its share are printed, the grand total is that bar divided by its share.","f":"total = part &divide; (percent &divide; 100)","eg":"A part of 30 that is 20 per cent of the whole comes from a total of 30 &divide; 0.2 = 150.","trap":"Divide by the share; do not multiply by it. Multiplying 30 by 0.2 gives 6, which is a fifth of the part rather than the whole it came from.","fmn":"The total behind a part and its percent","big":"To find the total, divide the part by its percent.","html":"<p>Sometimes a chart shows only one part and its percent. You can still find the total.<\/p><p><b>Rule:<\/b> total = part ÷ (percent ÷ 100)<\/p><div class=\"ex\"><b>Example:<\/b> 30 is 20% of the total. What is the total?<ol><li>20% = 20 ÷ 100 = 0.2<\/li><li>30 ÷ 0.2 = <b>150<\/b><\/li><\/ol>Check: 20% of 150 = 0.2 × 150 = 30 ✅<\/div><p class=\"warn\">⚠️ Divide, do not multiply. 30 × 0.2 = 6, which is smaller than the part, so it cannot be the total.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 300 200\"><circle class=\"gline\" style=\"fill:none\" cx=\"150\" cy=\"98\" r=\"66\"/><path class=\"shape\" d=\"M 150 98 L 150 32 A 66 66 0 0 1 216 98 Z\"/><path class=\"arcline\" d=\"M 150 72 A 26 26 0 0 1 176 98\"/><line class=\"gline\" x1=\"150\" y1=\"98\" x2=\"150\" y2=\"32\"/><line class=\"gline\" x1=\"150\" y1=\"98\" x2=\"216\" y2=\"98\"/><text class=\"slabel b\" x=\"183.6\" y=\"68.4\" text-anchor=\"middle\">p = 150<\/text><text class=\"slabel a\" x=\"150\" y=\"16\" text-anchor=\"middle\">angle = 90&deg;<\/text><text class=\"slabel\" x=\"150\" y=\"186\" text-anchor=\"middle\">T = 600 fills the whole circle<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;The angle of a pie slice&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"di","fm":[]},"tk_bars":{"title":"Bars, tables and overlaps","tag":"Data Interpretation","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Percent change between two bars.<\/b>","rest":"Every percent change is measured against the earlier figure, so the base is always the bar you started from.","f":"% change = (new &minus; old) &divide; old &times; 100","eg":"A bar rising from 40 to 60 is a change of 20 &divide; 40 = 50 per cent.","trap":"Rises and falls between the same pair of bars are not the same size. Forty up to sixty is a 50 per cent rise; sixty back down to forty is a 33 per cent fall, because the base has changed.","fmn":"Percent change between two bars","big":"Percent change = the change ÷ the starting number × 100.","html":"<p>Always divide by the <b>old<\/b> number, the one you started from.<\/p><p><b>Rule:<\/b> percent change = (new − old) ÷ old × 100<\/p><div class=\"ex\"><b>Example:<\/b> a bar goes from 40 to 60<ol><li>Change: 60 − 40 = 20<\/li><li>Divide by the old number: 20 ÷ 40 = 0.5<\/li><li>Times 100: <b>50% rise<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ Going back is not the same size. 60 down to 40 is 20 ÷ 60 ≈ 33% fall, because now the start is 60.<\/p>"},{"lead":"<b>One bar as a multiple of another.<\/b>","rest":"How many times as large is a division; how much larger is that same division after one whole is taken off.","f":"times as large = A &divide; B","eg":"A bar of 150 beside a bar of 50 is 3 times as large, which is the same fact as 200 per cent greater.","trap":"A multiple and a percent increase differ by exactly one whole. Three times as large is a 200 per cent rise, not a 300 per cent rise.","fmn":"One bar as a multiple of another","big":"\"Times as large\" means divide. \"Percent greater\" is that answer minus 1, times 100.","html":"<ul><li><b>Times as large:<\/b> A ÷ B<\/li><li><b>Percent greater:<\/b> (A − B) ÷ B × 100, which is the same as (times − 1) × 100<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> bar A = 150 and bar B = 50<ol><li>Times as large: 150 ÷ 50 = <b>3 times<\/b><\/li><li>Percent greater: (150 − 50) ÷ 50 = 100 ÷ 50 = 2 → <b>200% greater<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ \"3 times as large\" is a 200% rise, not 300%. The two always differ by exactly 1 whole (100%).<\/p>"},{"lead":"<b>Percentage points against per cent.<\/b>","rest":"When the chart itself is printed in percentages, a movement has two honest sizes and they are measured in different units.","f":"points = p<sub>2<\/sub> &minus; p<sub>1<\/sub> &nbsp;&middot;&nbsp; % change = (p<sub>2<\/sub> &minus; p<sub>1<\/sub>) &divide; p<sub>1<\/sub> &times; 100","eg":"A share moving from 4 per cent to 6 per cent has risen by 2 points and by 50 per cent. Both statements are true.","trap":"Percentage points and per cent are different units. That same move supports the sentence &ldquo;rose by 50 per cent&rdquo; and refutes the sentence &ldquo;rose by 2 per cent&rdquo;.","fmn":"Percentage points against per cent","big":"Percentage points and percent are not the same thing.","html":"<p>When the chart itself shows percents, a change can be measured two ways:<\/p><ul><li><b>Percentage points<\/b> = new % − old % (just subtract)<\/li><li><b>Percent change<\/b> = (new − old) ÷ old × 100<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> a share goes from 4% to 6%<ol><li>Points: 6 − 4 = <b>2 percentage points<\/b><\/li><li>Percent change: 2 ÷ 4 × 100 = <b>50%<\/b><\/li><li>Both are true ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ \"Rose by 50%\" is true. \"Rose by 2%\" is false. The right way is \"rose by 2 points\".<\/p>"},{"lead":"<b>A band from two cumulative figures.<\/b>","rest":"A cumulative column already contains everyone below its cut-off, so a single band is the difference between two of those running totals.","f":"band = F(upper) &minus; F(lower)","eg":"If 300 people earn under 60 and 120 earn under 40, then 180 earn between 40 and 60.","trap":"Subtract the two running totals, never the two band counts. And read whether the cut-off says &ldquo;fewer than&rdquo; or &ldquo;at most&rdquo; &mdash; one of them includes the boundary group and the other does not.","fmn":"A band from two cumulative figures","big":"To get one band from running totals, subtract the two running totals.","html":"<p>A <b>cumulative<\/b> column is a running total. It counts everyone below a cut-off. So \"under 60\" already includes everyone \"under 40\".<\/p><p><b>Rule:<\/b> people in the band = running total at the top − running total at the bottom<\/p><div class=\"ex\"><b>Example:<\/b> 300 people earn under 60, and 120 earn under 40. How many earn from 40 to 60?<ol><li>The 300 already includes the 120.<\/li><li>300 − 120 = <b>180 people<\/b> ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ Subtract the two running totals, not two band counts. Also read the words. \"Fewer than 40\" leaves out people at exactly 40, but \"at most 40\" includes them.<\/p>"},{"lead":"<b>A total from a table of categories.<\/b>","rest":"A table's total is each row's count times that row's value, added down the column &mdash; a weighted total, never a count times an average.","f":"total = n<sub>1<\/sub>v<sub>1<\/sub> + n<sub>2<\/sub>v<sub>2<\/sub> + n<sub>3<\/sub>v<sub>3<\/sub>","eg":"Ten items at 5, twenty at 8 and six at 12 total 50 + 160 + 72 = 282.","trap":"Multiplying the overall count by the average unit value is right only when every row holds the same count. Take the three products first, then add.","fmn":"A total from a table of categories","big":"Table total: multiply each row's count by its value, then add.","html":"<p>Each row has a <b>count<\/b> (how many) and a <b>value<\/b> (how much each one is worth).<\/p><p><b>Rule:<\/b> total = (count × value) + (count × value) + (count × value)<\/p><div class=\"ex\"><b>Example:<\/b><table><tr><th>Count<\/th><th>Value<\/th><th>Count × value<\/th><\/tr><tr><td>10<\/td><td>5<\/td><td>50<\/td><\/tr><tr><td>20<\/td><td>8<\/td><td>160<\/td><\/tr><tr><td>6<\/td><td>12<\/td><td>72<\/td><\/tr><\/table><ol><li>Multiply in each row (last column).<\/li><li>Add: 50 + 160 + 72 = <b>282<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ Do not multiply the total count by the average value. 36 × (5 + 8 + 12) ÷ 3 = 300, which is wrong. That shortcut only works when every row has the same count.<\/p>"},{"lead":"<b>The union of two categories.<\/b>","rest":"Adding two categories counts everyone in both of them twice, so the overlap comes off exactly once.","f":"|A or B| = |A| + |B| &minus; |both|","eg":"Sixty read the paper, forty-five listen to radio, twenty do both: 60 + 45 &minus; 20 = 85 do at least one.","trap":"Subtract the overlap once, not twice. Taking it off both categories before adding leaves the shared members out of the count altogether.","fmn":"The union of two categories","big":"Either A or B = A + B − both.","html":"<p>If you add two groups, the people in <b>both<\/b> groups (the overlap) get counted twice. So take the overlap away once.<\/p><div class=\"ex\"><b>Example:<\/b> 60 read the paper, 45 listen to the radio, 20 do both<ol><li>Add: 60 + 45 = 105 (the 20 were counted twice)<\/li><li>Take the overlap off once: 105 − 20 = <b>85<\/b> do at least one<\/li><\/ol>Check: paper only 40, radio only 25, both 20 → 40 + 25 + 20 = 85 ✅<\/div><p class=\"warn\">⚠️ Subtract the overlap once, not twice. 60 + 45 − 40 = 65 is wrong, because it leaves the 20 out.<\/p>"},{"lead":"<b>The least possible overlap.<\/b>","rest":"Two categories that together outnumber the population must share the excess, and that excess is the smallest overlap the chart permits.","f":"|both| &ge; |A| + |B| &minus; total","eg":"Out of 100 people, 60 own a car and 75 own a phone, so at least 60 + 75 &minus; 100 = 35 own both.","trap":"This is a floor, not the answer. The true overlap runs from that floor up to the size of the smaller category, and a chart printing only the two totals never pins it down.","fmn":"The least possible overlap","big":"Smallest possible overlap = A + B − total.","html":"<p>If two groups add up to more than everyone, some people must be in both. The extra is the <b>smallest<\/b> possible overlap (people in both groups).<\/p><p><b>Rule:<\/b> both ≥ A + B − total<\/p><div class=\"ex\"><b>Example:<\/b> 100 people. 60 own a car. 75 own a phone.<ol><li>Add: 60 + 75 = 135<\/li><li>That is 135 − 100 = 35 more than the number of people.<\/li><li>So at least <b>35<\/b> own both ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ 35 is only the smallest. The overlap can be anywhere from 35 up to 60 (the smaller group). With just these two totals you cannot know the exact number.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 300 210\"><line class=\"gline\" x1=\"36\" y1=\"44\" x2=\"36\" y2=\"172\"/><line class=\"gline\" x1=\"36\" y1=\"172\" x2=\"286\" y2=\"172\"/><line class=\"gline\" x1=\"32\" y1=\"172\" x2=\"36\" y2=\"172\"/><text class=\"slabel\" x=\"30\" y=\"176\" text-anchor=\"end\">0<\/text><line class=\"gline\" x1=\"32\" y1=\"112\" x2=\"36\" y2=\"112\"/><text class=\"slabel\" x=\"30\" y=\"116\" text-anchor=\"end\">100<\/text><line class=\"gline\" x1=\"32\" y1=\"52\" x2=\"36\" y2=\"52\"/><text class=\"slabel\" x=\"30\" y=\"56\" text-anchor=\"end\">200<\/text><rect class=\"shape\" x=\"62\" y=\"148\" width=\"52\" height=\"24\"/><rect class=\"shape\" x=\"140\" y=\"136\" width=\"52\" height=\"36\"/><line class=\"aux\" x1=\"56\" y1=\"148\" x2=\"238\" y2=\"148\"/><line class=\"aux\" x1=\"134\" y1=\"136\" x2=\"238\" y2=\"136\"/><line class=\"aux\" x1=\"232\" y1=\"148\" x2=\"232\" y2=\"136\"/><text class=\"slabel r\" x=\"242\" y=\"139\" text-anchor=\"start\">+20<\/text><text class=\"slabel r\" x=\"242\" y=\"153\" text-anchor=\"start\">+50%<\/text><text class=\"slabel\" x=\"88\" y=\"188\" text-anchor=\"middle\">old = 40<\/text><text class=\"slabel\" x=\"166\" y=\"188\" text-anchor=\"middle\">new = 60<\/text><text class=\"slabel r\" x=\"88\" y=\"202\" text-anchor=\"middle\">the base<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Percent change between two bars&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"di","fm":[]}}}</script>
<script>
(function(){
  "use strict";
  var D=JSON.parse(document.getElementById("cb-data").textContent);
  var PAGES=D.pages, B=D.boards, LET="ABCD", N=PAGES.length;
  var sheet=document.getElementById("sheet"), pager=document.getElementById("pager"), qz=document.getElementById("qz"), qzp=document.getElementById("qzp");
  var SIZES=["15px","17px","19.5px"], HOST=false;

  function load(k,d){try{var v=JSON.parse(localStorage.getItem(k)||"null");return v==null?d:v;}catch(e){return d;}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
  var KNOW=load("kmf.cb.known",{}); if(typeof KNOW!=="object"||!KNOW)KNOW={};
  var V=load("cb8.view",{}); var st={page:+V.page||0,mode:V.mode==="cover"?"cover":"read",hide:!!V.hide,size:V.size==null?1:+V.size};
  if(!(st.size>=0&&st.size<3))st.size=1;
  var h0=(location.hash||"").match(/^#p(\d+)$/); if(h0&&+h0[1]>=1&&+h0[1]<=N)st.page=+h0[1];
  if(!(st.page>=0&&st.page<=N))st.page=0;
  function keep(){save("cb8.view",{page:st.page,mode:st.mode,hide:st.hide,size:st.size});}

  function ideasOf(P){var out=[];P.boards.forEach(function(bid){B[bid].ideas.forEach(function(x,i){out.push(bid+":"+i);});});return out;}
  function knownIn(P){return ideasOf(P).filter(function(k){return KNOW[k];}).length;}
  function idea(k){var p=k.split(":");return B[p[0]].ideas[+p[1]];}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  pager.innerHTML=PAGES.map(function(P){return '<button type="button" class="pg" data-p="'+P.n+'" title="Page '+P.n+' · '+esc(P.title)+'">'+P.n+'</button>';}).join("");
  function bar(){
    [].forEach.call(pager.children,function(b){var n=+b.getAttribute("data-p"),P=PAGES[n-1];
      if(n===st.page)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
      b.classList.toggle("done",knownIn(P)===ideasOf(P).length);});
    document.getElementById("tocBtn").setAttribute("aria-pressed",String(st.page===0));
    document.getElementById("modeRead").setAttribute("aria-pressed",String(st.mode==="read"));
    document.getElementById("modeCover").setAttribute("aria-pressed",String(st.mode==="cover"));
    document.getElementById("hideBtn").setAttribute("aria-pressed",String(st.hide));
    sheet.classList.toggle("cover",st.mode==="cover"); sheet.classList.toggle("hideknown",st.hide);
    sheet.style.setProperty("--fs",SIZES[st.size]);
  }

  function toc(){
    var total=0,known=0; PAGES.forEach(function(P){total+=ideasOf(P).length;known+=knownIn(P);});
    var last=+(V.page||0);
    return '<div class="rhead"><span>'+esc(D.title)+'</span><span>Contents</span></div>'
      +'<h1>'+esc(D.title)+'</h1>'
      +'<p class="deck">'+D.blurb+'</p>'
      +'<p class="meta">'+known+' of '+total+' ideas ticked as known</p>'
      +'<ul class="howto">'
      +'<li><b>Read one page a day.</b> Each idea starts with one bold line, then explains it in plain words with a worked example and a tip.</li>'
      +'<li><b>Textbook version ▾</b> under an idea shows the short textbook wording, the formula, and links to go deeper.</li>'
      +'<li><b>Cover</b> blurs the explanations. Read the bold line, say what it means, then tap to check.</li>'
      +'<li><b>Tick ✓</b> what you know, and <b>Hide ✓</b> leaves only what is left to learn.</li>'
      +'</ul>'
      +(HOST?'<p class="small">Inside KMF Quant, <b>Move the board</b> opens the live board itself, full width, so you can drag it.</p>':'')
      +'<div class="cont"><button type="button" class="btn pri" data-go="'+(last>=1&&last<=N?last:1)+'">'+(last>=1&&last<=N?'Continue at page '+last:'Start at page 1')+' →</button>'
      +'<span class="small">← and → turn the page. On a phone, swipe.</span></div>'
      +'<ol class="toc">'+PAGES.map(function(P){var n=ideasOf(P).length,k=knownIn(P);
        return '<li><button type="button" data-go="'+P.n+'"><span class="no">'+P.n+'</span><span><span class="k">'+esc(P.kicker)+'</span><span class="t">'+esc(P.title)+'</span>'
          +'<span class="bs">'+P.boards.map(function(b){return esc(B[b].title);}).join(" · ")+'</span></span>'
          +'<span class="c">'+n+' ideas'+(k?' · <i>'+k+' ✓</i>':'')+'</span><span class="prog" aria-hidden="true"><i style="width:'+Math.round(100*k/n)+'%"></i></span></button></li>';}).join("")+'</ol>';
  }
  function item(bid,i){
    var x=B[bid].ideas[i], k=bid+":"+i;
    if(x.big)return '<div class="it ez'+(KNOW[k]?' known':'')+'" data-k="'+k+'">'
      +'<button type="button" class="kn" aria-pressed="'+(KNOW[k]?'true':'false')+'" aria-label="I know this idea" title="I know this">✓</button>'
      +'<div class="ezb"><button type="button" class="tt" aria-expanded="false"><b>'+x.big+'</b></button><div class="ezx">'+x.html+'</div></div>'
      +'<button type="button" class="xp" aria-expanded="false">Textbook version <span aria-hidden="true">▾</span></button>'
      +'</div>';
    return '<div class="it'+(KNOW[k]?' known':'')+'" data-k="'+k+'">'
      +'<button type="button" class="kn" aria-pressed="'+(KNOW[k]?'true':'false')+'" aria-label="I know this idea" title="I know this">✓</button>'
      +'<button type="button" class="tt" aria-expanded="false">'+x.lead+'</button>'
      +'<div class="fx">'+x.f+'</div>'
      +(x.eg?'<div class="eg"><b>e.g.</b> '+x.eg+'</div>':'')
      +'<button type="button" class="xp" aria-expanded="false">Explain <span aria-hidden="true">▾</span></button>'
      +'</div>';
  }
  function board(bid){
    var b=B[bid];
    return '<section class="board" id="'+bid+'"><div class="bhd"><h2>'+b.title+'</h2><span class="tag">'+esc(b.tag)+'</span>'
      +(b.tk?'':'<button type="button" class="live" data-live="'+bid+'">Move the board ⤢</button>')+'</div>'
      +(b.svg&&b.tk?'<figure class="fig">'+b.svg+'<figcaption>'+b.cap+'</figcaption></figure>':'')
      +(b.svg&&!b.tk?'<figure class="fig">'+b.svg+'<figcaption><span class="off">The board as it opens. In KMF Quant, chapter '+D.chap+', you can drag it.</span><span class="on">The board as it opens. Press <b>Move the board</b> to drag it.</span></figcaption></figure>':'')
      +(b.note?'<div class="carry"><b class="lb">Carry this away</b>'+b.note+'</div>':'')
      +(!b.tk&&b.fm&&b.fm.length?'<p class="fmrow"><b class="lb">Formula cards for this board</b>'+b.fm.map(function(n){return '<button type="button" class="chip" data-fm="'+esc(n)+'">'+esc(n)+'</button>';}).join("")+'<span class="offk">These cards are in KMF Quant, chapter 11.</span></p>':'')
      +b.ideas.map(function(x,i){return item(bid,i);}).join("")
      +(b.tries&&b.tries.length?'<details class="try"><summary>Things to try on the live board ('+b.tries.length+')</summary><ul>'+b.tries.map(function(t){return '<li>'+t+'</li>';}).join("")+'</ul></details>':'')
      +'</section>';
  }
  function page(n){
    var P=PAGES[n-1], all=ideasOf(P), k=knownIn(P);
    var h='<div class="rhead"><span>'+esc(D.title)+'</span><span>'+esc(P.kicker)+'</span></div>'
      +'<h1>'+esc(P.title)+'</h1><p class="deck">'+esc(P.deck)+'</p>'
      +'<p class="meta">'+P.boards.length+' board'+(P.boards.length>1?'s':'')+' · '+all.length+' ideas · '+k+' ticked'+(st.hide&&k?' and hidden':'')+'</p>';
    h+=P.boards.map(board).join("");
    h+='<div class="endmatter"><p>End of page '+n+'. Match each idea to its formula.</p><div class="acts">'
      +'<button type="button" class="btn pri" data-quiz="5">5 questions</button><button type="button" class="btn" data-quiz="all">All '+all.length+'</button></div></div>';
    var prev=n>1?PAGES[n-2]:null, next=n<N?PAGES[n]:null;
    h+='<nav class="foot" aria-label="Turn the page">'
      +'<button type="button" class="nav" data-go="'+(n-1)+'"><b>← '+(prev?'Page '+prev.n:'Contents')+'</b>'+(prev?esc(prev.title):'All '+N+' pages')+'</button>'
      +'<span class="folio">'+n+'</span>'
      +(next?'<button type="button" class="nav next" data-go="'+next.n+'"><b>Page '+next.n+' →</b>'+esc(next.title)+'</button>':'<button type="button" class="nav next" data-go="0"><b>Contents →</b>Back to the start</button>')
      +'</nav>';
    return h;
  }
  function meta(){var m=sheet.querySelector(".meta");if(m&&st.page>0){var P=PAGES[st.page-1],k=knownIn(P);
    m.textContent=P.boards.length+' board'+(P.boards.length>1?'s':'')+' · '+ideasOf(P).length+' ideas · '+k+' ticked'+(st.hide&&k?' and hidden':'');}}
  function render(dir){
    sheet.innerHTML=st.page===0?toc():page(st.page);
    sheet.classList.remove("turn"); void sheet.offsetWidth; sheet.style.setProperty("--dx",(dir||0)<0?"-10px":"10px"); sheet.classList.add("turn");
    bar();
  }
  function go(n){
    n=Math.max(0,Math.min(N,n)); if(n===st.page)return;
    var dir=n>st.page?1:-1; st.page=n; if(n>0)V.page=n; keep(); render(dir);
    try{window.scrollTo(0,0);}catch(e){}
  }
  function setKnown(k,on){
    if(on)KNOW[k]=1;else delete KNOW[k]; save("kmf.cb.known",KNOW);
    var el=sheet.querySelector('.it[data-k="'+k+'"]');
    if(el){el.classList.toggle("known",on);el.querySelector(".kn").setAttribute("aria-pressed",String(on));}
    meta(); bar();
  }

  function panel(k){
    var bid=k.split(":")[0], b=B[bid], x=idea(k), S=(D.secs||{})[b.sec], h='';
    if(x.big){h+='<div class="pp"><b class="lb">The textbook wording</b>'+x.lead+' '+(x.rest||'')+'</div>'
      +'<div class="pp"><b class="lb">Formula</b><i>'+x.f+'</i></div>'+(x.eg?'<div class="pp"><b class="lb">Example</b>'+x.eg+'</div>':'');}
    else h+='<div class="pp"><b class="lb">In plain words</b>'+(x.plain||x.rest||'')+'</div>';
    if(!x.big&&x.steps&&x.steps.length)h+='<div class="pp"><b class="lb">Worked example, step by step</b><ol class="steps">'+x.steps.map(function(s){return '<li>'+s+'</li>';}).join("")+'</ol></div>';
    if(!x.big&&x.plain&&x.rest)h+='<div class="pp"><b class="lb">More detail</b>'+x.rest+'</div>';
    if(x.trap)h+='<div class="pp warn"><b class="lb">Watch out</b>'+x.trap+'</div>';
    var go=[];
    if(x.fmn)go.push('<button type="button" class="chip" data-fm="'+esc(x.fmn)+'">Formula card: '+esc(x.fmn)+' ⤢</button>');
    if(!b.tk)go.push('<button type="button" class="chip" data-live="'+bid+'">Move the live board ⤢</button>');
    if(S)go.push('<button type="button" class="chip" data-ch="'+S[0]+'">Practice problems: chapter '+S[1]+', '+esc(S[2])+' ⤢</button>');
    h+='<div class="pp go"><b class="lb">Go deeper</b><span class="onk">'+go.join("")+'</span>'
      +'<span class="offk">In KMF Quant: '+(x.fmn?'the formula card “'+esc(x.fmn)+'” in chapter 11, ':'')+(!b.tk?'the live board in chapter 25, ':'')+(S?'and the practice problems in chapter '+S[1]+', '+esc(S[2])+'.':'')+'</span></div>';
    return h;
  }
  sheet.addEventListener("click",function(e){
    var t=e.target;
    var g=t.closest("[data-go]"); if(g){go(+g.getAttribute("data-go"));return;}
    var q=t.closest("[data-quiz]"); if(q){quiz(q.getAttribute("data-quiz"));return;}
    var lv=t.closest("[data-live]"); if(lv){try{parent.postMessage({kmfcb:lv.getAttribute("data-live")},"*");}catch(err){}return;}
    var fm=t.closest("[data-fm]"); if(fm){try{parent.postMessage({kmffm:fm.getAttribute("data-fm")},"*");}catch(err){}return;}
    var ch=t.closest("[data-ch]"); if(ch){try{parent.postMessage({kmfgo:ch.getAttribute("data-ch")},"*");}catch(err){}return;}
    var it=t.closest(".it"); if(!it)return; var k=it.getAttribute("data-k");
    if(t.closest(".kn")){setKnown(k,!KNOW[k]);return;}
    if(st.mode==="cover"&&!it.classList.contains("shown")&&(t.closest(".fx")||t.closest(".eg")||t.closest(".more")||t.closest(".ezx"))){it.classList.add("shown");return;}
    if(t.closest(".tt")||t.closest(".fx")||t.closest(".xp")){
      var m=it.querySelector(".more"), b=it.querySelector(".tt"), xb=it.querySelector(".xp");
      if(m){m.remove();it.classList.remove("open");b.setAttribute("aria-expanded","false");xb.setAttribute("aria-expanded","false");return;}
      if(t.closest(".xp"))it.classList.add("shown");
      m=document.createElement("div"); m.className="more"; m.innerHTML=panel(k); it.appendChild(m); it.classList.add("open");
      b.setAttribute("aria-expanded","true"); xb.setAttribute("aria-expanded","true");
    }
  });

  /* ---- the formula check: the idea is the question, its formula is the answer ---- */
  var Q=null;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x;}return a;}
  function plain(h){var d=document.createElement("div");d.innerHTML=h;return d.textContent.replace(/\s+/g," ").trim();}
  function quiz(how){
    var P=PAGES[st.page-1], pool=shuffle(ideasOf(P).slice());
    if(how!=="all")pool=pool.slice(0,5);
    var forms=ideasOf(P).map(function(k){return {k:k,f:idea(k).f,p:plain(idea(k).f)};});
    Q={list:pool.map(function(k){
      var right=idea(k), seen={}; seen[plain(right.f)]=1;
      var other=shuffle(forms.filter(function(x){return x.k.split(":")[0]===k.split(":")[0]&&x.k!==k;}))
        .concat(shuffle(forms.filter(function(x){return x.k.split(":")[0]!==k.split(":")[0];})));
      var picks=[];
      other.forEach(function(x){if(picks.length<3&&!seen[x.p]){seen[x.p]=1;picks.push(x.f);}});
      var ch=shuffle([right.f].concat(picks));
      return {k:k,ch:ch,ri:ch.indexOf(right.f)};
    }),i:0,picked:null,right:0,missed:[],back:document.activeElement};
    qz.hidden=false; drawQ();
  }
  function drawQ(){
    if(Q.i>=Q.list.length){
      var n=Q.list.length;
      qzp.innerHTML='<div class="qzh"><span id="qzTitle">Page '+st.page+' check · done</span><button type="button" class="btn" data-q="close">Close</button></div>'
        +'<p class="score">'+Q.right+' of '+n+'</p>'
        +(Q.missed.length?'<p class="small">Go back over these. Any you had ticked are un-ticked again:</p><ul class="missed">'+Q.missed.map(function(k){return '<li>'+(idea(k).big||idea(k).lead)+'</li>';}).join("")+'</ul>'
          :'<p class="small">Every one right. Tick the ideas you are sure of so they can be hidden.</p>')
        +'<div class="row"><button type="button" class="btn" data-q="again">Another 5</button><button type="button" class="btn pri" data-q="close">Back to the page</button></div>';
      qzp.querySelector('[data-q="close"]').focus(); return;
    }
    var it=Q.list[Q.i], x=idea(it.k), b=B[it.k.split(":")[0]];
    qzp.innerHTML='<div class="qzh"><span id="qzTitle">Page '+st.page+' check · question '+(Q.i+1)+' of '+Q.list.length+'</span><button type="button" class="btn" data-q="close">Close</button></div>'
      +'<span class="tag">'+b.title+'</span><div class="q">'+(x.big&&x.big.indexOf("=")<0?x.big:x.lead)+'</div><p class="ask">Which formula goes with it?</p>'
      +'<div class="ch">'+it.ch.map(function(f,i){return '<button type="button" data-i="'+i+'"><span class="lt">'+LET[i]+'</span><span class="ft">'+f+'</span></button>';}).join("")+'</div>'
      +'<div id="qzWhy"></div>';
    var first=qzp.querySelector(".ch button"); if(first)first.focus();
  }
  qzp.addEventListener("click",function(e){
    var a=e.target.closest("[data-q]");
    if(a){var act=a.getAttribute("data-q");
      if(act==="close"){closeQ();return;}
      if(act==="next"){Q.i++;Q.picked=null;drawQ();return;}
      if(act==="again"){closeQ();quiz("5");return;}
    }
    var b=e.target.closest(".ch button"); if(!b||Q.picked!=null)return;
    var it=Q.list[Q.i],i=+b.getAttribute("data-i"); Q.picked=i;
    qzp.querySelectorAll(".ch button").forEach(function(o,j){o.disabled=true;o.classList.toggle("right",j===it.ri);o.classList.toggle("wrong",j===i&&i!==it.ri);});
    if(i===it.ri)Q.right++; else {Q.missed.push(it.k); if(KNOW[it.k])setKnown(it.k,false);}
    var x=idea(it.k);
    document.getElementById("qzWhy").innerHTML='<div class="why"><b>'+(i===it.ri?'Right. ':'It is '+x.f+'. ')+'</b>'+(x.rest||"")+'</div>'
      +'<div class="row"><button type="button" class="btn pri" data-q="next">'+(Q.i+1<Q.list.length?'Next question →':'See the result')+'</button></div>';
    qzp.querySelector('[data-q="next"]').focus();
  });
  function closeQ(){qz.hidden=true; var b=Q&&Q.back; Q=null; if(b&&b.focus)b.focus();}
  qz.addEventListener("click",function(e){if(e.target===qz)closeQ();});

  pager.addEventListener("click",function(e){var b=e.target.closest("[data-p]");if(b)go(+b.getAttribute("data-p"));});
  document.getElementById("tocBtn").addEventListener("click",function(){go(0);});
  document.getElementById("modeRead").addEventListener("click",function(){st.mode="read";keep();sheet.querySelectorAll(".it.shown").forEach(function(x){x.classList.remove("shown");});bar();});
  document.getElementById("modeCover").addEventListener("click",function(){st.mode="cover";keep();sheet.querySelectorAll(".it.shown").forEach(function(x){x.classList.remove("shown");});bar();});
  document.getElementById("hideBtn").addEventListener("click",function(){st.hide=!st.hide;keep();bar();meta();});
  document.getElementById("sizeBtn").addEventListener("click",function(){st.size=(st.size+1)%3;keep();bar();});
  document.addEventListener("keydown",function(e){
    if(!qz.hidden){if(e.key==="Escape")closeQ();return;}
    var tg=e.target&&e.target.tagName; if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT"||e.altKey||e.ctrlKey||e.metaKey)return;
    if(e.key==="ArrowRight"){go(st.page+1);e.preventDefault();}
    else if(e.key==="ArrowLeft"){go(st.page-1);e.preventDefault();}
  });
  var tx=null,ty=0;
  sheet.addEventListener("touchstart",function(e){if(e.touches.length!==1||e.target.closest(".fig,.more,details")){tx=null;return;}tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  sheet.addEventListener("touchend",function(e){if(tx==null)return;var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;tx=null;
    if(Math.abs(dx)>70&&Math.abs(dy)<45)go(st.page+(dx<0?1:-1));},{passive:true});

  /* inside KMF Quant the page around this one answers, and the live boards can be opened from here */
  window.addEventListener("message",function(e){
    if(e.source!==window.parent||window.parent===window)return; var d=e.data; if(!d)return; if(typeof d.kmfGo==="number"){go(d.kmfGo);return;} if(!d.kmfHost||HOST)return;
    HOST=true; document.documentElement.classList.add("inkmf"); if(st.page===0)render(0);
  });

  render(0);
})();
</script>

</body>
</html>
