t-size:12px\">k = 6 is even: 3 and 3<\/text><\/svg>","sec":"num","fm":["Sum of a run of consecutive integers","Counting integers in an inclusive range","Multiples of k in a range","The division algorithm","Remainders of a sum and a product","Sum of an arithmetic sequence"]},"cb_divisors":{"title":"A number broken into primes","tag":"Number","say":"Set a number N and every divisor it has fills a grid. There is one row for each power of 2 and one column for each odd divisor. Drag the red ring onto any divisor to see its partner and the divisors that are its multiples. The other two buttons bring in a second number M, for the GCF, the LCM and the fraction N/M.","note":"","tries":["Set N to 90. The grid has 2 rows and 6 columns, so 12 divisors, which is (1 + 1)(2 + 1)(1 + 1). Now set N to 180, one more 2. A whole new row appears and the count jumps to 18.","Set N to 36 and drag the red ring onto 6. It is its own partner, so the count is 9, an odd number. Every perfect square does this, and no other number does.","Compare N = 30 with N = 20. 30 ties with 4 odd and 4 even divisors. 20 has 2 odd and 4 even. Only the number of 2s decides it.","Press <b>two numbers<\/b> and set N = 36 and M = 60. The GCF is 12, the LCM is 180, and 12 × 180 = 36 × 60. Then try 35 and 37: they share no prime, so the LCM is the full product, 1295.","Press <b>the fraction N/M<\/b> with N = 35 and M = 100. The GCF is 5, so it cuts to 7/20 and stops at 0.35. Then set N = 36 and M = 99: it cuts to 4/11, an 11 sits underneath, and 36 repeats for ever.","In the same view set N = 17 and M = 10. Read the stack from the bottom: 2 + 1/3 = 7/3, flip it to 3/7 and add 1, flip again and add 1. You land on 17/10."],"ideas":[{"lead":"<b>Break the number into primes first.<\/b>","rest":"Every question about divisors, the GCF or the LCM is read off the exponents. A count of different prime factors ignores the exponents, so a big number can have very few.","f":"360 = 2³ × 3² × 5 has 3 different primes · 500 = 2² × 5³ has 2","plain":"Write the number as primes multiplied together (a factor tree). Almost every divisor question is easy once you have this.","steps":["360 = 36 × 10 = (2² × 3²) × (2 × 5)","= 2³ × 3² × 5","different primes: 2, 3 and 5 → three"],"big":"First, break the number into primes. Then every divisor question gets easy.","html":"<p>A <b>prime<\/b> is a number that only 1 and itself divide (2, 3, 5, 7, …). “Break into primes” means write the number as primes multiplied together.<\/p><div class=\"ex\"><b>Example:<\/b> 360<ol><li>360 = 36 × 10<\/li><li>= (2² × 3²) × (2 × 5)<\/li><li>= <b>2³ × 3² × 5<\/b><\/li><li>Different primes: 2, 3 and 5 → <b>three<\/b><\/li><\/ol><\/div><p>The small raised numbers are <b>powers<\/b> (how many times each prime is used). Divisors, GCF and LCM are all read from them.<\/p><p class=\"warn\">⚠️ “How many <b>different<\/b> primes” ignores the powers. 500 = 2² × 5³ is big but has only <b>2<\/b> different primes.<\/p>"},{"lead":"<b>The number of divisors is the product of each exponent plus one.<\/b>","rest":"A divisor chooses how many of each prime to take, from none up to all of them. So the choices multiply. Exactly 2 divisors means a prime, and exactly 3 means a prime squared.","f":"90 = 2 × 3² × 5 → (1 + 1)(2 + 1)(1 + 1) = 12","eg":"12 = 2² × 3 → (2 + 1)(1 + 1) = 6 divisors: 1, 2, 3, 4, 6, 12","plain":"To count how many numbers divide N: write N in primes, add 1 to each power, and multiply. The +1 is there because you can use each prime 0 times, 1 time, … up to all of them.","steps":["12 = 2² × 3¹","powers + 1: (2 + 1) and (1 + 1)","3 × 2 = 6 divisors: 1, 2, 3, 4, 6, 12"],"big":"To count the divisors of a number, use 3 steps.","html":"<div class=\"ex\"><b>Example:<\/b> how many numbers divide 12 exactly?<ol><li><b>Break into primes:<\/b> 12 = 2 × 2 × 3 = 2² × 3¹<\/li><li><b>Add 1 to each small power:<\/b> 2 + 1 = 3 and 1 + 1 = 2<\/li><li><b>Multiply:<\/b> 3 × 2 = <b>6 divisors<\/b><\/li><\/ol>Check: 1, 2, 3, 4, 6, 12 → 6 ✅<\/div><p class=\"why\"><b>Why it works:<\/b> a divisor picks how many of each prime to use, from none up to all. 2² gives 3 choices (0, 1 or 2 twos), so the choices multiply.<\/p><p class=\"tip\">💡 <b>Shortcut:<\/b> exactly 2 divisors means a <b>prime<\/b> (7 → 1, 7). Exactly 3 divisors means a <b>prime squared<\/b> (9 → 1, 3, 9).<\/p>"},{"lead":"<b>Divisors come in pairs that multiply to N.<\/b>","rest":"So the count is even, unless one divisor is its own partner. That only happens at √N, so an odd count means N is a perfect square. In primes, a square has every exponent even and a cube has every exponent a multiple of 3.","f":"d × (N/d) = N · 36 = 2² × 3², 9 divisors · a square and a cube: 64 = 2⁶","eg":"36: 1 × 36, 2 × 18, 3 × 12, 4 × 9, 6 × 6. That is 9 divisors, odd because 6 pairs with itself","plain":"Divisors come in partners that multiply to the number, so the count is usually even. A perfect square has one divisor that partners with itself, so its count is odd.","steps":["12: 1 × 12, 2 × 6, 3 × 4 → 6 divisors (even)","36: 1 × 36, 2 × 18, 3 × 12, 4 × 9, 6 × 6 → 9 divisors (odd, because 36 = 6 × 6)"],"big":"Divisors come in pairs. An odd number of divisors means a perfect square.","html":"<p>Each divisor has a partner, and the two multiply to the number.<\/p><ul><li>So the count of divisors is usually <b>even<\/b>.<\/li><li>A <b>perfect square<\/b> (like 36 = 6 × 6) has one divisor that partners with itself. So its count is <b>odd<\/b>.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b><ol><li>12: 1 × 12, 2 × 6, 3 × 4 → 6 divisors (even)<\/li><li>36: 1 × 36, 2 × 18, 3 × 12, 4 × 9, 6 × 6 → <b>9 divisors<\/b> (odd, because 6 pairs with itself) ✅<\/li><\/ol><\/div><p class=\"tip\">💡 In primes, a square has all <b>even<\/b> powers: 36 = 2² × 3². A cube has all powers that divide by 3. 64 = 2⁶ is both a square (8 × 8) and a cube (4 × 4 × 4).<\/p>"},{"lead":"<b>The odd divisors fill the top row, and every power of 2 adds a row the same size.<\/b>","rest":"Write N = 2ᵃ × m with m odd. The odd divisors are the divisors of m, and there are a times as many even ones. Even divisors beat odd ones exactly when 4 divides N.","f":"20 = 2² × 5: odd 1, 5 · even 2, 4, 10, 20","plain":"Split N into its 2s and its odd part. The odd divisors are the divisors of the odd part. Multiply each of them by 2, by 4, … to get the even divisors.","steps":["20 = 2² × 5, so the odd part is 5","odd divisors: 1, 5","× 2: 2, 10 · × 4: 4, 20 → 4 even divisors"],"big":"Pull out the 2s first. The odd divisors come from what is left.","html":"<p>Write the number as (its 2s) × (an odd part). Example: 20 = 2² × 5, so the odd part is 5.<\/p><ul><li>The <b>odd divisors<\/b> are the divisors of the odd part.<\/li><li>Multiply each odd divisor by 2, by 4, … to get the <b>even divisors<\/b>.<\/li><li>If the number has a twos, there are a times as many even divisors as odd ones.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> 20 = 2² × 5<ol><li>Odd divisors: 1, 5<\/li><li>× 2: 2, 10. × 4: 4, 20<\/li><li><b>2 odd<\/b> and <b>4 even<\/b> divisors (2 twos → 2 × 2 = 4) ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Even divisors outnumber odd ones exactly when 4 divides the number (at least two 2s).<\/p>"},{"lead":"<b>To count the divisors that are multiples of k, put k in first.<\/b>","rest":"Then count the divisors of what is left, N ÷ k. Every such divisor is k times a divisor of N/k.","f":"divisors of 90 that are multiples of 5 = divisors of 18 = 6","plain":"How many divisors of N are multiples of k? Divide N by k, then count the divisors of what is left.","steps":["divisors of 90 that are multiples of 5","90 ÷ 5 = 18, and 18 has 6 divisors: 1, 2, 3, 6, 9, 18","times 5: 5, 10, 15, 30, 45, 90 → 6"],"big":"To count divisors that are multiples of k, divide by k first.","html":"<p>A <b>multiple<\/b> of 5 is 5 × a whole number (5, 10, 15, …).<\/p><ul><li>Every divisor of N (the number) that is a multiple of k is k × (a divisor of N ÷ k).<\/li><li>So just count the divisors of N ÷ k.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> how many divisors of 90 are multiples of 5?<ol><li>90 ÷ 5 = 18<\/li><li>18 has 6 divisors: 1, 2, 3, 6, 9, 18<\/li><li>Times 5: 5, 10, 15, 30, 45, 90 → <b>6<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Count fast with primes: 18 = 2 × 3², so (1 + 1)(2 + 1) = 6.<\/p>"},{"lead":"<b>The GCF takes the smaller exponent of each prime, and the LCM takes the larger.<\/b>","rest":"GCF means greatest common factor and LCM means least common multiple. A prime missing from one number has exponent 0 there. Every common multiple is a multiple of the LCM.","f":"36 = 2² × 3², 60 = 2² × 3 × 5 → GCF = 12, LCM = 180 · divisible by 8 and by 12 → a multiple of 24","plain":"GCF is the biggest number that divides both. LCM is the smallest number that both divide into. In prime form the GCF takes the smaller power of each prime and the LCM takes the bigger.","steps":["12 = 2² × 3 and 18 = 2 × 3²","GCF: 2¹ × 3¹ = 6","LCM: 2² × 3² = 36"],"big":"GCF takes the smaller powers. LCM takes the bigger powers.","html":"<p><b>First, the meanings:<\/b><\/p><ul><li><b>GCF<\/b> (greatest common factor) is the biggest number that divides both.<\/li><li><b>LCM<\/b> (least common multiple) is the smallest number that both divide into.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> 12 and 18<ol><li>Break into primes: 12 = 2² × 3, and 18 = 2 × 3²<\/li><li><b>GCF:<\/b> take the <b>smaller<\/b> power of each prime: 2¹ × 3¹ = <b>6<\/b><\/li><li><b>LCM:<\/b> take the <b>bigger<\/b> power of each prime: 2² × 3² = <b>36<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ A prime missing from one number has power 0 there. 36 = 2² × 3² and 60 = 2² × 3 × 5 → GCF = 2² × 3 = 12 (no 5), LCM = 2² × 3² × 5 = 180.<\/p><p class=\"tip\">💡 Every common multiple is a multiple of the LCM. Divisible by 8 and by 12 → divisible by 24.<\/p>"},{"lead":"<b>The GCF times the LCM is the two numbers multiplied.<\/b>","rest":"Each prime gives its smaller exponent to one and its larger to the other. So the LCM is the full product exactly when the two share no prime. Two consecutive odd numbers never share one.","f":"GCF × LCM = N × M · 12 × 180 = 36 × 60","eg":"GCF(4, 6) × LCM(4, 6) = 2 × 12 = 24 = 4 × 6","plain":"For two numbers, GCF × LCM always equals the two numbers multiplied together. Use it to find one when you know the other.","steps":["12 and 18: GCF 6, LCM 36","6 × 36 = 216","12 × 18 = 216 ✓"],"big":"GCF × LCM = the two numbers multiplied together.","html":"<ul><li><b>GCF<\/b> (greatest common factor) is the biggest number that divides both.<\/li><li><b>LCM<\/b> (least common multiple) is the smallest number both divide into.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> 12 and 18<ol><li>GCF = 6 and LCM = 36<\/li><li>6 × 36 = 216<\/li><li>12 × 18 = 216 ✅<\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> for each prime, the GCF takes the smaller power and the LCM takes the bigger. Together they hold both powers, just like the two numbers do.<\/p><p class=\"tip\">💡 If two numbers share no prime, the LCM is just their product. Two odd numbers in a row, like 7 and 9, never share a prime → LCM = 63.<\/p>"},{"lead":"<b>A factor of both numbers divides their difference and every total built from them.<\/b>","rest":"That is how the GCF is found by division. Divide the larger by the smaller, then the smaller by the remainder, and repeat. The divisor in the line that leaves 0 is the GCF.","f":"g divides N and M → g divides N − M and xN + yM","eg":"3 divides 12 and 21, so 3 divides 21 − 12 = 9 and 2 × 12 + 21 = 45","plain":"If a number divides both A and B, it also divides A − B and A + B. That gives a fast way to find the GCF: divide, keep the remainder, and repeat.","steps":["GCF of 84 and 36","84 ÷ 36 = 2 remainder 12","36 ÷ 12 = 3 remainder 0 → GCF = 12"],"big":"A number that divides both A and B also divides A − B and A + B.","html":"<ul><li>3 divides 12 and 21. So 3 divides 21 − 12 = 9 and 12 + 21 = 33.<\/li><li>It also divides mixes like 2 × 12 + 21 = 45.<\/li><\/ul><p><b>Fast way to find the GCF<\/b> (the biggest number that divides both): divide the bigger by the smaller. Then divide the smaller by the remainder (what is left over). Repeat until the remainder is 0. The last number you divided by is the GCF.<\/p><div class=\"ex\"><b>Example:<\/b> GCF of 84 and 36<ol><li>84 ÷ 36 = 2, remainder 12<\/li><li>36 ÷ 12 = 3, remainder 0<\/li><li>GCF = <b>12<\/b> ✅ (84 = 12 × 7 and 36 = 12 × 3)<\/li><\/ol><\/div>"},{"lead":"<b>Cutting N/M to lowest terms leaves M ÷ GCF underneath.<\/b>","rest":"So a reduced bottom is a fact about a GCF. r percent is r/100, and it cuts down to something over 20 exactly when the GCF of r and 100 is 5.","f":"35/100 = 7/20 · 15% = 3/20, so the class is a multiple of 20","plain":"Simplifying a fraction divides the top and the bottom by their GCF. So the new bottom is the old bottom ÷ GCF.","steps":["35/100: GCF(35, 100) = 5","35 ÷ 5 = 7 and 100 ÷ 5 = 20 → 7/20","so if 35% of a class are boys, the class size is a multiple of 20"],"big":"When you simplify a fraction, the new bottom = old bottom ÷ GCF.","html":"<p>To simplify, divide the top and the bottom by their GCF (the biggest number that divides both).<\/p><div class=\"ex\"><b>Example:<\/b> 35% of a class are boys. What size can the class be?<ol><li>35% = 35/100<\/li><li>GCF(35, 100) = 5<\/li><li>35 ÷ 5 = 7 and 100 ÷ 5 = 20 → 35/100 = <b>7/20<\/b><\/li><li>Boys = 7/20 of the class, and that must be a whole number. So the class size is a <b>multiple of 20<\/b> (20, 40, 60, …).<\/li><\/ol><\/div><p class=\"tip\">💡 15% = 15/100 = 3/20 too, so again the class is a multiple of 20. A percent r% simplifies to something over 20 exactly when GCF(r, 100) = 5.<\/p>"},{"lead":"<b>A fraction in lowest terms stops as a decimal exactly when its bottom has no prime but 2 and 5.<\/b>","rest":"Any other prime makes it repeat. A block that repeats from the decimal point is that block over the same number of nines.","f":"7/40 = 0.175 · 0.3636… = 36/99 = 4/11","eg":"1/8 = 0.125 stops · 1/6 = 0.1666… never stops (6 has a 3)","plain":"Simplify the fraction first. If the bottom is made only of 2s and 5s, the decimal stops. Any other prime (3, 7, 11, …) makes it repeat forever.","steps":["7/40: 40 = 2³ × 5 → it stops: 0.175","1/6: 6 = 2 × 3 has a 3 → 0.1666… repeats","1/12: 12 = 2² × 3 → repeats"],"big":"A fraction's decimal stops only when the bottom has just 2s and 5s.","html":"<p>First simplify the fraction. Then break the bottom into primes.<\/p><ul><li>Only 2s and 5s → the decimal <b>stops<\/b>.<\/li><li>Any other prime (3, 7, 11, …) → the decimal <b>repeats forever<\/b>.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b><ol><li>7/40: 40 = 2³ × 5 → stops: <b>0.175<\/b> ✅<\/li><li>1/6: 6 = 2 × 3 has a 3 → <b>0.1666…<\/b> repeats<\/li><li>1/12: 12 = 2² × 3 → repeats (0.08333…)<\/li><\/ol><\/div><p class=\"tip\">💡 A block that repeats right after the decimal point = that block over the same number of 9s. 0.3636… = 36/99 = <b>4/11<\/b>.<\/p><p class=\"warn\">⚠️ Simplify first. 3/6 has a 3 below, but 3/6 = 1/2 = 0.5 stops.<\/p>"},{"lead":"<b>Each zero at the end of a number is a 2 paired with a 5.<\/b>","rest":"Count the 2s and the 5s in the primes, and the smaller count is the number of zeros. Rewrite hidden 2s first: 4ᵏ is 2²ᵏ.","f":"zeros = the smaller of (2s, 5s) · 4¹⁰⁰ × 5⁹⁹ ends in 99 zeros","eg":"1,000 = 2³ × 5³: three 2-and-5 pairs, three zeros","plain":"A zero at the end of a number comes from a 10, and 10 = 2 × 5. Count the 2s and the 5s: the smaller count is the number of zeros.","steps":["2⁴ × 5³ = 2 × (2³ × 5³) = 2 × 1,000","2s: 4, 5s: 3 → 3 zeros","check: 16 × 125 = 2,000 ✓"],"big":"Each zero at the end of a number is one 2 paired with one 5.","html":"<p>10 = 2 × 5, and every zero at the end comes from a 10.<\/p><ul><li>Count the 2s and the 5s in the primes.<\/li><li>The <b>smaller<\/b> count is the number of zeros at the end.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> 2⁴ × 5³<ol><li>2s: 4. 5s: 3.<\/li><li>Smaller count = 3 → <b>3 zeros<\/b><\/li><li>Check: 16 × 125 = 2,000 ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ Find hidden 2s first. 4 = 2², so 4¹⁰⁰ = 2²⁰⁰. Then 4¹⁰⁰ × 5⁹⁹ has 200 twos and 99 fives → <b>99 zeros<\/b>.<\/p>"},{"lead":"<b>A stacked fraction is worked from the bottom storey up.<\/b>","rest":"Finish each storey into a single fraction, then flip it. Never flip the pieces of a sum one at a time. The quotients from the GCF division build such a stack for N/M.","f":"1 + 1/(1 + 1/(2 + 1/3)) = 17/10 · 1 ÷ (1 + ½) = 2/3","plain":"A fraction inside a fraction: start at the very bottom, make it one fraction, flip it, and move up one level.","steps":["1 ÷ (1 + ½)","bottom first: 1 + ½ = 3/2","1 ÷ 3/2 = 2/3"],"big":"A fraction inside a fraction? Start at the very bottom and work up.","html":"<ul><li>Turn the bottom level into one single fraction.<\/li><li>Flip it: 1 ÷ 3/2 = 2/3.<\/li><li>Move up one level and repeat.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> 1 + 1/(1 + 1/(2 + 1/3))<ol><li>Bottom: 2 + 1/3 = 7/3. Flip: 1 ÷ 7/3 = 3/7<\/li><li>Next: 1 + 3/7 = 10/7. Flip: 1 ÷ 10/7 = 7/10<\/li><li>Top: 1 + 7/10 = <b>17/10<\/b> ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ Never flip the pieces of a sum one at a time. 1 ÷ (1 + ½) = 1 ÷ 3/2 = <b>2/3<\/b>, not 1 + 2 = 3.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><text class=\"slabel  numtxt\" x=\"20\" y=\"30\" text-anchor=\"start\" style=\"font-size:13px;fill:var(--ink)\">N = 90 =<\/text><rect x=\"90.4\" y=\"13\" width=\"21.8\" height=\"23\" rx=\"5\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.4\"><\/rect><text class=\"slabel b numtxt\" x=\"101.3\" y=\"30\" text-anchor=\"middle\" style=\"font-size:13px\">2<\/text><text class=\"slabel \" x=\"120.2\" y=\"30\" text-anchor=\"middle\" style=\"font-size:13px\">×<\/text><rect x=\"128.2\" y=\"13\" width=\"29.6\" height=\"23\" rx=\"5\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.2\"><\/rect><text class=\"slabel  numtxt\" x=\"143\" y=\"30\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--ink)\">3²<\/text><text class=\"slabel \" x=\"165.8\" y=\"30\" text-anchor=\"middle\" style=\"font-size:13px\">×<\/text><rect x=\"173.8\" y=\"13\" width=\"21.8\" height=\"23\" rx=\"5\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.2\"><\/rect><text class=\"slabel  numtxt\" x=\"184.7\" y=\"30\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--ink)\">5<\/text><text class=\"slabel a numtxt\" x=\"622\" y=\"30\" text-anchor=\"end\" style=\"font-size:12.5px;font-weight:600\">different primes: 3<\/text><text class=\"slabel  numtxt\" x=\"20\" y=\"48\" text-anchor=\"start\" style=\"font-size:10.5px;fill:var(--ink-3)\">N = 2ᵃ × m with m odd: 90 = 2¹ × 45, so a = 1 and m = 45<\/text><text class=\"slabel a numtxt\" x=\"92\" y=\"61\" text-anchor=\"end\" style=\"font-size:10.5px\">m = 45<\/text><text class=\"slabel a numtxt\" x=\"130.83\" y=\"61\" text-anchor=\"middle\" style=\"font-size:11px\">1<\/text><text class=\"slabel a numtxt\" x=\"192.5\" y=\"61\" text-anchor=\"middle\" style=\"font-size:11px\">3<\/text><text class=\"slabel a numtxt\" x=\"254.17\" y=\"61\" text-anchor=\"middle\" style=\"font-size:11px\">5<\/text><text class=\"slabel a numtxt\" x=\"315.83\" y=\"61\" text-anchor=\"middle\" style=\"font-size:11px\">9<\/text><text class=\"slabel a numtxt\" x=\"377.5\" y=\"61\" text-anchor=\"middle\" style=\"font-size:11px\">15<\/text><text class=\"slabel a numtxt\" x=\"439.17\" y=\"61\" text-anchor=\"middle\" style=\"font-size:11px\">45<\/text><text class=\"slabel a numtxt\" x=\"92\" y=\"89\" text-anchor=\"end\" style=\"font-size:11px\">× 1<\/text><rect x=\"101.5\" y=\"68.5\" width=\"58.67\" height=\"33\" rx=\"4\" style=\"fill:var(--amber);fill-opacity:.14;stroke:var(--amber);stroke-width:1;stroke-opacity:.6\"><\/rect><text class=\"slabel  numtxt\" x=\"130.83\" y=\"89.5\" text-anchor=\"middle\" style=\"font-size:12.5px;fill:var(--ink)\">1<\/text><rect x=\"163.17\" y=\"68.5\" width=\"58.67\" height=\"33\" rx=\"4\" style=\"fill:var(--amber);fill-opacity:.14;stroke:var(--amber);stroke-width:1;stroke-opacity:.6\"><\/rect><text class=\"slabel  numtxt\" x=\"192.5\" y=\"89.5\" text-anchor=\"middle\" style=\"font-size:12.5px;fill:var(--ink)\">3<\/text><rect x=\"224.83\" y=\"68.5\" width=\"58.67\" height=\"33\" rx=\"4\" style=\"fill:var(--amber);fill-opacity:.14;stroke:var(--amber);stroke-width:1;stroke-opacity:.6\"><\/rect><text class=\"slabel  numtxt\" x=\"254.17\" y=\"89.5\" text-anchor=\"middle\" style=\"font-size:12.5px;fill:var(--ink)\">5<\/text><circle cx=\"279\" cy=\"73\" r=\"2.8\" style=\"fill:var(--green)\"><\/circle><rect x=\"286.5\" y=\"68.5\" width=\"58.67\" height=\"33\" rx=\"4\" style=\"fill:var(--amber);fill-opacity:.14;stroke:var(--amber);stroke-width:1;stroke-opacity:.6\"><\/rect><text class=\"slabel  numtxt\" x=\"315.83\" y=\"89.5\" text-anchor=\"middle\" style=\"font-size:12.5px;fill:var(--ink)\">9<\/text><rect x=\"348.17\" y=\"68.5\" width=\"58.67\" height=\"33\" rx=\"4\" style=\"fill:var(--amber);fill-opacity:.14;stroke:var(--amber);stroke-width:1;stroke-opacity:.6\"><\/rect><text class=\"slabel  numtxt\" x=\"377.5\" y=\"89.5\" text-anchor=\"middle\" style=\"font-size:12.5px;fill:var(--ink)\">15<\/text><circle cx=\"402.33\" cy=\"73\" r=\"2.8\" style=\"fill:var(--green)\"><\/circle><rect x=\"409.83\" y=\"68.5\" width=\"58.67\" height=\"33\" rx=\"4\" style=\"fill:var(--amber);fill-opacity:.14;stroke:var(--amber);stroke-width:1;stroke-opacity:.6\"><\/rect><text class=\"slabel  numtxt\" x=\"439.17\" y=\"89.5\" text-anchor=\"middle\" style=\"font-size:12.5px;fill:var(--ink)\">45<\/text><circle cx=\"464\" cy=\"73\" r=\"2.8\" style=\"fill:var(--green)\"><\/circle><text class=\"slabel a\" x=\"476\" y=\"89\" text-anchor=\"start\" style=\"font-size:10.5px\">odd<\/text><text class=\"slabel b numtxt\" x=\"92\" y=\"125\" text-anchor=\"end\" style=\"font-size:11px\">× 2<\/text><rect x=\"101.5\" y=\"104.5\" width=\"58.67\" height=\"33\" rx=\"4\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1;stroke-opacity:.45\"><\/rect><text class=\"slabel  numtxt\" x=\"130.83\" y=\"125.5\" text-anchor=\"middle\" style=\"font-size:12.5px;fill:var(--ink)\">2<\/text><rect x=\"163.17\" y=\"104.5\" width=\"58.67\" height=\"33\" rx=\"4\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1;stroke-opacity:.45\"><\/rect><text class=\"slabel  numtxt\" x=\"192.5\" y=\"125.5\" text-anchor=\"middle\" style=\"font-size:12.5px;fill:var(--ink)\">6<\/text><rect x=\"224.83\" y=\"104.5\" width=\"58.67\" height=\"33\" rx=\"4\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1;stroke-opacity:.45\"><\/rect><text class=\"slabel  numtxt\" x=\"254.17\" y=\"125.5\" text-anchor=\"middle\" style=\"font-size:12.5px;fill:var(--ink)\">10<\/text><circle cx=\"279\" cy=\"109\" r=\"2.8\" style=\"fill:var(--green)\"><\/circle><rect x=\"286.5\" y=\"104.5\" width=\"58.67\" height=\"33\" rx=\"4\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1;stroke-opacity:.45\"><\/rect><text class=\"slabel  numtxt\" x=\"315.83\" y=\"125.5\" text-anchor=\"middle\" style=\"font-size:12.5px;fill:var(--ink)\">18<\/text><rect x=\"348.17\" y=\"104.5\" width=\"58.67\" height=\"33\" rx=\"4\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1;stroke-opacity:.45\"><\/rect><text class=\"slabel  numtxt\" x=\"377.5\" y=\"125.5\" text-anchor=\"middle\" style=\"font-size:12.5px;fill:var(--ink)\">30<\/text><circle cx=\"402.33\" cy=\"109\" r=\"2.8\" style=\"fill:var(--green)\"><\/circle><rect x=\"409.83\" y=\"104.5\" width=\"58.67\" height=\"33\" rx=\"4\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1;stroke-opacity:.45\"><\/rect><text class=\"slabel  numtxt\" x=\"439.17\" y=\"125.5\" text-anchor=\"middle\" style=\"font-size:12.5px;fill:var(--ink)\">90<\/text><circle cx=\"464\" cy=\"109\" r=\"2.8\" style=\"fill:var(--green)\"><\/circle><text class=\"slabel b\" x=\"476\" y=\"125\" text-anchor=\"start\" style=\"font-size:10.5px\">even<\/text><path style=\"fill:none;stroke:var(--amber);stroke-width:1.5\" d=\"M 510 70 q 6 0 6 6 L 516 79 q 0 6 6 6 q -6 0 -6 6 L 516 94 q 0 6 -6 6\"><\/path><text class=\"slabel a numtxt\" x=\"524\" y=\"89\" text-anchor=\"start\" style=\"font-size:11.5px;font-weight:600\">odd: 6<\/text><path style=\"fill:none;stroke:var(--blue);stroke-width:1.5\" d=\"M 510 106 q 6 0 6 6 L 516 115 q 0 6 6 6 q -6 0 -6 6 L 516 130 q 0 6 -6 6\"><\/path><text class=\"slabel b numtxt\" x=\"524\" y=\"125\" text-anchor=\"start\" style=\"font-size:11.5px;font-weight:600\">even: 1 × 6 = 6<\/text><path style=\"fill:none;stroke:var(--red);stroke-width:1.3;stroke-opacity:.8\" d=\"M 262.69 99.49 Q 274.92 120.27 291.84 120.57\"><\/path><ellipse cx=\"315.83\" cy=\"121\" rx=\"24\" ry=\"15.5\" style=\"fill:none;stroke:var(--red);stroke-width:2;stroke-dasharray:4 3\"><\/ellipse><ellipse cx=\"254.17\" cy=\"85\" rx=\"24\" ry=\"15.5\" style=\"fill:none;stroke:var(--red);stroke-width:2.6\"><\/ellipse><circle class=\"handle\" cx=\"254.17\" cy=\"85\" r=\"15.5\" style=\"fill:var(--red);fill-opacity:0;stroke:none\"><\/circle><text class=\"slabel r numtxt\" x=\"285\" y=\"153\" text-anchor=\"middle\" style=\"font-size:11px\">ring 5 × partner 18 = 90 · green dots: the 6 multiples of 5<\/text><text class=\"slabel b numtxt\" x=\"285\" y=\"183\" text-anchor=\"middle\" style=\"font-size:12.5px;font-weight:600\">2 rows × 6 columns = 12 divisors = (1 + 1)(2 + 1)(1 + 1)<\/text><text class=\"slabel b numtxt\" x=\"20\" y=\"339\" text-anchor=\"start\" style=\"font-size:11.5px\">2s<\/text><text class=\"slabel  numtxt\" x=\"20\" y=\"365\" text-anchor=\"start\" style=\"font-size:11.5px;fill:var(--ink)\">5s<\/text><rect x=\"41\" y=\"322\" width=\"26\" height=\"52\" rx=\"5\" style=\"fill:var(--green);fill-opacity:.1;stroke:var(--green);stroke-width:1.5\"><\/rect><line x1=\"54\" y1=\"344\" x2=\"54\" y2=\"352\" style=\"stroke:var(--green);stroke-width:2.5;fill:none\"><\/line><text class=\"slabel g numtxt\" x=\"54\" y=\"387\" text-anchor=\"middle\" style=\"font-size:11px;font-weight:600\">10<\/text><rect x=\"44\" y=\"326\" width=\"20\" height=\"18\" rx=\"4\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.3\"><\/rect><text class=\"slabel b numtxt\" x=\"54\" y=\"339\" text-anchor=\"middle\" style=\"font-size:12px\">2<\/text><rect x=\"44\" y=\"352\" width=\"20\" height=\"18\" rx=\"4\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.2\"><\/rect><text class=\"slabel  numtxt\" x=\"54\" y=\"365\" text-anchor=\"middle\" style=\"font-size:12px;fill:var(--ink)\">5<\/text><text class=\"slabel \" x=\"108\" y=\"336\" text-anchor=\"start\" style=\"font-size:11px\">zeros at the end of N:<\/text><text class=\"slabel \" x=\"108\" y=\"352\" text-anchor=\"start\" style=\"font-size:11px\">the smaller of the two counts<\/text><text class=\"slabel g numtxt\" x=\"108\" y=\"370\" text-anchor=\"start\" style=\"font-size:11px;font-weight:600\">smaller of 1 and 1 = 1, so 90 ends in one zero<\/text><text class=\"slabel  numtxt\" x=\"626\" y=\"336\" text-anchor=\"end\" style=\"font-size:12px\">√90 = 3√10, not whole<\/text><\/svg>","sec":"num","fm":["Counting divisors from the prime factorisation","Even divisors and odd divisors","LCM × GCF equals the product","When a fraction terminates","Repeating decimal to a fraction","Trailing zeros in a factorial","The division algorithm","Percent as a fraction over 100"]},"cb_remainder":{"title":"Remainders, round the wheel","tag":"Number","say":"A number n is shared out in groups of d, and what is left over is the remainder. The wheel has d seats, and the pointer lands on that remainder. The other buttons add and multiply two numbers on the same wheel, ask for two remainders at once, and send powers round the wheel, which is how every units-digit question works.","note":"","tries":["Set the divisor to 5 and walk n up from 0. The pointer climbs 0, 1, 2, 3, 4 and drops back to 0 at every multiple of 5. A remainder is always smaller than the divisor.","Set n to 17 and d to 5, so the remainder is 2. The board lists the divisors of 15 that are bigger than 2: 3, 5 and 15. Each of them leaves 2 when it divides 17.","Press <b>add and multiply<\/b>, set d = 6, n = 10 and m = 11. They leave 4 and 5, so the product leaves 4 × 5 = 20, which leaves 2 on 6. Check it: 110 = 18 × 6 + 2.","Press <b>two conditions<\/b>, set d = 5, e = 6 and n = 8. The green cells are 8, 38, 68 and so on, 30 apart, and 30 is the LCM of 5 and 6.","Press <b>powers go round<\/b>, set the base to 3 and d to 10. The cycle is 3, 9, 7, 1. Slide the power to 48: 48 leaves 0 on 4, so it lands on the last seat and 3⁴⁸ ends in 1.","Keep d = 10 and set the base to 13. The wheel looks exactly as it did for 3, because only the units digit of the base matters. Then set the base to 10 and d to 11: the powers just swap between 10 and 1."],"ideas":[{"lead":"<b>The remainder is what is left after the biggest multiple of d that fits.<\/b>","rest":"It is always smaller than d, and it can be 0. If n is smaller than d, the quotient is 0 and the remainder is n itself.","f":"n = q × d + r, with 0 ≤ r &lt; d","eg":"17 ÷ 5: 17 = 3 × 5 + 2, so the remainder is 2","plain":"Divide, keep the whole-number answer, and what is left over is the remainder. It is always smaller than the number you divide by.","steps":["17 ÷ 5: 5 fits 3 times (15)","17 − 15 = 2 → remainder 2","so 17 = 3 × 5 + 2"],"big":"The remainder is what is left over after you divide.","html":"<p>Divide, keep the whole-number answer, and the leftover is the <b>remainder<\/b>.<\/p><ul><li><b>Rule:<\/b> n = q × d + r. Here n is the number, d is what you divide by, q is the whole-number answer, and r is the remainder.<\/li><li>The remainder is always <b>smaller than d<\/b>. It can be 0.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> 17 ÷ 5<ol><li>5 fits 3 times (3 × 5 = 15)<\/li><li>17 − 15 = 2 → remainder <b>2<\/b><\/li><li>Check: 3 × 5 + 2 = 17 ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ If the number is smaller than d, the answer is 0 and the remainder is the number itself. 3 ÷ 5 = 0, remainder 3.<\/p>"},{"lead":"<b>Take the remainder off first.<\/b>","rest":"If n leaves r, then d divides n − r exactly. And d must be bigger than r, or r would not be a remainder.","f":"17 ÷ z leaves 2 → z divides 15 and z &gt; 2 → z = 3, 5 or 15","plain":"If n leaves remainder r, then n − r divides exactly. So take the remainder away and look at the divisors.","steps":["17 ÷ z leaves 2","17 − 2 = 15, so z divides 15: 1, 3, 5, 15","z must be bigger than 2 → z = 3, 5 or 15"],"big":"Take the remainder away first. Then what is left divides exactly.","html":"<ul><li>If n ÷ d leaves remainder r, then d divides n − r exactly.<\/li><li>Also d must be <b>bigger than r<\/b>, because a remainder is always smaller than what you divide by.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> 17 ÷ z leaves 2. What can z be?<ol><li>17 − 2 = 15, so z divides 15: 1, 3, 5, 15<\/li><li>z must be bigger than 2 → z = <b>3, 5 or 15<\/b><\/li><li>Check: 17 ÷ 3 = 5 remainder 2, 17 ÷ 5 = 3 remainder 2, 17 ÷ 15 = 1 remainder 2 ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ Throw out divisors that are not bigger than the remainder (here, 1).<\/p>"},{"lead":"<b>Numbers with the same remainder are spaced d apart.<\/b>","rest":"They are r, r + d, r + 2d and so on. “Divisible by 4 but not by 8” is exact: it means 8k + 4, a remainder of 4 on 8.","f":"n = d × k + r","eg":"remainder 2 on 5: 2, 7, 12, 17, 22, …","plain":"All numbers with the same remainder form a list that goes up by the divisor each time.","steps":["remainder 2 when divided by 5","start at 2 and keep adding 5","2, 7, 12, 17, 22, …"],"big":"Numbers with the same remainder are evenly spaced, d apart.","html":"<p>Start at the remainder and keep adding the number you divide by. <b>Rule:<\/b> n = d × k + r, where d is what you divide by, r is the remainder, and k is any whole number (0, 1, 2, …).<\/p><div class=\"ex\"><b>Example:<\/b> numbers that leave remainder 2 when divided by 5<ol><li>Start at 2.<\/li><li>Keep adding 5: <b>2, 7, 12, 17, 22, …<\/b><\/li><li>Check: 22 ÷ 5 = 4, remainder 2 ✅<\/li><\/ol><\/div><p class=\"tip\">💡 “Divisible by 4 but not by 8” means remainder 4 when divided by 8, so 8k + 4. These are 4, 12, 20, 28, …<\/p>"},{"lead":"<b>Remainders add.<\/b>","rest":"Add the two remainders, then take d off if the total reaches d. With d = 10 this is the units digit, and the carry is thrown away: 9 + 9 leaves 8.","f":"remainder of m + n = remainder of (rₘ + rₙ)","eg":"7 leaves 1 on 3 and 8 leaves 2 → 7 + 8 = 15 leaves 1 + 2 = 3 → 0","plain":"For the remainder of a sum, add the remainders. If that reaches the divisor, take the divisor off again.","steps":["7 ÷ 3 leaves 1 and 8 ÷ 3 leaves 2","1 + 2 = 3, and 3 on 3 leaves 0","check: 15 ÷ 3 = 5 remainder 0 ✓"],"big":"For the remainder of a sum, just add the remainders.","html":"<ul><li>Add the two remainders.<\/li><li>If the total reaches the divisor (the number you divide by), take the divisor away again.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> remainder of 7 + 8 when divided by 3<ol><li>7 ÷ 3 leaves 1, and 8 ÷ 3 leaves 2<\/li><li>1 + 2 = 3, and 3 ÷ 3 leaves <b>0<\/b><\/li><li>Check: 15 ÷ 3 = 5, remainder 0 ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Dividing by 10 leaves the <b>units digit<\/b> (the last digit). So last digits add the same way, and the carry is thrown away: 9 + 9 = 18 → ends in 8.<\/p>"},{"lead":"<b>Remainders multiply too, so swap a number for its remainder before you multiply.<\/b>","rest":"That works for squares and for any multiplier. On 6, 15a behaves like 3a, because 15 leaves 3.","f":"345,606² on 20: 345,606 leaves 6, and 6² = 36 → 16","plain":"For a product, multiply the remainders instead of the big numbers. Much easier.","steps":["remainder of 23 × 17 when divided by 5","23 leaves 3 and 17 leaves 2 → 3 × 2 = 6, and 6 leaves 1","check: 391 ÷ 5 = 78 remainder 1 ✓"],"big":"For the remainder of a product, multiply the remainders instead.","html":"<p>Swap each big number for its remainder before you multiply. This works for squares too.<\/p><div class=\"ex\"><b>Example:<\/b> remainder of 23 × 17 when divided by 5<ol><li>23 leaves 3, and 17 leaves 2<\/li><li>3 × 2 = 6, and 6 ÷ 5 leaves <b>1<\/b><\/li><li>Check: 23 × 17 = 391, and 391 ÷ 5 = 78, remainder 1 ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Squares: 345,606² divided by 20. 345,606 leaves 6, and 6² = 36, which leaves <b>16<\/b>.<br>On 6, 15a acts like 3a, because 15 leaves 3 (a is any whole number).<\/p>"},{"lead":"<b>A remainder on d hands you the remainder on any factor of d.<\/b>","rest":"Divide the remainder again by the factor. A number that leaves 13 on 42 leaves 1 on 6, because 42 is a multiple of 6.","f":"e divides d → remainder on e = (remainder on d) on e","eg":"n leaves 7 on 10, so n leaves 2 on 5 (try 17: 17 ÷ 5 leaves 2)","plain":"If you know the remainder on 10, you also know it on 5 and on 2, because 5 and 2 divide 10. Just divide the remainder again.","steps":["n leaves 7 when divided by 10","7 ÷ 5 leaves 2 → n leaves 2 on 5","try n = 17: 17 ÷ 5 = 3 remainder 2 ✓"],"big":"Know the remainder on 10? Then you also know it on 5 and on 2.","html":"<p>This works for any number that divides your divisor exactly (5 and 2 divide 10). Just divide the remainder again.<\/p><div class=\"ex\"><b>Example:<\/b> n ÷ 10 leaves 7. What does n ÷ 5 leave?<ol><li>7 ÷ 5 leaves 2 → n ÷ 5 leaves <b>2<\/b><\/li><li>Try n = 17: 17 ÷ 5 = 3, remainder 2 ✅<\/li><\/ol><\/div><p class=\"tip\">💡 A number that leaves 13 on 42 leaves 1 on 6, because 42 = 6 × 7 and 13 ÷ 6 leaves 1.<\/p><p class=\"warn\">⚠️ It only works one way. The remainder on 5 does not tell you the remainder on 10.<\/p>"},{"lead":"<b>Two remainders at once give a family spaced by the LCM.<\/b>","rest":"Find the first number that fits both. Every other one is a multiple of the LCM away.","f":"3 on 5 and 2 on 6 → 8, 38, 68, …","plain":"When a number must fit two remainder rules at once, find the first number that works, then keep adding the LCM of the two divisors.","steps":["leaves 3 on 5 and 2 on 6","try 3, 8, 13, …: 8 ÷ 6 leaves 2 ✓","LCM(5, 6) = 30 → 8, 38, 68, …"],"big":"Two remainder rules at once? Find the first number, then keep adding the LCM.","html":"<p>LCM (least common multiple) is the smallest number that both divisors go into.<\/p><div class=\"ex\"><b>Example:<\/b> a number leaves 3 when divided by 5, and 2 when divided by 6<ol><li>Numbers that leave 3 on 5: 3, 8, 13, …<\/li><li>Test on 6: 3 leaves 3 ✗, 8 leaves 2 ✓ → the first number is <b>8<\/b><\/li><li>LCM(5, 6) = 30 → all answers: <b>8, 38, 68, …<\/b><\/li><li>Check 38: 38 ÷ 5 = 7, remainder 3, and 38 ÷ 6 = 6, remainder 2 ✅<\/li><\/ol><\/div>"},{"lead":"<b>An integer average is a fact about remainders.<\/b>","rest":"The total is the average times the count. So the average is a whole number exactly when the count divides the total, and a free value has to make up what is missing.","f":"average is whole ⇔ the total leaves 0 on the count","eg":"4, 5, 9: total 18, and 18 ÷ 3 = 6 is whole · 4, 5, 8: total 17 leaves 2 on 3, not whole","plain":"An average is a whole number only when the total divides evenly by how many numbers there are.","steps":["4, 5, 9: total 18, three numbers","18 ÷ 3 = 6 → whole","4, 5, 8: total 17 → 17 ÷ 3 is not whole"],"big":"An average is a whole number only when the total divides evenly by the count.","html":"<p>The <b>average<\/b> (mean) is the total ÷ how many numbers. So the total = average × how many.<\/p><div class=\"ex\"><b>Example:<\/b><ol><li>4, 5, 9: total 18, three numbers → 18 ÷ 3 = <b>6<\/b>, whole ✅<\/li><li>4, 5, 8: total 17 → 17 ÷ 3 leaves 2, <b>not whole<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 If one value is unknown, it must fill the gap. For 4, 5 and x to have a whole-number average, 9 + x must divide by 3. So x must be a multiple of 3, like 3, 6 or 9.<\/p>"},{"lead":"<b>Some divisors only look at a few digits.<\/b>","rest":"For 2, 5 and 10 the last digit decides, for 4, 20 and 25 the last two digits, and for 8 the last three. For 3 and 9 the digit sum decides, and for 11 the digits added and taken away in turn, starting from the units.","f":"12,345,678,910 on 3: the digits add to 46 → 1","plain":"Quick tests: for 3 and 9 add the digits · for 2, 5 and 10 look at the last digit · for 4 the last two digits · for 8 the last three.","steps":["1,236 on 3: 1 + 2 + 3 + 6 = 12 → divides by 3","1,236 on 4: the last two digits are 36 → divides by 4","1,235 on 5: ends in 5 → divides by 5"],"big":"Quick tests: some divisors only look at the last digits or the digit sum.","html":"<ul><li><b>2, 5, 10:<\/b> look at the last digit.<\/li><li><b>4, 20, 25:<\/b> look at the last two digits.<\/li><li><b>8:<\/b> look at the last three digits.<\/li><li><b>3, 9:<\/b> add up the digits.<\/li><li><b>11:<\/b> starting from the last digit, add and take away in turn. 121 → 1 − 2 + 1 = 0, so 11 divides it.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> 1,236<ol><li>On 3: 1 + 2 + 3 + 6 = 12 → divides by 3 ✅ (1,236 = 3 × 412)<\/li><li>On 4: the last two digits are 36, and 36 ÷ 4 = 9 → divides by 4 ✅<\/li><\/ol><\/div><p class=\"tip\">💡 The digit sum also gives the <b>remainder<\/b> on 3. 12,345,678,910: the digits add to 46, and 46 ÷ 3 leaves 1 → remainder <b>1<\/b>.<\/p>"},{"lead":"<b>The remainders of a power go round a cycle.<\/b>","rest":"List b, b², b³ and so on until a remainder repeats. Then only the power’s place in the cycle matters, so divide the power by the cycle length.","f":"3²⁸³ on 5: 3, 4, 2, 1 → 283 = 4 × 70 + 3 → 2 · 10ⁿ on 11: 10, 1, 10, 1, …","plain":"For a big power, list the remainders of the first few powers. They repeat in a cycle, so you only need to know where in the cycle the power lands.","steps":["3ⁿ on 5: 3, 9 → 4, 27 → 2, 81 → 1, then it repeats (a cycle of 4)","3²⁸³: 283 ÷ 4 = 70 remainder 3 → 3rd place in the cycle","answer: remainder 2"],"big":"Remainders of powers go round in a circle. Find the circle first.","html":"<p>List the remainders of the first few powers until one repeats. Then divide the power by the circle length to find its place.<\/p><div class=\"ex\"><b>Example:<\/b> remainder of 3²⁸³ divided by 5<ol><li>3 → 3, 3² = 9 → 4, 3³ = 27 → 2, 3⁴ = 81 → 1, then it repeats<\/li><li>The circle is 3, 4, 2, 1 (4 steps)<\/li><li>283 ÷ 4 = 70, remainder 3 → 3rd place<\/li><li>The 3rd place is 2 → remainder <b>2<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Some circles are short. 10, 10², 10³, … divided by 11 leave 10, 1, 10, 1, …<\/p><p class=\"warn\">⚠️ If the power leaves 0 on the circle length, take the <b>last<\/b> place.<\/p>"},{"lead":"<b>A units digit cycles every 1, 2 or 4 powers, and only the base’s units digit matters.<\/b>","rest":"Bases ending in 0, 1, 5 or 6 never move, bases ending in 4 or 9 swap between two digits, and bases ending in 2, 3, 7 or 8 run all four seats. When the power leaves 0 on the cycle length, it lands on the last seat.","f":"13ⁿ ends like 3ⁿ · 3⁴⁸ ends in 1","eg":"2ⁿ ends in 2, 4, 8, 6, 2, … → 10 = 4 × 2 + 2, so 2¹⁰ = 1024 ends in 4","plain":"The last digit of a power repeats in a short cycle, and only the last digit of the base matters.","steps":["2¹ = 2, 2² = 4, 2³ = 8, 2⁴ = 16 → 6, then 2 again","the cycle is 2, 4, 8, 6 (length 4)","2¹⁰: 10 ÷ 4 = 2 remainder 2 → 2nd place → ends in 4 (1,024 ✓)"],"big":"The last digit of a power repeats in a short circle. Only the base's last digit matters.","html":"<p>The <b>base<\/b> is the number being multiplied. 13ⁿ ends just like 3ⁿ, because only the last digit 3 matters.<\/p><div class=\"ex\"><b>Example:<\/b> what is the last digit of 2¹⁰?<ol><li>2¹ = 2, 2² = 4, 2³ = 8, 2⁴ = 16, 2⁵ = 32<\/li><li>Last digits: 2, 4, 8, 6, then 2 again → a circle of 4<\/li><li>10 ÷ 4 = 2, remainder 2 → 2nd place<\/li><li>The 2nd place is 4 → ends in <b>4<\/b> ✅ (2¹⁰ = 1,024)<\/li><\/ol><\/div><ul><li>Ends in 0, 1, 5 or 6: never changes.<\/li><li>Ends in 4 or 9: swaps between two digits (4, 6 or 9, 1).<\/li><li>Ends in 2, 3, 7 or 8: a circle of 4.<\/li><\/ul><p class=\"warn\">⚠️ Remainder 0 means the <b>last<\/b> place. 3⁴⁸: 48 ÷ 4 leaves 0 → last place of 3, 9, 7, 1 → ends in <b>1<\/b>.<\/p>"},{"lead":"<b>A square can only end in 0, 1, 4, 5, 6 or 9.<\/b>","rest":"The units digit of a square comes from the units digit of its root, so ten cases cover every number.","f":"no square ends in 2, 3, 7 or 8","eg":"13² = 169 ends in 9 · 2,023 can never be a square (it ends in 3)","plain":"Square the digits 0 to 9 and the last digits you get are only 0, 1, 4, 5, 6 and 9. A number ending in 2, 3, 7 or 8 can never be a perfect square.","steps":["1² = 1, 2² = 4, 3² = 9, 4² = 16, 5² = 25","6² = 36, 7² = 49, 8² = 64, 9² = 81","so 2,023 (it ends in 3) is not a square"],"big":"A perfect square can only end in 0, 1, 4, 5, 6 or 9.","html":"<p>A <b>perfect square<\/b> is a whole number times itself (like 13 × 13 = 169). Its last digit comes only from the last digit of the number being squared.<\/p><div class=\"ex\"><b>Example:<\/b> square the digits 0 to 9<ol><li>0² = 0, 1² = 1, 2² = 4, 3² = 9, 4² = 16<\/li><li>5² = 25, 6² = 36, 7² = 49, 8² = 64, 9² = 81<\/li><li>Last digits: only <b>0, 1, 4, 5, 6, 9<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 A number ending in 2, 3, 7 or 8 is <b>never<\/b> a square. So 2,023 is not a square (it ends in 3).<\/p><p class=\"warn\">⚠️ It only works one way. Ending in 1 does not make a number a square (11 is not).<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><text class=\"slabel b numtxt\" x=\"170\" y=\"92\" text-anchor=\"middle\" style=\"font-size:14px;font-weight:600\">q = 3 groups of 5<\/text><text class=\"slabel  numtxt\" x=\"170\" y=\"110\" text-anchor=\"middle\" style=\"font-size:10px;fill:var(--ink-3)\">(group 1 is off to the left)<\/text><path style=\"fill:none;stroke:var(--blue);stroke-width:1.6\" d=\"M 38 194 Q 80.67 150 123.33 194\"><\/path><text class=\"slabel b numtxt\" x=\"80.67\" y=\"166\" t -anchor=\"middle\" style=\"fill:var(--ink)\">15<\/text><line x1=\"232.53\" y1=\"196\" x2=\"232.53\" y2=\"204\" style=\"stroke:var(--ink-3);stroke-width:1\"><\/line><line x1=\"250.4\" y1=\"196\" x2=\"250.4\" y2=\"204\" style=\"stroke:var(--ink-3);stroke-width:1\"><\/line><line x1=\"268.27\" y1=\"196\" x2=\"268.27\" y2=\"204\" style=\"stroke:var(--ink-3);stroke-width:1\"><\/line><line x1=\"286.13\" y1=\"196\" x2=\"286.13\" y2=\"204\" style=\"stroke:var(--ink-3);stroke-width:1\"><\/line><line x1=\"304\" y1=\"189\" x2=\"304\" y2=\"211\" style=\"stroke:var(--ink);stroke-width:2\"><\/line><text class=\"slabel  numtxt\" x=\"304\" y=\"225\" text-anchor=\"middle\" style=\"fill:var(--ink)\">20<\/text><circle cx=\"71.73\" cy=\"200\" r=\"4\" style=\"fill:var(--green);stroke:var(--panel);stroke-width:1.2\"><\/circle><text class=\"slabel g numtxt\" x=\"71.73\" y=\"266\" text-anchor=\"middle\" style=\"font-size:10px\">7<\/text><circle cx=\"161.07\" cy=\"200\" r=\"4\" style=\"fill:var(--green);stroke:var(--panel);stroke-width:1.2\"><\/circle><text class=\"slabel g numtxt\" x=\"161.07\" y=\"266\" text-anchor=\"middle\" style=\"font-size:10px\">12<\/text><circle cx=\"250.4\" cy=\"200\" r=\"4\" style=\"fill:var(--green);stroke:var(--panel);stroke-width:1.2\"><\/circle><text class=\"slabel g numtxt\" x=\"250.4\" y=\"266\" text-anchor=\"middle\" style=\"font-size:10px\">17<\/text><text class=\"slabel g numtxt\" x=\"170\" y=\"284\" text-anchor=\"middle\" style=\"font-size:10px\">green dots: every number here that leaves 2, 5 apart<\/text><line x1=\"214.67\" y1=\"233\" x2=\"250.4\" y2=\"233\" style=\"stroke:var(--green);stroke-width:1.6\"><\/line><line x1=\"214.67\" y1=\"229\" x2=\"214.67\" y2=\"237\" style=\"stroke:var(--green);stroke-width:1.6\"><\/line><line x1=\"250.4\" y1=\"229\" x2=\"250.4\" y2=\"237\" style=\"stroke:var(--green);stroke-width:1.6\"><\/line><text class=\"slabel g numtxt\" x=\"232.53\" y=\"250\" text-anchor=\"middle\" style=\"font-size:12px;font-weight:600\">r = 2<\/text><line x1=\"250.4\" y1=\"200\" x2=\"250.4\" y2=\"140\" style=\"stroke:var(--red);stroke-width:2\"><\/line><circle cx=\"250.4\" cy=\"138\" r=\"5\" style=\"fill:var(--red);stroke:none\"><\/circle><text class=\"slabel r numtxt\" x=\"250.4\" y=\"126\" text-anchor=\"middle\" style=\"font-size:12px;font-weight:600\">n = 17<\/text><text class=\"slabel  numtxt\" x=\"170\" y=\"312\" text-anchor=\"middle\" style=\"fill:var(--ink-2)\">17 shared among 5: 3 each, 2 left over<\/text><circle cx=\"470\" cy=\"200\" r=\"110\" style=\"fill:none;stroke:var(--line-2);stroke-width:2\"><\/circle><circle cx=\"470\" cy=\"90\" r=\"13\" style=\"fill:var(--panel);stroke:var(--ink-2);stroke-width:2.2\"><\/circle><text class=\"slabel  numtxt\" x=\"470\" y=\"94\" text-anchor=\"middle\" style=\"fill:var(--ink)\">0<\/text><circle cx=\"574.62\" cy=\"166.01\" r=\"13\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.3\"><\/circle><text class=\"slabel  numtxt\" x=\"574.62\" y=\"170.01\" text-anchor=\"middle\" style=\"fill:var(--ink)\">1<\/text><circle cx=\"534.66\" cy=\"288.99\" r=\"13\" style=\"fill:var(--blue);stroke:var(--blue);stroke-width:2\"><\/circle><text class=\"slabel  numtxt\" x=\"534.66\" y=\"292.99\" text-anchor=\"middle\" style=\"fill:var(--panel);font-weight:700\">2<\/text><circle cx=\"405.34\" cy=\"288.99\" r=\"13\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.3\"><\/circle><text class=\"slabel  numtxt\" x=\"405.34\" y=\"292.99\" text-anchor=\"middle\" style=\"fill:var(--ink)\">3<\/text><circle cx=\"365.38\" cy=\"166.01\" r=\"13\" style=\"fill:var(--panel);stroke:var(--ink-3);stroke-width:1.3\"><\/circle><text class=\"slabel  numtxt\" x=\"365.38\" y=\"170.01\" text-anchor=\"middle\" style=\"fill:var(--ink)\">4<\/text><circle cx=\"470\" cy=\"200\" r=\"3.5\" style=\"fill:var(--ink)\"><\/circle><line x1=\"470\" y1=\"200\" x2=\"518.2\" y2=\"266.34\" style=\"stroke:var(--blue);stroke-width:3.5;fill:none;stroke-linecap:round\"><\/line><polygon points=\"524.66,275.24 513.3,269.9 523.09,262.78\" style=\"fill:var(--blue);stroke:none\"><\/polygon><text class=\"slabel b numtxt\" x=\"470\" y=\"174\" text-anchor=\"middle\" style=\"font-size:11px\">round 3 times<\/text><path style=\"fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:6 4\" d=\"M 548.18 307.6 A 133 133 0 1 1 470 67\"><\/path><polygon points=\"470,67 461,71.95 461,62.05\" style=\"fill:var(--amber);stroke:none\"><\/polygon><text class=\"slabel a numtxt\" x=\"470\" y=\"46\" text-anchor=\"middle\" style=\"font-size:12px\">d − r = 3 more to the next multiple, 20<\/text><line x1=\"20\" y1=\"338\" x2=\"620\" y2=\"338\" style=\"stroke:var(--line);stroke-width:1\"><\/line><text class=\"slabel  numtxt\" x=\"320\" y=\"372\" text-anchor=\"middle\" style=\"font-size:16px;fill:var(--ink)\">n = q × d + r  →  <tspan style=\"fill:var(--red)\">17<\/tspan> = <tspan style=\"fill:var(--blue)\">3 × 5<\/tspan> + <tspan style=\"fill:var(--green)\">2<\/tspan><\/text><\/svg>","sec":"num","fm":["The division algorithm","Remainders of a sum and a product","The units-digit cycle of a power","Divisibility by 3 and by 9","Multiples of k in a range","LCM × GCF equals the product","The mean as a total","The total behind a mean"]},"cb_signsize":{"title":"The number line in four regions","tag":"Number","say":"Drag x along the number line. Ten lanes underneath show 2x, x², x³, √x, 1/x and the rest, each as a dot on its own copy of the line, so you can see which side of x every one lands on. The line breaks at −1, 0 and 1 into four regions, and the order changes each time you cross one. The other buttons draw the same powers as curves, pick the greatest and least products from a pool of signed numbers, and sort roots into rational and irrational.","note":"","tries":["Drag x to ½. x² and x³ land left of x, √x and ∛x land right of it, and 1/x jumps out to 2.","Drag x past 1, to 2. The whole order turns round: x³ is now furthest right and 1/x has dropped to ½.","Drag x to −½. x³ is −⅛, which is greater than x. 2x is −1, which is less. On this side of 0 a bigger multiple means a smaller number.","Stop x on 1, then on 0, then on −1. At 1 seven lanes put their dot in the same place. At 0, 1/x and x⁻² have no value at all.","Press <b>a pool of signed numbers<\/b>, pool −5 to 4, pick 4. The least product is (−5)(−4)(−3)(4) = −240, with three negatives. Drag the left end to −2 and the least product now uses one negative: (−2)(2)(3)(4) = −48.","Press <b>rational or not<\/b> and drag x to 2.25. √x is 3/2, rational. Now try 2 or 0.8. The root is irrational, yet √x × √x lands back on x, a rational."],"ideas":[{"lead":"<b>“A number” means any real number.<\/b>","rest":"Negatives, zero and fractions are all allowed until the question rules them out, and an integer can be negative or zero. Try a value from each region before you decide.","f":"0.22x vs (2/9)x: x &gt; 0 → (2/9)x bigger · x &lt; 0 → 0.22x bigger · x = 0 → equal","eg":"x = 9: 0.22 × 9 = 1.98 < (2/9) × 9 = 2 · x = −9: −1.98 > −2","plain":"When a question says “a number”, it can be negative, zero or a fraction. Always test a positive, a negative and zero before you decide.","steps":["Which is bigger, 2x or x?","x = 3: 6 > 3 → 2x is bigger","x = −3: −6 < −3 → x is bigger · x = 0: equal → it cannot be decided"],"big":"“A number” can be negative, zero or a fraction, so test every kind.","html":"<p>When a question says “a number”, it means any number on the number line.<\/p><ul><li>Negatives, 0 and fractions are all allowed, unless the question rules them out.<\/li><li>An <b>integer<\/b> (a whole number, no fraction part) can also be negative or 0.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> which is bigger, 2x or x?<ol><li>Try x = 3: 2x = 6, and 6 &gt; 3. So 2x is bigger.<\/li><li>Try x = −3: 2x = −6, and −6 &lt; −3. So x is bigger.<\/li><li>Try x = 0: both are 0, so they are equal.<\/li><li>The winner changes, so <b>it cannot be decided<\/b>.<\/li><\/ol><\/div><p class=\"tip\">💡 Same trick for 0.22x and (2/9)x. 2/9 = 0.222…, a bit more than 0.22. So (2/9)x wins when x is positive (x = 9: 1.98 vs 2), 0.22x wins when x is negative, and they tie at 0.<\/p>"},{"lead":"<b>The line splits at −1, 0 and 1, and each region behaves its own way.<\/b>","rest":"Powers and roots cross each other only at those three points. One test value from each region settles most comparisons.","f":"x &lt; −1 · −1 &lt; x &lt; 0 · 0 &lt; x &lt; 1 · x &gt; 1","eg":"x = −2, x = −½, x = ½ and x = 2 sit in the four regions","plain":"Mark −1, 0 and 1 on the number line. Numbers in each of the four parts behave differently when you square, cube or flip them, so test one number from each part.","steps":["test −2, −½, ½ and 2","their squares: 4, ¼, ¼, 4","squaring makes 2 bigger but makes ½ smaller"],"big":"Mark −1, 0 and 1. They cut the number line into four parts.","html":"<p>A <b>power<\/b> multiplies a number by itself (x² = x × x). A <b>root<\/b> goes backwards (√9 = 3).<\/p><ul><li>The four parts are: below −1, between −1 and 0, between 0 and 1, above 1.<\/li><li>Numbers in each part act differently when you square them, cube them or flip them (1 over the number).<\/li><li>Powers and roots only cross each other at −1, 0 and 1.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> test −2, −½, ½ and 2 (one from each part).<ol><li>Square them: 4, ¼, ¼, 4.<\/li><li>Squaring 2 gives 4, which is <b>bigger<\/b>.<\/li><li>Squaring ½ gives ¼, which is <b>smaller<\/b>.<\/li><\/ol>The same step can make a number bigger or smaller. It depends on the part.<\/div><p class=\"tip\">💡 One test number from each part settles most comparison questions.<\/p>"},{"lead":"<b>Between 0 and 1, powers shrink and roots grow.<\/b>","rest":"The reciprocal shoots past 1. So squaring a number between 0 and 1 makes it smaller, and the cube root of 0.8 sits between 0.8 and 1.","f":"0 &lt; x &lt; 1: x³ &lt; x² &lt; x &lt; √x &lt; ∛x &lt; 1 &lt; 1/x","eg":"x = ¼: x² = 1/16 < x = ¼ < √x = ½ < 1 < 1/x = 4","plain":"For a fraction between 0 and 1, multiplying it by itself makes it smaller, and taking a root makes it bigger.","steps":["x = ¼","x² = 1/16 (smaller) · √x = ½ (bigger)","1/x = 4 (much bigger)"],"big":"Between 0 and 1, powers make a number smaller and roots make it bigger.","html":"<p>A number between 0 and 1 is a fraction like ¼ or 0.8.<\/p><ul><li>Squaring it (x² = x × x) or cubing it makes it <b>smaller<\/b>.<\/li><li>A root (√ or ∛) makes it <b>bigger<\/b>, but it stays below 1.<\/li><li>The <b>reciprocal<\/b> (1 over the number, 1/x) jumps <b>past 1<\/b>.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> x = ¼<ol><li>x² = ¼ × ¼ = 1/16, smaller than ¼.<\/li><li>√x = √¼ = ½, bigger than ¼.<\/li><li>1/x = 1 ÷ ¼ = 4, much bigger.<\/li><\/ol>Order: 1/16 &lt; ¼ &lt; ½ &lt; 1 &lt; 4 ✅<\/div><p><b>Rule:<\/b> for 0 &lt; x &lt; 1: x³ &lt; x² &lt; x &lt; √x &lt; ∛x &lt; 1 &lt; 1/x<\/p><p class=\"tip\">💡 So the cube root of 0.8 sits between 0.8 and 1.<\/p>"},{"lead":"<b>Above 1 the same list runs the other way.<\/b>","rest":"Powers grow, roots shrink towards 1, and the reciprocal drops below 1.","f":"x &gt; 1: 1/x &lt; 1 &lt; ∛x &lt; √x &lt; x &lt; x² &lt; x³","eg":"x = 4: 1/x = ¼ < 1 < √4 = 2 < 4 < 16 < 64","plain":"Above 1 everything goes the usual way: squares get bigger, roots get smaller.","steps":["x = 4","x² = 16 and x³ = 64 (bigger)","√4 = 2 and 1/4 = ¼ (smaller)"],"big":"Above 1, powers make a number bigger and roots make it smaller.","html":"<ul><li>Squaring or cubing a number above 1 makes it <b>bigger<\/b>.<\/li><li>A root makes it <b>smaller<\/b>, but it stays above 1.<\/li><li>The reciprocal (1 over the number) drops <b>below 1<\/b>.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> x = 4<ol><li>x² = 16 and x³ = 64 (bigger)<\/li><li>√4 = 2 (smaller, but still above 1)<\/li><li>1/x = ¼ (below 1)<\/li><\/ol>Order: ¼ &lt; 1 &lt; 2 &lt; 4 &lt; 16 &lt; 64 ✅<\/div><p><b>Rule:<\/b> for x &gt; 1: 1/x &lt; 1 &lt; ∛x &lt; √x &lt; x &lt; x² &lt; x³<\/p><p class=\"tip\">💡 It is the same list as for numbers between 0 and 1, just in the opposite order.<\/p>"},{"lead":"<b>Squaring wipes out the sign, and an odd power keeps it.<\/b>","rest":"Below −1 a cube runs further left. Between −1 and 0 a cube sits closer to 0, so it is greater than x.","f":"x &lt; −1: x³ &lt; x &lt; 0 &lt; x² · −1 &lt; x &lt; 0: x &lt; x³ &lt; 0 &lt; x²","eg":"(−2)² = 4 is positive · (−2)³ = −8 stays negative","plain":"Squaring a negative number makes it positive. Cubing keeps it negative.","steps":["(−2)² = (−2) × (−2) = 4","(−2)³ = 4 × (−2) = −8","even power → positive · odd power → keeps the sign"],"big":"Squaring makes a negative number positive. Cubing keeps it negative.","html":"<ul><li>An <b>even<\/b> power (², ⁴) always gives a positive answer.<\/li><li>An <b>odd<\/b> power (³, ⁵) keeps the minus sign.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> x = −2<ol><li>(−2)² = (−2) × (−2) = <b>4<\/b>, positive.<\/li><li>(−2)³ = 4 × (−2) = <b>−8<\/b>, still negative.<\/li><\/ol><\/div><p><b>Where does the cube land?<\/b><\/p><ul><li>Below −1, the cube goes further left. x = −2 gives −8, and −8 &lt; −2.<\/li><li>Between −1 and 0, the cube moves closer to 0, so it is bigger. x = −½ gives −1/8, and −1/8 &gt; −½.<\/li><\/ul><p><b>Rule:<\/b> if x &lt; −1: x³ &lt; x &lt; 0 &lt; x². If −1 &lt; x &lt; 0: x &lt; x³ &lt; 0 &lt; x².<\/p>"},{"lead":"<b>A square root sign always gives the root that is 0 or more.<\/b>","rest":"So the square root of a square is an absolute value. An odd root keeps the sign: the cube root of −8 is −2.","f":"√(x²) = |x| · √(r⁶) = |r|³","eg":"√((−3)²) = √9 = 3 = |−3|","plain":"The √ sign always means the root that is 0 or positive. So √(x²) is x without its minus sign, written |x|.","steps":["√((−3)²) = √9","= 3, not −3","= |−3|"],"big":"The √ sign always gives an answer that is 0 or positive.","html":"<ul><li>√9 is 3, never −3.<\/li><li>So √(x²) is x without its minus sign. This is the <b>absolute value<\/b>, written |x|. It means the distance from 0.<\/li><li>An odd root keeps the sign. ∛(−8) = −2, because (−2)³ = −8.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> √((−3)²) = ?<ol><li>(−3)² = 9<\/li><li>√9 = 3<\/li><li>So the answer is <b>3<\/b>, not −3. That is |−3| ✅<\/li><\/ol><\/div><p><b>Rule:<\/b> √(x²) = |x|. In the same way, √(r⁶) = |r|³.<\/p><p class=\"warn\">⚠️ Do not write √(x²) = x. It is wrong when x is negative.<\/p>"},{"lead":"<b>A negative power is a reciprocal, so it throws a positive number across 1.<\/b>","rest":"For x between 0 and 1, x² is less than 1 and x⁻² is more than 1.","f":"x⁻² = 1/x² · x = ½: x² = ¼, x⁻² = 4","plain":"A negative power means “one over”. It flips a number across 1: small numbers become big and big ones become small.","steps":["2⁻² = 1/2² = ¼","(½)⁻² = 1 ÷ ¼ = 4"],"big":"A negative power means “1 over”. It flips a number across 1.","html":"<p>A <b>power<\/b> tells how many times to multiply a number by itself. A negative power means 1 over that: x⁻² = 1/x².<\/p><ul><li>Big numbers become small.<\/li><li>Small numbers (between 0 and 1) become big.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b><ol><li>2⁻² = 1/2² = <b>¼<\/b> (2 is big, so the answer is small)<\/li><li>(½)⁻² = 1 ÷ (½)² = 1 ÷ ¼ = <b>4<\/b> (½ is small, so the answer is big)<\/li><\/ol><\/div><p>For x between 0 and 1, x² is less than 1, but x⁻² is more than 1. With x = ½: x² = ¼ and x⁻² = 4.<\/p><p class=\"warn\">⚠️ A negative power does not make the answer negative. 2⁻² = ¼, not −4.<\/p>"},{"lead":"<b>Doubling a negative number makes it smaller.<\/b>","rest":"It moves away from 0, which is to the left. Halving a negative moves it towards 0, so it gets bigger. “Twice as much” means “greater” only above 0.","f":"x &lt; 0: 2x &lt; x &lt; x/2","eg":"x = −3: 2x = −6 < −3 < x/2 = −1.5","plain":"For negative numbers, the one that looks bigger is smaller. Doubling −3 gives −6, which is further left, so it is smaller.","steps":["x = −3","2x = −6 and x/2 = −1.5","order: −6 < −3 < −1.5"],"big":"For negative numbers, doubling makes it smaller and halving makes it bigger.","html":"<ul><li>Doubling a negative number moves it away from 0, to the left. Left means smaller.<\/li><li>Halving a negative number moves it toward 0, to the right. Right means bigger.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> x = −3<ol><li>2x = −6<\/li><li>x/2 = −1.5<\/li><li>Order: <b>−6 &lt; −3 &lt; −1.5<\/b> ✅<\/li><\/ol><\/div><p><b>Rule:<\/b> if x &lt; 0, then 2x &lt; x &lt; x/2.<\/p><p class=\"warn\">⚠️ “Twice as much” means “bigger” only for positive numbers. −6 looks bigger than −3, but it is smaller.<\/p>"},{"lead":"<b>A product is negative exactly when it has an odd number of negative factors.<\/b>","rest":"Count the minus signs. You never need to multiply to find the sign. A zero anywhere makes the whole product 0.","f":"no zero factor: sign = (−1)^(number of negatives)","eg":"(−2)(−3)(4) = 24 positive (two negatives) · (−2)(3)(4) = −24 negative (one)","plain":"Count the minus signs. An even count gives a positive answer, an odd count a negative one. If any factor is 0, the answer is 0.","steps":["(−2)(−3)(4): two negatives → +24","(−2)(3)(4): one negative → −24","(−1)(−1)(−1): three → −1"],"big":"Count the minus signs to find the sign of a product.","html":"<p>A <b>product<\/b> is the answer when you multiply. Each number you multiply is a <b>factor<\/b>.<\/p><ul><li>An even count of negative factors gives a <b>positive<\/b> answer.<\/li><li>An odd count of negative factors gives a <b>negative<\/b> answer.<\/li><li>If any factor is 0, the whole product is <b>0<\/b>.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b><ol><li>(−2)(−3)(4): two negatives → <b>+24<\/b><\/li><li>(−2)(3)(4): one negative → <b>−24<\/b><\/li><li>(−1)(−1)(−1): three negatives → <b>−1<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 You never need to multiply to find the sign. Just count the minus signs.<\/p>"},{"lead":"<b>The least product is the one furthest left on the line.<\/b>","rest":"Size alone does not decide it. Take the factors with the biggest sizes first, then count their negatives, and swap one factor if the count is wrong for what you want.","f":"pick 4 from −5 to 4: least = (−5)(−4)(−3)(4) = −240","plain":"To get the smallest product, you want a negative answer that is as large in size as possible.","steps":["pick 4 numbers from −5 to 4","largest sizes, with an odd count of negatives: −5, −4, −3 and 4","(−5)(−4)(−3)(4) = −240"],"big":"The smallest product is a negative answer that is as far from 0 as possible.","html":"<p>“Smallest” means furthest left on the number line. Size alone (distance from 0) does not decide it. The sign matters too.<\/p><div class=\"ex\"><b>Example:<\/b> pick 4 different whole numbers from −5 to 4. What is the smallest product?<ol><li>Take the biggest sizes: −5, −4, 4, and then −3 or 3.<\/li><li>You want a negative answer, so you need an odd count of negatives. Pick −3 (three negatives).<\/li><li>(−5) × (−4) × (−3) × 4 = 20 × (−12) = <b>−240<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 Steps: take the biggest sizes first, then count the negatives. If the count is wrong for what you want, swap one number. For the biggest product, use an even count instead: (−5)(−4)(4)(3) = 240.<\/p>"},{"lead":"<b>A rational number plus an irrational one is always irrational.<\/b>","rest":"So is a non-zero rational times an irrational. Two irrationals can cancel, though: √2 + (−√2) is 0, and √2 × √2 is 2. Zero times an irrational is 0.","f":"rational + irrational = irrational · √2 × √2 = 2","eg":"2 + √3 is irrational","plain":"Rational means it can be written as a fraction (3, ½, 0.25). Irrational means it cannot (√2, π). Rational + irrational is always irrational, but two irrationals can give a rational.","steps":["2 + √3 → irrational","√2 × √2 = 2 → rational","π − π = 0 → rational"],"big":"Rational + irrational is always irrational. But two irrationals can cancel.","html":"<ul><li><b>Rational<\/b> means it can be written as a fraction of whole numbers: 3, ½, 0.25.<\/li><li><b>Irrational<\/b> means it cannot: √2, π.<\/li><\/ul><p><b>The rules:<\/b><\/p><ul><li>Rational + irrational → always irrational.<\/li><li>Rational (not 0) × irrational → always irrational.<\/li><li>0 × irrational = 0, which is rational.<\/li><li>Two irrationals can give a rational answer.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b><ol><li>2 + √3 → <b>irrational<\/b><\/li><li>√2 × √2 = 2 → <b>rational<\/b><\/li><li>√2 + (−√2) = 0 → <b>rational<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ Do not assume two irrationals always give an irrational answer.<\/p>"},{"lead":"<b>The square root of a fraction in lowest terms is rational only when the top and the bottom are both perfect squares.<\/b>","rest":"Every decimal that stops or repeats is rational. Having a decimal form proves nothing, because every number has one.","f":"√(9/4) = 3/2 · √(4/5) is irrational","plain":"The root of a fraction is a clean fraction only if, after simplifying, the top and the bottom are both perfect squares.","steps":["√(9/4) = 3/2 → rational","√(4/5): 5 is not a square → irrational","√(8/18) = √(4/9) = 2/3 → simplify first"],"big":"The root of a fraction is a clean fraction only if its top and bottom are both perfect squares.","html":"<p><b>Rational<\/b> means it can be written as a fraction of whole numbers. A <b>perfect square<\/b> is a whole number times itself: 1, 4, 9, 16, 25. Always simplify the fraction first (lowest terms).<\/p><div class=\"ex\"><b>Example:<\/b><ol><li>√(9/4): 9 and 4 are both squares, so it is 3/2 → <b>rational<\/b><\/li><li>√(4/5): 5 is not a square → <b>irrational<\/b><\/li><li>√(8/18): simplify first. 8/18 = 4/9, so √(4/9) = <b>2/3<\/b> → rational<\/li><\/ol><\/div><p>Every decimal that stops (0.25) or repeats (0.333…) is rational.<\/p><p class=\"warn\">⚠️ Having a decimal form proves nothing. Every number has one, even √2 = 1.414…<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><rect x=\"90\" y=\"21\" width=\"173.33\" height=\"22\" rx=\"0\" style=\"fill:none;stroke:var(--line-2);stroke-width:1\"><\/rect><text class=\"slabel  numtxt\" x=\"176.67\" y=\"36\" text-anchor=\"middle\">below −1<\/text><rect x=\"263.33\" y=\"21\" width=\"86.67\" height=\"22\" rx=\"0\" style=\"fill:var(--blue-wash);stroke:var(--line-2);stroke-width:1\"><\/rect><text class=\"slabel  numtxt\" x=\"306.67\" y=\"36\" text-anchor=\"middle\">−1 to 0<\/text><rect x=\"350\" y=\"21\" width=\"86.67\" height=\"22\" rx=\"0\" style=\"fill:var(--red-wash);stroke:var(--line-2);stroke-width:1\"><\/rect><text class=\"slabel r numtxt\" x=\"393.33\" y=\"36\" text-anchor=\"middle\" style=\"font-weight:600\">0 to 1<\/text><rect x=\"436.67\" y=\"21\" width=\"173.33\" height=\"22\" rx=\"0\" style=\"fill:var(--blue-wash);stroke:var(--line-2);stroke-width:1\"><\/rect><text class=\"slabel  numtxt\" x=\"523.33\" y=\"36\" text-anchor=\"middle\">above 1<\/text><line x1=\"90\" y1=\"58\" x2=\"610\" y2=\"58\" style=\"stroke:var(--line-2);stroke-width:1.3;fill:none\"><\/line><line x1=\"90\" y1=\"55\" x2=\"90\" y2=\"61\" style=\"stroke:var(--line-2);stroke-width:1;fill:none\"><\/line><line x1=\"176.67\" y1=\"55\" x2=\"176.67\" y2=\"61\" style=\"stroke:var(--line-2);stroke-width:1;fill:none\"><\/line><line x1=\"263.33\" y1=\"55\" x2=\"263.33\" y2=\"61\" style=\"stroke:var(--line-2);stroke-width:1;fill:none\"><\/line><line x1=\"350\" y1=\"55\" x2=\"350\" y2=\"61\" style=\"stroke:var(--line-2);stroke-width:1;fill:none\"><\/line><line x1=\"436.67\" y1=\"55\" x2=\"436.67\" y2=\"61\" style=\"stroke:var(--line-2);stroke-width:1;fill:none\"><\/line><line x1=\"523.33\" y1=\"55\" x2=\"523.33\" y2=\"61\" style=\"stroke:var(--line-2);stroke-width:1;fill:none\"><\/line><line x1=\"610\" y1=\"55\" x2=\"610\" y2=\"61\" style=\"stroke:var(--line-2);stroke-width:1;fill:none\"><\/line><text class=\"slabel \" x=\"68\" y=\"62\" text-anchor=\"end\" style=\"font-weight:600\">x<\/text><line x1=\"90\" y1=\"88.67\" x2=\"610\" y2=\"88.67\" style=\"stroke:var(--line-2);stroke-width:1.3;fill:none\"><\/line><
