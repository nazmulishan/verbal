=\"shape\" x=\"34\" y=\"58\" width=\"30\" height=\"40\"/><rect class=\"shape\" x=\"64\" y=\"58\" width=\"12\" height=\"40\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><path class=\"gline\" d=\"M 34 112 L 34 106 L 64 106 L 64 112\"/><text class=\"slabel b\" x=\"49\" y=\"124\" text-anchor=\"middle\">cost 60<\/text><path class=\"gline\" d=\"M 64 44 L 64 50 L 76 50 L 76 44\"/><text class=\"slabel a\" x=\"70\" y=\"40\" text-anchor=\"middle\">markup 24<\/text><path class=\"aux\" d=\"M 76 54 L 76 102\"/><text class=\"slabel\" x=\"170\" y=\"172\" text-anchor=\"middle\">60 &times; 1.4 = price 84<\/text><text class=\"slabel r\" x=\"170\" y=\"190\" text-anchor=\"middle\">40% of cost is 28.57% of price<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Markup on cost&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"arith","fm":[]},"tk_interest":{"title":"Interest and growth","tag":"Applied Arithmetic","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Simple interest.<\/b>","rest":"Simple interest is paid on the original principal for every period, so the interest earned each year is the same amount and the total grows in a straight line.","f":"I = <sup>P &middot; r &middot; t<\/sup>&frasl;<sub>100<\/sub>","eg":"$1,000 at 6 per cent simple for 5 years earns 1000 &times; 6 &times; 5 &divide; 100 = $300, ending at $1,300.","trap":"Handing back the interest when the question asked for the balance, or the balance when it asked for the interest. Simple interest gives I; the amount owed is P + I.","fmn":"Simple interest","big":"Simple interest: you earn the same amount every year.","html":"<p><b>Interest<\/b> is the extra money you earn for saving (or pay for borrowing). The <b>principal<\/b> is the money you start with.<\/p><p><b>Rule:<\/b> interest = P × r × t ÷ 100. P is the principal, r is the rate in percent, t is the number of years.<\/p><div class=\"ex\"><b>Example:<\/b> $1,000 at 6% simple interest for 5 years.<ol><li>Each year: 6% of 1,000 = $60<\/li><li>5 years: 1,000 × 6 × 5 ÷ 100 = <b>$300<\/b> of interest<\/li><li>Final amount: 1,000 + 300 = <b>$1,300<\/b> ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ Read what the question wants: the interest ($300) or the total amount ($1,300).<\/p>"},{"lead":"<b>Compound interest.<\/b>","rest":"Compound interest is paid on the balance rather than the principal, so each year's interest is itself earning interest the year after.","f":"A = P(1 + <sup>r<\/sup>&frasl;<sub>100<\/sub>)<sup>t<\/sup>","eg":"$1,000 at 6 per cent compounded yearly for 10 years reaches 1000 &times; 1.06<sup>10<\/sup> = $1,790.85, against $1,600 under simple interest.","trap":"Multiplying the rate by the years and calling it compound. Compounding puts t in the exponent, never in the rate; 6 per cent for 10 years is 1.06<sup>10<\/sup>, which is 79 per cent, not 60.","fmn":"Compound interest","big":"Compound interest: the interest also earns interest.","html":"<p>Each year, the rate is used on the whole balance, including last year's interest. So the money grows faster every year.<\/p><p><b>Rule:<\/b> amount = P × (1 + r/100)<sup>t<\/sup>. P is the start money, r is the rate in percent, t is the years.<\/p><div class=\"ex\"><b>Example:<\/b> $1,000 at 6% compounded each year for 10 years.<ol><li>Multiplier each year: 1 + 6/100 = 1.06<\/li><li>Do it 10 times: 1.06¹⁰ ≈ 1.7908<\/li><li>1,000 × 1.06¹⁰ ≈ <b>$1,790.85<\/b><\/li><\/ol>Simple interest would give only 1,000 + 1,000 × 6 × 10 ÷ 100 = $1,600.<\/div><p class=\"warn\">⚠️ Do not do 6% × 10 = 60%. The years go in the small power at the top. 1.06¹⁰ is a 79% gain, not 60%.<\/p>"},{"lead":"<b>Compound interest, n times a year.<\/b>","rest":"Compounding more often chops the annual rate into n smaller pieces and applies them n times as often; the extra earnings are real but they flatten out fast.","f":"A = P(1 + <sup>r<\/sup>&frasl;<sub>100n<\/sub>)<sup>nt<\/sup>","eg":"$1,000 at 8 per cent compounded quarterly for 10 years reaches 1000 &times; 1.02<sup>40<\/sup> = $2,208.04, against $2,158.92 compounded yearly.","trap":"Dividing the rate by n but forgetting to multiply the exponent by n, which turns a ten-year investment into a ten-period one and loses most of the growth.","fmn":"Compound interest, n times a year","big":"Compounding n times a year: split the rate, and multiply the years.","html":"<p>\"Compounded quarterly\" means 4 times a year. \"Monthly\" means 12 times a year.<\/p><p><b>Rule:<\/b> amount = P × (1 + r/(100n))<sup>n × t<\/sup>. Here n is how many times a year, and t is the years.<\/p><div class=\"ex\"><b>Example:<\/b> $1,000 at 8% compounded quarterly for 10 years.<ol><li>Rate each time: 8% ÷ 4 = 2% → × 1.02<\/li><li>Number of times: 4 × 10 = 40<\/li><li>1,000 × 1.02⁴⁰ ≈ <b>$2,208.04<\/b><\/li><\/ol>Once a year would give 1,000 × 1.08¹⁰ ≈ $2,158.92. More often means a bit more money.<\/div><p class=\"warn\">⚠️ When you divide the rate by n, you must also multiply the years by n. Here the power is 40, not 10.<\/p>"},{"lead":"<b>Doubling time, the rule of 72.<\/b>","rest":"At a compound rate of r per cent a year, money doubles in roughly 72 divided by r years &mdash; a shortcut good to within a few per cent across every rate you will meet.","f":"years to double &asymp; <sup>72<\/sup>&frasl;<sub>r<\/sub>","eg":"At 8 per cent a year money doubles in about 72 &divide; 8 = 9 years; the exact figure is 9.01 years.","trap":"Using 72 with a rate written as a decimal. The r in the rule is the percent number, so 8 goes in, not 0.08 &mdash; and the rule is for compound growth, not simple interest.","fmn":"Doubling time, the rule of 72","big":"Rule of 72: money doubles in about 72 ÷ rate years.","html":"<p>This shortcut is for compound interest. Use the percent number itself as the rate.<\/p><p><b>Rule:<\/b> years to double ≈ 72 ÷ r<\/p><div class=\"ex\"><b>Example:<\/b> money grows 8% a year. When does it double?<ol><li>72 ÷ 8 = <b>about 9 years<\/b><\/li><li>The exact answer is 9.01 years, so the shortcut is very close ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ Put in 8, not 0.08. And this rule is for compound growth, not simple interest.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 360 210\"><path class=\"gline\" d=\"M 42 30 L 42 150 L 334 150\"/><path class=\"gline\" d=\"M 42 30 L 334 30\"/><text class=\"slabel\" x=\"44\" y=\"24\">2,000<\/text><text class=\"slabel\" x=\"37\" y=\"154\" text-anchor=\"end\">0<\/text><rect class=\"shape\" x=\"46\" y=\"90\" width=\"18\" height=\"60\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><rect class=\"shape\" x=\"46\" y=\"90\" width=\"18\" height=\"60\"/><rect class=\"shape\" x=\"68\" y=\"86.4\" width=\"18\" height=\"63.6\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><rect class=\"shape\" x=\"68\" y=\"90\" width=\"18\" height=\"60\"/><rect class=\"shape\" x=\"90\" y=\"82.8\" width=\"18\" height=\"67.2\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><rect class=\"shape\" x=\"90\" y=\"90\" width=\"18\" height=\"60\"/><rect class=\"shape\" x=\"112\" y=\"79.2\" width=\"18\" height=\"70.8\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><rect class=\"shape\" x=\"112\" y=\"90\" width=\"18\" height=\"60\"/><rect class=\"shape\" x=\"134\" y=\"75.6\" width=\"18\" height=\"74.4\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><rect class=\"shape\" x=\"134\" y=\"90\" width=\"18\" height=\"60\"/><rect class=\"shape\" x=\"156\" y=\"72\" width=\"18\" height=\"78\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><rect class=\"shape\" x=\"156\" y=\"90\" width=\"18\" height=\"60\"/><path class=\"aux\" d=\"M 55 90 L 77 86.4 L 99 82.8 L 121 79.2 L 143 75.6 L 165 72\"/><text class=\"slabel b\" x=\"180\" y=\"178\" text-anchor=\"middle\">1,000 at 6% for 5 years<\/text><text class=\"slabel a\" x=\"180\" y=\"196\" text-anchor=\"middle\">interest 300, balance 1,300<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Simple interest&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"arith","fm":[]},"tk_ratio":{"title":"Ratios and shares","tag":"Applied Arithmetic","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Ratio to actual value: the scale factor.<\/b>","rest":"A ratio fixes only the shape; one real measurement fixes the size, and the single number k carries that size to every other term at once.","f":"k = <sup>actual<\/sup>&frasl;<sub>ratio term<\/sub>, then every other actual = its term &middot; k","eg":"Two sums are in the ratio 3 : 5 and the first is $45, so k = 15, the second is $75, and the total is $120.","trap":"Reading the ratio terms as the amounts themselves. 3 : 5 does not mean $3 and $5; until one real value pins k down, 3 : 5 also describes 45 and 75, and 300 and 500.","fmn":"Ratio to actual value: the scale factor","big":"A ratio gives the shape. One real number gives the size.","html":"<p>A <b>ratio<\/b> like 3 : 5 compares sizes. It does not mean the amounts are 3 and 5.<\/p><p><b>Rule:<\/b> find the multiplier k = real amount ÷ its ratio number. Then multiply every ratio number by k.<\/p><div class=\"ex\"><b>Example:<\/b> two amounts are in the ratio 3 : 5. The first is $45.<ol><li>k = 45 ÷ 3 = 15<\/li><li>Second amount: 5 × 15 = <b>$75<\/b><\/li><li>Total: 45 + 75 = <b>$120<\/b> ✅ (check: 45 : 75 = 3 : 5)<\/li><\/ol><\/div><p class=\"warn\">⚠️ 3 : 5 could be $3 and $5, or $45 and $75, or $300 and $500. You need one real amount to know which.<\/p>"},{"lead":"<b>Dividing a quantity in a given ratio.<\/b>","rest":"Split the total into a + b equal pieces first; each side then takes its own number of those pieces, which is why the denominator is the sum and never one of the terms.","f":"share = total &middot; <sup>own term<\/sup>&frasl;<sub>(sum of all terms)<\/sub>","eg":"$200 split 2 : 3 gives one part of $40, so the shares are $80 and $120.","trap":"Dividing the total by one of the terms. 200 in the ratio 2 : 3 is not 200 &divide; 2 and 200 &divide; 3; the divisor is the sum 5, and the two shares must add back to 200.","fmn":"Dividing a quantity in a given ratio","big":"To split in a ratio, add the ratio numbers first.","html":"<p><b>Rule:<\/b> one share = total × its ratio number ÷ the sum of all the ratio numbers.<\/p><div class=\"ex\"><b>Example:<\/b> split $200 in the ratio 2 : 3.<ol><li>Add the ratio numbers: 2 + 3 = 5 equal parts.<\/li><li>One part: 200 ÷ 5 = $40<\/li><li>First share: 2 × 40 = <b>$80<\/b>. Second share: 3 × 40 = <b>$120<\/b>.<\/li><\/ol>Check: 80 + 120 = 200 ✅<\/div><p class=\"warn\">⚠️ Do not do 200 ÷ 2 and 200 ÷ 3. Divide by the sum, 5. The shares must add back to the total.<\/p>"},{"lead":"<b>Bridging two ratios.<\/b>","rest":"Two ratios only join once their shared term reads the same in both, so scale each ratio by the other's copy of B and the chain closes.","f":"A : B = a : b and B : C = c : q &nbsp;&rarr;&nbsp; A : B : C = ac : bc : bq","eg":"A : B = 3 : 4 and B : C = 6 : 5 give 18 : 24 : 20, which reduces to 9 : 12 : 10.","trap":"Writing 3 : 4 : 5 by simply stapling the two ratios together. B is 4 in one and 6 in the other, so the terms are in different units until both are scaled to their common multiple.","fmn":"Bridging two ratios","big":"To join two ratios, make the shared middle number match.","html":"<p>If you know A : B and B : C, then B must be the same number in both before you join them.<\/p><div class=\"ex\"><b>Example:<\/b> A : B = 3 : 4 and B : C = 6 : 5. Find A : B : C.<ol><li>B is 4 in the first and 6 in the second. The smallest number both go into is 12.<\/li><li>First ratio × 3: 3 : 4 → 9 : 12<\/li><li>Second ratio × 2: 6 : 5 → 12 : 10<\/li><li>Join them: A : B : C = <b>9 : 12 : 10<\/b> ✅ (check: 9 : 12 = 3 : 4 and 12 : 10 = 6 : 5)<\/li><\/ol><\/div><p class=\"warn\">⚠️ Do not just write 3 : 4 : 5. B is 4 in one ratio and 6 in the other, so they do not match yet.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 340 210\"><path class=\"gline\" d=\"M 34 88 L 290 88\"/><path class=\"gline\" d=\"M 34 152 L 290 152\"/><rect class=\"shape\" x=\"34\" y=\"74.9\" width=\"17\" height=\"13.1\"/><rect class=\"shape\" x=\"53\" y=\"74.9\" width=\"17\" height=\"13.1\"/><rect class=\"shape\" x=\"72\" y=\"74.9\" width=\"17\" height=\"13.1\"/><rect class=\"shape\" x=\"34\" y=\"138.9\" width=\"17\" height=\"13.1\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><rect class=\"shape\" x=\"53\" y=\"138.9\" width=\"17\" height=\"13.1\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><rect class=\"shape\" x=\"72\" y=\"138.9\" width=\"17\" height=\"13.1\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><rect class=\"shape\" x=\"91\" y=\"138.9\" width=\"17\" height=\"13.1\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><rect class=\"shape\" x=\"110\" y=\"138.9\" width=\"17\" height=\"13.1\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><text class=\"slabel b\" x=\"97\" y=\"84\">= 45<\/text><text class=\"slabel a\" x=\"135\" y=\"148\">= 75<\/text><text class=\"slabel r\" x=\"34\" y=\"30\">one block = k = 15<\/text><text class=\"slabel\" x=\"170\" y=\"184\" text-anchor=\"middle\">ratio 3 : 5, first actual 45<\/text><text class=\"slabel b\" x=\"170\" y=\"200\" text-anchor=\"middle\">second 75, total 120<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Ratio to actual value: the scale factor&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"arith","fm":[]},"tk_mix":{"title":"Mixtures and weighted averages","tag":"Applied Arithmetic","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Weighted average of two groups.<\/b>","rest":"The combined average is not the average of the two averages; it is dragged toward whichever group is larger, and it lands exactly at the midpoint only at a fifty-fifty split.","f":"avg = <sup>(w &middot; x&#8321; + (100 &minus; w) &middot; x&#8322;)<\/sup>&frasl;<sub>100<\/sub>","eg":"30 per cent of a class averages 90 and the other 70 per cent averages 50, so the class averages (30 &times; 90 + 70 &times; 50) &divide; 100 = 62, not 70.","trap":"Averaging the two averages. That answer is correct only when the groups are the same size; with unequal groups it always overstates the smaller group's pull.","fmn":"Weighted average of two groups","big":"The average of two groups leans toward the bigger group.","html":"<p>A <b>weighted average<\/b> counts each group by its size. So you cannot just average the two averages.<\/p><p><b>Rule:<\/b> average = (share 1 × average 1 + share 2 × average 2) ÷ 100, with the shares in percent.<\/p><div class=\"ex\"><b>Example:<\/b> 30% of a class averages 90. The other 70% averages 50.<ol><li>30 × 90 = 2,700<\/li><li>70 × 50 = 3,500<\/li><li>(2,700 + 3,500) ÷ 100 = <b>62<\/b><\/li><\/ol>The plain average of 90 and 50 is 70. But the answer is 62, closer to 50, because that group is bigger.<\/div><p class=\"warn\">⚠️ Averaging the two averages works only when the groups are the same size.<\/p>"},{"lead":"<b>Alligation: the mixing ratio.<\/b>","rest":"Running a weighted average backwards: the amounts you need are in the ratio of the <em>opposite<\/em> distances from the target, so the strength nearer the target is the one you need more of.","f":"w&#8321; : w&#8322; = (x&#8322; &minus; m) : (m &minus; x&#8321;)","eg":"To reach 15 per cent from a 10 per cent and a 25 per cent solution: distances 10 and 5, so mix 2 parts of the 10 per cent to 1 part of the 25 per cent.","trap":"Attaching each distance to the strength it was measured from. The distance to the <em>far<\/em> strength is the weight of the <em>near<\/em> one, so the ratio comes out inverted if the two are paired the obvious way.","fmn":"Alligation: the mixing ratio","big":"Mixing two strengths: use the distances, but swap them.","html":"<p>A \"10% solution\" is a liquid mix where 10% is the stuff (like acid). Here you know the goal strength and want the mix.<\/p><p><b>Rule:<\/b> amount of weak : amount of strong = (strong − goal) : (goal − weak).<\/p><div class=\"ex\"><b>Example:<\/b> mix a 10% and a 25% solution to get 15%.<ol><li>Distance from 10 to 15 is 5. Distance from 15 to 25 is 10.<\/li><li>Swap them: the 10% part gets 10, and the 25% part gets 5.<\/li><li>10 : 5 = <b>2 : 1<\/b> (2 parts of 10%, 1 part of 25%).<\/li><\/ol>Check: (2 × 10 + 1 × 25) ÷ 3 = 45 ÷ 3 = 15 ✅<\/div><p class=\"tip\">💡 The strength closer to the goal is the one you need more of.<\/p>"},{"lead":"<b>Concentration after adding pure solute.<\/b>","rest":"Pouring in the pure substance raises the top of the fraction and the bottom of it at once, so the strength climbs toward 100 per cent but never gets there.","f":"new per cent = 100 &middot; <sup>(V &middot; c/100 + a)<\/sup>&frasl;<sub>(V + a)<\/sub>","eg":"Add 30 litres of pure acid to 100 litres of 20 per cent acid: 100 &times; 50 &divide; 130 = 38.46 per cent.","trap":"Leaving the added litres out of the denominator. The pure solute is part of the new mixture too, so the total volume grows by exactly what was poured in.","fmn":"Concentration after adding pure solute","big":"Adding pure stuff to a mix makes the top and the bottom of the fraction grow.","html":"<p><b>Concentration<\/b> (strength) = amount of the stuff ÷ total amount × 100.<\/p><p>When you pour in the pure stuff, both numbers grow. The strength goes up, but it never reaches 100%.<\/p><div class=\"ex\"><b>Example:<\/b> add 30 litres of pure acid to 100 litres of 20% acid.<ol><li>Acid at the start: 20% of 100 = 20 litres<\/li><li>Acid now: 20 + 30 = 50 litres<\/li><li>Total now: 100 + 30 = 130 litres<\/li><li>Strength: 100 × 50 ÷ 130 ≈ <b>38.46%<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ Do not forget to add the 30 litres to the bottom too. The new acid is part of the total.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 340 215\"><path class=\"gline\" d=\"M 40 122 L 300 122\"/><path class=\"gline\" d=\"M 40 122 L 40 127\"/><text class=\"slabel\" x=\"40\" y=\"140\" text-anchor=\"middle\">0<\/text><path class=\"gline\" d=\"M 105 122 L 105 127\"/><text class=\"slabel\" x=\"105\" y=\"140\" text-anchor=\"middle\">25<\/text><path class=\"gline\" d=\"M 170 122 L 170 127\"/><text class=\"slabel\" x=\"170\" y=\"140\" text-anchor=\"middle\">50<\/text><path class=\"gline\" d=\"M 235 122 L 235 127\"/><text class=\"slabel\" x=\"235\" y=\"140\" text-anchor=\"middle\">75<\/text><path class=\"gline\" d=\"M 300 122 L 300 127\"/><text class=\"slabel\" x=\"300\" y=\"140\" text-anchor=\"middle\">100<\/text><rect class=\"shape\" x=\"265\" y=\"94.4\" width=\"18\" height=\"27.6\"/><rect class=\"shape\" x=\"161\" y=\"73.6\" width=\"18\" height=\"48.4\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><text class=\"slabel b\" x=\"274\" y=\"88.4\" text-anchor=\"middle\">30%<\/text><text class=\"slabel a\" x=\"170\" y=\"67.6\" text-anchor=\"middle\">70%<\/text><path class=\"aux\" d=\"M 222 30 L 222 122\"/><text class=\"slabel r\" x=\"222\" y=\"26\" text-anchor=\"middle\">plain 70<\/text><path class=\"shape\" d=\"M 191.2 142 L 211.2 142 L 201.2 122 Z\"/><text class=\"slabel\" x=\"170\" y=\"178\" text-anchor=\"middle\">30% at 90 and 70% at 50<\/text><text class=\"slabel b\" x=\"170\" y=\"196\" text-anchor=\"middle\">the balance point sits at 62<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Weighted average of two groups&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"arith","fm":[]},"tk_rates":{"title":"Speed and work","tag":"Applied Arithmetic","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Distance, rate and time.<\/b>","rest":"One relation, three faces &mdash; write down whichever two of the three you are given and the third is forced.","f":"d = r &middot; t &nbsp;&middot;&nbsp; t = <sup>d<\/sup>&frasl;<sub>r<\/sub> &nbsp;&middot;&nbsp; r = <sup>d<\/sup>&frasl;<sub>t<\/sub>","eg":"60 miles an hour for 2.5 hours covers 150 miles; the same 150 miles at 50 miles an hour takes 3 hours.","trap":"Mixing the units of r and t. 60 miles an hour for 40 minutes is 60 &times; (2/3) = 40 miles, not 60 &times; 40; the time must be in the same hours the rate names.","fmn":"Distance, rate and time","big":"Distance = speed × time. Know two, and you can find the third.","html":"<ul><li>distance = speed × time<\/li><li>time = distance ÷ speed<\/li><li>speed = distance ÷ time<\/li><\/ul><div class=\"ex\"><b>Example:<\/b><ol><li>60 miles an hour for 2.5 hours: 60 × 2.5 = <b>150 miles<\/b><\/li><li>150 miles at 50 miles an hour: 150 ÷ 50 = <b>3 hours<\/b> ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ The units must match. For 60 miles an hour for 40 minutes, change 40 minutes to 40/60 = 2/3 of an hour. Then 60 × 2/3 = <b>40 miles<\/b>, not 60 × 40.<\/p>"},{"lead":"<b>Average speed over two legs.<\/b>","rest":"Average speed is one division and one division only &mdash; every mile travelled over every hour spent &mdash; and the slow leg eats more hours than the fast one, so it pulls harder.","f":"avg = <sup>total distance<\/sup>&frasl;<sub>total time<\/sub> = <sup>2D<\/sup>&frasl;<sub>(D/r&#8321; + D/r&#8322;)<\/sub>","eg":"60 miles at 30 then 60 miles at 60: 120 miles in 2 + 1 = 3 hours, so 40 miles an hour &mdash; not the 45 the two speeds suggest.","trap":"Averaging the two speeds. That is right only when the two legs take equal <em>time<\/em>; over equal distances the answer is always below the plain average, because more of the trip is spent going slowly.","fmn":"Average speed over two legs","big":"Average speed = total distance ÷ total time. Never average the speeds.","html":"<div class=\"ex\"><b>Example:<\/b> drive 60 miles at 30 miles an hour, then 60 miles at 60 miles an hour.<ol><li>Time for part 1: 60 ÷ 30 = 2 hours<\/li><li>Time for part 2: 60 ÷ 60 = 1 hour<\/li><li>Total: 120 miles in 3 hours<\/li><li>Average speed: 120 ÷ 3 = <b>40 miles an hour<\/b><\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> you spend more time going slowly. So the slow part pulls the average down more.<\/p><p class=\"warn\">⚠️ (30 + 60) ÷ 2 = 45 is wrong. Averaging the speeds works only when both parts take the same time.<\/p>"},{"lead":"<b>Two workers combined.<\/b>","rest":"Rates add, times do not: convert each worker to a job per hour, add those, and invert once at the end.","f":"<sup>1<\/sup>&frasl;<sub>t<\/sub> = <sup>1<\/sup>&frasl;<sub>a<\/sub> + <sup>1<\/sup>&frasl;<sub>b<\/sub> &nbsp;&rarr;&nbsp; t = <sup>ab<\/sup>&frasl;<sub>(a + b)<\/sub>","eg":"One painter takes 6 hours, another 12; together (6 &times; 12) &divide; 18 = 4 hours.","trap":"Averaging the two times. Together they must finish faster than the faster worker alone, so any answer at or above 6 hours here is wrong before it is checked.","fmn":"Two workers combined","big":"Working together: add the work per hour, not the hours.","html":"<p>A worker's <b>rate<\/b> is how much of the job they finish in 1 hour. A 6-hour job means 1/6 of the job per hour.<\/p><p><b>Rule:<\/b> 1/a + 1/b = 1/(time together). Shortcut: time together = a × b ÷ (a + b).<\/p><div class=\"ex\"><b>Example:<\/b> one painter takes 6 hours. Another takes 12 hours.<ol><li>Rates: 1/6 + 1/12 = 2/12 + 1/12 = 3/12 = 1/4 of the job per hour<\/li><li>So together they need <b>4 hours<\/b>.<\/li><li>Shortcut check: 6 × 12 ÷ (6 + 12) = 72 ÷ 18 = 4 ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Together must be faster than the fastest worker alone. Here any answer of 6 hours or more is wrong.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 340 200\"><path class=\"gline\" d=\"M 28 58 L 312 58\"/><path class=\"gline\" d=\"M 28 92 L 312 92\"/><rect x=\"28\" y=\"61\" width=\"213\" height=\"28\" style=\"fill:var(--blue-wash);stroke:var(--blue)\"/><path class=\"gline\" d=\"M 113.2 61 L 113.2 89\"/><text class=\"slabel\" x=\"113.2\" y=\"52\" text-anchor=\"middle\">1h<\/text><path class=\"gline\" d=\"M 198.4 61 L 198.4 89\"/><text class=\"slabel\" x=\"198.4\" y=\"52\" text-anchor=\"middle\">2h<\/text><path class=\"aux\" d=\"M 231 56 L 241 75 L 231 94\"/><path class=\"gline\" d=\"M 28 102 L 28 108 L 312 108 L 312 102\"/><text class=\"slabel\" x=\"170\" y=\"122\" text-anchor=\"middle\">the road runs to 200 miles<\/text><text class=\"slabel b\" x=\"170\" y=\"158\" text-anchor=\"middle\">60 miles an hour &times; 2.5 hours<\/text><text class=\"slabel r\" x=\"170\" y=\"178\" text-anchor=\"middle\">150 miles covered<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Distance, rate and time&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"arith","fm":[]},"tk_units":{"title":"Units, prices and scaling","tag":"Applied Arithmetic","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Unit price.<\/b>","rest":"Divide the money by the goods and every package becomes comparable, whatever odd size it is sold in.","f":"price per unit = <sup>total cost<\/sup>&frasl;<sub>quantity<\/sub>","eg":"$12 for 16 ounces is 12 &divide; 16 = $0.75 an ounce; a 4-ounce pack at $5 is $1.25 an ounce, so the big pack wins.","trap":"Turning the fraction over without turning the comparison over. Dollars per unit is better when it is <em>smaller<\/em>; units per dollar is better when it is larger, and swapping the two reverses the verdict.","fmn":"Unit price","big":"Unit price = total cost ÷ how many units. Then compare.","html":"<p>The <b>unit price<\/b> is the cost of one unit (one ounce, one item, and so on).<\/p><div class=\"ex\"><b>Example:<\/b> which is the better deal?<ol><li>Big pack: $12 for 16 ounces → 12 ÷ 16 = $0.75 an ounce<\/li><li>Small pack: $5 for 4 ounces → 5 ÷ 4 = $1.25 an ounce<\/li><li>The smaller price per ounce wins → the <b>big pack<\/b> ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ Dollars per ounce: smaller is better. Ounces per dollar: bigger is better. Do not mix them up.<\/p>"},{"lead":"<b>Unit conversion by cancelling.<\/b>","rest":"Write every conversion as a fraction equal to 1 and stack them so the unwanted units cancel diagonally; the units themselves tell you which way up each factor goes.","f":"metres = r <sup>km<\/sup>&frasl;<sub>h<\/sub> &middot; <sup>1,000 m<\/sup>&frasl;<sub>1 km<\/sub> &middot; <sup>1 h<\/sup>&frasl;<sub>60 min<\/sub> &middot; t min","eg":"72 km an hour for 10 minutes is 72 &times; 1,000 &divide; 60 &times; 10 = 12,000 metres.","trap":"Putting a factor upside down. Multiplying by 60 instead of dividing gives an answer 3,600 times too large, and the only guard is checking that the unwanted unit actually cancelled.","fmn":"Unit conversion by cancelling","big":"Change units by multiplying by fractions that equal 1.","html":"<p>A fraction like 1,000 m / 1 km equals 1, because both are the same length. Set it up so each unit you do not want is on the top once and the bottom once. Then it cancels.<\/p><div class=\"ex\"><b>Example:<\/b> a car goes 72 km an hour for 10 minutes. How many metres?<ol><li>km → metres: 72 × 1,000 = 72,000 metres an hour<\/li><li>hour → minutes: 72,000 ÷ 60 = 1,200 metres a minute<\/li><li>10 minutes: 1,200 × 10 = <b>12,000 metres<\/b> ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ If a fraction is upside down, the units will not cancel. Multiplying by 60 when you should divide makes the answer 3,600 times too big.<\/p>"},{"lead":"<b>Scaling: k&sup2; for area, k&sup3; for volume.<\/b>","rest":"One scale factor governs a whole figure, but it enters once for a length, twice for anything two-dimensional and three times for anything three-dimensional.","f":"length &times; k &nbsp;&rarr;&nbsp; area &times; k<sup>2<\/sup> &nbsp;&rarr;&nbsp; volume &times; k<sup>3<\/sup>","eg":"Double the side of a cube of side 4: the surface goes from 96 to 384 and the volume from 64 to 512 &mdash; four times and eight times, not two.","trap":"Applying k to the area or the volume directly. Doubling every length multiplies area by 4 and volume by 8, and stretching every length by half multiplies volume by 1.5<sup>3<\/sup> = 3.375, not by 1.5.","fmn":"Scaling: k² for area, k³ for volume","big":"Make every length k times bigger: area grows k², volume grows k³.","html":"<ul><li>Length → × k<\/li><li>Area (flat space, like a floor) → × k²<\/li><li>Volume (space inside, like a box) → × k³<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> a cube has side 4. Double the side to 8 (k = 2).<ol><li>Surface area: 6 × 4² = 96 → 6 × 8² = 384. That is <b>× 4<\/b> (2²).<\/li><li>Volume: 4³ = 64 → 8³ = 512. That is <b>× 8<\/b> (2³) ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ Doubling the sides does not double the area or the volume. Making each side 1.5 times longer multiplies the volume by 1.5³ = 3.375, not 1.5.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 340 210\"><rect class=\"shape\" x=\"34\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"49\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"64\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"79\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"94\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"109\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"124\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"139\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"154\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"169\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"184\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"199\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"214\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"229\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"244\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"259\" y=\"30\" width=\"13.5\" height=\"28\"/><text class=\"slabel b\" x=\"280\" y=\"48\">16 units<\/text><rect class=\"shape\" x=\"34\" y=\"84\" width=\"48\" height=\"32\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><text class=\"slabel a\" x=\"88\" y=\"105\">12 dollars<\/text><path class=\"gline\" d=\"M 37 84 L 37 116\"/><path class=\"gline\" d=\"M 40 84 L 40 116\"/><path class=\"gline\" d=\"M 43 84 L 43 116\"/><path class=\"gline\" d=\"M 46 84 L 46 116\"/><path class=\"gline\" d=\"M 49 84 L 49 116\"/><path class=\"gline\" d=\"M 52 84 L 52 116\"/><path class=\"gline\" d=\"M 55 84 L 55 116\"/><path class=\"gline\" d=\"M 58 84 L 58 116\"/><path class=\"gline\" d=\"M 61 84 L 61 116\"/><path class=\"gline\" d=\"M 64 84 L 64 116\"/><path class=\"gline\" d=\"M 67 84 L 67 116\"/><path class=\"gline\" d=\"M 70 84 L 70 116\"/><path class=\"gline\" d=\"M 73 84 L 73 116\"/><path class=\"gline\" d=\"M 76 84 L 76 116\"/><path class=\"gline\" d=\"M 79 84 L 79 116\"/><rect x=\"34\" y=\"84\" width=\"3\" height=\"32\" style=\"fill:var(--amber);stroke:var(--amber)\"/><path class=\"aux\" d=\"M 34 126 L 37 126\"/><text class=\"slabel r\" x=\"68.7\" y=\"142\" text-anchor=\"middle\">one unit costs 0.75<\/text><text class=\"slabel\" x=\"170\" y=\"176\" text-anchor=\"middle\">12 dollars &divide; 16 units<\/text><text class=\"slabel b\" x=\"170\" y=\"194\" text-anchor=\"middle\">0.75 dollars a unit<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Unit price&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"arith","fm":[]},"tk_eq":{"title":"Equations and systems","tag":"Algebra","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Solving a linear equation.<\/b>","rest":"Strip the equation down in the order it was built up &mdash; undo the addition first, then undo the multiplication.","f":"ax + b = c &nbsp;&rarr;&nbsp; x = (c &minus; b) &divide; a","eg":"3x + 4 = 10 gives 3x = 6, so x = 2.","trap":"Dividing by a is only legal when a is not zero. Slide a to 0 and the equation stops being about x at all &mdash; it becomes a claim about numbers that is either always true or never true.","fmn":"Solving a linear equation","big":"Solve an equation by undoing in reverse: first add or subtract, then divide.","html":"<p><b>Rule:<\/b> ax + b = c → x = (c − b) ÷ a. Here x is the unknown number.<\/p><div class=\"ex\"><b>Example:<\/b> 3x + 4 = 10<ol><li>Undo the + 4: subtract 4 from both sides → 3x = 6<\/li><li>Undo the × 3: divide both sides by 3 → <b>x = 2<\/b><\/li><li>Check: 3 × 2 + 4 = 10 ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ You can only divide by a if a is not 0. If a = 0, there is no x left. Then the equation is either always true or never true.<\/p>"},{"lead":"<b>Solving a proportion.<\/b>","rest":"Cross-multiply: the product of one diagonal equals the product of the other, which turns a fraction equation into one multiplication.","f":"a &divide; b = c &divide; x &nbsp;&rarr;&nbsp; x = bc &divide; a","eg":"3 &divide; 4 = 15 &divide; x cross-multiplies to 3x = 60, so x = 20.","trap":"Cross-multiplying works down the diagonals, not across the tops. Writing ax = bc as ac = bx swaps two of the four terms and gives a different answer every time a is not equal to c.","fmn":"Solving a proportion","big":"Fraction = fraction? Cross-multiply.","html":"<p>Multiply along the X shape: top left × bottom right = bottom left × top right.<\/p><p><b>Rule:<\/b> a/b = c/x → a × x = b × c → x = b × c ÷ a<\/p><div class=\"ex\"><b>Example:<\/b> 3/4 = 15/x<ol><li>Cross-multiply: 3 × x = 4 × 15 → 3x = 60<\/li><li>Divide by 3: <b>x = 20<\/b><\/li><li>Check: 15/20 = 3/4 ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ Multiply along the X, not straight across. 3 × 15 = 4 × x is wrong and gives a different answer.<\/p>"},{"lead":"<b>System of two linear equations.<\/b>","rest":"Two lines, one crossing point &mdash; eliminate one letter by scaling one equation until its coefficient matches the other, then subtract.","f":"2x + 4y = c<sub>1<\/sub>, &nbsp; ax + 2y = c<sub>2<\/sub>","eg":"2x + 4y = 12 and 3x + 2y = 10 give x = 2 and y = 2.","trap":"Two equations do not always pin down two unknowns. Slide a to 1 and the second equation becomes half the first: the lines are parallel, and either nothing satisfies both or everything on one line does. Check whether one equation is a multiple of the other before you start eliminating.","fmn":"System of two linear equations","big":"Two equations, two unknowns: make one letter match, then subtract it away.","html":"<div class=\"ex\"><b>Example:<\/b> 2x + 4y = 12 and 3x + 2y = 10<ol><li>Multiply the second equation by 2 so both have 4y: 6x + 4y = 20<\/li><li>Subtract the first equation: (6x + 4y) − (2x + 4y) = 20 − 12 → 4x = 8 → <b>x = 2<\/b><\/li><li>Put x = 2 into the first: 4 + 4y = 12 → 4y = 8 → <b>y = 2<\/b><\/li><li>Check the second: 3 × 2 + 2 × 2 = 10 ✅<\/li><\/ol><\/div><p>Each equation is a line. The answer is the point where the two lines cross.<\/p><p class=\"warn\">⚠️ Check first: is one equation just a multiple of the other? Then the lines are parallel. Example: x + 2y = 6 and 2x + 4y = 12 are the same line, so there are endless answers. But x + 2y = 5 and 2x + 4y = 12 never meet, so there is no answer.<\/p>"},{"lead":"<b>Adding algebraic fractions.<\/b>","rest":"Each numerator picks up whatever its own denominator was missing, and the new denominator is the product of the two.","f":"a &divide; x + b &divide; (x + 2) = (a(x + 2) + bx) &divide; (x(x + 2))","eg":"3/x + 2/(x + 2) at x = 4 is (3(6) + 2(4)) &divide; 24 = 26/24, about 1.083.","trap":"The common denominator is x(x + 2), not x + 2 and not 2x + 2. And every term in the numerator must be multiplied out before anything is cancelled &mdash; x does not cancel between the x in a(x + 2) and the x on the bottom. Two values of x, 0 and &minus;2, are barred outright.","fmn":"Adding algebraic fractions","big":"To add fractions with letters, make the bottoms the same first.","html":"<p><b>Rule:<\/b> a/x + b/(x + 2) = [a(x + 2) + bx] ÷ [x(x + 2)]<\/p><ul><li>The new bottom is the two bottoms multiplied: x(x + 2).<\/li><li>Each top is multiplied by the bottom it was missing.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> 3/x + 2/(x + 2) when x = 4<ol><li>New bottom: 4 × 6 = 24<\/li><li>New top: 3 × 6 + 2 × 4 = 18 + 8 = 26<\/li><li>Answer: 26/24 = <b>13/12<\/b>, about 1.083 ✅ (check: 3/4 + 2/6 = 0.75 + 0.333 = 1.083)<\/li><\/ol><\/div><p class=\"warn\">⚠️ Multiply out the top before you cancel anything. And x cannot be 0 or −2, because then a bottom is 0.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 320 200\"><path class=\"gline\" d=\"M 24 93 L 300 93\"/><path class=\"gline\" d=\"M 162 22 L 162 164\"/><path class=\"gline\" d=\"M 24 90 L 24 96\"/><path class=\"gline\" d=\"M 70 90 L 70 96\"/><path class=\"gline\" d=\"M 116 90 L 116 96\"/><path class=\"gline\" d=\"M 208 90 L 208 96\"/><path class=\"gline\" d=\"M 254 90 L 254 96\"/><path class=\"gline\" d=\"M 300 90 L 300 96\"/><path class=\"gline\" d=\"M 159 140.3 L 165 140.3\"/><path class=\"gline\" d=\"M 159 116.7 L 165 116.7\"/><path class=\"gline\" d=\"M 159 69.3 L 165 69.3\"/><path class=\"gline\" d=\"M 159 45.7 L 165 45.7\"/><path style=\"fill:none;stroke:var(--green);stroke-width:2;stroke-dasharray:6 4\" d=\"M 24 63.4 L 300 63.4\"/><path style=\"fill:none;stroke:var(--blue);stroke-width:2\" d=\"M 54.7 164 L 238.7 22\"/><circle class=\"handle\" cx=\"162\" cy=\"81.2\" r=\"3.5\"/><text class=\"slabel b\" x=\"168\" y=\"75.2\">b = 4<\/text><path class=\"aux\" d=\"M 185 63.4 L 185 93\"/><circle class=\"handle\" cx=\"185\" cy=\"63.4\" r=\"5\"/><text class=\"slabel b\" x=\"24\" y=\"13\">y = 3x + 4<\/text><text class=\"slabel g\" x=\"300\" y=\"13\" text-anchor=\"end\">y = 10<\/text><text class=\"slabel\" x=\"162\" y=\"191\" text-anchor=\"middle\">they cross at x = 2<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Solving a linear equation&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"alg","fm":[]},"tk_sq":{"title":"Squares and factoring","tag":"Algebra","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Square of a sum.<\/b>","rest":"Squaring a sum is not squaring the two pieces &mdash; the cross term 2ab is the rectangle you cut off if you forget it.","f":"(a + b)<sup>2<\/sup> = a<sup>2<\/sup> + 2ab + b<sup>2<\/sup>","eg":"(7 + 3)&sup2; = 49 + 42 + 9 = 100, which is 10&sup2; as it must be.","trap":"(a + b)&sup2; is never a&sup2; + b&sup2;. The gap between them is exactly 2ab, and 2ab is larger than either square whenever a and b are close together.","fmn":"Square of a sum","big":"(a + b)² is NOT a² + b². Do not forget the middle part, 2ab.","html":"<p><b>Rule:<\/b> (a + b)² = a² + 2ab + b²<\/p><div class=\"ex\"><b>Example:<\/b> (7 + 3)²<ol><li>a² = 7² = 49<\/li><li>2ab = 2 × 7 × 3 = 42<\/li><li>b² = 3² = 9<\/li><li>49 + 42 + 9 = <b>100<\/b> ✅ (check: 7 + 3 = 10, and 10² = 100)<\/li><\/ol><\/div><p class=\"warn\">⚠️ 7² + 3² = 58, not 100. The missing 42 is the 2ab part.<\/p>"},{"lead":"<b>Square of a difference.<\/b>","rest":"The same identity as the square of a sum with b made negative &mdash; only the middle term changes sign, and the result is never negative.","f":"(a &minus; b)<sup>2<\/sup> = a<sup>2<\/sup> &minus; 2ab + b<sup>2<\/sup>","eg":"(9 &minus; 4)&sup2; = 81 &minus; 72 + 16 = 25, which is 5&sup2;.","trap":"The last term is +b&sup2;, not &minus;b&sup2;. Two minus signs are being multiplied there. Push b past a and watch the answer climb again &mdash; a square cannot go below zero.","fmn":"Square of a difference","big":"(a − b)² = a² − 2ab + b². Only the middle sign changes.","html":"<div class=\"ex\"><b>Example:<\/b> (9 − 4)²<ol><li>a² = 9² = 81<\/li><li>2ab = 2 × 9 × 4 = 72, and it gets a minus sign<\/li><li>b² = 4² = 16, and it stays plus<\/li><li>81 − 72 + 16 = <b>25<\/b> ✅ (check: 9 − 4 = 5, and 5² = 25)<\/li><\/ol><\/div><p class=\"warn\">⚠️ The last part is <b>+<\/b>b², not −b². A minus times a minus is a plus.<\/p><p class=\"tip\">💡 A square is never below 0. So (a − b)² is always 0 or more, even when b is bigger than a.<\/p>"},{"lead":"<b>Difference of two squares.<\/b>","rest":"A subtraction of two squares always splits into a sum times a difference, which turns a hard subtraction into two easy multiplications.","f":"a<sup>2<\/sup> &minus; b<sup>2<\/sup> = (a + b)(a &minus; b)","eg":"9&sup2; &minus; 4&sup2; = (9 + 4)(9 &minus; 4) = 13 &times; 5 = 65.","trap":"There is no matching split for a&sup2; + b&sup2; over the real numbers. A sum of two squares does not factor. The cubes do split &mdash; a&sup3; &minus; b&sup3; = (a &minus; b)(a&sup2; + ab + b&sup2;) &mdash; but the quadratic piece there is a sum, not a difference.","fmn":"Difference of two squares","big":"a² − b² = (a + b)(a − b). It turns a hard subtraction into easy steps.","html":"<div class=\"ex\"><b>Example:<\/b> 9² − 4²<ol><li>a + b = 9 + 4 = 13<\/li><li>a − b = 9 − 4 = 5<\/li><li>13 × 5 = <b>65<\/b> ✅ (check: 81 − 16 = 65)<\/li><\/ol><\/div><p class=\"tip\">💡 Great for mental math: 51² − 49² = (51 + 49)(51 − 49) = 100 × 2 = 200.<\/p><p class=\"warn\">⚠️ a² + b² (with a plus) does <b>not<\/b> split like this. Only the minus works. Cubes have their own rule: a³ − b³ = (a − b)(a² + ab + b²).<\/p>"},{"lead":"<b>Factoring a quadratic.<\/b>","rest":"Look for the pair of numbers that multiplies to the constant and adds to the middle coefficient &mdash; the constant is the stronger clue, so list its factor pairs first.","f":"x<sup>2<\/sup> + Bx + C = (x + p)(x + q), &nbsp; p + q = B, &nbsp; pq = C","eg":"x&sup2; + 7x + 12 wants a pair multiplying to 12 and adding to 7 &mdash; 3 and 4 &mdash; giving (x + 3)(x + 4).","trap":"The roots are the negatives of p and q. (x + 3)(x + 4) is zero at x = &minus;3 and x = &minus;4, not at 3 and 4. Slide C below zero and the pair must have opposite signs, which is the case people mis-sign most often.","fmn":"Factoring a quadratic","big":"To factor x² + Bx + C, find two numbers that multiply to C and add to B.","html":"<p><b>Factoring<\/b> means writing it as two brackets multiplied together.<\/p><p><b>Rule:<\/b> x² + Bx + C = (x + p)(x + q), where p × q = C and p + q = B.<\/p><div class=\"ex\"><b>Example:<\/b> x² + 7x + 12<ol><li>Pairs that multiply to 12: 1 and 12, 2 and 6, 3 and 4.<\/li><li>Which pair adds to 7? 3 + 4 = 7.<\/li><li>Answer: <b>(x + 3)(x + 4)<\/b> ✅ (check: x² + 4x + 3x + 12 = x² + 7x + 12)<\/li><\/ol><\/div><p class=\"tip\">💡 Start with the multiply clue (12). It has fewer choices.<\/p><p class=\"warn\">⚠️ The x values that make (x + 3)(x + 4) = 0 are x = −3 and x = −4, not 3 and 4. And if C is negative, one number is plus and the other is minus.<\/p>"},{"lead":"<b>Completing the square.<\/b>","rest":"Half the coefficient of x, squared, is exactly what the perfect square wants &mdash; so add it inside and subtract it outside, and nothing has changed but the shape.","f":"x<sup>2<\/sup> + bx + c = (x + <sup>b<\/sup>&frasl;<sub>2<\/sub>)<sup>2<\/sup> &minus; <sup>b<sup>2<\/sup><\/sup>&frasl;<sub>4<\/sub> + c","eg":"x<sup>2<\/sup> + 6x + 5: half of 6 is 3, and 3<sup>2<\/sup> is 9, so it is (x + 3)<sup>2<\/sup> &minus; 9 + 5 = (x + 3)<sup>2<\/sup> &minus; 4. The least value is &minus;4, reached at x = &minus;3.","trap":"Halve b <em>before<\/em> squaring, not after. And the number you subtract outside is b<sup>2<\/sup>&divide;4, not b&divide;2 &mdash; the square you added inside is worth (b&divide;2)<sup>2<\/sup>, so that is what has to come back off.","fmn":"Completing the square","big":"Completing the square: take half of the x number, then square it.","html":"<p>This rewrites x² + bx + c as (something)² plus a number. It helps you find the smallest value.<\/p><p><b>Rule:<\/b> x² + bx + c = (x + b/2)² − (b/2)² + c<\/p><div class=\"ex\"><b>Example:<\/b> x² + 6x + 5<ol><li>Half of 6 is 3. Then 3² = 9.<\/li><li>Add 9 and take 9 away: x² + 6x + 9 − 9 + 5<\/li><li>x² + 6x + 9 = (x + 3)², so this is <b>(x + 3)² − 4<\/b><\/li><\/ol>Check: (x + 3)² − 4 = x² + 6x + 9 − 4 = x² + 6x + 5 ✅<\/div><p class=\"tip\">💡 A square is never below 0. So the smallest value is <b>−4<\/b>, when x = −3.<\/p><p class=\"warn\">⚠️ Halve first, then square. You take away (b/2)² = b²/4, not b/2.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 300 200\"><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.5\" x=\"70\" y=\"26\" width=\"91\" height=\"91\"/><rect style=\"fill:var(--amber-wash);stroke:var(--amber);stroke-width:1.5\" x=\"161\" y=\"26\" width=\"39\" height=\"91\"/><rect style=\"fill:var(--amber-wash);stroke:var(--amber);stroke-width:1.5\" x=\"70\" y=\"117\" width=\"91\" height=\"39\"/><rect style=\"fill:var(--red-wash);stroke:var(--red);stroke-width:1.5\" x=\"161\" y=\"117\" width=\"39\" height=\"39\"/><text class=\"slabel\" x=\"115.5\" y=\"75.5\" text-anchor=\"middle\">a&sup2;<\/text><text class=\"slabel\" x=\"180.5\" y=\"140.5\" text-anchor=\"middle\">b&sup2;<\/text><text class=\"slabel a\" x=\"180.5\" y=\"75.5\" text-anchor=\"middle\">ab<\/text><text class=\"slabel a\" x=\"115.5\" y=\"140.5\" text-anchor=\"middle\">ab<\/text><path class=\"gline\" d=\"M 70 22 L 70 24 M 161 22 L 161 24 M 200 22 L 200 24\"/><text class=\"slabel b\" x=\"115.5\" y=\"18\" text-anchor=\"middle\">a = 7<\/text><text class=\"slabel a\" x=\"180.5\" y=\"18\" text-anchor=\"middle\">b = 3<\/text><text class=\"slabel b\" x=\"64\" y=\"75.5\" text-anchor=\"end\">a<\/text><text class=\"slabel a\" x=\"64\" y=\"140.5\" text-anchor=\"end\">b<\/text><text class=\"slabel\" x=\"150\" y=\"176\" text-anchor=\"middle\">(a + b)&sup2; = 100<\/text><text class=\"slabel\" x=\"150\" y=\"192\" text-anchor=\"middle\">49 + 42 + 9<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Square of a sum&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"alg","fm":[]},"tk_roots":{"title":"The roots of a quadratic","tag":"Algebra","say":"","note":"","tries":[],"ideas":[{"lead":"<b>The quadratic formula.<\/b>","rest":"The formula that solves every quadratic, whether or not it factors &mdash; use it when the factor pair refuses to appear.","f":"x = (&minus;b &plusmn; &radic;(b<sup>2<\/sup> &minus; 4ac)) &divide; 2a","eg":"For x&sup2; &minus; 5x + 6 the discriminant is 25 &minus; 24 = 1, so x = (5 &plusmn; 1) &divide; 2, giving 3 and 2.","trap":"The &minus;b covers the whole numerator and the 2a covers the whole fraction. Writing &minus;b &plusmn; &radic;(&hellip;) &divide; 2a without brackets divides only the root by 2a. Slide a to 0 and the formula dies &mdash; there is no 2a to divide by.","fmn":"The quadratic formula","big":"The quadratic formula solves any x² equation, even ones that do not factor.","html":"<p>For ax² + bx + c = 0 (a, b and c are the numbers in front):<\/p><p><b>Rule:<\/b> x = (−b ± √(b² − 4ac)) ÷ 2a. The ± means do it once with + and once with −.<\/p><div class=\"ex\"><b>Example:<\/b> x² − 5x + 6 = 0, so a = 1, b = −5, c = 6.<ol><li>b² − 4ac = 25 − 24 = 1, and √1 = 1<\/li><li>x = (5 ± 1) ÷ 2<\/li><li>x = 6 ÷ 2 = <b>3<\/b> or x = 4 ÷ 2 = <b>2<\/b> ✅ (check: 3² − 5 × 3 + 6 = 0)<\/li><\/ol><\/div><p class=\"warn\">⚠️ Divide the <b>whole<\/b> top by 2a, not just the root part. And a cannot be 0, or you would divide by 0.<\/p>"},{"lead":"<b>The discriminant.<\/b>","rest":"One number that counts the real roots before you find any of them: positive means two, zero means one, negative means none.","f":"D = b<sup>2<\/sup> &minus; 4ac","eg":"For x&sup2; + 4x + 3 the discriminant is 16 &minus; 12 = 4 &mdash; positive and a perfect square, so two rational roots.","trap":"4ac carries its own sign. When c is negative, &minus;4ac adds to b&sup2; and the discriminant is forced positive, so a quadratic with a negative constant always has two real roots. Slide c up through the point where D hits zero and watch two roots collapse into one, then vanish.","fmn":"The discriminant","big":"b² − 4ac tells you how many answers there are before you solve.","html":"<p>This number is called the <b>discriminant<\/b>. For ax² + bx + c = 0:<\/p><ul><li>Positive → <b>2<\/b> real answers<\/li><li>Zero → <b>1<\/b> answer<\/li><li>Negative → <b>no<\/b> real answers<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> x² + 4x + 3 = 0<ol><li>a = 1, b = 4, c = 3<\/li><li>b² − 4ac = 16 − 12 = <b>4<\/b><\/li><li>Positive, so 2 answers. 4 is a perfect square (2²), so they are neat numbers: x = −1 and x = −3 ✅<\/li><\/ol><\/div><p class=\"tip\">💡 If a is positive and c is negative, then −4ac is positive. So b² − 4ac is positive, and there are always 2 answers.<\/p>"},{"lead":"<b>Sum and product of the roots.<\/b>","rest":"The two roots can be read straight off the coefficients, which answers most questions about them without solving anything.","f":"sum = &minus;b &divide; a, &nbsp;&nbsp; product = c &divide; a","eg":"2x&sup2; &minus; 6x + 4 has sum 6 &divide; 2 = 3 and product 4 &divide; 2 = 2 &mdash; the roots are 1 and 2.","trap":"The sum carries a minus sign and the product does not. And both are divided by a, not by 1: doubling every coefficient leaves the roots alone, but forgetting the a turns 2x&sup2; &minus; 6x + 4 into a sum of 6 instead of 3.","fmn":"Sum and product of the roots","big":"Get the sum and product of the answers without solving.","html":"<p>For ax² + bx + c = 0, the two answers (called roots) follow these rules:<\/p><ul><li><b>Sum<\/b> = −b ÷ a<\/li><li><b>Product<\/b> (the two multiplied) = c ÷ a<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> 2x² − 6x + 4 = 0, so a = 2, b = −6, c = 4.<ol><li>Sum = −(−6) ÷ 2 = <b>3<\/b><\/li><li>Product = 4 ÷ 2 = <b>2<\/b><\/li><li>Two numbers that add to 3 and multiply to 2: <b>1 and 2<\/b> ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ The sum has a minus sign. The product does not. And always divide by a. Forgetting a here gives a sum of 6, not 3.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 320 200\"><path class=\"gline\" d=\"M 24 95 L 300 95\"/><path class=\"gline\" d=\"M 162 22 L 162 168\"/><path class=\"gline\" d=\"M 43.7 92 L 43.7 98\"/><path class=\"gline\" d=\"M 83.1 92 L 83.1 98\"/><path class=\"gline\" d=\"M 122.6 92 L 122.6 98\"/><path class=\"gline\" d=\"M 201.4 92 L 201.4 98\"/><path class=\"gline\" d=\"M 240.9 92 L 240.9 98\"/><path class=\"gline\" d=\"M 280.3 92 L 280.3 98\"/><path class=\"gline\" d=\"M 159 149.8 L 165 149.8\"/><path class=\"gline\" d=\"M 159 131.5 L 165 131.5\"/><path class=\"gline\" d=\"M 159 113.3 L 165 113.3\"/><path class=\"gline\" d=\"M 159 76.8 L 165 76.8\"/><path class=\"gline\" d=\"M 159 58.5 L 165 58.5\"/><path class=\"gline\" d=\"M 159 40.3 L 165 40.3\"/><path style=\"fill:none;stroke:var(--blue);stroke-width:2\" d=\" M 122.6 22 L 124.5 25.2 L 126.5 28.4 L 128.5 31.5 L 130.5 34.6 L 132.4 37.5 L 134.4 40.4 L 136.4 43.2 L 138.3 45.9 L 140.3 48.6 L 142.3 51.2 L 144.3 53.7 L 146.2 56.2 L 148.2 58.5 L 150.2 60.8 L 152.1 63.1 L 154.1 65.2 L 156.1 67.3 L 158.1 69.3 L 160 71.2 L 162 73.1 L 164 74.9 L 165.9 76.6 L 167.9 78.2 L 169.9 79.8 L 171.9 81.3 L 173.8 82.7 L 175.8 84.1 L 177.8 85.4 L 179.7 86.6 L 181.7 87.7 L 183.7 88.8 L 185.7 89.7 L 187.6 90.7 L 189.6 91.5 L 191.6 92.3 L 193.5 93 L 195.5 93.6 L 197.5 94.1 L 199.5 94.6 L 201.4 95 L 203.4 95.3 L 205.4 95.6 L 207.3 95.8 L 209.3 95.9 L 211.3 95.9 L 213.3 95.9 L 215.2 95.8 L 217.2 95.6 L 219.2 95.3 L 221.1 95 L 223.1 94.6 L 225.1 94.1 L 227.1 93.6 L 229 93 L 231 92.3 L 233 91.5 L 234.9 90.7 L 236.9 89.7 L 238.9 88.8 L 240.9 87.7 L 242.8 86.6 L 244.8 85.4 L 246.8 84.1 L 248.7 82.7 L 250.7 81.3 L 252.7 79.8 L 254.7 78.2 L 256.6 76.6 L 258.6 74.9 L 260.6 73.1 L 262.5 71.2 L 264.5 69.3 L 266.5 67.3 L 268.5 65.2 L 270.4 63.1 L 272.4 60.8 L 274.4 58.5 L 276.3 56.2 L 278.3 53.7 L 280.3 51.2 L 282.3 48.6 L 284.2 45.9 L 286.2 43.2 L 288.2 40.4 L 290.1 37.5 L 292.1 34.6 L 294.1 31.5 L 296.1 28.4 L 298 25.2 L 300 22\"/><path class=\"aux\" d=\"M 211.3 22 L 211.3 168\"/><circle class=\"handle\" cx=\"201.4\" cy=\"95\" r=\"5\"/><circle class=\"handle\" cx=\"221.1\" cy=\"95\" r=\"5\"/><text class=\"slabel b\" x=\"24\" y=\"13\">y = 1x&sup2; &minus; 5x + 6<\/text><text class=\"slabel\" x=\"162\" y=\"191\" text-anchor=\"middle\">D = 1, roots 2 and 3<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;The quadratic formula&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"alg","fm":[]},"tk_pow":{"title":"Powers and roots","tag":"Algebra","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Multiplying and dividing powers.<\/b>","rest":"Same base, so the exponents do the arithmetic: multiplying adds them, dividing subtracts them.","f":"a<sup>m<\/sup> &middot; a<sup>n<\/sup> = a<sup>m+n<\/sup>, &nbsp;&nbsp; a<sup>m<\/sup> &divide; a<sup>n<\/sup> = a<sup>m&minus;n<\/sup>","eg":"2&#8309; &middot; 2&sup3; = 2&#8312; = 256, while 2&#8309; &divide; 2&sup3; = 2&sup2; = 4.","trap":"These rules need the <em>same base<\/em>. 2&sup3; &middot; 3&sup2; is not 6&#8309; and not 5&#8309;. Set m equal to n and the quotient becomes a<sup>0<\/sup> = 1, which is where the zero exponent comes from in the first place.","fmn":"Multiplying and dividing powers","big":"Same base: to multiply, add the powers. To divide, subtract them.","html":"<p>In 2⁵, the <b>base<\/b> is 2 (the number multiplied) and the <b>power<\/b> is 5 (how many times).<\/p><ul><li>a<sup>m<\/sup> × a<sup>n<\/sup> = a<sup>m+n<\/sup><\/li><li>a<sup>m<\/sup> ÷ a<sup>n<\/sup> = a<sup>m−n<\/sup><\/li><\/ul><div class=\"ex\"><b>Example:<\/b><ol><li>2⁵ × 2³ = 2<sup>5+3<\/sup> = 2⁸ = <b>256<\/b><\/li><li>2⁵ ÷ 2³ = 2<sup>5−3<\/sup> = 2² = <b>4<\/b> ✅ (check: 32 ÷ 8 = 4)<\/li><\/ol><\/div><p class=\"warn\">⚠️ The bases must be the same. 2³ × 3² = 8 × 9 = 72. It is not 6⁵ and not 5⁵.<\/p><p class=\"tip\">💡 2³ ÷ 2³ = 2⁰ = 1. That is why a number to the power 0 is 1.<\/p>"},{"lead":"<b>Power of a power.<\/b>","rest":"A power raised to a power multiplies the exponents, because you are writing out m copies of the base n times over.","f":"(a<sup>m<\/sup>)<sup>n<\/sup> = a<sup>mn<\/sup>","eg":"(3&sup2;)&sup3; = 3&#8310; = 729 &mdash; not 3&#8309;, and not 9&sup3; written as 9 to the power 3 by accident.","trap":"Multiply the exponents here, add them only when the powers sit side by side. (a<sup>2<\/sup>)<sup>3<\/sup> = a<sup>6<\/sup> but a<sup>2<\/sup> &middot; a<sup>3<\/sup> = a<sup>5<\/sup>. Make one exponent negative and the product flips sign, sending the whole thing below 1.","fmn":"Power of a power","big":"A power of a power: multiply the powers.","html":"<p><b>Rule:<\/b> (a<sup>m<\/sup>)<sup>n<\/sup> = a<sup>m×n<\/sup><\/p><div class=\"ex\"><b>Example:<\/b> (3²)³<ol><li>Multiply the powers: 2 × 3 = 6<\/li><li>3⁶ = <b>729<\/b> ✅ (check: 3² = 9, and 9³ = 9 × 9 × 9 = 729)<\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> (3²)³ = 3² × 3² × 3². That is 2 + 2 + 2 = 6 threes multiplied.<\/p><p class=\"warn\">⚠️ Multiply when it is a power of a power: (a²)³ = a⁶. Add when the powers sit side by side: a² × a³ = a⁵.<\/p>"},{"lead":"<b>Negative and zero exponents.<\/b>","rest":"A negative exponent is not a negative number &mdash; it is an instruction to turn the power upside down.","f":"a<sup>&minus;n<\/sup> = 1 &divide; a<sup>n<\/sup>, &nbsp;&nbsp; a<sup>0<\/sup> = 1","eg":"4<sup>&minus;3<\/sup> = 1 &divide; 4&sup3; = 1/64, and 4<sup>0<\/sup> = 1.","trap":"4<sup>&minus;3<\/sup> is 1/64, not &minus;64 and not &minus;1/64. The sign of the exponent says which way up, never which side of zero. Slide n to 0 and every base except 0 collapses to 1.","fmn":"Negative and zero exponents","big":"A negative power means \"flip it\". It does not make the number negative.","html":"<ul><li>a<sup>−n<\/sup> = 1 ÷ a<sup>n<\/sup><\/li><li>a⁰ = 1 (for any base except 0)<\/li><\/ul><div class=\"ex\"><b>Example:<\/b><ol><li>4<sup>−3<\/sup> = 1 ÷ 4³ = 1 ÷ 64 = <b>1/64<\/b><\/li><li>4⁰ = <b>1<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ 4<sup>−3<\/sup> is 1/64. It is not −64 and not −1/64. The minus in the power means \"turn it upside down\", not \"below zero\".<\/p>"},{"lead":"<b>Fractional exponents.<\/b>","rest":"The bottom of the fraction is the root and the top is the power &mdash; take the root first and the numbers stay small.","f":"a<sup>m/n<\/sup> = <sup>n<\/sup>&radic;(a<sup>m<\/sup>)","eg":"8<sup>2/3<\/sup> is the cube root of 8, which is 2, then squared: 4.","trap":"The denominator is the root, not the power. 8<sup>2/3<\/sup> is 4, not 8&sup2; &divide; 3 and not 8 &divide; 3 squared. Drag a below zero with an even n and the expression stops existing in the real numbers &mdash; an odd n survives it.","fmn":"Fractional exponents","big":"Fraction power: the bottom is the root, the top is the power.","html":"<p><b>Rule:<\/b> a<sup>m/n<\/sup> = take the n-th root of a, then raise it to the power m.<\/p><p>A <b>cube root<\/b> is the number that, times itself 3 times, gives your number. The cube root of 8 is 2, because 2 × 2 × 2 = 8.<\/p><div class=\"ex\"><b>Example:<\/b> 8<sup>2/3<\/sup><ol><li>The bottom is 3 → take the cube root: cube root of 8 = 2<\/li><li>The top is 2 → square it: 2² = <b>4<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Take the root first. The numbers stay small.<\/p><p class=\"warn\">⚠️ If the bottom is even (like ½, a square root), a negative base has no real answer. An odd bottom is fine: (−8)<sup>1/3<\/sup> = −2.<\/p>"},{"lead":"<b>Multiplying and dividing radicals.<\/b>","rest":"Roots pass straight through multiplication and division, which is what lets you pull perfect squares out and shrink the surd.","f":"&radic;a &middot; &radic;b = &radic;(ab), &nbsp;&nbsp; &radic;a &divide; &radic;b = &radic;(a &divide; b)","eg":"&radic;8 &middot; &radic;2 = &radic;16 = 4, and &radic;8 &divide; &radic;2 = &radic;4 = 2.","trap":"No such rule exists for addition. &radic;9 + &radic;16 is 3 + 4 = 7, not &radic;25 = 5. Multiplication and division pass through the root sign; addition and subtraction never do.","fmn":"Multiplying and dividing radicals","big":"Roots can be multiplied and divided together, but never added.","html":"<p>A <b>square root<\/b> (√) is the number that times itself gives your number. √16 = 4, because 4 × 4 = 16.<\/p><ul><li>√a × √b = √(a × b)<\/li><li>√a ÷ √b = √(a ÷ b)<\/li><\/ul><div class=\"ex\"><b>Example:<\/b><ol><li>√8 × √2 = √16 = <b>4<\/b><\/li><li>√8 ÷ √2 = √4 = <b>2<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 This lets you pull out squares: √12 = √4 × √3 = 2√3.<\/p><p class=\"warn\">⚠️ There is no rule for adding. √9 + √16 = 3 + 4 = 7, not √25 = 5.<\/p>"},{"lead":"<b>Rationalising a denominator.<\/b>","rest":"Multiply top and bottom by the conjugate &mdash; the same two terms with the sign between them reversed &mdash; and the root disappears from the bottom.","f":"k &divide; (&radic;a + b) = k(&radic;a &minus; b) &divide; (a &minus; b<sup>2<\/sup>)","eg":"6 &divide; (&radic;5 + 2) becomes 6(&radic;5 &minus; 2) &divide; (5 &minus; 4) = 6&radic;5 &minus; 12, about 1.416.","trap":"The conjugate changes only the sign between the terms &mdash; it is &radic;a &minus; b, not &minus;&radic;a &minus; b. And multiply the numerator by it too: multiplying only the bottom changes the value of the fraction.","fmn":"Rationalising a denominator","big":"Root on the bottom? Multiply top and bottom by its \"flip-sign\" partner.","html":"<p>The partner (called the <b>conjugate<\/b>) is the same two parts with the middle sign flipped. The partner of √5 + 2 is √5 − 2.<\/p><p><b>Rule:<\/b> k ÷ (√a + b) = k(√a − b) ÷ (a − b²)<\/p><div class=\"ex\"><b>Example:<\/b> 6 ÷ (√5 + 2)<ol><li>Multiply top and bottom by (√5 − 2).<\/li><li>Bottom: (√5 + 2)(√5 − 2) = 5 − 4 = 1<\/li><li>Top: 6(√5 − 2) = 6√5 − 12<\/li><li>Answer: <b>6√5 − 12<\/b>, about 1.416 ✅<\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> (a + b)(a − b) = a² − b², and √5 squared is 5. So the root is gone from the bottom.<\/p><p class=\"warn\">⚠️ Flip only the middle sign. And multiply the top too, or the value changes.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 320 200\"><path class=\"gline\" d=\"M 92 34 L 312 34\"/><text class=\"slabel\" x=\"86\
