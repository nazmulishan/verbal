d);stroke-width:1.6;fill:none;opacity:.8\"><\/line><text class=\"slabel  numtxt\" x=\"408.33\" y=\"62\" text-anchor=\"start\" style=\"paint-order:stroke;stroke:var(--panel-2);stroke-width:3.5px;stroke-linejoin:round\">0.5<\/text><circle cx=\"306.67\" cy=\"88.67\" r=\"5\" style=\"fill:var(--ink);stroke:var(--panel-2);stroke-width:1.5\"><\/circle><text class=\"slabel  numtxt\" x=\"315.67\" y=\"92.67\" text-anchor=\"start\" style=\"paint-order:stroke;stroke:var(--panel-2);stroke-width:3.5px;stroke-linejoin:round\">−0.5<\/text><circle cx=\"436.67\" cy=\"119.33\" r=\"5\" style=\"fill:var(--ink);stroke:var(--panel-2);stroke-width:1.5\"><\/circle><text class=\"slabel  numtxt\" x=\"445.67\" y=\"123.33\" text-anchor=\"start\" style=\"paint-order:stroke;stroke:var(--panel-2);stroke-width:3.5px;stroke-linejoin:round\">1<\/text><circle cx=\"371.67\" cy=\"150\" r=\"5\" style=\"fill:var(--ink);stroke:var(--panel-2);stroke-width:1.5\"><\/circle><text class=\"slabel  numtxt\" x=\"380.67\" y=\"154\" text-anchor=\"start\" style=\"paint-order:stroke;stroke:var(--panel-2);stroke-width:3.5px;stroke-linejoin:round\">0.25<\/text><circle cx=\"371.67\" cy=\"180.67\" r=\"5\" style=\"fill:var(--blue);stroke:var(--panel-2);stroke-width:1.5\"><\/circle><text class=\"slabel b numtxt\" x=\"380.67\" y=\"184.67\" text-anchor=\"start\" style=\"paint-order:stroke;stroke:var(--panel-2);stroke-width:3.5px;stroke-linejoin:round\">0.25<\/text><circle cx=\"360.83\" cy=\"211.33\" r=\"5\" style=\"fill:var(--blue);stroke:var(--panel-2);stroke-width:1.5\"><\/circle><text class=\"slabel b numtxt\" x=\"369.83\" y=\"215.33\" text-anchor=\"start\" style=\"paint-order:stroke;stroke:var(--panel-2);stroke-width:3.5px;stroke-linejoin:round\">0.125<\/text><polygon points=\"616,242 605,236.5 605,247.5\" style=\"fill:var(--amber)\"><\/polygon><text class=\"slabel a numtxt\" x=\"599\" y=\"246\" text-anchor=\"end\" style=\"paint-order:stroke;stroke:var(--panel-2);stroke-width:3.5px;stroke-linejoin:round\">4<\/text><circle cx=\"523.33\" cy=\"272.67\" r=\"5\" style=\"fill:var(--amber);stroke:var(--panel-2);stroke-width:1.5\"><\/circle><text class=\"slabel a numtxt\" x=\"532.33\" y=\"276.67\" text-anchor=\"start\" style=\"paint-order:stroke;stroke:var(--panel-2);stroke-width:3.5px;stroke-linejoin:round\">2<\/text><circle cx=\"411.28\" cy=\"303.33\" r=\"5\" style=\"fill:var(--green);stroke:var(--panel-2);stroke-width:1.5\"><\/circle><text class=\"slabel g numtxt\" x=\"420.28\" y=\"307.33\" text-anchor=\"start\" style=\"paint-order:stroke;stroke:var(--panel-2);stroke-width:3.5px;stroke-linejoin:round\">≈0.707<\/text><circle cx=\"418.79\" cy=\"334\" r=\"5\" style=\"fill:var(--green);stroke:var(--panel-2);stroke-width:1.5\"><\/circle><text class=\"slabel g numtxt\" x=\"427.79\" y=\"338\" text-anchor=\"start\" style=\"paint-order:stroke;stroke:var(--panel-2);stroke-width:3.5px;stroke-linejoin:round\">≈0.794<\/text><text class=\"slabel  numtxt\" x=\"90\" y=\"354\" text-anchor=\"middle\">−3<\/text><text class=\"slabel  numtxt\" x=\"176.67\" y=\"354\" text-anchor=\"middle\">−2<\/text><text class=\"slabel  numtxt\" x=\"263.33\" y=\"354\" text-anchor=\"middle\">−1<\/text><text class=\"slabel  numtxt\" x=\"350\" y=\"354\" text-anchor=\"middle\">0<\/text><text class=\"slabel  numtxt\" x=\"436.67\" y=\"354\" text-anchor=\"middle\">1<\/text><text class=\"slabel  numtxt\" x=\"523.33\" y=\"354\" text-anchor=\"middle\">2<\/text><text class=\"slabel  numtxt\" x=\"610\" y=\"354\" text-anchor=\"middle\">3<\/text><text class=\"slabel  numtxt\" x=\"320\" y=\"384\" text-anchor=\"middle\" style=\"font-size:12px;font-weight:600\"><tspan style=\"fill:var(--ink)\">−x<\/tspan> &lt; <tspan style=\"fill:var(--blue)\">x³<\/tspan> &lt; <tspan style=\"fill:var(--ink)\">x/2<\/tspan> = <tspan style=\"fill:var(--blue)\">x²<\/tspan> &lt; <tspan style=\"fill:var(--ink)\">x<\/tspan> &lt; <tspan style=\"fill:var(--green)\">√x<\/tspan> &lt; <tspan style=\"fill:var(--green)\">∛x<\/tspan> &lt; <tspan style=\"fill:var(--ink)\">2x<\/tspan> &lt; <tspan style=\"fill:var(--amber)\">1/x<\/tspan> &lt; <tspan style=\"fill:var(--amber)\">x⁻²<\/tspan><\/text><circle class=\"handle\" cx=\"393.33\" cy=\"58\" r=\"8\"><\/circle><\/svg>","sec":"num","fm":["Repeating decimal to a fraction","When a fraction terminates","Negative and zero exponents","Fractional exponents","Multiplying and dividing radicals","Rationalising a denominator","Absolute value as two cases","Multiplying an inequality"]},"cb_posts":{"title":"Posts and gaps, and the +1 that decides a count","tag":"Number","say":"A ruler runs from A to B, and a post stands on every multiple of k inside it. Count the posts and the gaps between them, and drag the red marker to read a post’s place from either end. The other buttons add a second kind of post, fill digit slots, share out identical things with bars, and line up 1 to n to see what n! is made of.","note":"","tries":["Set the range from 11 to 100 and the step to 4. The first post is 12 and the last is 100: (100 − 12)/4 = 22 gaps, so 23 posts. Change the step to 5 and you get 18.","Slide <b>from A<\/b> down to 0. 0 becomes a post, because 0 is a multiple of every step. The positive-only line takes it off again.","Drag the red marker to any post. Its place from the front plus its place from the back is always one more than the number of posts.","Press <b>two kinds of posts<\/b> with steps 4 and 6. The green posts come every 12, not every 24, and they are taken off once.","Press <b>filling slots<\/b> with 3 slots: 900 numbers in all, 648 with no digit repeated, and 60 made from 1 to 5 with no repeats.","Press <b>n! and its zeros<\/b> and slide n from 24 to 25. The zeros jump from 4 to 6, because 25 brings two 5s at once."],"ideas":[{"lead":"<b>A count of evenly spaced things is the gaps plus one.<\/b>","rest":"Between the first and the last there are (last − first) ÷ k gaps, and there is one more post than gaps. The range of the posts, last − first, gets no +1.","f":"count = (last − first)/k + 1 · range = last − first","eg":"posts at 5, 10, …, 50: (50 − 5)/5 + 1 = 10 posts and 9 gaps","plain":"Fence posts: when posts are evenly spaced, the number of posts is the number of gaps + 1.","steps":["posts at 5, 10, 15, …, 50","gaps: (50 − 5) ÷ 5 = 9","posts: 9 + 1 = 10"],"big":"Evenly spaced posts: number of posts = number of gaps + 1.","html":"<ul><li>The <b>step<\/b> is the distance from one post to the next.<\/li><li>Gaps between the first and last post = (last − first) ÷ step.<\/li><li>There is always one more post than gaps.<\/li><li>The <b>range<\/b> (last − first) gets no +1.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> posts at 5, 10, 15, …, 50<ol><li>Gaps: (50 − 5) ÷ 5 = 45 ÷ 5 = 9<\/li><li>Posts: 9 + 1 = <b>10<\/b><\/li><\/ol>Check: 5, 10, 15, 20, 25, 30, 35, 40, 45, 50 → 10 ✅<\/div><p><b>Rule:<\/b> count = (last − first) ÷ step + 1<\/p><p class=\"warn\">⚠️ Forgetting the +1 is the most common mistake.<\/p>"},{"lead":"<b>Find the first and last post inside the range before anything else.<\/b>","rest":"The ends of the range need not be posts. Read the words exactly: inclusive keeps the ends, between usually drops them, and positive throws out 0. 0 is a multiple of every number.","f":"odd numbers from 10 to 30: 11 to 29 → (29 − 11)/2 + 1 = 10","plain":"Before counting, find the first and the last number that really fit, then use the gaps + 1 rule.","steps":["odd numbers from 10 to 30","first odd: 11 · last odd: 29","(29 − 11) ÷ 2 + 1 = 10"],"big":"Before counting, find the first and last numbers that really fit.","html":"<p>The ends of the range may not fit the rule. A <b>multiple<\/b> of 5 is 5 times a whole number (0, 5, 10, …). Read the words exactly:<\/p><ul><li>“<b>Inclusive<\/b>” keeps the end numbers.<\/li><li>“<b>Between<\/b>” usually drops them.<\/li><li>“<b>Positive<\/b>” throws out 0. This matters, because 0 is a multiple of every number.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> how many odd numbers from 10 to 30?<ol><li>First odd: 11. Last odd: 29.<\/li><li>Gaps: (29 − 11) ÷ 2 = 9<\/li><li>Count: 9 + 1 = <b>10<\/b> ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ Do not use 10 and 30 as the ends. They are even, so they do not count.<\/p>"},{"lead":"<b>Up to B there are ⌊B/k⌋ multiples of k.<\/b>","rest":"⌊ ⌋ means round down to a whole number. For a range from A to B, take away the ones below A.","f":"⌊B/k⌋ − ⌊(A − 1)/k⌋ · 11 to 100, step 4: 25 − 2 = 23","eg":"multiples of 7 up to 50: ⌊50/7⌋ = 7 (7, 14, …, 49)","plain":"How many multiples of k are there up to B? Divide B by k and drop the decimal.","steps":["multiples of 7 up to 50","50 ÷ 7 = 7.1 → 7","7, 14, 21, 28, 35, 42, 49 ✓"],"big":"How many multiples of k up to B? Divide B by k and drop the decimal.","html":"<p>A <b>multiple<\/b> of 7 is 7 times a whole number: 7, 14, 21, …<\/p><div class=\"ex\"><b>Example:<\/b> multiples of 7 up to 50<ol><li>50 ÷ 7 = 7.1…<\/li><li>Drop the decimal → <b>7<\/b><\/li><\/ol>Check: 7, 14, 21, 28, 35, 42, 49 → 7 ✅<\/div><p><b>For a range from A to B:<\/b> count up to B, then take away the ones below A.<\/p><div class=\"ex\"><b>Example:<\/b> multiples of 4 from 11 to 100<ol><li>Up to 100: 100 ÷ 4 = 25<\/li><li>Below 11 (up to 10): 10 ÷ 4 = 2.5 → 2<\/li><li>25 − 2 = <b>23<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 “Drop the decimal” is written ⌊B/k⌋. It means round down to a whole number.<\/p>"},{"lead":"<b>n marks on a scale make n − 1 gaps.<\/b>","rest":"So the step is the distance divided by the gaps, never by the marks. Nine ticks from 0.2 to 0.56 make 8 gaps of 0.045.","f":"step = (last − first) ÷ (marks − 1)","eg":"5 marks from 0 to 20: step = 20 ÷ 4 = 5 (0, 5, 10, 15, 20)","plain":"On a ruler, 5 marks make 4 spaces. The step is the total length ÷ the number of spaces.","steps":["5 marks from 0 to 20","spaces: 5 − 1 = 4","step = 20 ÷ 4 = 5"],"big":"n marks on a scale make n − 1 gaps.","html":"<p>The <b>step<\/b> is the distance between two marks next to each other. Step = total distance ÷ gaps. Never divide by the number of marks.<\/p><div class=\"ex\"><b>Example:<\/b> 5 marks from 0 to 20<ol><li>Gaps: 5 − 1 = 4<\/li><li>Step: 20 ÷ 4 = <b>5<\/b><\/li><\/ol>Check: 0, 5, 10, 15, 20 → 5 marks ✅<\/div><p><b>Rule:<\/b> step = (last − first) ÷ (marks − 1)<\/p><p class=\"tip\">💡 Harder case: 9 marks from 0.2 to 0.56 make 8 gaps. Step = 0.36 ÷ 8 = 0.045.<\/p>"},{"lead":"<b>Places count from 1, so the item in place r has r − 1 in front of it.<\/b>","rest":"Counted from both ends, it is counted twice, so its place from the front plus its place from the back is the length plus 1. The r-th post is the first one plus r − 1 steps.","f":"front + back = n + 1 · r-th post = first + (r − 1) × k · the 360th of 100 to 999 is 459","plain":"The 10th item in a list has 9 items in front of it. So the r-th term is the first + (r − 1) × the step.","steps":["the list 100, 101, 102, …","the 5th number = 100 + 4 = 104","in a queue of 10, 3rd from the front is 8th from the back (3 + 8 = 10 + 1)"],"big":"The item in place r has r − 1 items in front of it.","html":"<ul><li>Places start at 1, not 0.<\/li><li>So the r-th item = first item + (r − 1) × step.<\/li><li>Counted from the front and from the back, the item is counted twice. So front place + back place = length + 1.<\/li><\/ul><div class=\"ex\"><b>Example 1:<\/b> the list 100, 101, 102, …<ol><li>5th number = 100 + (5 − 1) × 1 = <b>104<\/b><\/li><li>360th number = 100 + 359 = <b>459<\/b><\/li><\/ol><\/div><div class=\"ex\"><b>Example 2:<\/b> a line of 10 people. You are 3rd from the front.<ol><li>Front + back = 10 + 1 = 11<\/li><li>Back place = 11 − 3 = <b>8th from the back<\/b> ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ The 5th number is not 100 + 5 = 105.<\/p>"},{"lead":"<b>To count squares in a range, count their roots.<\/b>","rest":"The squares from 37 to 621 are 7² up to 24², so there are 24 − 7 + 1 = 18 of them. Squares of even numbers have even roots, so only 8, 10, …, 24 count: 9 of them.","f":"squares from A to B: roots from √A rounded up to √B rounded down","eg":"squares from 10 to 50: roots 4 to 7 → 16, 25, 36, 49, so 4 squares","plain":"To count perfect squares between two numbers, count the whole numbers whose squares land there.","steps":["squares from 10 to 50","√10 ≈ 3.2 → start at 4 · √50 ≈ 7.1 → end at 7","4, 5, 6, 7 → 4 squares (16, 25, 36, 49)"],"big":"To count perfect squares in a range, count their roots.","html":"<p>A <b>perfect square<\/b> is a whole number times itself, like 16 = 4 × 4. Its <b>root<\/b> is that whole number (4).<\/p><div class=\"ex\"><b>Example:<\/b> how many squares from 10 to 50?<ol><li>√10 ≈ 3.2 → round <b>up<\/b> to 4<\/li><li>√50 ≈ 7.1 → round <b>down<\/b> to 7<\/li><li>Roots 4, 5, 6, 7 → <b>4 squares<\/b><\/li><\/ol>Check: 16, 25, 36, 49 ✅<\/div><p class=\"tip\">💡 Bigger case: squares from 37 to 621 have roots 7 to 24, so 24 − 7 + 1 = 18 squares. Even squares have even roots: 8, 10, …, 24, so 9 of them.<\/p>"},{"lead":"<b>Multiples of k and multiples of j overlap at the multiples of their LCM.<\/b>","rest":"Add the two counts and take that overlap off once. The LCM is not always k × j: steps 4 and 6 overlap every 12.","f":"up to 603, multiples of 2 or 3: 301 + 201 − 100 = 402","eg":"up to 20, multiples of 2 or 3: 10 + 6 − 3 = 13","plain":"Counting “multiples of 2 or 3”: add the two counts, then take off the ones counted twice (the multiples of 6).","steps":["up to 20: multiples of 2 → 10, of 3 → 6","both (multiples of 6): 6, 12, 18 → 3","10 + 6 − 3 = 13"],"big":"“Multiples of 2 or 3”: add the two counts, then take off the overlap once.","html":"<ul><li>Numbers that are multiples of both get counted twice.<\/li><li>The overlap is the multiples of the <b>LCM<\/b> (least common multiple: the smallest number both divide into).<\/li><li>The LCM is not always the two numbers multiplied. For 4 and 6, the LCM is 12, not 24.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> up to 20, how many are multiples of 2 or 3?<ol><li>Multiples of 2: 20 ÷ 2 = 10<\/li><li>Multiples of 3: 20 ÷ 3 = 6.6… → 6<\/li><li>Both (multiples of 6): 6, 12, 18 → 3<\/li><li>10 + 6 − 3 = <b>13<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Same steps up to 603: 301 + 201 − 100 = 402.<\/p>"},{"lead":"<b>To fill slots, multiply the number of choices for each slot.<\/b>","rest":"A first digit cannot be 0. With no repeats, each later slot has one choice fewer. Fill the fussiest slot first.","f":"3 digits: 9 × 10 × 10 = 900 · all different: 9 × 9 × 8 = 648","plain":"Filling slots one by one: multiply the number of choices for each slot.","steps":["3-digit numbers","first digit 1 to 9: 9 choices · second and third: 10 each","9 × 10 × 10 = 900"],"big":"To fill slots, multiply the number of choices for each slot.","html":"<ul><li>The first digit of a number cannot be 0.<\/li><li>If repeats are not allowed, each later slot has one choice fewer.<\/li><li>Fill the fussiest slot first (the one with the most rules).<\/li><\/ul><div class=\"ex\"><b>Example 1:<\/b> how many 3-digit numbers are there?<ol><li>First digit: 1 to 9 → 9 choices<\/li><li>Second and third: 0 to 9 → 10 choices each<\/li><li>9 × 10 × 10 = <b>900<\/b> ✅ (100 to 999)<\/li><\/ol><\/div><div class=\"ex\"><b>Example 2:<\/b> 3-digit numbers with all digits different<ol><li>First: 9 choices (not 0)<\/li><li>Second: 9 choices (0 is allowed again, but not the first digit)<\/li><li>Third: 8 choices<\/li><li>9 × 9 × 8 = <b>648<\/b><\/li><\/ol><\/div>"},{"lead":"<b>Sharing identical things into labelled groups is placing bars among stars.<\/b>","rest":"n things and g groups use g − 1 bars, in n + g − 1 places. Choose the places for the bars. Groups may be empty.","f":"C(n + g − 1, g − 1) · 9 into 3 groups: C(11, 2) = 55","plain":"Sharing identical things, like 9 sweets among 3 children: line up the sweets and add 2 dividers. Count the ways to place the dividers.","steps":["9 sweets + 2 dividers = 11 spots","choose 2 spots for the dividers: C(11, 2)","= 11 × 10 ÷ 2 = 55"],"big":"Sharing identical things into groups: line them up and add dividers.","html":"<p><b>Identical<\/b> means all the same. The groups are different (like different children), and a group may get nothing.<\/p><ul><li>n things into g groups need g − 1 dividers.<\/li><li>Things + dividers fill n + g − 1 spots.<\/li><li>Count the ways to choose the spots for the dividers.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> share 9 identical sweets among 3 children.<ol><li>3 children need 2 dividers.<\/li><li>9 sweets + 2 dividers = 11 spots<\/li><li>Choose 2 spots for the dividers: C(11, 2) = 11 × 10 ÷ 2 = <b>55<\/b><\/li><\/ol><\/div><p><b>Rule:<\/b> ways = C(n + g − 1, g − 1). C(11, 2) means “ways to choose 2 from 11”.<\/p><p class=\"tip\">💡 Picture it: ★★★|★★★★|★★ means 3, 4 and 2 sweets.<\/p>"},{"lead":"<b>Factorials thin out fast.<\/b>","rest":"1, 2, 6, 24, 120, 720 and 5040 cover almost every question. Between 120 and 720 there is no factorial at all, and a number times a factorial usually lands in such a gap, so isolate n! before you test it. n! holds every prime up to n and none above it.","f":"x/2 = n! → x = 2 × n! = 2, 4, 12, 48, 240, … · 240 is not a factorial","plain":"n! means n × (n − 1) × … × 1. Factorials grow very fast: 1, 2, 6, 24, 120, 720.","steps":["4! = 4 × 3 × 2 × 1 = 24","5! = 5 × 24 = 120","so 50 is not a factorial (it falls between 24 and 120)"],"big":"Factorials grow very fast: 1, 2, 6, 24, 120, 720, 5040.","html":"<p><b>n!<\/b> (n factorial) means n × (n − 1) × … × 1. So 4! = 4 × 3 × 2 × 1 = 24, and 5! = 5 × 24 = 120.<\/p><ul><li>There are big gaps between factorials. None lies between 120 and 720. So 50 is not a factorial (it falls between 24 and 120).<\/li><li>n! contains every prime up to n, and no prime above n. (A <b>prime<\/b> has exactly two divisors: 1 and itself.)<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> x/2 = n!. What can x be?<ol><li>Get x alone: x = 2 × n!<\/li><li>n! = 1, 2, 6, 24, 120 → x = 2, 4, 12, 48, 240<\/li><li>So x can be <b>240<\/b>, even though 240 is not a factorial.<\/li><\/ol><\/div><p class=\"warn\">⚠️ Get n! alone before you test a number. A number times a factorial usually lands in a gap.<\/p>"},{"lead":"<b>Cancel factorials instead of working them out.<\/b>","rest":"Write each one as a multiple of the smallest, then take that one out as a common factor.","f":"n!/(n − 1)! = n · 20! + 19! + 18! = 18! × 20²","eg":"6!/5! = 6 · 10!/8! = 10 × 9 = 90","plain":"Do not multiply factorials out. Cancel them: 10!/8! leaves only 10 × 9.","steps":["10!/8! = (10 × 9 × 8!) ÷ 8!","= 10 × 9","= 90"],"big":"Do not work factorials out. Cancel them.","html":"<p>Write the bigger factorial using the smaller one. For example, 10! = 10 × 9 × 8!.<\/p><div class=\"ex\"><b>Example:<\/b> 10!/8! = ?<ol><li>10! = 10 × 9 × 8!<\/li><li>(10 × 9 × 8!) ÷ 8! = 10 × 9<\/li><li>= <b>90<\/b><\/li><\/ol><\/div><p><b>Rule:<\/b> n!/(n − 1)! = n. So 6!/5! = 6.<\/p><div class=\"ex\"><b>For a sum:<\/b> take the smallest factorial out as a common factor (a number inside every term).<ol><li>20! + 19! + 18! = 18! × (20 × 19 + 19 + 1)<\/li><li>= 18! × (380 + 20) = 18! × 400 = <b>18! × 20²<\/b><\/li><\/ol><\/div>"},{"lead":"<b>n! ends in as many zeros as it has 5s.<\/b>","rest":"It always has at least as many 2s. Count the multiples of 5 up to n, then add the multiples of 25, which carry a second 5. From 5! on, every factorial ends in 0, so only the small ones decide a units digit.","f":"zeros of n! = ⌊n/5⌋ + ⌊n/25⌋ · 25! ends in 6 zeros · 2! + 4! + 6! + 8! + 10! ends in 6","plain":"The zeros at the end of n! come from 2 × 5 pairs. There are plenty of 2s, so just count the 5s.","steps":["25!: multiples of 5 → 25 ÷ 5 = 5","25 = 5 × 5 gives one extra 5 → 25 ÷ 25 = 1","5 + 1 = 6 zeros"],"big":"Zeros at the end of n! = how many 5s are inside n!.","html":"<p>Each end zero comes from 2 × 5 = 10. There are always at least as many 2s as 5s, so just count the 5s.<\/p><div class=\"ex\"><b>Example:<\/b> how many zeros does 25! end in?<ol><li>Multiples of 5 up to 25: 25 ÷ 5 = 5 (5, 10, 15, 20, 25)<\/li><li>Multiples of 25 give one extra 5 (25 = 5 × 5): 25 ÷ 25 = 1<\/li><li>5 + 1 = <b>6 zeros<\/b><\/li><\/ol><\/div><p><b>Rule:<\/b> zeros = ⌊n/5⌋ + ⌊n/25⌋ (divide, then drop the decimal).<\/p><p class=\"tip\">💡 From 5! on, every factorial ends in 0. So only small factorials decide a last digit. 2! + 4! + 6! + 8! + 10! ends in 6, because 2 + 24 = 26 and the rest end in 0.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><text class=\"slabel b numtxt\" x=\"320\" y=\"24\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:600\">a post on every multiple of 4 from 11 to 100<\/text><text class=\"slabel \" x=\"320\" y=\"44\" text-anchor=\"middle\" style=\"font-size:10px;fill:var(--ink-3)\">[ and ] mean inclusive: an end counts when it is a post<\/text><rect x=\"56.07\" y=\"138\" width=\"533.93\" height=\"30\" rx=\"0\" style=\"fill:var(--blue-wash);stroke:none\"><\/rect><line x1=\"56.07\" y1=\"138\" x2=\"590\" y2=\"138\" style=\"stroke:var(--blue);stroke-width:1.2;opacity:.7\"><\/line><line x1=\"56.07\" y1=\"168\" x2=\"590\" y2=\"168\" style=\"stroke:var(--blue);stroke-width:1.2;opacity:.7\"><\/line><text class=\"slabel  numtxt\" x=\"68.2\" y=\"157\" text-anchor=\"middle\" style=\"font-size:9px;fill:var(--ink-3)\">1<\/text><text class=\"slabel  numtxt\" x=\"92.47\" y=\"157\" text-anchor=\"middle\" style=\"font-size:9px;fill:var(--ink-3)\">2<\/text><text class=\"slabel  numtxt\" x=\"116.74\" y=\"157\" text-anchor=\"middle\" style=\"font-size:9px;fill:var(--ink-3)\">3<\/text><text class=\"slabel  numtxt\" x=\"141.01\" y=\"157\" text-anchor=\"middle\" style=\"font-size:9px;fill:var(--ink-3)\">4<\/text><text class=\"slabel  numtxt\" x=\"165.28\" y=\"157\" text-anchor=\"middle\" style=\"font-size:9px;fill:var(--ink-3)\">5<\/text><text class=\"slabel  numtxt\" x=\"189.55\" y=\"157\" text-anchor=\"middle\" style=\"font-size:9px;fill:var(--ink-3)\">6<\/text><text class=\"slabel  numtxt\" x=\"213.82\" y=\"157\" text-anchor=\" " style=\"font-size:10px\">green dots: squares<\/text><text class=\"slabel \" x=\"50\" y=\"279\" text-anchor=\"start\" style=\"font-size:10px;fill:var(--ink-3)\">faded: just outside<\/text><text class=\"slabel g numtxt\" x=\"320\" y=\"308\" text-anchor=\"middle\" style=\"font-size:14px;font-weight:700\">(100 − 12) ÷ 4 + 1 = 22 + 1 = 23<\/text><text class=\"slabel \" x=\"320\" y=\"326\" text-anchor=\"middle\" style=\"font-size:10px;fill:var(--ink-3)\">(last − first) ÷ step counts the gaps, and there is one more post than gaps<\/text><text class=\"slabel  numtxt\" x=\"320\" y=\"352\" text-anchor=\"middle\" style=\"font-size:13px;font-weight:600;fill:var(--ink)\">floor(100/4) − floor(10/4) = 25 − 2 = 23<\/text><text class=\"slabel  numtxt\" x=\"320\" y=\"370\" text-anchor=\"middle\" style=\"font-size:10px;fill:var(--ink-3)\">multiples of 4 up to 100, minus the multiples of 4 up to 10<\/text><text class=\"slabel  numtxt\" x=\"320\" y=\"392\" text-anchor=\"middle\" style=\"font-size:10px;fill:var(--ink-3)\">the range of the posts, 100 − 12 = 88, gets no +1<\/text><\/svg>","sec":"num","fm":["Counting integers in an inclusive range","Multiples of k in a range","Trailing zeros in a factorial","Arithmetic sequence, nth term","The counting principle","Identical items into groups","Identical items with at least one each","The union of two categories"]},"cb_places":{"title":"How a number is written, all at once","tag":"Number","say":"Build a number digit by digit in the columns and choose a unit. The board tells the digit in that place apart from how many of that unit the number holds. The other buttons write a number in another base, add two numbers column by column with their carries, round to a band, and line numbers up in powers of ten.","note":"","tries":["Build 1.4 and set the unit to tenths. The tenths digit is 4, but 1.4 holds 14 tenths. Set the unit to hundredths and the count jumps to 140.","Press <b>another base<\/b>, set b = 5 and N = 264. The digits are 2, 0, 2, 4. The 25s place is empty, and it still gets its 0.","Set b = 9 and N = 104. The digits are 1, 2, 5, because 104 = 1 × 81 + 2 × 9 + 5. One reading settles an equation like 81x + 9y + z = 104 at once.","Press <b>a column sum<\/b> with b = 10, N = 307 and P = 63. The units column makes 10, writes 0 and carries 1, and the 3 passes straight down with a carry of 0. Push N and P to 999 and still no column carries more than 1.","Press <b>rounding<\/b>, build 534 and set the unit to tens. The band runs from 525 up to 535, and 534 is the greatest whole number in it. Then build 25: rounding first gives 30 + 30 = 60, adding first gives 50.","Press <b>powers of ten<\/b> with N = 389, P = 45 and the power on P at 2. P becomes 4.5 × 10³, so 389 is rewritten as 0.389 × 10³ before the two are added."],"ideas":[{"lead":"<b>A digit names a place. A count says how many of that unit fit.<\/b>","rest":"In 1.4 the tenths digit is 4, but 1.4 holds 14 tenths. “How many units are in this number” is the number divided by the unit.","f":"count = number ÷ unit · 1.4 ÷ 0.1 = 14","plain":"Each digit has a place (tens, ones, tenths, …). “How many tenths are in 1.4?” is just 1.4 ÷ 0.1 = 14.","steps":["1.4 = 1 one + 4 tenths","1 one = 10 tenths","10 + 4 = 14 tenths"],"big":"A digit tells a place. A count tells how many of that unit fit.","html":"<ul><li>In 1.4, the <b>tenths digit<\/b> is 4.<\/li><li>But 1.4 holds <b>14 tenths<\/b> in total.<\/li><\/ul><p><b>Rule:<\/b> how many units are in a number = the number ÷ the unit.<\/p><div class=\"ex\"><b>Example:<\/b> how many tenths are in 1.4?<ol><li>1.4 = 1 one + 4 tenths<\/li><li>1 one = 10 tenths<\/li><li>10 + 4 = <b>14 tenths<\/b><\/li><\/ol>Check: 1.4 ÷ 0.1 = 14 ✅<\/div><p class=\"warn\">⚠️ “The tenths digit” and “how many tenths” are different questions.<\/p>"},{"lead":"<b>Make the unit ten times smaller and the count gets ten times bigger.<\/b>","rest":"So the unit matters more than the amount: 1.3 is 130 hundredths, far more than 14 tenths. For a unit smaller than 1, multiplying by it instead of dividing gives a smaller number, which is a quick sign of the slip.","f":"1.4 = 14 tenths = 140 hundredths","plain":"Make the unit 10 times smaller and you need 10 times more of them.","steps":["1.4 = 14 tenths","= 140 hundredths","= 1,400 thousandths"],"big":"Make the unit 10 times smaller and you need 10 times more of them.","html":"<div class=\"ex\"><b>Example:<\/b><ol><li>1.4 = 14 tenths<\/li><li>= 140 hundredths<\/li><li>= 1,400 thousandths<\/li><\/ol><\/div><p>So the unit matters more than the number. 1.3 is 130 hundredths. That is far more than 14 tenths, even though 1.3 is less than 1.4.<\/p><p class=\"warn\">⚠️ Divide by the unit. Do not multiply. For a unit smaller than 1, multiplying gives a smaller number: 1.4 × 0.1 = 0.14. If your count got smaller, you slipped.<\/p>"},{"lead":"<b>Write a number from its digits as a sum of place values.<\/b>","rest":"Multiplying by 10 moves every digit one place left. Adding a multiple of 10 never touches the units digit.","f":"digits x, y make 10x + y · m = 10n + 2 → m’s tens digit = n’s units digit","eg":"47 = 10 × 4 + 7","plain":"A two-digit number with digits x and y is really 10x + y. Write it this way in word problems about digits.","steps":["47 = 4 tens + 7 ones = 10 × 4 + 7","digits swapped: 74 = 10 × 7 + 4","74 − 47 = 27 = 9 × (7 − 4)"],"big":"A two-digit number with digits x and y is really 10x + y.","html":"<p>Each place is worth 10 times the place to its right.<\/p><div class=\"ex\"><b>Example:<\/b><ol><li>47 = 4 tens + 7 ones = 10 × 4 + 7<\/li><li>Swap the digits: 74 = 10 × 7 + 4<\/li><li>74 − 47 = <b>27<\/b> = 9 × (7 − 4) ✅<\/li><\/ol><\/div><ul><li>Multiplying by 10 moves every digit one place left: 47 × 10 = 470.<\/li><li>Adding a multiple of 10 never changes the units digit (the last digit).<\/li><li>So if m = 10n + 2, the tens digit of m is the units digit of n. With n = 47: m = 472, and its tens digit is 7 ✅<\/li><\/ul>"},{"lead":"<b>Powers of b with digits from 0 to b − 1 make a base-b number.<\/b>","rest":"125w + 25x + 5y + z with each letter from 0 to 4 is a four-digit number in base five. Every number has exactly one such reading, so one equation fixes all four letters.","f":"264 = 2 × 125 + 0 × 25 + 2 × 5 + 4 → 2024 in base 5","eg":"13 = 8 + 4 + 1 = 1 × 2³ + 1 × 2² + 0 × 2 + 1 → 1101 in base 2","plain":"Base 10 counts in 1, 10, 100, … Base 2 counts in 1, 2, 4, 8, … Base 5 counts in 1, 5, 25, 125, … The digits say how many of each.","steps":["13 in base 2: 8 + 4 + 1","= 1 eight, 1 four, 0 twos, 1 one","→ 1101"],"big":"Each base has its own place values. The digits say how many of each.","html":"<ul><li>Base 10 counts in 1, 10, 100, …<\/li><li>Base 2 counts in 1, 2, 4, 8, …<\/li><li>Base 5 counts in 1, 5, 25, 125, …<\/li><li>In base b, each digit is from 0 to b − 1.<\/li><li>Every number has exactly one way to be written in a base. So one equation can fix all the digits.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> write 13 in base 2.<ol><li>13 = 8 + 4 + 1<\/li><li>= 1 eight, 1 four, 0 twos, 1 one<\/li><li>→ <b>1101<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 125w + 25x + 5y + z, with each letter from 0 to 4, is a four-digit number in base 5. Example: 264 = 2 × 125 + 0 × 25 + 2 × 5 + 4 → 2024 in base 5.<\/p>"},{"lead":"<b>Peel the digits off from the top or from the bottom.<\/b>","rest":"From the top, take as many of the biggest place as fit and carry the rest down. From the bottom, the last digit is the remainder on b, then you divide by b and repeat. A place with nothing in it still gets a 0.","f":"389 on 5 from the bottom: r 4, r 2, r 0, r 3 → read upwards: 3024","plain":"To change a number to base b: keep dividing by b and write down the remainders. Read them from the bottom up.","steps":["13 to base 2: 13 ÷ 2 = 6 remainder 1","6 ÷ 2 = 3 r 0 · 3 ÷ 2 = 1 r 1 · 1 ÷ 2 = 0 r 1","read upwards: 1101"],"big":"To change a number to base b, keep dividing by b and read the remainders upward.","html":"<p>The <b>remainder<\/b> is what is left over after dividing. The last digit is the remainder when you divide by b.<\/p><div class=\"ex\"><b>Example:<\/b> 13 to base 2<ol><li>13 ÷ 2 = 6, remainder 1<\/li><li>6 ÷ 2 = 3, remainder 0<\/li><li>3 ÷ 2 = 1, remainder 1<\/li><li>1 ÷ 2 = 0, remainder 1<\/li><li>Read from the bottom up: <b>1101<\/b> ✅ (8 + 4 + 0 + 1 = 13)<\/li><\/ol><\/div><p><b>The other way, from the top:<\/b> take as many of the biggest place as fit, then carry the rest down.<\/p><p class=\"tip\">💡 389 in base 5: remainders 4, 2, 0, 3 → read upward: 3024. A place with nothing in it still gets a 0.<\/p>"},{"lead":"<b>A digit that reaches b is a carry.<\/b>","rest":"b of one place make one of the next place up. Five 25s are one 125, so they move one column left.","f":"b × bⁱ = bⁱ⁺¹","eg":"base 10: 9 + 1 = 10, so 1 carries to the tens","plain":"When a place fills up (10 in base 10, 2 in base 2), it becomes 1 in the next place up. That is a carry.","steps":["base 10: 9 + 1 = 10 → write 0, carry 1","base 2: 1 + 1 = 10 → write 0, carry 1","base 5: 4 + 1 = 10"],"big":"When a place fills up, it becomes 1 in the next place. That is a carry.","html":"<p>The <b>base<\/b> is how many of one place make one of the next place.<\/p><ul><li>In base 10, ten ones make one ten.<\/li><li>In base 5, five 25s make one 125, so they move one column left.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b><ol><li>Base 10: 9 + 1 = 10 → write 0, carry 1<\/li><li>Base 2: 1 + 1 = 10 → write 0, carry 1<\/li><li>Base 5: 4 + 1 = 10 → write 0, carry 1<\/li><\/ol><\/div><p><b>Rule:<\/b> b × bⁱ = bⁱ⁺¹ (b of one place = 1 of the next place up).<\/p>"},{"lead":"<b>In a sum of two numbers, every carry is 0 or 1.<\/b>","rest":"A column can total at most 9 + 9 + 1 = 19. Work right to left, because the units column is the only one with nothing carried in. A letter that passes straight down a column with nothing added to it takes in a carry of 0.","f":"YX7 + 6Y = Y7X: Y + carry = Y → carry 0 · 307 + 63 = 370","plain":"When you add two numbers, each column can carry at most 1 to the next (9 + 9 = 18 is the most).","steps":["57 + 68: 7 + 8 = 15 → write 5, carry 1","5 + 6 + 1 = 12","answer: 125"],"big":"When you add two numbers, each column carries 0 or 1, never more.","html":"<ul><li>The biggest column total is 9 + 9 + 1 = 19, so the carry is at most 1.<\/li><li>Work from right to left. The units column (the last one) has nothing carried into it.<\/li><li>If a letter goes straight down a column with nothing added, the carry into that column is 0.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> 57 + 68<ol><li>7 + 8 = 15 → write 5, carry 1<\/li><li>5 + 6 + 1 = 12<\/li><li>Answer: <b>125<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Letter puzzle: YX7 + 6Y = Y7X. In the hundreds column, Y + carry = Y, so the carry is 0. The answer is 307 + 63 = 370 (Y = 3, X = 0).<\/p>"},{"lead":"<b>“Rounds to T” names a band of values.<\/b>","rest":"Rounding to the nearest u, the value lies from T − u/2 up to, but not including, T + u/2. A half rounds up, so the low end is in and the high end is out.","f":"530 to the nearest 10: 525 ≤ value &lt; 535","plain":"“Rounds to 530” means the real value can be anywhere from 525 up to just under 535.","steps":["nearest 10, around 530","lowest: 525 (it rounds up to 530)","highest: just under 535 (535 itself rounds to 540)"],"big":"“Rounds to 530” means a band of values, not one number.","html":"<p>Rounding to the nearest 10 (or 100), the real value is from the rounded number minus half a unit, up to just under the rounded number plus half a unit.<\/p><div class=\"ex\"><b>Example:<\/b> what rounds to 530 at the nearest 10?<ol><li>Half of 10 is 5.<\/li><li>Lowest: 530 − 5 = <b>525<\/b> (a half rounds up, so 525 → 530)<\/li><li>Highest: just under 530 + 5 = 535. (535 itself rounds to 540.)<\/li><li>Band: <b>525 ≤ value &lt; 535<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ The low end is in. The high end is out.<\/p>"},{"lead":"<b>The greatest whole number that rounds to T at the nearest 10 or 100 is T + u/2 − 1.<\/b>","rest":"The top of the band is left out. Extra conditions cut the band down further: the greatest even one is 534, and the greatest multiple of 4 is 532.","f":"534 is the greatest whole number that rounds to 530","eg":"the greatest whole number that rounds to 500 at the nearest 100 is 500 + 50 − 1 = 549","plain":"The biggest whole number that rounds to T is T + half a unit − 1.","steps":["nearest 10 → 530: 530 + 5 − 1 = 534","nearest 100 → 500: 500 + 50 − 1 = 549"],"big":"The biggest whole number that rounds to T is T + half a unit − 1.","html":"<p>The top of the band is left out, so step back by 1.<\/p><div class=\"ex\"><b>Example:<\/b><ol><li>Nearest 10, rounds to 530: 530 + 5 − 1 = <b>534<\/b><\/li><li>Nearest 100, rounds to 500: 500 + 50 − 1 = <b>549<\/b><\/li><\/ol>Check: 549 rounds to 500, but 550 rounds to 600 ✅<\/div><p class=\"tip\">💡 Extra rules make the band smaller. The biggest even number that rounds to 530 is 534. The biggest multiple of 4 is 532.<\/p>"},{"lead":"<b>Rounded numbers do not add up the way the real ones do.<\/b>","rest":"Each is off by up to half a unit, and the errors need not cancel. 25 rounds to 30, yet 25 + 25 = 50 rounds to 50.","f":"30 + 30 = 60 · 25 + 25 = 50","eg":"34 + 34 = 68 rounds to 70 · rounded first: 30 + 30 = 60","plain":"Round first and then add, and you can get a different answer from adding first and rounding after.","steps":["34 + 34 = 68 → rounds to 70","round first: 30 + 30 = 60","60 is not 70"],"big":"Round then add can give a different answer from add then round.","html":"<ul><li>Each rounded number can be off by up to half a unit.<\/li><li>These errors do not always cancel. They can pile up.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> 34 + 34, to the nearest 10<ol><li>Add first: 34 + 34 = 68 → rounds to <b>70<\/b><\/li><li>Round first: 30 + 30 = <b>60<\/b><\/li><li>60 is not 70.<\/li><\/ol><\/div><p class=\"tip\">💡 It can go the other way too. 25 rounds to 30, so rounding first gives 30 + 30 = 60. But 25 + 25 = 50, which stays 50.<\/p>"},{"lead":"<b>A d-digit number times an e-digit number has d + e − 1 or d + e digits.<\/b>","rest":"Write each as a leading part from 1 to 10 times a power of 10, and the powers add. The extra digit appears only when the leading parts multiply to 10 or more. The power in scientific notation is one less than the digit count.","f":"2.1 × 3 = 6.3 → 21,000 × 3,000 has 8 digits · 9.65 × 4.18 ≈ 40 → 96,538 × 4,182 has 9","eg":"12 × 34 = 408 (2 + 2 − 1 = 3 digits) · 99 × 99 = 9,801 (4 digits)","plain":"To guess how many digits a product has, add the digit counts: the answer has that many, or one fewer.","steps":["12 × 34 = 408 → 3 digits (2 + 2 − 1)","99 × 99 = 9,801 → 4 digits (2 + 2)"],"big":"Digits in a product: add the digit counts. The answer has that many, or one fewer.","html":"<p>A d-digit number times an e-digit number has d + e − 1 or d + e digits.<\/p><div class=\"ex\"><b>Example:<\/b><ol><li>12 × 34 = 408 → 3 digits (2 + 2 − 1)<\/li><li>99 × 99 = 9,801 → 4 digits (2 + 2)<\/li><\/ol><\/div><p><b>Which one?<\/b> Write each number as a front part from 1 to 10 times a power of 10. Multiply the front parts.<\/p><ul><li>Less than 10 → d + e − 1 digits. 21,000 × 3,000: 2.1 × 3 = 6.3 → 8 digits.<\/li><li>10 or more → d + e digits. 96,538 × 4,182: 9.65 × 4.18 ≈ 40 → 9 digits.<\/li><\/ul><p class=\"tip\">💡 In scientific notation, the power of 10 is one less than the digit count: 408 = 4.08 × 10².<\/p>"},{"lead":"<b>To add in scientific notation, give both terms the same power of ten first.<\/b>","rest":"Move the smaller one up to the larger power, then add the leading parts. Never add the powers: that belongs to multiplying. When the powers are far apart, the biggest term is nearly the whole answer.","f":"2.82 × 10⁻⁵¹ − 3.96 × 10⁻⁴⁹ = (0.0282 − 3.96) × 10⁻⁴⁹ = −3.9318 × 10⁻⁴⁹","eg":"3 × 10⁴ + 2 × 10³ = 30 × 10³ + 2 × 10³ = 32 × 10³ = 3.2 × 10⁴","plain":"To add or take away in scientific notation, first make the powers of ten the same.","steps":["3 × 10⁴ + 2 × 10³","3 × 10⁴ = 30 × 10³","30 × 10³ + 2 × 10³ = 32 × 10³ = 3.2 × 10⁴"],"big":"To add in scientific notation, make the powers of ten the same first.","html":"<p><b>Scientific notation<\/b> writes a number as a front part times a power of ten, like 3 × 10⁴ = 30,000. Move the smaller term up to the bigger power, then add the front parts.<\/p><div class=\"ex\"><b>Example:<\/b> 3 × 10⁴ + 2 × 10³<ol><li>Rewrite: 3 × 10⁴ = 30 × 10³<\/li><li>Add the front parts: 30 × 10³ + 2 × 10³ = 32 × 10³<\/li><li>= <b>3.2 × 10⁴<\/b> ✅ (30,000 + 2,000 = 32,000)<\/li><\/ol><\/div><p class=\"warn\">⚠️ Never add the powers. That is only for multiplying.<\/p><p class=\"tip\">💡 When the powers are far apart, the biggest term is nearly the whole answer: 2.82 × 10⁻⁵¹ − 3.96 × 10⁻⁴⁹ = (0.0282 − 3.96) × 10⁻⁴⁹ = −3.9318 × 10⁻⁴⁹.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><rect x=\"363\" y=\"19\" width=\"82\" height=\"134\" rx=\"5\" style=\"fill:var(--amber-wash);stroke:var(--amber);stroke-width:1.5\"><\/rect><text class=\"slabel a\" x=\"404\" y=\"13\" text-anchor=\"middle\" style=\"font-size:11px;font-weight:700\">the unit<\/text><rect x=\"114\" y=\"50\" width=\"76\" height=\"100\" rx=\"4\" style=\"fill:none;stroke:var(--line-2);stroke-width:1.2\"><\/rect><text class=\"slabel \" x=\"152\" y=\"33\" text-anchor=\"middle\" style=\"font-size:11px;fill:var(--ink-2)\">hundreds<\/text><text class=\"slabel  numtxt\" x=\"152\" y=\"45\" text-anchor=\"middle\" style=\"font-size:11px;fill:var(--ink-3)\">100<\/text><line x1=\"182\" y1=\"55\" x2=\"182\" y2=\"145\" style=\"stroke:var(--line-2);stroke-width:3;stroke-linecap:round\"><\/line><text class=\"slabel  numtxt\" x=\"146\" y=\"116\" text-anchor=\"middle\" style=\"font-size:40px;font-weight:600;fill:var(--ink-3)\">0<\/text><rect x=\"198\" y=\"50\" width=\"76\" height=\"100\" rx=\"4\" style=\"fill:none;stroke:var(--line-2);stroke-width:1.2\"><\/rect> \" style=\"font-size:11px;fill:var(--ink-2)\">hundredths<\/text><text class=\"slabel  numtxt\" x=\"488\" y=\"45\" text-anchor=\"middle\" style=\"font-size:11px;fill:var(--ink-3)\">0.01<\/text><line x1=\"518\" y1=\"55\" x2=\"518\" y2=\"145\" style=\"stroke:var(--line-2);stroke-width:3;stroke-linecap:round\"><\/line><text class=\"slabel  numtxt\" x=\"482\" y=\"116\" text-anchor=\"middle\" style=\"font-size:40px;font-weight:600;fill:var(--ink-3)\">0<\/text><circle cx=\"362\" cy=\"112\" r=\"4.5\" style=\"fill:var(--ink)\"><\/circle><text class=\"slabel \" x=\"548\" y=\"96\" text-anchor=\"start\" style=\"font-size:12px;fill:var(--ink-2)\">X<\/text><text class=\"slabel  numtxt\" x=\"548\" y=\"118\" text-anchor=\"start\" style=\"font-size:15px;font-weight:700;fill:var(--ink)\">= 1.4<\/text><path style=\"fill:none;stroke:var(--green);stroke-width:1.6\" d=\"M 286 155 L 286 161 L 428 161 L 428 155 M 357 161 L 357 165\"><\/path><text class=\"slabel g numtxt\" x=\"357\" y=\"178\" text-anchor=\"middle\" style=\"font-size:12px;font-weight:700\">count of the unit: 14<\/text><text class=\"slabel  numtxt\" x=\"146\" y=\"228\" text-anchor=\"middle\" style=\"font-size:24px;font-weight:600;fill:var(--ink-3)\">0<\/text><text class=\"slabel  numtxt\" x=\"230\" y=\"228\" text-anchor=\"middle\" style=\"font-size:24px;font-weight:600;fill:var(--ink-2)\">1<\/text><text class=\"slabel  numtxt\" x=\"314\" y=\"228\" text-anchor=\"middle\" style=\"font-size:24px;font-weight:600;fill:var(--ink-2)\">4<\/text><text class=\"slabel  numtxt\" x=\"398\" y=\"228\" text-anchor=\"middle\" style=\"font-size:24px;font-weight:600;fill:var(--ink-3)\">0<\/text><text class=\"slabel  numtxt\" x=\"482\" y=\"228\" text-anchor=\"middle\" style=\"font-size:24px;font-weight:600;fill:var(--ink-3)\">0<\/text><circle cx=\"362\" cy=\"225\" r=\"3\" style=\"fill:var(--ink-2)\"><\/circle><line x1=\"306\" y1=\"195\" x2=\"256\" y2=\"195\" style=\"stroke:var(--ink-3);stroke-width:1.4;fill:none;stroke-linecap:round\"><\/line><polygon points=\"250,195 256,191.7 256,198.3\" style=\"fill:var(--ink-3);stroke:none\"><\/polygon><line x1=\"390\" y1=\"195\" x2=\"340\" y2=\"195\" style=\"stroke:var(--ink-3);stroke-width:1.4;fill:none;stroke-linecap:round\"><\/line><polygon points=\"334,195 340,191.7 340,198.3\" style=\"fill:var(--ink-3);stroke:none\"><\/polygon><text class=\"slabel  numtxt\" x=\"548\" y=\"210\" text-anchor=\"start\" style=\"font-size:12px;fill:var(--ink-2)\">10 × X<\/text><text class=\"slabel  numtxt\" x=\"548\" y=\"230\" text-anchor=\"start\" style=\"font-size:14px;font-weight:600;fill:var(--ink-2)\">= 14<\/text><text class=\"slabel  numtxt\" x=\"320\" y=\"266\" text-anchor=\"middle\" style=\"font-size:13px;fill:var(--ink)\">expanded: 1 × 1 + 4 × 0.1 = 1.4<\/text><rect x=\"24\" y=\"282\" width=\"288\" height=\"104\" rx=\"6\" style=\"fill:var(--green);fill-opacity:.08;stroke:var(--green);stroke-width:1.5\"><\/rect><rect x=\"328\" y=\"282\" width=\"288\" height=\"104\" rx=\"6\" style=\"fill:var(--red-wash);stroke:var(--red);stroke-width:1.5\"><\/rect><text class=\"slabel g\" x=\"168\" y=\"303\" text-anchor=\"middle\" style=\"font-size:12px;font-weight:700\">X ÷ unit = the count<\/text><text class=\"slabel  numtxt\" x=\"168\" y=\"338\" text-anchor=\"middle\" style=\"font-size:22px;font-weight:700;fill:var(--ink)\">1.4 ÷ 0.1 = 14<\/text><text class=\"slabel  numtxt\" x=\"168\" y=\"366\" text-anchor=\"middle\" style=\"font-size:11px;fill:var(--ink-2)\">how many tenths make 1.4<\/text><text class=\"slabel r\" x=\"472\" y=\"303\" text-anchor=\"middle\" style=\"font-size:12px;font-weight:700\">X × unit = the slip<\/text><text class=\"slabel  numtxt\" x=\"472\" y=\"338\" text-anchor=\"middle\" style=\"font-size:22px;font-weight:700;fill:var(--ink)\">1.4 × 0.1 = 0.14<\/text><text class=\"slabel  numtxt\" x=\"472\" y=\"366\" text-anchor=\"middle\" style=\"font-size:11px;fill:var(--ink-2)\">smaller than 1.4: the wrong way round<\/text><circle class=\"handle\" cx=\"182\" cy=\"145\" r=\"7\"><\/circle><circle class=\"handle\" cx=\"266\" cy=\"145\" r=\"7\"><\/circle><circle class=\"handle\" cx=\"350\" cy=\"135\" r=\"7\"><\/circle><circle class=\"handle\" cx=\"434\" cy=\"105\" r=\"7\"><\/circle><circle class=\"handle\" cx=\"518\" cy=\"145\" r=\"7\"><\/circle><\/svg>","sec":"num","fm":["Scientific notation","The division algorithm","Multiplying and dividing powers","Negative and zero exponents","Unit conversion by cancelling"]},"cb_circle":{"title":"The circle, all at once","tag":"Geometry","say":"Set the size of the circle, set the angle of the slice, and drag the point on the edge. Every circle rule answers at the same time. The four buttons swap what is drawn, so no single picture gets crowded. Every answer with a curve in it is left as a multiple of pi, the way the exam writes it.","note":"One thing is worth carrying out of this board above the rest. A slice is a fraction. A full turn is 360°, so the angle over 360 is that fraction. It is then the same fraction of the circumference and of the area. The second thing: leave pi standing. A circle answer is written as a multiple of pi, so 12π is the answer and 37.7 is not. The third: the angle at the middle is twice the angle at the edge. A question that hands you one of them has already handed you the other.","tries":["Change the radius and watch the circumference grow in step with it. The area grows much faster. Double the radius and the area goes up four times.","Open the slice to 90°. The arc is a quarter of the circumference. The slice is a quarter of the area. One fraction, used twice.","Switch to <b>two angles<\/b> and drag the point on the edge. The angle at the edge never changes, and it is always half the angle at the middle.","Open the slice to 180° in that same view. The angle at the edge becomes a right angle, every time, wherever the point sits.","Switch to <b>the touching line<\/b>. It meets the radius at a right angle at the point of contact, and nowhere else."],"ideas":[{"lead":"<b>Everything starts from the radius.<\/b>","rest":"The radius runs from the middle O to the edge. The diameter goes through the middle. It is two radiuses long.","f":"d = 2r","eg":"r = 5 → d = 10","big":"Everything in a circle starts from the radius.","html":"<ul><li>The <b>radius<\/b> (r) is the line from the middle of the circle to the edge.<\/li><li>The <b>diameter<\/b> (d) goes from edge to edge, straight through the middle.<\/li><li>So one diameter is two radiuses put end to end.<\/li><\/ul><p><b>Rule:<\/b> d = 2r<\/p><div class=\"ex\"><b>Example:<\/b> the radius is 5. What is the diameter?<ol><li>d = 2 × 5 = <b>10<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 If a question gives you the diameter, halve it first to get the radius. Most circle rules use r.<\/p>"},{"lead":"<b>The circumference and the area are not the same kind of thing.<\/b>","rest":"One grows in step with the radius. The other grows with the radius squared.","f":"C = 2πr · A = πr²","eg":"r = 3: C = 6π ≈ 18.8 (a length) · A = 9π ≈ 28.3 (an area)","big":"The distance around grows with r. The area grows with r².","html":"<ul><li><b>Circumference<\/b> (C) is the distance all the way around the edge. It is a length.<\/li><li><b>Area<\/b> (A) is the space inside the circle. It is measured in squares.<\/li><li><b>π<\/b> (pi) is a fixed number, about 3.14.<\/li><\/ul><p><b>Rule:<\/b> C = 2πr and A = πr²<\/p><div class=\"ex\"><b>Example:<\/b> a circle with radius 3<ol><li>C = 2 × π × 3 = <b>6π<\/b> ≈ 18.8 (a length)<\/li><li>A = π × 3² = π × 9 = <b>9π<\/b> ≈ 28.3 (an area)<\/li><\/ol><\/div><p class=\"warn\">⚠️ Do not mix them up. Only the area rule has the r squared (r × r).<\/p>"},{"lead":"<b>Leave pi standing.<\/b>","rest":"A circle answer is written as a multiple of pi, so 2π(6) is 12π and it stops there. Turning it into 37.7 only loses marks.","f":"C = 12π, not 37.7","big":"Keep π in your answer. Do not turn it into a decimal.","html":"<p>GRE answer choices for circles are written with π in them, like 12π.<\/p><div class=\"ex\"><b>Example:<\/b> the circumference of a circle with radius 6<ol><li>C = 2πr = 2 × π × 6<\/li><li>2 × 6 = 12, so C = <b>12π<\/b>. Stop there.<\/li><\/ol><\/div><p class=\"warn\">⚠️ Changing 12π into 37.7 makes it harder to find in the answer choices. Only use π ≈ 3.14 if the choices are decimals.<\/p>"},{"lead":"<b>A slice is a fraction of the whole circle.<\/b>","rest":"A full turn is 360°. Your angle sits over that. Use the same fraction on the circumference and on the area.","f":"arc = (θ/360) × 2πr · slice = (θ/360) × πr²","eg":"r = 6, θ = 60°: arc = (60/360) × 12π = 2π · slice = (60/360) × 36π = 6π","big":"A slice of a circle is a fraction of the whole circle.","html":"<ul><li>A full turn around the middle is 360°.<\/li><li>The slice's angle at the middle (θ) over 360 tells you what fraction you have.<\/li><li>An <b>arc<\/b> is the curved part of the edge on the slice.<\/li><\/ul><p><b>Rule:<\/b> arc = (θ/360) × 2πr, and slice area = (θ/360) × πr²<\/p><div class=\"ex\"><b>Example:<\/b> r = 6 and the angle is 60°<ol><li>Fraction: 60/360 = 1/6<\/li><li>Whole circumference: 2π × 6 = 12π, so arc = 12π ÷ 6 = <b>2π<\/b><\/li><li>Whole area: π × 6² = 36π, so slice = 36π ÷ 6 = <b>6π<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 Use the same fraction for the arc and for the area.<\/p>"},{"lead":"<b>The angle at the middle is twice the angle at the edge.<\/b>","rest":"Both must stand on the same piece of the edge. Moving the point on the edge does not change its angle.","f":"middle = 2 × edge","eg":"angle at the edge 35° → angle at the middle 70°","big":"The angle at the middle is twice the angle at the edge.","html":"<ul><li>Pick two points on the circle. They mark off one piece of the edge (an arc).<\/li><li>Join them to the middle: that makes the <b>middle angle<\/b>.<\/li><li>Join them to any other point on the edge: that makes the <b>edge angle<\/b>.<\/li><li>Moving that edge point along the circle does not change the edge angle.<\/li><\/ul><p><b>Rule:<\/b> middle angle = 2 × edge angle<\/p><div class=\"ex\"><b>Example:<\/b> the edge angle is 35°<ol><li>Middle angle = 2 × 35° = <b>70°<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ This only works when both angles stand on the <b>same<\/b> arc.<\/p>"},{"lead":"<b>Half a circle always gives a right angle.<\/b>","rest":"If the two ends of the arc are opposite each other, the angle at the edge is 90°.","f":"180° ÷ 2 = 90°","eg":"AB is a diameter and C is on the circle → angle C = 90°","big":"An angle that stands on a diameter is always 90°.","html":"<p>A <b>diameter<\/b> is a line through the middle, from edge to edge. It cuts the circle in half.<\/p><ul><li>The middle angle on a diameter is a straight line: 180°.<\/li><li>So the edge angle is half of that: 180° ÷ 2 = 90°.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> AB is a diameter of length 10. C is on the circle and AC = 6. Find BC.<ol><li>Angle C = 90°, so ABC is a right triangle with AB as the longest side.<\/li><li>Pythagoras: 6² + BC² = 10², so 36 + BC² = 100<\/li><li>BC² = 64, so BC = <b>8<\/b> ✅ (36 + 64 = 100)<\/li><\/ol><\/div><p class=\"tip\">💡 See a triangle inside a circle with one side as the diameter? It is a right triangle.<\/p>"},{"lead":"<b>A line that touches the circle once meets the radius square on.<\/b>","rest":"That is what makes the right triangle you need for tangent questions.","f":"tangent ⊥ radius","eg":"radius 5 to the touching point: the tangent meets it at 90°","big":"A line that just touches a circle makes a 90° angle with the radius.","html":"<ul><li>A <b>tangent<\/b> is a straight line that touches the circle at only one point.<\/li><li>Draw the radius to that point. The tangent and the radius meet at 90°.<\/li><li>That gives you a right triangle, so you can use Pythagoras.<\/li><\/ul><p><b>Rule:<\/b> the tangent and the radius always meet at 90°.<\/p><div class=\"ex\"><b>Example:<\/b> the radius is 5. A point P is 13 from the middle. A tangent from P touches the circle. How long is the tangent?<ol><li>Right triangle: radius 5, tangent t, and 13 is the longest side.<\/li><li>5² + t² = 13², so 25 + t² = 169<\/li><li>t² = 144, so t = <b>12<\/b> ✅<\/li><\/ol><\/div>"},{"lead":"<b>A chord is any straight line joining two points on the edge.<\/b>","rest":"Cut it in half and you get a right triangle. The longest chord of all is the diameter.","f":"chord = 2r × sin(θ/2)","eg":"r = 5, θ = 60°: chord = 2 × 5 × ½ = 5","big":"A chord joins two points on the edge. The longest chord is the diameter.","html":"<ul><li>A <b>chord<\/b> is any straight line from one point on the edge to another.<\/li><li>Draw two radiuses to its ends. Cut the chord in half from the middle and you get two right triangles.<\/li><li>The longest chord goes through the middle, so it is the diameter.<\/li><\/ul><p><b>Rule:<\/b> chord = 2r × sin(θ/2), where θ is the middle angle. For 60°, sin 30° = ½.<\/p><div class=\"ex\"><b>Example:<\/b> r = 5 and the middle angle is 60°<ol><li>chord = 2 × 5 × sin 30°<\/li><li>= 10 × ½ = <b>5<\/b><\/li><\/ol>Check: two radiuses of 5 with 60° between them make a triangle with all sides equal, so the chord is 5 ✅<\/div><p class=\"tip\">💡 For a 60° middle angle, the chord always equals the radius.<\/p>"},{"lead":"<b>Three chords at 120° make an equilateral triangle inside the circle.<\/b>","rest":"Each of the three triangles at the middle has two radius sides. The angle between them is 120°. So each area is ½ × r × r × sin 120°, and sin 120° is √3 ÷ 2. That makes each one (√3 ÷ 4) × r². Three of them give (3√3 ÷ 4) × r².","f":"area = (3√3 ÷ 4) × r²","eg":"r = 2: area = (3√3 ÷ 4) × 4 = 3√3","big":"A triangle with equal sides inside a circle has area (3√3 ÷ 4) × r².","html":"<ul><li>An <b>equilateral triangle<\/b> has 3 equal sides. Put its corners on the circle.<\/li><li>Draw radiuses to the 3 corners. You get 3 equal small triangles, each with a 120° angle at the middle.<\/li><li>Each small triangle = ½ × r × r × sin 120°. Remember sin 120° = √3 ÷ 2.<\/li><li>So each one is (√3 ÷ 4) × r². Three of them give (3√3 ÷ 4) × r².<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> r = 2<ol><li>r² = 4<\/li><li>area = (3√3 ÷ 4) × 4 = <b>3√3<\/b> ≈ 5.2<\/li><\/ol><\/div><p class=\"tip\">💡 120° comes from 360° ÷ 3.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><circle cx=\"320\" cy=\"205\" r=\"135\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2\"><\/circle><circle cx=\"320\" cy=\"205\" r=\"3\" style=\"fill:var(--ink)\"><\/circle><text class=\"slabel b\" x=\"308\" y=\"221\" text-anchor=\"end\">O<\/text><path style=\"fill:var(--amber);fill-opacity:.2;stroke:var(--amber);stroke-width:2\" d=\"M 320 205 L 455 205 A 135 135 0 0 0 320 70 Z\"><\/path><path style=\"fill:none;stroke:var(--green);stroke-width:4\" d=\"M 455 205 A 135 135 0 0 0 320 70\"><\/path><path class=\"arcline\" d=\"M 354 205 A 34 34 0 0 0 320 171\"><\/path><text class=\"slabel a numtxt\" x=\"356.77\" y=\"172.23\" text-anchor=\"middle\">90°<\/text><text class=\"slabel g numtxt\" x=\"449.82\" y=\"79.18\" text-anchor=\"middle\">arc = (7/2)π<\/text><text class=\"slabel b numtxt\" x=\"394.25\" y=\"193\" text-anchor=\"middle\">r = 7<\/text><line x1=\"320\" y1=\"205\" x2=\"455\" y2=\"205\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><line x1=\"320\" y1=\"205\" x2=\"320\" y2=\"70\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><circle class=\"handle\" cx=\"320\" cy=\"70\" r=\"8\"><\/circle><text class=\"slabel a numtxt\" x=\"320\" y=\"26\" text-anchor=\"middle\">(90/360) = ¼ of the circle, used twice over<\/text><text class=\"slabel \" x=\"320\" y=\"386\" text-anchor=\"middle\">drag the dot on the edge to open and close the slice<\/text><\/svg>","sec":"geo","fm":["Circumference of a circle","Area of a circle","Arc length","Sector area","Sector area from its arc length","The inscribed angle","The right angle in a semicircle","A tangent is perpendicular to the radius","Chord length from its distance to the centre","Tangent length from an external point"]},"cb_cut":{"title":"Cutting a piece out, and the perimeter","tag":"Geometry","say":"Cutting a piece out of a shape always takes area away. The perimeter is a different story. The same bite can leave the perimeter alone, make it longer, or make it shorter. The four bite buttons show all three answers from one rectangle. The last two buttons swap to a strip of land, where the area is collected from the left. Drag the dots. One unit on this board is one unit of length.","note":"One line is worth carrying away. Area and perimeter do not answer to the same rule. A cut that takes area away may leave the perimeter longer, shorter or untouched. Sort the cut by where its middle sits before you count anything. The bite slider only bites on the first four views. On the last two it is the line you drag that matters.","tries":["Set the bite to 2 and press each of the four bite buttons in turn. The area lost barely moves. The change in the perimeter goes 0, then +4, then π − 4, then +π.","Press <b>edge notch<\/b> and drag the top dot sideways. The bite slides along the edge and not one number moves. Where along the edge you cut does not matter.","Press <b>corner notch<\/b> and make the bite as big as it goes. The area falls a long way and the perimeter still reads the same as the plain rectangle.","Press <b>round bite at a corner<\/b>. It is the only one of the four that makes the perimeter shorter. An arc is shorter than the two straight pieces it replaces.","Press <b>adding it up<\/b> and drag the line right. Watch the running total jump past 5 at the first corner and past 14 at the second.","Press <b>the strip of land<\/b> and drag the line. The true area always sits between the short dashed box and the tall dashed box, never outside them."],"ideas":[{"lead":"<b>Cutting a piece out always takes area away.<\/b>","rest":"What is left is the whole shape minus the piece you cut out. That half never surprises anybody.","f":"area left = whole − piece","eg":"10 × 6 rectangle = 60, cut out a 2 × 2 square → 56","big":"Cutting a piece out always makes the area smaller.","html":"<p><b>Area<\/b> is the space inside a shape. If you remove a piece, that space is gone.<\/p><p><b>Rule:<\/b> area left = whole area − piece cut out<\/p><div class=\"ex\"><b>Example:<\/b> a 10 × 6 rectangle with a 2 × 2 square cut out<ol><li>Whole = 10 × 6 = 60<\/li><li>Piece = 2 × 2 = 4<\/li><li>Left = 60 − 4 = <b>56<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 The area part is easy. The perimeter is where the traps are.<\/p>"},{"lead":"<b>The perimeter can go up, down, or stay exactly where it was.<\/b>","rest":"It depends on where you cut, not on how much area you took away.","f":"less area does not mean a shorter perimeter","big":"After a cut, the perimeter can go up, go down, or stay the same.","html":"<ul><li>The <b>perimeter<\/b> is the distance all the way around the edge.<\/li><li>It depends on where and how you cut, not on how much area you remove.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> a 10 × 6 rectangle (perimeter 32), with different cuts<ol><li>2 × 2 square cut from a corner → still <b>32<\/b><\/li><li>2 × 2 square cut into the middle of a side → <b>36<\/b> (longer)<\/li><li>Quarter circle of radius 2 cut from a corner → about <b>31.14<\/b> (shorter)<\/li><\/ol><\/div><p class=\"warn\">⚠️ Less area does NOT mean a shorter perimeter.<\/p>"},{"lead":"<b>A square notch cut out of a corner leaves the perimeter alone.<\/b>","rest":"You lose r of edge twice over. You get r of new edge back twice over.","f":"−2r straight, +2r straight, change = 0","eg":"10 × 6: P = 32. Cut a 2 × 2 square from a corner and P is still 32","big":"A square cut from a corner does not change the perimeter.","html":"<ul><li>You remove two pieces of edge, each as long as the cut's side.<\/li><li>You add two new edges of exactly the same lengths.<\/li><li>Lost and gained cancel: change = 0.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> a 10 × 6 rectangle with a 2 × 2 square cut from one corner<ol><li>Before: 10 + 6 + 10 + 6 = 32<\/li><li>Lose 2 + 2 = 4 of old edge. Gain 2 + 2 = 4 of new edge.<\/li><li>After: 32 − 4 + 4 = <b>32<\/b><\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> the new edges just push the corner inward. Going around is still the same total across and up.<\/p>"},{"lead":"<b>A square notch cut into an edge makes the perimeter longer.<\/b>","rest":"The travel across is the same as before. Two new walls go in and come back out at a right angle.","f":"change = +2 × the depth","eg":"a 2 × 2 notch in the middle of an edge: 32 + 2 × 2 = 36","big":"A square notch cut into a side makes the perimeter longer.","html":"<ul><li>The walk across the side is still the same length overall.<\/li><li>But you now walk down into the notch and back out.<\/li><li>Those two new walls are extra.<\/li><\/ul><p><b>Rule:<\/b> change = + 2 × the depth of the notch<\/p><div class=\"ex\"><b>Example:<\/b> a 10 × 6 rectangle (perimeter 32) with a 2 × 2 notch in the middle of a side<ol><li>The notch is 2 deep, so two new walls of 2 each.<\/li><li>New perimeter = 32 + 2 × 2 = <b>36<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ Students think a cut makes things smaller. Here the area goes down but the perimeter goes up.<\/p>"},{"lead":"<b>A quarter circle bitten out of a corner makes the perimeter shorter.<\/b>","rest":"A whole circle is 2πr round, so a quarter of it is πr/2. That arc is shorter than the 2r of edge it replaces.","f":"change = πr/2 − 2r ≈ −0.43r","eg":"r = 2: change = π − 4 ≈ −0.86","big":"A quarter circle cut from a corner makes the perimeter shorter.","html":"<ul><li>You remove two pieces of straight edge, each of length r (the radius). That is 2r.<\/li><li>You add a curved edge: a quarter of a circle, 2πr ÷ 4 = πr/2.<\/li><li>πr/2 is about 1.57r, which is less than 2r.<\/li><\/ul><p><b>Rule:<\/b> change = πr/2 − 2r ≈ −0.43r<\/p><div class=\"ex\"><b>Example:<\/b> r = 2, on a rectangle with perimeter 32<ol><li>Lose 2 × 2 = 4<\/li><li>Gain π × 2 ÷ 2 = π ≈ 3.14<\/li><li>Change = π − 4 ≈ <b>−0.86<\/b>, so the new perimeter is 28 + π ≈ 31.14<\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> the curve cuts the corner, so it is a shorter path than going around the corner.<\/p>"},{"lead":"<b>A quarter circle bitten out of an edge makes the perimeter longer.<\/b>","rest":"One radius eats r of that edge. The other radius hands r straight back. The arc πr/2 is pure extra.","f":"change = +πr/2 ≈ +1.57r","eg":"r = 2: change = +π ≈ +3.14","big":"A quarter circle cut into a side makes the perimeter longer.","html":"<ul><li>One straight radius edge takes away r of the old side.<\/li><li>The other straight radius edge adds r back. These cancel.<\/li><li>The curved arc, πr/2, is all extra.<\/li><\/ul><p><b>Rule:<\/b> change = + πr/2 ≈ +1.57r<\/p><div class=\"ex\"><b>Example:<\/b> r = 2, on a rectangle with perimeter 32<ol><li>Arc = π × 2 ÷ 2 = π ≈ 3.14<\/li><li>New perimeter = <b>32 + π<\/b> ≈ 35.14<\/li><\/ol><\/div><p class=\"warn\">⚠️ Same bite, different place, different answer. Corner cut: shorter. Side cut: longer.<\/p>"},{"lead":"<b>Start from the rectangle before you touch the cut.<\/b>","rest":"Its perimeter is two widths plus two heights. Its area is width times height.","f":"P = 2(w + h) · A = wh","eg":"w = 10, h = 6: P = 32, A = 60","big":"Start with the plain rectangle before you think about the cut.","html":"<ul><li><b>Perimeter<\/b> (distance around) = 2 widths + 2 heights.<\/li><li><b>Area<\/b> (space inside) = width × height.<\/li><\/ul><p><b>Rule:<\/b> P = 2(w + h) and A = w × h<\/p><div class=\"ex\"><b>Example:<\/b> width 10, height 6<ol><li>P = 2 × (10 + 6) = 2 × 16 = <b>32<\/b><\/li><li>A = 10 × 6 = <b>60<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 Then add or take away what the cut changes.<\/p>"},{"lead":"<b>A piece with a sloping top is a trapezoid.<\/b>","rest":"Average its two end heights, then times the width. A rectangle is the easy case where both ends match.","f":"area = ½(a + b) × w","eg":"ends 4 and 6, width 5: area = ½(4 + 6) × 5 = 25","big":"A shape with a sloped top: average the two ends, then times the width.","html":"<ul><li>This shape is a <b>trapezoid<\/b>: two parallel sides (the ends) of different lengths.<\/li><li>Find the average of the two end heights, then multiply by the width.<\/li><li>A rectangle is the easy case, where both ends are the same.<\/li><\/ul><p><b>Rule:<\/b> area = ½ × (a + b) × w<\/p><div class=\"ex\"><b>Example:<\/b> ends 4 and 6, width 5<ol><li>Average of the ends: (4 + 6) ÷ 2 = 5<\/li><li>Area = 5 × 5 = <b>25<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ Do not forget the ½. Add the ends, then halve.<\/p>"},{"lead":"<b>Cut the shape at every corner of its top, then add the pieces on from the left.<\/b>","rest":"The number you carry is the area collected so far.","f":"total so far = piece 1 + piece 2 + ...","big":"For an odd shape, cut it into simple pieces and add them up.","html":"<ul><li>Cut the shape straight down at every corner of its top.<\/li><li>Each piece is now a rectangle or a trapezoid.<\/li><li>Work out each piece and keep a running total from left to right.<\/li><\/ul><p><b>Rule:<\/b> total = piece 1 + piece 2 + …<\/p><div class=\"ex\"><b>Example:<\/b> a strip whose top goes from height 4 up to 6 over 5 units, then stays at 6 for 3 more units<ol><li>Piece 1 (trapezoid): ½ × (4 + 6) × 5 = 25<\/li><li>Piece 2 (rectangle): 6 × 3 = 18<\/li><li>Total = 25 + 18 = <b>43<\/b><\/li><\/ol><\/div>"},{"lead":"<b>Width times one end height is never the area.<\/b>","rest":"It is a bound. The short end gives you too little and the tall end gives you too much.","f":"w × short &lt; area &lt; w × tall","eg":"ends 4 and 6, width 5: 5 × 4 = 20 < 25 < 5 × 6 = 30","big":"Width × one end height is never the true area of a sloped shape.","html":"<ul><li>Using the short end gives an answer that is too small.<\/li><li>Using the tall end gives an answer that is too big.<\/li><li>The real area is somewhere in between.<\/li><\/ul><p><b>Rule:<\/b> w × short end &lt; area &lt; w × tall end<\/p><div class=\"ex\"><b>Example:<\/b> ends 4 and 6, width 5<ol><li>Too small: 5 × 4 = 20<\/li><li>Too big: 5 × 6 = 30<\/li><li>Real area: ½ × (4 + 6) × 5 = 25<\/li><li>So 20 &lt; <b>25<\/b> &lt; 30 ✅<\/li><\/ol><\/div><p class=\"tip\">💡 This is a quick way to check your answer or to rule out choices.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 440\"><polygon points=\"205,168 475,168 475,378 205,378\" style=\"fill:none;stroke:var(--ink-3);stroke-width:1.1;stroke-dasharray:4 4\"><\/polygon><polygon points=\"415,168 475,168 475,228 415,228\" style=\"fill:var(--red-wash);stroke:var(--red);stroke-width:2;stroke-linejoin:round\"><\/polygon><path style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2;stroke-linejoin:round\" d=\"M 205 168 L 415 168 L 415 228 L 475 228 L 475 378 L 205 378 Z\"><\/path><line x1=\"415\" y1=\"168\" x2=\"475\" y2=\"168\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><line x1=\"475\" y1=\"168\" x2=\"475\" y2=\"228\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><line x1=\"415\" y1=\"168\" x2=\"415\" y2=\"228\" style=\"stroke:var(--green);stroke-width:4;fill:none\"><\/line><line x1=\"415\" y1=\"228\" x2=\"475\" y2=\"228\" style=\"stroke:var(--green);stroke-width:4;fill:none\"><\/line><text class=\"slabel r numtxt\" x=\"445\" y=\"156\" text-anchor=\"middle\">r = 2<\/text><text class=\"slabel  numtxt\" x=\"340\" y=\"404\" text-anchor=\"middle\">width 9<\/text><text class=\"slabel  numtxt\" x=\"191\" y=\"277\" text-anchor=\"end\">height 7<\/text><text class=\"slabel  numtxt\" x=\"340\" y=\"26\" text-anchor=\"middle\">area 63 − 4 = 59 &nbsp;·&nbsp; perimeter 32 → 32<\/text><text class=\"slabel g numtxt\" x=\"340\" y=\"48\" text-anchor=\"middle\">2r of straight edge gone in red, 2r of straight edge back in green<\/text><circle class=\"handle\" cx=\"415\" cy=\"228\" r=\"8\"><\/circle><\/svg>","sec":"geo","fm":["Rectangle: area and perimeter","The square: area, perimeter and diagonal","The trapezoid: area and perimeter","Shaded region by subtraction","Area of a circle","Circumference of a circle","Arc length","Sector area","Area of a triangle","Area of a parallelogram","Perimeter of a parallelogram or rhombus"]},"cb_tri":{"title":"The triangle, all at once","tag":"Geometry","say":"Drag any corner of the triangle. Every measurement below answers at once, and each one shows the rule that made it with your own numbers put in. The three sides, the three angles, the perimeter, the area, and both of the triangle tests. Every corner lands on a whole unit. So each side squared is a whole number, and each side is left as an exact square root.","note":"Two of these rules are worth more than the rest. Area is half the base times the height. That half comes from the parallelogram two copies of the triangle make. The height must be measured square on to the base. So sliding a corner along a line parallel to the base leaves the area alone. The other rule: the largest angle always sits opposite the longest side. In a right triangle that longest side is the hypotenuse. Every corner sits on a whole unit here. So a side is always the square root of a whole number. The board leaves it as a root, and names its size beside it.","tries":["Drag the top corner <b>straight sideways<\/b>. The base and the height never change, so the area never changes — but every side length and every angle does.","Make the largest angle pass through 90° and watch the verdict flip from acute to right to obtuse. The moment it reads <b>right<\/b>, the two squares in the readout match.","Drag one corner towards the line joining the other two. The area heads for zero, and the longest side heads for the sum of the other two — the triangle inequality closing.","Switch to <b>medians<\/b> and drag a corner. The centroid, the balance point, stays two thirds of the way down every median."],"ideas":[{"lead":"<b>The three angles always add to 180°.<\/b>","rest":"Drag any corner and watch the three readings move against each other while the total stays put.","f":"A + B + C = 180°","eg":"50° + 60° + 70° = 180°","big":"In every triangle, the 3 angles add to 180°.","html":"<p>The triangle can be tall, flat, wide or thin. The total is always 180°.<\/p><ul><li>If one angle gets bigger, the others must get smaller.<\/li><li>So knowing 2 angles always gives you the third.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> a triangle has angles 50° and 60°. Find the third.<ol><li>50 + 60 = 110<\/li><li>180 − 110 = <b>70°<\/b><\/li><\/ol>Check: 50 + 60 + 70 = 180 ✅<\/div><p class=\"tip\">💡 A triangle can have only one angle of 90° or more. Two of them would already use up all 180°.<\/p>"},{"lead":"<b>Area is half the base times the height.<\/b>","rest":"Two copies of the triangle fit together into a parallelogram, a pushed-over rectangle. That parallelogram is base × height. So one triangle is half of it. The height is measured square on to the base.","f":"Area = ½ × base × height","eg":"base 8, height 5 → ½ × 8 × 5 = 20","big":"Triangle area = half of base × height.","html":"<p><b>The words:<\/b><\/p><ul><li><b>Base<\/b> is the side the triangle sits on.<\/li><li><b>Height<\/b> is the straight-up distance from the base to the top corner. It meets the base at a right angle (90°).<\/li><\/ul><p><b>Rule:<\/b> Area = ½ × base × height<\/p><div class=\"ex\"><b>Example:<\/b> base 8, height 5.<ol><li>base × height = 8 × 5 = 40<\/li><li>Half of it: 40 ÷ 2 = <b>20<\/b><\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> two copies of the triangle fit together into a parallelogram (a pushed-over rectangle). Its area is base × height, so one triangle is half of it.<\/p><p class=\"warn\">⚠️ The height is not a slanted side. It must go straight up from the base.<\/p>"},{"lead":"<b>Two sides fix a window for the third.<\/b>","rest":"The longest side must stay shorter than the other two added together, or the shape cannot close.","f":"|a − b| &lt; c &lt; a + b","eg":"sides 3 and 7: 4 < c < 10","big":"The third side must be longer than the difference and shorter than the sum of the other two.","html":"<p>A triangle can only close if each side is shorter than the other two added together.<\/p><p><b>Rule:<\/b> if two sides are a and b, the third side c must fit in this window:<br>(bigger − smaller) &lt; c &lt; (a + b)<\/p><div class=\"ex\"><b>Example:<\/b> two sides are 3 and 7.<ol><li>Difference: 7 − 3 = 4<\/li><li>Sum: 7 + 3 = 10<\/li><li>So the third side is <b>more than 4 and less than 10<\/b>: 4 &lt; c &lt; 10<\/li><\/ol><\/div><p class=\"warn\">⚠️ The ends are not allowed. A third side of exactly 4 or exactly 10 makes a flat line, not a triangle.<\/p>"},{"lead":"<b>The longest side faces the largest angle<\/b>, always.","rest":"It is how a question about angles can be settled by looking only at lengths.","f":"a &lt; b → A &lt; B","eg":"sides 3, 4, 5: the 90° angle faces the 5","big":"The longest side is always across from the biggest angle.","html":"<ul><li>The <b>longest side<\/b> faces the <b>biggest angle<\/b>.<\/li><li>The <b>shortest side<\/b> faces the <b>smallest angle<\/b>.<\/li><\/ul><p>\"Faces\" means the side is across the triangle from that corner, not touching it.<\/p><div class=\"ex\"><b>Example:<\/b> a triangle has sides 3, 4 and 5, and one 90° angle.<ol><li>The biggest angle is 90°.<\/li><li>The longest side is 5.<\/li><li>So the 90° angle faces the side <b>5<\/b>.<\/li><\/ol><\/div><p class=\"tip\">💡 This lets you compare angles just by looking at side lengths, with no angle math.<\/p>"},{"lead":"<b>Squaring the sides says which kind of triangle it is.<\/b>","rest":"Compare the longest side squared with the other two squared added together. When the two match, the triangle has a right angle. Its longest side is then the hypotenuse.","f":"c² &lt; a² + b² acute · = right · &gt; obtuse","eg":"4, 5, 6: 36 < 16 + 25 = 41 → acute · 3, 4, 6: 36 > 9 + 16 = 25 → obtuse","big":"Square the sides to tell what kind of triangle it is.","html":"<p>Let c be the longest side. Compare c² with a² + b² (the other two sides squared and added).<\/p><ul><li>c² = a² + b² → <b>right triangle<\/b> (one 90° angle). Then c is the <b>hypotenuse<\/b>, the longest side, across from the right angle.<\/li><li>c² &lt; a² + b² → <b>acute<\/b> (every angle is less than 90°)<\/li><li>c² &gt; a² + b² → <b>obtuse<\/b> (one angle is more than 90°)<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> sides 3, 4 and 6.<ol><li>Longest side squared: 6² = 36<\/li><li>Other two: 3² + 4² = 9 + 16 = 25<\/li><li>36 &gt; 25 → <b>obtuse<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 Sides 4, 5, 6 give 36 &lt; 16 + 25 = 41, so that one is <b>acute<\/b>.<\/p>"},{"lead":"<b>A side on a grid comes from a right triangle.<\/b>","rest":"Go across, then up, and the side you want is the square root of the two squares added.","f":"side = √(across² + up²)","eg":"3 across and 4 up → √(9 + 16) = 5","big":"To find a slanted side on a grid, use the hidden right triangle.","html":"<p>A slanted line on a grid is the long side of a hidden right triangle.<\/p><ul><li>Count how many squares it goes <b>across<\/b>.<\/li><li>Count how many squares it goes <b>up<\/b>.<\/li><\/ul><p><b>Rule:<\/b> side = √(across² + up²)<\/p><div class=\"ex\"><b>Example:<\/b> a side goes 3 across and 4 up.<ol><li>Square each: 3² = 9 and 4² = 16<\/li><li>Add: 9 + 16 = 25<\/li><li>Square root: √25 = <b>5<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 √ (square root) asks \"what number times itself gives this?\" 5 × 5 = 25, so √25 = 5.<\/p>"},{"lead":"<b>The three medians all meet at one point.<\/b>","rest":"That point is the centroid, the balance point of the triangle. Each median is cut there into two pieces, and the piece touching the corner is twice the other.","f":"corner to centroid : centroid to midpoint = 2 : 1","eg":"a median 9 long: 6 from the corner, 3 from the midpoint","big":"The 3 medians meet at one point, and it splits each median 2 to 1.","html":"<p><b>The words:<\/b><\/p><ul><li>A <b>median<\/b> is a line from a corner to the middle point of the opposite side.<\/li><li>The 3 medians cross at one point, the <b>centroid<\/b>. It is the balance point of the triangle.<\/li><\/ul><p><b>Rule:<\/b> the centroid cuts each median into 2 parts. The part touching the corner is <b>twice<\/b> as long as the other part (2 : 1).<\/p><div class=\"ex\"><b>Example:<\/b> a median is 9 long.<ol><li>Split 9 into 3 equal shares: 9 ÷ 3 = 3<\/li><li>Corner part = 2 shares = <b>6<\/b><\/li><li>Other part = 1 share = <b>3<\/b><\/li><\/ol>Check: 6 + 3 = 9, and 6 is twice 3 ✅<\/div>"},{"lead":"<b>Join two midpoints and you get a midsegment.<\/b>","rest":"It is half the side it faces, and parallel to that side. The middle triangle is a quarter of the area.","f":"midsegment = ½ × the side it faces","eg":"side 10 → midsegment 5","big":"Join the middles of two sides: the new line is half the third side.","html":"<p>A <b>midsegment<\/b> is the line joining the middle points of two sides of a triangle.<\/p><ul><li>It is <b>half as long<\/b> as the side it faces (the third side).<\/li><li>It is <b>parallel<\/b> to that side. It runs the same way and never meets it.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> the third side is 10.<ol><li>Midsegment = ½ × 10 = <b>5<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 Draw all 3 midsegments. They make a small middle triangle that is <b>¼ of the area<\/b> of the big one.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><polygon points=\"120,340 420,340 260,100\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2;stroke-linejoin:round\"><\/polygon><path class=\"arcline\" d=\"M 146 340 A 26 26 0 0 0 133.1 317.54\"><\/path><text class=\"slabel b numtxt\" x=\"158.15\" y=\"322.09\" text-anchor=\"middle\">59.7°<\/text><path class=\"arcline\" d=\"M 405.58 318.37 A 26 26 0 0 0 394 340\"><\/path><text class=\"slabel b numtxt\" x=\"381.21\" y=\"323.24\" text-anchor=\"middle\">56.3°<\/text><path class=\"arcline\" d=\"M 246.9 122.46 A 26 26 0 0 0 274.42 121.63\"><\/path><text class=\"slabel b numtxt\" x=\"261.32\" y=\"147.98\" text-anchor=\"middle\">64°<\/text><text class=\"slabel  numtxt\" x=\"359.97\" y=\"210.69\" text-anchor=\"middle\">a = 4√13 ≈ 14.42<\/text><text class=\"slabel  numtxt\" x=\"169.27\" y=\"211.91\" text-anchor=\"middle\">b = √193 ≈ 13.89<\/text><text class=\"slabel r numtxt\" x=\"270\" y=\"368\" text-anchor=\"middle\">c = 15<\/text><text class=\"slabel b\" x=\"104\" y=\"356\" text-anchor=\"middle\">A<\/text><text class=\"slabel b\" x=\"436\" y=\"356\" text-anchor=\"middle\">B<\/text><text class=\"slabel b\" x=\"260\" y=\"82\" text-anchor=\"middle\">C<\/text><circle class=\"handle\" cx=\"120\" cy=\"340\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"420\" cy=\"340\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"260\" cy=\"100\" r=\"8\"><\/circle><\/svg>","sec":"geo","fm":["Area of a triangle","Area of a triangle from its vertices","The triangle inequality","The converse of Pythagoras: acute, right or obtuse","Angle sum of a triangle","The midsegment","The centroid divides each median 2 : 1","The longest side faces the largest angle","Exterior angle of a triangle"]},"cb_shapes":{"title":"Flat shapes and the solids they grow into","tag":"Geometry","say":"Move the sliders. The first sets how many sides the polygon has, from 3 up to 12. The second sets the radius, which runs from the middle out to a corner. The third sets the height when you stand the polygon up. Every angle rule, the diagonals, the area, the volume and the surface area answer at once.","note":"","tries":["Slide the number of sides from 3 up to 12. The angles inside add to more each time, but each turn on the outside gets smaller.","Set the sides to <b>4<\/b>. The flat polygon is a square, and standing it up
