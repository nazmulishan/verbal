gives you a box. Set the height to match the side and you get a cube.","Press <b>the lines across<\/b> and count the diagonals yourself at 5 sides and then at 6 sides. The count jumps from 5 to 9, not from 5 to 6.","Press <b>double the size<\/b>. The polygon on the right is twice as wide, four times the area, and eight times the volume.","Set the sides to <b>6<\/b> and look at the picture. It is six equal triangles, and every side is as long as the radius slider.","Watch the readout for the circle through the corners. It stays at the same multiple of π, and the polygon fills more of it every time you add a side."],"ideas":[{"lead":"<b>Cut a polygon into triangles and the angles inside add up.<\/b>","rest":"From one corner you always get two fewer triangles than the polygon has sides. Each triangle gives 180°.","f":"angles inside = (n − 2) × 180°","eg":"hexagon, n = 6: (6 − 2) × 180° = 720°","big":"Angles inside a shape add up to (n − 2) × 180°.","html":"<ul><li>A <b>polygon<\/b> is a flat shape with straight sides. n is how many sides it has.<\/li><li>From one corner, draw lines to the other corners. You get n − 2 triangles.<\/li><li>Each triangle's angles add up to 180°.<\/li><\/ul><p><b>Rule:<\/b> inside angles add up to (n − 2) × 180°<\/p><div class=\"ex\"><b>Example:<\/b> a hexagon (6 sides)<ol><li>n − 2 = 6 − 2 = 4 triangles<\/li><li>4 × 180° = <b>720°<\/b><\/li><\/ol>Check with a square: (4 − 2) × 180° = 360° = 4 × 90° ✅<\/div>"},{"lead":"<b>A regular polygon has equal sides and equal angles.<\/b>","rest":"So share the total out between the corners and every angle is the same.","f":"each angle = (n − 2) × 180° / n","eg":"pentagon: 540° ÷ 5 = 108°","big":"In a regular shape, each inside angle = the total ÷ the number of sides.","html":"<ul><li>A <b>regular<\/b> polygon has all sides equal and all angles equal.<\/li><li>So split the total angle evenly between the corners.<\/li><\/ul><p><b>Rule:<\/b> each angle = (n − 2) × 180° ÷ n<\/p><div class=\"ex\"><b>Example:<\/b> a regular pentagon (5 sides)<ol><li>Total = (5 − 2) × 180° = 540°<\/li><li>Each angle = 540° ÷ 5 = <b>108°<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ This only works if the shape is regular. Otherwise the angles can all be different.<\/p>"},{"lead":"<b>The turns on the outside always add to 360°.<\/b>","rest":"Walk right round the edge of any polygon and you have turned one full circle.","f":"each outside turn = 360° / n","eg":"hexagon: 360° ÷ 6 = 60°","big":"The outside angles of any shape always add up to 360°.","html":"<ul><li>An <b>outside angle<\/b> is how much you turn at a corner when you walk around the edge.<\/li><li>Walk all the way around and you turn one full circle: 360°.<\/li><li>In a regular shape every turn is the same.<\/li><\/ul><p><b>Rule:<\/b> each outside angle = 360° ÷ n (regular shape)<\/p><div class=\"ex\"><b>Example:<\/b> a regular hexagon (6 sides)<ol><li>360° ÷ 6 = <b>60°<\/b><\/li><\/ol>Check: inside angle = 720° ÷ 6 = 120°, and 120° + 60° = 180° ✅<\/div><p class=\"tip\">💡 Inside angle + outside angle = 180° at every corner.<\/p>"},{"lead":"<b>A diagonal joins two corners that are not next to each other.<\/b>","rest":"From each corner you can reach three fewer than the number of corners. Every diagonal gets counted from both ends, so halve it.","f":"diagonals = n(n − 3) / 2","eg":"hexagon: 6 × 3 ÷ 2 = 9 diagonals","big":"Number of diagonals = n × (n − 3) ÷ 2.","html":"<ul><li>A <b>diagonal<\/b> joins two corners that are not next to each other.<\/li><li>From one corner, you can't go to itself or its 2 neighbours. That leaves n − 3 corners.<\/li><li>Each diagonal gets counted from both ends, so divide by 2.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> a hexagon (6 sides)<ol><li>6 × (6 − 3) = 6 × 3 = 18<\/li><li>18 ÷ 2 = <b>9 diagonals<\/b><\/li><\/ol>Check with a square: 4 × 1 ÷ 2 = 2 diagonals ✅<\/div><p class=\"warn\">⚠️ Don't forget to divide by 2.<\/p>"},{"lead":"<b>The distance from the middle straight out to a flat side has a name.<\/b>","rest":"It is called the apothem, and it meets that side at a right angle.","f":"apothem = R × cos(180°/n)","eg":"regular hexagon, R = 2: apothem = 2 × cos 30° = √3","big":"The apothem is the line from the middle straight out to a side.","html":"<ul><li>In a regular polygon, the <b>apothem<\/b> goes from the middle to the center of a side.<\/li><li>It meets that side at 90°.<\/li><li>R (the radius) goes from the middle to a corner instead, so R is longer.<\/li><\/ul><p><b>Rule:<\/b> apothem = R × cos(180° ÷ n)<\/p><div class=\"ex\"><b>Example:<\/b> a regular hexagon with R = 2<ol><li>180° ÷ 6 = 30°, and cos 30° = √3/2<\/li><li>Apothem = 2 × √3/2 = <b>√3<\/b> ≈ 1.73<\/li><\/ol><\/div>"},{"lead":"<b>Half a side, the apothem and the radius make a right triangle.<\/b>","rest":"So the apothem is the square root of R times R take away half a side times half a side.","f":"a = √(R² − (s/2)²)","eg":"R = 2, s = 2: a = √(4 − 1) = √3","big":"Half a side, the apothem and R make a right triangle.","html":"<ul><li>R (middle to corner) is the longest side of this triangle.<\/li><li>The apothem (middle to side) and half of one side are the two shorter sides.<\/li><li>So use Pythagoras: a² + (s/2)² = R².<\/li><\/ul><p><b>Rule:<\/b> a = √(R² − (s/2)²)<\/p><div class=\"ex\"><b>Example:<\/b> a regular hexagon with R = 2 and side s = 2<ol><li>Half a side = 1<\/li><li>a = √(2² − 1²) = √(4 − 1) = <b>√3<\/b><\/li><\/ol>Same answer as the cos rule ✅<\/div><p class=\"tip\">💡 In a regular hexagon, the side always equals R.<\/p>"},{"lead":"<b>Area is half the apothem times the perimeter.<\/b>","rest":"This one rule works for a regular polygon with any number of sides.","f":"area = ½ × apothem × perimeter","eg":"square of side 4: apothem 2, perimeter 16 → ½ × 2 × 16 = 16","big":"Area of a regular shape = ½ × apothem × perimeter.","html":"<ul><li>The <b>apothem<\/b> is the line from the middle straight out to a side.<\/li><li>The <b>perimeter<\/b> is all the sides added up.<\/li><li>This one rule works for any regular shape, any number of sides.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> a square of side 4<ol><li>Apothem = half the side = 2<\/li><li>Perimeter = 4 × 4 = 16<\/li><li>Area = ½ × 2 × 16 = <b>16<\/b><\/li><\/ol>Check: 4 × 4 = 16 ✅<\/div><p class=\"why\"><b>Why it works:<\/b> the shape splits into triangles from the middle. Each has height = apothem and base = one side.<\/p>"},{"lead":"<b>Every corner sits on one circle, and R is that circle's radius.<\/b>","rest":"Its area is π times R times R, and the flat polygon always holds a little less.","f":"circle area = πR² &nbsp; circumference = 2πR","eg":"R = 3 → circle area 9π, circumference 6π","big":"All the corners sit on one circle with radius R.","html":"<ul><li>R goes from the middle to a corner, so every corner is on a circle of radius R.<\/li><li>The polygon sits inside that circle, so its area is always a bit less.<\/li><\/ul><p><b>Rule:<\/b> circle area = πR² and circumference = 2πR<\/p><div class=\"ex\"><b>Example:<\/b> R = 3<ol><li>Circle area = π × 3² = <b>9π<\/b><\/li><li>Circumference = 2 × π × 3 = <b>6π<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 The more sides the polygon has, the closer it gets to the circle.<\/p>"},{"lead":"<b>Stand the flat polygon up and the volume is the area times the height.<\/b>","rest":"That holds for any solid with the same flat face all the way up.","f":"volume = area of the base × height","eg":"base area 12, height 5 → volume 60","big":"Volume of a straight solid = base area × height.","html":"<ul><li>Stand a flat shape up and stretch it upward. That makes a solid (a 3D shape).<\/li><li><b>Volume<\/b> is the space inside the solid.<\/li><li>This works for any solid whose flat face is the same all the way up (like a box or a can).<\/li><\/ul><p><b>Rule:<\/b> volume = base area × height<\/p><div class=\"ex\"><b>Example:<\/b> base area 12, height 5<ol><li>Volume = 12 × 5 = <b>60<\/b><\/li><\/ol><\/div>"},{"lead":"<b>The surface area is the two ends plus the wall that goes round.<\/b>","rest":"Unroll the wall and it is a rectangle: the perimeter, by the height.","f":"surface area = 2 × area + perimeter × height","eg":"square base of side 3, height 5: 2 × 9 + 12 × 5 = 78","big":"Surface area = the two ends + the wall around the side.","html":"<ul><li><b>Surface area<\/b> is the total area of all the outside faces.<\/li><li>There are two equal ends: top and bottom.<\/li><li>Unroll the side wall and it is a rectangle: perimeter × height.<\/li><\/ul><p><b>Rule:<\/b> surface area = 2 × base area + perimeter × height<\/p><div class=\"ex\"><b>Example:<\/b> square base of side 3, height 5<ol><li>Two ends: 2 × (3 × 3) = 18<\/li><li>Wall: perimeter 12 × height 5 = 60<\/li><li>Total = 18 + 60 = <b>78<\/b><\/li><\/ol>Check as a box: 2(3×3 + 3×5 + 3×5) = 2(9 + 15 + 15) = 78 ✅<\/div><p class=\"warn\">⚠️ Remember there are TWO ends, not one.<\/p>"},{"lead":"<b>Double every length and the area goes up four times, the volume eight.<\/b>","rest":"Lengths go by k, areas by k times k, volumes by k times k times k.","f":"k · k² · k³","eg":"side 2 → 4: area × 4, volume × 8","big":"Double the lengths: area × 4, volume × 8.","html":"<ul><li>If every length grows k times, the <b>area<\/b> grows k × k = k² times.<\/li><li>The <b>volume<\/b> grows k × k × k = k³ times.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> a cube's side goes from 2 to 4 (k = 2)<ol><li>Face area: 2 × 2 = 4 → 4 × 4 = 16, that is <b>× 4<\/b><\/li><li>Volume: 2 × 2 × 2 = 8 → 4 × 4 × 4 = 64, that is <b>× 8<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ Doubling the side does not double the area or the volume.<\/p>"},{"lead":"<b>Four equal sides make a square, and standing it up makes a box.<\/b>","rest":"If the height matches the side you get a cube.","f":"box = side × side × height","eg":"side 3, height 5 → 3 × 3 × 5 = 45","big":"A square stood up is a box. If the height = the side, it is a cube.","html":"<ul><li>A <b>square<\/b> has 4 equal sides.<\/li><li>Stand it up to a height and you get a <b>box<\/b>.<\/li><li>If the height is the same as the side, the box is a <b>cube<\/b>.<\/li><\/ul><p><b>Rule:<\/b> box volume = side × side × height<\/p><div class=\"ex\"><b>Example:<\/b> side 3, height 5<ol><li>Volume = 3 × 3 × 5 = <b>45<\/b><\/li><li>If the height were also 3, it is a cube: 3 × 3 × 3 = 27<\/li><\/ol><\/div>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 440\"><circle cx=\"330\" cy=\"235\" r=\"96\" style=\"fill:none;stroke:var(--ink-3);stroke-width:1.1;stroke-dasharray:5 5\"><\/circle><polygon points=\"378,318.14 282,318.14 234,235 282,151.86 378,151.86 426,235\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2;stroke-linejoin:round\"><\/polygon><line x1=\"330\" y1=\"235\" x2=\"330\" y2=\"318.14\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><path style=\"stroke:var(--green);stroke-width:1.6;fill:none\" d=\"M 330 309.14 L 339 309.14 L 339 318.14\"><\/path><text class=\"slabel r numtxt\" x=\"360\" y=\"280.57\" text-anchor=\"middle\">a = 4√3 ≈ 6.93<\/text><line x1=\"378\" y1=\"318.14\" x2=\"282\" y2=\"318.14\" style=\"stroke:var(--green);stroke-width:3.6;fill:none\"><\/line><text class=\"slabel g numtxt\" x=\"330\" y=\"340.14\" text-anchor=\"middle\">s = 8<\/text><line x1=\"330\" y1=\"235\" x2=\"378\" y2=\"318.14\" style=\"stroke:var(--blue);stroke-width:1.6;fill:none\"><\/line><path class=\"arcline\" d=\"M 388 169.18 A 20 20 0 0 1 358 151.86\"><\/path><text class=\"slabel b numtxt\" x=\"359\" y=\"188.77\" text-anchor=\"middle\">120°<\/text><circle cx=\"330\" cy=\"235\" r=\"3.5\" style=\"fill:var(--ink-3)\"><\/circle><text class=\"slabel  numtxt\" x=\"340\" y=\"22\" text-anchor=\"middle\">the angles inside add to (6 − 2) × 180 = 720°<\/text><text class=\"slabel  numtxt\" x=\"340\" y=\"40\" text-anchor=\"middle\">each angle = 720 / 6 = 120°, and each turn outside = 360 / 6 = 60°<\/text><\/svg>","sec":"geo","fm":["Angle sum of a polygon","Each angle of a regular polygon","The exterior angles of any polygon","Number of diagonals of a polygon","Apothem of a regular polygon","Area of a regular polygon","The regular hexagon","Rectangle: area and perimeter","Area of a circle","Circumference of a circle","The rectangular solid: volume and surface area","The cube: volume and surface area","Scaling: k² for area, k³ for volume","Similar figures: the k, k², k³ ladder"]},"cb_inscribed":{"title":"Shapes inside shapes","tag":"Geometry","say":"One shape sits inside another, touching. Only one question matters here. Which length of the inner shape is the same as which length of the outer one? The red line on the picture is that pairing. Get it right and every number follows.","note":"","tries":["Press <b>both, nested<\/b>. That is the photograph: a square holding a circle holding a square. The small square always comes out at exactly half the big one.","Change the size and watch the share stay still. The leftover area changes, but the fraction never does.","Compare <b>circle in a square<\/b> with <b>square in a circle<\/b>. One fills 0.79 of its container, the other 0.64. Both numbers sit on the answer list, so check which shape is doing the holding.","Press <b>ball in a box<\/b>. A round thing in a square thing loses more room in three dimensions than in two. The share drops from 0.79 to 0.52.","Press <b>six sides in a circle<\/b>. A hexagon fills 0.83 of the circle, and a triangle only 0.41. More sides means less waste."],"ideas":[{"lead":"<b>Touching is the whole clue.<\/b>","rest":"When a circle touches all four sides of a square, the diameter of the circle is the side of the square.","f":"d = s","eg":"circle in a square of side 6 → diameter 6, so r = 3","big":"Circle inside a square: the circle's diameter = the square's side.","html":"<ul><li>The circle touches all four sides of the square.<\/li><li>So the circle fits exactly from one side to the other.<\/li><li>The <b>diameter<\/b> (the line across the circle through the middle) equals the <b>side<\/b> of the square.<\/li><\/ul><p><b>Rule:<\/b> d = s<\/p><div class=\"ex\"><b>Example:<\/b> a circle sits inside a square of side 6<ol><li>Diameter = side = 6<\/li><li>Radius = 6 ÷ 2 = <b>3<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 Always ask: which length of the inside shape matches which length of the outside shape?<\/p>"},{"lead":"<b>Corners touching means something different.<\/b>","rest":"When a square has its four corners on a circle, the square’s diagonal is the diameter of the circle.","f":"diagonal = d = 2r","eg":"square in a circle of r = 5 → the square's diagonal is 10","big":"Square inside a circle: the square's diagonal = the circle's diameter.","html":"<ul><li>Now the four corners of the square sit on the circle.<\/li><li>A <b>diagonal<\/b> is the line from one corner to the opposite corner.<\/li><li>That diagonal passes through the middle, so it is a diameter of the circle.<\/li><\/ul><p><b>Rule:<\/b> diagonal = d = 2r<\/p><div class=\"ex\"><b>Example:<\/b> a square sits inside a circle of radius 5<ol><li>Diameter = 2 × 5 = 10<\/li><li>So the square's diagonal = <b>10<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ Here the side of the square is NOT the diameter. Sides touching and corners touching give different pairs.<\/p>"},{"lead":"<b>A square’s diagonal is longer than its side.<\/b>","rest":"It is the side multiplied by √2. So the side is the diameter divided by √2.","f":"s = d ÷ √2","eg":"diagonal 10 → s = 10 ÷ √2 = 5√2","big":"To get a square's side from its diagonal, divide by √2.","html":"<ul><li>A square's diagonal is longer than its side.<\/li><li>Diagonal = side × √2 (√2 is about 1.41).<\/li><li>So going back: side = diagonal ÷ √2.<\/li><\/ul><p><b>Rule:<\/b> s = d ÷ √2<\/p><div class=\"ex\"><b>Example:<\/b> the diagonal is 10<ol><li>s = 10 ÷ √2<\/li><li>Multiply top and bottom by √2: 10√2 ÷ 2 = <b>5√2<\/b> ≈ 7.07<\/li><\/ol>Check: (5√2)² + (5√2)² = 50 + 50 = 100 = 10² ✅<\/div>"},{"lead":"<b>The √2 on a diagonal comes from Pythagoras.<\/b>","rest":"The diagonal cuts a square into two right-angled triangles. So s² + s² = 2s², and the diagonal is s√2.","f":"diagonal = s √2","eg":"s = 3 → diagonal 3√2","big":"A square's diagonal is side × √2, from Pythagoras.","html":"<ul><li>The diagonal cuts the square into two right triangles.<\/li><li><b>Pythagoras:<\/b> in a right triangle, short side² + short side² = long side².<\/li><li>Here both short sides are s, so the diagonal² = s² + s² = 2s².<\/li><li>Take the square root: diagonal = s√2.<\/li><\/ul><p><b>Rule:<\/b> diagonal = s√2<\/p><div class=\"ex\"><b>Example:<\/b> a square with side 3<ol><li>diagonal² = 3² + 3² = 9 + 9 = 18<\/li><li>diagonal = √18 = √9 × √2 = <b>3√2<\/b> ≈ 4.24<\/li><\/ol><\/div>"},{"lead":"<b>The share never depends on the size.<\/b>","rest":"Give the outer shape a letter, read the inner one off the words, and the letter cancels.","f":"circle in a square = π/4 ≈ 0.79","eg":"square of side 10: circle 25π ÷ 100 = π/4","big":"The fraction filled never depends on the size.","html":"<ul><li>Questions often ask what fraction of the outside shape the inside shape fills.<\/li><li>Pick any size for the outside shape. Work out the inside shape from it.<\/li><li>Divide. The size cancels, so the answer is always the same.<\/li><\/ul><p><b>Rule:<\/b> a circle inside a square fills π/4 ≈ 0.79 of it.<\/p><div class=\"ex\"><b>Example:<\/b> a circle inside a square of side 10<ol><li>Square area = 10 × 10 = 100<\/li><li>Circle radius = 10 ÷ 2 = 5, so circle area = π × 5² = 25π<\/li><li>Fraction = 25π ÷ 100 = <b>π/4<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 Try side 2 instead: circle π, square 4, fraction π/4 again ✅<\/p>"},{"lead":"<b>π ÷ 4 is a circle over the square it sits in.<\/b>","rest":"The circle is πr². The square side is 2r, so the square is 4r². The r² cancels.","f":"πr² ÷ 4r² = π ÷ 4","big":"A circle fills π/4 of the square around it.","html":"<p><b>Why π/4?<\/b> Use letters so it works for every size.<\/p><div class=\"ex\"><b>Example:<\/b> circle of radius r inside a square<ol><li>Circle area = πr²<\/li><li>The square's side is the diameter, 2r. So square area = 2r × 2r = 4r²<\/li><li>Fraction = πr² ÷ 4r². The r² cancels, so it is <b>π ÷ 4<\/b> ≈ 0.79<\/li><\/ol><\/div><p class=\"tip\">💡 So about 79% of the square is circle, and about 21% is the corners.<\/p>"},{"lead":"<b>The other way round wastes more.<\/b>","rest":"A square inside a circle fills less of it than a circle inside a square.","f":"square in a circle = 2/π ≈ 0.64","eg":"r = 1: square area 2, circle π → 2/π","big":"A square inside a circle fills less: only 2/π of the circle.","html":"<ul><li>A circle inside a square fills about 0.79 of the square.<\/li><li>A square inside a circle fills only about 0.64 of the circle.<\/li><li>So the second way leaves more empty space.<\/li><\/ul><p><b>Rule:<\/b> square inside a circle = 2/π ≈ 0.64<\/p><div class=\"ex\"><b>Example:<\/b> circle of radius 1<ol><li>Circle area = π × 1² = π<\/li><li>The square's diagonal is the diameter, 2. A square's area = diagonal² ÷ 2 = 4 ÷ 2 = 2<\/li><li>Fraction = <b>2/π<\/b> ≈ 0.64<\/li><\/ol><\/div>"},{"lead":"<b>Nesting both gives an exact half.<\/b>","rest":"A square holding a circle holding a square: the inner square is half the outer one, every time.","f":"inner = ½ × outer","eg":"outer square 16, circle inside it, inner square 8","big":"Square, circle in it, square in that: the small square is half the big one.","html":"<p>Put a circle inside a square. Then put a smaller square inside the circle.<\/p><ul><li>The big square's side = the circle's diameter.<\/li><li>The circle's diameter = the small square's diagonal.<\/li><\/ul><p><b>Rule:<\/b> small square area = ½ × big square area, every time.<\/p><div class=\"ex\"><b>Example:<\/b> the big square has area 16<ol><li>Big side = 4, so the circle's diameter is 4.<\/li><li>The small square's diagonal is 4, so its side is 4 ÷ √2.<\/li><li>Small area = (4 ÷ √2)² = 16 ÷ 2 = <b>8<\/b> ✅ half of 16<\/li><\/ol><\/div>"},{"lead":"<b>Squaring the divide by √2 is what makes the half.<\/b>","rest":"The small side is the big side over √2, and squaring that puts a plain 2 underneath.","f":"(s ÷ √2)² = s² ÷ 2","eg":"s = 4: (4 ÷ √2)² = 16 ÷ 2 = 8","big":"Squaring \"divide by √2\" is the same as dividing by 2.","html":"<ul><li>The small square's side is the big side ÷ √2.<\/li><li>Area means side × side. So you square it.<\/li><li>√2 × √2 = 2, so a plain 2 ends up underneath.<\/li><\/ul><p><b>Rule:<\/b> (s ÷ √2)² = s² ÷ 2<\/p><div class=\"ex\"><b>Example:<\/b> s = 4<ol><li>(4 ÷ √2)² = (4 × 4) ÷ (√2 × √2)<\/li><li>= 16 ÷ 2 = <b>8<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 That is why the inner square is always exactly half.<\/p>"},{"lead":"<b>3√3 ÷ 4 comes from three triangles.<\/b>","rest":"Three equal triangles meet at the centre. Each one has two radius sides and a 120° angle between them.","f":"each = ½ × r × r × sin 120°","eg":"r = 2: each = ½ × 2 × 2 × (√3/2) = √3, so three make 3√3","big":"The 3√3 ÷ 4 comes from three equal triangles at the middle.","html":"<p>This is for an equilateral triangle (3 equal sides) with its corners on a circle.<\/p><ul><li>Join the middle to each corner. You get 3 equal small triangles.<\/li><li>Each has two sides equal to the radius r, with 120° between them (360° ÷ 3).<\/li><li>Area of each = ½ × r × r × sin 120°, and sin 120° = √3/2.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> r = 2<ol><li>Each = ½ × 2 × 2 × (√3/2) = √3<\/li><li>Three of them = <b>3√3<\/b> ≈ 5.2<\/li><\/ol>Check with the rule: (3√3 ÷ 4) × 2² = 3√3 ✅<\/div>"},{"lead":"<b>Three dimensions waste more than two.<\/b>","rest":"A ball in a box fills about half of it, while a circle in a square fills nearly four fifths.","f":"ball in a box = π/6 ≈ 0.52","eg":"cube of side 2: ball (4/3)π ÷ 8 = π/6","big":"A ball in a box fills only about half the box.","html":"<ul><li>A circle in a square fills π/4 ≈ 0.79 (nearly four fifths).<\/li><li>A <b>sphere<\/b> (ball) in a <b>cube<\/b> (box with equal sides) fills only π/6 ≈ 0.52.<\/li><li>Sphere volume = (4/3)πr³. Cube volume = side × side × side.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> a cube of side 2 with a ball inside<ol><li>Cube volume = 2 × 2 × 2 = 8<\/li><li>The ball's diameter is 2, so r = 1. Ball volume = (4/3)π × 1³ = (4/3)π<\/li><li>Fraction = (4/3)π ÷ 8 = 4π ÷ 24 = <b>π/6<\/b> ≈ 0.52<\/li><\/ol><\/div>"},{"lead":"<b>The piece left over is the shaded-region question.<\/b>","rest":"Name the whole, name what is cut out, and take one from the other.","f":"left over = outer − inner","eg":"square 16 minus circle 4π = 16 − 4π","big":"Shaded area = the whole shape minus the part cut out.","html":"<p>Many questions ask for the shaded part left over. Use 3 steps.<\/p><ul><li>Find the area of the whole (outside) shape.<\/li><li>Find the area of the part cut out (inside shape).<\/li><li>Subtract.<\/li><\/ul><p><b>Rule:<\/b> left over = outside − inside<\/p><div class=\"ex\"><b>Example:<\/b> a circle of radius 2 inside a square of side 4. Find the shaded corners.<ol><li>Square = 4 × 4 = 16<\/li><li>Circle = π × 2² = 4π<\/li><li>Left over = <b>16 − 4π<\/b> ≈ 3.43<\/li><\/ol><\/div><p class=\"tip\">💡 Leave the answer as 16 − 4π. That is how the choices show it.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><polygon points=\"192,68 448,68 448,324 192,324\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2\"><\/polygon><circle cx=\"320\" cy=\"196\" r=\"128\" style=\"fill:var(--green);fill-opacity:.15;stroke:var(--green);stroke-width:2.2\"><\/circle><line x1=\"192\" y1=\"196\" x2=\"448\" y2=\"196\" style=\"stroke:var(--red);stroke-width:3;fill:none\"><\/line><text class=\"slabel r numtxt\" x=\"320\" y=\"184\" text-anchor=\"middle\">diameter = 10<\/text><text class=\"slabel b numtxt\" x=\"320\" y=\"350\" text-anchor=\"middle\">side = 10<\/text><text class=\"slabel g\" x=\"320\" y=\"52\" text-anchor=\"middle\">the circle touches all four sides<\/text><text class=\"slabel \" x=\"320\" y=\"22\" text-anchor=\"middle\">a circle in a square<\/text><text class=\"slabel  numtxt\" x=\"320\" y=\"390\" text-anchor=\"middle\">the share is π/4 ≈ 0.79 whatever the size<\/text><\/svg>","sec":"geo","fm":["Circle inscribed in a square","Square inscribed in a circle","Equilateral triangle inscribed in a circle","The regular hexagon","Shaded region by subtraction","Area of a circle","The square: area, perimeter and diagonal","Space diagonal of a box","The sphere: volume and surface area"]},"cb_lines":{"title":"Lines, crossings and angles, all at once","tag":"Geometry","say":"Five pictures, one idea. Angles are made where lines meet, and a few totals settle every one of them. Pick a picture with the buttons, then drag a line, an arm or a corner. Every number below moves with it. One angle is nearly always enough to give you all the others.","note":"","tries":["Drag either line in <b>two lines crossing<\/b>. The vertically opposite pair stays equal. Each neighbouring pair still makes a straight angle of 180°.","Swing the transversal in <b>two parallel lines<\/b>. Eight angles move, but only two different sizes ever show up among them.","In <b>the triangle<\/b>, drag the top corner. The three interior angles keep adding to 180°, and the exterior angle keeps matching the two far ones.","Open the arm in <b>cutting an angle in half<\/b>. The two green bisectors stay at a right angle, however uneven you make the two angles.","In <b>round one point<\/b>, drag any arm. All four angles change at once, and the full turn stays at 360° the whole time."],"ideas":[{"lead":"<b>Two crossing lines make four angles, and one of them fixes the rest.<\/b>","rest":"The two facing each other are vertically opposite angles, and they are equal. Any two sitting side by side make a straight angle of 180°.","f":"a = c · a + b = 180°","eg":"a = 70° → c = 70° and b = 110°","big":"Two crossing lines make 4 angles. Know one, and you know all 4.","html":"<p>When two straight lines cross, they make 4 angles around the crossing point.<\/p><ul><li><b>Opposite angles are equal.<\/b> The two angles facing each other across the point are called vertical angles. They are always the same size.<\/li><li><b>Side-by-side angles add to 180°.<\/b> They sit together on one straight line, and a straight line is 180°.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> one angle a = 70°. Find the other three.<ol><li>The opposite angle c equals a, so c = 70°.<\/li><li>The angle next to it: b = 180° − 70° = 110°.<\/li><li>The last angle is opposite b, so it is also 110°.<\/li><\/ol><b>Answer: 70°, 110°, 70°, 110°<\/b> ✅ (check: 70 + 110 + 70 + 110 = 360)<\/div>"},{"lead":"<b>Nothing is solved at a crossing, you only take away.<\/b>","rest":"Given 50°, the angle next to it is 180 − 50 = 130°. The vertically opposite one is 50° again.","f":"b = 180° − a","eg":"a = 65° → b = 180° − 65° = 115°","big":"At a crossing you never solve anything. You just take away from 180°.","html":"<p>To find the angle next to a known angle, take the known angle away from 180°.<\/p><p><b>Rule:<\/b> next angle = 180° − known angle<\/p><div class=\"ex\"><b>Example:<\/b> one angle is 65°.<ol><li>The angle next to it: 180° − 65° = <b>115°<\/b><\/li><li>The angle opposite it is the same size: <b>65°<\/b><\/li><\/ol>Check: 65 + 115 = 180 ✅<\/div><p class=\"tip\">💡 No equations needed. Given 50°, the angle next to it is 180 − 50 = 130°, and the opposite one is 50° again.<\/p>"},{"lead":"<b>Lay a transversal across two parallel lines and only two sizes appear.<\/b>","rest":"A transversal is one line cutting across both. Parallel means the two lines run the same way and never meet. Corresponding angles are equal, and so are alternate angles.","f":"corresponding angles are equal","eg":"one angle 60° → every angle is 60° or 120°","big":"A line cutting across two parallel lines makes only 2 angle sizes.","html":"<p><b>First, the words:<\/b><\/p><ul><li><b>Parallel lines<\/b> run the same way and never meet, like train tracks.<\/li><li>A <b>transversal<\/b> is one line that cuts across both of them.<\/li><\/ul><p>This makes 8 angles, but they come in only <b>two sizes<\/b>, a small one and a big one.<\/p><ul><li><b>Corresponding angles<\/b> (same spot at each crossing, like both top-left) are equal.<\/li><li><b>Alternate angles<\/b> (between the two lines, on opposite sides of the transversal, in a Z shape) are equal.<\/li><li>One small + one big = 180°.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> one angle is 60°.<ol><li>The other size is 180° − 60° = 120°.<\/li><li>So all 8 angles are <b>60° or 120°<\/b>.<\/li><\/ol><\/div><p class=\"warn\">⚠️ This only works when the lines are really parallel. Check that the question says so.<\/p>"},{"lead":"<b>The pair between the two parallel lines, on the same side, is the odd one out.<\/b>","rest":"That pair adds to 180° instead of being equal. It is the one readers turn the wrong way round.","f":"a + b = 180°","eg":"60° + 120° = 180°","big":"Between the parallel lines, on the same side: the two angles add to 180°. They are not equal.","html":"<p>Look at the two angles that sit <b>between<\/b> the parallel lines and on the <b>same side<\/b> of the crossing line. They make a C or U shape.<\/p><ul><li>These two are <b>not<\/b> equal.<\/li><li>They <b>add to 180°<\/b>.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> one of these angles is 60°.<ol><li>The other one is 180° − 60° = <b>120°<\/b><\/li><\/ol>Check: 60 + 120 = 180 ✅<\/div><p class=\"warn\">⚠️ Many students say this pair is equal. It is not. Only the Z-shape pair (alternate angles) is equal.<\/p>"},{"lead":"<b>The three interior angles of a triangle add to 180°.<\/b>","rest":"So any two of them hand you the third, with no other working.","f":"A + B + C = 180°","eg":"40° + 60° + 80° = 180°","big":"The 3 angles inside a triangle always add to 180°.","html":"<p>The <b>interior angles<\/b> are the 3 angles inside the triangle, one at each corner.<\/p><p><b>Rule:<\/b> A + B + C = 180°<\/p><p>So if you know 2 angles, one subtraction gives you the third.<\/p><div class=\"ex\"><b>Example:<\/b> two angles are 40° and 60°. Find the third.<ol><li>Add the two you know: 40° + 60° = 100°<\/li><li>Take it from 180°: 180° − 100° = <b>80°<\/b><\/li><\/ol>Check: 40 + 60 + 80 = 180 ✅<\/div>"},{"lead":"<b>Stretch one side past a corner and the exterior angle that opens up is the two far interior angles added.<\/b>","rest":"It saves the trip through the third angle.","f":"exterior angle = A + B","eg":"far angles 40° and 60° → exterior angle 100°","big":"Outside angle of a triangle = the two far inside angles added.","html":"<p>Make one side of a triangle longer, past a corner. The angle that opens up outside is the <b>exterior angle<\/b> (outside angle).<\/p><p><b>Rule:<\/b> exterior angle = the two inside angles that are <b>far<\/b> from it (not touching it), added together.<\/p><div class=\"ex\"><b>Example:<\/b> the two far angles are 40° and 60°.<ol><li>Exterior angle = 40° + 60° = <b>100°<\/b><\/li><\/ol>Check the long way: the third inside angle is 180 − 100 = 80°. The outside angle sits next to it on a straight line, so 180 − 80 = 100° ✅<\/div><p class=\"tip\">💡 This skips the step of finding the third angle.<\/p>"},{"lead":"<b>A bisector cuts an angle in half, so it halves what that angle brings to a total.<\/b>","rest":"Bisect the two angles on a straight line, and the two bisectors sit at a right angle.","f":"half of 180° = 90°","eg":"bisect 80° → two 40° angles","big":"A bisector cuts an angle into two equal halves.","html":"<p>To <b>bisect<\/b> means to cut into two equal parts. A <b>bisector<\/b> is the line that does it.<\/p><div class=\"ex\"><b>Example 1:<\/b> bisect an 80° angle.<ol><li>80° ÷ 2 = 40°<\/li><li>You get <b>two 40° angles<\/b>.<\/li><\/ol><\/div><p><b>A fact worth knowing:<\/b> two angles side by side on a straight line add to 180°. Bisect both of them. The two bisectors meet at a right angle (90°).<\/p><div class=\"ex\"><b>Example 2:<\/b> the angles are 80° and 100°.<ol><li>Half of 80° is 40°, and half of 100° is 50°.<\/li><li>40° + 50° = <b>90°<\/b> ✅<\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> the halves add to half of 180°, and that is always 90°.<\/p>"},{"lead":"<b>All the angles round one point share a full turn of 360°.<\/b>","rest":"Find the ones you were given, take them off 360, and what is left is the one you want.","f":"a + b + c + d = 360°","eg":"90° + 100° + 80° + 90° = 360°","big":"All the angles around one point add to 360°.","html":"<p>Going all the way around a point is one full turn, and a full turn is 360°.<\/p><p><b>To find a missing angle:<\/b> add the angles you know, then take that from 360°.<\/p><div class=\"ex\"><b>Example:<\/b> around one point the angles are 90°, 100°, 80° and one unknown.<ol><li>Add the known ones: 90 + 100 + 80 = 270°<\/li><li>Take from 360: 360 − 270 = <b>90°<\/b><\/li><\/ol>Check: 90 + 100 + 80 + 90 = 360 ✅<\/div><p class=\"tip\">💡 A straight line is 180°, which is half of a full turn.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><line x1=\"469.72\" y1=\"159.88\" x2=\"170.28\" y2=\"240.12\" style=\"stroke:var(--ink-2);stroke-width:2.4;fill:none\"><\/line><line x1=\"266.99\" y1=\"54.35\" x2=\"373.01\" y2=\"345.65\" style=\"stroke:var(--ink-2);stroke-width:2.4;fill:none\"><\/line><path style=\"stroke:var(--blue);stroke-width:1.8;fill:none\" d=\"M 343.18 193.79 A 24 24 0 0 0 311.79 177.45\"><\/path><text class=\"slabel b numtxt\" x=\"341.24\" y=\"163.2\" text-anchor=\"middle\">95°<\/text><path style=\"stroke:var(--green);stroke-width:1.8;fill:none\" d=\"M 311.79 177.45 A 24 24 0 0 0 296.82 206.21\"><\/path><text class=\"slabel g numtxt\" x=\"279.2\" y=\"182.76\" text-anchor=\"middle\">85°<\/text><path style=\"stroke:var(--blue);stroke-width:1.8;fill:none\" d=\"M 296.82 206.21 A 24 24 0 0 0 328.21 222.55\"><\/path><text class=\"slabel b numtxt\" x=\"298.76\" y=\"244.8\" text-anchor=\"middle\">95°<\/text><path style=\"stroke:var(--green);stroke-width:1.8;fill:none\" d=\"M 328.21 222.55 A 24 24 0 0 0 343.18 193.79\"><\/path><text class=\"slabel g numtxt\" x=\"360.8\" y=\"225.24\" text-anchor=\"middle\">85°<\/text><circle cx=\"320\" cy=\"200\" r=\"3.5\" style=\"fill:var(--ink)\"><\/circle><circle class=\"handle\" cx=\"469.72\" cy=\"159.88\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"266.99\" cy=\"54.35\" r=\"8\"><\/circle><text class=\"slabel  numtxt\" x=\"320\" y=\"26\" text-anchor=\"middle\">vertically opposite angles are equal · two side by side make 180°<\/text><text class=\"slabel \" x=\"320\" y=\"384\" text-anchor=\"middle\">drag either dot to swing a line, and all four angles answer<\/text><\/svg>","sec":"geo","fm":["Angle sum of a triangle","Exterior angle of a triangle","Angle sum of a polygon","The exterior angles of any polygon","Each angle of a regular polygon","Parallel lines have equal slopes","Perpendicular slopes multiply to −1"]},"cb_poly":{"title":"The many-sided shape, all at once","tag":"Geometry","say":"A polygon is a flat shape made of straight sides. This one is regular, which means every side is the same length and every corner the same size. Set how many sides it has. Set the radius, which runs from the centre out to a corner. Every polygon rule answers at the same time. The buttons swap what is drawn, so no single picture gets crowded. Drag the marked corner round and watch the readings stay put.","note":"Two things here are worth more than the rest. The first is this. The interior angles grow with n. The exterior angles never leave 360°. So a question that names one exterior angle of a regular polygon has already handed you n. The second is the area. The polygon is n thin triangles. Each stands on one side. Its height is the apothem, the distance from the centre straight to a side. Each triangle is ½ × side × apothem. The n bases add up to the perimeter. So the whole area is ½ × apothem × perimeter.","tries":["Push the sides slider from 3 up to 12. The interior angles add to more at every step. The exterior angles still add to 360° in all.","Open <b>the two circles<\/b> and raise the number of sides. The polygon swells out to fill its circle, from 41% at 3 sides to 96% at 12.","Open <b>the diagonals<\/b> and drag the marked corner round. Every corner reaches the same number of far corners, so the count never moves.","Set the sides to 6. The side and the radius come out equal. Only six sides does that, so check it at 5 and at 7.","Open <b>n triangles<\/b> and count them. The area is n copies of one thin triangle. That is where ½ × apothem × perimeter comes from.","Open <b>apothem and radius<\/b>. The radius goes to a corner. The apothem goes straight to a side. The gap between them shuts as n grows."],"ideas":[{"lead":"<b>The interior angles of a polygon add to (n − 2) × 180°.<\/b>","rest":"Join one corner to every corner that is not next to it. The polygon falls into n − 2 triangles. Each one holds 180°.","f":"S = (n − 2) × 180°","eg":"pentagon: 3 × 180° = 540°","big":"The angles inside a shape with n sides add to (n − 2) × 180°.","html":"<p>A <b>polygon<\/b> is a flat shape with straight sides. Here n stands for how many sides it has.<\/p><p><b>Rule:<\/b> sum of the inside angles = (n − 2) × 180°<\/p><div class=\"ex\"><b>Example:<\/b> a pentagon (5 sides).<ol><li>n − 2 = 5 − 2 = 3<\/li><li>3 × 180° = <b>540°<\/b><\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> from one corner, draw lines to every corner that is not next to it. The shape splits into n − 2 triangles, and each triangle holds 180°.<\/p><p class=\"tip\">💡 Triangle 180°, 4 sides 360°, 5 sides 540°, 6 sides 720°. Each extra side adds 180°.<\/p>"},{"lead":"<b>Regular means every interior angle is the same size.<\/b>","rest":"So divide that total by n and you have one angle. Only divide when the polygon really is regular.","f":"each angle = (n − 2) × 180° ÷ n","eg":"octagon: 1080° ÷ 8 = 135°","big":"In a regular polygon, one angle = the total ÷ n.","html":"<p><b>Regular<\/b> means every side is the same length and every angle is the same size.<\/p><p><b>Rule:<\/b> each angle = (n − 2) × 180° ÷ n, where n is the number of sides.<\/p><div class=\"ex\"><b>Example:<\/b> a regular octagon (8 sides).<ol><li>Total: (8 − 2) × 180° = 6 × 180° = 1080°<\/li><li>One angle: 1080° ÷ 8 = <b>135°<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ Only divide when the question says regular. If not, the angles can be different sizes.<\/p>"},{"lead":"<b>The exterior angles always add to 360°.<\/b>","rest":"Walk once round the outside and you finish facing the way you started. That is one full turn, whatever n is.","f":"sum of the exterior angles = 360°","eg":"pentagon: 5 × 72° = 360°","big":"The outside angles of any polygon add to 360°.","html":"<p>An <b>exterior angle<\/b> (outside angle) is the turn you make at a corner when you walk around the shape.<\/p><p>Walk all the way around and you face the way you started. That is one full turn, <b>360°<\/b>, for any number of sides.<\/p><div class=\"ex\"><b>Example:<\/b> a regular pentagon (5 equal sides).<ol><li>Each outside angle: 360° ÷ 5 = 72°<\/li><li>All five: 5 × 72° = <b>360°<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 For a regular polygon, one outside angle = 360° ÷ n (n is the number of sides). This is often the fastest route.<\/p>"},{"lead":"<b>At one corner the interior and exterior angles add to 180°.<\/b>","rest":"They sit along the same straight line. So each one hands you the other at once.","f":"interior + exterior = 180°","eg":"octagon: 135° + 45° = 180°","big":"At each corner, inside angle + outside angle = 180°.","html":"<p>The inside angle and the outside angle at one corner sit together on a straight line. A straight line is 180°.<\/p><p><b>Rule:<\/b> inside + outside = 180°. Know one, and you get the other.<\/p><div class=\"ex\"><b>Example:<\/b> a regular octagon (8 sides).<ol><li>Outside angle: 360° ÷ 8 = 45°<\/li><li>Inside angle: 180° − 45° = <b>135°<\/b><\/li><\/ol>Check: 135 + 45 = 180, and (8 − 2) × 180 ÷ 8 = 135 ✅<\/div>"},{"lead":"<b>A diagonal joins two corners that are not next to each other.<\/b>","rest":"Each corner misses itself and its two neighbours, so it reaches n − 3 others. Every diagonal gets counted twice, once from each end.","f":"D = n(n − 3) ÷ 2","eg":"octagon: 8 × 5 ÷ 2 = 20","big":"Number of diagonals = n × (n − 3) ÷ 2.","html":"<p>A <b>diagonal<\/b> is a line joining two corners that are not next to each other. Here n is the number of corners.<\/p><ul><li>One corner cannot reach itself or its 2 neighbours. So it reaches n − 3 corners.<\/li><li>Each diagonal gets counted twice (once from each end), so divide by 2.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> an octagon (8 corners).<ol><li>From each corner: 8 − 3 = 5 diagonals<\/li><li>8 × 5 = 40<\/li><li>40 ÷ 2 = <b>20 diagonals<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 Quick check: a square (n = 4) has 4 × 1 ÷ 2 = 2 diagonals ✅<\/p>"},{"lead":"<b>Two different distances run out from the centre.<\/b>","rest":"The radius R reaches a corner. The apothem a is the distance from the centre straight to a side. R is always the longer of the two.","f":"a² + (s ÷ 2)² = R²","eg":"hexagon, s = 2, R = 2: a² + 1 = 4 → a = √3","big":"From the centre: the radius goes to a corner, the apothem goes to a side.","html":"<ul><li>The <b>radius<\/b> R is the distance from the centre to a corner.<\/li><li>The <b>apothem<\/b> a is the distance from the centre straight to the middle of a side.<\/li><li>R is always longer than a.<\/li><\/ul><p>R, a and half a side make a right triangle, with R as the hypotenuse.<\/p><p><b>Rule:<\/b> a² + (s ÷ 2)² = R², where s is one side.<\/p><div class=\"ex\"><b>Example:<\/b> a regular hexagon with side s = 2 and radius R = 2.<ol><li>Half a side: 2 ÷ 2 = 1<\/li><li>a² + 1² = 2², so a² + 1 = 4<\/li><li>a² = 3, so a = <b>√3<\/b> (about 1.73)<\/li><\/ol><\/div>"},{"lead":"<b>The area is n equal triangles.<\/b>","rest":"Each one stands on a side and is as tall as the apothem. Add them up and the bases make the perimeter.","f":"A = ½ × a × P","eg":"hexagon, s = 2, a = √3: ½ × √3 × 12 = 6√3","big":"Regular polygon area = ½ × apothem × perimeter.","html":"<p>Cut the polygon into n equal triangles from the centre. Each triangle stands on one side and is as tall as the <b>apothem<\/b> (centre straight to a side).<\/p><p>Add up all the triangles. Their bases together make the <b>perimeter<\/b> (the distance around).<\/p><p><b>Rule:<\/b> Area = ½ × a × P, where a is the apothem and P is the perimeter.<\/p><div class=\"ex\"><b>Example:<\/b> a regular hexagon with side 2 and apothem √3.<ol><li>Perimeter: 6 × 2 = 12<\/li><li>Area: ½ × √3 × 12 = <b>6√3<\/b> (about 10.39)<\/li><\/ol><\/div>"},{"lead":"<b>More sides means closer to a circle.<\/b>","rest":"The polygon fills more of the circle through its corners at every step. By 12 sides it already fills 95.5% of it.","f":"A → πR² as n grows","big":"The more sides a regular polygon has, the closer it gets to a circle.","html":"<p>Draw a circle through all the corners. As n (the number of sides) grows, the polygon fills more and more of that circle.<\/p><ul><li>Its area gets closer and closer to the circle's area, πR², where R is the radius.<\/li><li>With 12 sides, it already fills about <b>95.5%<\/b> of the circle.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> radius R = 1.<ol><li>Circle area: π × 1² ≈ 3.14<\/li><li>Regular 12-sided shape: area = 3 × R² = 3<\/li><li>3 ÷ 3.14 ≈ 0.955 → <b>95.5%<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 A polygon inside a circle always has less area than the circle, never more.<\/p>"},{"lead":"<b>Six sides is the one to know by heart.<\/b>","rest":"The side equals the radius. So a regular hexagon splits into six triangles with all three sides equal.","f":"s = R · A = (3√3 ÷ 2)s²","eg":"s = 2: A = (3√3 ÷ 2) × 4 = 6√3","big":"Regular hexagon: the side equals the radius. Learn this one by heart.","html":"<p>A regular <b>hexagon<\/b> (6 equal sides) splits into 6 equilateral triangles (all 3 sides equal) that meet at the centre.<\/p><ul><li>So the side s equals the radius R (centre to a corner).<\/li><li><b>Area<\/b> = 6 × one triangle = (3√3 ÷ 2) × s²<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> side s = 2.<ol><li>s² = 2 × 2 = 4<\/li><li>Area = (3√3 ÷ 2) × 4 = <b>6√3<\/b> (about 10.39)<\/li><\/ol>Check: one triangle is (√3/4) × 4 = √3, and 6 × √3 = 6√3 ✅<\/div>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><polygon points=\"349.8,298.26 250.2,298.26 200.4,212 250.2,125.74 349.8,125.74 399.6,212\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2;stroke-linejoin:round\"><\/polygon><line x1=\"250.2\" y1=\"125.74\" x2=\"399.6\" y2=\"212\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"250.2\" y1=\"125.74\" x2=\"349.8\" y2=\"298.26\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"250.2\" y1=\"125.74\" x2=\"250.2\" y2=\"298.26\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><path class=\"arcline\" d=\"M 357.8 284.4 A 16 16 0 0 0 333.8 298.26\"><\/path><path class=\"arcline\" d=\"M 266.2 298.26 A 16 16 0 0 0 242.2 284.4\"><\/path><path class=\"arcline\" d=\"M 208.4 225.86 A 16 16 0 0 0 208.4 198.14\"><\/path><path class=\"arcline\" d=\"M 242.2 139.6 A 16 16 0 0 0 266.2 125.74\"><\/path><path class=\"arcline\" d=\"M 333.8 125.74 A 16 16 0 0 0 357.8 139.6\"><\/path><path class=\"arcline\" d=\"M 391.6 198.14 A 16 16 0 0 0 391.6 225.86\"><\/path><text class=\"slabel b numtxt\" x=\"237.2\" y=\"107.23\" text-anchor=\"end\">120°<\/text><text class=\"slabel  numtxt\" x=\"320\" y=\"22\" text-anchor=\"middle\">the interior angles: (6 − 2) × 180° = 720°<\/text><text class=\"slabel g numtxt\" x=\"320\" y=\"44\" text-anchor=\"middle\">4 triangles from one corner, each holding 180°<\/text><text class=\"slabel b numtxt\" x=\"320\" y=\"388\" text-anchor=\"middle\">every corner is the same, so each is 720 ÷ 6 = 120°<\/text><circle class=\"handle\" cx=\"250.2\" cy=\"125.74\" r=\"8\"><\/circle><\/svg>","sec":"geo","fm":["Angle sum of a polygon","Each angle of a regular polygon","The exterior angles of any polygon","Number of diagonals of a polygon","Apothem of a regular polygon","Area of a regular polygon","The regular hexagon","Circle inscribed in a square","Square inscribed in a circle","Area of a circle"]},"cb_quads":{"title":"Quadrilaterals, all at once","tag":"Geometry","say":"One picture, five quadrilaterals. Parallel means two lines that run the same way and never meet. Press a button to swap the shape. You get a rectangle and a parallelogram. A rhombus and a trapezoid are there too. The fifth one is a square. Drag the corners or move the sliders. The area and the perimeter answer at once. The height and the two diagonals answer too. So do the four angles.","note":"","tries":["Press <b>parallelogram<\/b> and move the lean slider. The area never moves. The height never changed, so nothing else could.","Press <b>rhombus<\/b> and move the lean slider. All four sides keep their length. The area still falls. Equal sides never promise equal area.","Press <b>trapezoid<\/b> and make the top side very short. The middle bar drops towards the small rectangle. Now make the top side match the bottom. All three bars then line up.","Press <b>rectangle<\/b>. The two diagonals are the same length. Lean it over and they stop matching. They still cut each other in half.","Press <b>rhombus<\/b> and watch the two diagonals. They cross at a right angle every time. Half their product is the area."],"ideas":[{"lead":"<b>A rectangle is its length times its width.<\/b>","rest":"The perimeter is the two lengths and the two widths added up. The two answers pull apart fast.","f":"A = l × w &nbsp;·&nbsp; P = 2(l + w)","eg":"8 × 5: A = 40, P = 26","big":"Rectangle: area = length × width. Perimeter = 2 × (length + width).","html":"<ul><li><b>Area<\/b> is the space inside: A = length × width.<\/li><li><b>Perimeter<\/b> is the distance around the edge: P = 2 × (length + width).<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> an 8 by 5 rectangle.<ol><li>Area: 8 × 5 = <b>40<\/b><\/li><li>Perimeter: 2 × (8 + 5) = 2 × 13 = <b>26<\/b><\/li><\/ol>Check: 8 + 5 + 8 + 5 = 26 ✅<\/div><p class=\"warn\">⚠️ Area and perimeter are different things. A 1 by 12 and a 6 by 7 rectangle both have perimeter 26, but their areas are 12 and 42.<\/p>"},{"lead":"<b>A parallelogram keeps base times height.<\/b>","rest":"Both pairs of opposite sides are parallel. Push it over and no area is lost.","f":"A = base × height","eg":"base 10, height 4 → 40","big":"Parallelogram area = base × height.","html":"<p>A <b>parallelogram<\/b> is a 4-sided shape where both pairs of opposite sides are parallel (they run the same way and never meet). It looks like a pushed-over rectangle.<\/p><p><b>Rule:<\/b> Area = base × height<\/p><div class=\"ex\"><b>Example:<\/b> base 10, height 4.<ol><li>Area = 10 × 4 = <b>40<\/b><\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> cut a triangle off one end and move it to the other end. You get a rectangle with the same base and height, so no area is lost.<\/p>"},{"lead":"<b>The height is measured at a right angle to the base.<\/b>","rest":"The slanted side is longer. It is the wrong number to use.","f":"height, not the slanted side","eg":"sides 10 and 5, height 4: area 40, not 10 × 5 = 50","big":"Use the straight-up height, not the slanted side.","html":"<p>The <b>height<\/b> is measured at a right angle (90°) to the base. The slanted side is longer than the height, so it gives the wrong area.<\/p><div class=\"ex\"><b>Example:<\/b> a parallelogram has sides 10 and 5, and its height is 4.<ol><li>Right: 10 × 4 = <b>40<\/b><\/li><li>Wrong: 10 × 5 = 50<\/li><\/ol><\/div><p class=\"warn\">⚠️ Side × side only works for a rectangle, where the side is also the height.<\/p>"},{"lead":"<b>Lean it further and the area falls.<\/b>","rest":"Every side keeps its length. The shape only gets flatter. The angle between two sides settles how much they hold.","f":"A = a × b × sin θ","eg":"a = 10, b = 5, θ = 30°: 10 × 5 × ½ = 25","big":"Lean a parallelogram over more, and its area gets smaller.","html":"<p>The sides keep their lengths, but the shape gets flatter, so the height drops. The angle between two sides decides the area.<\/p><p><b>Rule:<\/b> A = a × b × sin θ, where a and b are two sides next to each other and θ (theta) is the angle between them.<\/p><div class=\"ex\"><b>Example:<\/b> sides 10 and 5, angle 30°.<ol><li>The slanted side 5 and the height make a 30-60-90 triangle. The height is half of 5, which is 2.5 (sin 30° = ½ says the same).<\/li><li>Area = 10 × 2.5 = <b>25<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 With the same sides at 90° (a rectangle), the area is 10 × 5 = 50, the biggest it can be.<\/p>"},{"lead":"<b>A trapezoid uses the average of its two parallel sides.<\/b>","rest":"Add the two parallel sides and halve that. Then multiply by the height.","f":"A = ½(a + b) × h","eg":"a = 6, b = 10, h = 4: ½ × 16 × 4 = 32","big":"Trapezoid area = the average of the two parallel sides × height.","html":"<p>A <b>trapezoid<\/b> has one pair of parallel sides (they run the same way). Call them a and b. Call the height h.<\/p><p><b>Rule:<\/b> A = ½ × (a + b) × h<\/p><div class=\"ex\"><b>Example:<\/b> parallel sides 6 and 10, height 4.<ol><li>Add the parallel sides: 6 + 10 = 16<\/li><li>Halve it (this is the average): 16 ÷ 2 = 8<\/li><li>Times the height: 8 × 4 = <b>32<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ Use only the two parallel sides, not the slanted ones.<\/p>"},{"lead":"<b>That answer always sits between two rectangles.<\/b>","rest":"One rectangle stands on the short parallel side. The other stands on the long one. Both use the same height.","f":"short × h ≤ area ≤ long × h","eg":"6 × 4 = 24 ≤ 32 ≤ 10 × 4 = 40","big":"A trapezoid's area always sits between two rectangles.","html":"<p>Make two rectangles with the same height as the trapezoid:<\/p><ul><li>a small one on the <b>short<\/b> parallel side<\/li><li>a big one on the <b>long<\/b> parallel side<\/li><\/ul><p>The trapezoid's area is in between: short × h ≤ area ≤ long × h.<\/p><div class=\"ex\"><b>Example:<\/b> parallel sides 6 and 10, height 4, area 32.<ol><li>Small rectangle: 6 × 4 = 24<\/li><li>Big rectangle: 10 × 4 = 40<\/li><li>24 ≤ <b>32<\/b> ≤ 40 ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Use this as a fast check. If your answer is not between them, something went wrong.<\/p>"},{"lead":"<b>A square is settled by one number.<\/b>","rest":"Its side hands you the area and the perimeter. It hands you the diagonal as well.","f":"A = s² &nbsp; P = 4s &nbsp; d = s√2","eg":"s = 5: A = 25, P = 20, d = 5√2","big":"A square needs just one number, its side, to get everything else.","html":"<p>With side s:<\/p><ul><li><b>Area<\/b> = s × s = s²<\/li><li><b>Perimeter<\/b> = 4 × s<\/li><li><b>Diagonal<\/b> (corner to opposite corner) = s × √2<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> side s = 5.<ol><li>Area: 5 × 5 = <b>25<\/b><\/li><li>Perimeter: 4 × 5 = <b>20<\/b><\/li><li>Diagonal: <b>5√2<\/b> (about 7.07)<\/li><\/ol>Check: 5² + 5² = 50, and (5√2)² = 50 ✅<\/div><p class=\"tip\">💡 It works backwards too: area 25 means side 5.<\/p>"},{"lead":"<b>A rhombus has four equal sides.<\/b>","rest":"Its two diagonals cross at a right angle. So half their product is the area.","f":"A = ½ × d<sub>1<\/sub> × d<sub>2<\/sub>","eg":"diagonals 6 and 8: ½ × 6 × 8 = 24","big":"Rhombus area = half of one diagonal × the other diagonal.","html":"<p>A <b>rhombus<\/b> has 4 equal sides, like a pushed-over square. Its two <b>diagonals<\/b> (lines from corner to opposite corner) cross at a right angle (90°).<\/p><p><b>Rule:<\/b> A = ½ × d<sub>1<\/sub> × d<sub>2<\/sub>, where d<sub>1<\/sub> and d<sub>2<\/sub> are the two diagonals.<\/p><div class=\"ex\"><b>Example:<\/b> diagonals 6 and 8.<ol><li>6 × 8 = 48<\/li><li>Half: 48 ÷ 2 = <b>24<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 The diagonals also cut each other in half. So here each side is √(3² + 4²) = 5.<\/p>"},{"lead":"<b>The diagonal of a rectangle is the hypotenuse of a right triangle.<\/b>","rest":"The two sides of the rectangle are the short sides of it.","f":"d = √(l² + w²)","eg":"6 × 8 rectangle: d = √(36 + 64) = 10","big":"A rectangle's diagonal is the hypotenuse of a right triangle.","html":"<p>A diagonal cuts a rectangle into two right triangles. The length and width are the two short sides. The diagonal is the <b>hypotenuse<\/b>, the long side across from the 90° corner.<\/p><p><b>Rule:<\/b> d = √(length² + width²)<\/p><div class=\"ex\"><b>Example:<\/b> a 6 by 8 rectangle.<ol><li>Square: 6² = 36 and 8² = 64<\/li><li>Add: 36 + 64 = 100<\/li><li>Square root: √100 = <b>10<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 6, 8, 10 is just 3, 4, 5 doubled.<\/p>"},{"lead":"<b>The two diagonals tell you which quadrilateral you have.<\/b>","rest":"They cut each other in half in any parallelogram. They match in length only when the corners are right angles.","f":"cut in half · equal · at 90°","big":"The diagonals tell you which 4-sided shape you have.","html":"<p>Look at the two diagonals (corner to opposite corner):<\/p><table><tr><th>What the diagonals do<\/th><th>Shape<\/th><\/tr><tr><td>Cut each other in half<\/td><td>Any parallelogram<\/td><\/tr><tr><td>Cut in half and are equal in length<\/td><td>Rectangle (all corners 90°)<\/td><\/tr><tr><td>Cut in half and cross at 90°<\/td><td>Rhombus (all sides equal)<\/td><\/tr><tr><td>All three<\/td><td>Square<\/td><\/tr><\/table><div class=\"ex\"><b>Example:<\/b> a parallelogram has two diagonals, each 10 long.<ol><li>They are equal, so its corners are right angles.<\/li><li>It is a <b>rectangle<\/b>.<\/li><\/ol><\/div><p class=\"warn\">⚠️ In a parallelogram, the diagonals are equal only when the corners are right angles.<\/p>"},{"lead":"<b>The four angles always add to 360°.<\/b>","rest":"A quadrilateral splits into two triangles. Each triangle holds 180°.","f":"(4 − 2) × 180° = 360°","eg":"90° + 90° + 110° + 70° = 360°","big":"The 4 angles of any 4-sided shape add to 360°.","html":"<p>A <b>quadrilateral<\/b> is any shape with 4 straight sides.<\/p><p>Draw one diagonal and it splits into 2 triangles. Each triangle holds 180°, so 2 × 180° = <b>360°<\/b>.<\/p><div class=\"ex\"><b>Example:<\/b> three angles are 90°, 90° and 110°. Find the fourth.<ol><li>Add: 90 + 90 + 110 = 290<\/li><li>360 − 290 = <b>70°<\/b><\/li><\/ol>Check: 90 + 90 + 110 + 70 = 360 ✅<\/div><p class=\"tip\">💡 The same idea works for any number of sides n: (n − 2) × 180°. For 4 sides: (4 − 2) × 180° = 360°.<\/p>"},{"lead":"<b>Opposite sides equal means opposite angles equal too.<\/b>","rest":"Any two angles next to each other then add to 180°. The two parallel sides run the same way.","f":"P = 2(a + b)","eg":"parallelogram with sides 7 and 4: P = 2(7 + 4) = 22","big":"In a parallelogram, opposite sides are equal and opposite angles are equal.","html":"<ul><li><b>Opposite sides<\/b> are equal and parallel (they run the same way).<\/li><li><b>Opposite angles<\/b> are equal.<\/li><li>Any two angles <b>next to each other<\/b> add to 180°.<\/li><li><b>Perimeter<\/b> = 2 × (one side + the side next to it).<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> a parallelogram has sides 7 and 4, and one angle is 70°.<ol><li>Perimeter: 2 × (7 + 4) = 2 × 11 = <b>22<\/b><\/li><li>The angle next to 70° is 180 − 70 = <b>110°<\/b><\/li><li>So the four angles are 70°, 110°, 70°, 110°.<\/li><\/ol>Check: 70 + 110 + 70 + 110 = 360 ✅<\/div>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 500\"><polygon points=\"165,340 385,340 385,208 165,208\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2;stroke-linejoin:round\"><\/polygon><line x1=\"165\" y1=\"340\" x2=\"385\" y2=\"340\" style=\"stroke:var(--green);stroke-width:3.5;fill:none\"><\/line><line x1=\"165\" y1=\"208\" x2=\"165\" y2=\"340\" style=\"stroke:var(--red);stroke-width:2.6;fill:none\"><\/line><text class=\"slabel r\" x=\"154\" y=\"278\" text-anchor=\"end\">h<\/text><line x1=\"165\" y1=\"340\" x2=\"385\" y2=\"208\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><line x1=\"385\" y1=\"340\" x2=\"165\" y2=\"208\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><circle cx=\"275\" cy=\"274\" r=\"4\" style=\"fill:var(--panel);stroke:var(--green);stroke-width:2.2\"><\/circle><text class=\"slabel b numtxt\" x=\"325.69\" y=\"262.75\" text-anchor=\"middle\">d1<\/text><text class=\"slabel b numtxt\" x=\"237.69\" y=\"240.45\" text-anchor=\"middle\">d2<\/text><path style=\"stroke:var(--green);stroke-width:1.6;fill:none\" d=\"M 175 340 L 175 330 L 165 330\"><\/path><text class=\"slabel g numtxt\" x=\"145.91\" y=\"358\" text-anchor=\"middle\">90°<\/text><path style=\"stroke:var(--green);stroke-width:1.6;fill:none\" d=\"M 385 330 L 375 330 L 375 340\"><\/path><text class=\"slabel g numtxt\" x=\"404.09\" y=\"358\" text-anchor=\"middle\">90°<\/text><path style=\"stroke:var(--green);stroke-width:1.6;fill:none\" d=\"M 375 208 L 375 218 L 385 218\"><\/path><text class=\"slabel g numtxt\" x=\"404.09\" y=\"192.91\" text-anchor=\"middle\">90°<\/text><path style=\"stroke:var(--green);stroke-width:1.6;fill:none\" d=\"M 165 218 L 175 218 L 175 208\"><\/path><text class=\"slabel g numtxt\" x=\"145.91\" y=\"192.91\" text-anchor=\"middle\">90°<\/text><text class=\"slabel g numtxt\" x=\"275\" y=\"374\" text-anchor=\"middle\">bottom side = 10<\/text><text class=\"slabel b numtxt\" x=\"275\" y=\"174\" text-anchor=\"middle\">top side = 10<\/text><text class=\"slabel  numtxt\" x=\"415\" y=\"278\" text-anchor=\"middle\">6<\/text><circle class=\"handle\" cx=\"385\" cy=\"340\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"385\" cy=\"208\" r=\"8\"><\/circle><text class=\"slabel g numtxt\" x=\"340\" y=\"24\" text-anchor=\"middle\">base 10 · height 6 · area = ½(10 + 10) × 6 = 60<\/text><text class=\"slabel b numtxt\" x=\"340\" y=\"42\" text-anchor=\"middle\">d1 = 11.66 · d2 = 11.66 · they cross at 61.9° · each cuts the other in half<\/text><text class=\"slabel  numtxt\" x=\"340\" y=\"60\" text-anchor=\"middle\">four right angles · both diagonals measure 11.66<\/text><line x1=\"40\" y1=\"388\" x2=\"640\" y2=\"388\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel \" x=\"340\" y=\"406\" text-anchor=\"middle\">both parallel sides are the same, so all three hold the same<\/text><rect x=\"212\" y=\"423\" width=\"340\" height=\"14\" style=\"fill:var(--ink-3);fill-opacity:.35\"><\/rect><text class=\"slabel  numtxt\" x=\"202\" y=\"434\" text-anchor=\"end\">10 × 6<\/text><text class=\"slabel  numtxt\" x=\"561\" y=\"434\" text-anchor=\"start\">60<\/text><rect x=\"212\" y=\"449\" width=\"340\" height=\"14\" style=\"fill:var(--green);fill-opacity:.5\"><\/rect><text class=\"slabel g\" x=\"202\" y=\"460\" text-anchor=\"end\">this shape<\/text><text class=\"slabel g numtxt\" x=\"561\" y=\"460\" text-anchor=\"start\">60<\/text><rect x=\"212\" y=\"475\" width=\"340\" height=\"14\" style=\"fill:var(--ink-3);fill-opacity:.35\"><\/rect><text class=\"slabel  numtxt\" x=\"202\" y=\"486\" text-anchor=\"end\">10 × 6<\/text><text class=\"slabel  numtxt\" x=\"561\" y=\"486\" text-anchor=\"start\">60<\/text><\/svg>","sec":"geo","fm":["Rectangle: area and perimeter","Area of a parallelogram","The trapezoid: area and perimeter","The square: area, perimeter and diagonal","Area of a rhombus from its diagonals","Diagonal of a rectangle","Perimeter of a parallelogram or rhombus","Angle sum of a polygon"]},"cb_right":{"title":"The right angle, and everything that comes out of it","tag":"Geometry","say":"Set the two short sides. The hypotenuse answers, and so does every rule that leans on it. The buttons show the same triangle six ways. The squares view is the rule itself, drawn as three real squares whose areas add up.","note":"Two habits are worth more than the rest of this board. Name the hypotenuse before you write anything down, because the wrong choice is always on the answer list. And learn the whole-number sets. A question built on 5-12-13 is a five-second question once you see it, and a page of working once you do not.","tries":["Set the sides to 3 and 4. The two small squares hold 9 and 16 cells. The big one holds 25, and 25 is 5 squared.","Press <b>the sets worth knowing<\/b> and try 6 and 8, then 9 and 12. Both light up, because both are 3-4-5 grown bigger.","Press <b>backwards<\/b>. Now the hypotenuse and one short side are given. The missing one comes from taking squares away instead of adding them.","Press <b>half a square<\/b>. The two short sides are equal, so the hypotenuse is a side times √2. The other two angles are 45° each.","Press <b>the box<\/b>. The diagonal through a box uses the rule twice: flat across the floor first, then standing up."],"ideas":[{"lead":"<b>Name the hypotenuse first.<\/b>","rest":"It is the side facing the right angle, and it is always the longest of the three. Everything else on this board depends on getting that right.","f":"a² + b² = c²","eg":"legs 6 and 8: 36 + 64 = 100 → c = 10","big":"In a right triangle, find the hypotenuse first. It is across from the 90° angle.","html":"<p>A <b>right triangle<\/b> has one 90° corner (a square corner).<\/p><ul><li>The <b>hypotenuse<\/b> is the side across from the 90° corner. It is always the longest side.<\/li><li>The other two sides are the <b>legs<\/b> (the short sides).<\/li><\/ul><p><b>Rule (Pythagoras):<\/b> a² + b² = c², where a and b are the legs and c is the hypotenuse.<\/p><div class=\"ex\"><b>Example:<\/b> legs 6 and 8.<ol><li>Square them: 6² = 36 and 8² = 64<\/li><li>Add: 36 + 64 = 100<\/li><li>Square root: c = √100 = <b>10<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ If you pick the wrong side as c, every answer comes out wrong.<\/p>"},{"lead":"<b>The rule runs backwards too.<\/b>","rest":"If you know the hypotenuse and one short side, take the squares away instead of adding them.","f":"b = √(c² − a²)","eg":"c = 13, a = 5: b = √(169 − 25) = 12","big":"Know the hypotenuse and one leg? Subtract the squares.","html":"<p>The same rule works backwards. To find a short side, <b>take away<\/b> instead of adding.<\/p><p><b>Rule:<\/b> leg = √(hypotenuse² − other leg²)<\/p><div class=\"ex\"><b>Example:<\/b> hypotenuse 13, one leg 5.<ol><li>Square them: 13² = 169 and 5² = 25<\/li><li>Subtract: 169 − 25 = 144<\/li><li>Square root: √144 = <b>12<\/b><\/li><\/ol>Check: 5² + 12² = 25 + 144 = 169 = 13² ✅<\/div><p class=\"warn\">⚠️ Adding here is the common mistake. A leg must come out shorter than the hypotenuse.<\/p>"},{"lead":"<b>Some whole-number sets fit the rule exactly.<\/b>","rest":"Knowing them skips the sums. Every multiple of a set works as well.","f":"3-4-5 · 5-12-13 · 8-15-17 · 7-24-25","big":"Learn these right triangles by heart: 3-4-5, 5-12-13, 8-15-17, 7-24-25.","html":"<p>These whole-number sides fit a² + b² = c² exactly, so you can skip the math.<\/p><ul><li>3, 4, 5 → 9 + 16 = 25<\/li><li>5, 12, 13 → 25 + 144 = 169<\/li><li>8, 15, 17 → 64 + 225 = 289<\/li><li>7, 24, 25 → 49 + 576 = 625<\/li><\/ul><p><b>Multiples work too.<\/b> Multiply all three sides by the same number.<\/p><div class=\"ex\"><b>Example:<\/b> legs 6 and 8. Find the hypotenuse.<ol><li>6 and 8 are 3 and 4, each times 2.<\/li><li>So the hypotenuse is 5 × 2 = <b>10<\/b><\/li><\/ol>Check: 36 + 64 = 100 = 10² ✅<\/div>"},{"lead":"<b>Half a square gives one fixed shape.<\/b>","rest":"Cut a square along its diagonal. The two short sides are equal. The hypotenuse is a side times √2, because s² + s² = 2s².","f":"1 : 1 : √2","eg":"legs 5 and 5 → hypotenuse 5√2","big":"Cut a square in half along the diagonal: the sides are 1 : 1 : √2.","html":"<p>This is the <b>45-45-90 triangle<\/b>. It has two equal legs and two 45° angles.<\/p><p><b>Rule:<\/b> hypotenuse = leg × √2<\/p><div class=\"ex\"><b>Example:<\/b> both legs are 5.<ol><li>Hypotenuse = 5 × √2 = <b>5√2<\/b><\/li><\/ol>Check: 5² + 5² = 50, and (5√2)² = 25 × 2 = 50 ✅<\/div><p class=\"why\"><b>Why it works:<\/b> s² + s² = 2s², and the square root of 2s² is s√2 (s is the leg).<\/p><p class=\"tip\">💡 So the diagonal of any square is side × √2.<\/p>"},{"lead":"<b>Half an equal-sided triangle gives the other fixed shape.<\/b>","rest":"The shortest side is half the hypotenuse. The middle side is the shortest times √3.","f":"1 : √3 : 2","eg":"short side 4 → the others are 4√3 and 8","big":"Cut an equal-sided triangle in half: the sides are 1 : √3 : 2.","html":"<p>This is the <b>30-60-90 triangle<\/b>. You get it by cutting a triangle with 3 equal sides down the middle. Call the shortest side x.<\/p><ul><li>Shortest side (across from 30°) = x<\/li><li>Middle side (across from 60°) = x × √3<\/li><li>Hypotenuse (across from 90°) = 2x. So the shortest side is half the hypotenuse.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> the shortest side is 4.<ol><li>Middle side = 4 × √3 = <b>4√3<\/b><\/li><li>Hypotenuse = 2 × 4 = <b>8<\/b><\/li><\/ol>Check: 4² + (4√3)² = 16 + 48 = 64 = 8² ✅<\/div><p class=\"warn\">⚠️ The 2 goes with the hypotenuse, not the √3. √3 is about 1.73, which is less than 2.<\/p>"},{"lead":"<b>A triangle with two equal sides has two equal angles.<\/b>","rest":"They are the angles facing those two sides. When all three sides are equal, all three angles are 60°.","f":"equal sides → equal angles","eg":"AB = AC → angle B = angle C","big":"Two equal sides means two equal angles.","html":"<p>A triangle with two equal sides is called <b>isosceles<\/b>.<\/p><ul><li>The two angles that <b>face<\/b> the equal sides are equal too.<\/li><li>If all three sides are equal, all three angles are equal: 180° ÷ 3 = <b>60°<\/b> each.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> in triangle ABC, side AB = side AC, and angle A = 40°.<ol><li>AB faces angle C, and AC faces angle B. So angle B = angle C.<\/li><li>B and C share what is left: 180° − 40° = 140°<\/li><li>Each one: 140° ÷ 2 = <b>70°<\/b><\/li><\/ol>Check: 40 + 70 + 70 = 180 ✅<\/div>"},{"lead":"<b>When all three sides are equal there is a shortcut for the area.<\/b>","rest":"Cut the triangle down the middle. The height comes out as the side times √3 divided by 2. Half of base times height then gives the shortcut.","f":"A = (√3/4)s²","eg":"s = 4: (√3/4) × 16 = 4√3","big":"Equal-sided triangle area = (√3 ÷ 4) × side².","html":"<p>An <b>equilateral<\/b> triangle has all 3 sides equal. Its area has a shortcut.<\/p><p><b>Rule:<\/b> Area = (√3/4) × s², where s is the side.<\/p><div class=\"ex\"><b>Example:<\/b> side s = 4.<ol><li>Square the side: 4² = 16<\/li><li>Multiply: (√3/4) × 16 = (16 ÷ 4) × √3 = <b>4√3<\/b><\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> cut the triangle down the middle. The height is s√3 ÷ 2. Then ½ × base × height = ½ × s × s√3/2 = (√3/4)s².<\/p><p class=\"tip\">💡 Check with s = 4: the height is 2√3, and ½ × 4 × 2√3 = 4√3 ✅<\/p>"},{"lead":"<b>The rule in disguise.<\/b>","rest":"The diagonal of a rectangle uses it once. The diagonal through a box uses it twice.","f":"d = √(l² + w² + h²)","eg":"3 × 4 × 12 box: √(9 + 16 + 144) = 13","big":"Diagonals of rectangles and boxes use the same a² + b² = c² rule.","html":"<ul><li><b>Rectangle diagonal<\/b> (corner to opposite corner): d = √(length² + width²). The rule is used once.<\/li><li><b>Box diagonal<\/b> (from one corner, through the inside, to the far corner): d = √(length² + width² + height²). The rule is used twice.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> a box 3 by 4 by 12.<ol><li>Square each: 9, 16 and 144<\/li><li>Add: 9 + 16 + 144 = 169<\/li><li>Square root: √169 = <b>13<\/b><\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> the floor diagonal is √(9 + 16) = 5. Then 5 and the height 12 make a new right triangle: √(25 + 144) = 13.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 660 420\"><polygon points=\"264.55,265.09 264.55,166.91 166.36,166.91 166.36,265.09\" style=\"fill:var(--green);fill-opacity:.14;stroke:var(--green);stroke-width:1.8\"><\/polygon><polygon points=\"264.55,265.09 395.45,265.09 395.45,396 264.55,396\" style=\"fill:var(--blue);fill-opacity:.14;stroke:var(--blue);stroke-width:1.8\"><\/polygon><polygon points=\"264.55,166.91 395.45,265.09 493.64,134.18 362.73,36\" style=\"fill:var(--amber);fill-opacity:.16;stroke:var(--amber);stroke-width:1.8\"><\/polygon><polygon points=\"264.55,265.09 264.55,166.91 395.45,265.09\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2;stroke-linejoin:round\"><\/polygon><path style=\"stroke:var(--green);stroke-width:1.6;fill:none\" d=\"M 264.55 253.09 L 276.55 253.09 L 276.55 265.09\"><\/path><text class=\"slabel g numtxt\" x=\"215.45\" y=\"221\" text-anchor=\"middle\">a² = 9<\/text><text class=\"slabel b numtxt\" x=\"330\" y=\"335.55\" text-anchor=\"middle\">b² = 16<\/text><text class=\"slabel a numtxt\" x=\"379.09\" y=\"155.55\" text-anchor=\"middle\">c² = 25<\/text><text class=\"slabel  numtxt\" x=\"330\" y=\"22\" text-anchor=\"middle\">9 + 16 = 25, so the hypotenuse is 5<\/text><\/svg>","sec":"geo","fm":["The Pythagorean rule","The converse of Pythagoras: acute, right or obtuse","The 45-45-90 triangle","The 30-60-90 triangle","Area of an equilateral triangle","Equal sides face equal angles","Diagonal of a rectangle","Space diagonal of a box","The longest side faces the largest angle","Area of a triangle"]},"cb_scale":{"title":"Similar figures and the scale factor","tag":"Geometry","say":"Move the slider and the figure is copied at a new size. The copy is drawn beside the original. Two figures with the same shape but a different size are called similar figures. One number runs the whole change, and that number is the scale factor k. The slider counts k in quarters, so k lands on exact fractions like 3/4. Every length is multiplied by k. Every area is multiplied by k twice over, because an area is a length times a length. Every volume is multiplied by k three times over, because a volume is three lengths multiplied together. Drag a corner to change the figure itself, and the four buttons change what is drawn.","note":"Two things are worth carrying out of this board. The first is picking the right power of the scale factor k. Lengths use k. Areas use k squared, because an area is a length times a length. Volumes use k cubed, because a volume is three lengths multiplied together. The second is going the other way. An area ratio is not a length ratio. If the areas are 9 : 16, the lengths are 3 : 4. You get there by taking a square root of each side. The perimeter is 3 : 4 as well, because a perimeter is a length. The answer list will always offer you 9 : 16 too.","tries":["Set k to 2. The copy has sides twice as long, and four copies of the small figure fit inside it. The perimeter doubles while the area goes up four times.","Set k to 3/4. The lengths come out 3 : 4 and the areas come out 9 : 16. Read that backwards. Areas of 9 : 16 always mean lengths of 3 : 4.","Press <b>count the squares<\/b> and slide k. The two blocks of squares are the area ratio, drawn so you can count it instead of trusting it.","Drag a corner in the first view. The angles move, but the two figures still match angle for angle, and the sides still share one ratio.","Press <b>what it holds<\/b> and set k to 3. Lengths go up 3 times, areas 9 times, and the volume 27 times."],"ideas":[{"lead":"<b>One number runs the whole change of size.<\/b>","rest":"That number is the scale factor k. Two figures with the same shape but a different size are called similar figures.","f":"every length × k","eg":"k = 3: sides 2 and 4 become 6 and 12","big":"Similar shapes: same shape, new size. Every length is multiplied by one number, k.","html":"<p><b>Similar figures<\/b> have the same shape but a different size, like a photo and a bigger print of it.<\/p><p>The <b>scale factor<\/b> k is the number you multiply every length by to get the new shape.<\/p><div class=\"ex\"><b>Example:<\/b> k = 3. A shape has sides 2 and 4.<ol><li>2 × 3 = <b>6<\/b><\/li><li>4 × 3 = <b>12<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 k bigger than 1 makes the shape bigger. k less than 1 (like ½) makes it smaller.<\/p>"},{"lead":"<b>Area does not grow at the same rate as length.<\/b>","rest":"An area is a length times a length. Both of those lengths are multiplied by k, so k is used twice. The area is multiplied by k times k.","f":"area × k²","eg":"k = 3: area × 9","big":"When lengths are multiplied by k, area is multiplied by k².","html":"<p>Area is a length times a length. Both lengths get multiplied by k, so the area gets multiplied by k × k = k².<\/p><p><b>Rule:<\/b> new area = old area × k²<\/p><div class=\"ex\"><b>Example:<\/b> a 2 by 4 rectangle, scaled by k = 3.<ol><li>Old area: 2 × 4 = 8<\/li><li>New sides are 6 and 12, so the new area is 6 × 12 = 72<\/li><li>72 ÷ 8 = 9 = 3² → the area went up <b>9 times<\/b>, not 3 ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ Doubling the sides does not double the area. It makes it 4 times bigger.<\/p>"},{"lead":"<b>Volume grows faster still.<\/b>","rest":"A volume is a length times a length times a length. All three of those lengths are multiplied by k, so k is used three times.","f":"volume × k³","eg":"k = 3: volume × 27","big":"When lengths are multiplied by k, volume is multiplied by k³.","html":"<p>Volume (the space inside a 3D shape) is length × length × length. All three get multiplied by k, so the volume gets multiplied by k × k × k = k³.<\/p><div class=\"ex\"><b>Example:<\/b> a 1 by 1 by 1 cube, scaled by k = 3.<ol><li>Old volume: 1 × 1 × 1 = 1<\/li><li>The new cube is 3 by 3 by 3: 3 × 3 × 3 = 27<\/li><li>The volume went up <b>27 times<\/b> (3³ = 27) ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Remember: length × k, area × k², volume × k³.<\/p>"},{"lead":"<b>The perimeter is a length, so it grows with k.<\/b>","rest":"The perimeter is only the sides added up. It never grows with k squared.","f":"perimeter × k","eg":"k = 3: perimeter 12 → 36","big":"Perimeter is a length, so it is multiplied by k, not k².","html":"<p>The <b>perimeter<\/b> is the distance around a shape: all the sides added up. It is just a length, so it grows by k only.<\/p><div class=\"ex\"><b>Example:<\/b> a square with side 3 has perimeter 12. Scale it by k = 3.<ol><li>New side: 3 × 3 = 9<\/li><li>New perimeter: 4 × 9 = 36<\/li><li>Shortcut: 12 × 3 = <b>36<\/b> ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ Do not square k for the perimeter. Only area uses k².<\/p>"},{"lead":"<b>Going backwards from an area ratio needs a square root.<\/b>","rest":"A length was multiplied by a length to make the area. A square root undoes that. Areas of 9 : 16 mean lengths of 3 : 4.","f":"areas p : q → lengths √p : √q","eg":"areas 9 : 25 → lengths 3 : 5","big":"Know the area ratio? Take the square root to get the length ratio.","html":"<p>A <b>ratio<\/b> compares two numbers, like 9 : 25. Area comes from multiplying lengths, and a square root undoes that.<\/p><p><b>Rule:<\/b> areas p : q → lengths √p : √q<\/p><div class=\"ex\"><b>Example:<\/b> two similar shapes have areas in the ratio 9 : 25.<ol><li>√9 = 3 and √25 = 5<\/li><li>So their lengths are in the ratio <b>3 : 5<\/b><\/li><\/ol>Check: 3² : 5² = 9 : 25 ✅<\/div><p class=\"tip\">💡 Areas 9 : 16 mean lengths 3 : 4.<\/p>"},{"lead":"<b>Matching angles stay equal and matching sides share one ratio.<\/b>","rest":"That pair of facts is what similar figures means. Size never touches an angle.","f":"a′/a = b′/b = c′/c","eg":"3-4-5 and 6-8-10: 6/3 = 8/4 = 10/5 = 2","big":"Similar shapes: the angles stay the same, and all sides grow by the same number.","html":"<p>Two shapes are similar when both of these are true:<\/p><ul><li>Matching angles are <b>equal<\/b>. Changing the size never changes an angle.<\/li><li>Matching sides all share the <b>same ratio<\/b>. New side ÷ old side gives the same number every time.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> triangles with sides 3, 4, 5 and 6, 8, 10.<ol><li>6 ÷ 3 = 2<\/li><li>8 ÷ 4 = 2<\/li><li>10 ÷ 5 = 2<\/li><li>Every ratio is 2 → they are <b>similar<\/b>, with k = 2 ✅<\/li><\/ol><\/div>"},{"lead":"<b>A line across a triangle parallel to one side cuts off a similar figure.<\/b>","rest":"Two lines are parallel when they run the same way for ever and never meet. The small triangle and the whole one share one scale factor.","f":"lengths r : 1 · areas r² : 1","eg":"cut halfway up (r = ½): the small triangle is ¼ of the area","big":"A line across a triangle, parallel to one side, cuts off a smaller similar triangle.","html":"<p>Draw a line across a triangle that is <b>parallel<\/b> to one side (runs the same way and never meets it). The small triangle it cuts off is <b>similar<\/b> to the whole triangle. Call their scale factor r.<\/p><ul><li>Lengths: small : big = r : 1<\/li><li>Areas: small : big = r² : 1<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> the line cuts halfway up, so r = ½.<ol><li>Lengths: the small triangle's sides are ½ of the big ones.<\/li><li>Area: (½)² = ½ × ½ = ¼<\/li><li>The small triangle is <b>¼ of the area<\/b>.<\/li><\/ol><\/div><p class=\"warn\">⚠️ Half the size does not mean half the area. It means one quarter.<\/p>"},{"lead":"<b>Two triangles are similar figures as soon as their angles match.<\/b>","rest":"The third angle is forced by the 180° total. So two matching angles are enough, and no length has to be worked out.","f":"angles match → sides in one ratio","eg":"both have angles 30°, 60°, 90° → similar","big":"Two matching angles are enough to show two triangles are similar.","html":"<p>If two triangles have the same angles, they are similar. Their sides are then all in one ratio.<\/p><p>You only need to check <b>two<\/b> angles. The third must match too, because all three add to 180°.<\/p><div class=\"ex\"><b>Example:<\/b> one triangle has angles 30° and 60°. Another has a
