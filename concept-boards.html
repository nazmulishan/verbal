term at once.","f":"k = <sup>actual<\/sup>&frasl;<sub>ratio term<\/sub>, then every other actual = its term &middot; k","eg":"Two sums are in the ratio 3 : 5 and the first is $45, so k = 15, the second is $75, and the total is $120.","trap":"Reading the ratio terms as the amounts themselves. 3 : 5 does not mean $3 and $5; until one real value pins k down, 3 : 5 also describes 45 and 75, and 300 and 500.","fmn":"Ratio to actual value: the scale factor"},{"lead":"<b>Dividing a quantity in a given ratio.<\/b>","rest":"Split the total into a + b equal pieces first; each side then takes its own number of those pieces, which is why the denominator is the sum and never one of the terms.","f":"share = total &middot; <sup>own term<\/sup>&frasl;<sub>(sum of all terms)<\/sub>","eg":"$200 split 2 : 3 gives one part of $40, so the shares are $80 and $120.","trap":"Dividing the total by one of the terms. 200 in the ratio 2 : 3 is not 200 &divide; 2 and 200 &divide; 3; the divisor is the sum 5, and the two shares must add back to 200.","fmn":"Dividing a quantity in a given ratio"},{"lead":"<b>Bridging two ratios.<\/b>","rest":"Two ratios only join once their shared term reads the same in both, so scale each ratio by the other's copy of B and the chain closes.","f":"A : B = a : b and B : C = c : q &nbsp;&rarr;&nbsp; A : B : C = ac : bc : bq","eg":"A : B = 3 : 4 and B : C = 6 : 5 give 18 : 24 : 20, which reduces to 9 : 12 : 10.","trap":"Writing 3 : 4 : 5 by simply stapling the two ratios together. B is 4 in one and 6 in the other, so the terms are in different units until both are scaled to their common multiple.","fmn":"Bridging two ratios"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 340 210\"><path class=\"gline\" d=\"M 34 88 L 290 88\"/><path class=\"gline\" d=\"M 34 152 L 290 152\"/><rect class=\"shape\" x=\"34\" y=\"74.9\" width=\"17\" height=\"13.1\"/><rect class=\"shape\" x=\"53\" y=\"74.9\" width=\"17\" height=\"13.1\"/><rect class=\"shape\" x=\"72\" y=\"74.9\" width=\"17\" height=\"13.1\"/><rect class=\"shape\" x=\"34\" y=\"138.9\" width=\"17\" height=\"13.1\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><rect class=\"shape\" x=\"53\" y=\"138.9\" width=\"17\" height=\"13.1\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><rect class=\"shape\" x=\"72\" y=\"138.9\" width=\"17\" height=\"13.1\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><rect class=\"shape\" x=\"91\" y=\"138.9\" width=\"17\" height=\"13.1\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><rect class=\"shape\" x=\"110\" y=\"138.9\" width=\"17\" height=\"13.1\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><text class=\"slabel b\" x=\"97\" y=\"84\">= 45<\/text><text class=\"slabel a\" x=\"135\" y=\"148\">= 75<\/text><text class=\"slabel r\" x=\"34\" y=\"30\">one block = k = 15<\/text><text class=\"slabel\" x=\"170\" y=\"184\" text-anchor=\"middle\">ratio 3 : 5, first actual 45<\/text><text class=\"slabel b\" x=\"170\" y=\"200\" text-anchor=\"middle\">second 75, total 120<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Ratio to actual value: the scale factor&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"arith","fm":[]},"tk_mix":{"title":"Mixtures and weighted averages","tag":"Applied Arithmetic","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Weighted average of two groups.<\/b>","rest":"The combined average is not the average of the two averages; it is dragged toward whichever group is larger, and it lands exactly at the midpoint only at a fifty-fifty split.","f":"avg = <sup>(w &middot; x&#8321; + (100 &minus; w) &middot; x&#8322;)<\/sup>&frasl;<sub>100<\/sub>","eg":"30 per cent of a class averages 90 and the other 70 per cent averages 50, so the class averages (30 &times; 90 + 70 &times; 50) &divide; 100 = 62, not 70.","trap":"Averaging the two averages. That answer is correct only when the groups are the same size; with unequal groups it always overstates the smaller group's pull.","fmn":"Weighted average of two groups"},{"lead":"<b>Alligation: the mixing ratio.<\/b>","rest":"Running a weighted average backwards: the amounts you need are in the ratio of the <em>opposite<\/em> distances from the target, so the strength nearer the target is the one you need more of.","f":"w&#8321; : w&#8322; = (x&#8322; &minus; m) : (m &minus; x&#8321;)","eg":"To reach 15 per cent from a 10 per cent and a 25 per cent solution: distances 10 and 5, so mix 2 parts of the 10 per cent to 1 part of the 25 per cent.","trap":"Attaching each distance to the strength it was measured from. The distance to the <em>far<\/em> strength is the weight of the <em>near<\/em> one, so the ratio comes out inverted if the two are paired the obvious way.","fmn":"Alligation: the mixing ratio"},{"lead":"<b>Concentration after adding pure solute.<\/b>","rest":"Pouring in the pure substance raises the top of the fraction and the bottom of it at once, so the strength climbs toward 100 per cent but never gets there.","f":"new per cent = 100 &middot; <sup>(V &middot; c/100 + a)<\/sup>&frasl;<sub>(V + a)<\/sub>","eg":"Add 30 litres of pure acid to 100 litres of 20 per cent acid: 100 &times; 50 &divide; 130 = 38.46 per cent.","trap":"Leaving the added litres out of the denominator. The pure solute is part of the new mixture too, so the total volume grows by exactly what was poured in.","fmn":"Concentration after adding pure solute"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 340 215\"><path class=\"gline\" d=\"M 40 122 L 300 122\"/><path class=\"gline\" d=\"M 40 122 L 40 127\"/><text class=\"slabel\" x=\"40\" y=\"140\" text-anchor=\"middle\">0<\/text><path class=\"gline\" d=\"M 105 122 L 105 127\"/><text class=\"slabel\" x=\"105\" y=\"140\" text-anchor=\"middle\">25<\/text><path class=\"gline\" d=\"M 170 122 L 170 127\"/><text class=\"slabel\" x=\"170\" y=\"140\" text-anchor=\"middle\">50<\/text><path class=\"gline\" d=\"M 235 122 L 235 127\"/><text class=\"slabel\" x=\"235\" y=\"140\" text-anchor=\"middle\">75<\/text><path class=\"gline\" d=\"M 300 122 L 300 127\"/><text class=\"slabel\" x=\"300\" y=\"140\" text-anchor=\"middle\">100<\/text><rect class=\"shape\" x=\"265\" y=\"94.4\" width=\"18\" height=\"27.6\"/><rect class=\"shape\" x=\"161\" y=\"73.6\" width=\"18\" height=\"48.4\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><text class=\"slabel b\" x=\"274\" y=\"88.4\" text-anchor=\"middle\">30%<\/text><text class=\"slabel a\" x=\"170\" y=\"67.6\" text-anchor=\"middle\">70%<\/text><path class=\"aux\" d=\"M 222 30 L 222 122\"/><text class=\"slabel r\" x=\"222\" y=\"26\" text-anchor=\"middle\">plain 70<\/text><path class=\"shape\" d=\"M 191.2 142 L 211.2 142 L 201.2 122 Z\"/><text class=\"slabel\" x=\"170\" y=\"178\" text-anchor=\"middle\">30% at 90 and 70% at 50<\/text><text class=\"slabel b\" x=\"170\" y=\"196\" text-anchor=\"middle\">the balance point sits at 62<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Weighted average of two groups&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"arith","fm":[]},"tk_rates":{"title":"Speed and work","tag":"Applied Arithmetic","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Distance, rate and time.<\/b>","rest":"One relation, three faces &mdash; write down whichever two of the three you are given and the third is forced.","f":"d = r &middot; t &nbsp;&middot;&nbsp; t = <sup>d<\/sup>&frasl;<sub>r<\/sub> &nbsp;&middot;&nbsp; r = <sup>d<\/sup>&frasl;<sub>t<\/sub>","eg":"60 miles an hour for 2.5 hours covers 150 miles; the same 150 miles at 50 miles an hour takes 3 hours.","trap":"Mixing the units of r and t. 60 miles an hour for 40 minutes is 60 &times; (2/3) = 40 miles, not 60 &times; 40; the time must be in the same hours the rate names.","fmn":"Distance, rate and time"},{"lead":"<b>Average speed over two legs.<\/b>","rest":"Average speed is one division and one division only &mdash; every mile travelled over every hour spent &mdash; and the slow leg eats more hours than the fast one, so it pulls harder.","f":"avg = <sup>total distance<\/sup>&frasl;<sub>total time<\/sub> = <sup>2D<\/sup>&frasl;<sub>(D/r&#8321; + D/r&#8322;)<\/sub>","eg":"60 miles at 30 then 60 miles at 60: 120 miles in 2 + 1 = 3 hours, so 40 miles an hour &mdash; not the 45 the two speeds suggest.","trap":"Averaging the two speeds. That is right only when the two legs take equal <em>time<\/em>; over equal distances the answer is always below the plain average, because more of the trip is spent going slowly.","fmn":"Average speed over two legs"},{"lead":"<b>Two workers combined.<\/b>","rest":"Rates add, times do not: convert each worker to a job per hour, add those, and invert once at the end.","f":"<sup>1<\/sup>&frasl;<sub>t<\/sub> = <sup>1<\/sup>&frasl;<sub>a<\/sub> + <sup>1<\/sup>&frasl;<sub>b<\/sub> &nbsp;&rarr;&nbsp; t = <sup>ab<\/sup>&frasl;<sub>(a + b)<\/sub>","eg":"One painter takes 6 hours, another 12; together (6 &times; 12) &divide; 18 = 4 hours.","trap":"Averaging the two times. Together they must finish faster than the faster worker alone, so any answer at or above 6 hours here is wrong before it is checked.","fmn":"Two workers combined"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 340 200\"><path class=\"gline\" d=\"M 28 58 L 312 58\"/><path class=\"gline\" d=\"M 28 92 L 312 92\"/><rect x=\"28\" y=\"61\" width=\"213\" height=\"28\" style=\"fill:var(--blue-wash);stroke:var(--blue)\"/><path class=\"gline\" d=\"M 113.2 61 L 113.2 89\"/><text class=\"slabel\" x=\"113.2\" y=\"52\" text-anchor=\"middle\">1h<\/text><path class=\"gline\" d=\"M 198.4 61 L 198.4 89\"/><text class=\"slabel\" x=\"198.4\" y=\"52\" text-anchor=\"middle\">2h<\/text><path class=\"aux\" d=\"M 231 56 L 241 75 L 231 94\"/><path class=\"gline\" d=\"M 28 102 L 28 108 L 312 108 L 312 102\"/><text class=\"slabel\" x=\"170\" y=\"122\" text-anchor=\"middle\">the road runs to 200 miles<\/text><text class=\"slabel b\" x=\"170\" y=\"158\" text-anchor=\"middle\">60 miles an hour &times; 2.5 hours<\/text><text class=\"slabel r\" x=\"170\" y=\"178\" text-anchor=\"middle\">150 miles covered<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Distance, rate and time&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"arith","fm":[]},"tk_units":{"title":"Units, prices and scaling","tag":"Applied Arithmetic","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Unit price.<\/b>","rest":"Divide the money by the goods and every package becomes comparable, whatever odd size it is sold in.","f":"price per unit = <sup>total cost<\/sup>&frasl;<sub>quantity<\/sub>","eg":"$12 for 16 ounces is 12 &divide; 16 = $0.75 an ounce; a 4-ounce pack at $5 is $1.25 an ounce, so the big pack wins.","trap":"Turning the fraction over without turning the comparison over. Dollars per unit is better when it is <em>smaller<\/em>; units per dollar is better when it is larger, and swapping the two reverses the verdict.","fmn":"Unit price"},{"lead":"<b>Unit conversion by cancelling.<\/b>","rest":"Write every conversion as a fraction equal to 1 and stack them so the unwanted units cancel diagonally; the units themselves tell you which way up each factor goes.","f":"metres = r <sup>km<\/sup>&frasl;<sub>h<\/sub> &middot; <sup>1,000 m<\/sup>&frasl;<sub>1 km<\/sub> &middot; <sup>1 h<\/sup>&frasl;<sub>60 min<\/sub> &middot; t min","eg":"72 km an hour for 10 minutes is 72 &times; 1,000 &divide; 60 &times; 10 = 12,000 metres.","trap":"Putting a factor upside down. Multiplying by 60 instead of dividing gives an answer 3,600 times too large, and the only guard is checking that the unwanted unit actually cancelled.","fmn":"Unit conversion by cancelling"},{"lead":"<b>Scaling: k&sup2; for area, k&sup3; for volume.<\/b>","rest":"One scale factor governs a whole figure, but it enters once for a length, twice for anything two-dimensional and three times for anything three-dimensional.","f":"length &times; k &nbsp;&rarr;&nbsp; area &times; k<sup>2<\/sup> &nbsp;&rarr;&nbsp; volume &times; k<sup>3<\/sup>","eg":"Double the side of a cube of side 4: the surface goes from 96 to 384 and the volume from 64 to 512 &mdash; four times and eight times, not two.","trap":"Applying k to the area or the volume directly. Doubling every length multiplies area by 4 and volume by 8, and stretching every length by half multiplies volume by 1.5<sup>3<\/sup> = 3.375, not by 1.5.","fmn":"Scaling: k² for area, k³ for volume"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 340 210\"><rect class=\"shape\" x=\"34\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"49\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"64\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"79\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"94\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"109\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"124\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"139\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"154\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"169\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"184\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"199\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"214\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"229\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"244\" y=\"30\" width=\"13.5\" height=\"28\"/><rect class=\"shape\" x=\"259\" y=\"30\" width=\"13.5\" height=\"28\"/><text class=\"slabel b\" x=\"280\" y=\"48\">16 units<\/text><rect class=\"shape\" x=\"34\" y=\"84\" width=\"48\" height=\"32\" style=\"fill:var(--amber-wash);stroke:var(--amber)\"/><text class=\"slabel a\" x=\"88\" y=\"105\">12 dollars<\/text><path class=\"gline\" d=\"M 37 84 L 37 116\"/><path class=\"gline\" d=\"M 40 84 L 40 116\"/><path class=\"gline\" d=\"M 43 84 L 43 116\"/><path class=\"gline\" d=\"M 46 84 L 46 116\"/><path class=\"gline\" d=\"M 49 84 L 49 116\"/><path class=\"gline\" d=\"M 52 84 L 52 116\"/><path class=\"gline\" d=\"M 55 84 L 55 116\"/><path class=\"gline\" d=\"M 58 84 L 58 116\"/><path class=\"gline\" d=\"M 61 84 L 61 116\"/><path class=\"gline\" d=\"M 64 84 L 64 116\"/><path class=\"gline\" d=\"M 67 84 L 67 116\"/><path class=\"gline\" d=\"M 70 84 L 70 116\"/><path class=\"gline\" d=\"M 73 84 L 73 116\"/><path class=\"gline\" d=\"M 76 84 L 76 116\"/><path class=\"gline\" d=\"M 79 84 L 79 116\"/><rect x=\"34\" y=\"84\" width=\"3\" height=\"32\" style=\"fill:var(--amber);stroke:var(--amber)\"/><path class=\"aux\" d=\"M 34 126 L 37 126\"/><text class=\"slabel r\" x=\"68.7\" y=\"142\" text-anchor=\"middle\">one unit costs 0.75<\/text><text class=\"slabel\" x=\"170\" y=\"176\" text-anchor=\"middle\">12 dollars &divide; 16 units<\/text><text class=\"slabel b\" x=\"170\" y=\"194\" text-anchor=\"middle\">0.75 dollars a unit<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Unit price&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"arith","fm":[]},"tk_eq":{"title":"Equations and systems","tag":"Algebra","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Solving a linear equation.<\/b>","rest":"Strip the equation down in the order it was built up &mdash; undo the addition first, then undo the multiplication.","f":"ax + b = c &nbsp;&rarr;&nbsp; x = (c &minus; b) &divide; a","eg":"3x + 4 = 10 gives 3x = 6, so x = 2.","trap":"Dividing by a is only legal when a is not zero. Slide a to 0 and the equation stops being about x at all &mdash; it becomes a claim about numbers that is either always true or never true.","fmn":"Solving a linear equation"},{"lead":"<b>Solving a proportion.<\/b>","rest":"Cross-multiply: the product of one diagonal equals the product of the other, which turns a fraction equation into one multiplication.","f":"a &divide; b = c &divide; x &nbsp;&rarr;&nbsp; x = bc &divide; a","eg":"3 &divide; 4 = 15 &divide; x cross-multiplies to 3x = 60, so x = 20.","trap":"Cross-multiplying works down the diagonals, not across the tops. Writing ax = bc as ac = bx swaps two of the four terms and gives a different answer every time a is not equal to c.","fmn":"Solving a proportion"},{"lead":"<b>System of two linear equations.<\/b>","rest":"Two lines, one crossing point &mdash; eliminate one letter by scaling one equation until its coefficient matches the other, then subtract.","f":"2x + 4y = c<sub>1<\/sub>, &nbsp; ax + 2y = c<sub>2<\/sub>","eg":"2x + 4y = 12 and 3x + 2y = 10 give x = 2 and y = 2.","trap":"Two equations do not always pin down two unknowns. Slide a to 1 and the second equation becomes half the first: the lines are parallel, and either nothing satisfies both or everything on one line does. Check whether one equation is a multiple of the other before you start eliminating.","fmn":"System of two linear equations"},{"lead":"<b>Adding algebraic fractions.<\/b>","rest":"Each numerator picks up whatever its own denominator was missing, and the new denominator is the product of the two.","f":"a &divide; x + b &divide; (x + 2) = (a(x + 2) + bx) &divide; (x(x + 2))","eg":"3/x + 2/(x + 2) at x = 4 is (3(6) + 2(4)) &divide; 24 = 26/24, about 1.083.","trap":"The common denominator is x(x + 2), not x + 2 and not 2x + 2. And every term in the numerator must be multiplied out before anything is cancelled &mdash; x does not cancel between the x in a(x + 2) and the x on the bottom. Two values of x, 0 and &minus;2, are barred outright.","fmn":"Adding algebraic fractions"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 320 200\"><path class=\"gline\" d=\"M 24 93 L 300 93\"/><path class=\"gline\" d=\"M 162 22 L 162 164\"/><path class=\"gline\" d=\"M 24 90 L 24 96\"/><path class=\"gline\" d=\"M 70 90 L 70 96\"/><path class=\"gline\" d=\"M 116 90 L 116 96\"/><path class=\"gline\" d=\"M 208 90 L 208 96\"/><path class=\"gline\" d=\"M 254 90 L 254 96\"/><path class=\"gline\" d=\"M 300 90 L 300 96\"/><path class=\"gline\" d=\"M 159 140.3 L 165 140.3\"/><path class=\"gline\" d=\"M 159 116.7 L 165 116.7\"/><path class=\"gline\" d=\"M 159 69.3 L 165 69.3\"/><path class=\"gline\" d=\"M 159 45.7 L 165 45.7\"/><path style=\"fill:none;stroke:var(--green);stroke-width:2;stroke-dasharray:6 4\" d=\"M 24 63.4 L 300 63.4\"/><path style=\"fill:none;stroke:var(--blue);stroke-width:2\" d=\"M 54.7 164 L 238.7 22\"/><circle class=\"handle\" cx=\"162\" cy=\"81.2\" r=\"3.5\"/><text class=\"slabel b\" x=\"168\" y=\"75.2\">b = 4<\/text><path class=\"aux\" d=\"M 185 63.4 L 185 93\"/><circle class=\"handle\" cx=\"185\" cy=\"63.4\" r=\"5\"/><text class=\"slabel b\" x=\"24\" y=\"13\">y = 3x + 4<\/text><text class=\"slabel g\" x=\"300\" y=\"13\" text-anchor=\"end\">y = 10<\/text><text class=\"slabel\" x=\"162\" y=\"191\" text-anchor=\"middle\">they cross at x = 2<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Solving a linear equation&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"alg","fm":[]},"tk_sq":{"title":"Squares and factoring","tag":"Algebra","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Square of a sum.<\/b>","rest":"Squaring a sum is not squaring the two pieces &mdash; the cross term 2ab is the rectangle you cut off if you forget it.","f":"(a + b)<sup>2<\/sup> = a<sup>2<\/sup> + 2ab + b<sup>2<\/sup>","eg":"(7 + 3)&sup2; = 49 + 42 + 9 = 100, which is 10&sup2; as it must be.","trap":"(a + b)&sup2; is never a&sup2; + b&sup2;. The gap between them is exactly 2ab, and 2ab is larger than either square whenever a and b are close together.","fmn":"Square of a sum"},{"lead":"<b>Square of a difference.<\/b>","rest":"The same identity as the square of a sum with b made negative &mdash; only the middle term changes sign, and the result is never negative.","f":"(a &minus; b)<sup>2<\/sup> = a<sup>2<\/sup> &minus; 2ab + b<sup>2<\/sup>","eg":"(9 &minus; 4)&sup2; = 81 &minus; 72 + 16 = 25, which is 5&sup2;.","trap":"The last term is +b&sup2;, not &minus;b&sup2;. Two minus signs are being multiplied there. Push b past a and watch the answer climb again &mdash; a square cannot go below zero.","fmn":"Square of a difference"},{"lead":"<b>Difference of two squares.<\/b>","rest":"A subtraction of two squares always splits into a sum times a difference, which turns a hard subtraction into two easy multiplications.","f":"a<sup>2<\/sup> &minus; b<sup>2<\/sup> = (a + b)(a &minus; b)","eg":"9&sup2; &minus; 4&sup2; = (9 + 4)(9 &minus; 4) = 13 &times; 5 = 65.","trap":"There is no matching split for a&sup2; + b&sup2; over the real numbers. A sum of two squares does not factor. The cubes do split &mdash; a&sup3; &minus; b&sup3; = (a &minus; b)(a&sup2; + ab + b&sup2;) &mdash; but the quadratic piece there is a sum, not a difference.","fmn":"Difference of two squares"},{"lead":"<b>Factoring a quadratic.<\/b>","rest":"Look for the pair of numbers that multiplies to the constant and adds to the middle coefficient &mdash; the constant is the stronger clue, so list its factor pairs first.","f":"x<sup>2<\/sup> + Bx + C = (x + p)(x + q), &nbsp; p + q = B, &nbsp; pq = C","eg":"x&sup2; + 7x + 12 wants a pair multiplying to 12 and adding to 7 &mdash; 3 and 4 &mdash; giving (x + 3)(x + 4).","trap":"The roots are the negatives of p and q. (x + 3)(x + 4) is zero at x = &minus;3 and x = &minus;4, not at 3 and 4. Slide C below zero and the pair must have opposite signs, which is the case people mis-sign most often.","fmn":"Factoring a quadratic"},{"lead":"<b>Completing the square.<\/b>","rest":"Half the coefficient of x, squared, is exactly what the perfect square wants &mdash; so add it inside and subtract it outside, and nothing has changed but the shape.","f":"x<sup>2<\/sup> + bx + c = (x + <sup>b<\/sup>&frasl;<sub>2<\/sub>)<sup>2<\/sup> &minus; <sup>b<sup>2<\/sup><\/sup>&frasl;<sub>4<\/sub> + c","eg":"x<sup>2<\/sup> + 6x + 5: half of 6 is 3, and 3<sup>2<\/sup> is 9, so it is (x + 3)<sup>2<\/sup> &minus; 9 + 5 = (x + 3)<sup>2<\/sup> &minus; 4. The least value is &minus;4, reached at x = &minus;3.","trap":"Halve b <em>before<\/em> squaring, not after. And the number you subtract outside is b<sup>2<\/sup>&divide;4, not b&divide;2 &mdash; the square you added inside is worth (b&divide;2)<sup>2<\/sup>, so that is what has to come back off.","fmn":"Completing the square"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 300 200\"><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.5\" x=\"70\" y=\"26\" width=\"91\" height=\"91\"/><rect style=\"fill:var(--amber-wash);stroke:var(--amber);stroke-width:1.5\" x=\"161\" y=\"26\" width=\"39\" height=\"91\"/><rect style=\"fill:var(--amber-wash);stroke:var(--amber);stroke-width:1.5\" x=\"70\" y=\"117\" width=\"91\" height=\"39\"/><rect style=\"fill:var(--red-wash);stroke:var(--red);stroke-width:1.5\" x=\"161\" y=\"117\" width=\"39\" height=\"39\"/><text class=\"slabel\" x=\"115.5\" y=\"75.5\" text-anchor=\"middle\">a&sup2;<\/text><text class=\"slabel\" x=\"180.5\" y=\"140.5\" text-anchor=\"middle\">b&sup2;<\/text><text class=\"slabel a\" x=\"180.5\" y=\"75.5\" text-anchor=\"middle\">ab<\/text><text class=\"slabel a\" x=\"115.5\" y=\"140.5\" text-anchor=\"middle\">ab<\/text><path class=\"gline\" d=\"M 70 22 L 70 24 M 161 22 L 161 24 M 200 22 L 200 24\"/><text class=\"slabel b\" x=\"115.5\" y=\"18\" text-anchor=\"middle\">a = 7<\/text><text class=\"slabel a\" x=\"180.5\" y=\"18\" text-anchor=\"middle\">b = 3<\/text><text class=\"slabel b\" x=\"64\" y=\"75.5\" text-anchor=\"end\">a<\/text><text class=\"slabel a\" x=\"64\" y=\"140.5\" text-anchor=\"end\">b<\/text><text class=\"slabel\" x=\"150\" y=\"176\" text-anchor=\"middle\">(a + b)&sup2; = 100<\/text><text class=\"slabel\" x=\"150\" y=\"192\" text-anchor=\"middle\">49 + 42 + 9<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Square of a sum&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"alg","fm":[]},"tk_roots":{"title":"The roots of a quadratic","tag":"Algebra","say":"","note":"","tries":[],"ideas":[{"lead":"<b>The quadratic formula.<\/b>","rest":"The formula that solves every quadratic, whether or not it factors &mdash; use it when the factor pair refuses to appear.","f":"x = (&minus;b &plusmn; &radic;(b<sup>2<\/sup> &minus; 4ac)) &divide; 2a","eg":"For x&sup2; &minus; 5x + 6 the discriminant is 25 &minus; 24 = 1, so x = (5 &plusmn; 1) &divide; 2, giving 3 and 2.","trap":"The &minus;b covers the whole numerator and the 2a covers the whole fraction. Writing &minus;b &plusmn; &radic;(&hellip;) &divide; 2a without brackets divides only the root by 2a. Slide a to 0 and the formula dies &mdash; there is no 2a to divide by.","fmn":"The quadratic formula"},{"lead":"<b>The discriminant.<\/b>","rest":"One number that counts the real roots before you find any of them: positive means two, zero means one, negative means none.","f":"D = b<sup>2<\/sup> &minus; 4ac","eg":"For x&sup2; + 4x + 3 the discriminant is 16 &minus; 12 = 4 &mdash; positive and a perfect square, so two rational roots.","trap":"4ac carries its own sign. When c is negative, &minus;4ac adds to b&sup2; and the discriminant is forced positive, so a quadratic with a negative constant always has two real roots. Slide c up through the point where D hits zero and watch two roots collapse into one, then vanish.","fmn":"The discriminant"},{"lead":"<b>Sum and product of the roots.<\/b>","rest":"The two roots can be read straight off the coefficients, which answers most questions about them without solving anything.","f":"sum = &minus;b &divide; a, &nbsp;&nbsp; product = c &divide; a","eg":"2x&sup2; &minus; 6x + 4 has sum 6 &divide; 2 = 3 and product 4 &divide; 2 = 2 &mdash; the roots are 1 and 2.","trap":"The sum carries a minus sign and the product does not. And both are divided by a, not by 1: doubling every coefficient leaves the roots alone, but forgetting the a turns 2x&sup2; &minus; 6x + 4 into a sum of 6 instead of 3.","fmn":"Sum and product of the roots"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 320 200\"><path class=\"gline\" d=\"M 24 95 L 300 95\"/><path class=\"gline\" d=\"M 162 22 L 162 168\"/><path class=\"gline\" d=\"M 43.7 92 L 43.7 98\"/><path class=\"gline\" d=\"M 83.1 92 L 83.1 98\"/><path class=\"gline\" d=\"M 122.6 92 L 122.6 98\"/><path class=\"gline\" d=\"M 201.4 92 L 201.4 98\"/><path class=\"gline\" d=\"M 240.9 92 L 240.9 98\"/><path class=\"gline\" d=\"M 280.3 92 L 280.3 98\"/><path class=\"gline\" d=\"M 159 149.8 L 165 149.8\"/><path class=\"gline\" d=\"M 159 131.5 L 165 131.5\"/><path class=\"gline\" d=\"M 159 113.3 L 165 113.3\"/><path class=\"gline\" d=\"M 159 76.8 L 165 76.8\"/><path class=\"gline\" d=\"M 159 58.5 L 165 58.5\"/><path class=\"gline\" d=\"M 159 40.3 L 165 40.3\"/><path style=\"fill:none;stroke:var(--blue);stroke-width:2\" d=\" M 122.6 22 L 124.5 25.2 L 126.5 28.4 L 128.5 31.5 L 130.5 34.6 L 132.4 37.5 L 134.4 40.4 L 136.4 43.2 L 138.3 45.9 L 140.3 48.6 L 142.3 51.2 L 144.3 53.7 L 146.2 56.2 L 148.2 58.5 L 150.2 60.8 L 152.1 63.1 L 154.1 65.2 L 156.1 67.3 L 158.1 69.3 L 160 71.2 L 162 73.1 L 164 74.9 L 165.9 76.6 L 167.9 78.2 L 169.9 79.8 L 171.9 81.3 L 173.8 82.7 L 175.8 84.1 L 177.8 85.4 L 179.7 86.6 L 181.7 87.7 L 183.7 88.8 L 185.7 89.7 L 187.6 90.7 L 189.6 91.5 L 191.6 92.3 L 193.5 93 L 195.5 93.6 L 197.5 94.1 L 199.5 94.6 L 201.4 95 L 203.4 95.3 L 205.4 95.6 L 207.3 95.8 L 209.3 95.9 L 211.3 95.9 L 213.3 95.9 L 215.2 95.8 L 217.2 95.6 L 219.2 95.3 L 221.1 95 L 223.1 94.6 L 225.1 94.1 L 227.1 93.6 L 229 93 L 231 92.3 L 233 91.5 L 234.9 90.7 L 236.9 89.7 L 238.9 88.8 L 240.9 87.7 L 242.8 86.6 L 244.8 85.4 L 246.8 84.1 L 248.7 82.7 L 250.7 81.3 L 252.7 79.8 L 254.7 78.2 L 256.6 76.6 L 258.6 74.9 L 260.6 73.1 L 262.5 71.2 L 264.5 69.3 L 266.5 67.3 L 268.5 65.2 L 270.4 63.1 L 272.4 60.8 L 274.4 58.5 L 276.3 56.2 L 278.3 53.7 L 280.3 51.2 L 282.3 48.6 L 284.2 45.9 L 286.2 43.2 L 288.2 40.4 L 290.1 37.5 L 292.1 34.6 L 294.1 31.5 L 296.1 28.4 L 298 25.2 L 300 22\"/><path class=\"aux\" d=\"M 211.3 22 L 211.3 168\"/><circle class=\"handle\" cx=\"201.4\" cy=\"95\" r=\"5\"/><circle class=\"handle\" cx=\"221.1\" cy=\"95\" r=\"5\"/><text class=\"slabel b\" x=\"24\" y=\"13\">y = 1x&sup2; &minus; 5x + 6<\/text><text class=\"slabel\" x=\"162\" y=\"191\" text-anchor=\"middle\">D = 1, roots 2 and 3<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;The quadratic formula&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"alg","fm":[]},"tk_pow":{"title":"Powers and roots","tag":"Algebra","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Multiplying and dividing powers.<\/b>","rest":"Same base, so the exponents do the arithmetic: multiplying adds them, dividing subtracts them.","f":"a<sup>m<\/sup> &middot; a<sup>n<\/sup> = a<sup>m+n<\/sup>, &nbsp;&nbsp; a<sup>m<\/sup> &divide; a<sup>n<\/sup> = a<sup>m&minus;n<\/sup>","eg":"2&#8309; &middot; 2&sup3; = 2&#8312; = 256, while 2&#8309; &divide; 2&sup3; = 2&sup2; = 4.","trap":"These rules need the <em>same base<\/em>. 2&sup3; &middot; 3&sup2; is not 6&#8309; and not 5&#8309;. Set m equal to n and the quotient becomes a<sup>0<\/sup> = 1, which is where the zero exponent comes from in the first place.","fmn":"Multiplying and dividing powers"},{"lead":"<b>Power of a power.<\/b>","rest":"A power raised to a power multiplies the exponents, because you are writing out m copies of the base n times over.","f":"(a<sup>m<\/sup>)<sup>n<\/sup> = a<sup>mn<\/sup>","eg":"(3&sup2;)&sup3; = 3&#8310; = 729 &mdash; not 3&#8309;, and not 9&sup3; written as 9 to the power 3 by accident.","trap":"Multiply the exponents here, add them only when the powers sit side by side. (a<sup>2<\/sup>)<sup>3<\/sup> = a<sup>6<\/sup> but a<sup>2<\/sup> &middot; a<sup>3<\/sup> = a<sup>5<\/sup>. Make one exponent negative and the product flips sign, sending the whole thing below 1.","fmn":"Power of a power"},{"lead":"<b>Negative and zero exponents.<\/b>","rest":"A negative exponent is not a negative number &mdash; it is an instruction to turn the power upside down.","f":"a<sup>&minus;n<\/sup> = 1 &divide; a<sup>n<\/sup>, &nbsp;&nbsp; a<sup>0<\/sup> = 1","eg":"4<sup>&minus;3<\/sup> = 1 &divide; 4&sup3; = 1/64, and 4<sup>0<\/sup> = 1.","trap":"4<sup>&minus;3<\/sup> is 1/64, not &minus;64 and not &minus;1/64. The sign of the exponent says which way up, never which side of zero. Slide n to 0 and every base except 0 collapses to 1.","fmn":"Negative and zero exponents"},{"lead":"<b>Fractional exponents.<\/b>","rest":"The bottom of the fraction is the root and the top is the power &mdash; take the root first and the numbers stay small.","f":"a<sup>m/n<\/sup> = <sup>n<\/sup>&radic;(a<sup>m<\/sup>)","eg":"8<sup>2/3<\/sup> is the cube root of 8, which is 2, then squared: 4.","trap":"The denominator is the root, not the power. 8<sup>2/3<\/sup> is 4, not 8&sup2; &divide; 3 and not 8 &divide; 3 squared. Drag a below zero with an even n and the expression stops existing in the real numbers &mdash; an odd n survives it.","fmn":"Fractional exponents"},{"lead":"<b>Multiplying and dividing radicals.<\/b>","rest":"Roots pass straight through multiplication and division, which is what lets you pull perfect squares out and shrink the surd.","f":"&radic;a &middot; &radic;b = &radic;(ab), &nbsp;&nbsp; &radic;a &divide; &radic;b = &radic;(a &divide; b)","eg":"&radic;8 &middot; &radic;2 = &radic;16 = 4, and &radic;8 &divide; &radic;2 = &radic;4 = 2.","trap":"No such rule exists for addition. &radic;9 + &radic;16 is 3 + 4 = 7, not &radic;25 = 5. Multiplication and division pass through the root sign; addition and subtraction never do.","fmn":"Multiplying and dividing radicals"},{"lead":"<b>Rationalising a denominator.<\/b>","rest":"Multiply top and bottom by the conjugate &mdash; the same two terms with the sign between them reversed &mdash; and the root disappears from the bottom.","f":"k &divide; (&radic;a + b) = k(&radic;a &minus; b) &divide; (a &minus; b<sup>2<\/sup>)","eg":"6 &divide; (&radic;5 + 2) becomes 6(&radic;5 &minus; 2) &divide; (5 &minus; 4) = 6&radic;5 &minus; 12, about 1.416.","trap":"The conjugate changes only the sign between the terms &mdash; it is &radic;a &minus; b, not &minus;&radic;a &minus; b. And multiply the numerator by it too: multiplying only the bottom changes the value of the fraction.","fmn":"Rationalising a denominator"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 320 200\"><path class=\"gline\" d=\"M 92 34 L 312 34\"/><text class=\"slabel\" x=\"86\" y=\"38\" text-anchor=\"end\">m = 5<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"96\" y=\"17\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"104\" y=\"29\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"114\" y=\"17\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"122\" y=\"29\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"132\" y=\"17\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"140\" y=\"29\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"150\" y=\"17\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"158\" y=\"29\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"168\" y=\"17\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"176\" y=\"29\" text-anchor=\"middle\">2<\/text><path class=\"gline\" d=\"M 92 74 L 312 74\"/><text class=\"slabel\" x=\"86\" y=\"78\" text-anchor=\"end\">n = 3<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"96\" y=\"57\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"104\" y=\"69\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"114\" y=\"57\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"122\" y=\"69\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"132\" y=\"57\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"140\" y=\"69\" text-anchor=\"middle\">2<\/text><path class=\"gline\" d=\"M 92 114 L 312 114\"/><text class=\"slabel\" x=\"86\" y=\"118\" text-anchor=\"end\">m+n = 8<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"96\" y=\"97\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"104\" y=\"109\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"114\" y=\"97\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"122\" y=\"109\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"132\" y=\"97\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"140\" y=\"109\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"150\" y=\"97\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"158\" y=\"109\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"168\" y=\"97\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"176\" y=\"109\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"186\" y=\"97\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"194\" y=\"109\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"204\" y=\"97\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"212\" y=\"109\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"222\" y=\"97\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"230\" y=\"109\" text-anchor=\"middle\">2<\/text><path class=\"gline\" d=\"M 92 154 L 312 154\"/><text class=\"slabel\" x=\"86\" y=\"158\" text-anchor=\"end\">m&minus;n = 2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"96\" y=\"137\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"104\" y=\"149\" text-anchor=\"middle\">2<\/text><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"114\" y=\"137\" width=\"16\" height=\"16\"/><text class=\"slabel\" x=\"122\" y=\"149\" text-anchor=\"middle\">2<\/text><text class=\"slabel\" x=\"20\" y=\"14\">base a = 2<\/text><text class=\"slabel\" x=\"160\" y=\"190\" text-anchor=\"middle\">above the line multiplies, below divides<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Multiplying and dividing powers&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"alg","fm":[]},"tk_abs":{"title":"Absolute value and inequalities","tag":"Algebra","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Absolute value as two cases.<\/b>","rest":"The bars record a distance, so anything the same distance on the far side of zero also qualifies &mdash; every absolute value equation is two equations.","f":"|ax + b| = c &nbsp;&rarr;&nbsp; ax + b = c &nbsp;or&nbsp; ax + b = &minus;c","eg":"|2x &minus; 3| = 7 splits into 2x &minus; 3 = 7 and 2x &minus; 3 = &minus;7, giving x = 5 and x = &minus;2.","trap":"The second case negates the whole right side, not the x. And drag c below zero: the equation now has no solution at all, because a distance cannot be negative &mdash; solving it anyway is the commonest way to invent a root.","fmn":"Absolute value as two cases"},{"lead":"<b>Multiplying an inequality.<\/b>","rest":"Adding to both sides of an inequality is always safe; multiplying is safe only while the multiplier stays positive.","f":"x &gt; d &nbsp;&rarr;&nbsp; kx &gt; kd if k &gt; 0, &nbsp; kx &lt; kd if k &lt; 0","eg":"From x &gt; 4, multiplying by 3 gives 3x &gt; 12; multiplying by &minus;3 gives &minus;3x &lt; &minus;12.","trap":"The flip is triggered by the sign of the multiplier, not by the sign of x. Drag k down through zero and watch the direction turn over &mdash; and note that at k = 0 the inequality is not flipped but destroyed, which is why you may never divide an inequality by a variable of unknown sign.","fmn":"Multiplying an inequality"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 340 200\"><path class=\"gline\" d=\"M 24 60 L 316 60\"/><path class=\"gline\" d=\"M 35 56 L 35 64\"/><text class=\"slabel\" x=\"35\" y=\"78\" text-anchor=\"middle\">&minus;18<\/text><path class=\"gline\" d=\"M 57.5 56 L 57.5 64\"/><path class=\"gline\" d=\"M 80 56 L 80 64\"/><text class=\"slabel\" x=\"80\" y=\"78\" text-anchor=\"middle\">&minus;12<\/text><path class=\"gline\" d=\"M 102.5 56 L 102.5 64\"/><path class=\"gline\" d=\"M 125 56 L 125 64\"/><text class=\"slabel\" x=\"125\" y=\"78\" text-anchor=\"middle\">&minus;6<\/text><path class=\"gline\" d=\"M 147.5 56 L 147.5 64\"/><path class=\"gline\" d=\"M 170 56 L 170 64\"/><text class=\"slabel\" x=\"170\" y=\"78\" text-anchor=\"middle\">0<\/text><path class=\"gline\" d=\"M 192.5 56 L 192.5 64\"/><path class=\"gline\" d=\"M 215 56 L 215 64\"/><text class=\"slabel\" x=\"215\" y=\"78\" text-anchor=\"middle\">6<\/text><path class=\"gline\" d=\"M 237.5 56 L 237.5 64\"/><path class=\"gline\" d=\"M 260 56 L 260 64\"/><text class=\"slabel\" x=\"260\" y=\"78\" text-anchor=\"middle\">12<\/text><path class=\"gline\" d=\"M 282.5 56 L 282.5 64\"/><path class=\"gline\" d=\"M 305 56 L 305 64\"/><text class=\"slabel\" x=\"305\" y=\"78\" text-anchor=\"middle\">18<\/text><text class=\"slabel\" x=\"24\" y=\"26\">the ax + b line<\/text><path class=\"aux\" d=\"M 117.5 44 L 222.5 44\"/><circle class=\"handle\" cx=\"222.5\" cy=\"60\" r=\"5\"/><circle class=\"handle\" cx=\"117.5\" cy=\"60\" r=\"5\"/><text class=\"slabel r\" x=\"170\" y=\"40\" text-anchor=\"middle\">both are 7 from 0<\/text><path class=\"gline\" d=\"M 24 140 L 316 140\"/><path class=\"gline\" d=\"M 35 136 L 35 144\"/><path class=\"gline\" d=\"M 62 136 L 62 144\"/><text class=\"slabel\" x=\"62\" y=\"158\" text-anchor=\"middle\">&minus;20<\/text><path class=\"gline\" d=\"M 89 136 L 89 144\"/><path class=\"gline\" d=\"M 116 136 L 116 144\"/><text class=\"slabel\" x=\"116\" y=\"158\" text-anchor=\"middle\">&minus;10<\/text><path class=\"gline\" d=\"M 143 136 L 143 144\"/><path class=\"gline\" d=\"M 170 136 L 170 144\"/><text class=\"slabel\" x=\"170\" y=\"158\" text-anchor=\"middle\">0<\/text><path class=\"gline\" d=\"M 197 136 L 197 144\"/><path class=\"gline\" d=\"M 224 136 L 224 144\"/><text class=\"slabel\" x=\"224\" y=\"158\" text-anchor=\"middle\">10<\/text><path class=\"gline\" d=\"M 251 136 L 251 144\"/><path class=\"gline\" d=\"M 278 136 L 278 144\"/><text class=\"slabel\" x=\"278\" y=\"158\" text-anchor=\"middle\">20<\/text><path class=\"gline\" d=\"M 305 136 L 305 144\"/><text class=\"slabel\" x=\"24\" y=\"106\">the x line<\/text><path class=\"aux\" d=\"M 178.1 124 L 178.1 156\"/><circle class=\"handle\" cx=\"197\" cy=\"140\" r=\"5\"/><circle class=\"handle\" cx=\"159.2\" cy=\"140\" r=\"5\"/><text class=\"slabel b\" x=\"170\" y=\"192\" text-anchor=\"middle\">x = 5 or x = &minus;2<\/text><text class=\"slabel\" x=\"316\" y=\"26\" text-anchor=\"end\">a = 2, b = &minus;3<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Absolute value as two cases&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"alg","fm":[]},"tk_seq":{"title":"Sequences","tag":"Algebra","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Arithmetic sequence, nth term.<\/b>","rest":"You take d steps to get from one term to the next, and there are n &minus; 1 steps between the first term and the nth &mdash; one fewer than the count of terms.","f":"a<sub>n<\/sub> = a<sub>1<\/sub> + (n &minus; 1)d","eg":"Starting at 4 and adding 3 each time, the 10th term is 4 + 9(3) = 31.","trap":"It is (n &minus; 1)d, not nd. The first term has taken no steps yet. Using nd shifts every answer by exactly one d, which is the single most common sequence error and is invisible unless you test it on n = 1.","fmn":"Arithmetic sequence, nth term"},{"lead":"<b>Sum of an arithmetic sequence.<\/b>","rest":"The average of the first and last term, multiplied by how many terms there are &mdash; the terms pair off around the middle.","f":"S<sub>n<\/sub> = (n &divide; 2)(2a<sub>1<\/sub> + (n &minus; 1)d)","eg":"3, 7, 11, &hellip; for 8 terms ends at 31, so the sum is 4 &times; 34 = 136.","trap":"n is the count of terms, not the last term. For 3, 7, 11, &hellip;, 31 the count is 8, not 31. Count with (last &minus; first) &divide; d + 1 before you use this formula, and note that a negative d can drive the sum below zero even though it starts positive.","fmn":"Sum of an arithmetic sequence"},{"lead":"<b>Geometric sequence, nth term.<\/b>","rest":"Each term is the one before it multiplied by a fixed ratio, so the exponent counts the multiplications, one fewer than the term number.","f":"a<sub>n<\/sub> = a<sub>1<\/sub> &middot; r<sup>n&minus;1<\/sup>","eg":"3, 6, 12, &hellip; has r = 2, so the 6th term is 3 &times; 2&#8309; = 96.","trap":"The exponent is n &minus; 1, not n. Also watch the ratio cross 1: above it the terms run away, below it they die out, and at a negative r they alternate sign, so the 6th term and the 7th term of the same sequence can sit on opposite sides of zero.","fmn":"Geometric sequence, nth term"},{"lead":"<b>Sum of a geometric sequence.<\/b>","rest":"One formula for the whole run; when the ratio is between &minus;1 and 1 the tail dies away and an endless sum settles on a<sub>1<\/sub> &divide; (1 &minus; r).","f":"S<sub>n<\/sub> = a<sub>1<\/sub>(1 &minus; r<sup>n<\/sup>) &divide; (1 &minus; r)","eg":"4, 2, 1, 0.5, 0.25 sums to 4(1 &minus; 0.03125) &divide; 0.5 = 7.75, and the endless version would reach 8.","trap":"The infinite version only exists while the size of r is under 1. Slide r up to 1 and the formula itself divides by zero &mdash; the sum is n &times; a<sub>1<\/sub> there. Above 1 the terms grow, and quoting a<sub>1<\/sub> &divide; (1 &minus; r) then returns a negative total for a sum of positive numbers.","fmn":"Sum of a geometric sequence"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 340 200\"><path class=\"gline\" d=\"M 24 158 L 278 158\"/><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"33.9\" y=\"143.5\" width=\"16.3\" height=\"14.5\"/><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"57.9\" y=\"132.7\" width=\"16.3\" height=\"25.3\"/><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"81.9\" y=\"121.9\" width=\"16.3\" height=\"36.1\"/><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"105.9\" y=\"111\" width=\"16.3\" height=\"47\"/><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"129.9\" y=\"100.2\" width=\"16.3\" height=\"57.8\"/><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"153.9\" y=\"89.4\" width=\"16.3\" height=\"68.6\"/><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"177.9\" y=\"78.5\" width=\"16.3\" height=\"79.5\"/><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"201.9\" y=\"67.7\" width=\"16.3\" height=\"90.3\"/><rect style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:1.2\" x=\"225.9\" y=\"56.8\" width=\"16.3\" height=\"101.2\"/><rect style=\"fill:var(--amber-wash);stroke:var(--amber);stroke-width:1.2\" x=\"249.9\" y=\"46\" width=\"16.3\" height=\"112\"/><path class=\"aux\" d=\"M 42 143.5 L 66 143.5 L 66 132.7\"/><text class=\"slabel r\" x=\"66\" y=\"32\" text-anchor=\"middle\">d = 3<\/text><text class=\"slabel a\" x=\"258\" y=\"40\" text-anchor=\"middle\">31<\/text><text class=\"slabel\" x=\"20\" y=\"16\">a1 = 4,  d = 3,  n = 10<\/text><text class=\"slabel b\" x=\"170\" y=\"192\" text-anchor=\"middle\">9 steps of d land on 31<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Arithmetic sequence, nth term&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"alg","fm":[]},"tk_fn":{"title":"Functions and variation","tag":"Algebra","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Function notation.<\/b>","rest":"f(x) is not f times x &mdash; it is an instruction to put whatever sits in the bracket everywhere an x appears in the rule.","f":"f(x) = ax<sup>2<\/sup> + b","eg":"For f(x) = 2x&sup2; &minus; 3, f(3) = 2(9) &minus; 3 = 15.","trap":"f(&minus;x) is not &minus;f(x). Here f(3) and f(&minus;3) are the same number, because the square destroys the sign, while &minus;f(3) is its negative. Substitute into the whole rule, do not distribute a minus sign across the answer.","fmn":"Function notation"},{"lead":"<b>Composition of functions.<\/b>","rest":"Work from the inside out: g acts first, and its output becomes the input to f.","f":"f(g(x)) with f(x) = ax + b and g(x) = x<sup>2<\/sup>","eg":"With f(x) = 2x + 3 and g(x) = x&sup2;: f(g(2)) = f(4) = 11, while g(f(2)) = g(7) = 49.","trap":"Composition is not commutative. f(g(x)) and g(f(x)) are different functions and agree only by accident at particular x values &mdash; drag x and watch the two outputs separate.","fmn":"Composition of functions"},{"lead":"<b>Direct variation.<\/b>","rest":"Two quantities that vary directly hold a fixed ratio: find k once from a known pair, then it prices every other pair.","f":"y = kx, &nbsp; so y<sub>1<\/sub> &divide; x<sub>1<\/sub> = y<sub>2<\/sub> &divide; x<sub>2<\/sub>","eg":"If y = 12 when x = 4 then k = 3, so at x = 10 the value of y is 30.","trap":"Direct variation means the <em>ratio<\/em> is fixed, not the difference. Tripling x triples y; it does not add 3 to y. And a line through (0, 0) is the only kind that varies directly &mdash; y = 3x + 2 does not, however linear it looks.","fmn":"Direct variation"},{"lead":"<b>Inverse variation.<\/b>","rest":"Two quantities that vary inversely hold a fixed product, so whatever one is multiplied by, the other is divided by.","f":"xy = k, &nbsp; so x<sub>1<\/sub>y<sub>1<\/sub> = x<sub>2<\/sub>y<sub>2<\/sub>","eg":"If y = 10 when x = 6 then k = 60, so at x = 4 the value of y is 15.","trap":"Inverse variation is a fixed product, not a fixed sum. Halving x doubles y; it does not subtract from y. Drag the new x toward 0 and y climbs without limit &mdash; the curve never reaches the axis.","fmn":"Inverse variation"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 320 200\"><path class=\"gline\" d=\"M 24 95 L 300 95\"/><path class=\"gline\" d=\"M 162 22 L 162 168\"/><path class=\"gline\" d=\"M 43.7 92 L 43.7 98\"/><path class=\"gline\" d=\"M 83.1 92 L 83.1 98\"/><path class=\"gline\" d=\"M 122.6 92 L 122.6 98\"/><path class=\"gline\" d=\"M 201.4 92 L 201.4 98\"/><path class=\"gline\" d=\"M 240.9 92 L 240.9 98\"/><path class=\"gline\" d=\"M 280.3 92 L 280.3 98\"/><path class=\"gline\" d=\"M 159 168 L 165 168\"/><path class=\"gline\" d=\"M 159 138.8 L 165 138.8\"/><path class=\"gline\" d=\"M 159 109.6 L 165 109.6\"/><path class=\"gline\" d=\"M 159 80.4 L 165 80.4\"/><path class=\"gline\" d=\"M 159 51.2 L 165 51.2\"/><path class=\"gline\" d=\"M 159 22 L 165 22\"/><path style=\"fill:none;stroke:var(--blue);stroke-width:2\" d=\" M 89.1 23.8 L 91 28.1 L 93 32.2 L 95 36.2 L 96.9 40.2 L 98.9 44 L 100.9 47.6 L 102.9 51.2 L 104.8 54.6 L 106.8 58 L 108.8 61.2 L 110.7 64.3 L 112.7 67.3 L 114.7 70.1 L 116.7 72.9 L 118.6 75.5 L 120.6 78 L 122.6 80.4 L 124.5 82.7 L 126.5 84.8 L 128.5 86.9 L 130.5 88.8 L 132.4 90.6 L 134.4 92.3 L 136.4 93.9 L 138.3 95.4 L 140.3 96.7 L 142.3 97.9 L 144.3 99 L 146.2 100 L 148.2 100.9 L 150.2 101.7 L 152.1 102.3 L 154.1 102.8 L 156.1 103.2 L 158.1 103.5 L 160 103.7 L 162 103.8 L 164 103.7 L 165.9 103.5 L 167.9 103.2 L 169.9 102.8 L 171.9 102.3 L 173.8 101.7 L 175.8 100.9 L 177.8 100 L 179.7 99 L 181.7 97.9 L 183.7 96.7 L 185.7 95.4 L 187.6 93.9 L 189.6 92.3 L 191.6 90.6 L 193.5 88.8 L 195.5 86.9 L 197.5 84.8 L 199.5 82.7 L 201.4 80.4 L 203.4 78 L 205.4 75.5 L 207.3 72.9 L 209.3 70.1 L 211.3 67.3 L 213.3 64.3 L 215.2 61.2 L 217.2 58 L 219.2 54.6 L 221.1 51.2 L 223.1 47.6 L 225.1 44 L 227.1 40.2 L 229 36.2 L 231 32.2 L 233 28.1 L 234.9 23.8\"/><path class=\"aux\" d=\"M 221.1 95 L 221.1 51.2 L 162 51.2\"/><circle class=\"handle\" cx=\"221.1\" cy=\"95\" r=\"4\"/><circle class=\"handle\" cx=\"221.1\" cy=\"51.2\" r=\"5\"/><circle class=\"handle\" cx=\"162\" cy=\"51.2\" r=\"4\"/><text class=\"slabel r\" x=\"221.1\" y=\"110\" text-anchor=\"middle\">x = 3<\/text><text class=\"slabel b\" x=\"24\" y=\"13\">y = 2x&sup2; &minus; 3<\/text><text class=\"slabel\" x=\"300\" y=\"13\" text-anchor=\"end\">y runs to 25<\/text><text class=\"slabel\" x=\"162\" y=\"191\" text-anchor=\"middle\">f(3) = 15<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Function notation&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"alg","fm":[]},"tk_pie":{"title":"Pies, shares and counts","tag":"Data Interpretation","say":"","note":"","tries":[],"ideas":[{"lead":"<b>The angle of a pie slice.<\/b>","rest":"A pie turns shares into angles: the whole circle is the total, so every slice takes its own share of 360 degrees.","f":"angle = (part &divide; total) &times; 360&deg;","eg":"A category of 150 out of a total of 600 is a quarter of the pie, so its angle is 90 degrees.","trap":"Slices are compared by angle, never by how far the arc runs round the rim or how much room the label takes. A quarter is 90 degrees whether it is drawn at the top or the bottom.","fmn":"The angle of a pie slice"},{"lead":"<b>A part as a share of the total.<\/b>","rest":"Divide the piece by the whole it came from, then multiply by a hundred; the word <em>of<\/em> always names the denominator.","f":"share = (part &divide; total) &times; 100%","eg":"A bar of 120 against a printed total of 800 is 120 &divide; 800 = 15 per cent.","trap":"The denominator is the total the question names, which is often one column rather than the grand total. A share of its own bar and a share of the whole chart are different numbers.","fmn":"A part as a share of the total"},{"lead":"<b>A percent of a percent.<\/b>","rest":"Two nested shares multiply: a slice of a slice is smaller than either of them, and the second percent is taken of the first, never of the grand total.","f":"combined share = (a% &times; b%) &divide; 100","eg":"Thirty per cent of a category that is 40 per cent of the whole is 12 per cent of the whole &mdash; 108 out of a total of 900.","trap":"The two percents multiply. They never add and they never average, and the second one is a share of the category, so it can never be applied to the grand total directly.","fmn":"A percent of a percent"},{"lead":"<b>A count from a printed percent.<\/b>","rest":"When the chart prints shares and the question wants people, the total is the bridge between the two.","f":"count = (percent &divide; 100) &times; total","eg":"Thirty-five per cent of a total of 800 is 0.35 &times; 800 = 280.","trap":"The percent belongs to one particular total. Applying a share printed for one year to a different year's total is the single most common error in a two-chart question.","fmn":"A count from a printed percent"},{"lead":"<b>A count from a slice angle.<\/b>","rest":"Reading a pie backwards: measure the angle, turn it into a share of the circle, and apply that share to the printed total.","f":"count = (angle &divide; 360) &times; total","eg":"A slice of 90 degrees on a pie representing 800 people covers 800 &divide; 4 = 200 people.","trap":"The total applied must be the total this pie represents. Two pies of the same size on one page almost never stand for the same number of people.","fmn":"A count from a slice angle"},{"lead":"<b>The total behind a part and its percent.<\/b>","rest":"When only one bar and its share are printed, the grand total is that bar divided by its share.","f":"total = part &divide; (percent &divide; 100)","eg":"A part of 30 that is 20 per cent of the whole comes from a total of 30 &divide; 0.2 = 150.","trap":"Divide by the share; do not multiply by it. Multiplying 30 by 0.2 gives 6, which is a fifth of the part rather than the whole it came from.","fmn":"The total behind a part and its percent"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 300 200\"><circle class=\"gline\" style=\"fill:none\" cx=\"150\" cy=\"98\" r=\"66\"/><path class=\"shape\" d=\"M 150 98 L 150 32 A 66 66 0 0 1 216 98 Z\"/><path class=\"arcline\" d=\"M 150 72 A 26 26 0 0 1 176 98\"/><line class=\"gline\" x1=\"150\" y1=\"98\" x2=\"150\" y2=\"32\"/><line class=\"gline\" x1=\"150\" y1=\"98\" x2=\"216\" y2=\"98\"/><text class=\"slabel b\" x=\"183.6\" y=\"68.4\" text-anchor=\"middle\">p = 150<\/text><text class=\"slabel a\" x=\"150\" y=\"16\" text-anchor=\"middle\">angle = 90&deg;<\/text><text class=\"slabel\" x=\"150\" y=\"186\" text-anchor=\"middle\">T = 600 fills the whole circle<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;The angle of a pie slice&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"di","fm":[]},"tk_bars":{"title":"Bars, tables and overlaps","tag":"Data Interpretation","say":"","note":"","tries":[],"ideas":[{"lead":"<b>Percent change between two bars.<\/b>","rest":"Every percent change is measured against the earlier figure, so the base is always the bar you started from.","f":"% change = (new &minus; old) &divide; old &times; 100","eg":"A bar rising from 40 to 60 is a change of 20 &divide; 40 = 50 per cent.","trap":"Rises and falls between the same pair of bars are not the same size. Forty up to sixty is a 50 per cent rise; sixty back down to forty is a 33 per cent fall, because the base has changed.","fmn":"Percent change between two bars"},{"lead":"<b>One bar as a multiple of another.<\/b>","rest":"How many times as large is a division; how much larger is that same division after one whole is taken off.","f":"times as large = A &divide; B","eg":"A bar of 150 beside a bar of 50 is 3 times as large, which is the same fact as 200 per cent greater.","trap":"A multiple and a percent increase differ by exactly one whole. Three times as large is a 200 per cent rise, not a 300 per cent rise.","fmn":"One bar as a multiple of another"},{"lead":"<b>Percentage points against per cent.<\/b>","rest":"When the chart itself is printed in percentages, a movement has two honest sizes and they are measured in different units.","f":"points = p<sub>2<\/sub> &minus; p<sub>1<\/sub> &nbsp;&middot;&nbsp; % change = (p<sub>2<\/sub> &minus; p<sub>1<\/sub>) &divide; p<sub>1<\/sub> &times; 100","eg":"A share moving from 4 per cent to 6 per cent has risen by 2 points and by 50 per cent. Both statements are true.","trap":"Percentage points and per cent are different units. That same move supports the sentence &ldquo;rose by 50 per cent&rdquo; and refutes the sentence &ldquo;rose by 2 per cent&rdquo;.","fmn":"Percentage points against per cent"},{"lead":"<b>A band from two cumulative figures.<\/b>","rest":"A cumulative column already contains everyone below its cut-off, so a single band is the difference between two of those running totals.","f":"band = F(upper) &minus; F(lower)","eg":"If 300 people earn under 60 and 120 earn under 40, then 180 earn between 40 and 60.","trap":"Subtract the two running totals, never the two band counts. And read whether the cut-off says &ldquo;fewer than&rdquo; or &ldquo;at most&rdquo; &mdash; one of them includes the boundary group and the other does not.","fmn":"A band from two cumulative figures"},{"lead":"<b>A total from a table of categories.<\/b>","rest":"A table's total is each row's count times that row's value, added down the column &mdash; a weighted total, never a count times an average.","f":"total = n<sub>1<\/sub>v<sub>1<\/sub> + n<sub>2<\/sub>v<sub>2<\/sub> + n<sub>3<\/sub>v<sub>3<\/sub>","eg":"Ten items at 5, twenty at 8 and six at 12 total 50 + 160 + 72 = 282.","trap":"Multiplying the overall count by the average unit value is right only when every row holds the same count. Take the three products first, then add.","fmn":"A total from a table of categories"},{"lead":"<b>The union of two categories.<\/b>","rest":"Adding two categories counts everyone in both of them twice, so the overlap comes off exactly once.","f":"|A or B| = |A| + |B| &minus; |both|","eg":"Sixty read the paper, forty-five listen to radio, twenty do both: 60 + 45 &minus; 20 = 85 do at least one.","trap":"Subtract the overlap once, not twice. Taking it off both categories before adding leaves the shared members out of the count altogether.","fmn":"The union of two categories"},{"lead":"<b>The least possible overlap.<\/b>","rest":"Two categories that together outnumber the population must share the excess, and that excess is the smallest overlap the chart permits.","f":"|both| &ge; |A| + |B| &minus; total","eg":"Out of 100 people, 60 own a car and 75 own a phone, so at least 60 + 75 &minus; 100 = 35 own both.","trap":"This is a floor, not the answer. The true overlap runs from that floor up to the size of the smaller category, and a chart printing only the two totals never pins it down.","fmn":"The least possible overlap"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 300 210\"><line class=\"gline\" x1=\"36\" y1=\"44\" x2=\"36\" y2=\"172\"/><line class=\"gline\" x1=\"36\" y1=\"172\" x2=\"286\" y2=\"172\"/><line class=\"gline\" x1=\"32\" y1=\"172\" x2=\"36\" y2=\"172\"/><text class=\"slabel\" x=\"30\" y=\"176\" text-anchor=\"end\">0<\/text><line class=\"gline\" x1=\"32\" y1=\"112\" x2=\"36\" y2=\"112\"/><text class=\"slabel\" x=\"30\" y=\"116\" text-anchor=\"end\">100<\/text><line class=\"gline\" x1=\"32\" y1=\"52\" x2=\"36\" y2=\"52\"/><text class=\"slabel\" x=\"30\" y=\"56\" text-anchor=\"end\">200<\/text><rect class=\"shape\" x=\"62\" y=\"148\" width=\"52\" height=\"24\"/><rect class=\"shape\" x=\"140\" y=\"136\" width=\"52\" height=\"36\"/><line class=\"aux\" x1=\"56\" y1=\"148\" x2=\"238\" y2=\"148\"/><line class=\"aux\" x1=\"134\" y1=\"136\" x2=\"238\" y2=\"136\"/><line class=\"aux\" x1=\"232\" y1=\"148\" x2=\"232\" y2=\"136\"/><text class=\"slabel r\" x=\"242\" y=\"139\" text-anchor=\"start\">+20<\/text><text class=\"slabel r\" x=\"242\" y=\"153\" text-anchor=\"start\">+50%<\/text><text class=\"slabel\" x=\"88\" y=\"188\" text-anchor=\"middle\">old = 40<\/text><text class=\"slabel\" x=\"166\" y=\"188\" text-anchor=\"middle\">new = 60<\/text><text class=\"slabel r\" x=\"88\" y=\"202\" text-anchor=\"middle\">the base<\/text><\/svg>","tk":1,"cap":"The picture of &ldquo;Percent change between two bars&rdquo;. Every card on this page has its own picture and sliders in chapter 11, Formulas.","sec":"di","fm":[]}}}</script>
<script>
(function(){
  "use strict";
  var D=JSON.parse(document.getElementById("cb-data").textContent);
  var PAGES=D.pages, B=D.boards, LET="ABCD", N=PAGES.length;
  var sheet=document.getElementById("sheet"), pager=document.getElementById("pager"), qz=document.getElementById("qz"), qzp=document.getElementById("qzp");
  var SIZES=["15px","17px","19.5px"], HOST=false;

  function load(k,d){try{var v=JSON.parse(localStorage.getItem(k)||"null");return v==null?d:v;}catch(e){return d;}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
  var KNOW=load("kmf.cb.known",{}); if(typeof KNOW!=="object"||!KNOW)KNOW={};
  var V=load("cb8.view",{}); var st={page:+V.page||0,mode:V.mode==="cover"?"cover":"read",hide:!!V.hide,size:V.size==null?1:+V.size};
  if(!(st.size>=0&&st.size<3))st.size=1;
  var h0=(location.hash||"").match(/^#p(\d+)$/); if(h0&&+h0[1]>=1&&+h0[1]<=N)st.page=+h0[1];
  if(!(st.page>=0&&st.page<=N))st.page=0;
  function keep(){save("cb8.view",{page:st.page,mode:st.mode,hide:st.hide,size:st.size});}

  function ideasOf(P){var out=[];P.boards.forEach(function(bid){B[bid].ideas.forEach(function(x,i){out.push(bid+":"+i);});});return out;}
  function knownIn(P){return ideasOf(P).filter(function(k){return KNOW[k];}).length;}
  function idea(k){var p=k.split(":");return B[p[0]].ideas[+p[1]];}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  pager.innerHTML=PAGES.map(function(P){return '<button type="button" class="pg" data-p="'+P.n+'" title="Page '+P.n+' · '+esc(P.title)+'">'+P.n+'</button>';}).join("");
  function bar(){
    [].forEach.call(pager.children,function(b){var n=+b.getAttribute("data-p"),P=PAGES[n-1];
      if(n===st.page)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");
      b.classList.toggle("done",knownIn(P)===ideasOf(P).length);});
    document.getElementById("tocBtn").setAttribute("aria-pressed",String(st.page===0));
    document.getElementById("modeRead").setAttribute("aria-pressed",String(st.mode==="read"));
    document.getElementById("modeCover").setAttribute("aria-pressed",String(st.mode==="cover"));
    document.getElementById("hideBtn").setAttribute("aria-pressed",String(st.hide));
    sheet.classList.toggle("cover",st.mode==="cover"); sheet.classList.toggle("hideknown",st.hide);
    sheet.style.setProperty("--fs",SIZES[st.size]);
  }

  function toc(){
    var total=0,known=0; PAGES.forEach(function(P){total+=ideasOf(P).length;known+=knownIn(P);});
    var last=+(V.page||0);
    return '<div class="rhead"><span>'+esc(D.title)+'</span><span>Contents</span></div>'
      +'<h1>'+esc(D.title)+'</h1>'
      +'<p class="deck">'+D.blurb+'</p>'
      +'<p class="meta">'+known+' of '+total+' ideas ticked as known</p>'
      +'<ul class="howto">'
      +'<li><b>Read one page a day.</b> Each line is one idea from a board, with its formula beside it.</li>'
      +'<li><b>Explain ▾</b> under an idea opens it in plain words, with a worked example step by step, and links to go deeper.</li>'
      +'<li><b>Cover</b> blurs every formula. Say it out loud, then tap the line to check.</li>'
      +'<li><b>Tick ✓</b> what you know, and <b>Hide ✓</b> leaves only what is left to learn.</li>'
      +'</ul>'
      +(HOST?'<p class="small">Inside KMF Quant, <b>Move the board</b> opens the live board itself, full width, so you can drag it.</p>':'')
      +'<div class="cont"><button type="button" class="btn pri" data-go="'+(last>=1&&last<=N?last:1)+'">'+(last>=1&&last<=N?'Continue at page '+last:'Start at page 1')+' →</button>'
      +'<span class="small">← and → turn the page. On a phone, swipe.</span></div>'
      +'<ol class="toc">'+PAGES.map(function(P){var n=ideasOf(P).length,k=knownIn(P);
        return '<li><button type="button" data-go="'+P.n+'"><span class="no">'+P.n+'</span><span><span class="k">'+esc(P.kicker)+'</span><span class="t">'+esc(P.title)+'</span>'
          +'<span class="bs">'+P.boards.map(function(b){return esc(B[b].title);}).join(" · ")+'</span></span>'
          +'<span class="c">'+n+' ideas'+(k?' · <i>'+k+' ✓</i>':'')+'</span><span class="prog" aria-hidden="true"><i style="width:'+Math.round(100*k/n)+'%"></i></span></button></li>';}).join("")+'</ol>';
  }
  function item(bid,i){
    var x=B[bid].ideas[i], k=bid+":"+i;
    return '<div class="it'+(KNOW[k]?' known':'')+'" data-k="'+k+'">'
      +'<button type="button" class="kn" aria-pressed="'+(KNOW[k]?'true':'false')+'" aria-label="I know this idea" title="I know this">✓</button>'
      +'<button type="button" class="tt" aria-expanded="false">'+x.lead+'</button>'
      +'<div class="fx">'+x.f+'</div>'
      +(x.eg?'<div class="eg"><b>e.g.</b> '+x.eg+'</div>':'')
      +'<button type="button" class="xp" aria-expanded="false">Explain <span aria-hidden="true">▾</span></button>'
      +'</div>';
  }
  function board(bid){
    var b=B[bid];
    return '<section class="board" id="'+bid+'"><div class="bhd"><h2>'+b.title+'</h2><span class="tag">'+esc(b.tag)+'</span>'
      +(b.tk?'':'<button type="button" class="live" data-live="'+bid+'">Move the board ⤢</button>')+'</div>'
      +(b.svg&&b.tk?'<figure class="fig">'+b.svg+'<figcaption>'+b.cap+'</figcaption></figure>':'')
      +(b.svg&&!b.tk?'<figure class="fig">'+b.svg+'<figcaption><span class="off">The board as it opens. In KMF Quant, chapter '+D.chap+', you can drag it.</span><span class="on">The board as it opens. Press <b>Move the board</b> to drag it.</span></figcaption></figure>':'')
      +(b.note?'<div class="carry"><b class="lb">Carry this away</b>'+b.note+'</div>':'')
      +(!b.tk&&b.fm&&b.fm.length?'<p class="fmrow"><b class="lb">Formula cards for this board</b>'+b.fm.map(function(n){return '<button type="button" class="chip" data-fm="'+esc(n)+'">'+esc(n)+'</button>';}).join("")+'<span class="offk">These cards are in KMF Quant, chapter 11.</span></p>':'')
      +b.ideas.map(function(x,i){return item(bid,i);}).join("")
      +(b.tries&&b.tries.length?'<details class="try"><summary>Things to try on the live board ('+b.tries.length+')</summary><ul>'+b.tries.map(function(t){return '<li>'+t+'</li>';}).join("")+'</ul></details>':'')
      +'</section>';
  }
  function page(n){
    var P=PAGES[n-1], all=ideasOf(P), k=knownIn(P);
    var h='<div class="rhead"><span>'+esc(D.title)+'</span><span>'+esc(P.kicker)+'</span></div>'
      +'<h1>'+esc(P.title)+'</h1><p class="deck">'+esc(P.deck)+'</p>'
      +'<p class="meta">'+P.boards.length+' board'+(P.boards.length>1?'s':'')+' · '+all.length+' ideas · '+k+' ticked'+(st.hide&&k?' and hidden':'')+'</p>';
    h+=P.boards.map(board).join("");
    h+='<div class="endmatter"><p>End of page '+n+'. Match each idea to its formula.</p><div class="acts">'
      +'<button type="button" class="btn pri" data-quiz="5">5 questions</button><button type="button" class="btn" data-quiz="all">All '+all.length+'</button></div></div>';
    var prev=n>1?PAGES[n-2]:null, next=n<N?PAGES[n]:null;
    h+='<nav class="foot" aria-label="Turn the page">'
      +'<button type="button" class="nav" data-go="'+(n-1)+'"><b>← '+(prev?'Page '+prev.n:'Contents')+'</b>'+(prev?esc(prev.title):'All '+N+' pages')+'</button>'
      +'<span class="folio">'+n+'</span>'
      +(next?'<button type="button" class="nav next" data-go="'+next.n+'"><b>Page '+next.n+' →</b>'+esc(next.title)+'</button>':'<button type="button" class="nav next" data-go="0"><b>Contents →</b>Back to the start</button>')
      +'</nav>';
    return h;
  }
  function meta(){var m=sheet.querySelector(".meta");if(m&&st.page>0){var P=PAGES[st.page-1],k=knownIn(P);
    m.textContent=P.boards.length+' board'+(P.boards.length>1?'s':'')+' · '+ideasOf(P).length+' ideas · '+k+' ticked'+(st.hide&&k?' and hidden':'');}}
  function render(dir){
    sheet.innerHTML=st.page===0?toc():page(st.page);
    sheet.classList.remove("turn"); void sheet.offsetWidth; sheet.style.setProperty("--dx",(dir||0)<0?"-10px":"10px"); sheet.classList.add("turn");
    bar();
  }
  function go(n){
    n=Math.max(0,Math.min(N,n)); if(n===st.page)return;
    var dir=n>st.page?1:-1; st.page=n; if(n>0)V.page=n; keep(); render(dir);
    try{window.scrollTo(0,0);}catch(e){}
  }
  function setKnown(k,on){
    if(on)KNOW[k]=1;else delete KNOW[k]; save("kmf.cb.known",KNOW);
    var el=sheet.querySelector('.it[data-k="'+k+'"]');
    if(el){el.classList.toggle("known",on);el.querySelector(".kn").setAttribute("aria-pressed",String(on));}
    meta(); bar();
  }

  function panel(k){
    var bid=k.split(":")[0], b=B[bid], x=idea(k), S=(D.secs||{})[b.sec], h='';
    h+='<div class="pp"><b class="lb">In plain words</b>'+(x.plain||x.rest||'')+'</div>';
    if(x.steps&&x.steps.length)h+='<div class="pp"><b class="lb">Worked example, step by step</b><ol class="steps">'+x.steps.map(function(s){return '<li>'+s+'</li>';}).join("")+'</ol></div>';
    else if(x.eg)h+='<div class="pp"><b class="lb">Worked example</b>'+x.eg+'</div>';
    if(x.plain&&x.rest)h+='<div class="pp"><b class="lb">More detail</b>'+x.rest+'</div>';
    if(x.trap)h+='<div class="pp warn"><b class="lb">Watch out</b>'+x.trap+'</div>';
    var go=[];
    if(x.fmn)go.push('<button type="button" class="chip" data-fm="'+esc(x.fmn)+'">Formula card: '+esc(x.fmn)+' ⤢</button>');
    if(!b.tk)go.push('<button type="button" class="chip" data-live="'+bid+'">Move the live board ⤢</button>');
    if(S)go.push('<button type="button" class="chip" data-ch="'+S[0]+'">Practice problems: chapter '+S[1]+', '+esc(S[2])+' ⤢</button>');
    h+='<div class="pp go"><b class="lb">Go deeper</b><span class="onk">'+go.join("")+'</span>'
      +'<span class="offk">In KMF Quant: '+(x.fmn?'the formula card “'+esc(x.fmn)+'” in chapter 11, ':'')+(!b.tk?'the live board in chapter 25, ':'')+(S?'and the practice problems in chapter '+S[1]+', '+esc(S[2])+'.':'')+'</span></div>';
    return h;
  }
  sheet.addEventListener("click",function(e){
    var t=e.target;
    var g=t.closest("[data-go]"); if(g){go(+g.getAttribute("data-go"));return;}
    var q=t.closest("[data-quiz]"); if(q){quiz(q.getAttribute("data-quiz"));return;}
    var lv=t.closest("[data-live]"); if(lv){try{parent.postMessage({kmfcb:lv.getAttribute("data-live")},"*");}catch(err){}return;}
    var fm=t.closest("[data-fm]"); if(fm){try{parent.postMessage({kmffm:fm.getAttribute("data-fm")},"*");}catch(err){}return;}
    var ch=t.closest("[data-ch]"); if(ch){try{parent.postMessage({kmfgo:ch.getAttribute("data-ch")},"*");}catch(err){}return;}
    var it=t.closest(".it"); if(!it)return; var k=it.getAttribute("data-k");
    if(t.closest(".kn")){setKnown(k,!KNOW[k]);return;}
    if(st.mode==="cover"&&!it.classList.contains("shown")&&(t.closest(".fx")||t.closest(".eg")||t.closest(".more"))){it.classList.add("shown");return;}
    if(t.closest(".tt")||t.closest(".fx")||t.closest(".xp")){
      var m=it.querySelector(".more"), b=it.querySelector(".tt"), xb=it.querySelector(".xp");
      if(m){m.remove();it.classList.remove("open");b.setAttribute("aria-expanded","false");xb.setAttribute("aria-expanded","false");return;}
      if(t.closest(".xp"))it.classList.add("shown");
      m=document.createElement("div"); m.className="more"; m.innerHTML=panel(k); it.appendChild(m); it.classList.add("open");
      b.setAttribute("aria-expanded","true"); xb.setAttribute("aria-expanded","true");
    }
  });

  /* ---- the formula check: the idea is the question, its formula is the answer ---- */
  var Q=null;
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),x=a[i];a[i]=a[j];a[j]=x;}return a;}
  function plain(h){var d=document.createElement("div");d.innerHTML=h;return d.textContent.replace(/\s+/g," ").trim();}
  function quiz(how){
    var P=PAGES[st.page-1], pool=shuffle(ideasOf(P).slice());
    if(how!=="all")pool=pool.slice(0,5);
    var forms=ideasOf(P).map(function(k){return {k:k,f:idea(k).f,p:plain(idea(k).f)};});
    Q={list:pool.map(function(k){
      var right=idea(k), seen={}; seen[plain(right.f)]=1;
      var other=shuffle(forms.filter(function(x){return x.k.split(":")[0]===k.split(":")[0]&&x.k!==k;}))
        .concat(shuffle(forms.filter(function(x){return x.k.split(":")[0]!==k.split(":")[0];})));
      var picks=[];
      other.forEach(function(x){if(picks.length<3&&!seen[x.p]){seen[x.p]=1;picks.push(x.f);}});
      var ch=shuffle([right.f].concat(picks));
      return {k:k,ch:ch,ri:ch.indexOf(right.f)};
    }),i:0,picked:null,right:0,missed:[],back:document.activeElement};
    qz.hidden=false; drawQ();
  }
  function drawQ(){
    if(Q.i>=Q.list.length){
      var n=Q.list.length;
      qzp.innerHTML='<div class="qzh"><span id="qzTitle">Page '+st.page+' check · done</span><button type="button" class="btn" data-q="close">Close</button></div>'
        +'<p class="score">'+Q.right+' of '+n+'</p>'
        +(Q.missed.length?'<p class="small">Go back over these. Any you had ticked are un-ticked again:</p><ul class="missed">'+Q.missed.map(function(k){return '<li>'+idea(k).lead+'</li>';}).join("")+'</ul>'
          :'<p class="small">Every one right. Tick the ideas you are sure of so they can be hidden.</p>')
        +'<div class="row"><button type="button" class="btn" data-q="again">Another 5</button><button type="button" class="btn pri" data-q="close">Back to the page</button></div>';
      qzp.querySelector('[data-q="close"]').focus(); return;
    }
    var it=Q.list[Q.i], x=idea(it.k), b=B[it.k.split(":")[0]];
    qzp.innerHTML='<div class="qzh"><span id="qzTitle">Page '+st.page+' check · question '+(Q.i+1)+' of '+Q.list.length+'</span><button type="button" class="btn" data-q="close">Close</button></div>'
      +'<span class="tag">'+b.title+'</span><div class="q">'+x.lead+'</div><p class="ask">Which formula goes with it?</p>'
      +'<div class="ch">'+it.ch.map(function(f,i){return '<button type="button" data-i="'+i+'"><span class="lt">'+LET[i]+'</span><span class="ft">'+f+'</span></button>';}).join("")+'</div>'
      +'<div id="qzWhy"></div>';
    var first=qzp.querySelector(".ch button"); if(first)first.focus();
  }
  qzp.addEventListener("click",function(e){
    var a=e.target.closest("[data-q]");
    if(a){var act=a.getAttribute("data-q");
      if(act==="close"){closeQ();return;}
      if(act==="next"){Q.i++;Q.picked=null;drawQ();return;}
      if(act==="again"){closeQ();quiz("5");return;}
    }
    var b=e.target.closest(".ch button"); if(!b||Q.picked!=null)return;
    var it=Q.list[Q.i],i=+b.getAttribute("data-i"); Q.picked=i;
    qzp.querySelectorAll(".ch button").forEach(function(o,j){o.disabled=true;o.classList.toggle("right",j===it.ri);o.classList.toggle("wrong",j===i&&i!==it.ri);});
    if(i===it.ri)Q.right++; else {Q.missed.push(it.k); if(KNOW[it.k])setKnown(it.k,false);}
    var x=idea(it.k);
    document.getElementById("qzWhy").innerHTML='<div class="why"><b>'+(i===it.ri?'Right. ':'It is '+x.f+'. ')+'</b>'+(x.rest||"")+'</div>'
      +'<div class="row"><button type="button" class="btn pri" data-q="next">'+(Q.i+1<Q.list.length?'Next question →':'See the result')+'</button></div>';
    qzp.querySelector('[data-q="next"]').focus();
  });
  function closeQ(){qz.hidden=true; var b=Q&&Q.back; Q=null; if(b&&b.focus)b.focus();}
  qz.addEventListener("click",function(e){if(e.target===qz)closeQ();});

  pager.addEventListener("click",function(e){var b=e.target.closest("[data-p]");if(b)go(+b.getAttribute("data-p"));});
  document.getElementById("tocBtn").addEventListener("click",function(){go(0);});
  document.getElementById("modeRead").addEventListener("click",function(){st.mode="read";keep();sheet.querySelectorAll(".it.shown").forEach(function(x){x.classList.remove("shown");});bar();});
  document.getElementById("modeCover").addEventListener("click",function(){st.mode="cover";keep();sheet.querySelectorAll(".it.shown").forEach(function(x){x.classList.remove("shown");});bar();});
  document.getElementById("hideBtn").addEventListener("click",function(){st.hide=!st.hide;keep();bar();meta();});
  document.getElementById("sizeBtn").addEventListener("click",function(){st.size=(st.size+1)%3;keep();bar();});
  document.addEventListener("keydown",function(e){
    if(!qz.hidden){if(e.key==="Escape")closeQ();return;}
    var tg=e.target&&e.target.tagName; if(tg==="INPUT"||tg==="TEXTAREA"||tg==="SELECT"||e.altKey||e.ctrlKey||e.metaKey)return;
    if(e.key==="ArrowRight"){go(st.page+1);e.preventDefault();}
    else if(e.key==="ArrowLeft"){go(st.page-1);e.preventDefault();}
  });
  var tx=null,ty=0;
  sheet.addEventListener("touchstart",function(e){if(e.touches.length!==1||e.target.closest(".fig,.more,details")){tx=null;return;}tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
  sheet.addEventListener("touchend",function(e){if(tx==null)return;var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;tx=null;
    if(Math.abs(dx)>70&&Math.abs(dy)<45)go(st.page+(dx<0?1:-1));},{passive:true});

  /* inside KMF Quant the page around this one answers, and the live boards can be opened from here */
  window.addEventListener("message",function(e){
    if(e.source!==window.parent||window.parent===window)return; var d=e.data; if(!d||!d.kmfHost||HOST)return;
    HOST=true; document.documentElement.classList.add("inkmf"); if(st.page===0)render(0);
  });

  render(0);
})();
</script>

</body>
</html>
