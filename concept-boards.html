ngles 30° and 90°.<ol><li>First triangle, third angle: 180 − 30 − 60 = 90°<\/li><li>Second triangle, third angle: 180 − 30 − 90 = 60°<\/li><li>Both are 30°, 60°, 90° → <b>similar<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 No side lengths are needed at all.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 640 400\"><polygon points=\"56,352 166,352 100,264\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2;stroke-linejoin:round\"><\/polygon><polygon points=\"313,352 533,352 401,176\" style=\"fill:var(--green);fill-opacity:.18;stroke:var(--green);stroke-width:2.2;stroke-linejoin:round\"><\/polygon><line x1=\"423\" y1=\"352\" x2=\"357\" y2=\"264\" style=\"stroke:var(--ink-3);stroke-width:1;fill:none\"><\/line><line x1=\"423\" y1=\"352\" x2=\"467\" y2=\"264\" style=\"stroke:var(--ink-3);stroke-width:1;fill:none\"><\/line><line x1=\"357\" y1=\"264\" x2=\"467\" y2=\"264\" style=\"stroke:var(--ink-3);stroke-width:1;fill:none\"><\/line><path class=\"arcline\" d=\"M 70 352 A 14 14 0 0 0 62.26 339.48\"><\/path><path class=\"arcline\" d=\"M 157.6 340.8 A 14 14 0 0 0 152 352\"><\/path><path class=\"arcline\" d=\"M 93.74 276.52 A 14 14 0 0 0 108.4 275.2\"><\/path><path class=\"arcline\" d=\"M 327 352 A 14 14 0 0 0 319.26 339.48\"><\/path><path class=\"arcline\" d=\"M 524.6 340.8 A 14 14 0 0 0 519 352\"><\/path><path class=\"arcline\" d=\"M 394.74 188.52 A 14 14 0 0 0 409.4 187.2\"><\/path><circle class=\"handle\" cx=\"166\" cy=\"352\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"100\" cy=\"264\" r=\"8\"><\/circle><text class=\"slabel  numtxt\" x=\"320\" y=\"24\" text-anchor=\"middle\">lengths × 2 &nbsp; areas × 4 &nbsp; volume × 8<\/text><text class=\"slabel b numtxt\" x=\"320\" y=\"44\" text-anchor=\"middle\">similar figures: matching angles are equal · matching sides are 2 : 1<\/text><text class=\"slabel r numtxt\" x=\"320\" y=\"62\" text-anchor=\"middle\">the big one holds 2 × 2 = 4 copies of the small one<\/text><text class=\"slabel b numtxt\" x=\"111\" y=\"372\" text-anchor=\"middle\">perimeter = 14.47<\/text><text class=\"slabel r numtxt\" x=\"111\" y=\"392\" text-anchor=\"middle\">area = 10<\/text><text class=\"slabel g numtxt\" x=\"423\" y=\"372\" text-anchor=\"middle\">perimeter 14.47 × 2 = 28.94<\/text><text class=\"slabel g numtxt\" x=\"423\" y=\"392\" text-anchor=\"middle\">area 10 × 4 = 40<\/text><\/svg>","sec":"geo","fm":["Similar figures: the k, k², k³ ladder","Scaling: k² for area, k³ for volume","Ratio to actual value: the scale factor","Solving a proportion","Area of a triangle","The midsegment","Rectangle: area and perimeter","The cube: volume and surface area","The cylinder: volume and surface area"]},"cb_solid":{"title":"Solids at once: the box, the cylinder, the sphere and the pyramid","tag":"Geometry","say":"Pick a solid with the buttons. Then set its size with the sliders. The volume and the surface area both answer at once. The box uses length, width and height. The cylinder uses radius and height. The sphere uses radius alone. The pyramid uses the length slider as its base side. Pouring uses the first cylinder and the wider one.","note":"","tries":["Push the <b>width<\/b> slider from end to end with the box showing. The volume and the surface area both climb fast. The space diagonal climbs far more slowly.","Switch to <b>the cylinder<\/b> and double the radius. The volume jumps to four times. Put the radius back and double the height instead. That only doubles it.","Switch to <b>the sphere<\/b> and slide the radius. Nothing else can move. One number fixes everything about a sphere.","Switch to <b>the pyramid<\/b> and watch the three lines. The slant edge stays longer than the slant height. Both stay longer than the upright height. That check is free.","Switch to <b>pouring<\/b> and set the wider cylinder to twice the first radius. The new depth is a quarter of the old one."],"ideas":[{"lead":"<b>Volume is the base area times the height.<\/b>","rest":"A box works this way and so does a cylinder. The base is a rectangle in one. It is a circle in the other.","f":"V = base area × height","eg":"base area 12, height 5 → 60","big":"Volume = base area × height, for a box and for a cylinder.","html":"<ul><li><b>Volume<\/b> is how much space is inside a solid.<\/li><li>A box has a rectangle base. A <b>cylinder<\/b> (a can shape) has a circle base.<\/li><li>Both have the same shape all the way up, so the same rule works.<\/li><\/ul><p><b>Rule:<\/b> V = base area × height<\/p><div class=\"ex\"><b>Example:<\/b> base area 12, height 5<ol><li>V = 12 × 5 = <b>60<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 For a cylinder, the base area is πr².<\/p>"},{"lead":"<b>A box has six faces in three matching pairs.<\/b>","rest":"Work out three of them. Add them up, then double. Dropping that doubling is the common slip.","f":"SA = 2(lw + lh + wh)","eg":"2 × 3 × 4 box: 2(6 + 8 + 12) = 52","big":"A box has 6 faces in 3 matching pairs. Find 3, add, then double.","html":"<p><b>Surface area<\/b> is the total area of all the outside faces. Call the sides l (length), w (width), h (height).<\/p><p><b>Rule:<\/b> SA = 2(lw + lh + wh)<\/p><div class=\"ex\"><b>Example:<\/b> a 2 × 3 × 4 box<ol><li>The three faces: 2 × 3 = 6, 2 × 4 = 8, 3 × 4 = 12<\/li><li>Add: 6 + 8 + 12 = 26<\/li><li>Double: 2 × 26 = <b>52<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ The most common mistake is forgetting to double.<\/p>"},{"lead":"<b>The space diagonal is Pythagoras used twice.<\/b>","rest":"Cross the base first. Then climb the height. Each step is its own right triangle.","f":"d = √(l² + w² + h²)","eg":"3 × 4 × 12 box: √(9 + 16 + 144) = 13","big":"The longest line inside a box comes from Pythagoras, used twice.","html":"<ul><li>The <b>space diagonal<\/b> goes from a bottom corner to the opposite top corner.<\/li><li>Step 1: cross the floor (a right triangle with l and w).<\/li><li>Step 2: climb the height (another right triangle).<\/li><\/ul><p><b>Rule:<\/b> d = √(l² + w² + h²)<\/p><div class=\"ex\"><b>Example:<\/b> a 3 × 4 × 12 box<ol><li>Floor diagonal: √(9 + 16) = √25 = 5<\/li><li>Space diagonal: √(5² + 12²) = √(25 + 144) = √169 = <b>13<\/b><\/li><\/ol>Same as one step: √(9 + 16 + 144) = 13 ✅<\/div>"},{"lead":"<b>In a cylinder the radius is squared and the height is not.<\/b>","rest":"So they never grow alike. Double the radius and the volume goes up four times. Double the height and it only doubles.","f":"V = πr²h","eg":"r = 3, h = 5: π × 9 × 5 = 45π","big":"In a cylinder, r is squared but h is not.","html":"<ul><li>A <b>cylinder<\/b> is a can shape. r is the radius of the circle end, h is the height.<\/li><li>Double r → volume × 4. Double h → volume only × 2.<\/li><\/ul><p><b>Rule:<\/b> V = πr²h<\/p><div class=\"ex\"><b>Example:<\/b> r = 3, h = 5<ol><li>V = π × 3² × 5 = π × 9 × 5 = <b>45π<\/b><\/li><li>Double r (r = 6): π × 36 × 5 = 180π, which is 4 × 45π<\/li><li>Double h (h = 10): π × 9 × 10 = 90π, which is 2 × 45π<\/li><\/ol><\/div>"},{"lead":"<b>A cylinder is two circular ends and one curved wall.<\/b>","rest":"Unroll the wall and it is a rectangle. Its width is the circumference of one end. Its height is the height of the cylinder.","f":"SA = 2πr² + 2πrh","eg":"r = 3, h = 5: 18π + 30π = 48π","big":"Cylinder surface area = two circle ends + one rolled-up rectangle.","html":"<ul><li>The two ends are circles: 2 × πr².<\/li><li>Unroll the curved wall: it is a rectangle.<\/li><li>Its width is the distance around the circle (2πr). Its height is h.<\/li><\/ul><p><b>Rule:<\/b> SA = 2πr² + 2πrh<\/p><div class=\"ex\"><b>Example:<\/b> r = 3, h = 5<ol><li>Ends: 2 × π × 9 = 18π<\/li><li>Wall: 2 × π × 3 × 5 = 30π<\/li><li>Total = 18π + 30π = <b>48π<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ Don't forget the second end. A can has a top and a bottom.<\/p>"},{"lead":"<b>A sphere's surface area is four of its own flat circles.<\/b>","rest":"Its volume needs the radius cubed. So the volume grows faster than anything else here.","f":"V = (4/3)πr³ · SA = 4πr²","eg":"r = 3: V = 36π, SA = 36π","big":"A sphere: surface = 4πr², volume = (4/3)πr³.","html":"<ul><li>A <b>sphere<\/b> is a ball shape. r is its radius.<\/li><li>Its surface area is exactly 4 flat circles of the same radius: 4 × πr².<\/li><li>Its volume uses r³ (r × r × r), so it grows the fastest when r grows.<\/li><\/ul><p><b>Rule:<\/b> V = (4/3)πr³ and SA = 4πr²<\/p><div class=\"ex\"><b>Example:<\/b> r = 3<ol><li>V = (4/3) × π × 27 = <b>36π<\/b><\/li><li>SA = 4 × π × 9 = <b>36π<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 At r = 3 the two numbers match. That is a coincidence, not a rule.<\/p>"},{"lead":"<b>A pyramid holds one third of the box around it.<\/b>","rest":"Same base, same height. One third of the room inside.","f":"V = ⅓ × base area × height","eg":"base 6 × 6, height 5: ⅓ × 36 × 5 = 60","big":"A pyramid holds one third of the box around it.","html":"<ul><li>A <b>pyramid<\/b> has a flat base and slopes up to one point on top.<\/li><li>Put it in a box with the same base and same height.<\/li><li>The pyramid fills exactly ⅓ of that box.<\/li><\/ul><p><b>Rule:<\/b> V = ⅓ × base area × height<\/p><div class=\"ex\"><b>Example:<\/b> square base 6 × 6, height 5<ol><li>Base area = 36<\/li><li>Box would be 36 × 5 = 180<\/li><li>Pyramid = 180 ÷ 3 = <b>60<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ Don't forget the ⅓.<\/p>"},{"lead":"<b>A pyramid holds two right triangles, and they give different answers.<\/b>","rest":"Run flat to the middle of a side and you get the slant height. Run flat to a corner and you get the slant edge.","f":"slant height = √(h² + (s÷2)²)","eg":"h = 4, s = 6: slant = √(16 + 9) = 5","big":"A pyramid has two different slanted lengths. Don't mix them up.","html":"<ul><li><b>Height<\/b> (h): straight up from the middle of the base to the top.<\/li><li><b>Slant height<\/b>: from the top down the middle of a face to the middle of a base edge. Uses half a side.<\/li><li><b>Slant edge<\/b>: from the top down to a corner. Uses half the base diagonal.<\/li><\/ul><p><b>Rule:<\/b> slant height = √(h² + (s ÷ 2)²)<\/p><div class=\"ex\"><b>Example:<\/b> h = 4, base side s = 6<ol><li>Half a side = 3<\/li><li>Slant height = √(16 + 9) = √25 = <b>5<\/b><\/li><li>Slant edge: half the diagonal = 3√2, so √(16 + 18) = √34 ≈ 5.83<\/li><\/ol><\/div><p class=\"tip\">💡 The slant edge is always longer than the slant height.<\/p>"},{"lead":"<b>A cone is the same idea with a round base.<\/b>","rest":"It holds one third of the cylinder that shares its base and height. Its slant height runs from the tip down to the rim.","f":"V = ⅓πr²h · SA = πr² + πr × slant height","eg":"r = 3, h = 4, slant 5: V = 12π, SA = 9π + 15π = 24π","big":"A cone is a pyramid with a round base: ⅓ of the cylinder.","html":"<ul><li>A <b>cone<\/b> has a circle base and comes to a point.<\/li><li>It holds ⅓ of the cylinder with the same base and height.<\/li><li>The <b>slant height<\/b> (l) goes from the tip down to the edge of the circle.<\/li><\/ul><p><b>Rule:<\/b> V = ⅓πr²h and SA = πr² + πrl<\/p><div class=\"ex\"><b>Example:<\/b> r = 3, h = 4<ol><li>Slant height: √(3² + 4²) = √25 = 5<\/li><li>V = ⅓ × π × 9 × 4 = <b>12π<\/b><\/li><li>SA = π × 9 + π × 3 × 5 = 9π + 15π = <b>24π<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ Use h for the volume and the slant height for the surface. They are different.<\/p>"},{"lead":"<b>Pouring keeps the volume of liquid the same.<\/b>","rest":"The new depth is that volume shared over the new base area. The π cancels every time.","f":"depth = volume ÷ base area","eg":"60 cm³ poured into a 4 × 5 base → 3 cm deep","big":"When you pour liquid, the volume stays the same.","html":"<ul><li>The amount of liquid does not change, only its shape.<\/li><li>New depth = volume ÷ area of the new base.<\/li><\/ul><p><b>Rule:<\/b> depth = volume ÷ base area<\/p><div class=\"ex\"><b>Example:<\/b> 60 cm³ poured into a tank with a 4 × 5 base<ol><li>Base area = 4 × 5 = 20<\/li><li>Depth = 60 ÷ 20 = <b>3 cm<\/b><\/li><\/ol><\/div><p class=\"tip\">💡 With cylinders, π cancels. 36π poured into a cylinder of radius 3: depth = 36π ÷ 9π = 4.<\/p>"},{"lead":"<b>Scale every length by k and the volume goes up by k cubed.<\/b>","rest":"The surface area only goes up by k squared. A length itself just goes up by k.","f":"length ×k · area ×k² · volume ×k³","eg":"k = 2: volume × 8","big":"Grow every length k times: area × k², volume × k³.","html":"<ul><li>Lengths grow by k.<\/li><li>Areas (like surface area) grow by k × k = k².<\/li><li>Volumes grow by k × k × k = k³.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> every length is doubled (k = 2)<ol><li>Lengths × 2<\/li><li>Surface area × 2² = <b>× 4<\/b><\/li><li>Volume × 2³ = <b>× 8<\/b><\/li><\/ol>Check with a cube of side 1 → 2: volume 1 → 8 ✅<\/div><p class=\"warn\">⚠️ Doubling the size does not double the volume. It makes it 8 times bigger.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 430\"><polygon points=\"180.85,136.21 236.28,136.21 236.28,302.5 180.85,302.5\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2;stroke-linejoin:round\"><\/polygon><line x1=\"180.85\" y1=\"302.5\" x2=\"203.72\" y2=\"283.79\" style=\"stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:5 4;fill:none\"><\/line><line x1=\"203.72\" y1=\"283.79\" x2=\"203.72\" y2=\"117.5\" style=\"stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:5 4;fill:none\"><\/line><line x1=\"203.72\" y1=\"283.79\" x2=\"259.15\" y2=\"283.79\" style=\"stroke:var(--ink-3);stroke-width:1.4;stroke-dasharray:5 4;fill:none\"><\/line><line x1=\"180.85\" y1=\"136.21\" x2=\"203.72\" y2=\"117.5\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><line x1=\"236.28\" y1=\"136.21\" x2=\"259.15\" y2=\"117.5\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><line x1=\"236.28\" y1=\"302.5\" x2=\"259.15\" y2=\"283.79\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><line x1=\"203.72\" y1=\"117.5\" x2=\"259.15\" y2=\"117.5\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><line x1=\"259.15\" y1=\"117.5\" x2=\"259.15\" y2=\"283.79\" style=\"stroke:var(--blue);stroke-width:2;fill:none\"><\/line><line x1=\"180.85\" y1=\"302.5\" x2=\"259.15\" y2=\"283.79\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><line x1=\"259.15\" y1=\"283.79\" x2=\"259.15\" y2=\"117.5\" style=\"stroke:var(--red);stroke-width:3;fill:none\"><\/line><line x1=\"180.85\" y1=\"302.5\" x2=\"259.15\" y2=\"117.5\" style=\"stroke:var(--red);stroke-width:3;fill:none\"><\/line><path style=\"stroke:var(--green);stroke-width:1.6;fill:none\" d=\"M 249.42 286.12 L 249.42 276.12 L 259.15 273.79\"><\/path><text class=\"slabel b numtxt\" x=\"208.57\" y=\"324.5\" text-anchor=\"middle\">l = 4<\/text><text class=\"slabel b numtxt\" x=\"171.85\" y=\"223.35\" text-anchor=\"end\">h = 12<\/text><text class=\"slabel b numtxt\" x=\"259.72\" y=\"120.85\" text-anchor=\"start\">w = 3<\/text><text class=\"slabel g numtxt\" x=\"340\" y=\"22\" text-anchor=\"middle\">volume = 4 × 3 × 12 = 144<\/text><text class=\"slabel r numtxt\" x=\"340\" y=\"40\" text-anchor=\"middle\">space diagonal, step 1 — the base diagonal: √(16 + 9) = 5<\/text><text class=\"slabel r numtxt\" x=\"340\" y=\"58\" text-anchor=\"middle\">step 2 — then up the height: √(25 + 144) = 13<\/text><polygon points=\"460,290 518.33,290 518.33,150\" style=\"fill:var(--red);fill-opacity:.07;stroke:none\"><\/polygon><line x1=\"460\" y1=\"290\" x2=\"518.33\" y2=\"290\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><line x1=\"518.33\" y1=\"290\" x2=\"518.33\" y2=\"150\" style=\"stroke:var(--red);stroke-width:3;fill:none\"><\/line><line x1=\"460\" y1=\"290\" x2=\"518.33\" y2=\"150\" style=\"stroke:var(--red);stroke-width:3;fill:none\"><\/line><path style=\"stroke:var(--green);stroke-width:1.6;fill:none\" d=\"M 508.33 290 L 508.33 280 L 518.33 280\"><\/path><text class=\"slabel \" x=\"535\" y=\"130\" text-anchor=\"middle\">the same two steps, drawn flat<\/text><text class=\"slabel r numtxt\" x=\"489.17\" y=\"312\" text-anchor=\"middle\">base diagonal = 5<\/text><text class=\"slabel b numtxt\" x=\"528.33\" y=\"224\" text-anchor=\"start\">h = 12<\/text><text class=\"slabel r numtxt\" x=\"535\" y=\"335\" text-anchor=\"middle\">space diagonal = 13<\/text><\/svg>","sec":"geo","fm":["The rectangular solid: volume and surface area","The cube: volume and surface area","The cylinder: volume and surface area","The sphere: volume and surface area","The cone: volume and surface area","Space diagonal of a box","Scaling: k² for area, k³ for volume","Area of a circle","The Pythagorean rule","Diagonal of a rectangle"]},"cb_line":{"title":"Two points and the line through them","tag":"Coordinate Geometry","say":"Drag either point. The gap across, the gap up, the distance, the midpoint and the slope all answer at once. So do the y-intercept and the x-intercept, and the line written three ways. One square of the grid is one unit. The two buttons add a second line, so you can see what parallel and square-on really mean.","note":"Two lines of this board are worth more than the rest. Slope is the climb for one step right, and it never changes along a line. And b in y = mx + b is the y-intercept, the height at which the line crosses the up-axis. Every other form on the board is the same line dressed differently. Pick whichever one the question makes easy.","tries":["Drag one point so it sits <b>straight above<\/b> the other. The gap across goes to zero. The slope has nowhere to go, so the line is written <b>x = a number<\/b> instead.","Drag one point so both sit at the <b>same height<\/b>. The slope goes to 0, the equation becomes y = a number, and the line never cuts the x-axis.","Watch the midpoint while you drag. It is always the average of the two x values and the average of the two y values.","Press <b>add a parallel line<\/b>. The second line has the same slope and a different y-cut. The two never meet, however far you drag.","Press <b>add a line that crosses square on<\/b>. Multiply the two slopes together. You get −1 every time, unless one line is flat and the other upright."],"ideas":[{"lead":"<b>Slope is the climb for one step right.<\/b>","rest":"Take the gap up and divide it by the gap across. You get the same answer wherever on the line you measure it.","f":"m = (y2 − y1) / (x2 − x1)","eg":"(1, 2) to (4, 8): 6 ÷ 3 = 2","big":"Slope = how much the line goes up for each 1 step to the right.","html":"<p><b>Slope<\/b> tells how steep a line is. Divide the gap up by the gap across.<\/p><ul><li>The <b>gap up<\/b> is the change in y (the up-down number).<\/li><li>The <b>gap across<\/b> is the change in x (the left-right number).<\/li><\/ul><p><b>Rule:<\/b> slope = (y<sub>2<\/sub> − y<sub>1<\/sub>) ÷ (x<sub>2<\/sub> − x<sub>1<\/sub>)<\/p><div class=\"ex\"><b>Example:<\/b> from (1, 2) to (4, 8)<ol><li>Gap up: 8 − 2 = 6<\/li><li>Gap across: 4 − 1 = 3<\/li><li>Slope = 6 ÷ 3 = <b>2<\/b><\/li><\/ol>Check: each step right climbs 2: (1, 2) → (2, 4) → (3, 6) → (4, 8) ✅<\/div><p class=\"tip\">💡 Any two points on the same line give the same slope.<\/p><p class=\"warn\">⚠️ Subtract in the same order on top and bottom.<\/p>"},{"lead":"<b>Distance is Pythagoras on the grid.<\/b>","rest":"The gap across and the gap up make a right-angled triangle. The line joining your two points is its longest side.","f":"d = √((x2 − x1)² + (y2 − y1)²)","eg":"(1, 2) to (4, 6): √(9 + 16) = 5","big":"Distance between two points = the long side of a right triangle.","html":"<p>Draw the gap across and the gap up. They make a <b>right triangle<\/b> (a triangle with a square corner). The line between your two points is its longest side.<\/p><p><b>Rule:<\/b> distance = √((x<sub>2<\/sub> − x<sub>1<\/sub>)² + (y<sub>2<\/sub> − y<sub>1<\/sub>)²)<\/p><div class=\"ex\"><b>Example:<\/b> from (1, 2) to (4, 6)<ol><li>Gap across: 4 − 1 = 3<\/li><li>Gap up: 6 − 2 = 4<\/li><li>Square and add: 3² + 4² = 9 + 16 = 25<\/li><li>Square root: √25 = <b>5<\/b> ✅<\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> This is Pythagoras: short side² + short side² = long side².<\/p><p class=\"tip\">💡 Look for 3, 4, 5 and 5, 12, 13 triangles. They save time.<\/p>"},{"lead":"<b>The midpoint is the average of each coordinate.<\/b>","rest":"Average the two x values, then average the two y values. That pair is the midpoint of the segment.","f":"M = ( (x1 + x2)/2 , (y1 + y2)/2 )","eg":"(2, 4) and (6, 10) → (4, 7)","big":"Midpoint = the average of the x's and the average of the y's.","html":"<p>The <b>midpoint<\/b> is the point exactly in the middle of two points. Each point is written (x, y). x is left-right and y is up-down.<\/p><p><b>Rule:<\/b> midpoint = ((x<sub>1<\/sub> + x<sub>2<\/sub>) ÷ 2, (y<sub>1<\/sub> + y<sub>2<\/sub>) ÷ 2)<\/p><div class=\"ex\"><b>Example:<\/b> (2, 4) and (6, 10)<ol><li>Average the x's: (2 + 6) ÷ 2 = 4<\/li><li>Average the y's: (4 + 10) ÷ 2 = 7<\/li><li>Midpoint = <b>(4, 7)<\/b> ✅ (check: 2 → 4 → 6 is 2 each way, and 4 → 7 → 10 is 3 each way)<\/li><\/ol><\/div><p class=\"warn\">⚠️ Add the two numbers, then divide by 2. Do not subtract them.<\/p>"},{"lead":"<b>In y = mx + b, the b is the y-intercept.<\/b>","rest":"Put x = 0 into the equation and every other part drops away.","f":"y = mx + b","eg":"y = 2x + 3 crosses the y-axis at (0, 3)","big":"In y = mx + b, the number b is where the line crosses the y-axis.","html":"<p>The <b>y-axis<\/b> is the up-down line in the middle of the grid. On it, x is always 0. The <b>y-intercept<\/b> is the point where the line crosses it.<\/p><ul><li>m is the slope (how steep the line is).<\/li><li>b is the y-intercept.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> y = 2x + 3<ol><li>Put x = 0: y = 2 × 0 + 3<\/li><li>2 × 0 = 0, so y = 3<\/li><li>The line crosses the y-axis at <b>(0, 3)<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 To find any y-intercept, just put x = 0. Everything with x disappears.<\/p>"},{"lead":"<b>Point-slope form needs one point and the slope.<\/b>","rest":"That is the quickest way to write a line when a question hands you those two things.","f":"y − y1 = m(x − x1)","eg":"through (1, 5) with slope 2: y − 5 = 2(x − 1) → y = 2x + 3","big":"Know one point and the slope? Use y − y₁ = m(x − x₁).","html":"<p>This is called <b>point-slope form<\/b>. (x<sub>1<\/sub>, y<sub>1<\/sub>) is the point you know. m is the slope (how steep the line is).<\/p><div class=\"ex\"><b>Example:<\/b> a line through (1, 5) with slope 2<ol><li>Put in the numbers: y − 5 = 2(x − 1)<\/li><li>Open the bracket: y − 5 = 2x − 2<\/li><li>Add 5 to both sides: y = <b>2x + 3<\/b><\/li><\/ol>Check: x = 1 gives 2 × 1 + 3 = 5, so (1, 5) is on the line ✅<\/div><p class=\"tip\">💡 This is the fastest way when a question gives you one point and the slope.<\/p>"},{"lead":"<b>The two intercepts give the tidiest form of all.<\/b>","rest":"The x-intercept is a and the y-intercept is b, and the line obeys this rule.","f":"x/a + y/b = 1","eg":"x/4 + y/2 = 1 crosses at (4, 0) and (0, 2)","big":"x/a + y/b = 1 shows both crossing points at once.","html":"<p>A line crosses the two main lines (axes) of the grid:<\/p><ul><li>The <b>x-intercept<\/b> a is where it crosses the flat left-right line. There y = 0.<\/li><li>The <b>y-intercept<\/b> b is where it crosses the up-down line. There x = 0.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> x/4 + y/2 = 1<ol><li>Put y = 0: x/4 = 1, so x = 4 → (4, 0)<\/li><li>Put x = 0: y/2 = 1, so y = 2 → (0, 2)<\/li><li>The line crosses at <b>(4, 0) and (0, 2)<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Just read the numbers under x and under y. They are the crossing points.<\/p><p class=\"warn\">⚠️ This only works when the right side is exactly 1.<\/p>"},{"lead":"<b>Parallel lines have the same slope.<\/b>","rest":"They climb at the same rate, so the gap between them never closes and they never meet.","f":"m1 = m2","eg":"y = 2x + 1 and y = 2x − 5 never meet","big":"Parallel lines have the same slope, so they never meet.","html":"<p><b>Parallel<\/b> lines run side by side forever, like train tracks. Slope means how steep a line is.<\/p><p><b>Rule:<\/b> same slope → parallel.<\/p><div class=\"ex\"><b>Example:<\/b> y = 2x + 1 and y = 2x − 5<ol><li>Both slopes are 2 (the number in front of x).<\/li><li>At x = 0 they are at 1 and −5. The gap is 6.<\/li><li>At x = 10 they are at 21 and 15. The gap is still 6.<\/li><li>They climb at the same speed, so <b>they never meet<\/b> ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ Same slope and same b means it is the same line, not two parallel lines.<\/p>"},{"lead":"<b>Lines that cross square on have slopes that multiply to −1.<\/b>","rest":"Turn the slope upside down and change its sign to get the other one.","f":"m1 × m2 = −1","eg":"slopes 2 and −½: 2 × (−½) = −1","big":"Lines that cross at a square corner have slopes that multiply to −1.","html":"<p>Lines that cross at a 90° corner are called <b>perpendicular<\/b>. Slope means how steep a line is.<\/p><p><b>Rule:<\/b> slope 1 × slope 2 = −1<\/p><div class=\"ex\"><b>Example:<\/b> one line has slope 2. What slope crosses it at a square corner?<ol><li>Turn it upside down: 2 = 2/1 → 1/2<\/li><li>Change the sign: ½ → <b>−½<\/b><\/li><li>Check: 2 × (−½) = −1 ✅<\/li><\/ol><\/div><p class=\"tip\">💡 <b>Flip it and change the sign.<\/b> Slope 3/4 → −4/3. Check: 3/4 × (−4/3) = −1 ✅<\/p>"},{"lead":"<b>A flat line and an upright line are the one exception.<\/b>","rest":"A flat line has slope 0. An upright line has no slope at all, so nothing can be multiplied.","f":"y = k is flat · x = h is upright","eg":"y = 3 and x = 2 cross square on with no slopes to multiply","big":"A flat line and an upright line are the one exception to the −1 rule.","html":"<ul><li>A <b>flat<\/b> line like y = 3 has slope 0. Every point on it has y = 3.<\/li><li>An <b>upright<\/b> line like x = 2 has no slope at all. Every point on it has x = 2.<\/li><\/ul><p>They always cross at a square corner (90°). But there is no pair of slopes to multiply, so the −1 rule cannot be used.<\/p><div class=\"ex\"><b>Example:<\/b> y = 3 and x = 2<ol><li>y = 3 is flat. x = 2 goes straight up and down.<\/li><li>They meet at <b>(2, 3)<\/b>, at a square corner.<\/li><\/ol><\/div><p class=\"warn\">⚠️ \"x = a number\" is the <b>upright<\/b> line, not the flat one. People mix these up.<\/p>"},{"lead":"<b>The line that crosses the middle square on is the perpendicular bisector.<\/b>","rest":"Every point on it is the same distance from your two points.","f":"distance to A = distance to B","eg":"A(0, 0), B(4, 0): x = 2 is the perpendicular bisector","big":"The perpendicular bisector is the line of points equally far from both points.","html":"<p>Take two points A and B. The <b>perpendicular bisector<\/b> is the line that:<\/p><ul><li>goes through the middle of A and B (<b>bisector<\/b> means \"cuts in half\"), and<\/li><li>crosses the line AB at a square corner (<b>perpendicular<\/b>).<\/li><\/ul><p>Every point on it is the same distance from A and from B.<\/p><div class=\"ex\"><b>Example:<\/b> A(0, 0) and B(4, 0)<ol><li>The middle of A and B is (2, 0).<\/li><li>AB is flat, so the square-corner line is upright: <b>x = 2<\/b><\/li><li>Test the point (2, 5): distance to A = √(2² + 5²) = √29. Distance to B = √(2² + 5²) = √29. The same ✅<\/li><\/ol><\/div>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 460\"><line x1=\"20\" y1=\"430\" x2=\"20\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"52\" y1=\"430\" x2=\"52\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"84\" y1=\"430\" x2=\"84\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"116\" y1=\"430\" x2=\"116\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"148\" y1=\"430\" x2=\"148\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"180\" y1=\"430\" x2=\"180 y2=\"334\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"302\" x2=\"660\" y2=\"302\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"270\" x2=\"660\" y2=\"270\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"206\" x2=\"660\" y2=\"206\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"174\" x2=\"660\" y2=\"174\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"142\" x2=\"660\" y2=\"142\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"110\" x2=\"660\" y2=\"110\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"78\" x2=\"660\" y2=\"78\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"46\" x2=\"660\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"238\" x2=\"660\" y2=\"238\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"340\" y1=\"430\" x2=\"340\" y2=\"46\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"84\" y=\"252\" text-anchor=\"middle\">-8<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"148\" y=\"252\" text-anchor=\"middle\">-6<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"212\" y=\"252\" text-anchor=\"middle\">-4<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"276\" y=\"252\" text-anchor=\"middle\">-2<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"404\" y=\"252\" text-anchor=\"middle\">2<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"468\" y=\"252\" text-anchor=\"middle\">4<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"532\" y=\"252\" text-anchor=\"middle\">6<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"596\" y=\"252\" text-anchor=\"middle\">8<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"332\" y=\"370\" text-anchor=\"end\">-4<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"332\" y=\"306\" text-anchor=\"end\">-2<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"332\" y=\"178\" text-anchor=\"end\">2<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"332\" y=\"114\" text-anchor=\"end\">4<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"332\" y=\"252\" text-anchor=\"end\">0<\/text><text class=\"slabel\" style=\"fill:var(--ink-3);font-size:10px\" x=\"673\" y=\"242\" text-anchor=\"middle\">x<\/text><text class=\"slabel\" style=\"fill:var(--ink-3);font-size:10px\" x=\"328\" y=\"42\" text-anchor=\"end\">y<\/text><line x1=\"20\" y1=\"408.67\" x2=\"660\" y2=\"53.11\" style=\"stroke:var(--blue);stroke-width:2.2;fill:none\"><\/line><line x1=\"212\" y1=\"302\" x2=\"500\" y2=\"302\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><line x1=\"500\" y1=\"302\" x2=\"500\" y2=\"142\" style=\"stroke:var(--red);stroke-width:1.5;stroke-dasharray:5 4;fill:none\"><\/line><circle cx=\"340\" cy=\"230.89\" r=\"4.2\" style=\"fill:var(--green)\"><\/circle><circle cx=\"327.2\" cy=\"238\" r=\"4.2\" style=\"fill:var(--green)\"><\/circle><circle cx=\"356\" cy=\"222\" r=\"4.6\" style=\"fill:var(--green)\"><\/circle><text class=\"slabel b numtxt\" x=\"182.8\" y=\"290.4\" text-anchor=\"middle\">A(−4, −2)<\/text><text class=\"slabel b numtxt\" x=\"474.61\" y=\"130.4\" text-anchor=\"middle\">B(5, 3)<\/text><text class=\"slabel g\" x=\"356\" y=\"202\" text-anchor=\"middle\">M<\/text><text class=\"slabel r numtxt\" x=\"356\" y=\"330\" text-anchor=\"middle\">across 9<\/text><text class=\"slabel r numtxt\" x=\"532.1\" y=\"226\" text-anchor=\"middle\">up 5<\/text><text class=\"slabel g numtxt\" x=\"322.22\" y=\"219.29\" text-anchor=\"middle\">2/9<\/text><text class=\"slabel g numtxt\" x=\"327.2\" y=\"274\" text-anchor=\"middle\">−2/5<\/text><circle class=\"handle\" cx=\"212\" cy=\"302\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"500\" cy=\"142\" r=\"8\"><\/circle><text class=\"slabel b numtxt\" x=\"22\" y=\"24\" text-anchor=\"start\">y = 5/9x + 2/9<\/text><text class=\"slabel \" x=\"658\" y=\"24\" text-anchor=\"end\">red dashes: across and up<\/text><\/svg>","sec":"coord","fm":["Slope from two points","Slope-intercept form","Point-slope form","Standard form of a line","The two intercepts of a line","Distance between two points","Midpoint of a segment","Parallel lines have equal slopes","Perpendicular slopes multiply to −1","Perpendicular bisector of a segment","Collinearity of three points"]},"cb_grid":{"title":"A shape on the grid, all at once","tag":"Coordinate Geometry","say":"Drag any corner. Every side length, the perimeter, the area, the midpoint of each side and the right-angle test answer at once. Use the corners slider to swap between a triangle and a four-sided shape. The three buttons flip the shape in an axis or slide it. Watch which numbers change and which refuse to.","note":"","tries":["Drag a corner and watch the area. The shoelace rule is the only way to get the area of a slanted shape without measuring a height.","Try to make a right angle at a corner. The readout says which corners are square, and a small box is drawn at each one.","Press <b>flip it in the across-axis<\/b>. Every y value changes sign. Not one length and not the area moves at all.","Press <b>slide it<\/b>. Every corner gains 2 across and 1 up. Again nothing about the shape's size changes.","With four corners, drag one across the far side. The shape crosses itself and the board warns you, because the shoelace rule needs a shape that does not cross."],"ideas":[{"lead":"<b>The distance along any side is Pythagoras on the grid.<\/b>","rest":"Take the gap across and the gap up between the two ends, square both, add, and take the square root.","f":"d = √((x2 − x1)² + (y2 − y1)²)","eg":"(0, 0) to (3, 4): 5","big":"Side length = √(gap across² + gap up²).","html":"<p>Each side of a shape on the grid is the long side of a <b>right triangle<\/b> (a triangle with a square corner). So use Pythagoras.<\/p><p><b>Rule:<\/b> length = √((x<sub>2<\/sub> − x<sub>1<\/sub>)² + (y<sub>2<\/sub> − y<sub>1<\/sub>)²)<\/p><div class=\"ex\"><b>Example:<\/b> the side from (0, 0) to (3, 4)<ol><li>Gap across: 3 − 0 = 3. Gap up: 4 − 0 = 4<\/li><li>Square both: 3² = 9 and 4² = 16<\/li><li>Add: 9 + 16 = 25<\/li><li>Square root: √25 = <b>5<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Add all the sides to get the <b>perimeter<\/b> (the distance all the way around).<\/p><p class=\"warn\">⚠️ A negative gap is fine. Squaring makes it positive: (−3)² = 9.<\/p>"},{"lead":"<b>The midpoint of a side is the average of each coordinate.<\/b>","rest":"Average the x values, then average the y values. It works for any slant.","f":"M = ( (x1 + x2)/2 , (y1 + y2)/2 )","eg":"(0, 0) and (6, 2) → (3, 1)","big":"The middle of a side = average the x's, then average the y's.","html":"<p>The <b>midpoint<\/b> is the point exactly halfway along a side. It works for flat, upright and slanted sides.<\/p><p><b>Rule:<\/b> midpoint = ((x<sub>1<\/sub> + x<sub>2<\/sub>) ÷ 2, (y<sub>1<\/sub> + y<sub>2<\/sub>) ÷ 2)<\/p><div class=\"ex\"><b>Example:<\/b> the side from (0, 0) to (6, 2)<ol><li>x: (0 + 6) ÷ 2 = 3<\/li><li>y: (0 + 2) ÷ 2 = 1<\/li><li>Midpoint = <b>(3, 1)<\/b><\/li><\/ol>Check: (0, 0) to (3, 1) is 3 across and 1 up. (3, 1) to (6, 2) is also 3 across and 1 up ✅<\/div>"},{"lead":"<b>The shoelace rule gives the area from the corners alone.<\/b>","rest":"Go round the shape one way. Cross-multiply each pair of neighbours, add them up with signs, and halve.","f":"Area = ½ |x1y2 − x2y1 + x2y3 − x3y2 + …|","eg":"(0, 0), (4, 0), (0, 3): ½ × |0 + 12 − 0| = 6","big":"The shoelace rule finds the area using only the corner points.","html":"<p><b>Area<\/b> is the space inside a shape. Go round the corners in order, cross-multiply each pair, add, and halve.<\/p><p><b>Rule:<\/b> area = ½ × | x<sub>1<\/sub>y<sub>2<\/sub> − x<sub>2<\/sub>y<sub>1<\/sub> + x<sub>2<\/sub>y<sub>3<\/sub> − x<sub>3<\/sub>y<sub>2<\/sub> + … |. The | | means drop any minus sign.<\/p><div class=\"ex\"><b>Example:<\/b> a triangle with corners (0, 0), (4, 0), (0, 3)<ol><li>Corner 1 → 2: 0 × 0 − 4 × 0 = 0<\/li><li>Corner 2 → 3: 4 × 3 − 0 × 0 = 12<\/li><li>Corner 3 → back to 1: 0 × 0 − 0 × 3 = 0<\/li><li>Add: 0 + 12 + 0 = 12. Half of 12 = <b>6<\/b><\/li><\/ol>Check: it is a right triangle, so ½ × 4 × 3 = 6 ✅<\/div><p class=\"warn\">⚠️ Go round the corners in one direction. Jumping across the shape gives a wrong area.<\/p>"},{"lead":"<b>A corner is square when the two sides meeting there have slopes that multiply to −1.<\/b>","rest":"The board tests this with the gaps across and up.","f":"m1 × m2 = −1","eg":"slopes 2 and −½ → the corner is square","big":"A corner is square when the slopes of its two sides multiply to −1.","html":"<p>A <b>square corner<\/b> is a 90° angle (a right angle). <b>Slope<\/b> = gap up ÷ gap across. It tells how steep a side is.<\/p><div class=\"ex\"><b>Example:<\/b> corners A(0, 0), B(1, 2), C(5, 0). Is the corner at B square?<ol><li>Slope of BA: (2 − 0) ÷ (1 − 0) = 2<\/li><li>Slope of BC: (0 − 2) ÷ (5 − 1) = −2/4 = −½<\/li><li>Multiply: 2 × (−½) = −1 → <b>yes, it is a square corner<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Another check is Pythagoras. AB² = 1 + 4 = 5, BC² = 16 + 4 = 20, AC² = 25, and 5 + 20 = 25 ✅<\/p>"},{"lead":"<b>Flipping in the across-axis changes the sign of every y.<\/b>","rest":"The shape lands below where it was, the same size and the same shape.","f":"(x, y) → (x, −y)","eg":"(3, 2) → (3, −2)","big":"Flip over the x-axis: keep x, change the sign of y.","html":"<p>The <b>x-axis<\/b> is the flat left-right line through the middle of the grid. Flipping over it is like a mirror on the floor.<\/p><p><b>Rule:<\/b> (x, y) → (x, −y)<\/p><div class=\"ex\"><b>Example:<\/b> flip (3, 2) over the x-axis<ol><li>Keep x: 3<\/li><li>Change the sign of y: 2 → −2<\/li><li>New point: <b>(3, −2)<\/b>. It was 2 above the line. Now it is 2 below.<\/li><\/ol><\/div><p>The shape keeps the same size and the same shape. It just lands below, upside down.<\/p><p class=\"warn\">⚠️ Flipping over the x-axis changes y, not x. This is easy to mix up.<\/p>"},{"lead":"<b>Flipping in the up-axis changes the sign of every x.<\/b>","rest":"Left becomes right. Again nothing about the size changes.","f":"(x, y) → (−x, y)","eg":"(3, 2) → (−3, 2)","big":"Flip over the y-axis: change the sign of x, keep y.","html":"<p>The <b>y-axis<\/b> is the up-down line through the middle of the grid. Flipping over it swaps left and right, like a mirror on a wall.<\/p><p><b>Rule:<\/b> (x, y) → (−x, y)<\/p><div class=\"ex\"><b>Example:<\/b> flip (3, 2) over the y-axis<ol><li>Change the sign of x: 3 → −3<\/li><li>Keep y: 2<\/li><li>New point: <b>(−3, 2)<\/b>. It was 3 to the right. Now it is 3 to the left.<\/li><\/ol><\/div><p>The size and shape do not change.<\/p><p class=\"tip\">💡 The axis you flip over names the number that stays. Over the x-axis, x stays. Over the y-axis, y stays.<\/p>"},{"lead":"<b>Sliding adds the same pair to every corner.<\/b>","rest":"The shape keeps its size, its shape and its slant. Only the position moves.","f":"(x, y) → (x + h, y + k)","eg":"(3, 2) slid by (1, −4) → (4, −2)","big":"To slide a shape, add the same pair of numbers to every corner.","html":"<p>A <b>slide<\/b> moves a shape without turning or flipping it. It keeps its size, its shape and its tilt. Only its place changes.<\/p><p><b>Rule:<\/b> (x, y) → (x + h, y + k). h is how far right (left if negative). k is how far up (down if negative).<\/p><div class=\"ex\"><b>Example:<\/b> slide (3, 2) by (1, −4)<ol><li>x: 3 + 1 = 4<\/li><li>y: 2 + (−4) = −2<\/li><li>New point: <b>(4, −2)<\/b>, which is 1 right and 4 down ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ Add the same pair to every corner, not just one corner.<\/p>"},{"lead":"<b>Lengths and area survive a flip or a slide. Coordinates do not.<\/b>","rest":"That is the whole point of these three buttons.","f":"length, area: same · each point: moved","big":"Flips and slides keep lengths and area. Only the points move.","html":"<ul><li><b>Stay the same:<\/b> each side length, the perimeter (distance around), the area (space inside) and the angles.<\/li><li><b>Change:<\/b> the coordinates, which are the (x, y) numbers of each corner.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> a side from (0, 0) to (3, 4) has length 5<ol><li>Slide by (1, 1): now (1, 1) to (4, 5). Length = √(3² + 4²) = 5<\/li><li>Flip over the x-axis: now (0, 0) to (3, −4). Length = √(3² + (−4)²) = 5<\/li><li>The length is <b>5 every time<\/b> ✅, but the points changed.<\/li><\/ol><\/div><p class=\"tip\">💡 If a question flips or slides a shape and asks for its area, the answer is the old area.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 460\"><line x1=\"20\" y1=\"430\" x2=\"20\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"52\" y1=\"430\" x2=\"52\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"84\" y1=\"430\" x2=\"84\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"116\" y1=\"430\" x2=\"116\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"148\" y1=\"430\" x2=\"148\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"180\" y1=\"430\" x2=\"180\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"212\" y1=\"430\" x2=\"212\" y2=\"46\" style=\"stroke:var -line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"270\" x2=\"660\" y2=\"270\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"206\" x2=\"660\" y2=\"206\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"174\" x2=\"660\" y2=\"174\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"142\" x2=\"660\" y2=\"142\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"110\" x2=\"660\" y2=\"110\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"78\" x2=\"660\" y2=\"78\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"46\" x2=\"660\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"20\" y1=\"238\" x2=\"660\" y2=\"238\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"340\" y1=\"430\" x2=\"340\" y2=\"46\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"84\" y=\"252\" text-anchor=\"middle\">-8<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"148\" y=\"252\" text-anchor=\"middle\">-6<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"212\" y=\"252\" text-anchor=\"middle\">-4<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"276\" y=\"252\" text-anchor=\"middle\">-2<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"404\" y=\"252\" text-anchor=\"middle\">2<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"468\" y=\"252\" text-anchor=\"middle\">4<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"532\" y=\"252\" text-anchor=\"middle\">6<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"596\" y=\"252\" text-anchor=\"middle\">8<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"332\" y=\"370\" text-anchor=\"end\">-4<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"332\" y=\"306\" text-anchor=\"end\">-2<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"332\" y=\"178\" text-anchor=\"end\">2<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"332\" y=\"114\" text-anchor=\"end\">4<\/text><text class=\"slabel numtxt\" style=\"fill:var(--ink-3);font-size:10px\" x=\"332\" y=\"252\" text-anchor=\"end\">0<\/text><text class=\"slabel\" style=\"fill:var(--ink-3);font-size:10px\" x=\"673\" y=\"242\" text-anchor=\"middle\">x<\/text><text class=\"slabel\" style=\"fill:var(--ink-3);font-size:10px\" x=\"328\" y=\"42\" text-anchor=\"end\">y<\/text><polygon points=\"148,334 468,334 532,142 244,110\" style=\"fill:var(--blue-wash);stroke:var(--blue);stroke-width:2;stroke-linejoin:round\"><\/polygon><circle cx=\"308\" cy=\"334\" r=\"4\" style=\"fill:var(--green)\"><\/circle><circle cx=\"500\" cy=\"238\" r=\"4\" style=\"fill:var(--green)\"><\/circle><circle cx=\"388\" cy=\"126\" r=\"4\" style=\"fill:var(--green)\"><\/circle><circle cx=\"196\" cy=\"222\" r=\"4\" style=\"fill:var(--green)\"><\/circle><text class=\"slabel b numtxt\" x=\"106.17\" y=\"347.33\" text-anchor=\"middle\">A(−6, −3)<\/text><text class=\"slabel b numtxt\" x=\"498.09\" y=\"352.14\" text-anchor=\"middle\">B(4, −3)<\/text><text class=\"slabel b numtxt\" x=\"568.84\" y=\"137.36\" text-anchor=\"middle\">C(6, 3)<\/text><text class=\"slabel b numtxt\" x=\"219.91\" y=\"97.16\" text-anchor=\"middle\">D(−3, 4)<\/text><text class=\"slabel  numtxt\" x=\"308\" y=\"362\" text-anchor=\"middle\">10<\/text><text class=\"slabel  numtxt\" x=\"480.32\" y=\"226.4\" text-anchor=\"middle\">6.32<\/text><text class=\"slabel  numtxt\" x=\"390.06\" y=\"106.19\" text-anchor=\"middle\">9.06<\/text><text class=\"slabel  numtxt\" x=\"167.62\" y=\"218.22\" text-anchor=\"middle\">7.62<\/text><circle class=\"handle\" cx=\"148\" cy=\"334\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"468\" cy=\"334\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"532\" cy=\"142\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"244\" cy=\"110\" r=\"8\"><\/circle><text class=\"slabel b numtxt\" x=\"22\" y=\"24\" text-anchor=\"start\">area = 63  ·  perimeter = 33<\/text><text class=\"slabel \" x=\"658\" y=\"24\" text-anchor=\"end\">green dots: the middle of each side<\/text><\/svg>","sec":"coord","fm":["Distance between two points","Midpoint of a segment","Area of a triangle from its vertices","Slope from two points","Perpendicular slopes multiply to −1","Reflection across the axes","Reflection through the origin and across y = x","Translating a graph","Collinearity of three points","Rectangle: area and perimeter"]},"cb_curve":{"title":"A curve and a line on the same grid","tag":"Coordinate Geometry","say":"The sliders a, b and c set the parabola y = ax² + bx + c. Drag the two blue dots to move the red line. The vertex, the axis of symmetry and the two intercepts all answer at once. So does the b² − 4ac test, and the list of meeting points. The second button swaps in the fraction curve y = (x − p) / (x − q). The p and q sliders take over there.","note":"","tries":["Set a to 1 and slide c up slowly. Watch b² − 4ac fall through zero. The two x-cuts slide together, touch, and then vanish.","Slide a through zero. The x² term disappears, the bend goes with it, and what is left is the straight line y = bx + c.","Make a negative. The curve turns over, the lowest point becomes the highest point, and the arms point down.","Drag the red line down until it just kisses the curve. At that moment they meet at exactly one point, and its own test is zero.","Press the fraction curve. Slide q and watch the upright line it chases move with it. The curve never crosses that line, however close it gets."],"ideas":[{"lead":"<b>The vertex sits half-way between the two x-intercepts.<\/b>","rest":"Its x is found from a and b alone, and its y comes from putting that x back in.","f":"x = −b / (2a)","eg":"y = x² − 6x + 5: x = 6 ÷ 2 = 3, half-way between 1 and 5","big":"The turning point of a parabola is at x = −b ÷ (2a).","html":"<p>A <b>parabola<\/b> is the U-shaped curve y = ax² + bx + c. Its turning point is the <b>vertex<\/b>. It sits halfway between the two <b>x-intercepts<\/b> (where the curve crosses the flat x-axis).<\/p><div class=\"ex\"><b>Example:<\/b> y = x² − 6x + 5 (so a = 1, b = −6, c = 5)<ol><li>x = −(−6) ÷ (2 × 1) = 6 ÷ 2 = 3<\/li><li>Put x = 3 back in: y = 9 − 18 + 5 = −4<\/li><li>Vertex = <b>(3, −4)<\/b><\/li><\/ol>Check: the curve crosses the x-axis at 1 and 5. Halfway is 3 ✅<\/div><p class=\"warn\">⚠️ Watch the minus signs. Here b is −6, so −b is +6.<\/p>"},{"lead":"<b>The sign of a says which way the parabola opens.<\/b>","rest":"A positive a opens upwards and the vertex is the lowest point. A negative a opens downwards.","f":"a &gt; 0 lowest · a &lt; 0 highest","eg":"y = x² opens up · y = −x² opens down","big":"Positive a opens up like a cup. Negative a opens down like a hill.","html":"<p>In y = ax² + bx + c, <b>a<\/b> is the number in front of x².<\/p><ul><li>a &gt; 0 (positive): opens <b>up<\/b>. The vertex (turning point) is the <b>lowest<\/b> point.<\/li><li>a &lt; 0 (negative): opens <b>down<\/b>. The vertex is the <b>highest<\/b> point.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> <ol><li>y = x²: a = 1, positive → <b>opens up<\/b>. Lowest point is (0, 0).<\/li><li>y = −x²: a = −1, negative → <b>opens down<\/b>. Highest point is (0, 0).<\/li><\/ol><\/div><p class=\"tip\">💡 Positive a makes a smile. Negative a makes a frown.<\/p>"},{"lead":"<b>b² − 4ac counts the x-intercepts before you solve anything.<\/b>","rest":"Above zero gives two cuts, exactly zero gives one touch, below zero gives none.","f":"b² − 4ac","eg":"x² − 6x + 5: 36 − 20 = 16 > 0 → two x-intercepts","big":"b² − 4ac tells how many times the curve crosses the x-axis.","html":"<p>For y = ax² + bx + c, work out b² − 4ac before solving anything. It counts the <b>x-intercepts<\/b> (where the curve crosses the flat x-axis).<\/p><ul><li><b>More than 0<\/b> → crosses 2 times<\/li><li><b>Exactly 0<\/b> → touches 1 time<\/li><li><b>Less than 0<\/b> → never crosses<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> y = x² − 6x + 5 (a = 1, b = −6, c = 5)<ol><li>b² = (−6)² = 36<\/li><li>4ac = 4 × 1 × 5 = 20<\/li><li>36 − 20 = 16, which is more than 0 → <b>2 x-intercepts<\/b> ✅ (they are 1 and 5)<\/li><\/ol><\/div><p class=\"warn\">⚠️ (−6)² is +36, not −36. A squared number is never negative.<\/p>"},{"lead":"<b>The quadratic formula gives the x-intercepts themselves.<\/b>","rest":"The same b² − 4ac sits under the square-root sign, which is why its sign decides how many there are.","f":"x = (−b ± √(b² − 4ac)) / (2a)","eg":"x² − 6x + 5: x = (6 ± 4) ÷ 2 = 5 or 1","big":"The quadratic formula finds the exact crossing points.","html":"<p>The <b>x-intercepts<\/b> are where the curve crosses the flat x-axis, so y = 0 there.<\/p><p><b>Rule:<\/b> x = (−b ± √(b² − 4ac)) ÷ (2a). The ± means do it once with + and once with −.<\/p><div class=\"ex\"><b>Example:<\/b> x² − 6x + 5 = 0 (a = 1, b = −6, c = 5)<ol><li>b² − 4ac = 36 − 20 = 16, and √16 = 4<\/li><li>x = (6 ± 4) ÷ 2<\/li><li>(6 + 4) ÷ 2 = 5 and (6 − 4) ÷ 2 = 1 → <b>x = 5 or x = 1<\/b><\/li><\/ol>Check: 25 − 30 + 5 = 0 ✅ and 1 − 6 + 5 = 0 ✅<\/div><p class=\"why\"><b>Why it works:<\/b> b² − 4ac sits under the √. A negative number has no square root, so then there are no crossing points.<\/p>"},{"lead":"<b>The y-intercept of the parabola is c.<\/b>","rest":"Put x = 0 in and the first two terms vanish, leaving c on its own.","f":"x = 0 → y = c","eg":"y = x² − 6x + 5 crosses the y-axis at (0, 5)","big":"A parabola crosses the y-axis at c, the number on its own.","html":"<p>The <b>y-axis<\/b> is the up-down line where x = 0. The <b>y-intercept<\/b> is where the curve crosses it.<\/p><div class=\"ex\"><b>Example:<\/b> y = x² − 6x + 5<ol><li>Put x = 0: y = 0² − 6 × 0 + 5<\/li><li>The first two parts become 0, so y = 5<\/li><li>The curve crosses at <b>(0, 5)<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 No work needed. The y-intercept is always c, the number with no x.<\/p>"},{"lead":"<b>To find where a line meets a curve, set them equal.<\/b>","rest":"You get one quadratic. Its own b² − 4ac counts the meeting points: two, one or none.","f":"ax² + bx + c = mx + k","eg":"x² = x + 2 → x² − x − 2 = 0 → x = 2 or −1","big":"Where a line meets a curve: set the two equal and solve.","html":"<p>At a meeting point, the line and the curve have the same y. So set them equal. You get one quadratic (an equation with x²).<\/p><div class=\"ex\"><b>Example:<\/b> curve y = x² and line y = x + 2<ol><li>Set equal: x² = x + 2<\/li><li>Move everything to one side: x² − x − 2 = 0<\/li><li>Factor: (x − 2)(x + 1) = 0 → x = 2 or x = −1<\/li><li>Find y with the line: 2 + 2 = 4 and −1 + 2 = 1<\/li><li>Meeting points: <b>(2, 4) and (−1, 1)<\/b> ✅ (check: 2² = 4 and (−1)² = 1)<\/li><\/ol><\/div><p class=\"tip\">💡 b² − 4ac of the new equation counts the meeting points: above 0 → two, 0 → one, below 0 → none. Here 1 − 4 × 1 × (−2) = 9 → two.<\/p>"},{"lead":"<b>A fraction is zero only when its top is zero.<\/b>","rest":"So y = (x − p)/(x − q) is zero at x = p. That holds as long as the bottom is not zero there too.","f":"y = 0 at x = p","eg":"y = (x − 2)/(x + 1) is 0 at x = 2","big":"A fraction equals 0 only when its top is 0.","html":"<p>For y = (x − p)/(x − q), the top is 0 when x = p. So y = 0 at x = p. This works only if the bottom is not 0 there too.<\/p><div class=\"ex\"><b>Example:<\/b> y = (x − 2)/(x + 1)<ol><li>Top = 0 when x − 2 = 0, so x = 2<\/li><li>Check the bottom: 2 + 1 = 3, not 0 ✅<\/li><li>y = 0 ÷ 3 = 0 → <b>y is 0 at x = 2<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ If the top and bottom are both 0, like (x − 2)/(x − 2) at x = 2, then 0 ÷ 0 has no value. It is not a zero.<\/p>"},{"lead":"<b>A fraction has no value when its bottom is zero.<\/b>","rest":"At x = q there is nothing to plot, so the curve is cut in two there.","f":"no value at x = q","eg":"y = (x − 2)/(x + 1) has no value at x = −1","big":"A fraction has no value when its bottom is 0.","html":"<p>You can never divide by 0. So y = (x − p)/(x − q) has no value at x = q. The curve is cut into two pieces there.<\/p><div class=\"ex\"><b>Example:<\/b> y = (x − 2)/(x + 1)<ol><li>Bottom = 0 when x + 1 = 0, so x = −1<\/li><li>At x = −1: top = −3 and bottom = 0<\/li><li>−3 ÷ 0 cannot be done → <b>no value at x = −1<\/b><\/li><\/ol><\/div><p class=\"warn\">⚠️ x + 1 = 0 gives x = −1, not +1. Change the sign.<\/p>"},{"lead":"<b>The curve chases two lines it never touches.<\/b>","rest":"These lines are called asymptotes: lines the curve creeps closer and closer to without ever reaching them.","f":"x = q and y = 1","eg":"y = (x − 2)/(x + 1) chases x = −1 and y = 1","big":"The curve gets closer and closer to two lines but never touches them.","html":"<p>These lines are called <b>asymptotes<\/b>. For y = (x − p)/(x − q) they are:<\/p><ul><li>the upright line <b>x = q<\/b> (where the bottom is 0)<\/li><li>the flat line <b>y = 1<\/b><\/li><\/ul><div class=\"ex\"><b>Example:<\/b> y = (x − 2)/(x + 1)<ol><li>Upright line: x + 1 = 0 → <b>x = −1<\/b><\/li><li>Flat line: try a huge x, like 1000. 998 ÷ 1001 ≈ 0.997, very close to 1 → <b>y = 1<\/b><\/li><li>The curve chases <b>x = −1 and y = 1<\/b><\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> For a huge x, the −2 and +1 hardly matter. Top and bottom are almost the same, so y is almost 1.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 680 460\"><line x1=\"20\" y1=\"430\" x2=\"20\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1;fill:none\"><\/line><line x1=\"52\" y1=\"430\" x2=\"52\" y2=\"46\" style=\"stroke:var(--line);stroke-width:1; 414.4,203.42 414.8,201.95 415.2,200.48 415.6,198.99 416,197.5 416.4,196 416.8,194.48 417.2,192.96 417.6,191.42 418,189.88 418.4,188.32 418.8,186.75 419.2,185.18 419.6,183.59 420,182 420.4,180.4 420.8,178.78 421.2,177.16 421.6,175.52 422,173.88 422.4,172.22 422.8,170.55 423.2,168.88 423.6,167.19 424,165.5 424.4,163.8 424.8,162.08 425.2,160.36 425.6,158.62 426,156.88 426.4,155.12 426.8,153.35 427.2,151.58 427.6,149.79 428,148 428.4,146.2 428.8,144.38 429.2,142.56 429.6,140.72 430,138.88 430.4,137.02 430.8,135.15 431.2,133.28 431.6,131.39 432,129.5 432.4,127.6 432.8,125.68 433.2,123.76 433.6,121.82 434,119.88 434.4,117.92 434.8,115.95 435.2,113.98 435.6,111.99 436,110 436.4,108 436.8,105.98 437.2,103.96 437.6,101.92 438,99.88 438.4,97.82 438.8,95.75 439.2,93.68 439.6,91.59 440,89.5 440.4,87.4 440.8,85.28 441.2,83.16 441.6,81.02 442,78.88 442.4,76.72 442.8,74.55 443.2,72.38 443.6,70.19 444,68 444.4,65.8 444.8,63.58 445.2,61.36 445.6,59.12 446,56.88 446.4,54.62 446.8,52.35 447.2,50.08 447.6,47.79\" style=\"stroke:var(--blue);stroke-width:2.4;fill:none;stroke-linejoin:round\"><\/polyline><line x1=\"148\" y1=\"430\" x2=\"532\" y2=\"46\" style=\"stroke:var(--red);stroke-width:2.4;fill:none\"><\/line><line x1=\"356\" y1=\"430\" x2=\"356\" y2=\"46\" style=\"stroke:var(--ink-3);stroke-width:1.4;fill:none;stroke-dasharray:6 5\"><\/line><circle cx=\"308\" cy=\"238\" r=\"4.6\" style=\"fill:var(--green)\"><\/circle><circle cx=\"404\" cy=\"238\" r=\"4.6\" style=\"fill:var(--green)\"><\/circle><circle cx=\"316.57\" cy=\"261.43\" r=\"7\" style=\"fill:none;stroke:var(--amber);stroke-width:2.6\"><\/circle><circle cx=\"427.43\" cy=\"150.57\" r=\"7\" style=\"fill:none;stroke:var(--amber);stroke-width:2.6\"><\/circle><circle cx=\"356\" cy=\"310\" r=\"5\" style=\"fill:var(--green)\"><\/circle><text class=\"slabel g numtxt\" x=\"356\" y=\"338\" text-anchor=\"middle\">lowest (1/2, −9/4)<\/text><circle class=\"handle\" cx=\"212\" cy=\"366\" r=\"8\"><\/circle><circle class=\"handle\" cx=\"468\" cy=\"110\" r=\"8\"><\/circle><text class=\"slabel b numtxt\" x=\"22\" y=\"24\" text-anchor=\"start\">y = x² − x − 2<\/text><text class=\"slabel \" x=\"658\" y=\"24\" text-anchor=\"end\">amber rings: where they meet<\/text><\/svg>","sec":"coord","fm":["Vertex of a parabola","Vertex form and the maximum or minimum","The discriminant","The quadratic formula","Factoring a quadratic","Sum and product of the roots","Axis of symmetry from two equal heights","Completing the square","Translating a graph","Function notation"]},"cb_spread":{"title":"Nine values you can drag","tag":"Statistics","say":"Nine dots sit on a number line. Drag any dot left or right and it lands on a whole number. The mean, the median, the mode, the range, the quartiles and the standard deviation all answer at the same time. Two markers sit under the line. The green one is the mean and the blue one is the median. Grey ghosts show where those two started, so you can see which one your dragging has moved.","note":"","tries":["Drag the dot on the far right out to 20. The green mean marker walks right with it. The blue median marker does not move at all. That one difference is most of this section.","Now drag a middle dot past its neighbour. This time the median jumps and the range stays still. The two markers have swapped jobs.","Pile four dots on one number. The mode jumps to that number. The standard deviation shrinks, because most of the values now sit close to the mean.","Press <b>the range and the quartiles<\/b>, then pull the far right dot out again. The range stretches and the interquartile range does not move at all.","Spread the nine dots out evenly. The mean and the median land on the same spot, and the line under the readings says so."],"ideas":[{"lead":"<b>The mean shares the total out evenly.<\/b>","rest":"Add the nine values, then divide by nine. Every dot has a say in it. Move one dot by one step and the mean moves one ninth of a step.","f":"mean = total ÷ how many","eg":"2, 4, 9: total 15 ÷ 3 = 5","big":"The mean is the fair share: add everything, then divide by how many.","html":"<p>The <b>mean<\/b> (the average) shares the total out evenly.<\/p><p><b>Rule:<\/b> mean = total ÷ how many numbers<\/p><div class=\"ex\"><b>Example:<\/b> find the mean of 2, 4 and 9.<ol><li>Add them: 2 + 4 + 9 = 15<\/li><li>Count them: there are 3 numbers.<\/li><li>Divide: 15 ÷ 3 = <b>5<\/b><\/li><\/ol>Check: 3 people with 5 each → 3 × 5 = 15 ✅<\/div><p class=\"tip\">💡 Every number affects the mean. With 9 numbers, raise one number by 1 and the mean goes up by only 1/9. Raise it by 9 and the mean goes up by 1.<\/p>"},{"lead":"<b>The median is the middle value after sorting.<\/b>","rest":"Positions run from 1 to n. The middle position is halfway between those two ends, at (n + 1) ÷ 2. With nine values that is the fifth one. A dot can move a long way and leave the median alone, as long as it stays on its own side.","f":"position of the median = (n + 1) ÷ 2","eg":"3, 1, 9, 4, 7 → 1, 3, 4, 7, 9 → median 4","big":"The median is the middle number after you put them in order.","html":"<p><b>Median<\/b> means the middle value. First sort the numbers from smallest to biggest.<\/p><p><b>Rule:<\/b> the median is in place (n + 1) ÷ 2. Here n means how many numbers there are.<\/p><div class=\"ex\"><b>Example:<\/b> 3, 1, 9, 4, 7<ol><li>Sort them: 1, 3, 4, 7, 9<\/li><li>There are 5 numbers, so the place is (5 + 1) ÷ 2 = 3rd.<\/li><li>The 3rd number is <b>4<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 With 9 numbers, the median is the 5th one. A number can move a long way and the median stays the same, as long as it stays on the same side of the middle.<\/p><p class=\"warn\">⚠️ Always sort first. The middle of the unsorted list (9 here) is wrong.<\/p>"},{"lead":"<b>The mode is the value that turns up most often.<\/b>","rest":"If no value repeats there is no mode. Two values can tie for the top count, and then the list has two modes.","f":"mode = the value with the highest count","eg":"2, 3, 3, 5 → mode 3","big":"The mode is the number that shows up the most.","html":"<ul><li>Count how many times each number appears. The winner is the <b>mode<\/b>.<\/li><li>If no number repeats, there is <b>no mode<\/b>.<\/li><li>If two numbers tie for the most, there are <b>two modes<\/b>.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> 2, 3, 3, 5<ol><li>Counts: 2 appears once, 3 appears twice, 5 appears once.<\/li><li>3 appears the most, so the mode is <b>3<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Tie example: in 1, 1, 4, 4, 6 the modes are 1 and 4.<\/p>"},{"lead":"<b>The range is the biggest take away the smallest.<\/b>","rest":"Only the two end dots matter to it. The seven dots in the middle can sit wherever they like.","f":"range = biggest − smallest","eg":"smallest 2, biggest 9 → range 7","big":"Range = biggest number − smallest number.","html":"<p>The <b>range<\/b> tells how spread out the numbers are, from one end to the other.<\/p><div class=\"ex\"><b>Example:<\/b> 2, 5, 6, 9<ol><li>Smallest = 2, biggest = 9<\/li><li>Range = 9 − 2 = <b>7<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Only the two end numbers matter. The numbers in the middle can be anything between them, and the range stays the same.<\/p>"},{"lead":"<b>The quartiles cut the sorted list into four equal parts.<\/b>","rest":"Q1 is the first quartile and Q3 is the third. The median already sits halfway along the run of positions. Cut again and you land a quarter of the way along, at position (n + 1) ÷ 4.","f":"Q1 at (n + 1) ÷ 4 &nbsp;·&nbsp; Q3 at 3(n + 1) ÷ 4","eg":"1 to 7 (seven values): Q1 is the 2nd = 2, Q3 is the 6th = 6","big":"Quartiles cut the sorted list into 4 equal parts.","html":"<ul><li><b>Quartile<\/b> means \"quarter mark\".<\/li><li><b>Q1<\/b> (the first quartile) sits ¼ of the way along the sorted list.<\/li><li>The median sits ½ of the way. <b>Q3<\/b> (the third quartile) sits ¾ of the way.<\/li><\/ul><p><b>Rule:<\/b> with n numbers, Q1 is in place (n + 1) ÷ 4 and Q3 is in place 3(n + 1) ÷ 4.<\/p><div class=\"ex\"><b>Example:<\/b> 1, 2, 3, 4, 5, 6, 7 (n = 7)<ol><li>Q1 place: (7 + 1) ÷ 4 = 2nd → Q1 = <b>2<\/b><\/li><li>Median place: (7 + 1) ÷ 2 = 4th → median = 4<\/li><li>Q3 place: 3 × 8 ÷ 4 = 6th → Q3 = <b>6<\/b> ✅<\/li><\/ol><\/div><p class=\"warn\">⚠️ Sort the numbers first, just like for the median.<\/p>"},{"lead":"<b>The interquartile range is the gap from Q1 to Q3.<\/b>","rest":"Half of the nine values sit inside that middle half. One far-out dot cannot move it, and that is why it beats the range for saying how tight a list is.","f":"interquartile range = Q3 − Q1","eg":"Q1 = 2, Q3 = 6 → IQR = 4","big":"IQR = Q3 − Q1. It shows how spread out the middle half is.","html":"<p>The <b>IQR<\/b> (interquartile range) is the gap from Q1 to Q3. About half of all the numbers sit inside this gap.<\/p><div class=\"ex\"><b>Example:<\/b> 1, 2, 3, 4, 5, 6, 7<ol><li>Q1 = 2 and Q3 = 6<\/li><li>IQR = 6 − 2 = <b>4<\/b><\/li><li>Now change 7 to 700. Q1 and Q3 do not move, so the IQR is still 4 ✅<\/li><li>But the range jumps from 7 − 1 = 6 to 700 − 1 = 699.<\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> the IQR ignores the end numbers. So one far-out number cannot move it.<\/p><p class=\"tip\">💡 That is why the IQR is better than the range for showing how tightly packed a list is.<\/p>"},{"lead":"<b>The standard deviation is the typical distance from the mean.<\/b>","rest":"Square each gap from the mean, because squaring makes every gap positive. Raw gaps would cancel to nothing. Take the mean of those squares. Then take the square root, which brings you back to the first units.","f":"SD = √( Σ(x − M)² ÷ n )","eg":"2, 4, 4, 4, 5, 5, 7, 9 (mean 5): squares add to 32, 32 ÷ 8 = 4, SD = 2","big":"Standard deviation = the usual distance of the numbers from the mean.","html":"<p>Small SD (standard deviation) → the numbers sit close to the mean. Big SD → they are spread far out.<\/p><p><b>Rule:<\/b> SD = √(sum of (number − mean)² ÷ how many)<\/p><div class=\"ex\"><b>Example:<\/b> 2, 4, 4, 4, 5, 5, 7, 9<ol><li>Mean: 40 ÷ 8 = 5<\/li><li>Gaps from 5: −3, −1, −1, −1, 0, 0, 2, 4<\/li><li>Square each gap: 9, 1, 1, 1, 0, 0, 4, 16. They add to 32.<\/li><li>Mean of the squares: 32 ÷ 8 = 4<\/li><li>Square root: √4 = <b>2<\/b> ✅<\/li><\/ol><\/div><p class=\"why\"><b>Why it works:<\/b> raw gaps always add to 0, because the minus and plus gaps cancel. Squaring makes every gap positive. The square root at the end brings you back to the first units.<\/p>"},{"lead":"<b>The mean is the balance point of the dots.<\/b>","rest":"Add up the gaps of the dots on its left. Add up the gaps of the dots on its right. The two totals always match.","f":"Σ(x − M) = 0","eg":"2, 5, 8 (mean 5): (−3) + 0 + 3 = 0","big":"The mean is the balance point: gaps below it and above it cancel out.","html":"<ul><li>Add the gaps of the numbers below the mean.<\/li><li>Add the gaps of the numbers above the mean.<\/li><li>The two totals are always the same size. So all the gaps (with their + and − signs) add to <b>0<\/b>.<\/li><\/ul><div class=\"ex\"><b>Example:<\/b> 2, 5, 8 (mean = 15 ÷ 3 = 5)<ol><li>Gaps from 5: 2 − 5 = −3, 5 − 5 = 0, 8 − 5 = +3<\/li><li>Add: (−3) + 0 + 3 = <b>0<\/b> ✅<\/li><\/ol><\/div><p class=\"tip\">💡 Use it to find a missing number. Mean 10, numbers 7, 12 and x. The gaps are −3 and +2, so x needs a gap of +1 → x = <b>11<\/b>. Check: (7 + 12 + 11) ÷ 3 = 10 ✅<\/p>"},{"lead":"<b>One far-out value pulls the mean and leaves the median.<\/b>","rest":"So in a lopsided list the median is the fairer middle. A great many test questions turn on this one point.","f":"mean &gt; median means a long right tail","eg":"1, 2, 3, 4, 100: median 3, mean 22","big":"One very far-out number pulls the mean but not the median.","html":"<div class=\"ex\"><b>Example:<\/b> 1, 2, 3, 4, 100<ol><li>Median (the middle number): <b>3<\/b><\/li><li>Mean: 1 + 2 + 3 + 4 + 100 = 110, and 110 ÷ 5 = <b>22<\/b><\/li><\/ol>The 100 dragged the mean up to 22. The median stayed at 3.<\/div><ul><li>So when a list is lopsided, the <b>median<\/b> is the fairer middle.<\/li><li>Mean bigger than median → a long tail of big numbers on the right.<\/li><\/ul><p class=\"tip\">💡 Many GRE questions test this exact point.<\/p>"}],"svg":"<svg aria-hidden=\"true\" focusable=\"false\" viewBox=\"0 0 860 500\"><text class=\"slabel \" x=\"430\" y=\"26\" text-anchor=\"middle\">the mean walks with a far-out dot · the median does not<\/text><line x1=\"42\" y1=\"300\" x2=\"830\" y2=\"300\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"56\" y1=\"300\" x2=\"56\" y2=\"307\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"56\" y=\"322\" text-anchor=\"middle\">0<\/text><line x1=\"94\" y1=\"300\" x2=\"94\" y2=\"304\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"132\" y1=\"300\" x2=\"132\" y2=\"307\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"132\" y=\"322\" text-anchor=\"middle\">2<\/text><line x1=\"170\" y1=\"300\" x2=\"170\" y2=\"304\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"208\" y1=\"300\" x2=\"208\" y2=\"307\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"208\" y=\"322\" text-anchor=\"middle\">4<\/text><line x1=\"246\" y1=\"300\" x2=\"246\" y2=\"304\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"284\" y1=\"300\" x2=\"284\" y2=\"307\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"284\" y=\"322\" text-anchor=\"middle\">6<\/text><line x1=\"322\" y1=\"300\" x2=\"322\" y2=\"304\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><line x1=\"360\" y1=\"300\" x2=\"360\" y2=\"307\" style=\"stroke:var(--ink-3);stroke-width:1.5;fill:none\"><\/line><text class=\"slabel  numtxt\" x=\"360\" y=\"322\" text-anchor=\"middle\">
