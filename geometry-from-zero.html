y2=\"118\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><circle cx=\"222\" cy=\"118\" r=\"4\" fill=\"#1b2430\"/><text x=\"267\" y=\"78\" font-family=\"Arial\" font-size=\"15\" fill=\"#9c6510\" font-weight=\"700\" text-anchor=\"middle\">r²<\/text><text x=\"84\" y=\"120\" font-family=\"Arial\" font-size=\"14\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">5<\/text><text x=\"267\" y=\"140\" font-family=\"Arial\" font-size=\"14\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">10<\/text><text x=\"62\" y=\"170\" font-family=\"Arial\" font-size=\"13\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">r = 5<\/text><text x=\"62\" y=\"188\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\">area 25π ≈ 78.5<\/text><text x=\"222\" y=\"230\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\">r = 10: area 100π ≈ 314 (4 ×)<\/text><\/svg>","idea":"<p><b>Area<\/b> = how much flat space is inside the circle.<\/p><p>The amber box is r by r, so its area is r². The circle holds about 3.14 of these boxes (π boxes).<\/p><p>Double the radius (right circle) and the area becomes 4 times bigger, not 2 times.<\/p>","formulas":[{"f":"A = πr²","say":"r = radius. Square r first (r × r), then multiply by π."},{"f":"r = d ÷ 2","say":"Given the diameter d? Halve it to get r first, then square."}],"ex":{"q":"The radius is 5 (left circle). Find the area.","steps":["r² = 5 × 5 = 25","A = 25π ≈ 25 × 3.1416 ≈ 78.54","<b>25π ≈ 78.54<\/b> ✅"]},"ex2":{"q":"Now the radius doubles to 10 (right circle). What happens to the area?","steps":["r² = 10 × 10 = 100, so A = 100π ≈ 314.16","100π ÷ 25π = 4","<b>4 times the area<\/b>, not 2 times ✅"]},"tip":"⚠️ Square the radius, not the diameter: a diameter of 10 means r = 5, so the area is 25π, not 100π.","part":"Geometry"},{"id":"G21","title":"An arc is a piece of the circle’s edge. A sector is a pizza slice.","svg":"<svg viewBox=\"0 0 320 236\" aria-hidden=\"true\"><circle cx=\"150\" cy=\"118\" r=\"82\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"3\"/><path d=\"M150 118 L232 118 A82 82 0 0 0 150 36 Z\" fill=\"#cfe3f0\" stroke=\"#1e6f9f\" stroke-width=\"0.01\"/><line x1=\"150\" y1=\"118\" x2=\"232\" y2=\"118\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><line x1=\"150\" y1=\"118\" x2=\"150\" y2=\"36\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><path d=\"M232 118 A82 82 0 0 0 150 36\" fill=\"none\" stroke=\"#b23a2a\" stroke-width=\"5\"/><polyline points=\"162,118 162,106 150,106\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\" stroke-linejoin=\"round\"/><text x=\"174\" y=\"96\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#1b2430\">90°<\/text><text x=\"191\" y=\"136\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\">r = 6<\/text><text x=\"142\" y=\"82\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"end\">r = 6<\/text><text x=\"217.9\" y=\"50.1\" font-family=\"Arial\" font-size=\"15\" font-weight=\"700\" fill=\"#b23a2a\">arc L<\/text><circle cx=\"150\" cy=\"118\" r=\"4\" fill=\"#1b2430\"/><text x=\"160\" y=\"226\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\" text-anchor=\"middle\">the slice is 90/360 = ¼ of the circle<\/text><\/svg>","idea":"<p>The <b>radius<\/b> r = the distance from the centre to the edge. The <b>central angle<\/b> θ = the angle at the centre (here 90°).<\/p><p>The red curve is an <b>arc<\/b> = a piece of the edge. The blue wedge is a <b>sector<\/b> = a pizza slice.<\/p><p>The slice is θ/360 of the whole circle. So take that fraction of the whole answer.<\/p>","formulas":[{"f":"Arc length: L = (θ ÷ 360) × 2πr","say":"2πr is the whole way around the circle (the <b>circumference<\/b>). Take the θ/360 part of it. A 90° arc is ¼ of the way round."},{"f":"Sector area: A = (θ ÷ 360) × πr²","say":"πr² is the area of the whole circle. The slice gets the θ/360 part of it. (π ≈ 3.14.)"},{"f":"Sector area from the arc: A = ½ × L × r","say":"Use this when you know the arc length L but not the angle. L = the curved arc (not the straight line between its ends), r = radius."}],"ex":{"q":"Use the picture: r = 6 and θ = 90°. Find the arc length and the slice’s area.","steps":["90 ÷ 360 = ¼, so the slice is ¼ of the circle.","Whole way round: 2π × 6 = 12π. Arc: L = ¼ × 12π = <b>3π ≈ 9.42<\/b>","Whole area: π × 6² = 36π. Sector: A = ¼ × 36π = <b>9π ≈ 28.27<\/b>","Check with ½ × L × r: ½ × 3π × 6 = 9π ✅"]},"ex2":{"q":"An arc is 12 long and the radius is 6. Find the sector’s area.","steps":["We know the arc but not the angle, so use A = ½ × L × r.","A = ½ × 12 × 6 = <b>36<\/b> ✅"]},"tip":"⚠️ The <b>perimeter<\/b> of a slice (the distance all around it) is arc + 2r. Do not forget the two straight radius sides.","part":"Geometry"},{"id":"G22","title":"An angle with its corner on the circle is half the angle at the centre.","svg":"<svg viewBox=\"0 0 320 206\" aria-hidden=\"true\"><circle cx=\"82\" cy=\"100\" r=\"64\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"82\" y1=\"100\" x2=\"40.9\" y2=\"149\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><line x1=\"82\" y1=\"100\" x2=\"123.1\" y2=\"149\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><line x1=\"55\" y1=\"42\" x2=\"40.9\" y2=\"149\" stroke=\"#b23a2a\" stroke-width=\"3\"/><line x1=\"55\" y1=\"42\" x2=\"123.1\" y2=\"149\" stroke=\"#b23a2a\" stroke-width=\"3\"/><path d=\"M73 110.7 A14 14 0 0 0 91 110.7\" fill=\"none\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><text x=\"82\" y=\"135\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\">80°<\/text><path d=\"M52.1 63.8 A22 22 0 0 0 66.8 60.6\" fill=\"none\" stroke=\"#b23a2a\" stroke-width=\"2.5\"/><text x=\"63.6\" y=\"86\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#b23a2a\" text-anchor=\"middle\">40°<\/text><circle cx=\"82\" cy=\"100\" r=\"4\" fill=\"#1b2430\"/><circle cx=\"40.9\" cy=\"149\" r=\"4\" fill=\"#1b2430\"/><circle cx=\"123.1\" cy=\"149\" r=\"4\" fill=\"#1b2430\"/><circle cx=\"55\" cy=\"42\" r=\"4\" fill=\"#1b2430\"/><text x=\"49\" y=\"36\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#1b2430\" text-anchor=\"end\">P<\/text><text x=\"82\" y=\"196\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\" text-anchor=\"middle\">red = ½ of blue<\/text><circle cx=\"240\" cy=\"100\" r=\"64\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"3\"/><polygon points=\"176,100 222.1,38.6 304,100\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"0.01\" stroke-linejoin=\"round\"/><line x1=\"176\" y1=\"100\" x2=\"304\" y2=\"100\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><line x1=\"222.1\" y1=\"38.6\" x2=\"176\" y2=\"100\" stroke=\"#b23a2a\" stroke-width=\"3\"/><line x1=\"222.1\" y1=\"38.6\" x2=\"304\" y2=\"100\" stroke=\"#b23a2a\" stroke-width=\"3\"/><polyline points=\"215.5,47.4 224.3,54 230.9,45.2\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\" stroke-linejoin=\"round\"/><circle cx=\"176\" cy=\"100\" r=\"4\" fill=\"#1b2430\"/><circle cx=\"304\" cy=\"100\" r=\"4\" fill=\"#1b2430\"/><circle cx=\"222.1\" cy=\"38.6\" r=\"4\" fill=\"#1b2430\"/><circle cx=\"240\" cy=\"100\" r=\"4\" fill=\"#1b2430\"/><text x=\"170\" y=\"105\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#1b2430\" text-anchor=\"end\">A<\/text><text x=\"310\" y=\"105\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#1b2430\">B<\/text><text x=\"222.1\" y=\"29.6\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#1b2430\" text-anchor=\"middle\">P<\/text><text x=\"240\" y=\"120\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\">10<\/text><text x=\"211\" y=\"79.3\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#b23a2a\" text-anchor=\"middle\">6<\/text><text x=\"255\" y=\"85.3\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#b23a2a\" text-anchor=\"middle\">8<\/text><text x=\"240\" y=\"196\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\" text-anchor=\"middle\">diameter → 90° at P<\/text><\/svg>","idea":"<p>A <b>central angle<\/b> has its corner at the centre (blue, left). An <b>inscribed angle<\/b> has its corner on the circle (red, at P).<\/p><p>When both open onto the same piece of the edge, the red angle is half the blue one.<\/p><p>A <b>diameter<\/b> = a straight line through the centre, edge to edge. It always makes a 90° corner at the edge (right picture).<\/p>","formulas":[{"f":"inscribed angle = ½ × central angle","say":"Both angles must open onto the same arc (the same piece of edge). The corner of the inscribed angle must sit on the circle."},{"f":"∠APB = 90° when AB is a diameter","say":"A diameter is a straight line, so its central angle is 180°. Half of 180° is 90°, so the corner at P is always square."}],"ex":{"q":"Left picture: the central angle is 80°. Find the angle at P.","steps":["Same arc, and P is on the circle, so halve it.","80° ÷ 2 = <b>40°<\/b> ✅"]},"ex2":{"q":"Right picture: AB = 10 is a diameter and PA = 6. Find PB and the area of triangle APB.","steps":["AB is a diameter, so the angle at P is 90°. AB is the longest side (the hypotenuse).","PB² = 10² − 6² = 100 − 36 = 64, so PB = <b>8<\/b>","Area = ½ × 6 × 8 = <b>24<\/b> ✅"]},"tip":"💡 Slide P anywhere along the far part of the circle: the angle at P does not change.","part":"Geometry"},{"id":"G23","title":"A tangent touches the circle once and makes a 90° corner with the radius.","svg":"<svg viewBox=\"0 0 320 216\" aria-hidden=\"true\"><circle cx=\"52\" cy=\"124\" r=\"43\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"3\"/><polygon points=\"52,124 68.5,84.3 163.8,124\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"0.01\" stroke-linejoin=\"round\"/><line x1=\"163.8\" y1=\"124\" x2=\"40.8\" y2=\"72.8\" stroke=\"#b23a2a\" stroke-width=\"3\"/><line x1=\"52\" y1=\"124\" x2=\"68.5\" y2=\"84.3\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><line x1=\"52\" y1=\"124\" x2=\"163.8\" y2=\"124\" stroke=\"#4a5866\" stroke-width=\"2.5\" stroke-dasharray=\"6 4\"/><polyline points=\"64.7,93.5 73.9,97.4 77.8,88.2\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\" stroke-linejoin=\"round\"/><circle cx=\"52\" cy=\"124\" r=\"4\" fill=\"#1b2430\"/><circle cx=\"68.5\" cy=\"84.3\" r=\"4\" fill=\"#1b2430\"/><circle cx=\"163.8\" cy=\"124\" r=\"4\" fill=\"#1b2430\"/><text x=\"54.3\" y=\"108.2\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"end\">r = 5<\/text><text x=\"121.9\" y=\"142\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#4a5866\" text-anchor=\"middle\">D = 13<\/text><text x=\"122.2\" y=\"96.2\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#b23a2a\">t = 12<\/text><text x=\"82\" y=\"206\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\" text-anchor=\"middle\">tangent ⟂ radius<\/text><circle cx=\"248\" cy=\"112\" r=\"60\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"200\" y1=\"148\" x2=\"296\" y2=\"148\" stroke=\"#b23a2a\" stroke-width=\"3.5\"/><line x1=\"248\" y1=\"112\" x2=\"248\" y2=\"148\" stroke=\"#2e7a57\" stroke-width=\"3\"/><line x1=\"248\" y1=\"112\" x2=\"296\" y2=\"148\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><polyline points=\"248,139 257,139 257,148\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\" stroke-linejoin=\"round\"/><circle cx=\"248\" cy=\"112\" r=\"4\" fill=\"#1b2430\"/><circle cx=\"200\" cy=\"148\" r=\"4\" fill=\"#1b2430\"/><circle cx=\"296\" cy=\"148\" r=\"4\" fill=\"#1b2430\"/><text x=\"242\" y=\"135\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#2e7a57\" text-anchor=\"end\">d = 6<\/text><text x=\"270\" y=\"123\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1e6f9f\">10<\/text><text x=\"224\" y=\"163\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#b23a2a\" text-anchor=\"middle\">8<\/text><text x=\"272\" y=\"163\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#b23a2a\" text-anchor=\"middle\">8<\/text><text x=\"248\" y=\"206\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\" text-anchor=\"middle\">chord = 8 + 8 = 16<\/text><\/svg>","idea":"<p>A <b>tangent<\/b> = a straight line that just touches the circle at one point. A <b>chord<\/b> = a straight line from one edge point to another.<\/p><p>Left: the radius meets the red tangent at 90°, so we get a right triangle. Right: the green line from the centre meets the chord at 90° and cuts it in half.<\/p><p>Then use a² + b² = c² (Pythagoras) on the right triangle.<\/p>","formulas":[{"f":"∠(radius, tangent) = 90° at the point of contact","say":"The <b>point of contact<\/b> = where the tangent touches. Always draw the radius to that point: it makes a right triangle."},{"f":"Tangent length: t = √(D² − r²)","say":"t = the tangent from the outside point to the circle. D = distance from the <b>centre<\/b> to the outside point, r = radius."},{"f":"Chord length: chord = 2√(r² − d²)","say":"d = the straight (90°) distance from the centre to the chord. √(r² − d²) is half the chord, so double it."}],"ex":{"q":"Left picture: r = 5, and the outside point is 13 from the centre. How long is the tangent?","steps":["The triangle has a 90° corner at the touching point. Its longest side is D = 13.","t = √(13² − 5²) = √(169 − 25) = √144 = <b>12<\/b> ✅"]},"ex2":{"q":"Right picture: r = 10, and the chord is 6 from the centre. How long is the chord?","steps":["Half the chord = √(10² − 6²) = √(100 − 36) = √64 = 8","Whole chord = 2 × 8 = <b>16<\/b> ✅"]},"tip":"⚠️ D is measured from the <b>centre<\/b>. A point 13 from the centre is only 13 − 5 = 8 from the circle’s edge — do not use 8.","part":"Geometry"},{"id":"G24","title":"Shapes inside shapes: find the one length both shapes share.","svg":"<svg viewBox=\"0 0 320 198\" aria-hidden=\"true\"><text x=\"56\" y=\"20\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\">circle in square<\/text><polygon points=\"10,36 102,36 102,128 10,128\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\" stroke-linejoin=\"round\"/><circle cx=\"56\" cy=\"82\" r=\"46\" fill=\"#fff\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><line x1=\"56\" y1=\"82\" x2=\"102\" y2=\"82\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><circle cx=\"56\" cy=\"82\" r=\"3.5\" fill=\"#1e6f9f\"/><text x=\"79\" y=\"76\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\">5<\/text><text x=\"56\" y=\"145\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#1b2430\" text-anchor=\"middle\">10<\/text><text x=\"56\" y=\"172\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\">diameter = side<\/text><text x=\"56\" y=\"188\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\">r = s ÷ 2<\/text><text x=\"160\" y=\"20\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\">square in circle<\/text><circle cx=\"160\" cy=\"82\" r=\"46\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\"/><polygon points=\"127.5,49.5 192.5,49.5 192.5,114.5 127.5,114.5\" fill=\"#fff\" stroke=\"#1e6f9f\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"127.5\" y1=\"114.5\" x2=\"192.5\" y2=\"49.5\" stroke=\"#b23a2a\" stroke-width=\"3\"/><text x=\"152\" y=\"76\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#b23a2a\" text-anchor=\"middle\">10<\/text><text x=\"160\" y=\"145\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\">side 5√2<\/text><text x=\"160\" y=\"172\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#b23a2a\" text-anchor=\"middle\">diagonal<\/text><text x=\"160\" y=\"188\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#b23a2a\" text-anchor=\"middle\">= diameter<\/text><text x=\"266\" y=\"20\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\">triangle in circle<\/text><circle cx=\"266\" cy=\"82\" r=\"46\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"3\"/><polygon points=\"266,36 226.2,105 305.8,105\" fill=\"#eef5fa\" stroke=\"#2e7a57\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"266\" y1=\"82\" x2=\"266\" y2=\"36\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><circle cx=\"266\" cy=\"82\" r=\"3.5\" fill=\"#1e6f9f\"/><text x=\"271\" y=\"66\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#1e6f9f\">6<\/text><text x=\"266\" y=\"122\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#2e7a57\" text-anchor=\"middle\">6√3<\/text><text x=\"266\" y=\"172\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#2e7a57\" text-anchor=\"middle\">side = r√3<\/text><\/svg>","idea":"<p><b>Inscribed<\/b> = drawn inside and touching the outside shape. The <b>diameter<\/b> = 2r = the full width of the circle.<\/p><p>Circle in a square: the diameter equals the square’s side. Square in a circle: the square’s <b>diagonal<\/b> (red, corner to corner) equals the diameter.<\/p><p>An <b>equilateral<\/b> triangle (all 3 sides equal) in a circle: each side = r√3.<\/p>","formulas":[{"f":"Circle in a square: r = s ÷ 2 · circle ÷ square = π/4","say":"s = side of the square, r = radius. The circle always covers π/4 ≈ 78.5% of the square, at any size."},{"f":"Square in a circle: s = r√2 = d ÷ √2 · A = 2r²","say":"d = diameter = 2r = the square’s diagonal. s = the square’s side, A = the square’s area."},{"f":"Equilateral triangle in a circle: s = r√3","say":"s = each side of the triangle, r = the circle’s radius. The triangle’s height is 3r ÷ 2 (not r√3)."}],"ex":{"q":"A square has side 10. A circle fits inside it, and a smaller square fits inside that circle (first two pictures). Find the circle’s area and the small square’s side and area.","steps":["The circle’s diameter = the side = 10, so r = 10 ÷ 2 = 5.","Circle area = π × 5² = <b>25π ≈ 78.54<\/b> (78.5% of the square’s 100)","The small square’s diagonal = the diameter = 10.","Side = 10 ÷ √2 = 5√2 ≈ <b>7.07<\/b>. Area = 2 × 5² = <b>50<\/b> ✅"]},"ex2":{"q":"An equilateral triangle sits inside a circle of radius 6 (third picture). Find its side, height and area.","steps":["Side = r√3 = 6√3 ≈ <b>10.39<\/b>","Height = 3r ÷ 2 = 3 × 6 ÷ 2 = <b>9<\/b>","Area = ½ × 6√3 × 9 = 27√3 ≈ <b>46.77<\/b> ✅"]},"tip":"⚠️ Circle in a square: diameter = <b>side<\/b>. Square in a circle: diameter = <b>diagonal<\/b>. Do not mix them up.","part":"Geometry"},{"id":"G25","title":"Shaded area = the whole shape − the part cut out of it.","svg":"<svg viewBox=\"0 0 320 232\" aria-hidden=\"true\"><rect x=\"80\" y=\"18\" width=\"160\" height=\"160\" fill=\"#cfe3f0\" stroke=\"#1b2430\" stroke-width=\"3\"/><circle cx=\"160\" cy=\"98\" r=\"64\" fill=\"#fff\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"160\" y1=\"98\" x2=\"224\" y2=\"98\" stroke=\"#b23a2a\" stroke-width=\"3\"/><circle cx=\"160\" cy=\"98\" r=\"4\" fill=\"#1b2430\"/><text x=\"192\" y=\"90\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#b23a2a\" text-anchor=\"middle\">r = 4<\/text><text x=\"160\" y=\"198\" font-family=\"Arial\" font-size=\"15\" font-weight=\"700\" fill=\"#1b2430\" text-anchor=\"middle\">10<\/text><text x=\"70\" y=\"103\" font-family=\"Arial\" font-size=\"15\" font-weight=\"700\" fill=\"#1b2430\" text-anchor=\"end\">10<\/text><text x=\"250\" y=\"38\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1e6f9f\">blue<\/text><text x=\"250\" y=\"54\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1e6f9f\">= shaded<\/text><text x=\"160\" y=\"222\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\" text-anchor=\"middle\">shaded = square − circle<\/text><\/svg>","idea":"<p>A <b>shaded region<\/b> = the coloured part of a picture. Its shape is often strange.<\/p><p>Do not try to measure it directly. Find the area of the whole square, then take away the white circle.<\/p>","formulas":[{"f":"shaded = whole − removed","say":"whole = area of the big outside shape. removed = area of each piece cut out. Always subtract <b>areas<\/b>, never lengths."},{"f":"square = s² · circle = πr²","say":"The two areas you need most often here. s = side of the square, r = radius of the circle."}],"ex":{"q":"In the picture the square has side 10, and a circle of radius 4 is cut out. Find the blue area.","steps":["Whole square: 10 × 10 = 100","Removed circle: π × 4² = 16π ≈ 50.27","Shaded = 100 − 16π ≈ <b>49.73<\/b> ✅"]},"ex2":{"q":"A circle fits exactly inside a square of side 10. Find the area of the four corners left over.","steps":["The circle touches all four sides, so r = 10 ÷ 2 = 5.","Corners = 100 − π × 5² = 100 − 25π ≈ 100 − 78.54 = <b>21.46<\/b> ✅ (about 21.5% of the square)"]},"tip":"💡 First write the plan in words: “shaded = square − circle”. Then put in the numbers.","part":"Geometry"},{"id":"G26","title":"Similar shapes: same shape, new size. Lengths × k, areas × k², volumes × k³.","svg":"<svg viewBox=\"0 0 320 236\" aria-hidden=\"true\"><text x=\"6\" y=\"56\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">small<\/text><text x=\"6\" y=\"150\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">k = 2<\/text><line x1=\"60\" y1=\"50\" x2=\"92\" y2=\"50\" stroke=\"#1e6f9f\" stroke-width=\"4\"/><text x=\"76\" y=\"40\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\">1<\/text><line x1=\"60\" y1=\"150\" x2=\"124\" y2=\"150\" stroke=\"#1e6f9f\" stroke-width=\"4\"/><text x=\"92\" y=\"140\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\">2<\/text><line x1=\"60\" y1=\"145\" x2=\"60\" y2=\"155\" stroke=\"#1e6f9f\" stroke-width=\"2\"/><line x1=\"92\" y1=\"145\" x2=\"92\" y2=\"155\" stroke=\"#1e6f9f\" stroke-width=\"2\"/><line x1=\"124\" y1=\"145\" x2=\"124\" y2=\"155\" stroke=\"#1e6f9f\" stroke-width=\"2\"/><line x1=\"60\" y1=\"45\" x2=\"60\" y2=\"55\" stroke=\"#1e6f9f\" stroke-width=\"2\"/><line x1=\"92\" y1=\"45\" x2=\"92\" y2=\"55\" stroke=\"#1e6f9f\" stroke-width=\"2\"/><polygon points=\"150,30 182,30 182,62 150,62\" fill=\"#eef5fa\" stroke=\"#2e7a57\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"150,110 214,110 214,174 150,174\" fill=\"#eef5fa\" stroke=\"#2e7a57\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><line x1=\"182\" y1=\"110\" x2=\"182\" y2=\"174\" stroke=\"#2e7a57\" stroke-width=\"1.5\"/><line x1=\"150\" y1=\"142\" x2=\"214\" y2=\"142\" stroke=\"#2e7a57\" stroke-width=\"1.5\"/><polygon points=\"226,30 258,30 270,18 238,18\" fill=\"#dcebf5\" stroke=\"#1b2430\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"258,62 270,50 270,18 258,30\" fill=\"#cfe3f0\" stroke=\"#1b2430\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"226,62 258,62 258,30 226,30\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><line x1=\"226\" y1=\"62\" x2=\"238\" y2=\"50\" stroke=\"#4a5866\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/><line x1=\"238\" y1=\"50\" x2=\"270\" y2=\"50\" stroke=\"#4a5866\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/><line x1=\"238\" y1=\"50\" x2=\"238\" y2=\"18\" stroke=\"#4a5866\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/><polygon points=\"226,110 290,110 312,88 248,88\" fill=\"#dcebf5\" stroke=\"#1b2430\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"290,174 312,152 312,88 290,110\" fill=\"#cfe3f0\" stroke=\"#1b2430\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"226,174 290,174 290,110 226,110\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><line x1=\"226\" y1=\"174\" x2=\"248\" y2=\"152\" stroke=\"#4a5866\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/><line x1=\"248\" y1=\"152\" x2=\"312\" y2=\"152\" stroke=\"#4a5866\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/><line x1=\"248\" y1=\"152\" x2=\"248\" y2=\"88\" stroke=\"#4a5866\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/><line x1=\"258\" y1=\"174\" x2=\"258\" y2=\"110\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"226\" y1=\"142\" x2=\"290\" y2=\"142\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"258\" y1=\"110\" x2=\"280\" y2=\"88\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"237\" y1=\"99\" x2=\"301\" y2=\"99\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"290\" y1=\"142\" x2=\"312\" y2=\"120\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"301\" y1=\"163\" x2=\"301\" y2=\"99\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><text x=\"92\" y=\"206\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\">length × 2<\/text><text x=\"182\" y=\"206\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#2e7a57\" text-anchor=\"middle\">area × 4<\/text><text x=\"269\" y=\"206\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#b23a2a\" text-anchor=\"middle\">volume × 8<\/text><text x=\"160\" y=\"228\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\">every length × 2 → area × 2², volume × 2³<\/text><\/svg>","idea":"<p><b>Similar<\/b> = exactly the same shape, only bigger or smaller. <b>k<\/b> = the scale factor = big length ÷ small length.<\/p><p>In the picture k = 2. Each length doubles, but the big square holds 4 small squares and the big cube holds 8 small cubes.<\/p>","formulas":[{"f":"lengths × k · areas × k² · volumes × k³","say":"k = how many times longer every side gets. Surface area is an area, so it also uses k²."},{"f":"k = big length ÷ small length","say":"Use any pair of matching sides. Going backwards from an area ratio, take the square root: area × 9 means k = √9 = 3."}],"ex":{"q":"A box is 1 by 2 by 6, so its volume is 12 and its surface area is 40. Double every edge (k = 2).","steps":["The new box is 2 by 4 by 12.","Volume × k³ = 12 × 8 = <b>96<\/b> (check: 2 × 4 × 12 = 96)","Surface area × k² = 40 × 4 = <b>160<\/b> ✅ (check: 2(8 + 24 + 48) = 160)"]},"ex2":{"q":"Two triangles are similar. The big one has 9 times the area. A small side is 4. Find the matching big side.","steps":["Area ratio = k² = 9, so k = √9 = 3.","Big side = 4 × 3 = <b>12<\/b> ✅"]},"tip":"⚠️ A model at half size (k = ½) holds only ½ × ½ × ½ = ⅛ as much, not half.","part":"Geometry"},{"id":"G27","title":"A box: volume = l × w × h. Its longest diagonal = √(l² + w² + h²).","svg":"<svg viewBox=\"0 0 320 232\" aria-hidden=\"true\"><polygon points=\"70,38 124,38 149.1,12.9 95.1,12.9\" fill=\"#dcebf5\" stroke=\"#1b2430\" stroke-width=\"0.01\" stroke-linejoin=\"round\"/><polygon points=\"124,200 149.1,174.9 149.1,12.9 124,38\" fill=\"#cfe3f0\" stroke=\"#1b2430\" stroke-width=\"0.01\" stroke-linejoin=\"round\"/><polygon points=\"70,200 124,200 124,38 70,38\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"0.01\" stroke-linejoin=\"round\"/><line x1=\"70\" y1=\"200\" x2=\"95.1\" y2=\"174.9\" stroke=\"#4a5866\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line x1=\"95.1\" y1=\"174.9\" x2=\"149.1\" y2=\"174.9\" stroke=\"#4a5866\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line x1=\"95.1\" y1=\"174.9\" x2=\"95.1\" y2=\"12.9\" stroke=\"#4a5866\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line x1=\"70\" y1=\"200\" x2=\"149.1\" y2=\"174.9\" stroke=\"#2e7a57\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/><line x1=\"70\" y1=\"200\" x2=\"149.1\" y2=\"12.9\" stroke=\"#b23a2a\" stroke-width=\"3\"/><polygon points=\"70,200 124,200 124,38 70,38\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"70,38 124,38 149.1,12.9 95.1,12.9\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><polygon points=\"124,200 149.1,174.9 149.1,12.9 124,38\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><text x=\"97\" y=\"218\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1b2430\" text-anchor=\"middle\">l = 4<\/text><text x=\"62\" y=\"124\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1b2430\" text-anchor=\"end\">h = 12<\/text><text x=\"144.6\" y=\"199.4\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1b2430\">w = 3<\/text><circle cx=\"70\" cy=\"200\" r=\"4\" fill=\"#1b2430\"/><circle cx=\"149.1\" cy=\"12.9\" r=\"4\" fill=\"#1b2430\"/><text x=\"168\" y=\"70\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#b23a2a\">red: space diagonal<\/text><text x=\"168\" y=\"88\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#b23a2a\">√(4² + 3² + 12²) = 13<\/text><text x=\"168\" y=\"136\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#2e7a57\">green (on the floor):<\/text><text x=\"168\" y=\"154\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#2e7a57\">√(4² + 3²) = 5<\/text><text x=\"168\" y=\"188\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">dashed = hidden edge<\/text><\/svg>","idea":"<p>A <b>box<\/b> (rectangular solid) has length l, width w and height h. Dashed lines are edges hidden at the back.<\/p><p><b>Volume<\/b> = the space inside. <b>Surface area<\/b> = the total area of the 6 flat sides (<b>faces<\/b>).<\/p><p>The red <b>space diagonal<\/b> runs from a bottom corner to the opposite top corner, right through the box.<\/p>","formulas":[{"f":"V = l × w × h · SA = 2(lw + lh + wh)","say":"The box has 3 different faces, and each one appears twice (front and back, top and bottom, left and right). That is why we double."},{"f":"Space diagonal: d = √(l² + w² + h²)","say":"Pythagoras twice: across the floor (green), then up the height. d is the longest stick that fits in the box."},{"f":"Cube: V = s³ · SA = 6s² · d = s√3","say":"A <b>cube<\/b> = a box with every edge equal to s. It has 6 equal square faces."}],"ex":{"q":"The box in the picture: l = 4, w = 3, h = 12. Find its volume, surface area and space diagonal.","steps":["V = 4 × 3 × 12 = <b>144<\/b>","SA = 2(4×3 + 4×12 + 3×12) = 2(12 + 48 + 36) = <b>192<\/b>","Floor diagonal (green) = √(4² + 3²) = √25 = 5","Space diagonal = √(5² + 12²) = √169 = <b>13<\/b> ✅"]},"ex2":{"q":"A cube has edge 4. Find V, SA and d.","steps":["V = 4³ = <b>64<\/b>","SA = 6 × 4² = 6 × 16 = <b>96<\/b>","d = 4√3 ≈ <b>6.93<\/b> ✅"]},"tip":"⚠️ Volume is in cubic units (cm³), surface area in square units (cm²). They can never be “equal”, even when the numbers match.","part":"Geometry"},{"id":"G28","title":"A cylinder is a stack of circles: volume = circle area × height.","svg":"<svg viewBox=\"0 0 320 204\" aria-hidden=\"true\"><rect x=\"45\" y=\"56\" width=\"54\" height=\"72\" fill=\"#eef5fa\"/><ellipse cx=\"72\" cy=\"128\" rx=\"27\" ry=\"9\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"0.01\"/><path d=\"M45 128 A27 9 0 0 1 99 128\" fill=\"none\" stroke=\"#4a5866\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><path d=\"M45 128 A27 9 0 0 0 99 128\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"45\" y1=\"56\" x2=\"45\" y2=\"128\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"99\" y1=\"56\" x2=\"99\" y2=\"128\" stroke=\"#1b2430\" stroke-width=\"3\"/><ellipse cx=\"72\" cy=\"56\" rx=\"27\" ry=\"9\" fill=\"#dcebf5\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"72\" y1=\"56\" x2=\"99\" y2=\"56\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><circle cx=\"72\" cy=\"56\" r=\"3\" fill=\"#1e6f9f\"/><text x=\"85.5\" y=\"42\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\">r = 3<\/text><text x=\"37\" y=\"97\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#9c6510\" text-anchor=\"end\">h = 8<\/text><line x1=\"106\" y1=\"92\" x2=\"117\" y2=\"92\" stroke=\"#4a5866\" stroke-width=\"2\"/><polygon points=\"117,88 123,92 117,96\" fill=\"#4a5866\" stroke=\"#4a5866\" stroke-width=\"1\" stroke-linejoin=\"round\"/><rect x=\"128\" y=\"56\" width=\"169.6\" height=\"72\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\"/><text x=\"212.8\" y=\"46\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\">width = 2πr ≈ 18.85<\/text><text x=\"212.8\" y=\"90\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\">the curved side (label)<\/text><text x=\"212.8\" y=\"107\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#4a5866\" text-anchor=\"middle\">area = 2πr × h<\/text><text x=\"212.8\" y=\"146\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#9c6510\" text-anchor=\"middle\">height = h = 8<\/text><text x=\"160\" y=\"176\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\">unroll the curved side → a rectangle<\/text><text x=\"160\" y=\"193\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\">plus the top and bottom circles: 2 × πr²<\/text><\/svg>","idea":"<p>A <b>cylinder<\/b> = a can shape: two equal circles (top and bottom) joined by a curved side.<\/p><p>Peel off the curved side, like a can’s label. It unrolls into a rectangle 2πr wide and h tall.<\/p>","formulas":[{"f":"V = πr²h · SA = 2πr² + 2πrh","say":"πr² = the area of one circle, h = height. SA = the two circles (2πr²) plus the label rectangle (2πr × h)."}],"ex":{"q":"The picture: radius 3, height 8. Find the volume and the surface area.","steps":["One circle: π × 3² = 9π","V = 9π × 8 = <b>72π ≈ 226.19<\/b>","Two circles: 2 × 9π = 18π. Label: 2π × 3 × 8 = 48π","SA = 18π + 48π = <b>66π ≈ 207.35<\/b> ✅"]},"tip":"⚠️ An open can (no lid) has only one circle: SA = πr² + 2πrh. Read the question for “open”.","part":"Geometry"},{"id":"G29","title":"A cone holds ⅓ of a cylinder. A sphere: V = (4/3)πr³, SA = 4πr².","svg":"<svg viewBox=\"0 0 320 210\" aria-hidden=\"true\"><polygon points=\"25,150 82,74 139,150\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"0.01\" stroke-linejoin=\"round\"/><ellipse cx=\"82\" cy=\"150\" rx=\"57\" ry=\"13\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"0.01\"/><path d=\"M25 150 A57 13 0 0 1 139 150\" fill=\"none\" stroke=\"#4a5866\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><path d=\"M25 150 A57 13 0 0 0 139 150\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"25\" y1=\"150\" x2=\"82\" y2=\"74\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"139\" y1=\"150\" x2=\"82\" y2=\"74\" stroke=\"#b23a2a\" stroke-width=\"3.5\"/><line x1=\"82\" y1=\"150\" x2=\"82\" y2=\"74\" stroke=\"#9c6510\" stroke-width=\"2.5\" stroke-dasharray=\"6 4\"/><line x1=\"82\" y1=\"150\" x2=\"139\" y2=\"150\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><polyline points=\"82,141 91,141 91,150\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\" stroke-linejoin=\"round\"/><circle cx=\"82\" cy=\"74\" r=\"4\" fill=\"#1b2430\"/><circle cx=\"82\" cy=\"150\" r=\"3\" fill=\"#1b2430\"/><text x=\"76\" y=\"117\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#9c6510\" text-anchor=\"end\">4<\/text><text x=\"110.5\" y=\"180\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\">r = 3<\/text><text x=\"120.5\" y=\"110\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#b23a2a\">ℓ = 5<\/text><text x=\"82\" y=\"200\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\">cone: dashed height h = 4<\/text><circle cx=\"240\" cy=\"112\" r=\"57\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\"/><path d=\"M183 112 A57 14 0 0 1 297 112\" fill=\"none\" stroke=\"#4a5866\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><path d=\"M183 112 A57 14 0 0 0 297 112\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><line x1=\"240\" y1=\"112\" x2=\"199.7\" y2=\"71.7\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><circle cx=\"240\" cy=\"112\" r=\"3\" fill=\"#1b2430\"/><text x=\"220\" y=\"82\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1e6f9f\">r = 3<\/text><text x=\"240\" y=\"200\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\" text-anchor=\"middle\">sphere (ball)<\/text><\/svg>","idea":"<p>A <b>cone<\/b> = a circle base that narrows to a point. h = the straight-up height; <b>ℓ<\/b> (red) = the <b>slant height<\/b> along the side.<\/p><p>r, h and ℓ make a right triangle, so ℓ = √(r² + h²).<\/p><p>A <b>sphere<\/b> = a ball. Every point on its surface is r from the centre.<\/p>","formulas":[{"f":"Cone: V = ⅓πr²h · SA = πr² + πrℓ","say":"πr² = the base circle. πrℓ = the curved side: use the slant ℓ here, not the height h."},{"f":"Slant height: ℓ = √(r² + h²)","say":"Pythagoras on the right triangle inside the cone (radius, height, slant)."},{"f":"Sphere: V = (4/3)πr³ · SA = 4πr²","say":"r is the only number you need. Double r and the volume goes × 8, the surface × 4."}],"ex":{"q":"The cone in the picture: r = 3, h = 4. Find ℓ, the volume and the surface area.","steps":["ℓ = √(3² + 4²) = √25 = <b>5<\/b>","V = ⅓ × π × 3² × 4 = ⅓ × 36π = <b>12π ≈ 37.70<\/b>","SA = π × 3² + π × 3 × 5 = 9π + 15π = <b>24π ≈ 75.40<\/b> ✅"]},"ex2":{"q":"The sphere in the picture has r = 3. Find V and SA.","steps":["V = (4/3) × π × 3³ = (4/3) × 27π = <b>36π ≈ 113.10<\/b>","SA = 4 × π × 3² = <b>36π ≈ 113.10<\/b> ✅ (same number, but cubic units vs square units)"]},"tip":"💡 A cone and a cylinder with the same base and height: the cone holds exactly ⅓ as much.","part":"Geometry"},{"id":"C1","title":"The grid: a flat x-axis and a standing y-axis that cross at the origin.","svg":"<svg viewBox=\"0 0 320 228\" aria-hidden=\"true\"><g stroke=\"#e3e7ea\" stroke-width=\"1\"><line x1=\"40\" y1=\"20\" x2=\"40\" y2=\"200\"/><line x1=\"70\" y1=\"20\" x2=\"70\" y2=\"200\"/><line x1=\"100\" y1=\"20\" x2=\"100\" y2=\"200\"/><line x1=\"130\" y1=\"20\" x2=\"130\" y2=\"200\"/><line x1=\"160\" y1=\"20\" x2=\"160\" y2=\"200\"/><line x1=\"190\" y1=\"20\" x2=\"190\" y2=\"200\"/><line x1=\"220\" y1=\"20\" x2=\"220\" y2=\"200\"/><line x1=\"250\" y1=\"20\" x2=\"250\" y2=\"200\"/><line x1=\"280\" y1=\"20\" x2=\"280\" y2=\"200\"/><line x1=\"40\" y1=\"200\" x2=\"280\" y2=\"200\"/><line x1=\"40\" y1=\"170\" x2=\"280\" y2=\"170\"/><line x1=\"40\" y1=\"140\" x2=\"280\" y2=\"140\"/><line x1=\"40\" y1=\"110\" x2=\"280\" y2=\"110\"/><line x1=\"40\" y1=\"80\" x2=\"280\" y2=\"80\"/><line x1=\"40\" y1=\"50\" x2=\"280\" y2=\"50\"/><line x1=\"40\" y1=\"20\" x2=\"280\" y2=\"20\"/><\/g><line x1=\"40\" y1=\"110\" x2=\"280\" y2=\"110\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"284\" y=\"114\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\">x<\/text><line x1=\"160\" y1=\"20\" x2=\"160\" y2=\"200\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"160\" y=\"15\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" text-anchor=\"middle\">y<\/text><text x=\"70\" y=\"125\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">−3<\/text><text x=\"100\" y=\"125\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">−2<\/text><text x=\"130\" y=\"125\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">−1<\/text><text x=\"190\" y=\"125\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">1<\/text><text x=\"220\" y=\"125\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">2<\/text><text x=\"250\" y=\"125\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">3<\/text><text x=\"155\" y=\"174\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">−2<\/text><text x=\"155\" y=\"144\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">−1<\/text><text x=\"155\" y=\"84\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">1<\/text><text x=\"155\" y=\"54\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">2<\/text><text x=\"235\" y=\"47\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">Quarter I<\/text><text x=\"235\" y=\"63\" font-family=\"Arial\" font-size=\"13\" fill=\"#1e6f9f\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(+, +)<\/text><text x=\"85\" y=\"47\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">Quarter II<\/text><text x=\"85\" y=\"63\" font-family=\"Arial\" font-size=\"13\" fill=\"#1e6f9f\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(−, +)<\/text><text x=\"85\" y=\"152\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">Quarter III<\/text><text x=\"85\" y=\"168\" font-family=\"Arial\" font-size=\"13\" fill=\"#1e6f9f\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(−, −)<\/text><text x=\"235\" y=\"152\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">Quarter IV<\/text><text x=\"235\" y=\"168\" font-family=\"Arial\" font-size=\"13\" fill=\"#1e6f9f\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(+, −)<\/text><circle cx=\"160\" cy=\"110\" r=\"5\" fill=\"#b23a2a\"/><text x=\"154\" y=\"103\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#b23a2a\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">O<\/text><circle cx=\"48\" cy=\"216\" r=\"5\" fill=\"#b23a2a\"/><text x=\"58\" y=\"220\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">O = the origin = (0, 0), where the axes cross<\/text><\/svg>","idea":"<p>The <b>x-axis<\/b> = the flat number line, going left and right.<\/p><p>The <b>y-axis<\/b> = the standing number line, going up and down.<\/p><p>They cross at the <b>origin<\/b> = the point (0, 0), the red dot. The axes cut the page into four <b>quarters<\/b> (also called quadrants).<\/p>","formulas":[{"f":"origin = (0, 0)","say":"The origin is the starting point. Both numbers are zero there."},{"f":"right of the y-axis: x &gt; 0 · left: x &lt; 0","say":"Numbers on the x-axis grow to the right and are negative (−) on the left."},{"f":"above the x-axis: y &gt; 0 · below: y &lt; 0","say":"Numbers on the y-axis grow upward and are negative (−) below."},{"f":"I (+, +) · II (−, +) · III (−, −) · IV (+, −)","say":"The signs of (x, y) in each quarter. The quarters are numbered going round anticlockwise, starting top right."}],"ex":{"q":"Which quarter holds the point (−3, 2)?","steps":["x = −3 is negative, so the point is <b>left<\/b> of the y-axis.","y = 2 is positive, so the point is <b>above<\/b> the x-axis.","Left and up = top left = <b>Quarter II<\/b> ✅"]},"tip":"💡 Signs tell the quarter at once: (−, +) is always top left, (+, −) is always bottom right.","part":"Coordinate Geometry"},{"id":"C2","title":"A point (x, y) means: go x across, then y up. Count the squares to get a distance.","svg":"<svg viewBox=\"0 0 320 222\" aria-hidden=\"true\"><g stroke=\"#e3e7ea\" stroke-width=\"1\"><line x1=\"56\" y1=\"20\" x2=\"56\" y2=\"202\"/><line x1=\"82\" y1=\"20\" x2=\"82\" y2=\"202\"/><line x1=\"108\" y1=\"20\" x2=\"108\" y2=\"202\"/><line x1=\"134\" y1=\"20\" x2=\"134\" y2=\"202\"/><line x1=\"160\" y1=\"20\" x2=\"160\" y2=\"202\"/><line x1=\"186\" y1=\"20\" x2=\"186\" y2=\"202\"/><line x1=\"212\" y1=\"20\" x2=\"212\" y2=\"202\"/><line x1=\"238\" y1=\"20\" x2=\"238\" y2=\"202\"/><line x1=\"264\" y1=\"20\" x2=\"264\" y2=\"202\"/><line x1=\"56\" y1=\"202\" x2=\"264\" y2=\"202\"/><line x1=\"56\" y1=\"176\" x2=\"264\" y2=\"176\"/><line x1=\"56\" y1=\"150\" x2=\"264\" y2=\"150\"/><line x1=\"56\" y1=\"124\" x2=\"264\" y2=\"124\"/><line x1=\"56\" y1=\"98\" x2=\"264\" y2=\"98\"/><line x1=\"56\" y1=\"72\" x2=\"264\" y2=\"72\"/><line x1=\"56\" y1=\"46\" x2=\"264\" y2=\"46\"/><line x1=\"56\" y1=\"20\" x2=\"264\" y2=\"20\"/><\/g><line x1=\"56\" y1=\"176\" x2=\"264\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"268\" y=\"180\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\">x<\/text><line x1=\"134\" y1=\"20\" x2=\"134\" y2=\"202\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"134\" y=\"15\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" text-anchor=\"middle\">y<\/text><text x=\"56\" y=\"191\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">−3<\/text><text x=\"82\" y=\"191\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">−2<\/text><text x=\"108\" y=\"191\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">−1<\/text><text x=\"160\" y=\"191\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">1<\/text><text x=\"186\" y=\"191\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">2<\/text><text x=\"212\" y=\"191\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">3<\/text><text x=\"238\" y=\"191\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">4<\/text><text x=\"129\" y=\"154\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">1<\/text><text x=\"129\" y=\"102\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">3<\/text><text x=\"129\" y=\"76\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">4<\/text><text x=\"129\" y=\"50\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">5<\/text><line x1=\"82\" y1=\"124\" x2=\"212\" y2=\"124\" stroke=\"#2e7a57\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/><line x1=\"212\" y1=\"124\" x2=\"212\" y2=\"46\" stroke=\"#b23a2a\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/><circle cx=\"82\" cy=\"124\" r=\"5\" fill=\"#1b2430\"/><circle cx=\"212\" cy=\"124\" r=\"5\" fill=\"#1b2430\"/><circle cx=\"212\" cy=\"46\" r=\"5\" fill=\"#1b2430\"/><text x=\"82\" y=\"114\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(−2, 2)<\/text><text x=\"220\" y=\"140\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(3, 2)<\/text><text x=\"204\" y=\"44\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(3, 5)<\/text><text x=\"167.8\" y=\"141\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#2e7a57\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">5 across<\/text><text x=\"219\" y=\"90\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#b23a2a\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">3 up<\/text><\/svg>","idea":"<p>A point is written <b>(x, y)<\/b>. The first number = steps across. The second number = steps up.<\/p><p>To plot (3, 5): start at (0, 0), go 3 right, then 5 up.<\/p><p>The green line is flat, so its length is just the gap in x. The red line stands straight up, so its length is the gap in y.<\/p>","formulas":[{"f":"(x, y) = (across, up)","say":"x comes first, always. A minus x means go left; a minus y means go down."},{"f":"same y (flat line): distance = bigger x − smaller x","say":"Use this when the two points are at the same height, like the green line."},{"f":"same x (straight up): distance = bigger y − smaller y","say":"Use this when one point is straight above the other, like the red line."}],"ex":{"q":"How far is (−2, 2) from (3, 2)? (the green line)","steps":["Both points have y = 2, so the line is flat. Use the x values.","Distance = 3 − (−2) = 3 + 2 = <b>5<\/b> ✅ (count the squares: 5)"]},"ex2":{"q":"How far is (3, 2) from (3, 5)? (the red line)","steps":["Both points have x = 3, so the line goes straight up. Use the y values.","Distance = 5 − 2 = <b>3<\/b> ✅"]},"tip":"⚠️ Minus a negative is plus: 3 − (−2) = 5, not 1. Count the squares to check.","part":"Coordinate Geometry"},{"id":"C3","title":"Distance between two points: make a right triangle, then use a² + b² = c².","svg":"<svg viewBox=\"0 0 320 204\" aria-hidden=\"true\"><g stroke=\"#e3e7ea\" stroke-width=\"1\"><line x1=\"52\" y1=\"22\" x2=\"52\" y2=\"182\"/><line x1=\"84\" y1=\"22\" x2=\"84\" y2=\"182\"/><line x1=\"116\" y1=\"22\" x2=\"116\" y2=\"182\"/><line x1=\"148\" y1=\"22\" x2=\"148\" y2=\"182\"/><line x1=\"180\" y1=\"22\" x2=\"180\" y2=\"182\"/><line x1=\"212\" y1=\"22\" x2=\"212\" y2=\"182\"/><line x1=\"244\" y1=\"22\" x2=\"244\" y2=\"182\"/><line x1=\"276\" y1=\"22\" x2=\"276\" y2=\"182\"/><line x1=\"52\" y1=\"182\" x2=\"276\" y2=\"182\"/><line x1=\"52\" y1=\"150\" x2=\"276\" y2=\"150\"/><line x1=\"52\" y1=\"118\" x2=\"276\" y2=\"118\"/><line x1=\"52\" y1=\"86\" x2=\"276\" y2=\"86\"/><line x1=\"52\" y1=\"54\" x2=\"276\" y2=\"54\"/><line x1=\"52\" y1=\"22\" x2=\"276\" y2=\"22\"/><\/g><line x1=\"52\" y1=\"182\" x2=\"276\" y2=\"182\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"280\" y=\"186\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\">x<\/text><line x1=\"52\" y1=\"22\" x2=\"52\" y2=\"182\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"52\" y=\"17\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" text-anchor=\"middle\">y<\/text><polygon points=\"116,150 244,150 244,54\" fill=\"#eef5fa\"/><line x1=\"116\" y1=\"150\" x2=\"244\" y2=\"150\" stroke=\"#2e7a57\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/><line x1=\"244\" y1=\"150\" x2=\"244\" y2=\"54\" stroke=\"#b23a2a\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/><line x1=\"116\" y1=\"150\" x2=\"244\" y2=\"54\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><polyline points=\"235,150 235,141 244,141\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><circle cx=\"116\" cy=\"150\" r=\"5\" fill=\"#1b2430\"/><circle cx=\"244\" cy=\"54\" r=\"5\" fill=\"#1b2430\"/><text x=\"108\" y=\"155\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(2, 1)<\/text><text x=\"252\" y=\"58\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(6, 4)<\/text><text x=\"180\" y=\"168\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#2e7a57\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">4 across<\/text><text x=\"252\" y=\"107\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#b23a2a\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">3 up<\/text><text x=\"166\" y=\"92\" font-family=\"Arial\" font-size=\"15\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">d = 5<\/text><\/svg>","idea":"<p>Join the two points with the blue line. Under it, draw a flat green side and a straight-up red side.<\/p><p>That makes a <b>right triangle<\/b> (a triangle with a 90° corner). The blue line is its longest side, so Pythagoras gives its length.<\/p>","formulas":[{"f":"d = √( (x₂ − x₁)² + (y₂ − y₁)² )","say":"d = distance. (x₁, y₁) is the first point, (x₂, y₂) the second. x₂ − x₁ is the gap across (green), y₂ − y₁ the gap up (red)."}],"ex":{"q":"How far is (2, 1) from (6, 4)?","steps":["Gap across: 6 − 2 = 4. Gap up: 4 − 1 = 3.","Square and add: 4² + 3² = 16 + 9 = 25.","d = √25 = <b>5<\/b> ✅"]},"tip":"⚠️ Always <b>add<\/b> the two squares, never subtract. The order of the points does not matter, because squaring removes any minus sign.","part":"Coordinate Geometry"},{"id":"C4","title":"The midpoint is halfway: add the two x values and halve, then do the same for y.","svg":"<svg viewBox=\"0 0 320 238\" aria-hidden=\"true\"><g stroke=\"#e3e7ea\" stroke-width=\"1\"><line x1=\"70\" y1=\"20\" x2=\"70\" y2=\"210\"/><line x1=\"89\" y1=\"20\" x2=\"89\" y2=\"210\"/><line x1=\"108\" y1=\"20\" x2=\"108\" y2=\"210\"/><line x1=\"127\" y1=\"20\" x2=\"127\" y2=\"210\"/><line x1=\"146\" y1=\"20\" x2=\"146\" y2=\"210\"/><line x1=\"165\" y1=\"20\" x2=\"165\" y2=\"210\"/><line x1=\"184\" y1=\"20\" x2=\"184\" y2=\"210\"/><line x1=\"203\" y1=\"20\" x2=\"203\" y2=\"210\"/><line x1=\"222\" y1=\"20\" x2=\"222\" y2=\"210\"/><line x1=\"241\" y1=\"20\" x2=\"241\" y2=\"210\"/><line x1=\"70\" y1=\"210\" x2=\"241\" y2=\"210\"/><line x1=\"70\" y1=\"191\" x2=\"241\" y2=\"191\"/><line x1=\"70\" y1=\"172\" x2=\"241\" y2=\"172\"/><line x1=\"70\" y1=\"153\" x2=\"241\" y2=\"153\"/><line x1=\"70\" y1=\"134\" x2=\"241\" y2=\"134\"/><line x1=\"70\" y1=\"115\" x2=\"241\" y2=\"115\"/><line x1=\"70\" y1=\"96\" x2=\"241\" y2=\"96\"/><line x1=\"70\" y1=\"77\" x2=\"241\" y2=\"77\"/><line x1=\"70\" y1=\"58\" x2=\"241\" y2=\"58\"/><line x1=\"70\" y1=\"39\" x2=\"241\" y2=\"39\"/><line x1=\"70\" y1=\"20\" x2=\"241\" y2=\"20\"/><\/g><line x1=\"70\" y1=\"210\" x2=\"241\" y2=\"210\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"245\" y=\"214\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\">x<\/text><line x1=\"70\" y1=\"20\" x2=\"70\" y2=\"210\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"70\" y=\"15\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" text-anchor=\"middle\">y<\/text><line x1=\"165\" y1=\"96\" x2=\"165\" y2=\"210\" stroke=\"#b23a2a\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/><line x1=\"165\" y1=\"96\" x2=\"70\" y2=\"96\" stroke=\"#b23a2a\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/><line x1=\"108\" y1=\"153\" x2=\"222\" y2=\"39\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><line x1=\"132.3\" y1=\"120.3\" x2=\"140.7\" y2=\"128.7\" stroke=\"#1b2430\" stroke-width=\"2\"/><line x1=\"189.3\" y1=\"63.3\" x2=\"197.7\" y2=\"71.7\" stroke=\"#1b2430\" stroke-width=\"2\"/><circle cx=\"108\" cy=\"153\" r=\"5\" fill=\"#1b2430\"/><circle cx=\"222\" cy=\"39\" r=\"5\" fill=\"#1b2430\"/><circle cx=\"165\" cy=\"96\" r=\"5\" fill=\"#b23a2a\"/><text x=\"116\" y=\"169\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(2, 3)<\/text><text x=\"214\" y=\"33\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(8, 9)<\/text><text x=\"174\" y=\"112\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#b23a2a\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">M (5, 6)<\/text><text x=\"108\" y=\"225\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">2<\/text><text x=\"165\" y=\"225\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#b23a2a\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">5<\/text><text x=\"222\" y=\"225\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">8<\/text><text x=\"65\" y=\"157\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">3<\/text><text x=\"65\" y=\"100\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#b23a2a\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">6<\/text><text x=\"65\" y=\"43\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">9<\/text><\/svg>","idea":"<p>The <b>midpoint<\/b> = the point exactly in the middle of a line segment (the red dot M).<\/p><p>The two small tick marks show the two halves are equal. On the x-axis, 5 is halfway between 2 and 8.<\/p>","formulas":[{"f":"M = ( (x₁ + x₂) ÷ 2 , (y₁ + y₂) ÷ 2 )","say":"M = midpoint. Take the average of the two x values, then the average of the two y values."},{"f":"other end = 2 × M − A","say":"If you know one end A and the midpoint M, double M and take away A, for x and for y."}],"ex":{"q":"Find the midpoint of (2, 3) and (8, 9).","steps":["x: (2 + 8) ÷ 2 = 10 ÷ 2 = 5","y: (3 + 9) ÷ 2 = 12 ÷ 2 = 6","M = <b>(5, 6)<\/b> ✅"]},"ex2":{"q":"One end is (2, 3) and the midpoint is (5, 6). Find the other end.","steps":["x: 2 × 5 − 2 = 8","y: 2 × 6 − 3 = 9","Other end = <b>(8, 9)<\/b> ✅"]},"tip":"⚠️ For the midpoint you <b>add<\/b> and halve. Subtracting is for distance, not for the middle.","part":"Coordinate Geometry"},{"id":"C5","title":"Slope = how many steps up for each one step right (\"rise over run\").","svg":"<svg viewBox=\"0 0 320 232\" aria-hidden=\"true\"><g stroke=\"#e3e7ea\" stroke-width=\"1\"><line x1=\"20\" y1=\"20\" x2=\"20\" y2=\"210\"/><line x1=\"39\" y1=\"20\" x2=\"39\" y2=\"210\"/><line x1=\"58\" y1=\"20\" x2=\"58\" y2=\"210\"/><line x1=\"77\" y1=\"20\" x2=\"77\" y2=\"210\"/><line x1=\"96\" y1=\"20\" x2=\"96\" y2=\"210\"/><line x1=\"115\" y1=\"20\" x2=\"115\" y2=\"210\"/><line x1=\"134\" y1=\"20\" x2=\"134\" y2=\"210\"/><line x1=\"153\" y1=\"20\" x2=\"153\" y2=\"210\"/><line x1=\"20\" y1=\"210\" x2=\"153\" y2=\"210\"/><line x1=\"20\" y1=\"191\" x2=\"153\" y2=\"191\"/><line x1=\"20\" y1=\"172\" x2=\"153\" y2=\"172\"/><line x1=\"20\" y1=\"153\" x2=\"153\" y2=\"153\"/><line x1=\"20\" y1=\"134\" x2=\"153\" y2=\"134\"/><line x1=\"20\" y1=\"115\" x2=\"153\" y2=\"115\"/><line x1=\"20\" y1=\"96\" x2=\"153\" y2=\"96\"/><line x1=\"20\" y1=\"77\" x2=\"153\" y2=\"77\"/><line x1=\"20\" y1=\"58\" x2=\"153\" y2=\"58\"/><line x1=\"20\" y1=\"39\" x2=\"153\" y2=\"39\"/><line x1=\"20\" y1=\"20\" x2=\"153\" y2=\"20\"/><\/g><line x1=\"20\" y1=\"210\" x2=\"153\" y2=\"210\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"157\" y=\"214\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\">x<\/text><line x1=\"20\" y1=\"20\" x2=\"20\" y2=\"210\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"20\" y=\"15\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" text-anchor=\"middle\">y<\/text><line x1=\"39\" y1=\"181.5\" x2=\"146.7\" y2=\"20\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><line x1=\"58\" y1=\"153\" x2=\"134\" y2=\"153\" stroke=\"#2e7a57\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/><line x1=\"134\" y1=\"153\" x2=\"134\" y2=\"39\" stroke=\"#b23a2a\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/><circle cx=\"58\" cy=\"153\" r=\"5\" fill=\"#1b2430\"/><circle cx=\"134\" cy=\"39\" r=\"5\" fill=\"#1b2430\"/><text x=\"51\" y=\"147\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(2, 3)<\/text><text x=\"125\" y=\"44\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(6, 9)<\/text><text x=\"96\" y=\"171\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#2e7a57\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">4 right<\/text><text x=\"141\" y=\"101\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#b23a2a\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">6 up<\/text><line x1=\"196\" y1=\"52\" x2=\"230\" y2=\"26\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><text x=\"240\" y=\"36\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1b2430\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">uphill<\/text><text x=\"240\" y=\"52\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">slope +<\/text><line x1=\"196\" y1=\"78\" x2=\"230\" y2=\"104\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><text x=\"240\" y=\"88\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1b2430\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">downhill<\/text><text x=\"240\" y=\"104\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">slope −<\/text><line x1=\"196\" y1=\"143\" x2=\"230\" y2=\"143\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><text x=\"240\" y=\"140\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1b2430\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">flat<\/text><text x=\"240\" y=\"156\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">slope 0<\/text><line x1=\"213\" y1=\"180\" x2=\"213\" y2=\"210\" stroke=\"#b23a2a\" stroke-width=\"3\"/><text x=\"240\" y=\"192\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1b2430\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">straight up<\/text><text x=\"240\" y=\"208\" font-family=\"Arial\" font-size=\"13\" fill=\"#b23a2a\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">no slope<\/text><\/svg>","idea":"<p>The <b>slope<\/b> = how steep a line is. Walk from one point to the other along the grid.<\/p><p><b>Rise<\/b> = steps up (red). <b>Run<\/b> = steps right (green). Slope = rise ÷ run.<\/p><p>The small lines on the right show the four kinds of slope.<\/p>","formulas":[{"f":"m = (y₂ − y₁) ÷ (x₂ − x₁)","say":"m = slope. Top: the change in y (rise). Bottom: the change in x (run). Use the points in the same order on top and bottom."},{"f":"flat line: m = 0 · straight-up line: no slope","say":"A flat line never rises, so its slope is 0. A straight-up line has run 0, and you cannot divide by 0, so it has no slope (undefined)."}],"ex":{"q":"Find the slope of the line through (2, 3) and (6, 9).","steps":["Rise: 9 − 3 = 6","Run: 6 − 2 = 4","m = 6 ÷ 4 = <b>3/2<\/b> ✅ (1.5 up for each 1 right)"]},"tip":"⚠️ Do not mix the order: (y₂ − y₁) on top needs (x₂ − x₁) below, or the sign flips. And \"slope 0\" and \"no slope\" are different answers.","part":"Coordinate Geometry"},{"id":"C6","title":"y = mx + b: m tells how steep the line is, b tells where it crosses the y-axis.","svg":"<svg viewBox=\"0 0 320 232\" aria-hidden=\"true\"><g stroke=\"#e3e7ea\" stroke-width=\"1\"><line x1=\"26\" y1=\"22\" x2=\"26\" y2=\"212\"/><line x1=\"45\" y1=\"22\" x2=\"45\" y2=\"212\"/><line x1=\"64\" y1=\"22\" x2=\"64\" y2=\"212\"/><line x1=\"83\" y1=\"22\" x2=\"83\" y2=\"212\"/><line x1=\"102\" y1=\"22\" x2=\"102\" y2=\"212\"/><line x1=\"121\" y1=\"22\" x2=\"121\" y2=\"212\"/><line x1=\"140\" y1=\"22\" x2=\"140\" y2=\"212\"/><line x1=\"159\" y1=\"22\" x2=\"159\" y2=\"212\"/><line x1=\"178\" y1=\"22\" x2=\"178\" y2=\"212\"/><line x1=\"26\" y1=\"212\" x2=\"178\" y2=\"212\"/><line x1=\"26\" y1=\"193\" x2=\"178\" y2=\"193\"/><line x1=\"26\" y1=\"174\" x2=\"178\" y2=\"174\"/><line x1=\"26\" y1=\"155\" x2=\"178\" y2=\"155\"/><line x1=\"26\" y1=\"136\" x2=\"178\" y2=\"136\"/><line x1=\"26\" y1=\"117\" x2=\"178\" y2=\"117\"/><line x1=\"26\" y1=\"98\" x2=\"178\" y2=\"98\"/><line x1=\"26\" y1=\"79\" x2=\"178\" y2=\"79\"/><line x1=\"26\" y1=\"60\" x2=\"178\" y2=\"60\"/><line x1=\"26\" y1=\"41\" x2=\"178\" y2=\"41\"/><line x1=\"26\" y1=\"22\" x2=\"178\" y2=\"22\"/><\/g><line x1=\"26\" y1=\"79\" x2=\"178\" y2=\"79\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"182\" y=\"83\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\">x<\/text><line x1=\"64\" y1=\"22\" x2=\"64\" y2=\"212\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"64\" y=\"17\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" text-anchor=\"middle\">y<\/text><line x1=\"54.5\" y1=\"212\" x2=\"149.5\" y2=\"22\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><line x1=\"83\" y1=\"155\" x2=\"121\" y2=\"155\" stroke=\"#2e7a57\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/><line x1=\"121\" y1=\"155\" x2=\"121\" y2=\"79\" stroke=\"#b23a2a\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/><circle cx=\"64\" cy=\"193\" r=\"5\" fill=\"#b23a2a\"/><circle cx=\"121\" cy=\"79\" r=\"5\" fill=\"#2e7a57\"/><text x=\"56\" y=\"190\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#b23a2a\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(0, −6)<\/text><text x=\"129\" y=\"96\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#2e7a57\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(3, 0)<\/text><text x=\"102\" y=\"172\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#2e7a57\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">2 right<\/text><text x=\"127\" y=\"122\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#b23a2a\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">4 up<\/text><text x=\"202\" y=\"50\" font-family=\"Arial\" font-size=\"16\" font-weight=\"700\" fill=\"#1e6f9f\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">y = 2x − 6<\/text><text x=\"202\" y=\"78\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1b2430\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">m = 2<\/text><text x=\"202\" y=\"94\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(4 up ÷ 2 right)<\/text><text x=\"202\" y=\"122\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#b23a2a\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">b = −6<\/text><text x=\"202\" y=\"138\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">crosses the y-axis<\/text><text x=\"202\" y=\"166\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#2e7a57\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">x-intercept (3, 0)<\/text><text x=\"202\" y=\"182\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">crosses the x-axis<\/text><\/svg>","idea":"<p>Any straight line (not straight up) can be written <b>y = mx + b<\/b>.<\/p><p>An <b>intercept<\/b> = a point where the line crosses an axis. The red dot is the <b>y-intercept<\/b>; the green dot is the <b>x-intercept<\/b>.<\/p><p>On the y-axis x is 0. On the x-axis y is 0. That is how you find them.<\/p>","formulas":[{"f":"y = mx + b","say":"m = slope (the number in front of x). b = the y-intercept: the line crosses the y-axis at (0, b). y must stand alone first."},{"f":"y-intercept: put x = 0 · x-intercept: put y = 0","say":"Put 0 in for one letter and solve for the other. The x-intercept looks like (?, 0); the y-intercept looks like (0, ?)."}],"ex":{"q":"Where does y = 2x − 6 cross the two axes?","steps":["y-intercept: put x = 0 → y = 2(0) − 6 = −6 → (0, −6)","x-intercept: put y = 0 → 0 = 2x − 6 → 2x = 6 → x = 3 → (3, 0)","Crossings: <b>(0, −6) and (3, 0)<\/b> ✅ (the red and green dots)"]},"ex2":{"q":"Is the point (4, 5) on the line y = 2x − 3?","steps":["Put x = 4: y = 2 × 4 − 3 = 8 − 3 = 5","We get y = 5, the same as the point, so <b>yes<\/b> ✅"]},"tip":"⚠️ Get y alone first: 2y = 6x + 4 → divide by 2 → y = 3x + 2. The slope is 3, not 6.","part":"Coordinate Geometry"},{"id":"C7","title":"Two more ways to write a line: \"point + slope\" and \"Ax + By = C\".","svg":"<svg viewBox=\"0 0 320 234\" aria-hidden=\"true\"><g stroke=\"#e3e7ea\" stroke-width=\"1\"><line x1=\"26\" y1=\"36\" x2=\"26\" y2=\"207\"/><line x1=\"45\" y1=\"36\" x2=\"45\" y2=\"207\"/><line x1=\"64\" y1=\"36\" x2=\"64\" y2=\"207\"/><line x1=\"83\" y1=\"36\" x2=\"83\" y2=\"207\"/><line x1=\"102\" y1=\"36\" x2=\"102\" y2=\"207\"/><line x1=\"121\" y1=\"36\" x2=\"121\" y2=\"207\"/><line x1=\"26\" y1=\"207\" x2=\"121\" y2=\"207\"/><line x1=\"26\" y1=\"188\" x2=\"121\" y2=\"188\"/><line x1=\"26\" y1=\"169\" x2=\"121\" y2=\"169\"/><line x1=\"26\" y1=\"150\" x2=\"121\" y2=\"150\"/><line x1=\"26\" y1=\"131\" x2=\"121\" y2=\"131\"/><line x1=\"26\" y1=\"112\" x2=\"121\" y2=\"112\"/><line x1=\"26\" y1=\"93\" x2=\"121\" y2=\"93\"/><line x1=\"26\" y1=\"74\" x2=\"121\" y2=\"74\"/><line x1=\"26\" y1=\"55\" x2=\"121\" y2=\"55\"/><line x1=\"26\" y1=\"36\" x2=\"121\" y2=\"36\"/><\/g><line x1=\"26\" y1=\"150\" x2=\"121\" y2=\"150\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"125\" y=\"154\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\">x<\/text><line x1=\"45\" y1=\"36\" x2=\"45\" y2=\"207\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"45\" y=\"31\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" text-anchor=\"middle\">y<\/text><g stroke=\"#e3e7ea\" stroke-width=\"1\"><line x1=\"164\" y1=\"36\" x2=\"164\" y2=\"188\"/><line x1=\"183\" y1=\"36\" x2=\"183\" y2=\"188\"/><line x1=\"202\" y1=\"36\" x2=\"202\" y2=\"188\"/><line x1=\"221\" y1=\"36\" x2=\"221\" y2=\"188\"/><line x1=\"240\" y1=\"36\" x2=\"240\" y2=\"188\"/><line x1=\"259\" y1=\"36\" x2=\"259\" y2=\"188\"/><line x1=\"278\" y1=\"36\" x2=\"278\" y2=\"188\"/><line x1=\"164\" y1=\"188\" x2=\"278\" y2=\"188\"/><line x1=\"164\" y1=\"169\" x2=\"278\" y2=\"169\"/><line x1=\"164\" y1=\"150\" x2=\"278\" y2=\"150\"/><line x1=\"164\" y1=\"131\" x2=\"278\" y2=\"131\"/><line x1=\"164\" y1=\"112\" x2=\"278\" y2=\"112\"/><line x1=\"164\" y1=\"93\" x2=\"278\" y2=\"93\"/><line x1=\"164\" y1=\"74\" x2=\"278\" y2=\"74\"/><line x1=\"164\" y1=\"55\" x2=\"278\" y2=\"55\"/><line x1=\"164\" y1=\"36\" x2=\"278\" y2=\"36\"/><\/g><line x1=\"164\" y1=\"169\" x2=\"278\" y2=\"169\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"282\" y=\"173\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\">x<\/text><line x1=\"183\" y1=\"36\" x2=\"183\" y2=\"188\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"183\" y=\"31\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" text-anchor=\"middle\">y<\/text><text x=\"73.5\" y=\"16\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#1b2430\" text-anchor=\"middle\">one point + slope<\/text><text x=\"221\" y=\"16\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#1b2430\" text-anchor=\"middle\">Ax + By = C<\/text><line x1=\"57.7\" y1=\"207\" x2=\"114.7\" y2=\"36\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><line x1=\"64\" y1=\"188\" x2=\"83\" y2=\"188\" stroke=\"#2e7a57\" stroke-width=\"3\" stroke-dasharray=\"5 3\"/><line x1=\"83\" y1=\"188\" x2=\"83\" y2=\"131\" stroke=\"#b23a2a\" stroke-width=\"3\" stroke-dasharray=\"5 3\"/><circle cx=\"83\" cy=\"131\" r=\"5\" fill=\"#1b2430\"/><text x=\"91\" y=\"136\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(2, 1)<\/text><text x=\"66.8\" y=\"205\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#2e7a57\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">1 right<\/text><text x=\"89\" y=\"165.4\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#b23a2a\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">3 up<\/text><text x=\"73.5\" y=\"229\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\">y − 1 = 3(x − 2)<\/text><line x1=\"170.3\" y1=\"36\" x2=\"271.7\" y2=\"188\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><line x1=\"221\" y1=\"112\" x2=\"259\" y2=\"112\" stroke=\"#2e7a57\" stroke-width=\"3\" stroke-dasharray=\"5 3\"/><line x1=\"259\" y1=\"112\" x2=\"259\" y2=\"169\" stroke=\"#b23a2a\" stroke-width=\"3\" stroke-dasharray=\"5 3\"/><circle cx=\"183\" cy=\"55\" r=\"5\" fill=\"#1b2430\"/><circle cx=\"259\" cy=\"169\" r=\"5\" fill=\"#1b2430\"/><text x=\"192\" y=\"57\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(0, 6)<\/text><text x=\"252\" y=\"185\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(4, 0)<\/text><text x=\"244.8\" y=\"105\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#2e7a57\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">2 right<\/text><text x=\"265\" y=\"144.5\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#b23a2a\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">3 down<\/text><text x=\"221\" y=\"210\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\">3x + 2y = 12<\/text><\/svg>","idea":"<p>Left: you know one point and the slope. Put them straight into <b>point-slope form<\/b>. No need to find b.<\/p><p>Right: <b>standard form<\/b> hides the slope. Get y alone to see it: here 3 down for each 2 right, so m = −3/2.<\/p>","formulas":[{"f":"y − y₁ = m(x − x₁)","say":"(x₁, y₁) = a point on the line, m = its slope. Note the minus signs: through (−2, 5) it is y − 5 = m(x + 2)."},{"f":"Ax + By = C → m = −A ÷ B","say":"A, B, C are plain numbers. The slope is minus A over B. If B = 0, the line is straight up and has no slope."}],"ex":{"q":"Write the line with slope 3 through (2, 1). (left picture)","steps":["Point-slope: y − 1 = 3(x − 2)","Open the bracket: y − 1 = 3x − 6","Add 1: <b>y = 3x − 5<\/b> ✅"]},"ex2":{"q":"Find the slope and intercepts of 3x + 2y = 12. (right picture)","steps":["Move 3x: 2y = −3x + 12. Divide by 2: y = −3/2 x + 6","Slope = −3/2 = −1.5 (also −A ÷ B = −3 ÷ 2). y-intercept = 6","Put y = 0: 3x = 12, so x = 4. Crossings <b>(0, 6) and (4, 0)<\/b> ✅"]},"tip":"⚠️ The slope of Ax + By = C is −A/B. The minus sign is the one people drop most often.","part":"Coordinate Geometry"},{"id":"C8","title":"Parallel lines have the same slope. Perpendicular slopes: flip it and change the sign.","svg":"<svg viewBox=\"0 0 320 220\" aria-hidden=\"true\"><g stroke=\"#e3e7ea\" stroke-width=\"1\"><line x1=\"30\" y1=\"34\" x2=\"30\" y2=\"174\"/><line x1=\"50\" y1=\"34\" x2=\"50\" y2=\"174\"/><line x1=\"70\" y1=\"34\" x2=\"70\" y2=\"174\"/><line x1=\"90\" y1=\"34\" x2=\"90\" y2=\"174\"/><line x1=\"110\" y1=\"34\" x2=\"110\" y2=\"174\"/><line x1=\"130\" y1=\"34\" x2=\"130\" y2=\"174\"/><line x1=\"30\" y1=\"174\" x2=\"130\" y2=\"174\"/><line x1=\"30\" y1=\"154\" x2=\"130\" y2=\"154\"/><line x1=\"30\" y1=\"134\" x2=\"130\" y2=\"134\"/><line x1=\"30\" y1=\"114\" x2=\"130\" y2=\"114\"/><line x1=\"30\" y1=\"94\" x2=\"130\" y2=\"94\"/><line x1=\"30\" y1=\"74\" x2=\"130\" y2=\"74\"/><line x1=\"30\" y1=\"54\" x2=\"130\" y2=\"54\"/><line x1=\"30\" y1=\"34\" x2=\"130\" y2=\"34\"/><\/g><line x1=\"30\" y1=\"174\" x2=\"130\" y2=\"174\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"134\" y=\"178\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\">x<\/text><line x1=\"30\" y1=\"34\" x2=\"30\" y2=\"174\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"30\" y=\"29\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" text-anchor=\"middle\">y<\/text><g stroke=\"#e3e7ea\" stroke-width=\"1\"><line x1=\"172\" y1=\"34\" x2=\"172\" y2=\"160\"/><line x1=\"186\" y1=\"34\" x2=\"186\" y2=\"160\"/><line x1=\"200\" y1=\"34\" x2=\"200\" y2=\"160\"/><line x1=\"214\" y1=\"34\" x2=\"214\" y2=\"160\"/><line x1=\"228\" y1=\"34\" x2=\"228\" y2=\"160\"/><line x1=\"242\" y1=\"34\" x2=\"242\" y2=\"160\"/><line x1=\"256\" y1=\"34\" x2=\"256\" y2=\"160\"/><line x1=\"270\" y1=\"34\" x2=\"270\" y2=\"160\"/><line x1=\"284\" y1=\"34\" x2=\"284\" y2=\"160\"/><line x1=\"298\" y1=\"34\" x2=\"298\" y2=\"160\"/><line x1=\"172\" y1=\"160\" x2=\"298\" y2=\"160\"/><line x1=\"172\" y1=\"146\" x2=\"298\" y2=\"146\"/><line x1=\"172\" y1=\"132\" x2=\"298\" y2=\"132\"/><line x1=\"172\" y1=\"118\" x2=\"298\" y2=\"118\"/><line x1=\"172\" y1=\"104\" x2=\"298\" y2=\"104\"/><line x1=\"172\" y1=\"90\" x2=\"298\" y2=\"90\"/><line x1=\"172\" y1=\"76\" x2=\"298\" y2=\"76\"/><line x1=\"172\" y1=\"62\" x2=\"298\" y2=\"62\"/><line x1=\"172\" y1=\"48\" x2=\"298\" y2=\"48\"/><line x1=\"172\" y1=\"34\" x2=\"298\" y2=\"34\"/><\/g><line x1=\"172\" y1=\"160\" x2=\"298\" y2=\"160\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"302\" y=\"164\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\">x<\/text><line x1=\"172\" y1=\"34\" x2=\"172\" y2=\"160\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"172\" y=\"29\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" text-anchor=\"middle\">y<\/text><text x=\"80\" y=\"14\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#1b2430\" text-anchor=\"middle\">parallel and at 90°<\/text><text x=\"235\" y=\"14\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#1b2430\" text-anchor=\"middle\">perpendicular bisector<\/text><line x1=\"40\" y1=\"174\" x2=\"110\" y2=\"34\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><line x1=\"90\" y1=\"174\" x2=\"130\" y2=\"94\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><line x1=\"30\" y1=\"94\" x2=\"130\" y2=\"144\" stroke=\"#2e7a57\" stroke-width=\"3\"/><polyline points=\"58.1,153.4 55,144 45.6,147.1\" fill=\"none\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><polyline points=\"103.1,163.4 100,154 90.6,157.1\" fill=\"none\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><polyline points=\"74,106 82.1,110 78,118\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><polyline points=\"114,126 122.1,130 118,138\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"80\" y=\"196\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\">blue lines: slope 2<\/text><text x=\"80\" y=\"212\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#2e7a57\" text-anchor=\"middle\">green line: slope −½<\/text><line x1=\"172\" y1=\"72.5\" x2=\"288.7\" y2=\"160\" stroke=\"#2e7a57\" stroke-width=\"3\"/><line x1=\"172\" y1=\"160\" x2=\"256\" y2=\"48\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><line x1=\"188.2\" y1=\"128.4\" x2=\"197.8\" y2=\"135.6\" stroke=\"#1b2430\" stroke-width=\"2\"/><line x1=\"230.2\" y1=\"72.4\" x2=\"239.8\" y2=\"79.6\" stroke=\"#1b2430\" stroke-width=\"2\"/><polyline points=\"219.4,96.8 226.6,102.2 221.2,109.4\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><circle cx=\"172\" cy=\"160\" r=\"5\" fill=\"#1b2430\"/><circle cx=\"256\" cy=\"48\" r=\"5\" fill=\"#1b2430\"/><circle cx=\"214\" cy=\"104\" r=\"5\" fill=\"#b23a2a\"/><text x=\"178\" y=\"176\" font-family=\"Arial\" font-size=\"12\" fill=\"#1b2430\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(0, 0)<\/text><text x=\"248\" y=\"44\" font-family=\"Arial\" font-size=\"12\" fill=\"#1b2430\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(6, 8)<\/text><text x=\"205\" y=\"110\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#b23a2a\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">M<\/text><text x=\"235\" y=\"196\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#b23a2a\" text-anchor=\"middle\">M = midpoint (3, 4)<\/text><text x=\"235\" y=\"212\"
