font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#2e7a57\" text-anchor=\"middle\">green: through M, at 90°<\/text><\/svg>","idea":"<p><b>Parallel<\/b> = two lines that never meet (the arrow marks). They climb at the same rate, so the slopes are equal.<\/p><p><b>Perpendicular<\/b> = lines that meet at 90° (the little square). Slope 2 meets slope −½.<\/p><p>Right: the green line cuts the blue segment in half <i>and<\/i> at 90°. That is the <b>perpendicular bisector<\/b>.<\/p>","formulas":[{"f":"parallel: m₂ = m₁","say":"Two parallel lines have the same slope m. Only b (where they cross the y-axis) is different."},{"f":"perpendicular: m₁ × m₂ = −1 → m₂ = −1 ÷ m₁","say":"Turn the slope upside down and change its sign: 2 becomes −½, and −3/4 becomes 4/3."},{"f":"perpendicular bisector: goes through the midpoint, slope −1 ÷ m","say":"m = slope of the segment. Every point on this line is the same distance from both ends of the segment."}],"ex":{"q":"Through (4, 1), find the line parallel to y = 2x + 9 and the line perpendicular to it.","steps":["Parallel: keep m = 2. Then 1 = 2 × 4 + b, so b = 1 − 8 = −7 → <b>y = 2x − 7<\/b>","Perpendicular: m = −1 ÷ 2 = −½. Then 1 = −½ × 4 + b = −2 + b, so b = 3","→ <b>y = −0.5x + 3<\/b> ✅"]},"ex2":{"q":"Find the perpendicular bisector of the segment from (0, 0) to (6, 8). (right picture)","steps":["Midpoint: (0 + 6) ÷ 2 = 3 and (0 + 8) ÷ 2 = 4 → (3, 4)","Segment slope: 8 ÷ 6 = 4/3. Flip and change sign: −3/4","4 = −3/4 × 3 + b = −2.25 + b, so b = 6.25 → <b>y = −0.75x + 6.25<\/b> ✅"]},"tip":"⚠️ For perpendicular you need BOTH moves: flip and change the sign. 2 → ½ or 2 → −2 is wrong; 2 → −½ is right.","part":"Coordinate Geometry"},{"id":"C9","title":"Reflections: a mirror flips the point to the other side, the same distance away.","svg":"<svg viewBox=\"0 0 320 224\" aria-hidden=\"true\"><g stroke=\"#e3e7ea\" stroke-width=\"1\"><line x1=\"16\" y1=\"22\" x2=\"16\" y2=\"202\"/><line x1=\"31\" y1=\"22\" x2=\"31\" y2=\"202\"/> 4a5866\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">start<\/text><text x=\"222\" y=\"104\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#b23a2a\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">y = (x − 3)² − 4<\/text><text x=\"222\" y=\"120\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">3 right, 4 down<\/text><\/svg>","idea":"<p><b>f(x)<\/b> = a rule that turns x into y. Here f(x) = x², the blue U-shape.<\/p><p>The red U is the same shape, slid 3 right and 4 down. Its lowest point moved from (0, 0) to (3, −4).<\/p>","formulas":[{"f":"y = f(x − h) + k  —  h right, k up","say":"h = how far right (inside the bracket, with a minus). k = how far up (outside). A negative h means left; a negative k means down."},{"f":"inside: (x − 3) → 3 right · (x + 3) → 3 left","say":"Inside the bracket works backwards: a minus moves right, a plus moves left."},{"f":"outside: + 4 → 4 up · − 4 → 4 down","say":"Outside the bracket works the normal way."}],"ex":{"q":"Describe y = (x − 3)² − 4 and find its lowest point.","steps":["Inside (x − 3): slide 3 <b>right<\/b>.","Outside − 4: slide 4 <b>down<\/b>.","The lowest point moves from (0, 0) to <b>(3, −4)<\/b> ✅"]},"ex2":{"q":"Where is the lowest point of y = (x + 2)² + 1?","steps":["(x + 2) means 2 <b>left<\/b>; + 1 means 1 up.","Lowest point: <b>(−2, 1)<\/b> ✅"]},"tip":"⚠️ Inside the bracket the sign fools you: (x − 3) goes RIGHT, (x + 3) goes LEFT.","part":"Coordinate Geometry"},{"id":"C11","title":"A parabola is a U shape. Its turning point (the vertex) sits on the mirror line.","svg":"<svg viewBox=\"0 0 320 238\" aria-hidden=\"true\"><g stroke=\"#e3e7ea\" stroke-width=\"1\"><line x1=\"22\" y1=\"20\" x2=\"22\" y2=\"218\"/><line x1=\"40\" y1=\"20\" x2=\"40\" y2=\"218\"/><line x1=\"58\" y1=\"20\" x2=\"58\" y2=\"218\"/><line x1=\"76\" y1=\"20\" x2=\"76\" y2=\"218\"/><line x1=\"94\" y1=\"20\" x2=\"94\" y2=\"218\"/><line x1=\"11 y=\"4 2\"/><text x=\"200\" y=\"104\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#9c6510\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">axis: x = 3<\/text><text x=\"200\" y=\"119\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">the mirror line<\/text><circle cx=\"190\" cy=\"144\" r=\"5\" fill=\"#2e7a57\"/><text x=\"200\" y=\"148\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#2e7a57\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">roots: x = 1, 5<\/text><text x=\"200\" y=\"163\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">where y = 0<\/text><circle cx=\"190\" cy=\"188\" r=\"5\" fill=\"#1e6f9f\"/><text x=\"200\" y=\"192\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#1e6f9f\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">same height 5<\/text><text x=\"200\" y=\"207\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">at x = 0 and x = 6<\/text><\/svg>","idea":"<p>The graph of <b>y = ax² + bx + c<\/b> is a <b>parabola<\/b>. If a is positive it opens up (U); if negative, down (∩).<\/p><p>The <b>vertex<\/b> = the turning point (red). The <b>axis of symmetry<\/b> = the dashed mirror line through it.<\/p><p><b>Roots<\/b> = where the curve meets the x-axis (green). Points at the same height (blue) are mirror twins.<\/p>","formulas":[{"f":"x = −b ÷ (2a), then y = c − b² ÷ (4a)","say":"For y = ax² + bx + c. The first part gives the x of the vertex. Then find y (or put that x back into the equation)."},{"f":"y = a(x − h)² + k","say":"Vertex form: the vertex is (h, k). If a &gt; 0, k is the smallest y (minimum); if a &lt; 0, k is the largest y (maximum)."},{"f":"f(x₁) = f(x₂) → axis at x = (x₁ + x₂) ÷ 2","say":"Two x values with the same height sit evenly on each side of the mirror line. E.g. f(2) = f(8) → axis x = 5."}],"ex":{"q":"Find the vertex of y = x² − 6x + 5. (the picture)","steps":["a = 1, b = −6, c = 5. x = −(−6) ÷ (2 × 1) = 6 ÷ 2 = 3","y = 5 − (−6)² ÷ (4 × 1) = 5 − 36 ÷ 4 = 5 − 9 = −4","Vertex = <b>(3, −4)<\/b> ✅ Check: roots 1 and 5 average to 3."]},"ex2":{"q":"What is the smallest value of y = (x − 2)² − 5?","steps":["Vertex form with h = 2, k = −5, and a = 1 is positive (U shape).","A square is never negative, so y is smallest when x = 2: y = 0 − 5","Smallest value = <b>−5<\/b>, at the point (2, −5) ✅"]},"tip":"⚠️ −b ÷ (2a) gives only the x of the vertex. The min or max VALUE is the y, so put x back in.","part":"Coordinate Geometry"},{"id":"C12","title":"A circle on the grid: every point is the same distance r from the centre (h, k).","svg":"<svg viewBox=\"0 0 320 236\" aria-hidden=\"true\"><g stroke=\"#e3e7ea\" stroke-width=\"1\"><line x1=\"14\" y1=\"20\" x2=\"14\" y2=\"212\"/><line x1=\"30\" y1=\"20\" x2=\"30\" y2=\"212\"/><line x1=\"46\" y1=\"20\" x2=\"46\" y2=\"212\"/><line x1=\"62\" y1=\"20\" x2=\"62\" y2=\"212\"/><line x1=\"78\" y1=\"20\" x2=\"78\" y2=\"212\"/><line x1=\"94\" y1=\"20\" x2=\"94\" y2=\"212\"/><line x1=\"110\" y1=\"20\" x2=\"110\" y2=\"212\"/><line x1=\"126\" y1=\"20\" x2=\"126\" y2=\"212\"/><line x1=\"142\" y1=\"20\" x2=\"142\" y2=\"212\"/><line x1=\"158\" y1=\"20\" x2=\"158\" y2=\"212\"/><line x1=\"174\" y1=\"20\" x2=\"174\" y2=\"212\"/><line x1=\"190\" y1=\"20\" x2=\"190\" y2=\"212\"/><line x1=\"206\" y1=\"20\" x2=\"206\" y2=\"212\"/><line x1=\"14\" y1=\"212\" x2=\"206\" y2=\"212\"/><line x1=\"14\" y1=\"196\" x2=\"206\" y2=\"196\"/><line x1=\"14\" y1=\"180\" x2=\"206\" y2=\"180\"/><line x1=\"14\" y1=\"164\" x2=\"206\" y2=\"164\"/><line x1=\"14\" y1=\"148\" x2=\"206\" y2=\"148\"/><line x1=\"14\" y1=\"132\" x2=\"206\" y2=\"132\"/><line x1=\"14\" y1=\"116\" x2=\"206\" y2=\"116\"/><line x1=\"14\" y1=\"100\" x2=\"206\" y2=\"100\"/><line x1=\"14\" y1=\"84\" x2=\"206\" y2=\"84\"/><line x1=\"14\" y1=\"68\" x2=\"206\" y2=\"68\"/><line x1=\"14\" y1=\"52\" x2=\"206\" y2=\"52\"/><line x1=\"14\" y1=\"36\" x2=\"206\" y2=\"36\"/><line x1=\"14\" y1=\"20\" x2=\"206\" y2=\"20\"/><\/g><line x1=\"14\" y1=\"84\" x2=\"206\" y2=\"84\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"210\" y=\"88\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\">x<\/text><line x1=\"62\" y1=\"20\" x2=\"62\" y2=\"212\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"62\" y=\"15\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" text-anchor=\"middle\">y<\/text><circle cx=\"110\" cy=\"116\" r=\"80\" fill=\"none\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><line x1=\"110\" y1=\"116\" x2=\"158\" y2=\"116\" stroke=\"#2e7a57\" stroke-width=\"2.5\" stroke-dasharray=\"5 3\"/><line x1=\"158\" y1=\"116\" x2=\"158\" y2=\"52\" stroke=\"#b23a2a\" stroke-width=\"2.5\" stroke-dasharray=\"5 3\"/><line x1=\"110\" y1=\"116\" x2=\"158\" y2=\"52\" stroke=\"#1b2430\" stroke-width=\"3\"/><polyline points=\"150,116 150,108 158,108\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><circle cx=\"110\" cy=\"116\" r=\"5\" fill=\"#b23a2a\"/><circle cx=\"158\" cy=\"52\" r=\"5\" fill=\"#1b2430\"/><text x=\"106\" y=\"133\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#b23a2a\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(3, −2)<\/text><text x=\"165\" y=\"46\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#1b2430\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(6, 2)<\/text><text x=\"134\" y=\"132\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#2e7a57\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">3<\/text><text x=\"164\" y=\"105\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#b23a2a\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">4<\/text><text x=\"125\" y=\"78\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1b2430\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">r = 5<\/text><text x=\"222\" y=\"40\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#b23a2a\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">centre<\/text><text x=\"222\" y=\"56\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(h, k) = (3, −2)<\/text><text x=\"222\" y=\"86\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1b2430\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">radius<\/text><text x=\"222\" y=\"102\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">r = 5<\/text><text x=\"222\" y=\"132\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1e6f9f\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(x − 3)²<\/text><text x=\"222\" y=\"150\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1e6f9f\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">+ (y + 2)²<\/text><text x=\"222\" y=\"168\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1e6f9f\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">= 25<\/text><\/svg>","idea":"<p>The <b>centre<\/b> = the middle point (red). The <b>radius<\/b> r = the distance from the centre to the edge.<\/p><p>The black radius goes 3 across and 4 up, so its length is √(9 + 16) = 5. The circle equation is just this distance rule.<\/p>","formulas":[{"f":"(x − h)² + (y − k)² = r²","say":"(h, k) = the centre, r = the radius, (x, y) = any point on the circle. The right side is r squared, not r."}],"ex":{"q":"Write the circle with centre (3, −2) and radius 5. (the picture)","steps":["h = 3, k = −2, r² = 5² = 25","(x − 3)² + (y − (−2))² = 25","<b>(x − 3)² + (y + 2)² = 25<\/b> ✅ (opened up: x² + y² − 6x + 4y − 12 = 0)"]},"ex2":{"q":"Find the centre and radius of (x + 2)² + (y − 1)² = 9.","steps":["x + 2 = x − (−2), so h = −2. y − 1 gives k = 1.","r² = 9, so r = 3","Centre <b>(−2, 1)<\/b>, radius <b>3<\/b> ✅"]},"tip":"⚠️ Flip the signs to read the centre: (x + 2)² means h = −2. And = 25 means radius 5, not 25.","part":"Coordinate Geometry"},{"id":"C13","title":"Area of a triangle from its three corners, and a test for three points on one line.","svg":"<svg viewBox=\"0 0 320 236\" aria-hidden=\"true\"><g stroke=\"#e3e7ea\" stroke-width=\"1\"><line x1=\"8\" y1=\"46\" x2=\"8\" y2=\"165\"/><line x1=\"25\" y1=\"46\" x2=\"25\" y2=\"165\"/><line x1=\"42\" y1=\"46\" x2=\"42\" y2=\"165\"/><line x1=\"59\" y1=\"46\" x2=\"59\" y2=\"165\"/><line x1=\"76\" y1=\"46\" x2=\"76\" y2=\"165\"/><line x1=\"93\" y1=\"46\" x2=\"93\" y2=\"165\"/><line x1=\"110\" y1=\"46\" x2=\"110\" y2=\"165\"/><line x1=\"127\" y1=\"46\" x2=\"127\" y2=\"165\"/><line x1=\"144\" y1=\"46\" x2=\"144\" y2=\"165\"/><line x1=\"161\" y1=\"46\" x2=\"161\" y2=\"165\"/><line x1=\"8\" y1=\"165\" x2=\"161\" y2=\"165\"/><line x1=\"8\" y1=\"148\" x2=\"161\" y2=\"148\"/><line x1=\"8\" y1=\"131\" x2=\"161\" y2=\"131\"/><line x1=\"8\" y1=\"114\" x2=\"161\" y2=\"114\"/><line x1=\"8\" y1=\"97\" x2=\"161\" y2=\"97\"/><line x1=\"8\" y1=\"80\" x2=\"161\" y2=\"80\"/><line x1=\"8\" y1=\"63\" x2=\"161\" y2=\"63\"/><line x1=\"8\" y1=\"46\" x2=\"161\" y2=\"46\"/><\/g><line x1=\"8\" y1=\"148\" x2=\"161\" y2=\"148\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"165\" y=\"152\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\">x<\/text><line x1=\"42\" y1=\"46\" x2=\"42\" y2=\"165\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"42\" y=\"41\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" text-anchor=\"middle\">y<\/text><g stroke=\"#e3e7ea\" stroke-width=\"1\"><line x1=\"178\" y1=\"30\" x2=\"178\" y2=\"212\"/><line x1=\"192\" y1=\"30\" x2=\"192\" y2=\"212\"/><line x1=\"206\" y1=\"30\" x2=\"206\" y2=\"212\"/><line x1=\"220\" y1=\"30\" x2=\"220\" y2=\"212\"/><line x1=\"234\" y1=\"30\" x2=\"234\" y2=\"212\"/><line x1=\"248\" y1=\"30\" x2=\"248\" y2=\"212\"/><line x1=\"262\" y1=\"30\" x2=\"262\" y2=\"212\"/><line x1=\"276\" y1=\"30\" x2=\"276\" y2=\"212\"/><line x1=\"178\" y1=\"212\" x2=\"276\" y2=\"212\"/><line x1=\"178\" y1=\"198\" x2=\"276\" y2=\"198\"/><line x1=\"178\" y1=\"184\" x2=\"276\" y2=\"184\"/><line x1=\"178\" y1=\"170\" x2=\"276\" y2=\"170\"/><line x1=\"178\" y1=\"156\" x2=\"276\" y2=\"156\"/><line x1=\"178\" y1=\"142\" x2=\"276\" y2=\"142\"/><line x1=\"178\" y1=\"128\" x2=\"276\" y2=\"128\"/><line x1=\"178\" y1=\"114\" x2=\"276\" y2=\"114\"/><line x1=\"178\" y1=\"100\" x2=\"276\" y2=\"100\"/><line x1=\"178\" y1=\"86\" x2=\"276\" y2=\"86\"/><line x1=\"178\" y1=\"72\" x2=\"276\" y2=\"72\"/><line x1=\"178\" y1=\"58\" x2=\"276\" y2=\"58\"/><line x1=\"178\" y1=\"44\" x2=\"276\" y2=\"44\"/><line x1=\"178\" y1=\"30\" x2=\"276\" y2=\"30\"/><\/g><line x1=\"178\" y1=\"212\" x2=\"276\" y2=\"212\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"280\" y=\"216\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\">x<\/text><line x1=\"178\" y1=\"30\" x2=\"178\" y2=\"212\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"178\" y=\"25\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" text-anchor=\"middle\">y<\/text><text x=\"93\" y=\"14\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#1b2430\" text-anchor=\"middle\">triangle area<\/text><text x=\"227\" y=\"14\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#1b2430\" text-anchor=\"middle\">on one line?<\/text><polygon points=\"42,148 110,148 144,63\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\"/><circle cx=\"42\" cy=\"148\" r=\"5\" fill=\"#1e6f9f\"/><circle cx=\"110\" cy=\"148\" r=\"5\" fill=\"#1e6f9f\"/><circle cx=\"144\" cy=\"63\" r=\"5\" fill=\"#1e6f9f\"/><text x=\"36\" y=\"164\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(0, 0)<\/text><text x=\"116\" y=\"165\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(4, 0)<\/text><text x=\"144\" y=\"53\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#1e6f9f\" text-anchor=\"middle\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(6, 5)<\/text><text x=\"48.8\" y=\"80\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1b2430\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">area = 10<\/text><line x1=\"185\" y1=\"198\" x2=\"269\" y2=\"30\" stroke=\"#2e7a57\" stroke-width=\"3\"/><circle cx=\"192\" cy=\"184\" r=\"4.5\" fill=\"#1b2430\"/><circle cx=\"234\" cy=\"100\" r=\"4.5\" fill=\"#1b2430\"/><circle cx=\"262\" cy=\"44\" r=\"4.5\" fill=\"#2e7a57\"/><circle cx=\"262\" cy=\"58\" r=\"4.5\" fill=\"#b23a2a\"/><text x=\"200\" y=\"189\" font-family=\"Arial\" font-size=\"12\" fill=\"#1b2430\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(1, 2)<\/text><text x=\"242\" y=\"105\" font-family=\"Arial\" font-size=\"12\" fill=\"#1b2430\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(4, 8)<\/text><text x=\"254\" y=\"45\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#2e7a57\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(6, 12)<\/text><text x=\"270\" y=\"67\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#b23a2a\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(6, 11)<\/text><text x=\"270\" y=\"82\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#b23a2a\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">off<\/text><\/svg>","idea":"<p>Left: when you know the three <b>vertices<\/b> (corners), one formula gives the area. No height needed.<\/p><p>Right: three points are <b>collinear<\/b> (= on one straight line) when the slopes between them match. The red point is just off the line.<\/p>","formulas":[{"f":"A = ½ × | x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂) |","say":"(x₁, y₁), (x₂, y₂), (x₃, y₃) = the three corners. | | means \"drop any minus sign\", because an area is never negative."},{"f":"(x₂ − x₁)(y₃ − y₁) = (x₃ − x₁)(y₂ − y₁)","say":"If both sides are equal, the three points are on one line. It is \"same slope\" with the fractions cross-multiplied, so you never divide by 0."}],"ex":{"q":"Find the area of the triangle (0, 0), (4, 0), (6, 5). (left picture)","steps":["0 × (0 − 5) + 4 × (5 − 0) + 6 × (0 − 0) = 0 + 20 + 0 = 20","Area = ½ × |20| = <b>10<\/b> ✅","Check: base 4 (flat bottom), height 5 → ½ × 4 × 5 = 10"]},"ex2":{"q":"Points (1, 2) and (4, 8). Is (6, 12) on their line? Is (6, 11)? (right picture)","steps":["(6, 12): (4 − 1)(12 − 2) = 3 × 10 = 30 and (6 − 1)(8 − 2) = 5 × 6 = 30. Equal → <b>yes<\/b>","(6, 11): (4 − 1)(11 − 2) = 3 × 9 = 27, but 5 × 6 = 30. Not equal → <b>no<\/b> ✅"]},"tip":"💡 If the area formula gives 0, there is no triangle: the three points lie on one line.","part":"Coordinate Geometry"},{"id":"C14","title":"Distance from a point to a line = the length of the straight drop that meets the line at 90°.","svg":"<svg viewBox=\"0 0 320 222\" aria-hidden=\"true\"><g stroke=\"#e3e7ea\" stroke-width=\"1\"><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"202\"/><line x1=\"44\" y1=\"20\" x2=\"44\" y2=\"202\"/><line x1=\"70\" y1=\"20\" x2=\"70\" y2=\"202\"/><line x1=\"96\" y1=\"20\" x2=\"96\" y2=\"202\"/><line x1=\"122\" y1=\"20\" x2=\"122\" y2=\"202\"/><line x1=\"148\" y1=\"20\" x2=\"148\" y2=\"202\"/><line x1=\"174\" y1=\"20\" x2=\"174\" y2=\"202\"/><line x1=\"200\" y1=\"20\" x2=\"200\" y2=\"202\"/><line x1=\"18\" y1=\"202\" x2=\"200\" y2=\"202\"/><line x1=\"18\" y1=\"176\" x2=\"200\" y2=\"176\"/><line x1=\"18\" y1=\"150\" x2=\"200\" y2=\"150\"/><line x1=\"18\" y1=\"124\" x2=\"200\" y2=\"124\"/><line x1=\"18\" y1=\"98\" x2=\"200\" y2=\"98\"/><line x1=\"18\" y1=\"72\" x2=\"200\" y2=\"72\"/><line x1=\"18\" y1=\"46\" x2=\"200\" y2=\"46\"/><line x1=\"18\" y1=\"20\" x2=\"200\" y2=\"20\"/><\/g><line x1=\"18\" y1=\"176\" x2=\"200\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"204\" y=\"180\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\">x<\/text><line x1=\"44\" y1=\"20\" x2=\"44\" y2=\"202\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"44\" y=\"15\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" text-anchor=\"middle\">y<\/text><line x1=\"18\" y1=\"91.5\" x2=\"165.3\" y2=\"202\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><line x1=\"122\" y1=\"72\" x2=\"122\" y2=\"169.5\" stroke=\"#4a5866\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line x1=\"122\" y1=\"72\" x2=\"75.2\" y2=\"134.4\" stroke=\"#b23a2a\" stroke-width=\"3\"/><polyline points=\"82.4,139.8 87.8,132.6 80.6,127.2\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><circle cx=\"122\" cy=\"72\" r=\"5\" fill=\"#1b2430\"/><circle cx=\"75.2\" cy=\"134.4\" r=\"4\" fill=\"#b23a2a\"/><text x=\"130\" y=\"66\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1b2430\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">(3, 4)<\/text><text x=\"88.6\" y=\"97.2\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#b23a2a\" text-anchor=\"end\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">d = 3<\/text><text x=\"128\" y=\"128\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">longer<\/text><text x=\"212\" y=\"46\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1e6f9f\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">the line<\/text><text x=\"212\" y=\"64\" font-family=\"Arial\" font-size=\"12\" font-weight=\"700\" fill=\"#1e6f9f\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">3x + 4y − 10 = 0<\/text><text x=\"212\" y=\"98\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#b23a2a\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">shortest path<\/text><text x=\"212\" y=\"114\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">meets it at 90°<\/text><text x=\"212\" y=\"146\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#4a5866\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">other paths<\/text><text x=\"212\" y=\"162\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" stroke=\"#fff\" stroke-width=\"3\" paint-order=\"stroke\">are longer<\/text><\/svg>","idea":"<p>From the point, the shortest way to reach the line is the red path. It hits the line at 90° (the little square).<\/p><p>Any other path, like the grey one, is longer. The formula finds the red length without drawing anything.<\/p>","formulas":[{"f":"d = | Ax₀ + By₀ + C | ÷ √(A² + B²)","say":"Write the line as Ax + By + C = 0 (everything on one side). (x₀, y₀) = the point. | | means drop any minus sign."}],"ex":{"q":"How far is (3, 4) from the line 3x + 4y − 10 = 0? (the picture)","steps":["A = 3, B = 4, C = −10. Top: |3 × 3 + 4 × 4 − 10| = |9 + 16 − 10| = 15","Bottom: √(3² + 4²) = √25 = 5","d = 15 ÷ 5 = <b>3<\/b> ✅"]},"ex2":{"q":"How far is (0, 0) from the line y = 2x + 1?","steps":["First move everything to one side: 2x − y + 1 = 0, so A = 2, B = −1, C = 1","Top: |2 × 0 − 0 + 1| = 1. Bottom: √(4 + 1) = √5","d = 1 ÷ √5 ≈ <b>0.45<\/b> ✅"]},"tip":"⚠️ Get \"= 0\" on the right side first. y = 2x + 1 must become 2x − y + 1 = 0 before you read A, B and C.","part":"Coordinate Geometry"}],"dek":"Start here if geometry feels new. 43 short lessons, each with a picture, the idea in easy words, <b>every formula<\/b> that goes with it (all 68 formulas from the KMF formula cards are here), a worked example and a tip. Then go on to Concept Board pages 10 to 15 and the KMF problems."}</script>
<script>
(function(){
  var D=JSON.parse(document.getElementById("g0-data").textContent), L=D.lessons, app=document.getElementById("app");
  function ld(k,d){try{var v=JSON.parse(localStorage.getItem(k)||"null");return v==null?d:v;}catch(e){return d;}}
  function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
  var OK=ld("kmf.g0.known",{}), st=ld("kmf.g0.view",{v:"toc",i:0}); if(!st||typeof st!=="object")st={v:"toc",i:0};
  var cover=false;
  function keep(){sv("kmf.g0.view",st);}
  function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function parts(){var o=[];L.forEach(function(x,i){if(!o.length||o[o.length-1].p!==x.part)o.push({p:x.part,items:[]});o[o.length-1].items.push(i);});return o;}
  function bar(){document.querySelectorAll(".top [data-v]").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-v")===st.v));});}
  function toc(){
    var n=L.length,k=L.filter(function(x){return OK[x.id];}).length;
    app.innerHTML='<h1>'+esc(D.title)+'</h1><p class="dek">'+D.dek+'</p>'
      +'<div class="prog"><i style="width:'+Math.round(100*k/n)+'%"></i></div><p class="dek" style="margin-top:-8px">'+k+' of '+n+' lessons understood</p>'
      +'<ol class="how"><li>Go <b>in order</b>. Each lesson uses the ones before it.</li><li>Look at the <b>picture first</b>, then read the formula and the example.</li><li>Press <b>I understand ✓</b> when it is clear. The <b>Formula sheet</b> (top right) lists all '+D.nf+' formulas in one place, with a Cover mode to test yourself.</li></ol>'
      +parts().map(function(P){return '<p class="part">'+esc(P.p)+'</p><ul class="toc">'+P.items.map(function(i){var x=L[i];
        return '<li><button type="button" data-go="'+i+'"><span class="id">'+x.id+'</span><span class="t">'+x.title+'</span><span class="ok">'+(OK[x.id]?'✓':'')+'</span></button></li>';}).join("")+'</ul>';}).join("");
  }
  function card(i){
    var x=L[i], prev=L[i-1], next=L[i+1];
    app.innerHTML='<div class="card"><span class="no">'+esc(x.part)+' · lesson '+(L.filter(function(y,j){return j<=i&&y.part===x.part;}).length)+' of '+L.filter(function(y){return y.part===x.part;}).length+'</span>'
      +'<h2>'+x.title+'</h2>'+x.svg+'<div class="idea">'+x.idea+'</div>'
      +'<div class="fbox"><b class="lb">Formula'+(x.formulas.length>1?'s':'')+'</b>'+x.formulas.map(function(m){return '<div class="fr"><div class="f">'+m.f+'</div><div class="say">'+m.say+'</div></div>';}).join("")+'</div>'
      +[x.ex,x.ex2].filter(Boolean).map(function(e){return '<div class="ex"><b>Example:</b> '+e.q+'<ol>'+e.steps.map(function(s){return '<li>'+s+'</li>';}).join("")+'</ol></div>';}).join("")
      +(x.tip?'<p class="tip">'+x.tip+'</p>':'')
      +'<button type="button" class="got" aria-pressed="'+(!!OK[x.id])+'" data-got="'+x.id+'">'+(OK[x.id]?'Understood ✓':'I understand ✓')+'</button></div>'
      +'<div class="nav"><button type="button" class="nb" data-go="'+(i-1)+'"'+(prev?'':' disabled')+'>← '+(prev?prev.id:'')+'</button>'
      +'<button type="button" class="nb pri" data-go="'+(next?i+1:-1)+'">'+(next?next.id+' →':'Contents →')+'</button></div>';
  }
  function sheet(){
    var by={}; L.forEach(function(x,i){x.formulas.forEach(function(m){(by[x.part]=by[x.part]||[]).push({m:m,i:i,id:x.id,t:x.title});});});
    app.innerHTML='<div class="sheet'+(cover?' cover':'')+'"><h1>Formula sheet</h1><p class="dek">All '+D.nf+' formulas, in lesson order. <b>Cover</b> blurs them: read the words, say the formula, then tap to check.</p>'
      +'<button type="button" class="tb" style="background:var(--blue);border-color:var(--blue)" data-cover="1">'+(cover?'Show all':'Cover')+'</button>'
      +Object.keys(by).map(function(p){return '<h3>'+esc(p)+'</h3>'+by[p].map(function(r){return '<div class="srow"><div class="f">'+r.m.f+'</div><div class="say">'+r.m.say+'</div><button type="button" data-go="'+r.i+'">'+r.id+' · see the picture</button></div>';}).join("");}).join("")+'</div>';
  }
  function render(){ if(st.v==="card"&&L[st.i])card(st.i); else if(st.v==="sheet")sheet(); else {st.v="toc";toc();} bar(); }
  function go(i){ if(i<0||i>=L.length){st.v="toc";} else {st.v="card";st.i=i;} keep(); render(); try{window.scrollTo(0,0);}catch(e){} }
  document.addEventListener("click",function(e){
    var t=e.target.closest?e.target.closest("button,.srow .f"):null; if(!t)return;
    if(t.classList&&t.classList.contains("f")){var r=t.closest(".srow"); if(r)r.classList.add("shown"); return;}
    if(t.hasAttribute("data-v")){st.v=t.getAttribute("data-v"); keep(); render(); try{window.scrollTo(0,0);}catch(e2){} return;}
    if(t.hasAttribute("data-go")){go(+t.getAttribute("data-go")); return;}
    if(t.hasAttribute("data-got")){var id=t.getAttribute("data-got"); if(OK[id])delete OK[id]; else OK[id]=1; sv("kmf.g0.known",OK);
      t.setAttribute("aria-pressed",String(!!OK[id])); t.textContent=OK[id]?"Understood ✓":"I understand ✓"; return;}
    if(t.hasAttribute("data-cover")){cover=!cover; sheet(); return;}
  });
  document.addEventListener("keydown",function(e){ if(st.v!=="card")return; if(e.key==="ArrowRight")go(st.i+1<L.length?st.i+1:-1); else if(e.key==="ArrowLeft"&&st.i>0)go(st.i-1); });
  /* inside KMF Quant: open at a lesson on request */
  window.addEventListener("message",function(e){var d=e.data; if(d&&typeof d.g0Go==="string"){var i=L.map(function(x){return x.id;}).indexOf(d.g0Go); if(i>=0)go(i);}});
  render();
})();
</script>
