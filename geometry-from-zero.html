<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Geometry from Zero</title>
<style>
:root{--ink:#1b2430;--ink2:#4a5866;--line:#d9dee3;--paper:#f6f4ee;--card:#fff;--blue:#1e6f9f;--green:#2e7a57;--amber:#9c6510;--red:#b23a2a;--wash:#eef5fa;--bar:#2a2e33;--exw:#f3f7f4;--tipw:#fbf4e6;--ok:#2e7a57}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e7ebe6;--ink2:#aab4b8;--line:#2a343a;--paper:#0f1519;--card:#161e23;--wash:#1a2a35;--exw:#16251d;--tipw:#2a2414;--blue:#5fb2de;--green:#67c293}}
:root[data-theme="dark"]{--ink:#e7ebe6;--ink2:#aab4b8;--line:#2a343a;--paper:#0f1519;--card:#161e23;--wash:#1a2a35;--exw:#16251d;--tipw:#2a2414;--blue:#5fb2de;--green:#67c293}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Georgia,"Source Serif 4",serif}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--bar);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.top b{font:700 15px/1.2 Arial,sans-serif;margin-right:auto}
.tb{font:600 13px/1 Arial,sans-serif;background:#555e66;border:1px solid #6c757d;color:#fff;border-radius:999px;padding:7px 13px;cursor:pointer}
.tb[aria-pressed="true"]{background:#1f5f86;border-color:#2c77a4}
main{max-width:620px;margin:0 auto;padding:16px 16px 60px}
h1{font:700 26px/1.2 Arial,sans-serif;margin:8px 0 6px}
.dek{color:var(--ink2);margin:0 0 14px}
.how{margin:0 0 18px;padding-left:20px;color:var(--ink2)} .how li{margin:3px 0}
.part{font:700 12px/1 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:20px 0 8px}
.toc{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.toc button{width:100%;text-align:left;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.toc button:hover{border-color:var(--blue)}
.toc .id{font:700 12px/1 Arial,sans-serif;color:var(--ink2);min-width:30px}
.toc .t{flex:1;font-size:15px;line-height:1.35}
.toc .ok{font:700 14px/1 Arial,sans-serif;color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px}
.no{font:700 11px/1 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
h2{font:700 20px/1.28 Arial,sans-serif;margin:6px 0 8px}
.card svg{display:block;width:100%;height:auto;margin:6px 0 10px;background:#fff;border-radius:6px}
.idea p{margin:6px 0} .idea ul{margin:4px 0;padding-left:20px}
.fbox{background:var(--wash);border-radius:8px;padding:8px 12px;margin:10px 0}
.lb{display:block;font:700 11px/1 Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.fr{padding:6px 0;border-top:1px dotted #c9d6e0} .fr:first-of-type{border-top:0}
.fr .f{font:700 17px/1.4 Arial,sans-serif}
.fr .say{font-size:14.5px;color:var(--ink2)}
.ex{border-left:3px solid var(--green);background:var(--exw);padding:8px 12px;border-radius:0 8px 8px 0;margin:8px 0}
.ex>b:first-child{color:var(--green)}
.ex ol{margin:4px 0 0;padding-left:22px} .ex li{margin:2px 0}
.tip{background:var(--tipw);border-radius:8px;padding:7px 11px;margin:8px 0 0}
.got{margin-top:14px;font:600 14px/1 Arial,sans-serif;border:1px solid var(--ok);color:var(--ok);background:transparent;border-radius:999px;padding:9px 16px;cursor:pointer}
.got[aria-pressed="true"]{background:var(--ok);color:#fff}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.nb{font:600 14px/1.2 Arial,sans-serif;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 16px;cursor:pointer;max-width:48%;text-align:left}
.nb.pri{background:var(--blue);border-color:var(--blue);color:#fff;text-align:right}
.nb:disabled{opacity:.35;cursor:default}
.sheet h3{font:700 16px/1.2 Arial,sans-serif;margin:18px 0 6px}
.srow{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:8px 0;border-bottom:1px dotted var(--line)}
.srow .f{font:700 15.5px/1.4 Arial,sans-serif}
.srow .say{font-size:14px;color:var(--ink2)}
.srow button{justify-self:start;background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;font:600 12.5px/1 Arial,sans-serif;padding:2px 0}
.cover .srow .f{filter:blur(6px);cursor:pointer}
.cover .srow.shown .f{filter:none}
.prog{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin:4px 0 14px} .prog i{display:block;height:100%;background:var(--ok)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script type="application/json" id="g0-data">{"title":"Geometry & Coordinate Geometry from Zero","nf":109,"lessons":[{"id":"G1","title":"The four basic pieces: a point, a line, a ray and a segment","svg":"<svg viewBox=\"0 0 320 228\" aria-hidden=\"true\"><text x=\"12\" y=\"30.4\" font-family=\"Arial\" font-size=\"15\" fill=\"#1b2430\" font-weight=\"700\">point<\/text><text x=\"12\" y=\"47.3\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">one spot<\/text><text x=\"12\" y=\"88.4\" font-family=\"Arial\" font-size=\"15\" fill=\"#1b2430\" font-weight=\"700\">line<\/text><text x=\"12\" y=\"105.3\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">no ends<\/text><text x=\"12\" y=\"146.4\" font-family=\"Arial\" font-size=\"15\" fill=\"#1b2430\" font-weight=\"700\">ray<\/text><text x=\"12\" y=\"163.3\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">1 end<\/text><text x=\"12\" y=\"204.4\" font-family=\"Arial\" font-size=\"15\" fill=\"#1b2430\" font-weight=\"700\">segment<\/text><text x=\"12\" y=\"221.3\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">2 ends<\/text><circle cx=\"190\" cy=\"32\" r=\"4.5\" fill=\"#1b2430\"/><text x=\"203\" y=\"27\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\" font-weight=\"700\" text-anchor=\"middle\">P<\/text><line x1=\"112\" y1=\"90\" x2=\"300\" y2=\"90\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><polygon points=\"310,90 299,85.1 299,94.9\" fill=\"#1e6f9f\"/><polygon points=\"102,90 113,94.9 113,85.1\" fill=\"#1e6f9f\"/><circle cx=\"160\" cy=\"90\" r=\"4.5\" fill=\"#1b2430\"/><circle cx=\"250\" cy=\"90\" r=\"4.5\" fill=\"#1b2430\"/><text x=\"160\" y=\"112\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\" font-weight=\"700\" text-anchor=\"middle\">D<\/text><text x=\"250\" y=\"112\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\" font-weight=\"700\" text-anchor=\"middle\">E<\/text><line x1=\"110\" y1=\"148\" x2=\"300\" y2=\"148\" stroke=\"#2e7a57\" stroke-width=\"3\"/><polygon points=\"310,148 299,143.1 299,152.9\" fill=\"#2e7a57\"/><circle cx=\"110\" cy=\"148\" r=\"4.5\" fill=\"#1b2430\"/><circle cx=\"200\" cy=\"148\" r=\"4.5\" fill=\"#1b2430\"/><text x=\"110\" y=\"170\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\" font-weight=\"700\" text-anchor=\"middle\">F<\/text><text x=\"200\" y=\"170\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\" font-weight=\"700\" text-anchor=\"middle\">G<\/text><line x1=\"110\" y1=\"206\" x2=\"176\" y2=\"206\" stroke=\"#9c6510\" stroke-width=\"3\"/><line x1=\"176\" y1=\"206\" x2=\"286\" y2=\"206\" stroke=\"#9c6510\" stroke-width=\"3\"/><circle cx=\"110\" cy=\"206\" r=\"4.5\" fill=\"#1b2430\"/><text x=\"110\" y=\"228\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\" font-weight=\"700\" text-anchor=\"middle\">A<\/text><circle cx=\"176\" cy=\"206\" r=\"4.5\" fill=\"#1b2430\"/><text x=\"176\" y=\"228\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\" font-weight=\"700\" text-anchor=\"middle\">B<\/text><circle cx=\"286\" cy=\"206\" r=\"4.5\" fill=\"#1b2430\"/><text x=\"286\" y=\"228\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\" font-weight=\"700\" text-anchor=\"middle\">C<\/text><text x=\"143\" y=\"198.4\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">3<\/text><text x=\"231\" y=\"198.4\" font-family=\"Arial\" font-size=\"15\" fill=\"#2e7a57\" font-weight=\"700\" text-anchor=\"middle\">5<\/text><\/svg>","idea":"<p>A <b>point<\/b> is one exact spot. We draw it as a dot and name it with a capital letter, like P.<\/p><p>A <b>line<\/b> is straight and goes on forever both ways (the two arrows). A <b>ray<\/b> starts at one point and goes on forever one way. A <b>segment<\/b> is the piece between two end points, so it has a length.<\/p>","formulas":[{"f":"AC = AB + BC","say":"If point B sits on segment AC, the two short pieces add up to the whole piece. Use it to find a missing length."},{"f":"M is the midpoint → AM = MC = ½ × AC","say":"The <b>midpoint<\/b> M is the point exactly in the middle of a segment. It cuts the segment into two equal halves."},{"f":"line: 0 ends · ray: 1 end · segment: 2 ends","say":"Only a segment has a length you can measure. Lines and rays never stop."}],"ex":{"q":"In the picture, AB = 3 and BC = 5. How long is AC? Where is its midpoint M?","steps":["B is on segment AC, so AC = AB + BC.","AC = 3 + 5 = <b>8<\/b>","M is halfway: ½ × 8 = <b>4<\/b> from A. That is 1 step past B, because AB = 3 ✅"]},"tip":"💡 Look at the ends: an arrow means \"goes on forever\", a dot means \"stops here\".","part":"Geometry"},{"id":"G2","title":"An angle is a turn. A full turn is 360°; a straight line is 180°","svg":"<svg viewBox=\"0 0 320 210\" aria-hidden=\"true\"><line x1=\"88\" y1=\"108\" x2=\"150\" y2=\"85.4\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"88\" y1=\"108\" x2=\"55\" y2=\"50.8\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"88\" y1=\"108\" x2=\"88\" y2=\"174\" stroke=\"#1b2430\" stroke-width=\"3\"/><path d=\"M110.6,99.8 A24 24 0 0 0 76,87.2\" fill=\"none\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><path d=\"M73,82 A30 30 0 0 0 88,138\" fill=\"none\" stroke=\"#2e7a57\" stroke-width=\"2.5\"/><path d=\"M88,130 A22 22 0 0 0 108.7,100.5\" fill=\"none\" stroke=\"#b23a2a\" stroke-width=\"2.5\"/><text x=\"103\" y=\"72.1\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">100°<\/text><text x=\"39.7\" y=\"126.3\" font-family=\"Arial\" font-size=\"15\" fill=\"#2e7a57\" font-weight=\"700\" text-anchor=\"middle\">150°<\/text><text x=\"120.8\" y=\"136.7\" font-family=\"Arial\" font-size=\"16\" fill=\"#b23a2a\" font-weight=\"700\" text-anchor=\"middle\">x<\/text><circle cx=\"88\" cy=\"108\" r=\"4.5\" fill=\"#1b2430\"/><text x=\"88\" y=\"200.3\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\">all the way round = 360°<\/text><line x1=\"188\" y1=\"140\" x2=\"312\" y2=\"140\" stroke=\"#1b2430\" stroke-width=\"3\"/><path d=\"M286,140 A36 36 0 0 0 214,140\" fill=\"none\" stroke=\"#9c6510\" stroke-width=\"2.5\"/><circle cx=\"250\" cy=\"140\" r=\"4.5\" fill=\"#1b2430\"/><text x=\"250\" y=\"93.8\" font-family=\"Arial\" font-size=\"16\" fill=\"#9c6510\" font-weight=\"700\" text-anchor=\"middle\">180°<\/text><text x=\"250\" y=\"169.3\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\">a straight line = 180°<\/text><\/svg>","idea":"<p>An <b>angle<\/b> is the opening between two lines that meet at one point. That point is called the <b>vertex<\/b>.<\/p><p>We measure the opening in <b>degrees (°)<\/b>. One full turn, all the way round, is 360°. Half a turn gives a straight line, so a straight line is 180°.<\/p>","formulas":[{"f":"a + b + c = 360°","say":"Angles all the way round one point add up to 360° (left picture)."},{"f":"a + b = 180°","say":"Angles side by side on one straight line add up to 180° (half a turn)."},{"f":"quarter turn = 90°","say":"A quarter of a full turn is 90°. It is the square corner of a page."}],"ex":{"q":"In the left picture the angles are 100°, 150° and x. Find x.","steps":["The three angles go all the way round one point, so they add to 360°.","100 + 150 = 250","x = 360 − 250 = <b>110°<\/b> ✅"]},"tip":"💡 Round a point → 360°. Along a straight line → 180°. A square corner → 90°.","part":"Geometry"},{"id":"G3","title":"Four kinds of angle: acute, right, obtuse and straight","svg":"<svg viewBox=\"0 0 320 240\" aria-hidden=\"true\"><line x1=\"75\" y1=\"70\" x2=\"147\" y2=\"70\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"75\" y1=\"70\" x2=\"121\" y2=\"31.4\" stroke=\"#1b2430\" stroke-width=\"3\"/><path d=\"M97,70 A22 22 0 0 0 91.9,55.9\" fill=\"none\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><text x=\"122\" y=\"57.9\" font-family=\"Arial\" font-size=\"14\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">40°<\/text><circle cx=\"75\" cy=\"70\" r=\"3.5\" fill=\"#1b2430\"/><text x=\"80\" y=\"95.4\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">acute<\/text><text x=\"80\" y=\"110.3\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\">less than 90°<\/text><line x1=\"235\" y1=\"70\" x2=\"307\" y2=\"70\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"235\" y1=\"70\" x2=\"235\" y2=\"10\" stroke=\"#1b2430\" stroke-width=\"3\"/><polyline points=\"249,70 249,56 235,56\" fill=\"none\" stroke=\"#2e7a57\" stroke-width=\"2\"/><text x=\"260.5\" y=\"49.6\" font-family=\"Arial\" font-size=\"14\" fill=\"#2e7a57\" font-weight=\"700\" text-anchor=\"middle\">90°<\/text><circle cx=\"235\" cy=\"70\" r=\"3.5\" fill=\"#1b2430\"/><text x=\"240\" y=\"95.4\" font-family=\"Arial\" font-size=\"15\" fill=\"#2e7a57\" font-weight=\"700\" text-anchor=\"middle\">right<\/text><text x=\"240\" y=\"110.3\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\">exactly 90°<\/text><line x1=\"75\" y1=\"190\" x2=\"147\" y2=\"190\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"75\" y1=\"190\" x2=\"36.4\" y2=\"144\" stroke=\"#1b2430\" stroke-width=\"3\"/><path d=\"M97,190 A22 22 0 0 0 60.9,173.1\" fill=\"none\" stroke=\"#9c6510\" stroke-width=\"2.5\"/><text x=\"91.1\" y=\"160.6\" font-family=\"Arial\" font-size=\"14\" fill=\"#9c6510\" font-weight=\"700\" text-anchor=\"middle\">130°<\/text><circle cx=\"75\" cy=\"190\" r=\"3.5\" fill=\"#1b2430\"/><text x=\"80\" y=\"215.4\" font-family=\"Arial\" font-size=\"15\" fill=\"#9c6510\" font-weight=\"700\" text-anchor=\"middle\">obtuse<\/text><text x=\"80\" y=\"230.3\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\">between 90° and 180°<\/text><line x1=\"235\" y1=\"190\" x2=\"307\" y2=\"190\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"235\" y1=\"190\" x2=\"165\" y2=\"190\" stroke=\"#1b2430\" stroke-width=\"3\"/><path d=\"M257,190 A22 22 0 0 0 213,190\" fill=\"none\" stroke=\"#b23a2a\" stroke-width=\"2.5\"/><text x=\"235\" y=\"159\" font-family=\"Arial\" font-size=\"14\" fill=\"#b23a2a\" font-weight=\"700\" text-anchor=\"middle\">180°<\/text><circle cx=\"235\" cy=\"190\" r=\"3.5\" fill=\"#1b2430\"/><text x=\"240\" y=\"215.4\" font-family=\"Arial\" font-size=\"15\" fill=\"#b23a2a\" font-weight=\"700\" text-anchor=\"middle\">straight<\/text><text x=\"240\" y=\"230.3\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\">exactly 180°<\/text><line x1=\"160\" y1=\"8\" x2=\"160\" y2=\"232\" stroke=\"#e3e7ea\" stroke-width=\"1\"/><line x1=\"8\" y1=\"120\" x2=\"312\" y2=\"120\" stroke=\"#e3e7ea\" stroke-width=\"1\"/><\/svg>","idea":"<p>We sort angles by size, using 90° and 180° as the two marks.<\/p><p>An <b>acute<\/b> angle is small and sharp. A <b>right<\/b> angle is a square corner, shown by a little square. An <b>obtuse<\/b> angle is wide open. A <b>straight<\/b> angle is flat, a straight line.<\/p>","formulas":[{"f":"acute: 0° &lt; angle &lt; 90°","say":"Smaller than a square corner."},{"f":"right: angle = 90°","say":"Exactly a square corner. The little square in a drawing means exactly 90°."},{"f":"obtuse: 90° &lt; angle &lt; 180°","say":"Bigger than a square corner, but not yet flat."},{"f":"straight: angle = 180°","say":"The two arms point in opposite directions and make one straight line."},{"f":"a + b = 90°","say":"If two angles together fill a right angle, they add up to 90°."}],"ex":{"q":"Name each angle: 35°, 90°, 145°, 180°.","steps":["35° is less than 90° → <b>acute<\/b>","90° exactly → <b>right<\/b>","145° is between 90° and 180° → <b>obtuse<\/b>","180° → <b>straight<\/b> ✅"]},"ex2":{"q":"A right angle is split into two parts. One part is 35°. Find the other part.","steps":["The two parts fill 90°, so a + 35 = 90.","a = 90 − 35 = <b>55°<\/b> ✅"]},"tip":"💡 Acute = \"a cute\" little angle. Obtuse = wide open. A little square always means exactly 90°.","part":"Geometry"},{"id":"G4","title":"When two lines cross, the opposite angles are equal","svg":"<svg viewBox=\"0 0 320 236\" aria-hidden=\"true\"><line x1=\"295\" y1=\"118\" x2=\"25\" y2=\"118\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"227.5\" y1=\"37.6\" x2=\"92.5\" y2=\"198.4\" stroke=\"#1b2430\" stroke-width=\"3\"/><path d=\"M190,118 A30 30 0 0 0 179.3,95\" fill=\"none\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><path d=\"M130,118 A30 30 0 0 0 140.7,141\" fill=\"none\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><path d=\"M174.1,101.1 A22 22 0 0 0 138,118\" fill=\"none\" stroke=\"#2e7a57\" stroke-width=\"2.5\"/><path d=\"M145.9,134.9 A22 22 0 0 0 182,118\" fill=\"none\" stroke=\"#2e7a57\" stroke-width=\"2.5\"/><text x=\"205.3\" y=\"102.6\" font-family=\"Arial\" font-size=\"16\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">50°<\/text><text x=\"118.3\" y=\"143.2\" font-family=\"Arial\" font-size=\"16\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">a<\/text><text x=\"142.3\" y=\"85.7\" font-family=\"Arial\" font-size=\"16\" fill=\"#2e7a57\" font-weight=\"700\" text-anchor=\"middle\">b<\/text><text x=\"177.7\" y=\"161.8\" font-family=\"Arial\" font-size=\"16\" fill=\"#2e7a57\" font-weight=\"700\" text-anchor=\"middle\">c<\/text><circle cx=\"160\" cy=\"118\" r=\"4\" fill=\"#1b2430\"/><\/svg>","idea":"<p>Two straight lines cross and make four angles. Angles straight across from each other are <b>opposite angles<\/b>. The GRE calls them <b>vertical angles<\/b>.<\/p><p>Opposite angles are always equal: blue matches blue, green matches green. A blue and a green angle side by side sit on one line, so they add to 180°.<\/p>","formulas":[{"f":"opposite angles are equal: a = 50°, c = b","say":"a sits straight across from 50°, so a = 50°. In the same way c sits across from b, so c = b."},{"f":"50° + b = 180°","say":"Two angles next to each other on one straight line add up to 180°."},{"f":"50° + b + a + c = 360°","say":"All four angles go all the way round the crossing point."}],"ex":{"q":"In the picture one angle is 50°. Find a, b and c.","steps":["a is opposite 50°, so <b>a = 50°<\/b>","b is next to 50° on a straight line: b = 180 − 50 = <b>130°<\/b>","c is opposite b, so <b>c = 130°<\/b> ✅","Check: 50 + 130 + 50 + 130 = 360 ✓"]},"tip":"💡 Two crossing lines make only two sizes of angle, and the two sizes always add to 180°.","part":"Geometry"},{"id":"G5","title":"Two parallel lines cut by a third line: only two sizes of angle","svg":"<svg viewBox=\"0 0 320 236\" aria-hidden=\"true\"><line x1=\"14\" y1=\"66\" x2=\"306\" y2=\"66\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"14\" y1=\"170\" x2=\"306\" y2=\"170\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"218\" y1=\"18.9\" x2=\"125.5\" y2=\"217.1\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><polyline points=\"54.6,60.8 62,66 54.6,71.2\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2.5\"/><polyline points=\"54.6,164.8 62,170 54.6,175.2\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2.5\"/><path d=\"M220,66 A24 24 0 0 0 206.1,44.2\" fill=\"none\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><path d=\"M172,66 A24 24 0 0 0 185.9,87.8\" fill=\"none\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><path d=\"M203.6,49.7 A18 18 0 0 0 178,66\" fill=\"none\" stroke=\"#2e7a57\" stroke-width=\"2.5\"/><path d=\"M188.4,82.3 A18 18 0 0 0 214,66\" fill=\"none\" stroke=\"#2e7a57\" stroke-width=\"2.5\"/><text x=\"234.8\" y=\"46.3\" font-family=\"Arial\" font-size=\"14\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">65°<\/text><text x=\"157.2\" y=\"95.8\" font-family=\"Arial\" font-size=\"14\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">65°<\/text><text x=\"174.5\" y=\"37.3\" font-family=\"Arial\" font-size=\"14\" fill=\"#2e7a57\" font-weight=\"700\" text-anchor=\"middle\">115°<\/text><text x=\"217.5\" y=\"104.8\" font-family=\"Arial\" font-size=\"14\" fill=\"#2e7a57\" font-weight=\"700\" text-anchor=\"middle\">115°<\/text><circle cx=\"196\" cy=\"66\" r=\"3.5\" fill=\"#1b2430\"/><path d=\"M171.5,170 A24 24 0 0 0 157.6,148.2\" fill=\"none\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><path d=\"M123.5,170 A24 24 0 0 0 137.4,191.8\" fill=\"none\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><path d=\"M155.1,153.7 A18 18 0 0 0 129.5,170\" fill=\"none\" stroke=\"#2e7a57\" stroke-width=\"2.5\"/><path d=\"M139.9,186.3 A18 18 0 0 0 165.5,170\" fill=\"none\" stroke=\"#2e7a57\" stroke-width=\"2.5\"/><text x=\"186.3\" y=\"150.3\" font-family=\"Arial\" font-size=\"14\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">65°<\/text><text x=\"108.7\" y=\"199.8\" font-family=\"Arial\" font-size=\"14\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">65°<\/text><text x=\"126\" y=\"141.3\" font-family=\"Arial\" font-size=\"14\" fill=\"#2e7a57\" font-weight=\"700\" text-anchor=\"middle\">115°<\/text><text x=\"169\" y=\"208.8\" font-family=\"Arial\" font-size=\"14\" fill=\"#2e7a57\" font-weight=\"700\" text-anchor=\"middle\">115°<\/text><circle cx=\"147.5\" cy=\"170\" r=\"3.5\" fill=\"#1b2430\"/><\/svg>","idea":"<p><b>Parallel<\/b> lines run side by side and never meet, like train rails. The little arrows (›) mark them as parallel.<\/p><p>A third line crossing them makes 8 angles, but only two sizes. All the small blue angles are equal. All the big green angles are equal. One small + one big = 180°.<\/p>","formulas":[{"f":"corresponding angles are equal","say":"Same spot at each crossing, for example both top-right. Think of the letter <b>F<\/b>."},{"f":"alternate angles are equal","say":"Between the two rails, on opposite sides of the crossing line. Think of the letter <b>Z<\/b>."},{"f":"small + big = 180°  (65° + 115° = 180°)","say":"Any blue angle plus any green angle makes 180°. Two angles between the rails on the same side (a <b>C<\/b> shape) add to 180°."}],"ex":{"q":"Two parallel lines are cut by a third line. One small angle is 70°. Find a big angle, and the angle in the same spot at the other crossing.","steps":["Small + big = 180°, so big = 180 − 70 = <b>110°<\/b>","Same spot at the other crossing (corresponding) = <b>70°<\/b> ✅"]},"tip":"⚠️ These rules work only if the lines really are parallel. Look for the arrows or the word \"parallel\".","part":"Geometry"},{"id":"G6","title":"The three angles inside any triangle add up to 180°","svg":"<svg viewBox=\"0 0 320 228\" aria-hidden=\"true\"><line x1=\"182\" y1=\"186\" x2=\"300\" y2=\"186\" stroke=\"#1b2430\" stroke-width=\"3\" stroke-dasharray=\"7 5\"/><polygon points=\"124,26.6 32,186 182,186\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\" stroke-linejoin=\"round\"/><path d=\"M58,186 A26 26 0 0 0 45,163.5\" fill=\"none\" stroke=\"#2e7a57\" stroke-width=\"2.5\"/><text x=\"70.1\" y=\"169.4\" font-family=\"Arial\" font-size=\"15\" fill=\"#2e7a57\" font-weight=\"700\" text-anchor=\"middle\">60°<\/text><path d=\"M111,49.2 A26 26 0 0 0 132.9,51.1\" fill=\"none\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><text x=\"119.8\" y=\"79.9\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">50°<\/text><path d=\"M174.5,165.3 A22 22 0 0 0 160,186\" fill=\"none\" stroke=\"#4a5866\" stroke-width=\"2.5\"/><text x=\"147.6\" y=\"167.3\" font-family=\"Arial\" font-size=\"15\" fill=\"#4a5866\" font-weight=\"700\" text-anchor=\"middle\">70°<\/text><path d=\"M210,186 A28 28 0 0 0 172.4,159.7\" fill=\"none\" stroke=\"#b23a2a\" stroke-width=\"2.5\"/><text x=\"209.5\" y=\"152.4\" font-family=\"Arial\" font-size=\"16\" fill=\"#b23a2a\" font-weight=\"700\" text-anchor=\"middle\">110°<\/text><text x=\"124\" y=\"17.7\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\" font-weight=\"700\" text-anchor=\"middle\">A<\/text><text x=\"28\" y=\"208\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\" font-weight=\"700\" text-anchor=\"middle\">B<\/text><text x=\"182\" y=\"208\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\" font-weight=\"700\" text-anchor=\"middle\">C<\/text><text x=\"312\" y=\"222.3\" font-family=\"Arial\" font-size=\"12\" fill=\"#b23a2a\" text-anchor=\"end\">outside angle = 50° + 60°<\/text><\/svg>","idea":"<p>A <b>triangle<\/b> has 3 straight sides and 3 corners. ∠A means \"the angle at corner A\".<\/p><p>The three inside angles always add to 180°: 50° + 60° + 70° = 180°. Stretch the bottom side past C (dashed). The red <b>exterior angle<\/b> (outside angle) equals the two far angles: 50° + 60° = 110°.<\/p>","formulas":[{"f":"∠A + ∠B + ∠C = 180°","say":"Works for every triangle, any shape. Know two angles, and the third is 180° minus their sum."},{"f":"∠ext = ∠A + ∠B","say":"The outside angle at C equals the inside angles at the <b>other<\/b> two corners, A and B. Together with the inside angle next to it (70°), it makes 180°."}],"ex":{"q":"A triangle has angles 50° and 60°. Find the third angle.","steps":["50 + 60 = 110","Third angle = 180 − 110 = <b>70°<\/b> ✅","Another one: angles 50° and 40° give 180 − 90 = 90°, a right angle."]},"ex2":{"q":"Two inside angles of a triangle are 45° and 65°. Find the outside angle at the third corner, and the inside angle beside it.","steps":["Outside angle = 45 + 65 = <b>110°<\/b>","Inside angle beside it = 180 − 110 = <b>70°<\/b> ✅","Check: 45 + 65 + 70 = 180 ✓"]},"tip":"⚠️ The two given angles must add to less than 180°: 90° and 90° leave 0°, so no triangle. (Any shape with n sides: inside angles add to (n − 2) × 180°.)","part":"Geometry"},{"id":"G7","title":"Equal sides face equal angles; the longest side faces the biggest angle","svg":"<svg viewBox=\"0 0 320 240\" aria-hidden=\"true\"><polygon points=\"22,96 182,96 102,36\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"57.8\" y1=\"60.4\" x2=\"66.2\" y2=\"71.6\" stroke=\"#1b2430\" stroke-width=\"2.5\"/><line x1=\"137.8\" y1=\"71.6\" x2=\"146.2\" y2=\"60.4\" stroke=\"#1b2430\" stroke-width=\"2.5\"/><text x=\"53\" y=\"59.4\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">5<\/text><text x=\"151\" y=\"59.4\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">5<\/text><text x=\"102\" y=\"117.4\" font-family=\"Arial\" font-size=\"15\" fill=\"#1b2430\" font-weight=\"700\" text-anchor=\"middle\">8<\/text><path d=\"M48,96 A26 26 0 0 0 42.8,80.4\" fill=\"none\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><path d=\"M53,96 A31 31 0 0 0 46.8,77.4\" fill=\"none\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><path d=\"M161.2,80.4 A26 26 0 0 0 156,96\" fill=\"none\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><path d=\"M157.2,77.4 A31 31 0 0 0 151,96\" fill=\"none\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><text x=\"200\" y=\"50.7\" font-family=\"Arial\" font-size=\"13\" fill=\"#1e6f9f\" font-weight=\"700\">2 equal sides<\/text><text x=\"200\" y=\"67.7\" font-family=\"Arial\" font-size=\"13\" fill=\"#1e6f9f\" font-weight=\"700\">→ 2 equal angles<\/text><text x=\"200\" y=\"84.3\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">(at the ends of 8)<\/text><polygon points=\"22,212 184,212 79,142.4\" fill=\"#eef5fa\" stroke=\"none\"/><line x1=\"22\" y1=\"212\" x2=\"184\" y2=\"212\" stroke=\"#b23a2a\" stroke-width=\"3\"/><line x1=\"184\" y1=\"212\" x2=\"79\" y2=\"142.4\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><line x1=\"22\" y1=\"212\" x2=\"79\" y2=\"142.4\" stroke=\"#2e7a57\" stroke-width=\"3\"/><text x=\"40.4\" y=\"174.3\" font-family=\"Arial\" font-size=\"15\" fill=\"#2e7a57\" font-weight=\"700\" text-anchor=\"middle\">5<\/text><text x=\"138.7\" y=\"171.7\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">7<\/text><text x=\"103\" y=\"233.4\" font-family=\"Arial\" font-size=\"15\" fill=\"#b23a2a\" font-weight=\"700\" text-anchor=\"middle\">9<\/text><path d=\"M44,212 A22 22 0 0 0 35.9,195\" fill=\"none\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><text x=\"58.1\" y=\"199.6\" font-family=\"Arial\" font-size=\"13\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">51°<\/text><path d=\"M164,198.7 A24 24 0 0 0 160,212\" fill=\"none\" stroke=\"#2e7a57\" stroke-width=\"2.5\"/><text x=\"136.1\" y=\"202.2\" font-family=\"Arial\" font-size=\"13\" fill=\"#2e7a57\" font-weight=\"700\" text-anchor=\"middle\">34°<\/text><path d=\"M68.9,154.7 A16 16 0 0 0 92.3,151.2\" fill=\"none\" stroke=\"#b23a2a\" stroke-width=\"2.5\"/><text x=\"83.8\" y=\"178.7\" font-family=\"Arial\" font-size=\"13\" fill=\"#b23a2a\" font-weight=\"700\" text-anchor=\"middle\">96°<\/text><text x=\"200\" y=\"172.7\" font-family=\"Arial\" font-size=\"13\" fill=\"#b23a2a\" font-weight=\"700\">longest side 9<\/text><text x=\"200\" y=\"189.7\" font-family=\"Arial\" font-size=\"13\" fill=\"#b23a2a\" font-weight=\"700\">↔ biggest angle<\/text><line x1=\"10\" y1=\"126\" x2=\"310\" y2=\"126\" stroke=\"#e3e7ea\" stroke-width=\"1\"/><\/svg>","idea":"<p>By sides: <b>equilateral<\/b> = 3 equal sides, <b>isosceles<\/b> = 2 equal sides, <b>scalene<\/b> = no equal sides. Tick marks (little dashes) show equal sides. By angles: a <b>right<\/b> triangle has a 90° angle, an <b>obtuse<\/b> one has an angle over 90°.<\/p><p>Each side <b>faces<\/b> the corner it does not touch. Top: the two equal 5s face the two equal blue angles. Bottom: each side faces the angle of its own colour, and the longest side (9) faces the biggest angle.<\/p>","formulas":[{"f":"a = b ⇔ ∠A = ∠B","say":"Small letter = a side; capital letter = the angle across from it. ⇔ means \"works both ways\": equal sides give equal angles, and equal angles give equal sides."},{"f":"a &lt; b &lt; c ⇔ ∠A &lt; ∠B &lt; ∠C","say":"Put the sides in order, and the angles facing them come in the same order. It is only an order: a 30-60-90 triangle has sides 1 : √3 : 2, not 1 : 2 : 3."},{"f":"equilateral: every angle = 60°","say":"Three equal sides face three equal angles: 180 ÷ 3 = 60°."}],"ex":{"q":"An isosceles triangle has a top angle of 50° between its two equal sides. Find the two equal bottom angles.","steps":["The two bottom angles share 180 − 50 = 130°.","Each one = 130 ÷ 2 = <b>65°<\/b> ✅","Backwards: if two angles are both 65°, the sides facing them must be equal."]},"ex2":{"q":"A triangle has sides 5, 7 and 9 (bottom picture). Which angle is the biggest? Which is the smallest?","steps":["Biggest angle faces the longest side, 9: about <b>95.7°<\/b>","Smallest angle faces the shortest side, 5: about <b>33.6°<\/b> ✅","The middle angle, about 50.7°, faces the 7."]},"tip":"⚠️ The equal angles <b>face<\/b> the equal sides. In a 5, 5, 8 triangle they sit at the two ends of the 8, not between the two 5s.","part":"Geometry"},{"id":"G8","title":"Two sides of a triangle always add up to more than the third side","svg":"<svg viewBox=\"0 0 320 228\" aria-hidden=\"true\"><polygon points=\"90,96 234,96 134,55.2\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\" stroke-linejoin=\"round\"/><text x=\"103.2\" y=\"71.5\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">5<\/text><text x=\"189.3\" y=\"68\" font-family=\"Arial\" font-size=\"15\" fill=\"#2e7a57\" font-weight=\"700\" text-anchor=\"middle\">9<\/text><text x=\"162\" y=\"118.4\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">12<\/text><line x1=\"20\" y1=\"172\" x2=\"306\" y2=\"172\" stroke=\"#1b2430\" stroke-width=\"2\"/><line x1=\"20\" y1=\"168\" x2=\"20\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"34\" y1=\"168\" x2=\"34\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"48\" y1=\"168\" x2=\"48\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"62\" y1=\"168\" x2=\"62\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"76\" y1=\"168\" x2=\"76\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"90\" y1=\"168\" x2=\"90\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"104\" y1=\"168\" x2=\"104\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"118\" y1=\"168\" x2=\"118\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"132\" y1=\"168\" x2=\"132\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"146\" y1=\"168\" x2=\"146\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"160\" y1=\"168\" x2=\"160\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"174\" y1=\"168\" x2=\"174\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"188\" y1=\"168\" x2=\"188\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"202\" y1=\"168\" x2=\"202\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"216\" y1=\"168\" x2=\"216\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"230\" y1=\"168\" x2=\"230\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"244\" y1=\"168\" x2=\"244\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"258\" y1=\"168\" x2=\"258\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"272\" y1=\"168\" x2=\"272\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"286\" y1=\"168\" x2=\"286\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"300\" y1=\"168\" x2=\"300\" y2=\"176\" stroke=\"#1b2430\" stroke-width=\"1.5\"/><line x1=\"118\" y1=\"172\" x2=\"258\" y2=\"172\" stroke=\"#2e7a57\" stroke-width=\"7\"/><circle cx=\"118\" cy=\"172\" r=\"6\" fill=\"#ffffff\" stroke=\"#b23a2a\" stroke-width=\"2.5\"/><circle cx=\"258\" cy=\"172\" r=\"6\" fill=\"#ffffff\" stroke=\"#b23a2a\" stroke-width=\"2.5\"/><circle cx=\"146\" cy=\"172\" r=\"4.5\" fill=\"#1b2430\"/><text x=\"20\" y=\"197\" font-family=\"Arial\" font-size=\"14\" fill=\"#4a5866\" text-anchor=\"middle\">0<\/text><text x=\"118\" y=\"197\" font-family=\"Arial\" font-size=\"14\" fill=\"#b23a2a\" font-weight=\"700\" text-anchor=\"middle\">7<\/text><text x=\"146\" y=\"197\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\" font-weight=\"700\" text-anchor=\"middle\">9<\/text><text x=\"258\" y=\"197\" font-family=\"Arial\" font-size=\"14\" fill=\"#b23a2a\" font-weight=\"700\" text-anchor=\"middle\">17<\/text><text x=\"300\" y=\"197\" font-family=\"Arial\" font-size=\"14\" fill=\"#4a5866\" text-anchor=\"middle\">20<\/text><text x=\"188\" y=\"156.7\" font-family=\"Arial\" font-size=\"13\" fill=\"#2e7a57\" font-weight=\"700\" text-anchor=\"middle\">third side fits here<\/text><text x=\"118\" y=\"220.3\" font-family=\"Arial\" font-size=\"12\" fill=\"#b23a2a\" text-anchor=\"middle\">12 − 5<\/text><text x=\"258\" y=\"220.3\" font-family=\"Arial\" font-size=\"12\" fill=\"#b23a2a\" text-anchor=\"middle\">12 + 5<\/text><\/svg>","idea":"<p>Take two sticks, 5 and 12 long, joined at one end. The gap between their free ends is the <b>third side<\/b>.<\/p><p>Folded flat, the gap is 12 − 5 = 7. Opened flat, it is 12 + 5 = 17. A real triangle needs a gap strictly between: the green part of the number line. A third side of 9 works (top).<\/p>","formulas":[{"f":"|a − b| &lt; c &lt; a + b","say":"a and b = two sides you know; c = the third side. |a − b| = the difference (big minus small). c is more than the difference and less than the sum."},{"f":"a + b &gt; c","say":"Quick test for three lengths: the two shorter ones must add to more than the longest one."}],"ex":{"q":"Two sides of a triangle are 5 and 12. What can the third side be?","steps":["Difference: 12 − 5 = 7. Sum: 12 + 5 = 17.","So 7 &lt; c &lt; 17. A third side of 9 works.","If it must be a whole number: least <b>8<\/b>, greatest <b>16<\/b> ✅"]},"ex2":{"q":"Can 3, 4 and 8 be the sides of a triangle?","steps":["The two shorter sides: 3 + 4 = 7.","7 is not more than 8, so <b>no triangle<\/b> ✅"]},"tip":"⚠️ Both ends are \"strictly\". Sides 5, 12, 17 lie flat in one straight line, so 17 is not allowed, and neither is 7.","part":"Geometry"},{"id":"G9","title":"Area of a triangle = ½ × base × height","svg":"<svg viewBox=\"0 0 320 160\" aria-hidden=\"true\"><polygon points=\"16,110 146,110 94,19\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"94\" y1=\"19\" x2=\"94\" y2=\"110\" stroke=\"#b23a2a\" stroke-width=\"2.5\" stroke-dasharray=\"6 4\"/><polyline points=\"105,110 105,99 94,99\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"88\" y=\"75\" font-family=\"Arial\" font-size=\"14\" fill=\"#b23a2a\" font-weight=\"700\" text-anchor=\"end\">h = 7<\/text><text x=\"81\" y=\"132\" font-family=\"Arial\" font-size=\"14\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">b = 10<\/text><text x=\"81\" y=\"154.3\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\">height inside<\/text><line x1=\"226\" y1=\"110\" x2=\"252\" y2=\"110\" stroke=\"#4a5866\" stroke-width=\"2\" stroke-dasharray=\"4 4\"/><polygon points=\"252,110 304,110 226,45\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\" stroke-linejoin=\"round\"/><line x1=\"226\" y1=\"45\" x2=\"226\" y2=\"110\" stroke=\"#b23a2a\" stroke-width=\"2.5\" stroke-dasharray=\"6 4\"/><polyline points=\"236,110 236,100 226,100\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"220\" y=\"85\" font-family=\"Arial\" font-size=\"14\" fill=\"#b23a2a\" font-weight=\"700\" text-anchor=\"end\">h = 5<\/text><text x=\"278\" y=\"132\" font-family=\"Arial\" font-size=\"14\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">b = 4<\/text><text x=\"262\" y=\"154.3\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\">height outside<\/text><\/svg>","idea":"<p><b>Area<\/b> = the amount of flat space inside a shape. The <b>base<\/b> is the side you pick as the bottom (blue).<\/p><p>The <b>height<\/b> is the straight-up distance from the base to the top corner (red dashes). It meets the base at 90°, shown by the little square. In a wide triangle the height can fall outside it (right).<\/p>","formulas":[{"f":"A = ½ × b × h","say":"b = the base, h = the height at 90° to that base. Any side can be the base, but then use the height that belongs to it."},{"f":"same base + same height → same area","say":"Two triangles on the same base, with tops on the same parallel line, have equal area, however slanted."},{"f":"perimeter = a + b + c","say":"<b>Perimeter<\/b> = the distance all the way round the edge. Just add the three sides."}],"ex":{"q":"Left picture: base 10, height 7. Find the area.","steps":["A = ½ × 10 × 7","= ½ × 70 = <b>35<\/b> ✅"]},"ex2":{"q":"Right picture: base 4, height 5 (the height falls outside). Find the area.","steps":["A = ½ × 4 × 5 = ½ × 20 = <b>10<\/b> ✅"]},"tip":"⚠️ A slanted side is never the height. Only in a right triangle do two sides meet at 90°, so they are a base and a height.","part":"Geometry"},{"id":"G10","title":"In a right triangle: (short side)² + (short side)² = (long side)²","svg":"<svg viewBox=\"0 0 320 238\" aria-hidden=\"true\"><polygon points=\"92,152 92,92 32,92 32,152\" fill=\"#ffffff\" stroke=\"none\"/><line x1=\"92\" y1=\"132\" x2=\"32\" y2=\"132\" stroke=\"#e3e7ea\" stroke-width=\"1.5\"/><line x1=\"72\" y1=\"152\" x2=\"72\" y2=\"92\" stroke=\"#e3e7ea\" stroke-width=\"1.5\"/><line x1=\"92\" y1=\"112\" x2=\"32\" y2=\"112\" stroke=\"#e3e7ea\" stroke-width=\"1.5\"/><line x1=\"52\" y1=\"152\" x2=\"52\" y2=\"92\" stroke=\"#e3e7ea\" stroke-width=\"1.5\"/><polygon points=\"92,152 92,92 32,92 32,152\" fill=\"none\" stroke=\"#2e7a57\" stroke-width=\"2.5\"/><polygon points=\"172,152 92,152 92,232 172,232\" fill=\"#ffffff\" stroke=\"none\"/><line x1=\"152\" y1=\"152\" x2=\"152\" y2=\"232\" stroke=\"#e3e7ea\" stroke-width=\"1.5\"/><line x1=\"172\" y1=\"172\" x2=\"92\" y2=\"172\" stroke=\"#e3e7ea\" stroke-width=\"1.5\"/><line x1=\"132\" y1=\"152\" x2=\"132\" y2=\"232\" stroke=\"#e3e7ea\" stroke-width=\"1.5\"/><line x1=\"172\" y1=\"192\" x2=\"92\" y2=\"192\" stroke=\"#e3e7ea\" stroke-width=\"1.5\"/><line x1=\"112\" y1=\"152\" x2=\"112\" y2=\"232\" stroke=\"#e3e7ea\" stroke-width=\"1.5\"/><line x1=\"172\" y1=\"212\" x2=\"92\" y2=\"212\" stroke=\"#e3e7ea\" stroke-width=\"1.5\"/><polygon points=\"172,152 92,152 92,232 172,232\" fill=\"none\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><polygon points=\"92,92 172,152 232,72 152,12\" fill=\"#ffffff\" stroke=\"none\"/><line x1=\"108\" y1=\"104\" x2=\"168\" y2=\"24\" stroke=\"#e3e7ea\" stroke-width=\"1.5\"/><line x1=\"104\" y1=\"76\" x2=\"184\" y2=\"136\" stroke=\"#e3e7ea\" stroke-width=\"1.5\"/><line x1=\"124\" y1=\"116\" x2=\"184\" y2=\"36\" stroke=\"#e3e7ea\" stroke-width=\"1.5\"/><line x1=\"116\" y1=\"60\" x2=\"196\" y2=\"120\" stroke=\"#e3e7ea\" stroke-width=\"1.5\"/><line x1=\"140\" y1=\"128\" x2=\"200\" y2=\"48\" stroke=\"#e3e7ea\" stroke-width=\"1.5\"/><line x1=\"128\" y1=\"44\" x2=\"208\" y2=\"104\" stroke=\"#e3e7ea\" stroke-width=\"1.5\"/><line x1=\"156\" y1=\"140\" x2=\"216\" y2=\"60\" stroke=\"#e3e7ea\" stroke-width=\"1.5\"/><line x1=\"140\" y1=\"28\" x2=\"220\" y2=\"88\" stroke=\"#e3e7ea\" stroke-width=\"1.5\"/><polygon points=\"92,92 172,152 232,72 152,12\" fill=\"none\" stroke=\"#b23a2a\" stroke-width=\"2.5\"/><polygon points=\"92,152 172,152 92,92\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\" stroke-linejoin=\"round\"/><polyline points=\"103,152 103,141 92,141\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><rect x=\"34\" y=\"112\" width=\"56\" height=\"20\" rx=\"4\" fill=\"#ffffff\"/><text x=\"62\" y=\"127.4\" font-family=\"Arial\" font-size=\"15\" fill=\"#2e7a57\" font-weight=\"700\" text-anchor=\"middle\">3² = 9<\/text><rect x=\"99.5\" y=\"182\" width=\"65\" height=\"20\" rx=\"4\" fill=\"#ffffff\"/><text x=\"132\" y=\"197.4\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">4² = 16<\/text><rect x=\"129.5\" y=\"72\" width=\"65\" height=\"20\" rx=\"4\" fill=\"#ffffff\"/><text x=\"162\" y=\"87.4\" font-family=\"Arial\" font-size=\"15\" fill=\"#b23a2a\" font-weight=\"700\" text-anchor=\"middle\">5² = 25<\/text><text x=\"313\" y=\"201\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\" font-weight=\"700\" text-anchor=\"end\">9 + 16 = 25<\/text><text x=\"313\" y=\"218.3\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"end\">small + small = big<\/text><\/svg>","idea":"<p>A <b>right triangle<\/b> has one 90° corner (the little square). The two sides that make that corner are the <b>legs<\/b> (3 and 4). The long side across from it is the <b>hypotenuse<\/b> (5).<\/p><p>Build a square on each side. The two small squares (9 and 16 little boxes) together fill the big square (25 boxes).<\/p>","formulas":[{"f":"a² + b² = c²","say":"a and b = the two legs; c = the hypotenuse, always the longest side. Works only in a right triangle. (The distance formula in coordinate geometry is this same rule.)"},{"f":"c² &lt; a² + b² → acute<br>c² = a² + b² → right<br>c² &gt; a² + b² → obtuse","say":"For any 3 sides: let c be the longest, then compare c² with a² + b². This tells you the kind of the biggest angle, the one facing c; the other two angles are always acute."}],"ex":{"q":"In the picture the legs are 3 and 4. Find the hypotenuse c.","steps":["3² + 4² = 9 + 16 = 25","c² = 25, so c = √25 = <b>5<\/b> ✅","Going back: hypotenuse 5, one leg 3 → other leg = √(25 − 9) = √16 = 4. Subtract here, do not add!"]},"ex2":{"q":"Sides 6, 8, 10 and sides 6, 8, 11: what kind of triangle is each?","steps":["Short sides: 6² + 8² = 36 + 64 = 100","10² = 100, equal → <b>right<\/b> triangle","11² = 121, more than 100 → <b>obtuse<\/b> triangle ✅"]},"tip":"💡 Learn these right-triangle sets by heart: 3-4-5, 6-8-10, 5-12-13 (25 + 144 = 169), 8-15-17.","part":"Geometry"},{"id":"G11","title":"Half a square: the 45-45-90 triangle. Its sides are 1 : 1 : √2.","svg":"<svg viewBox=\"0 0 320 184\" aria-hidden=\"true\"><g transform=\"translate(0,-28)\"><polygon points=\"60,50 190,50 190,180\" fill=\"none\" stroke=\"#4a5866\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/><polygon points=\"60,50 60,180 190,180\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\"/><polyline points=\"60,167 73,167 73,180\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><line x1=\"66\" y1=\"115\" x2=\"54\" y2=\"115\" stroke=\"#1b2430\" stroke-width=\"2\"/><line x1=\"125\" y1=\"174\" x2=\"125\" y2=\"186\" stroke=\"#1b2430\" stroke-width=\"2\"/><path d=\"M60 76 A26 26 0 0 0 78.4 68.4\" fill=\"none\" stroke=\"#9c6510\" stroke-width=\"2.5\"/><path d=\"M171.6 161.6 A26 26 0 0 0 164 180\" fill=\"none\" stroke=\"#9c6510\" stroke-width=\"2.5\"/><text x=\"64\" y=\"87\" font-family=\"Arial\" font-size=\"13\" fill=\"#9c6510\" font-weight=\"700\">45°<\/text><text x=\"140\" y=\"172\" font-family=\"Arial\" font-size=\"13\" fill=\"#9c6510\" font-weight=\"700\">45°<\/text><text x=\"40\" y=\"121\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\">5<\/text><text x=\"121\" y=\"202\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\">5<\/text><text x=\"128\" y=\"98\" font-family=\"Arial\" font-size=\"15\" fill=\"#b23a2a\" font-weight=\"700\">5√2<\/text><text x=\"208\" y=\"60\" font-family=\"Arial\" font-size=\"16\" fill=\"#1b2430\" font-weight=\"700\">1 : 1 : √2<\/text><text x=\"208\" y=\"82\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">leg : leg : long side<\/text><text x=\"208\" y=\"120\" font-family=\"Arial\" font-size=\"14\" fill=\"#b23a2a\" font-weight=\"700\">5√2 ≈ 7.07<\/text><text x=\"208\" y=\"138\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">(5 × 1.414)<\/text><text x=\"208\" y=\"172\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">dashed = the other<\/text><text x=\"208\" y=\"187\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">half of the square<\/text><\/g><\/svg>","idea":"<p>Cut a <b>square<\/b> along its <b>diagonal<\/b> (the line from one corner to the opposite corner). You get two copies of this triangle.<\/p><p>It has one 90° corner and two 45° corners. The two <b>legs<\/b> (blue, they make the 90° corner) are equal.<\/p><p>The red side is the <b>hypotenuse<\/b> (the long side). It is always leg × √2, and √2 ≈ 1.41.<\/p>","formulas":[{"f":"leg : leg : hypotenuse = 1 : 1 : √2","say":"The two legs are the same length. The hypotenuse (across from the 90° corner) is √2 times one leg."},{"f":"hypotenuse = leg × √2  ·  leg = hypotenuse ÷ √2","say":"Going up from a leg to the long side: multiply by √2. Going down from the long side to a leg: divide by √2."},{"f":"diagonal of a square = s√2","say":"s = the side of the square. The diagonal is the hypotenuse of this half-square triangle."}],"ex":{"q":"Each leg is 5, like in the picture. Find the hypotenuse and the area.","steps":["Hypotenuse = leg × √2 = 5√2","5√2 ≈ 5 × 1.414 ≈ 7.07","Area = ½ × base × height = ½ × 5 × 5 = 12.5","<b>hypotenuse 5√2 ≈ 7.07, area 12.5<\/b> ✅"]},"ex2":{"q":"The hypotenuse is 10. How long is each leg?","steps":["We go down from the long side, so divide: leg = 10 ÷ √2","10 ÷ √2 = 10√2 ÷ 2 = 5√2 (multiply top and bottom by √2)","<b>leg = 5√2 ≈ 7.07<\/b> ✅ (not 10√2 ≈ 14.14)"]},"tip":"⚠️ Up to the hypotenuse: × √2. Down to a leg: ÷ √2. The hypotenuse is always the longest side.","part":"Geometry"},{"id":"G12","title":"Half an equilateral triangle: the 30-60-90 triangle. Its sides are 1 : √3 : 2.","svg":"<svg viewBox=\"0 0 320 222\" aria-hidden=\"true\"><polygon points=\"30,190 190,190 110,51.4\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"3\"/><polygon points=\"110,190 190,190 110,51.4\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"110\" y1=\"51.4\" x2=\"110\" y2=\"190\" stroke=\"#2e7a57\" stroke-width=\"3\" stroke-dasharray=\"7 5\"/><polyline points=\"110,177 123,177 123,190\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><line x1=\"64.8\" y1=\"117.7\" x2=\"75.2\" y2=\"123.7\" stroke=\"#1b2430\" stroke-width=\"2\"/><line x1=\"155.2\" y1=\"117.7\" x2=\"144.8\" y2=\"123.7\" stroke=\"#1b2430\" stroke-width=\"2\"/><line x1=\"67.5\" y1=\"184\" x2=\"67.5\" y2=\"196\" stroke=\"#1b2430\" stroke-width=\"2\"/><line x1=\"72.5\" y1=\"184\" x2=\"72.5\" y2=\"196\" stroke=\"#1b2430\" stroke-width=\"2\"/><line x1=\"147.5\" y1=\"184\" x2=\"147.5\" y2=\"196\" stroke=\"#1b2430\" stroke-width=\"2\"/><line x1=\"152.5\" y1=\"184\" x2=\"152.5\" y2=\"196\" stroke=\"#1b2430\" stroke-width=\"2\"/><path d=\"M178 169.2 A24 24 0 0 0 166 190\" fill=\"none\" stroke=\"#9c6510\" stroke-width=\"2.5\"/><path d=\"M110 73.4 A22 22 0 0 0 121 70.5\" fill=\"none\" stroke=\"#9c6510\" stroke-width=\"2.5\"/><text x=\"138\" y=\"184\" font-family=\"Arial\" font-size=\"13\" fill=\"#9c6510\" font-weight=\"700\">60°<\/text><text x=\"113\" y=\"112\" font-family=\"Arial\" font-size=\"12\" fill=\"#9c6510\" font-weight=\"700\">30°<\/text><text x=\"52\" y=\"113\" font-family=\"Arial\" font-size=\"15\" fill=\"#1b2430\" font-weight=\"700\">8<\/text><text x=\"162\" y=\"113\" font-family=\"Arial\" font-size=\"15\" fill=\"#b23a2a\" font-weight=\"700\">8<\/text><text x=\"66\" y=\"212\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\">4<\/text><text x=\"146\" y=\"212\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\">4<\/text><text x=\"70\" y=\"158\" font-family=\"Arial\" font-size=\"15\" fill=\"#2e7a57\" font-weight=\"700\">4√3<\/text><text x=\"206\" y=\"56\" font-family=\"Arial\" font-size=\"16\" fill=\"#1b2430\" font-weight=\"700\">1 : √3 : 2<\/text><text x=\"206\" y=\"76\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">short : long : hyp<\/text><text x=\"206\" y=\"110\" font-family=\"Arial\" font-size=\"13\" fill=\"#1e6f9f\" font-weight=\"700\">short leg = 4<\/text><text x=\"206\" y=\"130\" font-family=\"Arial\" font-size=\"13\" fill=\"#2e7a57\" font-weight=\"700\">long leg = 4√3<\/text><text x=\"206\" y=\"146\" font-family=\"Arial\" font-size=\"13\" fill=\"#2e7a57\" font-weight=\"700\">≈ 6.93<\/text><text x=\"206\" y=\"166\" font-family=\"Arial\" font-size=\"13\" fill=\"#b23a2a\" font-weight=\"700\">hypotenuse = 8<\/text><\/svg>","idea":"<p>An <b>equilateral triangle<\/b> has 3 equal sides (here 8) and three 60° angles.<\/p><p>The dashed green <b>height<\/b> (straight down from the top, at 90° to the base) cuts it into two halves.<\/p><p>Each half (the shaded one) is a 30-60-90 triangle. Its <b>short leg<\/b> faces the 30° angle and is half of 8, so 4.<\/p><p>The <b>hypotenuse<\/b> (red, across from 90°) is twice the short leg.<\/p>","formulas":[{"f":"short : long : hypotenuse = 1 : √3 : 2","say":"Short leg = across from 30°. Long leg = across from 60°; it is short × √3 (√3 ≈ 1.73). Hypotenuse = short × 2."},{"f":"height of an equilateral triangle = s√3 ÷ 2","say":"s = one side. The height is the long leg of the half-triangle, so it is a bit shorter than s."},{"f":"Area of an equilateral triangle: A = (√3 ÷ 4) × s²","say":"s = one side. It is ½ × base × height with base s and height s√3 ÷ 2. Note √3 ÷ 4 ≈ 0.433."}],"ex":{"q":"The short leg is 4, like in the picture. Find the long leg and the hypotenuse.","steps":["Long leg = 4 × √3 = 4√3 ≈ 6.93","Hypotenuse = 4 × 2 = 8","<b>long leg 4√3 ≈ 6.93, hypotenuse 8<\/b> ✅"]},"ex2":{"q":"Find the area of the whole equilateral triangle with side 8.","steps":["A = (√3 ÷ 4) × 8² = (√3 ÷ 4) × 64 = 16√3","Check with ½ × base × height: ½ × 8 × 4√3 = 16√3","<b>16√3 ≈ 27.71<\/b> ✅"]},"tip":"⚠️ √3 goes with the middle side, never with the hypotenuse. The hypotenuse is simply 2 × the short leg.","part":"Geometry"},{"id":"G13","title":"Join the middles of two sides: you get half the third side. Medians meet at the centroid.","svg":"<svg viewBox=\"0 0 320 176\" aria-hidden=\"true\"><g transform=\"translate(0,-62)\"><polygon points=\"12,170 152,170 57,80\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"34.5\" y1=\"125\" x2=\"104.5\" y2=\"125\" stroke=\"#2e7a57\" stroke-width=\"3\"/><line x1=\"17.9\" y1=\"144.8\" x2=\"28.6\" y2=\"150.2\" stroke=\"#1b2430\" stroke-width=\"2\"/><line x1=\"40.4\" y1=\"99.8\" x2=\"51.1\" y2=\"105.2\" stroke=\"#1b2430\" stroke-width=\"2\"/><line x1=\"125.9\" y1=\"153.6\" x2=\"134.2\" y2=\"144.9\" stroke=\"#1b2430\" stroke-width=\"2\"/><line x1=\"122.3\" y1=\"150.1\" x2=\"130.6\" y2=\"141.4\" stroke=\"#1b2430\" stroke-width=\"2\"/><line x1=\"78.4\" y1=\"108.6\" x2=\"86.7\" y2=\"99.9\" stroke=\"#1b2430\" stroke-width=\"2\"/><line x1=\"74.8\" y1=\"105.1\" x2=\"83.1\" y2=\"96.4\" stroke=\"#1b2430\" stroke-width=\"2\"/><polyline points=\"65.5,130 72.5,125 65.5,120\" fill=\"none\" stroke=\"#2e7a57\" stroke-width=\"2\"/><polyline points=\"78,175 85,170 78,165\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><circle cx=\"34.5\" cy=\"125\" r=\"3.5\" fill=\"#1b2430\"/><circle cx=\"104.5\" cy=\"125\" r=\"3.5\" fill=\"#1b2430\"/><text x=\"50\" y=\"118\" font-family=\"Arial\" font-size=\"15\" fill=\"#2e7a57\" font-weight=\"700\">7<\/text><text x=\"72\" y=\"192\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\">14<\/text><text x=\"12\" y=\"214\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">midsegment = ½ × 14<\/text><polygon points=\"180,170 300,170 222,90\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"180\" y1=\"170\" x2=\"261\" y2=\"130\" stroke=\"#4a5866\" stroke-width=\"2\"/><line x1=\"300\" y1=\"170\" x2=\"201\" y2=\"130\" stroke=\"#4a5866\" stroke-width=\"2\"/><line x1=\"222\" y1=\"90\" x2=\"234\" y2=\"143.3\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><line x1=\"234\" y1=\"143.3\" x2=\"240\" y2=\"170\" stroke=\"#b23a2a\" stroke-width=\"3\"/><circle cx=\"240\" cy=\"170\" r=\"3.5\" fill=\"#1b2430\"/><circle cx=\"261\" cy=\"130\" r=\"3.5\" fill=\"#1b2430\"/><circle cx=\"201\" cy=\"130\" r=\"3.5\" fill=\"#1b2430\"/><circle cx=\"234\" cy=\"143.3\" r=\"5\" fill=\"#9c6510\"/><text x=\"231\" y=\"128\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\">2<\/text><text x=\"245\" y=\"165\" font-family=\"Arial\" font-size=\"15\" fill=\"#b23a2a\" font-weight=\"700\">1<\/text><text x=\"182\" y=\"214\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">medians meet at the<\/text><text x=\"182\" y=\"229\" font-family=\"Arial\" font-size=\"12\" fill=\"#9c6510\" font-weight=\"700\">centroid<\/text><text x=\"232\" y=\"229\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">(dot)<\/text><\/g><\/svg>","idea":"<p>The <b>midpoint<\/b> of a side is its exact middle (the tick marks show equal halves).<\/p><p>The <b>midsegment<\/b> (green, left) joins two midpoints. It is <b>parallel<\/b> to the third side (same direction, the arrows) and half as long.<\/p><p>A <b>median<\/b> runs from a corner to the midpoint of the opposite side. All three medians meet at one point, the <b>centroid<\/b>.<\/p>","formulas":[{"f":"midsegment m = ½(b₁ + b₂)","say":"For a trapezoid, b₁ and b₂ are the two parallel sides. A triangle is like a trapezoid with b₂ = 0, so m = ½ × the third side."},{"f":"corner to centroid : centroid to midpoint = 2 : 1","say":"The centroid cuts every median into 3 equal parts. The long piece (2 parts, blue) touches the corner; the short piece (1 part, red) touches the midpoint."}],"ex":{"q":"In the left picture the bottom side is 14. How long is the midsegment?","steps":["A triangle has no top side, so b₂ = 0: m = ½(14 + 0)","<b>m = 7<\/b> ✅","Same rule for a trapezoid with parallel sides 14 and 6: m = ½(14 + 6) = 10"]},"ex2":{"q":"A median is 9 long. How far is the centroid from the corner?","steps":["Cut the median into 3 equal parts: 9 ÷ 3 = 3","Corner to centroid is 2 parts: 2 × 3 = 6","<b>6 from the corner, 3 from the midpoint<\/b> ✅"]},"tip":"⚠️ The midsegment is half of the side it does NOT touch. In 2 : 1, the 2 is always the piece at the corner.","part":"Geometry"},{"id":"G14","title":"Rectangle: area = length × width. Its diagonal comes from Pythagoras.","svg":"<svg viewBox=\"0 0 320 186\" aria-hidden=\"true\"><rect x=\"36\" y=\"30\" width=\"160\" height=\"120\" fill=\"#eef5fa\"/><g stroke=\"#c9d6e0\" stroke-width=\"1\"><line x1=\"56\" y1=\"30\" x2=\"56\" y2=\"150\"/><line x1=\"76\" y1=\"30\" x2=\"76\" y2=\"150\"/><line x1=\"96\" y1=\"30\" x2=\"96\" y2=\"150\"/><line x1=\"116\" y1=\"30\" x2=\"116\" y2=\"150\"/><line x1=\"136\" y1=\"30\" x2=\"136\" y2=\"150\"/><line x1=\"156\" y1=\"30\" x2=\"156\" y2=\"150\"/><line x1=\"176\" y1=\"30\" x2=\"176\" y2=\"150\"/><line x1=\"36\" y1=\"50\" x2=\"196\" y2=\"50\"/><line x1=\"36\" y1=\"70\" x2=\"196\" y2=\"70\"/><line x1=\"36\" y1=\"90\" x2=\"196\" y2=\"90\"/><line x1=\"36\" y1=\"110\" x2=\"196\" y2=\"110\"/><line x1=\"36\" y1=\"130\" x2=\"196\" y2=\"130\"/><\/g><rect x=\"36\" y=\"30\" width=\"160\" height=\"120\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"36\" y1=\"150\" x2=\"196\" y2=\"30\" stroke=\"#b23a2a\" stroke-width=\"3\"/><polyline points=\"196,137 183,137 183,150\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"98\" y=\"87\" font-family=\"Arial\" font-size=\"14\" fill=\"#b23a2a\" font-weight=\"700\">10<\/text><text x=\"111\" y=\"172\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\">8<\/text><text x=\"18\" y=\"95\" font-family=\"Arial\" font-size=\"15\" fill=\"#2e7a57\" font-weight=\"700\">6<\/text><text x=\"210\" y=\"52\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">area = 8 × 6<\/text><text x=\"210\" y=\"67\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">= 48 squares<\/text><text x=\"210\" y=\"98\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">perimeter =<\/text><text x=\"210\" y=\"113\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">8 + 6 + 8 + 6 = 28<\/text><text x=\"210\" y=\"144\" font-family=\"Arial\" font-size=\"13\" fill=\"#b23a2a\" font-weight=\"700\">diagonal = 10<\/text><\/svg>","idea":"<p>A <b>rectangle<\/b> has 4 right angles (90° corners), and opposite sides are equal. A <b>square<\/b> is a rectangle with all 4 sides equal.<\/p><p><b>Area<\/b> = how many 1 × 1 squares fit inside. In the picture, 8 × 6 = 48 little squares.<\/p><p><b>Perimeter<\/b> = the distance all the way around. The red <b>diagonal<\/b> joins opposite corners.<\/p>","formulas":[{"f":"A = l × w     P = 2(l + w)","say":"l = length (long side), w = width (short side). Area counts the squares inside; perimeter adds all 4 sides."},{"f":"Square: A = s²     P = 4s     d = s√2","say":"s = one side, d = the diagonal. The diagonal is s × √2 (about 1.41 × s), never 2s."},{"f":"Diagonal of a rectangle: d = √(l² + w²)","say":"The diagonal cuts the rectangle into two right triangles. It is their hypotenuse, so use Pythagoras."}],"ex":{"q":"The rectangle in the picture is 8 by 6. Find its area, perimeter and diagonal.","steps":["A = 8 × 6 = 48","P = 2(8 + 6) = 2 × 14 = 28","d = √(8² + 6²) = √(64 + 36) = √100 = 10","<b>area 48, perimeter 28, diagonal 10<\/b> ✅"]},"ex2":{"q":"A square has side 6. Find its area, perimeter and diagonal.","steps":["A = 6² = 36","P = 4 × 6 = 24","d = 6√2 ≈ 6 × 1.414 ≈ 8.49","<b>area 36, perimeter 24, diagonal 6√2 ≈ 8.49<\/b> ✅"]},"tip":"⚠️ Same perimeter does not mean same area: 12 × 5 and 9 × 8 both have P = 34, but areas 60 and 72.","part":"Geometry"},{"id":"G15","title":"Parallelogram: area = base × height (the straight-up height, not the slanted side).","svg":"<svg viewBox=\"0 0 320 146\" aria-hidden=\"true\"><g transform=\"translate(0,-60)\"><polygon points=\"18,150 138,150 174,102 54,102\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"54\" y1=\"102\" x2=\"54\" y2=\"150\" stroke=\"#9c6510\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/><polyline points=\"54,137 67,137 67,150\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><polyline points=\"74,155 81,150 74,145\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><polyline points=\"110,107 117,102 110,97\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"70\" y=\"172\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\">10<\/text><text x=\"18\" y=\"122\" font-family=\"Arial\" font-size=\"15\" fill=\"#1b2430\" font-weight=\"700\">5<\/text><text x=\"60\" y=\"124\" font-family=\"Arial\" font-size=\"15\" fill=\"#9c6510\" font-weight=\"700\">4<\/text><text x=\"18\" y=\"196\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">height 4, not the slant 5<\/text><polygon points=\"204,110 252,74 300,110 252,146\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"204\" y1=\"110\" x2=\"300\" y2=\"110\" stroke=\"#1e6f9f\" stroke-width=\"2.5\" stroke-dasharray=\"6 4\"/><line x1=\"252\" y1=\"74\" x2=\"252\" y2=\"146\" stroke=\"#2e7a57\" stroke-width=\"2.5\" stroke-dasharray=\"6 4\"/><polyline points=\"262,110 262,100 252,100\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><line x1=\"224.4\" y1=\"87.2\" x2=\"231.6\" y2=\"96.8\" stroke=\"#1b2430\" stroke-width=\"2\"/><line x1=\"279.6\" y1=\"87.2\" x2=\"272.4\" y2=\"96.8\" stroke=\"#1b2430\" stroke-width=\"2\"/><line x1=\"279.6\" y1=\"132.8\" x2=\"272.4\" y2=\"123.2\" stroke=\"#1b2430\" stroke-width=\"2\"/><line x1=\"224.4\" y1=\"132.8\" x2=\"231.6\" y2=\"123.2\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"257\" y=\"127\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\">8<\/text><text x=\"240\" y=\"99\" font-family=\"Arial\" font-size=\"15\" fill=\"#2e7a57\" font-weight=\"700\">6<\/text><text x=\"281\" y=\"84\" font-family=\"Arial\" font-size=\"15\" fill=\"#1b2430\" font-weight=\"700\">5<\/text><text x=\"206\" y=\"172\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">rhombus:<\/text><text x=\"206\" y=\"187\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">4 equal sides<\/text><\/g><\/svg>","idea":"<p>A <b>parallelogram<\/b> is a rectangle pushed over. Opposite sides are <b>parallel<\/b> (same direction, the arrows) and equal.<\/p><p>The <b>height<\/b> (dashed amber) is the straight-up gap between top and bottom, at 90°.<\/p><p>A <b>rhombus<\/b> (right) is a parallelogram with 4 equal sides. Its two <b>diagonals<\/b> (dashed, corner to corner) cross at 90°.<\/p>","formulas":[{"f":"A = b × h","say":"b = base (the bottom side), h = height (straight up, at 90° to the base). Never use the slanted side as h."},{"f":"P = 2(a + b)   ·   rhombus: P = 4a","say":"a and b = the two different side lengths. A rhombus has all four sides equal to a, so P = 4a."},{"f":"Rhombus: A = ½ × d₁ × d₂","say":"d₁ and d₂ = the two diagonals. This works only when they cross at 90°: rhombus, square or kite."}],"ex":{"q":"The parallelogram in the picture: base 10, slanted side 5, height 4. Find its area and perimeter.","steps":["A = base × height = 10 × 4 = 40 (not 10 × 5 = 50)","P = 2(10 + 5) = 2 × 15 = 30","<b>area 40, perimeter 30<\/b> ✅"]},"ex2":{"q":"The rhombus in the picture has diagonals 8 and 6. Find its area and its side.","steps":["A = ½ × 8 × 6 = 24","The diagonals cut each other in half: 4 and 3. A side is the hypotenuse: √(4² + 3²) = √25 = 5","<b>area 24, side 5<\/b> (perimeter 4 × 5 = 20) ✅"]},"tip":"⚠️ The slanted side is always longer than the height. Using it as the height makes the area too big.","part":"Geometry"},{"id":"G16","title":"Trapezoid: area = the average of the two parallel sides × the height.","svg":"<svg viewBox=\"0 0 320 144\" aria-hidden=\"true\"><g transform=\"translate(0,-60)\"><polygon points=\"40,170 280,170 220,90 100,90\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"70\" y1=\"130\" x2=\"250\" y2=\"130\" stroke=\"#2e7a57\" stroke-width=\"2.5\" stroke-dasharray=\"7 5\"/><line x1=\"100\" y1=\"90\" x2=\"100\" y2=\"170\" stroke=\"#9c6510\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/><polyline points=\"100,157 113,157 113,170\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><polyline points=\"180,95 187,90 180,85\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><polyline points=\"204,175 211,170 204,165\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><text x=\"155\" y=\"82\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\">6<\/text><text x=\"151\" y=\"194\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\">12<\/text><text x=\"46\" y=\"124\" font-family=\"Arial\" font-size=\"15\" fill=\"#1b2430\" font-weight=\"700\">5<\/text><text x=\"264\" y=\"124\" font-family=\"Arial\" font-size=\"15\" fill=\"#1b2430\" font-weight=\"700\">5<\/text><text x=\"86\" y=\"155\" font-family=\"Arial\" font-size=\"15\" fill=\"#9c6510\" font-weight=\"700\">4<\/text><text x=\"118\" y=\"123\" font-family=\"Arial\" font-size=\"13\" fill=\"#2e7a57\" font-weight=\"700\">average = 9<\/text><\/g><\/svg>","idea":"<p>A <b>trapezoid<\/b> has exactly one pair of <b>parallel<\/b> sides (the arrows). They are called the <b>bases<\/b>: here 12 and 6.<\/p><p>The two slanted sides are the <b>legs<\/b>. The <b>height<\/b> (dashed amber) is the straight-up gap between the bases.<\/p><p>The green dashed line is the average width: (12 + 6) ÷ 2 = 9.<\/p>","formulas":[{"f":"A = ½(b₁ + b₂) × h","say":"b₁ and b₂ = the two parallel sides, h = the height between them. It holds as much as a rectangle 9 wide and 4 tall."},{"f":"P = b₁ + b₂ + leg + leg","say":"Perimeter = add all four sides. If a leg is missing, find it with Pythagoras."}],"ex":{"q":"Bases 12 and 6, height 4, like in the picture. Find the area.","steps":["Add the bases: 12 + 6 = 18","Take half: 18 ÷ 2 = 9 (the average width)","Times the height: 9 × 4 = <b>36<\/b> ✅"]},"ex2":{"q":"The two legs are equal. Find the perimeter.","steps":["Each end sticks out (12 − 6) ÷ 2 = 3","Leg = √(3² + 4²) = √(9 + 16) = √25 = 5","P = 12 + 6 + 5 + 5 = <b>28<\/b> ✅"]},"tip":"⚠️ Only the two parallel sides go inside the bracket. The leg (5) is not the height (4).","part":"Geometry"},{"id":"G17","title":"A shape with n sides: inside angles add to (n − 2) × 180°. Outside turns add to 360°.","svg":"<svg viewBox=\"0 0 320 206\" aria-hidden=\"true\"><polygon points=\"82,34 139.2,67 139.2,133 82,166 24.8,133 24.8,67\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"82\" y1=\"34\" x2=\"139.2\" y2=\"133\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><line x1=\"82\" y1=\"34\" x2=\"82\" y2=\"166\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><line x1=\"82\" y1=\"34\" x2=\"24.8\" y2=\"133\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/><text x=\"120.1\" y=\"83\" font-family=\"Arial\" font-size=\"14\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">1<\/text><text x=\"101.1\" y=\"116\" font-family=\"Arial\" font-size=\"14\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">2<\/text><text x=\"62.9\" y=\"116\" font-family=\"Arial\" font-size=\"14\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">3<\/text><text x=\"43.9\" y=\"83\" font-family=\"Arial\" font-size=\"14\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">4<\/text><text x=\"82\" y=\"194\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\">4 triangles × 180° = 720°<\/text><polygon points=\"240,54 281.8,84.4 265.9,133.6 214.1,133.6 198.2,84.4\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"240\" y1=\"54\" x2=\"261\" y2=\"38.7\" stroke=\"#4a5866\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/><path d=\"M252.1 45.2 A15 15 0 0 1 252.1 62.8\" fill=\"none\" stroke=\"#9c6510\" stroke-width=\"2.5\"/><line x1=\"281.8\" y1=\"84.4\" x2=\"302.9\" y2=\"99.7\" stroke=\"#4a5866\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/><path d=\"M294 93.2 A15 15 0 0 1 277.2 98.7\" fill=\"none\" stroke=\"#9c6510\" stroke-width=\"2.5\"/><line x1=\"265.9\" y1=\"133.6\" x2=\"257.8\" y2=\"158.3\" stroke=\"#4a5866\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/><path d=\"M261.2 147.9 A15 15 0 0 1 250.9 133.6\" fill=\"none\" stroke=\"#9c6510\" stroke-width=\"2.5\"/><line x1=\"214.1\" y1=\"133.6\" x2=\"188.1\" y2=\"133.6\" stroke=\"#4a5866\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/><path d=\"M199.1 133.6 A15 15 0 0 1 209.5 119.3\" fill=\"none\" stroke=\"#9c6510\" stroke-width=\"2.5\"/><line x1=\"198.2\" y1=\"84.4\" x2=\"190.1\" y2=\"59.7\" stroke=\"#4a5866\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/><path d=\"M193.5 70.1 A15 15 0 0 1 210.3 75.6\" fill=\"none\" stroke=\"#9c6510\" stroke-width=\"2.5\"/><text x=\"259\" y=\"58\" font-family=\"Arial\" font-size=\"13\" fill=\"#9c6510\" font-weight=\"700\">72°<\/text><text x=\"240\" y=\"194\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\">5 turns × 72° = 360°<\/text><\/svg>","idea":"<p>A <b>polygon<\/b> is a flat shape with straight sides; n = the number of sides (pentagon 5, hexagon 6, octagon 8).<\/p><p>Draw lines from one corner (blue): a hexagon breaks into 4 triangles of 180° each.<\/p><p>An <b>exterior angle<\/b> (amber) is the turn you make at a corner while walking around the outside.<\/p><p>A <b>regular<\/b> polygon has all sides equal and all angles equal.<\/p>","formulas":[{"f":"S = (n − 2) × 180°","say":"S = the sum of all inside angles, n = number of sides. Works for any polygon, regular or not."},{"f":"each inside angle = (n − 2) × 180° ÷ n<br>each outside angle = 360° ÷ n","say":"Only for a regular polygon (all angles equal). At each corner, inside + outside = 180°."},{"f":"sum of exterior angles = 360°","say":"True for every polygon, any n. Walk around once and you have turned exactly one full turn."},{"f":"number of diagonals D = n(n − 3) ÷ 2","say":"A <b>diagonal<\/b> joins two corners that are not next to each other. Each corner has n − 3 of them; ÷ 2 because each one is counted from both ends."}],"ex":{"q":"A regular hexagon (n = 6).","steps":["Sum of inside angles: (6 − 2) × 180° = 4 × 180° = 720°","Each inside angle: 720° ÷ 6 = 120°","Each outside angle: 360° ÷ 6 = 60° (check: 120° + 60° = 180°)","Diagonals: 6 × (6 − 3) ÷ 2 = 18 ÷ 2 = 9","<b>720°, 120°, 60°, 9 diagonals<\/b> ✅"]},"ex2":{"q":"Each outside angle of a regular polygon is 15°. How many sides? How big is each inside angle?","steps":["n = 360 ÷ 15 = 24 sides","Inside angle = 180° − 15° = 165°","<b>24 sides, 165° each<\/b> ✅"]},"tip":"⚠️ 360 ÷ n gives the OUTSIDE angle. For the inside angle use 180° minus it. An inside angle is always under 180°.","part":"Geometry"},{"id":"G18","title":"A regular hexagon is 6 equilateral triangles, so its side equals the radius.","svg":"<svg viewBox=\"0 0 320 230\" aria-hidden=\"true\"><circle cx=\"160\" cy=\"110\" r=\"90\" fill=\"none\" stroke=\"#4a5866\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><polygon points=\"250,110 205,187.9 115,187.9 70,110 115,32.1 205,32.1\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\"/><line x1=\"160\" y1=\"110\" x2=\"205\" y2=\"187.9\" stroke=\"#4a5866\" stroke-width=\"1.5\"/><line x1=\"160\" y1=\"110\" x2=\"115\" y2=\"187.9\" stroke=\"#4a5866\" stroke-width=\"1.5\"/><line x1=\"160\" y1=\"110\" x2=\"70\" y2=\"110\" stroke=\"#4a5866\" stroke-width=\"1.5\"/><line x1=\"160\" y1=\"110\" x2=\"115\" y2=\"32.1\" stroke=\"#4a5866\" stroke-width=\"1.5\"/><line x1=\"160\" y1=\"110\" x2=\"205\" y2=\"32.1\" stroke=\"#4a5866\" stroke-width=\"1.5\"/><line x1=\"160\" y1=\"110\" x2=\"250\" y2=\"110\" stroke=\"#b23a2a\" stroke-width=\"3\"/><line x1=\"205\" y1=\"187.9\" x2=\"115\" y2=\"187.9\" stroke=\"#1e6f9f\" stroke-width=\"4\"/><line x1=\"160\" y1=\"110\" x2=\"160\" y2=\"187.9\" stroke=\"#2e7a57\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/><polyline points=\"160,176.9 171,176.9 171,187.9\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2\"/><circle cx=\"160\" cy=\"110\" r=\"4\" fill=\"#1b2430\"/><text x=\"186\" y=\"102\" font-family=\"Arial\" font-size=\"14\" fill=\"#b23a2a\" font-weight=\"700\">r = 6<\/text><text x=\"166\" y=\"168\" font-family=\"Arial\" font-size=\"15\" fill=\"#2e7a57\" font-weight=\"700\">a<\/text><text x=\"160\" y=\"220\" font-family=\"Arial\" font-size=\"14\" fill=\"#1e6f9f\" font-weight=\"700\" text-anchor=\"middle\">s = 6<\/text><text x=\"8\" y=\"30\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">6 equal<\/text><text x=\"8\" y=\"45\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">equilateral<\/text><text x=\"8\" y=\"60\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">triangles<\/text><text x=\"262\" y=\"172\" font-family=\"Arial\" font-size=\"13\" fill=\"#2e7a57\" font-weight=\"700\">a ≈ 5.2<\/text><\/svg>","idea":"<p>Draw lines from the centre to every corner. A regular hexagon splits into 6 equilateral triangles.<\/p><p>The <b>radius<\/b> r (red) goes from the centre to a corner. So the side s (blue) = r = 6.<\/p><p>The <b>apothem<\/b> a (dashed green) goes from the centre to the middle of a side, at 90°. It is shorter than r.<\/p>","formulas":[{"f":"Hexagon: s = r   ·   A = (3√3 ÷ 2) × s²","say":"Only the hexagon has side = radius. Its area is 6 equilateral triangles: 6 × (√3 ÷ 4) × s²."},{"f":"apothem a = √(R² − (s ÷ 2)²)","say":"R = radius to a corner, s = one side. The apothem, half a side and R make a right triangle with R as the hypotenuse."},{"f":"Any regular polygon: A = ½ × a × P","say":"a = apothem, P = perimeter (all sides: n × s). The shape is n triangles, each ½ × s × a."}],"ex":{"q":"The regular hexagon in the picture has side 6. Find the apothem and the area.","steps":["R = s = 6, and half a side = 3","a = √(6² − 3²) = √(36 − 9) = √27 ≈ 5.196","P = 6 × 6 = 36","A = ½ × 5.196 × 36 ≈ 93.53","Check: (3√3 ÷ 2) × 6² = 54√3 ≈ 93.53","<b>a ≈ 5.20, area ≈ 93.53<\/b> ✅"]},"ex2":{"q":"Test A = ½ × a × P on a square of side 6.","steps":["Apothem = centre to the middle of a side = 6 ÷ 2 = 3","P = 4 × 6 = 24","A = ½ × 3 × 24 = <b>36<\/b>, the same as 6² ✅"]},"tip":"⚠️ Use the apothem, not the radius, in ½ × a × P. With the radius, the hexagon would wrongly give 108.","part":"Geometry"},{"id":"G19","title":"Circumference (the distance around a circle) = π × diameter.","svg":"<svg viewBox=\"0 0 320 204\" aria-hidden=\"true\"><circle cx=\"70\" cy=\"76\" r=\"45\" fill=\"#eef5fa\" stroke=\"#b23a2a\" stroke-width=\"3.5\"/><line x1=\"25\" y1=\"76\" x2=\"115\" y2=\"76\" stroke=\"#2e7a57\" stroke-width=\"3\"/><line x1=\"70\" y1=\"76\" x2=\"92.5\" y2=\"37\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><line x1=\"35.5\" y1=\"104.9\" x2=\"104.5\" y2=\"104.9\" stroke=\"#9c6510\" stroke-width=\"3\"/><circle cx=\"70\" cy=\"76\" r=\"4\" fill=\"#1b2430\"/><text x=\"98\" y=\"30\" font-family=\"Arial\" font-size=\"14\" fill=\"#1e6f9f\" font-weight=\"700\">r = 5<\/text><text x=\"122\" y=\"81\" font-family=\"Arial\" font-size=\"14\" fill=\"#2e7a57\" font-weight=\"700\">d = 10<\/text><text x=\"112\" y=\"118\" font-family=\"Arial\" font-size=\"13\" fill=\"#9c6510\" font-weight=\"700\">chord<\/text><text x=\"196\" y=\"40\" font-family=\"Arial\" font-size=\"13\" fill=\"#b23a2a\" font-weight=\"700\">red edge =<\/text><text x=\"196\" y=\"56\" font-family=\"Arial\" font-size=\"13\" fill=\"#b23a2a\" font-weight=\"700\">circumference<\/text><text x=\"196\" y=\"72\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">(the way around)<\/text><line x1=\"18\" y1=\"162\" x2=\"300.7\" y2=\"162\" stroke=\"#b23a2a\" stroke-width=\"4\"/><line x1=\"18\" y1=\"154\" x2=\"18\" y2=\"170\" stroke=\"#2e7a57\" stroke-width=\"2\"/><line x1=\"108\" y1=\"154\" x2=\"108\" y2=\"170\" stroke=\"#2e7a57\" stroke-width=\"2\"/><line x1=\"198\" y1=\"154\" x2=\"198\" y2=\"170\" stroke=\"#2e7a57\" stroke-width=\"2\"/><line x1=\"288\" y1=\"154\" x2=\"288\" y2=\"170\" stroke=\"#2e7a57\" stroke-width=\"2\"/><line x1=\"300.7\" y1=\"154\" x2=\"300.7\" y2=\"170\" stroke=\"#b23a2a\" stroke-width=\"2\"/><text x=\"63\" y=\"150\" font-family=\"Arial\" font-size=\"14\" fill=\"#2e7a57\" font-weight=\"700\" text-anchor=\"middle\">d<\/text><text x=\"153\" y=\"150\" font-family=\"Arial\" font-size=\"14\" fill=\"#2e7a57\" font-weight=\"700\" text-anchor=\"middle\">d<\/text><text x=\"243\" y=\"150\" font-family=\"Arial\" font-size=\"14\" fill=\"#2e7a57\" font-weight=\"700\" text-anchor=\"middle\">d<\/text><text x=\"160\" y=\"192\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\" text-anchor=\"middle\">unrolled: 3 diameters and a bit = π × d<\/text><\/svg>","idea":"<p>Every point on a circle is the same distance from the <b>centre<\/b> (the dot). That distance is the <b>radius<\/b> r (blue).<\/p><p>The <b>diameter<\/b> d (green) goes all the way across through the centre, so d = 2r. A <b>chord<\/b> (amber) joins any two points on the circle.<\/p><p>Unroll the red edge: it is a bit more than 3 diameters long. That number is <b>π ≈ 3.14<\/b>.<\/p>","formulas":[{"f":"d = 2r   ·   r = d ÷ 2","say":"The diameter is two radii end to end. It is the longest chord."},{"f":"C = 2πr = πd","say":"C = circumference (the distance around). Use 2πr when you know the radius, πd when you know the diameter."}],"ex":{"q":"The radius is 5, like in the picture. Find the circumference.","steps":["C = 2 × π × 5 = 10π","10π ≈ 10 × 3.1416 ≈ 31.42","<b>10π ≈ 31.42<\/b> ✅ (a wheel of radius 5 rolls this far in one turn)"]},"ex2":{"q":"A wheel has diameter 10. How far does it roll in one full turn?","steps":["You are given the diameter, so use C = πd","C = π × 10 = <b>10π ≈ 31.42<\/b> ✅","Not 2π × 10 = 20π: that puts the diameter where the radius goes."]},"tip":"💡 π ≈ 3.14 ≈ 22/7. On the GRE, leave answers like 10π unless the choices are decimals.","part":"Geometry"},{"id":"G20","title":"Area of a circle = π × radius × radius, written πr².","svg":"<svg viewBox=\"0 0 320 240\" aria-hidden=\"true\"><circle cx=\"62\" cy=\"100\" r=\"45\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\"/><rect x=\"62\" y=\"55\" width=\"45\" height=\"45\" fill=\"#f6ead2\" fill-opacity=\"0.85\" stroke=\"#9c6510\" stroke-width=\"2.5\"/><line x1=\"62\" y1=\"100\" x2=\"107\" y2=\"100\" stroke=\"#1e6f9f\" stroke-width=\"3\"/><circle cx=\"62\" cy=\"100\" r=\"4\" fill=\"#1b2430\"/><text x=\"84.5\" y=\"82.5\" font-family=\"Arial\" font-size=\"15\" fill=\"#9c6510\" font-weight=\"700\" text-anchor=\"middle\">r²<\/text><circle cx=\"222\" cy=\"118\" r=\"90\" fill=\"#eef5fa\" stroke=\"#1b2430\" stroke-width=\"3\"/><rect x=\"222\" y=\"28\" width=\"90\" height=\"90\" fill=\"#f6ead2\" fill-opacity=\"0.85\" stroke=\"#9c6510\" stroke-width=\"2.5\"/><line x1=\"222\" y1=\"118\" x2=\"312\"
