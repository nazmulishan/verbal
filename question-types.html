font-weight='700' text-anchor='middle' fill='#1e6f9f'>11\u003c/text>\u003ctext x='160' y='78' font-family='Arial' font-size='13' text-anchor='middle' fill='#4a5866'>a₃\u003c/text>\u003ccircle cx='220' cy='50' r='7' fill='#1e6f9f'/>\u003ctext x='220' y='32' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#1e6f9f'>14\u003c/text>\u003ctext x='220' y='78' font-family='Arial' font-size='13' text-anchor='middle' fill='#4a5866'>a₄\u003c/text>\u003ccircle cx='280' cy='50' r='7' fill='#1e6f9f'/>\u003ctext x='280' y='32' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#1e6f9f'>17\u003c/text>\u003ctext x='280' y='78' font-family='Arial' font-size='13' text-anchor='middle' fill='#4a5866'>a₅\u003c/text>\u003ctext x='70.0' y='55' font-family='Arial' font-size='14' font-weight='700' text-anchor='middle' fill='#9c6510'>+3\u003c/text>\u003ctext x='130.0' y='55' font-family='Arial' font-size='14' font-weight='700' text-anchor='middle' fill='#9c6510'>+3\u003c/text>\u003ctext x='190.0' y='55' font-family='Arial' font-size='14' font-weight='700' text-anchor='middle' fill='#9c6510'>+3\u003c/text>\u003ctext x='250.0' y='55' font-family='Arial' font-size='14' font-weight='700' text-anchor='middle' fill='#9c6510'>+3\u003c/text>\n\u003ctext x='160' y='102' font-family='Arial' font-size='13' text-anchor='middle' fill='#4a5866'>5 terms (blue dots), but only \u003ctspan fill='#9c6510' font-weight='700'>4 jumps of +3\u003c/tspan>\u003c/text>\n\u003c/svg>\u003cp style=\"margin:4px 0\">A \u003cb>sequence\u003c/b> is a list of numbers made by a rule. Each number is a \u003cb>term\u003c/b>.\u003c/p>\u003cul style=\"margin:4px 0;padding-left:20px\">\u003cli>\u003cb>a\u003csub>1\u003c/sub>\u003c/b> = the 1st term, \u003cb>a\u003csub>5\u003c/sub>\u003c/b> = the 5th term. The small number is the \u003cb>place\u003c/b>.\u003c/li>\u003cli>\u003cb>a\u003csub>n−1\u003c/sub>\u003c/b> = the term just \u003cb>before\u003c/b> a\u003csub>n\u003c/sub>.\u003c/li>\u003c/ul>\u003cp style=\"margin:4px 0\">\u003cb>Why only 4 jumps?\u003c/b> Like fence posts: 5 posts have 4 gaps between them. To go from the 1st term to the 5th, you jump 5 − 1 = 4 times.\u003c/p>", "rule": "Same jump d each time: a\u003csub>n\u003c/sub> = a\u003csub>1\u003c/sub> + (n − 1) × d\u003cbr>Stuck? Write the first 6–8 terms and look for the pattern.", "first": "Write the first 5 terms by hand. Ask: same jump each time? signs switching? a repeat?", "ex": {"q": "a\u003csub>1\u003c/sub> = 4. For n &gt; 1: if n is even, a\u003csub>n\u003c/sub> = a\u003csub>n−1\u003c/sub> + 3; if n is odd, a\u003csub>n\u003c/sub> = a\u003csub>n−1\u003c/sub> − 5. What is a\u003csub>9\u003c/sub>?", "steps": ["Write terms: 4, 7, 2, 5, 0 …", "Every two jumps: +3 then −5, so −2 in total.", "From a\u003csub>1\u003c/sub> to a\u003csub>9\u003c/sub> is 9 − 1 = 8 jumps = \u003cb>4 pairs\u003c/b>.", "a\u003csub>9\u003c/sub> = 4 + 4 × (−2) = 4 − 8 = \u003cb>−4\u003c/b>", "Check by writing all: 4, 7, 2, 5, 0, 3, −2, 1, \u003cb>−4\u003c/b> ✅"]}, "warn": "From the 1st term to the 10th there are \u003cb>9\u003c/b> jumps, not 10. For 5, 8, 11, …: 10th term = 5 + 9 × 3 = \u003cb>32\u003c/b>, not 35.", "tip": "Multiplying by a \u003cb>negative\u003c/b> number each time makes the signs switch: +, −, +, −. Terms in odd places share one sign, even places the other.", "page": 9, "n": 30, "hard": 25}, {"key": "absval", "name": "Absolute value (distance from 0)", "spot": "You see bars \u003cb>|x|\u003c/b>, \u003cb>|x − 3|\u003c/b>, or \u003cb>√(x²)\u003c/b>, or squares like \u003cb>a² = 49\u003c/b> where the sign is not given.", "easy": "\u003csvg viewBox='0 0 320 128' aria-hidden='true'>\n\u003cline x1='14' y1='70' x2='306' y2='70' stroke='#1b2430' stroke-width='2.5'/>\u003cline x1='28' y1='64' x2='28' y2='76' stroke='#1b2430' stroke-width='1.5'/>\u003cline x1='50' y1='61' x2='50' y2='79' stroke='#1b2430' stroke-width='2.5'/>\u003cline x1='72' y1='64' x2='72' y2='76' stroke='#1b2430' stroke-width='1.5'/>\u003cline x1='94' y1='64' x2='94' y2='76' stroke='#1b2430' stroke-width='1.5'/>\u003cline x1='116' y1='64' x2='116' y2='76' stroke='#1b2430' stroke-width='1.5'/>\u003cline x1='138' y1='64' x2='138' y2='76' stroke='#1b2430' stroke-width='1.5'/>\u003cline x1='160' y1='61' x2='160' y2='79' stroke='#1b2430' stroke-width='2.5'/>\u003cline x1='182' y1='64' x2='182' y2='76' stroke='#1b2430' stroke-width='1.5'/>\u003cline x1='204' y1='64' x2='204' y2='76' stroke='#1b2430' stroke-width='1.5'/>\u003cline x1='226' y1='64' x2='226' y2='76' stroke='#1b2430' stroke-width='1.5'/>\u003cline x1='248' y1='64' x2='248' y2='76' stroke='#1b2430' stroke-width='1.5'/>\u003cline x1='270' y1='61' x2='270' y2='79' stroke='#1b2430' stroke-width='2.5'/>\u003cline x1='292' y1='64' x2='292' y2='76' stroke='#1b2430' stroke-width='1.5'/>\u003ctext x='50' y='96' font-family='Arial' font-size='13' text-anchor='middle' fill='#1b2430'>−5\u003c/text>\u003ctext x='160' y='96' font-family='Arial' font-size='13' text-anchor='middle' fill='#1b2430'>0\u003c/text>\u003ctext x='270' y='96' font-family='Arial' font-size='13' text-anchor='middle' fill='#1b2430'>5\u003c/text>\n\u003cline x1='50' y1='44' x2='160' y2='44' stroke='#b23a2a' stroke-width='3'/>\n\u003cline x1='50' y1='38' x2='50' y2='50' stroke='#b23a2a' stroke-width='3'/>\u003cline x1='158' y1='38' x2='158' y2='50' stroke='#b23a2a' stroke-width='3'/>\n\u003cline x1='160' y1='44' x2='270' y2='44' stroke='#1e6f9f' stroke-width='3'/>\n\u003cline x1='162' y1='38' x2='162' y2='50' stroke='#1e6f9f' stroke-width='3'/>\u003cline x1='270' y1='38' x2='270' y2='50' stroke='#1e6f9f' stroke-width='3'/>\n\u003ctext x='105.0' y='30' font-family='Arial' font-size='13' font-weight='700' text-anchor='middle' fill='#b23a2a'>5 steps\u003c/text>\n\u003ctext x='215.0' y='30' font-family='Arial' font-size='13' font-weight='700' text-anchor='middle' fill='#1e6f9f'>5 steps\u003c/text>\n\u003ccircle cx='50' cy='70' r='6' fill='#b23a2a'/>\u003ccircle cx='270' cy='70' r='6' fill='#1e6f9f'/>\n\u003ctext x='50' y='120' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#b23a2a'>|−5| = 5\u003c/text>\n\u003ctext x='270' y='120' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#1e6f9f'>|5| = 5\u003c/text>\n\u003c/svg>\u003cp style=\"margin:4px 0\">\u003cb>|x|\u003c/b> = how many steps x is from 0. Steps are never negative.\u003c/p>\u003cul style=\"margin:4px 0;padding-left:20px\">\u003cli>The red dot (−5) and the blue dot (5) are both \u003cb>5 steps\u003c/b> from 0.\u003c/li>\u003cli>So |x| = 5 has \u003cb>two\u003c/b> answers: x = 5 or x = −5.\u003c/li>\u003cli>\u003cb>|x − 3| &lt; 2\u003c/b> means \"x is less than 2 steps from 3\": 1 &lt; x &lt; 5.\u003c/li>\u003c/ul>\u003cp style=\"margin:4px 0\">\u003cb>Why is √(x²) = |x|?\u003c/b> √((−3)²) = √9 = 3, not −3. A square root is never negative.\u003c/p>", "rule": "|x| = 5 → x = 5 or x = −5\u003cbr>|x − c| &lt; d → c − d &lt; x &lt; c + d\u003cbr>√(x²) = |x|", "first": "Write the \u003cb>two cases\u003c/b>: the inside is positive, or the inside is negative.", "ex": {"q": "p is the largest prime number with |p − 20| &lt; 5. What is p?", "steps": ["p is less than 5 steps from 20.", "So 20 − 5 &lt; p &lt; 20 + 5 → \u003cb>15 &lt; p &lt; 25\u003c/b>", "Primes there: 17, 19, 23. The largest is \u003cb>23\u003c/b>", "Check: |23 − 20| = 3, and 3 &lt; 5 ✅"]}, "warn": "√(y²) = 4 does \u003cb>not\u003c/b> mean y = 4. y could be −4 too: √((−4)²) = √16 = 4. So a question about the sign of y is answer D.", "tip": "An equation with squares tells you the \u003cb>size\u003c/b>, not the sign. a² = 49 → a = 7 or a = −7. Try both signs.", "page": 8, "n": 29, "hard": 20}], "rare": [{"key": "ranges", "name": "A quantity with many possible values", "hint": "list every value it can take, then compare", "page": 20, "n": 26}, {"key": "definedop", "name": "Made-up symbols (like x Δ y)", "hint": "read the rule; work inside the brackets first", "page": 9, "n": 10}, {"key": "likepow", "name": "Adding or subtracting powers", "hint": "pull out the smaller power: 2⁵ − 2⁴ = 2⁴(2 − 1)", "page": 8, "n": 10}, {"key": "maxprod", "name": "Biggest possible product", "hint": "equal parts win; help the smallest number most", "page": 20, "n": 9}, {"key": "divshrink", "name": "Dividing by a small number", "hint": "dividing by a number below 1 makes it bigger", "page": 8, "n": 9}, {"key": "dominate", "name": "Which power is bigger", "hint": "write both with the same base; bigger power wins", "page": 8, "n": 8}, {"key": "lindio", "name": "Whole-number answers to one equation", "hint": "try values from the biggest down until one fits", "page": 7, "n": 7}, {"key": "runsum", "name": "Sum of numbers in a row", "hint": "sum = how many numbers × the middle number", "page": 1, "n": 6}, {"key": "extremes", "name": "Smallest or largest fraction", "hint": "smallest fraction: smallest top, biggest bottom", "page": 20, "n": 6}, {"key": "func", "name": "Functions like f(x)", "hint": "put the number in place of every x", "page": 9, "n": 5}, {"key": "signchart", "name": "When a product is positive or negative", "hint": "find the zeros; even powers never change the sign", "page": 8, "n": 5}, {"key": "disguise", "name": "A known equation in disguise", "hint": "call the repeated piece one letter, solve, go back", "page": 7, "n": 5}, {"key": "sqcompare", "name": "Comparing by squaring both sides", "hint": "both sides positive? square both, then compare", "page": 8, "n": 5}, {"key": "termwise", "name": "Comparing two sums piece by piece", "hint": "match the pieces and compare one pair at a time", "page": 20, "n": 2}, {"key": "sumprod", "name": "Product vs sum (xy vs x + y)", "hint": "try one pair of numbers close to the limit, one far away", "page": 20, "n": 2}]}, {"s": "geo", "name": "Geometry", "short": "Geometry", "common": [{"key": "scale", "name": "Scale and size change (length ×k, area ×k²)", "spot": "The question says \u003cb>\"scale drawing\"\u003c/b>, \u003cb>\"1 inch represents …\"\u003c/b>, \u003cb>\"map\"\u003c/b>, \u003cb>\"2 times the diameter\"\u003c/b> or \u003cb>\"ratio of the areas\"\u003c/b>, or changes \u003cb>square yards → square feet\u003c/b>.", "easy": "\u003csvg viewBox='0 0 320 170' aria-hidden='true'>\u003ctext x='160' y='20' font-family='Arial' font-size='13' text-anchor='middle' fill='#4a5866'>Every side × 3 → the area × 9\u003c/text>\u003cpolygon points='45,110 75,110 75,140 45,140' fill='#ffffff' stroke='#1e6f9f' stroke-width='3' stroke-linejoin='round'/>\u003ctext x='60' y='160' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#1e6f9f'>1\u003c/text>\u003ctext x='33' y='130' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#1e6f9f'>1\u003c/text>\u003ctext x='60' y='98' font-family='Arial' font-size='13' font-weight='700' text-anchor='middle' fill='#1e6f9f'>area 1\u003c/text>\u003cpolygon points='140,50 230,50 230,140 140,140' fill='#ffffff' stroke='#b23a2a' stroke-width='3' stroke-linejoin='round'/>\u003cline x1='170' y1='50' x2='170' y2='140' stroke='#4a5866' stroke-width='1' stroke-linecap='round'/>\u003cline x1='140' y1='80' x2='230' y2='80' stroke='#4a5866' stroke-width='1' stroke-linecap='round'/>\u003cline x1='200' y1='50' x2='200' y2='140' stroke='#4a5866' stroke-width='1' stroke-linecap='round'/>\u003cline x1='140' y1='110' x2='230' y2='110' stroke='#4a5866' stroke-width='1' stroke-linecap='round'/>\u003cpolygon points='140,50 230,50 230,140 140,140' fill='none' stroke='#b23a2a' stroke-width='3' stroke-linejoin='round'/>\u003ctext x='185' y='160' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#b23a2a'>3\u003c/text>\u003ctext x='128' y='100' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#b23a2a'>3\u003c/text>\u003ctext x='242' y='91' font-family='Arial' font-size='13' font-weight='700' text-anchor='start' fill='#b23a2a'>area\u003c/text>\u003ctext x='242' y='109' font-family='Arial' font-size='13' font-weight='700' text-anchor='start' fill='#b23a2a'>3 × 3 = 9\u003c/text>\u003c/svg>\u003cp style='margin:4px 0'>The \u003cb>scale factor k\u003c/b> = how many times longer every side gets. Here k = 3: the blue side is 1, the red side is 3.\u003c/p>\u003cp style='margin:4px 0'>\u003cb>Area\u003c/b> = how many 1 × 1 squares fit inside. The blue square holds 1. The red square holds 3 × 3 = \u003cb>9\u003c/b>, not 3.\u003c/p>\u003ctable>\u003ctr>\u003cth>Every length\u003c/th>\u003cth>Area\u003c/th>\u003cth>Volume\u003c/th>\u003c/tr>\u003ctr>\u003ctd>× 2\u003c/td>\u003ctd>\u003cb>× 4\u003c/b> (2 × 2)\u003c/td>\u003ctd>\u003cb>× 8\u003c/b> (2 × 2 × 2)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>× 3\u003c/td>\u003ctd>\u003cb>× 9\u003c/b> (3 × 3)\u003c/td>\u003ctd>\u003cb>× 27\u003c/b> (3 × 3 × 3)\u003c/td>\u003c/tr>\u003c/table>\u003cp style='margin:4px 0'>\u003cb>Volume\u003c/b> = the space inside a solid: how many 1 × 1 × 1 cubes fit inside.\u003c/p>\u003cp style='margin:4px 0'>\u003cb>Why × 9 and not × 3?\u003c/b> The red square got 3 times wider \u003cb>and\u003c/b> 3 times taller: 3 × 3 = 9.\u003c/p>\u003cp style='margin:4px 0'>Two shapes are \u003cb>similar\u003c/b> when one is an exact bigger copy of the other: same angles, every length × k.\u003c/p>", "rule": "length × k → area × k² → volume × k³\u003cbr>Going back: area ratio 4 : 9 → length ratio √4 : √9 = 2 : 3", "first": "Write \u003cb>k = …\u003c/b> (how many times longer). Then ask: is the question about a \u003cb>length\u003c/b>, an \u003cb>area\u003c/b> or a \u003cb>volume\u003c/b>?", "ex": {"q": "On a map, 1 cm stands for 4 km. A lake covers 5 square cm on the map. What is its real area?", "steps": ["k = 4 (1 cm on the map → 4 km for real)", "1 square cm on the map = 4 × 4 = \u003cb>16\u003c/b> square km", "5 square cm → 5 × 16 = \u003cb>80 square km\u003c/b>", "Check: draw the lake as 1 cm by 5 cm → real 4 km by 20 km → 4 × 20 = 80 ✅"]}, "ex2": {"q": "Two circles have areas in the ratio 4 to 25. What is the ratio of their \u003cb>diameters\u003c/b> (the line across a circle through its centre)?", "steps": ["Areas grow by k², so go back with a square root.", "√4 : √25 = \u003cb>2 : 5\u003c/b>", "Check: k = 5 ÷ 2 = 2.5 → areas × 2.5² = × 6.25 → 4 × 6.25 = 25 ✅"]}, "warn": "Do not multiply an area by k. 5 square cm on that map is \u003cb>not\u003c/b> 5 × 4 = 20 square km; it is 80. Same with units: 1 yard = 3 feet, but 1 square yard = 3 × 3 = \u003cb>9\u003c/b> square feet.", "tip": "Solids: a \u003cb>cylinder\u003c/b> (a solid with equal circles at top and bottom) with 2 times the \u003cb>radius\u003c/b> (centre to edge) and 3 times the height holds 2 × 2 × 3 = \u003cb>12\u003c/b> times as much. The radius counts twice, the height once.", "page": 11, "n": 20, "hard": 15}, {"key": "tri", "name": "Triangle sides (how long can the third side be?)", "spot": "A triangle with \u003cb>two sides given\u003c/b> and one unknown: \u003cb>\"sides 5, 12 and x\"\u003c/b>, \u003cb>\"which could be the value\"\u003c/b>, \u003cb>\"isosceles\"\u003c/b> or \u003cb>\"the perimeter of the triangle\"\u003c/b>.", "easy": "\u003csvg viewBox='0 0 320 188' aria-hidden='true'>\u003cpolygon points='40,96 172,96 76.7,41.1' fill='#ffffff' stroke='none' stroke-width='3' stroke-linejoin='round'/>\u003cline x1='40' y1='96' x2='76.7' y2='41.1' stroke='#1e6f9f' stroke-width='3' stroke-linecap='round'/>\u003cline x1='76.7' y1='41.1' x2='172' y2='96' stroke='#2e7a57' stroke-width='3' stroke-linecap='round'/>\u003cline x1='40' y1='96' x2='172' y2='96' stroke='#b23a2a' stroke-width='3' stroke-dasharray='7 5' stroke-linecap='round'/>\u003ctext x='45.9' y='65.5' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#1e6f9f'>3\u003c/text>\u003ctext x='131.8' y='60.8' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#2e7a57'>5\u003c/text>\u003ctext x='106' y='117.2' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#b23a2a'>k = ?\u003c/text>\u003ctext x='200' y='42' font-family='Arial' font-size='13' text-anchor='start' fill='#4a5866'>k is shorter than\u003c/text>\u003ctext x='200' y='60' font-family='Arial' font-size='14' font-weight='700' text-anchor='start' fill='#b23a2a'>5 + 3 = 8\u003c/text>\u003ctext x='200' y='84' font-family='Arial' font-size='13' text-anchor='start' fill='#4a5866'>k is longer than\u003c/text>\u003ctext x='200' y='102' font-family='Arial' font-size='14' font-weight='700' text-anchor='start' fill='#b23a2a'>5 − 3 = 2\u003c/text>\u003cline x1='30' y1='156' x2='290' y2='156' stroke='#1b2430' stroke-width='2' stroke-linecap='round'/>\u003cline x1='30' y1='151' x2='30' y2='161' stroke='#1b2430' stroke-width='1.5' stroke-linecap='round'/>\u003ctext x='30' y='178' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>0\u003c/text>\u003cline x1='56' y1='151' x2='56' y2='161' stroke='#1b2430' stroke-width='1.5' stroke-linecap='round'/>\u003ctext x='56' y='178' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>1\u003c/text>\u003cline x1='82' y1='151' x2='82' y2='161' stroke='#1b2430' stroke-width='1.5' stroke-linecap='round'/>\u003ctext x='82' y='178' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>2\u003c/text>\u003cline x1='108' y1='151' x2='108' y2='161' stroke='#1b2430' stroke-width='1.5' stroke-linecap='round'/>\u003ctext x='108' y='178' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>3\u003c/text>\u003cline x1='134' y1='151' x2='134' y2='161' stroke='#1b2430' stroke-width='1.5' stroke-linecap='round'/>\u003ctext x='134' y='178' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>4\u003c/text>\u003cline x1='160' y1='151' x2='160' y2='161' stroke='#1b2430' stroke-width='1.5' stroke-linecap='round'/>\u003ctext x='160' y='178' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>5\u003c/text>\u003cline x1='186' y1='151' x2='186' y2='161' stroke='#1b2430' stroke-width='1.5' stroke-linecap='round'/>\u003ctext x='186' y='178' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>6\u003c/text>\u003cline x1='212' y1='151' x2='212' y2='161' stroke='#1b2430' stroke-width='1.5' stroke-linecap='round'/>\u003ctext x='212' y='178' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>7\u003c/text>\u003cline x1='238' y1='151' x2='238' y2='161' stroke='#1b2430' stroke-width='1.5' stroke-linecap='round'/>\u003ctext x='238' y='178' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>8\u003c/text>\u003cline x1='264' y1='151' x2='264' y2='161' stroke='#1b2430' stroke-width='1.5' stroke-linecap='round'/>\u003ctext x='264' y='178' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>9\u003c/text>\u003cline x1='290' y1='151' x2='290' y2='161' stroke='#1b2430' stroke-width='1.5' stroke-linecap='round'/>\u003ctext x='290' y='178' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>10\u003c/text>\u003cline x1='82' y1='156' x2='238' y2='156' stroke='#b23a2a' stroke-width='6' stroke-linecap='round'/>\u003ccircle cx='82' cy='156' r='6' fill='#ffffff' stroke='#b23a2a' stroke-width='2.5'/>\u003ccircle cx='238' cy='156' r='6' fill='#ffffff' stroke='#b23a2a' stroke-width='2.5'/>\u003ctext x='160' y='144' font-family='Arial' font-size='13' font-weight='700' text-anchor='middle' fill='#b23a2a'>possible k\u003c/text>\u003c/svg>\u003cp style='margin:4px 0'>The blue side is 3. The green side is 5. The red dashed side, \u003cb>k\u003c/b>, is unknown.\u003c/p>\u003cp style='margin:4px 0'>Rule: any two sides added together must be \u003cb>longer\u003c/b> than the third side.\u003c/p>\u003ctable>\u003ctr>\u003cth>k\u003c/th>\u003cth>Test\u003c/th>\u003cth>Triangle?\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>3 + 1 = 4, shorter than 5\u003c/td>\u003ctd>❌ the sides cannot meet\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>3 + 2 = 5, only equal to 5\u003c/td>\u003ctd>❌ flat, a straight line\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>3 + 5 = 8, longer than 6\u003c/td>\u003ctd>✅ the one drawn\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>3 + 5 = 8, only equal to 8\u003c/td>\u003ctd>❌ flat, a straight line\u003c/td>\u003c/tr>\u003c/table>\u003cp style='margin:4px 0'>\u003cb>Why 2 and 8?\u003c/b> 5 − 3 = 2 is the smallest k can get. 5 + 3 = 8 is the most it can stretch. The red bar shows every k in between.\u003c/p>", "rule": "(big side − small side) &lt; third side &lt; (big side + small side)\u003cbr>Here: 5 − 3 = 2 &lt; k &lt; 8 = 5 + 3", "first": "Take the two known sides. Write their \u003cb>difference\u003c/b> and their \u003cb>sum\u003c/b>. The third side lies strictly between them.", "ex": {"q": "A triangle has sides 5, 12 and x. Which could be x: 6, 8 or 17?", "steps": ["Difference: 12 − 5 = 7. Sum: 12 + 5 = 17.", "So 7 &lt; x &lt; 17.", "6 is too small. 17 is not allowed (equal makes it flat). \u003cb>x = 8\u003c/b>", "Check: 5 + 8 = 13, longer than 12 ✅"]}, "ex2": {"q": "An \u003cb>isosceles\u003c/b> triangle (two sides equal) has a side of 4 and a side of 9. What is its \u003cb>perimeter\u003c/b> (all three sides added)?", "steps": ["Try 4, 4, 9: 4 + 4 = 8, shorter than 9 ❌ not a triangle", "Try 4, 9, 9: 4 + 9 = 13, longer than 9 ✅", "Perimeter = 4 + 9 + 9 = \u003cb>22\u003c/b> ✅"]}, "warn": "The two ends are \u003cb>not\u003c/b> allowed. Sides 3, 5 and 8 lie flat: 3 + 5 = 8 is not longer than 8. So the answer is 2 &lt; k &lt; 8, never 2 ≤ k ≤ 8.", "tip": "For later, the 90° test: in 3, 4, 5 the longest side squared, 5² = 25, equals 3² + 4² = 9 + 16. Equal → a 90° corner. Longest² bigger → one corner is more than 90°.", "page": 10, "n": 18, "hard": 11}, {"key": "sector", "name": "Arcs and sectors (part of a circle)", "spot": "The question says \u003cb>\"arc\"\u003c/b>, \u003cb>\"sector\"\u003c/b>, \u003cb>\"central angle\"\u003c/b>, \u003cb>\"semicircle\"\u003c/b>, \u003cb>\"circle graph\"\u003c/b> or \u003cb>\"… percent of the circumference\"\u003c/b>.", "easy": "\u003csvg viewBox='0 0 320 205' aria-hidden='true'>\u003ccircle cx='110' cy='112' r='82' fill='#ffffff' stroke='#1b2430' stroke-width='3'/>\u003cpath d='M110 112 L192 112 A82 82 0 0 0 110 30 Z' fill='#1e6f9f' fill-opacity='0.16' stroke='none'/>\u003cpath d='M192 112 A82 82 0 0 0 110 30' fill='none' stroke='#b23a2a' stroke-width='5'/>\u003cline x1='110' y1='112' x2='192' y2='112' stroke='#1e6f9f' stroke-width='3' stroke-linecap='round'/>\u003cline x1='110' y1='112' x2='110' y2='30' stroke='#1e6f9f' stroke-width='3' stroke-linecap='round'/>\u003cpolyline points='122,112 122,100 110,100' fill='none' stroke='#1b2430' stroke-width='1.8'/>\u003ccircle cx='110' cy='112' r='5.5' fill='#9c6510'/>\u003ctext x='100' y='132' font-family='Arial' font-size='13' font-weight='700' text-anchor='end' fill='#9c6510'>centre\u003c/text>\u003ctext x='151' y='132' font-family='Arial' font-size='14' font-weight='700' text-anchor='middle' fill='#1e6f9f'>r = 6\u003c/text>\u003ctext x='80' y='71' font-family='Arial' font-size='14' font-weight='700' text-anchor='middle' fill='#1e6f9f'>r = 6\u003c/text>\u003ctext x='127' y='106' font-family='Arial' font-size='13' font-weight='700' text-anchor='start' fill='#1b2430'>90°\u003c/text>\u003ctext x='146' y='74' font-family='Arial' font-size='13' font-weight='700' text-anchor='middle' fill='#1e6f9f'>sector\u003c/text>\u003ctext x='182' y='44' font-family='Arial' font-size='15' font-weight='700' text-anchor='start' fill='#b23a2a'>arc\u003c/text>\u003ctext x='222' y='160' font-family='Arial' font-size='13' text-anchor='start' fill='#4a5866'>whole circle\u003c/text>\u003ctext x='222' y='178' font-family='Arial' font-size='13' text-anchor='start' fill='#4a5866'>= 360°\u003c/text>\u003c/svg>\u003cul style='margin:4px 0;padding-left:20px'>\u003cli>\u003cb>Radius\u003c/b> r = from the centre (the orange dot) to the edge: each blue line. Here r = 6.\u003c/li>\u003cli>\u003cb>Circumference\u003c/b> = the length all the way round = 2 × π × r (π ≈ 3.14).\u003c/li>\u003cli>\u003cb>Arc\u003c/b> = a piece of the edge: the red curve.\u003c/li>\u003cli>\u003cb>Sector\u003c/b> = the shaded part between the two blue lines and the red arc.\u003c/li>\u003cli>\u003cb>Central angle\u003c/b> = the angle at the centre, between the blue lines. Here 90°.\u003c/li>\u003c/ul>\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>Whole circle\u003c/th>\u003cth>This sector (¼)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Angle\u003c/td>\u003ctd>360°\u003c/td>\u003ctd>90°\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Edge\u003c/td>\u003ctd>2 × π × 6 = 12π\u003c/td>\u003ctd>red arc = ¼ × 12π = \u003cb>3π\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Area\u003c/td>\u003ctd>π × 6² = 36π\u003c/td>\u003ctd>¼ × 36π = \u003cb>9π\u003c/b>\u003c/td>\u003c/tr>\u003c/table>\u003cp style='margin:4px 0'>\u003cb>Why ¼?\u003c/b> 90 ÷ 360 = ¼. The sector is ¼ of the circle, so its arc and its area are ¼ too.\u003c/p>", "rule": "fraction = central angle ÷ 360\u003cbr>arc = fraction × 2πr · sector area = fraction × πr²", "first": "Write the \u003cb>fraction\u003c/b> of the circle (angle ÷ 360, or the percent). Then take that fraction of the whole circle.", "ex": {"q": "A circle has radius 6. A sector has a central angle of 60°. Find its arc length and its area.", "steps": ["Fraction = 60 ÷ 360 = \u003cb>1/6\u003c/b>", "Whole edge = 2 × π × 6 = 12π → arc = 12π ÷ 6 = \u003cb>2π\u003c/b>", "Whole area = π × 6² = 36π → sector = 36π ÷ 6 = \u003cb>6π\u003c/b>", "Check: 6 such sectors make the whole circle: 6 × 2π = 12π ✅"]}, "ex2": {"q": "A 90° arc has length 5π. What is the radius?", "steps": ["Fraction = 90 ÷ 360 = ¼", "¼ of the whole edge = 5π → whole edge = 4 × 5π = 20π", "2 × π × r = 20π → r = 20π ÷ 2π = \u003cb>10\u003c/b>", "Check: ¼ × 2 × π × 10 = 5π ✅"]}, "warn": "A \u003cb>semicircle\u003c/b> is half a circle. Its full outline = curved part (π × r) + the straight \u003cb>diameter\u003c/b> (2r, the line across through the centre). r = 4: 4π + 8 ≈ 20.6, not just 4π ≈ 12.6.", "tip": "Keep π as π to the end; it often cancels. Circle graph: 30 out of 120 = ¼ → the sector angle is ¼ × 360 = 90°.", "page": 13, "n": 18, "hard": 11}, {"key": "quads", "name": "Rectangles and other 4-sided shapes", "spot": "The question says \u003cb>\"rectangle\"\u003c/b>, \u003cb>\"square\"\u003c/b>, \u003cb>\"parallelogram\"\u003c/b>, \u003cb>\"trapezoid\"\u003c/b>, \u003cb>\"diagonal\"\u003c/b> or \u003cb>\"quadrilateral\"\u003c/b> (any shape with 4 straight sides).", "easy": "\u003csvg viewBox='0 0 320 158' aria-hidden='true'>\u003cpolygon points='20,108 132,108 132,24 20,24' fill='#ffffff' stroke='#1b2430' stroke-width='3' stroke-linejoin='round'/>\u003cline x1='20' y1='108' x2='132' y2='108' stroke='#1e6f9f' stroke-width='3' stroke-linecap='round'/>\u003cline x1='132' y1='108' x2='132' y2='24' stroke='#2e7a57' stroke-width='3' stroke-linecap='round'/>\u003cline x1='20' y1='108' x2='132' y2='24' stroke='#b23a2a' stroke-width='3' stroke-linecap='round'/>\u003cpolyline points='121,108 121,97 132,97' fill='none' stroke='#1b2430' stroke-width='1.8'/>\u003cpolyline points='31,24 31,35 20,35' fill='none' stroke='#1b2430' stroke-width='1.8'/>\u003ctext x='76' y='128.2' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#1e6f9f'>8\u003c/text>\u003ctext x='147' y='71.2' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#2e7a57'>6\u003c/text>\u003ctext x='68.2' y='60.9' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#b23a2a'>10\u003c/text>\u003ctext x='76' y='148' font-family='Arial' font-size='13' text-anchor='middle' fill='#4a5866'>rectangle\u003c/text>\u003cpolygon points='172,108 256,108 298,52 214,52' fill='#ffffff' stroke='#1b2430' stroke-width='3' stroke-linejoin='round'/>\u003cline x1='172' y1='108' x2='256' y2='108' stroke='#1e6f9f' stroke-width='3' stroke-linecap='round'/>\u003cline x1='172' y1='108' x2='214' y2='52' stroke='#2e7a57' stroke-width='3' stroke-linecap='round'/>\u003cpolyline points='232.4,103 238.4,108 232.4,113' fill='none' stroke='#1e6f9f' stroke-width='2.2'/>\u003cpolyline points='274.4,47 280.4,52 274.4,57' fill='none' stroke='#1b2430' stroke-width='2.2'/>\u003cline x1='214' y1='52' x2='214' y2='108' stroke='#9c6510' stroke-width='3' stroke-dasharray='7 5' stroke-linecap='round'/>\u003cpolyline points='223,108 223,99 214,99' fill='none' stroke='#9c6510' stroke-width='1.8'/>\u003ctext x='214' y='128.2' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#1e6f9f'>6\u003c/text>\u003ctext x='181' y='76.2' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#2e7a57'>5\u003c/text>\u003ctext x='223' y='85' font-family='Arial' font-size='15' font-weight='700' text-anchor='start' fill='#9c6510'>4\u003c/text>\u003ctext x='235' y='148' font-family='Arial' font-size='13' text-anchor='middle' fill='#4a5866'>parallelogram\u003c/text>\u003c/svg>\u003cp style='margin:4px 0'>Left: a \u003cb>rectangle\u003c/b> (4 corners of 90°, the small squares). A \u003cb>square\u003c/b> is a rectangle with 4 equal sides.\u003c/p>\u003cp style='margin:4px 0'>The red line is a \u003cb>diagonal\u003c/b>: corner to opposite corner. It cuts the rectangle into two \u003cb>right triangles\u003c/b> (triangles with a 90° corner).\u003c/p>\u003ctable>\u003ctr>\u003cth>Rectangle: blue 8, green 6\u003c/th>\u003cth>Work\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Area\u003c/b> (space inside)\u003c/td>\u003ctd>8 × 6 = \u003cb>48\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Perimeter\u003c/b> (all the way round)\u003c/td>\u003ctd>8 + 6 + 8 + 6 = \u003cb>28\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Red diagonal\u003c/td>\u003ctd>8² + 6² = 64 + 36 = 100 → √100 = \u003cb>10\u003c/b>\u003c/td>\u003c/tr>\u003c/table>\u003cp style='margin:4px 0'>\u003cb>Why 10?\u003c/b> In a right triangle: short² + short² = long². The red diagonal is the long side.\u003c/p>\u003cp style='margin:4px 0'>Right: a \u003cb>parallelogram\u003c/b>: opposite sides are \u003cb>parallel\u003c/b>: they never meet (the small arrows mark one parallel pair). Its \u003cb>height\u003c/b> is the orange dashed line, at 90° to the blue base. Area = 6 × 4 = \u003cb>24\u003c/b>. (A \u003cb>trapezoid\u003c/b> has only one pair of parallel sides.)\u003c/p>", "rule": "Rectangle: area = length × width · perimeter = 2 × (length + width)\u003cbr>diagonal² = length² + width² · Parallelogram: area = base × height", "first": "Sketch the shape and write every length on it. If there is a diagonal, use the right triangle it makes.", "ex": {"q": "A rectangle has a diagonal of 13 and one side of 5. What is its area?", "steps": ["Right triangle: 5² + (other side)² = 13²", "25 + (other side)² = 169 → (other side)² = 144 → other side = \u003cb>12\u003c/b>", "Area = 5 × 12 = \u003cb>60\u003c/b>", "Check: 5² + 12² = 25 + 144 = 169 = 13² ✅"]}, "warn": "Parallelogram area uses the orange \u003cb>height\u003c/b> (at 90°), not the slanted green side: 6 × 4 = 24, \u003cb>not\u003c/b> 6 × 5 = 30.", "tip": "Same perimeter, different areas. Perimeter 20: 5 × 5 = \u003cb>25\u003c/b>, 4 × 6 = 24, 3 × 7 = 21, 2 × 8 = 16. The square always has the biggest area.", "page": 12, "n": 17, "hard": 11}, {"key": "srt", "name": "Special right triangles (45-45-90 and 30-60-90)", "spot": "The question has an \u003cb>\"equilateral triangle\"\u003c/b>, a \u003cb>square with its diagonal\u003c/b>, angles of \u003cb>30°, 45° or 60°\u003c/b> next to a 90° corner, or sides in the ratio \u003cb>3 to 4 to 5\u003c/b>.", "easy": "\u003csvg viewBox='0 0 320 160' aria-hidden='true'>\u003cpolygon points='30,126 110,126 30,46' fill='#ffffff' stroke='none' stroke-width='3' stroke-linejoin='round'/>\u003cline x1='30' y1='126' x2='110' y2='126' stroke='#1e6f9f' stroke-width='3' stroke-linecap='round'/>\u003cline x1='30' y1='126' x2='30' y2='46' stroke='#1e6f9f' stroke-width='3' stroke-linecap='round'/>\u003cline x1='110' y1='126' x2='30' y2='46' stroke='#b23a2a' stroke-width='3' stroke-linecap='round'/>\u003cpolyline points='41,126 41,115 30,115' fill='none' stroke='#1b2430' stroke-width='1.8'/>\u003ctext x='70' y='146.2' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#1e6f9f'>1\u003c/text>\u003ctext x='15' y='91.2' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#1e6f9f'>1\u003c/text>\u003ctext x='80.6' y='80.6' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#b23a2a'>√2\u003c/text>\u003ctext x='74' y='120' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>45°\u003c/text>\u003ctext x='43' y='88' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>45°\u003c/text>\u003ctext x='70' y='24' font-family='Arial' font-size='14' font-weight='700' text-anchor='middle' fill='#1b2430'>45-45-90\u003c/text>\u003cpolygon points='182,126 285.9,126 182,66' fill='#ffffff' stroke='none' stroke-width='3' stroke-linejoin='round'/>\u003cline x1='182' y1='126' x2='182' y2='66' stroke='#1e6f9f' stroke-width='3' stroke-linecap='round'/>\u003cline x1='182' y1='126' x2='285.9' y2='126' stroke='#2e7a57' stroke-width='3' stroke-linecap='round'/>\u003cline x1='285.9' y1='126' x2='182' y2='66' stroke='#b23a2a' stroke-width='3' stroke-linecap='round'/>\u003cpolyline points='193,126 193,115 182,115' fill='none' stroke='#1b2430' stroke-width='1.8'/>\u003ctext x='167' y='101.2' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#1e6f9f'>1\u003c/text>\u003ctext x='234' y='146.2' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#2e7a57'>√3\u003c/text>\u003ctext x='241.5' y='88.3' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#b23a2a'>2\u003c/text>\u003ctext x='235.9' y='121' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>30°\u003c/text>\u003ctext x='197' y='92' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>60°\u003c/text>\u003ctext x='234' y='44' font-family='Arial' font-size='14' font-weight='700' text-anchor='middle' fill='#1b2430'>30-60-90\u003c/text>\u003c/svg>\u003cp style='margin:4px 0'>A \u003cb>right triangle\u003c/b> has one 90° corner (the small square). The \u003cb>hypotenuse\u003c/b> = the longest side, across from the 90° corner: the red side in both.\u003c/p>\u003cp style='margin:4px 0'>These two right triangles always have the same side pattern:\u003c/p>\u003ctable>\u003ctr>\u003cth>Triangle\u003c/th>\u003cth>Sides\u003c/th>\u003cth>Where it comes from\u003c/th>\u003c/tr>\u003ctr>\u003ctd>45-45-90\u003c/td>\u003ctd>blue 1, blue 1, red √2\u003c/td>\u003ctd>half a square, cut along its diagonal\u003c/td>\u003c/tr>\u003ctr>\u003ctd>30-60-90\u003c/td>\u003ctd>blue 1, green √3, red 2\u003c/td>\u003ctd>half an \u003cb>equilateral\u003c/b> triangle (3 equal sides, three 60° angles)\u003c/td>\u003c/tr>\u003c/table>\u003cp style='margin:4px 0'>\u003cb>Why √2?\u003c/b> 1² + 1² = 2, so the red side = √2 ≈ 1.41.\u003cbr>\u003cb>Why √3?\u003c/b> 1² + (√3)² = 1 + 3 = 4 = 2².\u003c/p>", "rule": "45-45-90 → 1 : 1 : √2 · 30-60-90 → 1 : √3 : 2\u003cbr>(short side : long side : hypotenuse), all × the same number", "first": "Find the 90° corner and one more angle (30°, 45° or 60°). Write the pattern, then find the multiplier.", "ex": {"q": "An equilateral triangle has sides of 10. What is its \u003cb>height\u003c/b> (the line from the top corner down to the bottom side, at 90°)?", "steps": ["The height cuts it into two 30-60-90 triangles.", "Hypotenuse = 10 = 2 × \u003cb>5\u003c/b>, so the multiplier is 5.", "Short side = 1 × 5 = 5. Height (long side) = √3 × 5 = \u003cb>5√3 ≈ 8.66\u003c/b>", "Check: 5² + (5√3)² = 25 + 75 = 100 = 10² ✅"]}, "warn": "In 30-60-90 the longest side is \u003cb>2\u003c/b>, not √3 (√3 ≈ 1.73). The shortest side (blue) is across from the 30° corner. The red hypotenuse is across from 90°.", "tip": "Also learn these whole-number right triangles: \u003cb>3-4-5\u003c/b>, \u003cb>6-8-10\u003c/b>, \u003cb>5-12-13\u003c/b>. Any multiple works: 3-4-5 × 3 = 9-12-15. A square with side 6 has a diagonal of 6√2.", "page": 11, "n": 16, "hard": 11}, {"key": "solid", "name": "Boxes, cubes and cylinders (volume and surface)", "spot": "The question says \u003cb>\"cube\"\u003c/b>, \u003cb>\"rectangular solid\"\u003c/b>, \u003cb>\"box\"\u003c/b>, \u003cb>\"cylinder\"\u003c/b>, \u003cb>\"volume\"\u003c/b>, \u003cb>\"surface area\"\u003c/b>, \u003cb>\"edges\"\u003c/b>, or water is \u003cb>\"poured\"\u003c/b> from one container into another.", "easy": "\u003csvg viewBox='0 0 320 184' aria-hidden='true'>\u003cpolygon points='22,132 118,132 180.4,96 180.4,48 84.4,48 22,84' fill='#ffffff' stroke='none' stroke-width='3' stroke-linejoin='round'/>\u003cline x1='22' y1='132' x2='84.4' y2='96' stroke='#4a5866' stroke-width='1.5' stroke-dasharray='7 5' stroke-linecap='round'/>\u003cline x1='84.4' y1='96' x2='180.4' y2='96' stroke='#4a5866' stroke-width='1.5' stroke-dasharray='7 5' stroke-linecap='round'/>\u003cline x1='84.4' y1='96' x2='84.4' y2='48' stroke='#4a5866' stroke-width='1.5' stroke-dasharray='7 5' stroke-linecap='round'/>\u003cline x1='118' y1='132' x2='118' y2='84' stroke='#1b2430' stroke-width='2.5' stroke-linecap='round'/>\u003cline x1='118' y1='84' x2='22' y2='84' stroke='#1b2430' stroke-width='2.5' stroke-linecap='round'/>\u003cline x1='22' y1='84' x2='84.4' y2='48' stroke='#1b2430' stroke-width='2.5' stroke-linecap='round'/>\u003cline x1='84.4' y1='48' x2='180.4' y2='48' stroke='#1b2430' stroke-width='2.5' stroke-linecap='round'/>\u003cline x1='180.4' y1='48' x2='118' y2='84' stroke='#1b2430' stroke-width='2.5' stroke-linecap='round'/>\u003cline x1='180.4' y1='48' x2='180.4' y2='96' stroke='#1b2430' stroke-width='2.5' stroke-linecap='round'/>\u003cline x1='22' y1='132' x2='118' y2='132' stroke='#1e6f9f' stroke-width='3' stroke-linecap='round'/>\u003cline x1='22' y1='132' x2='22' y2='84' stroke='#b23a2a' stroke-width='3' stroke-linecap='round'/>\u003cline x1='118' y1='132' x2='180.4' y2='96' stroke='#2e7a57' stroke-width='3' stroke-linecap='round'/>\u003ctext x='70' y='152' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#1e6f9f'>4\u003c/text>\u003ctext x='11' y='113' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#b23a2a'>2\u003c/text>\u003ctext x='159.2' y='132' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#2e7a57'>3\u003c/text>\u003ctext x='101.2' y='174' font-family='Arial' font-size='13' text-anchor='middle' fill='#4a5866'>box\u003c/text>\u003cpath d='M244 44 L244 116 A24 9 0 0 0 292 116 L292 44 Z' fill='#ffffff' stroke='none'/>\u003cellipse cx='268' cy='44' rx='24' ry='9' fill='#ffffff' stroke='#1b2430' stroke-width='2.5'/>\u003cpath d='M244 116 A24 9 0 0 0 292 116' fill='none' stroke='#1b2430' stroke-width='2.5'/>\u003cpath d='M244 116 A24 9 0 0 1 292 116' fill='none' stroke='#4a5866' stroke-width='1.5' stroke-dasharray='5 4'/>\u003cline x1='292' y1='44' x2='292' y2='116' stroke='#1b2430' stroke-width='2.5' stroke-linecap='round'/>\u003cline x1='244' y1='44' x2='244' y2='116' stroke='#b23a2a' stroke-width='3' stroke-linecap='round'/>\u003cline x1='268' y1='44' x2='292' y2='44' stroke='#9c6510' stroke-width='3' stroke-linecap='round'/>\u003ccircle cx='268' cy='44' r='3.5' fill='#9c6510'/>\u003ctext x='280' y='29' font-family='Arial' font-size='14' font-weight='700' text-anchor='middle' fill='#9c6510'>r = 1\u003c/text>\u003ctext x='234' y='85' font-family='Arial' font-size='14' font-weight='700' text-anchor='end' fill='#b23a2a'>h = 3\u003c/text>\u003ctext x='268' y='174' font-family='Arial' font-size='13' text-anchor='middle' fill='#4a5866'>cylinder\u003c/text>\u003c/svg>\u003cp style='margin:4px 0'>Left: a \u003cb>rectangular solid\u003c/b> (a box). Length = the blue edge (4), width = the green edge (3), height = the red edge (2). An \u003cb>edge\u003c/b> is a line where two flat \u003cb>faces\u003c/b> meet. The grey dashed edges are hidden at the back.\u003c/p>\u003cp style='margin:4px 0'>Right: a \u003cb>cylinder\u003c/b>: two equal circles (top and bottom) joined by a curved wall. The orange line is the \u003cb>radius\u003c/b> r (centre to edge). The red line is the height h.\u003c/p>\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>Work\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Box \u003cb>volume\u003c/b> (how many 1 × 1 × 1 cubes fit inside)\u003c/td>\u003ctd>4 × 3 × 2 = \u003cb>24\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Box \u003cb>surface area\u003c/b> (area of all 6 outside faces)\u003c/td>\u003ctd>2 × (4×3 + 4×2 + 3×2) = 2 × 26 = \u003cb>52\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cylinder volume (r = 1, h = 3)\u003c/td>\u003ctd>π × 1² × 3 = \u003cb>3π\u003c/b>\u003c/td>\u003c/tr>\u003c/table>\u003cp style='margin:4px 0'>\u003cb>Why 2 × (…)?\u003c/b> Each face has an equal partner on the other side: top and bottom, front and back, left and right.\u003c/p>", "rule": "Box: volume = l × w × h · surface = 2 × (lw + lh + wh)\u003cbr>Cylinder: volume = π × r² × h (circle area × height)", "first": "Write l (length), w (width), h (height), or r and h, on a quick sketch. Then ask: is it the \u003cb>inside\u003c/b> (volume) or the \u003cb>outside faces\u003c/b> (surface area)?", "ex": {"q": "A cylinder-shaped tank with radius 2 holds water 8 deep. All the water is poured into an empty cylinder-shaped tank with radius 4. How deep is the water now?", "steps": ["Water volume = π × 2² × 8 = \u003cb>32π\u003c/b>", "New tank: π × 4² × depth = 16π × depth", "16π × depth = 32π → depth = \u003cb>2\u003c/b>", "Check: radius × 2 → circle area × 4 → depth ÷ 4: 8 ÷ 4 = 2 ✅"]}, "warn": "Cutting a 2 × 2 square from \u003cb>each corner\u003c/b> of a sheet 10 long leaves 10 − 2 − 2 = \u003cb>6\u003c/b> for the box, not 8. The side loses a square at both ends.", "tip": "A \u003cb>cube\u003c/b> (a box with all edges equal) has 6 faces, \u003cb>12 edges\u003c/b> and 8 corners. Edges add to 36 → each edge = 36 ÷ 12 = 3 → volume = 3 × 3 × 3 = 27.", "page": 14, "n": 14, "hard": 11}, {"key": "circang", "name": "Angles in a circle (corner on the circle)", "spot": "The question says \u003cb>\"inscribed in a circle\"\u003c/b> (drawn inside, with every corner on the circle), \u003cb>\"center O\"\u003c/b>, \u003cb>\"diameter\"\u003c/b> or \u003cb>\"tangent\"\u003c/b>, or an angle has its corner \u003cb>on the circle\u003c/b>.", "easy": "\u003csvg viewBox='0 0 320 204' aria-hidden='true'>\u003ccircle cx='78' cy='100' r='64' fill='#ffffff' stroke='#1b2430' stroke-width='2.5'/>\u003cpath d='M127 141.1 A64 64 0 0 1 29 141.1' fill='none' stroke='#b23a2a' stroke-width='5'/>\u003cline x1='78' y1='100' x2='29' y2='141.1' stroke='#1e6f9f' stroke-width='3' stroke-linecap='round'/>\u003cline x1='78' y1='100' x2='127' y2='141.1' stroke='#1e6f9f' stroke-width='3' stroke-linecap='round'/>\u003cline x1='78' y1='36' x2='29' y2='141.1' stroke='#2e7a57' stroke-width='3' stroke-linecap='round'/>\u003cline x1='78' y1='36' x2='127' y2='141.1' stroke='#2e7a57' stroke-width='3' stroke-linecap='round'/>\u003ccircle cx='29' cy='141.1' r='4' fill='#1b2430'/>\u003ccircle cx='127' cy='141.1' r='4' fill='#1b2430'/>\u003ccircle cx='78' cy='36' r='4' fill='#1b2430'/>\u003ccircle cx='78' cy='100' r='5' fill='#9c6510'/>\u003ctext x='87' y='102' font-family='Arial' font-size='13' font-weight='700' text-anchor='start' fill='#9c6510'>O\u003c/text>\u003ctext x='78' y='127' font-family='Arial' font-size='13' font-weight='700' text-anchor='middle' fill='#1e6f9f'>100°\u003c/text>\u003ctext x='78' y='76' font-family='Arial' font-size='13' font-weight='700' text-anchor='middle' fill='#2e7a57'>50°\u003c/text>\u003ctext x='20' y='153.1' font-family='Arial' font-size='14' font-weight='700' text-anchor='end' fill='#1b2430'>A\u003c/text>\u003ctext x='136' y='153.1' font-family='Arial' font-size='14' font-weight='700' text-anchor='start' fill='#1b2430'>B\u003c/text>\u003ctext x='78' y='27' font-family='Arial' font-size='14' font-weight='700' text-anchor='middle' fill='#1b2430'>C\u003c/text>\u003ctext x='78' y='194' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>green = half of blue\u003c/text>\u003ccircle cx='236' cy='100' r='64' fill='#ffffff' stroke='#1b2430' stroke-width='2.5'/>\u003cline x1='172' y1='100' x2='300' y2='100' stroke='#b23a2a' stroke-width='3' stroke-linecap='round'/>\u003cline x1='199.3' y1='47.6' x2='172' y2='100' stroke='#2e7a57' stroke-width='3' stroke-linecap='round'/>\u003cline x1='199.3' y1='47.6' x2='300' y2='100' stroke='#2e7a57' stroke-width='3' stroke-linecap='round'/>\u003cpolyline points='194.7,56.4 203.5,61.1 208.2,52.2' fill='none' stroke='#1b2430' stroke-width='1.8'/>\u003ccircle cx='172' cy='100' r='4' fill='#1b2430'/>\u003ccircle cx='300' cy='100' r='4' fill='#1b2430'/>\u003ccircle cx='199.3' cy='47.6' r='4' fill='#1b2430'/>\u003ccircle cx='236' cy='100' r='5' fill='#9c6510'/>\u003ctext x='238' y='120' font-family='Arial' font-size='13' font-weight='700' text-anchor='middle' fill='#9c6510'>O\u003c/text>\u003ctext x='164' y='105' font-family='Arial' font-size='14' font-weight='700' text-anchor='end' fill='#1b2430'>P\u003c/text>\u003ctext x='308' y='105' font-family='Arial' font-size='14' font-weight='700' text-anchor='start' fill='#1b2430'>Q\u003c/text>\u003ctext x='192.3' y='40.6' font-family='Arial' font-size='14' font-weight='700' text-anchor='end' fill='#1b2430'>R\u003c/text>\u003ctext x='213.3' y='77.6' font-family='Arial' font-size='13' font-weight='700' text-anchor='start' fill='#2e7a57'>90°\u003c/text>\u003ctext x='236' y='194' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>red diameter → 90° at R\u003c/text>\u003c/svg>\u003cul style='margin:4px 0;padding-left:20px'>\u003cli>Left: the blue lines meet at the centre O. That is a \u003cb>central angle\u003c/b>: 100°.\u003c/li>\u003cli>The green lines meet at C, a point on the circle. That is an \u003cb>inscribed angle\u003c/b>. Both angles open onto the same red \u003cb>arc\u003c/b> AB (piece of the edge). The green angle is half: \u003cb>50°\u003c/b>.\u003c/li>\u003cli>Right: the red line PQ is a \u003cb>diameter\u003c/b> (a line across the circle through the centre). The green lines join P and Q to a point R on the circle. The corner at R is always \u003cb>90°\u003c/b>.\u003c/li>\u003c/ul>\u003cp style='margin:4px 0'>\u003cb>Why 90°?\u003c/b> The red diameter is a straight line through O, so its central angle is 180°. Half of 180° = 90°.\u003c/p>\u003ctable>\u003ctr>\u003cth>Fact\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Corner on the circle = ½ corner at the centre\u003c/td>\u003ctd>100° → 50°\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Corner on the circle facing a diameter\u003c/td>\u003ctd>90°\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4 corners on the circle: opposite corners add to 180°\u003c/td>\u003ctd>70° and 110°\u003c/td>\u003c/tr>\u003c/table>", "rule": "Corner on the circle = ½ × corner at the centre (same arc)\u003cbr>Diameter → 90° on the circle · 4 corners on a circle: opposite angles add to 180°", "first": "Find the centre and any diameter. Mark every 90° first. Then use “half” and “add to 180°”.", "ex": {"q": "Shape ABCD has 4 sides and all four corners on a circle. Angle A is 3 times angle C. Find angle A.", "steps": ["A and C are opposite corners, so A + C = 180.", "3C + C = 180 → 4C = 180 → C = 45", "A = 3 × 45 = \u003cb>135°\u003c/b>", "Check: 135 + 45 = 180 ✅"]}, "ex2": {"q": "PQ is a diameter. R is on the circle, and angle P = 35°. Find angle Q.", "steps": ["PQ is a diameter → the angle at R = \u003cb>90°\u003c/b>", "The 3 angles of a triangle add to 180: 35 + 90 + Q = 180", "Q = 180 − 125 = \u003cb>55°\u003c/b>", "Check: 35 + 90 + 55 = 180 ✅"]}, "warn": "The corner on the circle is \u003cb>half\u003c/b>, not double. Blue central angle 100° → green angle 50°, \u003cb>not\u003c/b> 200°.", "tip": "A \u003cb>tangent\u003c/b> is a line that touches the circle at one point only. It always makes a \u003cb>90°\u003c/b> corner with the radius (centre-to-edge line) drawn to that point.", "page": 13, "n": 11, "hard": 8}, {"key": "polyang", "name": "Angles of a polygon (shape with many sides)", "spot": "The question says \u003cb>\"polygon\"\u003c/b>, \u003cb>\"pentagon\"\u003c/b> (5 sides), \u003cb>\"hexagon\"\u003c/b> (6), \u003cb>\"octagon\"\u003c/b> (8), \u003cb>\"regular\"\u003c/b>, \u003cb>\"interior angle\"\u003c/b> or \u003cb>\"n sides\"\u003c/b>.", "easy": "\u003csvg viewBox='0 0 320 200' aria-hidden='true'>\u003cpolygon points='24,106 66,33.3 150,33.3 192,106 150,178.7 66,178.7' fill='#ffffff' stroke='#1b2430' stroke-width='3' stroke-linejoin='round'/>\u003cline x1='24' y1='106' x2='150' y2='33.3' stroke='#1e6f9f' stroke-width='2.5' stroke-dasharray='7 5' stroke-linecap='round'/>\u003cline x1='24' y1='106' x2='192' y2='106' stroke='#1e6f9f' stroke-width='2.5' stroke-dasharray='7 5' stroke-linecap='round'/>\u003cline x1='24' y1='106' x2='150' y2='178.7' stroke='#1e6f9f' stroke-width='2.5' stroke-dasharray='7 5' stroke-linecap='round'/>\u003ctext x='84' y='63.5' font-family='Arial' font-size='16' font-weight='700' text-anchor='middle' fill='#4a5866'>1\u003c/text>\u003ctext x='126' y='87.8' font-family='Arial' font-size='16' font-weight='700' text-anchor='middle' fill='#4a5866'>2\u003c/text>\u003ctext x='126' y='136.2' font-family='Arial' font-size='16' font-weight='700' text-anchor='middle' fill='#4a5866'>3\u003c/text>\u003ctext x='84' y='160.5' font-family='Arial' font-size='16' font-weight='700' text-anchor='middle' fill='#4a5866'>4\u003c/text>\u003ccircle cx='24' cy='106' r='6' fill='#9c6510'/>\u003ctext x='214' y='70' font-family='Arial' font-size='14' font-weight='700' text-anchor='start' fill='#1b2430'>6 sides\u003c/text>\u003ctext x='214' y='96' font-family='Arial' font-size='14' font-weight='700' text-anchor='start' fill='#1e6f9f'>→ 4 triangles\u003c/text>\u003ctext x='214' y='122' font-family='Arial' font-size='14' font-weight='700' text-anchor='start' fill='#1b2430'>4 × 180°\u003c/text>\u003ctext x='214' y='142' font-family='Arial' font-size='14' font-weight='700' text-anchor='start' fill='#1b2430'>= 720°\u003c/text>\u003c/svg>\u003cp style='margin:4px 0'>A \u003cb>polygon\u003c/b> is a flat shape with straight sides. An \u003cb>interior angle\u003c/b> is the angle inside the shape at one corner.\u003c/p>\u003cp style='margin:4px 0'>From one corner (the orange dot), the blue dashed lines cut the 6-sided shape into \u003cb>4 triangles\u003c/b>. The angles of each triangle add to 180°.\u003c/p>\u003ctable>\u003ctr>\u003cth>Sides (n)\u003c/th>\u003cth>Triangles\u003c/th>\u003cth>Angle sum\u003c/th>\u003cth>Each, if regular\u003c/th>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>1\u003c/td>\u003ctd>180°\u003c/td>\u003ctd>60°\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>2\u003c/td>\u003ctd>360°\u003c/td>\u003ctd>90°\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>3\u003c/td>\u003ctd>540°\u003c/td>\u003ctd>108°\u003c/td>\u003c/tr>\u003ctr>\u003ctd>6\u003c/td>\u003ctd>4\u003c/td>\u003ctd>\u003cb>720°\u003c/b>\u003c/td>\u003ctd>120°\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8\u003c/td>\u003ctd>6\u003c/td>\u003ctd>1080°\u003c/td>\u003ctd>135°\u003c/td>\u003c/tr>\u003c/table>\u003cp style='margin:4px 0'>\u003cb>Regular\u003c/b> = all sides equal and all angles equal.\u003c/p>\u003cp style='margin:4px 0'>\u003cb>Why 6 sides → 4 triangles?\u003c/b> The orange corner cannot draw a line to itself or to its 2 neighbours. That leaves 3 blue lines, which make 4 triangles.\u003c/p>", "rule": "Sum of the inside angles = (n − 2) × 180°\u003cbr>Regular shape: each angle = sum ÷ n", "first": "Count the sides, n. Write (n − 2) × 180 straight away.", "ex": {"q": "A hexagon has four angles of 100° each. The other two angles are equal. Find one of them.", "steps": ["Sum = (6 − 2) × 180 = \u003cb>720°\u003c/b>", "Four known angles: 4 × 100 = 400", "Left for the two: 720 − 400 = 320 → each = 320 ÷ 2 = \u003cb>160°\u003c/b>", "Check: 400 + 160 + 160 = 720 ✅"]}, "ex2": {"q": "Each angle of a regular polygon is 140°. How many sides does it have?", "steps": ["Sum = (n − 2) × 180 and also sum = 140 × n", "180n − 360 = 140n → 40n = 360", "n = \u003cb>9\u003c/b>", "Check: (9 − 2) × 180 = 1260 and 9 × 140 = 1260 ✅"]}, "warn": "Doubling the sides does \u003cb>not\u003c/b> double the sum. 4 sides: 360°. 8 sides: (8 − 2) × 180 = \u003cb>1080°\u003c/b>, not 720°.", "tip": "Shortcut for regular shapes: each outside angle (180° − inside angle) is 360 ÷ n. Octagon: 360 ÷ 8 = 45 → inside = 180 − 45 = 135°.", "page": 12, "n": 10, "hard": 6}], "rare": [{"key": "inscribed", "name": "A shape drawn inside another", "hint": "circle inside a square: side = diameter = 2 × radius", "page": 13, "n": 9}, {"key": "crossangles", "name": "Angles on lines and crossings", "hint": "a straight line is 180°; opposite angles at a crossing are equal", "page": 10, "n": 8}, {"key": "areas", "name": "Comparing two areas", "hint": "same base and same height give the same triangle area", "page": 14, "n": 8}, {"key": "perim", "name": "Perimeter (the length all around)", "hint": "count only the outside edges, not the inside ones", "page": 14, "n": 6}, {"key": "accumarea", "name": "Area of a step-shaped figure", "hint": "cut it into rectangles and add their areas", "page": 14, "n": 2}, {"key": "obtuse", "name": "Is the biggest angle over 90°?", "hint": "compare longest² with the sum of the other two squares", "page": 11, "n": 2}, {"key": "bisect", "name": "Angle bisectors (cutting angles in half)", "hint": "half of each part adds to half of the total", "page": 10, "n": 2}, {"key": "mid", "name": "Midpoints of two triangle sides", "hint": "the line joining the midpoints is half the third side", "page": 11, "n": 1}, {"key": "pyramid", "name": "Height of a pyramid", "hint": "right triangle: tip, centre of the base, one corner", "page": 14, "n": 1}]}, {"s": "coord", "name": "Coordinate Geometry", "short": "Coordinate", "common": [{"key": "lines", "name": "Lines and slope", "spot": "The question says \u003cb>\"line\"\u003c/b>, \u003cb>\"slope\"\u003c/b>, \u003cb>\"passes through the points\"\u003c/b>, \u003cb>\"x-intercept\"\u003c/b>, \u003cb>\"y-intercept\"\u003c/b> or shows \u003cb>y = …x + …\u003c/b> or \u003cb>4x + 3y = 24\u003c/b>.", "easy": "\u003csvg viewBox=\"0 0 320 245\" aria-hidden=\"true\">\u003cg stroke=\"#e3e7ea\" stroke-width=\"1\">\u003cline x1=\"40\" y1=\"30\" x2=\"40\" y2=\"230\"/>\u003cline x1=\"60\" y1=\"30\" x2=\"60\" y2=\"230\"/>\u003cline x1=\"80\" y1=\"30\" x2=\"80\" y2=\"230\"/>\u003cline x1=\"100\" y1=\"30\" x2=\"100\" y2=\"230\"/>\u003cline x1=\"120\" y1=\"30\" x2=\"120\" y2=\"230\"/>\u003cline x1=\"140\" y1=\"30\" x2=\"140\" y2=\"230\"/>\u003cline x1=\"160\" y1=\"30\" x2=\"160\" y2=\"230\"/>\u003cline x1=\"180\" y1=\"30\" x2=\"180\" y2=\"230\"/>\u003cline x1=\"200\" y1=\"30\" x2=\"200\" y2=\"230\"/>\u003cline x1=\"220\" y1=\"30\" x2=\"220\" y2=\"230\"/>\u003cline x1=\"240\" y1=\"30\" x2=\"240\" y2=\"230\"/>\u003cline x1=\"260\" y1=\"30\" x2=\"260\" y2=\"230\"/>\u003cline x1=\"280\" y1=\"30\" x2=\"280\" y2=\"230\"/>\u003cline x1=\"300\" y1=\"30\" x2=\"300\" y2=\"230\"/>\u003cline x1=\"40\" y1=\"230\" x2=\"300\" y2=\"230\"/>\u003cline x1=\"40\" y1=\"210\" x2=\"300\" y2=\"210\"/>\u003cline x1=\"40\" y1=\"190\" x2=\"300\" y2=\"190\"/>\u003cline x1=\"40\" y1=\"170\" x2=\"300\" y2=\"170\"/>\u003cline x1=\"40\" y1=\"150\" x2=\"300\" y2=\"150\"/>\u003cline x1=\"40\" y1=\"130\" x2=\"300\" y2=\"130\"/>\u003cline x1=\"40\" y1=\"110\" x2=\"300\" y2=\"110\"/>\u003cline x1=\"40\" y1=\"90\" x2=\"300\" y2=\"90\"/>\u003cline x1=\"40\" y1=\"70\" x2=\"300\" y2=\"70\"/>\u003cline x1=\"40\" y1=\"50\" x2=\"300\" y2=\"50\"/>\u003cline x1=\"40\" y1=\"30\" x2=\"300\" y2=\"30\"/>\u003c/g>\u003cline x1=\"40\" y1=\"190\" x2=\"300\" y2=\"190\" stroke=\"#1b2430\" stroke-width=\"2\"/>\u003cline x1=\"60\" y1=\"30\" x2=\"60\" y2=\"230\" stroke=\"#1b2430\" stroke-width=\"2\"/>\u003ctext x=\"304\" y=\"194\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\">x\u003c/text>\u003ctext x=\"56\" y=\"24\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\">y\u003c/text>\u003cline x1=\"53.3\" y1=\"230.0\" x2=\"122.0\" y2=\"24.0\" stroke=\"#1e6f9f\" stroke-width=\"3\"/>\u003cline x1=\"80\" y1=\"150\" x2=\"120\" y2=\"150\" stroke=\"#2e7a57\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/>\u003cline x1=\"120\" y1=\"150\" x2=\"120\" y2=\"30\" stroke=\"#b23a2a\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/>\u003ccircle cx=\"80\" cy=\"150\" r=\"5\" fill=\"#1b2430\"/>\u003ccircle cx=\"120\" cy=\"30\" r=\"5\" fill=\"#1b2430\"/>\u003ccircle cx=\"60\" cy=\"210\" r=\"5\" fill=\"#9c6510\"/>\u003ctext x=\"54\" y=\"154\" font-family=\"Arial\" font-size=\"13\" text-anchor=\"end\" fill=\"#1b2430\">(1, 2)\u003c/text>\u003ctext x=\"128\" y=\"34\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\">(3, 8)\u003c/text>\u003ctext x=\"88\" y=\"168\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#2e7a57\">2 right\u003c/text>\u003ctext x=\"126\" y=\"96\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#b23a2a\">6 up\u003c/text>\u003ctext x=\"70\" y=\"214\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#9c6510\">(0, −1)\u003c/text>\u003ctext x=\"170\" y=\"74\" font-family=\"Arial\" font-size=\"15\" font-weight=\"700\" fill=\"#1e6f9f\">slope = 6 ÷ 2 = 3\u003c/text>\u003ctext x=\"170\" y=\"98\" font-family=\"Arial\" font-size=\"15\" font-weight=\"700\" fill=\"#1e6f9f\">y = 3x − 1\u003c/text>\u003c/svg>\u003cp style=\"margin:4px 0\">First, the words:\u003c/p>\u003cul style=\"margin:4px 0;padding-left:20px\">\u003cli>The \u003cb>x-axis\u003c/b> = the flat black line. The \u003cb>y-axis\u003c/b> = the standing black line. They cross at (0, 0).\u003c/li>\u003cli>\u003cb>Coordinates\u003c/b> (x, y) = the address of a point: x steps right, then y steps up from (0, 0).\u003c/li>\u003c/ul>\u003cp style=\"margin:4px 0\">Now the picture. The \u003cb>blue line\u003c/b> goes through the two black dots, (1, 2) and (3, 8).\u003c/p>\u003cul style=\"margin:4px 0;padding-left:20px\">\u003cli>Start at (1, 2). The \u003cb>green dashed line\u003c/b> is \u003cb>2 steps right\u003c/b>. The \u003cb>red dashed line\u003c/b> is \u003cb>6 steps up\u003c/b>. You reach (3, 8).\u003c/li>\u003cli>\u003cb>Slope\u003c/b> = steps up for 1 step right. 6 up for 2 right → 6 ÷ 2 = \u003cb>3\u003c/b>.\u003c/li>\u003cli>\u003cb>y-intercept\u003c/b> = where the blue line crosses the y-axis: the \u003cb>orange dot\u003c/b>, at y = \u003cb>−1\u003c/b>.\u003c/li>\u003cli>\u003cb>x-intercept\u003c/b> = where a line crosses the x-axis. There, y = 0.\u003c/li>\u003c/ul>\u003cp style=\"margin:4px 0\">\u003cb>Why 2 and 6?\u003c/b> Right: 3 − 1 = 2. Up: 8 − 2 = 6.\u003c/p>", "rule": "slope = up ÷ right = (y₂ − y₁) ÷ (x₂ − x₁)\u003cbr>line: y = (slope) × x + (y-intercept)\u003cbr>x-intercept: put y = 0 · y-intercept: put x = 0", "first": "Two points given? Find the slope first. Then put one point into y = slope × x + b to find b (the y-intercept). Asked for an intercept? Put the \u003cb>other\u003c/b> letter = 0.", "ex": {"q": "A line goes through (1, 2) and (3, 8). Where does it cross the y-axis?", "steps": ["Up: 8 − 2 = 6. Right: 3 − 1 = 2.", "Slope = 6 ÷ 2 = \u003cb>3\u003c/b>, so y = 3x + b", "Put in the point (1, 2): 2 = 3 × 1 + b → b = 2 − 3 = \u003cb>−1\u003c/b>", "The line is y = 3x − 1. It crosses at \u003cb>(0, −1)\u003c/b> ✅ (the orange dot)\u003cbr>Check (3, 8): 3 × 3 − 1 = 8 ✅"]}, "ex2": {"q": "What is the x-intercept of the line 2x + 5y = 20?", "steps": ["On the x-axis, y = 0.", "2x + 5 × 0 = 20 → 2x = 20", "x = 20 ÷ 2 = \u003cb>10\u003c/b>. The line crosses the x-axis at \u003cb>(10, 0)\u003c/b> ✅", "Check: 2 × 10 + 5 × 0 = 20 ✅"]}, "warn": "Subtract in the \u003cb>same order\u003c/b> on top and bottom: (8 − 2) ÷ (3 − 1) = 3. Mixed order, (2 − 8) ÷ (3 − 1) = −3, gives the wrong sign.", "tip": "Uphill line (going right) → slope is positive. Downhill → negative. Flat → 0. The line y = −x goes through (0, 0) and drops 1 step for every 1 step right.", "page": 15, "n": 37, "hard": 19}, {"key": "coord", "name": "Points and shapes on the grid (distance, midpoint)", "spot": "The question gives points like \u003cb>(2, 1)\u003c/b> and \u003cb>(5, 5)\u003c/b> and asks for a \u003cb>\"distance\"\u003c/b>, \u003cb>\"midpoint\"\u003c/b>, \u003cb>\"length\"\u003c/b>, \u003cb>\"slope of the line containing the points\"\u003c/b>, or the \u003cb>area\u003c/b> of a shape drawn \u003cb>\"in the xy-plane\"\u003c/b>.", "easy": "\u003csvg viewBox=\"0 0 320 222\" aria-hidden=\"true\">\u003cg stroke=\"#e3e7ea\" stroke-width=\"1\">\u003cline x1=\"40\" y1=\"20\" x2=\"40\" y2=\"200\"/>\u003cline x1=\"70\" y1=\"20\" x2=\"70\" y2=\"200\"/>\u003cline x1=\"100\" y1=\"20\" x2=\"100\" y2=\"200\"/>\u003cline x1=\"130\" y1=\"20\" x2=\"130\" y2=\"200\"/>\u003cline x1=\"160\" y1=\"20\" x2=\"160\" y2=\"200\"/>\u003cline x1=\"190\" y1=\"20\" x2=\"190\" y2=\"200\"/>\u003cline x1=\"220\" y1=\"20\" x2=\"220\" y2=\"200\"/>\u003cline x1=\"40\" y1=\"200\" x2=\"220\" y2=\"200\"/>\u003cline x1=\"40\" y1=\"170\" x2=\"220\" y2=\"170\"/>\u003cline x1=\"40\" y1=\"140\" x2=\"220\" y2=\"140\"/>\u003cline x1=\"40\" y1=\"110\" x2=\"220\" y2=\"110\"/>\u003cline x1=\"40\" y1=\"80\" x2=\"220\" y2=\"80\"/>\u003cline x1=\"40\" y1=\"50\" x2=\"220\" y2=\"50\"/>\u003cline x1=\"40\" y1=\"20\" x2=\"220\" y2=\"20\"/>\u003c/g>\u003cline x1=\"40\" y1=\"200\" x2=\"220\" y2=\"200\" stroke=\"#1b2430\" stroke-width=\"2\"/>\u003cline x1=\"40\" y1=\"20\" x2=\"40\" y2=\"200\" stroke=\"#1b2430\" stroke-width=\"2\"/>\u003ctext x=\"224\" y=\"204\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\">x\u003c/text>\u003ctext x=\"36\" y=\"14\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\">y\u003c/text>\u003ctext x=\"70\" y=\"216\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\" fill=\"#4a5866\">1\u003c/text>\u003ctext x=\"100\" y=\"216\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\" fill=\"#4a5866\">2\u003c/text>\u003ctext x=\"130\" y=\"216\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\" fill=\"#4a5866\">3\u003c/text>\u003ctext x=\"160\" y=\"216\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\" fill=\"#4a5866\">4\u003c/text>\u003ctext x=\"190\" y=\"216\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\" fill=\"#4a5866\">5\u003c/text>\u003ctext x=\"220\" y=\"216\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\" fill=\"#4a5866\">6\u003c/text>\u003ctext x=\"33\" y=\"174\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"end\" fill=\"#4a5866\">1\u003c/text>\u003ctext x=\"33\" y=\"144\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"end\" fill=\"#4a5866\">2\u003c/text>\u003ctext x=\"33\" y=\"114\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"end\" fill=\"#4a5866\">3\u003c/text>\u003ctext x=\"33\" y=\"84\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"end\" fill=\"#4a5866\">4\u003c/text>\u003ctext x=\"33\" y=\"54\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"end\" fill=\"#4a5866\">5\u003c/text>\u003ctext x=\"33\" y=\"24\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"end\" fill=\"#4a5866\">6\u003c/text>\u003ctext x=\"33\" y=\"216\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"end\" fill=\"#4a5866\">0\u003c/text>\u003cline x1=\"100\" y1=\"170\" x2=\"190\" y2=\"50\" stroke=\"#1e6f9f\" stroke-width=\"3\"/>\u003cline x1=\"100\" y1=\"170\" x2=\"190\" y2=\"170\" stroke=\"#2e7a57\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/>\u003cline x1=\"190\" y1=\"170\" x2=\"190\" y2=\"50\" stroke=\"#b23a2a\" stroke-width=\"3\" stroke-dasharray=\"6 4\"/>\u003cpath d=\"M180 170 V160 H190\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"1.5\"/>\u003ccircle cx=\"100\" cy=\"170\" r=\"5\" fill=\"#1b2430\"/>\u003ccircle cx=\"190\" cy=\"50\" r=\"5\" fill=\"#1b2430\"/>\u003ccircle cx=\"145.0\" cy=\"110\" r=\"5\" fill=\"#9c6510\"/>\u003ctext x=\"91\" y=\"174\" font-family=\"Arial\" font-size=\"13\" text-anchor=\"end\" fill=\"#1b2430\">(2, 1)\u003c/text>\u003ctext x=\"199\" y=\"54\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\">(5, 5)\u003c/text>\u003ctext x=\"145.0\" y=\"188\" font-family=\"Arial\" font-size=\"13\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#2e7a57\">3 right\u003c/text>\u003ctext x=\"199\" y=\"114.0\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#b23a2a\">4 up\u003c/text>\u003ctext x=\"136.0\" y=\"112\" font-family=\"Arial\" font-size=\"13\" text-anchor=\"end\" font-weight=\"700\" fill=\"#9c6510\">(3.5, 3)\u003c/text>\u003ctext x=\"316\" y=\"128\" font-family=\"Arial\" font-size=\"13\" text-anchor=\"end\" font-weight=\"700\" fill=\"#1e6f9f\">blue line\u003c/text>\u003ctext x=\"316\" y=\"146\" font-family=\"Arial\" font-size=\"13\" text-anchor=\"end\" font-weight=\"700\" fill=\"#1e6f9f\">= √(9 + 16)\u003c/text>\u003ctext x=\"316\" y=\"164\" font-family=\"Arial\" font-size=\"13\" text-anchor=\"end\" font-weight=\"700\" fill=\"#1e6f9f\">= √25 = 5\u003c/text>\u003c/svg>\u003cp style=\"margin:4px 0\">The \u003cb>x-axis\u003c/b> is the flat black line, the \u003cb>y-axis\u003c/b> the standing black line. A point's \u003cb>coordinates\u003c/b> (x, y) say: x steps right, then y steps up.\u003c/p>\u003cul style=\"margin:4px 0;padding-left:20px\">\u003cli>The \u003cb>blue line\u003c/b> joins the black dots (2, 1) and (5, 5).\u003c/li>\u003cli>The \u003cb>green dashed line\u003c/b> is \u003cb>3 steps right\u003c/b>. The \u003cb>red dashed line\u003c/b> is \u003cb>4 steps up\u003c/b>. They meet in a square corner (90°).\u003c/li>\u003cli>\u003cb>Distance\u003c/b> = the length of the blue line. Green, red and blue make a right triangle, so blue² = 3² + 4² = 9 + 16 = 25 → blue = \u003cb>5\u003c/b>.\u003c/li>\u003cli>\u003cb>Midpoint\u003c/b> = the point exactly halfway along the blue line: the \u003cb>orange dot\u003c/b>. Its x is halfway between 2 and 5 = \u003cb>3.5\u003c/b>. Its y is halfway between 1 and 5 = \u003cb>3\u003c/b>.\u003c/li>\u003c/ul>\u003cp style=\"margin:4px 0\">\u003cb>Why 3 and 4?\u003c/b> Right: 5 − 2 = 3. Up: 5 − 1 = 4. \u003cb>Why 3.5?\u003c/b> (2 + 5) ÷ 2 = 3.5.\u003c/p>", "rule": "distance = √(right² + up²) = √((x₂ − x₁)² + (y₂ − y₁)²)\u003cbr>midpoint = ((x₁ + x₂) ÷ 2, (y₁ + y₂) ÷ 2)", "first": "Draw the two points on a small grid. Draw the \u003cb>right\u003c/b> step and the \u003cb>up\u003c/b> step between them, and write both numbers.", "ex": {"q": "Point P is (−1, 2) and point Q is (5, 10). What is the distance from P to Q, and what is the midpoint?", "steps": ["Right: 5 − (−1) = 5 + 1 = \u003cb>6\u003c/b>. Up: 10 − 2 = \u003cb>8\u003c/b>.", "Distance = √(6² + 8²) = √(36 + 64) = √100 = \u003cb>10\u003c/b>", "Midpoint: x = (−1 + 5) ÷ 2 = 2, y = (2 + 10) ÷ 2 = 6 → \u003cb>(2, 6)\u003c/b>", "Check: P to (2, 6) is 3 right, 4 up → √(9 + 16) = 5 = half of 10 ✅"]}, "ex2": {"q": "A triangle has corners (0, 0), (6, 0) and (2, 4). What is its area?", "steps": ["The \u003cb>base\u003c/b> lies on the x-axis, from 0 to 6: base = \u003cb>6\u003c/b>.", "The \u003cb>height\u003c/b> = how far up the top corner (2, 4) is: \u003cb>4\u003c/b>.", "Area = ½ × base × height = ½ × 6 × 4 = \u003cb>12\u003c/b> ✅", "Check: the box around it is 6 × 4 = 24; the triangle is half of that ✅"]}, "warn": "Square \u003cb>before\u003c/b> you add. Right 3 and up 4 is \u003cb>not\u003c/b> 3 + 4 = 7. It is √(9 + 16) = \u003cb>5\u003c/b>. And mind the minus signs: from x = −1 to x = 5 is 6 steps, not 4.", "tip": "Letters instead of numbers? Same rules. Points (2a, a) and (4a, 5a): slope (= up ÷ right) = (5a − a) ÷ (4a − 2a) = 4a ÷ 2a = \u003cb>2\u003c/b>. The a cancels. Also learn the right triangles with sides 3, 4, 5 and 6, 8, 10: they come up a lot.", "page": 15, "n": 37, "hard": 23}], "rare": [{"key": "locus", "name": "Points and circles (no numbers)", "hint": "draw it; the longest line across a circle goes through the centre", "page": 13, "n": 14}, {"key": "locus2", "name": "Points at given distances", "hint": "fixed distance from a point = circle; from a line = two lines", "page": 13, "n": 1}]}, {"s": "di", "name": "Data Interpretation", "short": "Data Interp.", "common": [{"key": "chart", "name": "Reading a graph or table", "spot": "The question shows a \u003cb>bar graph\u003c/b>, \u003cb>line graph\u003c/b>, \u003cb>table\u003c/b> or \u003cb>pie\u003c/b>, and asks \u003cb>\"how many\"\u003c/b>, \u003cb>\"approximately\"\u003c/b> or \u003cb>\"what percent\"\u003c/b>.", "easy": "\u003csvg viewBox=\"0 0 320 194\" aria-hidden=\"true\">\u003ctext x=\"160\" y=\"16\" font-family=\"Arial\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1b2430\" font-weight=\"700\">Calls per day\u003c/text>\u003cline x1=\"40\" y1=\"130\" x2=\"300\" y2=\"130\" stroke=\"#e3e7ea\" stroke-width=\"1\"/>\u003ctext x=\"34\" y=\"134\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"end\" fill=\"#4a5866\">10\u003c/text>\u003cline x1=\"40\" y1=\"90\" x2=\"300\" y2=\"90\" stroke=\"#e3e7ea\" stroke-width=\"1\"/>\u003ctext x=\"34\" y=\"94\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"end\" fill=\"#4a5866\">20\u003c/text>\u003cline x1=\"40\" y1=\"50\" x2=\"300\" y2=\"50\" stroke=\"#e3e7ea\" stroke-width=\"1\"/>\u003ctext x=\"34\" y=\"54\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"end\" fill=\"#4a5866\">30\u003c/text>\u003ctext x=\"34\" y=\"174\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"end\" fill=\"#4a5866\">0\u003c/text>\u003crect x=\"55\" y=\"90\" width=\"30\" height=\"80\" fill=\"#1e6f9f\"/>\u003ctext x=\"70\" y=\"187\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\" fill=\"#4a5866\">Mon\u003c/text>\u003crect x=\"105\" y=\"50\" width=\"30\" height=\"120\" fill=\"#1e6f9f\"/>\u003ctext x=\"120\" y=\"187\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\" fill=\"#4a5866\">Tue\u003c/text>\u003crect x=\"155\" y=\"70\" width=\"30\" height=\"100\" fill=\"#1e6f9f\"/>\u003ctext x=\"170\" y=\"187\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\" fill=\"#4a5866\">Wed\u003c/text>\u003crect x=\"205\" y=\"110\" width=\"30\" height=\"60\" fill=\"#b23a2a\"/>\u003ctext x=\"220\" y=\"187\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\" fill=\"#b23a2a\" font-weight=\"700\">Thu\u003c/text>\u003crect x=\"255\" y=\"130\" width=\"30\" height=\"40\" fill=\"#1e6f9f\"/>\u003ctext x=\"270\" y=\"187\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\" fill=\"#4a5866\">Fri\u003c/text>\u003cline x1=\"40\" y1=\"110\" x2=\"205\" y2=\"110\" stroke=\"#b23a2a\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/>\u003ctext x=\"34\" y=\"114\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"end\" fill=\"#b23a2a\" font-weight=\"700\">15\u003c/text>\u003cline x1=\"40\" y1=\"40\" x2=\"40\" y2=\"170\" stroke=\"#1b2430\" stroke-width=\"2\"/>\u003cline x1=\"40\" y1=\"170\" x2=\"300\" y2=\"170\" stroke=\"#1b2430\" stroke-width=\"2\"/>\u003ctext x=\"8\" y=\"36\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">calls\u003c/text>\u003c/svg>\u003cp style=\"margin:4px 0\">Each bar is one day. How \u003cb>tall\u003c/b> the bar is = how many calls.\u003c/p>\u003ctable>\u003ctr>\u003cth>Step\u003c/th>\u003cth>What you do\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1. Title\u003c/td>\u003ctd>What is counted? \u003cb>Calls per day\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2. Left scale\u003c/td>\u003ctd>0, 10, 20, 30 calls\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3. One bar\u003c/td>\u003ctd>From the top of the red bar, go \u003cb>straight left\u003c/b> → \u003cb>15\u003c/b>\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why 15?\u003c/b> The top of the red bar is halfway between 10 and 20.\u003c/p>", "rule": "Read the \u003cb>title\u003c/b>, the \u003cb>units\u003c/b> and the \u003cb>key\u003c/b> before any number.\u003cbr>Slice of a pie = (part ÷ total) × 360°", "first": "Write only the numbers you need, with labels: \u003cb>Thu = 15\u003c/b>, \u003cb>total = 100\u003c/b>.", "ex": {"q": "The calls in the chart above are shown again as a pie chart. What is the angle of Thursday's slice?", "steps": ["Total: 20 + 30 + 25 + 15 + 10 = \u003cb>100\u003c/b> calls", "Thursday's share: 15 ÷ 100 = \u003cb>0.15\u003c/b>", "A whole circle is 360°, so the angle = 0.15 × 360 = \u003cb>54°\u003c/b> ✅", "Check: all five slices 72 + 108 + 90 + 54 + 36 = 360 ✅"]}, "warn": "A bigger percent can be \u003cb>fewer\u003c/b> people. 50% of 200 = \u003cb>100\u003c/b>, but 30% of 400 = \u003cb>120\u003c/b>. Multiply before you compare.", "tip": "“Approximately” in the question? Round the numbers (98 → 100) and pick the closest answer. No long sums needed.", "page": 17, "n": 74, "hard": 1}, {"key": "piebase", "name": "A percent of a percent (shares inside shares)", "spot": "The question says \u003cb>\"of the remaining\"\u003c/b>, \u003cb>\"of those\"\u003c/b>, \u003cb>\"half of the …\"\u003c/b> or \u003cb>\"r percent of s percent of …\"\u003c/b>.", "easy": "\u003csvg viewBox=\"0 0 320 170\" aria-hidden=\"true\">\u003cpath d=\"M80,85 L80.0,15.0 A70,70 0 0 1 146.6,106.6 Z\" fill=\"#b23a2a\" stroke=\"#ffffff\" stroke-width=\"2\"/>\u003cpath d=\"M80,85 L146.6,106.6 A70,70 0 0 1 38.9,141.6 Z\" fill=\"#1e6f9f\" stroke=\"#ffffff\" stroke-width=\"2\"/>\u003cpath d=\"M80,85 L38.9,141.6 A70,70 0 0 1 80.0,15.0 Z\" fill=\"#c9d0d6\" stroke=\"#ffffff\" stroke-width=\"2\"/>\u003ctext x=\"110\" y=\"67\" font-family=\"Arial\" font-size=\"14\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">30%\u003c/text>\u003ctext x=\"84\" y=\"129\" font-family=\"Arial\" font-size=\"14\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">30%\u003c/text>\u003ctext x=\"44\" y=\"79\" font-family=\"Arial\" font-size=\"14\" text-anchor=\"middle\" fill=\"#1b2430\" font-weight=\"700\">40%\u003c/text>\u003crect x=\"174\" y=\"29\" width=\"13\" height=\"13\" fill=\"#b23a2a\"/>\u003ctext x=\"194\" y=\"40\" font-family=\"Arial\" font-size=\"13\" fill=\"#b23a2a\" font-weight=\"700\">football 30%\u003c/text>\u003crect x=\"174\" y=\"55\" width=\"13\" height=\"13\" fill=\"#1e6f9f\"/>\u003ctext x=\"194\" y=\"66\" font-family=\"Arial\" font-size=\"13\" fill=\"#1e6f9f\" font-weight=\"700\">other sport 30%\u003c/text>\u003crect x=\"174\" y=\"81\" width=\"13\" height=\"13\" fill=\"#c9d0d6\"/>\u003ctext x=\"194\" y=\"92\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\" font-weight=\"700\">no sport 40%\u003c/text>\u003ctext x=\"174\" y=\"126\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" font-weight=\"700\">red + blue = sport\u003c/text>\u003ctext x=\"174\" y=\"144\" font-family=\"Arial\" font-size=\"13\" fill=\"#1b2430\" font-weight=\"700\">= 60% of students\u003c/text>\u003c/svg>\u003cp style=\"margin:4px 0\">60% of students play a sport. \u003cb>Half of those\u003c/b> play football.\u003c/p>\u003ctable>\u003ctr>\u003cth>Group\u003c/th>\u003cth>Share of all students\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Play a sport (red + blue)\u003c/td>\u003ctd>\u003cb>60%\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Football (red)\u003c/td>\u003ctd>½ of 60% = 0.5 × 0.6 = \u003cb>30%\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>No sport (grey)\u003c/td>\u003ctd>100% − 60% = \u003cb>40%\u003c/b>\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why 60% → 30%?\u003c/b> Football is half of the sport part, not half of the whole pie.\u003c/p>", "rule": "A part of a part: \u003cb>multiply\u003c/b> the two shares.\u003cbr>½ of 60% = 0.5 × 0.6 = 0.3 = 30% of the whole", "first": "Find each \u003cb>“of”\u003c/b>. Write what it is a part of, e.g. “2/3 \u003cb>of the other cars\u003c/b>”.", "ex": {"q": "Of the cars in a lot, 1/4 are red. Of the other cars, 2/3 are white. What fraction of all the cars are white?", "steps": ["Other cars: 1 − 1/4 = \u003cb>3/4\u003c/b> of all", "White: 2/3 of 3/4 = 2/3 × 3/4 = 6/12 = \u003cb>1/2\u003c/b> of all ✅", "Check with 12 cars: 3 red, 9 others. 2/3 of 9 = 6 white. 6 out of 12 = 1/2 ✅"]}, "warn": "The 2/3 is of the \u003cb>other\u003c/b> cars, not of all cars. 2/3 of all 12 cars would be 8 white cars. Wrong.", "tip": "Pick a total that every bottom number divides into (12 for quarters and thirds). Then just count. For letters: x% of y% of N = x × y × N ÷ 10,000.", "page": 16, "n": 18, "hard": 6}, {"key": "readbars", "name": "Bars side by side (read the key first)", "spot": "The chart has \u003cb>two or more bars in each group\u003c/b> and a \u003cb>key\u003c/b> (legend) like \u003cb>“blue = 2010, green = 2020”\u003c/b>. The question names a year or a group.", "easy": "\u003csvg viewBox=\"0 0 320 206\" aria-hidden=\"true\">\u003crect x=\"40\" y=\"6\" width=\"13\" height=\"13\" fill=\"#1e6f9f\"/>\u003ctext x=\"59\" y=\"17\" font-family=\"Arial\" font-size=\"13\" fill=\"#1e6f9f\" font-weight=\"700\">2010\u003c/text>\u003crect x=\"110\" y=\"6\" width=\"13\" height=\"13\" fill=\"#2e7a57\"/>\u003ctext x=\"129\" y=\"17\" font-family=\"Arial\" font-size=\"13\" fill=\"#2e7a57\" font-weight=\"700\">2020\u003c/text>\u003ctext x=\"190\" y=\"17\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">← the key\u003c/text>\u003cline x1=\"40\" y1=\"142\" x2=\"310\" y2=\"142\" stroke=\"#e3e7ea\" stroke-width=\"1\"/>\u003ctext x=\"34\" y=\"146\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"end\" fill=\"#4a5866\">20\u003c/text>\u003cline x1=\"40\" y1=\"102\" x2=\"310\" y2=\"102\" stroke=\"#e3e7ea\" stroke-width=\"1\"/>\u003ctext x=\"34\" y=\"106\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"end\" fill=\"#4a5866\">40\u003c/text>\u003cline x1=\"40\" y1=\"62\" x2=\"310\" y2=\"62\" stroke=\"#e3e7ea\" stroke-width=\"1\"/>\u003ctext x=\"34\" y=\"66\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"end\" fill=\"#4a5866\">60\u003c/text>\u003ctext x=\"34\" y=\"186\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"end\" fill=\"#4a5866\">0\u003c/text>\u003crect x=\"67\" y=\"102\" width=\"26\" height=\"80\" fill=\"#1e6f9f\"/>\u003crect x=\"97\" y=\"82\" width=\"26\" height=\"100\" fill=\"#2e7a57\"/>\u003ctext x=\"80\" y=\"97\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1e6f9f\" font-weight=\"700\">40\u003c/text>\u003ctext x=\"110\" y=\"77\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7a57\" font-weight=\"700\">50\u003c/text>\u003ctext x=\"95\" y=\"199\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1b2430\">City A\u003c/text>\u003crect x=\"147\" y=\"122\" width=\"26\" height=\"60\" fill=\"#1e6f9f\"/>\u003crect x=\"177\" y=\"134\" width=\"26\" height=\"48\" fill=\"#2e7a57\"/>\u003ctext x=\"160\" y=\"117\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1e6f9f\" font-weight=\"700\">30\u003c/text>\u003ctext x=\"190\" y=\"129\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7a57\" font-weight=\"700\">24\u003c/text>\u003ctext x=\"175\" y=\"199\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1b2430\">City B\u003c/text>\u003crect x=\"227\" y=\"62\" width=\"26\" height=\"120\" fill=\"#1e6f9f\"/>\u003crect x=\"257\" y=\"80\" width=\"26\" height=\"102\" fill=\"#2e7a57\"/>\u003ctext x=\"240\" y=\"57\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1e6f9f\" font-weight=\"700\">60\u003c/text>\u003ctext x=\"270\" y=\"75\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\" fill=\"#2e7a57\" font-weight=\"700\">51\u003c/text>\u003ctext x=\"255\" y=\"199\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\" fill=\"#1b2430\">City C\u003c/text>\u003cline x1=\"40\" y1=\"40\" x2=\"40\" y2=\"182\" stroke=\"#1b2430\
