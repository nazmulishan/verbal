<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRE Question Types</title><meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--paper:#f6f4ee;--panel:#fff;--ink:#1b2430;--ink-2:#4a5866;--ink-3:#7e8c92;--line:#d9dee3;--line-2:#c9d0d6;--blue:#1e6f9f;--green:#2e7a57;--on-accent:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F1519;--panel:#161E23;--ink:#E7EBE6;--ink-2:#AAB4B8;--ink-3:#7E8C92;--line:#2A343A;--line-2:#3A464D;--blue:#5FB2DE;--green:#67C293;--on-accent:#0F1519;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0F1519;--panel:#161E23;--ink:#E7EBE6;--ink-2:#AAB4B8;--ink-3:#7E8C92;--line:#2A343A;--line-2:#3A464D;--blue:#5FB2DE;--green:#67C293;--on-accent:#0F1519;color-scheme:dark}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Georgia,serif}
main{max-width:680px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font:700 26px/1.2 Arial,sans-serif;margin:6px 0 6px}
.dek{color:var(--ink-2);margin:0 0 6px}

.qt-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 14px}
.qt-tab{font:600 13.5px/1.2 Archivo,system-ui,Arial,sans-serif;border-radius:999px;padding:7px 13px;border:1px solid var(--line-2,#c9d0d6);background:var(--panel,#fff);color:var(--ink,#1b2430);cursor:pointer}
.qt-tab[aria-pressed="true"]{background:var(--blue,#1e6f9f);border-color:var(--blue,#1e6f9f);color:var(--on-accent,#fff)}
.qt-tab small{opacity:.75;font-weight:500}
.qt-lead{color:var(--ink-2,#4a5866);margin:0 0 10px;font-size:15px}
.qt-tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.qt-tools button{font:600 13px Arial,sans-serif;border:1px solid var(--line-2,#c9d0d6);background:var(--panel,#fff);color:var(--ink-2,#4a5866);border-radius:999px;padding:5px 12px;cursor:pointer}
.qt-card{border:1px solid var(--line,#d9dee3);border-left:5px solid var(--blue,#1e6f9f);border-radius:10px;background:var(--panel,#fff);margin:0 0 10px;max-width:640px}
.qt-card>summary{list-style:none;cursor:pointer;padding:11px 14px;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;align-items:center}
.qt-card>summary::-webkit-details-marker{display:none}
.qt-rank{font:700 12px Arial,sans-serif;background:var(--blue,#1e6f9f);color:var(--on-accent,#fff);border-radius:999px;padding:3px 9px;justify-self:start}
.qt-name{font:700 17px/1.25 Arial,sans-serif;color:var(--ink,#1b2430)}
.qt-sub{grid-column:2;font:13px Arial,sans-serif;color:var(--ink-2,#4a5866);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.qt-pb{display:inline-block;width:90px;height:6px;border-radius:9px;background:var(--line,#e3e7ea);overflow:hidden;vertical-align:middle}
.qt-pb i{display:block;height:100%;background:var(--green,#2e7a57)}
.qt-open{grid-column:2;font:600 13px Arial,sans-serif;color:var(--blue,#1e6f9f)}
.qt-card[open] .qt-open{display:none}
.qt-body{background:#fff;color:#1b2430;font:16px/1.55 Georgia,"Source Serif 4",serif;padding:4px 16px 16px;border-radius:0 0 10px 0}
.qt-body .l{display:block;font:700 11px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#1e6f9f;margin:10px 0 2px}
.qt-body .easy{background:#eef5fa;border-radius:8px;padding:8px 12px;margin:6px 0}
.qt-body table{border-collapse:collapse;font-size:14.5px;margin:6px 0;width:100%}
.qt-body td,.qt-body th{border-bottom:1px solid #d9dee3;padding:3px 6px;text-align:left;vertical-align:top}
.qt-body th{font:700 12px Arial,sans-serif;color:#4a5866}
.qt-body svg{display:block;width:100%;max-width:440px;height:auto;margin:6px auto}
.qt-body ul,.qt-body ol{margin:4px 0;padding-left:22px}
.qt-body p{margin:4px 0}
.qt-body .rule{font:700 16px/1.4 Arial,sans-serif;background:#fff;border:2px solid #1e6f9f;border-radius:8px;padding:7px 11px;margin:10px 0}
.qt-body .ex{border-left:3px solid #2e7a57;background:#f3f7f4;padding:7px 11px;border-radius:0 8px 8px 0;margin:8px 0}
.qt-body .ex>b:first-child{color:#2e7a57}
.qt-body .warn{background:#fbecea;border-radius:8px;padding:7px 11px;margin:8px 0}
.qt-body .tip{background:#fbf4e6;border-radius:8px;padding:7px 11px;margin:8px 0}
.qt-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.qt-b{font:600 14px Arial,sans-serif;border-radius:999px;padding:8px 14px;border:1px solid #1e6f9f;background:#1e6f9f;color:#fff;cursor:pointer}
.qt-b.alt{background:#fff;color:#1e6f9f}
.qt-b:focus-visible,.qt-tab:focus-visible,.qt-card>summary:focus-visible{outline:2px solid var(--blue,#1e6f9f);outline-offset:2px}
.qt-page{font:600 14px Arial,sans-serif;color:#1e6f9f;margin-top:10px}
.qt-rare{border:1px solid var(--line,#d9dee3);border-radius:10px;background:var(--panel,#fff);padding:8px 14px;max-width:640px;margin:14px 0 4px}
.qt-rare h4{margin:4px 0 6px;font:700 12px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2,#4a5866)}
.qt-rr{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;padding:6px 0;border-top:1px dotted var(--line-2,#d9dee3);font-size:15px;color:var(--ink,#1b2430)}
.qt-rr b{font-family:Arial,sans-serif}
.qt-rr .h{color:var(--ink-2,#4a5866)}
.qt-rr .n{font:12.5px Arial,sans-serif;color:var(--ink-3,#7e8c92)}
.qt-rr button{margin-left:auto;font:600 12.5px Arial,sans-serif;border:1px solid var(--blue,#1e6f9f);background:var(--panel,#fff);color:var(--blue,#1e6f9f);border-radius:999px;padding:3px 10px;cursor:pointer}
.qt-hl{animation:qthl 1.6s ease-out}
@keyframes qthl{0%{box-shadow:0 0 0 4px rgba(30,111,159,.45)}100%{box-shadow:0 0 0 0 rgba(30,111,159,0)}}

</style></head><body><main id="cqt">
<h1>GRE Question Types</h1>
<p class="dek">The 1,000 KMF problems sorted into 135 question types. The 49 common ones (about 8 out of 10 problems) each have an easy guide. The other 86 are rare, one line each. Pick a subject, then tap a type.</p>
<div class="qt-tabs" id="qtTabs" role="group" aria-label="Subject"></div>
<div id="qtHost"></div>
<script type="application/json" id="qt-data">{"kmf": false, "subjects": [{"s": "num", "name": "Numbers", "short": "Numbers", "common": [{"key": "count", "name": "Counting (how many numbers, how many ways)", "spot": "The question asks \u003cb>\"how many integers …\"\u003c/b>, says \u003cb>\"from … to …, inclusive\"\u003c/b>, \u003cb>\"multiples of …\"\u003c/b>, or \u003cb>\"how many different numbers can be formed\"\u003c/b> from some digits.", "easy": "\u003csvg viewBox=\"0 0 320 130\" aria-hidden=\"true\">\u003ctext x=\"8\" y=\"16\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\">Fence posts numbered 5 to 9\u003c/text>\u003cline x1=\"44\" y1=\"55\" x2=\"90\" y2=\"55\" stroke=\"#b23a2a\" stroke-width=\"3\"/>\u003cline x1=\"104\" y1=\"55\" x2=\"150\" y2=\"55\" stroke=\"#b23a2a\" stroke-width=\"3\"/>\u003cline x1=\"164\" y1=\"55\" x2=\"210\" y2=\"55\" stroke=\"#b23a2a\" stroke-width=\"3\"/>\u003cline x1=\"224\" y1=\"55\" x2=\"270\" y2=\"55\" stroke=\"#b23a2a\" stroke-width=\"3\"/>\u003crect x=\"30\" y=\"28\" width=\"14\" height=\"52\" rx=\"3\" fill=\"#1e6f9f\"/>\u003ctext x=\"37\" y=\"99\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" text-anchor=\"middle\" font-weight=\"700\">5\u003c/text>\u003crect x=\"90\" y=\"28\" width=\"14\" height=\"52\" rx=\"3\" fill=\"#1e6f9f\"/>\u003ctext x=\"97\" y=\"99\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" text-anchor=\"middle\" font-weight=\"700\">6\u003c/text>\u003crect x=\"150\" y=\"28\" width=\"14\" height=\"52\" rx=\"3\" fill=\"#1e6f9f\"/>\u003ctext x=\"157\" y=\"99\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" text-anchor=\"middle\" font-weight=\"700\">7\u003c/text>\u003crect x=\"210\" y=\"28\" width=\"14\" height=\"52\" rx=\"3\" fill=\"#1e6f9f\"/>\u003ctext x=\"217\" y=\"99\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" text-anchor=\"middle\" font-weight=\"700\">8\u003c/text>\u003crect x=\"270\" y=\"28\" width=\"14\" height=\"52\" rx=\"3\" fill=\"#1e6f9f\"/>\u003ctext x=\"277\" y=\"99\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" text-anchor=\"middle\" font-weight=\"700\">9\u003c/text>\u003ctext x=\"8\" y=\"122\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\">9 − 5 = \u003ctspan fill=\"#b23a2a\" font-weight=\"700\">4 gaps\u003c/tspan>, but there are \u003ctspan fill=\"#1e6f9f\" font-weight=\"700\">5 posts\u003c/tspan>\u003c/text>\u003c/svg>\u003cp style=\"margin:4px 0\">\u003cb>Inclusive\u003c/b> = both end numbers count. Counting 5 to 9 inclusive means counting the \u003cb>posts\u003c/b>, not the gaps.\u003c/p>\u003ctable>\u003ctr>\u003cth>Question\u003c/th>\u003cth>Work\u003c/th>\u003cth>Answer\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Whole numbers from 5 to 9\u003c/td>\u003ctd>9 − 5 + 1\u003c/td>\u003ctd>\u003cb>5\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Multiples of 5 (5, 10, 15 …) from 10 to 40\u003c/td>\u003ctd>(40 − 10) ÷ 5 + 1\u003c/td>\u003ctd>\u003cb>7\u003c/b>\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why + 1?\u003c/b> Subtracting counts the gaps. There is always one more post than gaps.\u003c/p>\u003cp style=\"margin:4px 0\">\u003cb>Counting ways:\u003c/b> 3 shirts and 2 hats make 3 × 2 = \u003cb>6\u003c/b> outfits. Every shirt goes with every hat, so you multiply.\u003c/p>", "rule": "Numbers in a range: (last − first) ÷ step + 1\u003cbr>Ways to fill places: multiply the choices for each place", "first": "Range: write the \u003cb>first\u003c/b> and \u003cb>last\u003c/b> number that really fit. Ways: draw one blank for each place, __ __ __, and write the number of choices on each.", "ex": {"q": "How many multiples of 3 are there from 10 to 50, inclusive?", "steps": ["First multiple of 3 that is 10 or more: \u003cb>12\u003c/b>", "Last multiple of 3 that is 50 or less: \u003cb>48\u003c/b>", "(48 − 12) ÷ 3 + 1 = 36 ÷ 3 + 1 = 12 + 1 = \u003cb>13\u003c/b>", "Check: 12 = 3 × 4 and 48 = 3 × 16. From 4 to 16 is 16 − 4 + 1 = 13 ✅"]}, "ex2": {"q": "How many 3-digit numbers can be made from the digits 2, 3, 5, 7 if no digit is used twice?", "steps": ["Draw 3 blanks: hundreds __ tens __ ones __", "Hundreds: 4 choices. Tens: 3 left. Ones: 2 left.", "4 × 3 × 2 = \u003cb>24\u003c/b> ✅", "Check: starting with 2 gives 6 numbers (235, 237, 253, 257, 273, 275). 4 starting digits × 6 = 24 ✅"]}, "warn": "Do not forget the + 1. From 11 to 20 is 20 − 11 = 9 gaps, but there are \u003cb>10\u003c/b> numbers (11, 12, …, 20).", "tip": "If 0 is one of the digits, it cannot go first. Digits 0, 1, 2 make only 4 three-digit numbers (102, 120, 201, 210), not 6.", "page": 2, "n": 52, "hard": 25}, {"key": "gcflcm", "name": "Factors and primes (GCF and LCM)", "spot": "The question says \u003cb>\"factor\"\u003c/b>, \u003cb>\"prime\"\u003c/b>, \u003cb>\"divisible by\"\u003c/b>, \u003cb>\"multiple\"\u003c/b>, \u003cb>\"greatest common factor\"\u003c/b> or \u003cb>\"least common multiple\"\u003c/b>.", "easy": "\u003cp style=\"margin:4px 0\">A \u003cb>factor\u003c/b> of 12 = a number that goes into 12 with nothing left over: 1, 2, 3, 4, 6, 12.\u003c/p>\u003cp style=\"margin:4px 0\">A \u003cb>prime\u003c/b> = a number bigger than 1 whose only factors are 1 and itself: 2, 3, 5, 7, 11, 13 … (1 is not prime. 2 is the only even prime.)\u003c/p>\u003csvg viewBox=\"0 0 320 180\" aria-hidden=\"true\">\u003cline x1=\"150\" y1=\"30\" x2=\"117\" y2=\"56\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003cline x1=\"170\" y1=\"30\" x2=\"203\" y2=\"56\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003cline x1=\"103\" y1=\"76\" x2=\"90\" y2=\"99\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003cline x1=\"117\" y1=\"76\" x2=\"130\" y2=\"99\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003cline x1=\"203\" y1=\"76\" x2=\"190\" y2=\"99\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003cline x1=\"217\" y1=\"76\" x2=\"230\" y2=\"99\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003ctext x=\"160\" y=\"25\" font-family=\"Arial\" font-size=\"16\" fill=\"#1b2430\" text-anchor=\"middle\" font-weight=\"700\">60\u003c/text>\u003ctext x=\"110\" y=\"71\" font-family=\"Arial\" font-size=\"16\" fill=\"#1b2430\" text-anchor=\"middle\" font-weight=\"700\">6\u003c/text>\u003ctext x=\"210\" y=\"71\" font-family=\"Arial\" font-size=\"16\" fill=\"#1b2430\" text-anchor=\"middle\" font-weight=\"700\">10\u003c/text>\u003ccircle cx=\"85\" cy=\"115\" r=\"15\" fill=\"#fff\" stroke=\"#b23a2a\" stroke-width=\"2.5\"/>\u003ctext x=\"85\" y=\"120\" font-family=\"Arial\" font-size=\"15\" fill=\"#b23a2a\" text-anchor=\"middle\" font-weight=\"700\">2\u003c/text>\u003ccircle cx=\"135\" cy=\"115\" r=\"15\" fill=\"#fff\" stroke=\"#b23a2a\" stroke-width=\"2.5\"/>\u003ctext x=\"135\" y=\"120\" font-family=\"Arial\" font-size=\"15\" fill=\"#b23a2a\" text-anchor=\"middle\" font-weight=\"700\">3\u003c/text>\u003ccircle cx=\"185\" cy=\"115\" r=\"15\" fill=\"#fff\" stroke=\"#b23a2a\" stroke-width=\"2.5\"/>\u003ctext x=\"185\" y=\"120\" font-family=\"Arial\" font-size=\"15\" fill=\"#b23a2a\" text-anchor=\"middle\" font-weight=\"700\">2\u003c/text>\u003ccircle cx=\"235\" cy=\"115\" r=\"15\" fill=\"#fff\" stroke=\"#b23a2a\" stroke-width=\"2.5\"/>\u003ctext x=\"235\" y=\"120\" font-family=\"Arial\" font-size=\"15\" fill=\"#b23a2a\" text-anchor=\"middle\" font-weight=\"700\">5\u003c/text>\u003ctext x=\"160\" y=\"152\" font-family=\"Arial\" font-size=\"15\" fill=\"#1b2430\" text-anchor=\"middle\" font-weight=\"700\">60 = 2 × 2 × 3 × 5\u003c/text>\u003ctext x=\"160\" y=\"172\" font-family=\"Arial\" font-size=\"13\" fill=\"#b23a2a\" text-anchor=\"middle\">red circles = primes (they cannot split)\u003c/text>\u003c/svg>\u003cp style=\"margin:4px 0\">Break two numbers into primes. Then compare their pieces.\u003c/p>\u003ctable>\u003ctr>\u003cth>Number\u003c/th>\u003cth>Prime pieces\u003c/th>\u003c/tr>\u003ctr>\u003ctd>12\u003c/td>\u003ctd>2 × 2 × 3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>18\u003c/td>\u003ctd>2 × 3 × 3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>GCF\u003c/b> (greatest common factor) = pieces both have\u003c/td>\u003ctd>2 × 3 = \u003cb>6\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>LCM\u003c/b> (least common multiple) = smallest number both go into\u003c/td>\u003ctd>2 × 2 × 3 × 3 = \u003cb>36\u003c/b>\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why 36?\u003c/b> It must hold 12's pieces (2, 2, 3) and 18's pieces (2, 3, 3). Two 2s and two 3s cover both.\u003c/p>", "rule": "GCF = the prime pieces both numbers \u003cb>share\u003c/b>\u003cbr>LCM = \u003cb>every\u003c/b> piece, as many times as either number has it", "first": "Break each number into primes with a factor tree. Write it like 60 = 2 × 2 × 3 × 5.", "ex": {"q": "Quantity A: the greatest prime factor of 56. Quantity B: the greatest prime factor of 45. Which is bigger?", "steps": ["56 = 2 × 2 × 2 × 7 → greatest prime is \u003cb>7\u003c/b>", "45 = 3 × 3 × 5 → greatest prime is \u003cb>5\u003c/b>", "7 is bigger than 5, so \u003cb>A is bigger\u003c/b> ✅", "Check: 2 × 2 × 2 × 7 = 56 and 3 × 3 × 5 = 45 ✅"]}, "warn": "A bigger number does \u003cb>not\u003c/b> have bigger prime pieces. 64 = 2 × 2 × 2 × 2 × 2 × 2, so its greatest prime factor is only \u003cb>2\u003c/b>. Small 15 has 5.", "tip": "GCF × LCM = the two numbers multiplied: 6 × 36 = 12 × 18 = 216. If two numbers share no prime piece (like 8 and 15), the LCM is just 8 × 15 = 120.", "page": 1, "n": 46, "hard": 31}, {"key": "powroot", "name": "Powers and roots (x², x³, √x)", "spot": "The question has a small raised number like \u003cb>x²\u003c/b> or \u003cb>5³\u003c/b>, a root sign \u003cb>√\u003c/b> or \u003cb>∛\u003c/b>, or says \u003cb>\"square of an integer\"\u003c/b> or \u003cb>\"cube\"\u003c/b>.", "easy": "\u003cp style=\"margin:4px 0\">A \u003cb>power\u003c/b> says how many times to multiply a number by itself: 2³ = 2 × 2 × 2 = 8. The 2 is the \u003cb>base\u003c/b> (bottom number). The 3 is the \u003cb>exponent\u003c/b> (top number).\u003c/p>\u003cp style=\"margin:4px 0\">A \u003cb>root\u003c/b> goes backwards: √49 = 7 because 7 × 7 = 49. ∛8 = 2 because 2 × 2 × 2 = 8.\u003c/p>\u003cp style=\"margin:4px 0\">Which way does a number move when you square or cube it?\u003c/p>\u003ctable>\u003ctr>\u003cth>x\u003c/th>\u003cth>x²\u003c/th>\u003cth>x³\u003c/th>\u003cth>What happens\u003c/th>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>9\u003c/td>\u003ctd>27\u003c/td>\u003ctd>gets \u003cb>bigger\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>½\u003c/td>\u003ctd>¼\u003c/td>\u003ctd>⅛\u003c/td>\u003ctd>gets \u003cb>smaller\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>−2\u003c/td>\u003ctd>4\u003c/td>\u003ctd>−8\u003c/td>\u003ctd>square turns \u003cb>positive\u003c/b>\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why ½ → ¼?\u003c/b> Half of a half is a quarter. Multiplying by a number less than 1 makes things smaller.\u003c/p>", "rule": "Same base, multiply: 2³ × 2² = 2⁵ (\u003cb>add\u003c/b> 3 + 2)\u003cbr>Power of a power: (2³)² = 2⁶ (\u003cb>multiply\u003c/b> 3 × 2)", "first": "Write both sides with the \u003cb>same base\u003c/b> (like 9 = 3²). Then just compare the exponents.", "ex": {"q": "Quantity A: 9⁴. Quantity B: 3⁷. Which is bigger?", "steps": ["9 = 3 × 3 = \u003cb>3²\u003c/b>", "9⁴ = (3²)⁴ = 3⁸ (because 2 × 4 = 8)", "3⁸ has one more 3 multiplied in than 3⁷, so \u003cb>A is bigger\u003c/b> ✅", "Check: 9⁴ = 6,561 and 3⁷ = 2,187 ✅"]}, "warn": "Under one root sign, add first, then take the root. √(16 + 9) = √25 = \u003cb>5\u003c/b>, not √16 + √9 = 4 + 3 = 7.", "tip": "Learn the squares up to 15² = 225 and the cubes 1, 8, 27, 64, 125. A number that is both a square and a cube is a 6th power: 1, 64, 729.", "page": 8, "n": 36, "hard": 27}, {"key": "signs", "name": "Positive and negative (signs on the number line)", "spot": "The question says \u003cb>\"x &lt; 0\"\u003c/b>, \u003cb>\"negative\"\u003c/b>, \u003cb>\"−1 &lt; x &lt; 0\"\u003c/b>, or compares \u003cb>x, x², x³\u003c/b> when you only know the sign of x.", "easy": "\u003cp style=\"margin:4px 0\">Think of money. A \u003cb>positive\u003c/b> number is money you have. A \u003cb>negative\u003c/b> number is money you owe. Owing $2 (−2) is worse than owing $1 (−1), so −2 &lt; −1.\u003c/p>\u003csvg viewBox=\"0 0 320 120\" aria-hidden=\"true\">\u003cline x1=\"10.0\" y1=\"44\" x2=\"100\" y2=\"44\" stroke=\"#b23a2a\" stroke-width=\"6\"/>\u003cline x1=\"100\" y1=\"44\" x2=\"160\" y2=\"44\" stroke=\"#9c6510\" stroke-width=\"6\"/>\u003cline x1=\"160\" y1=\"44\" x2=\"220\" y2=\"44\" stroke=\"#2e7a57\" stroke-width=\"6\"/>\u003cline x1=\"220\" y1=\"44\" x2=\"310.0\" y2=\"44\" stroke=\"#1e6f9f\" stroke-width=\"6\"/>\u003ctext x=\"55.0\" y=\"28\" font-family=\"Arial\" font-size=\"13\" fill=\"#b23a2a\" text-anchor=\"middle\" font-weight=\"700\">below −1\u003c/text>\u003ctext x=\"130.0\" y=\"28\" font-family=\"Arial\" font-size=\"13\" fill=\"#9c6510\" text-anchor=\"middle\" font-weight=\"700\">−1 to 0\u003c/text>\u003ctext x=\"190.0\" y=\"28\" font-family=\"Arial\" font-size=\"13\" fill=\"#2e7a57\" text-anchor=\"middle\" font-weight=\"700\">0 to 1\u003c/text>\u003ctext x=\"265.0\" y=\"28\" font-family=\"Arial\" font-size=\"13\" fill=\"#1e6f9f\" text-anchor=\"middle\" font-weight=\"700\">above 1\u003c/text>\u003cline x1=\"8\" y1=\"60\" x2=\"312\" y2=\"60\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003cline x1=\"40\" y1=\"54\" x2=\"40\" y2=\"66\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003ctext x=\"40\" y=\"84\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\" text-anchor=\"middle\">−2\u003c/text>\u003cline x1=\"100\" y1=\"54\" x2=\"100\" y2=\"66\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003ctext x=\"100\" y=\"84\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\" text-anchor=\"middle\">−1\u003c/text>\u003cline x1=\"160\" y1=\"54\" x2=\"160\" y2=\"66\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003ctext x=\"160\" y=\"84\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\" text-anchor=\"middle\">0\u003c/text>\u003cline x1=\"220\" y1=\"54\" x2=\"220\" y2=\"66\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003ctext x=\"220\" y=\"84\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\" text-anchor=\"middle\">1\u003c/text>\u003cline x1=\"280\" y1=\"54\" x2=\"280\" y2=\"66\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003ctext x=\"280\" y=\"84\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\" text-anchor=\"middle\">2\u003c/text>\u003ccircle cx=\"40\" cy=\"60\" r=\"6\" fill=\"#b23a2a\"/>\u003ccircle cx=\"130.0\" cy=\"60\" r=\"6\" fill=\"#9c6510\"/>\u003ctext x=\"130.0\" y=\"84\" font-family=\"Arial\" font-size=\"14\" fill=\"#9c6510\" text-anchor=\"middle\" font-weight=\"700\">−½\u003c/text>\u003ccircle cx=\"190.0\" cy=\"60\" r=\"6\" fill=\"#2e7a57\"/>\u003ctext x=\"190.0\" y=\"84\" font-family=\"Arial\" font-size=\"14\" fill=\"#2e7a57\" text-anchor=\"middle\" font-weight=\"700\">½\u003c/text>\u003ccircle cx=\"280\" cy=\"60\" r=\"6\" fill=\"#1e6f9f\"/>\u003ctext x=\"160\" y=\"110\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\" text-anchor=\"middle\">Test one number from each colour: −2, −½, ½, 2\u003c/text>\u003c/svg>\u003cp style=\"margin:4px 0\">The four colours behave differently. Try one test number in each:\u003c/p>\u003ctable>\u003ctr>\u003cth>Test x\u003c/th>\u003cth>x²\u003c/th>\u003cth>x³\u003c/th>\u003c/tr>\u003ctr>\u003ctd>−2 (red)\u003c/td>\u003ctd>4\u003c/td>\u003ctd>−8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>−½ (orange)\u003c/td>\u003ctd>¼\u003c/td>\u003ctd>−⅛\u003c/td>\u003c/tr>\u003ctr>\u003ctd>½ (green)\u003c/td>\u003ctd>¼\u003c/td>\u003ctd>⅛\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2 (blue)\u003c/td>\u003ctd>4\u003c/td>\u003ctd>8\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why −½ → ¼?\u003c/b> (−½) × (−½): two minus signs make a plus, and half of a half is a quarter.\u003c/p>", "rule": "Sign first: an \u003cb>even\u003c/b> number of minus signs → positive, an \u003cb>odd\u003c/b> number → negative.\u003cbr>Then size: test one number from each region.", "first": "Find the region the letter lives in. Pick an easy test number there (like −½ or −2) and work out each part.", "ex": {"q": "If −1 &lt; y &lt; 0, put y, y² and y³ in order from smallest to biggest.", "steps": ["Test number in the orange region: \u003cb>y = −½\u003c/b>", "y = −0.5, y² = 0.25, y³ = −0.125", "Smallest to biggest: −0.5 &lt; −0.125 &lt; 0.25", "So \u003cb>y &lt; y³ &lt; y²\u003c/b> ✅\u003cbr>Check with y = −0.2: −0.2 &lt; −0.008 &lt; 0.04 ✅ Same order."]}, "warn": "x² = 25 does \u003cb>not\u003c/b> mean x = 5. x could also be \u003cb>−5\u003c/b>, because (−5) × (−5) = 25. Always try the negative too.", "tip": "With negatives, closer to 0 is bigger: −⅙ is bigger than −3. On the number line, the number further to the right always wins.", "page": 2, "n": 33, "hard": 19}, {"key": "parity", "name": "Odd and even", "spot": "The question says \u003cb>\"odd\"\u003c/b>, \u003cb>\"even\"\u003c/b>, \u003cb>\"divisible by 2\"\u003c/b>, or asks which expression \u003cb>\"must be\"\u003c/b> or \u003cb>\"could be\"\u003c/b> odd or even.", "easy": "\u003csvg viewBox=\"0 0 320 96\" aria-hidden=\"true\">\u003crect x=\"6\" y=\"12\" width=\"43\" height=\"28\" rx=\"12\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003ccircle cx=\"18\" cy=\"26\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"37\" cy=\"26\" r=\"7\" fill=\"#1e6f9f\"/>\u003crect x=\"61\" y=\"12\" width=\"43\" height=\"28\" rx=\"12\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003ccircle cx=\"73\" cy=\"26\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"92\" cy=\"26\" r=\"7\" fill=\"#1e6f9f\"/>\u003crect x=\"116\" y=\"12\" width=\"43\" height=\"28\" rx=\"12\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003ccircle cx=\"128\" cy=\"26\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"147\" cy=\"26\" r=\"7\" fill=\"#1e6f9f\"/>\u003ctext x=\"200\" y=\"31\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" font-weight=\"700\">6 → even\u003c/text>\u003crect x=\"6\" y=\"56\" width=\"43\" height=\"28\" rx=\"12\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003ccircle cx=\"18\" cy=\"70\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"37\" cy=\"70\" r=\"7\" fill=\"#1e6f9f\"/>\u003crect x=\"61\" y=\"56\" width=\"43\" height=\"28\" rx=\"12\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003ccircle cx=\"73\" cy=\"70\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"92\" cy=\"70\" r=\"7\" fill=\"#1e6f9f\"/>\u003crect x=\"116\" y=\"56\" width=\"43\" height=\"28\" rx=\"12\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003ccircle cx=\"128\" cy=\"70\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"147\" cy=\"70\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"182\" cy=\"70\" r=\"7\" fill=\"#b23a2a\"/>\u003ctext x=\"200\" y=\"75\" font-family=\"Arial\" font-size=\"15\" fill=\"#b23a2a\" font-weight=\"700\">7 → odd\u003c/text>\u003c/svg>\u003cp style=\"margin:4px 0\">\u003cb>Even\u003c/b> = splits into pairs: 0, 2, 4, 6 … \u003cb>Odd\u003c/b> = one is always left alone: 1, 3, 5, 7 … (0 is even.)\u003c/p>\u003ctable>\u003ctr>\u003cth>Do this\u003c/th>\u003cth>You get\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003ctr>\u003ctd>even + even\u003c/td>\u003ctd>even\u003c/td>\u003ctd>2 + 4 = 6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>odd + odd\u003c/td>\u003ctd>\u003cb>even\u003c/b>\u003c/td>\u003ctd>3 + 5 = 8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>even + odd\u003c/td>\u003ctd>odd\u003c/td>\u003ctd>2 + 3 = 5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>even × anything\u003c/td>\u003ctd>even\u003c/td>\u003ctd>2 × 3 = 6\u003c/td>\u003c/tr>\u003ctr>\u003ctd>odd × odd\u003c/td>\u003ctd>odd\u003c/td>\u003ctd>3 × 5 = 15\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why odd + odd = even?\u003c/b> Each odd number has one left alone. The two lonely ones make a new pair.\u003c/p>", "rule": "Adding: same type → even, different types → odd.\u003cbr>Multiplying: one even number makes it even. Only odd × odd is odd.", "first": "Test with the smallest numbers: \u003cb>1\u003c/b> for odd, \u003cb>2\u003c/b> for even. If you are not told which, try both.", "ex": {"q": "a and b are odd. Which must be even? (A) a + b (B) ab (C) ab + 2 (D) a + 2b", "steps": ["Try a = 1, b = 3", "(A) 1 + 3 = 4 even · (B) 1 × 3 = 3 odd · (C) 3 + 2 = 5 odd · (D) 1 + 6 = 7 odd", "Only (A) is even: \u003cb>a + b\u003c/b> ✅", "Check with a = 5, b = 7: a + b = 12, even ✅ (odd + odd = even)"]}, "warn": "For \u003cb>\"must be\"\u003c/b>, one test is not enough. a + 1 is even when a = 1 (2), but odd when a = 2 (3). Test an odd \u003cb>and\u003c/b> an even.", "tip": "Two numbers next to each other (like 7 and 8) always include one even. So x(x + 1) is always even, and so is k² − k = k(k − 1).", "page": 1, "n": 29, "hard": 14}, {"key": "remwheel", "name": "Remainders (what is left over)", "spot": "The question says \u003cb>\"remainder\"\u003c/b>, \u003cb>\"left over\"\u003c/b> or \u003cb>\"when n is divided by 5 …\"\u003c/b>.", "easy": "\u003csvg viewBox=\"0 0 320 110\" aria-hidden=\"true\">\n\u003ctext x=\"8\" y=\"16\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\">13 candies, packed in bags of 5\u003c/text>\n\u003crect x=\"8\" y=\"27\" width=\"100\" height=\"36\" rx=\"8\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\n\u003crect x=\"118\" y=\"27\" width=\"100\" height=\"36\" rx=\"8\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003ccircle cx=\"20\" cy=\"45\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"39\" cy=\"45\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"58\" cy=\"45\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"77\" cy=\"45\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"96\" cy=\"45\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"130\" cy=\"45\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"149\" cy=\"45\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"168\" cy=\"45\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"187\" cy=\"45\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"206\" cy=\"45\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"245\" cy=\"45\" r=\"7\" fill=\"#b23a2a\"/>\u003ccircle cx=\"268\" cy=\"45\" r=\"7\" fill=\"#b23a2a\"/>\u003ccircle cx=\"291\" cy=\"45\" r=\"7\" fill=\"#b23a2a\"/>\n\u003ctext x=\"58\" y=\"84\" font-family=\"Arial\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1e6f9f\" font-weight=\"700\">bag 1\u003c/text>\n\u003ctext x=\"168\" y=\"84\" font-family=\"Arial\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1e6f9f\" font-weight=\"700\">bag 2\u003c/text>\n\u003ctext x=\"268\" y=\"84\" font-family=\"Arial\" font-size=\"13\" text-anchor=\"middle\" fill=\"#b23a2a\" font-weight=\"700\">3 left over\u003c/text>\n\u003ctext x=\"8\" y=\"104\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\">13 = 2 bags × 5 + 3 left over\u003c/text>\u003c/svg>\u003cp style=\"margin:4px 0\">Which numbers leave \u003cb>3\u003c/b> when you pack them in bags of \u003cb>5\u003c/b>?\u003c/p>\u003ctable>\u003ctr>\u003cth>Candies\u003c/th>\u003cth>Full bags\u003c/th>\u003cth>Left over\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cb>3\u003c/b>\u003c/td>\u003ctd>0 (not enough for a bag)\u003c/td>\u003ctd>\u003cb>3\u003c/b> ✅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>8\u003c/b>\u003c/td>\u003ctd>1 bag = 5\u003c/td>\u003ctd>8 − 5 = \u003cb>3\u003c/b> ✅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>13\u003c/b>\u003c/td>\u003ctd>2 bags = 10\u003c/td>\u003ctd>13 − 10 = \u003cb>3\u003c/b> ✅\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>18\u003c/b>\u003c/td>\u003ctd>3 bags = 15\u003c/td>\u003ctd>18 − 15 = \u003cb>3\u003c/b> ✅\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why 3 → 8?\u003c/b> Adding 5 candies makes one more full bag. The 3 loose candies do not change.\u003c/p>", "rule": "Start at the left-over number, then keep adding the number you divide by:\u003cbr>3 → 8 → 13 → 18 → 23 …", "first": "Write the first 3 numbers that work. Then try the \u003cb>smallest\u003c/b> one in the question.", "ex": {"q": "n ÷ 5 leaves 3. What is left over when 2n is divided by 5?", "steps": ["Smallest n that works: \u003cb>n = 3\u003c/b>", "2n = 2 × 3 = 6", "6 ÷ 5 = 1 bag, \u003cb>1 left over\u003c/b>", "Check with n = 8: 2n = 16 = 3 bags (15) + \u003cb>1\u003c/b> ✅ Same answer."]}, "warn": "What is left over is always \u003cb>smaller\u003c/b> than the number you divide by. Dividing by 5 can leave only 0, 1, 2, 3 or 4.", "tip": "The formula, for later: n = 5 × (number of bags) + 3. Many books write it as n = 5k + 3.", "page": 1, "n": 26, "hard": 16}, {"key": "consec", "name": "Consecutive integers (whole numbers in a row)", "spot": "The question says \u003cb>\"consecutive\"\u003c/b>, writes \u003cb>n, n + 1, n + 2\u003c/b>, or shows a product like \u003cb>n(n + 1)(n + 2)\u003c/b> or \u003cb>x³ − x\u003c/b>.", "easy": "\u003cp style=\"margin:4px 0\">\u003cb>Consecutive integers\u003c/b> = whole numbers in a row, with no gaps: 7, 8, 9.\u003c/p>\u003cp style=\"margin:4px 0\">Three children have 7, 8 and 9 candies. The child with 9 gives 1 (red) to the child with 7. Now all three have 8.\u003c/p>\u003csvg viewBox=\"0 0 320 200\" aria-hidden=\"true\">\u003crect x=\"70\" y=\"136\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"70\" y=\"122\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"70\" y=\"108\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"70\" y=\"94\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"70\" y=\"80\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"70\" y=\"66\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"70\" y=\"52\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"150\" y=\"136\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"150\" y=\"122\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"150\" y=\"108\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"150\" y=\"94\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"150\" y=\"80\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"150\" y=\"66\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"150\" y=\"52\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"150\" y=\"38\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"230\" y=\"136\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"230\" y=\"122\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"230\" y=\"108\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"230\" y=\"94\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"230\" y=\"80\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"230\" y=\"66\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"230\" y=\"52\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"230\" y=\"38\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#1e6f9f\"/>\u003crect x=\"230\" y=\"24\" width=\"30\" height=\"12\" rx=\"2\" fill=\"#b23a2a\"/>\u003crect x=\"70\" y=\"38\" width=\"30\" height=\"12\" rx=\"2\" fill=\"none\" stroke=\"#b23a2a\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/>\u003cpath d=\"M226,28 Q165,0 106,40\" fill=\"none\" stroke=\"#b23a2a\" stroke-width=\"2.5\"/>\u003cpolygon points=\"104,42 106,30 115,36\" fill=\"#b23a2a\"/>\u003ctext x=\"85\" y=\"170\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" text-anchor=\"middle\" font-weight=\"700\">7\u003c/text>\u003ctext x=\"165\" y=\"170\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" text-anchor=\"middle\" font-weight=\"700\">8\u003c/text>\u003ctext x=\"245\" y=\"170\" font-family=\"Arial\" font-size=\"15\" fill=\"#1e6f9f\" text-anchor=\"middle\" font-weight=\"700\">9\u003c/text>\u003ctext x=\"160\" y=\"192\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\" text-anchor=\"middle\">9 gives 1 to 7 → 8 + 8 + 8 = 3 × 8 = 24\u003c/text>\u003c/svg>\u003ctable>\u003ctr>\u003cth>Fact about numbers in a row\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003ctr>\u003ctd>3 in a row add to 3 × middle\u003c/td>\u003ctd>7 + 8 + 9 = 3 × 8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>In 2 in a row, one is even\u003c/td>\u003ctd>7, \u003cb>8\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>In 3 in a row, one is a multiple of 3\u003c/td>\u003ctd>7, 8, \u003cb>9\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>So their product is a multiple of 6\u003c/td>\u003ctd>7 × 8 × 9 = 6 × 84\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why 2 × 3 = 6?\u003c/b> The product has a 2 (from the even one) and a 3 (from the multiple of 3).\u003c/p>", "rule": "Sum of 3 (or 5, 7 …) in a row = how many × the middle one\u003cbr>Product of 3 in a row is always divisible by 6", "first": "Call them \u003cb>n, n + 1, n + 2\u003c/b>. For a sum, call the middle one m: m − 1, m, m + 1.", "ex": {"q": "Which can be the sum of three consecutive positive integers? (A) 25 (B) 31 (C) 33 (D) 40 (E) 44", "steps": ["Sum = 3 × middle, so the sum must be a \u003cb>multiple of 3\u003c/b>", "25, 31, 40, 44 are not multiples of 3. Only 33 is.", "Middle = 33 ÷ 3 = 11, so the numbers are 10, 11, 12", "Check: 10 + 11 + 12 = \u003cb>33\u003c/b> ✅ Answer (C)"]}, "warn": "Consecutive \u003cb>even\u003c/b> numbers jump by 2: 4, 6, 8. Write them as n, n + 2, n + 4, not n, n + 1, n + 2.", "tip": "x³ − x = (x − 1) × x × (x + 1): three numbers in a row! So it is always divisible by 6. Try x = 4: 64 − 4 = 60 = 3 × 4 × 5 ✅", "page": 1, "n": 13, "hard": 6}], "rare": [{"key": "unitcycle", "name": "Last digit of a power", "hint": "multiply only the last digits; they repeat every 4 steps or less", "page": 1, "n": 11}, {"key": "placeval", "name": "Digits and place value", "hint": "write the number as 100 × hundreds + 10 × tens + ones", "page": 2, "n": 8}, {"key": "fact", "name": "Factorials (5! = 5 × 4 × 3 × 2 × 1)", "hint": "write the big one as a smaller one times extras, then cancel", "page": 19, "n": 8}, {"key": "divcount", "name": "Counting a number's factors", "hint": "break into primes; multiply each (power + 1) together", "page": 1, "n": 4}, {"key": "magnitude", "name": "Rough size of a huge number", "hint": "split into a small number times a power of 10", "page": 8, "n": 4}, {"key": "extremeprod", "name": "Smallest or biggest possible product", "hint": "take the biggest sizes, then count the minus signs", "page": 2, "n": 3}, {"key": "primerun", "name": "Primes in a row of numbers", "hint": "past 3, even numbers and multiples of 3 are never prime", "page": 1, "n": 3}, {"key": "lowterms", "name": "Fraction in lowest terms", "hint": "reduce the fraction; the total must be a multiple of the bottom", "page": 3, "n": 3}, {"key": "paritycycle", "name": "Odd/even pattern in a sequence", "hint": "write odd or even for the first terms; it repeats", "page": 9, "n": 2}, {"key": "basedigits", "name": "Digit puzzles like 25a + 5b + c", "hint": "use the biggest number as many times as fits first", "page": 2, "n": 2}, {"key": "irrat", "name": "Rational or irrational (fraction or not)", "hint": "√2-type numbers are never fractions, even after adding a fraction", "page": 8, "n": 2}, {"key": "zeros", "name": "Zeros at the end of a number", "hint": "count the pairs of 2 × 5", "page": 1, "n": 2}, {"key": "recur", "name": "Repeating decimals to fractions", "hint": "two repeating digits over 99: 0.2727… = 27 ÷ 99", "page": 2, "n": 2}, {"key": "scinot", "name": "Adding in scientific notation", "hint": "make the powers of 10 the same first", "page": 8, "n": 1}, {"key": "evenodddiv", "name": "Even factors vs. odd factors", "hint": "even factors = (number of 2s) × (odd factors)", "page": 1, "n": 1}, {"key": "crypt", "name": "Letters standing for digits", "hint": "work right to left; each carry is 0 or 1", "page": 2, "n": 1}, {"key": "intavg", "name": "An average that is a whole number", "hint": "the total must divide evenly by the count", "page": 18, "n": 1}]}, {"s": "arith", "name": "Arithmetic", "short": "Arithmetic", "common": [{"key": "percent", "name": "Percent change (up or down by a percent)", "spot": "The question says \u003cb>\"increased by …%\"\u003c/b>, \u003cb>\"decreased by …%\"\u003c/b>, \u003cb>\"percent change\"\u003c/b> or \u003cb>\"from … to …\"\u003c/b>.", "easy": "\u003cp style=\"margin:4px 0\">A shirt cost \u003cb>$50\u003c/b>. Now it costs \u003cb>$60\u003c/b>.\u003c/p>\u003ctable>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Work\u003c/th>\u003c/tr>\u003ctr>\u003ctd>How much did it change?\u003c/td>\u003ctd>60 − 50 = \u003cb>$10\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Compare with the \u003cb>start\u003c/b>\u003c/td>\u003ctd>10 out of 50 = 10 ÷ 50 = 0.2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Turn into a percent\u003c/td>\u003ctd>0.2 × 100 = \u003cb>20% up\u003c/b> ✅\u003c/td>\u003c/tr>\u003c/table>", "rule": "Percent change = (new − old) ÷ old × 100", "first": "Write \u003cb>OLD = …\u003c/b> and \u003cb>NEW = …\u003c/b>. If no number is given, start with \u003cb>100\u003c/b>.", "ex": {"q": "A price goes up 20%, then down 20%. What is the total change?", "steps": ["No price is given, so start with \u003cb>100\u003c/b>.", "Up 20%: 20% of 100 = 20 → 100 + 20 = \u003cb>120\u003c/b>", "Down 20%: 20% of \u003cb>120\u003c/b> = 24 → 120 − 24 = \u003cb>96\u003c/b>", "100 → 96, so \u003cb>4% down\u003c/b> in total ✅ (not 0%)"]}, "warn": "Always divide by the \u003cb>start\u003c/b> (old) number. 50 → 60 is 20% up, but 60 → 50 is only 10 ÷ 60 ≈ 16.7% down.", "tip": "Shortcut: up 20% = × 1.2 and down 20% = × 0.8. So 100 × 1.2 × 0.8 = 96.", "page": 3, "n": 33, "hard": 12}, {"key": "ratio", "name": "Ratios (parts that grow together)", "spot": "The question says \u003cb>\"ratio\"\u003c/b>, \u003cb>\"2 to 3\"\u003c/b>, \u003cb>\"2 : 3\"\u003c/b>, \u003cb>\"for every\"\u003c/b> or \u003cb>\"is 1/4 of\"\u003c/b>, or sets two fractions equal.", "easy": "\u003csvg viewBox=\"0 0 320 114\" aria-hidden=\"true\">\u003ctext x=\"8\" y=\"16\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\">red : blue = 2 : 3 → packs of 2 red + 3 blue\u003c/text>\u003crect x=\"8\" y=\"27\" width=\"96\" height=\"36\" rx=\"8\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003ccircle cx=\"22\" cy=\"45\" r=\"7\" fill=\"#b23a2a\"/>\u003ccircle cx=\"39\" cy=\"45\" r=\"7\" fill=\"#b23a2a\"/>\u003ccircle cx=\"56\" cy=\"45\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"73\" cy=\"45\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"90\" cy=\"45\" r=\"7\" fill=\"#1e6f9f\"/>\u003ctext x=\"56\" y=\"84\" font-family=\"Arial\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1e6f9f\" font-weight=\"700\">pack 1\u003c/text>\u003crect x=\"112\" y=\"27\" width=\"96\" height=\"36\" rx=\"8\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003ccircle cx=\"126\" cy=\"45\" r=\"7\" fill=\"#b23a2a\"/>\u003ccircle cx=\"143\" cy=\"45\" r=\"7\" fill=\"#b23a2a\"/>\u003ccircle cx=\"160\" cy=\"45\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"177\" cy=\"45\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"194\" cy=\"45\" r=\"7\" fill=\"#1e6f9f\"/>\u003ctext x=\"160\" y=\"84\" font-family=\"Arial\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1e6f9f\" font-weight=\"700\">pack 2\u003c/text>\u003crect x=\"216\" y=\"27\" width=\"96\" height=\"36\" rx=\"8\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003ccircle cx=\"230\" cy=\"45\" r=\"7\" fill=\"#b23a2a\"/>\u003ccircle cx=\"247\" cy=\"45\" r=\"7\" fill=\"#b23a2a\"/>\u003ccircle cx=\"264\" cy=\"45\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"281\" cy=\"45\" r=\"7\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"298\" cy=\"45\" r=\"7\" fill=\"#1e6f9f\"/>\u003ctext x=\"264\" y=\"84\" font-family=\"Arial\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1e6f9f\" font-weight=\"700\">pack 3\u003c/text>\u003ctext x=\"8\" y=\"106\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\">3 packs: 6 red + 9 blue = 15 candies\u003c/text>\u003c/svg>\u003cp style=\"margin:4px 0\">In a bag, red : blue = \u003cb>2 : 3\u003c/b>. For every \u003cb>2 red\u003c/b> candies there are \u003cb>3 blue\u003c/b>. Think of packs of 2 red + 3 blue.\u003c/p>\u003ctable>\u003ctr>\u003cth>Packs\u003c/th>\u003cth>Red\u003c/th>\u003cth>Blue\u003c/th>\u003cth>Total\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>2\u003c/td>\u003ctd>3\u003c/td>\u003ctd>5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>4\u003c/td>\u003ctd>6\u003c/td>\u003ctd>10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>6\u003c/td>\u003ctd>9\u003c/td>\u003ctd>\u003cb>15\u003c/b>\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why 5 → 10?\u003c/b> One more pack adds 2 red and 3 blue, so 5 more candies.\u003c/p>", "rule": "2 : 3 means red = 2 × k and blue = 3 × k\u003cbr>(k = number of packs). Total = 5 × k", "first": "Write each part as \u003cb>number × k\u003c/b>. Add them to get the total. Then find k.", "ex": {"q": "In a class, boys : girls = 3 : 5. There are 32 children. How many are girls?", "steps": ["Boys = 3k, girls = 5k", "Total: 3k + 5k = \u003cb>8k\u003c/b> = 32", "k = 32 ÷ 8 = \u003cb>4\u003c/b>", "Girls = 5 × 4 = \u003cb>20\u003c/b>", "Check: boys = 3 × 4 = 12. 12 + 20 = 32, and 12 : 20 = 3 : 5 ✅"]}, "ex2": {"q": "a ÷ b = 1/2 and a ÷ c = 2/5. What is a ÷ (b + c)?", "steps": ["No numbers are given, so pick \u003cb>a = 2\u003c/b> (it fits both fractions).", "2 ÷ b = 1/2 → \u003cb>b = 4\u003c/b>", "2 ÷ c = 2/5 → \u003cb>c = 5\u003c/b>", "a ÷ (b + c) = 2 ÷ (4 + 5) = \u003cb>2/9\u003c/b> ✅"]}, "warn": "2 : 3 does \u003cb>not\u003c/b> mean 2 out of 3. Red is 2 out of 2 + 3 = \u003cb>5\u003c/b>, so red = 2/5 of the bag, not 2/3.", "tip": "Two equal fractions? Cross-multiply: 6/3 = x/4 → 3 × x = 6 × 4 = 24 → x = 8.", "page": 5, "n": 31, "hard": 13}, {"key": "perunit", "name": "Price for one (the unit price)", "spot": "The question says \u003cb>\"per\"\u003c/b>, \u003cb>\"each\"\u003c/b>, \u003cb>\"at this rate\"\u003c/b> or \u003cb>\"profit per …\"\u003c/b>, or gives one total cost for many items.", "easy": "\u003cp style=\"margin:4px 0\">6 apples cost \u003cb>$3\u003c/b>. What do 10 apples cost?\u003c/p>\u003ctable>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Work\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Price for \u003cb>one\u003c/b> apple\u003c/td>\u003ctd>$3 ÷ 6 = \u003cb>$0.50\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Price for 10 apples\u003c/td>\u003ctd>10 × $0.50 = \u003cb>$5\u003c/b> ✅\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why divide first?\u003c/b> Once you know the price of one, any number is easy. Just multiply.\u003c/p>", "rule": "Price for one = total cost ÷ how many\u003cbr>Cost of many = price for one × how many", "first": "Find the cost (or price) for \u003cb>one\u003c/b> item first. Write it as “$… each”.", "ex": {"q": "It costs $1,200 to make and sell 800 cups. Each cup sells for $2.00. What is the profit per cup? (profit = selling price − cost)", "steps": ["Cost for one cup: 1,200 ÷ 800 = \u003cb>$1.50\u003c/b>", "Profit for one cup: 2.00 − 1.50 = \u003cb>$0.50\u003c/b> ✅", "Check with totals: sales = 800 × 2.00 = $1,600. 1,600 − 1,200 = $400. 400 ÷ 800 = $0.50 ✅"]}, "warn": "Compare the price for \u003cb>one ounce\u003c/b>, not the bottle price. Small: 2 ounces for $1 = \u003cb>$0.50\u003c/b> an ounce. Big: 5 ounces for $2 = \u003cb>$0.40\u003c/b> an ounce. The cheaper bottle is the \u003cb>worse\u003c/b> deal.", "tip": "Only letters (“d dollars buys s sandwiches”)? Pick easy numbers: d = 10, s = 5, so $2 each. Then test each answer choice with them.", "page": 6, "n": 24, "hard": 8}, {"key": "convert", "name": "Changing units (inches, feet, yards …)", "spot": "The question gives a fact like \u003cb>\"1 foot = 12 inches\"\u003c/b> or \u003cb>\"1 mile = 5,280 feet\"\u003c/b>, or asks for \u003cb>\"square feet\"\u003c/b> or \u003cb>\"cubic yards\"\u003c/b>.", "easy": "\u003csvg viewBox=\"0 0 320 162\" aria-hidden=\"true\">\u003crect x=\"100\" y=\"70\" width=\"40\" height=\"40\" fill=\"#eef5fa\"/>\u003crect x=\"100\" y=\"70\" width=\"40\" height=\"40\" fill=\"#1e6f9f\" opacity=\"0.35\"/>\u003cline x1=\"100\" y1=\"30\" x2=\"100\" y2=\"150\" stroke=\"#4a5866\" stroke-width=\"1.2\"/>\u003cline x1=\"60\" y1=\"70\" x2=\"180\" y2=\"70\" stroke=\"#4a5866\" stroke-width=\"1.2\"/>\u003cline x1=\"140\" y1=\"30\" x2=\"140\" y2=\"150\" stroke=\"#4a5866\" stroke-width=\"1.2\"/>\u003cline x1=\"60\" y1=\"110\" x2=\"180\" y2=\"110\" stroke=\"#4a5866\" stroke-width=\"1.2\"/>\u003crect x=\"60\" y=\"30\" width=\"120\" height=\"120\" fill=\"none\" stroke=\"#1b2430\" stroke-width=\"2.5\"/>\u003ctext x=\"120\" y=\"22\" font-family=\"Arial\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1b2430\" font-weight=\"700\">3 feet = 1 yard\u003c/text>\u003ctext x=\"52\" y=\"94\" font-family=\"Arial\" font-size=\"13\" text-anchor=\"end\" fill=\"#1b2430\" font-weight=\"700\">3 feet\u003c/text>\u003ctext x=\"196\" y=\"62\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\" font-weight=\"700\">1 square yard\u003c/text>\u003ctext x=\"196\" y=\"82\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\">= 3 × 3\u003c/text>\u003ctext x=\"196\" y=\"102\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\" font-weight=\"700\">= 9 square feet\u003c/text>\u003ctext x=\"196\" y=\"132\" font-family=\"Arial\" font-size=\"13\" fill=\"#1e6f9f\" font-weight=\"700\">blue square =\u003c/text>\u003ctext x=\"196\" y=\"148\" font-family=\"Arial\" font-size=\"13\" fill=\"#1e6f9f\" font-weight=\"700\">1 square foot\u003c/text>\u003c/svg>\u003cp style=\"margin:4px 0\">A \u003cb>yard\u003c/b> is 3 feet long. A \u003cb>square yard\u003c/b> is a square 1 yard on each side. It holds 3 rows of 3 small squares.\u003c/p>\u003ctable>\u003ctr>\u003cth>What\u003c/th>\u003cth>1 yard =\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Length (a line)\u003c/td>\u003ctd>\u003cb>3\u003c/b> feet\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Area (a flat square)\u003c/td>\u003ctd>3 × 3 = \u003cb>9\u003c/b> square feet\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Volume (the space in a box)\u003c/td>\u003ctd>3 × 3 × 3 = \u003cb>27\u003c/b> cubic feet\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why 3 → 9?\u003c/b> A square has a length \u003cb>and\u003c/b> a width. Each one gets the × 3.\u003c/p>", "rule": "Length: × once · Area: × twice · Volume: × three times\u003cbr>yards → feet: × 3 · × 9 · × 27", "first": "Change every length to the unit the answer asks for, \u003cb>before\u003c/b> you multiply.", "ex": {"q": "A path is 6 feet by 9 feet. It gets a 4-inch layer of sand. Sand comes in bags of 4 cubic feet. How many bags are needed? (1 foot = 12 inches)", "steps": ["Inches → feet first: 4 inches = 4 ÷ 12 = \u003cb>1/3 foot\u003c/b>", "Volume = 6 × 9 × 1/3 = 54 ÷ 3 = \u003cb>18\u003c/b> cubic feet", "Bags: 18 ÷ 4 = 4.5. You cannot buy half a bag, so \u003cb>5 bags\u003c/b>", "Check: 5 bags = 20 cubic feet, enough for 18 ✅. 4 bags = 16 is too few."]}, "warn": "Changing an area with the number only once. 2 square yards = 2 × 9 = \u003cb>18\u003c/b> square feet, not 2 × 3 = 6.", "tip": "Speed trick: 60 miles per hour = 88 feet per second (60 × 5,280 ÷ 3,600 = 88). So 30 miles per hour = 44 feet per second.", "page": 6, "n": 24, "hard": 14}, {"key": "pctthree", "name": "Percent of, more than, less than", "spot": "The question says \u003cb>\"what percent of\"\u003c/b>, \u003cb>\"x percent of\"\u003c/b>, \u003cb>\"… percent greater than\"\u003c/b> or \u003cb>\"… percent less than\"\u003c/b>.", "easy": "\u003cp style=\"margin:4px 0\">Two small words do the work. \u003cb>of\u003c/b> means × (or “goes on the bottom”). \u003cb>is\u003c/b> means =.\u003c/p>\u003ctable>\u003ctr>\u003cth>Question\u003c/th>\u003cth>Work\u003c/th>\u003c/tr>\u003ctr>\u003ctd>What is 20% of 50?\u003c/td>\u003ctd>0.20 × 50 = \u003cb>10\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10 is what percent of 40?\u003c/td>\u003ctd>10 ÷ 40 = 0.25 = \u003cb>25%\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>60 is what percent greater than 40?\u003c/td>\u003ctd>(60 − 40) ÷ 40 = 0.5 = \u003cb>50%\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>40 is what percent less than 60?\u003c/td>\u003ctd>(60 − 40) ÷ 60 ≈ \u003cb>33.3%\u003c/b>\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why ÷ 40, then ÷ 60?\u003c/b> The bottom number is always the one right after \u003cb>of\u003c/b> or \u003cb>than\u003c/b>.\u003c/p>", "rule": "Percent = part ÷ (the number after “of” or “than”) × 100", "first": "Find the word \u003cb>of\u003c/b> or \u003cb>than\u003c/b>. The number right after it goes on the \u003cb>bottom\u003c/b>.", "ex": {"q": "What percent of 1/2 is 3/4?", "steps": ["After “of” comes 1/2, so 1/2 goes on the bottom.", "3/4 ÷ 1/2 = 3/4 × 2 (flip the bottom fraction) = 6/4 = \u003cb>1.5\u003c/b>", "1.5 × 100 = \u003cb>150%\u003c/b>", "Check: 150% of 1/2 = 1.5 × 0.5 = 0.75 = 3/4 ✅"]}, "ex2": {"q": "12 grams of protein is x percent of the daily need. What is the daily need, in grams?", "steps": ["x percent = x ÷ 100. “is” means =, “of” means ×.", "12 = (x ÷ 100) × need", "need = 12 × 100 ÷ x = \u003cb>1,200 ÷ x\u003c/b>", "Check with x = 100: 1,200 ÷ 100 = 12, and 12 is 100% of 12 ✅"]}, "warn": "Do not flip it. 10 is what percent of 40? It is 10 ÷ 40 = \u003cb>25%\u003c/b>, not 40 ÷ 10 = 400%.", "tip": "Letters in the answers? Try x = 100. 100% of a number is the number itself, so the right answer is easy to spot.", "page": 3, "n": 16, "hard": 4}, {"key": "conditional", "name": "“Of those who …” (a percent of a smaller group)", "spot": "The question says \u003cb>\"of those who\"\u003c/b>, \u003cb>\"of the remaining\"\u003c/b> or \u003cb>\"what percent of the people who … also …\"\u003c/b>.", "easy": "\u003csvg viewBox=\"0 0 320 162\" aria-hidden=\"true\">\u003ctext x=\"10\" y=\"16\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\">100 people\u003c/text>\u003crect x=\"10\" y=\"24\" width=\"120\" height=\"30\" fill=\"#1e6f9f\"/>\u003crect x=\"130\" y=\"24\" width=\"180\" height=\"30\" fill=\"#e3e7ea\"/>\u003ctext x=\"70\" y=\"44\" font-family=\"Arial\" font-size=\"13\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">40: dog\u003c/text>\u003ctext x=\"220\" y=\"44\" font-family=\"Arial\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1b2430\">60: no dog\u003c/text>\u003ctext x=\"10\" y=\"76\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\">Now look only at the 40 dog owners:\u003c/text>\u003crect x=\"10\" y=\"84\" width=\"30\" height=\"30\" fill=\"#b23a2a\"/>\u003crect x=\"40\" y=\"84\" width=\"90\" height=\"30\" fill=\"#ffffff\" stroke=\"#1e6f9f\" stroke-width=\"2\"/>\u003ctext x=\"25\" y=\"104\" font-family=\"Arial\" font-size=\"13\" text-anchor=\"middle\" fill=\"#ffffff\" font-weight=\"700\">10\u003c/text>\u003ctext x=\"85\" y=\"104\" font-family=\"Arial\" font-size=\"13\" text-anchor=\"middle\" fill=\"#1e6f9f\" font-weight=\"700\">30\u003c/text>\u003ctext x=\"142\" y=\"104\" font-family=\"Arial\" font-size=\"13\" fill=\"#b23a2a\" font-weight=\"700\">← ¼ of the 40\u003c/text>\u003ctext x=\"10\" y=\"136\" font-family=\"Arial\" font-size=\"13\" fill=\"#b23a2a\" font-weight=\"700\">red: dog and cat = 10 people\u003c/text>\u003ctext x=\"10\" y=\"154\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\">= 10 out of all 100 = 10% of everyone\u003c/text>\u003c/svg>\u003cp style=\"margin:4px 0\">“40% have a dog. \u003cb>Of those\u003c/b>, 25% also have a cat.” The 25% is a part of the \u003cb>40 dog owners\u003c/b>, not of all 100 people.\u003c/p>\u003cp style=\"margin:4px 0\">\u003cb>Why 25% → 10?\u003c/b> 25% of 40 = 0.25 × 40 = 10 people. That is 10 out of 100 = 10% of everyone.\u003c/p>", "rule": "“30% \u003cb>of those\u003c/b> …” → 0.30 × (that smaller group)\u003cbr>“What percent \u003cb>of those\u003c/b> …” → part ÷ (that smaller group) × 100", "first": "Say there are \u003cb>100 people\u003c/b>. Turn every percent into a number of people, one sentence at a time.", "ex": {"q": "60% of a class walk to school. Of the rest, 30% take the bus. What percent of the class neither walk nor take the bus?", "steps": ["Say 100 students. Walk: \u003cb>60\u003c/b>. The rest: 100 − 60 = \u003cb>40\u003c/b>", "Bus: 30% of 40 = 0.3 × 40 = \u003cb>12\u003c/b>", "Neither: 40 − 12 = 28, so \u003cb>28%\u003c/b>", "Check: 60 + 12 + 28 = 100 ✅"]}, "ex2": {"q": "50% own a dog, 30% own a cat, 30% own neither. Of the dog owners, what percent also own a cat?", "steps": ["100 people. Own a pet: 100 − 30 = \u003cb>70\u003c/b>", "Dog + cat = 50 + 30 = 80. That is 10 more than 70, so \u003cb>10\u003c/b> people own both (they were counted twice).", "Of the 50 dog owners: 10 ÷ 50 = \u003cb>20%\u003c/b> ✅", "Check: dog only 40 + cat only 20 + both 10 + neither 30 = 100 ✅"]}, "warn": "Do not subtract percents of different groups. In the first example, 100 − 60 − 30 = 10% is \u003cb>wrong\u003c/b>. The 30% is of the 40, not of 100.", "tip": "Two groups that overlap: both = group A + group B − (at least one). Above: 50 + 30 − 70 = 10.", "page": 19, "n": 13, "hard": 5}, {"key": "workrate", "name": "Working together (add the work per hour)", "spot": "The question says \u003cb>\"working together\"\u003c/b>, \u003cb>\"simultaneously\"\u003c/b> (= at the same time), \u003cb>\"constant rate\"\u003c/b> or \u003cb>\"can do the job in … hours\"\u003c/b>.", "easy": "\u003cp style=\"margin:4px 0\">A job: paint \u003cb>12 walls\u003c/b>. Ann alone needs 6 hours. Ben alone needs 3 hours. Their \u003cb>rate\u003c/b> = walls painted in 1 hour.\u003c/p>\u003ctable>\u003ctr>\u003cth>Who\u003c/th>\u003cth>Walls in 1 hour\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Ann\u003c/td>\u003ctd>12 ÷ 6 = \u003cb>2\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ben\u003c/td>\u003ctd>12 ÷ 3 = \u003cb>4\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Together\u003c/td>\u003ctd>2 + 4 = \u003cb>6\u003c/b>\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">Together they need 12 ÷ 6 = \u003cb>2 hours\u003c/b> ✅ Faster than Ben alone (3 hours), as it should be.\u003c/p>\u003cp style=\"margin:4px 0\">\u003cb>Why 12 walls?\u003c/b> Pick a job size that both times (6 and 3) divide into. The answer stays the same.\u003c/p>", "rule": "Together: \u003cb>add\u003c/b> the work per hour, then time = job ÷ (total per hour)\u003cbr>Two workers: time = (a × b) ÷ (a + b)", "first": "Pick a job size that every time divides into. Write each worker's work in \u003cb>1 hour\u003c/b>.", "ex": {"q": "Pump A fills a tank in 4 hours. Pump B fills it in 12 hours. Working together, how long do they take?", "steps": ["Say the tank holds \u003cb>12 buckets\u003c/b> (4 and 12 both divide 12).", "A: 12 ÷ 4 = 3 buckets per hour. B: 12 ÷ 12 = 1 bucket per hour.", "Together: 3 + 1 = \u003cb>4\u003c/b> buckets per hour", "Time: 12 ÷ 4 = \u003cb>3 hours\u003c/b> ✅ Faster than A alone (4 hours)."]}, "warn": "Never add or average the times. 4 hours and 12 hours together is \u003cb>not\u003c/b> 16 hours, and not 8 hours. Together is always faster than the faster one alone.", "tip": "Same machines, same job: machines × hours stays the same. 6 printers × 4 hours = 24, so in 3 hours you need 24 ÷ 3 = 8 printers.", "page": 6, "n": 11, "hard": 4}], "rare": [{"key": "reverse", "name": "Going back before a percent change", "hint": "15% more → old = new ÷ 1.15; never subtract 15%", "page": 3, "n": 9}, {"key": "roundup", "name": "Rounding and buying whole items", "hint": "you cannot buy part of a bag: always round up", "page": 2, "n": 7}, {"key": "doubling", "name": "Doubling and repeated growth", "hint": "write out the first two steps, then count the steps", "page": 9, "n": 7}, {"key": "interest", "name": "Interest on money", "hint": "simple: money × rate × time; compounding more often earns more", "page": 4, "n": 7}, {"key": "mediant", "name": "Adding the same to top and bottom", "hint": "the fraction always moves closer to 1", "page": 5, "n": 4}, {"key": "alligation", "name": "Mixing two strengths", "hint": "add the pure part of each: 9 × 30% + 18 × x%", "page": 5, "n": 4}, {"key": "costmodel", "name": "Cost, markup and profit", "hint": "find what each percent is of; often price = 1.4 × cost", "page": 4, "n": 3}, {"key": "branchrate", "name": "A percent for one group only", "hint": "it says nothing about the other group", "page": 19, "n": 2}, {"key": "unsaid", "name": "What the question never says", "hint": "a group with no facts can be anything, 0% to 100%", "page": 19, "n": 2}, {"key": "harmonic", "name": "Average speed over two parts", "hint": "total distance ÷ total time; never average the two speeds", "page": 6, "n": 2}, {"key": "milestone", "name": "How long until a goal", "hint": "amount still needed ÷ amount per period, then round up", "page": 6, "n": 1}]}, {"s": "alg", "name": "Algebra", "short": "Algebra", "common": [{"key": "qcflow", "name": "Quantity A vs Quantity B (which is bigger?)", "spot": "You see two boxes, \u003cb>\"Quantity A\"\u003c/b> and \u003cb>\"Quantity B\"\u003c/b>, and the same four answers every time: \u003cb>A, B, C, D\u003c/b>.", "easy": "\u003csvg viewBox='0 0 320 150' aria-hidden='true'>\n\u003ctext x='160' y='18' font-family='Arial' font-size='13' text-anchor='middle' fill='#4a5866'>Which side is heavier? Or are they the same?\u003c/text>\n\u003cpolygon points='160,62 142,132 178,132' fill='#eef5fa' stroke='#1b2430' stroke-width='2.5'/>\n\u003cline x1='55' y1='62' x2='265' y2='62' stroke='#1b2430' stroke-width='3'/>\n\u003ccircle cx='160' cy='62' r='5' fill='#1b2430'/>\n\u003cline x1='55' y1='62' x2='30' y2='96' stroke='#1b2430' stroke-width='2'/>\u003cline x1='55' y1='62' x2='80' y2='96' stroke='#1b2430' stroke-width='2'/>\n\u003cline x1='265' y1='62' x2='240' y2='96' stroke='#1b2430' stroke-width='2'/>\u003cline x1='265' y1='62' x2='290' y2='96' stroke='#1b2430' stroke-width='2'/>\n\u003crect x='22' y='96' width='66' height='10' rx='4' fill='#1e6f9f'/>\n\u003crect x='232' y='96' width='66' height='10' rx='4' fill='#2e7a57'/>\n\u003ctext x='55' y='128' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#1e6f9f'>Quantity A\u003c/text>\n\u003ctext x='265' y='128' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#2e7a57'>Quantity B\u003c/text>\n\u003c/svg>\u003cp style=\"margin:4px 0\">Your job: which side is bigger? Here is what the four answers mean.\u003c/p>\u003ctable>\u003ctr>\u003cth>Answer\u003c/th>\u003cth>It means\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cb>A\u003c/b>\u003c/td>\u003ctd>A is bigger, \u003cb>every\u003c/b> time\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>B\u003c/b>\u003c/td>\u003ctd>B is bigger, \u003cb>every\u003c/b> time\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>C\u003c/b>\u003c/td>\u003ctd>They are equal, \u003cb>every\u003c/b> time\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>D\u003c/b>\u003c/td>\u003ctd>\u003cb>It depends.\u003c/b> One number makes A win, another makes B win (or a tie).\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">A letter like x can stand for many numbers. So \u003cb>try more than one number\u003c/b>.\u003c/p>\u003cp style=\"margin:4px 0\">\u003cb>Good numbers to try:\u003c/b> 2, then 0, 1, −1, ½, −2. Use only the ones the question allows.\u003c/p>\u003cp style=\"margin:4px 0\">\u003cb>Careful:\u003c/b> an \u003cb>integer\u003c/b> is a whole number: … −2, −1, 0, 1, 2 … It can be 0 or negative!\u003c/p>\u003cp style=\"margin:4px 0\">\u003cb>Same thing to both sides.\u003c/b> Take the same weight off both pans. The heavier pan is still heavier. So you may take the same thing away from A and B.\u003c/p>", "rule": "Always A bigger → \u003cb>A\u003c/b> · always B bigger → \u003cb>B\u003c/b> · always equal → \u003cb>C\u003c/b>\u003cbr>Two tries give different results → \u003cb>D\u003c/b>", "first": "Write down what the question allows (integer? positive?). Try an easy number like \u003cb>2\u003c/b>. Then try a \u003cb>strange\u003c/b> one: 0, 1, −1, ½ or a negative.", "ex": {"q": "Quantity A: x². Quantity B: x.", "steps": ["Nothing is said about x, so any number is allowed.", "Try x = 2: A = 2 × 2 = 4, B = 2 → \u003cb>A is bigger\u003c/b>", "Try x = ½: A = ½ × ½ = ¼, B = ½ → \u003cb>B is bigger\u003c/b>", "Two tries, two different winners → the answer is \u003cb>D\u003c/b> ✅"]}, "ex2": {"q": "x &gt; 0 and y &lt; 0. Quantity A: x + y. Quantity B: x − y.", "steps": ["Both sides have x. Take x away from \u003cb>both\u003c/b> sides.", "Now A is \u003cb>y\u003c/b> and B is \u003cb>−y\u003c/b>.", "y is negative, so −y is positive. Positive is bigger → \u003cb>B\u003c/b>", "Check with x = 3, y = −2: A = 3 + (−2) = 1, B = 3 − (−2) = 5. B is bigger ✅"]}, "warn": "Do not stop after one easy number. With x = 2, x² wins (4 &gt; 2). With x = ½, x wins (½ &gt; ¼). Always try a strange number too.", "tip": "Safe on both sides: add, take away, or × and ÷ by a \u003cb>positive\u003c/b> number. Never × or ÷ by something that could be negative or 0. If A and B are plain numbers (no letters), the answer is never D.", "page": 20, "n": 69, "hard": 42}, {"key": "ineq", "name": "Inequalities (bigger than, smaller than)", "spot": "You see \u003cb>&lt;\u003c/b>, \u003cb>&gt;\u003c/b>, \u003cb>≤\u003c/b>, \u003cb>≥\u003c/b>, or words like \u003cb>\"between\"\u003c/b>, \u003cb>\"at least\"\u003c/b>, \u003cb>\"how many integers\"\u003c/b>.", "easy": "\u003cp style=\"margin:4px 0\">\u003cb>x &lt; 5\u003c/b> means \"x is smaller than 5\". \u003cb>≤\u003c/b> means \"smaller than \u003cb>or equal\u003c/b> to\".\u003c/p>\u003cp style=\"margin:4px 0\">The answer is not one number. It is a \u003cb>range\u003c/b> of numbers on the number line.\u003c/p>\u003csvg viewBox='0 0 320 126' aria-hidden='true'>\n\u003ctext x='160' y='20' font-family='Arial' font-size='14' font-weight='700' text-anchor='middle' fill='#1e6f9f'>x &gt; −3 and x &lt; −1\u003c/text>\n\u003cline x1='10' y1='50' x2='310' y2='50' stroke='#1b2430' stroke-width='2.5'/>\u003cline x1='25' y1='44' x2='25' y2='56' stroke='#1b2430' stroke-width='2'/>\u003ctext x='25' y='76' font-family='Arial' font-size='13' text-anchor='middle' fill='#1b2430'>−5\u003c/text>\u003cline x1='70' y1='44' x2='70' y2='56' stroke='#1b2430' stroke-width='2'/>\u003ctext x='70' y='76' font-family='Arial' font-size='13' text-anchor='middle' fill='#1b2430'>−4\u003c/text>\u003cline x1='115' y1='44' x2='115' y2='56' stroke='#1b2430' stroke-width='2'/>\u003ctext x='115' y='76' font-family='Arial' font-size='13' text-anchor='middle' fill='#1b2430'>−3\u003c/text>\u003cline x1='160' y1='44' x2='160' y2='56' stroke='#1b2430' stroke-width='2'/>\u003ctext x='160' y='76' font-family='Arial' font-size='13' text-anchor='middle' fill='#1b2430'>−2\u003c/text>\u003cline x1='205' y1='44' x2='205' y2='56' stroke='#1b2430' stroke-width='2'/>\u003ctext x='205' y='76' font-family='Arial' font-size='13' text-anchor='middle' fill='#1b2430'>−1\u003c/text>\u003cline x1='250' y1='44' x2='250' y2='56' stroke='#1b2430' stroke-width='2'/>\u003ctext x='250' y='76' font-family='Arial' font-size='13' text-anchor='middle' fill='#1b2430'>0\u003c/text>\u003cline x1='295' y1='44' x2='295' y2='56' stroke='#1b2430' stroke-width='2'/>\u003ctext x='295' y='76' font-family='Arial' font-size='13' text-anchor='middle' fill='#1b2430'>1\u003c/text>\n\u003cline x1='115' y1='50' x2='205' y2='50' stroke='#1e6f9f' stroke-width='6'/>\n\u003ccircle cx='115' cy='50' r='7' fill='#fff' stroke='#1e6f9f' stroke-width='3'/>\n\u003ccircle cx='205' cy='50' r='7' fill='#fff' stroke='#1e6f9f' stroke-width='3'/>\n\u003ccircle cx='160' cy='50' r='7' fill='#9c6510'/>\n\u003ctext x='160' y='100' font-family='Arial' font-size='13' text-anchor='middle' fill='#4a5866'>Empty circle = that number is \u003ctspan font-weight='700'>not\u003c/tspan> allowed.\u003c/text>\n\u003ctext x='160' y='116' font-family='Arial' font-size='13' text-anchor='middle' fill='#9c6510' font-weight='700'>The only whole number inside: −2\u003c/text>\n\u003c/svg>\u003cp style=\"margin:4px 0\">You solve it like an equation, with one new rule:\u003c/p>\u003ctable>\u003ctr>\u003cth>What you do to both sides\u003c/th>\u003cth>The sign\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Add or take away any number\u003c/td>\u003ctd>stays: 2 &lt; 5 → 12 &lt; 15\u003c/td>\u003c/tr>\u003ctr>\u003ctd>× or ÷ by a \u003cb>positive\u003c/b> number\u003c/td>\u003ctd>stays: 2 &lt; 5 → 6 &lt; 15\u003c/td>\u003c/tr>\u003ctr>\u003ctd>× or ÷ by a \u003cb>negative\u003c/b> number\u003c/td>\u003ctd>\u003cb>flips\u003c/b>: 2 &lt; 5 → −2 &gt; −5\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why does it flip?\u003c/b> On the number line, −2 is to the right of −5. So −2 is the bigger one.\u003c/p>", "rule": "Add, take away, × or ÷ by a positive → the sign stays.\u003cbr>× or ÷ by a negative → \u003cb>flip the sign\u003c/b> (&lt; becomes &gt;).", "first": "Get x alone on one side. Then draw a small number line and mark where x can be.", "ex": {"q": "x is an integer. 3x + 4 &gt; −5 and x + 2 &lt; 1. What is x?", "steps": ["First one: take away 4 → 3x &gt; −9. Divide by 3 → \u003cb>x &gt; −3\u003c/b>", "Second one: take away 2 → \u003cb>x &lt; −1\u003c/b>", "So x is between −3 and −1 (not equal to either).", "The only whole number there is \u003cb>x = −2\u003c/b>", "Check: 3 × (−2) + 4 = −2, and −2 &gt; −5 ✅. Also −2 + 2 = 0, and 0 &lt; 1 ✅"]}, "warn": "Forgetting to flip. −2x &lt; 6 → divide by −2 → \u003cb>x &gt; −3\u003c/b> (not x &lt; −3). Test x = 0: −2 × 0 = 0, and 0 &lt; 6 ✅, and 0 &gt; −3 ✅.", "tip": "Count whole numbers from −3 to 4, both ends included: last − first + 1 = 4 − (−3) + 1 = \u003cb>8\u003c/b>.", "page": 8, "n": 52, "hard": 30}, {"key": "exprules", "name": "Exponent rules (powers like 2³)", "spot": "You see small raised numbers: \u003cb>2⁵\u003c/b>, \u003cb>x⁻²\u003c/b>, \u003cb>(½)ⁿ\u003c/b>, or roots like \u003cb>√\u003c/b> and \u003cb>∛\u003c/b>.", "easy": "\u003cp style=\"margin:4px 0\">\u003cb>2³\u003c/b> means three 2s multiplied: 2 × 2 × 2 = 8. The small 3 is the \u003cb>power\u003c/b> (or \u003cb>exponent\u003c/b>). The 2 is the \u003cb>base\u003c/b>.\u003c/p>\u003ctable>\u003ctr>\u003cth>Rule\u003c/th>\u003cth>Tiny example\u003c/th>\u003c/tr>\u003ctr>\u003ctd>× same base: \u003cb>add\u003c/b> powers\u003c/td>\u003ctd>2² × 2³ = 2⁵ (4 × 8 = 32)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>÷ same base: \u003cb>take away\u003c/b>\u003c/td>\u003ctd>2⁵ ÷ 2³ = 2² (32 ÷ 8 = 4)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Power of a power: \u003cb>multiply\u003c/b>\u003c/td>\u003ctd>(2²)³ = 2⁶ = 64\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Power 0: always 1\u003c/td>\u003ctd>7\u003csup>0\u003c/sup> = 1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Minus power: \u003cb>flip\u003c/b> it\u003c/td>\u003ctd>2⁻³ = 1 ÷ 2³ = ⅛\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Power ½: square root\u003c/td>\u003ctd>9\u003csup>½\u003c/sup> = √9 = 3\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why 2 + 3 = 5?\u003c/b> 2² × 2³ = (2 × 2) × (2 × 2 × 2). Count the 2s: five of them.\u003c/p>", "rule": "a\u003csup>m\u003c/sup> × a\u003csup>n\u003c/sup> = a\u003csup>m+n\u003c/sup> · a\u003csup>m\u003c/sup> ÷ a\u003csup>n\u003c/sup> = a\u003csup>m−n\u003c/sup>\u003cbr>(a\u003csup>m\u003c/sup>)\u003csup>n\u003c/sup> = a\u003csup>m×n\u003c/sup> · a\u003csup>0\u003c/sup> = 1 · a\u003csup>−n\u003c/sup> = 1 ÷ a\u003csup>n\u003c/sup>", "first": "Write every number with the \u003cb>same small base\u003c/b>: 4 = 2², 8 = 2³, 9 = 3², ½ = 2⁻¹.", "ex": {"q": "What is (2⁵ × 4²) ÷ 8³?", "steps": ["Same base: 4² = (2²)² = \u003cb>2⁴\u003c/b> and 8³ = (2³)³ = \u003cb>2⁹\u003c/b>", "Top: 2⁵ × 2⁴ = 2\u003csup>5+4\u003c/sup> = \u003cb>2⁹\u003c/b>", "2⁹ ÷ 2⁹ = 2\u003csup>9−9\u003c/sup> = 2\u003csup>0\u003c/sup> = \u003cb>1\u003c/b>", "Check: 32 × 16 = 512 and 8³ = 512. 512 ÷ 512 = 1 ✅"]}, "warn": "A minus power does \u003cb>not\u003c/b> make the number negative. 2⁻³ = ⅛, not −8. And a fraction flips and gets \u003cb>big\u003c/b>: (½)⁻² = 2² = 4.", "tip": "The rules work only for × and ÷. For + or −, pull out the smaller power: 2⁵ − 2⁴ = 2⁴ × (2 − 1) = 2⁴ = 16. Check: 32 − 16 = 16.", "page": 8, "n": 48, "hard": 37}, {"key": "translate", "name": "Word problems (turn words into an equation)", "spot": "A short story with numbers and words like \u003cb>\"more than\"\u003c/b>, \u003cb>\"fewer than\"\u003c/b>, \u003cb>\"times\"\u003c/b>, \u003cb>\"total\"\u003c/b>. It asks for one number.", "easy": "\u003cp style=\"margin:4px 0\">Each phrase in the story is a small piece of math. Change them one by one.\u003c/p>\u003ctable>\u003ctr>\u003cth>Words\u003c/th>\u003cth>Math\u003c/th>\u003c/tr>\u003ctr>\u003ctd>5 \u003cb>more than\u003c/b> x\u003c/td>\u003ctd>x + 5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>8 \u003cb>fewer than\u003c/b> x\u003c/td>\u003ctd>x − 8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>twice\u003c/b> x, 3 \u003cb>times\u003c/b> x\u003c/td>\u003ctd>2x, 3x\u003c/td>\u003c/tr>\u003ctr>\u003ctd>the \u003cb>total\u003c/b> is 50\u003c/td>\u003ctd>… + … + … = 50\u003c/td>\u003c/tr>\u003ctr>\u003ctd>the \u003cb>reciprocal\u003c/b> of 5\u003c/td>\u003ctd>1 ÷ 5 = ⅕ (flip it)\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Which thing gets the letter?\u003c/b> The one the others are compared with. Then every other thing is written with that one letter.\u003c/p>", "rule": "1. Give ONE thing a letter.\u003cbr>2. Write every other thing with that letter.\u003cbr>3. Add up or set equal → solve.", "first": "Find the thing the others are compared with. Write \u003cb>\"Let b = …\"\u003c/b> for it.", "ex": {"q": "Ali has 4 more marbles than Ben. Ben has 6 fewer than Cara. Together they have 46. How many does Cara have?", "steps": ["Ben is in both sentences. Let Ben = \u003cb>b\u003c/b>.", "Ali = b + 4. Cara has 6 more than Ben, so Cara = \u003cb>b + 6\u003c/b>.", "Total: b + (b + 4) + (b + 6) = 46 → 3b + 10 = 46", "3b = 36 → b = 12, so Cara = 12 + 6 = \u003cb>18\u003c/b>", "Check: Ali 16 + Ben 12 + Cara 18 = 46 ✅"]}, "warn": "Do not write it backwards. \"Ben has 6 fewer than Cara\" means Ben = Cara − 6. If Cara has 18, Ben has \u003cb>12\u003c/b>, not 24.", "tip": "If the question asks for a whole piece, like x − 2y, do not find x and y. Change the equation until that piece appears. Also, the answer can be a decimal (2.6 kg is fine).", "page": 7, "n": 41, "hard": 23}, {"key": "musttrue", "name": "Must be true or could be true", "spot": "The question says \u003cb>\"must be\"\u003c/b>, \u003cb>\"could be\"\u003c/b>, \u003cb>\"which of the following is true\"\u003c/b> or \u003cb>\"indicate all\"\u003c/b>.", "easy": "\u003cp style=\"margin:4px 0\">\"All my children are tall.\" One short child is enough to make this \u003cb>false\u003c/b>.\u003c/p>\u003ctable>\u003ctr>\u003cth>Word\u003c/th>\u003cth>It means\u003c/th>\u003cth>How to test\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cb>must\u003c/b> be\u003c/td>\u003ctd>true for \u003cb>every\u003c/b> number allowed\u003c/td>\u003ctd>find one number that fails → cross it out\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>could\u003c/b> be\u003c/td>\u003ctd>true for \u003cb>at least one\u003c/b> number\u003c/td>\u003ctd>find one number that works → keep it\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">Many of these are about \u003cb>odd\u003c/b> and \u003cb>even\u003c/b>. Learn this small table:\u003c/p>\u003ctable>\u003ctr>\u003cth>Rule\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003ctr>\u003ctd>odd + odd = \u003cb>even\u003c/b>\u003c/td>\u003ctd>3 + 5 = 8\u003c/td>\u003c/tr>\u003ctr>\u003ctd>odd + even = \u003cb>odd\u003c/b>\u003c/td>\u003ctd>3 + 2 = 5\u003c/td>\u003c/tr>\u003ctr>\u003ctd>odd × odd = \u003cb>odd\u003c/b>\u003c/td>\u003ctd>3 × 5 = 15\u003c/td>\u003c/tr>\u003ctr>\u003ctd>even × any = \u003cb>even\u003c/b>\u003c/td>\u003ctd>2 × 3 = 6\u003c/td>\u003c/tr>\u003c/table>", "rule": "MUST: one example that fails → cross it out.\u003cbr>COULD: one example that works → keep it.", "first": "Test each choice with one \u003cb>odd\u003c/b> number and one \u003cb>even\u003c/b> number (and 0 or a negative if allowed).", "ex": {"q": "x is an integer. Which must be even? (A) 3x (B) x + 1 (C) x(x + 1)", "steps": ["Try x = 1: 3x = 3 is odd → \u003cb>cross out A\u003c/b>", "Try x = 2: x + 1 = 3 is odd → \u003cb>cross out B\u003c/b>", "C: x = 1 gives 1 × 2 = 2, x = 2 gives 2 × 3 = 6. Both even.", "Why always? x and x + 1 are two numbers in a row. One of them is even, and even × any = even.", "Answer: \u003cb>C\u003c/b> ✅"]}, "warn": "One example that works does \u003cb>not\u003c/b> prove \"must\". x + 1 is even when x = 1 (it is 2), but odd when x = 2 (it is 3).", "tip": "For \"must\" questions, look for a reason that always works, like \"two numbers in a row\" or \"odd × odd\". For \"could\", one good example is enough.", "page": 1, "n": 39, "hard": 23}, {"key": "quad", "name": "Quadratics (equations with x²)", "spot": "You see \u003cb>x²\u003c/b> in an equation, or words like \u003cb>\"solutions\"\u003c/b>, \u003cb>\"roots\"\u003c/b>, \u003cb>\"product of the solutions\"\u003c/b>, or brackets like \u003cb>(x − 1)(x + 5)\u003c/b>.", "easy": "\u003cp style=\"margin:4px 0\">An equation with x² usually has \u003cb>two\u003c/b> answers (two \u003cb>solutions\u003c/b>, also called \u003cb>roots\u003c/b>).\u003c/p>\u003cp style=\"margin:4px 0\">\u003cb>Key fact:\u003c/b> if two numbers multiply to 0, one of them \u003cb>is\u003c/b> 0.\u003c/p>\u003cp style=\"margin:4px 0\">Solve \u003cb>x² − 5x + 6 = 0\u003c/b>:\u003c/p>\u003cp style=\"margin:4px 0\">1. Two numbers that multiply to 6 and add to −5: \u003cb>−2 and −3\u003c/b>\u003cbr>2. Brackets: (x − 2)(x − 3) = 0\u003cbr>3. One bracket is 0: x = \u003cb>2\u003c/b> or x = \u003cb>3\u003c/b> ✅\u003c/p>\u003cp style=\"margin:4px 0\">\u003cb>Shortcut:\u003c/b> for x² − 5x + 6 = 0, the two answers add to \u003cb>5\u003c/b> and multiply to \u003cb>6\u003c/b>. Check: 2 + 3 = 5 and 2 × 3 = 6.\u003c/p>", "rule": "ax² + bx + c = 0 → the two answers add to −b ÷ a and multiply to c ÷ a\u003cbr>Special: x² − y² = (x − y)(x + y)", "first": "Move everything to one side so the other side is \u003cb>0\u003c/b>. Then split into brackets, or use the add/multiply shortcut.", "ex": {"q": "What is the product of the two solutions of 2x² + 7x − 4 = 0?", "steps": ["Here a = 2, b = 7, c = −4.", "Product = c ÷ a = −4 ÷ 2 = \u003cb>−2\u003c/b>", "Check by brackets: (2x − 1)(x + 4) = 0 → x = ½ or x = −4", "½ × (−4) = −2 ✅"]}, "warn": "The \"one bracket is 0\" trick works only when the other side is \u003cb>0\u003c/b>. (x − 1)(x + 5) = 7 does not mean x − 1 = 7 (x = 8 gives 7 × 13 = 91). First make one side 0: x² + 4x − 12 = 0 → x = 2 or −6.", "tip": "If one solution is given, use the \u003cb>add\u003c/b> shortcut to get the other. x² + 2x − k = 0 and x = 3 is one answer: the two add to −2, so the other is −2 − 3 = \u003cb>−5\u003c/b>.", "page": 7, "n": 32, "hard": 18}, {"key": "seq", "name": "Sequences (lists that follow a rule)", "spot": "You see \u003cb>a\u003csub>1\u003c/sub>, a\u003csub>2\u003c/sub>, a\u003csub>3\u003c/sub>, …\u003c/b>, \u003cb>\"each term after the first\"\u003c/b>, or a rule like \u003cb>a\u003csub>n\u003c/sub> = a\u003csub>n−1\u003c/sub> + 3\u003c/b>.", "easy": "\u003csvg viewBox='0 0 320 108' aria-hidden='true'>\u003ccircle cx='40' cy='50' r='7' fill='#1e6f9f'/>\u003ctext x='40' y='32' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#1e6f9f'>5\u003c/text>\u003ctext x='40' y='78' font-family='Arial' font-size='13' text-anchor='middle' fill='#4a5866'>a₁\u003c/text>\u003ccircle cx='100' cy='50' r='7' fill='#1e6f9f'/>\u003ctext x='100' y='32' font-family='Arial' font-size='15' font-weight='700' text-anchor='middle' fill='#1e6f9f'>8\u003c/text>\u003ctext x='100' y='78' font-family='Arial' font-size='13' text-anchor='middle' fill='#4a5866'>a₂\u003c/text>\u003ccircle cx='160' cy='50' r='7' fill='#1e6f9f'/>\u003ctext x='160' y='32' font-family='Arial' font-size='15'
