" stroke-width=\"2\"/>\u003cline x1=\"40\" y1=\"182\" x2=\"310\" y2=\"182\" stroke=\"#1b2430\" stroke-width=\"2\"/>\u003c/svg>\u003cp style=\"margin:4px 0\">The \u003cb>key\u003c/b> at the top tells you which colour is which year. Blue = 2010, green = 2020.\u003c/p>\u003ctable>\u003ctr>\u003cth>City A\u003c/th>\u003cth>Read\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Blue bar (2010)\u003c/td>\u003ctd>\u003cb>40\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Green bar (2020)\u003c/td>\u003ctd>\u003cb>50\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Change\u003c/td>\u003ctd>(50 − 40) ÷ 40 = 0.25 = \u003cb>25% up\u003c/b>\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why ÷ 40?\u003c/b> 2010 comes first, so 40 is the start (old) number.\u003c/p>", "rule": "Key → colour → bar → go straight left to the scale.\u003cbr>Percent change = (new − old) ÷ old × 100", "first": "Point at the key and say it: \u003cb>blue = 2010, green = 2020\u003c/b>. Then find your bars.", "ex": {"q": "In the chart above, which city had the biggest \u003cb>percent\u003c/b> drop from 2010 to 2020?", "steps": ["City A went \u003cb>up\u003c/b> (40 → 50). Skip it.", "City B: 30 → 24. Drop 6. 6 ÷ 30 = \u003cb>20%\u003c/b>", "City C: 60 → 51. Drop 9. 9 ÷ 60 = \u003cb>15%\u003c/b>", "Biggest percent drop: \u003cb>City B\u003c/b> ✅ (even though City C lost more: 9 > 6)"]}, "warn": "Divide by the \u003cb>old\u003c/b> (first) bar. City A: 10 ÷ 40 = \u003cb>25%\u003c/b> up. 10 ÷ 50 = 20% is the trap answer.", "tip": "A note says “total = savings + checking”? Add the two bars first, then compare. And check that the scale starts at 0.", "page": 17, "n": 15, "hard": 0}], "rare": [{"key": "linechange", "name": "Change on a line graph", "hint": "read both heights and subtract; use the trend line if asked", "page": 17, "n": 6}, {"key": "timeline", "name": "Timeline (waiting time) charts", "hint": "measure each bar's length, not where it ends", "page": 17, "n": 5}, {"key": "cumulative", "name": "“Fewer than” (running total) tables", "hint": "exactly 2 = (fewer than 3) − (fewer than 2)", "page": 17, "n": 4}, {"key": "rangechart", "name": "High–low range charts", "hint": "each bar gives two numbers: bottom = low, top = high", "page": 17, "n": 3}, {"key": "subgroups", "name": "What a whole-group table hides", "hint": "a table of everyone says nothing about one subgroup", "page": 17, "n": 1}, {"key": "barspan", "name": "Two bars at the same time", "hint": "both at once: from the later start to the earlier end", "page": 17, "n": 1}, {"key": "coveraxis", "name": "When no bar is happening", "hint": "mark every bar on one line; find the empty gaps", "page": 17, "n": 1}, {"key": "servers", "name": "Two helpers, overlapping bars", "hint": "bars that overlap must belong to different helpers", "page": 17, "n": 1}]}, {"s": "stat", "name": "Statistics", "short": "Statistics", "common": [{"key": "medpos", "name": "Median (the middle number)", "spot": "The question says \u003cb>\"median\"\u003c/b> or \u003cb>\"the middle value\"\u003c/b>.", "easy": "\u003cp style=\"margin:4px 0\">Line up children from shortest to tallest. The child standing \u003cb>in the middle\u003c/b> is the median.\u003c/p>\u003ctable>\u003ctr>\u003cth>Numbers in order\u003c/th>\u003cth>How many\u003c/th>\u003cth>Median\u003c/th>\u003c/tr>\u003ctr>\u003ctd>2, 4, \u003cb>7\u003c/b>, 9, 10\u003c/td>\u003ctd>5 (odd)\u003c/td>\u003ctd>one middle → \u003cb>7\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2, 4, \u003cb>4, 7\u003c/b>, 9, 10\u003c/td>\u003ctd>6 (even)\u003c/td>\u003ctd>two middles → halfway: (4 + 7) ÷ 2 = \u003cb>5.5\u003c/b>\u003c/td>\u003c/tr>\u003c/table>", "rule": "Place of the median = (how many + 1) ÷ 2\u003cbr>9 numbers → the 5th · 10 numbers → halfway between the 5th and 6th", "first": "\u003cb>Put the numbers in order\u003c/b>, smallest to biggest. Then count.", "ex": {"q": "Find the median of 7, 2, 9, 4, 4, 10.", "steps": ["In order: 2, 4, 4, 7, 9, 10", "6 numbers (even), so there are two middles: the 3rd and 4th → \u003cb>4\u003c/b> and \u003cb>7\u003c/b>", "Halfway: (4 + 7) ÷ 2 = \u003cb>5.5\u003c/b> ✅"]}, "ex2": {"q": "A table shows quiz scores: score 1 → 2 students, score 2 → 3 students, score 3 → 4 students, score 4 → 2 students. Find the median score.", "steps": ["How many students? 2 + 3 + 4 + 2 = \u003cb>11\u003c/b>", "Place of the median: (11 + 1) ÷ 2 = the \u003cb>6th\u003c/b> student", "Count as you go: the 1s fill places 1–2, the 2s fill places 3–5, the 3s fill places 6–9", "The 6th student has a 3, so the median is \u003cb>3\u003c/b> ✅"]}, "warn": "Sort first! For 7, 2, 9, the middle one as written is 2, but the median is \u003cb>7\u003c/b> (order: 2, 7, 9).", "tip": "Making the biggest number even bigger does \u003cb>not\u003c/b> move the median. The middle child stays in the middle.", "page": 18, "n": 36, "hard": 17}, {"key": "rangeends", "name": "Range (biggest minus smallest)", "spot": "The question says \u003cb>\"range\"\u003c/b>, or asks how far apart the \u003cb>greatest\u003c/b> and the \u003cb>least\u003c/b> values are.", "easy": "\u003csvg viewBox='0 0 320 118' aria-hidden='true'>\u003ctext x='20' y='16' font-family='Arial' font-size='13' fill='#4a5866'>Temperatures this week: 12°, 15°, 20°, 22°, 27°\u003c/text>\u003cline x1='48' y1='46' x2='258' y2='46' stroke='#b23a2a' stroke-width='2'/>\u003cline x1='48' y1='46' x2='48' y2='54' stroke='#b23a2a' stroke-width='2'/>\u003cline x1='258' y1='46' x2='258' y2='54' stroke='#b23a2a' stroke-width='2'/>\u003ctext x='153.0' y='38' font-family='Arial' font-size='14' text-anchor='middle' fill='#b23a2a' font-weight='700'>range = 27 − 12 = 15\u003c/text>\u003cline x1='20' y1='68' x2='300' y2='68' stroke='#1b2430' stroke-width='2'/>\u003cline x1='20' y1='63' x2='20' y2='73' stroke='#1b2430' stroke-width='1.5'/>\u003ctext x='20' y='90' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>10\u003c/text>\u003cline x1='90' y1='63' x2='90' y2='73' stroke='#1b2430' stroke-width='1.5'/>\u003ctext x='90' y='90' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>15\u003c/text>\u003cline x1='160' y1='63' x2='160' y2='73' stroke='#1b2430' stroke-width='1.5'/>\u003ctext x='160' y='90' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>20\u003c/text>\u003cline x1='230' y1='63' x2='230' y2='73' stroke='#1b2430' stroke-width='1.5'/>\u003ctext x='230' y='90' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>25\u003c/text>\u003cline x1='300' y1='63' x2='300' y2='73' stroke='#1b2430' stroke-width='1.5'/>\u003ctext x='300' y='90' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>30\u003c/text>\u003ccircle cx='90' cy='68' r='6' fill='#1e6f9f'/>\u003ccircle cx='160' cy='68' r='6' fill='#1e6f9f'/>\u003ccircle cx='188' cy='68' r='6' fill='#1e6f9f'/>\u003ccircle cx='48' cy='68' r='7' fill='#b23a2a'/>\u003ccircle cx='258' cy='68' r='7' fill='#b23a2a'/>\u003ctext x='20' y='110' font-family='Arial' font-size='13' fill='#4a5866'>Only the two red ends count. The blue ones do not.\u003c/text>\u003c/svg>\u003cp style=\"margin:4px 0\">The \u003cb>range\u003c/b> tells you how far the numbers stretch, from the smallest to the biggest.\u003c/p>\u003ctable>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Work\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Biggest\u003c/td>\u003ctd>\u003cb>27\u003c/b>°\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Smallest\u003c/td>\u003ctd>\u003cb>12\u003c/b>°\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Range\u003c/td>\u003ctd>27 − 12 = \u003cb>15\u003c/b>° ✅\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why only two numbers?\u003c/b> The days in the middle stay inside the stretch. They never change it.\u003c/p>", "rule": "Range = biggest − smallest", "first": "Find the \u003cb>biggest\u003c/b> and the \u003cb>smallest\u003c/b> number. Ignore all the others.", "ex": {"q": "The list 8, 14, y, 11, 5 has a range of 12. What could y be?", "steps": ["Without y: biggest 14, smallest 5 → range 14 − 5 = 9. Too small.", "So y must be a \u003cb>new end\u003c/b>: the new biggest or the new smallest.", "New biggest: y = 5 + 12 = \u003cb>17\u003c/b>", "New smallest: y = 14 − 12 = \u003cb>2\u003c/b>", "Check: 17 − 5 = 12 ✅ and 14 − 2 = 12 ✅ So y = \u003cb>17 or 2\u003c/b>."]}, "warn": "Range is a \u003cb>distance\u003c/b>, not the biggest number. 40, 42, 45 are big numbers, but the range is only 45 − 40 = \u003cb>5\u003c/b>.", "tip": "On a line graph, the range of a line = how far it moves \u003cb>up and down\u003c/b>, not how high it sits on the page.", "page": 18, "n": 27, "hard": 12}, {"key": "sumbridge", "name": "Average and total (work with totals)", "spot": "The question gives an \u003cb>\"average (arithmetic mean)\"\u003c/b>, and then a number is \u003cb>added\u003c/b>, \u003cb>removed\u003c/b>, or the list is \u003cb>split\u003c/b> into two parts.", "easy": "\u003csvg viewBox='0 0 320 160' aria-hidden='true'>\u003ctext x='14' y='14' font-family='Arial' font-size='13' fill='#4a5866'>$4 + $6 + $11 = $21, shared by 3 friends\u003c/text>\u003crect x='20' y='98' width='26' height='36' fill='#1e6f9f'/>\u003ctext x='33' y='152' font-family='Arial' font-size='13' text-anchor='middle' fill='#1e6f9f' font-weight='700'>$4\u003c/text>\u003crect x='56' y='80' width='26' height='54' fill='#1e6f9f'/>\u003ctext x='69' y='152' font-family='Arial' font-size='13' text-anchor='middle' fill='#1e6f9f' font-weight='700'>$6\u003c/text>\u003crect x='92' y='35' width='26' height='99' fill='#1e6f9f'/>\u003ctext x='105' y='152' font-family='Arial' font-size='13' text-anchor='middle' fill='#1e6f9f' font-weight='700'>$11\u003c/text>\u003crect x='196' y='71' width='26' height='63' fill='#2e7a57'/>\u003ctext x='209' y='152' font-family='Arial' font-size='13' text-anchor='middle' fill='#2e7a57' font-weight='700'>$7\u003c/text>\u003crect x='232' y='71' width='26' height='63' fill='#2e7a57'/>\u003ctext x='245' y='152' font-family='Arial' font-size='13' text-anchor='middle' fill='#2e7a57' font-weight='700'>$7\u003c/text>\u003crect x='268' y='71' width='26' height='63' fill='#2e7a57'/>\u003ctext x='281' y='152' font-family='Arial' font-size='13' text-anchor='middle' fill='#2e7a57' font-weight='700'>$7\u003c/text>\u003cline x1='14' y1='71' x2='310' y2='71' stroke='#2e7a57' stroke-width='2' stroke-dasharray='6 4'/>\u003ctext x='162' y='104' font-family='Arial' font-size='13' text-anchor='middle' fill='#4a5866'>share\u003c/text>\u003ctext x='162' y='122' font-family='Arial' font-size='13' text-anchor='middle' fill='#4a5866'>equally →\u003c/text>\u003ctext x='162' y='58' font-family='Arial' font-size='13' text-anchor='middle' fill='#2e7a57' font-weight='700'>average $7\u003c/text>\u003cline x1='10' y1='134' x2='310' y2='134' stroke='#1b2430' stroke-width='2'/>\u003c/svg>\u003cp style=\"margin:4px 0\">The \u003cb>average\u003c/b> (arithmetic mean) is what each person gets if you share the total \u003cb>equally\u003c/b>.\u003c/p>\u003ctable>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Work\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Total\u003c/td>\u003ctd>4 + 6 + 11 = \u003cb>$21\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Share by 3\u003c/td>\u003ctd>21 ÷ 3 = \u003cb>$7\u003c/b> each\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Go back\u003c/td>\u003ctd>7 × 3 = \u003cb>$21\u003c/b> again ✅\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why go back?\u003c/b> Totals can be added and taken away. Averages cannot. So turn averages into totals first.\u003c/p>", "rule": "Total = average × how many\u003cbr>Average = total ÷ how many", "first": "Turn every average into a \u003cb>total\u003c/b>: average × how many.", "ex": {"q": "The average of 5 numbers is 12. One number is taken away. The average of the other 4 is 10. What number was taken away?", "steps": ["Total of all 5: 12 × 5 = \u003cb>60\u003c/b>", "Total of the 4 left: 10 × 4 = \u003cb>40\u003c/b>", "Taken away: 60 − 40 = \u003cb>20\u003c/b>", "Check: (40 + 20) ÷ 5 = 60 ÷ 5 = 12 ✅"]}, "warn": "Do not subtract the averages. 12 − 10 = 2 is \u003cb>wrong\u003c/b>. Work with totals: 60 − 40 = \u003cb>20\u003c/b>.", "tip": "Add 3 to every number → the average goes up by 3. Double every number → the average doubles.", "page": 18, "n": 26, "hard": 14}, {"key": "weighted", "name": "Weighted average (two groups put together)", "spot": "Two groups of \u003cb>different sizes\u003c/b>, each with its own \u003cb>average\u003c/b> or \u003cb>percent\u003c/b>, are put \u003cb>together\u003c/b>. Or the question says \u003cb>\"weighted\"\u003c/b>.", "easy": "\u003csvg viewBox='0 0 320 118' aria-hidden='true'>\u003cline x1='40' y1='66' x2='280' y2='66' stroke='#1b2430' stroke-width='2'/>\u003cline x1='60' y1='61' x2='60' y2='71' stroke='#1b2430' stroke-width='1.5'/>\u003cline x1='110' y1='61' x2='110' y2='71' stroke='#1b2430' stroke-width='1.5'/>\u003cline x1='160' y1='61' x2='160' y2='71' stroke='#1b2430' stroke-width='1.5'/>\u003cline x1='210' y1='61' x2='210' y2='71' stroke='#1b2430' stroke-width='1.5'/>\u003cline x1='260' y1='61' x2='260' y2='71' stroke='#1b2430' stroke-width='1.5'/>\u003ctext x='60' y='22' font-family='Arial' font-size='13' text-anchor='middle' fill='#1e6f9f' font-weight='700'>30 students\u003c/text>\u003ctext x='60' y='40' font-family='Arial' font-size='13' text-anchor='middle' fill='#1e6f9f'>average 60\u003c/text>\u003ctext x='260' y='22' font-family='Arial' font-size='13' text-anchor='middle' fill='#b23a2a' font-weight='700'>10 students\u003c/text>\u003ctext x='260' y='40' font-family='Arial' font-size='13' text-anchor='middle' fill='#b23a2a'>average 80\u003c/text>\u003ctext x='160' y='46' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>plain middle 70\u003c/text>\u003ccircle cx='60' cy='66' r='7' fill='#1e6f9f'/>\u003ccircle cx='260' cy='66' r='7' fill='#b23a2a'/>\u003ccircle cx='110' cy='66' r='7' fill='#2e7a57'/>\u003ctext x='110' y='92' font-family='Arial' font-size='14' text-anchor='middle' fill='#2e7a57' font-weight='700'>together: 65\u003c/text>\u003ctext x='110' y='110' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>(nearer the bigger group)\u003c/text>\u003c/svg>\u003cp style=\"margin:4px 0\">30 students average \u003cb>60\u003c/b>. 10 students average \u003cb>80\u003c/b>. What is the average of all 40?\u003c/p>\u003ctable>\u003ctr>\u003cth>Group\u003c/th>\u003cth>Total points\u003c/th>\u003c/tr>\u003ctr>\u003ctd>30 students × 60\u003c/td>\u003ctd>\u003cb>1800\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>10 students × 80\u003c/td>\u003ctd>\u003cb>800\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>All 40 students\u003c/td>\u003ctd>2600 ÷ 40 = \u003cb>65\u003c/b> ✅\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why 65 and not 70?\u003c/b> There are more students at 60. The bigger group pulls the answer toward itself.\u003c/p>", "rule": "Combined average = (total of group 1 + total of group 2) ÷ (everyone)\u003cbr>= (n₁ × a₁ + n₂ × a₂) ÷ (n₁ + n₂)", "first": "Write each group's \u003cb>size\u003c/b> and \u003cb>average\u003c/b> (or percent). Turn them into totals.", "ex": {"q": "A club has 20 men and 30 women. 50% of the men and 10% of the women play chess. What percent of the club plays chess?", "steps": ["Men: 50% of 20 = \u003cb>10\u003c/b> players", "Women: 10% of 30 = \u003cb>3\u003c/b> players", "Together: 10 + 3 = 13 players out of 20 + 30 = 50 people", "13 ÷ 50 = 0.26 = \u003cb>26%\u003c/b> ✅ (between 10% and 50%, nearer the bigger group)"]}, "warn": "Do not just take the middle of the two percents. (50% + 10%) ÷ 2 = 30% is \u003cb>wrong\u003c/b> when the groups have different sizes. The right answer is 26%.", "tip": "The answer is always \u003cb>between\u003c/b> the two averages. If the weights are given as percents (40% and 60%), just do 0.4 × first + 0.6 × second.", "page": 18, "n": 16, "hard": 6}, {"key": "sdmove", "name": "Changing every number (what the spread does)", "spot": "The question says \u003cb>\"standard deviation\"\u003c/b>, and every number is \u003cb>changed the same way\u003c/b>: \u003cb>+ 3\u003c/b>, \u003cb>× 2\u003c/b> or \u003cb>y = 2x − 10\u003c/b>.", "easy": "\u003cp style=\"margin:4px 0\">\u003cb>Standard deviation\u003c/b> (SD) = how \u003cb>spread out\u003c/b> the numbers are. Dots close together → small SD. Dots far apart → big SD.\u003c/p>\u003csvg viewBox='0 0 320 184' aria-hidden='true'>\u003ctext x='30' y='18' font-family='Arial' font-size='13' fill='#1e6f9f' font-weight='700'>Start: 2, 3, 4\u003c/text>\u003cline x1='30' y1='38' x2='270' y2='38' stroke='#1b2430' stroke-width='2'/>\u003cline x1='30' y1='34' x2='30' y2='42' stroke='#1b2430' stroke-width='1'/>\u003cline x1='54' y1='34' x2='54' y2='42' stroke='#1b2430' stroke-width='1'/>\u003cline x1='78' y1='34' x2='78' y2='42' stroke='#1b2430' stroke-width='1'/>\u003cline x1='102' y1='34' x2='102' y2='42' stroke='#1b2430' stroke-width='1'/>\u003cline x1='126' y1='34' x2='126' y2='42' stroke='#1b2430' stroke-width='1'/>\u003cline x1='150' y1='34' x2='150' y2='42' stroke='#1b2430' stroke-width='1'/>\u003cline x1='174' y1='34' x2='174' y2='42' stroke='#1b2430' stroke-width='1'/>\u003cline x1='198' y1='34' x2='198' y2='42' stroke='#1b2430' stroke-width='1'/>\u003cline x1='222' y1='34' x2='222' y2='42' stroke='#1b2430' stroke-width='1'/>\u003cline x1='246' y1='34' x2='246' y2='42' stroke='#1b2430' stroke-width='1'/>\u003cline x1='270' y1='34' x2='270' y2='42' stroke='#1b2430' stroke-width='1'/>\u003ccircle cx='78' cy='38' r='7' fill='#1e6f9f'/>\u003ccircle cx='102' cy='38' r='7' fill='#1e6f9f'/>\u003ccircle cx='126' cy='38' r='7' fill='#1e6f9f'/>\u003ctext x='30' y='70' font-family='Arial' font-size='13' fill='#2e7a57' font-weight='700'>Add 5: 7, 8, 9 → same gaps, same SD\u003c/text>\u003cline x1='30' y1='90' x2='270' y2='90' stroke='#1b2430' stroke-width='2'/>\u003cline x1='30' y1='86' x2='30' y2='94' stroke='#1b2430' stroke-width='1'/>\u003cline x1='54' y1='86' x2='54' y2='94' stroke='#1b2430' stroke-width='1'/>\u003cline x1='78' y1='86' x2='78' y2='94' stroke='#1b2430' stroke-width='1'/>\u003cline x1='102' y1='86' x2='102' y2='94' stroke='#1b2430' stroke-width='1'/>\u003cline x1='126' y1='86' x2='126' y2='94' stroke='#1b2430' stroke-width='1'/>\u003cline x1='150' y1='86' x2='150' y2='94' stroke='#1b2430' stroke-width='1'/>\u003cline x1='174' y1='86' x2='174' y2='94' stroke='#1b2430' stroke-width='1'/>\u003cline x1='198' y1='86' x2='198' y2='94' stroke='#1b2430' stroke-width='1'/>\u003cline x1='222' y1='86' x2='222' y2='94' stroke='#1b2430' stroke-width='1'/>\u003cline x1='246' y1='86' x2='246' y2='94' stroke='#1b2430' stroke-width='1'/>\u003cline x1='270' y1='86' x2='270' y2='94' stroke='#1b2430' stroke-width='1'/>\u003ccircle cx='198' cy='90' r='7' fill='#2e7a57'/>\u003ccircle cx='222' cy='90' r='7' fill='#2e7a57'/>\u003ccircle cx='246' cy='90' r='7' fill='#2e7a57'/>\u003ctext x='30' y='122' font-family='Arial' font-size='13' fill='#b23a2a' font-weight='700'>Times 2: 4, 6, 8 → gaps double, SD × 2\u003c/text>\u003cline x1='30' y1='142' x2='270' y2='142' stroke='#1b2430' stroke-width='2'/>\u003cline x1='30' y1='138' x2='30' y2='146' stroke='#1b2430' stroke-width='1'/>\u003cline x1='54' y1='138' x2='54' y2='146' stroke='#1b2430' stroke-width='1'/>\u003cline x1='78' y1='138' x2='78' y2='146' stroke='#1b2430' stroke-width='1'/>\u003cline x1='102' y1='138' x2='102' y2='146' stroke='#1b2430' stroke-width='1'/>\u003cline x1='126' y1='138' x2='126' y2='146' stroke='#1b2430' stroke-width='1'/>\u003cline x1='150' y1='138' x2='150' y2='146' stroke='#1b2430' stroke-width='1'/>\u003cline x1='174' y1='138' x2='174' y2='146' stroke='#1b2430' stroke-width='1'/>\u003cline x1='198' y1='138' x2='198' y2='146' stroke='#1b2430' stroke-width='1'/>\u003cline x1='222' y1='138' x2='222' y2='146' stroke='#1b2430' stroke-width='1'/>\u003cline x1='246' y1='138' x2='246' y2='146' stroke='#1b2430' stroke-width='1'/>\u003cline x1='270' y1='138' x2='270' y2='146' stroke='#1b2430' stroke-width='1'/>\u003ccircle cx='126' cy='142' r='7' fill='#b23a2a'/>\u003ccircle cx='174' cy='142' r='7' fill='#b23a2a'/>\u003ccircle cx='222' cy='142' r='7' fill='#b23a2a'/>\u003ctext x='30' y='176' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>0\u003c/text>\u003ctext x='78' y='176' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>2\u003c/text>\u003ctext x='126' y='176' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>4\u003c/text>\u003ctext x='174' y='176' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>6\u003c/text>\u003ctext x='222' y='176' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>8\u003c/text>\u003ctext x='270' y='176' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>10\u003c/text>\u003c/svg>\u003ctable>\u003ctr>\u003cth>Do to every number\u003c/th>\u003cth>The dots\u003c/th>\u003cth>SD\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Add 5 (or take away 5)\u003c/td>\u003ctd>all slide over, gaps stay\u003c/td>\u003ctd>\u003cb>same\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Times 2\u003c/td>\u003ctd>gaps get 2 times wider\u003c/td>\u003ctd>\u003cb>× 2\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Times −2\u003c/td>\u003ctd>flip over, gaps 2 times wider\u003c/td>\u003ctd>\u003cb>× 2\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Move only the end numbers farther out\u003c/td>\u003ctd>gaps grow\u003c/td>\u003ctd>\u003cb>bigger\u003c/b>\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why does adding not count?\u003c/b> SD only looks at the \u003cb>gaps\u003c/b>. Sliding all the dots keeps every gap.\u003c/p>", "rule": "Add or take away the same number → SD stays the same\u003cbr>Multiply every number by k → SD × k (ignore a minus sign)", "first": "Ask: was the same number \u003cb>added\u003c/b> to all (SD same) or were all \u003cb>multiplied\u003c/b> (SD multiplied)?", "ex": {"q": "A list has SD 2. Each number x is turned into y = 3x + 4. What is the SD of the new list?", "steps": ["The \u003cb>+ 4\u003c/b> slides every number. It does not change the SD.", "The \u003cb>× 3\u003c/b> makes every gap 3 times wider.", "New SD = 3 × 2 = \u003cb>6\u003c/b>", "Check with 1, 2, 3 → 7, 10, 13: the gaps were 1, now they are 3 ✅"]}, "warn": "Adding to every number does \u003cb>not\u003c/b> add to the SD. 1, 2, 3 and 11, 12, 13 have the \u003cb>same\u003c/b> SD. So the SD of x + 1, y + 1, z + 1 is still d, not d + 1.", "tip": "The rule, for later: SD of (a × x + b) = (a with any minus sign dropped) × SD of x. The + b disappears.", "page": 18, "n": 12, "hard": 6}, {"key": "symmetry", "name": "Balanced lists (same on both sides)", "spot": "The list is the \u003cb>same on both sides of the middle\u003c/b> (like 20 − c, 20, 20 + c), or the question says the \u003cb>\"mean and median are equal\"\u003c/b>, or asks which list has the \u003cb>greater standard deviation\u003c/b>.", "easy": "\u003csvg viewBox='0 0 320 120' aria-hidden='true'>\u003cline x1='20' y1='60' x2='300' y2='60' stroke='#1b2430' stroke-width='2'/>\u003cline x1='160' y1='26' x2='160' y2='76' stroke='#2e7a57' stroke-width='2' stroke-dasharray='5 4'/>\u003ccircle cx='76' cy='60' r='7' fill='#b23a2a'/>\u003ctext x='76' y='44' font-family='Arial' font-size='14' text-anchor='middle' fill='#b23a2a' font-weight='700'>−6\u003c/text>\u003ctext x='76' y='90' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>4\u003c/text>\u003ccircle cx='118' cy='60' r='7' fill='#1e6f9f'/>\u003ctext x='118' y='44' font-family='Arial' font-size='14' text-anchor='middle' fill='#1e6f9f' font-weight='700'>−3\u003c/text>\u003ctext x='118' y='90' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>7\u003c/text>\u003ccircle cx='202' cy='60' r='7' fill='#1e6f9f'/>\u003ctext x='202' y='44' font-family='Arial' font-size='14' text-anchor='middle' fill='#1e6f9f' font-weight='700'>+3\u003c/text>\u003ctext x='202' y='90' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>13\u003c/text>\u003ccircle cx='244' cy='60' r='7' fill='#b23a2a'/>\u003ctext x='244' y='44' font-family='Arial' font-size='14' text-anchor='middle' fill='#b23a2a' font-weight='700'>+6\u003c/text>\u003ctext x='244' y='90' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>16\u003c/text>\u003ccircle cx='160' cy='60' r='7' fill='#2e7a57'/>\u003ctext x='160' y='18' font-family='Arial' font-size='13' text-anchor='middle' fill='#2e7a57' font-weight='700'>middle 10\u003c/text>\u003ctext x='160' y='90' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>10\u003c/text>\u003ctext x='160' y='112' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>Mirror images: 3 below ↔ 3 above, 6 below ↔ 6 above\u003c/text>\u003c/svg>\u003cp style=\"margin:4px 0\">A list is \u003cb>balanced\u003c/b> when each number below the middle has a \u003cb>mirror\u003c/b> number just as far above it.\u003c/p>\u003ctable>\u003ctr>\u003cth>List\u003c/th>\u003cth>Average\u003c/th>\u003cth>Median\u003c/th>\u003c/tr>\u003ctr>\u003ctd>4, 7, 10, 13, 16\u003c/td>\u003ctd>50 ÷ 5 = \u003cb>10\u003c/b>\u003c/td>\u003ctd>\u003cb>10\u003c/b>\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why is the average 10?\u003c/b> The −6 and +6 cancel. The −3 and +3 cancel. Only the middle is left.\u003c/p>", "rule": "Balanced list → average = median = the middle number\u003cbr>Same middle? Numbers farther from the middle → bigger SD", "first": "Find the middle number. Write how far each number is from it: −6, −3, 0, +3, +6.", "ex": {"q": "3 numbers have average 12 and median 12. The greatest is 10 more than the least. What is the greatest?", "steps": ["For 3 numbers, average = median means the list is balanced around \u003cb>12\u003c/b>.", "The ends are 10 apart, so each end is 10 ÷ 2 = \u003cb>5\u003c/b> away from 12.", "The list is 7, 12, 17. The greatest is \u003cb>17\u003c/b>", "Check: (7 + 12 + 17) ÷ 3 = 36 ÷ 3 = 12 ✅ and 17 − 7 = 10 ✅"]}, "ex2": {"q": "Which has the greater SD? A: 10, 12, 15, 18, 20 or B: 10, 14, 15, 16, 20", "steps": ["Both are balanced around \u003cb>15\u003c/b>.", "Distances from 15 in A: 5, 3, 0, 3, 5", "Distances from 15 in B: 5, 1, 0, 1, 5", "A's numbers sit farther from the middle, so \u003cb>A\u003c/b> has the greater SD ✅"]}, "warn": "Same range does not mean same SD. A and B both go from 10 to 20 (range 10), but A is more spread out.", "tip": "A table that reads the same from both ends (counts 10, 6, 2, 4, 2, 6, 10) is balanced too. Its average and median are the middle value.", "page": 18, "n": 9, "hard": 5}, {"key": "sd", "name": "Standard deviation (how spread out the numbers are)", "spot": "The question says \u003cb>\"standard deviation\"\u003c/b> and compares two lists, two tables or two \u003cb>histograms\u003c/b> (bar charts of how often each value appears).", "easy": "\u003csvg viewBox='0 0 320 140' aria-hidden='true'>\u003ctext x='20' y='16' font-family='Arial' font-size='13' fill='#1e6f9f' font-weight='700'>8, 9, 10, 11, 12 → close together → small SD\u003c/text>\u003cline x1='20' y1='38' x2='300' y2='38' stroke='#1b2430' stroke-width='1.5'/>\u003cline x1='160' y1='26' x2='160' y2='50' stroke='#2e7a57' stroke-width='2' stroke-dasharray='5 4'/>\u003ccircle cx='132' cy='38' r='5' fill='#1e6f9f'/>\u003ccircle cx='146' cy='38' r='5' fill='#1e6f9f'/>\u003ccircle cx='160' cy='38' r='5' fill='#1e6f9f'/>\u003ccircle cx='174' cy='38' r='5' fill='#1e6f9f'/>\u003ccircle cx='188' cy='38' r='5' fill='#1e6f9f'/>\u003ctext x='20' y='76' font-family='Arial' font-size='13' fill='#b23a2a' font-weight='700'>2, 6, 10, 14, 18 → spread out → big SD\u003c/text>\u003cline x1='20' y1='98' x2='300' y2='98' stroke='#1b2430' stroke-width='1.5'/>\u003cline x1='160' y1='86' x2='160' y2='110' stroke='#2e7a57' stroke-width='2' stroke-dasharray='5 4'/>\u003ccircle cx='48' cy='98' r='6' fill='#b23a2a'/>\u003ccircle cx='104' cy='98' r='6' fill='#b23a2a'/>\u003ccircle cx='160' cy='98' r='6' fill='#b23a2a'/>\u003ccircle cx='216' cy='98' r='6' fill='#b23a2a'/>\u003ccircle cx='272' cy='98' r='6' fill='#b23a2a'/>\u003ctext x='160' y='132' font-family='Arial' font-size='12' text-anchor='middle' fill='#2e7a57'>green dashed line = the average, 10, in both rows\u003c/text>\u003c/svg>\u003cp style=\"margin:4px 0\">Both rows have the same average, \u003cb>10\u003c/b>. In the top row the dots huddle near 10. In the bottom row they sit far from 10.\u003c/p>\u003cp style=\"margin:4px 0\">\u003cb>Standard deviation\u003c/b> (SD) = the usual \u003cb>distance\u003c/b> of a number from the average.\u003c/p>\u003ctable>\u003ctr>\u003cth>Row\u003c/th>\u003cth>Distances from 10\u003c/th>\u003cth>SD\u003c/th>\u003c/tr>\u003ctr>\u003ctd>8, 9, 10, 11, 12\u003c/td>\u003ctd>2, 1, 0, 1, 2\u003c/td>\u003ctd>\u003cb>small\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2, 6, 10, 14, 18\u003c/td>\u003ctd>8, 4, 0, 4, 8\u003c/td>\u003ctd>\u003cb>big\u003c/b>\u003c/td>\u003c/tr>\u003c/table>", "rule": "SD ≈ the usual distance of a number from the average\u003cbr>Same gaps → same SD · more numbers far out → bigger SD", "first": "Find the average. Write each number's \u003cb>distance\u003c/b> from it. Then compare the distances.", "ex": {"q": "Which list has the greater SD? I: 3, 4, 4, 4, 5 or II: 3, 3, 4, 5, 5", "steps": ["Both have average 20 ÷ 5 = \u003cb>4\u003c/b>", "Distances from 4 in I: 1, 0, 0, 0, 1", "Distances from 4 in II: 1, 1, 0, 1, 1", "II has more numbers far from the average, so \u003cb>II\u003c/b> has the greater SD ✅"]}, "warn": "Big numbers do not mean a big SD. 100, 101, 102 has a \u003cb>smaller\u003c/b> SD than 1, 5, 9 (gaps of 1 against gaps of 4).", "tip": "The formula, for later: SD = √(add up every (number − average)², then ÷ how many). On the GRE you almost never need it: compare distances instead.", "page": 18, "n": 7, "hard": 2}, {"key": "normal", "name": "The normal curve (the bell shape)", "spot": "The question says \u003cb>\"normally distributed\"\u003c/b>, \u003cb>\"normal distribution\"\u003c/b> or \u003cb>\"percentile\"\u003c/b>, or shows a \u003cb>bell-shaped curve\u003c/b> with 2, 14, 34 percents.", "easy": "\u003cp style=\"margin:4px 0\">Many things, like heights or test scores, pile up near the average. Very small and very big values are rare. Drawn as a picture, this looks like a \u003cb>bell\u003c/b>.\u003c/p>\u003csvg viewBox='0 0 320 212' aria-hidden='true'>\u003cpath d='M20,166.8 L24,166.4 L28,165.9 L32,165.3 L36,164.6 L40,163.7 L44,162.7 L48,161.4 L52,159.9 L56,158.1 L60,155.9 L64,153.5 L68,150.7 L72,147.5 L76,143.8 L80,139.8 L84,135.3 L88,130.4 L92,125.1 L96,119.4 L100,113.3 L104,107.0 L108,100.4 L112,93.7 L116,87.0 L120,80.3 L124,73.8 L128,67.5 L132,61.6 L136,56.3 L140,51.5 L144,47.5 L148,44.3 L152,41.9 L156,40.5 L160,40.0 L164,40.5 L168,41.9 L172,44.3 L176,47.5 L180,51.5 L184,56.3 L188,61.6 L192,67.5 L196,73.8 L200,80.3 L204,87.0 L208,93.7 L212,100.4 L216,107.0 L220,113.3 L224,119.4 L228,125.1 L232,130.4 L236,135.3 L240,139.8 L244,143.8 L248,147.5 L252,150.7 L256,153.5 L260,155.9 L264,158.1 L268,159.9 L272,161.4 L276,162.7 L280,163.7 L284,164.6 L288,165.3 L292,165.9 L296,166.4 L300,166.8 L300,168 L20,168 Z' fill='#ffffff' stroke='none'/>\u003cline x1='68' y1='168' x2='68' y2='150.7' stroke='#4a5866' stroke-width='1.5' stroke-dasharray='4 3'/>\u003cline x1='114' y1='168' x2='114' y2='90.4' stroke='#4a5866' stroke-width='1.5' stroke-dasharray='4 3'/>\u003cline x1='160' y1='168' x2='160' y2='40.0' stroke='#4a5866' stroke-width='1.5' stroke-dasharray='4 3'/>\u003cline x1='206' y1='168' x2='206' y2='90.4' stroke='#4a5866' stroke-width='1.5' stroke-dasharray='4 3'/>\u003cline x1='252' y1='168' x2='252' y2='150.7' stroke='#4a5866' stroke-width='1.5' stroke-dasharray='4 3'/>\u003cpath d='M20,166.8 L24,166.4 L28,165.9 L32,165.3 L36,164.6 L40,163.7 L44,162.7 L48,161.4 L52,159.9 L56,158.1 L60,155.9 L64,153.5 L68,150.7 L72,147.5 L76,143.8 L80,139.8 L84,135.3 L88,130.4 L92,125.1 L96,119.4 L100,113.3 L104,107.0 L108,100.4 L112,93.7 L116,87.0 L120,80.3 L124,73.8 L128,67.5 L132,61.6 L136,56.3 L140,51.5 L144,47.5 L148,44.3 L152,41.9 L156,40.5 L160,40.0 L164,40.5 L168,41.9 L172,44.3 L176,47.5 L180,51.5 L184,56.3 L188,61.6 L192,67.5 L196,73.8 L200,80.3 L204,87.0 L208,93.7 L212,100.4 L216,107.0 L220,113.3 L224,119.4 L228,125.1 L232,130.4 L236,135.3 L240,139.8 L244,143.8 L248,147.5 L252,150.7 L256,153.5 L260,155.9 L264,158.1 L268,159.9 L272,161.4 L276,162.7 L280,163.7 L284,164.6 L288,165.3 L292,165.9 L296,166.4 L300,166.8' fill='none' stroke='#1b2430' stroke-width='2.5'/>\u003cline x1='14' y1='168' x2='306' y2='168' stroke='#1b2430' stroke-width='2'/>\u003cline x1='68' y1='164' x2='68' y2='172' stroke='#1b2430' stroke-width='1.5'/>\u003ctext x='68' y='188' font-family='Arial' font-size='13' text-anchor='middle' fill='#1b2430' font-weight='700'>m−2d\u003c/text>\u003cline x1='114' y1='164' x2='114' y2='172' stroke='#1b2430' stroke-width='1.5'/>\u003ctext x='114' y='188' font-family='Arial' font-size='13' text-anchor='middle' fill='#1b2430' font-weight='700'>m−d\u003c/text>\u003cline x1='160' y1='164' x2='160' y2='172' stroke='#1b2430' stroke-width='1.5'/>\u003ctext x='160' y='188' font-family='Arial' font-size='13' text-anchor='middle' fill='#1b2430' font-weight='700'>m\u003c/text>\u003cline x1='206' y1='164' x2='206' y2='172' stroke='#1b2430' stroke-width='1.5'/>\u003ctext x='206' y='188' font-family='Arial' font-size='13' text-anchor='middle' fill='#1b2430' font-weight='700'>m+d\u003c/text>\u003cline x1='252' y1='164' x2='252' y2='172' stroke='#1b2430' stroke-width='1.5'/>\u003ctext x='252' y='188' font-family='Arial' font-size='13' text-anchor='middle' fill='#1b2430' font-weight='700'>m+2d\u003c/text>\u003ctext x='137.0' y='120' font-family='Arial' font-size='14' text-anchor='middle' fill='#1e6f9f' font-weight='700'>34%\u003c/text>\u003ctext x='183.0' y='120' font-family='Arial' font-size='14' text-anchor='middle' fill='#1e6f9f' font-weight='700'>34%\u003c/text>\u003ctext x='91.0' y='156' font-family='Arial' font-size='14' text-anchor='middle' fill='#2e7a57' font-weight='700'>14%\u003c/text>\u003ctext x='229.0' y='156' font-family='Arial' font-size='14' text-anchor='middle' fill='#2e7a57' font-weight='700'>14%\u003c/text>\u003ctext x='42.7' y='150' font-family='Arial' font-size='14' text-anchor='middle' fill='#b23a2a' font-weight='700'>2%\u003c/text>\u003ctext x='277.3' y='150' font-family='Arial' font-size='14' text-anchor='middle' fill='#b23a2a' font-weight='700'>2%\u003c/text>\u003ctext x='160' y='26' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>most values\u003c/text>\u003ctext x='160' y='205' font-family='Arial' font-size='12' text-anchor='middle' fill='#4a5866'>m = mean (average) · d = one SD (one step)\u003c/text>\u003c/svg>\u003cp style=\"margin:4px 0\">The line under the bell is marked in steps of \u003cb>one SD\u003c/b>. The share in each band is always the same.\u003c/p>\u003ctable>\u003ctr>\u003cth>Value\u003c/th>\u003cth>Percent of values below it\u003c/th>\u003c/tr>\u003ctr>\u003ctd>m − 2d\u003c/td>\u003ctd>\u003cb>2%\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>m − d\u003c/td>\u003ctd>2 + 14 = \u003cb>16%\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>m\u003c/td>\u003ctd>\u003cb>50%\u003c/b> (half)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>m + d\u003c/td>\u003ctd>50 + 34 = \u003cb>84%\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>m + 2d\u003c/td>\u003ctd>84 + 14 = \u003cb>98%\u003c/b>\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Percentile:\u003c/b> the 84th percentile is the value with 84% of the values below it.\u003c/p>", "rule": "Bands, left to right: 2% · 14% · 34% · 34% · 14% · 2%\u003cbr>Number of SDs from the mean = (value − mean) ÷ SD", "first": "Turn each number into \u003cb>how many SDs\u003c/b> it is from the mean. Then add up the bands.", "ex": {"q": "Test scores are normal with mean 70 and SD 8. About what percent of scores are between 62 and 86?", "steps": ["62: (62 − 70) ÷ 8 = \u003cb>−1\u003c/b> → one SD below", "86: (86 − 70) ÷ 8 = \u003cb>2\u003c/b> → two SDs above", "Bands from −1 to +2: 34% + 34% + 14% = \u003cb>82%\u003c/b> ✅"]}, "ex2": {"q": "A normal list has mean 50. The value 60 is at the 84th percentile. Which value is at the 98th percentile?", "steps": ["84th percentile = one SD above the mean, so 60 = 50 + d → d = \u003cb>10\u003c/b>", "98th percentile = two SDs above: 50 + 2 × 10 = \u003cb>70\u003c/b> ✅"]}, "warn": "\"Below m + d\" is 50% + 34% = \u003cb>84%\u003c/b>, not 34%. The whole left half (50%) counts too.", "tip": "Memory trick: 2 – 14 – 34 – 34 – 14 – 2 (they add to 100). The curve never tells you the biggest or smallest value, so the range is never known.", "page": 18, "n": 7, "hard": 5}, {"key": "extremal", "name": "Greatest or least possible (push the others to the limit)", "spot": "The question says \u003cb>\"greatest possible\"\u003c/b>, \u003cb>\"least possible\"\u003c/b>, \u003cb>\"at most\"\u003c/b> or \u003cb>\"at least\"\u003c/b>.", "easy": "\u003cp style=\"margin:4px 0\">You have \u003cb>$20\u003c/b> for 4 friends. Each gets a \u003cb>different\u003c/b> whole number of dollars, at least $1. How much can one friend get at most?\u003c/p>\u003ctable>\u003ctr>\u003cth>Step\u003c/th>\u003cth>Work\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Give the other 3 as little as allowed\u003c/td>\u003ctd>$1, $2, $3 → \u003cb>$6\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>The rest goes to the last friend\u003c/td>\u003ctd>20 − 6 = \u003cb>$14\u003c/b> ✅\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why $1, $2, $3 and not $1, $1, $1?\u003c/b> The amounts must be \u003cb>different\u003c/b>. So the smallest choices are 1, 2, 3.\u003c/p>", "rule": "Biggest possible one = total − (all the others, as small as the words allow)", "first": "Turn the average into a \u003cb>total\u003c/b>. Then make all the other numbers as small as the words allow.", "ex": {"q": "The average of 6 different positive whole numbers is 10. What is the greatest possible number in the list?", "steps": ["Total: 10 × 6 = \u003cb>60\u003c/b>", "Make the other 5 as small as possible, all different: 1, 2, 3, 4, 5 → \u003cb>15\u003c/b>", "Greatest: 60 − 15 = \u003cb>45\u003c/b>", "Check: 1 + 2 + 3 + 4 + 5 + 45 = 60, and 60 ÷ 6 = 10 ✅"]}, "warn": "Read the small words. If the numbers may \u003cb>repeat\u003c/b>, the others could be 1, 1, 1, 1, 1 = 5, and the greatest becomes 60 − 5 = \u003cb>55\u003c/b>. \"Positive\" means start at 1, not 0.", "tip": "For the \u003cb>least\u003c/b> possible total of different whole numbers, pack them tight: smallest 30, 4 numbers → 30 + 31 + 32 + 33 = 126.", "page": 20, "n": 7, "hard": 5}], "rare": [{"key": "sdwindow", "name": "Values a number of SDs away", "hint": "gap in value ÷ gap in SDs = one SD", "page": 18, "n": 6}, {"key": "grouped", "name": "Tables with grouped bands", "hint": "add the counts as you go; find the band holding that place", "page": 17, "n": 6}, {"key": "nonlinear", "name": "Squaring every number in a list", "hint": "squaring stretches numbers above 1, squeezes numbers below 1", "page": 18, "n": 6}, {"key": "medreach", "name": "Which values could be the median", "hint": "sort the known numbers, then try the unknown low, middle, high", "page": 18, "n": 4}, {"key": "boxplot", "name": "Boxplots (box-and-whisker pictures)", "hint": "five marks only: least, ¼ point, median, ¾ point, greatest", "page": 18, "n": 3}, {"key": "pctbound", "name": "Percent of values below a number", "hint": "turn the percent into a count of numbers first", "page": 18, "n": 3}, {"key": "swapone", "name": "One new number changes the average", "hint": "new number = new total − old total", "page": 18, "n": 3}, {"key": "mode", "name": "Mode (the most common value)", "hint": "the value that shows up most often; use counts first", "page": 18, "n": 3}, {"key": "partshift", "name": "Changing only some numbers", "hint": "SD stays the same only if every number moves equally", "page": 18, "n": 3}, {"key": "rankoff", "name": "Percentile in a whole-number run", "hint": "percent × count gives a place; count in from the start", "page": 2, "n": 2}, {"key": "leastsq", "name": "Making the SD smallest", "hint": "put the new number exactly at the average", "page": 18, "n": 2}, {"key": "twoval", "name": "Lists with only two values", "hint": "wider gap, or a mix nearer half-and-half, gives bigger SD", "page": 18, "n": 1}, {"key": "meancompare", "name": "Which average is bigger", "hint": "one list's smallest above the other's biggest settles it", "page": 18, "n": 1}, {"key": "running", "name": "Running success rate", "hint": "successes so far ÷ tries so far; recount after each try", "page": 3, "n": 1}, {"key": "stacked", "name": "Many conditions on one list", "hint": "mean gives the total; fill the places one at a time", "page": 20, "n": 1}]}, {"s": "da", "name": "Data Analysis", "short": "Data Analysis", "common": [{"key": "sets", "name": "Overlapping groups (Venn circles)", "spot": "The question says \u003cb>\"both\"\u003c/b>, \u003cb>\"neither\"\u003c/b>, \u003cb>\"… or … or both\"\u003c/b>, \u003cb>\"at least one\"\u003c/b>, \u003cb>\"multiples of 2 or 3\"\u003c/b>, or uses the signs \u003cb>∩\u003c/b> and \u003cb>∪\u003c/b>.", "easy": "\u003csvg viewBox=\"0 0 320 222\" aria-hidden=\"true\">\u003crect x=\"6\" y=\"6\" width=\"308\" height=\"210\" rx=\"8\" fill=\"#fff\" stroke=\"#1b2430\" stroke-width=\"2\"/>\u003ccircle cx=\"125\" cy=\"120\" r=\"78\" fill=\"#1e6f9f\" fill-opacity=\"0.12\" stroke=\"#1e6f9f\" stroke-width=\"3\"/>\u003ccircle cx=\"205\" cy=\"120\" r=\"72\" fill=\"#2e7a57\" fill-opacity=\"0.12\" stroke=\"#2e7a57\" stroke-width=\"3\"/>\u003ctext x=\"16\" y=\"206\" font-family=\"Arial\" font-size=\"13\" fill=\"#4a5866\">30 students\u003c/text>\u003ctext x=\"16\" y=\"30\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#1e6f9f\">Soccer: 18\u003c/text>\u003ctext x=\"304\" y=\"30\" font-family=\"Arial\" font-size=\"14\" text-anchor=\"end\" font-weight=\"700\" fill=\"#2e7a57\">Chess: 12\u003c/text>\u003ctext x=\"90\" y=\"126\" font-family=\"Arial\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#1e6f9f\">13\u003c/text>\u003ctext x=\"168\" y=\"126\" font-family=\"Arial\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#9c6510\">5\u003c/text>\u003ctext x=\"168\" y=\"144\" font-family=\"Arial\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#9c6510\">both\u003c/text>\u003ctext x=\"246\" y=\"126\" font-family=\"Arial\" font-size=\"20\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#2e7a57\">7\u003c/text>\u003ctext x=\"306\" y=\"206\" font-family=\"Arial\" font-size=\"14\" text-anchor=\"end\" font-weight=\"700\" fill=\"#b23a2a\">neither: 5\u003c/text>\u003c/svg>\u003cp style=\"margin:4px 0\">30 students. 18 play soccer (the \u003cb>blue circle\u003c/b>). 12 play chess (the \u003cb>green circle\u003c/b>). 5 play both (the middle, where the circles overlap).\u003c/p>\u003ctable>\u003ctr>\u003cth>Part\u003c/th>\u003cth>Where\u003c/th>\u003cth>How many\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Soccer only\u003c/td>\u003ctd>blue, not the middle\u003c/td>\u003ctd>18 − 5 = \u003cb>13\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Both\u003c/td>\u003ctd>the middle\u003c/td>\u003ctd>\u003cb>5\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Chess only\u003c/td>\u003ctd>green, not the middle\u003c/td>\u003ctd>12 − 5 = \u003cb>7\u003c/b>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Neither\u003c/td>\u003ctd>in the box, outside both circles\u003c/td>\u003ctd>30 − 25 = \u003cb>5\u003c/b>\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why 25?\u003c/b> 13 + 5 + 7 = 25 students are inside a circle. Or: 18 + 12 − 5 = 25.\u003c/p>", "rule": "A or B (or both) = A + B − both\u003cbr>Total = A + B − both + neither", "first": "Draw two circles in a box. Fill in the \u003cb>middle (both)\u003c/b> first, then the \"only\" parts, then \"neither\".", "ex": {"q": "Of 40 students, 25 take French, 20 take English and 10 take both. How many take neither?", "steps": ["French or English = 25 + 20 − 10 = \u003cb>35\u003c/b>", "Neither = 40 − 35 = \u003cb>5\u003c/b> ✅", "Check: French only 25 − 10 = 15, English only 20 − 10 = 10.\u003cbr>15 + 10 + 10 + 5 = 40 ✅"]}, "ex2": {"q": "How many whole numbers from 1 to 30 are multiples of 2 or 3 (or both)?", "steps": ["Multiples of 2: 30 ÷ 2 = \u003cb>15\u003c/b> (2, 4, …, 30)", "Multiples of 3: 30 ÷ 3 = \u003cb>10\u003c/b> (3, 6, …, 30)", "Both = multiples of 6: 30 ÷ 6 = \u003cb>5\u003c/b> (6, 12, 18, 24, 30)", "15 + 10 − 5 = \u003cb>20\u003c/b> ✅", "Check: the 10 numbers left over are 1, 5, 7, 11, 13, 17, 19, 23, 25, 29. 30 − 10 = 20 ✅"]}, "warn": "Adding the two groups counts the middle \u003cb>twice\u003c/b>. 25 + 20 = 45 is more than the 40 students! Subtract \"both\" once: 45 − 10 = 35.", "tip": "Signs: \u003cb>A ∪ B\u003c/b> = in A \u003cb>or\u003c/b> B (or both). \u003cb>A ∩ B\u003c/b> = in \u003cb>both\u003c/b>. With three circles, fill the very centre first, then the parts where only two overlap, then the \"only\" parts.", "page": 19, "n": 35, "hard": 16}, {"key": "sufficient", "name": "Enough information? (\"sufficient\" statements)", "spot": "The question says \u003cb>\"Which of the following statements individually provide(s) sufficient additional information to determine …\"\u003c/b> and \u003cb>\"Indicate all such statements\"\u003c/b>.", "easy": "\u003cp style=\"margin:4px 0\">\u003cb>Sufficient\u003c/b> = enough. \u003cb>Individually\u003c/b> = each statement \u003cb>alone\u003c/b>.\u003c/p>\u003cp style=\"margin:4px 0\">A shirt and pants cost \u003cb>$50\u003c/b> together. Can you find the price of the pants?\u003c/p>\u003ctable>\u003ctr>\u003cth>Statement\u003c/th>\u003cth>What fits\u003c/th>\u003cth>Enough?\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\"The shirt costs $20.\"\u003c/td>\u003ctd>pants = 50 − 20 = $30 only\u003c/td>\u003ctd>✅ Yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\"The shirt costs less than the pants.\"\u003c/td>\u003ctd>$20 + $30, or $10 + $40, …\u003c/td>\u003ctd>❌ No\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">\u003cb>Why \"no\"?\u003c/b> Pants at $30 fit. Pants at $40 fit too. Two answers → not enough.\u003c/p>", "rule": "Enough = only \u003cb>one\u003c/b> answer fits.\u003cbr>Not enough = two cases fit but give \u003cb>different\u003c/b> answers.", "first": "Write the \u003cb>one number\u003c/b> you need. Then test each statement alone: does it leave exactly one value?", "ex": {"q": "Of 50 students, 22 take psychology. Some take sociology, some take both, some take neither. Which statement(s) alone tell you how many take both? (1) 30 take sociology. (2) 10 take neither. (3) 15 take psychology but not sociology.", "steps": ["Need: \u003cb>both\u003c/b>. Psychology 22 = (psychology only) + both.", "(3): both = 22 − 15 = \u003cb>7\u003c/b>. One answer → enough ✅", "(1): both = 10 fits (then 8 take neither). Both = 20 also fits (18 take neither). Two answers ❌", "(2): 50 − 10 = 40 take at least one. Sociology 28 → both 10. Sociology 30 → both 12. Two answers ❌", "Answer: \u003cb>only statement (3)\u003c/b> ✅"]}, "warn": "Each statement \u003cb>alone\u003c/b>. (1) and (2) together would work: both = 22 + 30 − 40 = 12. But \"together\" does not count here.", "tip": "You do not need the final number, only whether there is \u003cb>one\u003c/b>. Two quick cases that both fit the statement are the fastest way to say \"not enough\".", "page": 20, "n": 12, "hard": 8}, {"key": "overlapmm", "name": "Most and least overlap (could be, at least)", "spot": "Two group sizes are given but \u003cb>not\u003c/b> the overlap, and the question says \u003cb>\"could be\"\u003c/b>, \u003cb>\"greatest possible\"\u003c/b>, \u003cb>\"least possible\"\u003c/b>, \u003cb>\"at least\"\u003c/b> or \u003cb>\"maximum probability that both\"\u003c/b>.", "easy": "\u003csvg viewBox=\"0 0 320 178\" aria-hidden=\"true\">\u003ctext x=\"8\" y=\"12\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1b2430\">Most in both: 6 orange\u003c/text>\u003ccircle cx=\"33\" cy=\"44\" r=\"10\" fill=\"#9c6510\" stroke=\"#1b2430\" stroke-width=\"1.5\"/>\u003ccircle cx=\"59\" cy=\"44\" r=\"10\" fill=\"#9c6510\" stroke=\"#1b2430\" stroke-width=\"1.5\"/>\u003ccircle cx=\"85\" cy=\"44\" r=\"10\" fill=\"#9c6510\" stroke=\"#1b2430\" stroke-width=\"1.5\"/>\u003ccircle cx=\"111\" cy=\"44\" r=\"10\" fill=\"#9c6510\" stroke=\"#1b2430\" stroke-width=\"1.5\"/>\u003ccircle cx=\"137\" cy=\"44\" r=\"10\" fill=\"#9c6510\" stroke=\"#1b2430\" stroke-width=\"1.5\"/>\u003ccircle cx=\"163\" cy=\"44\" r=\"10\" fill=\"#9c6510\" stroke=\"#1b2430\" stroke-width=\"1.5\"/>\u003ccircle cx=\"189\" cy=\"44\" r=\"10\" fill=\"#1e6f9f\" stroke=\"#1b2430\" stroke-width=\"1.5\"/>\u003ccircle cx=\"215\" cy=\"44\" r=\"10\" fill=\"#fff\" stroke=\"#1b2430\" stroke-width=\"1.5\"/>\u003ccircle cx=\"241\" cy=\"44\" r=\"10\" fill=\"#fff\" stroke=\"#1b2430\" stroke-width=\"1.5\"/>\u003ccircle cx=\"267\" cy=\"44\" r=\"10\" fill=\"#fff\" stroke=\"#1b2430\" stroke-width=\"1.5\"/>\u003cpath d=\"M22 32 V26 H200 V32\" fill=\"none\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/>\u003ctext x=\"206\" y=\"31\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1e6f9f\">7 apples\u003c/text>\u003cpath d=\"M22 56 V62 H174 V56\" fill=\"none\" stroke=\"#2e7a57\" stroke-width=\"2.5\"/>\u003ctext x=\"180\" y=\"66\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#2e7a57\">6 bananas\u003c/text>\u003ctext x=\"8\" y=\"94\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1b2430\">Least in both: 3 orange\u003c/text>\u003ccircle cx=\"33\" cy=\"126\" r=\"10\" fill=\"#1e6f9f\" stroke=\"#1b2430\" stroke-width=\"1.5\"/>\u003ccircle cx=\"59\" cy=\"126\" r=\"10\" fill=\"#1e6f9f\" stroke=\"#1b2430\" stroke-width=\"1.5\"/>\u003ccircle cx=\"85\" cy=\"126\" r=\"10\" fill=\"#1e6f9f\" stroke=\"#1b2430\" stroke-width=\"1.5\"/>\u003ccircle cx=\"111\" cy=\"126\" r=\"10\" fill=\"#1e6f9f\" stroke=\"#1b2430\" stroke-width=\"1.5\"/>\u003ccircle cx=\"137\" cy=\"126\" r=\"10\" fill=\"#9c6510\" stroke=\"#1b2430\" stroke-width=\"1.5\"/>\u003ccircle cx=\"163\" cy=\"126\" r=\"10\" fill=\"#9c6510\" stroke=\"#1b2430\" stroke-width=\"1.5\"/>\u003ccircle cx=\"189\" cy=\"126\" r=\"10\" fill=\"#9c6510\" stroke=\"#1b2430\" stroke-width=\"1.5\"/>\u003ccircle cx=\"215\" cy=\"126\" r=\"10\" fill=\"#2e7a57\" stroke=\"#1b2430\" stroke-width=\"1.5\"/>\u003ccircle cx=\"241\" cy=\"126\" r=\"10\" fill=\"#2e7a57\" stroke=\"#1b2430\" stroke-width=\"1.5\"/>\u003ccircle cx=\"267\" cy=\"126\" r=\"10\" fill=\"#2e7a57\" stroke=\"#1b2430\" stroke-width=\"1.5\"/>\u003cpath d=\"M22 114 V108 H200 V114\" fill=\"none\" stroke=\"#1e6f9f\" stroke-width=\"2.5\"/>\u003ctext x=\"206\" y=\"113\" font-family=\"Arial\" font-size=\"13\" font-weight=\"700\" fill=\"#1e6f9f\">7 apples\u003c/text>\u003cpath d=\"M126 138 V144 H278 V138\" fill=\"none\" stroke=\"#2e7a57\" stroke-width=\"2.5\"/>\u003ctext x=\"120\" y=\"148\" font-family=\"Arial\" font-size=\"13\" text-anchor=\"end\" font-weight=\"700\" fill=\"#2e7a57\">6 bananas\u003c/text>\u003ctext x=\"8\" y=\"172\" font-family=\"Arial\" font-size=\"12\" fill=\"#4a5866\">blue = apples only · green = bananas only · orange = both\u003c/text>\u003c/svg>\u003cp style=\"margin:4px 0\">10 children. 7 like apples (the \u003cb>blue bracket\u003c/b>). 6 like bananas (the \u003cb>green bracket\u003c/b>). How many like \u003cb>both\u003c/b>?\u003c/p>\u003cul style=\"margin:4px 0;padding-left:20px\">\u003cli>\u003cb>Most\u003c/b>: put all 6 banana children inside the apple group → \u003cb>6\u003c/b> orange. Never more than the smaller group.\u003c/li>\u003cli>\u003cb>Least\u003c/b>: push the groups apart. They need 7 + 6 = 13 places, but there are only 10 children.\u003c/li>\u003c/ul>\u003cp style=\"margin:4px 0\">\u003cb>Why 3?\u003c/b> 13 − 10 = 3 children must be in both groups to fit.\u003c/p>", "rule": "Most in both = the smaller group\u003cbr>Least in both = A + B − total (if that is below 0, the least is 0)", "first": "Turn every percent into a count. Write \u003cb>total\u003c/b>, \u003cb>A\u003c/b> and \u003cb>B\u003c/b>. Then find the most and the least.", "ex": {"q": "Of 200 people, 60% drive and 70% cycle. Which could be the number who do both? Indicate all: 50, 60, 100, 130.", "steps": ["Drive: 60% of 200 = \u003cb>120\u003c/b>. Cycle: 70% of 200 = \u003cb>140\u003c/b>.", "Most in both = the smaller group = \u003cb>120\u003c/b>", "Least: 120 + 140 = 260, but only 200 people → 260 − 200 = \u003cb>60\u003c/b>", "Both can be anything from 60 to 120 → \u003cb>60 and 100\u003c/b> ✅ (50 is too small, 130 too big)"]}, "warn": "The least is \u003cb>not\u003c/b> always 0. When A + B is bigger than the total, some must overlap: 7 + 6 = 13 &gt; 10, so at least 3.", "tip": "Same for chances: the chance of both is at most the smaller chance, and at least (chance A + chance B − 1). For 0.75 and 0.58: from 0.33 up to 0.58.", "page": 19, "n": 11, "hard": 4}, {"key": "combsym", "name": "Choosing a group (order does not matter)", "spot": "The question says \u003cb>\"how many groups\"\u003c/b>, \u003cb>\"committees\"\u003c/b>, \u003cb>\"subsets\"\u003c/b>, \u003cb>\"selections\"\u003c/b>, \u003cb>\"order does not matter\"\u003c/b> or \u003cb>\"exactly 2 of them are …\"\u003c/b>.", "easy": "\u003cp style=\"margin:4px 0\">Choose \u003cb>2\u003c/b> of 4 friends (Ann, Ben, Cal, Dee) for a movie. Ann + Ben is the same pair as Ben + Ann.\u003c/p>\u003ctable>\u003ctr>\u003cth>Start with\u003c/th>\u003cth>Pairs\u003c/th>\u003cth>New pairs\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Ann\u003c/td>\u003ctd>Ann+Ben, Ann+Cal, Ann+Dee\u003c/td>\u003ctd>3\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ben\u003c/td>\u003ctd>Ben+Cal, Ben+Dee\u003c/td>\u003ctd>2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Cal\u003c/td>\u003ctd>Cal+Dee\u003c/td>\u003ctd>1\u003c/td>\u003c/tr>\u003c/table>\u003cp style=\"margin:4px 0\">3 + 2 + 1 = \u003cb>6\u003c/b> pairs. We write this \u003cb>C(4, 2) = 6\u003c/b>: choose 2 from 4.\u003c/p>\u003cp style=\"margin:4px 0\">\u003cb>Why not 4 × 3 = 12?\u003c/b> 4 × 3 counts every pair twice (Ann+Ben and Ben+Ann). 12 ÷ 2 = 6.\u003c/p>\u003cp style=\"margin:4px 0\">Choosing who \u003cb>goes\u003c/b> = choosing who \u003cb>stays\u003c/b>. 2 of 4 go → 2 stay. 3 of 5 go → 2 stay, so C(5, 3) = C(5, 2) = 10.\u003c/p>", "rule": "C(n, r): on top, count down from n (r numbers); below, r × … × 2 × 1\u003cbr>C(5, 2) = (5 × 4) ÷ (2 × 1) = 10\u003cbr>C(n, r) = C(n, n − r)", "first": "Ask: does order matter? (Different jobs → yes. \"Group\", \"committee\" → no.) If the group needs \u003cb>exactly 2 of one kind\u003c/b>, split into two pools and multiply.", "ex": {"q": "9 people, 3 of them vegetarians. How many 3-person committees have exactly 2 vegetarians?", "steps": ["Two pools: 3 vegetarians, 6 others.", "2 of the 3 vegetarians: C(3, 2) = (3 × 2) ÷ (2 × 1) = \u003cb>3\u003c/b>", "1 of the 6 others: C(6, 1) = \u003cb>6\u003c/b>", "Multiply: 3 × 6 = \u003cb>18\u003c/b> ✅", "Check: committees with 0, 1, 2, 3 vegetarians: 20 + 45 + 18 + 1 = 84 = C(9, 3) ✅"]}, "ex2": {"q": "You must answer 10 of 12 questions. How many different choices are there?", "steps": ["Choosing 10 to answer = choosing the 2 to skip.", "C(12, 2) = (12 × 11) ÷ (2 × 1) = \u003cb>66\u003c/b> ✅ (much faster than C(12, 10))"]}, "warn": "Multiply the pools, do not add. 3 ways × 6 ways = \u003cb>18\u003c/b>, not 3 + 6 = 9.", "tip": "Order matters (different jobs) → divide by the ways to order the group to get \"order does not matter\". 3 people can be ordered 3 × 2 × 1 = 6 ways, so 6,840 ordered choices → 6,840 ÷ 6 = \u003cb>1,140\u003c/b> groups.", "page": 19, "n": 11, "hard": 7}, {"key": "pairs", "name": "Pairs (two at a time)", "spot": "The question says \u003cb>\"2 … are drawn / selected at random\"\u003c/b>, \u003cb>\"how many pairs\"\u003c/b>, \u003cb>\"each connected to each of the others\"\u003c/b>, \u003cb>\"how many handshakes / cables / games\"\u003c/b>.", "easy": "\u003csvg viewBox=\"0 0 320 210\" aria-hidden=\"true\">\u003cline x1=\"110.0\" y1=\"30.0\" x2=\"188.0\" y2=\"86.7\" stroke=\"#b23a2a\" stroke-width=\"3\"/>\u003cline x1=\"110.0\" y1=\"30.0\" x2=\"158.2\" y2=\"178.3\" stroke=\"#b23a2a\" stroke-width=\"3\"/>\u003cline x1=\"110.0\" y1=\"30.0\" x2=\"61.8\" y2=\"178.3\" stroke=\"#b23a2a\" stroke-width=\"3\"/>\u003cline x1=\"110.0\" y1=\"30.0\" x2=\"32.0\" y2=\"86.7\" stroke=\"#b23a2a\" stroke-width=\"3\"/>\u003cline x1=\"188.0\" y1=\"86.7\" x2=\"158.2\" y2=\"178.3\" stroke=\"#1b2430\" stroke-width=\"2\"/>\u003cline x1=\"188.0\" y1=\"86.7\" x2=\"61.8\" y2=\"178.3\" stroke=\"#1b2430\" stroke-width=\"2\"/>\u003cline x1=\"188.0\" y1=\"86.7\" x2=\"32.0\" y2=\"86.7\" stroke=\"#1b2430\" stroke-width=\"2\"/>\u003cline x1=\"158.2\" y1=\"178.3\" x2=\"61.8\" y2=\"178.3\" stroke=\"#1b2430\" stroke-width=\"2\"/>\u003cline x1=\"158.2\" y1=\"178.3\" x2=\"32.0\" y2=\"86.7\" stroke=\"#1b2430\" stroke-width=\"2\"/>\u003cline x1=\"61.8\" y1=\"178.3\" x2=\"32.0\" y2=\"86.7\" stroke=\"#1b2430\" stroke-width=\"2\"/>\u003ccircle cx=\"110.0\" cy=\"30.0\" r=\"9\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"188.0\" cy=\"86.7\" r=\"9\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"158.2\" cy=\"178.3\" r=\"9\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"61.8\" cy=\"178.3\" r=\"9\" fill=\"#1e6f9f\"/>\u003ccircle cx=\"32.0\" cy=\"86.7\" r=\"9\" fill=\"#1e6f9f\"/>\u003ctext x=\"124\" y=\"35\" font-family=\"Arial\" font-size=\"15\" font-weight=\"700\" fill=\"#b23a2a\">A\u003c/text>\u003ctext x=\"214\" y=\"70\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#1e6f9f\">5 computers\u003c/text>\u003ctext x=\"214\" y=\"94\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#b23a2a\">A has 4 red\u003c/text>\u003ctext x=\"214\" y=\"112\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#b23a2a\">cables\u003c/text>\u003ctext x=\"214\" y=\"136\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\">5 × 4 = 20\u003c/text>\u003ctext x=\"214\" y=\"154\" font-family=\"Arial\" font-size=\"14\" font-weight=\"700\" fill=\"#1b2430\">20 ÷ 2 = 10\u003c/text>\u003ctext x=\"214\" y=\"172\" font-family=\"Arial\" font-size=\"14\" fill=\"#1b2430\">cables in all\u003c/text>\u003c/svg>\u003cp style=\"margin:4px 0\">5 computers (the \u003cb>blue dots\u003c/b>). Each one gets a cable to every other one. How many cables?\u003c/p>\u003cul style=\"margin:4px 0;padding-left:20px\">\u003cli>Look at computer A: its \u003cb>red\u003c/b> cables go to the other 4.\u003c/li>\u003cli>5 computers × 4 cables = 20. But each cable has \u003cb>2\u003c/b> ends, so it was counted twice.\u003c/li>\u003cli>20 ÷ 2 = \u003cb>10\u003c/b> cables. Count the lines in the picture: 10 ✅\u003c/li>\u003c/ul>\u003cp style=\"margin:4px 0\">\"2 drawn at random\" means every \u003cb>pair\u003c/b> is equally likely. So chance = good pairs ÷ all pairs.\u003c/p>", "rule": "Pairs from n things = n × (n − 1) ÷ 2\u003cbr>Chance = good pairs ÷ all pairs", "first": "Count \u003cb>all\u003c/b> the pairs first: n × (n − 1) ÷ 2. Then count only the good pairs.", "ex": {"q": "A bag has 3 red and 2 blue marbles. Two are drawn at random. What is the chance of one red and one blue?", "steps": ["All pairs: 5 × 4 ÷ 2 = \u003cb>10\u003c/b>", "Good pairs: 3 reds × 2 blues = \u003cb>6\u003c/b>", "Chance = 6 ÷ 10 = \u003cb>3/5\u003c/b> ✅", "Check, one draw at a time: red then blue 3/5 × 2/4 = 6/20; blue then red 2/5 × 3/4 = 6/20. Total 12/20 = 3/5 ✅"]}, "ex2": {"q": "4 pairs of socks, all different colours (8 socks). You pull out 2. What is the chance they match?", "steps": ["The first sock can be anything.", "7 socks are left. Only \u003cb>1\u003c/b> of them matches it.", "Chance = \u003cb>1/7\u003c/b> ✅", "Check with pairs: all pairs 8 × 7 ÷ 2 = 28, matching pairs 4 → 4/28 = 1/7 ✅"]}, "warn": "Use pairs on top \u003cb>and\u003c/b> bottom. 6 good pairs ÷ 20 (draws in order) = 0.3 is wrong. 6 ÷ 10 = \u003cb>0.6\u003c/b> is right.", "tip": "n × (n − 1) ÷ 2 = 1 + 2 + … + (n − 1). 9 computers: 9 × 8 ÷ 2 = \u003cb>36\u003c/b> = 1 + 2 + … + 8.", "page": 19, "n": 6, "hard": 3}], "rare": [{"key": "permrep", "name": "Arranging with identical items", "hint": "count as if all different, then ÷ 2 for two copies", "page": 19, "n": 6}, {"key": "memberships", "name": "People counted in several groups", "hint": "subtract 1 per person in two groups, 2 per person in three", "page": 19, "n": 4}, {"key": "leftcount", "name": "Counting numbers by their digits", "hint": "fix the left digit first; it cannot be 0", "page": 19, "n": 4}, {"key": "worstcase", "name": "Worst case (to be sure)", "hint": "take the unluckiest draws first, then add one", "page": 19, "n": 2}, {"key": "distinct", "name": "How many different sums", "hint": "largest sum − smallest sum + 1, if no gaps", "page": 2, "n": 2}, {"key": "mostlikely", "name": "Most likely result from a table", "hint": "same total, so just compare the counts", "page": 19, "n": 1}, {"key": "floorcount", "name": "Identical items into boxes", "hint": "give each box its minimum first, then share the rest", "page": 19, "n": 1}, {"key": "expval", "name": "Expected value (weighted average)", "hint": "multiply each value by its chance, then add", "page": 18, "n": 1}, {"key": "gridpath", "name": "Paths on a street grid", "hint": "a path is a row of E and N steps; arrange them", "page": 19, "n": 1}]}]}</script>
<script>
(function(){
  var QT=JSON.parse(document.getElementById("qt-data").textContent), KMF=!!QT.kmf, S=QT.subjects;
  var host=document.getElementById("qtHost"), tabs=document.getElementById("qtTabs"); if(!host||!tabs)return;
  function rd(k,d){try{var v=JSON.parse(localStorage.getItem(k)||"null");return v==null?d:v;}catch(e){return d;}}
  function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
  var cur=rd("kmf.qt.tab","num"); if(!S.some(function(s){return s.s===cur;}))cur="num";
  function last(){var L={},log=rd("kmf.log.v1",{}); ((log&&log.attempts)||[]).forEach(function(a){if(a&&a.id)L[a.id]=a;}); return L;}
  function prog(ids,L){var t=0,r=0; ids=ids||[]; ids.forEach(function(id){var a=L[id]; if(a){t++; if(a.ok)r++;}}); return {t:t,r:r};}
  var ORD=["","1st","2nd","3rd","4th","5th","6th","7th","8th","9th"];
  function exh(e){return '<div class="ex"><b>Example (like the GRE):</b> '+e.q+'<ol>'+e.steps.map(function(x){return '<li>'+x+'</li>';}).join("")+'</ol></div>';}
  function tabsHtml(){
    tabs.innerHTML=S.map(function(s){return '<button type="button" class="qt-tab" data-qts="'+s.s+'" aria-pressed="'+(s.s===cur)+'">'+s.short+' <small>'+s.common.length+'</small></button>';}).join("");
  }
  function render(){
    var s=S.filter(function(x){return x.s===cur;})[0], L=KMF?last():{}, open={};
    [].forEach.call(host.querySelectorAll("details[open]"),function(d){open[d.id]=1;});
    var tot=s.common.reduce(function(a,c){return a+c.n;},0)+s.rare.reduce(function(a,c){return a+c.n;},0);
    var h='<p class="qt-lead"><b>'+s.name+'</b>: '+s.common.length+' common question types, biggest first, then '+s.rare.length+' rare ones. Tap a type to open its guide.'+(KMF?' The green bar shows how many of its KMF problems you have tried.':'')+'</p>'
      +'<div class="qt-tools"><button type="button" data-qta="open">Open all</button><button type="button" data-qta="close">Close all</button></div>';
    s.common.forEach(function(c,i){
      var id="qt-"+s.s+"-"+c.key, p=prog(c.ids,L), r=i+1;
      h+='<details class="qt-card" id="'+id+'"'+(open[id]?' open':'')+'><summary><span class="qt-rank">#'+r+'</span><span class="qt-name">'+c.name+'</span>'
        +'<span class="qt-sub"><span>'+c.n+' KMF problems · '+c.hard+' Hard · '+(r===1?'the most common':ORD[r]+' most common')+'</span>'
        +(KMF?'<span><span class="qt-pb"><i style="width:'+Math.round(100*p.t/c.n)+'%"></i></span> '+p.t+' tried · '+p.r+' right</span>':'')+'</span>'
        +'<span class="qt-open">Open the guide ▾</span></summary><div class="qt-body">'
        +'<b class="l">1 · How to spot it</b><div>'+c.spot+'</div>'
        +'<b class="l">2 · The idea in everyday words</b><div class="easy">'+c.easy+'</div>'
        +'<div class="rule">'+c.rule+'</div>'
        +'<b class="l">3 · First move</b><div>'+c.first+'</div>'
        +exh(c.ex)+(c.ex2?exh(c.ex2):'')
        +'<div class="warn">⚠️ '+c.warn+'</div><div class="tip">💡 '+c.tip+'</div>'
        +(KMF?'<div class="qt-btns"><button type="button" class="qt-b alt" data-qtc="'+c.page+'">Read the idea: Concept page '+c.page+' →</button><button type="button" class="qt-b" data-qtp="'+s.s+':'+c.key+'">Practice all '+c.n+' →</button></div>'
             :'<div class="qt-page">📖 Read the idea: Concept Boards, page '+c.page+'</div>')
        +'</div></details>';
    });
    h+='<div class="qt-rare"><h4>Rare types · 1 to '+Math.max.apply(null,s.rare.map(function(r){return r.n;}))+' problems each</h4>'+s.rare.map(function(r){
      var p=prog(r.ids,L);
      return '<div class="qt-rr"><b>'+r.name+'</b><span class="h">· '+r.hint+'</span><span class="n">'+r.n+' problem'+(r.n>1?'s':'')+' · page '+r.page+(KMF&&p.t?' · '+p.t+' tried':'')+'</span>'
        +(KMF?'<button type="button" data-qtp="'+s.s+':'+r.key+'">Practice →</button>':'')+'</div>';
    }).join("")+'</div>';
    host.innerHTML=h;
  }
  function find(k){var a=k.split(":"),s=S.filter(function(x){return x.s===a[0];})[0]; if(!s)return null; return s.common.concat(s.rare).filter(function(c){return c.key===a[1];})[0];}
  document.addEventListener("click",function(e){
    var t=e.target.closest?e.target.closest("[data-qts],[data-qta],[data-qtc],[data-qtp]"):null; if(!t)return;
    if(t.hasAttribute("data-qts")){cur=t.getAttribute("data-qts"); wr("kmf.qt.tab",cur); tabsHtml(); render(); return;}
    if(t.hasAttribute("data-qta")){var o=t.getAttribute("data-qta")==="open"; [].forEach.call(host.querySelectorAll("details"),function(d){d.open=o;}); return;}
    if(t.hasAttribute("data-qtc")){var n=+t.getAttribute("data-qtc"); if(window.kmfCB8Go)window.kmfCB8Go(n); else location.hash="ccb8"; return;}
    var c=find(t.getAttribute("data-qtp")); if(!c)return;
    if(!(window.kmfBookSet&&window.kmfBookSet(c.name,c.ids))){location.hash=c.ids[0];}
  });
  /* Study by Subject (and anything else) opens one subject here */
  window.kmfQTGo=function(s){
    if(S.some(function(x){return x.s===s;})){cur=s; wr("kmf.qt.tab",cur); tabsHtml(); render();}
    var sec=document.getElementById("cqt"); if(sec){try{sec.scrollIntoView({behavior:"smooth",block:"start"});}catch(e){sec.scrollIntoView();} sec.classList.remove("qt-hl"); void sec.offsetWidth; sec.classList.add("qt-hl");}
  };
  window.kmfQTCounts=function(s){var x=S.filter(function(y){return y.s===s;})[0]; if(!x)return null; var L=last(),done=0; x.common.forEach(function(c){if(prog(c.ids,L).t)done++;}); return {common:x.common.length,rare:x.rare.length,done:done};};
  tabsHtml(); render();
  if(KMF){window.addEventListener("focus",render); document.addEventListener("visibilitychange",function(){if(!document.hidden)render();});}
})();
</script>
</main></body></html>
